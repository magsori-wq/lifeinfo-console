<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>결재함</title>
<style>
/* 🔴 폰 전용. Galaxy S23 Ultra 기준(CSS 폭 412px).
   PC 화면(approval.html)은 그대로 두고 여기만 크게 만든다 —
   기존 화면을 고치면 PC 가 깨진다. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d1424;--card:#151d33;--line:#243150;--tx:#e8eefc;--dim:#94a3c4;
      --go:#2f81f7;--warn:#f0b429;--ok:#2ea043}
html,body{margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,"Malgun Gothic",sans-serif;
  font-size:17px;line-height:1.6;                       /* 🔴 14px→17px */
  padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:9;background:#0d1424ee;backdrop-filter:blur(8px);
  padding:14px 16px 10px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:21px;display:flex;align-items:center;gap:8px}
.gen{color:var(--dim);font-size:13px;margin-top:2px}
main{padding:12px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.no{flex:0 0 34px;height:34px;border-radius:10px;background:var(--go);color:#fff;
  font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
/* 🔴 .kind 는 이제 사람 행동 문장(do)을 담는다 — 8단계 kind 문자열은 안 보인다
   (2026-09-09 사장님 "읽고 확인하기가 어렵다"). 기계 id 는 .cidline 으로 아래에 작게. */
.kind{font-size:17px;font-weight:800;color:var(--tx);word-break:break-word}
.wholine{font-size:14px;color:var(--dim);margin:2px 0 6px}
/* 🔴 "올린이" 배지 — 2026-09-09 사장님 지시 "결재올릴때 누가 결재올렸는지
   알아야 하는게 기본이잖아?". .wholine(처리 주체: "✋ 사장님이 직접" 등)과는
   다른 것이다 — 이건 **올린 사람**. 색 규칙은 reports.html 의 .who 배지와
   똑같이 맞춘다(루틴=핑크·사장님=초록·나머지=주황) — 보고 패널과 결재함을
   같은 색으로 읽으시게. */
.byline{font-size:13px;color:var(--dim);margin:0 0 4px;display:flex;align-items:center;gap:6px}
.bytag{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:10px}
.bytag.bt-rt{background:#c2569622;border:1px solid #c2569666;color:#e59ac0}
.bytag.bt-boss{background:#5fd3a022;border:1px solid #5fd3a066;color:#8ee5be}
.bytag.bt-work{background:#e08b1e22;border:1px solid #e08b1e66;color:#f0b26b}
.cidline{font-family:monospace;font-size:12px;color:#5d6c8f;margin:0 0 10px}
.what{font-size:15px;color:var(--dim);word-break:break-word;margin:0 0 12px}
.btns{display:flex;gap:8px}
button{flex:1;min-height:52px;                            /* 🔴 손가락 크기 */
  border:0;border-radius:12px;font-size:16px;font-weight:700;
  font-family:inherit;cursor:pointer}
.b-go{background:var(--go);color:#fff}
.b-no{background:#2a3550;color:var(--tx);flex:0 0 96px}
.done{opacity:.45}
.card.hard{border-color:#8b3a3a;background:#1d1520}
.card.wait{opacity:.62;border-style:dashed}
.waittag{display:inline-block;background:#2a3550;color:var(--dim);font-size:13px;
  font-weight:700;padding:3px 9px;border-radius:7px;margin-bottom:8px}
.handtag{display:inline-block;background:#2d4a3a;color:#b8e6c8;font-size:13px;
  font-weight:700;padding:3px 9px;border-radius:7px;margin-bottom:8px}
.b-copy{background:#2d6a4a;color:#fff}
.hardtag{display:inline-block;background:#8b3a3a;color:#ffe;font-size:13px;
  font-weight:700;padding:3px 9px;border-radius:7px;margin-bottom:8px}
.card.sel{border-color:var(--go);box-shadow:0 0 0 2px #2f81f755}
.b-sel{background:#2a3550;color:var(--tx)}
.b-sel.on{background:var(--ok);color:#fff}
#bar{position:fixed;left:0;right:0;bottom:0;background:#141c30;
  border-top:1px solid var(--line);padding:12px 12px calc(12px + env(safe-area-inset-bottom));
  display:none;gap:8px;z-index:50}
#bar.on{display:flex}
#bar button{min-height:54px;font-size:17px}
.why{background:#151d33;border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin:0 0 14px;font-size:14.5px;color:var(--dim);line-height:1.65}
.why b{color:var(--tx)}
.hint{color:var(--dim);font-size:14px;padding:10px 4px 0;line-height:1.7}
.empty{text-align:center;color:var(--dim);padding:50px 0;font-size:17px}
/* 🔴 원고 보기 — PC CP 처럼 **열고·복사하고·닫기** (2026-09-08 사장님)
   *"pc의 cp처럼 네이버원고,첨부이미지을 열고 복붙하고, 닫기할수 있도록 하면
     내가 pc와 폰 구분없이 헷갈리지 않을거 같은데!"*
   대화창에서 긴 글을 손으로 긁는 것이 폰에서 가장 힘든 일이다. */
#sheet{position:fixed;inset:0;background:#0d1424;z-index:200;display:none;
  flex-direction:column}
#sheet.on{display:flex}
#sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;
  border-bottom:1px solid var(--line);flex:0 0 auto}
#sheet .sh b{font-size:17px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .sx{flex:0 0 auto;background:#2a3550;color:var(--tx);border:0;border-radius:10px;
  min-height:44px;padding:0 16px;font-size:16px;font-weight:700;font-family:inherit}
#sheet .sb{flex:1 1 auto;overflow:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
#sheet .fld{margin-bottom:16px}
#sheet .fh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#sheet .fh span{font-size:14px;color:var(--dim);font-weight:700}
#sheet .fh button{flex:0 0 auto;min-height:42px;padding:0 14px;font-size:15px;
  background:var(--go);color:#fff;border:0;border-radius:10px;font-family:inherit;font-weight:700}
#sheet pre{margin:0;background:#0a0f1c;border:1px solid var(--line);border-radius:10px;
  padding:12px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
  max-height:44vh;overflow:auto;font-family:inherit;color:var(--tx)}
#sheet img{width:100%;border-radius:10px;border:1px solid var(--line)}
#toast{position:fixed;left:12px;right:12px;bottom:22px;background:#1c2540;
  border:1px solid var(--go);border-radius:12px;padding:14px 16px;font-size:16px;
  opacity:0;transition:.2s;pointer-events:none;z-index:99}
#toast.on{opacity:1}
.sec{margin:22px 4px 10px;font-size:15px;color:var(--dim);font-weight:700}
a.plain{color:var(--go);text-decoration:none}
</style></head><body>

<header>
  <h1>🙋 결재함 <span id="cnt" style="color:var(--dim);font-size:16px"></span></h1>
  <div class="gen" id="gen">불러오는 중…</div>
</header>

<main>
  <div id="list"></div>
  <div class="hint" id="hint"></div>
</main>

<div id="sheet"></div>
<div id="bar"></div>
<div id="toast"></div>

<script>
// 🔴 번호는 여기서 매기지 않는다. approvalcount.bake_json() 이 구운 것을 그대로 쓴다.
//    화면이 자기 순서로 매기면 도구와 갈린다 — 이 저장소가 결재 건수로 여섯 번 겪은 병.
var DATA=null;

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='on';
  clearTimeout(window._tt);window._tt=setTimeout(function(){t.className='';},2600);}

// 클립보드 — https 가 아니면 navigator.clipboard 가 없다. 폴백을 둔다.
function copy(txt,msg){
  function ok(){toast(msg);}
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(txt).then(ok,fallback);
  }else{fallback();}
  function fallback(){
    var ta=document.createElement('textarea');ta.value=txt;
    ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);
    ta.select();try{document.execCommand('copy');ok();}catch(e){toast('복사 실패 — 길게 눌러 복사해 주세요');}
    document.body.removeChild(ta);
  }
}

// 🔴 **번호만 보내면 안 된다** (2026-09-08 사장님 지적)
//    *"1번 승인이라고 하면 계속 1번이 되니 코드와 제목을 붙어 넣어야 해!?"*
//    맞다 — 목록이 바뀌면 1번이 다른 것이 된다. 실제로 아까 1번은 E1-04 였고
//    지금은 D4-07 이다. 그 사이에 승인하면 **엉뚱한 것이 나간다.**
//    그래서 복사 문구에 **id 와 제목 앞부분**을 함께 넣는다.
function label(it){
  // 🔴 it.sub 가 있으면 그걸 쓴다 — it.what 은 '🔴3시간째' 같은 대기 표시가 앞에
  //    붙어 있을 수 있어(2026-09-09), 붙여넣을 승인 문구에는 안 어울린다.
  var src = it.sub != null ? it.sub : it.what;
  var t = String(src || '').split(/\s+/).join(' ')
            .replace(/^[^0-9A-Za-z가-힣]+/, '').slice(0, 26);
  return (it.id || ('#' + it.no)) + ' (' + t + ')';
}

// 🔴 "올린이" 배지 색 — reports.html 의 group_of()/badge_of() 와 같은 규칙
//    (루틴=핑크·사장님=초록·나머지=주황). approval.html 의 repWc() 도 동일하다 —
//    세 파일에 같은 규칙을 각각 두는 것은 CSS 를 못 나눠 쓰는 HTML 의 한계다
//    (studio/reports.py badge_of() 주석 참고).
function byWc(w){w=String(w||'');
  if(w.indexOf('루틴')>=0) return 'bt-rt';
  if(w.indexOf('사장님')>=0) return 'bt-boss';
  return 'bt-work';}

var PICK={};   // 선택한 번호 — 🔴 하나씩 복사하면 클립보드가 덮어써진다
               //    (2026-09-08 사장님이 7건을 누르셨는데 마지막 하나만 남았다)

function card(it){
  var hard = it.risk==='hard';
  var act  = it.act !== false;          // 🔴 이미 승인돼 진행 중이면 누를 것이 없다
  var hand = it.hand === true;          // 🔴 사장님이 **직접** 하실 일 — 승인이 아니다
  var d=document.createElement('div');
  d.className='card'+(hard&&act?' hard':'')+(act?'':' wait');
  // 🔴 do·who·waited — approvalcount.humanize() 가 정한 문장 그대로 그린다
  //    (2026-09-09 "직관적으로 확인" 지시). kind·id 는 아래로 내리고 지우지는 않는다.
  var doText = it.do || it.kind || '';
  var subText = it.sub != null ? it.sub : (it.what || '');
  d.innerHTML=
    (act?(hand?'<div class="handtag">✋ 사장님이 직접 하실 일 — 승인이 아닙니다</div>'
              :(hard?'<div class="hardtag">🔴 되돌릴 수 없음 — 라이브가 나갑니다'
                    +(it.waited?' · '+esc(it.waited)+' 대기':'')+'</div>':''))
        :'<div class="waittag">✅ 승인하셨습니다 — 이과장이 진행 중</div>')
    +'<div class="top"><div class="no">'+it.no+'</div>'
    +'<div class="kind">'+esc(doText)+'</div></div>'
    // 🔴 올린이 — 누가 이 결재를 올렸는지(2026-09-09). 없으면(옛 항목·자동집계)
    //    줄 자체를 안 그린다 — 빈 라벨은 소음이다.
    +(it.by?'<div class="byline">올린이 <span class="bytag '+byWc(it.by)+'">'
           +esc(it.by)+'</span></div>':'')
    +(it.who?'<div class="wholine">'+esc(it.who)+'</div>':'')
    +'<div class="cidline">'+esc(it.id||'')+'</div>'
    +'<p class="what">'+esc(subText)+'</p>'
    +(act?('<div class="btns">'
    +(hand?'<button class="b-copy">📋 할 일 복사</button>'
          :'<button class="b-sel">'+(hard?'✅ 승인 요청':'✅ 승인')+'</button>')
    +'<button class="b-no">'+(hand?'끝냄':'반려')+'</button>'
    +'</div>'):'');
  if(!act) return d;                    // 버튼이 없으니 여기서 끝
  if(hand){
    // 승인이 아니라 **할 일**이다 — 내용을 복사해 폰에서 바로 쓰시게 한다
    d.querySelector('.b-copy').onclick=function(){
      copy(it.full||it.what||'', '📋 복사됨 — 네이버·앱에 붙여넣으세요');
    };
    // 🔴 네이버 **게시** 건은 칸이 셋이다 — 한 덩어리로 주면 폰에서 손으로
    //    잘라내셔야 한다(2026-09-08 사장님: "화면이 작아 복붙하기 힘들어!").
    var pt = it.parts||{};
    if(pt.body){
      var row=document.createElement('div');
      row.className='btns'; row.style.marginTop='8px';
      // 🔴 2026-09-08 사장님 방침: *"네이버 글발행은 폰으로 가능하지만 번거러워!
      //    폰발행 가능하도록만 이해하고 네이버글은 pc에서 발행할께"*
      //    → 숨기지 않는다(무엇이 남았는지는 보셔야 한다). **표시만** 바꾼다.
      row.innerHTML='<button class="b-copy">📄 원고 열기 <small>(PC 권장)</small></button>';
      row.querySelector('button').onclick=function(){openSheet(it);};
      d.appendChild(row);
    }
    d.querySelector('.b-no').onclick=function(){
      copy('끝냈어: '+label(it), '📋 복사됨 — 이부장 창에 붙여넣으면 지웁니다');
    };
    return d;
  }
  var sel=d.querySelector('.b-sel');
  sel.onclick=function(){
    if(PICK[it.no]){ delete PICK[it.no]; sel.className='b-sel'; d.classList.remove('sel'); }
    else { PICK[it.no]={no:it.no,hard:hard,label:label(it)}; sel.className='b-sel on'; d.classList.add('sel'); }
    bar();
  };
  d.querySelector('.b-no').onclick=function(){
    copy('반려: '+label(it)+' — ', '📋 복사됨 — 사유를 이어 쓰고 보내세요');
  };
  return d;
}

function bar(){
  var ns=Object.keys(PICK).map(Number).sort(function(a,b){return a-b;});
  var b=document.getElementById('bar');
  if(!ns.length){b.className='';return;}
  var hard=ns.filter(function(n){return PICK[n].hard;});
  b.className='on';
  b.innerHTML='<button class="b-go" id="send">📤 '+ns.length+'건 이부장에게'
    +(hard.length?' <small>('+hard.length+'건 확인받음)</small>':'')+'</button>'
    +'<button class="b-no" id="clr" style="flex:0 0 88px">해제</button>';
  document.getElementById('clr').onclick=function(){PICK={};render();};
  document.getElementById('send').onclick=function(){
    var txt='승인: '+ns.map(function(n){return PICK[n].label;}).join(' / ');
    copy(txt, '📋 복사됨 — 이부장 창에 붙여넣으세요'
      +(hard.length?' (되돌릴 수 없는 건은 이부장이 다시 여쭙습니다)':''));
  };
}

// 📄 원고 시트 — 열고 · 복사하고 · 닫기 (PC CP 와 같은 조작)
//    🔴 폰에서 가장 힘든 일이 **긴 글을 손으로 긁는 것**이다.
//    칸마다 복사 버튼을 두어 손으로 선택할 일이 없게 한다.
function openSheet(it){
  var pt = it.parts||{}, sh=document.getElementById('sheet');
  var h = '<div class="sh"><b>'+esc(it.id||'')+'</b>'
        + '<button class="sx" id="shx">닫기</button></div><div class="sb">';
  if(pt.image){
    h += '<div class="fld"><div class="fh"><span>🖼️ 첨부 이미지</span>'
       + '<button id="fi">새 탭에서 열기</button></div>'
       + '<img src="'+esc(pt.image)+'" alt=""></div>';
  }
  if(pt.title){
    h += '<div class="fld"><div class="fh"><span>📝 제목칸</span>'
       + '<button id="ft">복사</button></div><pre>'+esc(pt.title)+'</pre></div>';
  }
  if(pt.body){
    h += '<div class="fld"><div class="fh"><span>📄 본문 ('+pt.body.length+'자)</span>'
       + '<button id="fb">복사</button></div><pre>'+esc(pt.body)+'</pre></div>';
  }
  // 🔴 제휴 링크는 **단독으로** 붙여넣어야 네이버 카드가 뜬다 (2026-09-08 G2-05 사고).
  //    본문과 같이 붙이면 자동감지가 꺼져 파란 텍스트로만 들어간다.
  if(pt.afflink){
    h += '<div class="fld"><div class="fh"><span>🔗 제휴 링크 — <b>단독으로</b> 붙여넣기</span>'
       + '<button id="fa">복사</button></div><pre>'+esc(pt.afflink)+'</pre>'
       + '<div style="font-size:13px;color:var(--dim);margin-top:6px">'
       + '본문의 <b>[여기에 제휴 링크를…]</b> 자리를 지우고, 그 빈 줄에 <b>이것만</b> 붙여넣으세요.<br>'
       + '상품명과 같이 붙이면 카드가 안 뜹니다.</div></div>';
  }
  h += '</div>';
  sh.innerHTML=h; sh.className='on';
  document.body.style.overflow='hidden';
  document.getElementById('shx').onclick=closeSheet;
  var e;
  if((e=document.getElementById('fi'))) e.onclick=function(){window.open(pt.image,'_blank');};
  if((e=document.getElementById('ft'))) e.onclick=function(){copy(pt.title,'📝 제목 복사됨 — 네이버 제목칸에 붙여넣으세요');};
  if((e=document.getElementById('fb'))) e.onclick=function(){copy(pt.body,'📄 본문 복사됨 — 네이버 본문칸에 붙여넣으세요');};
  if((e=document.getElementById('fa'))) e.onclick=function(){copy(pt.afflink,'🔗 링크만 복사됨 — 빈 줄에 이것만 붙여넣으세요');};
}
function closeSheet(){
  document.getElementById('sheet').className='';
  document.body.style.overflow='';
}

function esc(s){return String(s).replace(/[&<>]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

function render(){
  var L=document.getElementById('list');L.innerHTML='';
  PICK={};bar();
  var items=(DATA&&DATA.items)||[];
  var todo=items.filter(function(x){return x.act!==false;}).length;
  document.getElementById('cnt').textContent=todo?todo+'건':'';
  document.getElementById('gen').textContent=DATA?('기준 '+DATA.generated):'';
  if(!items.length){L.innerHTML='<div class="empty">✅ 결재할 것이 없습니다</div>';return;}
  if(!todo){L.innerHTML='<div class="empty">✅ 누를 것이 없습니다<br><span style="font-size:14px">아래는 진행 중입니다</span></div>';}
  items.forEach(function(it){L.appendChild(card(it));});
  document.getElementById('hint').innerHTML=
    '<b>왜 복사인가</b> — 이 화면은 파일만 올려둔 곳이라 서버가 없습니다. '
    +'버튼이 보낼 데가 없어서, 대신 <b>문구를 복사</b>해 이부장 창에 붙여넣으시면 '
    +'제가 처리합니다.<br><br>'
    +'🔴 <b>되돌릴 수 없는 건</b>(라이브 발행)은 제가 <b>무엇이 나가는지 다시 보여드리고</b> '
    +'확인받은 뒤에 진행합니다. 탭 한 번으로 나가지 않습니다.<br><br>'
    +'<a class="plain" href="progress.html">📊 진행현황</a> &nbsp;·&nbsp; '
    +'<a class="plain" href="approval.html">🖥️ PC 결재함</a>';
}

function load(){
  fetch('approval_m.json?t='+Date.now()).then(function(r){return r.json();})
   .then(function(d){DATA=d;render();})
   .catch(function(){document.getElementById('gen').textContent='🔴 데이터를 못 읽었습니다';});
}
load();
setInterval(load, 60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)load();});

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
