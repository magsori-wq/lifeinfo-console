<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>세션별 지휘판</title>
<style>
:root{--bg:#f4f6f9;--fg:#1c2330;--mut:#667085;--card:#fff;--bar:#dde3ec;
 --c-order:#2563eb;--c-rep:#16a34a;--c-when:#ca8a04;--c-block:#dc2626}
@media (prefers-color-scheme: dark){:root{--bg:#0f131a;--fg:#e6ebf2;--mut:#98a2b3;--card:#171c26;--bar:#2a3242;
 --c-order:#60a5fa;--c-rep:#4ade80;--c-when:#facc15;--c-block:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Malgun Gothic",sans-serif;font-size:14px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bar);padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font-size:16px}
.boss{font-weight:800;border-radius:999px;padding:3px 12px;color:#fff;background:#16a34a}
.boss.hot{background:#dc2626;animation:bl 1s ease-in-out infinite}.boss.unk{background:#6b7280}
.clk{flex:1 1 100%;color:var(--mut);font-size:12.5px}
.upd{margin-left:auto;color:var(--mut);font-size:12px}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.5}}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;padding:10px}
.lane{background:var(--card);border:1px solid var(--bar);border-left:10px solid var(--lc,#9ca3af);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.lane.block{border-color:var(--c-block);box-shadow:0 0 0 1px var(--c-block) inset}
.lh{display:flex;gap:8px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;background:#9ca3af;flex:0 0 14px}
.dot.work{background:#16a34a;animation:bl 1.1s ease-in-out infinite}.dot.block{background:#dc2626}
.nm{font-size:16px;font-weight:800;min-width:0;overflow-wrap:anywhere}.rl{color:var(--mut);font-size:12.5px}
.st{margin-left:auto;font-size:12px;color:var(--mut)}
.row{display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.tag{flex:0 0 3.4em;text-align:center;font-weight:800;font-size:12px;border-radius:6px;padding:2px 0;color:#fff}
.tag.o{background:var(--c-order)}.tag.r{background:var(--c-rep)}.tag.w{background:var(--c-when)}.tag.b{background:var(--c-block)}
.tx{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;word-break:keep-all}
.tx small{color:var(--mut);margin-left:4px;white-space:nowrap}
.none{color:var(--mut)}
.err{padding:14px;color:var(--c-block);font-weight:700}
@media (max-width:480px){main{grid-template-columns:1fr}}
</style></head><body>
<header><b>🧭 세션별 지휘판</b><span id="boss" class="boss unk">사장님 몫 …</span><span class="upd" id="upd"></span><span class="clk" id="clk"></span></header>
<main id="lanes"></main>
<script>
(function(){
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function row(cls,tag,text,at){
  return '<div class="row"><span class="tag '+cls+'">'+tag+'</span><span class="tx">'+(text?esc(text)+(at?'<small>'+esc(at)+'</small>':''):'<span class="none">—</span>')+'</span></div>';
}
var DOT={work:'일하는 중',idle:'대기',block:'막힘'};
function render(d){
  var b=document.getElementById('boss');
  if(d.boss_n==null){b.textContent='사장님 몫 모름';b.className='boss unk';}
  else{b.textContent='사장님 몫 '+d.boss_n+'건';b.className='boss'+(d.boss_n>0?' hot':'');}
  document.getElementById('upd').textContent='갱신 '+String(d.generated||'').slice(5,16);
  document.getElementById('clk').textContent=d.clock?('⏰ '+d.clock):'';
  document.getElementById('lanes').innerHTML=(d.lanes||[]).map(function(l){
    var o=l.order||{},r=l.report||{};
    var more=(o.open>1)?' (열린 지시서 '+o.open+'건)':'';
    return '<section class="lane'+(l.dot==='block'?' block':'')+'" data-lane="'+esc(l.name)+'" style="--lc:'+esc(l.color||'#9ca3af')+'">'+
      '<div class="lh"><span class="dot '+esc(l.dot)+'"></span><span class="nm">'+esc(l.label||l.name)+'</span><span class="st">'+(DOT[l.dot]||'')+'</span></div>'+
      row('o','지시',(o.text||'')+more,o.at)+row('r','보고',r.text,r.at)+row('w','시각',l.when,'')+(l.block?row('b','막힘',l.block,''):'')+
      '</section>';
  }).join('');
}
function load(){
  fetch('lanes.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(render).catch(function(e){
    document.getElementById('lanes').innerHTML='<div class="err">lanes.json 을 못 읽었다 ('+esc(e.message)+') — 지휘판을 믿지 말고 batch 보드를 직접 본다</div>';
  });
}
load();setInterval(load,30000);
})();
</script></body></html>
