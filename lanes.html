<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>세션별 지휘판</title>
<style>
:root{--fs-line:20px;--fs-name:16px;--fs-tag:15px;--fs-title:16px;--fs-body:13px;--fs-small:13px;--bg:#f4f6f9;--fg:#1c2330;--mut:#667085;--card:#fff;--bar:#dde3ec;
 --k-order:#2563eb;--k-rep:#16a34a;--k-block:#dc2626;--k-when:#ca8a04;--urg:#dc2626}
@media (prefers-color-scheme: dark){:root{--bg:#0f131a;--fg:#e6ebf2;--mut:#98a2b3;--card:#171c26;--bar:#2a3242;
 --k-order:#60a5fa;--k-rep:#4ade80;--k-block:#f87171;--k-when:#facc15;--urg:#f87171}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:-apple-system,"Malgun Gothic",sans-serif;font-size:var(--fs-body)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bar);padding:4px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header b{font-size:var(--fs-title)}
.boss{font-weight:800;border-radius:999px;padding:1px 10px;color:#fff;background:#16a34a;font-size:var(--fs-small)}
.boss.hot{background:#dc2626;animation:bl 1s ease-in-out infinite}.boss.unk{background:#6b7280}
.upd{margin-left:auto;color:var(--mut);font-size:var(--fs-small)}
.clk{flex:1 1 100%;color:var(--mut);font-size:var(--fs-small);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes urg{0%,100%{border-color:var(--urg);background-color:var(--card);box-shadow:0 0 0 1px var(--urg) inset}
 50%{border-color:var(--urg);background-color:rgba(220,38,38,.22);box-shadow:0 0 0 3px var(--urg) inset}}
main{flex:1 1 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));grid-auto-rows:minmax(calc(var(--fs-line)*4 + 32px),1fr);gap:4px;padding:4px}
.lane{background:var(--card);border:1px solid var(--bar);border-left:8px solid var(--lc,#9ca3af);border-radius:8px;padding:3px 6px 3px 8px;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:0;overflow:hidden}
.lane.urgent{--lc:#dc2626;border-color:var(--urg);animation:urg 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.lane.urgent{animation:none;border:3px solid var(--urg);border-left-width:8px;background:rgba(220,38,38,.12)}.boss.hot,.dot.work{animation:none}}
.lh{display:flex;gap:6px;align-items:center;min-width:0;flex:0 0 22px}
.dot{width:10px;height:10px;border-radius:50%;background:#9ca3af;flex:0 0 10px}
.dot.work{background:#16a34a;animation:bl 1.1s ease-in-out infinite}.dot.block{background:#dc2626}
.nm{font-size:var(--fs-name);font-weight:800;min-width:0;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at{flex:0 0 auto;font-size:var(--fs-small);font-weight:800;color:#fff;background:var(--k-when);border-radius:5px;padding:0 5px}
.lst{flex:1 1 0px;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;border-top:1px solid var(--bar);padding-top:2px}
.it{display:flex;gap:5px;align-items:center;line-height:var(--fs-line);height:var(--fs-line);min-width:0;font-size:var(--fs-body)}
.k{flex:0 0 2.7em;text-align:center;font-weight:800;font-size:var(--fs-tag);border-radius:3px;color:#fff;line-height:calc(var(--fs-line) - 3px)}
.k.o{background:var(--k-order)}.k.r{background:var(--k-rep)}.k.b{background:var(--k-block)}.k.w{background:var(--k-when)}
.t{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{flex:0 0 auto;color:var(--mut);font-size:var(--fs-small)}
.it.done .t{text-decoration:line-through;opacity:.55}
.it.done .k,.it.done small{opacity:.55}
.it.urgent .t{font-weight:800;color:var(--urg)}
.none{color:var(--mut);padding:2px 0}
.err{padding:14px;color:var(--urg);font-weight:700}
@media (max-width:480px){main{grid-template-columns:1fr}}
</style></head><body>
<header><b>🧭 세션별 지휘판</b><span id="boss" class="boss unk">사장님 몫 …</span><span class="upd" id="upd"></span><span class="clk" id="clk"></span></header>
<main id="lanes"></main>
<script>
(function(){
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var KC={'지시':'o','보고':'r','막힘':'b','약속':'w'};
function item(i){
  return '<div class="it'+(i.done?' done':'')+(i.urgent?' urgent':'')+'" title="'+esc(i.text)+'"><span class="k '+(KC[i.kind]||'r')+'">'+esc(i.kind)+'</span><span class="t">'+esc(i.text)+'</span><small>'+esc(String(i.at||'').slice(5,16))+'</small></div>';
}
var scrollTop={};
function render(d){
  var b=document.getElementById('boss');
  if(d.boss_n==null){b.textContent='사장님 몫 모름';b.className='boss unk';}
  else{b.textContent='사장님 몫 '+d.boss_n+'건';b.className='boss'+(d.boss_n>0?' hot':'');}
  document.getElementById('upd').textContent='갱신 '+String(d.generated||'').slice(5,16);
  document.getElementById('clk').textContent=d.clock?('⏰ '+d.clock):'';
  document.querySelectorAll('.lane').forEach(function(s){var l=s.querySelector('.lst');if(l)scrollTop[s.getAttribute('data-lane')]=l.scrollTop;});
  var ls=(d.lanes||[]).slice();
  ls.sort(function(a,b){return (b.urgent?1:0)-(a.urgent?1:0);});          // 긴급 칸이 맨 위(안정 정렬)
  document.getElementById('lanes').innerHTML=ls.map(function(l){
    var at=l.when_at?'<span class="at" title="'+esc(l.when)+'">'+esc(l.when_at)+'</span>':'';
    var its=(l.items||[]);
    return '<section class="lane'+(l.urgent?' urgent':'')+'" data-lane="'+esc(l.name)+'" style="--lc:'+esc(l.color||'#9ca3af')+'">'+
      '<div class="lh"><span class="dot '+esc(l.dot)+'"></span><span class="nm">'+esc(l.label||l.name)+'</span>'+at+'</div>'+
      '<div class="lst">'+(its.length?its.map(item).join(''):'<div class="none">항목 없음</div>')+'</div></section>';
  }).join('');
  document.querySelectorAll('.lane').forEach(function(s){var l=s.querySelector('.lst');var v=scrollTop[s.getAttribute('data-lane')];if(l&&v)l.scrollTop=v;});
}
function load(){
  fetch('lanes.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(render).catch(function(e){
    document.getElementById('lanes').innerHTML='<div class="err">lanes.json 을 못 읽었다 ('+esc(e.message)+') — 지휘판을 믿지 말고 batch 보드를 직접 본다</div>';
  });
}
load();setInterval(load,30000);
})();
</script></body></html>
