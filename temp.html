<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>임시탭 · --help</title><style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--tx:#e6e9ef;--dim:#8b93a7;
      --ok:#3ddc84;--todo:#ffb454;--doing:#5aa9ff;--boss:#ff7b7b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
     font:15px/1.65 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px}
.bar{height:10px;background:#232833;border-radius:6px;overflow:hidden;margin:14px 0 6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#3ddc84,#5aa9ff)}
.pct{color:var(--dim);font-size:13px;margin-bottom:20px}
.grp{margin:26px 0 10px;font-size:13px;color:var(--dim);letter-spacing:.04em}
.it{display:flex;gap:12px;padding:13px 15px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;margin-bottom:9px}
.it.done{opacity:.55}
.ck{flex:0 0 22px;font-size:17px;line-height:1.3}
.bd{flex:1;min-width:0}
.tt{font-weight:600}
.it.done .tt{text-decoration:line-through;text-decoration-color:var(--dim)}
.nt{color:var(--dim);font-size:13px;margin-top:5px;white-space:pre-wrap;word-break:break-word}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;
     border:1px solid var(--line);color:var(--dim);margin-right:7px;vertical-align:2px}
.tag.boss{color:var(--boss);border-color:#4a2b2b}
.foot{margin-top:34px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
</style>
