<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이대리 상황실</title>
</head>
<body>
<!-- 이대리 상황실 = 본사 상황실(engine.html)과 같은 렌더러. 방 이름만 알려 주고 engine.html 을 그대로 불러 쓴다(복제 없음 — engine.html 이 바뀌면 둘이 함께 바뀐다). -->
<script>
window.ENGINE_ROOM="aroma";
fetch("engine.html",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).then(function(t){
  t=t.replace("<head>","<head><script>window.ENGINE_ROOM='aroma'<\/script>");
  document.open();document.write(t);document.close();
}).catch(function(e){document.body.textContent="engine.html 을 못 불러왔다: "+e.message});
</script>
</body>
</html>
