# Fly.io 배포: fly launch --no-deploy --copy-config && fly volumes create taxibiz_data --size 1
#              fly secrets set TAXIBIZ_PASSWORD=비밀번호 && fly deploy
app = "taxibiz-CHANGE-ME"   # 전역에서 유일한 이름으로 바꾸세요
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "taxibiz_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
