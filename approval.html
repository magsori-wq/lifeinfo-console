<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>전자결재</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:12px 14px;background:#0e1526;color:#e6ecf7;overflow:hidden;
     font-family:"Malgun Gothic",-apple-system,sans-serif;font-size:14px;line-height:1.55;
     display:flex;flex-direction:column;gap:9px}
/* 🔴 분할 레이아웃 (2026-08-21 사장님 지시: "스크롤을 많이 하면 시간낭비다.
   한 화면에서 보고, 분할된 화면 안에서 스크롤할 수 있게") — 본문은 스크롤하지 않고
   각 패널만 독립 스크롤한다. */
.grid{flex:1;min-height:0;overflow:hidden;display:grid;gap:10px;
      grid-template-columns:1.1fr 1fr;grid-template-rows:1fr 1fr}
.pane{background:#131c31;border:1px solid #223052;border-radius:12px;height:100%;
      display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:9px 13px;flex:0 0 auto;
    border-bottom:1px solid #223052;background:#16203a;font-weight:700;font-size:14px}
.ph .cnt{margin-left:auto;font-size:12px;font-weight:400;color:#8fa0bd;
         background:#0e1526;border:1px solid #2a3a5e;border-radius:20px;padding:1px 10px}
.pb{flex:1;min-height:0;overflow-y:auto;padding:10px 12px}
.pb::-webkit-scrollbar{width:9px}
.pb::-webkit-scrollbar-thumb{background:#2a3a5e;border-radius:6px}
.pb::-webkit-scrollbar-thumb:hover{background:#3b4f7a}
@media(max-width:900px){body{overflow:auto}
  .grid{grid-template-columns:1fr;grid-template-rows:none}
  .pane{max-height:440px}}
h1{font-size:17px;margin:0;flex:0 0 auto}
.sub{display:none}
.hdrow{display:flex;align-items:baseline;gap:12px;flex:0 0 auto}
.hdrow .tip{color:#7d8ca8;font-size:11.5px}
code{background:#1b2540;border:1px solid #2a3a5e;border-radius:5px;padding:1px 6px;
     font-family:Consolas,monospace;font-size:12px;color:#9fc9ee;cursor:pointer}
code:hover{border-color:#4D9DE0;color:#cfe6fa}
.sub2{color:#7d8ca8;font-size:12px;margin:0 0 8px;padding-bottom:6px;border-bottom:1px dashed #223052}
.sec .n{font-size:12px;color:#7d8ca8;font-weight:400;margin-left:8px}
.card{background:#16203a;border:1px solid #2a3a5e;border-radius:10px;padding:10px 12px;margin:0 0 8px}
.card.wait{border-color:#e08b1e66;background:#e08b1e0d}
.card.boss{border-color:#5fd3a066;background:#5fd3a00d}
.card.rej{border-color:#c0392b66;background:#c0392b0d}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.who{font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap}
.w-boss{background:#5fd3a022;border:1px solid #5fd3a066;color:#8ee5be}
.w-lee{background:#4D9DE022;border:1px solid #4D9DE066;color:#9fc9ee}
.w-work{background:#e08b1e22;border:1px solid #e08b1e66;color:#f0b26b}
.w-rt{background:#c2569622;border:1px solid #c2569666;color:#e59ac0}
.code{font-family:Consolas,monospace;font-size:12px;color:#7d8ca8}
.ttl{font-weight:700;flex:1;min-width:170px}
.meta{color:#8fa0bd;font-size:12.5px;margin-top:3px}
.steps{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0 4px}
.st{font-size:11px;padding:2px 7px;border-radius:5px;background:#232c44;color:#6b7a96;white-space:nowrap}
.st.done{background:#2f8f6833;color:#8ee5be}
.st.now{background:#e08b1e33;color:#f0b26b;font-weight:700;box-shadow:0 0 0 1px #e08b1e66}
.st.no{background:#c0392b33;color:#f0928a;font-weight:700}
.none{color:#7d8ca8;font-size:13px;padding:8px 0}
.why{color:#f0928a;font-size:12.5px;margin-top:5px;white-space:pre-wrap;word-break:break-word}
.note{color:#a9b6cc;font-size:12.5px;margin-top:5px;white-space:pre-wrap;word-break:break-word}
.foot{color:#5f6f8c;font-size:12px;border-top:1px solid #223052;padding-top:10px;margin-top:24px}
.flow{background:#131c31;border:1px solid #223052;border-radius:9px;padding:6px 11px;
      font-size:11.5px;color:#a9b6cc;line-height:1.5;flex:0 0 auto}
.flow b{color:#f0b26b}
.act{display:inline-block;border:0;border-radius:8px;padding:6px 14px;font-size:13px;
     font-weight:700;cursor:pointer;margin-right:6px;font-family:inherit}
.act.ok{background:#2f8f68;color:#fff}
.act.ok:hover{background:#37a87b}
.act.no{background:#4d5a70;color:#dbe3ef}
.act.no:hover{background:#5d6d88}
.act:disabled{opacity:.4;cursor:not-allowed}
.srv{font-size:12px;padding:5px 11px;border-radius:8px;flex:0 0 auto}
.srv.on{background:#2f8f6822;border:1px solid #2f8f6866;color:#8ee5be}
.srv.off{background:#c0392b22;border:1px solid #c0392b66;color:#f0928a}
.copied{position:fixed;right:16px;bottom:16px;background:#2f8f68;color:#fff;
        padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s}
.copied.on{opacity:1}
.pv{margin-top:8px}
.pv>summary{cursor:pointer;font-size:13px;color:#8fb4e8;padding:4px 0}
.pvs{background:#0e1526;border:1px solid #22304d;border-radius:8px;padding:10px 12px;
  margin:6px 0;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all}
.pvs b{display:block;color:#8fb4e8;margin-bottom:5px;font-size:12px}
.pv-btn{background:#2a3a5e;color:#cfe0f7}
#pvm{display:none;position:fixed;inset:0;background:rgba(3,7,15,.82);z-index:99;
  align-items:center;justify-content:center;padding:24px}
#pvw{background:#0e1526;border:1px solid #2a3a5e;border-radius:14px;width:min(860px,96vw);
  height:min(88vh,1000px);display:flex;flex-direction:column;overflow:hidden}
#pvt{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #22304d}
#pvh{flex:1;font-size:13px;color:#cfe0f7}
#pvb{flex:1;width:100%;border:0;background:#fff}
</style></head><body>
<div class="hdrow"><h1>📋 전자결재</h1>
 <span class="tip">승인 버튼은 <b>두 번</b> 눌러야 실행됩니다 · 명령을 클릭하면 복사</span></div>
<div class="flow">
① 제안 → ② <b>이부장 선별</b> → ③ <b>사장님 글감승인</b> → ④ 지시서 → ⑤ 초안·큐
→ ⑥ <b>이부장 V0검사</b> → ⑦ <b>사장님 발행승인</b> → ⑧ 발행·보고 → ④
</div>
<div id="out" class="grid"><div class="pane"><div class="pb"><p class="none">불러오는 중…</p></div></div></div>
<div id="pvm" onclick="if(event.target===this)pvclose()"><div id="pvw">
<div id="pvt"><span id="pvh"></span>
<button class="act no" onclick="pvclose()">닫기 (Esc)</button></div>
<iframe id="pvb" sandbox=""></iframe></div></div>
<div class="copied" id="cp">복사됨</div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];});}
function cmd(c){return '<code onclick="copy(this)">'+esc(c)+'</code>';}
function copy(el){navigator.clipboard.writeText(el.textContent);
  var c=document.getElementById('cp');c.classList.add('on');
  setTimeout(function(){c.classList.remove('on');},900);}
var API='http://127.0.0.1:8011', SRV=false;
// 📄 원고 미리보기 (2026-08-23 사장님 지시) — 발행은 되돌리기 어려운 결재인데
//    그전에는 제목·코드·V0 근거만 보고 눌러야 했다. 원고를 보고 누르신다.
//    본문은 srcdoc + sandbox 로 격리해 띄운다(초안의 <style> 이 결재함 화면을 망가뜨리지 않게).
async function preview(code){
  var m=document.getElementById('pvm'), b=document.getElementById('pvb'),
      h=document.getElementById('pvh');
  h.textContent=code+' 원고를 읽는 중…'; b.srcdoc=''; m.style.display='flex';
  try{
    var r=await fetch(API+'/api/draft?code='+encodeURIComponent(code)+'&t='+Date.now());
    var d=await r.json();
    if(!d.ok){
      // 실행 중인 서버가 /api/draft 를 모르면 'not found' 를 준다 = 옛 코드로 떠 있는 것.
      // 원인을 정확히 말해 준다(막연한 에러는 사장님이 손쓸 데가 없다).
      h.textContent = (d.error==='not found')
        ? '🔴 결재 서버가 옛 버전으로 떠 있습니다 — start_approve_server.bat 을 한 번 다시 실행해 주세요'
        : '🔴 '+(d.error||'초안을 읽지 못했습니다');
      return; }
    h.textContent=code+' · '+d.file+' · 본문 '+d.chars.toLocaleString()+'자';
    b.srcdoc='<meta charset="utf-8"><base target="_blank">'
      +'<div style="background:#fff;color:#222;padding:16px 12px">'+d.html+'</div>';
  }catch(e){ h.textContent='🔴 결재 서버에 닿지 않습니다 — start_approve_server.bat 을 다시 실행하세요'; }
}
function pvclose(){var m=document.getElementById('pvm');m.style.display='none';
  document.getElementById('pvb').srcdoc='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape')pvclose();});
function btn(action,code,label,cls){
  return '<button class="act '+cls+'" data-a="'+action+'" data-c="'+code+'" '
       + (SRV?'':'disabled ')+'onclick="approve(this)">'+label+'</button>';}
async function approve(el){
  // 🔴 confirm()/prompt() 를 쓰지 않는다 — iframe(콘솔 index.html) 안에서 조용히 무시돼
  //    버튼이 '눌리지 않는' 것처럼 보인다(2026-08-21 사장님 지적). 2단계 클릭으로 대체.
  var a=el.dataset.a, c=el.dataset.c;
  if(a==='topic_drop' && !el.dataset.armed){
    var box=document.createElement('div');
    box.style.cssText='margin-top:8px';
    box.innerHTML='<input class="whyin" placeholder="제외 사유를 적어주세요(필수)" '
      +'style="width:60%;min-width:220px;padding:6px 9px;border-radius:7px;border:1px solid #2a3a5e;'
      +'background:#0e1526;color:#e6ecf7;font-family:inherit;font-size:13px">'
      +'<button class="act no" style="margin-left:6px">제외 확정</button>';
    el.parentNode.appendChild(box); el.dataset.armed='1'; el.disabled=true;
    var inp=box.querySelector('.whyin'), ok=box.querySelector('button');
    inp.focus();
    ok.onclick=function(){ var w=inp.value.trim();
      if(!w){ inp.style.borderColor='#c0392b'; toast('🔴 사유 없이는 제외하지 않습니다'); return; }
      ok.disabled=true; ok.textContent='처리 중…'; send(a,c,w,ok); };
    return;
  }
  if(a!=='topic_drop' && !el.dataset.armed){
    el.dataset.armed='1'; el.dataset.old=el.textContent;
    el.textContent='정말? 한 번 더 누르세요';
    el.style.background='#c0392b';
    setTimeout(function(){ if(el.dataset.armed==='1'){ el.dataset.armed='';
      el.textContent=el.dataset.old; el.style.background=''; } }, 6000);
    return;
  }
  send(a,c,null,el);
}
// 🔴 실패했으면 버튼을 **처음 상태로** 되돌린다 (2026-08-23 사장님 지적).
//    전에는 var old=el.textContent 를 여기서 읽었는데, 그 시점 글씨는 이미
//    '정말? 한 번 더 누르세요' 다. 그래서 전송이 실패하면 그 문구로 복원됐고,
//    armed 도 '1' 로 남아 **몇 번을 눌러도 같은 문구에 굳었다.**
//    사장님이 본 것은 '두 번째 클릭이 안 먹는' 게 아니라 '실패가 안 보이는' 것이었다.
function disarm(el, label){
  el.disabled=false; el.dataset.armed=''; el.style.background='';
  el.textContent = label || el.dataset.old || el.textContent;
}
async function send(a,c,why,el){
  var back = el.dataset.old || el.textContent;      // 무장 전 원래 글씨
  el.disabled=true; el.textContent='처리 중…';
  try{
    var r=await fetch(API+'/api/approve',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:a,code:c,why:why})});
    var d=await r.json();
    if(d.ok){ toast('✅ '+c+' 결재 완료 — 목록을 새로 읽습니다');
      setTimeout(function(){location.reload();},1100); }
    else { toast('🔴 실패: '+String(d.error||'').slice(0,90)); disarm(el, back); }
  }catch(e){
    // 화면을 연 뒤 서버가 꺼졌을 수 있다 — 배너도 함께 '꺼짐'으로 되돌려
    // 버튼만 살아 있는 것처럼 보이지 않게 한다.
    toast('🔴 결재 서버가 꺼져 있습니다 — start_approve_server.bat 을 실행해 주세요');
    var b=document.querySelector('.srv');
    if(b){ b.className='srv off';
      b.innerHTML='🔴 결재 서버가 꺼졌습니다(포트 8011) — <b>start_approve_server.bat</b> 을 '
        +'실행하신 뒤 이 화면을 새로고침해 주세요.'; }
    disarm(el, back);
  }
}
function toast(m){var c=document.getElementById('cp');c.textContent=m;
  c.classList.add('on');setTimeout(function(){c.classList.remove('on');},2200);}
function j(f){return fetch(f+'?t='+Date.now()).then(function(r){return r.ok?r.json():null;})
  .catch(function(){return null;});}
function arr(x){return !x?[]:(Array.isArray(x)?x:(x.items||x.queue||Object.values(x)));}

async function findServer(){
  // 🔴 전자결재는 8011 하나만 본다 (2026-08-23 사장님 지시로 고정).
  //    여러 자리를 훑던 판을 버린 이유 — 포트가 떠돌면 '어디에 떴나'를 매번
  //    확인해야 하고, 옛 서버가 남은 자리를 폴백으로 두면 새 기능이 없는 쪽에
  //    조용히 붙는다. 자리를 못 박으면 그 두 가지가 통째로 사라진다.
  var url='http://127.0.0.1:8011';
  try{
    var r=await fetch(url+'/api/ping?t='+Date.now());
    if(!r.ok) return null;
    var d=await r.json();
    return (d&&d.ok) ? url : null;
  }catch(e){ return null; }
}
findServer().then(function(url){ SRV=!!url; if(url) API=url;
  return SRV; })
 .then(function(up){
  var d=document.createElement('div');
  d.className='srv '+(up?'on':'off');
  d.innerHTML = up
    ? '🟢 결재 서버 연결됨('+API.replace('http://127.0.0.1:','포트 ')+') — 아래 버튼으로 바로 결재하실 수 있습니다.'
    : '🔴 결재 서버가 꺼져 있어 버튼이 비활성입니다. 터미널에서 <b>python -m studio.approve_server</b> 를 한 번 실행하세요. (명령 복사는 그대로 됩니다)';
  var o=document.getElementById('out'); o.parentNode.insertBefore(d,o);
 return Promise.all([j('batch.json'),j('queue.json'),j('topicprop.json'),j('v0check.json'),
             j('lifeinfo_db.txt'),j('pace.json'),j('session_state.json'),
             j('watch.json'),j('pending.json')]).then(function(a){
  var B=a[0]||{},Q=arr(a[1]),T=arr(a[2]),V=arr(a[3]),DB=a[4]||{posts:[]},P=a[5]||{},SSJ=a[6]||{};
  var W=arr(a[7]), PEND=(a[8]||{}).actionable||[];
  var byc={}; (DB.posts||[]).forEach(function(p){byc[p.code]=p;});
  var v0={}; V.forEach(function(x){v0[x.code]=x;});
  var H='';
  var SS=Object.keys((SSJ.sessions)||{}).map(function(k){
    var v=SSJ.sessions[k]; return {id:k,s:v.state,last:(v.last_read||'').slice(5,16)};})
    .sort(function(x,y){return (x.s==='waiting'?0:1)-(y.s==='waiting'?0:1);});

  var boss=[], lee=[];
  T.forEach(function(t){
    if(t.state==='picked') boss.push({act:'topic_approve',c:t.code,t:t.title,
      why:'글감 승인 대기(③) · '+(t.why||''),
      sum:t.summary||'', facts:t.facts||'',
      cmd:'python -m studio.topicprop approve --code '+t.code});
    if(t.state==='proposed') lee.push({act:'topic_pick',c:t.code,t:t.title,
      why:'이부장 선별 대기(②) — 특별이슈급인가로 판단',
      cmd:'python -m studio.topicprop pick --code '+t.code});
  });
  // 🔴 모든 승인 사항을 이 칸 하나로 모은다 (2026-08-23 사장님 지시).
  //    전에는 글감(③)·발행(⑦) 두 종만 올라오고, 사장님 몫인 색인요청·게시·설정변경은
  //    watch.json 에만 있어서 결재함과 myturn 두 군데를 봐야 했다. 한 군데서 끝내신다.
  var TODAY=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
  W.forEach(function(w){
    if(w.owner!=='user' || w.state==='done') return;
    if((w.due||'9999')>TODAY) return;          // 기한 전은 올리지 않는다(다 보이면 아무것도 안 하게 된다)
    boss.push({act:(w.state==='blocked'?'watch_blocked':'watch_done'),c:w.id,t:w.what||w.id,
      why:'조치 대기 · 기한 '+(w.due||'')+(w.state==='blocked'?' · 🚫막힘':''),
      cmd:w.cmd||('python -m studio.watch done --id '+w.id)});
  });
  PEND.forEach(function(x){
    if(x.osmu) return;                          // 이미 확산된 건 제외
    boss.push({act:'osmu',c:x.code,t:x.title,
      why:'게시 대기 · 원고·이미지 제작 완료, 게시만 남음 ('+(x.need||[]).join(' · ')+')',
      cmd:'python -m studio.osmu_manifest table --code '+x.code+' --open'});
  });

  Q.forEach(function(q){
    var v=v0[q.code];
    if(!v) lee.push({act:'v0',c:q.code,t:q.title,
      why:'V0 검사 대기(⑥) — 작성자가 아닌 이부장이 반박 검토한다',
      cmd:'python -m studio.v0check ask --code '+q.code});
    else if(v.verdict==='pass' && !q.go) boss.push({act:'publish_go',c:q.code,t:q.title,
      why:'발행 승인 대기(⑦) · V0 통과 — 이 원고를 지금 내는가',
      cmd:'python -m studio.pubqueue go --code '+q.code});
  });

  var rejList=V.filter(function(x){return x.verdict==='fail';});
  var LAB=['①제안','②선별','③글감','④지시','⑤초안','⑥V0','⑦발행승인','⑧발행'];
  function stepOf(code){
    var t=T.filter(function(x){return x.code===code;})[0];
    var q=Q.filter(function(x){return x.code===code;})[0];
    var v=v0[code], p=byc[code];
    if(p&&p.url) return 8;
    if(q&&q.go) return 7;
    if(v&&v.verdict==='fail') return -6;
    if(v&&v.verdict==='pass') return 7;
    if(q) return 6;
    if(t&&t.state==='approved') return 4;
    if(t&&t.state==='picked') return 3;
    if(t) return 2;
    return 1;
  }
  var docs={};
  T.forEach(function(t){docs[t.code]={code:t.code,title:t.title};});
  Q.forEach(function(q){docs[q.code]={code:q.code,title:q.title};});
  V.forEach(function(v){if(!docs[v.code])docs[v.code]={code:v.code,title:v.title};});
  var list=Object.keys(docs).map(function(k){return docs[k];})
           .filter(function(d){return !(byc[d.code]&&byc[d.code].url);});
  var bs=Object.keys(B.batches||{}).map(function(id){return {id:id,b:B.batches[id]};})
          .filter(function(x){return x.b.order;})
          .sort(function(x,y){return (y.b.order_at||'').localeCompare(x.b.order_at||'');});
  function pane(icon,title,n,body,cls){
    return '<div class="pane'+(cls?' '+cls:'')+'"><div class="ph">'+icon+' '+title
      +'<span class="cnt">'+n+'</span></div><div class="pb">'+body+'</div></div>';}

  // ① 사장님 결재 — 가장 자주 보는 칸이라 왼쪽 전체를 준다
  // 🔴 순서 — '버튼으로 지금 끝나는 것'을 맨 위로. (2026-08-23)
  //    조치 항목의 설명이 길어서 그냥 두면 발행 승인 버튼이 화면 밖으로 밀린다.
  //    가장 되돌리기 어려운 결재가 가장 안 보이는 자리에 가는 것은 위험하다.
  var ORD={publish_go:0,topic_approve:1,watch_done:2,osmu:3,watch_blocked:4};
  // ⚠️ ORD[..]||9 로 쓰면 안 된다 — publish_go 의 0 이 falsy 라 9 로 밀려 맨 뒤로 간다
  //    (2026-08-23 실제로 그렇게 넣었다가 발행 승인 카드가 화면에서 사라졌다).
  function ord(a){return (a in ORD)?ORD[a]:9;}
  boss.sort(function(x,y){return ord(x.act)-ord(y.act);});
  var BADGE={publish_go:'⑦ 발행',topic_approve:'③ 글감',
             watch_done:'🔧 조치',watch_blocked:'🚫 막힘',osmu:'📮 게시'};
  var LABEL={publish_go:'⑦ 발행 승인',topic_approve:'③ 글감 승인',watch_done:'✔ 완료 처리'};
  var bossBody = boss.length? boss.map(function(x){return '<div class="card boss"><div class="hd">'
      +'<span class="who w-boss">'+(BADGE[x.act]||'결재')+'</span>'
      +'<span class="ttl">'+esc(String(x.t||'').split(' — ')[0].slice(0,70))+'</span>'
      +'<span class="code">'+esc(x.c)+'</span></div>'
      +'<div class="meta">'+esc(String(x.why).slice(0,150))+'</div>'
      +(x.act==='topic_approve'&&(x.sum||x.facts)
        ? '<details class="pv"><summary>📄 초안 설명·근거 보기</summary>'
          +(x.sum?'<div class="pvs"><b>초안 구성</b>'+esc(x.sum)+'</div>':'')
          +(x.facts?'<div class="pvs"><b>확인한 수치·출처</b>'+esc(x.facts)+'</div>':'')
          +'</details>' : '')
      +(LABEL[x.act]?'<div style="margin-top:8px">'
        +btn(x.act,x.c,LABEL[x.act],'ok')
        +(x.act==='topic_approve'?btn('topic_drop',x.c,'제외','no'):'')
        +(x.act==='publish_go'?'<button class="act pv-btn" data-c="'+x.c+'" onclick="preview(this.dataset.c)">📄 원고 미리보기</button>':'')
        +'</div>':'')
      +'<div style="margin-top:6px">'+cmd(x.cmd)+'</div></div>';}).join('')
    : '<p class="none">✅ 없음 — 지금 사장님 결재를 기다리는 건이 없습니다.</p>';
  H+=pane('🙋','사장님 결재 대기',boss.length+'건',bossBody);

  // ② 이부장 결재 + 반려 — 한 칸에 묶는다(둘 다 관제탑 몫)
  var leeBody = (lee.length? lee.map(function(x){return '<div class="card wait"><div class="hd">'
      +'<span class="who w-lee">'+(x.act==='topic_pick'?'② 선별':'⑥ V0')+'</span>'
      +'<span class="ttl">'+esc(x.t||'')+'</span>'
      +'<span class="code">'+esc(x.c)+'</span></div>'
      +(x.act==='topic_pick'?'<div style="margin-top:8px">'
        +btn('topic_pick',x.c,'② 선별','ok')+btn('topic_drop',x.c,'제외','no')+'</div>':'')
      +'<div style="margin-top:6px">'+cmd(x.cmd)+'</div></div>';}).join('')
    : '<p class="none">✅ 없음.</p>')
    + (rejList.length? '<div class="sub2" style="margin-top:10px">⛔ 반려 — 재작업 후 재검사</div>'
       + rejList.map(function(x){return '<div class="card rej"><div class="hd">'
         +'<span class="who w-work">재작업</span><span class="ttl">'+esc(x.title||'')+'</span>'
         +'<span class="code">'+esc(x.code)+'</span></div>'
         +'<div class="why">'+esc(String(x.why||'').slice(0,220))+'</div></div>';}).join('') : '');
  H+=pane('🪪','이부장 결재 대기',lee.length+(rejList.length?' + 반려 '+rejList.length:'')+'건',leeBody);

  // ③ 진행 중 문서 — 결재선 위치
  var docBody = list.length? list.map(function(d){
      var st=stepOf(d.code), rejd=(st<0), cur=Math.abs(st);
      return '<div class="card'+(rejd?' rej':'')+'"><div class="hd">'
       +'<span class="ttl">'+esc(String(d.title||'').slice(0,52))+'</span>'
       +'<span class="code">'+esc(d.code)+'</span></div>'
       +'<div class="steps">'+LAB.map(function(l,i){
           var n=i+1, c=(rejd&&n===6)?'no':(n<cur?'done':(n===cur?'now':''));
           return '<span class="st '+c+'">'+l+'</span>';}).join('')+'</div></div>';}).join('')
    : '<p class="none">진행 중 문서가 없습니다.</p>';
  H+=pane('📑','진행 중 문서',list.length+'건',docBody);

  // ④ 지시서 + 세션 상태
  var ordBody = (SS.length? '<div class="sub2">🤖 세션·루틴 상태</div>'
      + SS.map(function(x){return '<div class="card" style="padding:7px 11px"><div class="hd">'
        +'<span class="who '+(x.s==='waiting'?'w-rt':'w-work')+'">'
        +(x.s==='waiting'?'⏸ 대기':'▶ 작업')+'</span>'
        +'<span class="ttl" style="font-weight:400">'+esc(x.id)+'</span>'
        +'<span class="code">'+esc(x.last||'')+'</span></div></div>';}).join('') : '')
    + '<div class="sub2" style="margin-top:10px">📄 지시서 — 최신순</div>'
    + bs.slice(0,6).map(function(x){
      var it=x.b.items||[], dn=it.filter(function(i){return i.state==='done';}).length;
      var rep=it.filter(function(i){return i.note;}).slice(-1);
      return '<div class="card"><div class="hd">'
        +'<span class="who '+(((x.b.owner||'').indexOf('루틴')>=0)?'w-rt':'w-work')+'">'
        +esc(String(x.b.owner||'미지정').slice(0,14))+'</span>'
        +'<span class="ttl" style="font-size:13px">'+esc(String(x.b.title||x.id).slice(0,42))+'</span>'
        +'<span class="code">'+dn+'/'+it.length+'</span></div>'
        + rep.map(function(i){return '<div class="note">↩ '+esc(String(i.note).slice(0,110))+'</div>';}).join('')
        +'<div style="margin-top:5px">'+cmd('python -m studio.batchboard order --id '+x.id)+'</div></div>';
    }).join('');
  H+=pane('📄','지시서 · 세션',bs.length+'건',ordBody);

  document.getElementById('out').innerHTML=H;
}).catch(function(e){
  document.getElementById('out').innerHTML='<p class="none">오류: '+esc(e.message)+'</p>';});
 });
</script></body></html>
