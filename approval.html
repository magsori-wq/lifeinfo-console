<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:12px 14px;background:#0e1526;color:#e6ecf7;overflow:hidden;
     font-family:"Malgun Gothic",-apple-system,sans-serif;font-size:14px;line-height:1.55;
     display:flex;flex-direction:column;gap:9px}
/* 🔴 분할 레이아웃 (2026-08-21 사장님 지시: "스크롤을 많이 하면 시간낭비다.
   한 화면에서 보고, 분할된 화면 안에서 스크롤할 수 있게") — 본문은 스크롤하지 않고
   각 패널만 독립 스크롤한다. */
.grid{flex:1;min-height:0;overflow:hidden;display:grid;gap:10px;
      grid-template-columns:1.05fr .95fr .9fr;grid-template-rows:1fr 1fr}
/* 🗒️ 미결사항 서브탭 (2026-08-28 사장님: "전자결재의 서브탭으로 미결사항
   우측에 만들어 붙여!") — 우측 열 하나를 통으로 쓴다. 조치한 줄은
   지우지 않고 ✅ 로 남긴다("완료된 내용만 체크하여 볼 수 있도록"). */
/* 🔴 자리를 못 박는다. span 만 주면 자동배치가 3열을 먼저 채워
   미결사항이 하단 중앙으로 밀린다(2026-08-28 브라우저로 실제 확인). */
.grid>.pane:nth-child(1){grid-area:1/1}
.grid>.pane:nth-child(2){grid-area:1/2}
.grid>.pane:nth-child(3){grid-area:2/1}
.grid>.pane:nth-child(4){grid-area:2/2}
/* 🔴 6분할 (2026-08-30 사장님 지시 "화면을 6분할하면 지시서와 보고서를 나누어 볼 수 있음").
   그전에는 미결사항(.side)이 **우측 열을 세로로 통으로** 써서 칸이 5개뿐이었고,
   그래서 지시서·보고를 한 칸 안에 좌우로 우겨넣어야 했다. 미결을 한 칸으로 줄이면
   2×3 이 온전히 6칸이 되고, 지시서와 보고가 **각각 제 칸**을 갖는다.
   ⚠️ 미결사항이 길어지면 pane 안에서 스크롤된다(모든 pane 이 독립 스크롤이다). */
.grid>.pane.side{grid-area:1/3}
.grid>.pane.rep{grid-area:2/3}
/* 📤 올릴 것 — 미결(side) 칸을 위아래로 나눠 쓴다. 새 열을 만들면 다 눌린다 */
.grid{grid-template-rows:1fr 1fr}
.grid>.pane.side{grid-area:1/3}
.grid>.pane.osmu{grid-area:1/3;align-self:end;max-height:46%}
.grid>.pane.side{max-height:52%;align-self:start}
/* 📄 지시서 ↔ 📢 보고 좌우 분할 (2026-08-30 사장님 지시
   "지시서세션옆에 보고내용탭을 이동하고 실시간으로 지시서/보고서를 같이 확인").
   한 pane 안을 두 칸으로 가른다 — 격자에 새 칸을 만들면 다른 패널이 눌린다. */
.split2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px;align-items:start}
.split2>.sp{min-width:0}
@media(max-width:1100px){.split2{grid-template-columns:1fr}}
/* 🔴 안 읽음은 빨강 — 지금 손대야 할 자리다. 읽음/대기와 한눈에 갈려야 한다. */

.tdi{display:flex;gap:8px;padding:7px 9px;border-bottom:1px solid #1c2842}

.pane{background:#131c31;border:1px solid #223052;border-radius:12px;height:100%;

.ph{display:flex;align-items:center;gap:8px;padding:9px 13px;flex:0 0 auto;

@media(max-width:900px){body{overflow:auto}

  .grid>.pane:nth-child(1),.grid>.pane:nth-child(2),
  .grid>.pane:nth-child(3),.grid>.pane:nth-child(4),
  .grid>.pane.side,.grid>.pane.rep{grid-area:auto}}

#autosw{margin-left:auto;display:flex;align-items:center;gap:7px;flex:0 0 auto;

    /* 🔴 결재 카드가 제목 70자·설명 150자로 잘라 버려서, 관제탑이 쉬운 말로 써 놓은

</style></head><body>
<div class="hdrow"><h1>📋 전자결재</h1>
 <span class="tip">승인 버튼은 <b>두 번</b> 눌러야 실행됩니다 · 명령을 클릭하면 복사</span><label id="autosw" class="on" title="끄면 화면이 저절로 바뀌지 않습니다"><span class="kn"></span><span id="autolab">자동갱신 켜짐</span></label>
</div>
<div class="flow">
① 제안 → ② <b>이부장 선별</b> → ③ <b>사장님 글감승인</b> → ④ 지시서 → ⑤ 초안·큐
→ ⑥ <b>이부장 V0검사</b> → ⑦ <b>사장님 발행승인</b> → ⑧ 발행·보고 → ④
</div>
<div id="out" class="grid"><div class="pane"><div class="pb"><p class="none">불러오는 중…</p></div></div></div>
<div id="pvm" onclick="if(event.target===this)pvclose()"><div id="pvw">
<div id="pvt"><span id="pvh"></span>
<button class="act no" onclick="pvclose()">닫기 (Esc)</button></div>
<!-- 🔴 sandbox 는 **비워 두면 안 된다** (2026-09-01 실측·사장님 발견).
     sandbox="" 는 모든 제한을 거는 값이라 **srcdoc 문서가 렌더되지 않는다** —
     화면에 흰 여백만 남고 사장님은 "뭘 보고 승인하냐" 를 다시 물으셔야 했다.
     대조군: progress.html 의 qpv-fr 은 sandbox 가 아예 없어 같은 방식으로 잘 그린다.
     allow-same-origin 만 준다 — allow-scripts 를 주지 않으므로 초안 안의
     스크립트 태그는 여전히 실행되지 않는다(격리 목적은 그대로 지킨다).
     🔴 이 주석에 스크립트 태그 문자열을 그대로 쓰면 파서가 거기서 끊는다 —
        2026-09-01 에 실제로 그렇게 화면을 죽였다. 낱말로 쓸 것. -->
<iframe id="pvb" sandbox="allow-same-origin"></iframe></div></div>
<div class="copied" id="cp">복사됨</div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];});}
function cmd(c){return '<code onclick="copy(this)">'+esc(c)+'</code>';}
// 🔴 원고 탭-복사 (2026-08-31). 원고는 수천 자라 HTML 속성에 담으면 깨진다 — 배열 참조.
var TXT=[];
function txtBtn(label,text,note){
  var i=TXT.push(text)-1;
  return '<button class="act ok" style="margin:6px 6px 0 0" onclick="cpi('+i+')">📋 '
    +esc(label)+' 복사 '+text.length+'자</button>'
    +(note?'<div class="meta">'+esc(note)+'</div>':'');
}
function cpi(i){
  var x=TXT[i];
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(x).then(toast,function(){fbcp(x);});
  } else fbcp(x);
}
function fbcp(x){var a=document.createElement('textarea');a.value=x;a.style.position='fixed';
  a.style.opacity=0;document.body.appendChild(a);a.select();
  try{document.execCommand('copy');toast();}catch(e){}document.body.removeChild(a);}
function toast(){var e=document.querySelector('.copied');if(!e)return;
  e.textContent='복사됨';e.classList.add('on');setTimeout(function(){e.classList.remove('on');},1100);}
function copy(el){navigator.clipboard.writeText(el.textContent);
  var c=document.getElementById('cp');c.classList.add('on');
  setTimeout(function(){c.classList.remove('on');},900);}
// 🔄 재확인 버튼 (2026-08-29 사장님 지시: "조치 밑에 재확인 버튼을 만들고").
//    URL 이면 새 탭으로 열고, 명령이면 서버(/api/recheck)에 그 항목의 cmd 를
//    그대로 실행시켜 결과를 카드 아래에 펼친다. 자유 명령을 안 보낸다 —
//    서버가 watch.json 에서 id 로 자기가 적어둔 cmd 를 찾아 그것만 돌린다.
var _rcSeq=0;
function recheckBtn(id,cmdText){
  var isUrl=/^https?:\/\//.test(String(cmdText||''));
  var rid='rc'+(_rcSeq++);
  return '<button class="act no" data-id="'+esc(id)+'" data-rid="'+rid+'" '
    +'onclick="recheck(this)">🔄 재확인'+(isUrl?' (새 탭)':'')+'</button>'
    +'<pre class="plain" id="'+rid+'" style="display:none;margin-top:6px"></pre>';
}
function recheck(btn){
  var id=btn.dataset.id, rid=btn.dataset.rid, out=document.getElementById(rid);
  btn.disabled=true; var old=btn.textContent; btn.textContent='… 확인 중';
  fetch(API+'/api/recheck?id='+encodeURIComponent(id)+'&t='+Date.now())
    .then(function(r){return r.json();})
    .then(function(d){
      btn.disabled=false; btn.textContent=old;
      if(d.kind==='url'){ window.open(d.output,'_blank','noopener'); return; }
      out.style.display='block';
      out.textContent=(d.ok===false?'⚠️ ':'')+(d.output||'(빈 응답)');
    })
    .catch(function(e){
      btn.disabled=false; btn.textContent=old;
      out.style.display='block'; out.textContent='⚠️ 재확인 실패: '+e.message;
    });
}
var API='http://127.0.0.1:8011', SRV=false;
// 이 화면을 '본 PC' 에서 보고 있는가. github.io 등 원격이면 결재서버에 절대 닿지 않는다.
var REMOTE=!(location.hostname==='localhost'||location.hostname==='127.0.0.1'
             ||location.protocol==='file:');
// 📄 원고 미리보기 (2026-08-23 사장님 지시) — 발행은 되돌리기 어려운 결재인데
//    그전에는 제목·코드·V0 근거만 보고 눌러야 했다. 원고를 보고 누르신다.
//    본문은 srcdoc + sandbox 로 격리해 띄운다(초안의 <style> 이 결재함 화면을 망가뜨리지 않게).
async function preview(code){
  var m=document.getElementById('pvm'), b=document.getElementById('pvb'),
      h=document.getElementById('pvh');

  //    조용히 붙는다. 자리를 못 박으면 그 두 가지가 통째로 사라진다.
  //    🔴 2026-08-31 단서 하나 — 그 자리에 **옛 서버**가 앉아 있고 창이 없어
  //    끌 수가 없으면(서버는 창 없이 돈다) 영원히 옛 코드가 답한다. 실제로 그랬다.

// 🔴 **HEAD 로 3초마다 확인한다 — 서버 재시작이 필요 없다** (2026-08-31)
//    처음엔 SSE(결재서버 푸시)로 만들었는데, 그 서버는 **창 없이** 돌고 있어

//    아무도 못 하는 일이 된다. **재시작이 필요 없는 방법으로 바꾼다.**
//    HEAD 는 본문을 안 받는다(헤더만, 수백 바이트). 3초마다 해도 부담이 없고,
//    Last-Modified 가 바뀐 **그 순간** 리로드하므로 체감은 실시간이다.
//    ⚠️ SSE 쪽도 남겨 뒀다 — 서버가 언젠가 재시작되면 그때 저절로 붙는다.
var _selfTag = null;
function checkSelf(){
  fetch(location.pathname + '?v=' + Date.now(), {method:'HEAD', cache:'no-store'})
    .then(function(r){
      if(!r.ok) return;
      var tag = (r.headers.get('Last-Modified') || '') + '/' +
                (r.headers.get('Content-Length') || '');
      if(_selfTag === null){ _selfTag = tag; return; }
      if(tag !== _selfTag){
        _selfTag = tag;
        location.replace(location.pathname + '?t=' + Date.now());
      }
    })
    .catch(function(){});
}

      // 데이터만 바뀐 경우가 대부분이라 먼저 다시 그리고,
      // 화면(HTML) 자체가 바뀌었으면 checkSelf 가 리로드한다.

      checkSelf();

  }catch(e){}
})();
