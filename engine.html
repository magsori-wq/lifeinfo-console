<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>엔진 상황실</title>
<style>
/* 엔진 상황실 V3 — 그래픽(흐름의 시각화) = 입구, 텍스트(흐름의 상세) = 상세. 노드·점·경보를 누르면 텍스트의 그 마디/그 글로 이동·펼침. engine_state.json(studio/enginestate.py) 20초마다. 외부 라이브러리 없음 */
:root{--bg:#f4f7fa;--panel:#fff;--panel2:#f0f4f8;--line:#d5dee7;--fg:#15222e;--muted:#5d7080;--ok:#12a45e;--am:#d98300;--rd:#d93636;--bl:#1f78c8;--idle:#9aa9b6;--flash:#fff2c2;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#070b10;--panel:#0e1620;--panel2:#121d29;--line:#1f3040;--fg:#d8e6f0;--muted:#7f95a6;--ok:#2fe08a;--am:#ffb02e;--rd:#ff4d4d;--bl:#4db3ff;--idle:#4a5b69;--flash:#4a3d12;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.45;overflow-x:hidden}
.wrap{max-width:1360px;margin:0 auto;padding:0 max(12px,env(safe-area-inset-right,0px)) 32px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
#top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 6px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.row1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
h1{font-size:1.1rem;margin:0}
h1 .led{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 8px var(--ok);animation:blink 2s ease-in-out infinite}
.meta{color:var(--muted);font-size:.76rem;overflow-wrap:anywhere}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--bl);font-weight:700}
.btn{font:inherit;font-size:.82rem;color:var(--bl);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 9px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--bl)}
#alarm{display:none;border-radius:6px;padding:6px 10px;font-weight:800;font-size:.88rem;overflow-wrap:anywhere;cursor:pointer}
#alarm.rd{display:block;background:var(--rd);color:#fff;animation:alarm 1s steps(2) infinite}
#alarm.am{display:block;background:var(--am);color:#1a1200}
#alarm small{font-weight:400;opacity:.9}
#flowfr{display:none;width:100%;height:70vh;border:1px solid var(--line);border-radius:6px;background:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:1300px){.main{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}#tpanel{position:sticky;top:96px;max-height:calc(100vh - 110px);overflow-y:auto}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.panel h2{margin:0 0 6px;font-size:1rem}
.panel h2 small{font-weight:400;color:var(--muted);font-size:.74rem}
svg#map{width:100%;height:auto;display:block;max-width:100%}
svg text{font-family:inherit;fill:var(--fg)}
.nd{cursor:pointer}
.nd rect.bx{fill:var(--panel2);stroke:var(--idle);stroke-width:2}
.nd .t1{font-size:15px;font-weight:800;pointer-events:none}.nd .t2{font-size:12px;fill:var(--muted);pointer-events:none}
.nd.live rect.bx{stroke:var(--bl)}
.nd.am rect.bx{stroke:var(--am);stroke-width:3}.nd.am .t2{fill:var(--am);font-weight:700}
.nd.rd rect.bx{stroke:var(--rd);stroke-width:4;animation:nodered .9s steps(2) infinite}.nd.rd .t2{fill:var(--rd);font-weight:800}
.nd:hover rect.bx,.nd:focus rect.bx{stroke:var(--bl);stroke-width:3}
.nd.sel rect.bx{stroke:var(--bl);stroke-width:4;fill:color-mix(in srgb,var(--bl) 14%,var(--panel2))}
.nd.rd:hover rect.bx{stroke:var(--rd)}
.nd.pk rect.bx{stroke:var(--bl);stroke-width:6}
.nd:focus{outline:none}
.hub{cursor:pointer}
.hub circle{fill:var(--panel2);stroke:var(--idle);stroke-width:2}.hub.rd circle{stroke:var(--rd);stroke-width:4;animation:nodered .9s steps(2) infinite}.hub.am circle{stroke:var(--am);stroke-width:3}.hub text{font-size:10px;font-weight:700;text-anchor:middle;pointer-events:none}
.hub.pk circle{stroke:var(--bl);stroke-width:6}
.ed{fill:none;stroke:var(--line);stroke-width:3}
.ed.flow{stroke:var(--bl);stroke-dasharray:6 8;animation:dash 1s linear infinite;opacity:.8}
.ed.am{stroke:var(--am);stroke-dasharray:6 8;animation:dash 1.4s linear infinite}
.ed.rd{stroke:var(--rd);stroke-width:4;animation:blink .8s steps(2) infinite}
.dot{cursor:pointer}
.dot circle{fill:var(--bl);stroke:var(--panel);stroke-width:1}.dot text{font-size:10px;font-weight:700}
.dot.am circle{fill:var(--am)}.dot.rd circle{fill:var(--rd)}.dot.dn circle{fill:var(--ok)}
.dot.mv circle{animation:pulse 1s ease-in-out infinite}
.dot.rd{animation:blink .8s steps(2) infinite}
#detail{margin:0 0 8px;border:1px solid var(--bl);border-radius:8px;padding:8px}
#detail h3{margin:0 0 4px;font-size:.92rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
#detail h4{margin:8px 0 2px;font-size:.78rem;color:var(--muted)}
#detail ul,.steps ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
#detail li{font-size:.82rem;overflow-wrap:anywhere;background:var(--panel2);border-radius:4px;padding:3px 8px;border-left:4px solid var(--ok)}
#detail li.w{border-left-color:var(--idle)}
#detail a,.steps a{color:var(--bl);font-weight:700}
.steps h3{margin:10px 0 3px;font-size:.88rem;display:flex;gap:6px;align-items:baseline;padding:2px 4px;border-radius:4px}
.steps h3 .n{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.steps li{font-size:.82rem;overflow-wrap:anywhere;background:var(--panel2);border-radius:4px;padding:3px 8px;border-left:4px solid var(--ok);cursor:pointer}
.steps li.am{border-left-color:var(--am);background:color-mix(in srgb,var(--am) 14%,var(--panel2))}
.steps li.rd{border-left-color:var(--rd);background:color-mix(in srgb,var(--rd) 18%,var(--panel2));animation:blink .9s steps(2) infinite}
.steps li .c{font-weight:800}.steps li .w{color:var(--muted);font-size:.74rem}
.steps li .m{font-variant-numeric:tabular-nums;font-weight:700}
.steps li .dtl{display:none;margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);font-size:.78rem}
.steps li.open .dtl{display:block}
.steps li.empty{background:none;border:0;color:var(--muted);cursor:default;animation:none}
.flash{outline:3px solid var(--bl);outline-offset:1px;background:var(--flash)!important}
.kp{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.kp span{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:.78rem}
.kp b{font-variant-numeric:tabular-nums}.kp .rd b{color:var(--rd)}.kp .am b{color:var(--am)}.kp .ok b{color:var(--ok)}
details.strip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
details.strip summary{cursor:pointer;font-weight:700;overflow-wrap:anywhere}
details.strip ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
details.strip li{font-size:.82rem;overflow-wrap:anywhere;border-left:4px solid var(--idle);padding:2px 8px;background:var(--panel2);border-radius:3px}
details.strip li.c0,details.strip li.c1{border-left-color:var(--rd)}details.strip li.c2{border-left-color:var(--am)}
details.strip h3{margin:10px 0 2px;font-size:.78rem;color:var(--muted)}
@keyframes blink{50%{opacity:.35}}
@keyframes alarm{50%{background:#8f1d1d}}
@keyframes nodered{50%{stroke:transparent}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="top">
    <div class="row1">
      <h1><span class="led"></span>엔진 상황실</h1>
      <a class="btn" href="engine_flow.html" target="_blank" rel="noopener">🗺 신호체계 흐름도 ↗</a>
      <button class="btn" id="tg" type="button">아래에 펼치기</button>
      <span class="clock" id="clock"></span>
    </div>
    <div class="meta" id="at">불러오는 중…</div>
    <div id="alarm" role="alert" tabindex="0"></div>
  </div>
  <iframe id="flowfr" title="흐름도"></iframe>

  <div class="main">
    <section class="panel" id="gpanel">
      <h2>🗺 지도 <small>마디·점·종착지를 누르면 오른쪽(폰은 아래) 목록의 그 자리로 이동합니다</small></h2>
      <svg id="map" role="img" aria-label="글이 출발에서 종착지 4곳으로 가는 흐름 지도"></svg>
    </section>
    <section class="panel steps" id="tpanel">
      <h2>📋 상세 목록 <small>지도와 같은 데이터 · 같은 순서 · 줄을 누르면 펼침</small></h2>
      <div id="detail" hidden></div>
      <div class="kp" id="kp"></div>
      <div id="steps"></div>
    </section>
  </div>

  <details class="strip" id="strip"><summary id="ssum">사건·유닛</summary><div id="sbody"></div></details>
</div>
<script>
const DEMO=new URLSearchParams(location.search).get("demo");let demoStep=0;
const REDUCE=matchMedia("(prefers-reduced-motion:reduce)").matches;
let S=null,loadedAt=Date.now(),curLayout="",selTerm=null,dots={},lastAlert=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmtMin(m){if(m==null)return "";return m>=60?Math.floor(m/60)+"시간 "+m%60+"분":m+"분"}
const NS="http://www.w3.org/2000/svg";
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a||{})e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}

const MAIN=[["topic","① 글감 선정"],["proc","② 처리(초안·V0)"],["boss","③ 결재·준비"],["pub","④ 발행"]];
const TERM=[["blog","🅑 블로그스팟"],["naver","🅝 네이버"],["insta","🅘 인스타"],["threads","🅣 쓰레드"]];
let G=null;
function layout(vert){
  const L={vert,nodes:{},edges:[],vb:vert?[360,720]:[900,440],cell:40,hub:null};
  if(!vert){
    MAIN.forEach((m,i)=>L.nodes[m[0]]={k:m[0],name:m[1],cx:80+i*155,cy:200,w:132,h:64,rows:3});
    TERM.forEach((m,i)=>L.nodes[m[0]]={k:m[0],name:m[1],cx:815,cy:60+i*105,w:150,h:66,rows:2,term:true});
    L.hub={x:672,y:200};
  }else{
    MAIN.forEach((m,i)=>L.nodes[m[0]]={k:m[0],name:m[1],cx:180,cy:50+i*120,w:250,h:58,rows:3});
    TERM.forEach((m,i)=>L.nodes[m[0]]={k:m[0],name:m[1],cx:49+i*88,cy:625,w:82,h:76,rows:2,term:true});
    L.hub={x:180,y:510};
  }
  const N=L.nodes,h=L.hub;
  const out=n=>vert?[n.cx,n.cy+n.h/2]:[n.cx+n.w/2,n.cy], inn=n=>vert?[n.cx,n.cy-n.h/2]:[n.cx-n.w/2,n.cy];
  const cub=(a,b)=>vert?`M${a[0]} ${a[1]}C${a[0]} ${(a[1]+b[1])/2},${b[0]} ${(a[1]+b[1])/2},${b[0]} ${b[1]}`:`M${a[0]} ${a[1]}C${(a[0]+b[0])/2} ${a[1]},${(a[0]+b[0])/2} ${b[1]},${b[0]} ${b[1]}`;
  const hin=vert?[h.x,h.y-16]:[h.x-16,h.y], hout=vert?[h.x,h.y+16]:[h.x+16,h.y];
  L.edges=[["topic","proc",cub(out(N.topic),inn(N.proc))],["proc","boss",cub(out(N.proc),inn(N.boss))],["boss","pub",cub(out(N.boss),inn(N.pub))],
    ["pub","blog",cub(out(N.pub),inn(N.blog))],["pub","hub",cub(out(N.pub),hin)]];
  ["naver","insta","threads"].forEach(k=>L.edges.push(["hub",k,cub(hout,inn(N[k]))]));
  return L;
}
function build(vert){
  G=layout(vert);curLayout=vert?"v":"h";dots={};
  const svg=document.getElementById("map");svg.innerHTML="";svg.setAttribute("viewBox","0 0 "+G.vb[0]+" "+G.vb[1]);
  G.edges.forEach(e=>{el("path",{d:e[2],class:"ed",id:"ed-"+e[0]+"-"+e[1]},svg)});
  Object.values(G.nodes).forEach(n=>{
    const g=el("g",{class:"nd"+(n.term?" term":""),id:"nd-"+n.k,tabindex:"0",role:"button","aria-label":n.name+" 상세 보기"},svg);
    el("rect",{class:"bx",x:n.cx-n.w/2,y:n.cy-n.h/2,width:n.w,height:n.h,rx:10},g);
    const t1=el("text",{class:"t1",x:n.cx,y:n.cy-(n.term?6:4),"text-anchor":"middle"},g);t1.textContent=n.name;
    el("text",{class:"t2",x:n.cx,y:n.cy+(n.term?12:16),"text-anchor":"middle",id:"t2-"+n.k},g);
    if(n.term)el("text",{class:"t2",x:n.cx,y:n.cy+28,"text-anchor":"middle",id:"t3-"+n.k},g);
    const go=()=>n.term?pickTerm(n.k):focusStep(n.k);
    g.addEventListener("click",go);g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();go()}});
  });
  const hg=el("g",{class:"hub",id:"hub",tabindex:"0",role:"button","aria-label":"Aside 허브 상세"},svg);el("circle",{cx:G.hub.x,cy:G.hub.y,r:16},hg);const ht=el("text",{x:G.hub.x,y:G.hub.y+3},hg);ht.textContent="Aside";
  hg.addEventListener("click",()=>focusStep("hub"));hg.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();focusStep("hub")}});
  el("text",{x:G.hub.x,y:G.hub.y-22,"text-anchor":"middle",id:"hubt",style:"font-size:11px;fill:var(--muted)"},svg);
  el("g",{id:"dots"},svg);
}
function cellPos(n,i){
  const cols=Math.max(1,Math.floor((n.w-4)/G.cell));const col=i%cols,row=Math.floor(i/cols);
  if(row>=n.rows)return null;
  return {x:n.cx-n.w/2+8+col*G.cell,y:n.cy+n.h/2+14+row*13};
}
function edgePt(a,b,t){const p=document.getElementById("ed-"+a+"-"+b);if(!p)return {x:0,y:0};const q=p.getPointAtLength(p.getTotalLength()*t);return {x:q.x,y:q.y}}
function nodeCenter(k){if(k==="hub")return G.hub;const n=G.nodes[k];return {x:n.cx,y:n.cy}}

function setDot(id,code,tx,ty,cls,from){
  const layer=document.getElementById("dots");let d=dots[id];
  if(!d){
    const g=el("g",{class:"dot"},layer);el("circle",{r:4,cx:0,cy:0},g);const t=el("text",{x:7,y:3.5},g);t.textContent=code;
    g.addEventListener("click",ev=>{ev.stopPropagation();focusRow(code)});
    const o=from||{x:tx,y:ty};d=dots[id]={g,x:o.x,y:o.y,seen:true,raf:0};g.setAttribute("transform",`translate(${o.x} ${o.y})`);
  }
  d.seen=true;d.g.setAttribute("class","dot "+(cls||"")+(d.g.classList.contains("mv")?" mv":""));
  if(Math.abs(d.x-tx)>0.5||Math.abs(d.y-ty)>0.5){
    if(REDUCE){d.x=tx;d.y=ty;d.g.setAttribute("transform",`translate(${tx} ${ty})`);return}
    d.g.classList.add("mv");cancelAnimationFrame(d.raf);const sx=d.x,sy=d.y,t0=performance.now(),dur=1400;
    const step=now=>{const k=Math.min(1,(now-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;d.x=sx+(tx-sx)*e;d.y=sy+(ty-sy)*e;d.g.setAttribute("transform",`translate(${d.x} ${d.y})`);
      if(k<1)d.raf=requestAnimationFrame(step);else d.g.classList.remove("mv")};d.raf=requestAnimationFrame(step);
  }
}
function sweepDots(){for(const id in dots){const d=dots[id];if(!d.seen){cancelAnimationFrame(d.raf);d.g.remove();delete dots[id]}else d.seen=false}}

function maxMin(a){const m=a.map(x=>x.min).filter(v=>v!=null);return m.length?Math.max(...m):null}
function groups(s){
  const nd=s.nodes||{};const today=(s.kpi||{}).today||"";
  const topics=(s.topics||[]).filter(t=>t.state==="제안").map(t=>({code:t.code,title:t.title,min:null,lvl:"ok",who:t.src||"3.세션·루틴"}));
  const tag=(a,w)=>(a||[]).map(x=>Object.assign({},x,{who:w}));
  return {topic:topics,
    proc:tag(nd.draft,"이과장(초안)").concat(tag(nd.v0,"V0 검사")),
    boss:tag(nd.boss,"사장님 결재").concat(tag(nd.deploy,"썸네일 배포")),
    pub:tag(nd.publish,"publish.yml"),
    osmu:(nd.osmu||[]).map(x=>Object.assign({},x,{who:"Aside·이과장 · "+(x.left||[]).join("·")+" 남음",lvl:(x.last_at&&today&&x.last_at<today)?"amber":"ok"}))};
}
function alerts(s,g){
  const A=[];const add=(lv,what,min,node,code)=>A.push({lv,what,min,node,code});
  [["proc","처리"],["boss","결재·준비"],["pub","발행"]].forEach(([k,lab])=>{
    g[k].forEach(x=>{if(x.lvl==="red")add("rd",`${lab} 멈춤 ${x.code} ${x.title||""}`,x.min,k,x.code);else if(x.lvl==="amber")add("am",`${lab} 지연 ${x.code} ${x.title||""}`,x.min,k,x.code)});
    if(g[k].length>=3)add("am",`병목 — ${lab}에 ${g[k].length}건 쌓임`,maxMin(g[k]),k)});
  g.osmu.forEach(x=>{if(x.lvl==="amber")add("am",`4채널 미완(어제 이전 발행) ${x.code}`,null,"hub",x.code)});
  const as=s.aside||{};if(as.lvl==="red")add("rd","Aside 멈춤 — "+(as.state||""),null,"hub");
  const tw=s.tower||{};if(tw.lvl==="red")add("rd","감시 장치(towertick) 멈춤 — 신호가 안 들어온다",tw.age_min,"top");
  (s.units||[]).forEach(u=>{if(u.lvl==="red"&&u.who!=="Aside"&&!/이부장/.test(u.who))add("rd",`${u.who} ${u.state}`,u.last_min,"top")});
  return A;
}

function render(s){
  S=s;loadedAt=Date.now();
  const vert=document.getElementById("gpanel").clientWidth<620;
  if(curLayout!==(vert?"v":"h"))build(vert);
  document.getElementById("at").textContent="기준 "+s.at+" · 20초마다 갱신";
  const g=groups(s),A=alerts(s,g),ch=s.channels||{};lastAlert=null;
  const al=document.getElementById("alarm"),reds=A.filter(a=>a.lv==="rd"),ams=A.filter(a=>a.lv==="am");
  const pk=reds[0]||ams[0];
  if(pk){lastAlert=pk;al.className=reds.length?"rd":"am";const rest=(reds.length?reds.length:ams.length)-1;
    al.innerHTML=(reds.length?"🚨 사고: ":"⚠ 지연: ")+esc(pk.what)+(pk.min!=null?" · "+fmtMin(pk.min):"")+(rest>0?" 외 "+rest+"건":"")+" <small>(누르면 그 지점으로)</small>"}
  else{al.className="";al.textContent=""}
  const nlv={};A.forEach(a=>{nlv[a.node]=(nlv[a.node]==="rd"||a.lv==="rd")?"rd":"am"});
  const info={topic:g.topic,proc:g.proc,boss:g.boss,pub:g.pub};
  MAIN.forEach(([k])=>{const n=document.getElementById("nd-"+k),a=info[k],m=maxMin(a);
    n.setAttribute("class","nd"+(a.length?" live":"")+(nlv[k]?" "+nlv[k]:""));
    document.getElementById("t2-"+k).textContent=a.length?(a.length+"건"+(m!=null?" · 최장 "+fmtMin(m):"")):"비어 있음"});
  TERM.forEach(([k])=>{const n=document.getElementById("nd-"+k),c=ch[k]||{done:[],wait:[]};
    n.setAttribute("class","nd term"+(k===selTerm?" sel":"")+(c.wait.length?" live":"")+(nlv.hub&&k!=="blog"?" "+nlv.hub:""));
    document.getElementById("t2-"+k).textContent="도착 "+c.done.length+"편";
    document.getElementById("t3-"+k).textContent="대기 "+c.wait.length+"편"});
  document.getElementById("hub").setAttribute("class","hub"+(nlv.hub?" "+nlv.hub:""));
  const as=s.aside||{};document.getElementById("hubt").textContent=(as.busy?"일하는 중":(as.lvl==="red"?"멈춤":"대기"))+(as.queue?" · 큐 "+as.queue:"");
  const osm=(s.nodes&&s.nodes.osmu)||[];
  const need={blog:0,naver:0,insta:0,threads:0};osm.forEach(x=>{Object.keys(need).forEach(k=>{if(!(x.ch||{})[k])need[k]++})});
  const traf={"topic>proc":g.proc.length,"proc>boss":g.boss.length,"boss>pub":g.pub.length,"pub>hub":need.naver+need.insta+need.threads,"pub>blog":need.blog,
    "hub>naver":need.naver,"hub>insta":need.insta,"hub>threads":need.threads};
  G.edges.forEach(e=>{const key=e[0]+">"+e[1],p=document.getElementById("ed-"+e[0]+"-"+e[1]);let c="ed";
    if(traf[key])c+=(nlv[e[0]]==="rd")?" rd":(nlv[e[0]]==="am"?" am":" flow");
    else if(e[0]==="hub"&&nlv.hub==="rd")c+=" rd";
    p.setAttribute("class",c)});
  const cnt={};const slot=k=>{cnt[k]=(cnt[k]||0);return cnt[k]++};
  ["topic","proc","boss","pub"].forEach(k=>g[k].forEach(x=>{const p=cellPos(G.nodes[k],slot(k));if(p)setDot(x.code,x.code,p.x,p.y,x.lvl==="red"?"rd":x.lvl==="amber"?"am":"",null)}));
  const inTransit=new Set();
  osm.forEach(x=>{inTransit.add(x.code);TERM.forEach(([k])=>{const id=x.code+"|"+k,n=G.nodes[k],has=(x.ch||{})[k],src=k==="blog"?"pub":"hub";
    if(has){const p=cellPos(n,slot(k));if(p)setDot(id,x.code,p.x,p.y,"dn",nodeCenter(src))}
    else{const q=edgePt(src,k,.55),off=slot("e"+k)*6;setDot(id,x.code,q.x-4,q.y-4+off,x.lvl==="amber"?"am":"",nodeCenter(src))}})});
  TERM.forEach(([k])=>{const n=G.nodes[k];((ch[k]||{}).done||[]).forEach(x=>{if(inTransit.has(x.code))return;const p=cellPos(n,slot(k));if(p)setDot("d|"+x.code+"|"+k,x.code,p.x,p.y,"dn",null)})});
  sweepDots();
  renderText(s,g);renderDetail();renderStrip(s);tickMin();
}

/* ---------- 텍스트 ---------- */
function urlsFor(code){
  const ch=(S&&S.channels)||{},out=[];
  TERM.forEach(([k,nm])=>{((ch[k]||{}).done||[]).forEach(x=>{if(x.code===code&&x.url&&x.url!=="#")out.push(`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(nm)} ↗</a>`)})});
  return out.join(" · ");
}
function rowHtml(x,extra){
  const u=urlsFor(x.code);
  return `<li class="${x.lvl==="red"?"rd":x.lvl==="amber"?"am":""}" data-code="${esc(x.code)}"><span class="c">${esc(x.code)}</span> ${esc(x.title||"")}<div class="w">${esc(x.who||"")}${extra||""}${x.min!=null?` · <span class="m" data-min="${x.min}">경과 ${fmtMin(x.min)}</span>`:""}</div>`+
   `<div class="dtl"><b>${esc(x.code)}</b> · ${esc(x.title||"")}<br>누가: ${esc(x.who||"-")}<br>상태: ${x.lvl==="red"?"🚨 멈춤":x.lvl==="amber"?"⚠ 지연":"정상 진행"}${x.min!=null?" · 서 있은 지 "+fmtMin(x.min):""}${u?"<br>게시된 곳: "+u:"<br>게시된 곳: 아직 없음"}</div></li>`}
function renderText(s,g){
  const k=s.kpi||{},tw=s.tower||{},as=s.aside||{},cnt=k.incidents_by_code||{},inc=(s.incidents||[]).length;
  document.getElementById("kp").innerHTML=
   `<span class="ok">오늘 완결 <b>${k.done_today||0}</b></span><span class="ok">오늘 발행 <b>${k.published_today||0}</b></span>`+
   `<span class="${k.boss_wait?"am":"ok"}">결재 대기 <b>${k.boss_wait||0}</b></span>`+
   `<span class="${inc?(cnt[0]||cnt[1]?"rd":"am"):"ok"}">열린 사건 <b>${inc}</b></span>`+
   `<span class="${tw.age_min==null||tw.age_min>=15?"rd":tw.age_min<5?"ok":"am"}">감시 <b>${tw.age_min==null?"?":(tw.age_min<5?"생존":tw.age_min+"분")}</b></span>`+
   `<span class="${as.lvl==="red"?"rd":as.lvl==="amber"?"am":"ok"}">Aside <b>${as.busy?"일함":(as.lvl==="red"?"멈춤":"대기")}</b></span>`;
  const open=new Set([...document.querySelectorAll("#steps li.open")].map(e=>e.dataset.code));
  const sec=(id,n,t,a,fn,empty)=>`<h3 id="st-${id}">${n} ${t}<span class="n">${a.length}</span></h3><ul id="ul-${id}">${a.length?a.map(fn).join(""):`<li class="empty">${empty||"비어 있음"}</li>`}</ul>`;
  document.getElementById("steps").innerHTML=
    sec("topic","①","글감 선정 — 3.세션·루틴 → 이부장",g.topic,x=>rowHtml(x),"제안 대기 없음")+
    sec("proc","②","처리 중 — 이과장 초안 → V0",g.proc,x=>rowHtml(x))+
    sec("boss","③","결재·준비 — 사장님 결재 · 썸네일 배포",g.boss,x=>rowHtml(x))+
    sec("pub","④","발행 — publish.yml",g.pub,x=>rowHtml(x))+
    sec("osmu","⑤","4채널 진행 — 종착지 도착 대기",g.osmu,x=>rowHtml(x,` · 블로그${x.ch&&x.ch.blog?"✓":"…"} 네이버${x.ch&&x.ch.naver?"✓":"…"} 인스타${x.ch&&x.ch.insta?"✓":"…"} 쓰레드${x.ch&&x.ch.threads?"✓":"…"}`));
  document.querySelectorAll("#steps li[data-code]").forEach(li=>{if(open.has(li.dataset.code))li.classList.add("open");li.onclick=ev=>{if(ev.target.tagName==="A")return;li.classList.toggle("open")}});
}
function flash(e){if(!e)return;e.classList.add("flash");setTimeout(()=>e.classList.remove("flash"),2200)}
function toText(e){if(e&&e.scrollIntoView)e.scrollIntoView({block:"center",behavior:REDUCE?"auto":"smooth"})}
/* 지도 마디 → 목록의 그 단계 */
function focusStep(k){
  const id=(k==="hub")?"osmu":k;const h=document.getElementById("st-"+id);
  if(selTerm){selTerm=null;renderDetail();TERM.forEach(([kk])=>document.getElementById("nd-"+kk).classList.remove("sel"))}
  if(h){toText(h);flash(h);flash(document.getElementById("ul-"+id));const f=document.querySelector("#ul-"+id+" li[data-code]");if(f)f.classList.add("open")}
  const n=document.getElementById(k==="hub"?"hub":"nd-"+k);if(n){n.classList.add("pk");setTimeout(()=>n.classList.remove("pk"),1800)}
}
/* 점 → 목록의 그 글 (펼침) */
function focusRow(code){
  const rows=[...document.querySelectorAll('#steps li[data-code]')].filter(e=>e.dataset.code===code);
  if(!rows.length){const d=document.getElementById("detail");showCode(code);return}
  rows.forEach(r=>r.classList.add("open"));toText(rows[0]);rows.forEach(flash);
}
function showCode(code){/* 목록에 없는(이미 완결된) 글 — 상세 패널로 */
  const d=document.getElementById("detail");const u=urlsFor(code);selTerm=null;
  d.hidden=false;d.innerHTML=`<h3>${esc(code)} <button class="btn" type="button" id="dclose">닫기</button></h3><div style="font-size:.82rem">게시된 곳: ${u||"기록 없음"}</div>`;
  document.getElementById("dclose").onclick=()=>{d.hidden=true;d.innerHTML=""};toText(d);flash(d);
}
/* 종착지 → 목록 위 상세 패널 */
function pickTerm(k){selTerm=selTerm===k?null:k;TERM.forEach(([kk])=>document.getElementById("nd-"+kk).classList.toggle("sel",kk===selTerm));renderDetail();
  if(selTerm){const d=document.getElementById("detail");toText(d);flash(d)}}
function renderDetail(){
  const d=document.getElementById("detail");if(!selTerm||!S){if(selTerm===null&&!d.dataset.code){d.hidden=true;d.innerHTML=""}return}
  const c=((S.channels||{})[selTerm])||{done:[],wait:[]},nm=TERM.find(t=>t[0]===selTerm)[1];
  d.hidden=false;
  d.innerHTML=`<h3>${nm} — 최근 3일 도착 ${c.done.length}편 · 대기 ${c.wait.length}편 <button class="btn" type="button" id="dclose">닫기</button></h3>`+
   `<h4>✅ 도착(게시 완료)</h4><ul>${c.done.length?c.done.map(x=>`<li><b>${esc(x.code)}</b> ${esc(x.title)} · ${esc((x.at||"").slice(5))} · <a href="${esc(x.url)}" target="_blank" rel="noopener">열기 ↗</a></li>`).join(""):'<li class="w">아직 없음</li>'}</ul>`+
   `<h4>⏳ 아직 안 도착</h4><ul>${c.wait.length?c.wait.map(x=>`<li class="w"><b>${esc(x.code)}</b> ${esc(x.title)}</li>`).join(""):'<li class="w">대기 없음</li>'}</ul>`;
  document.getElementById("dclose").onclick=()=>pickTerm(selTerm);
}
/* 경보 배너 → 사고 지점 노드 + 목록 줄 */
function goAlert(){
  const a=lastAlert;if(!a)return;
  if(a.node==="top"){const k=document.getElementById("kp");toText(k);flash(k);return}
  focusStep(a.node);
  if(a.code){setTimeout(()=>focusRow(a.code),50)}
  const n=document.getElementById(a.node==="hub"?"hub":"nd-"+a.node);if(n&&n.scrollIntoView&&document.getElementById("gpanel").getBoundingClientRect().top<0)document.getElementById("gpanel").scrollIntoView({block:"start"});
}
function renderStrip(s){
  const inc=s.incidents||[],un=s.units||[];const keep=document.getElementById("strip").open;
  document.getElementById("ssum").textContent=`🚨 열린 사건 ${inc.length}건 · 유닛 ${un.length}개 (펼치기)`;
  document.getElementById("sbody").innerHTML=
   `<h3>사건</h3><ul>${inc.length?inc.map(i=>`<li class="c${i.p}"><b>코드${i.p}</b> ${esc(i.what)}${i.min!=null?" · "+fmtMin(i.min):""}</li>`).join(""):"<li>✅ 열린 사건 없음</li>"}</ul>`+
   `<h3>유닛</h3><ul>${un.map(u=>`<li class="${u.lvl==="red"?"c1":u.lvl==="amber"?"c2":""}"><b>${esc(u.who)}</b> ${esc(u.state)}${u.jobs!=null?" · 지시 "+u.jobs+"건":""}${u.last_min!=null?" · 마지막 소식 "+fmtMin(u.last_min)+" 전":""}</li>`).join("")}</ul>`+
   `<h3>최근 변경 로그</h3><ul>${(s.log||[]).slice(0,6).map(l=>`<li>${esc(l.at)} · 사건 ${l.n}건</li>`).join("")||"<li>기록 없음</li>"}</ul>`;
  document.getElementById("strip").open=keep;
}
function tickMin(){const dm=(Date.now()-loadedAt)/60000|0;document.querySelectorAll("[data-min]").forEach(e=>{e.textContent="경과 "+fmtMin(+e.dataset.min+dm)})}

/* ---------- ?demo=on 순환 · ?demo=0~7 고정 ---------- */
const DEMO_LAB=["평상시","① 글감 제안","② 처리 중(초안·V0)","③ 결재 대기 35분","④ 발행 개시","⑤ 블로그 도착 · 🚨 Aside 멈춤 사고","⑥ Aside 복구 → 네이버·인스타 도착","⑦ 쓰레드 도착 = 4채널 완결"];
function demo(s){
  const c=JSON.parse(JSON.stringify(s));c.nodes=c.nodes||{};c.channels=c.channels||{};c.kpi=c.kpi||{};c.topics=c.topics||[];
  const st=/^[0-7]$/.test(DEMO)?+DEMO:demoStep%8;const T=" [시험]";
  ["v0","boss","publish","osmu"].forEach(k=>c.nodes[k]=(c.nodes[k]||[]).filter(x=>!String(x.title||"").includes(T)));
  ["blog","naver","insta","threads"].forEach(k=>{c.channels[k]=c.channels[k]||{done:[],wait:[]}});
  const X={code:"X1-01",title:"가상 글감"+T};
  if(st===1)c.topics.unshift({code:"X1-01",title:X.title,src:"3.세션",state:"제안",at:c.at});
  if(st===2)c.nodes.v0=[{code:"X1-01",title:X.title,min:4,lvl:"ok"}];
  if(st===3)c.nodes.boss=[{code:"X1-01",title:X.title,min:35,lvl:"amber"}];
  if(st===4)c.nodes.publish=[{code:"X1-01",title:X.title,min:3,lvl:"ok"}];
  const done=(k,u)=>c.channels[k].done.unshift({code:"X1-01",title:X.title,url:u,at:(c.kpi.today||"")});
  if(st>=5){
    const ch={blog:true,naver:st>=6,insta:st>=6,threads:st>=7};
    const left=[["네이버","naver"],["인스타","insta"],["쓰레드","threads"]].filter(a=>!ch[a[1]]).map(a=>a[0]);
    const it={code:"X1-01",title:X.title,left,ch,lvl:left.length?"amber":"ok",last_at:c.kpi.today};
    if(left.length)c.nodes.osmu=[it].concat(c.nodes.osmu||[]);else{c.nodes.done=[it].concat(c.nodes.done||[]);c.kpi.done_today=(c.kpi.done_today||0)+1}
    c.kpi.published_today=(c.kpi.published_today||0)+1;
    done("blog","https://lifeinfo8975.blogspot.com/");if(ch.naver)done("naver","https://blog.naver.com/");if(ch.insta)done("insta","https://www.instagram.com/");if(ch.threads)done("threads","https://www.threads.com/");
    ["naver","insta","threads"].forEach(k=>{if(!ch[k])c.channels[k].wait.unshift({code:"X1-01",title:X.title})});
  }
  if(st===5){c.aside=Object.assign({},c.aside,{lvl:"red",busy:false,state:"멈춤 — 보고 없음 20분"+T});c.units=(c.units||[]).map(u=>u.who==="Aside"?Object.assign({},u,{state:"멈춤",lvl:"red"}):u)}
  c.at=s.at+" · 🧪 시험 "+st+"/7 — "+DEMO_LAB[st];
  demoStep++;return c}
async function load(){
  try{const r=await fetch("engine_state.json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);const s=await r.json();render(DEMO?demo(s):s)}
  catch(e){document.getElementById("at").textContent="상태 파일을 못 읽음("+e.message+") — 로컬 CP(localhost:8000)에서 열거나 배포 후 확인"}
}
document.getElementById("alarm").addEventListener("click",goAlert);
document.getElementById("alarm").addEventListener("keydown",ev=>{if(ev.key==="Enter")goAlert()});
document.getElementById("tg").onclick=()=>{const f=document.getElementById("flowfr");const on=f.style.display!=="block";if(on&&!f.src)f.src="engine_flow.html";f.style.display=on?"block":"none";document.getElementById("tg").textContent=on?"접기":"아래에 펼치기"};
function tick(){const d=new Date(),p=n=>String(n).padStart(2,"0");document.getElementById("clock").textContent=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());tickMin()}
let rz=0;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S){const v=document.getElementById("gpanel").clientWidth<620;if(curLayout!==(v?"v":"h"))render(S)}},200)});
tick();setInterval(tick,1000);load();setInterval(load,DEMO&&!/^[0-7]$/.test(DEMO)?4500:20000);
</script>
