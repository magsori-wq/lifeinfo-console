<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>엔진 상황실</title>
<style>
/* 엔진 상황실 V4 — 그래픽(흐름의 시각화) = 입구, 텍스트(흐름의 상세) = 상세. V4: 파이프·입자(오늘 흐름량) · 마디 게이지(부하 링·최장 시간 바늘) · 종착지 도착 물결 · 오늘 하루 재생 · 레이더(감시 생존). 노드·점·경보를 누르면 텍스트의 그 마디/그 글로 이동·펼침. engine_state.json(studio/enginestate.py) 20초마다. 외부 라이브러리 없음 */
:root{--bg:#f4f7fa;--panel:#fff;--panel2:#f0f4f8;--line:#d5dee7;--fg:#15222e;--muted:#5d7080;--ok:#12a45e;--am:#d98300;--rd:#d93636;--bl:#1f78c8;--idle:#9aa9b6;--flash:#fff2c2;--pipe:#e2e9f0;--pipe2:#cdd8e3;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#070b10;--panel:#0e1620;--panel2:#121d29;--line:#1f3040;--fg:#d8e6f0;--muted:#7f95a6;--ok:#2fe08a;--am:#ffb02e;--rd:#ff4d4d;--bl:#4db3ff;--idle:#4a5b69;--flash:#4a3d12;--pipe:#111c27;--pipe2:#1d2c3b;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.45;overflow-x:hidden}
.wrap{max-width:1360px;margin:0 auto;padding:0 max(12px,env(safe-area-inset-right,0px)) 32px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
#top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 6px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.row1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
h1{font-size:1.1rem;margin:0;display:flex;align-items:center;gap:6px}
.radar{width:22px;height:22px;flex:none}
.radar .rr{fill:none;stroke:var(--ok);stroke-width:1;opacity:.55}
.radar .rx{stroke:var(--ok);stroke-width:.6;opacity:.35}
.radar .sw{transform-origin:12px 12px;animation:sweep 2.6s linear infinite}
.radar .sw path{fill:var(--ok);opacity:.45}
.radar .bp{fill:var(--ok);opacity:0}
.radar .bp.ping{animation:ping 1.4s ease-out 1}
.radar.dead .sw{animation-play-state:paused}.radar.dead .sw path{fill:var(--idle);opacity:.3}.radar.dead .rr,.radar.dead .rx{stroke:var(--idle)}
.live{font-size:.68rem;font-weight:800;letter-spacing:.06em;color:var(--ok);border:1px solid currentColor;border-radius:4px;padding:0 5px;white-space:nowrap}
.live.dead{color:var(--idle)}
.meta{color:var(--muted);font-size:.76rem;overflow-wrap:anywhere}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--bl);font-weight:700}
.btn{font:inherit;font-size:.82rem;color:var(--bl);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 9px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--bl)}
#alarm{display:none;border-radius:6px;padding:6px 10px;font-weight:800;font-size:.88rem;overflow-wrap:anywhere;cursor:pointer}
.lane{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:6px 0}.lane .lh{font-size:.78rem;font-weight:800;color:var(--muted);align-self:center;min-width:100%}.lane .cp{flex:1 1 150px;min-width:0;border:1px solid var(--line);border-left:4px solid var(--idle);border-radius:6px;padding:4px 7px;background:var(--panel2);font-size:.76rem;line-height:1.35}.lane .cp b{display:block;font-size:.8rem}.lane .cp .nt{color:var(--muted);overflow-wrap:anywhere}.lane .cp.ok{border-left-color:var(--ok)}.lane .cp.am{border-left-color:var(--am)}.lane .cp.rd{border-left-color:var(--rd)}.lane .cp.idle{opacity:.7}.lane .unr{color:var(--am);font-weight:800}
.drv text{font-size:10.5px;fill:var(--muted);font-weight:700}.drv.on text{fill:var(--bl);animation:drvp 1.6s ease-in-out infinite}@keyframes drvp{0%,100%{opacity:1}50%{opacity:.35}}.lane .cp.feed{border-left-color:var(--bl);background:linear-gradient(90deg,var(--panel2) 0%,rgba(77,179,255,.18) 50%,var(--panel2) 100%);background-size:200% 100%;animation:feedflow 1.4s linear infinite}@keyframes feedflow{0%{background-position:100% 0}100%{background-position:-100% 0}}.lane .fd{display:block;color:var(--bl);font-weight:800}#nd-topic.fueling .bx{stroke:var(--bl);stroke-width:3;animation:fuelg 1.2s ease-in-out infinite}@keyframes fuelg{0%,100%{stroke-opacity:1}50%{stroke-opacity:.3}}html.reduce .drv.on text,html.reduce .lane .cp.feed,html.reduce #nd-topic.fueling .bx{animation:none}
.eflow{margin:8px 0;--pu:#a46bff}.eflow .lh{font-size:.78rem;font-weight:800;color:var(--pu);margin-bottom:4px}.eflow .erow{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap;overflow-x:auto}.eflow .est{flex:1 1 0;min-width:0;overflow-wrap:anywhere;border:1px solid var(--line);border-top:3px solid var(--idle);border-radius:6px;padding:4px 6px;background:var(--panel2);font-size:.72rem;line-height:1.3}.eflow .est b{display:block;font-size:.74rem}.eflow .est small{color:var(--muted)}.eflow .est.has{border-top-color:var(--pu);box-shadow:0 0 0 1px var(--pu) inset}.eflow .est.dn.has{border-top-color:var(--ok);box-shadow:none}.eflow .ec span{display:inline-block;margin:2px 3px 0 0;padding:0 4px;border-radius:4px;background:var(--pu);color:#fff;font-weight:700;font-size:.7rem}.eflow .est.dn .ec span{background:var(--ok)}.eflow .ear{flex:0 0 18px;align-self:center;height:4px;margin:0 2px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}.eflow .ear.on{background:linear-gradient(90deg,transparent 0,var(--pu) 40%,transparent 80%);background-size:200% 100%;animation:eflow 1s linear infinite}@keyframes eflow{0%{background-position:100% 0}100%{background-position:-100% 0}}html.reduce .eflow .ear.on{animation:none;background:var(--pu)}@media (max-width:560px){.eflow .est{font-size:.62rem;padding:3px 3px}.eflow .est b{font-size:.64rem}.eflow .ear{flex-basis:8px;margin:0 1px}.eflow .ec span{font-size:.6rem;padding:0 2px}}
#alarm.rd{display:block;background:var(--rd);color:#fff;animation:alarm 1s steps(2) infinite}
#alarm.am{display:block;background:var(--am);color:#1a1200}
#alarm small{font-weight:400;opacity:.9}
#flowfr{display:none;width:100%;height:70vh;border:1px solid var(--line);border-radius:6px;background:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:1300px){.main{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}#tpanel{position:sticky;top:96px;max-height:calc(100vh - 110px);overflow-y:auto}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.panel h2{margin:0 0 6px;font-size:1rem}
.panel h2 small{font-weight:400;color:var(--muted);font-size:.74rem}
svg#map{width:100%;height:auto;display:block;max-width:100%}
svg text{font-family:inherit;fill:var(--fg)}
.nd{cursor:pointer}
.nd rect.bx{fill:var(--panel2);stroke:var(--idle);stroke-width:1.5}
.nd .t1{font-size:15px;font-weight:800;pointer-events:none}.nd .t2{font-size:12px;fill:var(--muted);pointer-events:none}
.nd .sm{font-size:11px}
.nd.live rect.bx{stroke:var(--bl)}
.nd.am rect.bx{stroke:var(--am);stroke-width:3}.nd.am .t2{fill:var(--am);font-weight:700}
.nd.rd rect.bx{stroke:var(--rd);stroke-width:4;animation:nodered .9s steps(2) infinite}.nd.rd .t2{fill:var(--rd);font-weight:800}
.nd:hover rect.bx,.nd:focus rect.bx{stroke:var(--bl);stroke-width:3}
.nd.sel rect.bx{stroke:var(--bl);stroke-width:4;fill:color-mix(in srgb,var(--bl) 14%,var(--panel2))}
.nd.rd:hover rect.bx{stroke:var(--rd)}
.nd.pk rect.bx{stroke:var(--bl);stroke-width:6}
.nd:focus{outline:none}
.hub{cursor:pointer}
.hub circle{fill:var(--panel2);stroke:var(--idle);stroke-width:2}.hub.rd circle{stroke:var(--rd);stroke-width:4;animation:nodered .9s steps(2) infinite}.hub.am circle{stroke:var(--am);stroke-width:3}.hub text{font-size:10px;font-weight:700;text-anchor:middle;pointer-events:none}
.hub.pk circle{stroke:var(--bl);stroke-width:6}
/* 파이프 = 바깥 관(pc) + 안쪽 심(ed, 상태 클래스) · 입자(pt) */
.pc{fill:none;stroke:var(--pipe);stroke-width:12;stroke-linecap:round}
.pc.flow{stroke:color-mix(in srgb,var(--bl) 16%,var(--pipe))}.pc.am{stroke:color-mix(in srgb,var(--am) 22%,var(--pipe))}
.pc.rd{stroke:color-mix(in srgb,var(--rd) 30%,var(--pipe));animation:pipered 1.1s ease-in-out infinite}
.ed{fill:none;stroke:var(--pipe2);stroke-width:3;stroke-linecap:round}
.ed.flow{stroke:var(--bl);opacity:.55}
.ed.am{stroke:var(--am);opacity:.8}
.ed.rd{stroke:var(--rd);stroke-width:4;animation:pipered .9s ease-in-out infinite}
.fl{font-size:10px;fill:var(--muted);font-weight:700;pointer-events:none;font-variant-numeric:tabular-nums}
.pt{fill:var(--bl)}.pt.am{fill:var(--am)}.pt.rd{fill:var(--rd)}
/* 게이지 = 부하 링(서 있는 글 수, 3건=가득) + 다이얼 바늘(가장 오래 선 시간, 끝=위험 임계) */
.gauge{cursor:pointer}
.gbg{fill:var(--panel)}
.gtr{fill:none;stroke:var(--line);stroke-width:5}
.gld{fill:none;stroke:var(--idle);stroke-width:5;stroke-linecap:round;transition:stroke-dasharray .8s ease}
.gauge.ok .gld{stroke:var(--bl)}.gauge.term.ok .gld{stroke:var(--ok)}.gauge.am .gld{stroke:var(--am)}
.gauge.rd .gld{stroke:var(--rd);animation:nodered .9s steps(2) infinite}
.gauge.rd .gbg{fill:color-mix(in srgb,var(--rd) 14%,var(--panel))}.gauge.am .gbg{fill:color-mix(in srgb,var(--am) 10%,var(--panel))}
.gdl{fill:none;stroke:var(--line);stroke-width:2}
.gza{fill:none;stroke:var(--am);stroke-width:2.2;opacity:.85}.gzr{fill:none;stroke:var(--rd);stroke-width:3.2}
.gnd{stroke:var(--fg);stroke-width:2.4;stroke-linecap:round;transition:transform .9s ease,opacity .4s}
.gv{font-weight:800;text-anchor:middle;font-variant-numeric:tabular-nums;pointer-events:none}
.gauge.idle .gv{fill:var(--muted)}
.rip{fill:none;stroke:var(--ok);stroke-width:2.5;pointer-events:none}
.dot{cursor:pointer}
.dot circle{fill:var(--bl);stroke:var(--panel);stroke-width:1}.dot text{font-size:10px;font-weight:700}
.dot.am circle{fill:var(--am)}.dot.rd circle{fill:var(--rd)}.dot.dn circle{fill:var(--ok)}
.dot.mv circle{animation:pulse 1s ease-in-out infinite}
.dot.rd{animation:blink .8s steps(2) infinite}
#dots,#parts{transition:opacity .4s}
svg#map.replaying #dots{opacity:.1}svg#map.replaying #parts{opacity:.2}
.rdot circle{fill:var(--bl);stroke:var(--panel);stroke-width:1.5}.rdot.dn circle{fill:var(--ok)}.rdot text{font-size:10px;font-weight:800}
.spark{fill:var(--ok)}
.rp{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.rpbar{position:relative;flex:1 1 150px;min-width:0;height:16px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rpfill{position:absolute;left:0;top:0;bottom:0;width:0;background:color-mix(in srgb,var(--bl) 30%,transparent);border-right:2px solid var(--bl)}
.rptk{position:absolute;top:3px;bottom:3px;width:2px;margin-left:-1px;background:var(--muted);border-radius:1px}
.rptk.s-blog,.rptk.s-naver,.rptk.s-insta,.rptk.s-threads{background:var(--ok)}.rptk.s-pub{background:var(--bl)}.rptk.s-boss{background:var(--am)}
.rpt{font-variant-numeric:tabular-nums;font-weight:800;color:var(--bl);min-width:3.4em}
.rpnote,.lg{font-size:.72rem;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
#detail{margin:0 0 8px;border:1px solid var(--bl);border-radius:8px;padding:8px}
#detail h3{margin:0 0 4px;font-size:.92rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
#detail h4{margin:8px 0 2px;font-size:.78rem;color:var(--muted)}
#detail ul,.steps ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
#detail li{font-size:.82rem;overflow-wrap:anywhere;background:var(--panel2);border-radius:4px;padding:3px 8px;border-left:4px solid var(--ok)}
#detail li.w{border-left-color:var(--idle)}
#detail a,.steps a{color:var(--bl);font-weight:700}
.steps h3{margin:10px 0 3px;font-size:.88rem;display:flex;gap:6px;align-items:baseline;padding:2px 4px;border-radius:4px}
.steps h3 .n{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.steps li{font-size:.82rem;overflow-wrap:anywhere;background:var(--panel2);border-radius:4px;padding:3px 8px;border-left:4px solid var(--ok);cursor:pointer}
.steps li.am{border-left-color:var(--am);background:color-mix(in srgb,var(--am) 14%,var(--panel2))}
.steps li.rd{border-left-color:var(--rd);background:color-mix(in srgb,var(--rd) 18%,var(--panel2));animation:blink .9s steps(2) infinite}
.steps li .c{font-weight:800}.steps li .w{color:var(--muted);font-size:.74rem}
.steps li .m{font-variant-numeric:tabular-nums;font-weight:700}
.steps li .dtl{display:none;margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);font-size:.78rem}
.steps li.open .dtl{display:block}
.steps li.empty{background:none;border:0;color:var(--muted);cursor:default;animation:none}
.flash{outline:3px solid var(--bl);outline-offset:1px;background:var(--flash)!important}
.kp{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.kp span{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:.78rem}
.kp b{font-variant-numeric:tabular-nums}.kp .rd b{color:var(--rd)}.kp .am b{color:var(--am)}.kp .ok b{color:var(--ok)}
details.strip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
details.strip summary{cursor:pointer;font-weight:700;overflow-wrap:anywhere}
details.strip ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
details.strip li{font-size:.82rem;overflow-wrap:anywhere;border-left:4px solid var(--idle);padding:2px 8px;background:var(--panel2);border-radius:3px}
details.strip li.c0,details.strip li.c1{border-left-color:var(--rd)}details.strip li.c2{border-left-color:var(--am)}
details.strip h3{margin:10px 0 2px;font-size:.78rem;color:var(--muted)}
@keyframes blink{50%{opacity:.35}}
@keyframes alarm{50%{background:#8f1d1d}}
@keyframes nodered{50%{stroke:transparent}}
@keyframes pulse{50%{opacity:.45}}
@keyframes pipered{50%{opacity:.3}}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes ping{0%{opacity:1}100%{opacity:0}}
html.reduce *{animation:none!important;transition:none!important}
.mo{font-size:.72rem;color:var(--muted);display:none}html.osreduce .mo{display:inline}
</style>
</head>
<body>
<div class="wrap">
  <div id="top">
    <div class="row1">
      <h1><svg class="radar" id="radar" viewBox="0 0 24 24" aria-hidden="true"><circle class="rr" cx="12" cy="12" r="10.5"/><circle class="rr" cx="12" cy="12" r="5.5"/><line class="rx" x1="1.5" y1="12" x2="22.5" y2="12"/><line class="rx" x1="12" y1="1.5" x2="12" y2="22.5"/><g class="sw"><path d="M12 12L12 1.5A10.5 10.5 0 0 1 19.4 4.6Z"/></g><circle class="bp" id="blip" cx="16.5" cy="7.5" r="1.7"/></svg>엔진 상황실 <span class="live" id="live" title="감시 장치·상태 파일 생존">LIVE</span></h1>
      <a class="btn" href="engine_flow.html" target="_blank" rel="noopener">🗺 신호체계 흐름도 ↗</a>
      <button class="btn" id="tg" type="button">아래에 펼치기</button>
      <span class="clock" id="clock"></span>
    </div>
    <div class="meta" id="at">불러오는 중…</div>
    <div id="alarm" role="alert" tabindex="0"></div>
  </div>
  <iframe id="flowfr" title="흐름도"></iframe>

  <div class="main">
    <section class="panel" id="gpanel">
      <h2>🗺 지도 <small>마디·점·종착지를 누르면 오른쪽(폰은 아래) 목록의 그 자리로 이동합니다</small></h2>
      <div class="lane" id="supLane" aria-label="연료 공급자"></div>
      <svg id="map" role="img" aria-label="글이 출발에서 종착지 4곳으로 가는 흐름 지도"></svg>
      <div class="eflow" id="editLane" aria-label="글 수정 흐름"></div>
      <div class="lane" id="drvLane" aria-label="운전자"></div>
      <div class="rp"><button class="btn" id="rpbtn" type="button">▶ 오늘 하루 재생 (20초)</button><div class="rpbar" id="rpbar" aria-hidden="true"><div class="rpfill" id="rpfill"></div></div><span class="rpt" id="rpt">--:--</span><span class="mo" id="mo"><span id="motx"></span> <button class="btn" id="mobtn" type="button"></button></span></div>
      <div class="lg">● 관 속 입자 = 오늘 그 구간을 지난 글(+지금 서 있는 글) — 많을수록 촘촘·빠름 · 빨간 맥박 = 멈춘 구간(입자 정지) · 링 = 서 있는 글 수(3건이면 가득·병목) · 바늘 = 가장 오래 선 시간(눈금 끝 = 위험 임계, 주황 띠 = 경고) · 종착지 물결 = 새 도착</div>
      <div class="rpnote" id="rpnote"></div>
    </section>
    <section class="panel steps" id="tpanel">
      <h2>📋 상세 목록 <small>지도와 같은 데이터 · 같은 순서 · 줄을 누르면 펼침</small></h2>
      <div id="detail" hidden></div>
      <div class="kp" id="kp"></div>
      <div id="steps"></div>
    </section>
  </div>

  <details class="strip" id="strip"><summary id="ssum">사건·유닛</summary><div id="sbody"></div></details>
</div>
<script>
const DEMO=new URLSearchParams(location.search).get("demo");let demoStep=0;
/* 움직임 줄이기(OS 설정)면 기본은 정지 — 사장님이 「움직임 켜기」를 누르면 이 브라우저에만 기억(localStorage) */
const OSREDUCE=matchMedia("(prefers-reduced-motion:reduce)").matches;
/* 사장님 10-22: 상황실은 움직여야 한다 — 기본 켬, 「움직임 끄기」를 누른 브라우저만 멈춤 */
let MOTION_ON=true;try{MOTION_ON=localStorage.getItem("engMotion")!=="off"}catch(e){}
const _mq=new URLSearchParams(location.search).get("motion");if(_mq==="1")MOTION_ON=true;if(_mq==="0")MOTION_ON=false;
const REDUCE=!MOTION_ON;
document.documentElement.classList.toggle("reduce",REDUCE);document.documentElement.classList.toggle("osreduce",OSREDUCE);
let S=null,loadedAt=Date.now(),curLayout="",selTerm=null,dots={},lastAlert=null,fetchOk=true;
/* 외부 링크 href — 콘솔 정합성 검사가 따옴표 속 템플릿 링크를 로컬 파일로 오탐(10-22 40회 실패)해 따옴표를 함수가 붙인다 */
function hq(u){return '"'+esc(u)+'"'}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmtMin(m){if(m==null)return "";return m>=60?Math.floor(m/60)+"시간 "+m%60+"분":m+"분"}
const NS="http://www.w3.org/2000/svg";

function kick(){if(!raf&&!document.hidden){lastT=0;raf=requestAnimationFrame(frame)}}
function frame(ts){

    const e=document.getElementById("gv-"+k);if(e)e.textContent=v;if(u>=1)c.t0=0;else busy=true}

  const osm=(s.nodes&&s.nodes.osmu)||[];

/* ---------- 🛢 연료 공급자 · 🚗 운전자 (사장님 10-23 「연료공급자와 운전자를 분리하고 엔진흐름지도에 보여야」) ----------

function renderLanes(s){

    sup.map(x=>`<div class="cp ${lv(x)}${x.feeding?" feed":""}" title="${esc(x.note||"")}"><b>${x.kind==="상품"?"🛒":"🛢"} ${esc(x.who)}</b>`+(x.feeding?`<span class="fd">⛽ ① 글감으로 공급 중 →</span>`:"")+
      (x.ran?`${esc(x.at||"")}`+(x.kind==="상품"?"":` · 오늘 글감 ${x.today||0}건`):"오늘 아직 기록 없음")+

     화살표는 다음 칸에 지금 글이 있을 때만 흐른다(지나간 완료는 정지). */
  const ED=[["draft","✍ 개선안 작성","이과장"],["boss","🖊 결재","사장님"],["naver","🔁 블로그 반영·네이버 정정","이과장·Aside"],["sns","📱 인스타·쓰레드 정정","Aside(결재 후)"],["done","✅ 오늘 끝남",""]];
  const eds=s.edits||[];

    ED.map(([k,nm,who],i)=>{const a=eds.filter(e=>e.stage===k);
      return (i?`<div class="ear${a.length&&k!=="done"?" on":""}" aria-hidden="true"></div>`:"")+
        `<div class="est${a.length?" has":""}${k==="done"?" dn":""}"><b>${nm}</b>${who?`<small>${esc(who)}</small>`:""}<div class="ec">${a.map(e=>`<span>${esc(e.code)}</span>`).join("")||"—"}</div></div>`}).join("")+`</div>`;
  document.getElementById("drvLane").innerHTML=
    `<div class="lh">🚗 운전자 — 마디를 움직이는 쪽</div>`+
    drv.map(u=>`<div class="cp ${u.lvl==="red"?"rd":u.lvl==="amber"?"am":"ok"}"><b>${esc(u.who.replace("(감시)",""))} · ${esc(u.role||"")}</b>${esc(u.state||"")}`+
      (u.last_min!=null?` · 소식 ${fmtMin(u.last_min)} 전`:"")+(u.cur?`<div class="nt">지금: ${esc(u.cur)}</div>`:"")+`</div>`).join("");

/* ---------- 오늘 하루 재생(20초 타임랩스) ---------- */
const ROUTE_MAIN=["topic","proc","boss","pub"];
const STAGE_NODE={topic:"topic",proc:"proc",boss:"boss",pub:"pub",blog:"blog",naver:"naver",insta:"insta",threads:"threads"};
function evMs(at){return new Date(String(at).replace(" ","T")).getTime()}
function hhmm(ms){const d=new Date(ms),p=n=>String(n).padStart(2,"0");return p(d.getHours())+":"+p(d.getMinutes())}
function span(s){
  const ev=(s.today_events||[]).filter(e=>e.at),end0=evMs(String(s.at).slice(0,19));
  if(!ev.length)return null;const a=ev.map(e=>evMs(e.at));const st=Math.min(...a)-20*60000,en=Math.max(isNaN(end0)?0:end0,Math.max(...a)+10*60000);
  return {st,en};
}
function renderReplayBar(s){
  const bar=document.getElementById("rpbar"),ev=s.today_events||[],sp=span(s);
  bar.querySelectorAll(".rptk").forEach(e=>e.remove());
  const timed=ev.filter(e=>e.at),approx=ev.length-timed.length;
  if(sp)timed.forEach(e=>{const t=document.createElement("i");t.className="rptk s-"+e.stage;t.style.left=((evMs(e.at)-sp.st)/(sp.en-sp.st)*100).toFixed(2)+"%";t.title=e.at.slice(11,16)+" "+e.code+" "+e.stage;bar.appendChild(t)});

  document.getElementById("rpnote").textContent=ev.length?
    `재생 근거(실제 시각 ${timed.length}건): 글감 제안·선별 = topicprop · V0 통과 = v0check · 결재 도장 = queue go · 발행 완료·채널 게시 = batch now_log 시각(게시 URL 이 DB 기록과 같은 줄). 발행 뒤 큐에서 빠진 글은 결재 시각 기록이 없어 그 구간을 건너뜁니다.`+(approx?` 시각 없이 날짜만 있는 ${approx}건(DB osmu_at·pub_dates)은 맨 끝에 놓았습니다.`:""):
    "오늘 시각 기록이 아직 없습니다(today_events 비어 있음) — 재생할 것이 없습니다.";
}
function startReplay(){
  if(RP){stopReplay();return}
  if(!S||!(S.today_events||[]).length)return;
  const sp=span(S)||{st:Date.now()-1,en:Date.now()};
  const list=S.today_events.map(e=>Object.assign({},e,{ms:e.at?evMs(e.at):sp.en,approx:!e.at})).sort((a,b)=>a.ms-b.ms);
  RP={t0:performance.now(),dur:20000,st:sp.st,en:sp.en,list,i:0,dot:{},slots:{},cnt:{},mv:[],endAt:0};
  document.getElementById("map").classList.add("replaying");document.getElementById("rdots").innerHTML="";
  [...MAIN,...TERM].forEach(([k])=>{counters[k]={from:0,to:0,t0:0,val:0};const v=document.getElementById("gv-"+k);if(v)v.textContent="0";RP.cnt[k]=0;setGauge(k,0,0,"idle",null,null)});
  document.getElementById("rpbtn").textContent="■ 재생 멈춤";kick();
}
function stopReplay(){
  if(!RP)return;RP.mv.forEach(m=>m.spark&&m.el.remove());RP=null;
  document.getElementById("map").classList.remove("replaying");document.getElementById("rdots").innerHTML="";
  document.getElementById("rpbtn").textContent="▶ 오늘 하루 재생 (20초)";document.getElementById("rpfill").style.width="0";
  prevDone=null;const s=pendingS||S;pendingS=null;if(s)render(s);
}
function freeSlot(node,code){const a=RP.slots[node]=RP.slots[node]||[];let i=a.indexOf(null);if(i<0){i=a.length;a.push(code)}else a[i]=code;return i}
function leave(node,code){const a=RP.slots[node]||[];const i=a.indexOf(code);if(i>=0)a[i]=null}
function occ(node){return (RP.slots[node]||[]).filter(Boolean).length}
function slotXY(node,i){const n=G.nodes[node],p=cellPos(n,i);return p||{x:n.gx+n.r+6,y:n.gy-n.r}}
function routePts(from,to){
  /* from·to = 마디 키. 관(PT)을 이어 붙인 점 목록 */
  const pts=[],push=k=>{if(PT[k])pts.push(...PT[k])};
  const fi=ROUTE_MAIN.indexOf(from),tm=ROUTE_MAIN.indexOf(to);
  if(tm>=0){for(let i=Math.max(0,fi);i<tm;i++)push(ROUTE_MAIN[i]+">"+ROUTE_MAIN[i+1]);return pts}
  for(let i=Math.max(0,fi);i<3;i++)push(ROUTE_MAIN[i]+">"+ROUTE_MAIN[i+1]);
  if(to==="blog")push("pub>blog");else{push("pub>hub");push("hub>"+to)}
  return pts;
}
function rdot(code){
  const g=el("g",{class:"rdot"},document.getElementById("rdots"));el("circle",{r:4.5},g);const t=el("text",{x:7,y:3.5},g);t.textContent=code;return {g,code,node:null,x:0,y:0};
}
function moveAlong(obj,pts,end,dur,done){
  const path=pts.slice();path.push([end.x,end.y]);
  if(REDUCE||path.length<2){obj.x=end.x;obj.y=end.y;place(obj);done&&done();return}
  const cum=[0];for(let i=1;i<path.length;i++)cum.push(cum[i-1]+Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]));
  RP.mv.push({obj,path,cum,t0:performance.now(),dur,done,el:obj.g,spark:obj.spark});
}
function place(o){o.g.setAttribute("transform",`translate(${o.x.toFixed(1)} ${o.y.toFixed(1)})`)}
function fire(e){
  const to=STAGE_NODE[e.stage];if(!to||!G.nodes[to])return;
  const term=G.nodes[to].term;
  if(term&&to!=="blog"){                             /* 채널 도착 = 허브를 거쳐 가는 불꽃 */
    const sp={g:el("g",{},document.getElementById("rdots")),spark:true,x:0,y:0};el("circle",{class:"spark",r:3.6},sp.g);
    const st=PT["pub>hub"]?PT["pub>hub"][0]:[G.hub.x,G.hub.y];sp.x=st[0];sp.y=st[1];place(sp);
    moveAlong(sp,PT["pub>hub"].concat(PT["hub>"+to]),{x:G.nodes[to].gx,y:G.nodes[to].gy},1200,()=>{sp.g.remove();arrive(to)});return}
  let d=RP.dot[e.code];
  const prev=d?d.node:(to==="topic"?null:(to==="blog"?"pub":ROUTE_MAIN[Math.max(0,ROUTE_MAIN.indexOf(to)-1)]));
  if(!d){d=RP.dot[e.code]=rdot(e.code);const s0=prev?{x:G.nodes[prev].gx,y:G.nodes[prev].gy}:slotXY(to,0);d.x=s0.x;d.y=s0.y;place(d)}
  if(d.node){leave(d.node,e.code)}
  const i=freeSlot(to,e.code),end=slotXY(to,i);d.node=to;
  d.g.setAttribute("class","rdot"+(term?" dn":""));
  updOcc();
  moveAlong(d,prev&&prev!==to?routePts(prev,to):[],end,prev?1000:400,()=>{if(term)arrive(to)});
}
function arrive(k){RP&&(RP.cnt[k]=(RP.cnt[k]||0)+1);ripple(k);if(RP)setGauge(k,RP.cnt[k],1,"ok",null,null)}
function updOcc(){MAIN.forEach(([k])=>{const n=occ(k);setGauge(k,n,n/CAP,n?"ok":"idle",null,null)})}
function stepReplay(now){
  const k=Math.min(1,(now-RP.t0)/RP.dur),sim=RP.st+(RP.en-RP.st)*k;
  while(RP.i<RP.list.length&&RP.list[RP.i].ms<=sim){fire(RP.list[RP.i]);RP.i++}
  for(let j=RP.mv.length-1;j>=0;j--){const m=RP.mv[j],u=Math.min(1,(now-m.t0)/m.dur),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,L=m.cum[m.cum.length-1]*e;
    let i=1;while(i<m.cum.length-1&&m.cum[i]<L)i++;const a=m.path[i-1],b=m.path[i],seg=(m.cum[i]-m.cum[i-1])||1,w=Math.max(0,Math.min(1,(L-m.cum[i-1])/seg));
    m.obj.x=a[0]+(b[0]-a[0])*w;m.obj.y=a[1]+(b[1]-a[1])*w;place(m.obj);if(u>=1){RP.mv.splice(j,1);m.done&&m.done()}}
  document.getElementById("rpfill").style.width=(k*100).toFixed(1)+"%";document.getElementById("rpt").textContent=hhmm(sim);
  if(k>=1&&RP.i>=RP.list.length&&!RP.mv.length){if(!RP.endAt)RP.endAt=now;else if(now-RP.endAt>2500)stopReplay()}
}

document.getElementById("mobtn").textContent=REDUCE?"움직임 켜기":"움직임 끄기";
document.getElementById("motx").textContent=REDUCE?"움직임을 꺼 두었습니다 ·":"「애니메이션 줄이기」 PC — 이 브라우저만 움직임 켬 ·";

/* ---------- 텍스트 ---------- */

function rowHtml(x,extra){
  const u=urlsFor(x.code);
  return `<li class="${x.lvl==="red"?"rd":x.lvl==="amber"?"am":""}" data-code="${esc(x.code)}"><span class="c">${esc(x.code)}</span> ${esc(x.title||"")}<div class="w">${esc(x.who||"")}${extra||""}${x.min!=null?` · <span class="m" data-min="${x.min}">경과 ${fmtMin(x.min)}</span>`:""}</div>`+
   `<div class="dtl"><b>${esc(x.code)}</b> · ${esc(x.title||"")}<br>누가: ${esc(x.who||"-")}<br>상태: ${x.lvl==="red"?"🚨 멈춤":x.lvl==="amber"?"⚠ 지연":"정상 진행"}${x.min!=null?" · 서 있은 지 "+fmtMin(x.min):""}${u?"<br>게시된 곳: "+u:"<br>게시된 곳: 아직 없음"}</div></li>`}
function renderText(s,g){
  const k=s.kpi||{},tw=s.tower||{},as=s.aside||{},cnt=k.incidents_by_code||{},inc=(s.incidents||[]).length;
  document.getElementById("kp").innerHTML=
   `<span class="ok">오늘 완결 <b>${k.done_today||0}</b></span><span class="ok">오늘 발행 <b>${k.published_today||0}</b></span>`+
   `<span class="${k.boss_wait?"am":"ok"}">결재 대기 <b>${k.boss_wait||0}</b></span>`+
   `<span class="${inc?(cnt[0]||cnt[1]?"rd":"am"):"ok"}">열린 사건 <b>${inc}</b></span>`+
   `<span class="${tw.age_min==null||tw.age_min>=15?"rd":tw.age_min<5?"ok":"am"}">감시 <b>${tw.age_min==null?"?":(tw.age_min<5?"생존":tw.age_min+"분")}</b></span>`+
   `<span class="${as.lvl==="red"?"rd":as.lvl==="amber"?"am":"ok"}">Aside <b>${as.busy?"일함":(as.lvl==="red"?"멈춤":"대기")}</b></span>`;
  const open=new Set([...document.querySelectorAll("#steps li.open")].map(e=>e.dataset.code));
  const sec=(id,n,t,a,fn,empty)=>`<h3 id="st-${id}">${n} ${t}<span class="n">${a.length}</span></h3><ul id="ul-${id}">${a.length?a.map(fn).join(""):`<li class="empty">${empty||"비어 있음"}</li>`}</ul>`;
  document.getElementById("steps").innerHTML=
    sec("topic","①","글감 선정 — 3.세션·루틴 → 이부장",g.topic,x=>rowHtml(x),"제안 대기 없음")+
    sec("proc","②","처리 중 — 이과장 초안 → V0",g.proc,x=>rowHtml(x))+
    sec("boss","③","결재·준비 — 사장님 결재 · 썸네일 배포",g.boss,x=>rowHtml(x))+
    sec("pub","④","발행 — publish.yml",g.pub,x=>rowHtml(x))+
    sec("osmu","⑤","4채널 진행 — 종착지 도착 대기",g.osmu,x=>rowHtml(x,` · 블로그${x.ch&&x.ch.blog?"✓":"…"} 네이버${x.ch&&x.ch.naver?"✓":"…"} 인스타${x.ch&&x.ch.insta?"✓":"…"} 쓰레드${x.ch&&x.ch.threads?"✓":"…"}`));
  document.querySelectorAll("#steps li[data-code]").forEach(li=>{if(open.has(li.dataset.code))li.classList.add("open");li.onclick=ev=>{if(ev.target.tagName==="A")return;li.classList.toggle("open")}});
}
function flash(e){if(!e)return;e.classList.add("flash");setTimeout(()=>e.classList.remove("flash"),2200)}
function toText(e){if(e&&e.scrollIntoView)e.scrollIntoView({block:"center",behavior:REDUCE?"auto":"smooth"})}
/* 지도 마디 → 목록의 그 단계 */
function focusStep(k){
  const id=(k==="hub")?"osmu":k;const h=document.getElementById("st-"+id);
  if(selTerm){selTerm=null;renderDetail();TERM.forEach(([kk])=>document.getElementById("nd-"+kk).classList.remove("sel"))}
  if(h){toText(h);flash(h);flash(document.getElementById("ul-"+id));const f=document.querySelector("#ul-"+id+" li[data-code]");if(f)f.classList.add("open")}
  const n=document.getElementById(k==="hub"?"hub":"nd-"+k);if(n){n.classList.add("pk");setTimeout(()=>n.classList.remove("pk"),1800)}
}
/* 점 → 목록의 그 글 (펼침) */
function focusRow(code){
  const rows=[...document.querySelectorAll('#steps li[data-code]')].filter(e=>e.dataset.code===code);
  if(!rows.length){const d=document.getElementById("detail");showCode(code);return}
  rows.forEach(r=>r.classList.add("open"));toText(rows[0]);rows.forEach(flash);
}
function showCode(code){/* 목록에 없는(이미 완결된) 글 — 상세 패널로 */
  const d=document.getElementById("detail");const u=urlsFor(code);selTerm=null;
  d.hidden=false;d.innerHTML=`<h3>${esc(code)} <button class="btn" type="button" id="dclose">닫기</button></h3><div style="font-size:.82rem">게시된 곳: ${u||"기록 없음"}</div>`;
  document.getElementById("dclose").onclick=()=>{d.hidden=true;d.innerHTML=""};toText(d);flash(d);
}
/* 종착지 → 목록 위 상세 패널 */
function pickTerm(k){selTerm=selTerm===k?null:k;TERM.forEach(([kk])=>document.getElementById("nd-"+kk).classList.toggle("sel",kk===selTerm));renderDetail();
  if(selTerm){const d=document.getElementById("detail");toText(d);flash(d)}}
function renderDetail(){
  const d=document.getElementById("detail");if(!selTerm||!S){if(selTerm===null&&!d.dataset.code){d.hidden=true;d.innerHTML=""}return}
  const c=((S.channels||{})[selTerm])||{done:[],wait:[]},nm=TERM.find(t=>t[0]===selTerm)[1];
  d.hidden=false;
  d.innerHTML=`<h3>${nm} — 최근 3일 도착 ${c.done.length}편 · 대기 ${c.wait.length}편 <button class="btn" type="button" id="dclose">닫기</button></h3>`+
   `<h4>✅ 도착(게시 완료)</h4><ul>${c.done.length?c.done.map(x=>`<li><b>${esc(x.code)}</b> ${esc(x.title)} · ${esc((x.at||"").slice(5))} · <a href=${hq(x.url)} target="_blank" rel="noopener">열기 ↗</a></li>`).join(""):'<li class="w">아직 없음</li>'}</ul>`+
   `<h4>⏳ 아직 안 도착</h4><ul>${c.wait.length?c.wait.map(x=>`<li class="w"><b>${esc(x.code)}</b> ${esc(x.title)}</li>`).join(""):'<li class="w">대기 없음</li>'}</ul>`;
  document.getElementById("dclose").onclick=()=>pickTerm(selTerm);
}
/* 경보 배너 → 사고 지점 노드 + 목록 줄 */
function goAlert(){
  const a=lastAlert;if(!a)return;
  if(a.node==="top"){const k=document.getElementById("kp");toText(k);flash(k);return}
  focusStep(a.node);
  if(a.code){setTimeout(()=>focusRow(a.code),50)}
  const n=document.getElementById(a.node==="hub"?"hub":"nd-"+a.node);if(n&&n.scrollIntoView&&document.getElementById("gpanel").getBoundingClientRect().top<0)document.getElementById("gpanel").scrollIntoView({block:"start"});
}
function renderStrip(s){
  const inc=s.incidents||[],un=s.units||[];const keep=document.getElementById("strip").open;
  document.getElementById("ssum").textContent=`🚨 열린 사건 ${inc.length}건 · 유닛 ${un.length}개 (펼치기)`;
  document.getElementById("sbody").innerHTML=
   `<h3>사건</h3><ul>${inc.length?inc.map(i=>`<li class="c${i.p}"><b>코드${i.p}</b> ${esc(i.what)}${i.min!=null?" · "+fmtMin(i.min):""}</li>`).join(""):"<li>✅ 열린 사건 없음</li>"}</ul>`+
   `<h3>유닛</h3><ul>${un.map(u=>`<li class="${u.lvl==="red"?"c1":u.lvl==="amber"?"c2":""}"><b>${esc(u.who)}</b> ${esc(u.state)}${u.jobs!=null?" · 지시 "+u.jobs+"건":""}${u.last_min!=null?" · 마지막 소식 "+fmtMin(u.last_min)+" 전":""}${u.cur?"<br><span class=\"meta\">지금: "+esc(u.cur)+"</span>":""}</li>`).join("")}</ul>`+
   `<h3>최근 변경 로그</h3><ul>${(s.log||[]).slice(0,6).map(l=>`<li>${esc(l.at)} · 사건 ${l.n}건</li>`).join("")||"<li>기록 없음</li>"}</ul>`;
  document.getElementById("strip").open=keep;
}
function tickMin(){const dm=(Date.now()-loadedAt)/60000|0;document.querySelectorAll("[data-min]").forEach(e=>{e.textContent="경과 "+fmtMin(+e.dataset.min+dm)})}

/* ---------- ?demo=on 순환 · ?demo=0~7 고정 ---------- */
const DEMO_LAB=["평상시","① 글감 제안","② 처리 중(초안·V0)","③ 결재 대기 35분","④ 발행 개시","⑤ 블로그 도착 · 🚨 Aside 멈춤 사고","⑥ Aside 복구 → 네이버·인스타 도착","⑦ 쓰레드 도착 = 4채널 완결"];
function demo(s){
  const c=JSON.parse(JSON.stringify(s));c.nodes=c.nodes||{};c.channels=c.channels||{};c.kpi=c.kpi||{};c.topics=c.topics||[];
  const st=/^[0-7]$/.test(DEMO)?+DEMO:demoStep%8;const T=" [시험]";
  ["v0","boss","publish","osmu"].forEach(k=>c.nodes[k]=(c.nodes[k]||[]).filter(x=>!String(x.title||"").includes(T)));
  ["blog","naver","insta","threads"].forEach(k=>{c.channels[k]=c.channels[k]||{done:[],wait:[]}});
  const X={code:"X1-01",title:"가상 글감"+T};
  if(st===1)c.topics.unshift({code:"X1-01",title:X.title,src:"3.세션",state:"제안",at:c.at});
  if(st===2)c.nodes.v0=[{code:"X1-01",title:X.title,min:4,lvl:"ok"}];
  if(st===3)c.nodes.boss=[{code:"X1-01",title:X.title,min:35,lvl:"amber"}];
  if(st===4)c.nodes.publish=[{code:"X1-01",title:X.title,min:3,lvl:"ok"}];
  const done=(k,u)=>c.channels[k].done.unshift({code:"X1-01",title:X.title,url:u,at:(c.kpi.today||"")});
  if(st>=5){
    const ch={blog:true,naver:st>=6,insta:st>=6,threads:st>=7};
    const left=[["네이버","naver"],["인스타","insta"],["쓰레드","threads"]].filter(a=>!ch[a[1]]).map(a=>a[0]);
    const it={code:"X1-01",title:X.title,left,ch,lvl:left.length?"amber":"ok",last_at:c.kpi.today};
    if(left.length)c.nodes.osmu=[it].concat(c.nodes.osmu||[]);else{c.nodes.done=[it].concat(c.nodes.done||[]);c.kpi.done_today=(c.kpi.done_today||0)+1}
    c.kpi.published_today=(c.kpi.published_today||0)+1;
    done("blog","https://lifeinfo8975.blogspot.com/");if(ch.naver)done("naver","https://blog.naver.com/");if(ch.insta)done("insta","https://www.instagram.com/");if(ch.threads)done("threads","https://www.threads.com/");
    ["naver","insta","threads"].forEach(k=>{if(!ch[k])c.channels[k].wait.unshift({code:"X1-01",title:X.title})});
  }
  if(st===5){c.aside=Object.assign({},c.aside,{lvl:"red",busy:false,state:"멈춤 — 보고 없음 20분"+T});c.units=(c.units||[]).map(u=>u.who==="Aside"?Object.assign({},u,{state:"멈춤",lvl:"red"}):u)}
  c.at=s.at+" · 🧪 시험 "+st+"/7 — "+DEMO_LAB[st];
  demoStep++;return c}
async function load(){
  try{const r=await fetch("engine_state.json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);const s=await r.json();fetchOk=true;pingRadar();render(DEMO?demo(s):s)}
  catch(e){fetchOk=false;setLive();document.getElementById("at").textContent="상태 파일을 못 읽음("+e.message+") — 로컬 CP(localhost:8000)에서 열거나 배포 후 확인"}
}
document.getElementById("alarm").addEventListener("click",goAlert);
document.getElementById("alarm").addEventListener("keydown",ev=>{if(ev.key==="Enter")goAlert()});
document.getElementById("tg").onclick=()=>{const f=document.getElementById("flowfr");const on=f.style.display!=="block";if(on&&!f.src)f.src="engine_flow.html";f.style.display=on?"block":"none";document.getElementById("tg").textContent=on?"접기":"아래에 펼치기"};
function tick(){const d=new Date(),p=n=>String(n).padStart(2,"0");document.getElementById("clock").textContent=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());tickMin();setLive()}
let rz=0;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S&&!RP){const v=document.getElementById("gpanel").clientWidth<620;if(curLayout!==(v?"v":"h"))render(S)}},200)});
tick();setInterval(tick,1000);load();setInterval(load,DEMO&&!/^[0-7]$/.test(DEMO)?4500:20000);
</script>
