:root{--bg:#0f1626;--card:#16203a;--card2:#0c1220;--line:#2a3a5e;--txt:#e8edf7;--mut:#9fb0d0;--ok:#06d6a0;--warn:#ffd166;--bad:#ff5c5c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
/* 2026-08-13 사용자 지시: "운영관리 탭과 화면구성이 달라 일목요연하지 않다,
   KPI대시보드 형식으로" — 좁은 470px 팝업카드였던 걸 adsense.html·gsc.html과
   같은 넓은 KPI 대시보드 톤으로 바꾼다. #board 에 innerHTML 을 꽂는 JS 로직은
   그대로이고(같은 클래스명), 여기 CSS만 넓혀서/키워서 통일한다. */
/* 2026-08-13 재수정 — "가운데로 화면이 몰려있잖아!": gsc·batch·seo 등 나머지

   패턴이었다. 폭 제한을 없애 화면을 꽉 채운다. */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px;width:100%}
.hd{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:19px;font-weight:700}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(6,214,160,.16);color:var(--ok)}
.b-warn{background:rgba(255,209,102,.16);color:var(--warn)}
.b-bad{background:rgba(255,92,92,.16);color:var(--bad)}
.sec{font-size:13px;color:#9db0c6;font-weight:800;letter-spacing:.02em;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
/* KPI 카드 그리드 — adsense.html 의 .kpi-grid 와 같은 형식으로 통일 */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 6px}
.m{background:var(--card2);border:1px solid var(--line);border-top:3px solid #3a4a63;border-radius:12px;padding:12px 14px}
.m .l{font-size:11.5px;color:var(--mut);font-weight:700}
.m .v{font-size:24px;font-weight:800;margin-top:3px;line-height:1.2}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #243049;font-size:12.5px}

li.wait svg{color:#4a586e}
.num{font-size:11px;color:#6b7a99;width:16px;text-align:right;flex:none}

.who.me{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.lbl{font-size:12.5px}

.banner{display:none;margin-top:9px;background:#0c3a2c;border:1px solid #1f6b52;color:#06d6a0;border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12.5px}

.prow{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px dashed #243049;font-size:11.5px}

 코드를 비교 대상에서 빼는데 그 매핑을 DB(lifeinfo_db.txt)에서 찾는다. 라이브 발행은 됐는데 register_post 가 아직 안 돌면 DB 에 코드가 없어 **자기 자신과 비교**하게 되고 1.00 에 가까운 점수가 나온다(비교 편수도 192 vs 193 으로 갈렸다). 즉 '발행 직후 register_post 전' 이라는 창에서만 나오는 거짓 차단이다. ⚠️영향: fail-closed 게이트라 사람이 이 메시지를 보면 정당한 발행을 되돌릴 수 있다 — 실제로 나도 잠깐 F4-12 를 중복으로 오해했다. 처방 후보: ①bodydup 이 DB 대신 라이브 URL 로 자기 글을 식별 ②DB 에 코드가 없는데 제목이 라이브와 거의 같으면 '발행 직후일 수 있음' 으로 안내 문구를 바꾸기. 지금은 운영 규칙으로 대응: 발행 직후 게이트를 다시 돌리지 말고, 돌렸다면 register_post 후 재확인할 것.","🔑 gh CLI 설치 완료 (2026-08-08). winget install GitHub.cli → 2.97.0, C:\\Program Files\\GitHub CLI\\gh.exe. 인증은 아직 없음(gh auth status = not logged in) — 사용자가 프롬프트에 '! gh auth login' 1회 실행 필요. ⚠️문서 여러 곳에 'gh 가 없어 Actions 로그를 확인 못 함'(watch label-at-publish 등)이라 적혀 있는데 이제 틀린 서술이 된다 — 인증까지 끝나면 Actions 로그 확인·워크플로 트리거가 전부 터미널에서 된다. 계기: 사용자 지시로 발행대기 4편을 Fold 가 발행하려 했으나 ①pipeline.py:289 가 로컬 --publish 차단 ②웹 Actions 의 Run workflow 폼이 브라우저 자동화에서 3회 모두 'There was an error while loading' 로 실패 → 남은 경로가 gh 뿐이었다. 🔴'웹이 죽었다'고 단정하지 말 것 — 사람이 직접 누르면 될 수 있고, 내 자동화 쪽 문제일 가능성이 남아 있다(미확인).","[팩트체크] [야간검증] 오늘 발행 2편(F4-12 서울고궁관람료·orphan 국립공원탐방로예약제) 팩트체크 완료 — 둘 다 공식출처(royal.khs.go.kr, res.knps.or.kr) 대조 결과 오류 없음. F4-12: 관람료·통합관람권 6000원/6개월·후원 예약창구 전부 일치. 탐방로예약제: 노고단1870명·우이령1190명(주말공휴일)·흘림골5000명(시간지정제)·마감(전날14시)·노쇼페널티(1회1개월/2회이상3개월)·월4건제한 전부 res.knps.or.kr 환불정책 페이지와 일치.","[팩트체크] [야간검증] 기존글 3편 위험순위 검증(B4-05 퇴직금·C1-04 건보수가·D2-03 K패스) 중 D2-03에서 오류 발견. 🔴D2-03 K패스: 라이브가 평시 환급률(일반20%·청년30%·저소득53%)만 서술하는데, 2026.3.31 국무회의 통과 추경으로 2026.4.1~9.30 이용분에 한해 환급률이 한시 인상됨(일반20→30%·청년등30→45%·3자녀50→75%·저소득53→83%, 예산877억원). 오늘 8/8은 그 기간 안이라 라이브 수치가 독자의 실제 환급액보다 10~30%p 낮게 안내되는 중. 출처: 2026-03-31 국무회의 추경안 보도(다수 매체 교차확인, 예산액·기간·인상폭 일치). 라이브 수정은 사용자 승인 게이트 — 이 세션은 미수정. B4-05(근속연수공제·환산급여공제 표·14일지급·연20%지연이자, NTS 공식페이지 대조)·C1-04(진찰료 인상률 6/4/2%, 2026 수가혁신방안 발표 기사 대조)는 오류 0건. 오늘 발행 2편(F4-12·orphan 탐방로예약제)도 검증 완료(오류 0건, 별도 기록). D2-03은 다음 대면 세션에서 라이브에 한시 인상 안내 박스 추가 검토 필요 — watch 항목으로 남김.","[색인] [색인] crawl-watch 확인: D2-10·D4-07(8/06 색인요청한 신규 2편) 아직 lastCrawl 없음(2026-08  a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#8a97ab;text-decoration:none;margin:2px 0 6px}\n.lsg .warn{background:#fff4f2;border:1px solid #f6cfc6;border-radius:12px;padding:14px 18px;margin:14px 0}\n.lsg .warn b{display:block;font-size:15px;color:#c0442a;margin-bottom:6px}\n.lsg .tip{background:#eefaf4;border:1px solid #cfeadd;border-radius:12px;padding:14px 18px;margin:14px 0}\n.lsg .tip b{display:block;font-size:15px;color:#1a8c5e;margin-bottom:6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">생활·행정<\/span>\n<p>가을 이사철이 시작되면 전월세 계약서를 쓰는 분이 많아집니다. 그런데 <b>계약서에 도장을 찍은 날부터 시계가 돌아가는 신고 의무<\/b>가 하나 있습니다. <b>주택 임대차 계약 신고제<\/b>, 흔히 <b>전월세 신고제<\/b>라고 부르는 것입니다.<\/p>\n<p>중요한 것은 <b>2021년 6월부터 2025년 5월까지 4년간 이어지던 과태료 계도기간이 이미 끝났다<\/b>는 점입니다. 유예가 있던 시절에 이사를 해 본 경험만 가지고 \"안 해도 별일 없더라\"라고 생각하면 지금은 다릅니다.<\/p>\n<p>이 글은 국토교통부 <b>부동산거래관리시스템(RTMS)<\/b>과 법제처 <b>찾기쉬운 생활법령정보<\/b>의 공식 안내만 가지고 <b>①내 계약이 신고 대상인지 판정하는 법 ②신고 안 해도 되는 계약(가장 많이 틀리는 자리) ③인터넷으로 끝내는 절차 ④확정일자가 자동으로 붙는 범위와 안 붙는 범위 ⑤30일을 넘겼을 때 과태료<\/b>를 정리했습니다. 확인일은 <b>2026년 8월 15일<\/b>입니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 내 계약도 신고 대상인가 — 금액·지역 2단 판정<\/a><a href=\"#sec2\">2. 신고 안 해도 되는 계약 (탈락 사유)<\/a><a href=\"#sec3\">3. 언제까지 — 계약 체결일부터 30일<\/a><a href=\"#sec4\">4. 인터넷으로 끝내는 절차 — 두 가지 경로<\/a><a href=\"#sec5\">5. 확정일자 자동 부여 — 붙는 범위와 안 붙는 범위<\/a><a href=\"#sec6\">6. 전입신고·확정일자·임대차신고 3종 비교<\/a><a href=\"#sec7\">7. 30일을 넘겼다면 — 과태료<\/a><a href=\"#sec8\">8. 계약이 바뀌거나 깨졌을 때도 신고합니다<\/a><a href=\"#sec9\">9. 놓치기 쉬운 함정 6가지<\/a><a href=\"#sec10\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec1\">👉 내 계약이 신고 대상인지 먼저 판정하기<\/a>\n\n<h2 id=\"sec1\">1. 내 계약도 신고 대상인가 — 금액·지역 2단 판정<\/h2>\n<p>신고 대상은 <b>금액<\/b>과 <b>지역<\/b> 두 가지를 <b>모두<\/b> 만족해야 합니다. 하나라도 걸리지 않으면 신고 의무가 없습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>판정 단계<\/th><th>기준<\/th><\/tr>\n<tr><td><b>1단계 · 금액<\/b><\/td><td><b>보증금 6천만원 초과<\/b> <b style=\"color:#c0442a\">또는<\/b> <b>월 차임(월세) 30만원 초과<\/b><br><span style=\"font-size:13px\">둘 중 하나만 넘어도 대상<\/span><\/td><\/tr>\n<tr><td><b>2단계 · 지역<\/b><\/td><td>수도권 전역(<b>서울·경기도·인천<\/b>) · <b>광역시<\/b> · <b>세종시<\/b> · <b>제주시<\/b> · <b>도(道)의 시(市) 지역<\/b><br><span style=\"font-size:13px\">도 지역의 <b>군(郡)<\/b>은 제외<\/span><\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ '또는'입니다 — 여기서 가장 많이 틀립니다<\/b><p style=\"margin:6px 0 0\">\"보증금도 크고 월세도 비싸야 신고 대상\"이라고 오해하는 경우가 많습니다. 공식 기준은 <b>보증금 6천만원 초과 <u>또는<\/u> 월세 30만원 초과<\/b>입니다. <b>둘 중 하나만 넘어도 신고 대상<\/b>이고, <b>둘 다 기준 이하일 때만<\/b> 대상에서 빠집니다.<\/p><\/div>\n<div class=\"tip\"><b>🧮 내 계약으로 판정해 보기<\/b>\n<div class=\"tw\"><table style=\"margin-top:8px\">\n<tr><th>계약 조건<\/th><th>지역<\/th><th>판정<\/th><\/tr>\n<tr><td>보증금 5,000만원 / 월세 0원(전세)<\/td><td>서울<\/td><td>❌ 대상 아님<br><span style=\"font-size:13px\">보증금 6천만원 이하 · 월세 없음<\/span><\/td><\/tr>\n<tr><td>보증금 5,000만원 / 월세 <b>35만원<\/b><\/td><td>서울<\/td><td>✅ <b>대상<\/b><br><span style=\"font-size:13px\">보증금은 기준 이하지만 <b>월세가 30만원 초과<\/b><\/span><\/td><\/tr>\n<tr><td>보증금 <b>1억원<\/b> / 월세 0원(전세)<\/td><td>인천<\/td><td>✅ <b>대상<\/b><br><span style=\"font-size:13px\">월세가 없어도 <b>보증금이 6천만원 초과<\/b><\/span><\/td><\/tr>\n<tr><td>보증금 3,000만원 / 월세 25만원<\/td><td>대전(광역시)<\/td><td>❌ 대상 아님<br><span style=\"font-size:13px\">둘 다 기준 이하<\/span><\/td><\/tr>\n<tr><td>보증금 <b>2억원<\/b> / 월세 0원<\/td><td>강원도 <b>양양군<\/b><\/td><td>❌ 대상 아님<br><span style=\"font-size:13px\">금액은 넘지만 <b>도 지역의 군<\/b>은 제외<\/span><\/td><\/tr>\n<tr><td>보증금 8,000만원 / 월세 20만원<\/td><td>경상남도 <b>양산시<\/b><\/td><td>✅ <b>대상<\/b><br><span style=\"font-size:13px\">도의 <b>시<\/b> 지역 + 보증금 초과<\/span><\/td><\/tr>\n<\/table><\/div>\n<p style=\"margin:8px 0 0\"><b>전세도 신고 대상입니다.<\/b> 이름이 '전월세 신고제'라서 월세만 해당한다고 오해하기 쉬운데, 보증금이 6천만원을 넘으면 순수 전세도 신고해야 합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 신고 안 해도 되는 계약 (탈락 사유)<\/h2>\n<p>신고 의무가 <b>없는<\/b> 경우를 먼저 아는 것이 실무에서는 더 빠릅니다. 공식 안내가 제외로 정하고 있는 자리는 아래와 같습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>제외되는 경우<\/th><th>왜 제외인가<\/th><\/tr>\n<tr><td><b>보증금 6천만원 이하 <u>이면서<\/u> 월세 30만원 이하<\/b>인 계약<\/td><td>금액 기준 자체를 못 넘음<\/td><\/tr>\n<tr><td><b>도(道) 지역의 군(郡)<\/b>에 있는 주택<\/td><td>신고 대상 지역이 아님<\/td><\/tr>\n<tr><td><b>계약 금액에 변동이 없는 갱신계약<\/b><\/td><td>새로 신고할 내용이 없음<\/td><\/tr>\n<tr><td><b>주된 거처가 따로 있는 일시적·단기 거주<\/b><br><span style=\"font-size:13px\">예: 단기 체험 목적 거주<\/span><\/td><td>주거 목적의 임대차로 보지 않음<\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 갱신계약은 \"금액이 그대로일 때만\" 제외입니다<\/b><p style=\"margin:6px 0 0\">계약을 연장하면서 <b>보증금이나 월세를 한 푼이라도 올리거나 내렸다면 신고 대상<\/b>입니다. \"재계약이니까 안 해도 된다\"가 아니라 <b>\"금액이 안 바뀐 재계약이라야 안 해도 된다\"<\/b>가 정확한 문장입니다. 가을 이사철에는 이사 대신 <b>인상 재계약<\/b>을 하는 경우가 많은데, 이쪽이 오히려 놓치기 쉽습니다.<\/p><\/div>\n<p>기숙사비처럼 주거 목적 임대차로 보기 어려운 계약도 제외로 안내되고 있습니다. <b>내 계약이 제외에 해당하는지 애매하면 신고해 두는 편이 안전합니다<\/b> — 신고 자체에는 수수료가 없고, 대상이 아닌 계약을 신고했다고 해서 불이익이 생기지 않습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 언제까지 — 계약 체결일부터 30일<\/h2>\n<p>기한은 <b>임대차 계약 체결일부터 30일 이내<\/b>입니다. 이 글에서 가장 자주 오해되는 지점이 여기입니다.<\/p>\n<div class=\"warn\"><b>⚠️ 기준일은 '이사한 날'도 '잔금일'도 아닙니다<\/b><p style=\"margin:6px 0 0\">기산점은 <b>계약을 체결한 날<\/b>, 즉 <b>계약서에 서명·날인한 날<\/b>입니다. 계약서를 8월에 쓰고 10월에 입주하는 경우, <b>신고 기한은 9월에 이미 끝납니다.<\/b> 입주할 때 전입신고와 함께 처리하면 된다고 미뤄 두면 그 사이에 30일이 지나갑니다. 가을 이사철에 이 사고가 가장 많이 납니다.<\/p><\/div>\n<ul>\n<li>신고는 <b>임대인과 임차인이 공동으로<\/b> 하는 것이 원칙이며, <b>위임신고<\/b>도 가능합니다.<\/li>\n<li>다만 <b>임대차계약서를 첨부<\/b>하면 <b>어느 한쪽이 단독으로<\/b> 신고할 수 있습니다. 실무에서는 대부분 이 경로를 씁니다.<\/li>\n<li><b>신고 수수료는 없습니다.<\/b><\/li>\n<\/ul>\n<p>공인중개사를 통해 계약했다면 중개사무소에서 신고를 대행해 주는 경우가 많지만, <b>신고 의무 자체는 계약 당사자에게 있습니다.<\/b> \"중개사가 해 주기로 했다\"는 말만 믿지 말고 <b>접수 완료 여부를 직접 확인<\/b>하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 인터넷으로 끝내는 절차 — 두 가지 경로<\/h2>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>온라인<\/th><th>방문<\/th><\/tr>\n<tr><td><b>어디서<\/b><\/td><td><b>부동산거래관리시스템(RTMS)<\/b><br>또는 <b>부동산 전자계약시스템<\/b><\/td><td>임대차 목적물 <b>소재지 관할 주민센터<\/b><\/td><\/tr>\n<tr><td><b>관할<\/b><\/td><td colspan=\"2\">주택 소재지의 <b>시장·군수·구청장<\/b>(읍·면·동 주민센터에서 처리)<br><span style=\"font-size:13px\">내가 사는 동네가 아니라 <b>계약한 집이 있는 동네<\/b>가 기준<\/span><\/td><\/tr>\n<tr><td><b>준비물<\/b><\/td><td>임대차계약서 파일(스캔·촬영) + 본인인증 수단<\/td><td>임대차계약서 + 신분증<\/td><\/tr>\n<tr><td><b>수수료<\/b><\/td><td colspan=\"2\"><b>없음<\/b><\/td><\/tr>\n<\/table><\/div>\n<h3>온라인 신고 순서<\/h3>\n<ol>\n<li><b>rtms.molit.go.kr<\/b> 접속 → 로그인(공동인증서·간편인증 등 본인인증)<\/li>\n<li><b>임대차 신고<\/b> 메뉴 선택 → 주택 소재지의 <b>시·군·구<\/b> 선택<\/li>\n<li>임대인·임차인 정보, 주택 정보, <b>보증금·월 차임·계약기간<\/b> 입력<\/li>\n<li><b>임대차계약서 파일 첨부<\/b>(단독신고 시 필수)<\/li>\n<li>제출 → 접수 완료 후 <b>신고필증 확인·출력<\/b><\/li>\n<\/ol>\n<div class=\"tip\"><b>💡 신고필증은 꼭 받아 두세요<\/b><p style=\"margin:6px 0 0\">신고가 처리되면 <b>주택 임대차 계약 신고필증<\/b>이 발급됩니다. 이것이 <b>기한 내에 신고했다는 유일한 증거<\/b>이자, 확정일자 부여 사실을 확인하는 자료입니다. 접수만 해 놓고 처리 결과를 확인하지 않으면, 서류 미비로 반려됐을 때 그대로 기한을 넘기게 됩니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 확정일자 자동 부여 — 붙는 범위와 안 붙는 범위<\/h2>\n<p>임대차 신고제의 가장 큰 실익은 <b>확정일자가 자동으로 붙는다<\/b>는 점입니다. 그런데 <b>모든 신고에 자동으로 붙는 것이 아닙니다.<\/b> 여기가 이 제도에서 제일 위험한 함정입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>내가 한 신고<\/th><th>확정일자<\/th><\/tr>\n<tr><td><b>임대차계약서를 첨부<\/b>해서 신고<br><span style=\"font-size:13px\">(온라인 단독신고의 표준 경로)<\/span><\/td><td>✅ <b>자동 부여<\/b><\/td><\/tr>\n<tr><td>계약서 <b>없이<\/b> 신고 내용만 제출<br><span style=\"font-size:13px\">(공동신고 등에서 계약서를 첨부하지 않은 경우)<\/span><\/td><td>❌ <b>부여되지 않음<\/b><br><span style=\"font-size:13px\">확정일자를 따로 받아야 함<\/span><\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ \"신고했으니 확정일자는 됐겠지\"가 보증금을 위험하게 만듭니다<\/b><p style=\"margin:6px 0 0\">확정일자는 <b>보증금에 우선변제권을 붙여 주는 장치<\/b>입니다. 임대차 신고를 하면서 <b>계약서를 첨부하지 않았다면 확정일자는 부여되지 않습니다.<\/b> 신고는 했는데 확정일자가 없는 상태로 몇 달을 보내다가, 그 사이 주택에 근저당이 잡히면 순위에서 밀립니다.<\/p><p style=\"margin:8px 0 0\"><b>확인 방법은 하나입니다 — 신고필증에 확정일자 부여 사실이 표시돼 있는지 직접 볼 것.<\/b> 표시가 없으면 주민센터나 등기소에서 확정일자를 별도로 받으세요.<\/p><\/div>\n<p>그리고 확정일자만으로는 부족합니다. 대항력을 갖추려면 <b>주택의 인도(입주)<\/b>와 <b>전입신고<\/b>가 함께 있어야 합니다. 절차 자체는 <a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_546.html\">전입신고 인터넷 신청 방법 확정일자 받기 총정리<\/a>에서 단계별로 다뤘습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 전입신고·확정일자·임대차신고 3종 비교<\/h2>\n<p>세 가지가 이름이 비슷해서 <b>\"하나 했으니 나머지도 된 것\"<\/b>으로 착각하기 쉽습니다. 목적이 서로 다릅니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>전입신고<\/th><th>확정일자<\/th><th>주택 임대차 신고<\/th><\/tr>\n<tr><td><b>왜 하나<\/b><\/td><td>대항력<br><span style=\"font-size:13px\">집이 팔려도 계속 살 권리<\/span><\/td><td>우선변제권<br><span style=\"font-size:13px\">보증금을 순위대로 돌려받을 권리<\/span><\/td><td><b>법정 신고 의무<\/b><br><span style=\"font-size:13px\">임대차 시장 정보 투명화<\/span><\/td><\/tr>\n<tr><td><b>의무인가<\/b><\/td><td>주민등록법상 의무<br>(이사 후 14일 이내)<\/td><td>의무 아님<br>(내 보증금을 지키는 선택)<\/td><td><b>의무<\/b><br>(계약 후 30일 이내)<\/td><\/tr>\n<tr><td><b>안 하면<\/b><\/td><td>대항력 없음<br>+ 주민등록법상 과태료<\/td><td>우선변제권 없음<br><span style=\"font-size:13px\">과태료는 없음<\/span><\/td><td><b>과태료<\/b><\/td><\/tr>\n<tr><td><b>어디서<\/b><\/td><td>정부24 · 주민센터<\/td><td>주민센터 · 등기소<br>· 대법원 인터넷등기소<\/td><td><b>RTMS<\/b> · 주민센터<\/td><\/tr>\n<tr><td><b>서로 대체되나<\/b><\/td><td colspan=\"3\"><b>대체되지 않습니다.<\/b> 다만 <b>임대차 신고 시 계약서를 첨부하면 확정일자가 자동 부여<\/b>되므로 <b>확정일자 절차 하나만<\/b> 생략됩니다. <b>전입신고는 별도로 반드시 해야 합니다.<\/b><\/td><\/tr>\n<\/table><\/div>\n<div class=\"tip\"><b>💡 이사철 순서 정리<\/b><ul style=\"margin:6px 0 0\"><li><b>계약서 쓴 날부터 30일 이내<\/b> → 주택 임대차 신고(계약서 첨부 = 확정일자 동시 해결)<\/li><li><b>입주(이사)한 날부터 14일 이내<\/b> → 전입신고<\/li><li>확정일자가 신고로 붙지 않았다면 → <b>입주 전에<\/b> 따로 받아 둘 것<\/li><\/ul><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 30일을 넘겼다면 — 과태료<\/h2>\n<p>먼저 <b>계도기간이 끝났다<\/b>는 사실부터 확인하고 넘어가야 합니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>내용<\/th><\/tr>\n<tr><td><b>계도기간<\/b><\/td><td><b>2021년 6월 1일 ~ 2025년 5월 31일<\/b> — 이 기간에는 과태료가 부과되지 않았음<br><span style=\"font-size:13px;color:#c0442a\"><b>현재는 종료된 상태입니다<\/b><\/span><\/td><\/tr>\n<tr><td><b>미신고·지연신고<\/b><\/td><td>국토교통부 안내 기준 <b>2만원 ~ 30만원 이하<\/b>의 과태료<br><span style=\"font-size:13px\">지연 기간·금액에 따라 차등<\/span><\/td><\/tr>\n<tr><td><b>거짓 신고<\/b><\/td><td><b>100만원 이하<\/b>의 과태료<\/td><\/tr>\n<tr><td><b>법률상 상한<\/b><\/td><td>신고를 하지 않거나 거짓으로 신고한 자는 <b>100만원 이하<\/b>의 과태료<br><span style=\"font-size:13px\">「부동산 거래신고 등에 관한 법률」<\/span><\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 지연 기간별 정확한 부과 금액은 공식 페이지에서 확인하세요<\/b><p style=\"margin:6px 0 0\">과태료는 <b>지연 기간과 계약 금액에 따라 구간별로 차등 부과<\/b>되며, 세부 구간표는 「부동산 거래신고 등에 관한 법률 시행령」 별표에 규정돼 있습니다. <b>이 글에서는 구간별 금액을 임의로 적지 않습니다.<\/b> 실제로 부과될 금액은 <b>관할 주민센터 또는 국토교통부 부동산거래관리시스템<\/b>에서 확인하시기 바랍니다.<\/p><\/div>\n<div class=\"tip\"><b>💡 늦었어도 지금 신고하는 편이 낫습니다<\/b><p style=\"margin:6px 0 0\">과태료는 <b>지연 기간이 길수록 무거워지는 구조<\/b>입니다. 30일이 이미 지났다면 미루는 만큼 불리해집니다. 또한 <b>확정일자는 신고한 날에 부여<\/b>되므로, 신고를 미루는 동안은 <b>우선변제권도 생기지 않은 상태<\/b>입니다. 과태료보다 이쪽이 훨씬 큰 위험입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 계약이 바뀌거나 깨졌을 때도 신고합니다<\/h2>\n<p>신고 의무는 <b>최초 계약 한 번으로 끝나지 않습니다.<\/b><\/p>\n<div class=\"tw\"><table>\n<tr><th>상황<\/th><th>신고 의무<\/th><th>기한<\/th><\/tr>\n<tr><td><b>보증금·차임이 변경<\/b>된 경우<br><span style=\"font-size:13px\">인상·인하 모두<\/span><\/td><td>✅ <b>변경 신고<\/b><\/td><td>변경이 확정된 날부터 <b>30일 이내<\/b><\/td><\/tr>\n<tr><td><b>계약이 해제<\/b>된 경우<\/td><td>✅ <b>해제 신고<\/b><\/td><td>해제가 확정된 날부터 <b>30일 이내<\/b><\/td><\/tr>\n<tr><td>금액 변동 <b>없이<\/b> 기간만 연장<\/td><td>❌ 신고 대상 아님<\/td><td>—<\/td><\/tr>\n<\/table><\/div>\n<p>변경·해제 신고도 <b>공동 신고가 원칙<\/b>이며, 한쪽이 신고를 거부하면 <b>단독 신고<\/b>가 가능합니다. 계약 해제 후 신고를 하지 않으면 <b>전산상 임대차 관계가 남아 있는 상태<\/b>가 되므로, 임대인 입장에서도 정리해 두는 편이 안전합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 놓치기 쉬운 함정 6가지<\/h2>\n<ol>\n<li><b>기준은 '또는'입니다.<\/b> 보증금 6천만원 초과 <b>또는<\/b> 월세 30만원 초과 — 하나만 넘어도 대상입니다.<\/li>\n<li><b>전세도 신고 대상입니다.<\/b> 보증금이 6천만원을 넘으면 월세가 0원이어도 신고해야 합니다.<\/li>\n<li><b>기산점은 계약서를 쓴 날입니다.<\/b> 이사한 날이 아닙니다. 계약과 입주 사이가 길면 입주 전에 기한이 끝납니다.<\/li>\n<li><b>계약서를 첨부하지 않으면 확정일자가 안 붙습니다.<\/b> 신고필증에서 반드시 확인하세요.<\/li>\n<li><b>전입신고는 따로 해야 합니다.<\/b> 임대차 신고가 전입신고를 대신하지 않습니다.<\/li>\n<li><b>금액이 바뀐 재계약은 신고 대상입니다.<\/b> \"재계약이라 안 해도 된다\"는 <b>금액이 그대로일 때만<\/b> 맞는 말입니다.<\/li>\n<\/ol>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">공식 확인 페이지<\/h2>\n<p>신고 대상 지역·금액 기준과 과태료 부과 기준은 아래 공식 창구에서 직접 확인하세요.<\/p>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://rtms.molit.go.kr\" target=\"_blank\" rel=\"nofollow\">▸ 국토교통부 부동산거래관리시스템(RTMS) — 임대차 신고<\/a><a href=\"https://rtms.molit.go.kr/main/serviceInfo.do\" target=\"_blank\" rel=\"nofollow\">▸ RTMS 주택임대차계약신고 서비스 안내<\/a><a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&csmSeq=629&ccfNo=2&cciNo=2&cnpClsNo=5\" target=\"_blank\" rel=\"nofollow\">▸ 법제처 찾기쉬운 생활법령정보 — 주택 임대차 계약 신고제<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">주택 임대차 신고는 <b>보증금 6천만원 초과 또는 월세 30만원 초과<\/b> 계약을 <b>계약 체결일부터 30일 이내<\/b>에 신고하는 <b>법정 의무<\/b>입니다. 대상 지역은 수도권 전역·광역시·세종·제주시·도의 시 지역이며 <b>도 지역의 군은 제외<\/b>됩니다. <b>2021년 6월부터 2025년 5월까지의 계도기간은 이미 끝났습니다.<\/b> 온라인은 <b>rtms.molit.go.kr<\/b>에서 계약서를 첨부해 단독으로 신고할 수 있고, 이때 <b>확정일자가 자동 부여<\/b>됩니다. 다만 <b>계약서를 첨부하지 않으면 확정일자는 붙지 않고, 전입신고는 어떤 경우에도 따로 해야 합니다.<\/b> 계약서를 쓴 그 주에 신고까지 끝내 두는 것이 가장 안전합니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월<\/b> 기준(확인일 2026년 8월 15일)이며, 국토교통부 부동산거래관리시스템(RTMS) 공식 서비스 안내와 법제처 찾기쉬운 생활법령정보의 「주택 임대차 계약 신고제」 안내를 근거로 작성했습니다. 본문의 과태료 범위(미신고·지연 2만원~30만원, 거짓신고 100만원 이하)는 <b>RTMS 공식 서비스 안내에 표기된 값<\/b>입니다. 다만 <b>지연 기간·계약 금액별 구간 산정표는 공식 확인이 되지 않아 본문에 싣지 않았습니다<\/b> — 내 계약에 실제로 부과될 금액은 관할 주민센터 또는 아래 공식 페이지에서 확인하세요.<br>출처: <a href=\"https://rtms.molit.go.kr/main/serviceInfo.do\" target=\"_blank\" rel=\"nofollow\">국토교통부 부동산거래관리시스템 — 주택임대차계약신고 서비스 안내<\/a> · <a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&csmSeq=629&ccfNo=2&cciNo=2&cnpClsNo=5\" target=\"_blank\" rel=\"nofollow\">법제처 찾기쉬운 생활법령정보 — 주택 임대차 계약 신고제<\/a><\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_546.html\">▸ 전입신고 인터넷 신청 방법 확정일자 받기 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/hug-hf-sgi-2026.html\">▸ r:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#8a97ab;text-decoration:none;margin:2px 0 6px}\n.lsg .warn{background:#fff4f2;border:1px solid #f6cfc6;border-radius:12px;padding:14px 18px;margin:14px 0}\n.lsg .warn b{display:block;font-size:15px;color:#c0442a;margin-bottom:6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>설악산 권금성으로 올라가는 <b>설악 케이블카<\/b>는 왕복 <b>대인 16,000원 · 소인 12,000원<\/b>입니다. 그런데 요금보다 먼저 알아야 할 것이 있습니다. <b>이 케이블카는 예약이 안 됩니다.<\/b> 인터넷으로도, 전화로도 미리 표를 잡아둘 수 없고 <b>탑승 당일 1층 매표소에서 직접 사는 방법 하나뿐<\/b>입니다. 운영사 공식 안내에 \"사전 예약은 받지 않으며 당일 현장 구매만 가능하다\"고 그대로 적혀 있습니다.<\/p>\n<p>두 번째로 놓치기 쉬운 것이 <b>경로우대 할인입니다.<\/b> 만 65세 이상은 14,000원인데, <b>성수기에는 이 할인이 적용되지 않습니다.<\/b> 2026년 할인 비적용 기간은 <b>7월 18일~8월 23일<\/b>과 <b>9월 19일~11월 15일<\/b>입니다. 즉 <b>설악산 단풍이 가장 좋은 시기 전체가 경로우대 제외 구간<\/b>이라, 그때 가시면 65세 이상도 16,000원을 내셔야 합니다. 반대로 장애·국가유공자·속초시민 할인은 <b>연중 상시<\/b> 적용됩니다.<\/p>\n<p>이 글은 설악 케이블카 <b>공식 이용안내 페이지<\/b>를 직접 확인해 <b>요금표 전체와 우리 가족 총액 계산, 할인 비적용 기간, 환불 규정, 운행시간 확인 방법, 현장에서 당황하는 함정(편도 없음·하행 등산로 없음·유모차 불가·반려동물 불가)<\/b>까지 정리했습니다. 주차요금처럼 운영사가 \"우리와 무관하다\"고 밝힌 항목은 <b>금액을 싣지 않고 문의처만<\/b> 적었습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 예약이 안 됩니다 — 당일 현장 구매만<\/a><a href=\"#sec2\">2. 요금표 전체와 우리 가족 총액 계산<\/a><a href=\"#sec3\">3. 단풍철엔 경로우대가 빠집니다 (할인 비적용 기간)<\/a><a href=\"#sec4\">4. 운행시간은 매일 바뀝니다 — 확인하는 자리<\/a><a href=\"#sec5\">5. 입장료·주차 — 무엇이 무료이고 무엇이 아닌가<\/a><a href=\"#sec6\">6. 환불·시간 변경 규정<\/a><a href=\"#sec7\">7. 현장에서 당황하는 8가지<\/a><a href=\"#sec8\">8. 대기 줄을 줄이는 판단<\/a><a href=\"#sec9\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec2\">👉 우리 가족은 얼마 드는지 먼저 계산해 보기<\/a>\n\n<h2 id=\"sec1\">1. 예약이 안 됩니다 — 당일 현장 구매만<\/h2>\n<p>가장 많이 헛걸음하는 지점입니다. 설악 케이블카는 <b>사전 예약 제도가 아예 없습니다.<\/b> 공식 FAQ의 답변은 한 줄입니다 — \"케이블카는 사전 예약이 없으며 당일 현장구매만 가능합니다.\" 이유도 함께 밝히고 있는데, <b>기상 변동에 따라 운행이 수시로 중단될 수 있기 때문<\/b>입니다. 강풍·악천후 시에는 안전을 위해 운행이 멈추고, 이 경우 사용하지 않은 탑승권은 전액 환불됩니다.<\/p>\n<p>따라서 현장 순서는 이렇게 고정됩니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>순서<\/th><th>장소<\/th><th>할 일<\/th><\/tr>\n<tr><td>1<\/td><td>문화재구역 입구<\/td><td>통과 <b>(입장료 없음)<\/b><\/td><\/tr>\n<tr><td>2<\/td><td>소공원 입구<\/td><td>도보 <b>약 5분<\/b> 이동<\/td><\/tr>\n<tr><td>3<\/td><td>케이블카 1층 매표소<\/td><td><b>여기서 티켓 구매<\/b> · 대기 발생 가능<\/td><\/tr>\n<tr><td>4<\/td><td>2층 탑승장<\/td><td>탑승시간 <b>5분 전<\/b>까지 이동<\/td><\/tr>\n<tr><td>5<\/td><td>권금성 도착<\/td><td>관람 후 <b>하행 케이블카로 복귀<\/b><\/td><\/tr>\n<\/table><\/div>\n<p>매표소에서 표를 사면 <b>탑승 시간이 지정<\/b>됩니다. 그래서 \"표만 사두고 근처에서 밥 먹고 오면 되겠지\" 하다가 시간을 놓치면 수수료가 붙습니다(6번 항목 참고). 티켓을 산 뒤에는 그 시간 기준으로 움직이셔야 합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 목차로<\/a>\n\n<h2 id=\"sec2\">2. 요금표 전체와 우리 가족 총액 계산<\/h2>\n<p>공식 요금표 그대로입니다. <b>모든 요금은 왕복 기준<\/b>이고 부가세가 포함된 금액입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>대상<\/th><th>요금(왕복)<\/th><\/tr>\n<tr><td>대인<\/td><td>중학생 이상<\/td><td><b>16,000원<\/b><\/td><\/tr>\n<tr><td>소인<\/td><td>36개월 ~ 초등학생<\/td><td><b>12,000원<\/b><\/td><\/tr>\n<tr><td>유아<\/td><td>36개월 미만<\/td><td><b>무료<\/b><\/td><\/tr>\n<tr><td>대인 할인<\/td><td>국가유공자, 장애 중증 및 1·2급<\/td><td>13,000원<\/td><\/tr>\n<tr><td>소인 할인<\/td><td>장애 중증 및 1·2급<\/td><td>9,500원<\/td><\/tr>\n<tr><td>경로우대<\/td><td>만 65세 이상 <b>(성수기 제외)<\/b><\/td><td>14,000원<\/td><\/tr>\n<tr><td>속초시민 대인<\/td><td>속초시 거주 증빙 · 1인 1매<\/td><td>8,000원<\/td><\/tr>\n<tr><td>속초시민 소인<\/td><td>속초시 거주 증빙 · 1인 1매<\/td><td>6,000원<\/td><\/tr>\n<\/table><\/div>\n<p>여기서 실제로 지갑에서 나가는 돈을 계산해 보겠습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구성<\/th><th>계산<\/th><th>합계<\/th><\/tr>\n<tr><td>부부 + 초등생 2명<\/td><td>16,000×2 + 12,000×2<\/td><td><b>56,000원<\/b><\/td><\/tr>\n<tr><td>65세 이상 부부 <b>(할인 적용 기간)<\/b><\/td><td>14,000×2<\/td><td>28,000원<\/td><\/tr>\n<tr><td>65세 이상 부부 <b>(단풍철·성수기)<\/b><\/td><td>16,000×2<\/td><td><b>32,000원<\/b> (+4,000원)<\/td><\/tr>\n<tr><td>3대 가족 6명 <b>(단풍철)<\/b><br><span style=\"font-size:13px\">조부모 2 + 성인 2 + 초등 2<\/span><\/td><td>16,000×4 + 12,000×2<\/td><td><b>88,000원<\/b><\/td><\/tr>\n<tr><td>속초시민 4인 <b>(대인2·소인2)<\/b><\/td><td>8,000×2 + 6,000×2<\/td><td>28,000원<\/td><\/tr>\n<\/table><\/div>\n<p>표에서 바로 보이는 것이 있습니다. <b>3대 가족 6명이 단풍철에 가면 케이블카 값만 8만 8천 원<\/b>입니다. 왕복 10분 타는 값으로는 적지 않은 돈이니, 아래 할인 규칙 두 가지는 미리 알고 가시는 편이 좋습니다.<\/p>\n<ul>\n<li><b>할인은 중복되지 않습니다.<\/b> 속초시민이면서 65세 이상이어도 하나만 적용됩니다(속초시민 8,000원이 유리).<\/li>\n<li><b>단체 할인은 없습니다.<\/b> 인원이 많다고 깎이지 않습니다. 수학여행 할인만 별도로 있고, <b>주말·공휴일·성수기는 제외<\/b>이며 사전 문의(033-636-4300)가 필요합니다.<\/li>\n<li>장애·국가유공자 할인은 <b>본인 카드 실물<\/b>이 있어야 하고 <b>사본·사진은 인정되지 않습니다.<\/b> 속초시민·경로우대도 현장에서 신분증으로 증빙합니다.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 목차로<\/a>\n\n<h2 id=\"sec3\">3. 단풍철엔 경로우대가 빠집니다 (할인 비적용 기간)<\/h2>\n<div class=\"warn\"><b>⚠️ 2026년 할인 비적용 기간<\/b>\n<p style=\"margin:6px 0 0\"><b>2026. 7. 18. ~ 8. 23.<\/b> · <b>2026. 9. 19. ~ 11. 15.<\/b><br>이 기간에는 <b>경로우대(만 65세 이상) 할인이 적용되지 않습니다.<\/b> 장애 중증·1·2급, 국가유공자, 속초시민 할인은 <b>연중 상시<\/b> 그대로 적용됩니다.<\/p><\/div>\n<p>공식 안내 문장을 그대로 옮기면 이렇습니다 — \"장애 중증, 1, 2급 및 국가유공자, 속초시민 할인은 연중 상시 적용되며 경로우대는 성수기를 제외한 기간에만 적용됩니다.\" 즉 <b>성수기에 빠지는 것은 경로우대 하나<\/b>입니다. 이 구분을 뭉뚱그려 \"단풍철엔 할인이 안 된다\"고 알고 계시면 국가유공자·속초시민은 받을 수 있는 할인을 못 받고 지나칠 수 있습니다.<\/p>\n<p>날짜를 달력에 놓고 보면 판단이 쉬워집니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>시기<\/th><th>만 65세 이상 요금<\/th><th>메모<\/th><\/tr>\n<tr><td>8월 24일 ~ 9월 18일<\/td><td><b>14,000원<\/b> (경로우대 적용)<\/td><td>여름 성수기와 가을 성수기 <b>사이의 틈<\/b><\/td><\/tr>\n<tr><td>9월 19일 ~ 11월 15일<\/td><td>16,000원 (경로우대 없음)<\/td><td>단풍 시즌 <b>전 구간<\/b><\/td><\/tr>\n<tr><td>11월 16일 이후<\/td><td><b>14,000원<\/b> (경로우대 적용)<\/td><td>단풍이 진 뒤<\/td><\/tr>\n<\/table><\/div>\n<p>어르신 두 분 기준 차액은 4,000원입니다. 금액 자체는 크지 않지만, <b>9월 18일과 9월 19일이 서로 다른 요금<\/b>이라는 점은 알고 가시는 게 좋습니다. 단풍 자체가 목적이 아니라 \"설악산 구경 한 번\"이 목적이라면 <b>8월 하순~9월 중순<\/b>이 요금·혼잡 양쪽에서 유리한 구간입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 목차로<\/a>\n\n<h2 id=\"sec4\">4. 운행시간은 매일 바뀝니다 — 확인하는 자리<\/h2>\n<p>운행시간을 고정된 시간표로 안내하지 않는 것도 이 케이블카의 특징입니다. 공식 안내는 <b>\"당일 현장 상황과 기상에 따라 운행시간이 변경될 수 있다\"<\/b>고 밝히고, <b>홈페이지 첫 화면 상단에 그날의 운행시간을 매일 새로 게시<\/b>합니다. FAQ에서도 \"계절과 기후에 따라 운행시간이 달라지므로 홈페이지 첫 화면의 운행시간을 반드시 참고하라\"고 안내합니다.<\/p>\n<p>참고로 <b>2026년 8월 15일(토)·16일(일)의 게시 운행시간은 08:30~17:30<\/b>이었습니다(2026년 8월 15일 확인 기준). 다만 이 값은 <b>그날의 값<\/b>이므로, 방문일 아침에 홈페이지에서 다시 보셔야 합니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>공식 안내 내용<\/th><\/tr>\n<tr><td>운행 간격<\/td><td>한산하면 <b>10~15분<\/b>, 이용객이 많으면 <b>5분<\/b> 간격<\/td><\/tr>\n<tr><td>소요 시간<\/td><td>편도 5분 · <b>왕복 10분<\/b><\/td><\/tr>\n<tr><td>운행 대수<\/td><td><b>2대<\/b>가 왕복 운행 · 70인승 제작, <b>50명 탑승<\/b><\/td><\/tr>\n<tr><td>권금성 체류<\/td><td>제한 없음. 단 <b>마지막 하행 출발 5분 전<\/b>까지 탑승장 집결<\/td><\/tr>\n<tr><td>휴무일<\/td><td><b>연중무휴<\/b> (기상이변·안전점검 시 전면 중단)<\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 마지막 운행 케이블카를 타면 10분입니다<\/b>\n<p style=\"margin:6px 0 0\">공식 FAQ에 명시된 내용입니다. \"마지막 운행 케이블카를 타시는 경우에는 권금성에서 10분 정도밖에 구경을 못 하시게 됩니다.\" 해가 짧아지는 가을·겨울에 <b>막차만 겨우 타는 일정<\/b>은 사실상 정상에서 사진 몇 장 찍고 내려오는 코스가 됩니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 목차로<\/a>\n\n<h2 id=\"sec5\">5. 입장료·주차 — 무엇이 무료이고 무엇이 아닌가<\/h2>\n<p>돈이 나가는 자리와 안 나가는 자리를 나눠 두겠습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>비용<\/th><th>확인 방법<\/th><\/tr>\n<tr><td>문화재구역 입구 입장료<\/td><td><b>없음<\/b><\/td><td>운영사 탑승 안내에 \"입장료는 없습니다\" 명시<\/td><\/tr>\n<tr><td>케이블카 탑승<\/td><td>대인 16,000원 등<\/td><td>1층 매표소 현장 구매<\/td><\/tr>\n<tr><td>주차<\/td><td><b>유료<\/b> (금액 별도 확인)<\/td><td><b>033-636-4050<\/b> (주차장)<\/td><\/tr>\n<tr><td>문화재구역 문의<\/td><td>—<\/td><td><b>033-636-8755<\/b> (신흥사)<\/td><\/tr>\n<tr><td>등산로 탐방 문의<\/td><td>—<\/td><td><b>033-801-0900<\/b> (설악산국립공원)<\/td><\/tr>\n<\/table><\/div>\n<p><b>주차요금은 이 글에 금액을 적지 않았습니다.<\/b> 운영사가 공식 안내에서 <b>\"국립공원 주차장 요금은 당사와 무관하다\"<\/b>고 밝히고 있어, 케이블카 공식 자료로는 확인되지 않는 항목이기 때문입니다. 인터넷에 떠도는 금액을 옮겨 적는 대신 <b>주차장 문의 전화(033-636-4050)<\/b>를 그대로 안내합니다. 케이블카 전용 주차장이 따로 있는 것이 아니라는 점만 기억하시면 됩니다.<\/p>\n<p>대중교통으로 가신다면 이렇게 됩니다.<\/p>\n<ul>\n<li>주소: <b>강원도 속초시 설악산로 1085<\/b> · 내비게이션은 \"설악케이블카\" 또는 주소로 검색<\/li>\n<li>고속·시외버스: 속초행 탑승(서울양양고속도로 경유) — <b>고속 2시간 30분 · 시외 2시간 10분<\/b>, 약 30분 간격 운행<\/li>\n<li>속초 시내버스: 시외버스터미널에서 <b>7번·7-1번<\/b> 탑승 → 설악산 주차장(종점) 하차<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 목차로<\/a>\n\n<h2 id=\"sec6\">6. 환불·시간 변경 규정<\/h2>\n<p>표를 산 뒤 사정이 생겼을 때 기준은 <b>탑승 10분 전<\/b>입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>상황<\/th><th>처리<\/th><\/tr>\n<tr><td>탑승 시간 <b>10분 전까지<\/b><\/td><td><b>전액 환불<\/b><\/td><\/tr>\n<tr><td>그 이후 환불·시간 변경<\/td><td>탑승요금의 <b>20% 감액<\/b> 후 지급<\/td><\/tr>\n<tr><td>탑승시간이 지난 경우<\/td><td><b>당일 운영시간 내<\/b>에 한해 시간 변경 또는 환불 (20% 수수료)<\/td><\/tr>\n<tr><td>강풍·악천후로 운행 중단<\/td><td>사용하지 않은 탑승권 <b>전액 환불<\/b><\/td><\/tr>\n<tr><td>탑승권 분실<\/td><td><b>재발급 불가<\/b><\/td><\/tr>\n<\/table><\/div>\n<p>특히 마지막 줄을 조심하셔야 합니다. <b>분실 시 재발급이 되지 않습니다.<\/b> 표를 사자마자 주머니에 넣고 잊어버리기 쉬운데, 6명 가족이면 8만 원이 넘는 금액입니다. 대표 한 사람이 모아 들고 있는 편이 안전합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 목차로<\/a>\n\n<h2 id=\"sec7\">7. 현장에서 당황하는 8가지<\/h2>\n<p>공식 FAQ에 실제로 올라와 있는 질문들입니다. 미리 알고 가면 헛걸음이 줄어듭니다.<\/p>\n<ol>\n<li><b>편도표가 없습니다.<\/b> 티켓은 왕복 가격이며 편도 탑승권을 팔지 않습니다.<\/li>\n<li><b>걸어서 내려올 수 없습니다.<\/b> 권금성에서 내려오는 등산로가 없어 반드시 케이블카로 하행해야 합니다. \"올라가서 걸어 내려오지 뭐\"가 성립하지 않습니다.<\/li>\n<li><b>대청봉에는 못 갑니다.<\/b> 케이블카 도착지는 권금성입니다. 대청봉은 하행 후 설악동에서 정규 등산로를 이용해야 합니다.<\/li>\n<li><b>유모차는 탑승 불가<\/b>입니다. 케이블카 건물 우측 외부의 <b>유모차 무료보관소<\/b>에 맡기고 타야 합니다.<\/li>\n<li><b>휠체어는 가능<\/b>합니다. 다만 <b>키오스크가 아니라 창구 매표소<\/b>에서 휠체어 종류(일반·전동)와 대수를 알리고 발권해야 하며, 엘리베이터로 2층 이동 후 전용 탑승구를 이용합니다.<\/li>\n<li><b>반려동물은 탑승 불가<\/b>입니다. 국립공원 구역이라 이동장·가방에 넣어도 안 되고 건물 안에도 들어갈 수 없습니다. <b>시각장애인 안내견만<\/b> 예외입니다.<\/li>\n<li><b>케이블카에 의자가 없습니다.<\/b> 서서 타고 오르내립니다. 무릎이 불편하신 분은 미리 알고 계셔야 합니다.<\/li>\n<li><b>권금성 화장실은 물을 내리는 방식이 아닙니다.<\/b> 환경보호를 위해 거품식이라 불편할 수 있으니, 탑승 전 소공원이나 건물 2층 화장실 이용을 권합니다.<\/li>\n<\/ol>\n<p>권금성 자체는 <b>해발 약 700m, 케이블카 거리 약 1,200m(1.2km)<\/b>이고 정상에 봉화대와 안락암이라는 암자가 있습니다. 1·2층에 스낵코너와 커피숍이 있어 간단한 요기는 가능합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 목차로<\/a>\n\n<h2 id=\"sec8\">8. 대기 줄을 줄이는 판단<\/h2>\n<p>예약이 없다는 것은 <b>대기시간이 곧 실력<\/b>이라는 뜻입니다. 공식 안내에 나온 조건만 놓고 계산하면 이렇습니다.<\/p>\n<ul>\n<li>케이블카는 <b>2대가 왕복<\/b>하고 한 번에 <b>50명<\/b>이 탑니다. 붐빌 때 5분 간격이면 <b>1시간에 약 600명<\/b>이 올라가는 구조입니다. 앞에 300명이 서 있으면 30분입니다.<\/li>\n<li>공식 FAQ의 \"주말에는 손님이 많나요?\" 답변은 <b>\"대부분의 주말은 많은 편\"<\/b>입니다. 평일 오전이 가장 무난합니다.<\/li>\n<li>홈페이지 첫 화면에는 그날의 <b>운행시간·대기시간·기상 안내<\/b>가 함께 올라옵니다. 출발 전에 한 번, 속초 도착해서 한 번 보시면 헛기다림이 줄어듭니다.<\/li>\n<li><b>막차 시간대는 피하는 편이 낫습니다.<\/b> 마지막 케이블카를 타면 정상 체류가 10분입니다.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<tr><th>이런 분이라면<\/th><th>추천 시기<\/th><th>이유<\/th><\/tr>\n<tr><td>단풍이 목적<\/td><td>9월 19일 ~ 11월 15일<\/td><td>대신 <b>경로우대 없음<\/b> · 주말 혼잡 최대<\/td><\/tr>\n<tr><td>어르신 모시고 조용히<\/td><td><b>8월 24일 ~ 9월 18일<\/b><\/td><td>경로우대 <b>14,000원 적용<\/b> · 성수기 사이 구간<\/td><\/tr>\n<tr><td>요금·혼잡 둘 다 피하고 싶다<\/td><td>11월 16일 이후<\/td><td>경로우대 재적용 · 단풍 인파 해소<\/td><\/tr>\n<\/table><\/div>\n<a class=\"top\" href=\"#top\">▲ 목차로<\/a>\n\n<div class=\"end\"><b>✅ 마무리<\/b>\n<p style=\"margin:8px 0 0\">기억할 것은 넷입니다. <b>① 예약은 없다 — 당일 1층 매표소 현장 구매뿐<\/b>, <b>② 왕복 대인 16,000원·소인 12,000원, 편도표는 없다<\/b>, <b>③ 2026년 7월 18일~8월 23일과 9월 19일~11월 15일은 경로우대 제외(장애·국가유공자·속초시민은 연중 상시)<\/b>, <b>④ 환불 기준은 탑승 10분 전, 이후에는 20% 수수료.<\/b> 운행시간은 매일 달라지므로 출발 전 홈페이지 첫 화면을 반드시 확인하시고, 주차요금은 케이블카 운영사 소관이 아니니 주차장(033-636-4050)으로 문의하시면 됩니다.<\/p><\/div>\n\n<div class=\"gov\" id=\"sec9\"><b>🏛️ 공식 확인 페이지<\/b>\n<a href=\"https://www.sorakcablecar.co.kr/guide\" target=\"_blank\" rel=\"nofollow\">▸ 설악 케이블카 이용 안내 — 요금·운행시간·탑승·FAQ<\/a>\n<a href=\"https://www.sorakcablecar.co.kr/\" target=\"_blank\" rel=\"nofollow\">▸ 설악 케이블카 홈페이지 — 당일 운행시간·대기시간 게시<\/a>\n<a href=\"https://www.sorakcablecar.co.kr/facilities\" target=\"_blank\" rel=\"nofollow\">▸ 설악 케이블카 시설 안내 — 실시간 권금성 전망<\/a>\n<\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월 15일<\/b> 확인 기준이며, 요금·할인 비적용 기간·운행시간은 변동될 수 있습니다. 방문 전 공식 페이지에서 다시 확인하세요. 주차요금은 운영사가 \"당사와 무관\"으로 안내하는 항목이라 금액을 싣지 않았습니다.<br>출처: <a href=\"https://www.sorakcablecar.co.kr/guide\" target=\"_blank\" rel=\"nofollow\">설악 케이블카 공식 이용 안내(요금·운행시간·탑승 안내·FAQ)<\/a> · <a href=\"https://www.sorakcablecar.co.kr/\" target=\"_blank\" rel=\"nofollow\">설악 케이블카 공식 홈페이지 당일 운행 안내<\/a><\/div>\n<div class 준비가 끝났다\"는 오해를 차단(공식 안내 원문: \"태국 디지털 도착 카드는 비자가 아닙니다\").\n   ⑤ 거부 사유 — 외교부 해외안전여행 국가정보의 입국 거부 사유(여권 훼손, 유효기간 6개월 미만, 귀국 항공권 미소지, **정당한 사유 없이 비자면제 입국을 반복**)를 그대로 정리. 마지막 항목은 '태국 자주 가는 분'에게 실제로 걸리는 조항인데 거의 안 알려져 있다.\n   ⑥ 실측 발견 — 한국인은 태국 일반 무비자 정책과 별개로 **한·태 비자면제협정에 따라 90일**(외교부 국가정보 \"일반여권 소지자: O,(90일) 협정\"). 영문 안내를 그대로 옮긴 글과 수치가 달라 혼선이 크다.\n■ 검색설명(발행 후 편집화면에서 사람이 붙일 것):\n   태국 입국 전 필수인 디지털 입국카드(TDAC) 작성법입니다. 도착 3일 전부터만 제출되는 이유, 고칠 수 없는 항목 4가지, 한국인 90일 무비자 근거, 입국 거부 사유까지 공식 자료로 정리했습니다.\n■ 확인 못 해 뺀 것(유보): TDAC **수수료 유무**는 공식 FAQ(한국어·영문) 어디에도 표기가 없어 \"무료\"라고 쓰지 않았다. **미제출 시 과태료·처벌**도 공식 문구가 없어 넣지 않았다. 태국이 다른 나라 무비자를 30일로 축소했다는 내용은 **공식 출처를 못 받아(대사관 공지 페이지 404) 수치·국가 수를 일절 쓰지 않았다.**\n\n[붙여넣는 법] Blogger 글쓰기 → 연필▾ → HTML 보기 → 아래 전체 붙여넣기 → 작성 보기 → 제목 입력 → 라벨(여행) → 발행\n----------------------------------------------------------------\n▼ 본문 HTML\n<div style=\"text-align:center;margin:0 0 18px\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCACIAQQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD2qiiiqJCiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKAIbqTy4uOp4FZ9Wr4/Oo9qq1tBaDCiiiqAKKKKAHrI6jCsQKKZRRZAa1FFFc4jlPEfi19Pv/wCz9Nt1nuQQHLZIBP8ACAOprNXxT4kZto02DdtLY8ts4BwT96qXi3S77T9dk1KCJpIJX8xXC7gpPVWqjDrF2k0LvbPhI2jK sg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#f4f1fd;border:1px solid #ded4f7;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#6544cc;margin-bottom:8px}\n.lsg .rel a{display:block;color:#5a3cc0;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#9a92aa;text-decoration:none;margin:2px 0 6px}\n\n.lsg .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 16px}\n.lsg .tw table{margin:0}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>추석 연휴나 겨울 휴가로 <b>방콕·치앙마이·푸껫<\/b>을 계획하고 계신다면, 짐을 싸기 전에 <b>온라인으로 반드시 내야 하는 서류<\/b>가 하나 있습니다. <b>TDAC(태국 디지털 입국카드)<\/b> 입니다. 예전에 기내에서 승무원이 나눠 주던 <b>종이 입국신고서(TM6)<\/b> 를 대신하는 것으로, 외교부 해외안전여행 국가정보는 <b>\"2025.5.1.(목)부터 태국에 입국하는 모든 외국인을 대상으로 입국 전 디지털 입국카드(TDAC) 작성 의무화\"<\/b> 라고 안내하고 있습니다. 문제는 이 제도가 <b>다른 나라 사전등록과 정반대로 움직인다<\/b>는 데 있습니다. 미국 ESTA나 일본 비지트재팬웹은 <b>미리 해 둘수록 마음이 편한데<\/b>, TDAC는 <b>도착 3일 전이 되기 전에는 아예 제출이 안 됩니다.<\/b> 게다가 한 번 낸 뒤 <b>이름과 여권번호는 고칠 수도 없습니다.<\/b> 여기에 <b>체류 기간<\/b>까지 헷갈립니다. 인터넷에는 태국 무비자를 두고 <b>30일, 60일, 90일<\/b>이 뒤섞여 돌아다니는데, <b>우리 여권으로는 몇 일인지<\/b> 이 글에서 공식 근거로 정리해 드립니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. TDAC가 뭔가 — 1분 정리<\/a><a href=\"#sec2\">2. 누가 내야 하나 · 안 내도 되는 사람<\/a><a href=\"#sec3\">3. 제출 시점 — '미리 해 두기'가 안 되는 제도<\/a><a href=\"#sec4\">4. 제출 전에 손에 있어야 하는 정보 5가지<\/a><a href=\"#sec5\">5. 작성 순서 — 화면 그대로 따라가기<\/a><a href=\"#sec6\">6. 고칠 수 있는 것과 절대 못 고치는 것<\/a><a href=\"#sec7\">7. 한국 여권은 며칠 머물 수 있나 — 30일? 60일? 90일?<\/a><a href=\"#sec8\">8. 태국 입국이 거부되는 사유<\/a><a href=\"#sec9\">9. 공항에 도착한 다음 — QR은 어떻게 보여주나<\/a><a href=\"#sec10\">10. 자주 묻는 질문<\/a><a href=\"#sec11\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec3\">👉 언제부터 제출되는지부터 보기<\/a>\n\n<h2 id=\"sec1\">1. TDAC가 뭔가 — 1분 정리<\/h2>\n<p><b>TDAC(Thailand Digital Arrival Card, 태국 디지털 입국카드)<\/b> 는 태국에 들어가는 외국인이 <b>입국 전에 온라인으로 여행 정보를 제출<\/b>하는 제도입니다. 공식 안내 사이트는 <b>\"태국을 방문하는 관광객들이 차량, 항공기 또는 선박을 이용하여 태국에 입국할 때\"<\/b> 이용한다고 설명합니다. 즉 <b>항공편만이 아니라 육로·해로 입국에도<\/b> 해당됩니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>내용<\/th><\/tr>\n<tr><td>정식 명칭<\/td><td>Thailand Digital Arrival Card (TDAC) · 태국 디지털 입국카드<\/td><\/tr>\n<tr><td>공식 사이트<\/td><td><b>tdac.immigration.go.th<\/b> (태국 이민국)<\/td><\/tr>\n<tr><td>의무화 시점<\/td><td>외교부 국가정보 표기 <b>2025년 5월 1일부터<\/b><\/td><\/tr>\n<tr><td>대상<\/td><td>공식 안내 <b>\"모든 비(非)태국 국적자\"<\/b> — 우리 국민 포함<\/td><\/tr>\n<tr><td>입력 항목<\/td><td>여권 정보 · 개인 정보 · 여행 정보 · <b>태국 내 숙소 정보<\/b> · 건강 상태 정보<\/td><\/tr>\n<tr><td>입력 언어<\/td><td><b>영어<\/b> — 공식 안내 \"모든 정보는 영어로 입력해야 합니다\"<\/td><\/tr>\n<tr><td>제출 시점<\/td><td><b>도착일 포함 3일 전부터<\/b> · <b>최대 72시간 전<\/b><\/td><\/tr>\n<tr><td>한 번에 등록<\/td><td><b>최대 10명<\/b>까지 (가족·동행 묶어서 가능)<\/td><\/tr>\n<tr><td>비자와의 관계<\/td><td>공식 안내 <b>\"태국 디지털 도착 카드는 비자가 아닙니다\"<\/b><\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 가장 큰 오해 — \"TDAC 냈으니 입국 준비 끝\"이 아닙니다<\/b><p style=\"margin:8px 0 0\">TDAC는 <b>신고 서류<\/b>이지 <b>입국 허가<\/b>가 아닙니다. 공식 안내가 직접 <b>\"비자가 아닙니다\"<\/b> 라고 못박고 있고, 영문 FAQ도 <b>\"TDAC는 도착비자(visa-on-arrival)와 무비자 입국을 포함한 모든 비자 유형과 함께 쓰인다\"<\/b> 는 취지로 설명합니다. 즉 <b>비자가 필요한 목적이라면 비자는 비자대로 따로<\/b> 받아야 하고, 무비자로 가더라도 <b>여권 유효기간·귀국 항공권 같은 입국 조건은 그대로<\/b> 봅니다(8장 참고).<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 누가 내야 하나 · 안 내도 되는 사람<\/h2>\n<h3>내야 하는 사람<\/h3>\n<p>공식 FAQ는 <b>\"모든 비(非)태국 국적자는 입국 전 여행 정보를 제출해야 합니다\"<\/b> 라고 안내합니다. 관광이든 출장이든, 항공기든 육로든 <b>태국 이민국 심사대를 통과한다면 대상<\/b>입니다. 또한 <b>입국할 때마다 매번<\/b> 새로 제출합니다. 한 번 냈다고 다음 여행까지 유효한 서류가 아닙니다.<\/p>\n<h3>안 내도 되는 사람<\/h3>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>공식 안내 문구<\/th><th>실제 상황<\/th><\/tr>\n<tr><td><b>승무원<\/b><\/td><td>\"승무원은 TDAC 제출 대상이 아닙니다\"<\/td><td>항공기·선박 근무자<\/td><\/tr>\n<tr><td><b>단순 환승<\/b><\/td><td>\"태국을 경유할 경우 … 이민국을 통과하지 않으면 필요 없습니다\"<\/td><td>수완나품에서 짐을 안 찾고 <b>환승 구역 안에서만<\/b> 갈아타는 경우<\/td><\/tr>\n<tr><td><b>태국 국적자<\/b><\/td><td>대상은 \"비(非)태국 국적자\"<\/td><td>—<\/td><\/tr>\n<\/table><\/div>\n<div class=\"tip\"><b>💡 '환승'의 기준은 공항 밖이 아니라 <u>이민국 심사대<\/u>입니다<\/b><p style=\"margin:8px 0 0\">환승 시간이 길어 <b>시내 구경을 하거나 공항 밖 호텔에서 자려고 입국 심사를 받는다면<\/b>, 그것은 환승이 아니라 <b>입국<\/b>입니다. TDAC를 내야 합니다. 반대로 <b>대기 시간이 길더라도 환승 구역 안에만 머문다면<\/b> 대상이 아닙니다. 애매하면 <b>내는 쪽이 안전합니다<\/b> — 낸다고 불이익이 생기는 서류가 아닙니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 제출 시점 — '미리 해 두기'가 안 되는 제도<\/h2>\n<p>여기가 <b>이 글에서 가장 중요한 대목<\/b>입니다. 다른 나라 사전등록은 대개 <b>일찍 할수록 좋습니다.<\/b> 미국 ESTA는 몇 년 단위로 유효하고, 일본 비지트재팬웹도 여유 있게 등록해 둘 수 있습니다. <b>TDAC는 반대입니다.<\/b><\/p>\n<div class=\"tw\"><table>\n<tr><th>공식 문구<\/th><th>뜻<\/th><\/tr>\n<tr><td>\"도착일을 포함하여 태국 도착 <b>3일 전부터<\/b> 제출할 수 있습니다\"<\/td><td>도착일을 1일째로 세어 <b>사흘<\/b> — 즉 <b>도착 이틀 전부터 도착 당일까지<\/b><\/td><\/tr>\n<tr><td>\"<b>최대 72시간 전<\/b>에 제출할 수 있습니다\"<\/td><td>그보다 이른 시점에는 <b>접수 자체가 열리지 않음<\/b><\/td><\/tr>\n<\/table><\/div>\n<h3>계산예시 — 추석 연휴 출국이라면 언제 제출하나<\/h3>\n<p>아래는 <b>가정한 일정<\/b>에 위 규칙을 적용해 본 <b>예시<\/b>입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>태국 도착일<\/th><th>제출 가능해지는 날<\/th><th>늦어도 언제까지<\/th><\/tr>\n<tr><td>2026년 9월 26일(토)<\/td><td><b>9월 24일(목)<\/b> 부터<\/td><td>이민국 심사대에 서기 전까지<\/td><\/tr>\n<tr><td>2026년 10월 3일(토)<\/td><td><b>10월 1일(목)<\/b> 부터<\/td><td>동일<\/td><\/tr>\n<tr><td>2026년 12월 24일(목)<\/td><td><b>12월 22일(화)<\/b> 부터<\/td><td>동일<\/td><\/tr>\n<\/table><\/div>\n<p style=\"font-size:15px;color:#666\">※ 위 표는 <b>공식 문구(\"도착일 포함 3일 전부터\" · \"최대 72시간 전\")에 날짜를 대입한 예시<\/b>입니다. 두 표현은 시각 단위로 보면 조금 다를 수 있으니, <b>정확한 개시 시점은 공식 사이트에 도착일을 넣어 화면이 진행되는지로 확인<\/b>하세요.<\/p>\n<div class=\"warn\"><b>⚠️ 여행 준비하다가 가장 흔히 겪는 상황<\/b><p style=\"margin:8px 0 0\">항공권을 끊은 김에 <b>한 달 전에 TDAC까지 해 두려다<\/b> 화면이 진행되지 않아 \"사이트가 고장 났나\" 하는 경우가 많습니다. <b>고장이 아니라 아직 열리지 않은 것<\/b>입니다. 반대로 <b>출발 전날 밤에 하려다<\/b> 숙소 영문 주소를 못 찾아 헤매는 경우도 많습니다. <b>출발 이틀 전 저녁<\/b>에 여권과 항공권, 숙소 예약 확인서를 펼쳐 놓고 <b>한 번에 처리<\/b>하는 것이 가장 편합니다. 가족 여행이라면 <b>한 번에 최대 10명<\/b>까지 묶어 등록할 수 있으니 대표 한 사람이 몰아서 하시면 됩니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 제출 전에 손에 있어야 하는 정보 5가지<\/h2>\n<p>공식 안내가 요구하는 입력 항목은 <b>여권 정보 · 개인 정보 · 여행 정보 · 태국 내 숙소 정보 · 건강 상태 정보<\/b> 다섯 갈래입니다. 이 중 <b>즉석에서 못 만들어 내는 것<\/b>만 추리면 아래와 같습니다.<\/p>\n<ul>\n<li><b>① 여권<\/b> — 인적사항면을 펼쳐 두세요. 공식 사이트는 <b>MRZ(여권 아래쪽 기계판독영역) 스캔이나 이미지 업로드<\/b>로 자동 입력하는 기능을 제공합니다. 손으로 치다가 오타가 나면 <b>고칠 수 없는 항목<\/b>이라 더 위험합니다(6장).<\/li>\n<li><b>② 항공편 번호와 도착 시각<\/b> — 예약 확인서에 적힌 <b>편명(예: KE651 형태)<\/b> 과 태국 <b>도착 날짜<\/b>가 필요합니다.<\/li>\n<li><b>③ 태국 내 숙소의 영문 이름·종류·주소<\/b> — 가장 많이 막히는 항목입니다. 호텔 예약 사이트의 <b>영문 표기 그대로<\/b> 복사해 두세요. 한글로 저장해 둔 메모만 있으면 그 자리에서 다시 찾아야 합니다.<\/li>\n<li><b>④ 최근 방문 국가<\/b> — 태국 입국 전 일정 기간 내에 다녀온 나라를 묻습니다. 경유지를 포함해 <b>어디를 거쳐 왔는지<\/b> 미리 정리해 두면 빠릅니다.<\/li>\n<li><b>⑤ 이메일 주소<\/b> — 제출이 끝나면 <b>확인 문서(QR)<\/b> 를 이메일로도 받습니다. 오타가 나면 못 받으니 천천히 입력하세요.<\/li>\n<\/ul>\n<div class=\"tip\"><b>💡 입력은 전부 영어입니다<\/b><p style=\"margin:8px 0 0\">공식 안내는 <b>\"모든 정보는 영어로 입력해야 합니다\"<\/b> 라고 명시합니다. 이름은 <b>여권에 인쇄된 영문 철자 그대로<\/b>, 숙소는 <b>예약 사이트의 영문 명칭 그대로<\/b> 쓰시면 됩니다. 한글이나 한자를 넣으면 진행되지 않습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 작성 순서 — 화면 그대로 따라가기<\/h2>\n<p>공식 안내가 제시하는 개인 신청 순서는 다음과 같습니다.<\/p>\n<ol>\n<li><b>tdac.immigration.go.th<\/b> 접속 → <b>'입국 카드' 버튼<\/b> 클릭<\/li>\n<li><b>개인정보 및 여권 정보 입력<\/b> — MRZ 스캔 또는 여권 이미지 업로드로 자동 입력 가능<\/li>\n<li><b>여행 및 숙소 정보 입력<\/b> — 항공편·도착일·태국 내 숙소<\/li>\n<li><b>건강 상태 정보 입력<\/b><\/li>\n<li><b>정보 확인 및 미리보기<\/b> — <u>여기서 반드시 이름·여권번호를 한 글자씩 대조<\/u><\/li>\n<li><b>이메일 주소 입력<\/b><\/li>\n<li><b>약관 동의 후 제출<\/b><\/li>\n<li><b>카드 다운로드 또는 인쇄<\/b><\/li>\n<\/ol>\n<div class=\"warn\"><b>⚠️ 공식 주소를 직접 확인하세요<\/b><p style=\"margin:8px 0 0\">TDAC를 검색하면 <b>공식 사이트(tdac.immigration.go.th)<\/b> 와 함께 <b>tdac.in.th · tdac.info<\/b> 처럼 <b>비슷한 이름의 민간 사이트<\/b>가 나란히 노출됩니다. 안내나 대행을 표방하는 곳들로, <b>태국 이민국 공식 사이트가 아닙니다.<\/b> 주소창에 <b>immigration.go.th<\/b> 가 들어 있는지 눈으로 확인하고 진행하세요. 정부 서류를 제출하는 화면이니 <b>여권 정보를 아무 사이트에나 올리지 않는 것<\/b>이 원칙입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 고칠 수 있는 것과 절대 못 고치는 것<\/h2>\n<p>제출 후에는 <b>'도착 카드 수정(Update Arrival Card)'<\/b> 기능으로 정보를 고칠 수 있습니다. 그런데 <b>고칠 수 없는 항목이 정해져 있습니다.<\/b><\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>수정<\/th><th>오타가 났다면<\/th><\/tr>\n<tr><td><b>성명(Full Name)<\/b><\/td><td>❌ <b>불가<\/b><\/td><td rowspan=\"4\">공식 FAQ는 이 네 가지를 <b>수정 대상에서 제외<\/b>합니다. 잘못 냈다면 <b>제출 가능 기간(도착 3일 전~도착 당일) 안에서 정확한 정보로 다시 제출<\/b>하고, 시간이 촉박하거나 판단이 서지 않으면 <b>공항에서 이민국 직원에게 상황을 설명<\/b>하는 것이 현실적입니다.<\/td><\/tr>\n<tr><td><b>여권번호<\/b><\/td><td>❌ <b>불가<\/b><\/td><\/tr>\n<tr><td><b>국적<\/b><\/td><td>❌ <b>불가<\/b><\/td><\/tr>\n<tr><td><b>생년월일<\/b><\/td><td>❌ <b>불가<\/b><\/td><\/tr>\n<tr><td>항공편·도착일<\/td><td>✅ 가능<\/td><td rowspan=\"3\">\"위 항목을 <b>제외한<\/b> 어떤 정보든 수정할 수 있다\"는 것이 공식 FAQ의 표현입니다.<\/td><\/tr>\n<tr><td>숙소 정보<\/td><td>✅ 가능<\/td><\/tr>\n<tr><td>연락처·기타<\/td><td>✅ 가능<\/td><\/tr>\n<\/table><\/div>\n<div class=\"tip\"><b>💡 그래서 5단계 '미리보기'가 이 제도의 유일한 안전장치입니다<\/b><p style=\"margin:8px 0 0\">항공편이 바뀌거나 숙소를 옮기는 일은 <b>흔하고, 고칠 수 있습니다.<\/b> 반면 <b>이름 철자 하나, 여권번호 숫자 하나<\/b>는 되돌릴 수 없습니다. 제출 버튼을 누르기 전 <b>여권을 옆에 펴 놓고 한 글자씩<\/b> 맞춰 보세요. 특히 <b>여권번호의 M/0/O<\/b>, 이름의 <b>성과 이름 순서<\/b>를 자주 틀립니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 한국 여권은 며칠 머물 수 있나 — 30일? 60일? 90일?<\/h2>\n<p>태국 체류 기간은 인터넷에서 <b>가장 많이 틀리는 정보<\/b>입니다. 영문 안내나 해외 커뮤니티 글을 그대로 옮긴 글이 많은데, <b>나라마다 적용 기준이 다르기 때문에<\/b> 그 숫자가 우리 여권에 그대로 적용되지 않습니다.<\/p>\n<p>외교부 <b>해외안전여행<\/b> 국가정보의 태국 항목은 우리 국민의 사증면제를 <b>\"일반여권 소지자: O,(90일) 협정\"<\/b> 으로 표기하고 있습니다. 즉 <b>협정에 근거한 90일<\/b>입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>한국 일반여권 기준<\/th><th>확인처<\/th><\/tr>\n<tr><td>사증(비자) 필요 여부<\/td><td><b>관광·단기 방문은 사증 면제<\/b><\/td><td>외교부 해외안전여행 국가정보<\/td><\/tr>\n<tr><td>무사증 체류 가능 기간<\/td><td><b>90일<\/b> (협정)<\/td><td>동일<\/td><\/tr>\n<tr><td>근거<\/td><td><b>양국 간 사증면제 협정<\/b><\/td><td>동일<\/td><\/tr>\n<tr><td>TDAC와의 관계<\/td><td><b>별개<\/b> — 무비자로 가더라도 TDAC는 내야 함<\/td><td>TDAC 공식 안내(\"비자가 아닙니다\")<\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ '90일이니까 마음대로 드나들어도 된다'는 뜻은 아닙니다<\/b><p style=\"margin:8px 0 0\">외교부 국가정보는 입국 거부 사유 중 하나로 <b>\"정당한 사유 없이 태국에 장기체류 하기 위해 비자면제 입국을 반복\"<\/b> 하는 경우를 들고 있습니다. 무비자 입국을 <b>짧은 간격으로 되풀이<\/b>하면 심사관 판단에 따라 <b>입국이 거부될 수 있다<\/b>는 뜻입니다. 태국에 자주 가시는 분, 체류와 출국을 반복하며 머무는 분은 <b>목적에 맞는 비자<\/b>를 검토하시는 편이 안전합니다.<\/p><\/div>\n<div class=\"tip\"><b>💡 취업·장기체류 목적은 사증면제 대상이 아닙니다<\/b><p style=\"margin:8px 0 0\">사증면제는 <b>관광·방문 같은 단기 목적<\/b>에 적용됩니다. <b>취업, 영리 활동, 장기 체류<\/b>가 목적이라면 <b>사전에 목적에 맞는 비자<\/b>를 받아야 합니다. 이 경우에도 <b>TDAC는 별도로 제출<\/b>합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 태국 입국이 거부되는 사유<\/h2>\n<p>TDAC를 잘 냈어도 <b>입국 심사는 별개<\/b>입니다. 외교부 해외안전여행 국가정보가 밝히고 있는 태국 입국 거부 사유는 다음과 같습니다.<\/p>\n<ul>\n<li><b>출입국 규제 대상자<\/b>인 경우<\/li>\n<li><b>여권 훼손<\/b> — \"여권이 일부라도 훼손된 경우 입국이 거부될 수 있음\"<\/li>\n<li><b>여권 유효기간 6개월 미만<\/b><\/li>\n<li><b>귀국 항공권 미소지<\/b><\/li>\n<li><b>입국 목적 불확실<\/b><\/li>\n<li><b>정당한 사유 없이 태국에 장기체류 하기 위해 비자면제 입국을 반복<\/b>하는 경우<\/li>\n<\/ul>\n<h3>계산예시 — 여권 유효기간 6개월은 이렇게 셉니다<\/h3>\n<div class=\"tw\"><table>\n<tr><th>출국(태국 도착) 예정일<\/th><th>여권 만료일이 이 날짜보다 뒤여야 안전<\/th><\/tr>\n<tr><td>2026년 9월 26일<\/td><td><b>2027년 3월 26일<\/b><\/td><\/tr>\n<tr><td>2026년 12월 24일<\/td><td><b>2027년 6월 24일<\/b><\/td><\/tr>\n<tr><td>2027년 1월 15일<\/td><td><b>2027년 7월 15일<\/b><\/td><\/tr>\n<\/table><\/div>\n<p>여권을 서랍에서 꺼내 <b>만료일을 먼저 확인<\/b>하세요. 6개월이 안 남았다면 <b>재발급이 먼저<\/b>이고, 재발급을 하면 <b>여권번호가 바뀌므로<\/b> TDAC는 <b>새 여권 기준으로<\/b> 제출해야 합니다(여권번호는 수정 불가 항목입니다).<\/p>\n<div class=\"tip\"><b>💡 외화를 많이 가져가신다면<\/b><p style=\"margin:8px 0 0\">외교부 국가정보는 태국 <b>출입국 시 미화 15,000달러 상당을 초과해 소지한 경우 세관 신고가 필요<\/b>하다고 안내합니다. 현금을 넉넉히 챙기는 분은 기준을 넘는지 미리 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 공항에 도착한 다음 — QR은 어떻게 보여주나<\/h2>\n<ul>\n<li>제출이 끝나면 <b>QR 코드가 담긴 확인 문서<\/b>를 <b>다운로드<\/b>하거나 <b>이메일<\/b>로 받습니다.<\/li>\n<li>공식 FAQ는 <b>\"출력할 필요 없습니다. … 휴대폰이나 다른 기기에 저장해서 보여주면 됩니다\"<\/b> 라고 안내합니다.<\/li>\n<li>이민국 심사대에서 <b>여권 원본과 함께<\/b> QR을 제시합니다.<\/li>\n<\/ul>\n<div class=\"tip\"><b>💡 그래도 화면 캡처는 남겨 두세요<\/b><p style=\"margin:8px 0 0\">공항 도착 직후는 <b>로밍이 아직 안 잡히거나 와이파이 연결이 불안정<\/b>한 순간입니다. 이메일을 열어야만 QR을 볼 수 있는 상태라면 곤란해집니다. <b>QR 화면을 캡처해 사진첩에 저장<\/b>하거나 <b>PDF를 기기에 내려받아<\/b> 두면 통신이 끊겨도 보여줄 수 있습니다. 종이 출력은 <b>의무가 아니니<\/b> 굳이 하실 필요는 없습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">10. 자주 묻는 질문<\/h2>\n<h3>Q. TDAC를 안 내면 어떻게 되나요?<\/h3>\n<p>공식 안내는 이를 <b>의무 사항<\/b>으로 규정하고 있습니다. 다만 <b>미제출 시의 과태료나 처벌 액수를 명시한 공식 문구는 확인되지 않았습니다.<\/b> 현실적으로는 <b>심사대에서 그 자리에 제출을 요구받아 시간이 지체될 수 있다<\/b>고 보시는 것이 안전합니다. 도착 3일 전부터 도착 당일까지 제출할 수 있으니, <b>공항 가기 전에 끝내 두는 것<\/b>이 최선입니다.<\/p>\n<h3>Q. 가족이 함께 가는데 각자 따로 해야 하나요?<\/h3>\n<p><b>한 번에 최대 10명까지<\/b> 등록할 수 있습니다. 공식 안내는 <b>\"그룹 제출은 최대 10명까지 한 번에 등록할 수 있습니다\"<\/b> 라고 밝히고 있습니다. 다만 <b>사람마다 여권 정보가 정확해야<\/b> 하므로, 여권을 전부 모아 두고 <b>한 사람씩 대조하며<\/b> 입력하세요.<\/p>\n<h3>Q. 육로나 배로 들어가도 내야 하나요?<\/h3>\n<p>네. 공식 안내는 <b>\"차량, 항공기 또는 선박을 이용하여 태국에 입국할 때\"<\/b> 를 대상으로 설명합니다. 라오스·캄보디아 등에서 <b>국경을 넘어 들어가는 경우<\/b>에도 제출 대상입니다.<\/p>\n<h3>Q. 태국을 나갔다가 다시 들어오면 또 내야 하나요?<\/h3>\n<p>네. <b>입국할 때마다<\/b> 제출하는 서류입니다. 태국에서 주변국을 다녀오는 일정이라면 <b>돌아올 때 한 번 더<\/b> 내셔야 합니다. 이때도 <b>도착 3일 전부터<\/b>라는 제한이 같이 적용됩니다.<\/p>\n<h3>Q. 도착 시각이 자정 무렵이면 날짜 계산이 헷갈립니다.<\/h3>\n<p>기준은 <b>태국 현지 도착일<\/b>입니다. 한국 시각으로 밤늦게 출발해 <b>현지 시각으로 다음 날 새벽에 도착<\/b>하는 일정이라면, <b>현지 도착 날짜<\/b>를 기준으로 3일을 세시면 됩니다. 애매하면 <b>공식 사이트에서 도착일을 넣어 보고 화면이 진행되는지<\/b> 확인하는 것이 가장 확실합니다.<\/p>\n<h3>Q. 유효기간이 있나요? 미리 받아 두면 다음에도 쓰나요?<\/h3>\n<p>아닙니다. TDAC는 <b>그 여행의 그 입국 건<\/b>에 대한 신고입니다. ESTA처럼 <b>여러 해 동안 재사용하는 허가가 아닙니다.<\/b><\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec11\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내<\/b>\n<a href=\"https://tdac.immigration.go.th\" rel=\"nofollow\" target=\"_blank\">▸ 태국 이민국 — TDAC 제출 공식 사이트 (tdac.immigration.go.th)<\/a>\n<a href=\"https://tdac.immigration.go.th/manual/kr/index.html\" rel=\"nofollow\" target=\"_blank\">▸ 태국 이민국 — TDAC 한국어 이용 안내(신청 절차·입력 항목)<\/a>\n<a href=\"https://tdac.immigration.go.th/manual/kr/faq.html\" rel=\"nofollow\" target=\"_blank\">▸ 태국 이민국 — TDAC 한국어 자주 묻는 질문(제출 시점·수정 불가 항목·면제 대상)<\/a>\n<a href=\"https://0404.go.kr/ntnSafetyInfo/260/detail\" rel=\"nofollow\" target=\"_blank\">▸ 외교부 해외안전여행 — 태국 국가정보(사증면제 90일·입국 거부 사유·TDAC 의무화)<\/a>\n<a href=\"https://overseas.mofa.go.kr/th-ko/index.do\" rel=\"nofollow\" target=\"_blank\">▸ 주태국 대한민국 대사관 (현지 공지·영사 민원)<\/a>\n<p style=\"margin:10px 0 0;font-size:14px;color:#1b4f86\">▸ 외교부 <b>영사안전콜센터 02-3210-0404<\/b> (해외에서 +82-2-3210-0404)<\/p>\n<\/div>\n\n<div class=\"end\"><b>✅ 마무리 — 세 줄로 정리하면<\/b><p style=\"margin:8px 0 0\"><b>①<\/b> 태국은 <b>2025년 5월 1일부터<\/b> 입국하는 모든 외국인에게 <b>디지털 입국카드(TDAC)<\/b> 를 요구합니다. 항공·육로·해로 모두 대상이고, <b>입국할 때마다 매번<\/b> 냅니다. <b>②<\/b> 다른 나라 사전등록과 달리 <b>도착일 포함 3일 전(최대 72시간 전)부터<\/b>만 제출됩니다 — <b>미리 해 둘 수 없습니다.<\/b> 그리고 <b>성명·여권번호·국적·생년월일은 낸 뒤에 고칠 수 없으니<\/b> 제출 전 미리보기에서 여권과 한 글자씩 대조하세요. <b>③<\/b> 우리 일반여권은 외교부 국가정보 기준 <b>사증면제 90일(협정)<\/b> 입니다. 다만 <b>여권 유효기간 6개월 미만·귀국 항공권 미소지·비자면제 입국 반복<\/b>은 입국 거부 사유이니, 출발 전 <b>여권 만료일부터<\/b> 확인하세요.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월<\/b> 기준이며, <b>제출 절차·입력 항목·입국 요건은 태국 정부 정책에 따라 변경될 수 있습니다.<\/b> 3장과 8장의 날짜 계산은 <b>가정한 일정에 규칙을 적용한 예시<\/b>이며, 실제 제출 가능 여부는 <b>공식 사이트에서 도착일을 입력해 확인<\/b>하시는 것이 기준입니다. <b>TDAC 수수료 유무와 미제출 시 제재 내용은 공식 안내에 표기가 없어 이 글에서는 다루지 않았습니다.<\/b> 태국의 무비자 정책은 국적별로 다르게 적용되므로, <b>다른 나라 기준으로 쓰인 영문 안내의 체류 일수를 우리 여권에 그대로 적용하지 마시고<\/b> 외교부 국가정보를 확인하세요.<br>출처: 태국 이민국 TDAC 공식 안내 사이트(tdac.immigration.go.th — 한국어 이용안내 및 자주 묻는 질문, 영문 FAQ), 외교부 해외안전여행 태국 국가정보(0404.go.kr — 사증면제 \"일반여권 소지자: O,(90일) 협정\", 입국 거부 사유, \"2025.5.1.(목)부터 … 디지털 입국카드(TDAC) 작성 의무화\", 외화 15,000달러 초과 세관신고). 영사안전콜센터 02-3210-0404<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/qr-2026-visit-japan-web.html\">▸ 비지트재팬웹 등록 방법 일본 입국심사 세관신고 QR코드 총정리 (2026 Visit Japan Web)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/30-2026-12-31.html\">▸ 중국 무비자 입국 조건 체류기간 30일 계산법 총정리 (2026년 12월 31일까지)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_372.html\">▸ 해외여행 준비물 체크리스트 올인원 가이드 여권 환전 로밍 면세 총정리<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 제출 시점·입력 항목·수정 불가 항목은 <b>태국 이민국 TDAC 공식 안내 사이트<\/b>의 한국어 이용안내와 자주 묻는 질문을, 체류 기간과 입국 거부 사유는 <b>외교부 해외안전여행 태국 국가정보<\/b>를 직접 열어 확인해 정리했습니다. 공식 표기가 없는 <b>수수료·제재<\/b>는 추정하지 않고 뺐습니다. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▲ OSMU 확산용 핵심 3줄 요약 (네이버·쓰레드용)\n1. 태국은 2025년 5월 1일부터 입국하는 모든 외국인에게 디지털 입국카드(TDAC) 제출을 의무화했습니다. 예전 종이 입국신고서를 대신하는 것으로, 항공기뿐 아니라 차량·선박으로 들어가도 대상이고 입국할 때마다 매번 새로 냅니다. 공식 사이트는 tdac.immigration.go.th 이며, 승무원과 이민국을 통과하지 않는 단순 환승객은 제출 대상이 아닙니다.\n2. 가장 많이 걸리는 지점은 제출 시점입니다. 공식 안내가 \"도착일을 포함하여 태국 도착 3일 전부터\" 그리고 \"최대 72시간 전\"이라고 못박고 있어서 한 달 전에 미리 해 두는 것이 아예 불가능합니다. 9월 26일 도착이면 9월 24일부터 열립니다. 또 제출 후 성명·여권번호·국적·생년월일은 수정할 수 없고 나머지 항목만 '도착 카드 수정'으로 고칠 수 있으니, 제출 전 미리보기 화면에서 여권과 한 글자씩 대조해야 합니다. 가족은 한 번에 최대 10명까지 묶어 등록됩니다.\n3. 체류 기간은 인터넷에서 30일·60일·90일이 뒤섞여 돌아다니는데, 외교부 해외안전여행 태국 국가정보는 우리 일반여권을 \"O,(90일) 협정\"으로 표기합니다. 다만 TDAC는 비자가 아니라 신고 서류이므로 입국 심사는 별개입니다. 여권 훼손, 여권 유효기간 6개월 미만, 귀국 항공권 미소지, 입국 목적 불확실, 그리고 정당한 사유 없이 비자면제 입국을 반복하는 경우는 입국 거부 사유로 명시돼 있습니다. 9월 26일 출발이라면 여권 만료일이 2027년 3월 26일보다 뒤여야 안전합니다.\n"},{"code":"D3-05","title":"전세 계약갱신청구권 행사 방법 5% 상한 묵시적 갱신 차이 총정리 (2026 가을 이사철)","lane":"info","thumb":"176_lease_renewal.png","draft":"계 size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#8a97ab;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">생활·행정<\/span>\n<p>전세 만기가 다가오면 집주인에게서 이런 연락이 옵니다. <b>\"보증금 좀 올려야겠습니다.\"<\/b> 이때 <b>얼마까지 올려줘야 하는지, 안 올려주면 나가야 하는지<\/b>는 그날의 대화 분위기가 아니라 <b>법에 이미 정해져 있습니다.<\/b><\/p>\n<p>그런데 같은 \"계약 연장\"인데도 <b>계약갱신요구권·묵시적 갱신·재계약<\/b>은 서로 규칙이 다릅니다. 특히 <b>재계약에는 5% 상한이 적용되지 않습니다.<\/b> 이 차이를 모르고 \"그냥 다시 쓰죠\"라고 도장을 찍으면, 지킬 수 있었던 상한을 스스로 포기하는 셈입니다.<\/p>\n<p>아래에서 세 가지를 표로 갈라 보고, <b>보증금 3억 원 전세<\/b>를 넣은 실제 계산으로 인상 한도와 <b>집주인이 실거주를 핑계로 내보낸 뒤 남에게 세를 놨을 때 받을 수 있는 손해배상액<\/b>까지 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 갱신요구권·묵시적 갱신·재계약, 무엇이 다른가<\/a><a href=\"#sec2\">2. 언제까지 말해야 하나 — 6개월 전부터 2개월 전까지<\/a><a href=\"#sec3\">3. 얼마까지 올려줘야 하나 (계산예시)<\/a><a href=\"#sec4\">4. 집주인이 거절할 수 있는 9가지 사유<\/a><a href=\"#sec5\">5. 실거주로 내보낸 뒤 남에게 세를 놨다면 (손해배상 계산)<\/a><a href=\"#sec6\">6. 놓치기 쉬운 체크포인트<\/a><a href=\"#sec7\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec3\">👉 우리 집은 얼마까지 올려줘야 할까? 계산부터 보기<\/a>\n\n<h2 id=\"sec1\">1. 갱신요구권·묵시적 갱신·재계약, 무엇이 다른가<\/h2>\n<p>계약을 이어 가는 길은 세 가지이고, <b>어느 길로 들어섰느냐에 따라 인상 한도와 중도 해지 가능 여부가 달라집니다.<\/b> 먼저 이 표부터 보시기 바랍니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>계약갱신요구권<\/th><th>묵시적 갱신<\/th><th>재계약(합의)<\/th><\/tr>\n<tr><th>성립<\/th><td>임차인이 기간 안에 요구<\/td><td>양쪽 다 아무 말 없이 기간 경과<\/td><td>양쪽이 새 조건에 합의<\/td><\/tr>\n<tr><th>기간<\/th><td>2년<\/td><td>2년<\/td><td>합의한 기간<\/td><\/tr>\n<tr><th>보증금·월세 인상<\/th><td><b>20분의 1(5%) 상한<\/b><\/td><td>전 계약과 동일 조건<\/td><td><b>상한 없음<\/b><\/td><\/tr>\n<tr><th>횟수<\/th><td><b>1회만<\/b><\/td><td>제한 없음<\/td><td>제한 없음<\/td><\/tr>\n<tr><th>중도 해지<\/th><td>가능(통지 후 3개월)<\/td><td>가능(통지 후 3개월)<\/td><td>계약서에 따름<\/td><\/tr>\n<\/table><\/div>\n<p><b>여기서 가장 비싼 실수가 나옵니다.<\/b> 집주인이 \"5%보다 더 올려주면 재계약해 주겠다\"고 하고 임차인이 응하면, 그건 갱신요구권 행사가 아니라 <b>재계약<\/b>입니다. 법은 <em>\"임대차계약이 종료된 후 재계약을 하는 경우 또는 임대차계약 종료 전이라도 당사자가 합의하는 경우에는 차임이나 보증금을 증액할 수 있다\"<\/em>고 하여 <b>합의 인상에는 상한을 두지 않습니다.<\/b> 그러니 5%를 넘는 금액을 제시받았다면, 도장을 찍기 전에 <b>\"저는 계약갱신요구권을 행사하겠습니다\"라는 의사를 문자로 먼저 남기는 것<\/b>이 순서입니다.<\/p>\n<div class=\"box\"><b>💡 묵시적 갱신이 더 유리할 때도 있습니다<\/b>\n<p style=\"margin:8px 0 0\">양쪽이 아무 말 없이 만기가 지나면 <b>전 계약과 동일한 조건<\/b>으로 2년 더 갑니다(주택임대차보호법 제6조 제1항·제2항). 보증금이 한 푼도 안 오르고, 임차인은 <b>언제든 해지를 통지<\/b>해 3개월 뒤에 나갈 수 있습니다(제6조의2). 다만 임차인이 <b>2기의 차임액에 이르도록 연체<\/b>했거나 임차인 의무를 현저히 위반한 경우에는 묵시적 갱신이 적용되지 않습니다(같은 조 제3항).<\/p><\/div>\n\n<h2 id=\"sec2\">2. 언제까지 말해야 하나 — 6개월 전부터 2개월 전까지<\/h2>\n<p>기간을 놓치면 권리 자체가 사라집니다. 법이 정한 창구는 <b>임대차기간이 끝나기 6개월 전부터 2개월 전까지<\/b>입니다(제6조의3 제1항, 제6조 제1항).<\/p>\n<div class=\"tw\"><table>\n<tr><th>누가<\/th><th>언제까지<\/th><th>안 하면<\/th><\/tr>\n<tr><th>임차인 — 갱신 요구<\/th><td>만기 6개월 전 ~ <b>2개월 전<\/b><\/td><td>갱신요구권을 쓸 수 없음<\/td><\/tr>\n<tr><th>임대인 — 갱신 거절 통지<\/th><td>만기 6개월 전 ~ <b>2개월 전<\/b><\/td><td><b>묵시적 갱신<\/b>(2년 연장)<\/td><\/tr>\n<tr><th>임차인 — 나가겠다는 통지<\/th><td>만기 <b>2개월 전<\/b>까지<\/td><td><b>묵시적 갱신<\/b>(2년 연장)<\/td><\/tr>\n<\/table><\/div>\n<p>여기서 <b>\"2개월 전\"은 2020년 12월 10일 이후 최초로 체결되거나 갱신된 임대차부터<\/b> 적용됩니다(법제처 생활법령). 만기일을 달력에 적고 <b>거꾸로 2개월<\/b>을 세어 두시기 바랍니다. 하루만 늦어도 이 권리는 그해에는 쓸 수 없습니다.<\/p>\n<div class=\"warn\"><b>⚠️ 말로만 하면 나중에 증명할 수 없습니다<\/b>\n<p style=\"margin:8px 0 0\">\"전화로 말씀드렸는데요\"는 분쟁이 붙으면 서로 기억이 다릅니다. <b>문자·카카오톡처럼 날짜가 남는 방법<\/b>으로 \"○년 ○월 ○일 만기 건, 계약갱신요구권을 행사합니다\"라고 명확히 남기고 화면을 보관하세요. 상대가 답이 없거나 읽지 않는다면 <b>내용증명우편<\/b>이 가장 확실합니다. 갱신요구는 <b>도달해야<\/b> 효력이 있으므로, 마감 이틀 전보다는 여유 있게 보내는 편이 안전합니다.<\/p><\/div>\n\n<h2 id=\"sec3\">3. 얼마까지 올려줘야 하나 (계산예시)<\/h2>\n<p>갱신요구권으로 갱신되는 계약은 <b>전 임대차와 동일한 조건<\/b>으로 다시 계약된 것으로 보되, 차임과 보증금만 제7조 범위에서 증감할 수 있습니다(제6조의3 제3항). 그 제7조가 정한 한도가 이렇습니다.<\/p>\n<ul>\n<li><b>상한<\/b> — <em>\"약정한 차임이나 임차보증금의 20분의 1의 금액을 초과하여 증액청구를 할 수 없습니다\"<\/em>(제7조 제2항). 20분의 1 = <b>5%<\/b>입니다.<\/li>\n<li><b>1년 제한<\/b> — <em>\"임대차계약 또는 차임이나 보증금의 증액이 있은 후 1년 이내에는 증액청구를 할 수 없습니다\"<\/em>(제7조 제1항 후단).<\/li>\n<li><b>지역별 하향 가능<\/b> — 시·도는 20분의 1의 범위에서 <b>조례로 상한을 더 낮게<\/b> 정할 수 있습니다(제7조 제2항). 내 지역 조례가 있는지 확인해 볼 값어치가 있습니다.<\/li>\n<\/ul>\n<h3>보증금 3억 원 전세라면<\/h3>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>금액<\/th><th>계산<\/th><\/tr>\n<tr><th>현재 보증금<\/th><td>3억 원<\/td><td>—<\/td><\/tr>\n<tr><th>인상 한도(20분의 1)<\/th><td><b>1,500만 원<\/b><\/td><td>3억 × 1/20<\/td><\/tr>\n<tr><th>갱신 후 최대 보증금<\/th><td><b>3억 1,500만 원<\/b><\/td><td>3억 + 1,500만<\/td><\/tr>\n<\/table><\/div>\n<p>집주인이 3억 3,000만 원을 요구한다면, 갱신요구권을 행사하는 한 <b>그 요구는 법정 한도를 넘습니다.<\/b> 반대로 임차인이 그 금액에 <b>합의해 재계약을 쓰면 상한은 적용되지 않습니다<\/b>(1번 표 참고).<\/p>\n<div class=\"box\"><b>💡 보증금과 월세가 함께 있는 계약<\/b>\n<p style=\"margin:8px 0 0\">법문은 <em>\"차임이나 임차보증금의 20분의 1\"<\/em>이라고만 정하고 있어, 보증금과 월세를 어떻게 나눠 올릴지는 사안마다 다툼이 생깁니다. 금액이 크거나 계산이 엇갈리면 혼자 판단하지 마시고 <b>대한법률구조공단 주택임대차분쟁조정위원회<\/b>(무료)에 조정을 신청하는 편이 빠릅니다. 아래 공식 안내에 링크를 두었습니다.<\/p><\/div>\n\n<h2 id=\"sec4\">4. 집주인이 거절할 수 있는 9가지 사유<\/h2>\n<p>갱신요구를 받은 임대인은 <b>정당한 사유 없이 거절하지 못합니다.<\/b> 거절할 수 있는 경우는 법에 <b>9가지로 한정<\/b>되어 있습니다(제6조의3 제1항 단서).<\/p>\n<ol>\n<li>임차인이 <b>2기의 차임액<\/b>에 해당하는 금액에 이르도록 차임을 <b>연체한 사실이 있는 경우<\/b><\/li>\n<li>거짓이나 그 밖의 부정한 방법으로 임차한 경우<\/li>\n<li>서로 합의하여 임대인이 임차인에게 <b>상당한 보상<\/b>을 제공한 경우<\/li>\n<li>임대인의 동의 없이 주택의 전부 또는 일부를 <b>전대<\/b>한 경우<\/li>\n<li>주택의 전부 또는 일부를 <b>고의나 중대한 과실로 파손<\/b>한 경우<\/li>\n<li>주택의 전부 또는 일부가 <b>멸실<\/b>되어 임대차의 목적을 달성하지 못할 경우<\/li>\n<li><b>철거·재건축<\/b>이 필요한 경우 — 단 ⓐ계약 당시 공사시기·소요기간을 포함한 계획을 구체적으로 고지하고 그 계획에 따르거나 ⓑ노후·훼손 등 안전사고 우려가 있거나 ⓒ다른 법령에 따라 철거·재건축이 이루어지는 경우<\/li>\n<li>임대인(그 <b>직계존속·직계비속 포함<\/b>)이 목적 주택에 <b>실제 거주<\/b>하려는 경우<\/li>\n<li>그 밖에 임차인 의무를 현저히 위반하거나 임대차를 계속하기 어려운 <b>중대한 사유<\/b>가 있는 경우<\/li>\n<\/ol>\n<div class=\"warn\"><b>⚠️ 1번은 \"지금 밀려 있는가\"가 아니라 \"밀린 적이 있는가\"입니다<\/b>\n<p style=\"margin:8px 0 0\">조문은 <em>\"연체한 사실이 있는 경우\"<\/em>라고 적혀 있습니다. 지난달 두 달 치를 밀렸다가 나중에 전부 갚았더라도 <b>거절 사유가 성립할 수 있습니다.<\/b> 월세 계약이라면 이체 날짜를 관리하는 것 자체가 갱신권을 지키는 일입니다.<\/p><\/div>\n<p>가장 흔한 거절 사유는 <b>8번 실거주<\/b>입니다. 그리고 이 사유에는 법이 별도의 안전장치를 붙여 두었습니다.<\/p>\n\n<h2 id=\"sec5\">5. 실거주로 내보낸 뒤 남에게 세를 놨다면 (손해배상 계산)<\/h2>\n<p>집주인이 \"내가 들어가 산다\"며 갱신을 거절했는데, <b>갱신됐더라면 살 수 있었던 2년이 끝나기 전에 정당한 사유 없이 제3자에게 세를 놓으면<\/b> 임대인은 임차인이 입은 손해를 배상해야 합니다(제6조의3 제5항). 배상액은 합의가 없으면 <b>다음 세 가지 중 큰 금액<\/b>입니다(같은 조 제6항).<\/p>\n<ol>\n<li>갱신거절 당시 <b>환산월차임의 3개월분<\/b><\/li>\n<li>임대인이 제3자에게 임대해 얻은 환산월차임과 갱신거절 당시 환산월차임의 <b>차액의 2년분<\/b><\/li>\n<li>갱신거절로 임차인이 <b>실제 입은 손해액<\/b><\/li>\n<\/ol>\n<h3>환산월차임부터 구합니다<\/h3>\n<p>보증금을 월세로 바꿀 때 쓰는 비율은 <b>①연 1할(10%)<\/b>과 <b>②한국은행 기준금리 + 연 2%<\/b> 중 <b>낮은 쪽<\/b>입니다(제7조의2, 시행령 제9조). 기준금리가 <b>연 2.75%<\/b>(2026년 7월 16일 변경)이므로 ②는 <b>4.75%<\/b>, 따라서 낮은 쪽인 <b>4.75%<\/b>가 적용됩니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>상황<\/th><th>계산<\/th><th>금액<\/th><\/tr>\n<tr><th>내가 살던 조건 (보증금 3억)<\/th><td>3억 × 4.75% ÷ 12<\/td><td>환산월차임 <b>1,187,500원<\/b><\/td><\/tr>\n<tr><th>집주인이 새로 놓은 조건 (보증금 3.5억)<\/th><td>3.5억 × 4.75% ÷ 12<\/td><td>환산월차임 <b>1,385,416원<\/b><\/td><\/tr>\n<tr><th>① 3개월분<\/th><td>1,187,500 × 3<\/td><td>3,562,500원<\/td><\/tr>\n<tr><th>② 차액의 2년분<\/th><td>(1,385,416 − 1,187,500) × 24<\/td><td><b>4,750,000원<\/b><\/td><\/tr>\n<tr><th>③ 실제 손해액<\/th><td>이사비·중개보수·차액 임차료 등 입증한 금액<\/td><td>사안별<\/td><\/tr>\n<\/table><\/div>\n<p>이 예에서는 <b>②가 가장 커서 약 475만 원<\/b>이 기준이 됩니다. 이사 비용과 중개보수, 더 비싼 집으로 옮기며 늘어난 부담을 <b>영수증으로 입증할 수 있다면 ③이 더 커질 수도<\/b> 있으니, 나갈 때 자료를 버리지 마시기 바랍니다. 기준금리는 바뀌므로 실제 계산 시점의 금리를 다시 확인해야 합니다.<\/p>\n<h3>거짓 실거주인지 확인하는 방법<\/h3>\n<p>내보내진 임차인이 \"그 집에 정말 집주인이 사는가\"를 확인할 길도 법에 열려 있습니다. <b>실거주(8호)를 이유로 갱신이 거절된 임대차계약의 임차인이었던 자<\/b>는 <b>이해관계인<\/b>으로서 확정일자부여기관에 <b>그 주택의 확정일자 부여일·차임·보증금 등 정보 제공을 요청<\/b>할 수 있고, 요청받은 기관은 정당한 사유 없이 거부하지 못합니다(법 제3조의6 제3항, 시행령 제5조 제5호). 새로운 임대차가 있었는지 확인할 수 있는 <b>공식 경로<\/b>입니다.<\/p>\n\n<h2 id=\"sec6\">6. 놓치기 쉬운 체크포인트<\/h2>\n<ul>\n<li><b>갱신요구권은 1회 한정<\/b> — 한 번 행사하면 그 임대차에서는 다시 쓸 수 없습니다(제6조의3 제2항). 반면 묵시적 갱신은 <b>임차인이 요구해서 생기는 것이 아니라<\/b> 양쪽이 통지를 하지 않아 성립하는 것이고(제6조 제1항), 조문에 횟수 제한이 없습니다.<\/li>\n<li><b>2년을 다 채울 의무는 없습니다<\/b> — 갱신된 임대차의 해지에는 제6조의2가 준용되어(제6조의3 제4항), 임차인은 <b>언제든 해지를 통지<\/b>할 수 있고 <b>임대인이 통지를 받은 날부터 3개월이 지나면 효력<\/b>이 생깁니다. 갱신해 두고 좋은 집이 나오면 3개월 전 통지로 나갈 수 있다는 뜻입니다.<\/li>\n<li><b>3개월은 \"말한 날\"이 아니라 \"받은 날\"부터<\/b> — 도달 시점이 기준이므로 문자·내용증명으로 도달을 남겨 두세요.<\/li>\n<li><b>계약서를 새로 쓰지 않아도 갱신은 성립합니다<\/b> — 다만 보증금이 올랐다면 <b>증액분에 대해 확정일자를 새로 받아 두어야<\/b> 우선변제 순위에서 손해를 보지 않습니다.<\/li>\n<li><b>다툼이 생기면 소송 전에 조정<\/b> — 대한법률구조공단 주택·상가건물 임대차분쟁조정위원회는 <b>무료<\/b>로 조정을 진행합니다.<\/li>\n<\/ul>\n\n<h2 id=\"sec7\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b>\n<a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&amp;csmSeq=629&amp;ccfNo=4&amp;cciNo=4&amp;cnpClsNo=1\" target=\"_blank\" rel=\"nofollow\">▸ 법제처 찾기쉬운 생활법령정보 — 주택임대차 임대차계약의 갱신<\/a>\n<a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&amp;csmSeq=629&amp;ccfNo=4&amp;cciNo=1&amp;cnpClsNo=2\" target=\"_blank\" rel=\"nofollow\">▸ 법제처 찾기쉬운 생활법령정보 — 차임 또는 보증금의 증감청구<\/a>\n<a href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%A3%BC%ED%83%9D%EC%9E%84%EB%8C%80%EC%B0%A8%EB%B3%B4%ED%98%B8%EB%B2%95\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 주택임대차보호법 전문<\/a>\n<a href=\"https://www.hldcc.or.kr/\" target=\"_blank\" rel=\"nofollow\">▸ 대한법률구조공단 — 주택·상가건물 임대차분쟁조정위원회(무료 조정)<\/a>\n<a href=\"https://www.bok.or.kr/portal/singl/baseRate/list.do?dataSeCd=01&amp;menuNo=200643\" target=\"_blank\" rel=\"nofollow\">▸ 한국은행 — 기준금리 추이(환산월차임 계산용)<\/a>\n<\/div>\n\n<div class=\"end\"><b>✅ 마무리<\/b>\n<p style=\"margin:8px 0 0\">기억할 것은 세 가지입니다. 첫째, <b>만기 6개월 전부터 2개월 전까지<\/b> 문자로 남겨 갱신을 요구하세요. 둘째, 갱신요구권으로 갱신하면 인상은 <b>20분의 1(5%)까지<\/b>이고 <b>재계약에는 이 상한이 없습니다<\/b> — \"그냥 다시 씁시다\"라는 말에 바로 응하지 마세요. 셋째, <b>실거주를 이유로 내보낸 집이 곧 다른 세입자를 받았다면<\/b> 확정일자 정보를 열람해 확인하고 손해배상을 청구할 수 있습니다. 금액이 크거나 다툼이 생기면 소송보다 <b>무료 분쟁조정<\/b>이 빠릅니다.<\/p><\/div>\n\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월<\/b> 기준이며, 법령·기준금리는 변동될 수 있습니다. 인용한 법령은 주택임대차보호법(시행 2026. 1. 2., 법률 제21065호)과 같은 법 시행령(시행 2026. 7. 1., 대통령령 제36423호)입니다. 기준금리는 2026년 7월 16일 변경분(연 2.75%)입니다.<br>출처: <a href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%A3%BC%ED%83%9D%EC%9E%84%EB%8C%80%EC%B0%A8%EB%B3%B4%ED%98%B8%EB%B2%95\"  한 번에 정리했습니다. 공식 확인 페이지도 함께 안내합니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 가을철 4대 발열성질환 한눈에 비교<\/a><a href=\"#sec2\">2. 쯔쯔가무시증 — 증상과 대처<\/a><a href=\"#sec3\">3. SFTS(중증열성혈소판감소증후군)<\/a><a href=\"#sec4\">4. 렙토스피라증·신증후군출혈열<\/a><a href=\"#sec5\">5. 벌초·성묘 전후 실천 체크리스트<\/a><a href=\"#sec6\">6. 자주 묻는 질문<\/a><a href=\"#sec7\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec5\">👉 벌초 전 체크리스트부터 보기<\/a>\n\n<h2 id=\"sec1\">1. 가을철 4대 발열성질환 한눈에 비교<\/h2>\n<p>넷 다 <b>발열·두통·근육통<\/b>으로 시작해 감기와 헷갈리기 쉽지만, 매개체와 호발 시기가 달라 구분이 필요합니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>질환<\/th><th>매개체<\/th><th>호발 시기<\/th><th>잠복기<\/th><th>특징적 증상<\/th><\/tr>\n<tr><td>쯔쯔가무시증<\/td><td>털진드기 유충<\/td><td>9~12월(특히 10~11월)<\/td><td>-<\/td><td>물린 자리 <b>검은 가피<\/b>(5~20mm)<\/td><\/tr>\n<tr><td>SFTS<\/td><td>참진드기(작은소피참진드기 등)<\/td><td>4~11월(10월 최다)<\/td><td>5~14일(평균 9일)<\/td><td>고열+<b>혈소판 감소<\/b>, 치명률 약 20%<\/td><\/tr>\n<tr><td>렙토스피라증<\/td><td>쥐 등 설치류 소변(오염된 물·흙)<\/td><td>8~11월(장마 뒤 특히)<\/td><td>1~2주<\/td><td>심한 근육통(종아리·허벅지), 안결막 충혈<\/td><\/tr>\n<tr><td>신증후군출혈열<\/td><td>등줄쥐 등 배설물 먼지 흡입<\/td><td>10~12월<\/td><td>2~3주<\/td><td>발열→저혈압→핍뇨(신부전) 단계적 진행<\/td><\/tr>\n<\/table><\/div>\n<p>쯔쯔가무시증은 정확한 잠복기가 확인되지 않아 표에서 비워뒀습니다 — 근거 없는 수치를 적기보다 공식 페이지 확인을 권합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 쯔쯔가무시증 — 증상과 대처<\/h2>\n<p>털진드기 유충에 물려 감염되며, 벌초·밤 줍기 등 <b>산 관련 야외활동<\/b> 중 노출되는 경우가 가장 많습니다.<\/p>\n<ul>\n<li><b>진단의 핵심 단서<\/b>: 물린 부위에 생기는 <b>직경 5~20mm의 검은 가피(딱지)<\/b> — 통증이 없어 본인은 모르는 경우가 많습니다.<\/li>\n<li><b>증상<\/b>: 발열, 두통, 근육통, 오한. 발병 3~7일 후 몸통에서 시작해 팔·다리로 퍼지는 붉은 발진.<\/li>\n<li><b>치료<\/b>: 항생제(독시사이클린 등)를 투여하면 <b>48시간 이내 해열<\/b>되는 것이 일반적입니다.<\/li>\n<\/ul>\n<div class=\"tip\"><b>⚠️ 흔한 함정<\/b> — 진드기가 물어도 아프지 않아 <b>스스로는 언제 물렸는지 모릅니다.<\/b> 벌초·성묘 다녀온 뒤 1~2주 안에 고열이 나면 \"감기겠지\"로 넘기지 말고, <b>병원에서 반드시 최근 야외활동 이력을 알려야<\/b> 진단이 빨라집니다.<\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. SFTS(중증열성혈소판감소증후군)<\/h2>\n<ul>\n<li><b>매개체<\/b>: 국내 주요 매개는 <b>작은소피참진드기<\/b>이며, 개피참진드기 등도 전파합니다.<\/li>\n<li><b>증상<\/b>: 고열(38~40℃), 혈소판 감소, 구역·구토·설사, 림프절 비대. 중증으로 진행하면 장기부전·신경계 증상까지 나타날 수 있습니다.<\/li>\n<li><b>치명률<\/b>: 국내 <b>2015~2024년 누적 치명률 18.0%<\/b>(약 20% 수준)로, 4대 질환 중 가장 위중합니다.<\/li>\n<li><b>물렸을 때<\/b>: 진드기는 <b>손으로 터트리거나 잡아떼지 말고<\/b> 의료기관에서 안전하게 제거받은 뒤, 이후 <b>14일간 체온·건강 상태를 관찰<\/b>하며 이상 시 진찰을 받습니다.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 렙토스피라증·신증후군출혈열 — 설치류 매개 질환<\/h2>\n<h3>렙토스피라증<\/h3>\n<ul>\n<li><b>감염경로<\/b>: 감염된 쥐가 소변으로 배출한 균이 흙·논둑물·개울을 오염시키고, 상처나 점막으로 접촉해 감염됩니다.<\/li>\n<li><b>호발<\/b>: 장마로 쥐 서식 환경이 바뀌는 <b>8~11월<\/b>에 집중됩니다.<\/li>\n<li><b>주의<\/b>: 국내는 폐출혈형 비중이 높아, 이 시기 <b>폐출혈로 인한 사망 위험<\/b>이 존재합니다.<\/li>\n<li><b>예방<\/b>: 침수지역 작업 등 고위험 상황에서는 <b>독시사이클린을 주 1회 예방적으로 복용<\/b>하는 방법이 쓰이며, 아직 백신은 없습니다. 발병 5일 이내 항생제(페니실린G·독시사이클린)를 투여하면 경과를 단축할 수 있습니다.<\/li>\n<\/ul>\n<h3>신증후군출혈열(한타바이러스감염증)<\/h3>\n<ul>\n<li><b>감염경로<\/b>: 등줄쥐·집쥐의 분변·소변·타액이 마르며 생긴 먼지를 호흡기로 들이마실 때 감염됩니다. <b>사람 간 전염은 없습니다.<\/b><\/li>\n<li><b>경과(5단계)<\/b>: 발열기(3~7일, 고열·두통·복통·요통) → 저혈압기(수시간~2일) → 핍뇨기(3~7일, 신부전 위험이 가장 높은 시기) → 이뇨기 → 회복기 순으로 진행합니다.<\/li>\n<li><b>예방접종(한타박스)<\/b>: 군인·농부·실험실 종사자 등 <b>고위험군<\/b>이 대상이며, <b>10월 이전 접종을 권장<\/b>합니다(0·1·13개월 3회 접종). 일반인은 접종 대상이 아니며 설치류 접촉 회피가 우선입니다.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 벌초·성묘 전후 실천 체크리스트<\/h2>\n<p>2026년 추석은 <b>9월 25일(9/24~26 연휴)<\/b>이라, 벌초·성묘가 몰리는 시기가 바로 지금부터입니다. 아래 항목을 그대로 따라 하세요.<\/p>\n<ul>\n<li>☑ <b>긴 소매·긴 바지·장화·모자·장갑<\/b> 착용, 소매·바지 끝은 여미기<\/li>\n<li>☑ 노출 부위에 <b>진드기 기피제<\/b> 사용<\/li>\n<li>☑ 풀밭에 <b>앉거나 눕지 않기<\/b>, 돗자리를 쓰더라도 맨몸 접촉 최소화<\/li>\n<li>☑ 고인 물·젖은 땅은 되도록 밟지 않고, 상처가 있으면 오염된 물에 노출되지 않게 주의<\/li>\n<li>☑ 작업 후에는 <b>즉시 샤워하고 옷은 바로 세탁<\/b>(벗은 옷을 실내에 오래 두지 않기)<\/li>\n<li>☑ 진드기가 붙어 있으면 직접 떼지 말고 <b>의료기관에서 제거<\/b><\/li>\n<li>☑ 다녀온 뒤 1~3주 안에 발열·두통이 나면 <b>야외활동 사실을 반드시 알리고<\/b> 진료받기<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 자주 묻는 질문<\/h2>\n<h3>Q. 넷 다 사람 간에 옮나요?<\/h3>\n<p>아니요. 진드기·설치류를 매개로 사람에게 전파되는 것이 기본 경로이며, <b>신증후군출혈열은 사람 간 전염이 없습니다.<\/b> 다만 의료진 접촉 시 안전수칙은 지켜야 합니다.<\/p>\n<h3>Q. 물린 걸 못 봤는데 의심할 수 있나요?<\/h3>\n<p>네. 쯔쯔가무시증은 물린 부위가 아프지 않아 눈치채지 못하는 경우가 많습니다. <b>가을철 야외활동 뒤 원인 모를 고열<\/b>이 있다면 병원에서 이 시기 유행 질환들을 감별해 달라고 요청하세요.<\/p>\n<h3>Q. 신증후군출혈열 백신은 누구나 맞아야 하나요?<\/h3>\n<p>아니요. <b>군인·농업 종사자·실험실 근무자<\/b> 등 고위험군에게 권장되는 백신입니다. 일반인은 접종보다 설치류 접촉을 피하는 것이 우선입니다.<\/p>\n<h3>Q. 예방수칙을 지켰는데도 물렸다면요?<\/h3>\n<p>즉시 손으로 떼지 말고 의료기관을 방문하고, 이후 2~3주간 발열·발진 등 이상 증상을 관찰하세요. 증상이 나타나면 <b>야외활동 이력을 의료진에게 알리는 것<\/b>이 빠른 진단의 핵심입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5261\" target=\"_blank\" rel=\"nofollow\">▸ 질병관리청 — 쯔쯔가무시증<\/a><a href=\"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5233\" target=\"_blank\" rel=\"nofollow\">▸ 질병관리청 — SFTS(중증열성혈소판감소증후군)<\/a><a href=\"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5255\" target=\"_blank\" rel=\"nofollow\">▸ 질병관리청 — 렙토스피라증<\/a><a href=\"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5279\" target=\"_blank\" rel=\"nofollow\">▸ 질병관리청 — 신증후군출혈열(한타바이러스감염증)<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">가을철 발열성질환은 <b>초기엔 감기와 구분이 어렵지만, 방치하면 위중해질 수 있습니다.<\/b> 벌초·성묘 때는 긴 옷·기피제·샤워 3가지만 지켜도 위험을 크게 줄일 수 있고, 다녀온 뒤 발열이 있으면 <b>야외활동 사실을 꼭 의료진에게 알리세요.<\/b> 정확한 증상·치료 정보는 공식 사이트에서 확인하시기 바랍니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월<\/b> 기준이며, 통계·수칙은 변동될 수 있습니다. 진단·치료는 반드시 의료기관에서 확인하세요.<br>출처: <a href=\"https://health.kdca.go.kr/\" target=\"_blank\" rel=\"nofollow\">질병관리청 국가건강정보포털<\/a> · <a href=\"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=31606\" target=\"_blank       ?'<img class="qth" src="'+it.thumb_data+'" alt="">'
      :'<div class="qth none">썸네일<br>없음</div>';
    const facts=it.facts?'<div class="qfacts">'+esc(it.facts)+'</div>':'';
    const draft=it.draft?'<span class="qdraft">📄 '+esc(it.draft)+'</span>':'';
    const pv=it.body?'<button class="qpv" onclick="qpv(\''+esc(it.code||'')+'\')">👁 본문 미리보기</button>'
                    :'<span class="qpv none">초안 없음(작성 전)</span>';
    return '<div class="qcard">'+th
      +'<div class="qbody"><div class="qtop"><span class="qcode">'+esc(it.code||'')+'</span>'
      +'<span class="qlane '+(it.lane||'info')+'">'+esc(laneLab[it.lane]||it.lane||'')+'</span>'
      // 🙋 사장님 발행 승인 도장(2026-08-20) — 글감 승인과 다른 결정이다.
      //    도장이 없으면 publish-flow 가 막는다. 화면에서 바로 보이게 한다.
      +(it.go
        ?'<span class="qgo ok" title="'+esc((it.go.by||'')+' '+(it.go.at||''))+'">🙋 발행 승인됨</span>'
        :'<span class="qgo wait">🙋 사장님 발행 승인 대기</span>')
      +'</div>'
      +'<div class="qtitle">'+esc(it.title||'')+'</div>'+facts
      +'<div class="qmeta">'+pv+draft+'</div></div></div>';
  }).join('');
  // 🚦 오늘 발행량 배지 (2026-07-29) — 승인 누르기 '전에' 보이게 한다.
  //    2026-07-27 에 8편이 한꺼번에 나간 건, 사람이 재고만 보고 몰아서 승인했는데
  //    '오늘 몇 편째'를 아무도 안 세고 있었기 때문이다. 게이트(pace.check)는 발행을 막고,
  //    이 배지는 그 전에 눈으로 막는다.
  let paceHtml='';
  if(pace){
    const st=pace.state||'ok', n=pace.count||0, hard=pace.hard||2;
    const lab=st==='err'?'⚠️ 오늘 발행량을 못 셌습니다 — '+esc(pace.error||'')
      :st==='block'?'⛔ 오늘 '+n+'편 발행됨 — 오늘은 더 발행하지 마세요(3편 이상 금지)'
      :st==='warn'?'⚠️ 오늘 '+n+'편 발행됨 — 기본 페이스는 하루 1편입니다'
      :'✅ 오늘 '+n+'편 발행 — 하루 1편 기준 안';
    const bg=st==='block'?'#3a1218':st==='warn'?'#3a2f12':st==='err'?'#2a2030':'#0c3a2c';
    const bd=st==='block'?'#7a2230':st==='warn'?'#5a4a1a':st==='err'?'#4a3a5a':'#1f6b52';
    const fg=st==='block'?'#ff9aa6':st==='warn'?'#ffd166':st==='err'?'#c9b6e8':'#8ef0cf';
    const titles=(pace.posts||[]).map(p=>'<div style="opacity:.8;margin-top:2px">· '+esc(p.title||'')+'</div>').join('');
    const lanes=pace.lanes||{};
    const laneTxt=Object.keys(lanes).map(k=>{
      const L=lanes[k]; if(!L) return '';
      return '<span style="display:inline-block;margin-right:9px">'+esc(L.label||k)+' <b>'+(L.n||0)+'</b></span>';
    }).join('');
    const over=pace.backlog_over
      ?'<div style="margin-top:5px;color:#ffd166">📦 발행대기 재고 '+pace.backlog+'편 (상한 '+pace.backlog_max+' 초과) — 재고가 쌓이면 몰아치기 발행을 부릅니다. PREP 초안 생성이 잠긴 상태입니다.</div>'
      :'<div style="margin-top:5px;opacity:.75">📦 발행대기 재고 '+(pace.backlog||0)+'편 / 상한 '+(pace.backlog_max||5)+'</div>';
    const laneRow=laneTxt?'<div style="margin-top:4px;opacity:.8;font-size:11.5px">🛤 레인별: '+laneTxt+'<span style="opacity:.6">(자동 2 + 사용자 창구 1 · 루틴은 1회 1건)</span></div>':'';
    paceHtml='<div style="background:'+bg+';border:1px solid '+bd+';color:'+fg
      +';border-radius:8px;padding:8px 11px;margin:2px 0 9px;font-size:12px;line-height:1.5">'
      +'<b>'+lab+'</b>'+titles+over+laneRow+'</div>';
  }
  const qHtml=paceHtml+(qItems.length
    ?'<div class="cnt">발행 대기 '+qItems.length+'건 — 발행하면 카드가 자동으로 사라집니다(사람 승인 게이트)</div>'+qCards
    :'<div class="pcode none">발행 대기 없음 — PREP 루틴이 준비하면 여기 카드로 뜹니다</div>');
  // 🙋 내가 할 일 섹션은 2026-08-12 사용자 지시로 이 화면에서 제거하고
  // index.html(운영콘솔 첫 페이지)의 별도 탭(data-t="mytasks")으로 이전했다.
  document.getElementById('board').innerHTML=
   '<div class="hd"><div class="t"><h1>진행현황</h1><span class="date">'+esc(date)+'</span></div>'
   +'<span class="badge '+bcls+'">'+CHECK+esc(blab)+'</span></div>'
   +'<div class="sec">오늘 한 일</div>'+today
   +'<div class="metrics">'
   +'<div class="m"><div class="l">검사 통과</div><div class="v">'+pass+' <small>/ '+total+'</small></div></div>'
   +'<div class="m"><div class="l">블로그 글</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">평균 본문</div><div class="v">'+avg+' <small>자</small></div></div>'
   +'</div>'
   +'<div class="div"></div>'
   +'<div class="sec">🧾 글감 승인 라인 (루틴 제안 → 이부장 선별 → 사장님 승인)<span class="auto">🤖 topicprop</span></div>'+tpHtml
   +'<div class="sec">📋 발행 대기 (오늘 발행할 글)<span class="auto">🤖 PREP 큐</span></div>'+qHtml
   +'<div class="div"></div>'
   +'<div class="sec">발행 진행 (글 1편 · '+STEPS.length+'단계, 확산 포함)<span class="auto">🤖 자동</span></div>'+pubHtml
   +'<div class="div"></div>'
   +'<div class="sec">📡 4채널 발행 현황 (구글·네이버·쓰레드·인스타)<span class="auto">🤖 DB 자동집계</span></div>'
   +'<div class="metrics">'
   +'<div class="m"><div class="l">구글(원본)</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">네이버</div><div class="v">'+oNv+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">쓰레드</div><div class="v">'+oTh+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">인스타</div><div class="v">'+oIn+' <small>편</small></div></div>'
   +'</div>'
   +'<div class="cnt">확산 커버리지 · 네이버 '+(count?Math.round(oNv/count*100):0)+'% · 쓰레드 '+(count?Math.round(oTh/count*100):0)+'% · 인스타 '+(count?Math.round(oIn/count*100):0)+'% · 교차링크 완료 '+omAll.length+'편</div>'
   +osmuLi
   +'<div class="div"></div>'
   +'<div class="sec">🤝 협업 — 세션별 역할·진행<span class="auto">git 자동분류</span></div>'+collabHtml
   +'<div class="sec">💡 시스템 조언<span class="auto">라이브 도출</span></div>'+adviceHtml
   +'<div class="div"></div>'
   +'<div class="sec">📋 미결 관리 — 4채널 매칭<span class="auto">G구글·N네이버·T쓰레드·I인스타</span></div>'+pendHtml
   +'<div class="sec">다음</div><div class="next">'+next+'</div>'
   +'<div class="upd" id="upd"></div>';
  tick();
}
// 시계·데이터 기준만 갱신(보드 전체 재렌더 없음 — 정적 베이크 데이터라 시계만 변함)
function tick(){
  const el=document.getElementById('upd'); if(!el)return;
  const b=(window.__DATA__||{}).baked_at;
  el.textContent=(b?'데이터 기준 '+b+' · ':'')+new Date().toLocaleTimeString('ko-KR');
}
// 👁 발행 대기 카드 본문 미리보기 — 초안 HTML을 격리 iframe(srcdoc)로 렌더(스타일 누수 차단, Blogger 미접촉)
function qpv(code){
  const items=((window.__DATA__||{}).queue||{}).items||[];
  const it=items.find(x=>x.code===code); if(!it||!it.body)return;
  document.getElementById('qpv-ttl').textContent=(it.code||'')+' · '+(it.title||'');
  document.getElementById('qpv-fr').srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank"><body style="margin:0;padding:16px;background:#fff">'+it.body+'</body>';
  document.getElementById('qpv-ov').classList.add('show');
}
function qpvClose(){document.getElementById('qpv-ov').classList.remove('show');document.getElementById('qpv-fr').srcdoc='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')qpvClose();});
// 코드 자동 반영: 자기 자신(progress.html)을 주기적으로 fetch→해시 비교, 바뀌면 1회 reload
const _hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
let _selfHash=null;
async function checkVersion(){
  try{
    const r=await fetch('progress.html?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;                                // 일시적 404/500에 해시 오염 → 불필요 reload 방지
    const t=await r.text();
    const h=_hash(t);
    if(_selfHash===null){_selfHash=h;return;}      // 첫 호출=기준선 저장
    if(h!==_selfHash) location.reload();            // 코드 변경 감지 → 자동 새로고침
  }catch(e){}
}
load(); checkVersion(); setInterval(tick,5000); setInterval(checkVersion,5000);
</script>
