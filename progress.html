을 충족하더라도 지원이 제한될 수 있음\"<\/b>이라고 적혀 있습니다. 고용노동부가 배포한 인포그래픽·신청서식·쿼터표 원문을 그대로 열어 요건과 탈락 사유를 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 어떤 제도인가 — 한눈에 보는 요약표<\/a><a href=\"#trap1\">2. 🔴 함정 ① 50세 이상이 아니라 <b>50~64세<\/b>입니다<\/a><a href=\"#trap2\">3. 🔴 함정 ② 훈련 수료가 먼저입니다 (인정 훈련 3종)<\/a><a href=\"#trap3\">4. 🔴 함정 ③ 사업장 조건은 <b>두 개를 모두<\/b> 만족해야 합니다<\/a><a href=\"#money\">5. 얼마를 언제 받나 — 180만 원 + 180만 원<\/a><a href=\"#calc\">6. 계산예시 — 내 신청 가능일 날짜로 역산하기<\/a><a href=\"#trap4\">7. 🔴 함정 ④ 신청 기한은 <b>3개월<\/b>입니다<\/a><a href=\"#how\">8. 신청 방법과 제출서류<\/a><a href=\"#quota\">9. 전국 1,000명 — 지역별 쿼터 원표<\/a><a href=\"#deny\">10. 지원에서 제외되는 8가지 경우<\/a><a href=\"#reject\">11. 부지급 통지를 받았다면 (이의신청 30일)<\/a><a href=\"#faq\">12. 자주 묻는 질문<\/a><a href=\"#gov\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#trap1\">👉 내가 대상인지 3가지 함정부터 확인하기<\/a>\n\n<h2 id=\"sec1\">1. 어떤 제도인가 — 한눈에 보는 요약표<\/h2>\n<p>고용노동부는 2026년부터 <b>「중장년내일이음패키지」<\/b>라는 이름으로 중장년 재취업을 일자리 발굴 → 생애경력설계 → 훈련 → 일경험 → 취업알선 → 장려금까지 하나로 잇는 서비스를 운영합니다. <b>「일손부족일자리 동행 인센티브」는 그 마지막 칸에 해당합니다.<\/b> 훈련·일경험을 마친 중장년이 실제로 구인난 업종에 취업해서 <b>버텨낸 기간에 대해<\/b> 개인에게 직접 현금을 주는 구조입니다.<\/p>\n<p>이 제도가 왜 생겼는지는 고용노동부 장관이 밝힌 숫자에 압축돼 있습니다. <b>주된 일자리에서의 평균 퇴직 연령은 52.9세인데, 국민들은 73.4세까지 일하고 싶다고 답합니다.<\/b> 그 20여 년의 공백을 메우자는 것이 사업의 취지입니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>내용<\/th><\/tr>\n<tr><td><b>사업명<\/b><\/td><td>2026년 <b>시범<\/b> 일손부족일자리 동행 인센티브<\/td><\/tr>\n<tr><td><b>대상 연령<\/b><\/td><td><b>50~64세<\/b> 중장년 (<b>취업일 기준<\/b>)<\/td><\/tr>\n<tr><td><b>선행 요건<\/b><\/td><td>폴리텍 중장년 특화과정 · 국가기간전략산업 직종훈련 · 중장년 경력지원제 <b>중 하나 수료<\/b><\/td><\/tr>\n<tr><td><b>대상 업종<\/b><\/td><td><b>제조업<\/b> 또는 <b>운수 및 창고업<\/b> (둘 중 하나만 해당하면 됨)<\/td><\/tr>\n<tr><td><b>사업장 규모<\/b><\/td><td>①피보험자수 5인 이상 <b>그리고<\/b> ②고용보험법 시행령 제12조 우선지원대상기업 (<b>둘 다<\/b>)<\/td><\/tr>\n<tr><td><b>지원 금액<\/b><\/td><td>6개월 근속 <b>180만 원<\/b> + 12개월 근속 <b>180만 원<\/b> = <b>최대 360만 원<\/b><\/td><\/tr>\n<tr><td><b>신청 기한<\/b><\/td><td>근속 6개월 달성 후 <b>다음 달부터 3개월 이내<\/b><\/td><\/tr>\n<tr><td><b>접수 개시<\/b><\/td><td><b>2026년 7월 1일(수)<\/b><\/td><\/tr>\n<tr><td><b>접수처<\/b><\/td><td>관할 <b>지방고용노동청<\/b>(취업지원총괄과) — 신청서 제출<\/td><\/tr>\n<tr><td><b>규모<\/b><\/td><td>전국 <b>1,000명<\/b> (지방청별 쿼터 배정, <b>예산 소진 시 마감<\/b>)<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 이 제도의 성격<\/b><p style=\"margin:8px 0 0\">사업주에게 주는 고용장려금이 아니라 <b>근로자 본인에게 직접 입금되는 인센티브<\/b>입니다. 신청도 본인이 하고, 계좌도 <b>반드시 본인 명의<\/b>여야 합니다(타인 계좌 기재 시 지급 불가).<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"trap1\">2. 🔴 함정 ① 50세 이상이 아니라 50~64세입니다<\/h2>\n<p>이 사업을 다룬 기사 대부분은 <b>\"50세 이상 중장년\"<\/b>이라고만 썼습니다. 그런데 고용노동부가 2026년 7월 21일 배포한 <b>공식 인포그래픽<\/b>의 지원대상 칸에는 이렇게 적혀 있습니다.<\/p>\n<div class=\"tip\"><b>📜 공식 자료 원문<\/b><p style=\"margin:8px 0 0\">폴리텍(중장년), 국기훈련, 경력지원제 등 수료한 <b style=\"font-size:19px\">50~64세<\/b> 중장년 <b>(취업일 기준)<\/b><\/p><\/div>\n<p><b>상한이 있습니다.<\/b> 65세 이상은 대상이 아닙니다. \"50세 이상이니까 나도 되겠지\"라고 생각하고 6개월을 채운 뒤 신청했다가 나이 때문에 부지급되는 상황이 실제로 생길 수 있습니다.<\/p>\n<h3>더 중요한 건 '언제' 기준이냐입니다<\/h3>\n<p>괄호 안의 <b>(취업일 기준)<\/b>이 핵심입니다. <b>신청하는 날의 나이가 아니라 그 회사에 입사한 날의 나이<\/b>로 봅니다.<\/p>\n<ul>\n<li><b>취업일에 64세, 신청일에 65세<\/b> → 취업일 기준으로 판단하므로 <b>요건 충족<\/b>에 해당합니다.<\/li>\n<li><b>취업일에 49세, 6개월 뒤 50세<\/b> → 취업일에 50세가 안 됐으므로 <b>대상이 아닙니다.<\/b><\/li>\n<\/ul>\n<p>즉 <b>만 49세인 분은 생일이 지난 뒤에 입사일을 잡는 것이 유리<\/b>하고, <b>만 64세인 분은 65세 생일 전에 입사<\/b>해야 합니다. 며칠 차이로 360만 원이 갈립니다. 본인 생년월일과 근로계약서상 근로개시일을 나란히 놓고 먼저 확인하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"trap2\">3. 🔴 함정 ② 훈련 수료가 먼저입니다<\/h2>\n<p>이것이 가장 많이 빠뜨리는 요건입니다. <b>제조업에 취업했다고 해서 아무나 받을 수 있는 돈이 아닙니다.<\/b> 신청서식의 '지원요건' 항목에는 <b>훈련 및 일경험(개시일/수료일)<\/b> 칸이 있고, 아래 <b>세 가지 중 하나<\/b>에 체크하고 날짜를 적게 돼 있습니다.<\/p>\n<table>\n<tr><th>인정되는 훈련·일경험<\/th><th>어디서 하나<\/th><\/tr>\n<tr><td><b>① 폴리텍 중장년 특화과정<\/b><\/td><td>한국폴리텍대학이 중장년을 대상으로 운영하는 특화 훈련과정<\/td><\/tr>\n<tr><td><b>② 국가기간·전략산업 직종훈련<\/b><\/td><td>고용노동부 지정 훈련기관 (이른바 '국기훈련')<\/td><\/tr>\n<tr><td><b>③ 중장년 경력지원제<\/b><\/td><td>중장년이 기업에서 일경험을 쌓는 프로그램<\/td><\/tr>\n<\/table>\n<p>순서가 정해져 있다는 뜻입니다. 공식 인포그래픽의 신청절차도 <b>①훈련·일경험 수료 → ②일손부족업종 취업 → ③6개월 이상 근속 → ④인센티브 신청 → ⑤사실관계 확인 후 지원금 지급<\/b> 순으로 그려져 있습니다.<\/p>\n<div class=\"tip\"><b>⚠️ 취업부터 한 경우<\/b><p style=\"margin:8px 0 0\">이미 제조업에 취업한 상태에서 뒤늦게 이 제도를 알게 됐다면, 신청서 구조상 <b>수료일이 취업일보다 앞서야 자연스럽습니다.<\/b> 본인 사례가 인정되는지는 <b>반드시 관할 지방고용노동청(취업지원총괄과)에 사실관계를 먼저 확인<\/b>하세요. 6개월을 다 채운 뒤에 확인하면 되돌릴 수 없습니다.<\/p><\/div>\n<p>폴리텍 중장년 특화훈련 수료자는 <b>수료증<\/b>을 제출서류로 따로 내야 합니다. 훈련을 마치고 받은 서류를 버리지 마세요.<\/p>\n<p>참고로 ②번 국가기간·전략산업 직종훈련은 <b>국민내일배움카드<\/b>로 수강하는 대표적인 훈련입니다. 아직 훈련을 시작하지 않았다면 그 경로부터 알아보는 것이 순서입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"trap3\">4. 🔴 함정 ③ 사업장 조건은 두 개를 모두 만족해야 합니다<\/h2>\n<p>언론 보도는 대체로 <b>\"5인 이상 사업장\"<\/b>이라고만 전했습니다. 그러나 신청서식의 <b>사업장 규모<\/b> 칸은 이렇게 돼 있습니다.<\/p>\n<div class=\"tip\"><b>📜 신청서식 원문<\/b><p style=\"margin:8px 0 0\">□ ①피보험자수 5인 이상<br>□ ②고용보험법 시행령 제12조의 우선지원대상 기업<br><b>* 위 규모요건 모두 충족하여야 함<\/b><\/p><\/div>\n<p>바로 아래 <b>업종<\/b> 칸에는 반대로 <b>\"위 업종요건은 둘 중 하나 충족하면 됨\"<\/b>이라고 적혀 있습니다. <b>업종은 OR, 규모는 AND<\/b>입니다. 이 차이를 놓치면 계산이 어긋납니다.<\/p>\n<table>\n<tr><th>항목<\/th><th>조건<\/th><th>판정 방식<\/th><\/tr>\n<tr><td><b>업종<\/b><\/td><td>제조업 / 운수 및 창고업<\/td><td><b>둘 중 하나<\/b>만 해당하면 OK<\/td><\/tr>\n<tr><td><b>규모<\/b><\/td><td>피보험자 5인 이상 / 우선지원대상기업<\/td><td><b>둘 다<\/b> 해당해야 OK<\/td><\/tr>\n<\/table>\n<h3>우선지원대상기업이 뭔가요<\/h3>\n<p><b>고용보험법 시행령 제12조<\/b>가 정하는 중소기업 범위입니다. 업종별로 상시 근로자 수 기준이 다르게 정해져 있어서, <b>\"우리 회사가 여기 들어가나\"는 눈대중으로 판단하면 안 됩니다.<\/b> 다행히 확인 방법은 간단합니다.<\/p>\n<ul>\n<li><b>회사 인사·총무 담당자에게 문의<\/b> — 고용보험 관련 지원금을 신청해 본 회사라면 대개 알고 있습니다.<\/li>\n<li><b>고용24(work24.go.kr) 또는 관할 고용센터 문의<\/b> — 사업장 관리번호로 확인 가능합니다.<\/li>\n<li>신청서 안내문에도 <b>\"고용보험상 실제 기업 업종·규모 및 중장년 요건을 바탕으로 검토한다\"<\/b>고 명시돼 있습니다. 즉 <b>내가 체크한 내용이 아니라 고용보험 전산 기록이 기준<\/b>입니다.<\/li>\n<\/ul>\n<div class=\"tip\"><b>⚠️ 대기업 공장은 해당되지 않습니다<\/b><p style=\"margin:8px 0 0\">제조업이고 근로자가 500명이어도 <b>우선지원대상기업이 아니면 탈락<\/b>입니다. 반대로 우선지원대상기업이지만 <b>피보험자가 4명<\/b>이어도 탈락입니다. 두 조건 사이에 낀 <b>중소 제조·물류업체<\/b>가 이 제도의 표적입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"money\">5. 얼마를 언제 받나 — 180만 원 + 180만 원<\/h2>\n<p>공식 인포그래픽의 지원수준 칸은 <b>\"6·12개월 근속 시 각 180만 원, 최대 360만 원\"<\/b>입니다. 한 번에 360만 원이 나오는 것이 아니라 <b>두 번에 나눠<\/b> 지급됩니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>조건<\/th><th>금액<\/th><th>신청서식<\/th><\/tr>\n<tr><td><b>1차<\/b><\/td><td>근속 <b>6개월<\/b> 달성<\/td><td><b>180만 원<\/b><\/td><td>지급 신청서(1차) + 중장년 확인서 + 동의서<\/td><\/tr>\n<tr><td><b>2차<\/b><\/td><td>근속 <b>12개월<\/b> 달성<br>(근로기간 단절 없이 계속 근속 중)<\/td><td><b>180만 원<\/b><\/td><td>지급 신청서(2차)<\/td><\/tr>\n<tr><td colspan=\"2\"><b>합계<\/b><\/td><td colspan=\"2\"><b>360만 원<\/b><\/td><\/tr>\n<\/table>\n<p>2차 신청서에는 <b>\"대상기업에서 근로기간의 단절없이 근속 중임\"<\/b>을 체크하는 칸이 따로 있습니다. <b>6개월 받고 이직하면 2차 180만 원은 없습니다.<\/b> 같은 회사에서 1년을 채워야 전액입니다.<\/p>\n<div class=\"tip\"><b>💡 지급 방식<\/b><p style=\"margin:8px 0 0\">신청서에 적은 <b>본인 명의 계좌<\/b>로 입금되며, 신청서에는 <b>\"지급결정 통보는 인센티브 지급으로 대신함을 신청합니다\"<\/b>라는 항목이 있습니다. 즉 <b>따로 결정 통지가 오지 않고 입금이 곧 결정 통보<\/b>가 될 수 있습니다. 통장을 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"calc\">6. 계산예시 — 내 신청 가능일 날짜로 역산하기<\/h2>\n<p>이 제도에서 가장 많은 돈이 새는 지점이 <b>날짜<\/b>입니다. 실제 사례로 계산해 보겠습니다.<\/p>\n<h3>사례 A — 2026년 3월 2일 입사한 55세 김○○ 씨<\/h3>\n<table>\n<tr><th>단계<\/th><th>날짜<\/th><th>할 일<\/th><\/tr>\n<tr><td>훈련 수료<\/td><td>2026. 2. 27.<\/td><td>폴리텍 중장년 특화과정 수료 (수료증 보관)<\/td><\/tr>\n<tr><td>취업<\/td><td><b>2026. 3. 2.<\/b><\/td><td>제조업 · 피보험자 30명 · 우선지원대상기업 입사<\/td><\/tr>\n<tr><td>6개월 달성<\/td><td>2026. 9. 1.<\/td><td>근속 6개월 충족<\/td><\/tr>\n<tr><td><b>1차 신청 창구<\/b><\/td><td><b>2026. 10. 1. ~ 12. 31.<\/b><\/td><td>달성한 <b>다음 달부터 3개월 이내<\/b> → <b>180만 원<\/b><\/td><\/tr>\n<tr><td>12개월 달성<\/td><td>2027. 3. 1.<\/td><td>단절 없이 계속 근속<\/td><\/tr>\n<tr><td><b>2차 신청 창구<\/b><\/td><td><b>2027. 4. 1. ~ 6. 30.<\/b><\/td><td>같은 방식으로 3개월 이내 → <b>180만 원<\/b><\/td><\/tr>\n<tr><td colspan=\"2\"><b>총 수령<\/b><\/td><td><b>360만 원<\/b><\/td><\/tr>\n<\/table>\n<h3>사례 B — 같은 조건인데 1차 신청을 깜빡한 경우<\/h3>\n<p>김 씨가 바빠서 <b>2027년 1월에<\/b> 1차를 신청했다고 해봅시다. 신청 창구(2026. 10. 1.~12. 31.)가 이미 닫혔습니다. <b>6개월을 멀쩡히 채우고도 180만 원이 사라집니다.<\/b> 근속을 잘한 것과 신청 기한을 지킨 것은 별개입니다.<\/p>\n<div class=\"tip\"><b>📅 지금 바로 할 일<\/b><p style=\"margin:8px 0 0\">근로계약서에서 <b>근로개시일<\/b>을 확인하고 <b>+6개월<\/b>, 그 <b>다음 달 1일<\/b>과 <b>3개월 뒤 말일<\/b>을 휴대폰 달력에 알림으로 걸어두세요. 이 두 날짜가 곧 180만 원입니다.<\/p><\/div>\n<p>※ 근속 개월 수 산정과 신청 창구의 정확한 기산 방식은 사안에 따라 달리 볼 여지가 있으므로, 본인 입사일을 들고 <b>관할 지방고용노동청에 한 번 확인<\/b>해 두는 것이 안전합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"trap4\">7. 🔴 함정 ④ 신청 기한은 3개월입니다<\/h2>\n<p>공식 인포그래픽의 신청방법 칸은 한 줄입니다.<\/p>\n<div class=\"tip\"><b>📜 공식 자료 원문<\/b><p style=\"margin:8px 0 0\">근속 6개월 달성 후 <b>다음 달부터 3개월 이내<\/b> 신청<\/p><\/div>\n<p>여기에 제출서류 요건이 하나 더 얹힙니다. 1차 신청 서류 중 재직증명서는 <b>\"신청일 전 2주 이내에 발급된\"<\/b> 것이어야 합니다. <b>미리 떼어둔 오래된 재직증명서는 못 씁니다.<\/b> 신청 직전에 새로 발급받으세요.<\/p>\n<ul>\n<li>재직증명서 대신 <b>6개월 근속을 증명하는 급여이체내역<\/b>을 내도 됩니다.<\/li>\n<li>2차 때도 마찬가지로 <b>신청일 전 2주 이내 발급 재직증명서<\/b> 또는 <b>1차 신청 이후의 급여이체내역<\/b> 중 선택입니다.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"how\">8. 신청 방법과 제출서류<\/h2>\n<h3>어디에 내나<\/h3>\n<p>신청서 수신자는 <b>「○○지방고용노동청장 귀하」<\/b>입니다. 온라인 자동신청이 아니라 <b>관할 지방고용노동청(취업지원총괄과)에 서류를 제출<\/b>하는 방식입니다. 다만 사업 특성상 <b>고용24(work24.go.kr) 가입<\/b>이 함께 안내되고 있으므로, 미가입자는 먼저 가입해 두는 편이 좋습니다.<\/p>\n<p>제도 정보는 <b>고용노동부 누리집과 고용24에서 \"일손\"으로 검색<\/b>하면 찾을 수 있다고 공식 안내에 적혀 있습니다.<\/p>\n<h3>1차 신청(6개월) 제출서류<\/h3>\n<ol>\n<li><b>지급 신청서(1차)<\/b> — 인적사항, 사업장 정보, 업종·규모 체크, 취업일, 주 소정근로시간, 월 급여, 훈련 수료일, 본인 계좌<\/li>\n<li><b>근로계약서 1부<\/b> — <b>근로기준법상 위반사항이 없는<\/b> 근로계약서<\/li>\n<li><b>중장년 확인서<\/b> 및 <b>개인정보 수집·이용·제공 및 고유식별정보 처리 동의서<\/b><\/li>\n<li><b>신청일 전 2주 이내 발급된 재직증명서<\/b> 또는 6개월 근속 증명 <b>급여이체내역<\/b><\/li>\n<li>(폴리텍 중장년 특화훈련 수료자) <b>수료증<\/b><\/li>\n<li><b>통장사본 1부<\/b><\/li>\n<\/ol>\n<h3>2차 신청(12개월) 제출서류<\/h3>\n<ol>\n<li><b>지급 신청서(2차)<\/b><\/li>\n<li><b>12개월 근속증빙 자료<\/b> — 신청일 전 2주 이내 발급 재직증명서 <b>또는<\/b> 1차 신청 후 근속을 증명하는 급여이체내역 중 선택<\/li>\n<\/ol>\n<div class=\"tip\"><b>💡 회사가 바뀐 게 아니라 회사가 합쳐진 경우<\/b><p style=\"margin:8px 0 0\">다니던 회사가 <b>합병·분할되거나 영업을 양도·양수<\/b>해서 사업장이 달라졌다면 <b>「근속 승계에 대한 사업주 확인서」<\/b>를 회사(인사담당자)가 작성해야 합니다. <b>근로자가 대신 쓰면 안 됩니다<\/b>(서식에 '근로자 작성 금지'로 명시). 허위로 확인하면 <b>사업주도 연대책임<\/b>을 집니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"quota\">9. 전국 1,000명 — 지역별 쿼터 원표<\/h2>\n<p>이 제도는 <b>시범사업<\/b>이라 인원이 정해져 있습니다. 고용노동부가 2026년 6월 30일 공지한 지역별 쿼터표 원문은 다음과 같습니다.<\/p>\n<table>\n<tr><th>합계<\/th><th>서울청<\/th><th>경기청<\/th><th>중부청<\/th><th>부산청<\/th><th>대구청<\/th><th>광주청<\/th><th>대전청<\/th><\/tr>\n<tr><td><b>1,000명<\/b><\/td><td>100<\/td><td>150<\/td><td>150<\/td><td>150<\/td><td>150<\/td><td>150<\/td><td>150<\/td><\/tr>\n<\/table>\n<p>같은 문서에 이런 문구가 붙어 있습니다.<\/p>\n<div class=\"tip\"><b>📜 쿼터 알림 원문<\/b><p style=\"margin:8px 0 0\">* <b>예산 소진 시 지원요건을 충족하더라도 지원이 제한될 수 있음.<\/b><\/p><\/div>\n<p>요건을 다 갖춰도 <b>순번이 밀리면 못 받는다<\/b>는 뜻입니다. 특히 <b>서울청 배정이 100명<\/b>으로 다른 6개 청(각 150명)보다 적습니다. 서울 지역 사업장에 취업하신 분은 <b>6개월 달성 즉시, 창구가 열리는 다음 달 초에 바로 신청<\/b>하는 편이 유리합니다.<\/p>\n<div class=\"tip\"><b>⚠️ 오해하면 안 되는 것<\/b><p style=\"margin:8px 0 0\">쿼터는 <b>취업할 때 선착순으로 자리를 잡아두는 방식이 아닙니다.<\/b> 신청·지급 단계에서 예산이 소진되면 제한됩니다. 그래서 <b>신청을 미루는 것이 곧 위험<\/b>입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"deny\">10. 지원에서 제외되는 8가지 경우<\/h2>\n<p>신청 시 함께 내는 <b>「중장년 확인서」<\/b>에는 <b>지원 제외 사유 8가지<\/b>가 열거돼 있고, 본인이 각각 '해당 없음/있음'에 체크해 서명해야 합니다. 허위로 적으면 <b>지원금 반환·추가징수<\/b> 대상입니다. 원문 그대로 정리했습니다.<\/p>\n<table>\n<tr><th>번호<\/th><th>제외 사유<\/th><\/tr>\n<tr><td>①<\/td><td>취업일 기준 <b>사업주(법인은 대표이사)·임원 등의 배우자 및 직계존비속<\/b><\/td><\/tr>\n<tr><td>②<\/td><td>취업일 기준 <b>대한민국 국적을 보유하지 않은 외국인<\/b><br>(단 <b>거주 F-2 · 영주 F-5 · 결혼이민자 F-6<\/b>은 제외 사유에 해당하지 않음)<\/td><\/tr>\n<tr><td>③<\/td><td><b>파견·용역근로자 등 간접고용<\/b> 형태로 취업한 자<\/td><\/tr>\n<tr><td>④<\/td><td>고용한 사업주가 <b>이직 당시의 사업주와 동일하거나 밀접한 관련성<\/b>이 있는 경우<\/td><\/tr>\n<tr><td>⑤<\/td><td><b>부정청구로 처분받은 지 1년이 지나지 않은 자<\/b><\/td><\/tr>\n<tr><td>⑥<\/td><td><b>다른 사업장에 취업 중인 자<\/b><\/td><\/tr>\n<tr><td>⑦<\/td><td><b>근속의 중단이 있는 자<\/b> — 휴업·휴직(사업장 사정), 휴직(<b>병가 등 근로자 사정<\/b>), 기타 근속 중단 시 <b>모두 해당<\/b><\/td><\/tr>\n<tr><td>⑧<\/td><td><b>동일기간·동일목적의 다른 인센티브<\/b>를 받고 있거나 받으려는 자<br>(국민취업지원제도 <b>취업성공수당<\/b>, 지자체 취업·근속인센티브 등)<\/td><\/tr>\n<\/table>\n<h3>실무에서 가장 잘 걸리는 셋<\/h3>\n<ul>\n<li><b>⑦ 근속 중단 — 병가도 포함됩니다.<\/b> 몸이 아파 휴직했다가 복귀한 경우도 근속 중단으로 봅니다. 6개월·12개월을 <b>끊김 없이<\/b> 채워야 한다는 뜻이므로, 아픈 시기가 걸린다면 미리 지방고용노동청에 상담하세요.<\/li>\n<li><b>① 가족 회사<\/b> — 아들·딸이 대표인 회사, 배우자가 임원인 회사에 취업한 경우는 제외입니다.<\/li>\n<li><b>⑧ 중복 수급<\/b> — <b>국민취업지원제도의 취업성공수당<\/b>을 같은 기간·같은 목적으로 받으려 한다면 둘 중 하나만 선택해야 합니다. <b>어느 쪽이 유리한지 금액을 비교한 뒤 결정<\/b>하세요.<\/li>\n<\/ul>\n<div class=\"tip\"><b>💡 ③ 파견·용역 주의<\/b><p style=\"margin:8px 0 0\">물류센터·공장에 <b>파견업체 소속<\/b>으로 출근하는 형태는 근무 장소가 제조업·창고업이어도 <b>간접고용이라 제외<\/b>됩니다. 근로계약서의 <b>사용자가 누구인지<\/b>를 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"reject\">11. 부지급 통지를 받았다면 (이의신청 30일)<\/h2>\n<p>신청이 거부되면 <b>「( )차 [지급/부지급] 결정 통지서」<\/b>가 오고, <b>부지급 결정 이유<\/b>가 상세히 적힙니다. 그냥 포기하지 않아도 됩니다. 통지서 하단에 구제 절차가 명시돼 있습니다.<\/p>\n<table>\n<tr><th>절차<\/th><th>기한<\/th><th>근거<\/th><\/tr>\n<tr><td><b>이의신청<\/b><\/td><td>통지서를 <b>받은 날부터 30일 이내<\/b><\/td><td>행정기본법 제36조<\/td><\/tr>\n<tr><td><b>행정심판 / 행정소송<\/b><\/td><td>처분이 있음을 <b>안 날부터 90일 이내<\/b><\/td><td>행정심판법 / 행정소송법<\/td><\/tr>\n<\/table>\n<p>이의신청을 했더라도 <b>그와 관계없이<\/b> 90일 이내에 행정심판·행정소송을 제기할 수 있다고 통지서에 적혀 있습니다. <b>이의신청 결과를 기다리다 90일을 넘기지 않도록<\/b> 두 기한을 따로 관리하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"faq\">12. 자주 묻는 질문<\/h2>\n<h3>Q. 회사가 신청하나요, 제가 신청하나요?<\/h3>\n<p><b>본인이 신청합니다.<\/b> 신청서의 신청인은 근로자 본인이고, 지원금도 본인 계좌로 들어옵니다. 다만 회사가 <b>합병·양수 등으로 사업장이 바뀐 경우<\/b>에만 사업주 확인서가 추가로 필요합니다.<\/p>\n<h3>Q. 취업만 하면 되는 줄 알았는데 훈련을 안 들었습니다.<\/h3>\n<p>신청서 구조상 <b>폴리텍 중장년 특화과정·국가기간전략산업 직종훈련·중장년 경력지원제 중 하나의 수료일<\/b>을 기재하게 돼 있습니다. 본인 사례가 인정되는지는 <b>관할 지방고용노동청에 반드시 먼저 확인<\/b>하세요.<\/p>\n<h3>Q. 65세인데 정말 안 되나요?<\/h3>\n<p>공식 인포그래픽 기준은 <b>50~64세(취업일 기준)<\/b>입니다. <b>취업일<\/b>에 64세였다면 그 시점 기준으로 판단합니다. 애매하면 생년월일과 근로계약서를 들고 고용노동부 고객상담센터(<b>☎1350<\/b>)에 문의하세요.<\/p>\n<h3>Q. 6개월 받고 회사를 옮기면 2차도 받을 수 있나요?<\/h3>\n<p><b>받을 수 없습니다.<\/b> 2차 신청서에 <b>\"대상기업에서 근로기간의 단절없이 근속 중임\"<\/b>을 확인하는 항목이 있습니다. 같은 회사에서 12개월을 채워야 합니다.<\/p>\n<h3>Q. 건설업·음식점에 취업했는데 되나요?<\/h3>\n<p>대상 업종은 <b>제조업<\/b>과 <b>운수 및 창고업<\/b> 두 가지뿐입니다. 건설업·음식점업 등은 해당하지 않습니다.<\/p>\n<h3>Q. 국민취업지원제도를 이용 중인데 같이 받을 수 있나요?<\/h3>\n<p><b>취업성공수당<\/b>과는 동일기간·동일목적으로 <b>중복 수급이 안 됩니다.<\/b> 어느 쪽 금액이 큰지 계산해 보고 선택하세요.<\/p>\n<h3>Q. 언제까지 신청할 수 있나요?<\/h3>\n<p>2026년 <b>시범사업<\/b>이며 <b>전국 1,000명<\/b> 한도입니다. 별도의 마감일보다 <b>예산 소진<\/b>이 먼저 올 수 있습니다. 6개월을 채웠다면 창구가 열리는 즉시 신청하는 것이 안전합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"gov\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.moel.go.kr/policy/policydata/view.do?bbs_seq=20260700715\" target=\"_blank\" rel=\"nofollow\">▸ 고용노동부 — 2026년 시범 일손부족일자리 동행 인센티브 인포그래픽<\/a><a href=\"https://www.moel.go.kr/local/busan/info/policydata/view.do?bbs_seq=20260600377\" target=\"_blank\" rel=\"nofollow\">▸ 고용노동부 — 2026년 시범 일손부족일자리 동행 인센티브 신청서식<\/a><a href=\"https://www.moel.go.kr/policy/policydata/view.do?bbs_seq=20260601297\" target=\"_blank\" rel=\"nofollow\">▸ 고용노동부 — 지방청별 쿼터 알림(1,000명 배분표)<\/a><a href=\"https://www.work24.go.kr\" target=\"_blank\" rel=\"nofollow\">▸ 고용24 — 누리집에서 \"일손\"으로 검색<\/a><a href=\"https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=18898\" target=\"_blank\" rel=\"nofollow\">▸ 고용노동부 보도참고자료 — 중장년내일이음패키지(2026.1.27.)<\/a><\/div>\n\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">정리하면 <b>①나이는 50~64세이고 기준은 '취업일'이며 ②폴리텍 중장년 특화과정·국가기간전략산업 직종훈련·중장년 경력지원제 중 하나를 먼저 수료해야 하고 ③사업장은 제조업 또는 운수창고업이면서 피보험자 5인 이상 '그리고' 우선지원대상기업이어야 하며 ④6개월·12개월에 각 180만 원씩 최대 360만 원을 받되 ⑤신청은 근속 6개월 달성 다음 달부터 3개월 이내에 해야 합니다.<\/b> 전국 1,000명 시범사업이고 공식 문서에 <b>\"예산 소진 시 요건을 충족해도 지원이 제한될 수 있다\"<\/b>고 적혀 있으니, 요건이 맞는다면 <b>미루는 것 자체가 손해<\/b>입니다. 오늘 할 일은 하나입니다 — <b>근로계약서에서 근로개시일을 확인하고 +6개월, 그 다음 달을 달력에 표시<\/b>해 두세요. 요건이 애매하면 <b>고용노동부 고객상담센터 ☎1350<\/b> 또는 관할 지방고용노동청 취업지원총괄과에 먼저 물어보시면 됩니다.<\/p><\/div>\n\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 연령·금액·신청기한·절차는 <b style=\"display:inline;color:#33503a;margin:0\">고용노동부 「2026년 시범 일손부족일자리 동행 인센티브 인포그래픽」(2026.7.21. 게시, 고령사회인력정책과)<\/b> 원문을, 업종·사업장 규모 요건·제출서류·지원 제외 8개 항목·이의신청 절차는 <b style=\"display:inline;color:#33503a;margin:0\">같은 부처가 배포한 「신청서식」(2026.6.8. 게시) 원문<\/b>을, 인원 배분은 <b style=\"display:inline;color:#33503a;margin:0\">「지역별 쿼터 알림」(2026.6.30. 게시)<\/b> 원문을 직접 열어 확인해 정리했습니다. 다수 언론이 보도한 <b style=\"display:inline;color:#33503a;margin:0\">\"50세 이상\"·\"5인 이상 사업장\"<\/b> 표현은 공식 자료의 <b style=\"display:inline;color:#33503a;margin:0\">\"50~64세\"·\"5인 이상 그리고 우선지원대상기업\"<\/b>과 차이가 있어 <b style=\"display:inline;color:#33503a;margin:0\">공식 자료를 기준<\/b>으로 삼았습니다. 주 소정근로시간의 최소 기준은 공개 자료에 수치가 명시돼 있지 않아 본문에 싣지 않았습니다.<br>출처: <a href=\"https://www.moel.go.kr/policy/policydata/view.do?bbs_seq=20260700715\">고용노동부 — 2026년 시범 일손부족일자리 동행 인센티브 인포그래픽<\/a>, <a href=\"https://www.moel.go.kr/local/busan/info/policydata/view.do?bbs_seq=20260600377\">고용노동부 — 신청서식(지급 신청서 1·2차, 중장년 확인서, 근속 승계 사업주 확인서, 결정 통지서)<\/a>, <a href=\"https://www.moel.go.kr/policy/policydata/view.do?bbs_seq=20260601297\">고용노동부 — 지방청별 쿼터 알림<\/a>, <a href=\"https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=18898\">고용노동부 보도참고자료(2026.1.27.) — 중장년내일이음패키지<\/a>. 사업의 법적 근거는 「고용정책기본법」 제15조~제15조의5·제25조 및 같은 법 시행령 제43조의2, 「고령자고용법」이며, 사업장 규모 요건의 '우선지원대상기업'은 「고용보험법 시행령」 제12조에 따릅니다.<\/div>\n\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/06/2026_01715292249.html\">▸ 국민취업지원제도 구직촉진수당 신청 방법 자격 총정리 (2026)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_0558296526.html\">▸ 국민내일배움카드 신청 방법 발급 자격 지원금액 총정리 (2026)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post.html\">▸ 실업급여 신청 방법 조건 지급액 한 번에 총정리<\/a><\/div>\n\n<div id=\"ymyl-disclaimer\" style=\"margin-top:22px;font-size:13px;color:#666;line-height:1.6\">본 글은 정보 제공용이며 법률·노무 자문이 아닙니다. 지원 여부는 <b>고용보험에 기록된 실제 사업장 업종·규모와 본인의 취업일·근속 기록<\/b>을 바탕으로 관할 지방고용노동청이 심사해 결정하며, 본문의 계산예시 날짜는 이해를 돕기 위한 가정입니다. 근속 기간 산정·신청 창구 기산 방식은 개별 사안에 따라 달리 판단될 수 있으므로, 신청 전 반드시 <b>고용노동부 고객상담센터(☎1350)<\/b> 또는 관할 지방고용노동청 취업지원총괄과에서 본인 기준으로 확인하세요. 2026년 시범사업으로 예산 소진 시 지원이 제한될 수 있습니다.<\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 연령·금액·요건·제외 사유는 <b>고용노동부가 배포한 인포그래픽·신청서식·쿼터표 원문 파일을 직접 열람<\/b>해 정리했으며, 언론 보도와 다른 부분은 본문에 그 차이를 함께 밝혔습니다. 제도는 바뀔 수 있으니 신청 전 공식 페이지를 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ 쓰레드용 후킹 요약 (3줄)\n※ 🔴 네이버용 원고로 쓰지 말 것 (2026-07-30 확립 규칙). 네이버 OSMU 원고는 이 요약이 아니라\n   위 본문 HTML의 표·계산예시·제외 8종 표·공식 출처 URL을 실질적으로 다 옮겨야 한다\n   (그 글만 보고 바로 따라 할 수 있어야 함). 마크다운 파이프 테이블은 네이버에서 렌더링되지 않으므로\n   `⭐ 항목 : 값` 불릿이나 `⭐ 열이름 — A: 값1 / B: 값2` 한 줄 비교로 변환할 것.\n1. 2026년 7월 1일부터 고용노동부 「일손부족일자리 동행 인센티브」 접수가 시작됐습니다. 제조업 또는 운수·창고업에 재취업해 **6개월 근속 시 180만 원, 12개월 근속 시 180만 원, 합쳐서 최대 360만 원**을 근로자 본인 계좌로 받습니다. 사업주 장려금이 아니라 **본인이 직접 신청**하는 돈입니다.\n2. 기사만 보고 준비하면 탈락합니다. 공식 인포그래픽 기준은 **50~64세(취업일 기준)** 로 상한이 있고, **폴리텍 중장년 특화과정·국가기간전략산업 직종훈련·중장년 경력지원제 중 하나를 먼저 수료**해야 하며, 사업장은 **피보험자 5인 이상 '그리고' 우선지원대상기업** 두 조건을 모두 만족해야 합니다(업종은 둘 중 하나면 되지만 규모는 둘 다입니다).\n3. 신청 기한이 짧습니다 — **근속 6개월 달성 후 다음 달부터 3개월 이내**. 재직증명서도 **신청일 전 2주 이내 발급분**만 인정됩니다. 게다가 전국 **1,000명 한정**(서울청 100명·나머지 6개 청 각 150명)이고 공식 문서에 **\"예산 소진 시 지원요건을 충족하더라도 지원이 제한될 수 있음\"**이라고 적혀 있습니다. 병가 휴직도 '근속 중단'으로 보아 제외되니 주의하세요.\n"}]},"pace":{"date":"2026-07-31","count":1,"posts":[{"title":"비지트재팬웹 등록 방법 일본 입국심사 세관신고 QR코드 총정리 (2026 Visit Japan Web)","published":"2026-07-31T13:48:57.000+09:00"}],"soft":1,"hard":2,"state":"warn","backlog":4,"backlog_codes":["D4-06","C3-05","F4-10","A5-05"],"backlog_max":5,"backlog_over":false,"lanes":{"info":{"label":"일일·정보성","n":2,"codes":["C3-05","A5-05"]},"etc":{"label":"기타","n":2,"codes":["D4-06","F4-10"]},"user":{"label":"사용자 추천","n":0,"codes":[]}},"error":"","checked_at":"2026-07-31T14:58:29"},"db":{"version":1,"updated":"2026-07-31","root":"lifeinfo","blog":"https://lifeinfo8975.blogspot.com/","tax const STEPS=[{n:1,who:'ai',t:'글감 선정'},{n:2,who:'me',t:'글감 승인',star:1},{n:3,who:'ai',t:'코드 배정'},{n:4,who:'ai',t:'본문 작성 + 팩트체크'},{n:5,who:'ai',t:'썸네일 생성'},{n:6,who:'ai',t:'관련글 내부링크'},{n:7,who:'ai',t:'Blogger 초안'},{n:8,who:'me',t:'라이브 발행',star:1},{n:9,who:'ai',t:'DB 반영 + 검증'},{n:10,who:'ai',t:'배포 (콘솔·카테고리)'},{n:11,who:'me',t:'네이버 확산',star:1},{n:12,who:'me',t:'쓰레드 확산',star:1},{n:13,who:'me',t:'인스타 확산',star:1},{n:14,who:'ai',t:'채널 교차링크'},{n:15,who:'me',t:'서치콘솔 색인 요청',star:1},{n:16,who:'ai',t:'색인 반영 실측'}];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fnum=n=>Number(n).toLocaleString('ko-KR');
async function load(){
  const D=window.__DATA__||{};
  const h=D.health, db=D.db, pg=D.progress, collab=D.collab, idx=D.index_status, pend=D.pending, queue=D.queue, pace=D.pace;
  const recs=db?(Array.isArray(db)?db:(db.posts||[])):[];
  const count=db&&db.count?db.count:recs.length;
  const light=h?h.light:'gray', pass=h?h.pass:0, total=h?(h.pass+h.warn+h.fail):0;
  const avg=pg&&pg.avg?fnum(pg.avg):'—', date=pg&&pg.updated?pg.updated:'';
  const bcls=light==='green'?'b-green':light==='red'?'b-bad':'b-warn';
  const blab=light==='green'?'신호등 green':light==='red'?'신호등 red':'신호등 warn';
  const today=(pg&&pg.today||[]).map(it=>'<div class="row '+(it.done?'done':'warn')+'">'+(it.done?CHECK:LOAD)+'<span>'+esc(it.t)+'</span></div>').join('');
  const next=(pg&&pg.next||[]).map(t=>'<div class="row">'+DOT+'<span class="mut">'+esc(t)+'</span></div>').join('');
  const pl=(pg&&pg.pipeline)||{};
  const _cc=(pl.code||'').split(' ')[0], _cur=recs.find(r=>r.code===_cc);
  let checked=(pl.checked||[]).slice();
  // 확산 단계(11~14)는 보드 시드값을 쓰지 않고 DB의 osmu 기록에서 그대로 도출한다.
  //   · DB osmu 는 "실제로 게시된 것"의 기록이므로 확산 여부의 유일한 정답이다.
  //   · 예전 코드는 DB에서 체크를 추가만 하고 제거하지 않아, board_seed 가 미리 찍어둔
  //     낡은 checked 값이 그대로 남아 미게시 글을 확산 완료로 표시했다.
  //     (실측: C2-07 은 osmu 기록이 없는데 checked 에 11·12·13 이 들어 있었다)
  //   · 인스타를 13단계로 넣으면서 번호가 한 칸씩 밀렸으므로, 낡은 번호를 그대로
  //     신뢰하면 단계 의미까지 어긋난다. 도출로 바꾸면 이 문제가 함께 사라진다.
  // 교차링크(14)는 네이버·쓰레드 기준을 유지한다 — 인스타는 54/153편으로 확산률이 낮아
  // 조건에 넣으면 대부분의 글에서 교차링크가 미완으로 뒤집힌다.
  if(_cur){
    const om=_cur.osmu||{};
    const derived={11:!!om.naver,12:!!om.threads,13:!!om.instagram,14:!!(om.naver&&om.threads)};
    checked=checked.filter(n=>!(n in derived));
    Object.keys(derived).forEach(k=>{if(derived[k])checked.push(+k);});
    checked.sort((a,b)=>a-b);
  }
  const done=checked.length;
  const omAll=recs.filter(r=>r.osmu&&typeof r.osmu==='object');
  const oNv=omAll.filter(r=>r.osmu.naver).length, oTh=omAll.filter(r=>r.osmu.threads).length, oIn=omAll.filter(r=>r.osmu.instagram).length;
  // 미결 관리의 I 칩은 DB에서 직접 도출한다. pending.json 의 ch 는 {g,n,t} 만 담고
  // 있어서(pending 생성기가 아직 인스타를 모른다) ch.i 를 믿으면 게시한 글도 ✗ 로 나온다.
  const osmuByCode={}; recs.forEach(r=>{if(r.code)osmuByCode[r.code]=r.osmu||{};});
  const oRecent=omAll.slice(-4).reverse();
  const nowN=pl.code?(STEPS.find(s=>checked.indexOf(s.n)<0)||{}).n:0;
  let pubHtml;
  if(pl.code){
    const pct=Math.round(done/STEPS.length*100);
    const lis=STEPS.map(st=>{
      const on=checked.indexOf(st.n)>=0, now=(!on&&st.n===nowN);
      const ic=on?CHECK:(now?NOWI:WAIT), cls=on?'on':(now?'now':'wait');
      return '<li class="'+cls+'">'+ic+'<span class="num">'+st.n+'</span>'
        +'<span class="who '+st.who+'">'+(st.who==='ai'?'🤖':'🧑')+'</span>'
        +'<span class="lbl">'+esc(st.t)+(st.star?'<span class="star">★</span>':'')+'</span></li>';
    }).join('');
    pubHtml='<div class="pcode">'+esc(pl.code)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div>'
      +'<div class="cnt">'+done+' / '+STEPS.length+' 단계'+(pl.note?' · '+esc(pl.note):'')+'</div><ul>'+lis+'</ul>'
      +'<div class="banner'+(done===STEPS.length?' show':'')+'">✅ 발행·확산 완료</div>';
  }else{
    pubHtml='<div class="pcode none">진행 중인 발행 없음</div>';
  }
  const osmuLi=oRecent.map(r=>'<div class="row done">'+CHECK+'<span>'+esc(r.code)+' '+esc((r.title||'').slice(0,15))+'</span><span class="mut" style="margin-left:auto;font-size:10.5px">'+(r.osmu.naver?'네이버 ':'')+(r.osmu.threads?'쓰레드 ':'')+(r.osmu.instagram?'인스타':'')+'</span></div>').join('');
  // 🤝 협업 — 세션별(collab.json: 정체성=레지스트리·활동=git log·상태=git status)
  const stLab={active:'활동중',uncommitted:'미커밋',idle:'대기'};
  const collabHtml=(collab&&collab.agents||[]).map(a=>{
    const acts=(a.recent||[]).map(r=>'<div class="act">'+esc((r.s||'').slice(0,40))+' <span class="d">'+esc(r.d||'')+'</span></div>').join('');
    return '<div class="agent"><div class="ah">'+esc(a.emoji||'')+'<span>'+esc(a.name||'')+'</span><span class="st '+(a.state||'idle')+'">'+(stLab[a.state]||a.state||'')+'</span></div>'
      +'<div class="role">'+esc(a.role||'')+'</div><div class="own">담당 '+esc(a.owns||'')+'</div>'+acts+'</div>';
  }).join('');
  // 💡 시스템 조언 — 라이브 데이터 조건에서만 도출(하드코딩 일반론 금지)
  const adv=[];
  if(idx&&typeof idx.indexed==='number'){
    const iDt=idx.checked_at?' ('+String(idx.checked_at).slice(5)+' 실측)':'';
    if(idx.indexed===0){const cr=Object.values(idx.posts||{}).filter(p=>p&&p.lastCrawl).length;
      adv.push('색인 0/'+idx.total+iDt+' — 크롤 '+cr+'편·미크롤 '+(idx.total-cr)+'편. GSC 일일한도+OSMU 백링크로 점진(재검토는 색인 잡힌 뒤).');}
    else adv.push('색인 '+idx.indexed+'/'+idx.total+'편'+iDt+'.');
  }
  if(oNv>oTh) adv.push('OSMU 쓰레드 '+oTh+'/'+oNv+' — '+(oNv-oTh)+'편 미게시(rate-limit 보류분 재시도 필요).');
  if(oTh>oIn) adv.push('OSMU 인스타 '+oIn+'/'+oTh+' — 쓰레드 확산 대비 '+(oTh-oIn)+'편 미확산(카드뉴스 backlog).');
  if(collab&&collab.uncommitted>=10) adv.push('미커밋 '+collab.uncommitted+'파일 — 발행 완료 후 세션별 커밋 분리 권장.');
  const adviceHtml=adv.length?'<div class="advice">'+adv.map(t=>'<div class="ai"><span class="ic">💡</span><span>'+esc(t)+'</span></div>').join('')+'</div>':'<div class="pcode none">현재 조치 필요 항목 없음</div>';
  // 📋 미결 관리 — 글별(pending.json: DB osmu + index_status에서 계산)
  const pc=(pend&&pend.counts)||{};
  const cb=(ok,l)=>'<span class="ch '+(ok?'on':'off')+'">'+l+(ok?'✓':'✗')+'</span>';
  const pendRows=(pend&&pend.actionable||[]).map(a=>{
    const c=a.ch||{};
    return '<div class="prow"><span class="pcd">'+esc(a.code)+'</span><span class="ptt">'+esc(a.title)+'</span>'
    +cb(c.g!==false,'G')+cb(c.n,'N')+cb(c.t,'T')+cb((osmuByCode[a.code]||{}).instagram,'I')+'</div>';
  }).join('');
  // 표시는 상위 14편으로 잘려 있음(pending.py) → 남은 수는 counts로 계산해 "…외 N편"
  const pendListed=(pend&&pend.actionable||[]).length;
  const pendTotal=Math.max(pc.osmu_pending||0,pc.index_pending||0);
  const pendMore=pendTotal>pendListed?'<div class="cnt">…외 '+(pendTotal-pendListed)+'편</div>':'';
  const pendHtml='<div class="cnt">OSMU 대기 '+(pc.osmu_pending||0)+'편 · 색인 대기 '+(pc.index_pending||0)+'편 / 전체 '+(pc.total||0)+'편</div>'+(pendRows||'<div class="pcode none">미결 없음</div>')+pendMore;
  // 📋 발행 대기 (발행 전 큐 — queue.json) : 코드·제목·썸네일을 한 카드로 묶어 '엉뚱한 글/썸네일' 눈으로 차단
  const qItems=(queue&&queue.items)||[];
  const laneLab={info:'정보성',pop:'대중관심'};
  const qCards=qItems.map(it=>{
    const th=it.thumb_data
      ?'<img class="qth" src="'+it.thumb_data+'" alt="">'
      :'<div class="qth none">썸네일<br>없음</div>';
    const facts=it.facts?'<div class="qfacts">'+esc(it.facts)+'</div>':'';
    const draft=it.draft?'<span class="qdraft">📄 '+esc(it.draft)+'</span>':'';
    const pv=it.body?'<button class="qpv" onclick="qpv(\''+esc(it.code||'')+'\')">👁 본문 미리보기</button>'
                    :'<span class="qpv none">초안 없음(작성 전)</span>';
    return '<div class="qcard">'+th
      +'<div class="qbody"><div class="qtop"><span class="qcode">'+esc(it.code||'')+'</span>'
      +'<span class="qlane '+(it.lane||'info')+'">'+esc(laneLab[it.lane]||it.lane||'')+'</span></div>'
      +'<div class="qtitle">'+esc(it.title||'')+'</div>'+facts
      +'<div class="qmeta">'+pv+draft+'</div></div></div>';
  }).join('');
  // 🚦 오늘 발행량 배지 (2026-07-29) — 승인 누르기 '전에' 보이게 한다.
  //    2026-07-27 에 8편이 한꺼번에 나간 건, 사람이 재고만 보고 몰아서 승인했는데
  //    '오늘 몇 편째'를 아무도 안 세고 있었기 때문이다. 게이트(pace.check)는 발행을 막고,
  //    이 배지는 그 전에 눈으로 막는다.
  let paceHtml='';
  if(pace){
    const st=pace.state||'ok', n=pace.count||0, hard=pace.hard||2;
    const lab=st==='err'?'⚠️ 오늘 발행량을 못 셌습니다 — '+esc(pace.error||'')
      :st==='block'?'⛔ 오늘 '+n+'편 발행됨 — 오늘은 더 발행하지 마세요(3편 이상 금지)'
      :st==='warn'?'⚠️ 오늘 '+n+'편 발행됨 — 기본 페이스는 하루 1편입니다'
      :'✅ 오늘 '+n+'편 발행 — 하루 1편 기준 안';
    const bg=st==='block'?'#3a1218':st==='warn'?'#3a2f12':st==='err'?'#2a2030':'#0c3a2c';
    const bd=st==='block'?'#7a2230':st==='warn'?'#5a4a1a':st==='err'?'#4a3a5a':'#1f6b52';
    const fg=st==='block'?'#ff9aa6':st==='warn'?'#ffd166':st==='err'?'#c9b6e8':'#8ef0cf';
    const titles=(pace.posts||[]).map(p=>'<div style="opacity:.8;margin-top:2px">· '+esc(p.title||'')+'</div>').join('');
    const lanes=pace.lanes||{};
    const laneTxt=Object.keys(lanes).map(k=>{
      const L=lanes[k]; if(!L) return '';
      return '<span style="display:inline-block;margin-right:9px">'+esc(L.label||k)+' <b>'+(L.n||0)+'</b></span>';
    }).join('');
    const over=pace.backlog_over
      ?'<div style="margin-top:5px;color:#ffd166">📦 발행대기 재고 '+pace.backlog+'편 (상한 '+pace.backlog_max+' 초과) — 재고가 쌓이면 몰아치기 발행을 부릅니다. PREP 초안 생성이 잠긴 상태입니다.</div>'
      :'<div style="margin-top:5px;opacity:.75">📦 발행대기 재고 '+(pace.backlog||0)+'편 / 상한 '+(pace.backlog_max||5)+'</div>';
    const laneRow=laneTxt?'<div style="margin-top:4px;opacity:.8;font-size:11.5px">🛤 레인별: '+laneTxt+'<span style="opacity:.6">(자동 2 + 사용자 창구 1 · 루틴은 1회 1건)</span></div>':'';
    paceHtml='<div style="background:'+bg+';border:1px solid '+bd+';color:'+fg
      +';border-radius:8px;padding:8px 11px;margin:2px 0 9px;font-size:12px;line-height:1.5">'
      +'<b>'+lab+'</b>'+titles+over+laneRow+'</div>';
  }
  const qHtml=paceHtml+(qItems.length
    ?'<div class="cnt">발행 대기 '+qItems.length+'건 — 발행하면 카드가 자동으로 사라집니다(사람 승인 게이트)</div>'+qCards
    :'<div class="pcode none">발행 대기 없음 — PREP 루틴이 준비하면 여기 카드로 뜹니다</div>');
  document.getElementById('board').innerHTML=
   '<div class="hd"><div class="t"><h1>진행현황</h1><span class="date">'+esc(date)+'</span></div>'
   +'<span class="badge '+bcls+'">'+CHECK+esc(blab)+'</span></div>'
   +'<div class="sec">오늘 한 일</div>'+today
   +'<div class="metrics">'
   +'<div class="m"><div class="l">검사 통과</div><div class="v">'+pass+' <small>/ '+total+'</small></div></div>'
   +'<div class="m"><div class="l">블로그 글</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">평균 본문</div><div class="v">'+avg+' <small>자</small></div></div>'
   +'</div>'
   +'<div class="div"></div>'
   +'<div class="sec">📋 발행 대기 (오늘 발행할 글)<span class="auto">🤖 PREP 큐</span></div>'+qHtml
   +'<div class="div"></div>'
   +'<div class="sec">발행 진행 (글 1편 · '+STEPS.length+'단계, 확산 포함)<span class="auto">🤖 자동</span></div>'+pubHtml
   +'<div class="div"></div>'
   +'<div class="sec">📡 4채널 발행 현황 (구글·네이버·쓰레드·인스타)<span class="auto">🤖 DB 자동집계</span></div>'
   +'<div class="metrics">'
   +'<div class="m"><div class="l">구글(원본)</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">네이버</div><div class="v">'+oNv+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">쓰레드</div><div class="v">'+oTh+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">인스타</div><div class="v">'+oIn+' <small>편</small></div></div>'
   +'</div>'
   +'<div class="cnt">확산 커버리지 · 네이버 '+(count?Math.round(oNv/count*100):0)+'% · 쓰레드 '+(count?Math.round(oTh/count*100):0)+'% · 인스타 '+(count?Math.round(oIn/count*100):0)+'% · 교차링크 완료 '+omAll.length+'편</div>'
   +osmuLi
   +'<div class="div"></div>'
   +'<div class="sec">🤝 협업 — 세션별 역할·진행<span class="auto">git 자동분류</span></div>'+collabHtml
   +'<div class="sec">💡 시스템 조언<span class="auto">라이브 도출</span></div>'+adviceHtml
   +'<div class="div"></div>'
   +'<div class="sec">📋 미결 관리 — 4채널 매칭<span class="auto">G구글·N네이버·T쓰레드·I인스타</span></div>'+pendHtml
   +'<div class="sec">다음</div><div class="next">'+next+'</div>'
   +'<div class="upd" id="upd"></div>';
  tick();
}
// 시계·데이터 기준만 갱신(보드 전체 재렌더 없음 — 정적 베이크 데이터라 시계만 변함)
function tick(){
  const el=document.getElementById('upd'); if(!el)return;
  const b=(window.__DATA__||{}).baked_at;
  el.textContent=(b?'데이터 기준 '+b+' · ':'')+new Date().toLocaleTimeString('ko-KR');
}
// 👁 발행 대기 카드 본문 미리보기 — 초안 HTML을 격리 iframe(srcdoc)로 렌더(스타일 누수 차단, Blogger 미접촉)
function qpv(code){
  const items=((window.__DATA__||{}).queue||{}).items||[];
  const it=items.find(x=>x.code===code); if(!it||!it.body)return;
  document.getElementById('qpv-ttl').textContent=(it.code||'')+' · '+(it.title||'');
  document.getElementById('qpv-fr').srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank"><body style="margin:0;padding:16px;background:#fff">'+it.body+'</body>';
  document.getElementById('qpv-ov').classList.add('show');
}
function qpvClose(){document.getElementById('qpv-ov').classList.remove('show');document.getElementById('qpv-fr').srcdoc='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')qpvClose();});
// 코드 자동 반영: 자기 자신(progress.html)을 주기적으로 fetch→해시 비교, 바뀌면 1회 reload
const _hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
let _selfHash=null;
async function checkVersion(){
  try{
    const r=await fetch('progress.html?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;                                // 일시적 404/500에 해시 오염 → 불필요 reload 방지
    const t=await r.text();
    const h=_hash(t);
    if(_selfHash===null){_selfHash=h;return;}      // 첫 호출=기준선 저장
    if(h!==_selfHash) location.reload();            // 코드 변경 감지 → 자동 새로고침
  }catch(e){}
}
load(); checkVersion(); setInterval(tick,5000); setInterval(checkVersion,5000);
