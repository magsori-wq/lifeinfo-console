<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<title>진행현황 — 생활정보 모음</title>
<style>
:root{--bg:#0e1620;--card:#18222e;--card2:#13202d;--line:#26323f;--txt:#e6edf3;--mut:#8a97a6;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:470px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:16px;font-weight:600}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(63,185,80,.16);color:var(--ok)}
.b-warn{background:rgba(210,153,34,.16);color:var(--warn)}
.b-bad{background:rgba(248,81,73,.16);color:var(--bad)}
.sec{font-size:11px;color:var(--mut);letter-spacing:.05em;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
.metrics{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 2px}
/* 채널이 4개가 되어 490px 팝업에서 눌리므로, 좁아지면 2x2로 감싸게 한다 */
.m{flex:1 1 96px;background:var(--card2);border-radius:9px;padding:8px 10px}
.m .l{font-size:11px;color:var(--mut)}
.m .v{font-size:18px;font-weight:600;margin-top:2px}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #243049;font-size:12.5px}
li:last-child{border-bottom:none}
li.on{opacity:.62}
li.on .lbl{text-decoration:line-through}
li svg{width:15px;height:15px;flex:none}
li.on svg{color:var(--ok)}
li.now svg{color:#7fc1ff}
li.wait svg{color:#4a586e}
.num{font-size:11px;color:#6b7a99;width:16px;text-align:right;flex:none}
.who{font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px;flex:none}
.who.ai{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.who.me{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.lbl{font-size:12.5px}
.star{color:#ff8e8e;font-weight:800;margin-left:2px}
.banner{display:none;margin-top:9px;background:#0c3a2c;border:1px solid #1f6b52;color:#06d6a0;border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12.5px}
.banner.show{display:block}
.upd{font-size:11px;color:var(--mut);text-align:right;margin-top:12px}
.agent{background:var(--card2);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.agent .ah{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.agent .st{font-size:10px;font-weight:700;padding:1px 7px;border-radius:7px;margin-left:auto}
.st.active{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.st.uncommitted{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.st.idle{background:#222c3a;color:#6b7a99;border:1px solid #2e3a4a}
.agent .role{font-size:11px;color:var(--mut);margin:3px 0 1px}
.agent .own{font-size:10.5px;color:#5a6b80}
.agent .act{font-size:11px;color:#aeb9c7;margin-top:4px;padding-left:7px;border-left:2px solid #2a3a4d;line-height:1.5}
.agent .act .d{color:var(--mut);font-size:10px}
.advice{background:#13202d;border:1px solid #2a3a4d;border-radius:9px}
.advice .ai{display:flex;gap:8px;padding:7px 11px;font-size:12px;line-height:1.5;border-bottom:1px dashed #243049}
.advice .ai:last-child{border-bottom:none}
.advice .ic{flex:none}
.prow{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px dashed #243049;font-size:11.5px}
.prow:last-child{border-bottom:none}
.pcd{color:#7fc1ff;font-weight:700;flex:none;width:46px}
.ptt{flex:1;color:#cdd6e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{background:#3a2f12;color:#ffd166;border-radius:5px;padding:0 5px;font-size:9.5px;flex:none}
.pact{color:#06d6a0;font-size:10px;flex:none;font-weight:700}
.qcard{display:flex;gap:9px;padding:8px;margin:6px 0;background:#141c2c;border:1px solid #243049;border-radius:9px}
.qth{width:78px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:#0d1420}
.qth.none{display:flex;align-items:center;justify-content:center;color:#54627a;font-size:9px;text-align:center;line-height:1.2;border:1px dashed #2a3752}
.qbody{flex:1;min-width:0}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qcode{color:#7fc1ff;font-weight:700;font-size:11.5px}
.qlane{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700}
.qlane.info{background:#12283a;color:#7fc1ff}
.qlane.pop{background:#2f2136;color:#e0a3ff}
.qtitle{color:#e6edf5;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qfacts{color:#8a95a6;font-size:10px;margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qmeta{margin-top:4px}
.qdraft{color:#6b7688;font-size:9.5px;margin-left:8px}
.qpv{background:#17324a;color:#7fc1ff;border:1px solid #2a4d6e;border-radius:6px;font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer}
.qpv:hover{background:#1d4463}
.qpv.none{background:none;border:none;color:#54627a;font-weight:400;cursor:default;padding:3px 0}
#qpv-ov{display:none;position:fixed;inset:0;background:rgba(6,10,18,.82);z-index:999;align-items:center;justify-content:center;padding:18px}
#qpv-ov.show{display:flex}
.qpv-box{width:100%;max-width:760px;height:88vh;display:flex;flex-direction:column;background:#0f1626;border:1px solid #2a3752;border-radius:12px;overflow:hidden}
.qpv-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #243049;font-size:12.5px;font-weight:700;color:#7fc1ff}
.qpv-hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpv-x{background:#243049;color:#cdd6e0;border:none;border-radius:6px;font-size:11px;padding:5px 11px;cursor:pointer;flex:none}
.qpv-x:hover{background:#324158}
.qpv-fr,#qpv-fr{flex:1;width:100%;border:0;background:#fff}
.qpv-ft{padding:8px 14px;border-top:1px solid #243049;font-size:10px;color:#8a95a6;text-align:center}
.ch{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 4px;flex:none;margin-left:3px}
.ch.on{background:#0c3a2c;color:#06d6a0}
.ch.off{background:#3a1216;color:#f0707a}
</style>
</head>

</div>

TCiiigYUUUUAFFFFABRRRQAUUUUAFMlkEaZPXsKfVG5fdIR2XigUnZEbMWYljkmkoopGAUUUUAFFFFAGnRRRTOghktLaRy8ltC7HqzRgk037BZ/8APpb/APfpf8KqXt9cQ3iQxom0ugyeuCcE+3YD6Gq9pqF5LfTW7spZN/yDGRjp/nNPlJ5Y9jT+wWf/AD6W/wD36X/Cj7BZ/wDPpb/9+l/wrOh1Of7PLI5hZkVCOwbJOcZ9hxVuG8eXTnuP3QkAbaNwx/s5OfpRYOWPYtRQQwgiGKOPPXYoGfyqSsc6nMbIyoA7GUKoRRuxj0ycHrWhYTNcWcUrjDMOeMUWGrbIsUUUUhhRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAITgZrOJySa0TyCKzaGZ1OgUUUUjMKKKKACiiigDTooopnQNaNGcOyKWXoxHIpFhiWQyLGgc9WCjJ/GiimAqoq52qq5OTgYzTqKKQDXjSRdsiK6+jDIpVVUUKihVHQAYAoooAWiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACqE67JWHbqKKKGRU2I6KKKRkFFFFABRRRQB/9k=","body":"■ 제목: 침수차 확인 방법 중고차 침수이력 무료 조회 계약 해제 90일 총정리 (2026 카히스토리·자동차365)\n■ 코드후보: D2-09 (생활·행정 > 자동차·교통)  ※DB에 D2-08까지 사용 중, queue.json에 D2 없음 — 둘 다 대조 확인\n■ 트렌드/시즌: 2026년 여름 집중호우 이후 8~9월 = 침수차 매물 유입기 · dupcheck 🟢 신규\n■ 카테고리: 생활·행정 (#2EB67D)\n■ 썸네일: thumbs/147_flood_used_car.png (다크) · thumbs_naver/147_flood_used_car.png (라이트)\n■ 기존글과의 경계(중요): D2-07 「자동차 침수 대처 방법 자차보험 처리 침수 전손 폐차 환급」은\n   '내 차가 잠겼을 때(피해 차주 관점)'이고, 이 글은 '침수차를 사지 않는 법 + 사고 나서 무르는 법\n   (구매자 관점)'이다. 겹치는 자차보험 보상 요건은 본문에서 다루지 않고 관련글 링크로 넘긴다.\n■ 원본가치(V0):\n   ① 핵심 정보이득 — 침수 미고지 계약 해제는 30일이 아니라 **90일**이다(자동차관리법 제58조의6 제1항 제3호).\n      시중 글 대부분이 \"30일\"만 쓴다. 30일은 '주행거리·사고이력·압류저당' 트랙이고 침수만 90일이다.\n      ※ 조문 원문을 국가법령정보센터에서 직접 열어 확인했다(시행 2026.6.16. 법률 제21817호).\n        제2호에 **\"(침수 사실은 제외한다)\"** 라는 괄호가 박혀 있어 침수만 제3호=90일로 갈린다.\n   ①-2 형사처벌 — 침수 사실 미고지·거짓고지는 **제80조 제6호·제7호, 2년 이하 징역 또는 2천만 원 이하 벌금**이다.\n      민사 해제만 아는 사람이 대부분이라 협상력에서 큰 차이가 난다.\n   ② 함정 — 카히스토리 무료조회는 **보험 처리된 침수만** 나온다(보험개발원 공식 명시). 자비 수리한\n      침수차는 조회해도 '이력 없음'으로 나온다. 이 글의 가장 중요한 경고.\n   ③ 판단형 비교 — 카히스토리 vs 자동차365, 무엇이 잡히고 무엇이 안 잡히는지 표로 대조.\n      자동차365는 무료지만 같은 사이트의 '통합이력조회'는 수수료가 붙을 수 있어 서비스가 다르다.\n   ④ 트랙 구분 — 성능점검 보증(인도일 30일 이상 또는 2천km 이상 · 시행규칙 제123조의8②)과\n      계약 해제권(90일)은 **별개 트랙**이다. 보증이 끝났다고 해제권까지 끝난 게 아니다.\n   ⑤ 계산예시 — 인도일을 넣어 30일·90일·2,000km 만료일을 달력으로 역산.\n   ⑥ 판단형 비교 — 계약 해제(원상회복) vs 손해배상(수리비) 중 어느 쪽이 유리한가.\n   ⑦ 함정 — 전손 침수차는 안 날부터 30일 내 폐차가 법적 의무(법 제26조의2① + 시행규칙 제25조의2①)이고\n      위반 시 **1천만 원 이하 과태료**(제84조 제2항 제2호의2)인데도 유통된다.\n      그래서 정작 위험한 건 '보험 처리를 안 한 침수차'라는 결론으로 ②와 연결.\n   ⑧ 시효성 정보 — 성능·상태점검 내용은 **점검일부터 120일 이내의 것**이어야 하고(법 제58조①1호),\n      기록부 발급도 발급일 기준 120일 이내 점검분으로 한정된다(시행규칙 제120조②). 게다가 고지는\n      **매매 계약을 체결하기 전에 서면으로** 해야 한다 — 계약서에 사인한 뒤 주는 것은 위법이다.\n■ 팩트 기준: 2026년 8월 · 1차 출처 직접 열람\n   - 보험개발원 카히스토리 「무료침수사고조회」 페이지 원문 → 운영기관·입력값·조회범위·한계 문구\n   - 🔴 **국가법령정보센터(law.go.kr) 「자동차관리법」 조문 원문 직접 열람**\n     (시행 2026.6.16. 법률 제21817호 / 시행규칙 시행 2026.6.3.) — 브라우저 창으로 본문 텍스트를 직접 읽었다.\n     WebFetch 로는 law.go.kr 이 JS 렌더링이라 본문이 안 나온다(3회 실패 확인) → 브라우저 경로가 정답.\n       · 제58조①1호(침수 사실 포함 서면 고지·점검일부터 120일 이내) · 제58조의4(성능·상태점검자의 보증 책임)\n       · 제58조의6①(30일/90일 해제, 제2호 \"침수 사실은 제외한다\") · 제58조의6②③(반환과 동시이행)\n       · 제80조 6·7호(침수 미고지·거짓고지 = 2년 이하 징역 또는 2천만 원 이하 벌금)\n       · 제81조 25의6·25의7(점검자 보증 불이행·보험 미가입 = 1년 이하 징역 또는 1천만 원 이하 벌금)\n       · 제84조②2의2(폐차 요청 불이행 = 1천만 원 이하 과태료) · 제84조②5(전손 침수차 수출·판매 = 동일)\n       · 제26조의2①②(폐차 요청 의무 · 수출 및 수출자 판매 금지) · 제59조④(침수 미고지 실형자 2년간 종사 제한)\n       · 시행규칙 제25조의2①(\"전손 처리 결정된 사실을 안 날부터 30일\") · 제120조②(120일) · 제123조의8②(30일·2천km)\n   - 법제처 찾기쉬운 생활법령정보 「중고차 매매 분쟁 해결하기」 → 해제 기간 해설(위 조문과 대조 일치)\n   - 국토교통부·한국교통안전공단 자동차365 → 침수정보 조회(무료)와 통합이력조회(수수료 가능) 구분\n   - 손해보험협회 집계(12개 손보사 자동차보험) → 2021~2025년 침수 35,011건 / 7~10월 95.7% / 전손 74.9%\n   - 공정거래위원회 「소비자분쟁해결기준」 고시 → '먼저 도달한 것 적용' 문구(법정 최소는 시행규칙 소관)\n■ 초안 1차 작성 시의 오류(조문 원문 대조로 정정한 것 — 발행본에는 정정 후 값이 들어 있다)\n   ① 전손 침수차 폐차 불이행 과태료를 언론 기사 요약대로 '300만 원 이하'로 썼다 → **현행 1천만 원 이하**\n      (제84조 제2항). 300만 원은 개정 전 수치였다.\n   ② 성능·상태점검 책임보험 미가입 벌칙(1년 이하 징역/1천만 원 이하 벌금)의 대상을 매매업자처럼 읽히게 썼다\n      → 실제 수범자는 **자동차성능·상태점검자**다(제81조 25의6·25의7).\n   ③ 120일을 '1차 출처 미확인'으로 빼뒀는데, **법 제58조①1호에 명문으로 있다.** 넣었다.\n   → 교훈: law.go.kr 은 WebFetch 로 못 읽히니 **브라우저 창으로 조문 본문을 직접 열 것.**\n      언론·개인블로그 요약으로 법 조문·금액을 쓰면 이렇게 틀린다.\n■ 의도적 미기재:\n   - 2026년 올해 침수차 대수 — 공식 집계가 아직 없어 쓰지 않았다. 본문 숫자는 전부 2021~2025년\n     확정치이며 연도별 합(1,531+18,267+2,238+5,210+7,765=35,011)과 전손·분손 합(26,224+8,787=35,011)이\n     일치하는 것을 확인했다.\n   - 자차보험 침수 보상 요건(창문 개방 등) — D2-07에서 이미 다뤘으므로 중복 회피.\n\n[붙여넣는 법] Blogger 글쓰기 → 연필▾ → HTML 보기 → 아래 전체 붙여넣기 → 작성 보기 → 제목 입력 → 라벨(생활행정) → 발행\n----------------------------------------------------------------\n▼ 본문 HTML\n<div style=\"text-align:center;margin:0 0 18px\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCACIAQQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD2qiiiqJCiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKAIrh9kfHU8CqNWLw/Mo9qr0mYzeoUUUUEhRRRQA5XZRhWIFFNooC7NOiiimdBzPiDxQ1hd/YrGFZZxgOz5wCegAHU1QXxLrzEBbCEkqWA2N0HU9aqeKNMu7LWJL6KOR4ZH8xXQZ2nuD6VGmtOt5HL9knaJYmQq3JOTnqRWbbueJUxFVVZKcnHX8C6nijXJJJI47GFnj++AjHb+tOHiXXdrN9it8IxVuDwQMnPzelZMOqTR6hNcC3l8uTOE28j0ycc4pBqUp+1FracmZ3ZRk8bgevHv1/CldmSxM/wDn4zs/DmuprMThoxFcR43oDkEeorZrkvA+lXFsZr25RoxIgSNWGCRnJOPwFdbWkb21PYwk6k6KdTcKKKKZ0BRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAVbwcq34VWrQmTzIyO/aqBBBwetJmU1qJRRRQQFFFFABRUscDuu4YA96KB8rL1FFFM3CiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACoZoBJ8y8N/OpqKAauZzoyHDAim1pEZ600xRn+BfyosZumUACTgDNTxWxJzJwPSrQUL0AH0paLDUEtwHAwKKKKCwooooAw9f8AFmj6A6x6hdATMyDyl5YBjgMR6DvU9p4h02+v7ezsp/Pa4geeOSMZQqjBW59cmue+Ia+dLY2+o3M8OnySZgSwgaW4l 조문과 공식 페이지 원문 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 침수차는 왜 8~9월에 쏟아지나 — 숫자로 보기<\/a><a href=\"#trap1\">2. 🔴 함정 ① 카히스토리로도 안 잡히는 침수차가 있습니다<\/a><a href=\"#compare\">3. 무료 조회 두 곳 완전 비교 (카히스토리 vs 자동차365)<\/a><a href=\"#how\">4. 5분이면 끝나는 조회 3단계<\/a><a href=\"#record\">5. 성능·상태점검기록부에서 침수 칸 읽는 법<\/a><a href=\"#eye\">6. 눈과 코로 잡는 침수 흔적 12곳<\/a><a href=\"#law90\">7. 🔴 핵심 — 침수 미고지는 30일이 아니라 <b>90일<\/b>입니다<\/a><a href=\"#calc\">8. 계산예시 — 내 권리 만료일 달력으로 역산하기<\/a><a href=\"#track\">9. 30일·2,000km 트랙과 90일 트랙은 다릅니다<\/a><a href=\"#choose\">10. 계약 해제와 손해배상, 어느 쪽이 유리한가<\/a><a href=\"#process\">11. 실제 진행 절차 4단계 (한국소비자원 1372)<\/a><a href=\"#trap3\">12. 🔴 함정 ② 전손 침수차는 폐차가 의무인데 왜 시장에 있나<\/a><a href=\"#faq\">13. 자주 묻는 질문<\/a><a href=\"#gov\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#trap1\">👉 무료 조회로도 안 잡히는 침수차부터 확인하기<\/a>\n\n<h2 id=\"sec1\">1. 침수차는 왜 8~9월에 쏟아지나 — 숫자로 보기<\/h2>\n<p>손해보험협회가 12개 손해보험사의 자동차보험 처리 내역을 집계한 자료를 보면, <b>2021년부터 2025년까지 5년간 자동차보험으로 처리된 차량 침수 사고는 35,011건<\/b>입니다. 그중 <b>7월부터 10월 사이에 33,490건(95.7%)<\/b>이 몰려 있습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>연도<\/th><th>침수 처리 건수<\/th><\/tr>\n<tr><td>2021년<\/td><td>1,531건<\/td><\/tr>\n<tr><td>2022년<\/td><td><b>18,267건<\/b><\/td><\/tr>\n<tr><td>2023년<\/td><td>2,238건<\/td><\/tr>\n<tr><td>2024년<\/td><td>5,210건<\/td><\/tr>\n<tr><td>2025년<\/td><td>7,765건<\/td><\/tr>\n<tr><td><b>5년 합계<\/b><\/td><td><b>35,011건<\/b><\/td><\/tr>\n<\/table><\/div>\n<p>이 35,011건을 처리 방식으로 나누면 <b>전손 26,224건(74.9%)<\/b>, <b>분손 8,787건(25.1%)<\/b>입니다. 침수 사고 넷 중 셋이 <b>수리하는 것보다 차값을 주는 편이 싸다고 판단된 전손<\/b>이라는 뜻입니다.<\/p>\n<div class=\"tip\"><b>💡 왜 이 숫자가 구매자에게 중요한가<\/b><p style=\"margin:8px 0 0\">침수가 7~10월에 몰린다는 것은, <b>수리와 정비를 거쳐 매물로 나오는 시점이 그 직후인 8월~이듬해 초<\/b>라는 뜻입니다. 여름 폭우 뉴스가 나온 해의 가을에 중고차를 산다면 조회를 건너뛸 이유가 없습니다.<\/p><\/div>\n<p>참고로 <b>2026년 올해의 침수 차량 수는 아직 공식 집계가 나오지 않았습니다.<\/b> 인터넷에 도는 \"올해 몇만 대\" 같은 수치는 출처가 불분명한 경우가 많으니 그대로 믿지 마세요. 확정된 통계는 위 5년치입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"trap1\">2. 🔴 함정 ① 카히스토리로도 안 잡히는 침수차가 있습니다<\/h2>\n<p>침수 조회라고 하면 대부분 <b>카히스토리(carhistory.or.kr)<\/b>를 떠올립니다. 보험개발원이 운영하는 사이트이고, <b>무료침수사고조회<\/b> 메뉴에서 차량번호나 차대번호만 넣으면 침수 이력이 바로 나옵니다. 좋은 서비스입니다. 그런데 <b>이 조회의 범위<\/b>를 반드시 알고 써야 합니다.<\/p>\n<div class=\"warn\"><b>📜 카히스토리 공식 안내 원문의 요지<\/b><p style=\"margin:8px 0 0\">이 조회는 <b>보험회사가 자동차보험으로 처리한 침수 사고<\/b>를 알려주는 서비스이며, <b>보험사에 신고하지 않았거나 자동차보험으로 처리하지 않은 경우는 확인할 수 없습니다.<\/b> 사이트 스스로 \"참고 정보\"이며 실차 확인과 전문가 점검을 함께 받으라고 안내하고 있습니다.<\/p><\/div>\n<p>이 한 문장이 침수차 사기의 핵심 구멍입니다. 침수 피해를 입은 차주가 <b>보험 처리를 하지 않고 자기 돈으로 수리했다면<\/b>, 그 차는 카히스토리에서 <b>\"침수 이력 없음\"<\/b>으로 깨끗하게 나옵니다.<\/p>\n<p>왜 보험 처리를 안 할까요. 이유는 단순합니다.<\/p>\n<ul>\n<li><b>보험료 할증이 싫어서<\/b> — 침수는 자기차량손해로 처리되고 보험료에 영향을 줄 수 있습니다.<\/li>\n<li><b>자차보험에 가입돼 있지 않아서<\/b> — 자차 미가입 차량은 애초에 보험 처리 자체가 불가능합니다.<\/li>\n<li><b>침수 기록을 남기지 않으려고<\/b> — 되팔 때 값이 떨어지는 것을 피하려는 경우입니다.<\/li>\n<\/ul>\n<p>즉 <b>가장 악의적으로 유통되는 침수차일수록 카히스토리에는 안 나옵니다.<\/b> \"카히스토리 돌려봤는데 깨끗해요\"라는 판매자 말만 믿으면 안 되는 이유가 여기 있습니다. 조회는 <b>거르는 도구<\/b>이지 <b>보증하는 도구<\/b>가 아닙니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"compare\">3. 무료 조회 두 곳 완전 비교 (카히스토리 vs 자동차365)<\/h2>\n<p>그래서 <b>한 곳만 돌리면 안 됩니다.<\/b> 국토교통부와 한국교통안전공단이 운영하는 <b>자동차365(car365.go.kr)<\/b>에도 <b>침수정보 조회<\/b>가 있고, 이쪽은 보험 이력 외의 경로까지 함께 봅니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>카히스토리<\/th><th>자동차365<\/th><\/tr>\n<tr><td><b>운영<\/b><\/td><td>보험개발원<\/td><td>국토교통부 · 한국교통안전공단<\/td><\/tr>\n<tr><td><b>메뉴<\/b><\/td><td>무료침수사고조회<\/td><td>중고차의모든것 &gt; 중고차매매 &gt; <b>침수정보 조회<\/b><\/td><\/tr>\n<tr><td><b>입력<\/b><\/td><td>차량번호 또는 차대번호<\/td><td>차량번호<\/td><\/tr>\n<tr><td><b>보험 침수 이력<\/b><\/td><td>✅ (1996년 이후)<\/td><td>✅<\/td><\/tr>\n<tr><td><b>정비업소 수리 내역<\/b><\/td><td>❌<\/td><td>✅<\/td><\/tr>\n<tr><td><b>지자체 침수 피해 신고<\/b><\/td><td>❌<\/td><td>✅<\/td><\/tr>\n<tr><td><b>비용<\/b><\/td><td>무료<\/td><td>침수정보 조회는 무료<\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 자동차365에서 헷갈리기 쉬운 점<\/b><p style=\"margin:8px 0 0\">같은 사이트의 <b>「통합이력조회」는 침수정보 조회와 다른 서비스<\/b>입니다. 자동차365는 <b>「자동차관리법」 제76조에 따라 통합이력조회 이용 시 수수료를 징수할 수 있다<\/b>고 안내하고 있습니다. 무료로 침수만 보려면 <b>「침수정보 조회」 메뉴<\/b>로 들어가세요.<\/p><\/div>\n<h3>그래도 남는 사각지대<\/h3>\n<p>두 곳을 다 돌려도 <b>보험 처리도 안 하고 정식 정비업소도 거치지 않은 채 개인이 손본 차<\/b>는 어디에도 기록이 없습니다. 그래서 마지막 관문은 결국 <b>기록부 확인 + 눈과 코<\/b>입니다. 아래 5·6번이 그 부분입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"how\">4. 5분이면 끝나는 조회 3단계<\/h2>\n<p>매물을 보러 가기 <b>전에<\/b> 차량번호만 받아서 집에서 먼저 돌려보세요. 판매자에게 차량번호를 알려달라고 하는 것은 전혀 실례가 아니며, <b>차량번호 공개를 꺼리는 판매자는 그 자체가 신호<\/b>입니다.<\/p>\n<ol>\n<li><b>카히스토리 무료침수사고조회<\/b> — carhistory.or.kr → 무료침수사고조회 → 차량번호(또는 차대번호) 입력. 침수 여부와 침수 날짜가 나옵니다.<\/li>\n<li><b>자동차365 침수정보 조회<\/b> — car365.go.kr → 중고차의모든것 → 중고차매매 → 침수정보 조회 → 차량번호 입력. 정비 내역과 지자체 신고 내역까지 함께 확인됩니다.<\/li>\n<li><b>성능·상태점검기록부 요구<\/b> — 매매업자를 통한 거래라면 계약 전에 <b>반드시 종이(또는 파일)로 받아<\/b> 침수 항목과 점검일자를 확인합니다.<\/li>\n<\/ol>\n<div class=\"tip\"><b>💡 화면을 캡처해 두세요<\/b><p style=\"margin:8px 0 0\">조회 결과 화면은 <b>날짜가 보이도록 캡처<\/b>해 두세요. 나중에 분쟁이 생겼을 때 \"계약 전에 확인했고 그때는 이력이 없다고 나왔다\"는 사실이 <b>고지 위반을 다투는 근거<\/b>가 됩니다. 카카오톡·문자로 오간 \"침수 없습니다\"라는 판매자 답변도 지우지 마세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"record\">5. 성능·상태점검기록부에서 침수 칸 읽는 법<\/h2>\n<p>중고차 매매업자를 통해 사면 <b>「자동차관리법」에 따라 성능·상태점검기록부를 고지받습니다.<\/b> 이건 서비스가 아니라 <b>법이 정한 의무<\/b>입니다. 제58조 제1항 제1호의 문구를 그대로 옮기면 이렇습니다.<\/p>\n<div class=\"tip\"><b>📜 「자동차관리법」 제58조 제1항 (조문 원문)<\/b><p style=\"margin:8px 0 0\">자동차매매업자(종사원을 포함한다)가 자동차를 매도 또는 매매의 알선을 하는 경우에는 (…) 다음 각 호의 사항을 <b>매매 계약을 체결하기 전에<\/b> 그 자동차의 매수인에게 <b>서면으로 고지<\/b>하여야 한다.<br>1. (…) 해당 자동차의 <b>침수 사실<\/b> 및 구조·장치 등의 성능·상태를 점검한 내용(점검 장면을 촬영한 사진을 포함하며, <b>점검일부터 120일 이내의 것<\/b>)<\/p><\/div>\n<p>여기서 세 가지가 한꺼번에 확정됩니다. <b>①침수 사실은 고지 항목에 명시돼 있고 ②고지 시점은 '계약 체결 전'이며 ③점검 내용은 점검일부터 120일 이내여야 합니다.<\/b> 계약서에 사인을 다 받은 다음에 기록부를 건네는 방식은 순서가 뒤집힌 것입니다.<\/p>\n<h3>반드시 확인할 네 가지<\/h3>\n<ul>\n<li><b>침수 항목이 체크돼 있는가<\/b> — 기록부에는 침수 이력을 표기하는 칸이 있습니다. 여기에 아무 표시가 없다면 \"침수 없음\"을 <b>점검자가 보증해 고지한 것<\/b>이 됩니다. 나중에 침수가 드러나면 이 서류가 그대로 증거가 됩니다.<\/li>\n<li><b>점검일자가 120일 안쪽인가<\/b> — 시행규칙 제120조 제2항은 기록부 발급을 <b>발급일 기준 120일 이내에 이루어진 점검<\/b>으로 한정합니다. 점검일이 넉 달 넘게 지난 기록부는 애초에 쓸 수 없는 서류입니다. <b>점검일자부터 보세요.<\/b><\/li>\n<li><b>계약 전에 받았는가<\/b> — 위 조문대로 <b>계약 체결 전<\/b>입니다. \"일단 계약금부터 걸고 나중에 드릴게요\"는 받아들이지 마세요.<\/li>\n<li><b>서명하기 전에 확인했는가<\/b> — 소비자가 기록부에 확인·서명하기 전에 <b>자동차365에서 정비이력과 실매물 여부를 먼저 확인<\/b>하도록 안내돼 있습니다. 서명은 마지막에 하세요.<\/li>\n<\/ul>\n<h3>기록부를 보증하는 사람은 따로 있습니다<\/h3>\n<p>기록부를 발행하는 <b>자동차성능·상태점검자<\/b>는 그 내용을 <b>보증할 책임<\/b>을 지고(제58조의4 제1항), 그 보증에 책임지는 <b>보험에 가입할 의무<\/b>가 있습니다(같은 조 제2항). 이를 어기면 <b>1년 이하의 징역 또는 1천만 원 이하의 벌금<\/b>입니다(제81조 제25호의6·제25호의7). <b>이 벌칙의 대상은 매매업자가 아니라 점검자<\/b>라는 점을 알아 두면, 분쟁이 생겼을 때 <b>매매업자와 점검자 양쪽<\/b>에 책임을 물을 수 있다는 것이 보입니다.<\/p>\n<div class=\"warn\"><b>⚠️ 개인 간 직거래에는 이 보호막이 없습니다<\/b><p style=\"margin:8px 0 0\">고지 의무 조문은 첫 줄이 <b>\"자동차매매업자(종사원을 포함한다)가 자동차를 매도 또는 매매의 알선을 하는 경우\"<\/b>로 시작합니다. 뒤에서 설명할 <b>90일 계약 해제권<\/b>도 <b>\"자동차매매업자의 매매 또는 매매 알선으로 매매 계약을 맺은 자동차 매수인\"<\/b>이라고 못 박혀 있습니다(제58조의6 제1항). 즉 <b>개인 직거래(당근·중고나라 등)에는 이 두 조항이 적용되지 않습니다.<\/b> 직거래에서 침수 사실을 속았다면 민법상 사기·하자담보책임으로 다퉈야 해서 입증 부담이 훨씬 큽니다. <b>싸다는 이유로 직거래를 택하는 것이 침수 시즌에는 특히 위험한 이유<\/b>입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"eye\">6. 눈과 코로 잡는 침수 흔적 12곳<\/h2>\n<p>기록에 안 남은 침수차를 잡는 마지막 방법입니다. <b>물은 아래에서 위로 차오르고, 사람 손이 닿기 어려운 구석에는 흔적이 남습니다.<\/b> 겉으로 보이는 시트와 매트는 얼마든지 새것으로 바꿀 수 있으니 <b>바꾸기 번거로운 곳<\/b>을 보세요.<\/p>\n<div class=\"tw\"><table>\n<tr><th>보는 곳<\/th><th>무엇을 확인하나<\/th><\/tr>\n<tr><td><b>① 안전벨트 끝까지 당기기<\/b><\/td><td>끝단에 얼룩·흙먼지 띠·곰팡이 자국이 있는지<\/td><\/tr>\n<tr><td><b>② 시트 레일 볼트<\/b><\/td><td>바닥 레일 볼트에 녹, 볼트 머리 흠집(탈거 흔적)<\/td><\/tr>\n<tr><td><b>③ 스페어타이어 수납 공간<\/b><\/td><td>트렁크 바닥을 들어 진흙·물때·부식 확인<\/td><\/tr>\n<tr><td><b>④ 실내 퓨즈박스<\/b><\/td><td>단자 부식, 흰 가루, 물 자국<\/td><\/tr>\n<tr><td><b>⑤ 엔진룸 볼트·배선 커넥터<\/b><\/td><td>커넥터 안쪽 녹, 배선 피복의 진흙<\/td><\/tr>\n<tr><td><b>⑥ 에어컨 첫 가동 시 냄새<\/b><\/td><td>퀴퀴한 곰팡이 냄새(방향제를 심하게 쓴 차 주의)<\/td><\/tr>\n<tr><td><b>⑦ 도어 하단 고무 몰딩 안쪽<\/b><\/td><td>몰딩을 젖혀 흙·모래 잔여물<\/td><\/tr>\n<tr><td><b>⑧ 실내등·룸미러 주변<\/b><\/td><td>천장 마감재 얼룩(전손급 완전 침수의 흔적)<\/td><\/tr>\n<tr><td><b>⑨ 계기판 유리 안쪽<\/b><\/td><td>습기 자국, 물이 마른 얼룩<\/td><\/tr>\n<tr><td><b>⑩ 시가잭·USB 포트 안쪽<\/b><\/td><td>손전등으로 비춰 부식 확인<\/td><\/tr>\n<tr><td><b>⑪ 트렁크 힌지·경첩<\/b><\/td><td>도색 안 된 금속부의 녹<\/td><\/tr>\n<tr><td><b>⑫ 배선 냄새<\/b><\/td><td>차 문을 닫고 5분 있어 보면 냄새가 올라옵니다<\/td><\/tr>\n<\/table><\/div>\n<div class=\"tip\"><b>💡 가장 확실한 한 가지<\/b><p style=\"margin:8px 0 0\">위 12개를 다 봐도 확신이 안 서면 <b>구매 전 정비소 점검(PPI)<\/b>을 받으세요. 몇만 원을 아끼려다 수백만 원짜리 전장 수리를 떠안는 것보다 낫습니다. 판매자가 <b>\"제3의 정비소에서 점검받아도 되겠느냐\"<\/b>는 요청을 거절한다면 그 차는 거르는 편이 맞습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"law90\">7. 🔴 핵심 — 침수 미고지는 30일이 아니라 90일입니다<\/h2>\n<p>여기가 이 글에서 가장 중요한 부분입니다. 중고차 분쟁을 다룬 글 대부분이 <b>\"인도일부터 30일\"<\/b>이라고만 적습니다. 맞는 말이지만 <b>절반만 맞습니다.<\/b> 조문을 그대로 열어 보면 기간이 <b>두 갈래<\/b>로 갈려 있습니다.<\/p>\n<div class=\"tip\"><b>📜 「자동차관리법」 제58조의6 제1항 (조문 원문)<\/b><p style=\"margin:8px 0 0\">자동차매매업자의 매매 또는 매매 알선으로 매매 계약을 맺은 자동차 매수인은 해당 자동차가 <b>제1호 또는 제2호에 해당하는 경우에는 자동차인도일부터 30일 이내에<\/b>, <b>제3호에 해당하는 경우에는 자동차인도일부터 90일 이내에<\/b> 해당 매매 계약을 해제할 수 있다.<br>1. 해당 자동차의 <b>주행거리, 사고 사실<\/b>이 제58조제1항제1호의 고지 내용과 다른 경우<br>2. 제58조제1항제1호에 따른 사항<b>(침수 사실은 제외한다)<\/b> 또는 같은 항 제2호에 따른 사항을 거짓으로 고지하거나 고지하지 아니한 경우<br>3. 해당 자동차의 <b>침수 사실<\/b>이 제58조제1항제1호의 고지 내용과 다른 경우 또는 (…) 침수 사실을 거짓으로 고지하거나 고지하지 아니한 경우<\/p><\/div>\n<p>제2호에 <b>\"(침수 사실은 제외한다)\"<\/b>라는 괄호가 일부러 박혀 있습니다. 침수를 30일 트랙에서 빼내 <b>제3호로 따로 세운 것<\/b>입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>해제 사유<\/th><th>기간(자동차 인도일 기준)<\/th><\/tr>\n<tr><td>주행거리·사고 사실이 고지 내용과 다른 경우 (제1호)<\/td><td>30일 이내<\/td><\/tr>\n<tr><td>성능·상태 점검 내용(침수 제외)을 거짓 고지·미고지 (제2호)<\/td><td>30일 이내<\/td><\/tr>\n<tr><td>압류·저당권 등록 여부를 거짓 고지·미고지 (제2호)<\/td><td>30일 이내<\/td><\/tr>\n<tr><td><b>침수 사실이 고지 내용과 다르거나 거짓·미고지 (제3호)<\/b><\/td><td><b>90일 이내<\/b><\/td><\/tr>\n<\/table><\/div>\n<p><b>침수만 90일입니다.<\/b> 다른 항목의 세 배입니다. 이유는 짐작이 갑니다 — 침수 피해는 인수 직후에는 멀쩡하다가 <b>부식이 진행되면서 뒤늦게 증상이 나타나는<\/b> 특성이 있기 때문입니다. 입법이 그 시차를 감안한 것입니다.<\/p>\n<h3>해제하면 차와 돈은 '동시에' 오갑니다<\/h3>\n<p>같은 조 제2항·제3항이 절차까지 정해 놓았습니다. <b>매수인은 해제한 경우 자동차를 즉시 반환<\/b>하고, <b>매매업자는 그 반환과 동시에 이미 지급받은 매매금액을 반환<\/b>해야 합니다. 즉 <b>\"차를 먼저 넘기면 돈은 나중에\"는 법이 정한 순서가 아닙니다.<\/b> 동시이행이라고 못 박혀 있으니 그대로 요구하세요.<\/p>\n<h3>미고지·허위고지는 형사처벌 대상입니다<\/h3>\n<p>여기서 한 걸음 더 들어갑니다. 침수 사실을 고지하지 않거나 거짓으로 고지한 행위는 <b>계약 해제로 끝나는 민사 문제가 아닙니다.<\/b><\/p>\n<div class=\"warn\"><b>📜 「자동차관리법」 제80조 제6호·제7호<\/b><p style=\"margin:8px 0 0\">제58조제1항을 위반하여 자동차의 <b>침수 사실<\/b> 및 구조·장치 등의 성능·상태를 점검한 내용 또는 압류·저당권의 등록 여부를 <b>고지하지 아니한 자<\/b>(제6호), 또는 <b>거짓으로 고지한 자<\/b>(제7호)는 <b>2년 이하의 징역 또는 2천만 원 이하의 벌금<\/b>에 처한다.<\/p><\/div>\n<p>덧붙여 2024년 개정으로 <b>침수 사실을 미고지·허위고지해 징역 이상의 실형이나 집행유예를 받은 사람은 일정 기간 매매업 종사원이 될 수 없게<\/b> 됐습니다(제59조 제4항). 그만큼 무겁게 다루는 사안이라는 뜻입니다. 협상 자리에서 이 조문을 알고 있는 것과 모르는 것은 결과가 다릅니다.<\/p>\n<div class=\"warn\"><b>🔴 이것 때문에 권리를 포기하는 사람이 생깁니다<\/b><p style=\"margin:8px 0 0\">차를 받고 <b>45일쯤 지나<\/b> 전장 고장이 반복돼 정비소에 갔더니 \"침수 흔적이 있다\"는 말을 들었다고 합시다. \"30일 지났으니 이제 못 무른다\"고 검색해서 나온 글을 읽고 포기하는 경우가 실제로 있습니다. <b>침수라면 90일까지 계약 해제를 주장할 수 있습니다.<\/b> 날짜부터 다시 세어 보세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"calc\">8. 계산예시 — 내 권리 만료일 달력으로 역산하기<\/h2>\n<p>기준은 <b>계약일이 아니라 자동차 인도일<\/b>입니다. 차를 실제로 넘겨받은 날부터 셉니다. 예를 들어 <b>2026년 8월 10일에 차를 인도받았다면<\/b> 이렇게 됩니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>권리<\/th><th>기산일<\/th><th>만료일<\/th><\/tr>\n<tr><td>주행거리·사고이력·성능상태·압류저당 <b>해제권<\/b><\/td><td>2026-08-10<\/td><td><b>2026-09-09<\/b> (30일)<\/td><\/tr>\n<tr><td><b>침수 미고지 해제권<\/b><\/td><td>2026-08-10<\/td><td><b>2026-11-08<\/b> (90일)<\/td><\/tr>\n<tr><td>성능·상태점검 보증(하자 수리)<\/td><td>2026-08-10<\/td><td><b>2026-09-09 또는 주행 2,000km<\/b> — 계약서에 적힌 보증조건 확인<\/td><\/tr>\n<\/table><\/div>\n<p>표를 이렇게 놓고 보면 세 개가 <b>서로 다른 시계로 돈다<\/b>는 것이 한눈에 들어옵니다. 특히 마지막 줄은 <b>날짜와 주행거리<\/b> 두 축으로 돌아갑니다. 출퇴근 거리가 길어 하루 60km를 탄다면 <b>2,000km는 약 33일<\/b>이고, 하루 100km를 탄다면 <b>20일 만에<\/b> 2,000km에 닿습니다. 법정 최소는 <b>30일 이상 또는 2천km 이상<\/b>이고(시행규칙 제123조의8 제2항), <b>둘 중 먼저 도달한 쪽에서 종료<\/b>하는 운용은 「소비자분쟁해결기준」과 개별 약정에 따릅니다. <b>내 계약서에 적힌 보증조건을 직접 읽어 확인하세요.<\/b><\/p>\n<div class=\"tip\"><b>💡 인도받은 날 바로 할 일<\/b><p style=\"margin:8px 0 0\">차를 받은 날 <b>계기판 주행거리를 사진으로 찍고<\/b>, 달력에 <b>+30일 · +90일<\/b> 두 개를 표시해 두세요. 나중에 \"언제 받았더라\"를 다투는 일이 사라집니다. 인수인계 서류의 <b>인도일자<\/b>도 반드시 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"track\">9. 30일·2,000km 트랙과 90일 트랙은 다릅니다<\/h2>\n<p>많이 헷갈리는 대목이라 따로 떼어 설명합니다. 중고차 구매자를 지키는 장치는 <b>두 개의 서로 다른 트랙<\/b>으로 돼 있습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>A. 성능·상태점검 보증<\/th><th>B. 계약 해제권<\/th><\/tr>\n<tr><td><b>근거<\/b><\/td><td>법 제58조의4 · 시행규칙 제123조의8② · 「소비자분쟁해결기준」<\/td><td>법 제58조의6 제1항<\/td><\/tr>\n<tr><td><b>누가 책임지나<\/b><\/td><td><b>자동차성능·상태점검자<\/b>(책임보험 가입 의무)<\/td><td><b>자동차매매업자<\/b>(대금 반환)<\/td><\/tr>\n<tr><td><b>내용<\/b><\/td><td>기록부와 실제 성능이 달라 생긴 <b>고장을 수리·보상<\/b><\/td><td><b>계약 자체를 없던 일로<\/b> 되돌림<\/td><\/tr>\n<tr><td><b>기간<\/b><\/td><td>인도일 <b>30일 이상 또는 2천km 이상<\/b>(법정 최소)<\/td><td>일반 30일 / <b>침수 90일<\/b><\/td><\/tr>\n<tr><td><b>결과<\/b><\/td><td>차는 내가 계속 탐 + 수리비 보전<\/td><td>차를 돌려주고 <b>대금을 동시에 돌려받음<\/b><\/td><\/tr>\n<\/table><\/div>\n<p>핵심은 이것입니다. <b>A가 끝났다고 B까지 끝난 것이 아닙니다.<\/b> 하루 100km를 타서 20일 만에 2,000km를 넘겼다면 A는 종료되지만, 침수 미고지라면 <b>B는 90일까지 살아 있습니다.<\/b> 매매업자가 \"보증기간 지났습니다\"라고 하는 말은 대개 A를 가리킵니다. <b>책임지는 사람도 다릅니다<\/b> — A는 점검자, B는 매매업자입니다. 그래서 침수 분쟁에서는 <b>양쪽 모두를 상대로<\/b> 다툴 여지가 있습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"choose\">10. 계약 해제와 손해배상, 어느 쪽이 유리한가<\/h2>\n<p>침수 사실이 드러났을 때 선택지는 둘입니다. <b>무를 것인가, 아니면 차는 갖고 돈을 받을 것인가.<\/b> 정답은 상황에 따라 다릅니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>상황<\/th><th>권하는 선택<\/th><th>이유<\/th><\/tr>\n<tr><td>전장 고장이 <b>이미 반복<\/b>되고 있다<\/td><td><b>계약 해제<\/b><\/td><td>침수 전장 고장은 한 곳을 고치면 다른 곳이 터지는 식으로 이어집니다. 수리비를 받아도 밑 빠진 독이 되기 쉽습니다.<\/td><\/tr>\n<tr><td>90일이 <b>얼마 안 남았다<\/b><\/td><td><b>계약 해제<\/b><\/td><td>기간이 지나면 해제 카드가 사라집니다. 우선 해제 의사를 <b>내용증명으로 통지<\/b>해 시점을 확보하세요.<\/td><\/tr>\n<tr><td>침수 정도가 <b>가볍고<\/b> 차가 마음에 든다<\/td><td>손해배상(수리비·감가)<\/td><td>침수 이력이 있다는 사실만으로 시세가 떨어지므로 <b>수리비 + 시세 하락분<\/b>을 함께 청구할 수 있습니다.<\/td><\/tr>\n<tr><td>이미 <b>90일이 지났다<\/b><\/td><td>손해배상<\/td><td>해제권은 없어져도 <b>사기·기망에 따른 손해배상 청구는 별개<\/b>입니다. 포기하기 전에 상담부터 받으세요.<\/td><\/tr>\n<\/table><\/div>\n<div class=\"tip\"><b>💡 해제를 택했다면 순서가 중요합니다<\/b><p style=\"margin:8px 0 0\">차를 먼저 넘겨주고 돈을 나중에 받기로 하면 협상력이 사라집니다. <b>해제 의사 통지 → 반환 조건 합의(대금·이전등록비·취득세 등) → 동시 이행<\/b> 순서로 가세요. 합의가 안 되면 아래 11번 절차로 넘어갑니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"process\">11. 실제 진행 절차 4단계 (한국소비자원 1372)<\/h2>\n<ol>\n<li><b>증거 확보<\/b> — 정비소 점검 소견서(침수 흔적 명기), 성능·상태점검기록부 원본, 계약서·인수증(인도일 확인), 계약 전 조회 화면 캡처, 판매자와 주고받은 문자·통화 녹음.<\/li>\n<li><b>서면 통지<\/b> — 매매업자에게 <b>내용증명 우편<\/b>으로 침수 사실과 해제(또는 배상) 요구를 보냅니다. 구두 항의는 기록이 남지 않습니다. 내용증명은 <b>기간 내에 권리를 행사했다는 증거<\/b>가 됩니다.<\/li>\n<li><b>소비자상담·피해구제<\/b> — 합의가 안 되면 <b>1372 소비자상담센터<\/b>(국번 없이 ☎1372) 또는 소비자24(consumer.go.kr)로 피해구제를 신청합니다. 한국소비자원 분쟁조정 사례가 축적된 영역이라 조정으로 해결되는 경우가 많습니다.<\/li>\n<li><b>민사 소송<\/b> — 조정이 결렬되면 최후 수단입니다. 금액이 3,000만 원 이하면 <b>소액사건심판<\/b>으로 비교적 간단히 진행할 수 있습니다.<\/li>\n<\/ol>\n<div class=\"warn\"><b>⚠️ 2번을 미루면 1·3번이 소용없어집니다<\/b><p style=\"margin:8px 0 0\">가장 흔한 실패가 <b>\"매매상이 알아봐 준다고 해서 기다렸다\"<\/b>입니다. 그러는 사이 90일이 지나갑니다. <b>상대가 협조적으로 보여도 내용증명은 별도로 보내 두세요.<\/b> 보내 놓고 원만히 합의되면 그만이지만, 안 보내 놓고 기간이 지나면 되돌릴 수 없습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"trap3\">12. 🔴 함정 ② 전손 침수차는 폐차가 의무인데 왜 시장에 있나<\/h2>\n<p>앞에서 침수 사고의 <b>74.9%가 전손<\/b>이라고 했습니다. 그런데 <b>침수로 전손 처리된 차는 법적으로 폐차해야 합니다.<\/b><\/p>\n<div class=\"tip\"><b>📜 「자동차관리법」 제26조의2 + 시행규칙 제25조의2<\/b><p style=\"margin:8px 0 0\">① 침수로 인한 전손 처리 자동차의 소유자는 <b>해당 자동차가 침수로 인하여 전손(全損) 처리 결정된 사실을 안 날부터 30일<\/b> 내에 자동차해체재활용업자에게 <b>폐차를 요청<\/b>해야 합니다(법 제26조의2 제1항 + 시행규칙 제25조의2 제1항).<br>② 또한 <b>누구든지 침수 전손 자동차나 그 안전운행 관련 장치(내압용기·에어백 모듈·전기전자장치 등)를 수출하거나 수출하는 자에게 팔 수 없습니다<\/b>(법 제26조의2 제2항, 2022년 신설).<br>→ 두 가지 모두 위반 시 <b>1천만 원 이하의 과태료<\/b>입니다(제84조 제2항 제2호의2·제5호).<\/p><\/div>\n<p>그러면 왜 침수차가 시장에 도는 걸까요. 세 갈래입니다.<\/p>\n<ul>\n<li><b>폐차 의무를 어긴 경우<\/b> — 과태료를 감수하고 수리해 파는 사례. 다만 전손 이력은 <b>보험 처리를 거쳤으므로 카히스토리에 남아 조회로 잡힙니다.<\/b><\/li>\n<li><b>분손(25.1%)으로 처리된 차<\/b> — 수리해서 타는 것이 정상 처리이므로 폐차 대상이 아닙니다. 이 차를 되팔 때 <b>고지하지 않으면<\/b> 그것이 바로 90일 해제 사유입니다.<\/li>\n<li><b>보험 처리를 아예 안 한 차<\/b> — 전손·분손 판정 자체가 없으니 폐차 의무도 없고 <b>기록도 없습니다.<\/b><\/li>\n<\/ul>\n<p>세 번째가 <b>가장 위험합니다.<\/b> 2번 항목에서 말한 \"카히스토리로도 안 잡히는 차\"가 바로 이것입니다. 정리하면 이렇습니다 — <b>기록에 남은 침수차는 조회로 걸러지고, 진짜 조심해야 할 것은 기록을 만들지 않은 침수차입니다.<\/b> 그래서 조회(2~4번)와 눈·코 점검(5~6번)을 <b>둘 다<\/b> 해야 하고, 그러고도 놓쳤을 때를 위해 <b>90일 해제권(7번)<\/b>을 알아 둬야 합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"faq\">13. 자주 묻는 질문<\/h2>\n<h3>Q. 조회에 돈이 드나요?<\/h3>\n<p>카히스토리의 <b>무료침수사고조회<\/b>와 자동차365의 <b>침수정보 조회<\/b>는 무료입니다. 다만 자동차365의 <b>통합이력조회<\/b>는 「자동차관리법」 제76조에 따라 수수료가 있을 수 있습니다. 침수만 볼 거라면 무료 메뉴로 충분합니다.<\/p>\n<h3>Q. 차량번호만 알면 남의 차도 조회되나요?<\/h3>\n<p>침수 조회는 차량번호(또는 차대번호)로 조회합니다. 매물 검토 목적이라면 판매자에게 차량번호를 요청하세요. <b>차량번호를 알려주지 않는 매물은 검토 대상에서 빼는 편<\/b>이 안전합니다.<\/p>\n<h3>Q. 카히스토리에 '침수 없음'이면 안심해도 되나요?<\/h3>\n<p><b>아닙니다.<\/b> 보험 처리된 침수만 나옵니다. 사이트 자체가 \"참고 정보\"라고 안내하고 있습니다. 자동차365를 함께 돌리고 실차 점검까지 하세요.<\/p>\n<h3>Q. 개인 직거래로 샀는데 침수차였습니다. 90일 해제가 되나요?<\/h3>\n<p>제58조의6 제1항은 <b>\"자동차매매업자의 매매 또는 매매 알선으로 매매 계약을 맺은 자동차 매수인\"<\/b>이라고 정하고 있어 <b>개인 직거래에는 적용되지 않습니다.<\/b> 민법상 사기·하자담보책임으로 다퉈야 해서 입증 부담이 큽니다. <b>1372 소비자상담센터나 대한법률구조공단(☎132)에 먼저 상담<\/b>하세요.<\/p>\n<h3>Q. 성능·상태점검 보증기간(30일·2,000km)이 지났으면 끝인가요?<\/h3>\n<p><b>아닙니다.<\/b> 그건 점검자의 보증 트랙이고, <b>침수 미고지 계약 해제권은 인도일부터 90일<\/b>입니다. 두 기간은 별개로 흘러가고 <b>책임지는 상대(점검자 / 매매업자)도 다릅니다.<\/b><\/p>\n<h3>Q. 성능·상태점검기록부를 계약서 쓴 다음에 줬습니다. 문제 없나요?<\/h3>\n<p>「자동차관리법」 제58조 제1항은 <b>\"매매 계약을 체결하기 전에 서면으로 고지\"<\/b>하라고 정하고 있습니다. 계약 후 교부는 그 문언에 맞지 않습니다. 또 점검 내용은 <b>점검일부터 120일 이내의 것<\/b>이어야 하니 기록부의 <b>점검일자<\/b>도 함께 확인하세요.<\/p>\n<h3>Q. 침수차인 걸 알고도 싸게 샀습니다. 나중에 문제 삼을 수 있나요?<\/h3>\n<p>해제권은 <b>고지 내용과 다른 경우<\/b>에 생깁니다. 침수 사실을 고지받고 그 값에 합의해 샀다면 해제 사유가 되지 않습니다. 다만 <b>고지받은 침수 정도와 실제가 크게 다르다면<\/b> 다툴 여지가 있습니다.<\/p>\n<h3>Q. 렌터카·리스로 쓰던 차도 침수 조회가 되나요?<\/h3>\n<p>차량번호 기준으로 조회하므로 소유 형태와 무관하게 조회됩니다. 다만 <b>번호판이 바뀐 이력<\/b>이 있으면 차대번호로 조회하는 편이 정확합니다. 성능·상태점검기록부의 차대번호와 실제 차량의 차대번호(운전석 앞유리 하단·도어 스티커)가 <b>일치하는지<\/b>도 확인하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"gov\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.carhistory.or.kr/search/carhistory/freeSearch.car\" target=\"_blank\" rel=\"nofollow\">▸ 보험개발원 카히스토리 — 무료침수사고조회<\/a><a href=\"https://www.car365.go.kr/\" target=\"_blank\" rel=\"nofollow\">▸ 자동차365(국토교통부·한국교통안전공단) — 중고차매매 &gt; 침수정보 조회<\/a><a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&amp;csmSeq=1000&amp;ccfNo=4&amp;cciNo=1&amp;cnpClsNo=1\" target=\"_blank\" rel=\"nofollow\">▸ 법제처 찾기쉬운 생활법령정보 — 중고차 매매 분쟁 해결하기(30일·90일 해제)<\/a><a href=\"https://www.law.go.kr/법령/자동차관리법\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 「자동차관리법」(제58조·제58조의4·제58조의6·제26조의2·제80조·제84조)<\/a><a href=\"https://www.law.go.kr/법령/자동차관리법시행규칙\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 「자동차관리법 시행규칙」(제25조의2·제120조·제123조의8)<\/a><a href=\"https://www.consumer.go.kr/\" target=\"_blank\" rel=\"nofollow\">▸ 소비자24 — 피해구제 신청(1372 소비자상담센터)<\/a><a href=\"https://www.ftc.go.kr/\" target=\"_blank\" rel=\"nofollow\">▸ 공정거래위원회 — 소비자분쟁해결기준(중고자동차매매업)<\/a><\/div>\n\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">정리하면 <b>①침수 조회는 카히스토리와 자동차365 두 곳을 모두 돌리고 ②카히스토리는 보험 처리된 침수만 나오므로 '이력 없음'을 보증으로 읽지 말고 ③성능·상태점검기록부의 침수 칸과 점검일자를 서명 전에 확인하고 ④그래도 놓쳤다면 침수 미고지는 인도일부터 90일까지 계약 해제를 주장할 수 있습니다.<\/b> 30일이라는 숫자만 알고 포기하는 일이 없도록, 차를 인도받은 날 <b>계기판 주행거리를 사진으로 찍고 달력에 +30일과 +90일을 표시<\/b>해 두세요. 오늘 할 일은 하나입니다 — 보고 있는 매물의 <b>차량번호를 받아 지금 두 사이트에 넣어 보는 것<\/b>입니다. 5분이면 끝나고, 그 5분이 수백만 원을 가릅니다.<\/p><\/div>\n\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월<\/b> 기준입니다. 본문에 인용한 법 조문은 전부 <b style=\"display:inline;color:#33503a;margin:0\">국가법령정보센터에서 「자동차관리법」(시행 2026. 6. 16., 법률 제21817호)과 같은 법 시행규칙(시행 2026. 6. 3.)의 조문 본문을 직접 열어<\/b> 확인했습니다 — <b style=\"display:inline;color:#33503a;margin:0\">제58조 제1항(계약 체결 전 서면 고지·침수 사실 포함·점검일부터 120일 이내), 제58조의4(성능·상태점검자의 보증 책임과 보험 가입 의무), 제58조의6 제1항~제3항(30일·침수 90일 해제권과 동시이행), 제80조 제6호·제7호(침수 미고지·거짓고지 = 2년 이하 징역 또는 2천만 원 이하 벌금), 제81조 제25호의6·제25호의7(점검자 보증 불이행·보험 미가입 = 1년 이하 징역 또는 1천만 원 이하 벌금), 제26조의2(폐차 요청 의무·수출 및 수출자 판매 금지), 제84조 제2항(위 폐차·수출 위반 = 1천만 원 이하 과태료), 제59조 제4항(침수 미고지 실형·집행유예자의 종사원 제한)<\/b>, 그리고 시행규칙 <b style=\"display:inline;color:#33503a;margin:0\">제25조의2 제1항(\"전손 처리 결정된 사실을 안 날부터 30일\"), 제120조 제2항(기록부 발급은 발급일 기준 120일 이내 점검분), 제123조의8 제2항(보증은 인도일부터 30일 이상 또는 2천km 이상)<\/b>입니다. 보증기간을 '먼저 도달한 쪽에서 종료'로 운용하는 부분은 <b style=\"display:inline;color:#33503a;margin:0\">공정거래위원회 「소비자분쟁해결기준」<\/b>과 개별 약정에 따르므로 계약서 확인이 필요합니다. 무료 조회 서비스의 운영기관·입력값·<b style=\"display:inline;color:#33503a;margin:0\">조회 범위의 한계(보험 처리분에 한함)<\/b>는 <b style=\"display:inline;color:#33503a;margin:0\">보험개발원 카히스토리 「무료침수사고조회」 페이지 원문<\/b>을, 침수정보 조회와 통합이력조회의 구분·수수료 근거는 <b style=\"display:inline;color:#33503a;margin:0\">자동차365(국토교통부·한국교통안전공단) 페이지 원문<\/b>을 직접 열어 확인했습니다. 침수 사고 통계(2021~2025년 35,011건, 7~10월 95.7%, 전손 74.9%)는 <b style=\"display:inline;color:#33503a;margin:0\">손해보험협회가 12개 손해보험사 자동차보험 처리 내역을 집계한 수치<\/b>이며 <b style=\"display:inline;color:#33503a;margin:0\">보험으로 처리된 건에 한합니다<\/b>(실제 침수 차량 수는 이보다 많을 수 있습니다). <b style=\"display:inline;color:#33503a;margin:0\">2026년 올해 침수 차량 수는 공식 집계가 확인되지 않아 본문에 싣지 않았습니다.<\/b><br>출처: <a href=\"https://www.law.go.kr/법령/자동차관리법\">국가법령정보센터 — 자동차관리법<\/a>, <a href=\"https://www.law.go.kr/법령/자동차관리법시행규칙\">국가법령정보센터 — 자동차관리법 시행규칙<\/a>, <a href=\"https://www.carhistory.or.kr/search/carhistory/freeSearch.car\">보험개발원 카히스토리 — 무료침수사고조회<\/a>, <a href=\"https://www.car365.go.kr/\">자동차365 — 침수정보 조회<\/a>, <a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&amp;csmSeq=1000&amp;ccfNo=4&amp;cciNo=1&amp;cnpClsNo=1\">법제처 찾기쉬운 생활법령정보 — 중고차 매매 분쟁 해결하기<\/a>, <a href=\"https://www.ftc.go.kr/\">공정거래위원회 — 소비자분쟁해결기준<\/a>, <a href=\"https://www.consumer.go.kr/\">소비자24 — 피해구제<\/a>.<\/div>\n\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01310748819.html\">▸ 자동차 침수 대처 방법 자차보험 처리 침수 전손 폐차 환급 총정리 (2026 장마) — 내 차가 잠겼다면<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/2026_01601858813.html\">▸ 자동차보험 갱신 비교 방법 다이렉트 할인특약 총정리 (2026 인상)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_29.html\">▸ 자동차 정기검사 예약 방법 비용 과태료 주기 총정리 (사이버검사소)<\/a><\/div>\n\n<div id=\"ymyl-disclaimer\" style=\"margin-top:22px;font-size:13px;color:#666;line-height:1.6\">본 글은 정보 제공용이며 법률 자문이 아닙니다. 인용한 조문은 <b>2026년 8월 1일 기준 현행 법령<\/b>이며 개정될 수 있습니다. 계약 해제 가능 여부와 기간은 <b>거래 형태(매매업자 거래인지 개인 직거래인지)·고지 내용·인도일·증거 상태<\/b>에 따라 개별적으로 판단되며, 본문의 계산예시 날짜는 이해를 돕기 위한 가정입니다. 침수 조회 결과가 '이력 없음'이라도 침수차가 아님을 보증하지 않습니다(보험 처리분에 한해 조회됩니다). 실제 분쟁이 생겼다면 <b>1372 소비자상담센터(☎1372)<\/b> 또는 대한법률구조공단(☎132)에 본인 사안으로 상담하시고, 법령은 개정될 수 있으므로 신청·청구 전 <a href=\"https://www.law.go.kr/\">국가법령정보센터<\/a>에서 현행 조문을 확인하세요.<\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 법 조문·기간·벌칙 금액은 <b>국가법령정보센터에서 「자동차관리법」과 시행규칙의 조문 본문을 한 줄씩 직접 열어<\/b> 확인한 것이고, 조회 서비스의 범위와 한계는 <b>카히스토리·자동차365 페이지 원문<\/b>에서 가져왔습니다. 초안을 쓸 때 언론 기사 요약을 근거로 <b>폐차 불이행 과태료를 '300만 원 이하'로 적었다가, 조문 대조에서 현행 '1천만 원 이하'임을 확인해 바로잡았습니다.<\/b> 1차 출처로 확인하지 못한 수치(2026년 올해 침수 대수)는 <b>일부러 싣지 않고 그 사실을 본문에 밝혔습니다.<\/b> 법령은 개정될 수 있으니 실제 조회·청구 전 공식 페이지를 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ 쓰레드용 후킹 요약 (3줄)\n※ 🔴 네이버용 원고로 쓰지 말 것 (2026-07-30 확립 규칙). 네이버 OSMU 원고는 이 요약이 아니라\n   위 본문 HTML의 비교표·계산예시·체크리스트 12곳·공식 출처 URL을 실질적으로 다 옮겨야 한다\n   (그 글만 보고 바로 따라 할 수 있어야 함). 마크다운 파이프 테이블은 네이버에서 렌더링되지 않으므로\n   `⭐ 항목 : 값` 불릿이나 `⭐ 열이름 — A: 값1 / B: 값2` 한 줄 비교로 변환할 것.\n1. 여름 폭우 뒤 8~9월은 침수차가 중고차 시장에 흘러드는 시기입니다. 손해보험협회 집계로 2021~2025년 자동차보험 침수 처리는 **35,011건**, 그중 **95.7%가 7~10월**에 몰려 있고 **74.9%가 전손**이었습니다. 매물 차량번호를 받아 **카히스토리 무료침수사고조회**와 **자동차365 침수정보 조회**를 둘 다 돌리는 데 5분이면 됩니다.\n2. 그런데 **카히스토리로도 안 잡히는 침수차가 있습니다.** 보험개발원이 직접 안내하듯 이 조회는 **보험으로 처리된 침수만** 나옵니다. 할증이 싫어서, 자차 미가입이라서, 기록을 남기지 않으려고 자비로 수리한 차는 **'이력 없음'으로 깨끗하게 조회됩니다.** 조회는 거르는 도구지 보증서가 아닙니다.\n3. 이미 샀다면 **기간을 다시 세어 보세요. 침수 미고지 계약 해제는 30일이 아니라 90일입니다**(「자동차관리법」 제58조의6 제1항 제3호 — 제2호에 \"침수 사실은 제외한다\"가 박혀 있어 침수만 따로 갈립니다). 성능·상태점검 보증(인도일 30일 이상 또는 2천km 이상)이 끝났어도 **해제권은 별개로 살아 있습니다.** 게다가 침수 미고지·거짓고지는 민사로 끝나지 않습니다 — **2년 이하의 징역 또는 2천만 원 이하의 벌금**(제80조 제6호·제7호)입니다. 인도받은 날 계기판을 찍고 달력에 +30일·+90일을 표시해 두세요.\n"},{"code":"F1-11","title":"유럽 여행 EES 지문 등록 방법 여권 도장 폐지 90/180일 계산 총정리 (2026년 4월 전면 시행 29개국 · ETIAS 4분기 예정)","lane":"etc","thumb":"148_eu_ees.png","draft":"유럽EES입국등록_글_HTML.txt","facts":"EES 전면시행 2026-04-10(29개국, 단계도입 2025-10-12~2026-04-09) | 무비자 방문자=지문4개+얼굴, 단기비자=얼굴만, 만12세 미만 지문 면제 | 여권 도장 폐지 | 90/180일 롤링(29개국 합산, 입국일·출국일 모두 산입) | 잔여일 조회도구는 2026-04-10 이전 체류 미반영, 2026-10-06까지 일부 비자 'OK' 부정확 | Travel to Europe 앱=스웨덴·포르투갈만(72시간 전, 전자여권 필수) | 아일랜드·키프로스는 EES 미적용(도장 유지) | 90일 초과 연장=양자협정, 90일 마지막 근무일까지 신청(Reg 2017/2226 제60조) | 초과체류=SIS 등재·입국금지 원칙적 5년 이내 | 보관 3년/3년1일/5년 | ETIAS 2026년 4분기 예정(날짜 미확정, 유예 12개월 이상) | 출처=0404.go.kr 안전공지·travel-europe.europa.eu","added":"2026-08-01","thumb_data":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCACIAQQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD2qiiiqJCiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKAIbqTy4uOp4FZ9Wr4/Oo9qq1tBaDCiiiqAKKKKAHrI6jCsQKKZRRZ 편')\n■ 트렌드/시즌: 2026-04-10 EU 29개국 전면 시행된 신설 제도 · 가을 유럽 여행 예약 성수기 · 여권 도장이 사라져 잔여 체류일을 스스로 못 세게 된 첫 해 · ETIAS가 2026년 4분기 시행 예정이라 지금이 '미리 알아둘 시점' · 행동요구형(공항 절차·사전등록 앱·잔여일 조회) · dupcheck 🟢 신규\n■ 카테고리: 여행 (#7C5CE0)\n■ 썸네일: thumbs/148_eu_ees.png (다크) · thumbs_naver/148_eu_ees.png (라이트)\n■ 기존글과의 구분: F1-07은 미국 ESTA(사전 여행허가 신청), F1-09는 중국 무비자, F1-10은 일본 비지트재팬웹. 이 글은 **유럽 29개국의 국경 등록 시스템(EES)** 이 대상으로, '신청하는 제도'가 아니라 **공항에서 강제로 등록되는 절차**이며 여권 도장 폐지에 따른 **체류일 계산 문제**가 핵심 차이다. F1-06 인천공항 스마트패스는 '출국 편의'라 방향이 반대.\n■ 원본가치(V0):\n   ① 계산예시 — 90/180일 롤링 방식을 **실제 날짜로 3차 여행까지** 계산해 보여준다(2026-09-10 → 11-20 → 2027-03-24). \"언제부터 다시 90일을 쓸 수 있나\"를 날짜로 답한 자료가 거의 없다.\n   ② 함정 — 여권 도장이 사라져 **스스로 셀 근거가 없어졌는데**, EU 공식 조회도구는 **2026-04-10 이전 체류를 반영하지 않고**, **2026-10-06까지는 특정 비자 소지자에게 'OK' 결과가 부정확할 수 있다**고 공식 페이지가 명시한다.\n   ③ 판단형 비교 — 창구 / 셀프서비스 키오스크 / 사전등록 앱 3가지를 조건·소요·필요조건으로 비교. 앱은 **현재 스웨덴·포르투갈 2개국뿐**이라는 실측이 핵심(“앱으로 미리 하면 편하다”는 통념과 다름).\n   ④ 거부·탈락 사유 — 생체정보 제공을 거부하면 **입국 거부**, 90일 초과 적발 시 SIS 등재 + **원칙적으로 5년을 넘지 않는 입국금지**.\n   ⑤ 실측 발견 — 아일랜드·키프로스는 EU 회원국이지만 **EES 미적용이라 여권 도장이 계속 찍힌다**. 90일 한도를 **넘겨야 할 때 쓰는 양자협정 연장(규정 제60조)** 은 신청 시한(90일 마지막 근무일)과 출국 국경까지 조건이 붙는다.\n■ 검색설명(발행 후 편집화면에서 사람이 붙일 것):\n   2026년 4월 10일부터 유럽 29개국 입국 시 지문·얼굴을 등록합니다. 여권 도장이 사라진 뒤의 90/180일 계산법, 사전등록 앱이 되는 나라, 초과 체류 시 입국금지까지 공식 자료로 정리했습니다.\n\n[붙여넣는 법] Blogger 글쓰기 → 연필▾ → HTML 보기 → 아래 전체 붙여넣기 → 작성 보기 → 제목 입력 → 라벨(여행) → 발행\n----------------------------------------------------------------\n▼ 본문 HTML\n<div style=\"text-align:center;margin:0 0 18px\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCACIAQQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqK  solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#f4f1fd;border:1px solid #ded4f7;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#6544cc;margin-bottom:8px}\n.lsg .rel a{display:block;color:#5a3cc0;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#9a92aa;text-decoration:none;margin:2px 0 6px}\n\n.lsg .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 16px}\n.lsg .tw table{margin:0}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>올가을 유럽에 가실 계획이라면, <b>공항 입국심사장에서 예전과 다른 일<\/b>이 벌어집니다. 심사관이 여권에 <b>도장을 찍어 주지 않습니다.<\/b> 대신 <b>지문을 스캔하고 얼굴 사진을 찍습니다.<\/b> 유럽연합이 도입한 <b>출입국시스템(EES)<\/b> 때문인데, 단계적으로 시행되다가 <b>2026년 4월 10일부터 29개국 모든 국경검문소에서 전면 가동<\/b>됐습니다. 문제는 여권 도장이 사라지면서 <b>\"내가 유럽에 며칠 있었는지\"를 스스로 확인할 근거가 없어졌다<\/b>는 데 있습니다. 유럽은 <b>180일 중 90일<\/b>이라는 한도를 <b>29개국 전체를 합쳐서<\/b> 계산하는데, 이 계산이 <b>날짜가 밀려가는 방식<\/b>이라 헷갈리기로 유명합니다. 이 글에서는 <b>공항에서 실제로 무슨 일이 벌어지는지, 90/180일을 실제 날짜로 어떻게 세는지, 사전등록 앱이 지금 어느 나라에서 되는지, 한도를 넘기면 어떻게 되는지<\/b>까지 EU 공식 페이지와 외교부 안전공지를 근거로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. EES가 뭔가 — 1분 정리<\/a><a href=\"#sec2\">2. 대상 29개국과 면제 대상 — 내가 해당되나<\/a><a href=\"#sec3\">3. 공항에서 실제로 벌어지는 일<\/a><a href=\"#sec4\">4. 계산예시 — 90/180일은 이렇게 센다<\/a><a href=\"#sec5\">5. 여권 도장이 없어져서 생긴 함정 5가지<\/a><a href=\"#sec6\">6. 창구 · 키오스크 · 앱 — 무엇이 빠른가<\/a><a href=\"#sec7\">7. 90일을 넘겨야 한다면 — 양자협정 연장<\/a><a href=\"#sec8\">8. 한도를 넘기면 어떻게 되나<\/a><a href=\"#sec9\">9. 내 지문·사진은 얼마나 보관되나<\/a><a href=\"#sec10\">10. ETIAS는 언제부터인가<\/a><a href=\"#sec11\">11. 자주 묻는 질문<\/a><a href=\"#sec12\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec4\">👉 90/180일 계산부터 보기<\/a>\n\n<h2 id=\"sec1\">1. EES가 뭔가 — 1분 정리<\/h2>\n<p><b>EES(Entry/Exit System, 출입국시스템)<\/b> 는 유럽 29개국이 <b>비(非)EU 국적 단기 방문자의 입국·출국을 전산으로 자동 기록<\/b>하는 시스템입니다. 우리가 신청하거나 수수료를 내는 제도가 <b>아니고<\/b>, 국경을 통과할 때 <b>자동으로 등록되는 절차<\/b>입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>내용<\/th><\/tr>\n<tr><td>정식 명칭<\/td><td>Entry/Exit System (EES) · 출입국시스템<\/td><\/tr>\n<tr><td>운영<\/td><td>EU 집행위원회 이민내무총국 · eu-LISA<\/td><\/tr>\n<tr><td>도입 경과<\/td><td><b>2025년 10월 12일<\/b> 단계적 시작 → <b>2026년 4월 9일<\/b> 단계 도입 종료<\/td><\/tr>\n<tr><td>전면 시행<\/td><td><b>2026년 4월 10일부터<\/b> 29개국 <b>모든<\/b> 외부 국경검문소<\/td><\/tr>\n<tr><td>대상<\/td><td>비EU 국적 <b>단기 체류자<\/b> — <b>무비자 방문자(우리 국민 포함)<\/b> 또는 단기비자 소지자<\/td><\/tr>\n<tr><td>등록 정보<\/td><td>여권 기재정보 · 입출국 날짜와 장소 · <b>얼굴 이미지와 지문<\/b> · 입국 거부 이력<\/td><\/tr>\n<tr><td>여권 도장<\/td><td><b>찍지 않습니다<\/b> (전자 기록으로 대체)<\/td><\/tr>\n<tr><td>비용 · 신청<\/td><td><b>없음<\/b> — 국경에서 자동 등록<\/td><\/tr>\n<tr><td>법적 근거<\/td><td>Regulation (EU) 2017/2226, Regulation (EU) 2025/1534<\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 'ETIAS'와 헷갈리지 마세요 — 다른 제도입니다<\/b><p style=\"margin:8px 0 0\"><b>EES<\/b> 는 <b>공항에서 등록되는 것<\/b>이고, <b>ETIAS<\/b> 는 <b>출발 전에 온라인으로 신청하는 여행허가<\/b>(미국 ESTA와 같은 성격)입니다. <b>ETIAS는 2026년 8월 현재 아직 시행되지 않았고<\/b>, 신청도 받지 않습니다. 자세한 내용은 10장에서 다룹니다. \"유럽 갈 때 뭘 신청해야 한다더라\"는 말을 들으셨다면 <b>지금 시점에서 신청할 것은 없습니다.<\/b><\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 대상 29개국과 면제 대상 — 내가 해당되나<\/h2>\n<h3>EES를 쓰는 29개국<\/h3>\n<p>오스트리아 · 벨기에 · 불가리아 · 크로아티아 · 체코 · 덴마크 · 에스토니아 · 핀란드 · 프랑스 · 독일 · 그리스 · 헝가리 · 아이슬란드 · 이탈리아 · 라트비아 · 리히텐슈타인 · 리투아니아 · 룩셈부르크 · 몰타 · 네덜란드 · 노르웨이 · 폴란드 · 포르투갈 · 루마니아 · 슬로바키아 · 슬로베니아 · 스페인 · 스웨덴 · 스위스<\/p>\n<div class=\"tip\"><b>💡 EU 회원국인데 EES를 안 쓰는 나라가 있습니다 — 아일랜드와 키프로스<\/b><p style=\"margin:8px 0 0\"><b>아일랜드와 키프로스<\/b>는 EU 회원국이지만 <b>EES를 사용하지 않아 여권에 도장을 계속 수기로 찍습니다.<\/b> 더블린을 거쳐 파리로 들어가는 일정이라면, <b>아일랜드에서는 도장 · 프랑스에서는 지문 등록<\/b>으로 절차가 달라집니다. 영국은 EU가 아니어서 애초에 별개이며, <b>영국행은 영국 자체 입국 규정<\/b>을 따로 확인하셔야 합니다.<\/p><\/div>\n<h3>EES 등록이 면제되는 사람<\/h3>\n<ul>\n<li><b>EES 사용 29개국 국민<\/b>, 그리고 <b>아일랜드·키프로스 국민<\/b><\/li>\n<li>EU 국적자(또는 아이슬란드·리히텐슈타인·노르웨이·스위스 국적자)의 <b>직계가족으로 거주카드를 소지<\/b>한 비EU 국적자<\/li>\n<li><b>거주허가증 또는 장기체류 비자 소지자<\/b> — 유학·주재원 등으로 이미 체류 자격이 있는 경우<\/li>\n<li>기업 내 전근, 연구·학업·연수·자원봉사·교환학생·교육 프로젝트·오페어 목적의 방문자<\/li>\n<li>안도라 · 모나코 · 산마리노 국민, 바티칸(교황청) 발행 여권 소지자<\/li>\n<li>국가원수 · 신임장을 받은 외교관 · 국경통근자 등 국경심사 특례 대상<\/li>\n<li>지역 국경통행증 소지자, 국제 여객·화물 열차 승무원 등<\/li>\n<\/ul>\n<p>즉 <b>관광·출장·친지 방문으로 90일 이내 다녀오는 대부분의 우리 국민은 등록 대상<\/b>입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 공항에서 실제로 벌어지는 일<\/h2>\n<h3>EES 시행 후 처음 국경을 통과할 때<\/h3>\n<ul>\n<li>심사관이 <b>얼굴 사진을 촬영<\/b>하고 <b>지문을 스캔<\/b>해 디지털 파일로 저장합니다.<\/li>\n<li><b>여권에는 도장을 찍지 않습니다.<\/b> 전자여권이든 아니든 마찬가지입니다.<\/li>\n<li>무비자로 가는 우리 국민은 <b>지문 4개 + 얼굴 이미지<\/b>가 저장됩니다.<\/li>\n<li>단기비자를 받아 가는 경우에는 <b>얼굴 이미지만<\/b> 저장됩니다(지문은 비자 신청 때 이미 비자정보시스템에 등록돼 있기 때문).<\/li>\n<li><b>만 12세 미만 아동은 지문을 채취하지 않습니다.<\/b><\/li>\n<\/ul>\n<h3>두 번째 이후 통과할 때<\/h3>\n<p>이미 등록돼 있으므로 심사관은 <b>지문과 사진을 대조·확인만<\/b> 합니다. 그래서 <b>첫 입국보다 빨라집니다.<\/b> 다만 드물게 <b>다시 수집해야 하는 경우<\/b>도 있습니다.<\/p>\n<div class=\"warn\"><b>⚠️ 지문·사진 촬영을 거부하면 입국이 거부됩니다<\/b><p style=\"margin:8px 0 0\">EU 공식 안내는 <b>생체정보 제공을 거부하면 EES 사용국 영토로의 입국이 거부된다<\/b>고 명시하고 있습니다. 선택이 아니라 <b>입국 조건<\/b>입니다.<\/p><\/div>\n<div class=\"tip\"><b>💡 외교부가 권고한 현실적인 대비 — 환승 시간을 넉넉히<\/b><p style=\"margin:8px 0 0\">외교부 해외안전여행 안전공지는 <b>\"시행 초기에는 입국 시 오랜 시간 대기하거나 혼잡이 예상되므로, 환승편 이용 시 여행 시간을 충분히 두라\"<\/b>고 권고했습니다. 특히 <b>유럽 내에서 환승해 다른 유럽 국가로 가는 일정<\/b>이라면, 첫 도착지에서 지문 등록에 걸리는 시간을 감안해 <b>환승 대기시간을 여유 있게<\/b> 잡는 편이 안전합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 계산예시 — 90/180일은 이렇게 센다<\/h2>\n<p>EES가 관리하는 <b>단기 체류 한도<\/b>는 <b>\"어떤 180일 기간 안에서든 최대 90일\"<\/b> 입니다. 세 가지를 먼저 기억하셔야 합니다.<\/p>\n<ul>\n<li><b>29개국을 하나로 합쳐서<\/b> 셉니다. 프랑스 10일 + 이탈리아 10일 = <b>20일<\/b>이지 각각 90일이 아닙니다.<\/li>\n<li><b>입국일과 출국일 모두 하루로<\/b> 셉니다. 9월 10일 도착, 9월 24일 출발이면 <b>15일<\/b>입니다.<\/li>\n<li>180일 기간은 <b>고정된 달력이 아니라 날짜가 계속 밀려가는 창(窓)<\/b> 입니다. 확인하려는 <b>그날을 포함해 거슬러 180일<\/b>을 봅니다.<\/li>\n<\/ul>\n<h3>실제 날짜로 3차 여행까지 계산해 보기<\/h3>\n<p>아래는 <b>가정한 일정<\/b>으로, 규칙이 어떻게 적용되는지 보여 주는 <b>예시<\/b>입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>여행<\/th><th>기간<\/th><th>체류일<\/th><\/tr>\n<tr><td><b>1차<\/b><\/td><td>2026년 9월 10일 ~ 9월 24일<\/td><td><b>15일<\/b><\/td><\/tr>\n<tr><td><b>2차<\/b><\/td><td>2026년 11월 20일 ~ 12월 4일<\/td><td><b>15일<\/b><\/td><\/tr>\n<tr><td><b>3차<\/b><\/td><td>2027년 3월 24일 이후 (검토 중)<\/td><td>?<\/td><\/tr>\n<\/table><\/div>\n<p><b>① 2차 여행 마지막 날(2026년 12월 4일) 기준<\/b><br>\n그날을 포함해 거슬러 180일을 보면 <b>2026년 6월 8일 ~ 12월 4일<\/b> 구간입니다. 이 안에 1차 15일과 2차 15일이 모두 들어가므로 <b>사용 30일 · 잔여 60일<\/b>입니다. 아직 여유가 있습니다.<\/p>\n<p><b>② 그렇다면 1차 여행 15일은 언제 '창'에서 빠지나<\/b><br>\n1차 여행의 마지막 날은 <b>9월 24일<\/b>입니다. 이 날짜가 180일 창에서 벗어나려면 <b>9월 24일 + 180일 = 2027년 3월 23일<\/b>을 지나야 합니다. 즉 <b>2027년 3월 24일에 입국<\/b>하면, 그날 기준 창은 <b>2026년 9월 26일 ~ 2027년 3월 24일<\/b>이 되어 <b>1차 여행 전체가 창 밖으로 나갑니다.<\/b><\/p>\n<div class=\"tw\"><table>\n<tr><th>입국일<\/th><th>거슬러 본 180일 창<\/th><th>창 안에 남은 체류일<\/th><th>쓸 수 있는 일수<\/th><\/tr>\n<tr><td>2026-12-04<\/td><td>2026-06-08 ~ 12-04<\/td><td>1차 15일 + 2차 15일 = <b>30일<\/b><\/td><td><b>60일<\/b><\/td><\/tr>\n<tr><td>2027-03-24<\/td><td>2026-09-26 ~ 2027-03-24<\/td><td>2차 15일만 = <b>15일<\/b><\/td><td><b>75일<\/b><\/td><\/tr>\n<tr><td>2027-06-03<\/td><td>2026-12-06 ~ 2027-06-03<\/td><td><b>0일<\/b><\/td><td><b>90일 전부<\/b><\/td><\/tr>\n<\/table><\/div>\n<p>2차 여행 마지막 날이 2026년 12월 4일이므로, 여기에 180일을 더한 <b>2027년 6월 2일<\/b>을 지나면 2차 여행분도 창에서 빠집니다. 그래서 <b>2027년 6월 3일부터는 다시 90일 전부를 쓸 수 있습니다.<\/b><\/p>\n<div class=\"tip\"><b>💡 핵심은 \"90일을 다 쓰면 90일을 기다린다\"가 아닙니다<\/b><p style=\"margin:8px 0 0\">많이 하는 오해가 <b>\"90일 쓰고 90일 쉬면 된다\"<\/b> 입니다. 정확히는 <b>각 체류일이 그날로부터 180일 뒤에 하나씩 되살아나는<\/b> 방식입니다. 그래서 <b>짧게 여러 번 다니는 분<\/b>은 예상보다 빨리 한도에 닿을 수 있고, 반대로 <b>한 번에 길게 다녀온 분<\/b>은 되살아나는 시점이 뭉텅이로 옵니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 여권 도장이 없어져서 생긴 함정 5가지<\/h2>\n<p>예전에는 여권을 넘겨 보며 도장 날짜로 직접 셀 수 있었습니다. 그 근거가 사라졌습니다.<\/p>\n<ul>\n<li><b>① 스스로 셀 근거가 없다<\/b> — 도장이 없으니 항공권·숙박 기록을 뒤져야 합니다. 대신 EU가 <b>온라인 잔여 체류일 조회 도구<\/b>를 운영합니다(12장 링크).<\/li>\n<li><b>② 조회 도구가 2026년 4월 10일 이전 체류를 반영하지 않는다<\/b> — EU 공식 페이지는 <b>\"2026년 4월 10일 전에 시작된 쉥겐 지역 체류는, 그 방문이 그 전에 끝났든 이후까지 이어졌든 잔여 체류일에 반영되지 않는다\"<\/b>고 명시합니다. <b>2026년 초에 유럽에 오래 계셨던 분은 도구 결과가 실제보다 후하게 나올 수 있습니다.<\/b><\/li>\n<li><b>③ 2026년 10월 6일까지는 일부 비자 소지자에게 결과가 부정확할 수 있다<\/b> — 단수 또는 2회 입국 비자를 가진 사람이 <b>2025년 10월 12일 ~ 2026년 4월 9일<\/b> 사이에 그 입국 횟수를 이미 썼다면, 그 기록이 EES에 남아 있지 않아 <b>'OK' 결과를 믿기 어렵다<\/b>고 공식 페이지가 밝히고 있습니다.<\/li>\n<li><b>④ 비전자여권은 셀프서비스 키오스크를 못 쓴다<\/b> — 입국 자체는 가능하지만 <b>자동화 통로는 전자여권(칩이 든 여권) 소지자만<\/b> 이용할 수 있습니다.<\/li>\n<li><b>⑤ 아일랜드·키프로스 체류는 이 90일에 포함되지 않는다<\/b> — 두 나라는 EES 사용국이 아니므로 <b>별도<\/b>입니다. 다만 <b>그 나라 자체 입국 규정<\/b>은 따로 적용됩니다.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ 잔여 일수가 애매하면 그냥 물어보는 게 가장 확실합니다<\/b><p style=\"margin:8px 0 0\">EU 공식 안내는 <b>국경의 심사관에게 잔여 체류 가능 일수를 직접 물어볼 수 있다<\/b>고 안내합니다. 또한 조회 결과에 의문이 있으면 <b>마지막으로 입국·출국한 회원국의 관할 당국<\/b>에, 최근 방문 이력이 없다면 <b>방문 예정 국가의 당국<\/b>에 문의하라고 안내합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 창구 · 키오스크 · 앱 — 무엇이 빠른가<\/h2>\n<p>세 가지 경로가 있지만 <b>지금 실제로 쓸 수 있는 범위가 서로 다릅니다.<\/b><\/p>\n<div class=\"tw\"><table>\n<tr><th>방식<\/th><th>필요 조건<\/th><th>어디서 되나<\/th><th>심사관 대면<\/th><\/tr>\n<tr><td><b>심사관 창구<\/b><\/td><td>없음 (비전자여권도 가능)<\/td><td><b>모든 국경검문소<\/b><\/td><td>대면<\/td><\/tr>\n<tr><td><b>셀프서비스 키오스크<\/b><\/td><td><b>전자여권 필수<\/b><\/td><td>설치된 검문소에 한함<\/td><td>첫 등록 때는 대면 · 이후 조건 충족 시 생략 가능<\/td><\/tr>\n<tr><td><b>Travel to Europe 앱<\/b><\/td><td><b>전자여권 필수<\/b> · 출입국 <b>72시간 전<\/b>부터<\/td><td><b>스웨덴 · 포르투갈만<\/b><\/td><td>대면 (앱은 심사를 대체하지 않음)<\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ \"앱으로 미리 등록하면 편하다\"는 아직 대부분의 나라에 해당되지 않습니다<\/b><p style=\"margin:8px 0 0\">EU 공식 페이지 기준으로 <b>Travel to Europe 앱<\/b>이 실제로 작동하는 곳은 <b>스웨덴<\/b>(여권 정보 · 얼굴 사진 · 입국 설문 전부 지원)과 <b>포르투갈<\/b>(입국 설문만 지원) <b>두 나라뿐<\/b>입니다. 나머지 국가는 <b>추후 제공될 수 있다<\/b>고만 안내돼 있습니다. <b>파리·로마·프랑크푸르트로 들어가면서 앱만 믿고 계시면 안 됩니다.<\/b> 앱 사용은 <b>선택<\/b>이고, 사용하더라도 <b>국경심사를 대체하지는 않습니다.<\/b><\/p><\/div>\n<h3>앱을 쓰는 경우 순서<\/h3>\n<ol>\n<li>App Store 또는 Google Play에서 앱 설치<\/li>\n<li>출발 <b>72시간 이내<\/b>에 도착·출발 국가를 골라 새 여정 생성<\/li>\n<li>국경검문소와 예상 도착 시각 선택<\/li>\n<li>여권 인적사항면과 <b>칩<\/b>을 스캔<\/li>\n<li>본인 확인용 <b>셀피<\/b> 촬영<\/li>\n<li>여행 계획에 관한 몇 가지 질문에 응답 (동행자 추가 가능)<\/li>\n<li>여정 제출 → 승인 확인 → 현장에서 국경심사관 안내에 따름<\/li>\n<\/ol>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 90일을 넘겨야 한다면 — 양자협정 연장<\/h2>\n<p>EU 공식 FAQ는 <b>일정 조건에서 한 나라에 한해 90일을 넘겨 머무를 수 있다<\/b>고 안내합니다. 근거는 <b>Regulation (EU) 2017/2226 제60조<\/b>입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>조건<\/th><th>내용<\/th><\/tr>\n<tr><td>전제<\/td><td>본인 <b>국적국과 그 유럽 국가 사이에 양자협정<\/b>이 체결돼 있을 것<\/td><\/tr>\n<tr><td>신청 시기<\/td><td><b>입국할 때 또는 체류 중<\/b>, 늦어도 <b>90일 체류의 마지막 근무일까지<\/b><\/td><\/tr>\n<tr><td>적용 범위<\/td><td><b>그 나라 영토에서만<\/b> 유효<\/td><\/tr>\n<tr><td>출국<\/td><td><b>같은 나라의 외부 국경으로 출국<\/b>해야 함<\/td><\/tr>\n<tr><td>놓쳤을 때<\/td><td>출국 시점에도 신청은 가능하나 <b>절차가 복잡<\/b>하고 <b>체류를 입증할 신빙성 있는 자료<\/b>가 필요할 수 있음<\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 이건 \"한국인은 무조건 된다\"는 뜻이 아닙니다<\/b><p style=\"margin:8px 0 0\">양자협정의 <b>존재 여부와 적용 방식은 나라마다 다르고<\/b>, EES 도입으로 <b>실무 처리도 달라질 수 있습니다.<\/b> 장기 체류가 필요하시면 <b>반드시 해당 국가의 주한 대사관 또는 현지 이민 당국에 사전 확인<\/b>하시고, 가능하면 <b>미리<\/b> 신청하세요. 출국장에서 뒤늦게 꺼낼 카드가 아닙니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 한도를 넘기면 어떻게 되나<\/h2>\n<ul>\n<li><b>초과 체류가 확인되면<\/b> 「귀환지침(Return Directive 2008/115)」에 따른 귀환 절차가 적용됩니다. 원칙적으로 <b>자진 출국<\/b>이 우선 고려됩니다.<\/li>\n<li><b>입국금지가 함께 부과될 수 있습니다.<\/b> 자진 출국 기간이 부여되지 않았거나 출국 의무를 이행하지 않은 경우에는 <b>입국금지가 반드시 따라붙고<\/b>, 그 밖의 경우에도 부과될 수 있습니다.<\/li>\n<li>귀환 결정과 입국금지는 <b>솅겐정보시스템(SIS)에 등재<\/b>됩니다. 입국금지 기간은 사안별로 정해지되 <b>원칙적으로 5년을 넘지 않습니다.<\/b><\/li>\n<li>이미 180일 중 90일을 다 쓴 상태에서 <b>다시 입국을 시도하면 국경에서 입국이 거부<\/b>되고, 그 <b>거부 이력도 EES에 기록<\/b>됩니다.<\/li>\n<\/ul>\n<p>예전에는 도장이 흐릿하거나 누락돼 <b>넘어가는 경우<\/b>가 있었지만, EES는 <b>입국과 출국을 전산으로 자동 대조<\/b>하기 때문에 <b>초과 체류가 시스템에서 곧바로 드러납니다.<\/b> \"며칠쯤은 괜찮겠지\"가 통하지 않는 구조로 바뀐 것입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 내 지문·사진은 얼마나 보관되나<\/h2>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>보관 기간<\/th><th>기산점<\/th><\/tr>\n<tr><td>입국·출국·입국거부 <b>기록<\/b><\/td><td><b>3년<\/b><\/td><td>기록이 생성된 날<\/td><\/tr>\n<tr><td>개인정보가 담긴 <b>개인 파일<\/b><\/td><td><b>3년 1일<\/b><\/td><td><b>마지막 출국일<\/b> 또는 입국거부일<\/td><\/tr>\n<tr><td>출국 기록이 <b>없는<\/b> 경우<\/td><td><b>5년<\/b><\/td><td>허가된 체류 기간의 만료일<\/td><\/tr>\n<\/table><\/div>\n<p>외교부 해외안전여행 안전공지는 이를 <b>\"수집 목적에 따라 1년에서 5년까지 보관된 후 자동 삭제\"<\/b> 로 요약해 안내하고 있습니다.<\/p>\n<h3>누가 볼 수 있나<\/h3>\n<ul>\n<li>EES 사용국의 <b>국경·비자·이민 당국<\/b> — 신원 확인과 입국·체류 허용 여부 판단<\/li>\n<li>EES 사용국의 <b>사법·치안 당국과 유로폴<\/b> — 법 집행 목적<\/li>\n<li>엄격한 조건 아래 <b>제3국 또는 국제기구<\/b>(UN 기구, 국제이주기구, 국제적십자위원회)로 이전될 수 있음<\/li>\n<li><b>운송업체(항공사 등)<\/b> 는 단기비자 소지자의 <b>입국 허용 횟수 사용 여부만<\/b> 조회할 수 있고 그 밖의 개인정보에는 접근할 수 없음<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">10. ETIAS는 언제부터인가<\/h2>\n<p><b>ETIAS(유럽여행정보인증제도)<\/b> 는 무비자로 유럽에 가는 사람이 <b>출발 전에 온라인으로 받아야 하는 여행허가<\/b>입니다. 미국 ESTA, 캐나다 eTA, 영국 ETA와 성격이 같습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>내용<\/th><\/tr>\n<tr><td>현재 상태<\/td><td><b>시행 전<\/b> — 신청을 받지 않습니다<\/td><\/tr>\n<tr><td>시행 예정<\/td><td><b>2026년 4분기<\/b>로 예고 (정확한 날짜는 EU 집행위원회가 추후 발표)<\/td><\/tr>\n<tr><td>대상<\/td><td>무비자 59개 국가·지역 국민 (<b>우리 국민 포함<\/b>)<\/td><\/tr>\n<tr><td>적용 국가<\/td><td><b>30개국<\/b> — EES 29개국 + 키프로스<\/td><\/tr>\n<tr><td>수수료<\/td><td>공식 페이지 표기 <b>20유로<\/b> (신청 절차: 신청서 작성 → 수수료 결제 → 허가 발급)<\/td><\/tr>\n<tr><td>시행 후<\/td><td><b>최소 12개월<\/b>의 전환기·유예기간이 이어질 예정<\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 지금 \"ETIAS 신청 대행\"을 권하는 곳이 있다면 의심하세요<\/b><p style=\"margin:8px 0 0\">EU 공식 페이지는 <b>\"ETIAS는 현재 운영되고 있지 않으며 어떤 신청도 접수되지 않는다\"<\/b>고 못박고 있습니다. 시행 날짜도 <b>아직 확정 발표되지 않았습니다.<\/b> 개시 시점은 <b>수개월 전에 공식 안내<\/b>될 예정이므로, <b>공식 페이지(travel-europe.europa.eu)에서 직접 확인<\/b>하시는 것이 가장 안전합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec11\">11. 자주 묻는 질문<\/h2>\n<h3>Q. 전자여권이 없으면 유럽에 못 가나요?<\/h3>\n<p><b>갈 수 있습니다.<\/b> EU 공식 안내는 <b>전자여권과 비전자여권 모두<\/b> 유효하고 다른 입국 요건을 충족하면 국경 통과가 가능하다고 밝히고 있습니다. 전자여권은 <b>셀프서비스 키오스크를 쓰고 싶을 때만<\/b> 필요합니다. 참고로 우리나라는 오래전부터 전자여권을 발급하고 있어 <b>대부분 해당되지 않는 문제<\/b>입니다.<\/p>\n<h3>Q. 지문 등록을 한 번 하면 다음에는 안 해도 되나요?<\/h3>\n<p>네, 원칙적으로 <b>확인만<\/b> 합니다. 다만 <b>드물게 다시 수집해야 하는 경우<\/b>가 있고, 심사관은 필요하다고 판단하면 <b>얼굴 이미지를 다시 촬영하는 등의 조치<\/b>를 언제든 할 수 있습니다.<\/p>\n<h3>Q. 아이도 지문을 찍나요?<\/h3>\n<p><b>만 12세 미만은 지문을 채취하지 않습니다.<\/b> EES 등록 대상이더라도 마찬가지입니다. 얼굴 이미지는 별도 안내에 따릅니다.<\/p>\n<h3>Q. 유럽 안에서 나라를 옮길 때마다 등록하나요?<\/h3>\n<p>EES는 <b>외부 국경<\/b>(29개국 밖에서 들어오고 나가는 지점)에서 작동합니다. 29개국 안에서 <b>국경 검문 없이<\/b> 이동하는 구간은 그때마다 등록되지 않습니다. 다만 <b>체류일은 29개국 전체를 합산<\/b>한다는 점은 그대로입니다.<\/p>\n<h3>Q. 여권에 도장이 없으면 나중에 체류 증명은 어떻게 하나요?<\/h3>\n<p>기록은 <b>EES에 전자적으로 남습니다.<\/b> 개인이 확인할 때는 <b>잔여 체류일 조회 도구<\/b>를 쓰거나 <b>국경 심사관에게 문의<\/b>할 수 있습니다. 다만 4장에서 본 것처럼 <b>2026년 4월 10일 이전 체류는 도구에 반영되지 않으므로<\/b>, 그 시기의 여행은 <b>항공권·숙박 예약 내역을 따로 보관<\/b>해 두시는 편이 안전합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec12\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내<\/b>\n<a href=\"https://0404.go.kr/bbs/safetyNtc/ATC0000000048106/detail\" rel=\"nofollow\" target=\"_blank\">▸ 외교부 해외안전여행 — 새로운 EU 출입국시스템(EES) 도입 안내(2025년 최초 시행 안전공지)<\/a>\n<a href=\"https://travel-europe.europa.eu/ees/what-is-the-ees\" rel=\"nofollow\" target=\"_blank\">▸ EU 공식 — EES란 무엇인가 (대상 29개국 목록)<\/a>\n<a href=\"https://travel-europe.europa.eu/ees/how-will-ees-work-what-new-during-border-checks\" rel=\"nofollow\" target=\"_blank\">▸ EU 공식 — 국경에서 실제로 어떻게 진행되나<\/a>\n<a href=\"https://travel-europe.europa.eu/ees/check-how-long-you-can-stay\" rel=\"nofollow\" target=\"_blank\">▸ EU 공식 — 잔여 체류 가능 일수 조회 도구<\/a>\n<a href=\"https://travel-europe.europa.eu/ees/to-whom-does-ees-not-apply\" rel=\"nofollow\" target=\"_blank\">▸ EU 공식 — EES가 적용되지 않는 대상<\/a>\n<a href=\"https://travel-europe.europa.eu/ees/Travel-to-Europe-mobile-app\" rel=\"nofollow\" target=\"_blank\">▸ EU 공식 — Travel to Europe 앱 (지원 국가·사용법)<\/a>\n<a href=\"https://travel-europe.europa.eu/ees/data-held-by-ees\" rel=\"nofollow\" target=\"_blank\">▸ EU 공식 — 수집 정보와 보관 기간<\/a>\n<a href=\"https://travel-europe.europa.eu/etias\" rel=\"nofollow\" target=\"_blank\">▸ EU 공식 — ETIAS 안내(시행 시기 확인)<\/a>\n<p style=\"margin:10px 0 0;font-size:14px;color:#1b4f86\">▸ 외교부 <b>영사안전콜센터 02-3210-0404<\/b> (해외에서 +82-2-3210-0404)<\/p>\n<\/div>\n\n<div class=\"end\"><b>✅ 마무리 — 세 줄로 정리하면<\/b><p style=\"margin:8px 0 0\"><b>①<\/b> 2026년 4월 10일부터 유럽 <b>29개국 모든 국경<\/b>에서 <b>지문과 얼굴이 등록<\/b>되고 <b>여권 도장은 찍히지 않습니다.<\/b> 신청할 것도, 낼 돈도 없습니다 — 공항에서 자동으로 진행됩니다. <b>②<\/b> 대신 <b>내가 며칠 썼는지를 스스로 셀 근거가 사라졌습니다.<\/b> 180일 중 90일을 <b>29개국 합산·날짜가 밀려가는 방식<\/b>으로 세므로, 여러 번 다니시는 분은 <b>출발 전 EU 공식 조회 도구<\/b>로 확인하세요. <b>③<\/b> <b>ETIAS는 아직 시행 전<\/b>이고 2026년 4분기 예정입니다. <b>지금 신청할 것은 없습니다<\/b> — 대행을 권하는 곳은 의심하세요.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월<\/b> 기준이며, <b>제도·시행 일정·지원 국가는 변경될 수 있습니다.<\/b> 특히 <b>ETIAS 시행일은 확정 발표 전<\/b>이고, <b>Travel to Europe 앱의 지원 국가<\/b>도 EU가 순차 확대할 예정이라 <b>출국 직전 공식 페이지에서 다시 확인<\/b>하시기 바랍니다. 4장의 날짜 계산은 <b>가정한 일정에 규칙을 적용한 예시<\/b>이며, 실제 잔여 일수는 <b>EU 공식 조회 도구 또는 국경 심사관 확인<\/b>이 기준입니다. 9장 보관 기간은 EU 공식 페이지의 표기이고, 외교부 안전공지는 이를 \"1년에서 5년\"으로 요약하고 있습니다.<br>출처: 외교부 해외안전여행 안전공지 「새로운 EU 출입국시스템(EES) 시행 예정」(0404.go.kr), EU 공식 EES·ETIAS 안내 사이트(travel-europe.europa.eu — What is the EES / How does the EES work / Check how long you can stay / To whom does the EES not apply / Travel to Europe mobile app / Data held by the EES / FAQs), <a href=\"https://travel-europe.europa.eu/en/etias/about-etias/news-corner/revised-timeline-ees-and-etias\" rel=\"nofollow\">EU 「Revised timeline for the EES and ETIAS」<\/a>, Regulation (EU) 2017/2226 및 Regulation (EU) 2025/1534, Return Directive 2008/115. 영사안전콜센터 02-3210-0404<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/esta-2026.html\">▸ 미국 ESTA 신청 방법 수수료 유효기간 승인 거부 사유 총정리 (2026 전자여행허가)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_0653105371.html\">▸ 인천공항 스마트패스 등록 방법 전용라인 출국시간 단축 총정리 (2026)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_372.html\">▸ 해외여행 준비물 체크리스트 올인원 가이드 여권 환전 로밍 면세 총정리<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 시행일·절차·보관 기간은 <b>EU 공식 EES 안내 사이트의 각 항목 페이지<\/b>와 <b>외교부 해외안전여행 안전공지<\/b>를 직접 열어 확인해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 4장 계산은 가정한 일정에 규칙을 적용한 예시이므로, 실제 잔여 체류일은 <b>EU 공식 조회 도구<\/b>에서 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▲ OSMU 확산용 핵심 3줄 요약 (네이버·쓰레드용)\n1. 2026년 4월 10일부터 유럽 29개국(오스트리아·프랑스·독일·이탈리아·스페인 등) 모든 국경검문소에서 EES(출입국시스템)가 전면 가동됩니다. 우리 국민도 대상이라 입국할 때 지문 4개와 얼굴 사진이 등록되고, 여권에는 도장을 찍지 않습니다. 신청할 것도 수수료도 없고 공항에서 자동으로 진행되지만, 생체정보 제공을 거부하면 입국이 거부됩니다. 만 12세 미만은 지문을 채취하지 않습니다.\n2. 여권 도장이 사라지면서 체류일을 스스로 셀 근거가 없어졌습니다. 유럽 단기체류 한도는 '어떤 180일 안에서든 90일'인데, 29개국을 합산하고 입국일·출국일을 모두 하루로 세며, 확인하는 날을 포함해 거슬러 180일을 보는 방식입니다. 예를 들어 2026년 9월 10~24일(15일)과 11월 20일~12월 4일(15일)을 다녀왔다면 12월 4일 기준 30일 사용·60일 남음이고, 1차 여행분은 2027년 3월 24일 입국 시점에야 창에서 빠집니다. EU가 잔여 일수 조회 도구를 운영하지만 2026년 4월 10일 이전 체류는 반영되지 않으니 그 시기 여행은 항공권·숙박 기록을 따로 보관하세요.\n3. 사전등록 앱(Travel to Europe)은 아직 스웨덴과 포르투갈에서만 됩니다. 셀프서비스 키오스크는 전자여권이 있어야 쓸 수 있고, 아일랜드와 키프로스는 EES를 쓰지 않아 여권 도장이 계속 찍힙니다. 90일을 넘겨야 하면 양자협정에 따른 연장을 90일 마지막 근무일까지 신청해야 하고, 초과 체류가 적발되면 솅겐정보시스템에 등재되어 원칙적으로 5년을 넘지 않는 입국금지가 부과될 수 있습니다. ETIAS는 2026년 4분기 시행 예정으로 아직 신청을 받지 않으니, 대행을 권하는 곳은 의심하셔야 합니다.\n"},{"code":"A2-13","title":"2027년 d:#f4f7fc;border:1px solid #e0e8f4;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#2BC4B0;margin-bottom:8px}\n.lsg .rel a{display:block;color:#2a4a73;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#8a97ab;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">정부지원·복지<\/span>\n<p>2026년 7월 28일, 제80차 중앙생활보장위원회가 2027년 기준 중위소득을 <b>6.70% 인상<\/b>하기로 의결했습니다. 4인 가구 기준 <b>649만 4,738원 → 692만 9,885원<\/b>으로, 2015년 제도 시행 이후 <b>역대 최대 인상률<\/b>입니다. 기준 중위소득은 생계·의료·주거·교육급여의 선정 기준선이라, 올해 소득 때문에 <b>탈락했던 가구가 내년에는 대상이 되는<\/b> 구간이 생깁니다. 이 글은 \"제도가 무엇인가\"가 아니라 <b>\"얼마가 오르고, 누가 새로 들어오는가\"<\/b>만 짚습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 한눈에 보는 2027년 확정 내용<\/a><a href=\"#sec2\">2. 가구원수별 기준 중위소득 (2026 vs 2027)<\/a><a href=\"#sec3\">3. 급여별 선정기준 — 얼마 이하면 대상인가<\/a><a href=\"#sec4\">4. 새로 대상이 되는 소득 구간 (계산 예시)<\/a><a href=\"#sec5\">5. 생계급여, 실제로 받는 금액은<\/a><a href=\"#sec6\">6. 주거급여 기준임대료도 올랐다<\/a><a href=\"#sec7\">7. 산정방식이 6년 만에 바뀌었다<\/a><a href=\"#sec8\">8. 자주 걸리는 함정 4가지<\/a><a href=\"#sec9\">9. 언제부터 적용되고 지금 뭘 해야 하나<\/a><a href=\"#sec10\">10. 자주 묻는 질문<\/a><\/div>\n<a class=\"cta\" href=\"#sec4\">👉 내가 새로 대상이 되는지 먼저 확인하기<\/a>\n<h2 id=\"sec1\">1. 한눈에 보는 2027년 확정 내용<\/h2>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>내용<\/th><\/tr>\n<tr><td>의결<\/td><td>2026년 7월 28일 · 제80차 중앙생활보장위원회<\/td><\/tr>\n<tr><td>인상률<\/td><td><b>6.70%<\/b> (2015년 제도 시행 이후 역대 최대)<\/td><\/tr>\n<tr><td>4인 가구 기준 중위소득<\/td><td>649만 4,738원 → <b>692만 9,885원<\/b><\/td><\/tr>\n<tr><td>1인 가구 기준 중위소득<\/td><td>256만 4,238원 → <b>273만 6,042원<\/b><\/td><\/tr>\n<tr><td>급여별 기준 비율<\/td><td>생계 32% · 의료 40% · 주거 48% · 교육 50%<\/td><\/tr>\n<tr><td>적용 시작<\/td><td><b>2027년 1월 1일<\/b><\/td><\/tr>\n<\/table><\/div>\n<p>직전 최고 인상률이 2026년도의 6.51%였는데, 이번에 그 기록을 다시 넘겼습니다. 2년 연속으로 역대 최대치가 경신된 셈입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec2\">2. 가구원수별 기준 중위소득 (2026 vs 2027)<\/h2>\n<p>기준 중위소득 자체는 급여가 아니라 <b>기준선을 만드는 원본 숫자<\/b>입니다. 여기에 급여별 비율(32%·40%·48%·50%)을 곱해 실제 선정기준이 나옵니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>가구원 수<\/th><th>2026년<\/th><th>2027년<\/th><th>증가액<\/th><\/tr>\n<tr><td>1인<\/td><td>2,564,238원<\/td><td><b>2,736,042원<\/b><\/td><td>+171,804원<\/td><\/tr>\n<tr><td>2인<\/td><td>4,199,292원<\/td><td><b>4,480,645원<\/b><\/td><td>+281,353원<\/td><\/tr>\n<tr><td>3인<\/td><td>5,359,036원<\/td><td><b>5,718,091원<\/b><\/td><td>+359,055원<\/td><\/tr>\n<tr><td>4인<\/td><td>6,494,738원<\/td><td><b>6,929,885원<\/b><\/td><td>+435,147원<\/td><\/tr>\n<tr><td>5인<\/td><td>7,556,719원<\/td><td><b>8,063,019원<\/b><\/td><td>+506,300원<\/td><\/tr>\n<tr><td>6인<\/td><td>8,555,952원<\/td><td><b>9,129,201원<\/b><\/td><td>+573,249원<\/td><\/tr>\n<\/table><\/div>\n<p>가구원이 많을수록 절대 증가액이 큽니다. 다만 인상률은 모든 가구에 동일하게 6.70%가 적용됩니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec3\">3. 급여별 선정기준 — 얼마 이하면 대상인가<\/h2>\n<p>본인의 <b>소득인정액<\/b>이 아래 금액 이하이면 해당 급여의 선정기준을 충족합니다. 급여마다 기준선이 다르다는 점이 중요합니다.<\/p>\n<h3>2027년 급여별 선정기준<\/h3>\n<div class=\"tw\"><table>\n<tr><th>가구원 수<\/th><th>생계급여(32%)<\/th><th>의료급여(40%)<\/th><th>주거급여(48%)<\/th><th>교육급여(50%)<\/th><\/tr>\n<tr><td>1인<\/td><td>875,533원<\/td><td>1,094,417원<\/td><td>1,313,300원<\/td><td>1,368,021원<\/td><\/tr>\n<tr><td>2인<\/td><td>1,433,806원<\/td><td>1,792,258원<\/td><td>2,150,710원<\/td><td>2,240,323원<\/td><\/tr>\n<tr><td>3인<\/td><td>1,829,789원<\/td><td>2,287,236원<\/td><td>2,744,684원<\/td><td>2,859,046원<\/td><\/tr>\n<tr><td>4인<\/td><td>2,217,563원<\/td><td>2,771,954원<\/td><td>3,326,345원<\/td><td>3,464,943원<\/td><\/tr>\n<tr><td>5인<\/td><td>2,580,166원<\/td><td>3,225,208원<\/td><td>3,870,249원<\/td><td>4,031,510원<\/td><\/tr>\n<tr><td>6인<\/td><td>2,921,344원<\/td><td>3,651,680원<\/td><td>4,382,016원<\/td><td>4,564,601원<\/td><\/tr>\n<\/table><\/div>\n<h3>2026년 급여별 선정기준 (비교용)<\/h3>\n<div class=\"tw\"><table>\n<tr><th>가구원 수<\/th><th>생계급여(32%)<\/th><th>의료급여(40%)<\/th><th>주거급여(48%)<\/th><th>교육급여(50%)<\/th><\/tr>\n<tr><td>1인<\/td><td>820,556원<\/td><td>1,025,695원<\/td><td>1,230,834원<\/td><td>1,282,119원<\/td><\/tr>\n<tr><td>2인<\/td><td>1,343,773원<\/td><td>1,679,717원<\/td><td>2,015,660원<\/td><td>2,099,646원<\/td><\/tr>\n<tr><td>3인<\/td><td>1,714,892원<\/td><td>2,143,614원<\/td><td>2,572,337원<\/td><td>2,679,518원<\/td><\/tr>\n<tr><td>4인<\/td><td>2,078,316원<\/td><td>2,597,895원<\/td><td>3,117,474원<\/td><td>3,247,369원<\/td><\/tr>\n<tr><td>5인<\/td><td>2,418,150원<\/td><td>3,022,688원<\/td><td>3,627,225원<\/td><td>3,778,360원<\/td><\/tr>\n<tr><td>6인<\/td><td>2,737,905원<\/td><td>3,422,381원<\/td><td>4,106,857원<\/td><td>4,277,976원<\/td><\/tr>\n<\/table><\/div>\n<div class=\"tip\"><b>💡 TIP<\/b> &mdash; 생계급여에서 탈락해도 주거·교육급여는 되는 경우가 많습니다. 예를 들어 4인 가구 소득인정액이 월 300만 원이면 생계(221만)·의료(277만)는 초과지만, 주거(332만)·교육(346만)은 <b>2027년 기준으로 여전히 대상<\/b>입니다. 게다가 <b>주거급여와 교육급여에는 부양의무자 기준이 없습니다<\/b>(생계·의료급여에만 적용). \"생계급여 안 된다더라\"로 네 가지를 한꺼번에 포기하지 말고 급여별로 따로 확인하세요.<\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec4\">4. 새로 대상이 되는 소득 구간 (계산 예시)<\/h2>\n<p>이번 인상의 실질적 의미는 <b>기준선이 위로 올라가면서 그 사이 구간이 새로 열린다<\/b>는 데 있습니다. 2026년 기준선과 2027년 기준선 사이에 소득인정액이 놓인 가구가 여기 해당합니다.<\/p>\n<div class=\"value\"><b>🧮 계산 예시 ① — 4인 가구 · 생계급여<\/b>소득인정액 월 <b>215만 원<\/b>인 4인 가구<br>· 2026년 기준선 2,078,316원 → <b>초과 · 탈락<\/b><br>· 2027년 기준선 2,217,563원 → <b>이하 · 대상<\/b><br>→ 같은 소득인데 2027년 1월부터 생계급여 대상이 됩니다.<\/div>\n<div class=\"value\"><b>🧮 계산 예시 ② — 1인 가구 · 생계급여<\/b>소득인정액 월 <b>85만 원<\/b>인 1인 가구<br>· 2026년 기준선 820,556원 → <b>초과 · 탈락<\/b><br>· 2027년 기준선 875,533원 → <b>이하 · 대상<\/b><br>→ 1인 가구는 기준선이 82만 원대에서 87만 원대로 올라, 그 5만 원 남짓한 구간이 새로 열립니다.<\/div>\n<div class=\"value\"><b>🧮 계산 예시 ③ — 2인 가구 · 의료급여<\/b>소득인정액 월 <b>175만 원<\/b>인 2인 가구<br>· 2026년 기준선 1,679,717원 → <b>초과 · 탈락<\/b><br>· 2027년 기준선 1,792,258원 → <b>이하 · 대상<\/b><br>→ 의료비 부담이 큰 가구라면 이 구간 변화가 가장 체감이 큽니다.<\/div>\n<div class=\"value\"><b>🧮 계산 예시 ④ — 3인 가구 · 주거급여<\/b>소득인정액 월 <b>260만 원<\/b>인 3인 가구<br>· 2026년 기준선 2,572,337원 → <b>초과 · 탈락<\/b><br>· 2027년 기준선 2,744,684원 → <b>이하 · 대상<\/b><br>→ 주거급여는 기준선이 48%로 높아, 근로소득이 있는 가구도 들어오는 경우가 많습니다.<\/div>\n<p>정리하면, <b>가구원 수별로 아래 구간에 있던 가구가 2027년에 새로 문턱을 넘습니다<\/b>(생계급여 기준).<\/p>\n<div class=\"tw\"><table>\n<tr><th>가구원 수<\/th><th>새로 대상이 되는 소득인정액 구간(생계급여)<\/th><\/tr>\n<tr><td>1인<\/td><td>820,556원 초과 ~ 875,533원 이하<\/td><\/tr>\n<tr><td>2인<\/td><td>1,343,773원 초과 ~ 1,433,806원 이하<\/td><\/tr>\n<tr><td>3인<\/td><td>1,714,892원 초과 ~ 1,829,789원 이하<\/td><\/tr>\n<tr><td>4인<\/td><td>2,078,316원 초과 ~ 2,217,563원 이하<\/td><\/tr>\n<tr><td>5인<\/td><td>2,418,150원 초과 ~ 2,580,166원 이하<\/td><\/tr>\n<tr><td>6인<\/td><td>2,737,905원 초과 ~ 2,921,344원 이하<\/td><\/tr>\n<\/table><\/div>\n<p>단, 선정기준은 <b>소득 요건 하나일 뿐<\/b>입니다. 이 구간에 들어간다고 수급이 자동으로 확정되지는 않으니, 최종 판단은 주민센터 상담·신청을 통해 확인하세요. 다만 반대로 지레 포기할 일도 아닙니다 &mdash; 자세한 내용은 아래 <a href=\"#sec8\">8번 함정 ④<\/a>에서 짚습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec5\">5. 생계급여, 실제로 받는 금액은<\/h2>\n<p>선정기준액을 그대로 다 받는 것이 아닙니다. 보건복지부 보도자료는 지급액 산정 방식을 이렇게 밝히고 있습니다 — <b>\"각 가구에 실제 지급되는 생계급여액은 가구원 수별 선정기준액에서 해당 가구의 소득인정액을 차감한 금액\"<\/b>입니다. 즉 부족한 만큼만 채워주는 구조입니다.<\/p>\n<div class=\"value\"><b>🧮 계산 예시 — 4인 가구 생계급여 실제 수령액<\/b>2027년 4인 선정기준액 2,217,563원<br>− 소득인정액 2,150,000원<br>= <b>월 67,563원<\/b> 지급<br><br>소득인정액이 0원인 4인 가구라면 선정기준액 전액인 <b>월 2,217,563원<\/b>이 최대 지급액입니다.<\/div>\n<p>이 최대 지급액이 이번 인상으로 어떻게 달라졌는지 보면 체감이 분명해집니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>2026년 최대 지급액<\/th><th>2027년 최대 지급액<\/th><th>인상액<\/th><\/tr>\n<tr><td>1인 가구<\/td><td>820,556원<\/td><td>875,533원<\/td><td>약 5만 5천 원<\/td><\/tr>\n<tr><td>4인 가구<\/td><td>2,078,316원<\/td><td>2,217,563원<\/td><td>약 14만 원<\/td><\/tr>\n<\/table><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec6\">6. 주거급여 기준임대료도 올랐다<\/h2>\n<p>주거급여는 선정기준을 넘지 않는 임차가구에 임차료를 지원하는데, 그 상한이 <b>기준임대료<\/b>입니다. 사는 지역(급지)과 가구원 수에 따라 달라집니다. 2027년 기준임대료는 아래와 같습니다(괄호 안은 2026년 대비 인상액).<\/p>\n<div class=\"tw\"><table>\n<tr><th>가구원<\/th><th>1급지<br>(서울)<\/th><th>2급지<br>(경기·인천)<\/th><th>3급지<br>(광역시·세종·<br>수도권 외 특례시)<\/th><th>4급지<br>(그 외 지역)<\/th><\/tr>\n<tr><td>1인<\/td><td>38.1 (+1.2)<\/td><td>31.3 (+1.3)<\/td><td>25.9 (+1.2)<\/td><td>23.4 (+2.2)<\/td><\/tr>\n<tr><td>2인<\/td><td>43.1 (+1.7)<\/td><td>35.2 (+1.7)<\/td><td>29.1 (+1.6)<\/td><td>26.5 (+2.7)<\/td><\/tr>\n<tr><td>3인<\/td><td>51.4 (+2.2)<\/td><td>42.2 (+2.1)<\/td><td>34.7 (+2.0)<\/td><td>31.8 (+3.5)<\/td><\/tr>\n<tr><td>4인<\/td><td>59.6 (+2.5)<\/td><td>48.8 (+2.5)<\/td><td>40.3 (+2.2)<\/td><td>36.9 (+4.0)<\/td><\/tr>\n<tr><td>5인<\/td><td>61.8 (+2.7)<\/td><td>50.5 (+2.6)<\/td><td>41.8 (+2.4)<\/td><td>38.2 (+4.2)<\/td><\/tr>\n<tr><td>6인<\/td><td>73.1 (+3.2)<\/td><td>59.9 (+3.1)<\/td><td>49.2 (+2.9)<\/td><td>45.2 (+5.0)<\/td><\/tr>\n<\/table><\/div>\n<p style=\"font-size:14px;color:#667\">※ 단위: 만 원/월. 보건복지부 보도자료 표기 그대로입니다.<\/p>\n<p>예를 들어 서울에 사는 4인 가구라면 임차료 지원 상한이 <b>월 59만 6천 원<\/b>까지 올라갑니다. 실제 지급액은 기준임대료와 실제 임차료 중 낮은 금액을 바탕으로 산정되므로, 기준임대료가 곧 지급액인 것은 아닙니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec7\">7. 산정방식이 6년 만에 바뀌었다<\/h2>\n<p>이번 결정에서 눈여겨볼 것이 인상률만은 아닙니다. 기준 중위소득을 <b>어떻게 계산할지<\/b>의 방식 자체가 6년 만에 개편됐습니다.<\/p>\n<ul>\n<li><b>원칙<\/b> — 당해년도 기준 중위소득에 가계금융복지조사 중위소득의 <b>최신 3년 평균 증가율<\/b>을 적용<\/li>\n<li><b>보정<\/b> — 소비자물가지수, 실질경제성장률(GDP) 등 사회·경제 지표를 반영해 증가율을 보정 가능<\/li>\n<li><b>추가 조정<\/b> — 상대빈곤 완화와 제도 지속가능성을 고려한 조정도 가능<\/li>\n<\/ul>\n<p>물가와 경기 변화를 더 반영하는 구조로 바뀐 것인데, 이번 6.70%라는 역대 최대 인상률이 나온 배경이기도 합니다. 앞으로의 인상 폭을 가늠할 때 참고할 부분입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec8\">8. 자주 걸리는 함정 4가지<\/h2>\n<h3>함정 ① 소득인정액을 월급으로 착각한다<\/h3>\n<p>선정기준과 비교하는 것은 <b>월급이 아니라 소득인정액<\/b>입니다. 소득인정액은 소득평가액에 재산의 소득환산액을 더해 산출하며, 각종 공제가 적용됩니다. 월급만 놓고 \"기준을 넘으니 안 되겠다\"고 단정하면 실제로는 대상인데 신청조차 안 하게 됩니다. 반대로 소득이 적어도 재산이 소득으로 환산돼 기준을 넘는 경우도 있습니다. 정확한 값은 복지로 모의계산으로 확인하세요.<\/p>\n<h3>함정 ② 급여를 하나로 뭉뚱그린다<\/h3>\n<p>생계·의료·주거·교육급여는 기준선이 각각 32%·40%·48%·50%로 다릅니다. 하나에서 탈락해도 다른 급여는 대상일 수 있는데, \"수급자 안 된다\"는 한마디로 넷 다 포기하는 경우가 흔합니다.<\/p>\n<h3>함정 ③ 인상 소식을 듣고 지금 적용되는 줄 안다<\/h3>\n<p>이번에 확정된 금액은 <b>2027년 1월 1일부터<\/b> 적용됩니다. 2026년 12월 31일까지는 기존 2026년 기준이 그대로입니다. 지금 신청하면 2026년 기준으로 심사되므로, 새 기준선 덕분에 대상이 되는 구간에 있다면 시점을 감안해야 합니다.<\/p>\n<h3>함정 ④ \"자녀가 있으니 부양의무자 때문에 안 된다\"고 미리 포기한다<\/h3>\n<p>가장 많이 오해하는 부분입니다. 보건복지부 수급자 선정기준 안내에 따르면 부양의무자 기준은 <b>생계급여와 의료급여에만 적용되고, 주거급여·교육급여에는 아예 없습니다<\/b>. 그리고 생계급여의 부양의무자 기준도 \"모든 자녀\"를 보는 것이 아니라, 수급(권)자와 생계·주거를 달리하는 <b>1촌 직계혈족 및 그 배우자의 연 소득이 1.3억 원을 초과하거나 재산이 12억 원을 초과하는 경우<\/b>에 보장에서 제외하는 방식입니다.<\/p>\n<p>또한 부양의무자 가구에 중증장애인이 포함된 경우, 수급(권)자가 30세 미만 한부모가구·보호종료아동인 경우, 수급(권)자 가구에 장애의 정도가 심한 장애인이 포함된 경우 등 <b>별도의 예외<\/b>도 마련돼 있습니다. 즉 \"자녀가 직장에 다닌다\"는 사실만으로 탈락이 확정되는 구조가 아닙니다. 해당 여부는 주민센터에서 확인하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec9\">9. 언제부터 적용되고 지금 뭘 해야 하나<\/h2>\n<div class=\"warn\"><b>⚠️ 적용 시점<\/b> 2027년 기준 중위소득과 급여별 선정기준은 <b>2027년 1월 1일부터<\/b> 적용됩니다. 이번 발표만으로 지금 당장 급여액이 오르거나 대상이 확대되지는 않습니다.<\/div>\n<ul>\n<li><b>이미 수급 중인 가구<\/b> — 새 기준 적용에 따른 급여액 변경 절차는 관할 주민센터·복지로 안내를 따르면 됩니다. 본인의 급여액이 어떻게 조정되는지는 2027년 1월 전후로 주민센터에 확인하는 것이 확실합니다.<\/li>\n<li><b>2026년에 탈락했던 가구<\/b> — 위 4번의 구간에 해당한다면 2027년 기준으로 다시 판단받을 여지가 있습니다. 소득인정액에 큰 변동이 없더라도 기준선이 올라갔기 때문입니다.<\/li>\n<li><b>한 번도 신청해보지 않았다면<\/b> — 복지로에서 모의계산으로 소득인정액을 먼저 확인한 뒤, 주민센터에서 상담·신청하는 순서가 가장 빠릅니다.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec10\">10. 자주 묻는 질문<\/h2>\n<h3>Q. 6.70%가 왜 그렇게 큰 의미인가요?<\/h3>\n<p>기준 중위소득 결정이 시작된 2015년 이후 <b>가장 높은 인상률<\/b>이기 때문입니다. 직전 최고치는 2026년도의 6.51%였는데 이번에 다시 경신됐습니다. 기준선이 오르면 같은 소득이어도 새로 대상이 되는 가구가 생깁니다.<\/p>\n<h3>Q. 우리 집 소득이 딱 기준선 언저리인데 대상인가요?<\/h3>\n<p>비교 대상은 월급이 아니라 소득인정액이고, 소득인정액은 각종 공제와 재산 환산이 반영돼 실제 월급과 상당히 다를 수 있습니다. 복지로 모의계산으로 소득인정액부터 산출한 뒤 위 표와 비교하세요.<\/p>\n<h3>Q. 생계급여 선정기준액을 매달 그대로 받나요?<\/h3>\n<p>아닙니다. 선정기준액에서 소득인정액을 뺀 금액이 지급됩니다. 소득인정액이 0원일 때만 선정기준액 전액(4인 가구 기준 월 2,217,563원)이 최대 지급액이 됩니다.<\/p>\n<h3>Q. 7인 이상 가구는 어떻게 되나요?<\/h3>\n<p>이번 보도자료 표는 6인 가구까지 제시돼 있습니다. 7인 이상 가구의 기준 중위소득은 별도 산정 방식이 적용되므로, 해당한다면 복지로나 주민센터에서 직접 확인하시기 바랍니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">2027년 기준 중위소득은 <b>6.70% 인상<\/b>으로 확정됐습니다(4인 가구 <b>692만 9,885원<\/b>, 1인 가구 <b>273만 6,042원<\/b>). 급여별 선정기준도 함께 올라 생계급여는 4인 가구 <b>221만 7,563원<\/b>, 1인 가구 <b>87만 5,533원<\/b>이 됩니다. 생계급여 최대 지급액은 1인 약 5만 5천 원, 4인 약 14만 원 오릅니다. 적용은 <b>2027년 1월 1일부터<\/b>이며, 2026년에 소득 때문에 탈락했던 가구라도 위 4번의 구간에 있다면 다시 판단받을 여지가 있습니다. 비교 기준은 월급이 아니라 <b>소득인정액<\/b>이라는 점만 기억하세요.<\/p><\/div>\n<div id=\"ymyl-disclaimer\" style=\"font-size:13px;color:#888;margin-top:16px;line-height:1.6\">본 글은 정보 제공용이며, 수급 자격·급여액에 대한 최종 판단은 관할 주민센터 및 보건복지부 등 소관 기관의 심사에 따릅니다.<\/div>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.mohw.go.kr/board.es?mid=a10503010100&bid=0027&act=view&list_no=1491453\" target=\"_blank\" rel=\"nofollow\">▸ 보건복지부 — 제80차 중앙생활보장위원회 보도자료(2027년 기준 중위소득 결정)<\/a><a href=\"https://www.mohw.go.kr/menu.es?mid=a10708010900\" target=\"_blank\" rel=\"nofollow\">▸ 보건복지부 — 기준 중위소득 안내<\/a><a href=\"https://www.mohw.go.kr/menu.es?mid=a10708010300\" target=\"_blank\" rel=\"nofollow\">▸ 보건복지부 — 수급자 선정기준<\/a><a href=\"https://www.bokjiro.go.kr\" target=\"_blank\" rel=\"nofollow\">▸ 복지로 — 복지서비스 모의계산·신청<\/a><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글의 수치는 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월 28일<\/b> 제80차 중앙생활보장위원회 의결 및 보건복지부 보도자료 기준입니다. 2027년 금액은 <b style=\"display:inline;color:#33503a;margin:0\">2027년 1월 1일<\/b>부터 적용되며, 세부 사항은 시행 전 변경될 수 있습니다. 2026년 비교 수치와 <b style=\"display:inline;color:#33503a;margin:0\">부양의무자 기준<\/b>은 보건복지부 '기준 중위소득'·'수급자 선정기준' 안내 페이지에서 확인했습니다.<br>출처: <a href=\"https://www.mohw.go.kr/board.es?mid=a10503010100&bid=0027&act=view&list_no=1491453\" target=\"_blank\" rel=\"nofollow\">보건복지부 보도자료<\/a> · <a href=\"https://www.mohw.go.kr/menu.es?mid=a10708010900\" target=\"_blank\" rel=\"nofollow\">보건복지부 기준 중위소득<\/a> · <a href=\"https://www.mohw.go.kr/menu.es?mid=a10708010300\" target=\"_blank\" rel=\"nofollow\">보건복지부 수급자 선정기준<\/a><\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_0202295376.html\">▸ 기초생활수급자 생계급여 조건 소득인정액 금액 신청 방법 총정리 (2026)<\/a><a href=\"https://lif
