<style>
/* 2026-08-13 콘솔 공통 팔레트로 통일(사용자 지시: 탭마다 화면형식이 제각각이라
   정리 요청) — index.html·categories.html·dashboard.html·search.html 이 이미 쓰던
   #0f1626 계열을 진실원으로 삼는다. 변수명은 그대로 둬서 아래 규칙은 안 건드림. */
:root{--bg:#0f1626;--card:#16203a;--card2:#0c1220;--line:#2a3a5e;--txt:#e8edf7;--mut:#9fb0d0;--ok:#06d6a0;--warn:#ffd166;--bad:#ff5c5c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
/* 2026-08-13 사용자 지시: "운영관리 탭과 화면구성이 달라 일목요연하지 않다,
   KPI대시보드 형식으로" — 좁은 470px 팝업카드였던 걸 adsense.html·gsc.html과
   같은 넓은 KPI 대시보드 톤으로 바꾼다. #board 에 innerHTML 을 꽂는 JS 로직은
   그대로이고(같은 클래스명), 여기 CSS만 넓혀서/키워서 통일한다. */
/* 2026-08-13 재수정 — "가운데로 화면이 몰려있잖아!": gsc·batch·seo 등 나머지
   운영관리 페이지는 폭 제한이 없다. 1080px 가운데정렬은 adsense.html 혼자만의
   패턴이었다. 폭 제한을 없애 화면을 꽉 채운다. */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px;width:100%}
.hd{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:19px;font-weight:700}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(6,214,160,.16);color:var(--ok)}
.b-warn{background:rgba(255,209,102,.16);color:var(--warn)}
.b-bad{background:rgba(255,92,92,.16);color:var(--bad)}
.sec{font-size:13px;color:#9db0c6;font-weight:800;letter-spacing:.02em;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
/* KPI 카드 그리드 — adsense.html 의 .kpi-grid 와 같은 형식으로 통일 */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 6px}
.m{background:var(--card2);border:1px solid var(--line);border-top:3px solid #3a4a63;border-radius:12px;padding:12px 14px}
.m .l{font-size:11.5px;color:var(--mut);font-weight:700}
.m .v{font-size:24px;font-weight:800;margin-top:3px;line-height:1.2}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #243049;font-size:12.5px}
li:last-child{border-bottom:none}
li.on{opacity:.62}
li.on .lbl{text-decoration:line-through}
li svg{width:15px;height:15px;flex:none}
li.on svg{color:var(--ok)}
li.now svg{color:#7fc1ff}
li.wait svg{color:#4a586e}
.num{font-size:11px;color:#6b7a99;width:16px;text-align:right;flex:none}
.who{font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px;flex:none}
.who.ai{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.who.me{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.lbl{font-size:12.5px}
.star{color:#ff8e8e;font-weight:800;margin-left:2px}
.banner{display:none;margin-top:9px;background:#0c3a2c;border:1px solid #1f6b52;color:#06d6a0;border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12.5px}
.banner.show{display:block}
.upd{font-size:11px;color:var(--mut);text-align:right;margin-top:12px}
.agent{background:var(--card2);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.agent .ah{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.agent .st{font-size:10px;font-weight:700;padding:1px 7px;border-radius:7px;margin-left:auto}
.st.active{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.st.uncommitted{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.st.idle{background:#222c3a;color:#6b7a99;border:1px solid #2e3a4a}
.agent .role{font-size:11px;color:var(--mut);margin:3px 0 1px}
.agent .own{font-size:10.5px;color:#5a6b80}
.agent .act{font-size:11px;color:#aeb9c7;margin-top:4px;padding-left:7px;border-left:2px solid #2a3a4d;line-height:1.5}
.agent .act .d{color:var(--mut);font-size:10px}
.advice{background:#13202d;border:1px solid #2a3a4d;border-radius:9px}
.advice .ai{display:flex;gap:8px;padding:7px 11px;font-size:12px;line-height:1.5;border-bottom:1px dashed #243049}
.advice .ai:last-child{border-bottom:none}
.advice .ic{flex:none}
.prow{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px dashed #243049;font-size:11.5px}
.prow:last-child{border-bottom:none}
.pcd{color:#7fc1ff;font-weight:700;flex:none;width:46px}
.ptt{flex:1;color:#cdd6e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.qcard{display:flex;gap:9px;padding:8px;margin:6px 0;background:#141c2c;border:1px solid #243049;border-radius:9px}
.qth{width:78px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:#0d1420}

.qbody{flex:1;min-width:0}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qcode{color:#7fc1ff;font-weight:700;font-size:11.5px}
.qlane{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700}
.qlane.info{background:#12283a;color:#7fc1ff}
.qlane.pop{background:#2f2136;color:#e0a3ff}
.qtitle{color:#e6edf5;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qfacts{color:#8a95a6;font-size:10px;margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qmeta{margin-top:4px}
.qdraft{color:#6b7688;font-size:9.5px;margin-left:8px}
.qpv{background:#17324a;color:#7fc1ff;border:1px solid #2a4d6e;border-radius:6px;font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer}
.qpv:hover{background:#1d4463}
.qpv.none{background:none;border:none;color:#54627a;font-weight:400;cursor:default;padding:3px 0}
#qpv-ov{display:none;position:fixed;inset:0;background:rgba(6,10,18,.82);z-index:999;align-items:center;justify-content:center;padding:18px}
#qpv-ov.show{display:flex}
.qpv-box{width:100%;max-width:760px;height:88vh;display:flex;flex-direction:column;background:#0f1626;border:1px solid #2a3752;border-radius:12px;overflow:hidden}
.qpv-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #243049;font-size:12.5px;font-weight:700;color:#7fc1ff}
.qpv-hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpv-x{background:#243049;color:#cdd6e0;border:none;border-radius:6px;font-size:11px;padding:5px 11px;cursor:pointer;flex:none}
.qpv-x:hover{background:#324158}
.qpv-fr,#qpv-fr{flex:1;width:100%;border:0;background:#fff}
.qpv-ft{padding:8px 14px;border-top:1px solid #243049;font-size:10px;color:#8a95a6;text-align:center}
.ch{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 4px;flex:none;margin-left:3px}
.ch.on{background:#0c3a2c;color:#06d6a0}
.ch.off{background:#3a1216;color:#f0707a}

다(비교 편수도 192 vs 193 으로 갈렸다). 즉 '발행 직후 register_post 전' 이라는 창에서만 나오는 거짓 차단이다. ⚠️영향: fail-closed 게이트라 사람이 이 메시지를 보면 정당한 발행을 되돌릴 수 있다 — 실제로 나도 잠깐 F4-12 를 중복으로 오해했다. 처방 후보: ①bodydup 이 DB 대신 라이브 URL 로 자기 글을 식별 ②DB 에 코드가 없는데 제목이 라이브와 거의 같으면 '발행 직후일 수 있음' 으로 안내 문구를 바꾸기. 지금은 운영 규칙으로 대응: 발행 직후 게이트를 다시 돌리지 말고, 돌렸다면 register_post 후 재확인할 것.","🔑 gh CLI 설치 완료 (2026-08-08). winget install GitHub.cli → 2.97.0, C:\\Program Files\\GitHub CLI\\gh.exe. 인증은 아직 없음(gh auth status = not logged in) — 사용자가 프롬프트에 '! gh auth login' 1회 실행 필요. ⚠️문서 여러 곳에 'gh 가 없어 Actions 로그를 확인 못 함'(watch label-at-publish 등)이라 적혀 있는데 이제 틀린 서술이 된다 — 인증까지 끝나면 Actions 로그 확인·워크플로 트리거가 전부 터미널에서 된다. 계기: 사용자 지시로 발행대기 4편을 Fold 가 발행하려 했으나 ①pipeline.py:289 가 로컬 --publish 차단 ②웹 Actions 의 Run workflow 폼이 브라우저 자동화에서 3회 모두 'There was an error while loading' 로 실패 → 남은 경로가 gh 뿐이었다. 🔴'웹이 죽었다'고 단정하지 말 것 — 사람이 직접 누르면 될 수 있고, 내 자동화 쪽 문제일 가능성이 남아 있다(미확인).","[팩트체크] [야간검증] 오늘 발행 2편(F4-12 서울고궁관람료·orphan 국립공원탐방로예약제) 팩트체크 완료 — 둘 다 공식출처(royal.khs.go.kr, res.knps.or.kr) 대조 결과 오류 없음. F4-12: 관람료·통합관람권 6000원/6개월·후원 예약창구 전부 일치. 탐방로예약제: 노고단1870명·우이령1190명(주말공휴일)·흘림골5000명(시간지정제)·마감(전날14시)·노쇼페널티(1회1개월/2회이상3개월)·월4건제한 전부 res.knps.or.kr 환불정책 페이지와 일치.","[팩트체크] [야간검증] 기존글 3편 위험순위 검증(B4-05 퇴직금·C1-04 건보수가·D2-03 K패스) 중 D2-03에서 오류 발견. 🔴D2-03 K패스: 라이브가 평시 환급률(일반20%·청년30%·저소득53%)만 서술하는데, 2026.3.31 국무회의 통과 추경으로 2026.4.1~9.30 이용분에 한해 환급률이 한시 인상됨(일반20→30%·청년등30→45%·3자녀50→75%·저소득53→83%, 예산877억원). 오늘 8/8은 그 기간 안이라 라이브 수치가 독자의 실제 환급액보다 10~30%p 낮게 안내되는 중. 출처: 2026-03-31 국무회의 추경안 보도(다수 매체 교차확인, 예산액·기간·인상폭 일치). 라이브 수정은 사용자 승인 게이트 — 이 세션은 미수정. B4-05(근속연수공제·환산급여공제 표·14일지급·연20%지연이자, NTS 공식페이지 대조)·C1-04(진찰료 인상률 6/4/2%, 2026 수가혁신방안 발표 기사 대조)는 오류 0건. 오늘 발행 2편(F4-12·orphan 탐방로예약제)도 검증 완료(오류 0건, 별도 기록). D2-03은 다음 대면 세션에서 라이브에 한시 인상 안내 박스 추가 검토 필요 — watch 항목으로 남김.","[색인] [색인] crawl-watch 확인: D2-10·D4-07(8/06 색인요청한 신규 2편) 아직 lastCrawl 없음(2026-08-08 09:52 스냅샷 기준 미크롤). watch crawl-watch 항목이 묻던 질문에 대한 답 — 신규 글도 기존 글과 같은 속도로 크롤되는지는 아직 판단 불가, 계속 관찰 필요. 오늘 크롤 배치(25편)는 신규 크롤 0편·상태이동 12건(플래핑 계속, D4-04 등).","[발행] F4-14(국립공원 탐방로예약제)가 2026-08-08 17:46 라이브 발행됐는데 발행 후 DB 등록이 빠져 하루 동안 라이브 180편 vs DB 179편으로 어긋나 있었다. 잡아낸 것은 selfcheck 5) 피드 정합의 orphan 1건 — 탐지망은 제대로 돌았고, 빠진 것은 발행 세션의 후속 단계였다. 2026-08-09 발행 루틴이 register_post 로 등록(180편)하고 short·매니페스트·bake·validate(FAIL 0)까지 마감. 교훈: Actions 로 발행하면 라이브는 즉시 생기지만 DB 등록은 사람/세션 몫이라 세션이 끊기면 그대로 비는 구간이 된다 — 발행 직후 feedcheck 를 한 번 돌리면 그날 안에 잡힌다.","🐛 publish.yml 이 dupcheck 🔴 에 스텝째로 죽던 버그 수정 (2026-08-09). studio/dupcheck.py:119 는 강한중복일 때 종료코드 3 을 내는데, 그 파일 주석에 'WARN 전용이라 파이프라인 차단엔 안 씀'이라고 적혀 있다. 그런데 publish.yml 의 '중복 검사 (주제 + 내용)' 스텝이 dupcheck 를 set +e 없이 호출했다 — Actions run: 은 bash -e 라 exit 3 에 스텝이 즉사한다. 바로 아래 bodydup 호출은 올바르게 감싸져 있어서 **한 스텝 안에서 한쪽만 빠져 있었다.** 실제 피해: A1-12(근로장려금 반기신청)는 A1-03 과 '근로장려금' 단어 하나만 겹쳐 🔴 오탐을 받는데 bodydup 은 0.048 🟢 인 새 글이다 — 그대로 두면 이 글은 Actions 로 영영 발행되지 않는다. 수정: set +e/drc/case 로 감싸고 3 은 ::warning:: 으로만 남긴다(코드 3=제목 강한겹침, 그 외=검사 못 함, 둘 다 차단 안 함). 검증: YAML 파싱 OK · bash -n OK · 실제 🔴 제목으로 시뮬레이션해 최종 exit 0 확인. 🔴교훈: 문서·주석이 'WARN 전용'이라고 말해도 **호출부가 그렇게 안 부르면 아니다.** 게이트의 성격은 주석이 아니라 호출 방식이 정한다. 발견 경위: Fold 세션이 A1-12 발행을 시도하다 막혀 진단을 올려줬고, 관제탑이 코드로 확인해 고쳤다(역할 분담대로).","⏱️ 워크플로 수정과 실행의 시차 — A1-12 첫 발행 실패 (2026-08-09). Fold 가 14:37 KST 에 A1-12 를 트리거했는데 내 publish.yml 수정 커밋(107aa88)은 14:46 KST 였다. 9분 차이로 러너가 옛 코드를 받아 dupcheck 🔴 exit 3 에 스텝째로 죽었다(로그에 set +e 없는 호출이 그대로 찍혀 있다). 부작용은 없다 — 발행 스텝 전에 멈췄고 라이브·DB 모두 무변화. 🔴교훈: **러너는 항상 origin/main 의 코드를 쓴다.** 게이트를 고쳤으면 '푸시가 끝났는지'를 확인한 뒤에 실행 지시를 내려야 하고, 지시서 카드에도 '수정본이 원격에 올라간 뒤 실행할 것'을 적어야 한다. 내가 카드에 그 문구를 적어 놓고도(A1-12 카드 ⚠️줄) 사용자에게 '이제 통과합니다'라고 말할 때 푸시 시각과 실행 시각을 대조하지 않았다 — 순서를 말로만 챙기면 이렇게 빗나간다.","🔗 관제탑 푸시 하나가 4단계 뒤까지 망가뜨렸다 — A1-12 (2026-08-09). 연쇄: ①A1-12 발행이 도는 중에 내가 webapp/* 가 든 커밋(73e50f3)을 푸시했다 ②러너의 마지막 '변경분 커밋 & 푸시' 가 rebase 충돌로 실패(posts_index.json·progress.html·reindex.json) ③러너가 seed 한 progress.json(pipeline.code = 'A1-12 · …')이 저장소에 못 올라갔다 ④나중에 Fold 가 register_post 를 돌릴 때 _board_short('A1-12') 가 아직 D1-05 인 progress.json 을 읽어 빈 문자열을 반환 ⑤DB 의 A1-12.short 가 비었다 → ,#2EB67D,#1b8f8f);color:#fff !important;font-weight:800;font-size:17px;padding:15px 18px;border-radius:12px;text-decoration:none;margin:22px 0}\n.lsg table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:15px}\n.lsg th,.lsg td{border:1px solid #e2e8f2;padding:10px 12px;text-align:center}\n.lsg th{background:#eef3fb}\n.lsg .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 16px}\n.lsg .tw table{margin:0}\n.lsg .end{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:16px 20px;margin-top:24px}\n.lsg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .rel{background:#f4f7fc;border:1px solid #e0e8f4;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#2EB67D;margin-bottom:8px}\n.lsg .rel a{display:block;color:#2a4a73;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#8a97ab;text-decoration:none;margin:2px 0 6px}\n.lsg .warn{background:#fff4f2;border:1px solid #f6cfc6;border-radius:12px;padding:14px 18px;margin:14px 0}\n.lsg .warn b{display:block;font-size:15px;color:#c0442a;margin-bottom:6px}\n.lsg .tip{background:#f2f7ff;border:1px solid #cfe0f6;border-radius:12px;padding:14px 18px;margin:14px 0}\n.lsg .tip b{display:block;font-size:15px;color:#1b5fa8;margin-bottom:6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">생활·행정<\/span>\n<p>코스트코 회원가입 창구에서 가장 많이 하는 고민은 하나입니다. <b>\"4만 3천 원짜리로 할까, 8만 6천 원짜리로 할까.\"<\/b> 직원분은 \"많이 사시면 이그제큐티브가 이득\"이라고 하고, 인터넷에는 \"2% 적립이니 무조건 이득\"이라는 말이 돌아다닙니다. 그런데 <b>정확히 얼마를 사야 본전인지<\/b>는 아무도 숫자로 말해 주지 않습니다.<\/p>\n<p>답은 계산으로 나옵니다. 두 회원권의 <b>차액은 43,000원<\/b>이고 적립률은 <b>2%<\/b>이니, 손익분기는 <b>43,000 ÷ 0.02 = 연 215만 원<\/b>입니다. 월로 나누면 <b>약 18만 원<\/b>입니다. 다만 이건 <b>이론값<\/b>이고, 약관을 읽어 보면 <b>부가세와 주류·푸드코트·상품권이 적립에서 빠지기<\/b> 때문에 실제 손익분기는 이보다 올라갑니다.<\/p>\n<p>이 글은 코스트코 코리아 공식 홈페이지와 이용약관에 적혀 있는 문구만 가지고 <b>①등급별 연회비 ②본전이 되는 구매액 ③적립에서 빠지는 항목 ④가장 손해가 큰 실수(다운그레이드) ⑤환불·갱신 규정<\/b>을 정리했습니다. 확인일은 <b>2026년 8월 12일<\/b>입니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 회원권 4종과 연회비 (2026년 8월 확인)<\/a><a href=\"#sec2\">2. 손익분기 계산 — 연 215만 원<\/a><a href=\"#sec3\">3. 실효 적립률은 2%가 아니다<\/a><a href=\"#sec4\">4. 리워드에서 빠지는 항목들<\/a><a href=\"#sec5\">5. 다운그레이드하면 적립금이 사라진다<\/a><a href=\"#sec6\">6. 결제는 현대카드 계열만 된다<\/a><a href=\"#sec7\">7. 동반 입장·가족카드는 몇 명까지<\/a><a href=\"#sec8\">8. 연회비 환불과 갱신 60일 규칙<\/a><a href=\"#sec9\">9. 이런 분은 올리지 마세요<\/a><a href=\"#sec10\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec2\">👉 우리 집은 본전이 되나 계산해 보기<\/a>\n\n<h2 id=\"sec1\">1. 회원권 4종과 연회비 (2026년 8월 확인)<\/h2>\n<p>코스트코 코리아의 회원권은 <b>개인용(골드스타)<\/b>과 <b>사업자용(비즈니스)<\/b> 두 갈래이고, 각각 위에 <b>이그제큐티브<\/b> 등급이 얹히는 구조입니다. 즉 등급은 4가지입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>회원권<\/th><th>연회비<\/th><th>2% 리워드<\/th><th>비고<\/th><\/tr>\n<tr><td>골드스타<\/td><td><b>43,000원<\/b><\/td><td>없음<\/td><td>개인용<\/td><\/tr>\n<tr><td>이그제큐티브 골드스타<\/td><td><b>86,000원<\/b><\/td><td>있음<\/td><td>세대당 1회만 가입 가능<\/td><\/tr>\n<tr><td>비즈니스<\/td><td><b>38,000원<\/b><\/td><td>없음<\/td><td>비즈니스 카드 추가 시 38,000원<\/td><\/tr>\n<tr><td>이그제큐티브 비즈니스<\/td><td><b>86,000원<\/b><\/td><td>있음<\/td><td>사업장당 1회만 가입 가능<\/td><\/tr>\n<\/table><\/div>\n<p>이미 회원인 분이 중간에 등급을 올릴 때는 <b>업그레이드 비용<\/b>을 냅니다. 골드스타는 <b>43,000원<\/b>, 비즈니스는 <b>48,000원<\/b>이 추가되고, <b>현재 회원권 만기까지 남은 개월 수에 비례해<\/b> 계산됩니다(1원 단위 절사). 예를 들어 만기까지 6개월 남았다면 골드스타는 <b>43,000 × 6/12 = 21,500원<\/b>만 내면 됩니다. 다음 갱신 때부터는 <b>86,000원 전액<\/b>이 청구됩니다.<\/p>\n<div class=\"warn\"><b>⚠️ 업그레이드 전에 산 물건은 적립되지 않습니다<\/b><p style=\"margin:6px 0 0\">약관에 \"업그레이드 이전 구매하신 상품은 이그제큐티브 2% 리워드를 적립하실 수 없습니다\"라고 명시돼 있습니다. <b>적립은 업그레이드한 당일부터<\/b> 시작됩니다. \"이번 달에 큰 걸 샀으니 지금 올려서 소급받자\"는 통하지 않습니다.<\/p><\/div>\n<p>가족카드는 <b>1매가 연회비에 포함<\/b>돼 있습니다. 대상은 <b>본 회원의 배우자 또는 동거인<\/b>으로, <b>주민등록상 같은 세대에 사는 만 19세 이상 1인<\/b>입니다. 발급할 때 본 회원과 가족 회원 <b>둘 다 법정 신분증<\/b>(주민등록증·운전면허증·여권 등)을 제시해야 합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 손익분기 계산 — 연 215만 원<\/h2>\n<p>이그제큐티브의 유일한 금전적 혜택은 <b>구매금액의 2% 리워드<\/b>입니다(연간 최대 120만 원). 그러니 계산은 단순합니다.<\/p>\n<div class=\"tip\"><b>🧮 손익분기 공식<\/b><p style=\"margin:6px 0 0\"><b>(이그제큐티브 연회비 − 일반 연회비) ÷ 0.02 = 본전이 되는 연간 구매액<\/b><\/p>\n<ul style=\"margin:10px 0 0\">\n<li><b>개인(골드스타)<\/b>: (86,000 − 43,000) ÷ 0.02 = <b>연 2,150,000원<\/b> → 월 약 <b>179,000원<\/b><\/li>\n<li><b>사업자(비즈니스)<\/b>: (86,000 − 38,000) ÷ 0.02 = <b>연 2,400,000원<\/b> → 월 <b>200,000원<\/b><\/li>\n<\/ul><\/div>\n<p>코스트코가 공식 홈페이지에 올려 둔 적립 예시표도 같은 계산을 보여 줍니다. 아래 표는 코스트코 코리아 이그제큐티브 멤버십 안내 페이지에 실린 <b>공식 예시<\/b>를 그대로 옮긴 것입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>월 구매금액<\/th><th>연 구매금액<\/th><th>연간 예상 리워드<\/th><th>골드스타 대비(차액 43,000원)<\/th><\/tr>\n<tr><td>200,000원<\/td><td>2,400,000원<\/td><td>48,000원<\/td><td>+5,000원 (겨우 본전)<\/td><\/tr>\n<tr><td>500,000원<\/td><td>6,000,000원<\/td><td>120,000원<\/td><td>+77,000원<\/td><\/tr>\n<tr><td>1,000,000원<\/td><td>12,000,000원<\/td><td>240,000원<\/td><td>+197,000원<\/td><\/tr>\n<tr><td>2,500,000원<\/td><td>30,000,000원<\/td><td>600,000원<\/td><td>+557,000원<\/td><\/tr>\n<tr><td>5,000,000원<\/td><td>60,000,000원<\/td><td><b>1,200,000원(상한)<\/b><\/td><td>+1,157,000원<\/td><\/tr>\n<\/table><\/div>\n<p>표에서 보이듯 <b>월 20만 원 구매는 딱 본전 언저리<\/b>입니다. 리워드 48,000원에서 차액 43,000원을 빼면 <b>5,000원 남습니다.<\/b> 1년 내내 장을 봐서 5천 원을 버는 셈이라, 이 구간이라면 굳이 올릴 이유가 없습니다.<\/p>\n<p>또 하나. 적립 상한은 <b>연 120만 원<\/b>이고, 이는 <b>연 6,000만 원<\/b>을 사면 도달합니다. 그 위로는 아무리 더 사도 리워드가 늘지 않습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 실효 적립률은 2%가 아니다<\/h2>\n<p>여기가 이 글에서 가장 중요한 대목입니다. 약관에는 이렇게 적혀 있습니다.<\/p>\n<p style=\"background:#f7f9fc;border-left:4px solid #2EB67D;padding:10px 14px;margin:0 0 14px\">\"리워드는 <b>부가세와 할인쿠폰 금액을 제외한 구매액의 2%<\/b>이고…\"<\/p>\n<p>코스트코 가격표는 <b>부가세가 포함된 금액<\/b>입니다. 따라서 <b>과세 상품<\/b>을 샀다면 결제한 금액에서 부가세(1/11)를 뺀 뒤 2%가 붙습니다. 결제액 기준으로 환산하면 이렇습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>결제액 기준 실효 적립률<\/th><th>골드스타 대비 손익분기<\/th><\/tr>\n<tr><td>전부 과세 상품인 경우<\/td><td>2% ÷ 1.1 = <b>약 1.82%<\/b><\/td><td><b>연 약 236만 원<\/b><\/td><\/tr>\n<tr><td>전부 면세(농축수산물 등)인 경우<\/td><td><b>2%<\/b><\/td><td>연 215만 원<\/td><\/tr>\n<\/table><\/div>\n<p>코스트코 장바구니는 보통 <b>정육·채소·과일 같은 면세 식품과 생활용품·가전 같은 과세 상품이 섞여<\/b> 있으므로, 실제 손익분기는 <b>연 215만~236만 원 사이<\/b>에 놓입니다. 안전하게 잡으려면 <b>\"연 230만 원, 월 20만 원 이상 꾸준히\"<\/b>를 기준으로 삼으면 됩니다.<\/p>\n<div class=\"tip\"><b>💡 내 실제 적립액 확인하는 법<\/b><p style=\"margin:6px 0 0\">추측할 필요 없습니다. 이미 이그제큐티브라면 <b>매장 회원데스크나 온라인몰 마이페이지<\/b>에서 현재까지 적립된 리워드 금액을 조회할 수 있습니다. 만료 1개월 전에는 안내도 옵니다. <b>작년 적립액이 43,000원을 넘지 못했다면<\/b> 올해는 골드스타로 내리는 것이 이득입니다(단, 아래 5번을 먼저 읽으세요).<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 리워드에서 빠지는 항목들<\/h2>\n<p>\"2%\"라는 숫자만 보고 계산하면 어긋납니다. 약관이 <b>적립 제외 항목<\/b>을 명시하고 있습니다.<\/p>\n<ul>\n<li><b>코스트코 연회비<\/b> 자체<\/li>\n<li><b>주류<\/b> — 와인·위스키를 코스트코에서 사시는 분이라면 이 금액은 통째로 빠집니다<\/li>\n<li><b>푸드코트<\/b> — 회원권을 확인하지 않는 계산대라 적립도, 리워드 사용도 안 됩니다<\/li>\n<li><b>코스트코 상품권, 기프트 회원권<\/b><\/li>\n<li><b>골드바<\/b>, 자선기부금, 자동차 배터리 장착 비용, 추가 배송비용<\/li>\n<li><b>애드온(Add-on) 회원이 구매한 내역<\/b> — 비즈니스 회원권에 추가된 애드온 회원은 이그제큐티브에 포함되지 않습니다<\/li>\n<li><b>환불한 물품<\/b>에 대한 적립분 (되돌려 회수됩니다)<\/li>\n<li>셀비지 품목, 코스트코가 적립 제외라고 명시해 판매하는 특별 지정 품목<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ 주류·푸드코트 비중이 크면 계산이 크게 흔들립니다<\/b><p style=\"margin:6px 0 0\">예를 들어 연 250만 원을 쓰는데 그중 <b>주류가 60만 원<\/b>이라면, 적립 대상은 190만 원입니다. 과세 기준 실효율 1.82%를 적용하면 <b>약 34,500원<\/b>이 적립돼 차액 43,000원에 <b>미치지 못합니다.<\/b> \"215만 원만 넘기면 된다\"가 아니라 <b>\"제외 항목을 뺀 금액이 215만 원을 넘어야 한다\"<\/b>가 정확합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 다운그레이드하면 적립금이 사라진다<\/h2>\n<p>이 항목 하나 때문에 손해 보는 분이 가장 많습니다. 약관 원문은 이렇습니다.<\/p>\n<p style=\"background:#f7f9fc;border-left:4px solid #c0442a;padding:10px 14px;margin:0 0 14px\">\"<b>리워드가 발행되기 전<\/b> 이그제큐티브 회원에서 일반 회원으로 다운그레이드 할 시 <b>이 시점까지 적립된 모든 리워드가 소멸됩니다.<\/b> … 다운그레이드 후 이그제큐티브 회원으로 다시 업그레이드 하더라도 <b>그 전에 적립된 리워드는 회복되지 않습니다.<\/b>\"<\/p>\n<p>여기서 '발행'의 시점이 핵심입니다. 리워드는 <b>회원권 만료일 3개월 전까지 쌓인 금액을 기준으로 발행<\/b>되고, 만료 1개월 전에 안내가 옵니다. 그러니 시간표는 이렇게 됩니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>내가 움직인 시점<\/th><th>적립된 리워드<\/th><th>낸 돈<\/th><\/tr>\n<tr><td>리워드 <b>발행 전<\/b>에 다운그레이드<\/td><td><b>전액 소멸<\/b><\/td><td>업그레이드 비용은 전액 환불<\/td><\/tr>\n<tr><td>리워드 <b>발행 후<\/b>에 다운그레이드·탈퇴<\/td><td>발행분은 살아 있음<\/td><td>연회비에서 리워드 발행액을 뺀 잔액이 있으면 환불<\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ \"안 쓸 것 같으니 지금 내려야지\"가 가장 비싼 실수입니다<\/b><p style=\"margin:6px 0 0\">만료 4개월 전에 \"올해는 별로 안 샀으니 골드스타로 내리자\"고 하면, <b>그때까지 쌓인 적립금이 그대로 사라집니다.<\/b> 등급을 내릴 생각이라면 <b>리워드가 발행된 뒤(만료 3개월 전 이후)<\/b>에 움직이거나, 아예 <b>갱신 시점에 등급을 바꾸는 것<\/b>이 안전합니다. 판단이 서지 않으면 회원데스크에서 <b>\"제 리워드가 발행됐나요?\"<\/b> 한마디만 물어보면 됩니다.<\/p><\/div>\n<p>발행된 리워드에도 조건이 붙습니다. <b>회원권을 갱신한 뒤<\/b> 한국 내 매장에서만 쓸 수 있고, <b>발행 후 12개월 안에 1회만<\/b> 사용 가능하며, 타인에게 <b>양도할 수 없고 현금 가치가 없습니다.<\/b> 푸드코트처럼 회원권을 확인하지 않는 계산대에서는 쓸 수 없습니다. 발행일 이후 만료일까지 새로 쌓이는 적립분은 <b>다음 해로 이월<\/b>돼 합산됩니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 결제는 현대카드 계열만 된다<\/h2>\n<p>처음 가는 분이 계산대에서 가장 당황하는 지점입니다. 코스트코 한국 매장에서 쓸 수 있는 결제수단은 <b>약관에 다음과 같이 한정<\/b>돼 있습니다.<\/p>\n<ul>\n<li>현금, 자기앞수표<\/li>\n<li><b>코스트코 리워드 현대카드 및 모든 현대 신용카드<\/b><\/li>\n<li><b>해외에서 발급된 비자(Visa)카드<\/b>, 해외 코스트코 코브랜드 카드<\/li>\n<\/ul>\n<p>약관은 곧바로 못을 박습니다. <b>\"타 신용카드는 사용이 불가합니다.\"<\/b> 국내에서 발급받은 삼성·신한·국민·롯데카드 등은 <b>매장 계산대에서 결제가 되지 않습니다.<\/b> 현대카드가 없다면 <b>현금이나 체크 결제 수단을 준비<\/b>하고 가셔야 합니다.<\/p>\n<div class=\"tip\"><b>💡 연회비 자동이체도 같은 제약을 받습니다<\/b><p style=\"margin:6px 0 0\">자동이체를 신청한 회원의 연회비는 <b>회원이 신청한 현대 신용카드 또는 CMS 계좌<\/b>로 결제됩니다. 한도 초과·잔액 부족 등으로 자동이체가 실패하면 <b>회원권은 만기일에 종료(정지)<\/b>됩니다. 카드를 해지하거나 계좌를 바꿨다면 만기 전에 등록 정보를 갱신해 두세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 동반 입장·가족카드는 몇 명까지<\/h2>\n<p>\"회원 카드 한 장으로 온 가족이 들어갈 수 있나\"는 자주 나오는 질문입니다. 약관 기준은 명확합니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>기준<\/th><\/tr>\n<tr><td>비회원 동반 입장<\/td><td>회원 외 <b>성인 2명까지<\/b><\/td><\/tr>\n<tr><td>상품 구입<\/td><td><b>회원만 가능<\/b> (동반자는 구입 불가)<\/td><\/tr>\n<tr><td>가족카드<\/td><td>배우자 또는 <b>주민등록상 같은 세대의 만 19세 이상 1인<\/b><\/td><\/tr>\n<tr><td>카드 대여·양도<\/td><td><b>불가<\/b> (회원카드는 코스트코의 재산)<\/td><\/tr>\n<\/table><\/div>\n<p>그 밖에 매장에서 지켜야 할 사항도 약관에 들어 있습니다. <b>입장할 때 회원카드를 제시<\/b>해야 하고, <b>나갈 때 영수증과 상품을 직원에게 제시<\/b>해야 합니다(계산 오류 확인과 재고 관리 목적). 매장 안에서는 <b>허가되지 않은 사진·동영상 촬영이 금지<\/b>되며, <b>반려동물은 시각장애인 도우미견 등 법으로 허용되는 경우를 제외하고 입장이 제한<\/b>됩니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 연회비 환불과 갱신 60일 규칙<\/h2>\n<p>연회비 환불 규정은 의외로 관대합니다. 이용약관 제8조 원문입니다.<\/p>\n<p style=\"background:#f7f9fc;border-left:4px solid #2EB67D;padding:10px 14px;margin:0 0 14px\">\"회원가입 후 회원으로서 만족하지 않을 경우 <b>언제든지 회원권 연회비를 전액 환불<\/b>해 드립니다.\"<\/p>\n<p>즉 <b>기간에 따른 일할 계산이 아니라 전액 환불<\/b>이 원칙입니다. 다만 이그제큐티브에서 탈퇴하는 경우에는, <b>이미 발행된 리워드 금액을 연회비에서 뺀 잔액<\/b>이 있을 때 그 잔액을 돌려받는 구조라는 점을 함께 보셔야 합니다.<\/p>\n<h3>갱신 시점 — 60일이 기준선<\/h3>\n<p>갱신은 언제 하느냐에 따라 <b>유효기간이 붙는 방식이 달라집니다.<\/b> 여기서 몇 달을 손해 볼 수 있습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>갱신 시점<\/th><th>새 유효기간<\/th><th>결과<\/th><\/tr>\n<tr><td>만기일로부터 <b>60일 이내<\/b><\/td><td><b>기존 만기월<\/b>부터 12개월 연장<\/td><td>공백 없이 이어짐<\/td><\/tr>\n<tr><td>만기일로부터 <b>60일 이후<\/b><\/td><td><b>갱신한 달<\/b>부터 12개월 연장<\/td><td>비워 둔 기간은 그대로 날아감<\/td><\/tr>\n<\/table><\/div>\n<p>가족카드와 애드온 카드는 <b>등록 시점과 관계없이 본 회원의 만기일<\/b>을 따릅니다. 그리고 만기가 지난 뒤 매장이나 온라인몰에서 처음 쇼핑할 때는 <b>연회비가 먼저 결제<\/b>됩니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 이런 분은 올리지 마세요<\/h2>\n<p>여기까지의 숫자를 사람 기준으로 바꾸면 판단이 쉬워집니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>상황<\/th><th>권장 등급<\/th><th>이유<\/th><\/tr>\n<tr><td>2인 가구·월 15만 원 안팎 장보기<\/td><td><b>골드스타<\/b><\/td><td>연 180만 원이면 적립 약 3만 원 — 차액 43,000원에 못 미침<\/td><\/tr>\n<tr><td>월 20만 원 전후, 주류를 자주 구입<\/td><td><b>골드스타<\/b><\/td><td>주류가 적립에서 빠져 본전 아래로 내려감<\/td><\/tr>\n<tr><td>4인 가구·월 25만 원 이상 꾸준히<\/td><td>이그제큐티브<\/td><td>제외 항목을 빼도 손익분기를 넘김<\/td><\/tr>\n<tr><td>가전·타이어 등 큰 구매 예정<\/td><td>이그제큐티브<\/td><td>단, <b>사기 전에<\/b> 업그레이드해야 적립됨<\/td><\/tr>\n<tr><td>1년에 몇 번만 가는 경우<\/td><td><b>골드스타<\/b><\/td><td>회비 자체를 다시 계산해 보는 편이 나음<\/td><\/tr>\n<tr><td>현대카드가 없고 현금 결제가 불편한 경우<\/td><td>가입 보류<\/td><td>계산대에서 결제 수단이 막힘<\/td><\/tr>\n<\/table><\/div>\n<p>정리하면 <b>\"제외 항목을 뺀 연간 구매액이 230만 원을 넘느냐\"<\/b> 한 줄입니다. 애매하면 <b>일단 골드스타로 1년을 지내 보고<\/b>, 영수증 합계를 확인한 뒤 다음 갱신 때 올리는 것이 손해가 없습니다. 업그레이드는 잔여 개월에 비례해 계산되므로 <b>중간에 올려도 불리하지 않습니다.<\/b><\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">공식 확인 페이지<\/h2>\n<p>연회비와 리워드 조건은 코스트코가 <b>임의로 변경할 수 있다<\/b>고 약관에 명시돼 있습니다(약관 제11조). 가입·업그레이드 전에 아래 공식 페이지에서 현재 금액을 직접 확인하세요.<\/p>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.costco.co.kr/membership\" target=\"_blank\" rel=\"nofollow\">▸ 코스트코 코리아 — 통합 회원가입(등급별 연회비)<\/a><a href=\"https://www.costco.co.kr/ExecutiveMembership\" target=\"_blank\" rel=\"nofollow\">▸ 코스트코 코리아 — 이그제큐티브 멤버십(2% 리워드 조건·예시표)<\/a><a href=\"https://www.costco.co.kr/termsAndConditions\" target=\"_blank\" rel=\"nofollow\">▸ 코스트코 코리아 — 이용약관(연회비 환불·갱신·동반 입장)<\/a><a href=\"https://www.costco.co.kr/renew\" target=\"_blank\" rel=\"nofollow\">▸ 코스트코 코리아 — 회원권 갱신<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">골드스타 <b>43,000원<\/b>, 이그제큐티브 <b>86,000원<\/b>, 차액은 <b>43,000원<\/b>입니다. 2% 적립으로 이 차액을 메우려면 <b>연 215만 원<\/b>을 사야 하고, 부가세와 주류·푸드코트·상품권이 빠지는 것을 감안하면 실질 기준선은 <b>연 230만 원 안팎<\/b>입니다. 그 아래라면 골드스타가 이득입니다. 그리고 등급을 내릴 때는 <b>리워드가 발행되기 전에 다운그레이드하면 적립금이 전액 소멸<\/b>한다는 점을 반드시 기억하세요. 이 한 가지가 연회비 차액보다 큰 금액을 좌우합니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월<\/b> 기준(확인일 2026년 8월 12일)이며, 연회비·리워드 조건은 변경될 수 있 lor:#8a97ab;text-decoration:none;margin:2px 0 6px}\n.lsg .warn{background:#fff4f2;border:1px solid #f6cfc6;border-radius:12px;padding:14px 18px;margin:14px 0}\n.lsg .warn b{display:block;font-size:15px;color:#c0442a;margin-bottom:6px}\n.lsg .tip{background:#f2f8ff;border:1px solid #cfe2f6;border-radius:12px;padding:14px 18px;margin:14px 0}\n.lsg .tip b{display:block;font-size:15px;color:#1b6fc2;margin-bottom:6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">세금·금융<\/span>\n<p>2학기 등록금 고지서를 받아 든 집에서 가장 많이 하는 말이 있습니다. <b>\"국가장학금 받았는데도 몇 백이 모자란다.\"<\/b> 그 차액을 메우는 창구가 <b>학자금대출<\/b>입니다. 그런데 신청 화면에 들어가면 첫 화면부터 갈림길이 나옵니다. <b>취업 후 상환<\/b>과 <b>일반 상환<\/b>, 둘 중 하나를 골라야 합니다.<\/p>\n<p>먼저 헷갈리는 것부터 정리하겠습니다. <b>국가장학금은 안 갚는 돈이고, 학자금대출은 갚는 돈입니다.<\/b> 둘은 신청 창구(한국장학재단)만 같을 뿐 완전히 다른 제도이고, 장학금을 받았더라도 대출은 따로 신청해야 합니다.<\/p>\n<p>이 글은 한국장학재단 공식 페이지에 <b>2026년도 2학기<\/b> 기준으로 게시된 내용만 가지고 <b>①신청 기간과 금리 ②취업 후 상환과 일반 상환 중 뭘 골라야 하나 ③등록금·생활비를 얼마까지 빌릴 수 있나 ④언제부터 얼마씩 갚게 되나 ⑤신청했는데 거절되는 이유<\/b>를 정리했습니다. 확인일은 <b>2026년 8월 13일<\/b>입니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 2026년 2학기 신청 기간과 금리 (1.7%)<\/a><a href=\"#sec2\">2. 취업 후 상환 vs 일반 상환 — 한눈에 비교<\/a><a href=\"#sec3\">3. 나는 어느 쪽을 골라야 하나 (판단표)<\/a><a href=\"#sec4\">4. 얼마까지 빌릴 수 있나 — 등록금·생활비 한도<\/a><a href=\"#sec5\">5. 취업 후 상환은 언제부터 얼마를 갚나 (계산 예시)<\/a><a href=\"#sec6\">6. 일반 상환은 언제부터 갚나 — 거치기간의 함정<\/a><a href=\"#sec7\">7. 신청했는데 거절되는 이유 8가지<\/a><a href=\"#sec8\">8. 신청 전에 꼭 확인할 것<\/a><a href=\"#sec9\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec3\">👉 내 상황에서 뭘 골라야 하는지 바로 보기<\/a>\n\n<h2 id=\"sec1\">1. 2026년 2학기 신청 기간과 금리 (1.7%)<\/h2>\n<p>2026년도 2학기 학자금대출은 <b>2026년 7월 1일(수) 9시에 이미 열렸고<\/b>, 마감은 <b>11월 17일(화) 18시<\/b>입니다. 실행(돈이 실제로 나가는 절차)은 하루 더 여유가 있습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>신청<\/th><th>실행<\/th><\/tr>\n<tr><td>등록금대출(일시납·분납)<br>생활비대출<\/td><td><b>7. 1.(수) 9시 ~ 11. 17.(화) 18시<\/b><\/td><td>7. 1.(수) 9시 ~ 11. 18.(수) 17시<\/td><\/tr>\n<tr><td>취업 후 상환 전환대출<\/td><td>7. 1.(수) 9시 ~ 11. 18.(수) 18시<\/td><td>7. 1.(수) 9시 ~ 11. 19.(목) 17시<\/td><\/tr>\n<tr><td>학점은행제 학습자 학자금대출<\/td><td>7. 1.(수) 9시 ~ 11. 17.(화) 18시<\/td><td>7. 1.(수) 9시 ~ 11. 18.(수) 17시<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li><b>신청 가능 시간은 9시~24시<\/b>입니다. 단 <b>마감 당일은 18시까지<\/b>입니다.<\/li>\n<li><b>주말·공휴일에도 신청은 됩니다.<\/b> 다만 <b>실행은 주말·공휴일에 안 됩니다.<\/b><\/li>\n<li>재단은 <b>대학 등록마감일로부터 약 8주 전 신청<\/b>을 권장합니다. 학자금 지원구간(소득분위)을 산정하는 데 시간이 걸리기 때문입니다.<\/li>\n<\/ul>\n<p>금리는 <b>2026년도 2학기 기준 1.7%<\/b>입니다. 두 대출의 <b>숫자는 같지만 성격이 다릅니다.<\/b><\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>금리 유형<\/th><th>2026년 2학기 금리<\/th><\/tr>\n<tr><td>일반 상환 학자금대출<\/td><td>고정금리<\/td><td><b>1.7%<\/b><\/td><\/tr>\n<tr><td>취업 후 상환 학자금대출<br>(AI학업장려 학자금대출 포함)<\/td><td>변동금리<\/td><td><b>1.7%<\/b><\/td><\/tr>\n<\/table><\/div>\n<div class=\"tip\"><b>💡 고정과 변동, 뭐가 다른가<\/b><p style=\"margin:6px 0 0\"><b>일반 상환은 고정금리<\/b>라 오늘 1.7%로 받으면 <b>그 대출은 끝까지 1.7%<\/b>입니다. <b>취업 후 상환은 변동금리<\/b>라 매 학기 교육부 장관이 고시하는 금리가 새로 적용됩니다. 지금은 둘 다 1.7%지만, 10년 뒤까지 같다는 뜻은 아닙니다.<\/p><\/div>\n<div class=\"warn\"><b>⚠️ 8월 13일 현재, 마감까지 3개월 남았습니다<\/b><p style=\"margin:6px 0 0\">기간은 넉넉해 보이지만 <b>대학 등록금 수납 마감<\/b>이 먼저 옵니다. 등록금대출은 <b>대학·은행별 수납 마감기간 안에 실행<\/b>해야 하므로, 재단 마감일(11/17)만 보고 미루면 <b>학교 등록이 먼저 막힙니다.<\/b><\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 취업 후 상환 vs 일반 상환 — 한눈에 비교<\/h2>\n<p>이름이 곧 설명입니다. <b>취업 후 상환(ICL)<\/b>은 <b>소득이 생긴 뒤부터<\/b> 갚고, <b>일반 상환<\/b>은 <b>대출받은 때부터 정해진 스케줄대로<\/b> 갚습니다. 나머지 차이는 아래 표에 모았습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>취업 후 상환(ICL)<\/th><th>일반 상환<\/th><\/tr>\n<tr><td>금리(2026-2)<\/td><td>1.7% (변동)<\/td><td>1.7% (고정)<\/td><\/tr>\n<tr><td>나이 제한<\/td><td>학부 <b>만 35세 이하<\/b><br>대학원 만 40세 이하<\/td><td>학부·대학원 <b>만 55세 이하<\/b><\/td><\/tr>\n<tr><td>성적 기준(재학생)<\/td><td>직전학기 <b>12학점 이상<\/b><br>(백분위 성적 무관)<\/td><td>직전학기 <b>C학점(70/100) 이상<\/b><br>+ 12학점 이상<\/td><\/tr>\n<tr><td>소득구간 제한<\/td><td>등록금 없음<br>생활비는 <b>8구간 이하<\/b><\/td><td><b>없음<\/b><\/td><\/tr>\n<tr><td>생활비 한도<\/td><td>연 <b>300만원<\/b><\/td><td>연 <b>200만원<\/b><\/td><\/tr>\n<tr><td>갚기 시작하는 시점<\/td><td>연간소득이 <b>상환기준소득<\/b>을 넘을 때<\/td><td>대출 직후부터 <b>매월 이자<\/b>, 거치 끝나면 원금<\/td><\/tr>\n<tr><td>소득이 없으면<\/td><td><b>안 갚아도 됨<\/b>(이자는 쌓임)<\/td><td>소득과 무관하게 <b>갚아야 함<\/b><\/td><\/tr>\n<\/table><\/div>\n<p>연령 기준에는 예외가 있습니다. 학부생이라도 <b>전문대학 계약학과(채용조건형)<\/b>이나 <b>성인·평생교육학과 학위과정(재직자 특별전형, 학사학위 전공심화과정)<\/b>에 다니는 재직자는 <b>만 45세 이하<\/b>까지 취업 후 상환을 쓸 수 있습니다. 다만 <b>4대 보험 미가입자는 재직 증빙 자체가 불가<\/b>합니다.<\/p>\n<p>일반 상환의 만 55세 기준에도 예외가 있습니다. <b>만 55세 이전에 입학해 자퇴·제적 없이 학업을 이어가는 경우 만 59세까지<\/b> 일반 상환 학자금대출이 가능합니다. 늦게 대학에 진학한 분들이 자주 놓치는 조항입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 나는 어느 쪽을 골라야 하나 (판단표)<\/h2>\n<p>둘 다 자격이 된다면 <b>금리가 같으므로 선택 기준은 \"언제 갚느냐\" 하나<\/b>입니다. 상황별로 정리하면 이렇습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>상황<\/th><th>권장<\/th><th>이유<\/th><\/tr>\n<tr><td>졸업 후 취업 시기가 불확실하다<\/td><td><b>취업 후 상환<\/b><\/td><td>소득이 기준 아래면 상환이 유예됨<\/td><\/tr>\n<tr><td>학부생인데 만 35세를 넘었다<\/td><td><b>일반 상환<\/b><\/td><td>취업 후 상환은 자격 자체가 안 됨<\/td><\/tr>\n<tr><td>학부생·소득구간 9구간 이상인데 생활비가 필요<\/td><td><b>일반 상환<\/b><\/td><td>취업 후 상환 생활비는 8구간 이하만 가능<\/td><\/tr>\n<tr><td>재학 중 이미 소득이 상당하다<\/td><td>일반 상환 검토<\/td><td>취업 후 상환도 <b>재학 중 의무상환<\/b>이 발생함<\/td><\/tr>\n<tr><td>졸업하자마자 빠르게 갚아 이자를 줄이고 싶다<\/td><td>어느 쪽이든 가능<\/td><td>둘 다 <b>중도상환수수료 없음<\/b><\/td><\/tr>\n<tr><td>소득구간 산정이 아직 안 끝났는데 등록 마감이 코앞<\/td><td>사전승인<\/td><td>일반 상환(등록금·생활비) 또는 취업 후 상환(등록금)으로 먼저 승인 가능<\/td><\/tr>\n<\/table><\/div>\n<div class=\"tip\"><b>💡 먼저 일반 상환으로 받았어도 되돌릴 수 있습니다<\/b><p style=\"margin:6px 0 0\">일반 상환을 실행한 뒤 취업 후 상환 자격을 갖추게 되면, <b>해당 학기 전환대출 기간(2026-2학기는 11/18 18시까지 신청)<\/b> 안에 <b>취업 후 상환 전환대출<\/b>로 바꿀 수 있습니다. 급해서 일반 상환으로 받았더라도 학기 안에 정리할 여지가 있습니다.<\/p><\/div>\n<div class=\"warn\"><b>⚠️ \"취업 후 상환 = 취업할 때까지 무이자\"가 아닙니다<\/b><p style=\"margin:6px 0 0\">가장 흔한 오해입니다. 재단 안내에는 <b>\"대출 실행시점부터 대출잔액(원금)에 대해 단리로 일할 계산되어 이자가 발생\"<\/b>한다고 되어 있고, <b>상환이 유예되는 동안에도 이자는 붙습니다.<\/b> 유예되는 것은 <b>납부 시점<\/b>이지 이자 자체가 아닙니다. 다만 <b>생활비대출<\/b>에는 저소득 구간 무이자 지원이 있습니다(아래 4번 참고).<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 얼마까지 빌릴 수 있나 — 등록금·생활비 한도<\/h2>\n<h3>등록금 — 한 학기는 전액, 대신 평생 총액 한도가 있다<\/h3>\n<p>등록금은 <b>해당 학기 등록금 수납원장에 명시된 금액<\/b>을 빌릴 수 있습니다. 학생회비는 포함되지만 <b>기숙사비·통학버스비 같은 생활비 성격의 경비는 제외<\/b>됩니다. 다만 <b>1인당 총 한도<\/b>가 따로 있고, 이 한도는 <b>학부와 대학원을 누적<\/b>해서 계산합니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>1인당 대출한도(등록금 + 어학연수비)<\/th><\/tr>\n<tr><td>일반대학(2·4년제)<\/td><td><b>4,000만원<\/b><\/td><\/tr>\n<tr><td>5·6년제 대학 및 일반/특수 대학원<\/td><td><b>6,000만원<\/b><\/td><\/tr>\n<tr><td>의·치의·한의 계약 대학(원) 및 전문대학원<\/td><td><b>9,000만원<\/b><\/td><\/tr>\n<\/table><\/div>\n<p>이 한도에는 <b>취업 후 상환으로 받은 금액도 함께 포함<\/b>됩니다. 즉 \"일반 상환 4천만원 + 취업 후 상환 4천만원\"처럼 따로 쌓이지 않습니다.<\/p>\n<h3>생활비 — 여기서 두 대출이 갈린다<\/h3>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>연간 한도<\/th><th>1회 실행 한도<\/th><th>최소 단위<\/th><\/tr>\n<tr><td>취업 후 상환 생활비대출<\/td><td><b>300만원<\/b><\/td><td>학기당 2회 한도 내에서 <b>150만원<\/b>까지<\/td><td>10만원<\/td><\/tr>\n<tr><td>일반 상환 생활비대출<\/td><td><b>200만원<\/b><\/td><td>학기당 2회 한도 내에서 <b>100만원<\/b>까지<\/td><td>10만원<\/td><\/tr>\n<\/table><\/div>\n<div class=\"tip\"><b>🧮 계산 예시 — 4년이면 생활비 400만원 차이<\/b>\n<ul style=\"margin:6px 0 0\">\n<li>취업 후 상환: 연 300만원 × 4년 = <b>1,200만원<\/b><\/li>\n<li>일반 상환: 연 200만원 × 4년 = <b>800만원<\/b><\/li>\n<li>차이 <b>400만원<\/b> — 등록금 한도(4,000만원)와 별개로 벌어지는 금액입니다.<\/li>\n<\/ul>\n<p style=\"margin:8px 0 0\">생활비는 <b>등록금 총 한도(4천만원 등)에 포함되지 않습니다.<\/b> 별도로 계산됩니다.<\/p><\/div>\n<p>저소득 구간에는 생활비 이자 지원이 있습니다. 다만 <b>재단 페이지마다 표현이 다릅니다.<\/b> 취업 후 상환 생활비대출 「대출규모」 페이지에는 <b>\"소득 3구간 이하는 유예기간 동안 무이자\"<\/b>로, 「상환안내」 페이지에는 <b>\"학자금 지원 1~4구간은 의무상환 시작 전 무이자\"<\/b>로 적혀 있습니다. 본인 구간이 경계선(3~4구간)이라면 <b>신청 전 재단 콜센터(1599-2000)나 공식 페이지에서 반드시 확인<\/b>하세요. 이 글에서는 어느 한쪽으로 단정하지 않겠습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 취업 후 상환은 언제부터 얼마를 갚나 (계산 예시)<\/h2>\n<p>취업 후 상환의 핵심은 <b>상환기준소득<\/b>이라는 한 줄입니다. <b>연간소득금액이 이 기준을 넘는 해부터<\/b> 국세청이 의무상환액을 고지합니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>귀속연도<\/th><th>상환기준소득(연간소득금액)<\/th><th>총급여 환산<\/th><\/tr>\n<tr><td>2024년<\/td><td>1,752만원<\/td><td>2,679만원<\/td><\/tr>\n<tr><td><b>2025년<\/b><\/td><td><b>1,898만원<\/b><\/td><td><b>2,851만원<\/b><\/td><\/tr>\n<\/table><\/div>\n<p>상환기준소득은 교육부 장관이 <b>기준 중위소득과 물가상승률 등을 감안해 매년 고시<\/b>합니다. 위 표는 재단이 공개한 <b>2024·2025년 귀속 확정치<\/b>이며, <b>2026년 귀속 기준은 아직 이 페이지에 게시되지 않았습니다.<\/b> 올해 소득으로 계산할 때는 고시 후 다시 확인하세요.<\/p>\n<h3>의무상환액 공식<\/h3>\n<div class=\"tip\"><b>🧮 (연간소득금액 − 상환기준소득) × 상환율<\/b>\n<ul style=\"margin:6px 0 0\">\n<li>상환율: <b>학부 대출 20% · 대학원 대출 25%<\/b><\/li>\n<li>근로·사업소득은 해당 귀속연도에 <b>자발적으로 갚은 금액을 차감<\/b>합니다.<\/li>\n<li><b>최소부담의무상환액 연 36만원<\/b> — 기준을 넘겼다면 계산값이 이보다 적어도 <b>36만원은 갚아야<\/b> 합니다.<\/li>\n<\/ul><\/div>\n<p>2025년 귀속 기준(1,898만원)으로 학부 대출자를 계산해 보면 이렇습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>연간소득금액<\/th><th>계산<\/th><th>연간 의무상환액<\/th><th>월 환산<\/th><\/tr>\n<tr><td>1,800만원<\/td><td>기준 미달<\/td><td><b>0원<\/b>(유예)<\/td><td>—<\/td><\/tr>\n<tr><td>2,000만원<\/td><td>(2,000−1,898)×20% = 20.4만원<\/td><td><b>36만원<\/b>(최소부담 적용)<\/td><td>3만원<\/td><\/tr>\n<tr><td>2,500만원<\/td><td>(2,500−1,898)×20% = 120.4만원<\/td><td><b>약 120만원<\/b><\/td><td>약 10만원<\/td><\/tr>\n<tr><td>3,500만원<\/td><td>(3,500−1,898)×20% = 320.4만원<\/td><td><b>약 320만원<\/b><\/td><td>약 27만원<\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 표의 입력값은 '총급여'가 아니라 '연간소득금액'입니다<\/b><p style=\"margin:6px 0 0\">근로소득자의 <b>연간소득금액 = 총급여 − 근로소득공제<\/b>입니다. 재단 기준으로 <b>연간소득금액 1,898만원이 총급여 2,851만원<\/b>에 해당합니다. 명세서에 찍힌 총급여를 그대로 위 표에 넣으면 상환액이 실제보다 크게 나옵니다. 본인 금액은 <b>국세청 취업 후 학자금 상환 홈페이지의 간편 계산<\/b>으로 확인하세요.<\/p><\/div>\n<p style=\"font-size:15px;color:#555\">※ 위 표는 재단이 고시한 상환기준소득·상환율을 그대로 적용해 계산한 <b>예시<\/b>입니다. 실제 고지액은 국세청이 산정하며, <b>국세청 취업 후 학자금 상환 홈페이지에서 간편 계산<\/b>을 제공합니다.<\/p>\n<h3>재단이 공개한 원리금 예시 — 1,600만원 빌리면 얼마가 되나<\/h3>\n<p>재단 상환안내 페이지에는 <b>공식 계산 예시표<\/b>가 실려 있습니다. 2022년 3학년부터 <b>매 학기 400만원씩 네 학기, 총 1,600만원<\/b>을 빌리고 금리 1.7%가 적용된 경우입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>시점<\/th><th>내용<\/th><th>금액<\/th><\/tr>\n<tr><td>22년 1학기 ~ 23년 2학기<\/td><td>학기당 400만원씩 대출<\/td><td>원금 <b>1,600만원<\/b><\/td><\/tr>\n<tr><td>24년(구직기) ~ 25년(취업)<\/td><td>상환 유예 중에도 이자 발생<\/td><td>이자 누계 <b>88.4만원<\/b><\/td><\/tr>\n<tr><td><b>2026년 1월 1일 기준<\/b><\/td><td>의무상환 개시 직전 원리금 총액<\/td><td><b>약 1,688만원<\/b><\/td><\/tr>\n<\/table><\/div>\n<p>4년 동안 붙은 이자가 <b>88만원<\/b>입니다. 시중 신용대출과 비교하면 낮지만, <b>\"안 갚아도 되는 기간\"에도 원리금은 늘어난다<\/b>는 사실은 숫자로 확인해 두는 편이 좋습니다. 여유가 생기면 <b>중도상환수수료 없이<\/b> 언제든 자발적 상환이 가능합니다.<\/p>\n<h3>이런 경우에도 상환 의무가 생깁니다<\/h3>\n<ul>\n<li><b>재학 중이라도<\/b> 연간소득금액이 상환기준소득을 넘으면 의무상환이 발생합니다.<\/li>\n<li><b>퇴직소득<\/b>: 퇴직소득금액이 <b>1천만원을 초과<\/b>하면 그때부터 퇴직소득금액 × 상환율로 원천공제됩니다.<\/li>\n<li><b>상속·증여<\/b>: 과세표준 × 상환율로 부과되며, 이 경우에는 <b>최소부담의무상환액을 적용하지 않습니다.<\/b><\/li>\n<li>반대로 <b>퇴직·휴직·폐업<\/b>으로 전년도 소득이 기준 아래로 내려가면 <b>다시 유예<\/b>됩니다(재유예).<\/li>\n<li><b>65세 이상<\/b>으로 국민연금소득 외 소득이 없고 대통령령이 정하는 소득인정액 이하이면 <b>면제<\/b>가 가능합니다.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 일반 상환은 언제부터 갚나 — 거치기간의 함정<\/h2>\n<p>일반 상환은 <b>거치기간(이자만 납부) + 상환기간(원금과 이자를 함께 납부)<\/b>으로 굴러갑니다. 즉 <b>졸업 전에도 매월 이자를 냅니다.<\/b> 취업 후 상환과 가장 크게 갈리는 지점입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>거치기간<\/th><th>상환기간<\/th><th>합계<\/th><\/tr>\n<tr><td>대학생·대학원생, 의·치의·한의 전문대학원생<\/td><td>최대 10년<\/td><td>최대 10년<\/td><td><b>최장 20년<\/b><\/td><\/tr>\n<tr><td>전문대학원생(경영 등)<\/td><td>최대 7년<\/td><td>최대 10년<\/td><td><b>최장 17년<\/b><\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 나이가 많으면 기간이 줄어듭니다 — 만학도가 놓치는 조항<\/b>\n<p style=\"margin:6px 0 0\">최장 대출기간은 <b>60 − 차주연령<\/b>으로 제한됩니다. 차주연령은 <b>대출연도 − 출생연도 − 1<\/b>로 계산합니다.<\/p>\n<p style=\"margin:8px 0 0\">재단이 든 예시: <b>차주 연령이 55세라면 최장 대출기간은 5년<\/b>이고, 거치기간은 <b>4년 이내<\/b>에서만 고를 수 있습니다. 20년에 걸쳐 나눠 갚는 그림을 그리고 있었다면 계획을 다시 짜야 합니다.<\/p><\/div>\n<p>거치기간은 <b>남은 재학연수 + 군 복무기간(군 미필자에 한함)<\/b> 범위에서 연 단위로 고릅니다. 예를 들어 4년제 3학년 2학기 재학생은 3·4학년 2년을 남은 재학연수로 봅니다. 상환 방식은 <b>원금균등분할상환<\/b>과 <b>원리금균등분할상환<\/b> 중에서 고를 수 있습니다.<\/p>\n<p>또 하나. 일반 상환 학자금대출에는 <b>이자 지원이 없습니다.<\/b> 재단 페이지에 \"이자지원 없음\"이라고 명시돼 있습니다. 저소득 구간 이자 지원은 취업 후 상환 생활비대출 쪽 이야기입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 신청했는데 거절되는 이유 8가지<\/h2>\n<p>자격 미달은 대부분 <b>신청 화면이 아니라 심사 뒤에<\/b> 통보됩니다. 등록 마감이 임박한 상태에서 거절되면 대응할 시간이 없으므로, 아래 항목은 신청 전에 미리 확인하는 편이 안전합니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>거절 사유<\/th><th>내용<\/th><th>대응<\/th><\/tr>\n<tr><td><b>1. 성적 미달<\/b><\/td><td>일반 상환은 직전학기 <b>C학점(70/100) 미만<\/b>이면 불가<\/td><td>취업 후 상환은 성적 무관(이수학점만 봄)<\/td><\/tr>\n<tr><td><b>2. 이수학점 미달<\/b><\/td><td>직전학기 <b>12학점 미만<\/b><\/td><td>학교 최소 이수학점이 12학점 미만이면 학사규정 적용<\/td><\/tr>\n<tr><td><b>3. 학점은행제 학점<\/b><\/td><td>학점은행제로 딴 학점은 <b>이수학점으로 불인정<\/b>(시간제·전일제 모두)<\/td><td>학점은행제 학습자 전용 대출 별도 확인<\/td><\/tr>\n<tr><td><b>4. 졸업유예<\/b><\/td><td>졸업요건을 <b>모두 충족했는데<\/b> 재학연한 내에서 졸업을 유예한 경우 <b>지원 불가<\/b><\/td><td>졸업요건 미충족으로 등록이 필요한 경우는 가능<\/td><\/tr>\n<tr><td><b>5. 연령 초과<\/b><\/td><td>취업 후 상환 학부 만 35세 / 일반 상환 만 55세 초과<\/td><td>재직자 학위과정(만 45세)·계속학업(만 59세) 예외 확인<\/td><\/tr>\n<tr><td><b>6. 소득구간 미산정<\/b><\/td><td>가구원 정보제공 동의가 안 끝나 구간이 안 나온 상태<\/td><td><b>사전승인<\/b>으로 일반 상환(등록금·생활비) 또는 취업 후 상환(등록금) 이용<\/td><\/tr>\n<tr><td><b>7. 대출제한대상자<\/b><\/td><td><b>중복지원<\/b>, 부실자료 제출, <b>등록금 및 대출 차액 미상환<\/b><\/td><td>사유가 해소될 때까지 제한 — 먼저 정리해야 함<\/td><\/tr>\n<tr><td><b>8. 학교가 제한대학<\/b><\/td><td>학자금 지원 제한 대학 <b>일부 제한<\/b>=취업 후 상환 100% 제한, <b>전부 제한<\/b>=둘 다 100% 제한<\/td><td>신·편입생 대상 — 학교에 확인<\/td><\/tr>\n<\/table><\/div>\n<p>이 밖에 <b>「금융거래 안심차단」에 등록된 경우<\/b>에도 대출이 제한됩니다. 보이스피싱 예방으로 본인이 신청해 둔 차단이 대출을 막는 사례이므로, 가입해 둔 기억이 있다면 미리 해제 여부를 확인하세요.<\/p>\n<p>국적 요건도 있습니다. <b>주민등록상 해외이주 신고자·영주권자·재외국민은 제외<\/b>되지만, <b>국내에 거주 중인 재외국민은 일반 상환 학자금대출이 허용<\/b>됩니다. 해외이주를 포기했거나 영주귀국 후 주민등록을 했다면 대출이 가능합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 신청 전에 꼭 확인할 것<\/h2>\n<ol>\n<li><b>가구원 정보제공 동의부터.<\/b> 소득구간 산정이 늦어지는 가장 큰 원인입니다. 재단도 \"한국사회보장정보원 운영 일정에 따라 재산조사기간이 지연될 수 있다\"고 안내합니다.<\/li>\n<li><b>학교 등록금 수납 마감일을 먼저 적어 두세요.<\/b> 재단 마감(11/17)이 아니라 <b>학교 마감<\/b>이 실질적인 데드라인입니다.<\/li>\n<li><b>생활비는 10만원 단위로, 학기당 2회까지<\/b> 나눠 실행할 수 있습니다. 한 번에 다 받지 않아도 됩니다.<\/li>\n<li><b>부분대출이 됩니다.<\/b> 등록금 전액이 아니라 본인 부담금을 빼고 필요한 만큼만 빌릴 수 있습니다.<\/li>\n<li><b>중도상환수수료는 없습니다.<\/b> 여유가 생기면 언제든 갚아 이자를 줄이세요.<\/li>\n<li><b>국가장학금과 중복 신청을 잊지 마세요.<\/b> 장학금은 갚지 않는 돈이므로 먼저 챙긴 뒤 부족분만 대출로 메우는 순서가 맞습니다.<\/li>\n<\/ol>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">공식 확인 페이지<\/h2>\n<p>금리와 상환기준소득은 <b>학기마다·해마다 바뀝니다.<\/b> 신청 직전에 아래 공식 페이지에서 현재 값을 직접 확인하세요.<\/p>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.kosaf.go.kr/ko/tuition.do?pg=tuition13\" target=\"_blank\" rel=\"nofollow\">▸ 한국장학재단 — 학자금대출 금리 안내(학기별 조회)<\/a><a href=\"https://www.kosaf.go.kr/ko/tuition.do?pg=tuition04_01_01&amp;ttab1=2\" target=\"_blank\" rel=\"nofollow\">▸ 한국장학재단 — 2026년도 2학기 학자금대출 일정<\/a><a href=\"https://www.kosaf.go.kr/ko/tuition.do?pg=tuition04_01_01&amp;ttab1=1\" target=\"_blank\" rel=\"nofollow\">▸ 한국장학재단 — 취업 후 상환 학자금대출 신청대상(지원자격)<\/a><a href=\"https://www.kosaf.go.kr/ko/tuition.do?pg=tuition04_02_01&amp;ttab1=1\" target=\"_blank\" rel=\"nofollow\">▸ 한국장학재단 — 일반 상환 학자금대출 신청대상(지원자격)<\/a><a href=\"https://www.kosaf.go.kr/ko/tuition.do?pg=tuition05_01_03\" target=\"_blank\" rel=\"nofollow\">▸ 한국장학재단 — 의무적 상환(상환기준소득·상환율·최소부담의무상환액)<\/a><a href=\"https://www.icl.go.kr/\" target=\"_blank\" rel=\"nofollow\">▸ 국세청 취업 후 학자금 상환 — 의무상환액 간편 계산<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">2026년 2학기 학자금대출은 <b>11월 17일(화) 18시<\/b>까지 신청할 수 있고, 금리는 <b>일반 상환 1.7% 고정 · 취업 후 상환 1.7% 변동<\/b>입니다. 금리가 같으니 선택 기준은 <b>\"언제 갚느냐\"<\/b> 하나입니다. 소득이 불확실하면 취업 후 상환, 나이나 소득구간 때문에 자격이 안 되면 일반 상환입니다. 생활비 한도는 <b>취업 후 상환 연 300만원 / 일반 상환 연 200만원<\/b>으로 갈립니다. 그리고 기억할 것 하나 — <b>취업 후 상환도 유예 기간 동안 이자는 쌓입니다.<\/b> 재단 공식 예시에서 1,600만원이 4년 뒤 <b>1,688만원<\/b>이 되어 있었습니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월<\/b> 기준(확인일 2026년 8월 13일)이며, 금리·상환기준소득·신청 일정은 학기와 연도에 따라 변경됩니다. 신청 전 공식 페이지에서 확인하세요.<br>출처: <a href=\"https://www.kosaf.go.kr/ko/tuition.do?pg=tuition13\" target=\"_blank\" rel=\"nofollow\">한국장학재단 학자금대출 금리 안내(2026년도 2학기)<\/a> · <a href=\"https://www.kosaf.go.kr/ko/tuition.do?pg=tuition04_01_05\" target=\"_blank\" rel=\"nofollow\">취업 후 상환 학자금대출 대출규모<\/a> · <a href=\"https://www.kosaf.go.kr/ko/tuition.do?pg=tuition04_02_05\" target=\"_blank\" rel=\"nofollow\">일반 상환 학자금대출 대출규모<\/a> · <a href=\"https://www.kosaf.go.kr/ko/tuition.do?pg=tuition05_01_03\" target=\"_blank\" rel=\"nofollow\">학자금대출 상환안내(의무적 상환)<\/a> · 국세청 취업 후 학자금 상환<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2-1-622-2-2026.html\">▸ 국가장학금 2학기 2차 신청 시작(8/12~9/9) — 신청방법·대상·마감일 총정리 (2026)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/08/2026_01577675074.html\">▸ 교육급여와 초중고 교육비 지원 차이 총정리 (2026 신청 방법)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026-35.html\">▸ 평생교육바우처 신청 방법 대상 금액 사용처 총정리 (2026 평생교육이용권 35만원)<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 수치·자격·기한은 <b>공식 자료를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 학자금대출은 상환 의무가 따르는 금융상품이며, 이 글은 정보 제공 목적으로 개인의 상황에 대한 금융 조언이 아닙니다. 제도는 바뀔 수 있으니 신청 전 공식 페이지를 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n"}]},"pace":{"date":"2026-08-13","count":2,"posts":[{"title":"어르신 무료 예방접종 대상 독감 폐렴구균 위탁의료기관 찾기 총정리 (2026)","published":"2026-08-13T13:42:21.000+09:00"},{"title":"벌초 대행 신청 방법 산림조합 벌초도우미 요금 할인 총정리 (2026 추석 9월 25일)","published":"2026-08-13T13:40:58.628+09:00"}],"soft":1,"hard":2,"state":"block","backlog":2,"backlog_codes":["D4-09","B2-10"],"backlog_max":5,"backlog_over":false,"lanes":{"info":{"label":"일일·정보성","n":1,"codes":["B2-10"]},"etc":{"label":"기타","n":1,"codes":["D4-09"]},"user":{"label":"사용자 추천","n":0,"codes":[]}},"error":"","checked_at":"2026-08-13T16:35:00"},"db":{"version":1,"updated":"2026-08-13","root":"lifeinfo","blog":"https://lifeinfo8975.blogspot.com/","taxonomy":[{"code":"A","name":"정부지원·복지","color":"#2BC4B0","subs":[{"code":"A1","name":"지원금·수당"},{"code":"A2","na   const blab=light==='green'?'신호등 green':light==='red'?'신호등 red':'신호등 warn';
  const today=(pg&&pg.today||[]).map(it=>'<div class="row '+(it.done?'done':'warn')+'">'+(it.done?CHECK:LOAD)+'<span>'+esc(it.t)+'</span></div>').join('');
  const next=(pg&&pg.next||[]).map(t=>'<div class="row">'+DOT+'<span class="mut">'+esc(t)+'</span></div>').join('');
  const pl=(pg&&pg.pipeline)||{};
  const _cc=(pl.code||'').split(' ')[0], _cur=recs.find(r=>r.code===_cc);
  let checked=(pl.checked||[]).slice();
  // 확산 단계(11~14)는 보드 시드값을 쓰지 않고 DB의 osmu 기록에서 그대로 도출한다.
  //   · DB osmu 는 "실제로 게시된 것"의 기록이므로 확산 여부의 유일한 정답이다.
  //   · 예전 코드는 DB에서 체크를 추가만 하고 제거하지 않아, board_seed 가 미리 찍어둔
  //     낡은 checked 값이 그대로 남아 미게시 글을 확산 완료로 표시했다.
  //     (실측: C2-07 은 osmu 기록이 없는데 checked 에 11·12·13 이 들어 있었다)
  //   · 인스타를 13단계로 넣으면서 번호가 한 칸씩 밀렸으므로, 낡은 번호를 그대로
  //     신뢰하면 단계 의미까지 어긋난다. 도출로 바꾸면 이 문제가 함께 사라진다.
  // 교차링크(14)는 네이버·쓰레드 기준을 유지한다 — 인스타는 54/153편으로 확산률이 낮아
  // 조건에 넣으면 대부분의 글에서 교차링크가 미완으로 뒤집힌다.
  if(_cur){
    const om=_cur.osmu||{};
    const derived={11:!!om.naver,12:!!om.threads,13:!!om.instagram,14:!!(om.naver&&om.threads)};
    checked=checked.filter(n=>!(n in derived));
    Object.keys(derived).forEach(k=>{if(derived[k])checked.push(+k);});
    checked.sort((a,b)=>a-b);
  }
  const done=checked.length;
  const omAll=recs.filter(r=>r.osmu&&typeof r.osmu==='object');
  const oNv=omAll.filter(r=>r.osmu.naver).length, oTh=omAll.filter(r=>r.osmu.threads).length, oIn=omAll.filter(r=>r.osmu.instagram).length;
  // 미결 관리의 I 칩은 DB에서 직접 도출한다. pending.json 의 ch 는 {g,n,t} 만 담고
  // 있어서(pending 생성기가 아직 인스타를 모른다) ch.i 를 믿으면 게시한 글도 ✗ 로 나온다.
  const osmuByCode={}; recs.forEach(r=>{if(r.code)osmuByCode[r.code]=r.osmu||{};});
  const oRecent=omAll.slice(-4).reverse();
  const nowN=pl.code?(STEPS.find(s=>checked.indexOf(s.n)<0)||{}).n:0;
  let pubHtml;
  if(pl.code){
    const pct=Math.round(done/STEPS.length*100);
    const lis=STEPS.map(st=>{
      const on=checked.indexOf(st.n)>=0, now=(!on&&st.n===nowN);
      const ic=on?CHECK:(now?NOWI:WAIT), cls=on?'on':(now?'now':'wait');
      return '<li class="'+cls+'">'+ic+'<span class="num">'+st.n+'</span>'
        +'<span class="who '+st.who+'">'+(st.who==='ai'?'🤖':'🧑')+'</span>'
        +'<span class="lbl">'+esc(st.t)+(st.star?'<span class="star">★</span>':'')+'</span></li>';
    }).join('');
    pubHtml='<div class="pcode">'+esc(pl.code)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div>'
      +'<div class="cnt">'+done+' / '+STEPS.length+' 단계'+(pl.note?' · '+esc(pl.note):'')+'</div><ul>'+lis+'</ul>'
      +'<div class="banner'+(done===STEPS.length?' show':'')+'">✅ 발행·확산 완료</div>';
  }else{
    pubHtml='<div class="pcode none">진행 중인 발행 없음</div>';
  }
  const osmuLi=oRecent.map(r=>'<div class="row done">'+CHECK+'<span>'+esc(r.code)+' '+esc((r.title||'').slice(0,15))+'</span><span class="mut" style="margin-left:auto;font-size:10.5px">'+(r.osmu.naver?'네이버 ':'')+(r.osmu.threads?'쓰레드 ':'')+(r.osmu.instagram?'인스타':'')+'</span></div>').join('');
  // 🤝 협업 — 세션별(collab.json: 정체성=레지스트리·활동=git log·상태=git status)
  const stLab={active:'활동중',uncommitted:'미커밋',idle:'대기'};
  const collabHtml=(collab&&collab.agents||[]).map(a=>{
    const acts=(a.recent||[]).map(r=>'<div class="act">'+esc((r.s||'').slice(0,40))+' <span class="d">'+esc(r.d||'')+'</span></div>').join('');
    return '<div class="agent"><div class="ah">'+esc(a.emoji||'')+'<span>'+esc(a.name||'')+'</span><span class="st '+(a.state||'idle')+'">'+(stLab[a.state]||a.state||'')+'</span></div>'
      +'<div class="role">'+esc(a.role||'')+'</div><div class="own">담당 '+esc(a.owns||'')+'</div>'+acts+'</div>';
  }).join('');
  // 💡 시스템 조언 — 라이브 데이터 조건에서만 도출(하드코딩 일반론 금지)
  const adv=[];
  if(idx&&typeof idx.indexed==='number'){
    const iDt=idx.checked_at?' ('+String(idx.checked_at).slice(5)+' 실측)':'';
    if(idx.indexed===0){const cr=Object.values(idx.posts||{}).filter(p=>p&&p.lastCrawl).length;
      adv.push('색인 0/'+idx.total+iDt+' — 크롤 '+cr+'편·미크롤 '+(idx.total-cr)+'편. GSC 일일한도+OSMU 백링크로 점진(재검토는 색인 잡힌 뒤).');}
    else adv.push('색인 '+idx.indexed+'/'+idx.total+'편'+iDt+'.');
  }
  if(oNv>oTh) adv.push('OSMU 쓰레드 '+oTh+'/'+oNv+' — '+(oNv-oTh)+'편 미게시(rate-limit 보류분 재시도 필요).');
  if(oTh>oIn) adv.push('OSMU 인스타 '+oIn+'/'+oTh+' — 쓰레드 확산 대비 '+(oTh-oIn)+'편 미확산(카드뉴스 backlog).');
  if(collab&&collab.uncommitted>=10) adv.push('미커밋 '+collab.uncommitted+'파일 — 발행 완료 후 세션별 커밋 분리 권장.');
  const adviceHtml=adv.length?'<div class="advice">'+adv.map(t=>'<div class="ai"><span class="ic">💡</span><span>'+esc(t)+'</span></div>').join('')+'</div>':'<div class="pcode none">현재 조치 필요 항목 없음</div>';
  // 📋 미결 관리 — 글별(pending.json: DB osmu + index_status에서 계산)
  const pc=(pend&&pend.counts)||{};
  const cb=(ok,l)=>'<span class="ch '+(ok?'on':'off')+'">'+l+(ok?'✓':'✗')+'</span>';
  const pendRows=(pend&&pend.actionable||[]).map(a=>{
    const c=a.ch||{};
    return '<div class="prow"><span class="pcd">'+esc(a.code)+'</span><span class="ptt">'+esc(a.title)+'</span>'
    +cb(c.g!==false,'G')+cb(c.n,'N')+cb(c.t,'T')+cb((osmuByCode[a.code]||{}).instagram,'I')+'</div>';
  }).join('');
  // 표시는 상위 14편으로 잘려 있음(pending.py) → 남은 수는 counts로 계산해 "…외 N편"
  const pendListed=(pend&&pend.actionable||[]).length;
  const pendTotal=Math.max(pc.osmu_pending||0,pc.index_pending||0);
  const pendMore=pendTotal>pendListed?'<div class="cnt">…외 '+(pendTotal-pendListed)+'편</div>':'';
  const pendHtml='<div class="cnt">OSMU 대기 '+(pc.osmu_pending||0)+'편 · 색인 대기 '+(pc.index_pending||0)+'편 / 전체 '+(pc.total||0)+'편</div>'+(pendRows||'<div class="pcode none">미결 없음</div>')+pendMore;
  // 📋 발행 대기 (발행 전 큐 — queue.json) : 코드·제목·썸네일을 한 카드로 묶어 '엉뚱한 글/썸네일' 눈으로 차단
  const qItems=(queue&&queue.items)||[];
  const laneLab={info:'정보성',pop:'대중관심'};
  const qCards=qItems.map(it=>{
    const th=it.thumb_data
      ?'<img class="qth" src="'+it.thumb_data+'" alt="">'
      :'<div class="qth none">썸네일<br>없음</div>';
    const facts=it.facts?'<div class="qfacts">'+esc(it.facts)+'</div>':'';
    const draft=it.draft?'<span class="qdraft">📄 '+esc(it.draft)+'</span>':'';
    const pv=it.body?'<button class="qpv" onclick="qpv(\''+esc(it.code||'')+'\')">👁 본문 미리보기</button>'
                    :'<span class="qpv none">초안 없음(작성 전)</span>';
    return '<div class="qcard">'+th
      +'<div class="qbody"><div class="qtop"><span class="qcode">'+esc(it.code||'')+'</span>'
      +'<span class="qlane '+(it.lane||'info')+'">'+esc(laneLab[it.lane]||it.lane||'')+'</span></div>'
      +'<div class="qtitle">'+esc(it.title||'')+'</div>'+facts
      +'<div class="qmeta">'+pv+draft+'</div></div></div>';
  }).join('');
  // 🚦 오늘 발행량 배지 (2026-07-29) — 승인 누르기 '전에' 보이게 한다.
  //    2026-07-27 에 8편이 한꺼번에 나간 건, 사람이 재고만 보고 몰아서 승인했는데
  //    '오늘 몇 편째'를 아무도 안 세고 있었기 때문이다. 게이트(pace.check)는 발행을 막고,
  //    이 배지는 그 전에 눈으로 막는다.
  let paceHtml='';
  if(pace){
    const st=pace.state||'ok', n=pace.count||0, hard=pace.hard||2;
    const lab=st==='err'?'⚠️ 오늘 발행량을 못 셌습니다 — '+esc(pace.error||'')
      :st==='block'?'⛔ 오늘 '+n+'편 발행됨 — 오늘은 더 발행하지 마세요(3편 이상 금지)'
      :st==='warn'?'⚠️ 오늘 '+n+'편 발행됨 — 기본 페이스는 하루 1편입니다'
      :'✅ 오늘 '+n+'편 발행 — 하루 1편 기준 안';
    const bg=st==='block'?'#3a1218':st==='warn'?'#3a2f12':st==='err'?'#2a2030':'#0c3a2c';
    const bd=st==='block'?'#7a2230':st==='warn'?'#5a4a1a':st==='err'?'#4a3a5a':'#1f6b52';
    const fg=st==='block'?'#ff9aa6':st==='warn'?'#ffd166':st==='err'?'#c9b6e8':'#8ef0cf';
    const titles=(pace.posts||[]).map(p=>'<div style="opacity:.8;margin-top:2px">· '+esc(p.title||'')+'</div>').join('');
    const lanes=pace.lanes||{};
    const laneTxt=Object.keys(lanes).map(k=>{
      const L=lanes[k]; if(!L) return '';
      return '<span style="display:inline-block;margin-right:9px">'+esc(L.label||k)+' <b>'+(L.n||0)+'</b></span>';
    }).join('');
    const over=pace.backlog_over
      ?'<div style="margin-top:5px;color:#ffd166">📦 발행대기 재고 '+pace.backlog+'편 (상한 '+pace.backlog_max+' 초과) — 재고가 쌓이면 몰아치기 발행을 부릅니다. PREP 초안 생성이 잠긴 상태입니다.</div>'
      :'<div style="margin-top:5px;opacity:.75">📦 발행대기 재고 '+(pace.backlog||0)+'편 / 상한 '+(pace.backlog_max||5)+'</div>';
    const laneRow=laneTxt?'<div style="margin-top:4px;opacity:.8;font-size:11.5px">🛤 레인별: '+laneTxt+'<span style="opacity:.6">(자동 2 + 사용자 창구 1 · 루틴은 1회 1건)</span></div>':'';
    paceHtml='<div style="background:'+bg+';border:1px solid '+bd+';color:'+fg
      +';border-radius:8px;padding:8px 11px;margin:2px 0 9px;font-size:12px;line-height:1.5">'
      +'<b>'+lab+'</b>'+titles+over+laneRow+'</div>';
  }
  const qHtml=paceHtml+(qItems.length
    ?'<div class="cnt">발행 대기 '+qItems.length+'건 — 발행하면 카드가 자동으로 사라집니다(사람 승인 게이트)</div>'+qCards
    :'<div class="pcode none">발행 대기 없음 — PREP 루틴이 준비하면 여기 카드로 뜹니다</div>');
  // 🙋 내가 할 일 섹션은 2026-08-12 사용자 지시로 이 화면에서 제거하고
  // index.html(운영콘솔 첫 페이지)의 별도 탭(data-t="mytasks")으로 이전했다.
  document.getElementById('board').innerHTML=
   '<div class="hd"><div class="t"><h1>진행현황</h1><span class="date">'+esc(date)+'</span></div>'
   +'<span class="badge '+bcls+'">'+CHECK+esc(blab)+'</span></div>'
   +'<div class="sec">오늘 한 일</div>'+today
   +'<div class="metrics">'
   +'<div class="m"><div class="l">검사 통과</div><div class="v">'+pass+' <small>/ '+total+'</small></div></div>'
   +'<div class="m"><div class="l">블로그 글</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">평균 본문</div><div class="v">'+avg+' <small>자</small></div></div>'
   +'</div>'
   +'<div class="div"></div>'
   +'<div class="sec">📋 발행 대기 (오늘 발행할 글)<span class="auto">🤖 PREP 큐</span></div>'+qHtml
   +'<div class="div"></div>'
   +'<div class="sec">발행 진행 (글 1편 · '+STEPS.length+'단계, 확산 포함)<span class="auto">🤖 자동</span></div>'+pubHtml
   +'<div class="div"></div>'
   +'<div class="sec">📡 4채널 발행 현황 (구글·네이버·쓰레드·인스타)<span class="auto">🤖 DB 자동집계</span></div>'
   +'<div class="metrics">'
   +'<div class="m"><div class="l">구글(원본)</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">네이버</div><div class="v">'+oNv+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">쓰레드</div><div class="v">'+oTh+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">인스타</div><div class="v">'+oIn+' <small>편</small></div></div>'
   +'</div>'
   +'<div class="cnt">확산 커버리지 · 네이버 '+(count?Math.round(oNv/count*100):0)+'% · 쓰레드 '+(count?Math.round(oTh/count*100):0)+'% · 인스타 '+(count?Math.round(oIn/count*100):0)+'% · 교차링크 완료 '+omAll.length+'편</div>'
   +osmuLi
   +'<div class="div"></div>'
   +'<div class="sec">🤝 협업 — 세션별 역할·진행<span class="auto">git 자동분류</span></div>'+collabHtml
   +'<div class="sec">💡 시스템 조언<span class="auto">라이브 도출</span></div>'+adviceHtml
   +'<div class="div"></div>'
   +'<div class="sec">📋 미결 관리 — 4채널 매칭<span class="auto">G구글·N네이버·T쓰레드·I인스타</span></div>'+pendHtml
   +'<div class="sec">다음</div><div class="next">'+next+'</div>'
   +'<div class="upd" id="upd"></div>';
  tick();
}
// 시계·데이터 기준만 갱신(보드 전체 재렌더 없음 — 정적 베이크 데이터라 시계만 변함)
function tick(){
  const el=document.getElementById('upd'); if(!el)return;
  const b=(window.__DATA__||{}).baked_at;
  el.textContent=(b?'데이터 기준 '+b+' · ':'')+new Date().toLocaleTimeString('ko-KR');
}
// 👁 발행 대기 카드 본문 미리보기 — 초안 HTML을 격리 iframe(srcdoc)로 렌더(스타일 누수 차단, Blogger 미접촉)
function qpv(code){
  const items=((window.__DATA__||{}).queue||{}).items||[];
  const it=items.find(x=>x.code===code); if(!it||!it.body)return;
  document.getElementById('qpv-ttl').textContent=(it.code||'')+' · '+(it.title||'');
  document.getElementById('qpv-fr').srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank"><body style="margin:0;padding:16px;background:#fff">'+it.body+'</body>';
  document.getElementById('qpv-ov').classList.add('show');
}
function qpvClose(){document.getElementById('qpv-ov').classList.remove('show');document.getElementById('qpv-fr').srcdoc='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')qpvClose();});
// 코드 자동 반영: 자기 자신(progress.html)을 주기적으로 fetch→해시 비교, 바뀌면 1회 reload
const _hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
let _selfHash=null;
async function checkVersion(){
  try{
    const r=await fetch('progress.html?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;                                // 일시적 404/500에 해시 오염 → 불필요 reload 방지
    const t=await r.text();
    const h=_hash(t);
    if(_selfHash===null){_selfHash=h;return;}      // 첫 호출=기준선 저장
    if(h!==_selfHash) location.reload();            // 코드 변경 감지 → 자동 새로고침
  }catch(e){}
}
load(); checkVersion(); setInterval(tick,5000); setInterval(checkVersion,5000);
</script>
