kground:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#f4f1fd;border:1px solid #ded4f7;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#6544cc;margin-bottom:8px}\n.lsg .rel a{display:block;color:#5a3cc0;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#9a92aa;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>가을 단풍철 <b>지리산 종주<\/b>나 <b>설악산 1박 산행<\/b>을 계획하면 가장 먼저 막히는 것이 <b>대피소 자리<\/b>입니다. 그런데 예약 방식이 <b>2025년 7월 이용분부터 완전히 바뀌었습니다.<\/b> 예전처럼 \"오픈 시각에 클릭 빨리 누르기\"로 잡는 <b>선착순이 사라지고, 전국 대피소 13곳이 연중 추첨제<\/b>로 운영됩니다. 접수는 <b>2개월 단위로 짝수달 1일부터<\/b> 받기 때문에, <b>9~10월 단풍철에 자려면 8월 접수 회차<\/b>에 신청해야 합니다. 이 글에서는 <b>추첨 신청 일정과 절차, 이용요금, 취소 시점별 환불액 계산, 그리고 가장 많이 손해 보는 노쇼(예약부도) 페널티<\/b>까지 실제 규정 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 2025년 7월부터 바뀐 것 — 선착순 폐지, 연중 추첨제<\/a><a href=\"#sec2\">2. 예약 가능한 대피소 13곳 (지리산·설악산·덕유산·소백산)<\/a><a href=\"#sec3\">3. 신청 일정 — 짝수달 1일 접수, 추첨·발표·결제까지<\/a><a href=\"#sec4\">4. 이용요금 — 단풍철(10/1~11/15)은 평일도 성수기 요금<\/a><a href=\"#sec5\">5. 취소 시점별 환불액 계산 (2인 1박 6만 원 기준)<\/a><a href=\"#sec6\">6. 가장 비싼 실수 — 무단 노쇼는 '1개월 예약 정지'<\/a><a href=\"#sec7\">7. 떨어졌을 때 — 추첨 vs 빈자리 선착순, 뭐가 유리한가<\/a><a href=\"#sec8\">8. 자주 묻는 질문<\/a><a href=\"#sec9\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec5\">👉 취소하면 얼마 돌려받는지 계산표 바로 보기<\/a>\n\n<h2 id=\"sec1\">1. 2025년 7월부터 바뀐 것 — 선착순 폐지, 연중 추첨제<\/h2>\n<p>국립공원 대피소는 원래 <b>봄·여름·가을 성수기 3개월만 추첨제<\/b>였고 나머지 기간은 <b>선착순<\/b>이었습니다. 그래서 오픈 시각에 접속이 몰려 <b>\"클릭 전쟁\"<\/b>이 벌어졌고, 매크로 논란도 반복됐습니다.<\/p>\n<ul>\n<li>국립공원공단은 <b>2025년 7월 1일 사용일부터<\/b> 전국 대피소 <b>13곳의 예약 방식을 연중 추첨제<\/b>로 바꿨습니다.<\/li>\n<li>접수는 <b>2개월 단위<\/b>로 묶어서 받고, <b>짝수달 1일부터 5~7일간<\/b> 신청을 받은 뒤 추첨합니다.<\/li>\n<li>즉 <b>7·8월 이용분은 6월에, 9·10월 이용분은 8월에<\/b> 신청하는 구조입니다. <b>가을 단풍 산행을 하려면 여름에 미리 신청<\/b>해야 한다는 뜻입니다.<\/li>\n<\/ul>\n<div class=\"tip\"><b>💡 야영장·탐방로와는 방식이 다릅니다<\/b><p style=\"margin:8px 0 0\">같은 예약시스템 안에 있어도 <b>대피소·야영장은 추첨제<\/b>, <b>탐방로(사전예약 구간)·생태탐방원 등은 선착순<\/b>으로 운영됩니다. 북한산 우이령길, 지리산 노고단처럼 <b>출입이 제한된 탐방로<\/b>는 대피소와 별도로 예약해야 하니, <b>잠자리(대피소)와 길(탐방예약제)을 각각<\/b> 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 예약 가능한 대피소 13곳 (지리산·설악산·덕유산·소백산)<\/h2>\n<p>추첨제로 운영되는 대피소는 아래 <b>4개 국립공원 13곳<\/b>입니다. 다른 산에는 숙박이 가능한 공단 운영 대피소가 없다고 보면 됩니다.<\/p>\n<table>\n<tr><th>국립공원<\/th><th>대피소<\/th><th>개수<\/th><\/tr>\n<tr><td><b>지리산<\/b><\/td><td>장터목 · 세석 · 벽소령 · 연하천 · 치밭목 · 로타리 · 노고단<\/td><td>7곳<\/td><\/tr>\n<tr><td><b>설악산<\/b><\/td><td>소청 · 희운각 · 수렴동 · 양폭<\/td><td>4곳<\/td><\/tr>\n<tr><td><b>덕유산<\/b><\/td><td>삿갓재<\/td><td>1곳<\/td><\/tr>\n<tr><td><b>소백산<\/b><\/td><td>제2연화봉<\/td><td>1곳<\/td><\/tr>\n<\/table>\n<p><b>지리산 종주(성삼재~천왕봉)<\/b>를 하려면 보통 <b>연하천·벽소령·세석·장터목<\/b> 중 한두 곳을 잡아야 하고, <b>설악산 공룡능선<\/b> 코스는 <b>소청·희운각<\/b>이 핵심입니다. 경쟁이 가장 치열한 곳도 이쪽입니다.<\/p>\n<div class=\"warn\"><b>⚠️ 현장 접수·당일 등록은 안 됩니다<\/b><p style=\"margin:8px 0 0\">대피소는 <b>온라인 예약 후 결제까지 끝낸 사람만<\/b> 이용할 수 있습니다. \"일단 올라가서 자리 남으면 자면 되겠지\"가 통하지 않습니다. <b>예약 없이 산에서 밤을 맞는 것은 안전 문제로 직결<\/b>되니, 자리를 못 잡았다면 <b>당일 하산이 가능한 코스로 계획을 바꾸는 것<\/b>이 원칙입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 신청 일정 — 짝수달 1일 접수, 추첨·발표·결제까지<\/h2>\n<p>흐름은 <b>접수 → 추첨 → 발표 → 결제 → (남으면) 빈자리 선착순<\/b> 5단계입니다. 실제로 운영된 회차(7·8월 이용분)를 예로 보면 이렇습니다.<\/p>\n<table>\n<tr><th>단계<\/th><th>실제 운영 예 (7·8월 이용분)<\/th><\/tr>\n<tr><td><b>① 신청 접수<\/b><\/td><td>6월 1일 10:00 ~ 6월 5일 10:00 (약 5일)<\/td><\/tr>\n<tr><td><b>② 추첨<\/b><\/td><td>접수 마감 당일 13:00<\/td><\/tr>\n<tr><td><b>③ 결과 발표<\/b><\/td><td>같은 날 16:00<\/td><\/tr>\n<tr><td><b>④ 결제<\/b><\/td><td>발표 직후 ~ <b>다음 날 22:00<\/b>까지 (미결제 시 자동 취소)<\/td><\/tr>\n<tr><td><b>⑤ 빈자리 선착순<\/b><\/td><td>며칠 뒤 10:00부터 남은 자리 개방<\/td><\/tr>\n<\/table>\n<p>같은 리듬으로 <b>9·10월 이용분은 8월 접수 회차<\/b>, <b>11·12월 이용분은 10월 접수 회차<\/b>가 됩니다. 다만 <b>정확한 날짜와 시각은 회차마다 공지로 확정<\/b>되므로, 예약시스템의 <b>'대피소 추첨제 안내'<\/b> 페이지를 신청 전에 반드시 확인하세요.<\/p>\n<h3>신청할 때 알아둘 제한<\/h3>\n<ul>\n<li><b>1인당 신청 건수 제한<\/b>이 있습니다(운영 기준상 <b>월 4건<\/b>). 무제한으로 넣어두는 방식은 불가능합니다.<\/li>\n<li><b>같은 날짜에 여러 대피소를 중복 신청하는 것은 되지만, 당첨은 1건만<\/b> 됩니다. 그러니 <b>같은 날 여러 곳을 넣기보다, 갈 수 있는 날짜를 흩어서<\/b> 넣는 편이 실제 당첨 확률에는 유리합니다.<\/li>\n<li>회원가입·본인인증이 필요하고, <b>PC·모바일 모두<\/b> 같은 시스템을 씁니다.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ 당첨되고도 자리를 날리는 1순위 = 결제 기한<\/b><p style=\"margin:8px 0 0\">추첨에 당첨돼도 <b>정해진 시각(예: 발표 다음 날 22:00)까지 결제하지 않으면 자동 취소<\/b>됩니다. 발표가 금요일 오후라 주말에 잊기 딱 좋습니다. <b>발표 당일에 바로 결제<\/b>하는 것을 권합니다(공단도 마감 1시간 전 결제를 권고합니다). 여기서 놓치면 <b>다음 회차까지 두 달을 기다려야<\/b> 합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 이용요금 — 단풍철(10/1~11/15)은 평일도 성수기 요금<\/h2>\n<p>대피소 이용료는 <b>1인 1박<\/b> 기준이며, <b>주중과 주말·성수기<\/b> 요금이 다릅니다. 지리산 장터목대피소 기준은 다음과 같습니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>해당 날짜<\/th><th>1인 1박<\/th><\/tr>\n<tr><td><b>주중<\/b><\/td><td>일~목 (공휴일 전일 제외)<\/td><td>20,000원<\/td><\/tr>\n<tr><td><b>주말·성수기<\/b><\/td><td>금·토, 공휴일 전일, <b>7/1~8/31<\/b>, <b>10/1~11/15<\/b><\/td><td>30,000원<\/td><\/tr>\n<\/table>\n<p>여기서 놓치기 쉬운 것이 <b>성수기 구간에 '10월 1일~11월 15일'이 통째로 들어간다<\/b>는 점입니다. 이 기간은 <b>요일과 상관없이 성수기 요금<\/b>이 적용됩니다. 즉 <b>단풍 절정기에는 화요일에 올라가도 3만 원<\/b>입니다.<\/p>\n<div class=\"tip\"><b>💡 요금을 낮추려면 '날짜'를 옮겨야 합니다<\/b><p style=\"margin:8px 0 0\">2인 1박 기준으로 <b>비성수기 평일은 4만 원(2만×2)<\/b>, <b>단풍철은 6만 원(3만×2)<\/b>으로 <b>2만 원 차이<\/b>가 납니다. 단풍은 보통 <b>설악산이 10월 중순, 지리산이 10월 하순<\/b>에 절정이지만, <b>9월 하순이나 11월 중순 이후<\/b>로 하루이틀만 비껴도 자리 경쟁과 요금이 함께 내려갑니다. 정확한 요금은 대피소마다 다를 수 있으니 예약 화면에서 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 취소 시점별 환불액 계산 (2인 1박 6만 원 기준)<\/h2>\n<p>산행은 날씨·컨디션 때문에 취소가 잦습니다. 환불 기준은 <b>이용일까지 며칠 남았는지<\/b>로 갈립니다.<\/p>\n<table>\n<tr><th>취소 시점<\/th><th>공제<\/th><th>2인 1박 60,000원일 때 환불액<\/th><\/tr>\n<tr><td><b>3일 전<\/b><\/td><td>없음(전액)<\/td><td><b>60,000원<\/b><\/td><\/tr>\n<tr><td><b>2일 전<\/b><\/td><td>10% 공제<\/td><td>54,000원 (6,000원 공제)<\/td><\/tr>\n<tr><td><b>1일 전<\/b><\/td><td>20% 공제<\/td><td>48,000원 (12,000원 공제)<\/td><\/tr>\n<tr><td><b>당일 12시 전<\/b><\/td><td>30% 공제<\/td><td>42,000원 (18,000원 공제)<\/td><\/tr>\n<tr><td><b>취소 없이 미사용<\/b><\/td><td>환불 없음<\/td><td><b>0원 + 예약 제한<\/b><\/td><\/tr>\n<\/table>\n<p>표에서 진짜 중요한 줄은 <b>맨 아랫줄<\/b>입니다. 취소를 안 하고 그냥 안 가면 <b>돈을 한 푼도 못 돌려받는 데다, 다음 예약까지 막힙니다.<\/b> 반대로 <b>당일이라도 12시 전에 본인이 예약시스템에서 직접 취소<\/b>하면, <b>30%를 공제한 금액은 돌려받고 예약부도(노쇼) 기록도 면제<\/b>된다고 안내하고 있습니다. <b>못 갈 것 같으면 아까워하지 말고 오전에 취소<\/b>하는 것이 언제나 이득입니다.<\/p>\n<ul>\n<li>환불금 입금까지는 <b>은행 영업일 기준 3~7일<\/b> 걸립니다.<\/li>\n<li><b>태풍·호우 등 기상특보나 재난<\/b>으로 탐방로가 통제된 경우처럼 <b>본인 책임이 아닌 사유<\/b>는 위약금 없이 처리될 수 있습니다.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 가장 비싼 실수 — 무단 노쇼는 '1개월 예약 정지'<\/h2>\n<p>대피소 예약에서 손해가 가장 큰 것은 <b>이용료 몇만 원이 아니라 예약 자격<\/b>입니다.<\/p>\n<table>\n<tr><th>예약부도(노쇼) 횟수<\/th><th>제재<\/th><\/tr>\n<tr><td><b>1회<\/b><\/td><td>1개월 예약 제한<\/td><\/tr>\n<tr><td><b>2회 이상<\/b><\/td><td>3개월 예약 제한<\/td><\/tr>\n<\/table>\n<p>대피소 접수가 <b>두 달에 한 번<\/b>이라는 점을 생각하면 체감은 훨씬 큽니다. <b>1개월 제한에 접수 기간이 걸리면 회차 하나를 통째로 날리는<\/b> 셈이고, <b>3개월이면 단풍철 전체<\/b>가 날아갈 수 있습니다. 제재 기록은 <b>벌칙 부과 후 1년간 추가 부도가 없으면 소멸<\/b>합니다.<\/p>\n<div class=\"warn\"><b>⚠️ \"일행 중 한 명만 못 가는데요?\"<\/b><p style=\"margin:8px 0 0\">인원이 줄었다면 <b>가지 않을 인원만큼 미리 예약을 변경·취소<\/b>해 두는 것이 안전합니다. 예약한 인원이 실제로 오지 않으면 <b>그만큼 빈자리가 낭비<\/b>되고, 노쇼로 처리될 여지가 생깁니다. 산에서는 통신이 안 되는 구간이 많으니 <b>출발 전 아침에 정리<\/b>하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 떨어졌을 때 — 추첨 vs 빈자리 선착순, 뭐가 유리한가<\/h2>\n<p>추첨에서 떨어졌다고 끝이 아닙니다. <b>미결제로 풀린 자리<\/b>와 <b>취소분<\/b>이 <b>빈자리 선착순<\/b>으로 다시 열립니다. 둘의 성격은 이렇게 다릅니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>추첨 신청<\/th><th>빈자리 선착순<\/th><\/tr>\n<tr><td>시점<\/td><td>짝수달 1일부터 약 5일<\/td><td>추첨 종료 며칠 뒤 10:00~<\/td><\/tr>\n<tr><td>필요한 것<\/td><td>미리 계획한 날짜<\/td><td>수시 확인 + 빠른 결제<\/td><\/tr>\n<tr><td>유리한 사람<\/td><td>날짜를 <b>고를 수 있는<\/b> 사람<\/td><td>날짜를 <b>바꿀 수 있는<\/b> 사람<\/td><\/tr>\n<tr><td>노릴 타이밍<\/td><td>인기 없는 평일·비성수기<\/td><td>결제 마감 직후, 이용일 3일 전(전액 환불 마지노선)<\/td><\/tr>\n<\/table>\n<p>실전 요령은 <b>\"추첨은 넓게, 선착순은 타이밍\"<\/b>입니다. 추첨 때는 <b>같은 날 여러 대피소<\/b>가 아니라 <b>여러 날짜<\/b>로 흩어 넣고(당첨은 어차피 1건), 떨어졌다면 <b>결제 마감 다음 날<\/b>과 <b>이용일 3일 전후<\/b>를 노려 빈자리를 확인하는 방식입니다. <b>3일 전은 전액 환불이 되는 마지막 날<\/b>이라 취소가 몰리는 구간입니다.<\/p>\n<div class=\"tip\"><b>💡 대안도 함께 계획해 두세요<\/b><p style=\"margin:8px 0 0\">대피소를 못 잡았다면 <b>산 아래 숙소에서 자고 새벽 산행<\/b>으로 코스를 바꾸는 방법이 있습니다. <b>국립자연휴양림(산림청 숲나들e)<\/b>이나 <b>국공립 야영장(고캠핑)<\/b>은 예약 시스템 자체가 달라서, 대피소가 꽉 찼어도 자리가 남아 있는 경우가 있습니다. 아래 '함께 보면 좋은 글'에 신청 방법을 정리해 두었습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 자주 묻는 질문<\/h2>\n<h3>Q. 이제 선착순은 아예 없어진 건가요?<\/h3>\n<p>대피소 <b>정규 예약<\/b>은 연중 추첨제로 바뀌었습니다. 다만 <b>추첨 후 남은 자리(빈자리)<\/b>는 선착순으로 열리고, <b>탐방로 사전예약 구간이나 생태탐방원 등<\/b>은 여전히 선착순입니다.<\/p>\n<h3>Q. 9·10월 단풍철에 자려면 언제 신청하나요?<\/h3>\n<p><b>2개월 단위·짝수달 접수<\/b> 원칙에 따라 <b>8월 접수 회차<\/b>가 해당합니다. 다만 <b>정확한 접수 시작일·시각은 회차 공지로 확정<\/b>되니, 8월에 들어서면 예약시스템 공지를 먼저 확인하세요.<\/p>\n<h3>Q. 당첨된 예약을 다른 사람에게 넘길 수 있나요?<\/h3>\n<p>대피소 예약은 <b>본인 확인을 전제로 한 예약<\/b>입니다. 양도·거래를 전제로 신청하는 것은 맞지 않고, 인원이 바뀌면 <b>예약 변경·취소로 정리<\/b>하는 것이 원칙입니다.<\/p>\n<h3>Q. 대피소에 이불과 식사가 있나요?<\/h3>\n<p>대피소는 <b>호텔·펜션 같은 숙박시설이 아니라 안전을 위한 산장<\/b>입니다. 제공 물품과 매점 운영은 <b>대피소마다 다르므로<\/b>, 예약 화면의 <b>이용 안내(제공·판매 물품)<\/b>를 확인하고 <b>침낭·헤드랜턴·식량은 기본적으로 직접 준비<\/b>한다고 생각하는 편이 안전합니다.<\/p>\n<h3>Q. 결제까지 했는데 태풍으로 산이 통제되면요?<\/h3>\n<p><b>기상특보·재난으로 인한 통제<\/b>처럼 본인 책임이 아닌 사유는 위약금 없이 처리될 수 있습니다. 통제 여부는 국립공원 공지와 <b>예약시스템 안내<\/b>를 확인하고, 임의로 판단해 그냥 안 가는 대신 <b>취소 처리<\/b>를 해두세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 국립공원공단 예약시스템 (공식)<\/b><a href=\"https://reservation.knps.or.kr/\" target=\"_blank\" rel=\"nofollow\">▸ 국립공원 예약시스템 — 통합 예약 첫 화면<\/a><a href=\"https://reservation.knps.or.kr/reservation/selectShelterLottery.do\" target=\"_blank\" rel=\"nofollow\">▸ 대피소 추첨제 안내 — 회차별 접수·추첨·결제 일정<\/a><a href=\"https://reservation.knps.or.kr/reservation/shelter/searchSimpleShelterReservation.do\" target=\"_blank\" rel=\"nofollow\">▸ 대피소 예약 — 공원별 잔여 현황<\/a><a href=\"https://reservation.knps.or.kr/contents/rsvtRefundPolicy.do\" target=\"_blank\" rel=\"nofollow\">▸ 예약·환불정책 — 환불 기준과 예약부도 제재<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">정리하면, 국립공원 대피소는 <b>2025년 7월 이용분부터 13곳 모두 연중 추첨제<\/b>이고 <b>짝수달 1일부터 2개월치를 한 번에<\/b> 접수합니다. <b>9~10월 단풍 산행은 8월 회차<\/b>가 승부처입니다. 당첨되면 <b>발표 다음 날 22시까지 결제<\/b>를 꼭 마치고, 사정이 생기면 <b>3일 전(전액 환불)<\/b>을 기준으로 판단하되 <b>최소한 당일 12시 전에는 직접 취소<\/b>해야 노쇼 제재를 피합니다. <b>단풍철 10/1~11/15는 평일도 3만 원<\/b>이라는 점까지 계산에 넣고, 올가을 산행을 편하게 준비해 보세요.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 접수 일정·요금·환불 기준은 회차와 대피소에 따라 달라질 수 있습니다. 신청 전 아래 공식 예약시스템의 <b>회차 공지와 예약·환불정책<\/b>을 반드시 확인하세요.<br>출처: 국립공원공단 국립공원 예약시스템(대피소 추첨제 안내·예약/환불정책·대피소 이용안내), 환경부·국립공원공단 대피소 예약방식 개편 발표. 고객센터 1670-9201<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01495223186.html\">▸ 국립자연휴양림 예약 방법 성수기 추첨·낙첨·잔여객실 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_426.html\">▸ 국공립 캠핑장·야영장 예약 방법 고캠핑 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01858941660.html\">▸ 펜션·호텔 예약 취소 수수료 환불 규정 총정리<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 접수 일정·요금·환불 기준은 <b>국립공원공단 예약시스템의 공식 안내를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 회차별 일정은 공지로 확정되니 신청 전 공식 페이지를 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 국립공원 대피소 예약이 2025년 7월 이용분부터 완전히 바뀌었어요. 선착순이 사라지고 지리산·설악산·덕유산·소백산 13곳 전부 연중 추첨제입니다. 2개월 단위로 짝수달 1일부터 접수해서, 9~10월 단풍철에 자려면 8월 회차에 신청해야 합니다.\n2. 당첨되고도 자리를 날리는 1순위가 결제 기한이에요. 발표 다음 날 22시까지 결제하지 않으면 자동 취소, 다음 회차까지 두 달을 기다려야 합니다. 발표 당일에 바로 결제하세요.\n3. 못 가게 됐다면 반드시 '취소'를 누르세요. 3일 전은 전액 환불, 당일 12시 전 직접 취소는 30% 공제 후 환불에 노쇼 기록도 면제입니다. 그냥 안 가면 환불 0원에 1개월 예약 정지(2회 이상 3개월) — 접수가 두 달에 한 번이라 회차 하나를 통째로 날립니다.\n"},{"code":"D1-04","title":"상속포기 한정승인 차이 신청 방법 기간 서류 총정리 (2026 3개월 기한 · 빚 상속 막기)","lane":"info","thumb":"131_inheritance_waiver.png","draft":"상속포기한정승인_글_HTML.txt","facts":"고려기간 3개월(상속개시를 안 날부터, 민법 제1019조①) · 미조치 시 법정단순승인(제1026조) · 관할=상속개시지 가정법원 · 특별한정승인=채무초과 사실 안 날부터 3개월(제1019조③), 미성년자 조항 제1019조④는 법률 제19069호로 2022-12-13 신설·시행 · 대법원 2023-03-23 자 2020그42 전원합의체=자녀 전부 포기 시 배우자 단독상속(2013다48852 변경) · 한정승인 수리 후 5일 내 공고, 최고기간 2개월 이상(제1032조) · 포기 취소 원칙 불가(제1024조) · 인지대·송달료는 미확인이라 본문 미표기","added":"2026-07-26","thumb_data":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCACIAQQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD2qiiiqJCiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKAIrh9k ;border-radius:20px;margin-bottom:10px}\n.lsg h2{font-size:23px;margin:34px 0 14px;padding-left:12px;border-left:5px solid #2EB67D;line-height:1.35}\n.lsg p{margin:0 0 14px}\n.lsg ul,.lsg ol{margin:0 0 16px;padding-left:22px}\n.lsg li{margin:6px 0}\n.lsg h3{font-size:18px;margin:22px 0 10px}\n.lsg .toc{background:#edfaf3;border:1px solid #cceedd;border-radius:12px;padding:16px 20px;margin:18px 0 26px}\n.lsg .toc b{display:block;font-size:14px;color:#1c8c5c;margin-bottom:8px}\n.lsg .toc a{display:block;color:#1f6f4f;text-decoration:none;padding:4px 0;font-size:15px}\n.lsg .cta{display:block;text-align:center;background:linear-gradient(90deg,#2EB67D,#3b9fd0);color:#fff !important;font-weight:800;font-size:17px;padding:15px 18px;border-radius:12px;text-decoration:none;margin:22px 0}\n.lsg table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:15px}\n.lsg th,.lsg td{border:1px solid #d7ebe0;padding:10px 12px;text-align:center}\n.lsg th{background:#e7f6ee}\n.lsg .tip{background:#edfaf3;border:1px solid #cceedd;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .warn{background:#fff4f2;border:1px solid #ffd3c9;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .end{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:16px 20px;margin-top:24px}\n.lsg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#edfaf3;border:1px solid #cceedd;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#1c8c5c;margin-bottom:8px}\n.lsg .rel a{display:block;color:#1f6f4f;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#9aa9a1;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">생활·행정<\/span>\n<p>부모님이 돌아가신 뒤 <b>남은 재산보다 빚이 많을 것 같다<\/b>면, 아무것도 하지 않는 것이 가장 위험합니다. 우리 민법은 상속인이 <b>3개월 안에 아무 조치를 하지 않으면 빚까지 전부 물려받은 것으로 간주<\/b>하기 때문입니다. 이때 쓰는 두 가지 제도가 <b>상속포기<\/b>와 <b>한정승인<\/b>인데, 이름이 비슷해 잘못 고르면 <b>내가 안 갚아도 될 빚을 자녀·형제에게 그대로 넘기게<\/b> 됩니다. 무엇을 골라야 하는지, 3개월은 언제부터 세는지, 무심코 하면 결정이 뒤집히는 행동은 무엇인지를 <b>법제처 생활법령·민법·대법원 판례<\/b> 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 3개월 안에 셋 중 하나를 골라야 합니다<\/a><a href=\"#value-add\">2. 어느 쪽을 골라야 하나 — 판단 기준표<\/a><a href=\"#sec3\">3. 한정승인하면 실제로 얼마를 갚나 (계산 사례 2개)<\/a><a href=\"#sec4\">4. 상속포기의 함정 — 빚이 자녀·형제에게 넘어갑니다<\/a><a href=\"#sec5\">5. 2023년에 바뀐 대법원 판례 (자녀 전부 포기 시)<\/a><a href=\"#sec6\">6. 3개월은 언제부터? 놓쳤을 때 쓰는 특별한정승인<\/a><a href=\"#sec7\">7. 무심코 하면 결정이 무효가 되는 행동 7가지<\/a><a href=\"#sec8\">8. 신청 방법 · 서류 · 각하 사유<\/a><a href=\"#sec9\">9. 자주 묻는 질문<\/a><a href=\"#sec10\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#value-add\">👉 내 상황에서 포기·한정승인 중 뭘 골라야 하는지 보기<\/a>\n\n<h2 id=\"sec1\">1. 3개월 안에 셋 중 하나를 골라야 합니다<\/h2>\n<p>상속이 시작되면 상속인에게는 <b>세 가지 선택지<\/b>가 주어집니다. 그리고 <b>상속개시가 있음을 안 날부터 3개월<\/b>(고려기간) 안에 선택해야 합니다.<\/p>\n<table>\n<tr><th>선택지<\/th><th>내용<\/th><th>이럴 때<\/th><\/tr>\n<tr><td><b>단순승인<\/b><\/td><td>재산도 빚도 <b>제한 없이 전부<\/b> 승계<\/td><td>재산 &gt; 빚 이 <b>확실<\/b>할 때<\/td><\/tr>\n<tr><td><b>한정승인<\/b><\/td><td><b>물려받은 재산 범위 안에서만<\/b> 빚을 갚음<\/td><td>재산·빚 규모를 <b>모르거나 비슷<\/b>할 때<\/td><\/tr>\n<tr><td><b>상속포기<\/b><\/td><td>상속을 완전히 거부 → <b>처음부터 상속인이 아니었던 것<\/b>으로 봄<\/td><td>빚 &gt; 재산 이 <b>명백<\/b>할 때<\/td><\/tr>\n<\/table>\n<div class=\"warn\"><b>⛔ 아무것도 안 하면 = 단순승인<\/b><p style=\"margin:8px 0 0\">민법 제1026조는 <b>고려기간(3개월) 안에 한정승인이나 포기를 하지 않으면 단순승인한 것으로 본다<\/b>고 정합니다. 이것을 <b>법정단순승인<\/b>이라고 합니다. 즉 <b>가만히 있는 것이 \"빚까지 다 받겠다\"는 의사표시<\/b>가 됩니다. 상속에서 가장 많이 발생하는 사고가 바로 이 부작위입니다.<\/p><\/div>\n<p>신고는 <b>상속개시지(보통 돌아가신 분의 마지막 주소지)를 관할하는 가정법원<\/b>에 합니다. 사정이 있으면 <b>이해관계인이나 검사의 청구로 가정법원이 이 기간을 연장<\/b>해 줄 수 있습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"value-add\">2. 어느 쪽을 골라야 하나 — 판단 기준표<\/h2>\n<p>\"빚이 많으면 포기\"라고만 알고 계신 경우가 많은데, <b>실무에서 갈리는 지점은 따로<\/b> 있습니다.<\/p>\n<table>\n<tr><th>내 상황<\/th><th>권장<\/th><th>이유<\/th><\/tr>\n<tr><td>빚이 재산보다 <b>확실히 많고<\/b>, 후순위 상속인들도 함께 정리 가능<\/td><td><b>상속포기<\/b><\/td><td>절차가 단순. 단 <b>후순위까지 같이<\/b> 해야 함(4번 참고)<\/td><\/tr>\n<tr><td>재산·빚 규모를 <b>정확히 모른다<\/b><\/td><td><b>한정승인<\/b><\/td><td>나중에 빚이 더 나와도 <b>물려받은 재산 한도까지만<\/b> 책임<\/td><\/tr>\n<tr><td>살던 <b>집·차 등 지키고 싶은 재산<\/b>이 있다<\/td><td><b>한정승인<\/b><\/td><td>포기하면 재산도 전부 못 받음. 한정승인은 청산 후 남으면 가져감<\/td><\/tr>\n<tr><td>후순위 상속인(형제·조카 등)에게 <b>연락이 안 되거나 넘기고 싶지 않다<\/b><\/td><td><b>한정승인<\/b><\/td><td>한정승인은 상속인 지위를 유지 → <b>다음 순위로 넘어가지 않음<\/b><\/td><\/tr>\n<tr><td>재산이 <b>확실히 더 많다<\/b><\/td><td><b>단순승인<\/b>(아무것도 안 함)<\/td><td>별도 신고 불필요<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 실무에서 가장 많이 쓰는 조합 — \"배우자 한정승인 + 자녀 전원 포기\"<\/b>\n<p style=\"margin:8px 0 0\">배우자와 자녀가 모두 포기하면 <b>손자녀 → 직계존속 → 형제자매 → 4촌 이내 방계혈족<\/b>으로 빚이 계속 굴러갑니다. 그래서 <b>배우자 한 사람만 한정승인을 하고 자녀 전원은 포기<\/b>하는 방식이 널리 쓰입니다. 이렇게 하면 <b>한정승인한 배우자가 상속인 지위를 유지하면서 상속재산 한도로만 청산<\/b>하므로, <b>빚이 아래 순위 친족에게 넘어가지 않고 한 번에 종결<\/b>됩니다.<\/p>\n<p style=\"margin:8px 0 0\">다만 한정승인에는 <b>재산목록 작성과 청산(공고·변제) 절차<\/b>가 따르므로, 재산 구성이 복잡하면 <b>법률 상담을 받고 진행<\/b>하는 편이 안전합니다.<\/p><\/div>\n<div class=\"tip\"><b>📌 먼저 할 일 — 빚 규모부터 확인<\/b><p style=\"margin:8px 0 0\">무엇을 고를지는 <b>고인의 재산·채무 규모를 알아야<\/b> 정해집니다. 사망신고 때 함께 신청할 수 있는 <b>정부24 '안심상속 원스톱 서비스'<\/b>로 금융거래·국세·지방세·연금·자동차 내역을 한 번에 조회할 수 있습니다. <b>3개월 시계가 돌아가고 있으므로 조회부터 서두르세요.<\/b><\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 한정승인하면 실제로 얼마를 갚나 (계산 사례 2개)<\/h2>\n<p>한정승인은 <b>\"빚을 깎아 주는 제도\"가 아닙니다.<\/b> 빚은 그대로 남되, <b>내 개인 재산으로는 갚지 않아도 되는 것<\/b>이 핵심입니다.<\/p>\n\n<h3>사례 ① 빚이 재산보다 많은 경우<\/h3>\n<ul>\n<li>상속재산: 예금 3,000만 원 + 자동차 2,000만 원 = <b>5,000만 원<\/b><\/li>\n<li>상속채무: <b>1억 원<\/b><\/li>\n<li>상속인 본인 재산: 아파트·급여 등 <b>3억 원<\/b><\/li>\n<\/ul>\n<table>\n<tr><th>구분<\/th><th>단순승인했다면<\/th><th>한정승인했다면<\/th><\/tr>\n<tr><td>갚아야 할 돈<\/td><td><b>1억 원 전액<\/b><\/td><td><b>5,000만 원까지만<\/b><\/td><\/tr>\n<tr><td>내 개인 재산(3억)<\/td><td>부족분 <b>5,000만 원 집행 대상<\/b><\/td><td><b>손대지 않음<\/b><\/td><\/tr>\n<tr><td>남은 5,000만 원 채무<\/td><td>계속 책임<\/td><td><b>더 갚을 의무 없음<\/b><\/td><\/tr>\n<\/table>\n<p>이 사례에서 한정승인의 실익은 <b>내 재산 5,000만 원을 지킨 것<\/b>입니다.<\/p>\n\n<h3>사례 ② 나중에 빚이 더 나온 경우 (한정승인의 진짜 가치)<\/h3>\n<ul>\n<li>정리 당시 파악된 상속재산 <b>8,000만 원<\/b> · 채무 <b>6,000만 원<\/b> → \"재산이 더 많네\" 하고 <b>단순승인<\/b>(=아무 조치 안 함)<\/li>\n<li>1년 뒤 몰랐던 <b>연대보증채무 2억 원<\/b>이 청구됨<\/li>\n<\/ul>\n<table>\n<tr><th>구분<\/th><th>단순승인 상태<\/th><th>한정승인해 뒀다면<\/th><\/tr>\n<tr><td>총 채무 2억 6,000만 원<\/td><td><b>전액 본인 책임<\/b><\/td><td>상속재산 <b>8,000만 원 한도<\/b><\/td><\/tr>\n<tr><td>결과<\/td><td>개인 재산으로 <b>1억 8,000만 원 추가 부담<\/b><\/td><td>추가 부담 <b>0원<\/b><\/td><\/tr>\n<\/table>\n<p>다만 이 경우에도 <b>채무 초과 사실을 중대한 과실 없이 몰랐다면<\/b> 그 사실을 <b>안 날부터 3개월 이내<\/b>에 <b>특별한정승인<\/b>으로 구제받을 수 있습니다(6번 참고). 위 표의 <b>1억 8,000만 원<\/b>은 <b>그 요건을 못 갖추거나(예: 조금만 확인했으면 알 수 있었던 경우) 3개월을 다시 놓친 경우<\/b>의 결과입니다. 즉 특별한정승인은 <b>안전망이지 계획이 아닙니다<\/b> — 처음부터 한정승인을 해두면 \"몰랐다\"를 입증할 필요 자체가 없습니다.<\/p>\n<p><b>재산이 조금 더 많아 보여도 한정승인을 권하는 이유<\/b>가 여기 있습니다. 상속에서 무서운 것은 <b>파악된 빚이 아니라 나중에 튀어나오는 빚<\/b>이고, 보증채무는 서류상 잘 드러나지 않습니다.<\/p>\n<div class=\"warn\"><b>⚠️ 위 숫자는 제도 작동 방식을 설명하기 위한 가정 사례입니다<\/b><p style=\"margin:8px 0 0\">실제로는 <b>우선권 있는 채권(담보권·조세 등)이 먼저 변제<\/b>되고, 상속재산 평가·청산 순서에 따라 결과가 달라집니다. 구체적 사안은 <b>대한법률구조공단(132)<\/b> 또는 변호사 상담을 받으세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 상속포기의 함정 — 빚이 자녀·형제에게 넘어갑니다<\/h2>\n<p>상속포기를 하면 <b>처음부터 상속인이 아니었던 것<\/b>이 됩니다. 문제는 그 자리가 비는 것이 아니라 <b>다음 순위로 넘어간다<\/b>는 점입니다. 우리 민법의 상속 순위는 다음과 같습니다.<\/p>\n<table>\n<tr><th>순위<\/th><th>상속인<\/th><\/tr>\n<tr><td><b>1순위<\/b><\/td><td>직계비속(자녀 → 손자녀)<\/td><\/tr>\n<tr><td><b>2순위<\/b><\/td><td>직계존속(부모 → 조부모)<\/td><\/tr>\n<tr><td><b>3순위<\/b><\/td><td>형제자매<\/td><\/tr>\n<tr><td><b>4순위<\/b><\/td><td>4촌 이내의 방계혈족(삼촌·고모·조카 등)<\/td><\/tr>\n<tr><td colspan=\"2\"><b>배우자<\/b>는 1·2순위와 <b>공동상속<\/b>, 1·2순위가 없으면 <b>단독상속<\/b><\/td><\/tr>\n<\/table>\n<div class=\"warn\"><b>⛔ 실제로 벌어지는 일<\/b><p style=\"margin:8px 0 0\">아버지의 빚 때문에 <b>자녀들만 포기<\/b>했더니, 몇 달 뒤 <b>연락도 안 하고 지내던 삼촌·고모에게 채권추심장이 도착<\/b>하는 경우가 있습니다. 그분들은 <b>상속개시 사실조차 몰랐다가 3개월을 넘겨<\/b> 법정단순승인이 되어버리기도 합니다. <b>포기는 반드시 후순위까지 함께 검토<\/b>해야 하는 이유입니다.<\/p><\/div>\n<p>그래서 포기를 택할 때는 <b>4순위까지 연락 가능한 친족 전원이 함께 포기<\/b>하거나, <b>2번 표의 \"배우자 한정승인 + 자녀 전원 포기\"<\/b> 조합으로 <b>한 번에 끝내는 방법<\/b>을 검토합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 2023년에 바뀐 대법원 판례 (자녀 전부 포기 시)<\/h2>\n<p>이 주제에서 <b>인터넷에 남아 있는 옛 정보와 결론이 정반대인 지점<\/b>이 하나 있습니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>배우자와 자녀 중 <b>자녀 전부가 포기<\/b>하면 누가 상속인?<\/th><\/tr>\n<tr><td><b>종전(2015년 판결)<\/b><\/td><td>배우자 + <b>손자녀 또는 직계존속<\/b>이 공동상속인<\/td><\/tr>\n<tr><td><b>현재(2023년 전원합의체)<\/b><\/td><td><b>배우자가 단독상속인<\/b><\/td><\/tr>\n<\/table>\n<p>대법원은 <b>2023년 3월 23일 자 2020그42 전원합의체 결정<\/b>에서, 피상속인의 배우자와 자녀 중 <b>자녀 전부가 상속을 포기한 경우 배우자가 단독상속인이 된다<\/b>고 판단하고, 이와 배치되는 종전 <b>2015년 5월 14일 선고 2013다48852 판결<\/b>을 변경했습니다.<\/p>\n<div class=\"tip\"><b>💡 이게 왜 중요한가<\/b><p style=\"margin:8px 0 0\">종전 해석대로라면 <b>미성년 손자녀까지 상속인이 되어<\/b> 별도로 포기 절차를 밟아야 했습니다. 지금은 <b>배우자가 단독상속인<\/b>이 되므로, <b>배우자 한정승인 + 자녀 전원 포기<\/b> 조합이 <b>손자녀를 끌어들이지 않고<\/b> 깔끔하게 정리되는 방식으로 자리 잡았습니다. <b>2023년 이전에 작성된 블로그 글<\/b>을 보고 준비하면 불필요한 절차를 밟게 되니 주의하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 3개월은 언제부터? 놓쳤을 때 쓰는 특별한정승인<\/h2>\n<h3>기산점 — \"사망일\"이 아니라 \"안 날\"<\/h3>\n<p>고려기간 3개월은 <b>상속개시가 있음을 안 날<\/b>부터 셉니다. 사망 사실과 <b>자신이 상속인이 되었다는 사실<\/b>을 안 때가 기준이므로, <b>후순위 상속인은 앞 순위가 모두 포기한 사실을 안 날<\/b>부터 3개월이 시작됩니다. 사망일로부터 1년이 지나 통지를 받은 삼촌도 <b>그 사실을 안 날부터 3개월<\/b>이 남아 있는 것입니다.<\/p>\n\n<h3>이미 3개월이 지났다면 — 특별한정승인<\/h3>\n<p>기간이 지나 <b>단순승인이 되어버린 뒤에도<\/b> 구제 수단이 있습니다. 민법 제1019조 제3항의 <b>특별한정승인<\/b>입니다.<\/p>\n<table>\n<tr><th>요건<\/th><th>내용<\/th><\/tr>\n<tr><td><b>① 몰랐을 것<\/b><\/td><td>상속채무가 상속재산을 <b>초과한다는 사실<\/b>을 몰랐어야 함<\/td><\/tr>\n<tr><td><b>② 중대한 과실이 없을 것<\/b><\/td><td>조금만 살펴봤으면 알 수 있었던 경우는 <b>인정되지 않음<\/b><\/td><\/tr>\n<tr><td><b>③ 기한<\/b><\/td><td>그 사실을 <b>안 날부터 3개월 이내<\/b>에 한정승인 신고<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>👶 미성년자였던 상속인을 위한 조항 (2022년 12월 신설)<\/b><p style=\"margin:8px 0 0\">민법 제1019조 <b>제4항<\/b>은 <b>법률 제19069호로 2022년 12월 13일 신설·시행<\/b>되었습니다. <b>미성년자인 상속인이 성년이 되기 전에 채무 초과 상속을 단순승인한 경우<\/b>, <b>성년이 된 후 그 채무 초과 사실을 안 날부터 3개월 내<\/b>에 한정승인을 할 수 있습니다. 미성년일 때 특별한정승인을 하지 않았거나 할 수 없었던 경우에도 같습니다. 이른바 <b>'빚 대물림 방지' 조항<\/b>으로, 부모의 빚을 모르고 성년이 된 자녀에게 마지막 기회를 주는 규정입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 무심코 하면 결정이 무효가 되는 행동 7가지<\/h2>\n<h3>함정 ① 상속재산을 처분하면 → 그 순간 단순승인<\/h3>\n<p>민법 제1026조는 <b>상속인이 상속재산에 대한 처분행위를 한 때<\/b>를 법정단순승인 사유로 정합니다. <b>고인의 예금을 인출해 쓰거나, 부동산·주식을 팔거나, 상속받은 돈으로 본인 빚을 갚는 행위<\/b>가 여기 해당할 수 있습니다. 이렇게 되면 <b>이후에 포기·한정승인을 신고해도 받아들여지지 않을 수 있습니다.<\/b> 빚이 많아 보인다면 <b>고인의 계좌에 손대지 마세요.<\/b><\/p>\n\n<h3>함정 ② 재산목록에서 일부를 빠뜨리면 → 한정승인이 깨집니다<\/h3>\n<p>한정승인이나 포기를 한 뒤에도 <b>상속재산을 은닉하거나 부정소비하거나, 고의로 재산목록에 기입하지 않은 때<\/b>는 법정단순승인 사유입니다. 목록 작성 시 <b>아는 재산은 전부 기재<\/b>해야 합니다.<\/p>\n\n<h3>함정 ③ 한 번 한 포기는 3개월 안이라도 취소할 수 없습니다<\/h3>\n<p>상속의 승인·포기는 <b>고려기간 내라도 이를 취소하지 못한다<\/b>는 것이 원칙입니다(민법 제1024조). 다만 <b>착오·사기·강박<\/b>에 의한 경우 예외적으로 취소할 수 있는데, 그 취소권도 <b>추인할 수 있는 날부터 3개월, 승인·포기한 날부터 1년<\/b> 내에 행사해야 합니다. <b>\"일단 포기하고 나중에 무르면 되지\"는 통하지 않습니다.<\/b><\/p>\n\n<h3>함정 ④ \"포기했으니 사망보험금·유족연금도 못 받는다\" → 대체로 아닙니다<\/h3>\n<p>상속인이 <b>보험수익자로 지정된 사망보험금<\/b>은 일반적으로 <b>상속재산이 아니라 수익자의 고유재산<\/b>으로 봅니다. 유족연금 역시 <b>유족 고유의 권리<\/b>로 보는 것이 원칙입니다. 따라서 상속을 포기해도 <b>받을 수 있는 경우가 많습니다.<\/b> 다만 <b>수익자를 \"피상속인 본인\"으로 지정한 경우<\/b> 등 계약 내용에 따라 결론이 달라질 수 있으므로 <b>보험증권의 수익자 표기를 반드시 확인<\/b>하고 상담을 받으세요.<\/p>\n\n<h3>함정 ⑤ 한정승인은 신고로 끝이 아닙니다 — 청산 절차가 남습니다<\/h3>\n<p>한정승인 신고가 수리되면 <b>5일 내에 채권자에 대한 공고·최고<\/b>를 해야 하고, 그 신고 기간은 <b>2개월 이상<\/b>이어야 합니다. 이후 신고된 채권자에게 <b>우선권 있는 채권부터 순서대로 배당변제<\/b>합니다. 이 절차를 방치하면 <b>부당변제 책임<\/b>을 질 수 있습니다. <b>신문 공고 비용·절차가 따르므로 실무상 전문가 도움을 받는 경우가 많습니다.<\/b><\/p>\n\n<h3>함정 ⑥ 후순위 상속인에게 알리지 않으면<\/h3>\n<p>4번에서 본 대로 <b>포기는 다음 순위로 빚을 넘깁니다.<\/b> 나만 정리하고 끝냈다고 생각하면, <b>연락 안 되는 친족이 3개월을 그냥 넘겨<\/b> 빚을 떠안게 됩니다. 포기를 결정했다면 <b>후순위 친족에게 먼저 알리는 것<\/b>이 사실상 필수입니다.<\/p>\n\n<h3>함정 ⑦ 상속세·취득세는 별개 문제입니다<\/h3>\n<p>상속을 <b>포기<\/b>하면 그 사람에게는 상속세 납세의무가 생기지 않지만, <b>한정승인<\/b>은 재산을 취득하는 구조이므로 <b>세금 문제가 따로 남습니다.<\/b> 상속세 신고기한 등은 <b>아래 '함께 보면 좋은 글'의 상속세·증여세 편<\/b>을 참고하고, 구체적 계산은 <b>세무 상담<\/b>을 받으세요.<\/p>\n<!-- [운영자 경험 자리] 가족·지인의 상속 정리 경험이 있으면 1~2문장. 없으면 비워둠 -->\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 신청 방법 · 서류 · 각하 사유<\/h2>\n<h3>어디에 내나<\/h3>\n<p><b>상속개시지(피상속인의 마지막 주소지)를 관할하는 가정법원<\/b>에 신고합니다. 상속인이 여러 명이어도 <b>각자 신고<\/b>합니다.<\/p>\n\n<h3>필요 서류 (법원·사안에 따라 가감)<\/h3>\n<table>\n<tr><th>구분<\/th><th>서류<\/th><\/tr>\n<tr><td><b>공통<\/b><\/td><td>상속포기(또는 한정승인) <b>심판청구서<\/b>, 신고인 <b>가족관계증명서·주민등록등본<\/b>, <b>인감증명서·인감도장<\/b><\/td><\/tr>\n<tr><td><b>피상속인 관련<\/b><\/td><td><b>기본증명서·가족관계증명서·말소자 주민등록초본(제적등본)<\/b> 등 사망과 관계를 증명하는 서류<\/td><\/tr>\n<tr><td><b>한정승인만<\/b><\/td><td><b>상속재산목록<\/b>(필수 첨부)<\/td><\/tr>\n<tr><td><b>후순위 상속인<\/b><\/td><td>선순위자의 <b>상속포기 심판문<\/b> 등 \"안 날\"을 증명할 자료<\/td><\/tr>\n<\/table>\n<p>신고서에는 <b>당사자와 피상속인의 정보, 상속개시 있음을 안 날, 포기 또는 한정승인의 취지<\/b>를 기재하고 <b>기명날인 또는 서명<\/b>합니다.<\/p>\n<div class=\"tip\"><b>💰 비용은 접수 법원에서 확인하세요<\/b><p style=\"margin:8px 0 0\">인지대·송달료는 <b>상속인 수와 법원에 따라 달라집니다.<\/b> 이 글에서는 정확한 금액을 단정하지 않습니다 — <b>접수하려는 가정법원 종합민원실<\/b>이나 <b>대한민국 법원 전자민원센터<\/b>에서 확인하세요. 소득·재산 요건을 충족하면 <b>대한법률구조공단(132)<\/b>의 무료 법률구조를 받을 수 있습니다.<\/p><\/div>\n\n<h3>각하·불수리로 이어지는 대표 사유 6가지<\/h3>\n<table>\n<tr><th>사유<\/th><th>설명<\/th><\/tr>\n<tr><td><b>기간 도과<\/b><\/td><td>안 날부터 3개월 경과(특별한정승인 요건도 못 갖춘 경우)<\/td><\/tr>\n<tr><td><b>이미 처분행위를 함<\/b><\/td><td>예금 인출·재산 매각 등 → <b>법정단순승인<\/b><\/td><\/tr>\n<tr><td><b>재산목록 누락<\/b>(한정승인)<\/td><td>목록 미첨부 또는 <b>고의 누락<\/b><\/td><\/tr>\n<tr><td><b>일부·조건부 포기<\/b><\/td><td>포기는 <b>상속재산 전부<\/b>에 대해서만 가능. 일부·조건부는 불가<\/td><\/tr>\n<tr><td><b>관할 착오<\/b><\/td><td>상속개시지 아닌 법원에 접수<\/td><\/tr>\n<tr><td><b>\"안 날\" 소명 부족<\/b><\/td><td>후순위 상속인이 기산점을 증명하지 못한 경우<\/td><\/tr>\n<\/table>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 자주 묻는 질문<\/h2>\n<h3>Q. 사망한 지 6개월이 지나 채권추심장을 받았습니다. 이미 늦었나요?<\/h3>\n<p>단정할 수 없습니다. 3개월은 <b>사망일이 아니라 상속개시를 안 날<\/b>부터입니다. 본인이 상속인이 된 사실을 <b>그 추심장으로 처음 알았다면<\/b> 그날부터 3개월이 남아 있을 수 있습니다. 또 채무 초과 사실을 중대한 과실 없이 몰랐다면 <b>특별한정승인<\/b>도 검토 대상입니다. <b>즉시 상담<\/b>하세요.<\/p>\n<h3>Q. 형제 중 저만 포기하면 되나요?<\/h3>\n<p>아닙니다. 같은 순위 상속인 일부만 포기하면 <b>그 지분이 같은 순위의 나머지 상속인에게<\/b> 돌아갑니다. 같은 순위 전원이 포기하면 <b>다음 순위<\/b>로 넘어갑니다. <b>가족 전체 계획을 세워 진행<\/b>해야 합니다.<\/p>\n<h3>Q. 재산이 얼마인지 전혀 모릅니다. 어떻게 하나요?<\/h3>\n<p><b>정부24 '안심상속 원스톱 서비스'<\/b>로 금융·국세·지방세·연금·자동차 등을 일괄 조회할 수 있습니다. 조회 결과가 늦어져 3개월이 촉박하다면 <b>가정법원에 고려기간 연장<\/b>을 청구하거나, 안전하게 <b>한정승인<\/b>을 택하는 방법이 있습니다.<\/p>\n<h3>Q. 고인의 통장에서 장례비를 썼는데 문제가 되나요?<\/h3>\n<p>상속재산 처분으로 볼 여지가 있어 위험합니다. 사회통념상 상당한 장례비 지출은 처분행위로 보지 않는다는 실무 해석도 있으나, <b>사안에 따라 다투어질 수 있습니다.<\/b> 이미 인출했다면 <b>사용 내역과 증빙을 반드시 보관<\/b>하고 상담을 받으세요.<\/p>\n<h3>Q. 한정승인과 포기를 같이 할 수 있나요?<\/h3>\n<p>한 사람이 둘 다 할 수는 없습니다. 다만 <b>상속인마다 다른 선택<\/b>은 가능해서, <b>배우자는 한정승인·자녀는 포기<\/b>처럼 조합하는 것이 실무에서 널리 쓰입니다(2번 참고).<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&amp;csmSeq=255&amp;ccfNo=4&amp;cciNo=4&amp;cnpClsNo=1\" target=\"_blank\" rel=\"nofollow\">▸ 찾기쉬운 생활법령정보(법제처) — 상속의 포기<\/a><a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&amp;csmSeq=255&amp;ccfNo=4&amp;cciNo=3&amp;cnpClsNo=1\" target=\"_blank\" rel=\"nofollow\">▸ 찾기쉬운 생활법령정보(법제처) — 상속의 한정승인<\/a><a href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EB%AF%BC%EB%B2%95\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 민법(제1019조·제1024조·제1026조)<\/a><a href=\"https://www.scourt.go.kr\" target=\"_blank\" rel=\"nofollow\">▸ 대한민국 법원 — 관할 법원 찾기·양식·비용 안내<\/a><a href=\"https://www.gov.kr\" target=\"_blank\" rel=\"nofollow\">▸ 정부24 — 안심상속 원스톱 서비스(재산·채무 일괄 조회)<\/a><a href=\"https://www.klac.or.kr\" target=\"_blank\" rel=\"nofollow\">▸ 대한법률구조공단(132) — 무료 법률상담<\/a><\/div>\n\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">상속에서 <b>가장 비싼 실수는 \"일단 두고 보자\"<\/b>입니다. <b>안 날부터 3개월<\/b>이 지나면 자동으로 빚까지 물려받은 것이 되고, 그 사이 <b>고인의 예금을 한 번 인출한 것만으로<\/b> 결정이 굳어질 수 있습니다. 순서는 간단합니다 — <b>① 안심상속으로 재산·빚 조회 → ② 빚이 명백히 많으면 포기(후순위까지), 애매하면 한정승인 → ③ 3개월 안에 상속개시지 가정법원에 신고.<\/b> 자녀가 여럿이라면 <b>'배우자 한정승인 + 자녀 전원 포기'<\/b> 조합으로 다음 순위 친족까지 끌려 들어가는 일을 막을 수 있습니다. 오늘이 며칠째인지부터 세어 보세요.<\/p><\/div>\n\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 법령 개정·판례 변경으로 내용이 달라질 수 있습니다. 인지대·송달료 등 비용은 상속인 수와 법원에 따라 달라 본문에 금액을 표기하지 않았으니 접수 법원에서 확인하세요.<br>출처: 법제처 <a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&amp;csmSeq=255&amp;ccfNo=4&amp;cciNo=3&amp;cnpClsNo=1\">찾기쉬운 생활법령정보 — 상속의 승인·포기<\/a>, <a href=\"https://www.law.go.kr\">국가법령정보센터<\/a> 민법 제1019조·제1024조·제1025조·제1026조·제1032조·제1042조(제1019조 제4항은 법률 제19069호, 2022. 12. 13. 신설·시행), 대법원 2023. 3. 23. 자 <b style=\"display:inline;color:#33503a;margin:0\">2020그42<\/b> 전원합의체 결정(대법원 2015. 5. 14. 선고 2013다48852 판결 변경)<\/div>\n\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/06/2026_01852820895.html\">▸ 상속세 증여세 면제 한도 세율 신고기한 총정리 (2026)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_491.html\">▸ 휴면예금 조회 숨은 내 돈 찾기 방법 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_21.html\">▸ 자동차 채권 미환급금 조회 환급 신청 방법 총정리<\/a><\/div>\n\n<div id=\"ymyl-disclaimer\" style=\"margin-top:22px;font-size:13px;color:#666;line-height:1.6\">본 글은 법령·판례를 정리한 <b>정보 제공용<\/b>이며 <b>법률 자문이 아닙니다.<\/b> 상속포기·한정승인의 인용 여부와 효과는 개별 사실관계와 법원의 판단에 따라 달라집니다. 본문의 금액 사례는 제도 작동 방식을 설명하기 위한 가정값입니다. 결정 전에 <b>대한법률구조공단(132)<\/b> 또는 변호사와 상담하세요.<\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 기한·요건·판례는 <b>법제처 생활법령정보와 국가법령정보센터 원문을 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 확인하지 못한 비용 항목은 금액을 적지 않았습니다. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 부모님 빚이 걱정된다면 '가만히 있는 것'이 가장 위험합니다. 상속개시를 안 날부터 3개월 안에 한정승인이나 포기를 하지 않으면, 민법상 자동으로 '단순승인' — 빚까지 전부 물려받은 것이 됩니다.\n2. 빚이 명백히 많으면 포기, 규모를 모르거나 지킬 재산이 있으면 한정승인. 포기는 빚을 손자녀·부모·형제·4촌까지 계속 넘기므로, 실무에서는 '배우자 한정승인 + 자녀 전원 포기'로 한 번에 끝내는 조합을 많이 씁니다.\n3. 결정이 무효가 되는 행동 주의 — 고인의 예금을 인출하거나 재산을 팔면 그 순간 단순승인으로 간주돼 이후 포기·한정승인이 막힐 수 있습니다. 3개월이 이미 지났다면 '특별한정승인'(채무초과 사실을 안 날부터 3개월)을 확인하세요. 2022년 12월 신설된 민법 제1019조 제4항은 미성년이던 상속인에게 성년 후 3개월의 기회를 줍니다.\n"},{"code":"E1-02","title":"어르신 휴대폰 요금감면 신청 방법 대상 감면액 총정리 (2026 기초연금·장애인·국가유공자)","lane":"info","thumb":"133_telecom_discount.png","draft":"","facts":"각도=이동통신 요금감면은 자동 적용이 아니라 별도 신청이 필요하다는 점이 핵심 함정. 대상=기초연금 수급자·장애인·국가유공자·차상위 등 유형별로 감면 폭이 다름. 다뤄야 할 판단정보=①감면 중복 가능 여부 ②알뜰폰(MVNO) 적용 범위 ③가족 명의 회선일 때 처리 ④신청 경로별(복지로·정부24·통신사·주민센터) 차이. 출처=복지로·정부24·과학기술정보통신부·통신사 고객센터. 커버리지 근거=E1(통신·요금) 1편뿐인 최대 공백, 통신은 고단가 영역. 중복게이트 통과(최고 0.201 vs A2-11). 내부링크 후보=E1-01 알뜰폰 요금제 비교. ⚠️감면액·한도 등 수치는 전부 미검증 — 발행 전 1차 출처 확인 필수","added":"2026-07-27","thumb_data":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCACIAQQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkN const STEPS=[{n:1,who:'ai',t:'글감 선정'},{n:2,who:'me',t:'글감 승인',star:1},{n:3,who:'ai',t:'코드 배정'},{n:4,who:'ai',t:'본문 작성 + 팩트체크'},{n:5,who:'ai',t:'썸네일 생성'},{n:6,who:'ai',t:'관련글 내부링크'},{n:7,who:'ai',t:'Blogger 초안'},{n:8,who:'me',t:'라이브 발행',star:1},{n:9,who:'ai',t:'DB 반영 + 검증'},{n:10,who:'ai',t:'배포 (콘솔·카테고리)'},{n:11,who:'me',t:'네이버 확산',star:1},{n:12,who:'me',t:'쓰레드 확산',star:1},{n:13,who:'me',t:'인스타 확산',star:1},{n:14,who:'ai',t:'채널 교차링크'},{n:15,who:'me',t:'서치콘솔 색인 요청',star:1},{n:16,who:'ai',t:'색인 반영 실측'}];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fnum=n=>Number(n).toLocaleString('ko-KR');
async function load(){
  const D=window.__DATA__||{};
  const h=D.health, db=D.db, pg=D.progress, collab=D.collab, idx=D.index_status, pend=D.pending, queue=D.queue;
  const recs=db?(Array.isArray(db)?db:(db.posts||[])):[];
  const count=db&&db.count?db.count:recs.length;
  const light=h?h.light:'gray', pass=h?h.pass:0, total=h?(h.pass+h.warn+h.fail):0;
  const avg=pg&&pg.avg?fnum(pg.avg):'—', date=pg&&pg.updated?pg.updated:'';
  const bcls=light==='green'?'b-green':light==='red'?'b-bad':'b-warn';
  const blab=light==='green'?'신호등 green':light==='red'?'신호등 red':'신호등 warn';
  const today=(pg&&pg.today||[]).map(it=>'<div class="row '+(it.done?'done':'warn')+'">'+(it.done?CHECK:LOAD)+'<span>'+esc(it.t)+'</span></div>').join('');
  const next=(pg&&pg.next||[]).map(t=>'<div class="row">'+DOT+'<span class="mut">'+esc(t)+'</span></div>').join('');
  const pl=(pg&&pg.pipeline)||{};
  const _cc=(pl.code||'').split(' ')[0], _cur=recs.find(r=>r.code===_cc);
  let checked=(pl.checked||[]).slice();
  // 확산 단계(11~14)는 보드 시드값을 쓰지 않고 DB의 osmu 기록에서 그대로 도출한다.
  //   · DB osmu 는 "실제로 게시된 것"의 기록이므로 확산 여부의 유일한 정답이다.
  //   · 예전 코드는 DB에서 체크를 추가만 하고 제거하지 않아, board_seed 가 미리 찍어둔
  //     낡은 checked 값이 그대로 남아 미게시 글을 확산 완료로 표시했다.
  //     (실측: C2-07 은 osmu 기록이 없는데 checked 에 11·12·13 이 들어 있었다)
  //   · 인스타를 13단계로 넣으면서 번호가 한 칸씩 밀렸으므로, 낡은 번호를 그대로
  //     신뢰하면 단계 의미까지 어긋난다. 도출로 바꾸면 이 문제가 함께 사라진다.
  // 교차링크(14)는 네이버·쓰레드 기준을 유지한다 — 인스타는 54/153편으로 확산률이 낮아
  // 조건에 넣으면 대부분의 글에서 교차링크가 미완으로 뒤집힌다.
  if(_cur){
    const om=_cur.osmu||{};
    const derived={11:!!om.naver,12:!!om.threads,13:!!om.instagram,14:!!(om.naver&&om.threads)};
    checked=checked.filter(n=>!(n in derived));
    Object.keys(derived).forEach(k=>{if(derived[k])checked.push(+k);});
    checked.sort((a,b)=>a-b);
  }
  const done=checked.length;
  const omAll=recs.filter(r=>r.osmu&&typeof r.osmu==='object');
  const oNv=omAll.filter(r=>r.osmu.naver).length, oTh=omAll.filter(r=>r.osmu.threads).length, oIn=omAll.filter(r=>r.osmu.instagram).length;
  // 미결 관리의 I 칩은 DB에서 직접 도출한다. pending.json 의 ch 는 {g,n,t} 만 담고
  // 있어서(pending 생성기가 아직 인스타를 모른다) ch.i 를 믿으면 게시한 글도 ✗ 로 나온다.
  const osmuByCode={}; recs.forEach(r=>{if(r.code)osmuByCode[r.code]=r.osmu||{};});
  const oRecent=omAll.slice(-4).reverse();
  const nowN=pl.code?(STEPS.find(s=>checked.indexOf(s.n)<0)||{}).n:0;
  let pubHtml;
  if(pl.code){
    const pct=Math.round(done/STEPS.length*100);
    const lis=STEPS.map(st=>{
      const on=checked.indexOf(st.n)>=0, now=(!on&&st.n===nowN);
      const ic=on?CHECK:(now?NOWI:WAIT), cls=on?'on':(now?'now':'wait');
      return '<li class="'+cls+'">'+ic+'<span class="num">'+st.n+'</span>'
        +'<span class="who '+st.who+'">'+(st.who==='ai'?'🤖':'🧑')+'</span>'
        +'<span class="lbl">'+esc(st.t)+(st.star?'<span class="star">★</span>':'')+'</span></li>';
    }).join('');
    pubHtml='<div class="pcode">'+esc(pl.code)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div>'
      +'<div class="cnt">'+done+' / '+STEPS.length+' 단계'+(pl.note?' · '+esc(pl.note):'')+'</div><ul>'+lis+'</ul>'
      +'<div class="banner'+(done===STEPS.length?' show':'')+'">✅ 발행·확산 완료</div>';
  }else{
    pubHtml='<div class="pcode none">진행 중인 발행 없음</div>';
  }
  const osmuLi=oRecent.map(r=>'<div class="row done">'+CHECK+'<span>'+esc(r.code)+' '+esc((r.title||'').slice(0,15))+'</span><span class="mut" style="margin-left:auto;font-size:10.5px">'+(r.osmu.naver?'네이버 ':'')+(r.osmu.threads?'쓰레드 ':'')+(r.osmu.instagram?'인스타':'')+'</span></div>').join('');
  // 🤝 협업 — 세션별(collab.json: 정체성=레지스트리·활동=git log·상태=git status)
  const stLab={active:'활동중',uncommitted:'미커밋',idle:'대기'};
  const collabHtml=(collab&&collab.agents||[]).map(a=>{
    const acts=(a.recent||[]).map(r=>'<div class="act">'+esc((r.s||'').slice(0,40))+' <span class="d">'+esc(r.d||'')+'</span></div>').join('');
    return '<div class="agent"><div class="ah">'+esc(a.emoji||'')+'<span>'+esc(a.name||'')+'</span><span class="st '+(a.state||'idle')+'">'+(stLab[a.state]||a.state||'')+'</span></div>'
      +'<div class="role">'+esc(a.role||'')+'</div><div class="own">담당 '+esc(a.owns||'')+'</div>'+acts+'</div>';
  }).join('');
  // 💡 시스템 조언 — 라이브 데이터 조건에서만 도출(하드코딩 일반론 금지)
  const adv=[];
  if(idx&&typeof idx.indexed==='number'){
    const iDt=idx.checked_at?' ('+String(idx.checked_at).slice(5)+' 실측)':'';
    if(idx.indexed===0){const cr=Object.values(idx.posts||{}).filter(p=>p&&p.lastCrawl).length;
      adv.push('색인 0/'+idx.total+iDt+' — 크롤 '+cr+'편·미크롤 '+(idx.total-cr)+'편. GSC 일일한도+OSMU 백링크로 점진(재검토는 색인 잡힌 뒤).');}
    else adv.push('색인 '+idx.indexed+'/'+idx.total+'편'+iDt+'.');
  }
  if(oNv>oTh) adv.push('OSMU 쓰레드 '+oTh+'/'+oNv+' — '+(oNv-oTh)+'편 미게시(rate-limit 보류분 재시도 필요).');
  if(oTh>oIn) adv.push('OSMU 인스타 '+oIn+'/'+oTh+' — 쓰레드 확산 대비 '+(oTh-oIn)+'편 미확산(카드뉴스 backlog).');
  if(collab&&collab.uncommitted>=10) adv.push('미커밋 '+collab.uncommitted+'파일 — 발행 완료 후 세션별 커밋 분리 권장.');
  const adviceHtml=adv.length?'<div class="advice">'+adv.map(t=>'<div class="ai"><span class="ic">💡</span><span>'+esc(t)+'</span></div>').join('')+'</div>':'<div class="pcode none">현재 조치 필요 항목 없음</div>';
  // 📋 미결 관리 — 글별(pending.json: DB osmu + index_status에서 계산)
  const pc=(pend&&pend.counts)||{};
  const cb=(ok,l)=>'<span class="ch '+(ok?'on':'off')+'">'+l+(ok?'✓':'✗')+'</span>';
  const pendRows=(pend&&pend.actionable||[]).map(a=>{
    const c=a.ch||{};
    return '<div class="prow"><span class="pcd">'+esc(a.code)+'</span><span class="ptt">'+esc(a.title)+'</span>'
    +cb(c.g!==false,'G')+cb(c.n,'N')+cb(c.t,'T')+cb((osmuByCode[a.code]||{}).instagram,'I')+'</div>';
  }).join('');
  // 표시는 상위 14편으로 잘려 있음(pending.py) → 남은 수는 counts로 계산해 "…외 N편"
  const pendListed=(pend&&pend.actionable||[]).length;
  const pendTotal=Math.max(pc.osmu_pending||0,pc.index_pending||0);
  const pendMore=pendTotal>pendListed?'<div class="cnt">…외 '+(pendTotal-pendListed)+'편</div>':'';
  const pendHtml='<div class="cnt">OSMU 대기 '+(pc.osmu_pending||0)+'편 · 색인 대기 '+(pc.index_pending||0)+'편 / 전체 '+(pc.total||0)+'편</div>'+(pendRows||'<div class="pcode none">미결 없음</div>')+pendMore;
  // 📋 발행 대기 (발행 전 큐 — queue.json) : 코드·제목·썸네일을 한 카드로 묶어 '엉뚱한 글/썸네일' 눈으로 차단
  const qItems=(queue&&queue.items)||[];
  const laneLab={info:'정보성',pop:'대중관심'};
  const qCards=qItems.map(it=>{
    const th=it.thumb_data
      ?'<img class="qth" src="'+it.thumb_data+'" alt="">'
      :'<div class="qth none">썸네일<br>없음</div>';
    const facts=it.facts?'<div class="qfacts">'+esc(it.facts)+'</div>':'';
    const draft=it.draft?'<span class="qdraft">📄 '+esc(it.draft)+'</span>':'';
    const pv=it.body?'<button class="qpv" onclick="qpv(\''+esc(it.code||'')+'\')">👁 본문 미리보기</button>'
                    :'<span class="qpv none">초안 없음(작성 전)</span>';
    return '<div class="qcard">'+th
      +'<div class="qbody"><div class="qtop"><span class="qcode">'+esc(it.code||'')+'</span>'
      +'<span class="qlane '+(it.lane||'info')+'">'+esc(laneLab[it.lane]||it.lane||'')+'</span></div>'
      +'<div class="qtitle">'+esc(it.title||'')+'</div>'+facts
      +'<div class="qmeta">'+pv+draft+'</div></div></div>';
  }).join('');
  const qHtml=qItems.length
    ?'<div class="cnt">발행 대기 '+qItems.length+'건 — 발행하면 카드가 자동으로 사라집니다(사람 승인 게이트)</div>'+qCards
    :'<div class="pcode none">발행 대기 없음 — PREP 루틴이 준비하면 여기 카드로 뜹니다</div>';
  document.getElementById('board').innerHTML=
   '<div class="hd"><div class="t"><h1>진행현황</h1><span class="date">'+esc(date)+'</span></div>'
   +'<span class="badge '+bcls+'">'+CHECK+esc(blab)+'</span></div>'
   +'<div class="sec">오늘 한 일</div>'+today
   +'<div class="metrics">'
   +'<div class="m"><div class="l">검사 통과</div><div class="v">'+pass+' <small>/ '+total+'</small></div></div>'
   +'<div class="m"><div class="l">블로그 글</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">평균 본문</div><div class="v">'+avg+' <small>자</small></div></div>'
   +'</div>'
   +'<div class="div"></div>'
   +'<div class="sec">📋 발행 대기 (오늘 발행할 글)<span class="auto">🤖 PREP 큐</span></div>'+qHtml
   +'<div class="div"></div>'
   +'<div class="sec">발행 진행 (글 1편 · '+STEPS.length+'단계, 확산 포함)<span class="auto">🤖 자동</span></div>'+pubHtml
   +'<div class="div"></div>'
   +'<div class="sec">📡 4채널 발행 현황 (구글·네이버·쓰레드·인스타)<span class="auto">🤖 DB 자동집계</span></div>'
   +'<div class="metrics">'
   +'<div class="m"><div class="l">구글(원본)</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">네이버</div><div class="v">'+oNv+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">쓰레드</div><div class="v">'+oTh+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">인스타</div><div class="v">'+oIn+' <small>편</small></div></div>'
   +'</div>'
   +'<div class="cnt">확산 커버리지 · 네이버 '+(count?Math.round(oNv/count*100):0)+'% · 쓰레드 '+(count?Math.round(oTh/count*100):0)+'% · 인스타 '+(count?Math.round(oIn/count*100):0)+'% · 교차링크 완료 '+omAll.length+'편</div>'
   +osmuLi
   +'<div class="div"></div>'
   +'<div class="sec">🤝 협업 — 세션별 역할·진행<span class="auto">git 자동분류</span></div>'+collabHtml
   +'<div class="sec">💡 시스템 조언<span class="auto">라이브 도출</span></div>'+adviceHtml
   +'<div class="div"></div>'
   +'<div class="sec">📋 미결 관리 — 4채널 매칭<span class="auto">G구글·N네이버·T쓰레드·I인스타</span></div>'+pendHtml
   +'<div class="sec">다음</div><div class="next">'+next+'</div>'
   +'<div class="upd" id="upd"></div>';
  tick();
}
// 시계·데이터 기준만 갱신(보드 전체 재렌더 없음 — 정적 베이크 데이터라 시계만 변함)
function tick(){
  const el=document.getElementById('upd'); if(!el)return;
  const b=(window.__DATA__||{}).baked_at;
  el.textContent=(b?'데이터 기준 '+b+' · ':'')+new Date().toLocaleTimeString('ko-KR');
}
// 👁 발행 대기 카드 본문 미리보기 — 초안 HTML을 격리 iframe(srcdoc)로 렌더(스타일 누수 차단, Blogger 미접촉)
function qpv(code){
  const items=((window.__DATA__||{}).queue||{}).items||[];
  const it=items.find(x=>x.code===code); if(!it||!it.body)return;
  document.getElementById('qpv-ttl').textContent=(it.code||'')+' · '+(it.title||'');
  document.getElementById('qpv-fr').srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank"><body style="margin:0;padding:16px;background:#fff">'+it.body+'</body>';
  document.getElementById('qpv-ov').classList.add('show');
}
function qpvClose(){document.getElementById('qpv-ov').classList.remove('show');document.getElementById('qpv-fr').srcdoc='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')qpvClose();});
// 코드 자동 반영: 자기 자신(progress.html)을 주기적으로 fetch→해시 비교, 바뀌면 1회 reload
const _hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
let _selfHash=null;
async function checkVersion(){
  try{
    const r=await fetch('progress.html?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;                                // 일시적 404/500에 해시 오염 → 불필요 reload 방지
    const t=await r.text();
    const h=_hash(t);
    if(_selfHash===null){_selfHash=h;return;}      // 첫 호출=기준선 저장
    if(h!==_selfHash) location.reload();            // 코드 변경 감지 → 자동 새로고침
  }catch(e){}
}
load(); checkVersion(); setInterval(tick,5000); setInterval(checkVersion,5000);
</script>
