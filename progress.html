<title>진행현황 — 생활정보 모음</title>
<style>
:root{--bg:#0e1620;--card:#18222e;--card2:#13202d;--line:#26323f;--txt:#e6edf3;--mut:#8a97a6;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:470px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:16px;font-weight:600}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(63,185,80,.16);color:var(--ok)}
.b-warn{background:rgba(210,153,34,.16);color:var(--warn)}
.b-bad{background:rgba(248,81,73,.16);color:var(--bad)}
.sec{font-size:11px;color:var(--mut);letter-spacing:.05em;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
.metrics{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 2px}
/* 채널이 4개가 되어 490px 팝업에서 눌리므로, 좁아지면 2x2로 감싸게 한다 */
.m{flex:1 1 96px;background:var(--card2);border-radius:9px;padding:8px 10px}
.m .l{font-size:11px;color:var(--mut)}
.m .v{font-size:18px;font-weight:600;margin-top:2px}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #243049;font-size:12.5px}
li:last-child{border-bottom:none}
li.on{opacity:.62}
li.on .lbl{text-decoration:line-through}
li svg{width:15px;height:15px;flex:none}
li.on svg{color:var(--ok)}
li.now svg{color:#7fc1ff}
li.wait svg{color:#4a586e}
.num{font-size:11px;color:#6b7a99;width:16px;text-align:right;flex:none}
.who{font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px;flex:none}
.who.ai{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.who.me{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.lbl{font-size:12.5px}
.star{color:#ff8e8e;font-weight:800;margin-left:2px}
.banner{display:none;margin-top:9px;background:#0c3a2c;border:1px solid #1f6b52;color:#06d6a0;border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12.5px}
.banner.show{display:block}
.upd{font-size:11px;color:var(--mut);text-align:right;margin-top:12px}
.agent{background:var(--card2);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.agent .ah{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.agent .st{font-size:10px;font-weight:700;padding:1px 7px;border-radius:7px;margin-left:auto}
.st.active{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.st.uncommitted{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.st.idle{background:#222c3a;color:#6b7a99;border:1px solid #2e3a4a}
.agent .role{font-size:11px;color:var(--mut);margin:3px 0 1px}
.agent .own{font-size:10.5px;color:#5a6b80}
.agent .act{font-size:11px;color:#aeb9c7;margin-top:4px;padding-left:7px;border-left:2px solid #2a3a4d;line-height:1.5}
.agent .act .d{color:var(--mut);font-size:10px}
.advice{background:#13202d;border:1px solid #2a3a4d;border-radius:9px}
.advice .ai{display:flex;gap:8px;padding:7px 11px;font-size:12px;line-height:1.5;border-bottom:1px dashed #243049}
.advice .ai:last-child{border-bottom:none}
.advice .ic{flex:none}
.prow{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px dashed #243049;font-size:11.5px}
.prow:last-child{border-bottom:none}
.pcd{color:#7fc1ff;font-weight:700;flex:none;width:46px}
.ptt{flex:1;color:#cdd6e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{background:#3a2f12;color:#ffd166;border-radius:5px;padding:0 5px;font-size:9.5px;flex:none}
.pact{color:#06d6a0;font-size:10px;flex:none;font-weight:700}
.qcard{display:flex;gap:9px;padding:8px;margin:6px 0;background:#141c2c;border:1px solid #243049;border-radius:9px}
.qth{width:78px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:#0d1420}
.qth.none{display:flex;align-items:center;justify-content:center;color:#54627a;font-size:9px;text-align:center;line-height:1.2;border:1px dashed #2a3752}
.qbody{flex:1;min-width:0}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qcode{color:#7fc1ff;font-weight:700;font-size:11.5px}
.qlane{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700}
.qlane.info{background:#12283a;color:#7fc1ff}
.qlane.pop{background:#2f2136;color:#e0a3ff}
.qtitle{color:#e6edf5;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qfacts{color:#8a95a6;font-size:10px;margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qmeta{margin-top:4px}
.qdraft{color:#6b7688;font-size:9.5px;margin-left:8px}
.qpv{background:#17324a;color:#7fc1ff;border:1px solid #2a4d6e;border-radius:6px;font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer}
.qpv:hover{background:#1d4463}
.qpv.none{background:none;border:none;color:#54627a;font-weight:400;cursor:default;padding:3px 0}
#qpv-ov{display:none;position:fixed;inset:0;background:rgba(6,10,18,.82);z-index:999;align-items:center;justify-content:center;padding:18px}
#qpv-ov.show{display:flex}
.qpv-box{width:100%;max-width:760px;height:88vh;display:flex;flex-direction:column;background:#0f1626;border:1px solid #2a3752;border-radius:12px;overflow:hidden}
.qpv-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #243049;font-size:12.5px;font-weight:700;color:#7fc1ff}
.qpv-hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpv-x{background:#243049;color:#cdd6e0;border:none;border-radius:6px;font-size:11px;padding:5px 11px;cursor:pointer;flex:none}
.qpv-x:hover{background:#324158}
.qpv-fr,#qpv-fr{flex:1;width:100%;border:0;background:#fff}
.qpv-ft{padding:8px 14px;border-top:1px solid #243049;font-size:10px;color:#8a95a6;text-align:center}
.ch{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 4px;flex:none;margin-left:3px}
.ch.on{background:#0c3a2c;color:#06d6a0}
.ch.off{background:#3a1216;color:#f0707a}

,#3b7fd0);color:#fff !important;font-weight:800;font-size:17px;padding:15px 18px;border-radius:12px;text-decoration:none;margin:22px 0}\n.lsg table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:15px}\n.lsg th,.lsg td{border:1px solid #e0d7f6;padding:10px 12px;text-align:center}\n.lsg th{background:#f0ebfc}\n.lsg .tip{background:#f4f1fd;border:1px solid #ded4f7;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .warn{background:#fff3f3;border:1px solid #f6cccc;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .end{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:16px 20px;margin-top:24px}\n.lsg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#f4f1fd;border:1px solid #ded4f7;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#6544cc;margin-bottom:8px}\n.lsg .rel a{display:block;color:#5a3cc0;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#9a92aa;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>중국은 오랫동안 <b>여행 가려면 먼저 비자부터 받아야 하는 나라<\/b>였습니다. 그런데 지금은 <b>한국 일반여권만 있으면 비자 없이 최장 30일<\/b> 머물 수 있습니다. 문제는 이 조치가 <b>영구적인 것이 아니라 2026년 12월 31일까지로 기한이 정해진 한시 조치<\/b>라는 점입니다. 그래서 <b>\"언제 입국하느냐\"<\/b>가 비자 필요 여부를 가릅니다. 여기에 <b>30일을 세는 방법이 우리 상식과 다르고<\/b>, 호텔이 아닌 곳에 묵으면 <b>입국 후 24시간 안에 신고해야 하는 의무<\/b>까지 있어 모르고 갔다가 벌금을 무는 일이 생깁니다. 이 글에서는 <b>무비자로 되는 목적과 안 되는 목적, 30일 계산법, 연말 시한의 함정, 입국심사에서 막히는 경우, 주숙등기와 초과체류 벌금<\/b>까지 공식 발표 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 지금 상태 한 장 요약 (2026년 12월 31일까지)<\/a><a href=\"#sec2\">2. 무비자로 되는 목적 · 안 되는 목적<\/a><a href=\"#sec3\">3. 30일은 언제부터 세나 — 기산 계산<\/a><a href=\"#sec4\">4. '2026년 12월 31일'의 함정 — 입국 기준입니다<\/a><a href=\"#sec5\">5. 무비자 vs 240시간 환승 무비자 vs 관광비자 (판단표)<\/a><a href=\"#sec6\">6. 입국심사에서 막히는 5가지<\/a><a href=\"#sec7\">7. 입국하면 24시간 안에 — 주숙등기<\/a><a href=\"#sec8\">8. 30일을 넘기면 — 연장과 초과체류 벌금<\/a><a href=\"#sec9\">9. 홍콩·마카오·티베트는 별개입니다<\/a><a href=\"#sec10\">10. 자주 묻는 질문<\/a><a href=\"#sec11\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec3\">👉 30일 체류기간 계산법 바로 보기<\/a>\n\n<h2 id=\"sec1\">1. 지금 상태 한 장 요약 (2026년 12월 31일까지)<\/h2>\n<p>주한중국대사관이 <b>2025년 11월 6일<\/b> 공지한 내용이 현재 적용되는 기준입니다. 한국을 포함한 여러 나라에 대해 <b>비자면제 조치를 2026년 12월 31일까지 연장<\/b>한다는 발표였습니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>내용<\/th><\/tr>\n<tr><td><b>대상 여권<\/b><\/td><td><b>일반여권<\/b> 소지자 (관용·외교여권은 별도 규정)<\/td><\/tr>\n<tr><td><b>체류 한도<\/b><\/td><td><b>최장 30일<\/b> (연속 30 자연일)<\/td><\/tr>\n<tr><td><b>적용 기한<\/b><\/td><td><b>2026년 12월 31일까지<\/b> 입국분<\/td><\/tr>\n<tr><td><b>허용 목적<\/b><\/td><td>비즈니스(상용) · 관광 · 친지 방문 · 교류 방문 · <b>경유<\/b><\/td><\/tr>\n<tr><td><b>사전 신청<\/b><\/td><td><b>없음<\/b> — 미국 ESTA·일본 비지트재팬웹 같은 사전 등록 절차가 없습니다<\/td><\/tr>\n<tr><td><b>입국 횟수<\/b><\/td><td>횟수 제한·재입국 간격 제한 <b>없음<\/b><\/td><\/tr>\n<tr><td><b>출발지<\/b><\/td><td>제한 없음 — 제3국에서 출발해도 무방<\/td><\/tr>\n<\/table>\n<p>여기서 <b>한국 여행자에게 특히 중요한 두 가지<\/b>가 있습니다. 첫째, <b>따로 신청할 것이 없습니다.<\/b> 미국 ESTA처럼 온라인으로 미리 승인받는 절차가 없어서, <b>여권만 들고 공항에 가면 됩니다.<\/b> 둘째, 그래서 이 글의 초점은 \"어떻게 신청하나\"가 아니라 <b>\"내가 자격에 해당하나, 그리고 현지에서 지켜야 할 것이 무엇인가\"<\/b>입니다.<\/p>\n<div class=\"tip\"><b>💡 재입국 간격 제한이 없다는 뜻<\/b><p style=\"margin:8px 0 0\">예를 들어 <b>상하이에 25일 머물다 한국에 잠깐 돌아왔다가 다시 들어가도<\/b>, 새 입국에 대해 다시 30일이 주어집니다. 중국 대사관 안내는 <b>입국 횟수와 두 입국 사이 간격에 제한을 두지 않는다<\/b>고 밝히고 있습니다. 다만 <b>짧은 출국·재입국을 반복해 사실상 장기 체류하는 형태<\/b>는 입국심사에서 목적을 의심받을 수 있으니, 실제 사업·방문 사유가 있는 경우로 한정하는 편이 안전합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 무비자로 되는 목적 · 안 되는 목적<\/h2>\n<p>무비자는 <b>목적이 맞을 때만<\/b> 유효합니다. 목적이 어긋나면 여권이 멀쩡해도 입국이 거절될 수 있습니다.<\/p>\n<table>\n<tr><th>목적<\/th><th>무비자<\/th><th>비고<\/th><\/tr>\n<tr><td>관광 · 여행<\/td><td><b>○<\/b><\/td><td>가장 일반적인 경우<\/td><\/tr>\n<tr><td>상담·계약·전시회 참관 등 <b>상용<\/b><\/td><td><b>○<\/b><\/td><td>초청장 지참 권장<\/td><\/tr>\n<tr><td>친지·지인 방문<\/td><td><b>○<\/b><\/td><td>주소·연락처 확인 요구 가능<\/td><\/tr>\n<tr><td>교류 방문(학술·문화 교류 등)<\/td><td><b>○<\/b><\/td><td>보수를 받는 활동은 제외<\/td><\/tr>\n<tr><td>제3국행 <b>경유<\/b><\/td><td><b>○<\/b><\/td><td>30일 한도 안에서 체류도 가능<\/td><\/tr>\n<tr><td><b>취업 · 근로<\/b><\/td><td><b>×<\/b><\/td><td>취업비자 필요<\/td><\/tr>\n<tr><td><b>유학 · 어학연수<\/b><\/td><td><b>×<\/b><\/td><td>학생비자 필요<\/td><\/tr>\n<tr><td><b>취재 · 보도<\/b><\/td><td><b>×<\/b><\/td><td>기자비자 필요<\/td><\/tr>\n<tr><td><b>공연 등 사전 허가가 필요한 활동<\/b><\/td><td><b>×<\/b><\/td><td>해당 비자 필요<\/td><\/tr>\n<\/table>\n<p>정리하면 <b>\"돈을 벌거나, 자격을 취득하거나, 사전 허가가 필요한 활동\"은 무비자 대상이 아닙니다.<\/b> 중국 측 안내는 <b>입국 사유가 비자면제 정책이 정한 사유와 맞지 않으면 입국이 허용되지 않는다<\/b>고 명시하고 있습니다.<\/p>\n<div class=\"warn\"><b>⚠️ \"관광으로 들어가서 잠깐 일하면 되지 않나\"<\/b><p style=\"margin:8px 0 0\">안 됩니다. 무비자로 들어와 <b>신고된 목적 밖의 활동<\/b>을 하는 것은 체류 목적 위반입니다. 특히 <b>현지에서 보수를 받는 일<\/b>, <b>영리 목적의 촬영·방송<\/b>은 적발 시 벌금·구류·강제출국 대상이 될 수 있습니다. 짧은 기간이라도 근로에 해당한다면 <b>출발 전에 해당 비자를 받아야<\/b> 합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 30일은 언제부터 세나 — 기산 계산<\/h2>\n<p>가장 많이 틀리는 부분입니다. 중국의 체류기간은 <b>입국한 날이 아니라 입국 다음 날부터<\/b> 셉니다. 중국 측 공식 문답은 <b>\"체류기간은 입국 다음 날부터 기산하며 연속 30 자연일 체류할 수 있다\"<\/b>고 설명합니다.<\/p>\n<div class=\"tip\"><b>🔢 계산 공식<\/b><p style=\"margin:8px 0 0\"><b>체류 마지막 날 = 입국일 + 30일<\/b><br>입국일 자체는 세지 않고, <b>그 다음 날이 1일차<\/b>가 됩니다. 그래서 결과적으로 <b>달력상 입국일에 30을 더한 날짜<\/b>가 머물 수 있는 마지막 날이 됩니다.<\/p><\/div>\n<table>\n<tr><th>입국일<\/th><th>1일차<\/th><th>30일차(마지막 날)<\/th><th>늦어도 출국해야 하는 날<\/th><\/tr>\n<tr><td>9월 10일<\/td><td>9월 11일<\/td><td><b>10월 10일<\/b><\/td><td>10월 10일<\/td><\/tr>\n<tr><td>10월 1일<\/td><td>10월 2일<\/td><td><b>10월 31일<\/b><\/td><td>10월 31일<\/td><\/tr>\n<tr><td>12월 20일<\/td><td>12월 21일<\/td><td><b>1월 19일<\/b><\/td><td>1월 19일<\/td><\/tr>\n<\/table>\n<p>흔한 실수는 <b>입국일을 1일차로 세는 것<\/b>입니다. 그렇게 계산하면 실제보다 <b>하루 일찍<\/b> 나가게 되니 손해는 없지만, 반대로 <b>\"30박 31일이니 괜찮겠지\"<\/b>라고 넉넉히 잡으면 <b>초과체류<\/b>가 됩니다. 헷갈릴 때는 <b>여권에 찍힌 입국 도장의 날짜에 30을 더한 날<\/b>을 마지막 날로 보면 안전합니다.<\/p>\n<div class=\"warn\"><b>⚠️ 항공권을 먼저 끊고 날짜를 나중에 세지 마세요<\/b><p style=\"margin:8px 0 0\">장기 체류를 계획한다면 <b>귀국 항공권 날짜부터 확인<\/b>하세요. 특히 <b>왕복 한 달짜리 티켓<\/b>은 아슬아슬한 경우가 많습니다. 예를 들어 <b>9월 10일 입국 → 10월 11일 출국<\/b>은 하루 초과입니다. 실제 계산은 <b>도착 시각이 아니라 입국 도장의 날짜<\/b> 기준이라, <b>밤 늦게 도착해 자정을 넘겨 입국심사를 받았다면 도장 날짜가 하루 밀릴 수 있다<\/b>는 점도 기억해 두세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. '2026년 12월 31일'의 함정 — 입국 기준입니다<\/h2>\n<p>이 조치는 <b>2026년 12월 31일까지<\/b>입니다. 그런데 이 날짜는 <b>중국에 머물 수 있는 마지막 날이 아니라 '무비자로 입국할 수 있는 마지막 날'<\/b>입니다. 연말·연시 여행을 계획한다면 이 차이가 결정적입니다.<\/p>\n<table>\n<tr><th>일정<\/th><th>비자<\/th><th>이유<\/th><\/tr>\n<tr><td>12월 20일 입국 → 1월 5일 출국<\/td><td><b>필요 없음<\/b><\/td><td>입국일이 기한 안이라 무비자 적용, 체류는 30일 한도 안<\/td><\/tr>\n<tr><td>12월 31일 입국 → 1월 20일 출국<\/td><td><b>필요 없음<\/b><\/td><td>기한 마지막 날 입국 — 조치 적용<\/td><\/tr>\n<tr><td><b>1월 1일 입국<\/b><\/td><td><b>비자 필요<\/b><\/td><td>연장 여부가 발표되기 전이라면 무비자 대상 아님<\/td><\/tr>\n<\/table>\n<p>즉 <b>연말에 들어가서 해를 넘겨 나오는 일정은 문제가 없지만, 새해에 들어가는 일정은 이야기가 완전히 달라집니다.<\/b> 중국은 이 조치를 <b>2024년 11월 시행 이후 한 차례 연장<\/b>해 왔습니다. 다만 <b>다음 연장이 있을지, 있다면 언제 발표될지는 아무도 단정할 수 없습니다.<\/b><\/p>\n<div class=\"tip\"><b>💡 2027년 1월 이후 일정을 잡는다면<\/b><p style=\"margin:8px 0 0\">지금 시점에서 <b>\"어차피 또 연장되겠지\"라고 전제하고 항공권을 끊는 것은 위험<\/b>합니다. 현실적인 방법은 두 가지입니다. ① <b>취소·변경이 자유로운 항공권<\/b>으로 예약하고 발표를 기다린다. ② <b>비자를 받는 일정으로 처음부터 계획<\/b>한다. 중국 비자는 신청부터 발급까지 시간이 걸리므로, <b>연장 발표를 기다리다 비자 신청 시기를 놓치는 것이 가장 나쁜 시나리오<\/b>입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 무비자 vs 240시간 환승 무비자 vs 관광비자 (판단표)<\/h2>\n<p>중국 입국 방법은 지금 세 가지가 함께 존재합니다. 인터넷에는 <b>240시간(10일) 환승 무비자<\/b> 이야기가 많은데, <b>한국 여권 소지자라면 대부분 그쪽을 쓸 이유가 없습니다.<\/b> 조건을 나란히 놓고 보면 명확합니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>30일 무비자<\/th><th>240시간 환승 무비자<\/th><th>관광비자(L)<\/th><\/tr>\n<tr><td><b>체류 한도<\/b><\/td><td><b>30일<\/b><\/td><td>240시간(10일)<\/td><td>비자에 표시된 기간<\/td><\/tr>\n<tr><td><b>사전 절차<\/b><\/td><td><b>없음<\/b><\/td><td>없음<\/td><td><b>신청·수수료·심사<\/b><\/td><\/tr>\n<tr><td><b>이동 범위<\/b><\/td><td><b>중국 전역<\/b><\/td><td><b>지정 지역 안으로 제한<\/b><\/td><td>중국 전역<\/td><\/tr>\n<tr><td><b>조건<\/b><\/td><td>목적이 맞으면 됨<\/td><td><b>제3국행 연결 항공권 필수<\/b><\/td><td>서류 심사 통과<\/td><\/tr>\n<tr><td><b>한국인에게<\/b><\/td><td><b>기본 선택지<\/b><\/td><td>실익 거의 없음<\/td><td>30일 초과·취업·유학 시<\/td><\/tr>\n<\/table>\n<p>240시간 환승 무비자는 <b>\"중국을 거쳐 제3국으로 가는 사람\"<\/b>을 위한 제도라 <b>제3국행 연결 항공권이 반드시 있어야<\/b> 하고, <b>머물 수 있는 지역도 지정된 범위로 제한<\/b>됩니다. 반면 <b>30일 무비자는 조건이 훨씬 헐겁고 기간도 세 배<\/b>입니다. 한국↔중국 왕복 여행이라면 <b>고민할 필요 없이 30일 무비자<\/b>입니다.<\/p>\n<div class=\"tip\"><b>💡 비자를 받아야 하는 경우는 이렇게 갈립니다<\/b><p style=\"margin:8px 0 0\">① <b>30일을 넘겨 머물 계획<\/b> ② <b>취업·유학·취재 등 무비자 제외 목적<\/b> ③ <b>일반여권이 아닌 여권<\/b> ④ <b>과거 체류 위반 이력 등으로 무비자 입국이 불안한 경우<\/b>. 이 넷 중 하나라도 해당하면 <b>출발 전에 비자를 받는 쪽<\/b>이 맞습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 입국심사에서 막히는 5가지<\/h2>\n<p>무비자는 <b>\"입국이 보장된다\"는 뜻이 아닙니다.<\/b> 최종 판단은 현장 입국심사관이 합니다. 실제로 문제가 되는 경우는 대체로 다음 다섯 가지입니다.<\/p>\n<ol>\n<li><b>입국 목적을 설명하지 못하는 경우<\/b> — 어디서 며칠 묵고 무엇을 하는지 답이 안 나오면 심사가 길어집니다. <b>호텔 예약 확인서와 귀국 항공권<\/b>을 휴대폰이 아닌 <b>인쇄물로도<\/b> 준비해 두면 편합니다.<\/li>\n<li><b>목적이 무비자 대상과 다른 경우<\/b> — 취업·유학·취재 정황이 보이면 거절 사유입니다. 노트북·장비를 대량으로 소지하거나 <b>업무용 계약서류가 과하게 많은 경우<\/b>도 설명이 필요해질 수 있습니다.<\/li>\n<li><b>귀국편이 없는 편도 항공권<\/b> — 출국 계획이 확인되지 않으면 체류 의사를 의심받습니다. <b>제3국행이라도 나가는 표<\/b>가 있어야 설명이 됩니다.<\/li>\n<li><b>여권 유효기간·상태 문제<\/b> — 잔여 유효기간이 짧거나 <b>훼손된 여권<\/b>은 그 자체로 거절될 수 있습니다. 출발 전에 <b>유효기간 6개월 이상<\/b>인지 확인하세요.<\/li>\n<li><b>과거 체류 위반 이력<\/b> — 이전 방문에서 <b>초과체류·목적 위반 기록<\/b>이 있으면 무비자 입국이 막힐 수 있습니다. 중국 측 안내도 <b>\"법에 따라 입국이 허용되지 않는 사유가 있는 경우\"<\/b>를 거절 사유로 두고 있습니다.<\/li>\n<\/ol>\n<div class=\"tip\"><b>💡 입국카드는 미리 써 두면 줄이 줄어듭니다<\/b><p style=\"margin:8px 0 0\">중국은 외국인에게 <b>입경카드<\/b> 작성을 요구합니다. 기내에서 나눠주는 경우가 많으니 <b>착륙 전에 숙소 이름·주소를 적어 두세요<\/b>. 이때 필요한 것이 <b>호텔의 중국어 주소<\/b>입니다. 예약 확인서에 영문만 있으면 <b>지도 앱에서 중국어 주소를 캡처<\/b>해 가면 심사·택시 이용 모두 수월합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 입국하면 24시간 안에 — 주숙등기<\/h2>\n<p>한국 여행자가 가장 모르고 지나가는 의무입니다. 중국에 머무는 외국인은 <b>숙소를 관할 공안기관(파출소)에 신고<\/b>해야 합니다. 이것을 <b>주숙등기(住宿登记)<\/b>라고 합니다.<\/p>\n<table>\n<tr><th>묵는 곳<\/th><th>별도 신고<\/th><th>설명<\/th><\/tr>\n<tr><td><b>호텔 등 등록된 숙박업소<\/b><\/td><td><b>불필요<\/b><\/td><td>체크인 때 호텔이 대신 등록<\/td><\/tr>\n<tr><td><b>친척·지인 집<\/b><\/td><td><b>필요<\/b><\/td><td>입국(또는 이동) 후 <b>24시간 이내<\/b><\/td><\/tr>\n<tr><td><b>민박·임대주택 등<\/b><\/td><td><b>필요<\/b><\/td><td>농촌 지역은 <b>72시간 이내<\/b><\/td><\/tr>\n<\/table>\n<p>즉 <b>호텔에만 묵는 일반 관광객은 신경 쓸 일이 없습니다.<\/b> 문제는 <b>친척 집이나 지인 집, 개인이 빌려주는 숙소<\/b>에 묵는 경우입니다. 이때는 <b>여권과 숙소 주인의 신분증·주택 관련 서류를 들고 관할 파출소<\/b>에 가야 합니다.<\/p>\n<div class=\"warn\"><b>⚠️ 안 하면 최대 2,000위안(약 40만 원 안팎)<\/b><p style=\"margin:8px 0 0\">주숙등기를 하지 않은 사실이 확인되면 <b>경고 또는 최대 2,000위안의 벌금<\/b>이 부과될 수 있습니다. 한국 공관 안내에서도 반복적으로 당부하는 항목입니다. <b>중간에 숙소를 옮겼을 때도 새로 등기해야 한다<\/b>는 점을 놓치기 쉬우니, <b>친척 집 → 호텔 → 다시 친척 집<\/b>처럼 옮겨 다니는 일정이라면 특히 유의하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 30일을 넘기면 — 연장과 초과체류 벌금<\/h2>\n<p>사정이 생겨 30일을 넘겨야 한다면 <b>기한이 끝나기 전에<\/b> 움직여야 합니다. 중국 측 안내는 두 갈래를 제시합니다.<\/p>\n<ul>\n<li><b>출발 전에 이미 30일 초과가 예상된다면<\/b> — 한국에서 <b>해당 목적에 맞는 비자를 미리 받아<\/b> 들어갑니다.<\/li>\n<li><b>입국 후 정당한 사유로 더 머물러야 한다면<\/b> — 체류기간이 끝나기 전에 <b>현지 공안기관 출입경관리부서에 체류증(停留证件)을 신청<\/b>합니다. 한국 공관 안내에 따르면 <b>기한 만료 전 여유를 두고<\/b> 신청해야 합니다.<\/li>\n<\/ul>\n<p>기한을 넘겨 버리면 <b>돈으로 끝나지 않을 수 있습니다.<\/b> 중국 출입경관리법은 불법 체류에 대해 <b>경고<\/b>를, 정도가 무거우면 <b>초과 1일당 500위안, 총액 1만 위안 이하의 벌금 또는 5~15일 구류<\/b>를 규정하고 있습니다.<\/p>\n<table>\n<tr><th>초과 일수<\/th><th>계산<\/th><th>벌금(상한 규정 적용)<\/th><\/tr>\n<tr><td>3일<\/td><td>500위안 × 3<\/td><td><b>1,500위안<\/b> (약 30만 원 안팎)<\/td><\/tr>\n<tr><td>10일<\/td><td>500위안 × 10<\/td><td><b>5,000위안<\/b><\/td><\/tr>\n<tr><td>20일<\/td><td>500위안 × 20 = 10,000위안<\/td><td><b>10,000위안<\/b> (상한)<\/td><\/tr>\n<tr><td>30일<\/td><td>500위안 × 30 = 15,000위안<\/td><td><b>10,000위안<\/b> (상한 적용)<\/td><\/tr>\n<\/table>\n<p>표에서 보듯 <b>20일을 넘기면 벌금은 상한에 걸려 더 오르지 않지만<\/b>, 대신 <b>구류나 강제출국, 향후 입국 제한<\/b> 같은 더 무거운 결과로 넘어갑니다. <b>\"벌금만 내면 된다\"고 생각할 문제가 아닙니다.<\/b> 실제 적용 수위는 사안에 따라 다르므로, <b>기한 전 연장<\/b>이 유일하게 안전한 길입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 홍콩·마카오·티베트는 별개입니다<\/h2>\n<p>지도상 같은 중국이라도 <b>출입경 제도는 따로 돌아갑니다.<\/b> 이 부분을 뭉뚱그려 이해하면 일정이 꼬입니다.<\/p>\n<ul>\n<li><b>홍콩<\/b> — 한국과 사증면제협정이 있어 <b>관광 목적 최대 90일(3개월)<\/b> 무비자 체류가 가능합니다. 이번 중국 본토 조치와는 <b>별개의 제도<\/b>입니다.<\/li>\n<li><b>마카오<\/b> — 관광 목적 무비자로 <b>1회 최고 90일, 연간 120일<\/b>까지 체류할 수 있습니다(주홍콩 대한민국 총영사관 안내 기준).<\/li>\n<li><b>본토 ↔ 홍콩·마카오 이동<\/b> — 출입경 절차를 다시 밟습니다. 홍콩에 다녀온 뒤 <b>본토로 재입국하면 30일이 새로 시작<\/b>됩니다(재입국 간격 제한 없음).<\/li>\n<li><b>티베트(시짱)<\/b> — 비자·무비자와 <b>무관하게<\/b> 외국인은 별도의 여행 허가가 필요하고, <b>지정 여행사를 통한 일정<\/b>으로만 방문이 가능한 것으로 안내됩니다. 개인 자유여행 계획을 세우기 전에 <b>여행사·현지 규정을 반드시 먼저 확인<\/b>하세요.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ \"홍콩 경유니까 무비자가 이어진다\"는 오해<\/b><p style=\"margin:8px 0 0\">본토에서 홍콩으로 나가는 순간 <b>본토 체류는 종료<\/b>됩니다. 다시 들어오면 <b>새 30일<\/b>이 시작되므로 유리한 방향이지만, 반대로 <b>\"홍콩에 다녀왔으니 원래 30일이 그대로 남아 있다\"는 계산은 틀립니다.<\/b> 남은 일수를 이어 쓰는 개념이 아니라 <b>매 입국마다 새로 30일<\/b>이라고 이해하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">10. 자주 묻는 질문<\/h2>\n<h3>Q. 정말 아무것도 신청 안 해도 되나요?<\/h3>\n<p>네. <b>미국 ESTA나 일본 비지트재팬웹 같은 사전 등록 절차가 없습니다.<\/b> 유효한 일반여권과 목적에 맞는 여행이면 <b>공항에서 바로 입국심사<\/b>를 받습니다. 다만 <b>호텔 예약·귀국 항공권 등 사유를 뒷받침할 자료<\/b>는 지참을 권합니다.<\/p>\n<h3>Q. 왕복 항공권이 꼭 있어야 하나요?<\/h3>\n<p>규정상 항공권 제시가 절대 조건으로 명시된 것은 아니지만, <b>실무상 출국 계획을 확인받는 경우가 많습니다.<\/b> 편도로 들어가면 설명 부담이 커지므로 <b>나가는 표<\/b>는 확보해 두는 편이 안전합니다.<\/p>\n<h3>Q. 30일을 다 채우고 바로 다시 들어가도 되나요?<\/h3>\n<p>중국 측 안내는 <b>입국 횟수와 간격에 제한을 두지 않습니다.<\/b> 다만 <b>반복 입출국으로 사실상 장기 거주하는 형태<\/b>는 목적 위반을 의심받을 수 있어, 실제 사유가 있는 경우로 한정하는 것이 좋습니다.<\/p>\n<h3>Q. 아이 여권도 같은 조건인가요?<\/h3>\n<p>일반여권이라면 <b>연령과 관계없이 같은 조치가 적용<\/b>됩니다. 다만 <b>미성년자 단독 여행이나 부모 한쪽만 동반<\/b>하는 경우 가족관계를 확인받을 수 있으니 <b>가족관계증명서(영문)<\/b> 같은 서류를 준비해 두면 수월합니다.<\/p>\n<h3>Q. 무비자로 들어가면 여권에 무엇이 찍히나요?<\/h3>\n<p>입국심사 통과 시 <b>여권에 입국 도장<\/b>이 찍힙니다. <b>이 도장의 날짜가 체류기간 계산의 기준<\/b>이 되므로, 입국 직후 <b>도장 날짜를 한 번 확인<\/b>해 두세요. 날짜가 예상과 다르면 그 자리에서 확인하는 편이 낫습니다.<\/p>\n<h3>Q. 중국에서 카드·현금 결제는 어떻게 하나요?<\/h3>\n<p>모바일 결제 비중이 매우 높아 <b>현금만 준비하면 불편할 수 있습니다.<\/b> 여행 전 <b>결제 앱 설정과 해외 결제 가능한 카드<\/b>를 미리 확인하세요. 환전·해외결제 수수료 비교는 아래 <b>함께 보면 좋은 글<\/b>에서 다룹니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec11\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 외교부 · 주한중국대사관 (공식)<\/b><a href=\"https://www.0404.go.kr/ntnSafetyInfo/189/detail\" target=\"_blank\" rel=\"nofollow\">▸ 외교부 해외안전여행 — 중국 국가·지역 정보(출입국·안전)<\/a><a href=\"https://0404.go.kr/bbs/contsPst/MST0000000000113/13/detail\" target=\"_blank\" rel=\"nofollow\">▸ 외교부 해외안전여행 — 영사협정·사증면제 안내<\/a><a href=\"https://kr.china-embassy.gov.cn/kor/lsfw/lszj/202511/t20251106_11748002.htm\" target=\"_blank\" rel=\"nofollow\">▸ 주한중국대사관 — 사증 면제 정책 연장에 관한 공지<\/a><a href=\"https://www.mofa.go.kr/cn-xian-ko/brd/m_738/view.do?seq=1346727\" target=\"_blank\" rel=\"nofollow\">▸ 주시안 대한민국 총영사관 — 비자면제 방침 연장 및 유의사항<\/a><a href=\"https://overseas.mofa.go.kr/hk-ko/brd/m_1521/view.do?seq=1039798\" target=\"_blank\" rel=\"nofollow\">▸ 주홍콩 대한민국 총영사관 — 마카오 무비자 체류 시 유의사항<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">핵심은 넷입니다. <b>①<\/b> 한국 일반여권이면 <b>사전 신청 없이 최장 30일<\/b> 무비자 입국이 되고, <b>②<\/b> 이 조치는 <b>2026년 12월 31일 '입국'분까지<\/b>라 연말에 들어가 해를 넘겨 나오는 일정은 괜찮지만 <b>새해에 들어가는 일정은 별도 확인<\/b>이 필요합니다. <b>③<\/b> 30일은 <b>입국 다음 날부터<\/b> 세므로 <b>입국일 + 30일<\/b>이 마지막 날이고, <b>④<\/b> 호텔이 아닌 곳에 묵으면 <b>24시간(농촌 72시간) 안에 주숙등기<\/b>를 해야 합니다. 출발 전에 <b>여권 유효기간 6개월<\/b>과 <b>귀국 항공권 날짜<\/b> 두 가지만 확인해도 대부분의 사고는 막을 수 있습니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 비자면제 조치는 <b>중국 정부의 결정에 따라 변경·종료될 수 있습니다.<\/b> 특히 <b>2027년 1월 이후 일정<\/b>은 출발 전 반드시 주한중국대사관 공지와 외교부 해외안전여행에서 최신 상태를 재확인하세요.<br>본문의 벌금 표는 <b>중국 출입경관리법의 규정 상한(1일 500위안·총액 1만 위안 이하)<\/b>을 적용해 계산한 것이며, <b>실제 처분 수위는 사안에 따라 달라집니다.<\/b> 원화 환산액은 이해를 돕기 위한 어림값입니다.<br>출처: 주한중국대사관 「사증 면제 정책 연장에 관한 공지」(2025년 11월 6일), 중국 측 단방면 비자면제 정책 문답(체류기간 기산·입국 횟수·소지 권장 서류), 외교부 해외안전여행 국가·지역 정보 및 영사협정·사증면제 안내, 주시안·주홍콩 대한민국 공관 공지, 중국 출입경관리법(체류·주숙등기·초과체류 규정), 중국 국가이민관리국 환승 무비자 시행 내용. 영사콜센터 +82-2-3210-0404<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_766.html\">▸ 여권 발급 방법 준비물 기간 수수료 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/vs-vs.html\">▸ 로밍 vs 유심 vs 이심 해외여행 데이터 비교 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_452.html\">▸ 여행자보험 가입 방법 보장 비교 총정리<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 체류기간·허용 목적·기한은 <b>주한중국대사관 공지와 외교부 해외안전여행·재외공관 안내를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 비자 정책은 예고 없이 바뀔 수 있으니 출발 전 공식 공지를 한 번 더 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 중국은 지금 한국 일반여권이면 비자 없이 최장 30일 머물 수 있습니다. 미국 ESTA나 일본 비지트재팬웹 같은 사전 등록도 없어서 여권만 들고 공항에 가면 됩니다. 단 이 조치는 2026년 12월 31일까지로 기한이 정해져 있습니다.\n2. 30일은 입국한 날이 아니라 입국 다음 날부터 셉니다. 그래서 마지막 날 = 입국일 + 30일이에요. 9월 10일 입국이면 10월 10일까지입니다. \"30박 31일이니 괜찮겠지\"로 잡으면 초과체류가 됩니다. 초과하면 1일 500위안, 최대 1만 위안 벌금에 구류까지 갈 수 있습니다.\n3. 놓치기 쉬운 게 주숙등기입니다. 호텔은 체크인 때 자동으로 처리되지만, 친척 집이나 민박에 묵으면 24시간(농촌 72시간) 안에 관할 파출소에 신고해야 하고 안 하면 최대 2,000위안 벌금입니다. 그리고 2026년 12월 31일은 '입국' 기준이라, 12월에 들어가 1월에 나오는 건 괜찮지만 1월 1일에 들어가는 일정은 비자가 필요합니다.\n"},{"code":"F1-10","title":"비지트재팬웹 등록 방법 일본 입국심사 세관신고 QR코드 총정리 (2026 Visit Japan Web)","lane":"pop","thumb":"128_visitjapanweb.png","draft":"비지트재팬웹_글_H f !important;font-weight:800;font-size:17px;padding:15px 18px;border-radius:12px;text-decoration:none;margin:22px 0}\n.lsg table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:15px}\n.lsg th,.lsg td{border:1px solid #e0d7f6;padding:10px 12px;text-align:center}\n.lsg th{background:#f0ebfc}\n.lsg .tip{background:#f4f1fd;border:1px solid #ded4f7;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .warn{background:#fff3f3;border:1px solid #f6cccc;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .end{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:16px 20px;margin-top:24px}\n.lsg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#f4f1fd;border:1px solid #ded4f7;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#6544cc;margin-bottom:8px}\n.lsg .rel a{display:block;color:#5a3cc0;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#9a92aa;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>여름휴가로 일본행 비행기를 끊고 나면 꼭 듣게 되는 말이 <b>\"비지트재팬웹(Visit Japan Web) 미리 해두세요\"<\/b>입니다. 그런데 막상 검색해 보면 <b>\"필수다 / 안 해도 된다\"<\/b>가 뒤섞여 있고, 어떤 글은 <b>QR코드가 2개<\/b>라고 하고 어떤 글은 <b>1개<\/b>라고 합니다. 심지어 <b>수수료를 받는 대행 사이트<\/b>까지 검색 상단에 뜹니다. 이 글에서는 일본 <b>디지털청 공식 안내와 세관(관세청) 공식 페이지<\/b>를 근거로, <b>등록이 정말 필수인지, 절차는 어떻게 되는지, 공항에서 어디서 QR을 보여주는지<\/b>, 그리고 <b>40~60대 여행자가 가장 많이 걸리는 함정<\/b>까지 한 번에 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 결론부터 — 의무는 아니지만, 안 하면 손해인 이유<\/a><a href=\"#sec2\">2. 비지트재팬웹이 대신해 주는 것 (그리고 안 해주는 것)<\/a><a href=\"#sec3\">3. 등록 절차 5단계 (STEP 0~4)<\/a><a href=\"#sec4\">4. QR코드는 딱 1개 — 공항에서 언제·어디서 보여주나<\/a><a href=\"#sec5\">5. 전자신고 게이트 되는 공항 7곳 + 이용 조건<\/a><a href=\"#sec6\">6. 가장 많이 걸리는 함정 5가지<\/a><a href=\"#sec7\">7. 세관 면세범위 — 20만 엔 계산 예시 3가지<\/a><a href=\"#sec8\">8. 면세쇼핑(Tax-free)은 2026년 11월부터 방식이 바뀝니다<\/a><a href=\"#sec9\">9. 자주 묻는 질문<\/a><a href=\"#sec10\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec6\">👉 공항에서 가장 많이 막히는 함정 5가지 먼저 보기<\/a>\n\n<h2 id=\"sec1\">1. 결론부터 — 의무는 아니지만, 안 하면 손해인 이유<\/h2>\n<p>먼저 가장 헷갈리는 부분을 정리하겠습니다. <b>비지트재팬웹 등록은 법으로 강제된 의무가 아닙니다.<\/b> 일본 세관은 지금도 <b>\"휴대품·별송품 신고서\"<\/b> 종이 양식을 전국 공항·항만에 비치해 두고 있고, <b>한국어 양식(C-5360-C)<\/b>까지 공식 홈페이지에서 내려받아 인쇄해 갈 수 있게 해 두었습니다. 즉 등록을 못 했다고 해서 <b>입국을 못 하거나 벌금을 무는 일은 없습니다.<\/b><\/p>\n<p>다만 일본 세관은 공식 페이지에서 <b>\"원활한 세관 수속을 위해 Visit Japan Web을 이용한 전자신고를 권장한다\"<\/b>고 명시하고 있습니다. 실제 차이는 <b>줄 서는 시간<\/b>에서 갈립니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>비지트재팬웹(QR) 등록<\/th><th>종이 신고서<\/th><\/tr>\n<tr><td><b>의무 여부<\/b><\/td><td>권장(의무 아님)<\/td><td>가능(양식 비치·인쇄)<\/td><\/tr>\n<tr><td><b>작성 시점<\/b><\/td><td>출국 전 집에서 미리<\/td><td>기내 또는 공항 도착 후<\/td><\/tr>\n<tr><td><b>세관 통과<\/b><\/td><td>전자신고 단말기 → <b>전자신고 게이트<\/b> 통과<\/td><td>유인 검사대에서 대면 제출<\/td><\/tr>\n<tr><td><b>가족 처리<\/b><\/td><td>동반가족 등록 후 <b>1인씩<\/b> 수속<\/td><td>같은 세대는 대표 1장 작성 가능<\/td><\/tr>\n<tr><td><b>유리한 사람<\/b><\/td><td>스마트폰이 익숙하고 짐 찾고 빨리 나가고 싶은 분<\/td><td>스마트폰 조작이 불편한 분, 급히 결정된 여행<\/td><\/tr>\n<\/table>\n<p>정리하면 <b>\"미리 해두면 도착 후 줄이 확 짧아지는 선택지\"<\/b>이지, <b>\"안 하면 큰일 나는 필수 절차\"<\/b>는 아닙니다. 스마트폰이 어려운 부모님과 함께라면 <b>종이 신고서로 가도 전혀 문제없다<\/b>는 점을 알고 가시면 마음이 편합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 비지트재팬웹이 대신해 주는 것 (그리고 안 해주는 것)<\/h2>\n<p>비지트재팬웹은 일본 <b>디지털청<\/b>이 운영하는 <b>무료 웹서비스<\/b>입니다. 앱을 따로 설치할 필요가 없고, 웹브라우저에서 바로 씁니다. 한국어를 포함해 <b>9개 언어<\/b>를 지원합니다.<\/p>\n<h3>✅ 해주는 것<\/h3>\n<ul>\n<li><b>입국심사(외국인 입국기록)<\/b> — 예전에 기내에서 손으로 쓰던 입국카드를 대신합니다.<\/li>\n<li><b>세관신고(휴대품·별송품 신고)<\/b> — 노란색 종이 신고서를 대신합니다.<\/li>\n<li><b>면세 구매(Tax-free) QR<\/b> — 일본 체류 중 면세점에서 쓰는 별도 코드입니다.<\/li>\n<\/ul>\n<h3>❌ 해주지 않는 것 — 이건 오해가 많습니다<\/h3>\n<ul>\n<li><b>비자(VISA)를 대신하지 않습니다.<\/b> 비자가 필요한 경우 별도 신청이며, 비지트재팬웹은 비자 정보를 '가져와 쓰는' 기능만 있습니다.<\/li>\n<li><b>미국 ESTA 같은 '입국 허가'가 아닙니다.<\/b> 사전 심사·승인 절차가 아니라 <b>신고서를 미리 채워 두는 것<\/b>에 가깝습니다. 그래서 '승인 대기'나 '거부' 같은 개념이 없습니다.<\/li>\n<li><b>항공권·숙소 예약과 무관합니다.<\/b> 등록했다고 예약이 확인되는 것도, 안 했다고 탑승이 막히는 것도 아닙니다.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ 수수료를 요구하면 100% 공식이 아닙니다<\/b><p style=\"margin:8px 0 0\">디지털청은 2025년 6월 공식 알림으로 <b>\"Visit Japan Web 이용자에게 신청 수수료를 요구하는 사이트가 발견됐다\"<\/b>며, <b>디지털청은 어떤 수수료도 요구하지 않는다<\/b>고 밝혔습니다. 검색으로 들어가면 유사 사이트에 걸리기 쉬우니, 반드시 공식 주소 <b>www.vjw.digital.go.jp<\/b> 를 확인하세요. 과거에는 <b>'Visit Japan Web Info'<\/b> 같은 수상한 앱도 발견된 적이 있습니다(공식은 <b>앱이 아니라 웹<\/b>입니다).<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 등록 절차 5단계 (STEP 0~4)<\/h2>\n<p>공식 안내는 절차를 <b>STEP 0~4<\/b>로 나눠 설명합니다. 여권만 손에 들고 있으면 <b>10~15분<\/b>이면 끝나는 분량입니다.<\/p>\n<h3>STEP 0. 계정 만들기<\/h3>\n<p><b>이메일 주소와 비밀번호<\/b>가 필요합니다. 비밀번호는 <b>10자 이상, 영문 대문자+소문자+숫자+기호 조합<\/b>이어야 합니다(예: Ab1234567+). 입력한 이메일로 <b>확인 코드<\/b>가 오는데, <b>코드 입력 화면을 닫으면 코드가 무효<\/b>가 되어 처음부터 다시 해야 하니 창을 닫지 마세요. 메일이 안 오면 <b>스팸함<\/b>과 <b>@vjw.digital.go.jp 도메인 수신 차단<\/b> 여부를 확인합니다.<\/p>\n<h3>STEP 1. 이용자 등록 (본인 정보)<\/h3>\n<p>여권 정보를 넣습니다. <b>'카메라로 판독(OCR)'<\/b>과 <b>'직접 입력'<\/b> 중 고를 수 있고, 공식 안내는 간편하다는 이유로 카메라 판독을 권장합니다. 빛 반사로 인식이 안 되면 <b>직접 입력으로 바꾸면 됩니다.<\/b> 이름·성은 <b>여권 그대로 영문<\/b>으로 넣습니다.<\/p>\n<p>여기서 <b>동반가족<\/b>도 함께 등록할 수 있습니다. <b>최대 10명<\/b>까지 등록 가능하며, 가족이 <b>동시에 입국 수속을 밟는 경우<\/b>에 해당합니다.<\/p>\n<h3>STEP 2. 입국·귀국 일정 등록<\/h3>\n<p><b>일본 도착 예정일, 항공사, 편명, 출발지, 일본 내 체류지(호텔 주소·전화번호)<\/b>를 넣습니다. 주소·도시명은 <b>영문(반각)<\/b>으로 입력합니다. 일정은 <b>100건까지<\/b> 등록할 수 있고, <b>다음 해 12월 31일까지<\/b>의 예정을 미리 넣을 수 있습니다. 예전에 다녀온 기록이 있으면 <b>'등록된 입국·귀국 정보 인용'<\/b>으로 체류지 정보를 그대로 불러올 수 있어 재방문이면 훨씬 빠릅니다.<\/p>\n<h3>STEP 3. 입국·귀국 수속 입력<\/h3>\n<p>등록한 일정을 눌러 <b>검역(건강상태 확인)<\/b>과 <b>입국심사 및 세관신고<\/b>를 채웁니다. 세관신고에는 직업·입국일·탑승기명·출발지·체류지와 <b>면세범위를 넘는 물품이 있는지<\/b> 등이 들어갑니다.<\/p>\n<h3>STEP 4. 공항에서 QR코드 표시<\/h3>\n<p>도착 후 수속 화면에서 <b>'QR코드 표시'<\/b>를 누르면 됩니다. 등록은 PC로 해도 되지만, <b>보여주는 것은 스마트폰·태블릿이어야<\/b> 합니다(공식 안내 명시).<\/p>\n<div class=\"tip\"><b>💡 인터넷이 안 될 때를 대비 — '오프라인 이용' 설치<\/b><p style=\"margin:8px 0 0\">공항에서 로밍이 안 되거나 와이파이가 먹통일 때를 대비해, 비지트재팬웹은 <b>오프라인 이용<\/b>을 지원합니다. 로그인 화면에서 <b>'홈 화면에 추가'<\/b>(아이폰 사파리는 공유→홈 화면에 추가, 안드로이드 크롬은 메뉴 ⋮ →홈 화면에 추가)로 설치해 두면, <b>등록을 마친 일정의 QR코드는 오프라인에서도 표시<\/b>됩니다. 단 <b>계정 생성·이용자 등록·신규 일정 등록은 온라인에서만<\/b> 되고, <b>사전에 한 번은 온라인 로그인<\/b>을 해두어야 합니다. 출발 전날 집에서 설치해 두는 것이 가장 안전합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. QR코드는 딱 1개 — 공항에서 언제·어디서 보여주나<\/h2>\n<p>인터넷 글마다 <b>\"QR이 2개\"<\/b>라고 적혀 있는 이유는 <b>옛날 정보<\/b>이기 때문입니다. 예전에는 <b>입국심사용<\/b>과 <b>세관신고용<\/b> QR이 따로였지만, <b>2024년 1월 25일부터 하나로 통합<\/b>됐습니다. 지금은 메뉴 이름도 <b>'입국심사 및 세관신고'<\/b> 하나입니다. 참고로 같은 날부터 <b>옛 '세관신고 앱'으로 만든 QR코드는 사용할 수 없게<\/b> 됐으니, 예전에 앱을 깔아둔 분은 반드시 웹으로 다시 하셔야 합니다.<\/p>\n<p>하나의 QR을 <b>두 번<\/b> 보여준다고 생각하면 쉽습니다.<\/p>\n<ol>\n<li><b>입국심사 카운터<\/b> — 심사관에게 QR을 제시합니다(여권과 함께).<\/li>\n<li><b>수하물 찾은 뒤 세관 검사장<\/b> — <b>전자신고 단말기<\/b>에 같은 QR과 <b>IC여권<\/b>을 읽히고, 안내에 따라 진행하면 <b>전자신고 게이트<\/b>로 안내됩니다.<\/li>\n<\/ol>\n<div class=\"tip\"><b>💡 짐 기다리는 동안 세관 신고를 끝낼 수 있는 공항<\/b><p style=\"margin:8px 0 0\">공식 안내에 따르면 <b>하네다·후쿠오카·나하 공항<\/b>에서는 <b>위탁수하물이 나오기를 기다리는 시간<\/b>에 전자신고 단말기로 세관신고를 먼저 끝낼 수 있습니다. 짐이 늦게 나오는 공항일수록 체감 효과가 큽니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 전자신고 게이트 되는 공항 7곳 + 이용 조건<\/h2>\n<p>세관 전자신고 게이트는 <b>모든 공항에 있는 것이 아닙니다.<\/b> 일본 세관 공식 페이지 기준(2025년 4월 갱신) <b>7개 공항<\/b>입니다.<\/p>\n<table>\n<tr><th>지역<\/th><th>전자신고 게이트 설치 공항<\/th><\/tr>\n<tr><td>도쿄권<\/td><td><b>나리타 국제공항<\/b>, <b>하네다 공항<\/b><\/td><\/tr>\n<tr><td>간사이·주부<\/td><td><b>간사이 국제공항<\/b>, <b>주부 국제공항<\/b><\/td><\/tr>\n<tr><td>홋카이도<\/td><td><b>신치토세 공항<\/b><\/td><\/tr>\n<tr><td>규슈·오키나와<\/td><td><b>후쿠오카 공항<\/b>, <b>나하 공항<\/b><\/td><\/tr>\n<\/table>\n<p>여기에 없는 공항(예: 기타 지방공항)에 내린다면 <b>QR을 만들어 갔어도 전자신고 게이트는 없을 수 있습니다.<\/b> 그래도 QR 자체는 유인 검사대에서 쓸 수 있습니다 — 일부 유인 검사대에도 <b>검사대용 전자신고 단말기<\/b>가 설치돼 있다고 세관이 밝히고 있습니다.<\/p>\n<h3>전자신고 게이트 이용 조건 (세관 공식)<\/h3>\n<ul>\n<li><b>IC칩이 든 여권(IC여권)<\/b>이 필요합니다.<\/li>\n<li><b>가족이라도 1명씩<\/b> 수속해야 합니다.<\/li>\n<li><b>키 100cm 미만 어린이<\/b>는 기기 구조상 <b>보호자와 함께<\/b> 이용합니다.<\/li>\n<li><b>마스크·선글라스 등 얼굴을 가리는 것은 벗어야<\/b> 합니다(얼굴 인증).<\/li>\n<li><b>카트를 끌고 그대로 통과<\/b>할 수 있고, <b>휠체어도 탄 채로 통과<\/b>할 수 있습니다.<\/li>\n<li>게이트를 지날 때는 <b>정면을 보고 천천히<\/b> 걸으라고 안내합니다.<\/li>\n<\/ul>\n<p>얼굴 사진은 <b>본인 확인·게이트 얼굴인증에만 사용하고 사용 후 즉시 삭제<\/b>한다고 세관이 명시하고 있습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 가장 많이 걸리는 함정 5가지<\/h2>\n<p>등록 자체보다 <b>\"이걸 몰라서\" 공항에서 시간을 버리는<\/b> 경우가 훨씬 많습니다.<\/p>\n<h3>① \"내가 가족 것까지 다 해뒀으니 같이 통과하면 되겠지\" — 안 됩니다<\/h3>\n<p>동반가족을 <b>내 계정에 최대 10명까지 등록<\/b>할 수 있는 건 맞습니다. 그러나 공식 설명서는 <b>\"입국·귀국 수속은 한 명씩 실시합니다. 수속에 필요한 정보는 동반가족이라 하더라도 한 명씩 등록해 주십시오\"<\/b>라고 못박고 있습니다. 세관 역시 <b>\"가족이라도 1명씩 수속\"<\/b>이라고 안내합니다. QR 표시 화면에서 <b>드롭다운으로 대상자를 바꿔가며<\/b> 한 명씩 보여주는 구조입니다. 참고로 공식 알림 목록에는 <b>'대리 입력 기능의 서비스를 종료했습니다(2025년 6월 2일)'<\/b>라는 고지도 올라와 있습니다.<\/p>\n<h3>② 여권 잔여 유효기간 6개월<\/h3>\n<p>본인 정보를 다 넣으면 상태가 '등록 완료'로 바뀌는데, <b>여권 잔여 유효기간이 6개월 미만이면 '여권 잔여 유효기간 확인'<\/b>, <b>만료됐으면 '여권 유효기간 만료'<\/b>라고 표시됩니다. 등록 화면에서 이 경고를 보고 나서야 여권 상태를 아는 분이 많습니다. <b>출발 2~3개월 전에 미리 확인<\/b>하시는 게 좋습니다.<\/p>\n<h3>③ 면세 QR은 '스크린샷'이 통하지 않습니다<\/h3>\n<p>입국용 QR과 달리 <b>면세 구매용 QR코드는 스크린샷을 이용할 수 없다<\/b>고 공식 안내에 명시돼 있습니다. 면세점 계산대에서 캡처 이미지를 내밀면 인식되지 않습니다. 또 <b>면세 QR을 쓰려면 여권을 반드시 '카메라로 스캔'<\/b>해야 하고(직접 입력 불가), 입국 후에는 여권에 찍힌 <b>상륙허가 스탬프<\/b>를 추가로 스캔해야 합니다.<\/p>\n<h3>④ 유료 대행 사이트<\/h3>\n<p>1~2절에서 짚은 대로 <b>공식은 전액 무료<\/b>입니다. 수수료를 받는 곳은 공식이 아닙니다.<\/p>\n<h3>⑤ 오프라인 등록만 믿기<\/h3>\n<p>오프라인 이용은 편리하지만 제약이 있습니다. 공식 설명서는 <b>\"오프라인에서 등록한 정보는 단말기에만 저장되므로 정보가 삭제되면 복구되지 않는다\"<\/b>, <b>\"여러 기기에서 오프라인으로 수정하면 최신 내용이 반영되지 않을 수 있다\"<\/b>고 경고합니다. 오프라인으로 손댔다면 <b>온라인 상태에서 다시 열어 확인<\/b>하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 세관 면세범위 — 20만 엔 계산 예시 3가지<\/h2>\n<p>세관신고에서 실제로 <b>과세로 갈리는<\/b> 부분이 여기입니다. 일본 세관이 공시한 <b>입국자 1인당 면세범위<\/b>는 아래와 같습니다(휴대품과 별송품이 둘 다 있으면 <b>합산<\/b>합니다).<\/p>\n<table>\n<tr><th>품목<\/th><th>면세 수량·금액<\/th><th>비고<\/th><\/tr>\n<tr><td><b>주류<\/b><\/td><td>3병<\/td><td>1병 760ml 기준<\/td><\/tr>\n<tr><td><b>담배(궐련만)<\/b><\/td><td>200개비<\/td><td>가열식만이면 개별포장 10개, 엽궐련만이면 50개비, 기타 250g<\/td><\/tr>\n<tr><td><b>향수<\/b><\/td><td>2온스<\/td><td>1온스 약 28ml · 오드콜로뉴·오드투왈렛은 제외<\/td><\/tr>\n<tr><td><b>그 밖의 물품<\/b><\/td><td><b>20만 엔<\/b><\/td><td>해외시가 합계액 기준<\/td><\/tr>\n<\/table>\n<p><b>20세 미만은 주류·담배가 면세되지 않습니다.<\/b> 6세 미만 어린이는 장난감처럼 <b>본인이 쓰는 게 분명한 물건<\/b> 외에는 면세가 적용되지 않습니다.<\/p>\n<h3>예시 ① 12만 엔 시계 + 9만 엔 가방 = 21만 엔<\/h3>\n<p>합계가 20만 엔을 넘습니다. 이때 <b>전체에 세금이 붙는 게 아니라<\/b>, 세관이 <b>20만 엔 안에 들어가는 물품을 면세로 골라 주고 나머지에만 과세<\/b>합니다. 세관은 <b>\"여행자에게 유리하도록 면세 품목을 선택해 과세한다\"<\/b>고 명시하고 있습니다. 즉 <b>12만 엔 시계를 면세로 잡고 9만 엔 가방에만 과세<\/b>하는 식이 됩니다.<\/p>\n<h3>예시 ② 25만 엔짜리 가방 1개<\/h3>\n<p>가장 많이 오해하는 대목입니다. <b>\"20만 엔까지는 빼주고 5만 엔에만 세금\"<\/b>이 아닙니다. 세관 안내는 <b>\"1개로 20만 엔을 넘는 물품, 예를 들어 25만 엔 가방은 25만 엔 전액에 대해 과세된다\"<\/b>고 못박고 있습니다. <b>고가 단일 품목은 쪼갤 수 없다<\/b>는 뜻입니다.<\/p>\n<h3>예시 ③ 1,000엔짜리 초콜릿 9개 + 5,000엔 넥타이 2개<\/h3>\n<p><b>1품목당 해외시가 합계액이 1만 엔 이하<\/b>인 것은 원칙적으로 면세입니다. 세관이 든 예시가 정확히 이 두 가지(초콜릿 9개=9,000엔, 넥타이 2개=1만 엔)입니다. 선물용 소액 품목을 여러 개 사는 경우는 대체로 걱정하지 않아도 된다는 뜻입니다.<\/p>\n<div class=\"warn\"><b>⚠️ 면세범위를 넘으면 게이트로 못 갑니다<\/b><p style=\"margin:8px 0 0\">세관은 <b>\"전자신고 단말기에서 수속을 마쳤더라도, 면세범위를 넘는 휴대품·별송품 신고가 있는 분은 추가 수속을 위해 세관 직원이 있는 검사대로 안내된다\"<\/b>고 안내합니다. 즉 <b>QR을 만들어 갔다고 무조건 게이트 통과가 되는 것은 아닙니다.<\/b> 신고할 게 있으면 정직하게 신고하고 검사대로 가는 것이 맞습니다. 참고로 별송품은 <b>입국(귀국) 후 6개월 이내에 수입하는 것<\/b>까지만 면세 대상으로 봅니다.<\/p><\/div>\n<p>※ 여기 나온 금액은 <b>일본 입국 시 일본 세관 기준<\/b>입니다. <b>한국으로 돌아올 때의 한국 면세한도는 기준이 다르니<\/b> 아래 '함께 보면 좋은 글'의 면세 한도 글을 따로 확인하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 면세쇼핑(Tax-free)은 2026년 11월부터 방식이 바뀝니다<\/h2>\n<p>일본에서 <b>면세점 쇼핑<\/b>을 계획하고 계시다면 알아두실 변화가 있습니다. 일본 관광청 공식 안내에 따르면, <b>2026년 11월 1일 판매분부터<\/b> 외국인 여행자 대상 소비세 면세제도가 <b>'리펀드(환급) 방식'<\/b>으로 바뀝니다.<\/p>\n<ul>\n<li>지금까지: 면세점에서 <b>처음부터 세금을 뺀 가격<\/b>으로 결제.<\/li>\n<li>2026년 11월 1일 이후: 면세점에서 <b>세금 포함 가격으로 결제<\/b>한 뒤, <b>출국할 때 공항 세관에서 물품 반출이 확인된 후<\/b> 소비세 상당액을 <b>환급<\/b>받는 방식.<\/li>\n<\/ul>\n<p>제도가 단순해지는 면도 있습니다. <b>일반물품/소모품 구분이 폐지<\/b>되고, <b>소모품 구매 상한액(50만 엔)도 폐지<\/b>됩니다. 다만 주의할 점이 있습니다. 관광청은 <b>\"구매기록 1건에 포함된 상품 중 하나라도 세관 확인이 안 되면, 그 건에 포함된 모든 상품이 면세되지 않는다\"<\/b>고 안내합니다. 또 면세점에서 산 물건을 우체국 등으로 해외 배송하던 <b>'별송' 취급은 2025년 3월 31일자로 이미 폐지<\/b>됐습니다.<\/p>\n<div class=\"tip\"><b>💡 올여름(2026년 7~8월) 여행이라면<\/b><p style=\"margin:8px 0 0\">아직 <b>기존 방식(구매 시점에 세금 제외 가격으로 결제)<\/b>이 적용되는 기간입니다. 위 변경은 <b>2026년 11월 1일 판매분부터<\/b>이니, 가을·겨울 일본 여행을 계획 중이라면 그때 다시 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 자주 묻는 질문<\/h2>\n<h3>Q. 등록을 못 하고 비행기를 탔습니다. 어떻게 하나요?<\/h3>\n<p>기내에서 나눠주는 <b>종이 신고서<\/b>를 쓰거나, 도착 후 공항 세관에 비치된 양식을 작성하면 됩니다. 일본 세관은 <b>한국어 양식(C-5360-C)<\/b>도 공식 배포합니다. 등록을 안 했다고 입국이 거부되지는 않습니다.<\/p>\n<h3>Q. QR을 캡처해서 저장해 두면 되나요?<\/h3>\n<p><b>면세 구매용 QR은 스크린샷이 불가<\/b>하다고 공식 안내에 명시돼 있습니다. 입국·세관용은 <b>스크린샷보다 '오프라인 이용' 설치<\/b>가 안전한 방법입니다. 홈 화면에 추가해 두면 인터넷이 없어도 등록해 둔 일정의 QR을 띄울 수 있습니다.<\/p>\n<h3>Q. 한 번 등록하면 다음 여행 때도 쓸 수 있나요?<\/h3>\n<p>계정과 여권 정보(본인 정보)는 그대로 남아 있어 다시 넣을 필요가 없습니다. <b>여행마다 새로 하는 것은 '입국·귀국 예정' 등록<\/b>입니다. 지난 기록에서 <b>일본 내 체류지 정보를 인용<\/b>할 수 있어 두 번째부터는 훨씬 빠릅니다.<\/p>\n<h3>Q. 부모님 스마트폰이 없으면 어떻게 하나요?<\/h3>\n<p>등록은 PC로 할 수 있지만 <b>공항에서 QR을 보여줄 때는 스마트폰·태블릿이 필요<\/b>합니다. 스마트폰이 없거나 조작이 어려우신 분은 <b>종이 신고서로 가는 편이 오히려 편합니다.<\/b> 대신 함께 가는 가족이 자기 것만 QR로 처리하면 되고, 수속은 어차피 1인씩입니다.<\/p>\n<h3>Q. 미국 ESTA처럼 승인이 나야 가는 건가요?<\/h3>\n<p>아닙니다. 비지트재팬웹은 <b>승인·허가 절차가 아니라 신고서 사전 작성<\/b>에 가깝습니다. 승인 대기 시간도, 수수료도, 유효기간 개념도 없습니다. 미국 ESTA와는 성격이 완전히 다릅니다.<\/p>\n<h3>Q. 계정을 지우면 신고한 내용도 지워지나요?<\/h3>\n<p>아닙니다. 공식 설명서는 <b>\"계정을 삭제해도 각 행정기관에 제출된 정보는 삭제되지 않는다\"<\/b>고 명시합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 (일본 정부)<\/b><a href=\"https://www.vjw.digital.go.jp/\" target=\"_blank\" rel=\"nofollow\">▸ Visit Japan Web — 공식 서비스 (디지털청)<\/a><a href=\"https://services.digital.go.jp/ko/visit-japan-web/\" target=\"_blank\" rel=\"nofollow\">▸ 디지털청 — Visit Japan Web 한국어 안내<\/a><a href=\"https://services.digital.go.jp/ko/visit-japan-web/guide/\" target=\"_blank\" rel=\"nofollow\">▸ 디지털청 — 이용 절차(STEP 0~4) 한국어<\/a><a href=\"https://www.customs.go.jp/kaigairyoko/egate.htm\" target=\"_blank\" rel=\"nofollow\">▸ 일본 세관 — 전자신고 게이트 7개 공항<\/a><a href=\"https://www.customs.go.jp/kaigairyoko/menzei.htm\" target=\"_blank\" rel=\"nofollow\">▸ 일본 세관 — 해외여행자 면세범위<\/a><a href=\"https://www.customs.go.jp/kaigairyoko/shinkokusho.htm\" target=\"_blank\" rel=\"nofollow\">▸ 일본 세관 — 휴대품·별송품 신고서(한국어 양식)<\/a><a href=\"https://www.mlit.go.jp/kankocho/tax-free/page01_000001_00019.html\" target=\"_blank\" rel=\"nofollow\">▸ 일본 관광청 — 면세 리펀드 방식(2026.11.1~)<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">정리하면, 비지트재팬웹은 <b>의무가 아니라 시간을 아끼는 선택지<\/b>입니다. <b>QR은 2024년 1월부터 1개로 통합<\/b>됐고, <b>입국심사 카운터와 세관 전자신고 단말기에서 각각 한 번씩<\/b> 보여주면 됩니다. 전자신고 게이트가 있는 곳은 <b>나리타·하네다·간사이·주부·신치토세·후쿠오카·나하 7개 공항<\/b>, <b>IC여권 필수 · 가족도 1명씩<\/b>입니다. 가장 흔한 실수는 <b>\"가족 것까지 내가 다 해뒀다\"<\/b>는 착각과 <b>여권 6개월<\/b>, 그리고 <b>수수료를 받는 가짜 사이트<\/b>입니다. 출발 전날 <b>'홈 화면에 추가'로 오프라인 설치<\/b>까지 해두면, 도착해서 인터넷이 안 돼도 당황할 일이 없습니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 일본 디지털청 <b>Visit Japan Web 조작설명서 제3.16판(2026년 7월 22일)<\/b> 및 한국어 공식 안내, 일본 세관(관세청) 공식 페이지(전자신고 게이트 — 2025년 4월 갱신), 일본 관광청 소비세 면세제도 안내를 직접 확인해 정리했습니다. 화면 구성·설치 공항·면세 기준은 변경될 수 있으니 출국 전 위 공식 페이지에서 다시 확인하세요.<br>출처: 일본 디지털청(digital.go.jp) · 일본 세관(customs.go.jp) · 일본 관광청(mlit.go.jp/kankocho)<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/esta-2026.html\">▸ 미국 ESTA 신청 방법 수수료 유효기간 승인 거부 사유 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_942.html\">▸ 면세 한도 총정리 — 술·담배·향수 입국 면세범위<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/vs-vs.html\">▸ 로밍 vs 유심 vs 이심 해외여행 데이터 비교 총정리<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 절차·공항 목록·면세 기준은 <b>일본 디지털청·세관·관광청 공식 페이지를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 입국 규정은 예고 없이 바뀔 수 있으니 출국 전 공식 페이지를 다시 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 비지트재팬웹은 의무가 아니에요. 일본 세관은 지금도 한국어 종이 신고서(C-5360-C)를 비치·배포합니다. 다만 미리 해두면 전자신고 게이트로 빠르게 통과할 수 있어 '시간을 아끼는 선택지'입니다. 그리고 수수료를 요구하는 사이트는 100% 가짜입니다(공식 무료).\n2. QR은 2024년 1월 25일부터 1개로 통합됐어요. 입국심사 카운터에서 한 번, 짐 찾고 세관 전자신고 단말기에서 한 번 보여주면 됩니다. 전자신고 게이트가 있는 공항은 나리타·하네다·간사이·주부·신치토세·후쿠오카·나하 7곳, IC여권 필수이고 가족이라도 1명씩 수속해야 합니다.\n3. 일본 세관 면세범위는 1인당 주류 3병·궐련 200개비·향수 2온스·기타 20만 엔이에요. 함정은 '1개로 20만 엔을 넘는 물건'인데, 25만 엔 가방은 5만 엔이 아니라 25만 엔 전액이 과세 대상입니다. 반대로 1품목 합계 1만 엔 이하(1,000엔 초콜릿 9개 등)는 원칙적으로 면세입니다.\n"},{"code":"D2-08","title":"고령운전자 운전면허 자진반납 지원금 신청 방법 대상 금액 총정리 (2026 지자체별)","lane":"info","thumb":"141_license_return.png","draft":"고령운전자면허자진반납_글_HTML.txt","facts":"지자체 조례로 각자 지급(전국 단일 금액 없음) 10만~50만원 · 서울시 70세이상(1956.12.31 이전 출생) 20만원 선불교통카드 2026.1.28부터 선착순 35,211명 · 강남구 실운전자 50만원/비실운전 20만원 · 창원시 만70세이상 면허증만 10만원, 실운전 증빙 시 20만원(온누리·창원사랑상품권) · 선착순 예산소진 시 차년도 이월 · 생애 1회 한정 · 반납 철회 불가(재취득=학과·기능·도로주행 전부 재응시) · 갱신주기 65세이상 5년/75세이상 3년+교통안전교육 · 출처: 정책브리핑 148959222(2026.02.10), 서울시 보도자료(2026.01.27), 창원시 공식안내, 찾기쉬운 생활법령정보","added":"2026-07-28","thumb_data":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCACIAQQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFB b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#eefaf4;border:1px solid #cfeadd;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#1a8c5e;margin-bottom:8px}\n.lsg .rel a{display:block;color:#1f6f52;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#9aa7a1;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">생활·행정<\/span>\n<p>부모님이 운전을 그만두실 때가 됐는데 <b>면허증을 그냥 서랍에 넣어두는 것과 정식으로 반납하는 것은 완전히 다릅니다.<\/b> 자진반납을 하면 지자체가 <b>교통카드나 지역화폐로 10만~50만 원<\/b>을 주는데, <b>순서를 잘못 밟으면 반납은 되고 지원금은 못 받습니다.<\/b> 게다가 <b>한 번 반납하면 되돌릴 수 없고, 지원은 평생 딱 한 번<\/b>입니다. 얼마를 받는지, 어디서 어떤 순서로 신청해야 하는지, 반납이 정말 이득인지 계산까지 공식 자료 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 자진반납 제도란 — 그냥 안 타는 것과 뭐가 다른가<\/a><a href=\"#sec2\">2. 대상 연령과 지원 금액 — 지자체마다 다릅니다<\/a><a href=\"#value-add\">3. 반납이 이득일까 — 손익 3단계 계산과 사례 2개<\/a><a href=\"#sec3\">4. 신청 방법 · 순서 (여기서 지원금이 갈립니다)<\/a><a href=\"#sec4\">5. 구비서류 — 면허증을 잃어버렸다면<\/a><a href=\"#sec5\">6. 지원금을 못 받는 경우 7가지<\/a><a href=\"#sec6\">7. 반납 vs 갱신 — 어느 쪽을 택할까<\/a><a href=\"#sec7\">8. 놓치기 쉬운 함정 5가지<\/a><a href=\"#sec8\">9. 자주 묻는 질문<\/a><a href=\"#sec9\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec3\">👉 지원금 놓치지 않는 신청 순서부터 보기<\/a>\n\n<h2 id=\"sec1\">1. 자진반납 제도란 — 그냥 안 타는 것과 뭐가 다른가<\/h2>\n<p><b>운전면허 자진반납<\/b>은 유효한 운전면허를 본인 의사로 반납해 <b>면허를 취소(실효) 처리<\/b>하는 절차입니다. 여기에 각 지방자치단체가 <b>조례로 인센티브<\/b>를 얹어, 고령 운전자가 반납하면 <b>교통카드·지역화폐 등으로 지원금<\/b>을 지급합니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>운전을 안 하고 놔두기<\/th><th>자진반납<\/th><\/tr>\n<tr><td>면허 상태<\/td><td>그대로 <b>유효<\/b><\/td><td><b>취소(실효)<\/b> 처리<\/td><\/tr>\n<tr><td>갱신·적성검사<\/td><td>기간마다 <b>계속 받아야<\/b> 함<\/td><td>더 이상 필요 없음<\/td><\/tr>\n<tr><td>지자체 지원금<\/td><td><b>없음<\/b><\/td><td><b>10만~50만 원<\/b>(지역별)<\/td><\/tr>\n<tr><td>되돌리기<\/td><td>언제든 다시 운전<\/td><td><b>불가<\/b> — 재취득은 처음부터<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 핵심 한 줄<\/b><p style=\"margin:8px 0 0\">\"이제 운전 안 한다\"고 마음만 먹는 것과 <b>반납 신청서를 쓰는 것<\/b>은 결과가 다릅니다. 지원금은 <b>정식으로 반납한 사람에게만<\/b> 나갑니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 대상 연령과 지원 금액 — 지자체마다 다릅니다<\/h2>\n<p>이 제도에서 가장 많이 오해하는 부분입니다. <b>전국이 똑같은 금액이 아닙니다.<\/b> 정부가 정한 단일 지원금이 있는 게 아니라 <b>시·군·구가 각자 조례로 정하기 때문<\/b>에, 같은 나이·같은 조건이어도 <b>사는 동네에 따라 10만 원과 50만 원으로 갈립니다.<\/b><\/p>\n<h3>연령 기준<\/h3>\n<p>정부 정책브리핑은 대상을 <b>\"만 65세 또는 만 70세 이상의 운전면허 소지자\"<\/b>로 안내하면서 <b>지자체별로 기준 나이가 다를 수 있다<\/b>고 명시하고 있습니다. 즉 <b>65세부터 되는 곳도, 70세부터 되는 곳도, 75세부터인 곳도 있습니다.<\/b><\/p>\n<h3>실제 지자체 사례 (공식 자료 기준)<\/h3>\n<table>\n<tr><th>지역<\/th><th>연령<\/th><th>지원 내용<\/th><th>지급 수단<\/th><\/tr>\n<tr><td><b>서울시<\/b><\/td><td>70세 이상<br>(1956.12.31. 이전 출생)<\/td><td><b>20만 원<\/b><\/td><td>선불형 교통카드<\/td><\/tr>\n<tr><td><b>서울 강남구<\/b><\/td><td>70세 이상<\/td><td>실운전자 <b>50만 원<\/b><br>실운전자 아니면 20만 원<\/td><td>교통카드<\/td><\/tr>\n<tr><td><b>창원시<\/b><\/td><td>만 70세 이상<\/td><td>면허증만 반납 <b>10만 원<\/b><br>실운전 증빙 첨부 <b>20만 원<\/b><\/td><td>온누리·창원사랑상품권<\/td><\/tr>\n<\/table>\n<p style=\"font-size:14px;color:#666\">※ 위는 <b>예시<\/b>입니다. 금액·연령·예산은 해마다 바뀌므로 <b>반드시 본인 거주지 시·군·구 공고<\/b>를 확인하세요.<\/p>\n<div class=\"tip\"><b>⚠️ 선착순이고, 예산이 떨어지면 끝납니다<\/b><p style=\"margin:8px 0 0\">정책브리핑은 이 제도가 <b>선착순 지급<\/b>이며 <b>예산 소진 시 차년도 사업으로 넘어간다<\/b>고 설명합니다. 창원시도 공식 안내에 <b>\"예산 소진 시 조기 마감될 수 있음\"<\/b>을 못박아 두었습니다. 서울시는 2026년에 <b>1월 28일부터<\/b> 선착순 접수를 시작했고 <b>지원 인원을 35,211명<\/b>으로 정해 두었습니다. <b>연초에 신청하는 사람이 유리한 구조<\/b>입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"value-add\">3. 반납이 이득일까 — 손익 3단계 계산과 사례 2개<\/h2>\n<p>지원금 20만 원만 보고 판단하면 안 됩니다. 반납의 실제 손익은 <b>세 갈래<\/b>로 갈립니다. 아래 순서대로 본인 숫자를 넣어 보세요.<\/p>\n<div class=\"tip\"><b>📐 반납 손익 계산 3단계<\/b>\n<p style=\"margin:8px 0 0\"><b>1단계 (+)<\/b> 지자체 <b>지원금<\/b> — 딱 <b>1회<\/b>, 평생 한 번<br>\n<b>2단계 (+)<\/b> 차를 함께 처분한다면 <b>연간 유지비 절감<\/b> — 자동차보험료 + 자동차세 + 정기검사 + 주유비 + 주차비<br>\n<b>3단계 (−)<\/b> 늘어나는 <b>대중교통·택시비<\/b> — 기존에 차로 다니던 이동을 대체하는 비용<\/p>\n<p style=\"margin:10px 0 0\"><b>연 손익 = (유지비 절감) − (교통비 증가)<\/b>, 여기에 첫해만 <b>지원금<\/b>을 더합니다.<\/p><\/div>\n\n<h3>사례 ① 차를 함께 처분하는 경우<\/h3>\n<p>서울 거주 72세, 이미 운행이 거의 없던 승용차를 반납과 함께 처분한다고 가정합니다. (아래 유지비는 <b>설명을 위한 가정값<\/b>입니다)<\/p>\n<table>\n<tr><th>항목<\/th><th>금액(연)<\/th><th>구분<\/th><\/tr>\n<tr><td>지원금(교통카드)<\/td><td>20만 원<\/td><td><b>첫해 1회<\/b><\/td><\/tr>\n<tr><td>자동차보험료 절감<\/td><td>80만 원<\/td><td>매년 (+)<\/td><\/tr>\n<tr><td>자동차세 절감<\/td><td>30만 원<\/td><td>매년 (+)<\/td><\/tr>\n<tr><td>주유·정비·검사 절감<\/td><td>60만 원<\/td><td>매년 (+)<\/td><\/tr>\n<tr><td>대중교통·택시비 증가<\/td><td>−50만 원<\/td><td>매년 (−)<\/td><\/tr>\n<tr><td><b>연 손익<\/b><\/td><td colspan=\"2\"><b>+120만 원<\/b> (첫해는 지원금 포함 <b>+140만 원<\/b>)<\/td><\/tr>\n<\/table>\n<p>이 경우 <b>지원금 20만 원은 사실 부수적<\/b>이고, 실제 이득은 <b>차량 유지비가 통째로 사라지는 것<\/b>에서 나옵니다. <b>이미 운전을 거의 안 하는데 차만 세워둔 상태<\/b>라면 반납의 경제적 효과가 가장 큽니다.<\/p>\n\n<h3>사례 ② 차는 두고 면허만 반납하는 경우<\/h3>\n<p>배우자나 자녀가 같은 차를 계속 운행해 차량은 유지한다고 가정합니다.<\/p>\n<table>\n<tr><th>항목<\/th><th>금액<\/th><\/tr>\n<tr><td>지원금<\/td><td><b>+20만 원<\/b> (1회)<\/td><\/tr>\n<tr><td>유지비 절감<\/td><td>0원 (차는 그대로)<\/td><\/tr>\n<tr><td>보험료 변동<\/td><td>운전자 범위가 줄어 <b>소폭 인하 가능<\/b> — 보험사 확인 필요<\/td><\/tr>\n<tr><td>본인 이동 비용<\/td><td>대중교통·택시로 <b>증가<\/b><\/td><\/tr>\n<tr><td><b>결론<\/b><\/td><td colspan=\"2\">금전적으로는 <b>1회 20만 원이 거의 전부<\/b> → 판단 기준은 돈이 아니라 <b>안전<\/b><\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>📌 계산이 말해주는 것<\/b><p style=\"margin:8px 0 0\">반납은 <b>\"차를 함께 정리할 때\" 경제적으로 확실히 이득<\/b>이고, <b>차를 유지한 채 면허만 반납<\/b>하면 금전적 이득은 1회 지원금에 그칩니다. 후자라면 <b>지원금 때문이 아니라 안전 때문에<\/b> 결정하는 것이 맞습니다. 차량 유지비 실제 항목별 금액은 <a href=\"https://lifeinfo8975.blogspot.com/2026/06/hev-1-2026.html\">1년 유지비 비교 글<\/a>에서 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">4. 신청 방법 · 순서 (여기서 지원금이 갈립니다)<\/h2>\n<p><b>이 글에서 가장 중요한 부분입니다.<\/b> 면허 반납은 <b>경찰서·운전면허시험장<\/b>에서도 되고 <b>주민센터(행정복지센터)<\/b>에서도 됩니다. 그런데 <b>지원금을 주는 주체는 경찰이 아니라 지자체<\/b>입니다.<\/p>\n<div class=\"tip\"><b>✅ 권장 순서 — 주민센터 원스톱<\/b>\n<p style=\"margin:8px 0 0\"><b>① 거주지 시·군·구청 또는 주민센터에 전화<\/b>해 올해 지원 대상 연령·금액·잔여 예산을 먼저 확인<br>\n<b>② 운전면허증 + 신분증<\/b>(필요하면 실운전 증빙)을 들고 <b>주민등록상 주소지 읍·면·동 행정복지센터<\/b> 방문<br>\n<b>③ 반납 신청서 + 지원금 신청서를 한 자리에서 작성<\/b><br>\n<b>④ 교통카드·지역화폐 수령<\/b> (즉시 지급 또는 추후 지급, 지역별 상이)<\/p><\/div>\n<p>정책브리핑도 <b>\"운전면허증을 지참하여 경찰서나 인근 행정복지센터를 방문해 신청서를 작성\"<\/b>하면 되고, <b>직접 방문이 어려우면 대리인 신청도 가능<\/b>하다고 안내합니다.<\/p>\n<h3>경찰서·온라인에서 먼저 반납해버렸다면?<\/h3>\n<p>그래도 방법은 있습니다. 창원시는 <b>\"경찰서 반납 완료 시 취소결정통지서, 신분증\"<\/b>을 가져오면 지원금 신청이 된다고 안내합니다. 다만 <b>이런 사후 신청을 받아주는지는 지자체마다 다르고<\/b>, 어떤 곳은 <b>주민센터를 통한 반납만 인정<\/b>하기도 합니다. 그래서 <b>반납 버튼을 누르기 전에 지자체에 먼저 확인하는 것<\/b>이 안전합니다.<\/p>\n<div class=\"tip\"><b>⚠️ '어디서 반납했는지'를 인정하는 범위가 지자체마다 다릅니다<\/b><p style=\"margin:8px 0 0\">도로교통공단 <b>안전운전 통합민원<\/b>에서도 온라인 반납이 가능하고, 경찰서·운전면허시험장에서도 됩니다. 문제는 <b>지원금을 주는 주체가 지자체<\/b>라는 점입니다. 창원시처럼 <b>경찰서에서 이미 반납했어도 취소결정통지서를 가져오면 신청을 받아주는 곳<\/b>이 있는 반면, 서울시는 <b>동주민센터에서 반납과 동시에 교통카드를 지급하는 방식<\/b>으로 안내합니다. <b>어떤 경로의 반납까지 인정하는지는 지역마다 다르고, 반납은 한 번 하면 철회가 안 됩니다.<\/b> 그래서 <b>반납을 실행하기 전에 거주지 주민센터에 먼저 확인<\/b>하는 것이 유일하게 안전한 순서입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">5. 구비서류 — 면허증을 잃어버렸다면<\/h2>\n<table>\n<tr><th>상황<\/th><th>필요 서류<\/th><\/tr>\n<tr><td><b>면허증이 있다<\/b><\/td><td>운전면허증, 신분증<\/td><\/tr>\n<tr><td><b>면허증을 분실했다<\/b><\/td><td><b>운전경력증명서<\/b>(경찰서 방문 또는 정부24 발급), 신분증<\/td><\/tr>\n<tr><td><b>이미 경찰서에서 반납했다<\/b><\/td><td><b>취소결정통지서<\/b>, 신분증<\/td><\/tr>\n<tr><td><b>지원금을 더 받고 싶다(실운전 증빙)<\/b><\/td><td>자동차보험 서류, 자동차등록증, 운수종사자 경력증명서 등<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💰 '실운전 증빙'을 챙기면 금액이 2배가 되는 곳이 있습니다<\/b><p style=\"margin:8px 0 0\">창원시는 <b>면허증만 반납하면 10만 원, 실제 운전을 했다는 증빙을 함께 내면 20만 원<\/b>입니다. 강남구는 <b>실운전자 50만 원 / 아니면 20만 원<\/b>입니다. <b>자동차보험 가입증명서나 자동차등록증 한 장<\/b>으로 금액이 두 배 이상 벌어지므로, <b>방문 전에 챙길 서류가 있는지 반드시 물어보세요.<\/b><\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">6. 지원금을 못 받는 경우 7가지<\/h2>\n<table>\n<tr><th>이런 경우<\/th><th>왜 안 되나 / 어떻게 하나<\/th><\/tr>\n<tr><td><b>연령 미달<\/b><\/td><td>거주지 기준이 70세인데 65세라면 대상 아님 → <b>내 지자체 기준을 먼저 확인<\/b><\/td><\/tr>\n<tr><td><b>이미 반납 지원을 받은 적 있다<\/b><\/td><td><b>생애 1회 한정<\/b>. 다른 지역에서 받은 이력도 조회됩니다<\/td><\/tr>\n<tr><td><b>면허가 이미 정지·취소 상태<\/b><\/td><td>반납은 <b>유효한 면허<\/b>를 전제로 합니다. 취소된 면허는 반납할 게 없습니다<\/td><\/tr>\n<tr><td><b>주민등록이 그 지자체에 없다<\/b><\/td><td>지원은 <b>주민등록지 기준<\/b>. 실제 거주만으로는 안 됩니다<\/td><\/tr>\n<tr><td><b>예산이 소진됐다<\/b><\/td><td>선착순이라 <b>연말에 가면 마감<\/b>인 경우가 많음 → 차년도 초에 재신청<\/td><\/tr>\n<tr><td><b>온라인으로만 반납했다<\/b><\/td><td>지역에 따라 <b>인센티브 제외<\/b> → 반납 전에 지자체 확인 필수<\/td><\/tr>\n<tr><td><b>실운전 증빙을 못 냈다<\/b><\/td><td>탈락은 아니지만 <b>금액이 절반 이하<\/b>로 줄어드는 지역이 있습니다<\/td><\/tr>\n<\/table>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">7. 반납 vs 갱신 — 어느 쪽을 택할까<\/h2>\n<p>반납하지 않고 계속 운전하려면 <b>고령일수록 갱신·적성검사 주기가 짧아지고, 일정 연령 이상은 교통안전교육까지 이수<\/b>해야 합니다. 본인에게 적용되는 <b>정확한 갱신 주기와 교육 의무는 연령·면허 종별에 따라 다르므로<\/b>, 아래 도로교통공단 안전운전 통합민원에서 <b>본인 면허 기준으로 조회<\/b>하시는 것이 확실합니다. 절차·비용 정리는 <a href=\"https://lifeinfo8975.blogspot.com/2026/06/2026_0596034079.html\">운전면허 갱신 글<\/a>에 따로 있습니다.<\/p>\n<table>\n<tr><th>판단 기준<\/th><th>반납이 낫다<\/th><th>갱신이 낫다<\/th><\/tr>\n<tr><td>운전 빈도<\/td><td>월 <b>1~2회 이하<\/b>, 사실상 세워둠<\/td><td>주 <b>2회 이상<\/b> 실제 필요<\/td><\/tr>\n<tr><td>대체 교통<\/td><td>지하철·버스 노선이 <b>가깝다<\/b><\/td><td>대중교통이 <b>불편한 지역<\/b>(농어촌 등)<\/td><\/tr>\n<tr><td>차량 보유<\/td><td>차를 <b>함께 처분<\/b>할 예정<\/td><td>가족이 <b>같이 쓰는 차<\/b>가 있다<\/td><\/tr>\n<tr><td>건강<\/td><td>야간·장거리 운전이 <b>부담<\/b>스럽다<\/td><td>적성검사·교통안전교육에 <b>문제 없다<\/b><\/td><\/tr>\n<tr><td>돈<\/td><td>유지비 절감 + 지원금<\/td><td>갱신 수수료·교육 시간이 <b>더 싸다<\/b><\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 애매하면 '갱신 시점'까지 기다리는 방법도 있습니다<\/b><p style=\"margin:8px 0 0\">반납은 <b>되돌릴 수 없지만 서두를 이유도 없습니다.<\/b> 다음 갱신·적성검사 시기가 다가올 때 <b>\"검사를 받고 더 탈지, 여기서 반납할지\"<\/b>를 함께 결정하면 판단이 훨씬 쉬워집니다. 다만 <b>지원금은 선착순<\/b>이라 그 해 예산이 남아 있는지는 따로 확인해야 합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">8. 놓치기 쉬운 함정 5가지<\/h2>\n<h3>함정 ① 확인 없이 먼저 반납해 버리는 것<\/h3>\n<p>반납은 <b>경찰서·운전면허시험장·온라인·주민센터<\/b> 어디서든 됩니다. 그런데 <b>지원금 신청을 어떤 경로의 반납까지 인정하는지, 어떤 서류를 요구하는지는 지자체마다 다릅니다.<\/b> 먼저 반납부터 해버리면 <b>조건이 안 맞아도 되돌릴 수 없습니다.<\/b> 순서는 하나뿐입니다 — <b>주민센터에 먼저 전화해 올해 대상 연령·금액·잔여 예산·필요 서류를 확인하고, 그 다음에 반납<\/b>하세요.<\/p>\n<h3>함정 ② 철회가 안 됩니다 — 재취득은 처음부터 다시<\/h3>\n<p>반납으로 면허가 실효되면 <b>취소 철회는 불가능<\/b>합니다. 다시 운전하려면 <b>신규 취득과 같은 절차<\/b>를 밟아야 합니다 — <b>교통안전교육·신체검사 → 학과시험 → 기능시험 → 도로주행시험<\/b>을 전부 다시 봐야 합니다. 60~70대에 도로주행시험까지 다시 통과하는 것은 결코 쉽지 않습니다. <b>\"일단 받고 나중에 다시 따면 되지\"는 성립하지 않습니다.<\/b><\/p>\n<h3>함정 ③ 평생 딱 한 번입니다<\/h3>\n<p>지원은 <b>1회 한정<\/b>이며 중복 지원이 되지 않습니다. 이사 후 다른 지역에서 다시 받는 것도 안 됩니다. <b>지원금이 큰 지역에 주민등록이 되어 있다면 그 기준으로 받는 것이 유리<\/b>합니다.<\/p>\n<h3>함정 ④ 면허증은 신분증이기도 했습니다<\/h3>\n<p>운전면허증은 사진이 있는 <b>공적 신분증<\/b> 역할을 겸해 왔습니다. 반납하면 그 기능이 사라집니다. <b>주민등록증이 없거나 오래돼 사진 확인이 어렵다면, 반납 전에 주민등록증부터 재발급<\/b>받아 두세요. 은행·병원·관공서에서 곧바로 불편해집니다.<\/p>\n<h3>함정 ⑤ 교통카드 지원금과 지하철 무임승차는 별개입니다<\/h3>\n<p>서울시는 <b>반납 지원 교통카드로는 지하철을 이용할 수 없고, 어르신 무료 교통카드를 따로 이용해야 한다<\/b>고 안내합니다. <b>\"20만 원으로 지하철도 타면 되겠네\"는 오해<\/b>입니다. 지원 교통카드는 버스·택시와 티머니 가맹점(편의점 등)에서 쓰는 용도이고, 지하철 무임은 <b>별도의 어르신 교통카드<\/b>로 이용합니다.<\/p>\n<!-- [운영자 경험 자리] 부모님/지인의 면허 반납 경험이 있으면 1~2문장. 없으면 비워둠 -->\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">9. 자주 묻는 질문<\/h2>\n<h3>Q. 우리 동네는 얼마를 주나요?<\/h3>\n<p><b>전국 단일 금액이 없습니다.<\/b> 시·군·구 조례로 각자 정하기 때문에 <b>10만 원부터 50만 원까지<\/b> 차이가 납니다. 거주지 <b>시·군·구청 홈페이지에서 \"운전면허 자진반납\"으로 검색<\/b>하거나 <b>주민센터에 전화<\/b>하는 것이 가장 정확합니다.<\/p>\n<h3>Q. 본인이 거동이 불편해 방문이 어렵습니다.<\/h3>\n<p><b>대리인 신청이 가능<\/b>합니다. 다만 대리인 자격·위임장 양식은 지자체마다 다르므로 <b>미리 주민센터에 필요한 서류를 확인<\/b>하세요.<\/p>\n<h3>Q. 1종 면허인데 2종으로 낮추는 것도 가능한가요?<\/h3>\n<p>면허 종별을 낮추는 것과 자진반납은 <b>별개 절차<\/b>입니다. 반납 지원금은 <b>면허를 완전히 반납(실효)<\/b>하는 경우에 지급됩니다. 종별 하향만 하면 면허는 유지되므로 <b>지원 대상이 아닙니다.<\/b><\/p>\n<h3>Q. 지금 신청하면 언제 받나요?<\/h3>\n<p>지역에 따라 <b>현장에서 즉시 교통카드를 주는 곳<\/b>과 <b>추후 지급하는 곳<\/b>이 있습니다. 서울시는 동주민센터에서 반납과 동시에 교통카드를 받는 방식으로 안내하고 있습니다.<\/p>\n<h3>Q. 예산이 소진됐다는데 어떻게 하나요?<\/h3>\n<p>정책브리핑은 <b>예산 소진 시 차년도 사업으로 넘어간다<\/b>고 안내합니다. 즉 <b>내년 초 접수 시작에 맞춰 다시 신청<\/b>하면 됩니다. 서울시가 2026년에 <b>1월 28일부터<\/b> 조기 접수를 시작한 것처럼, <b>연초가 가장 확실한 시기<\/b>입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148959222\" target=\"_blank\" rel=\"nofollow\">▸ 대한민국 정책브리핑 — 고령운전자 운전면허 반납 제도 안내<\/a><a href=\"https://www.gov.kr\" target=\"_blank\" rel=\"nofollow\">▸ 정부24 — 운전경력증명서 발급(면허증 분실 시)<\/a><a href=\"https://minwon24.police.go.kr\" target=\"_blank\" rel=\"nofollow\">▸ 경찰민원24 — 운전면허 민원<\/a><a href=\"https://www.safedriving.or.kr\" target=\"_blank\" rel=\"nofollow\">▸ 도로교통공단 안전운전 통합민원 — 운전면허 온라인 민원<\/a><a href=\"https://news.seoul.go.kr/traffic/archives/516087\" target=\"_blank\" rel=\"nofollow\">▸ 서울특별시 — 운전면허 반납 어르신 교통카드 지원 안내<\/a><\/div>\n\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">정리하면 <b>①연령 기준(65세·70세·75세)과 금액(10만~50만 원)은 지자체마다 다르고 ②선착순이라 예산이 떨어지면 마감되며 ③평생 1회뿐이고 ④반납은 되돌릴 수 없습니다.<\/b> 무엇보다 <b>순서<\/b>가 중요합니다 — <b>경찰서·온라인에서 먼저 반납하지 말고, 거주지 주민센터에 전화해 올해 조건부터 확인한 뒤 그곳에서 원스톱으로 처리<\/b>하세요. 실운전 증빙 서류 한 장으로 금액이 두 배가 되는 지역도 있으니, <b>방문 전에 챙길 서류를 꼭 물어보시기 바랍니다.<\/b><\/p><\/div>\n\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 지원 연령·금액·예산·접수 기간은 <b style=\"display:inline;color:#33503a;margin:0\">지자체 조례와 연도별 예산에 따라 달라집니다.<\/b> 본문의 지역 사례(서울시·강남구·창원시)와 손익 계산 사례는 제도 이해를 돕기 위한 <b style=\"display:inline;color:#33503a;margin:0\">예시<\/b>이며, 실제 지원 여부·금액은 반드시 거주지 시·군·구청 또는 읍·면·동 행정복지센터에서 확인하세요.<br>출처: <a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148959222\">대한민국 정책브리핑 「고령운전자, 운전면허 반납하고 혜택도 받고 안전도 챙겨요」(2026.02.10)<\/a>, <a href=\"https://news.seoul.go.kr/traffic/archives/516087\">서울특별시 보도자료 「운전면허 반납 어르신 20만원 교통카드 지원」(2026.01.27)<\/a>, <a href=\"https://www.changwon.go.kr/cwportal/depart/11064/13683/13684.web\">창원시 운전면허 자진반납 지원 안내<\/a>, <a href=\"https://www.easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&csmSeq=668&ccfNo=2&cciNo=2&cnpClsNo=1\">찾기쉬운 생활법령정보 — 운전면허 취득절차<\/a>(반납 후 재취득 시 거치는 학과·기능·도로주행 절차 근거). 갱신 주기·교통안전교육 의무는 연령·면허 종별에 따라 다르므로 <a href=\"https://www.safedriving.or.kr\">도로교통공단 안전운전 통합민원<\/a>에서 본인 면허 기준으로 확인하세요.<\/div>\n\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/06/2026_0596034079.html\">▸ 운전면허 갱신 방법 적성검사 기간 비용 총정리 (2026)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/hev-1-2026.html\">▸ 내연차 하이브리드 마일드HEV 전기차 1년 유지비 비교 (2026)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/k-2026.html\">▸ K-패스 신청 방법 환급률 카드 발급 총정리 (2026)<\/a><\/div>\n\n<div id=\"ymyl-disclaimer\" style=\"margin-top:22px;font-size:13px;color:#666;line-height:1.6\">본 글은 정보 제공용이며, 실제 지원 대상 여부·지급 금액·접수 가능 여부는 거주지 지방자치단체의 조례와 해당 연도 예산에 따라 결정됩니다. 본문의 손익 계산 사례는 계산 방식을 설명하기 위한 가정값이며, 개인의 차량·보험·이동 패턴에 따라 결과가 달라집니다.<\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 수치·대상·절차는 <b>공식 자료를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 제도는 바뀔 수 있으니 신청 전 공식 페이지를 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 고령운전자가 운전면허를 자진반납하면 지자체가 10만~50만 원(교통카드·지역화폐)을 줍니다. 전국 단일 금액이 아니라 시·군·구 조례로 각자 정합니다 — 서울시 70세 이상 20만 원, 강남구 실운전자 50만 원, 창원시 면허증만 10만 원·실운전 증빙 시 20만 원.\n2. 가장 큰 함정은 '순서'입니다. 경찰서나 온라인에서 먼저 반납해 버리면 지역에 따라 지원금 대상에서 빠질 수 있고, 반납은 철회가 안 됩니다. 반드시 거주지 주민센터에 먼저 전화해 올해 조건·잔여 예산을 확인하고, 그곳에서 반납과 지원금 신청을 한 번에 처리하세요.\n3. 선착순이라 예산이 떨어지면 그 해는 마감되고(서울시는 2026년 1월 28일부터 35,211명 선착순), 지원은 평생 딱 1회입니다. 자동차보험 가입증명서 같은 '실운전 증빙' 한 장으로 금액이 두 배가 되는 지역이 있으니 방문 전에 챙길 서류를 꼭 물어보세요.\n"}]},"db":{"version":1,"updated":"2026-07-27","root":"lifeinfo","blog":"https://lifeinfo8975.blogspot.com/","taxonomy":[{"code":"A","name":"정부지원·복지","color":"#2BC4B0","subs":[{"code":"A1","name":"지원금·수당"},{"code":"A2","name":"생계·바우처 지원"},{"code":"A5","name":"근로·구직 지원"},{"code":"A3","name":"연금·노후"},{"code":"A4","name":"위기·재난 지원"}]},{"code":"B","name":"세금·금융","color":"#4D9DE0","subs":[{"code":"B1","name":"지방세"},{"code":"B4","name":"국세"},{"code":"B2","name":"금융·은행"},{"code":"B3","name":"연금자산"}]},{"code":"C","name":"건강·의료","color":"#E76F51","subs":[{"code":"C1","name":"건강보험 제도·환급"},{"code":"C2","name":"검진·접종"},{"code":"C3","name":"보험·요양"},{"code":"C4","name":"치과·수술 급여"}]},{"code":"D","name":"생활·행정","color":"#2EB67D","subs":[{"code":"D1","name":"증명·민원"},{"code":"D2","name":"자동차·교통"},{"code":"D3","name":"주거·공과금"},{"code":"D4","name":"소비자·환불"}]},{"code":"E","name":"디지털·통신","color":"#4361C9","subs":[{"code":"E1","name":"통신·요금"},{"code":"E2","name":"앱·계정"},{"code":"E3","name":"자격·교육"}]},{"code":"F","name":"여행","color":"#7C5CE0","subs":[{"code":"F1","name":"여권·서류·보험"},{"code":"F2","name":"국내 교통·이동"},{"code":"F3","name":"해외 결제·통신"},{"code":"F4","name":"국내 숙박·레저"}]},{"code":"G","name":"우리동네","color":"#E8A33D","subs":[{"code":"G1","name":"부산진구·부산"},{"code":"G2","name":"양산"},{"code":"G3","name":"여행·문화지원"},{"code":"G4","name":"음식"}]},{"code":"H","name":"경제·이슈","color":"#52606D","subs":[{"code":"H1","name":"기업·산업"}]}],"count":161,"posts":[{"code":"A1-02","cat":"A","catName":"정부지원·복지","sub":"A1","subName":"지원금·수당","title":"고유가 피해지원금 2차 신청 대상 금액 사용처 총정리","url":"https://lifeinfo8975.blogspot.com/2026/06/2.html","thumb":"42_oilrelief.png","desc":"거주지별 10~25만원, 2차 신청기간·사용기한 안내.","tags":["고유가지원금","지역화폐"],"osmu":{"naver":"https://blog.naver.com/magsori8975/224329406305","threads":"https://www.threads.com/@magsori8975/post/DaG7BJ6gW27"},"osmu_at":{"naver":"2026-06-28","threads":"2026-06-28"}},{"code":"A1-03","cat":"A","catName":"정부지원·복지","sub"   const omAll=recs.filter(r=>r.osmu&&typeof r.osmu==='object');
  const oNv=omAll.filter(r=>r.osmu.naver).length, oTh=omAll.filter(r=>r.osmu.threads).length, oIn=omAll.filter(r=>r.osmu.instagram).length;
  // 미결 관리의 I 칩은 DB에서 직접 도출한다. pending.json 의 ch 는 {g,n,t} 만 담고
  // 있어서(pending 생성기가 아직 인스타를 모른다) ch.i 를 믿으면 게시한 글도 ✗ 로 나온다.
  const osmuByCode={}; recs.forEach(r=>{if(r.code)osmuByCode[r.code]=r.osmu||{};});
  const oRecent=omAll.slice(-4).reverse();
  const nowN=pl.code?(STEPS.find(s=>checked.indexOf(s.n)<0)||{}).n:0;
  let pubHtml;
  if(pl.code){
    const pct=Math.round(done/STEPS.length*100);
    const lis=STEPS.map(st=>{
      const on=checked.indexOf(st.n)>=0, now=(!on&&st.n===nowN);
      const ic=on?CHECK:(now?NOWI:WAIT), cls=on?'on':(now?'now':'wait');
      return '<li class="'+cls+'">'+ic+'<span class="num">'+st.n+'</span>'
        +'<span class="who '+st.who+'">'+(st.who==='ai'?'🤖':'🧑')+'</span>'
        +'<span class="lbl">'+esc(st.t)+(st.star?'<span class="star">★</span>':'')+'</span></li>';
    }).join('');
    pubHtml='<div class="pcode">'+esc(pl.code)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div>'
      +'<div class="cnt">'+done+' / '+STEPS.length+' 단계'+(pl.note?' · '+esc(pl.note):'')+'</div><ul>'+lis+'</ul>'
      +'<div class="banner'+(done===STEPS.length?' show':'')+'">✅ 발행·확산 완료</div>';
  }else{
    pubHtml='<div class="pcode none">진행 중인 발행 없음</div>';
  }
  const osmuLi=oRecent.map(r=>'<div class="row done">'+CHECK+'<span>'+esc(r.code)+' '+esc((r.title||'').slice(0,15))+'</span><span class="mut" style="margin-left:auto;font-size:10.5px">'+(r.osmu.naver?'네이버 ':'')+(r.osmu.threads?'쓰레드 ':'')+(r.osmu.instagram?'인스타':'')+'</span></div>').join('');
  // 🤝 협업 — 세션별(collab.json: 정체성=레지스트리·활동=git log·상태=git status)
  const stLab={active:'활동중',uncommitted:'미커밋',idle:'대기'};
  const collabHtml=(collab&&collab.agents||[]).map(a=>{
    const acts=(a.recent||[]).map(r=>'<div class="act">'+esc((r.s||'').slice(0,40))+' <span class="d">'+esc(r.d||'')+'</span></div>').join('');
    return '<div class="agent"><div class="ah">'+esc(a.emoji||'')+'<span>'+esc(a.name||'')+'</span><span class="st '+(a.state||'idle')+'">'+(stLab[a.state]||a.state||'')+'</span></div>'
      +'<div class="role">'+esc(a.role||'')+'</div><div class="own">담당 '+esc(a.owns||'')+'</div>'+acts+'</div>';
  }).join('');
  // 💡 시스템 조언 — 라이브 데이터 조건에서만 도출(하드코딩 일반론 금지)
  const adv=[];
  if(idx&&typeof idx.indexed==='number'){
    const iDt=idx.checked_at?' ('+String(idx.checked_at).slice(5)+' 실측)':'';
    if(idx.indexed===0){const cr=Object.values(idx.posts||{}).filter(p=>p&&p.lastCrawl).length;
      adv.push('색인 0/'+idx.total+iDt+' — 크롤 '+cr+'편·미크롤 '+(idx.total-cr)+'편. GSC 일일한도+OSMU 백링크로 점진(재검토는 색인 잡힌 뒤).');}
    else adv.push('색인 '+idx.indexed+'/'+idx.total+'편'+iDt+'.');
  }
  if(oNv>oTh) adv.push('OSMU 쓰레드 '+oTh+'/'+oNv+' — '+(oNv-oTh)+'편 미게시(rate-limit 보류분 재시도 필요).');
  if(oTh>oIn) adv.push('OSMU 인스타 '+oIn+'/'+oTh+' — 쓰레드 확산 대비 '+(oTh-oIn)+'편 미확산(카드뉴스 backlog).');
  if(collab&&collab.uncommitted>=10) adv.push('미커밋 '+collab.uncommitted+'파일 — 발행 완료 후 세션별 커밋 분리 권장.');
  const adviceHtml=adv.length?'<div class="advice">'+adv.map(t=>'<div class="ai"><span class="ic">💡</span><span>'+esc(t)+'</span></div>').join('')+'</div>':'<div class="pcode none">현재 조치 필요 항목 없음</div>';
  // 📋 미결 관리 — 글별(pending.json: DB osmu + index_status에서 계산)
  const pc=(pend&&pend.counts)||{};
  const cb=(ok,l)=>'<span class="ch '+(ok?'on':'off')+'">'+l+(ok?'✓':'✗')+'</span>';
  const pendRows=(pend&&pend.actionable||[]).map(a=>{
    const c=a.ch||{};
    return '<div class="prow"><span class="pcd">'+esc(a.code)+'</span><span class="ptt">'+esc(a.title)+'</span>'
    +cb(c.g!==false,'G')+cb(c.n,'N')+cb(c.t,'T')+cb((osmuByCode[a.code]||{}).instagram,'I')+'</div>';
  }).join('');
  // 표시는 상위 14편으로 잘려 있음(pending.py) → 남은 수는 counts로 계산해 "…외 N편"
  const pendListed=(pend&&pend.actionable||[]).length;
  const pendTotal=Math.max(pc.osmu_pending||0,pc.index_pending||0);
  const pendMore=pendTotal>pendListed?'<div class="cnt">…외 '+(pendTotal-pendListed)+'편</div>':'';
  const pendHtml='<div class="cnt">OSMU 대기 '+(pc.osmu_pending||0)+'편 · 색인 대기 '+(pc.index_pending||0)+'편 / 전체 '+(pc.total||0)+'편</div>'+(pendRows||'<div class="pcode none">미결 없음</div>')+pendMore;
  // 📋 발행 대기 (발행 전 큐 — queue.json) : 코드·제목·썸네일을 한 카드로 묶어 '엉뚱한 글/썸네일' 눈으로 차단
  const qItems=(queue&&queue.items)||[];
  const laneLab={info:'정보성',pop:'대중관심'};
  const qCards=qItems.map(it=>{
    const th=it.thumb_data
      ?'<img class="qth" src="'+it.thumb_data+'" alt="">'
      :'<div class="qth none">썸네일<br>없음</div>';
    const facts=it.facts?'<div class="qfacts">'+esc(it.facts)+'</div>':'';
    const draft=it.draft?'<span class="qdraft">📄 '+esc(it.draft)+'</span>':'';
    const pv=it.body?'<button class="qpv" onclick="qpv(\''+esc(it.code||'')+'\')">👁 본문 미리보기</button>'
                    :'<span class="qpv none">초안 없음(작성 전)</span>';
    return '<div class="qcard">'+th
      +'<div class="qbody"><div class="qtop"><span class="qcode">'+esc(it.code||'')+'</span>'
      +'<span class="qlane '+(it.lane||'info')+'">'+esc(laneLab[it.lane]||it.lane||'')+'</span></div>'
      +'<div class="qtitle">'+esc(it.title||'')+'</div>'+facts
      +'<div class="qmeta">'+pv+draft+'</div></div></div>';
  }).join('');
  const qHtml=qItems.length
    ?'<div class="cnt">발행 대기 '+qItems.length+'건 — 발행하면 카드가 자동으로 사라집니다(사람 승인 게이트)</div>'+qCards
    :'<div class="pcode none">발행 대기 없음 — PREP 루틴이 준비하면 여기 카드로 뜹니다</div>';
  document.getElementById('board').innerHTML=
   '<div class="hd"><div class="t"><h1>진행현황</h1><span class="date">'+esc(date)+'</span></div>'
   +'<span class="badge '+bcls+'">'+CHECK+esc(blab)+'</span></div>'
   +'<div class="sec">오늘 한 일</div>'+today
   +'<div class="metrics">'
   +'<div class="m"><div class="l">검사 통과</div><div class="v">'+pass+' <small>/ '+total+'</small></div></div>'
   +'<div class="m"><div class="l">블로그 글</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">평균 본문</div><div class="v">'+avg+' <small>자</small></div></div>'
   +'</div>'
   +'<div class="div"></div>'
   +'<div class="sec">📋 발행 대기 (오늘 발행할 글)<span class="auto">🤖 PREP 큐</span></div>'+qHtml
   +'<div class="div"></div>'
   +'<div class="sec">발행 진행 (글 1편 · '+STEPS.length+'단계, 확산 포함)<span class="auto">🤖 자동</span></div>'+pubHtml
   +'<div class="div"></div>'
   +'<div class="sec">📡 4채널 발행 현황 (구글·네이버·쓰레드·인스타)<span class="auto">🤖 DB 자동집계</span></div>'
   +'<div class="metrics">'
   +'<div class="m"><div class="l">구글(원본)</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">네이버</div><div class="v">'+oNv+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">쓰레드</div><div class="v">'+oTh+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">인스타</div><div class="v">'+oIn+' <small>편</small></div></div>'
   +'</div>'
   +'<div class="cnt">확산 커버리지 · 네이버 '+(count?Math.round(oNv/count*100):0)+'% · 쓰레드 '+(count?Math.round(oTh/count*100):0)+'% · 인스타 '+(count?Math.round(oIn/count*100):0)+'% · 교차링크 완료 '+omAll.length+'편</div>'
   +osmuLi
   +'<div class="div"></div>'
   +'<div class="sec">🤝 협업 — 세션별 역할·진행<span class="auto">git 자동분류</span></div>'+collabHtml
   +'<div class="sec">💡 시스템 조언<span class="auto">라이브 도출</span></div>'+adviceHtml
   +'<div class="div"></div>'
   +'<div class="sec">📋 미결 관리 — 4채널 매칭<span class="auto">G구글·N네이버·T쓰레드·I인스타</span></div>'+pendHtml
   +'<div class="sec">다음</div><div class="next">'+next+'</div>'
   +'<div class="upd" id="upd"></div>';
  tick();
}
// 시계·데이터 기준만 갱신(보드 전체 재렌더 없음 — 정적 베이크 데이터라 시계만 변함)
function tick(){
  const el=document.getElementById('upd'); if(!el)return;
  const b=(window.__DATA__||{}).baked_at;
  el.textContent=(b?'데이터 기준 '+b+' · ':'')+new Date().toLocaleTimeString('ko-KR');
}
// 👁 발행 대기 카드 본문 미리보기 — 초안 HTML을 격리 iframe(srcdoc)로 렌더(스타일 누수 차단, Blogger 미접촉)
function qpv(code){
  const items=((window.__DATA__||{}).queue||{}).items||[];
  const it=items.find(x=>x.code===code); if(!it||!it.body)return;
  document.getElementById('qpv-ttl').textContent=(it.code||'')+' · '+(it.title||'');
  document.getElementById('qpv-fr').srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank"><body style="margin:0;padding:16px;background:#fff">'+it.body+'</body>';
  document.getElementById('qpv-ov').classList.add('show');
}
function qpvClose(){document.getElementById('qpv-ov').classList.remove('show');document.getElementById('qpv-fr').srcdoc='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')qpvClose();});
// 코드 자동 반영: 자기 자신(progress.html)을 주기적으로 fetch→해시 비교, 바뀌면 1회 reload
const _hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
let _selfHash=null;
async function checkVersion(){
  try{
    const r=await fetch('progress.html?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;                                // 일시적 404/500에 해시 오염 → 불필요 reload 방지
    const t=await r.text();
    const h=_hash(t);
    if(_selfHash===null){_selfHash=h;return;}      // 첫 호출=기준선 저장
    if(h!==_selfHash) location.reload();            // 코드 변경 감지 → 자동 새로고침
  }catch(e){}
}
load(); checkVersion(); setInterval(tick,5000); setInterval(checkVersion,5000);
</script>
