<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<title>진행현황 — 생활정보 모음</title>
<style>
:root{--bg:#0e1620;--card:#18222e;--card2:#13202d;--line:#26323f;--txt:#e6edf3;--mut:#8a97a6;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:470px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:16px;font-weight:600}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(63,185,80,.16);color:var(--ok)}
.b-warn{background:rgba(210,153,34,.16);color:var(--warn)}
.b-bad{background:rgba(248,81,73,.16);color:var(--bad)}
.sec{font-size:11px;color:var(--mut);letter-spacing:.05em;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
.metrics{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 2px}
/* 채널이 4개가 되어 490px 팝업에서 눌리므로, 좁아지면 2x2로 감싸게 한다 */
.m{flex:1 1 96px;background:var(--card2);border-radius:9px;padding:8px 10px}
.m .l{font-size:11px;color:var(--mut)}
.m .v{font-size:18px;font-weight:600;margin-top:2px}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #243049;font-size:12.5px}
li:last-child{border-bottom:none}
li.on{opacity:.62}
li.on .lbl{text-decoration:line-through}
li svg{width:15px;height:15px;flex:none}
li.on svg{color:var(--ok)}
li.now svg{color:#7fc1ff}
li.wait svg{color:#4a586e}
.num{font-size:11px;color:#6b7a99;width:16px;text-align:right;flex:none}
.who{font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px;flex:none}
.who.ai{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.who.me{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.lbl{font-size:12.5px}
.star{color:#ff8e8e;font-weight:800;margin-left:2px}
.banner{display:none;margin-top:9px;background:#0c3a2c;border:1px solid #1f6b52;color:#06d6a0;border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12.5px}
.banner.show{display:block}
.upd{font-size:11px;color:var(--mut);text-align:right;margin-top:12px}
.agent{background:var(--card2);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.agent .ah{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.agent .st{font-size:10px;font-weight:700;padding:1px 7px;border-radius:7px;margin-left:auto}
.st.active{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.st.uncommitted{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.st.idle{background:#222c3a;color:#6b7a99;border:1px solid #2e3a4a}
.agent .role{font-size:11px;color:var(--mut);margin:3px 0 1px}
.agent .own{font-size:10.5px;color:#5a6b80}
.agent .act{font-size:11px;color:#aeb9c7;margin-top:4px;padding-left:7px;border-left:2px solid #2a3a4d;line-height:1.5}
.agent .act .d{color:var(--mut);font-size:10px}
.advice{background:#13202d;border:1px solid #2a3a4d;border-radius:9px}
.advice .ai{display:flex;gap:8px;padding:7px 11px;font-size:12px;line-height:1.5;border-bottom:1px dashed #243049}
.advice .ai:last-child{border-bottom:none}
.advice .ic{flex:none}
.prow{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px dashed #243049;font-size:11.5px}
.prow:last-child{border-bottom:none}
.pcd{color:#7fc1ff;font-weight:700;flex:none;width:46px}
.ptt{flex:1;color:#cdd6e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{background:#3a2f12;color:#ffd166;border-radius:5px;padding:0 5px;font-size:9.5px;flex:none}
.pact{color:#06d6a0;font-size:10px;flex:none;font-weight:700}
.qcard{display:flex;gap:9px;padding:8px;margin:6px 0;background:#141c2c;border:1px solid #243049;border-radius:9px}
.qth{width:78px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:#0d1420}
.qth.none{display:flex;align-items:center;justify-content:center;color:#54627a;font-size:9px;text-align:center;line-height:1.2;border:1px dashed #2a3752}
.qbody{flex:1;min-width:0}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qcode{color:#7fc1ff;font-weight:700;font-size:11.5px}
.qlane{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700}
.qlane.info{background:#12283a;color:#7fc1ff}
.qlane.pop{background:#2f2136;color:#e0a3ff}
.qtitle{color:#e6edf5;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qfacts{color:#8a95a6;font-size:10px;margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qmeta{margin-top:4px}
.qdraft{color:#6b7688;font-size:9.5px;margin-left:8px}
.qpv{background:#17324a;color:#7fc1ff;border:1px solid #2a4d6e;border-radius:6px;font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer}
.qpv:hover{background:#1d4463}
.qpv.none{background:none;border:none;color:#54627a;font-weight:400;cursor:default;padding:3px 0}
#qpv-ov{display:none;position:fixed;inset:0;background:rgba(6,10,18,.82);z-index:999;align-items:center;justify-content:center;padding:18px}
#qpv-ov.show{display:flex}
.qpv-box{width:100%;max-width:760px;height:88vh;display:flex;flex-direction:column;background:#0f1626;border:1px solid #2a3752;border-radius:12px;overflow:hidden}
.qpv-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #243049;font-size:12.5px;font-weight:700;color:#7fc1ff}
.qpv-hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpv-x{background:#243049;color:#cdd6e0;border:none;border-radius:6px;font-size:11px;padding:5px 11px;cursor:pointer;flex:none}
.qpv-x:hover{background:#324158}
.qpv-fr,#qpv-fr{flex:1;width:100%;border:0;background:#fff}
.qpv-ft{padding:8px 14px;border-top:1px solid #243049;font-size:10px;color:#8a95a6;text-align:center}
.ch{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 4px;flex:none;margin-left:3px}
.ch.on{background:#0c3a2c;color:#06d6a0}
.ch.off{background:#3a1216;color:#f0707a}
</style>
</head>

#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#8a97ab;text-decoration:none;margin:2px 0 6px}\n.lsg .warn{background:#fff4f2;border:1px solid #f6cfc6;border-radius:12px;padding:14px 18px;margin:14px 0}\n.lsg .warn b{display:block;font-size:15px;color:#c0442a;margin-bottom:6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>「한화와 함께하는 서울세계불꽃축제 2026」은 <b>2026년 9월 5일(토)<\/b> 여의도 한강공원에서 열립니다. 서울시 축제 정보에는 <b>9월 4일(금) 전야제, 9월 5일(토) 불꽃쇼<\/b>로 등록돼 있고 장소는 <b>여의도 및 이촌 한강공원<\/b>입니다. 공식 안내에서 <b>티켓 구매를 요구하는 구역은 노들섬 한 곳뿐<\/b>입니다.<\/p>\n<p>그런데 올해는 <b>노들섬이 통째로 유료 구역<\/b>이 됐습니다. 공식 공지는 \"올해 노들섬은 전체 구역이 '오렌지플레이 존'으로 단독 운영\"되며 <b>사전 티켓을 구매한 사람만 입장<\/b>할 수 있다고 못 박았습니다. 요금은 구역에 따라 <b>110,000원 ~ 220,000원<\/b>(1인)입니다. 노들섬을 무료 명당으로 알고 갔다가 되돌아 나오는 일이 올해 가장 많이 생길 대목입니다.<\/p>\n<p>대신 <b>초대 이벤트(골든티켓)<\/b>가 따로 있습니다. <b>총 400명에게 1인 2매<\/b>, 응모는 <b>8월 3일(월)부터 8월 23일(일)까지<\/b>입니다. 이 글은 공식 홈페이지·예매처·서울시 축제 정보를 직접 확인해 <b>구역별 요금, 유료존과 티켓 없는 구역의 차이, 골든티켓 응모 방법, 놓치기 쉬운 함정<\/b>을 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 날짜·장소 먼저 (9월 5일 토요일)<\/a><a href=\"#sec2\">2. 올해 달라진 것 — 노들섬 전 구역 유료<\/a><a href=\"#sec3\">3. 구역별 요금과 우리 가족 총액 계산<\/a><a href=\"#sec4\">4. 골든티켓 초대 이벤트 400명 (8월 23일 마감)<\/a><a href=\"#sec5\">5. 티켓 없이 보는 법 — 한강공원과 유료존의 차이<\/a><a href=\"#sec6\">6. 예매 전 놓치기 쉬운 7가지<\/a><a href=\"#sec7\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec3\">👉 우리 가족은 얼마인지 먼저 계산해 보기<\/a>\n\n<h2 id=\"sec1\">1. 날짜·장소 먼저 (9월 5일 토요일)<\/h2>\n<p>공식 홈페이지와 서울시 축제 정보에 등록된 내용을 그대로 정리하면 다음과 같습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>내용<\/th><\/tr>\n<tr><td>공식 명칭<\/td><td>한화와 함께하는 서울세계불꽃축제 2026<\/td><\/tr>\n<tr><td>불꽃쇼<\/td><td><b>2026년 9월 5일(토)<\/b><\/td><\/tr>\n<tr><td>전야제<\/td><td>2026년 9월 4일(금) <span style=\"font-size:13px\">(서울시 축제 정보 기준)<\/span><\/td><\/tr>\n<tr><td>장소<\/td><td>여의도 및 이촌 <b>한강공원<\/b><\/td><\/tr>\n<tr><td>주최<\/td><td>한화그룹 (2000년부터 사회공헌 사업으로 개최)<\/td><\/tr>\n<tr><td>연출팀<\/td><td><b>한국·영국·미국<\/b> 3개국 참여<\/td><\/tr>\n<tr><td>문의<\/td><td>불꽃축제 운영사무국 02-519-9778<\/td><\/tr>\n<\/table><\/div>\n<p>한강공원 관람은 <b>티켓이 필요 없습니다.<\/b> 유료 티켓이 필요한 곳은 아래에서 설명할 <b>노들섬 한 곳<\/b>입니다.<\/p>\n<p>당일 <b>교통 통제·주차장 폐쇄·지하철 무정차 통과<\/b> 여부는 해마다 행사 직전에 서울시·경찰이 따로 발표합니다. 2026년 분은 이 글을 쓰는 시점(2026년 8월 6일)까지 공식 발표가 없어 여기에 적지 않았습니다. 예년 사례를 그대로 옮기면 틀릴 수 있으니, 출발 전 공식 홈페이지의 '행사장 안내'와 서울시 발표를 확인하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 올해 달라진 것 — 노들섬 전 구역 유료<\/h2>\n<p>가장 중요한 변화입니다. 공식 공지 원문은 이렇습니다.<\/p>\n<div class=\"warn\"><b>🚫 노들섬은 티켓 없이 들어갈 수 없습니다<\/b>\n<p style=\"margin:6px 0 0\">\"올해 노들섬은 전체 구역이 '오렌지플레이 존'으로 단독 운영됩니다. 이에 따라 <b>사전 티켓을 구매하신 분들에 한하여 입장이 가능<\/b>하오니…\" — 서울세계불꽃축제 공식 공지<\/p><\/div>\n<p>노들섬 오렌지플레이존의 운영 내용은 다음과 같습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>내용<\/th><\/tr>\n<tr><td>장소<\/td><td>노들섬 (전 구역 유료)<\/td><\/tr>\n<tr><td>운영 시작<\/td><td>2026년 9월 5일(토) <b>13:00 ~<\/b><\/td><\/tr>\n<tr><td>티켓 판매 기간<\/td><td>2026년 8월 3일(월) ~ <b>소진 시까지<\/b><\/td><\/tr>\n<tr><td>구매 제한<\/td><td><b>1인 최대 5매<\/b><\/td><\/tr>\n<tr><td>구입처<\/td><td>오렌지플레이 앱 / 오렌지플레이 티켓<\/td><\/tr>\n<tr><td>티켓 수령<\/td><td><b>현장 수령<\/b> (배송 없음)<\/td><\/tr>\n<tr><td>관람 등급<\/td><td>전체 관람가<\/td><\/tr>\n<\/table><\/div>\n<p>유료존에서는 무대 공연·레크리에이션 이벤트, AR로 즐기는 불꽃놀이, 불꽃 캔들·스트랩 만들기, 불꽃축제 사진 전시, F&amp;B가 함께 운영되고 <b>입장 시 선물<\/b>도 제공된다고 공지에 적혀 있습니다. 낮 1시부터 여니 <b>기다리는 시간 자체를 프로그램으로 채우는 구성<\/b>입니다.<\/p>\n<div class=\"warn\"><b>⚠️ 돈을 냈다고 정면 명당은 아닙니다 — 공식 문구를 그대로 옮깁니다<\/b>\n<p style=\"margin:6px 0 0\">\"노들섬 오렌지플레이존은 <b>메인 불꽃 연출 정면 구역과 거리가 있으며, 일부 시야가 제한될 수 있습니다.<\/b>\"<\/p>\n<p style=\"margin:8px 0 0\">즉 노들섬 티켓의 값어치는 <b>'가장 잘 보이는 자리'가 아니라 '자리 확보와 혼잡 회피, 부대 프로그램'<\/b>에 있습니다. 정면 시야를 원한다면 여의도 쪽이 낫습니다. 이 점을 모르고 예매하면 가장 크게 실망합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 구역별 요금과 우리 가족 총액 계산<\/h2>\n<p>예매처에 표기된 구역별 요금입니다(1인 기준).<\/p>\n<div class=\"tw\"><table>\n<tr><th>구역<\/th><th>1인 요금<\/th><th>2인(부부)<\/th><th>4인 가족<\/th><\/tr>\n<tr><td>1구역<\/td><td><b>110,000원<\/b><\/td><td>220,000원<\/td><td>440,000원<\/td><\/tr>\n<tr><td>2구역<\/td><td>165,000원<\/td><td>330,000원<\/td><td>660,000원<\/td><\/tr>\n<tr><td>3구역<\/td><td>165,000원<\/td><td>330,000원<\/td><td>660,000원<\/td><\/tr>\n<tr><td>4구역<\/td><td><b>220,000원<\/b><\/td><td>440,000원<\/td><td>880,000원<\/td><\/tr>\n<\/table><\/div>\n<p><b>계산 예시 — 4인 가족이 노들섬에서 볼 경우<\/b><\/p>\n<ul>\n<li>가장 싼 1구역: 110,000원 × 4명 = <b>440,000원<\/b><\/li>\n<li>가장 비싼 4구역: 220,000원 × 4명 = <b>880,000원<\/b><\/li>\n<li>→ 구역 선택만으로 <b>44만 원 차이<\/b>가 납니다. 여기에 교통비·식비는 별도입니다.<\/li>\n<\/ul>\n<p><b>구매 제한이 1인 5매<\/b>이므로 4인 가족은 <b>한 사람이 한 번에 결제<\/b>할 수 있습니다. 6명 이상 단체라면 두 사람으로 나눠 결제해야 하고, 이때 <b>같은 구역이 남아 있는지 먼저 확인<\/b>해야 일행이 갈라지지 않습니다.<\/p>\n<p>2구역과 3구역은 요금이 <b>165,000원으로 같습니다.<\/b> 값이 같다면 남은 판단 기준은 무대·불꽃 방향과 동선뿐이므로, 예매 화면의 <b>구역 미리보기(구역도)<\/b>를 반드시 열어 보고 고르세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 골든티켓 초대 이벤트 400명 (8월 23일 마감)<\/h2>\n<p>주최 측이 별도로 진행하는 <b>초대 이벤트<\/b>입니다. 유료 티켓과 완전히 별개이고, <b>응모 창구가 공식 홈페이지가 아니라 앱<\/b>이라는 점이 함정입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>내용<\/th><\/tr>\n<tr><td>응모 기간<\/td><td>2026년 <b>8월 3일(월) ~ 8월 23일(일)<\/b><\/td><\/tr>\n<tr><td>당첨 발표<\/td><td>2026년 <b>8월 24일(월)<\/b><\/td><\/tr>\n<tr><td>당첨 인원<\/td><td><b>총 400명 (1인 2매)<\/b><\/td><\/tr>\n<tr><td>응모 창구<\/td><td><b>PLUS TRIBES 앱<\/b> (공식 홈페이지의 '골든티켓 이벤트' 버튼 → 앱 설치·가입 → 이벤트 배너)<\/td><\/tr>\n<tr><td>참여 방법<\/td><td>① 참여하기를 눌러 질문에 답변 제출 ② 불꽃축제 관련 아티클을 읽고 좋아요를 누르면 당첨 확률 상승<\/td><\/tr>\n<tr><td>당첨 안내<\/td><td>공식 홈페이지 공지 + 앱 푸시 + 등록된 휴대폰 MMS<\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 미당첨자에게는 연락이 가지 않습니다<\/b>\n<p style=\"margin:6px 0 0\">공지에 명시된 내용입니다. <b>8월 24일(월)<\/b>에 아무 연락이 없으면 떨어진 것으로 보고 <b>유료 티켓이나 한강공원 관람으로 계획을 바꾸면 됩니다.<\/b> 연락을 기다리다 유료 티켓이 소진되는 것이 가장 아까운 경우입니다.<\/p><\/div>\n<p>배정 규모는 <b>400명 × 2매 = 800석<\/b>입니다. 유료 티켓 판매와 별개로 진행되므로 기대치는 낮게 잡되, 응모 자체는 <b>몇 분이면 끝나므로<\/b> 8월 23일 전에 한 번 넣어 두는 편이 낫습니다. 휴대폰 번호를 정확히 등록해 두는 것도 잊지 마세요 — 당첨 안내가 MMS로 갑니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 티켓 없이 보는 법 — 한강공원과 유료존의 차이<\/h2>\n<p>공식 안내가 사전 티켓을 요구하는 곳은 <b>노들섬뿐<\/b>이고, 여의도·이촌 한강공원 쪽에는 티켓 요건이 안내돼 있지 않습니다. 두 선택지가 무엇이 다른지 항목별로 비교하면 판단이 쉬워집니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>노들섬 오렌지플레이존<\/th><th>여의도·이촌 한강공원<\/th><\/tr>\n<tr><td>비용(1인)<\/td><td>110,000 ~ 220,000원<\/td><td><b>티켓 요건 안내 없음<\/b><\/td><\/tr>\n<tr><td>입장<\/td><td><b>사전 티켓 필수<\/b><\/td><td>별도 입장 티켓 안내 없음<\/td><\/tr>\n<tr><td>정면 시야<\/td><td>공식 안내상 <b>정면 아님·일부 제한<\/b><\/td><td>여의도 쪽이 메인 연출 방향<\/td><\/tr>\n<tr><td>자리 확보<\/td><td>티켓으로 확정<\/td><td>이른 시간부터 자리 잡기 필요<\/td><\/tr>\n<tr><td>인원<\/td><td>판매 수량만큼 제한<\/td><td>제한 없음<\/td><\/tr>\n<tr><td>부대 프로그램<\/td><td>공연·AR·만들기·전시·F&amp;B·입장 선물<\/td><td>없음<\/td><\/tr>\n<tr><td>시작 시간<\/td><td>13:00부터 입장<\/td><td>제한 없음(자리 경쟁은 이른 시간)<\/td><\/tr>\n<\/table><\/div>\n<p><b>판단은 한 줄로 정리됩니다.<\/b> \"정면에서 제일 잘 보고 싶다\"면 <b>여의도 한강공원<\/b>이고, \"자리 싸움과 인파를 피하고 낮부터 놀거리와 함께 편하게 있고 싶다\"면 <b>유료존<\/b>입니다. <b>돈을 더 낸다고 더 잘 보이는 구조가 아니라는 것<\/b>이 올해 이 축제의 핵심입니다.<\/p>\n<p>세 번째 선택지도 있습니다. 공식 홈페이지가 <b>온라인 생중계<\/b>를 안내하고 있어, 이동과 인파가 부담되면 <b>집에서 중계로 보는 방법<\/b>도 있습니다. 무릎이 안 좋은 부모님과 함께라면 현실적인 대안입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 예매 전 놓치기 쉬운 7가지<\/h2>\n<ol>\n<li><b>노들섬은 티켓 없이 들어갈 수 없습니다.<\/b> 예전 기억으로 돗자리를 들고 갔다가는 입구에서 되돌아 나오게 됩니다.<\/li>\n<li><b>유료존이 정면 명당이 아닙니다.<\/b> 공식 공지에 \"정면 구역과 거리가 있으며 일부 시야가 제한될 수 있다\"고 적혀 있습니다.<\/li>\n<li><b>티켓은 현장 수령입니다.<\/b> 배송이 없으므로 당일 수령 장소·시간을 예매 화면에서 확인하고 신분 확인 수단을 챙기세요.<\/li>\n<li><b>판매 종료일이 정해져 있지 않습니다.<\/b> \"소진 시까지\"이므로 마감일을 기다릴 이유가 없습니다.<\/li>\n<li><b>구매는 1인 5매까지.<\/b> 6명 이상은 나눠 결제해야 하고, 그 사이 같은 구역이 마감될 수 있습니다.<\/li>\n<li><b>골든티켓은 8월 23일(일) 마감, 발표는 8월 24일(월).<\/b> 응모는 공식 홈페이지가 아니라 <b>PLUS TRIBES 앱<\/b>에서만 됩니다.<\/li>\n<li><b>취소·환불 수수료는 예매 화면에서 직접 확인하세요.<\/b> 이 글에서는 예매처가 이미지로만 안내하고 있어 수치를 옮기지 않았습니다. 공연 티켓 일반 기준은 아래 관련 글에 정리해 두었습니다.<\/li>\n<\/ol>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b>\n<a href=\"https://www.hanwhafireworks.com/\" target=\"_blank\" rel=\"nofollow\">▸ 한화와 함께하는 서울세계불꽃축제 2026 공식 홈페이지 (공지·행사장 안내·생중계)<\/a>\n<a href=\"https://ticket.orange-play.co.kr/\" target=\"_blank\" rel=\"nofollow\">▸ 오렌지플레이 티켓 — 노들섬 오렌지플레이존 예매·구역 미리보기<\/a>\n<a href=\"https://festival.seoul.go.kr/festival/main/festivalView.do?festacode=379\" target=\"_blank\" rel=\"nofollow\">▸ 서울시 축제 정보 — 서울세계불꽃축제 일정·장소<\/a>\n<\/div>\n<div class=\"end\"><b>✅ 마무리<\/b>\n<p style=\"margin:8px 0 0\">올해 기억할 것은 세 가지입니다. <b>① 불꽃쇼는 9월 5일(토), 여의도·이촌 한강공원<\/b>, <b>② 노들섬은 전 구역이 유료로 바뀌어 티켓 없이 못 들어가고 요금은 11만~22만 원<\/b>, <b>③ 골든티켓 초대 이벤트는 8월 23일(일)까지 400명 응모<\/b>. 특히 노들섬 티켓은 \"정면 명당\"이 아니라 \"자리·편의\"를 사는 것이라는 점을 알고 결정하세요. 교통 통제와 수령 방법은 행사 직전 공지가 뜨므로 출발 전 공식 페이지를 한 번 더 확인하시기 바랍니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월 6일<\/b> 확인 기준이며, 요금·일정·판매 상황은 변동될 수 있습니다(티켓은 소진 시 판매 종료). 예매 전 공식 사이트에서 확인하세요.<br>출처: <a href=\"https://www.hanwhafireworks.com/\" target=\"_blank\" rel=\"nofollow\">서울세계불꽃축제 2026 공식 홈페이지 공지<\/a> · <a href=\"https://ticket.orange-play.co.kr/\" target=\"_blank\" rel=\"nofollow\">오렌지플레이 티켓 판매 페이지<\/a> · <a href=\"https://festival.seoul.go.kr/festival/main/festivalView.do?festacode=379\" target=\"_blank\" rel=\"nofollow\">서울시 축제 정보<\/a><\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b>\n<a href=\"https://lifeinfo8975.blogspot.com/2026/07/blog-post_04.html\">▸ 공연 티켓 취소 환불 수수료 기준 총정리<\/a>\n<a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_890.html\">▸ 전국 지역축제 일정 찾는 방법 계절별 가이드 총정리<\/a>\n<a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01107282077.html\">▸ 콘서트 암표 방지법 시행 정가 예매 취소표 신고 방법 총정리<\/a>\n<\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top > 다룹니다. 신청 자격·소득 요건·가구별 지급액은 <a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_152.html\">근로장려금 신청 자격 금액 지급일 총정리<\/a>에 정리해 두었으니 그쪽을 먼저 보시고, 여기서는 <b>정기신청과의 갈림길 · 9월 창 · 35% 선지급 · 12월 입금 · 이듬해 정산과 환수<\/b>만 끝까지 파고듭니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 반기신청 vs 5월 정기신청 — 나는 어느 쪽인가<\/a><a href=\"#sec2\">2. 9월 1~15일, 어떻게 신청하나 (홈택스·손택스·ARS)<\/a><a href=\"#sec3\">3. 12월 30일 입금 → 2027년 6월 정산까지 (계산 예시)<\/a><a href=\"#sec4\">4. 놓치기 쉬운 함정 5가지<\/a><a href=\"#sec5\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec3\">👉 35% 선지급·정산 구조 먼저 보기<\/a>\n\n<h2 id=\"sec1\">1. 반기신청 vs 5월 정기신청 — 나는 어느 쪽인가<\/h2>\n<p>먼저 정리할 것은 <b>선택이 아니라 자격<\/b>이라는 점입니다. 반기신청은 아무나 고르는 게 아닙니다.<\/p>\n<p>국세청 안내 원문은 이렇습니다. 반기신청은 <b>\"2026년에 신청자나 그 배우자가 근로소득만 있는 거주자에 한함(사업소득 있는 경우 제외)\"<\/b>. 즉 프리랜서 수입·사업자등록 소득·인적용역 3.3% 소득이 섞여 있으면 반기신청 대상이 아닙니다.<\/p>\n<p>그리고 중요한 것 하나 — 사업소득이 섞여 있는 사람이 실수로 반기신청을 해도 신청이 사라지는 게 아니라 <b>\"5월 정기신청한 것으로 보아 '27년 9월에 정산·지급\"<\/b>됩니다. 신청은 살아남되 <b>돈 받는 시점이 9개월 뒤로 밀린다<\/b>는 뜻입니다.<\/p>\n\n<h3>한눈에 비교<\/h3>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>반기신청(상반기분)<\/th><th>5월 정기신청<\/th><\/tr>\n<tr><td>신청 기간<\/td><td><b>2026.9.1.~9.15.<\/b><br>(하반기분 2027.3.1.~3.15.)<\/td><td>2026.5.1.~6.1.<\/td><\/tr>\n<tr><td>대상<\/td><td>근로소득만 있는 거주자<br>(사업소득 있으면 제외)<\/td><td>제한 없음<br>(근로·사업·종교인)<\/td><\/tr>\n<tr><td>기준 소득<\/td><td>당해연도(2026년) 소득<\/td><td>전년도(2025년) 소득<\/td><\/tr>\n<tr><td>첫 입금<\/td><td><b>2026.12.30.까지<\/b><\/td><td>정기신청 지급기한에 따름<\/td><\/tr>\n<tr><td>첫 입금액<\/td><td><b>연간산정액의 35%<\/b><\/td><td>결정액 전액<\/td><\/tr>\n<tr><td>정산<\/td><td><b>있음<\/b> — 2027.6.30. 하반기분에서<br>차액 지급 또는 환수<\/td><td>없음<\/td><\/tr>\n<\/table><\/div>\n\n<div class=\"box\"><b>🧭 나는 어느 쪽? 3초 판단<\/b>\n<ul>\n<li><b>2026년 수입이 월급뿐<\/b>이고, 돈을 <b>6개월 일찍<\/b> 받고 싶다 → <b>반기신청<\/b>(9월 1~15일)<\/li>\n<li>2026년에 <b>프리랜서·사업 수입이 조금이라도<\/b> 있다 → 반기신청 대상이 아님. <b>2027년 5월 정기신청<\/b><\/li>\n<li>2026년 <b>소득이 크게 오르내릴 예정<\/b>(이직·퇴사·성과급·중도 입사) → 반기신청을 하면 정산 때 <b>환수<\/b>가 생길 수 있음. 3번 항목을 꼭 읽고 결정<\/li>\n<li>이미 <b>상반기분을 신청<\/b>했다 → 국세청 안내상 <b>\"상반기 근로장려금을 신청한 경우에는 하반기에도 신청한 것으로 봅니다\"<\/b>. 2027년 3월에 다시 누를 필요 없음<\/li>\n<\/ul><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 9월 1~15일, 어떻게 신청하나 (홈택스·손택스·ARS)<\/h2>\n<p>국세청은 대상자에게 안내문(카카오톡·문자·우편)을 보냅니다. 하지만 <b>안내문이 안 왔다고 신청을 못 하는 것은 아닙니다.<\/b> 요건에 맞으면 직접 신청할 수 있습니다.<\/p>\n\n<h3>안내문을 받은 경우 — 가장 빠른 순서<\/h3>\n<ol>\n<li>모바일 안내문의 <b>QR코드<\/b>를 스캔하거나, 안내문에 적힌 개별인증번호로 접속<\/li>\n<li>주민등록번호·계좌번호 확인 → 신청 완료(대개 2~3분)<\/li>\n<li><b>ARS 1544-9944<\/b>로도 가능 — 안내문의 개별인증번호를 누르는 방식<\/li>\n<\/ol>\n\n<h3>안내문이 없는 경우 — 직접 신청<\/h3>\n<ol>\n<li><b>홈택스<\/b>(www.hometax.go.kr) 로그인 → [장려금·연말정산·전자기부금] → <b>[근로장려금 반기신청]<\/b><\/li>\n<li>스마트폰이면 <b>손택스<\/b> 앱에서 같은 메뉴<\/li>\n<li>가구원·소득·재산 정보 확인 → <b>본인 명의 계좌<\/b> 입력 → 신청<\/li>\n<li>신청 후 같은 메뉴의 <b>[심사진행상황 조회]<\/b>에서 접수·심사 상태 확인<\/li>\n<\/ol>\n\n<div class=\"warn\"><b>⏰ 9월 15일을 넘기면 5%가 사라집니다<\/b>\n<p style=\"margin:8px 0 0\">국세청 안내 원문: <b>\"기한 후 신청한 경우 해당 장려금의 95% 지급\"<\/b>. 즉 하루만 늦어도 받을 돈의 <b>5%가 깎입니다.<\/b> 100만 원이면 5만 원, 200만 원이면 10만 원입니다. 9월 15일은 <b>말일이 아니라 중순<\/b>이라 특히 잘 놓칩니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 12월 30일 입금 → 2027년 6월 정산까지 (계산 예시)<\/h2>\n<p>반기신청의 핵심이자, 대부분의 민원이 나오는 지점입니다. 국세청 '심사 및 지급' 안내 원문 기준으로 구조는 이렇습니다.<\/p>\n\n<div class=\"tw\"><table>\n<tr><th>회차<\/th><th>신청<\/th><th>지급기한<\/th><th>지급액 계산<\/th><\/tr>\n<tr><td>상반기분<\/td><td>2026.9.1.~9.15.<\/td><td><b>2026.12.30.<\/b><\/td><td><b>연간산정액 × 35%<\/b><\/td><\/tr>\n<tr><td>하반기분<br>(정산)<\/td><td>2027.3.1.~3.15.<br>(상반기 신청자는 자동)<\/td><td><b>2027.6.30.<\/b><\/td><td><b>연간산정액 − 상반기 기지급액<\/b><\/td><\/tr>\n<\/table><\/div>\n\n<h3>계산 예시 — 연간산정액 100만 원으로 가정<\/h3>\n<p>※ 아래 100만 원은 설명을 위한 <b>가정치<\/b>입니다. 실제 산정액은 가구 유형·총급여에 따라 달라지므로, 본인 금액은 <a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_152.html\">근로장려금 자격·지급액 글<\/a>과 홈택스 계산기에서 확인하세요. 여기서 봐야 할 것은 <b>금액이 아니라 흐름<\/b>입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>2027년 6월, 확정된 연간산정액<\/th><th>상반기 기지급(35%)<\/th><th>하반기 정산액<\/th><th>결과<\/th><\/tr>\n<tr><td>120만 원 (소득이 예상보다 유리)<\/td><td>35만 원<\/td><td>120 − 35 = <b>85만 원<\/b><\/td><td>추가 입금<\/td><\/tr>\n<tr><td>100만 원 (예상대로)<\/td><td>35만 원<\/td><td>100 − 35 = <b>65만 원<\/b><\/td><td>추가 입금<\/td><\/tr>\n<tr><td>20만 원 (하반기 소득 급증 등)<\/td><td>35만 원<\/td><td>20 − 35 = <b>−15만 원<\/b><\/td><td><b>15만 원 환수<\/b><\/td><\/tr>\n<tr><td>0원 (재산 2.4억 초과 등 요건 탈락)<\/td><td>35만 원<\/td><td>0 − 35 = <b>−35만 원<\/b><\/td><td><b>35만 원 전액 환수<\/b><\/td><\/tr>\n<\/table><\/div>\n\n<div class=\"warn\"><b>⚠️ 환수는 '드문 사고'가 아니라 설계된 경우의 수입니다<\/b>\n<p style=\"margin:8px 0 0\">국세상담센터 답변 원문: <b>\"다음해 정산 시 부부합산 연간 총소득 또는 재산가액이 변동되는 경우 환수가 발생할 수 있습니다.\"<\/b> 상반기분은 상반기까지의 상황으로 <b>미리<\/b> 계산해 주는 돈이기 때문에, 하반기에 <b>급여가 오르거나 배우자가 취업하거나 재산이 늘면<\/b> 정산에서 되돌려줘야 합니다.<\/p>\n<p style=\"margin:8px 0 0\">그리고 국세청 '심사 및 지급' 안내에는 <b>\"이미 지급한 장려금이 환수되는 경우 가산세 부과(1일 22/100,000)\"<\/b>라고 적혀 있습니다. 하루 10만분의 22, 즉 <b>연 8%대<\/b>에 해당하는 비율입니다. 15만 원을 100일간 환수 대상으로 보유했다고 가정하면 <b>150,000 × 0.00022 × 100일 ≈ 3,300원<\/b>이 붙는 계산입니다. 실제 부과 여부·기간·금액은 국세청이 보내는 <b>결정통지서<\/b>에 적힌 내용을 따릅니다.<\/p><\/div>\n\n<div class=\"box\"><b>💡 자녀장려금이 있는 가구는 12월에 안 들어옵니다<\/b>\n<p style=\"margin:8px 0 0\">국세청 안내 원문: <b>\"상반기분 지급시엔 근로장려금만 지급하고, 자녀장려금도 해당될 경우 하반기분 정산 시 함께 지급합니다.\"<\/b> 12월에 자녀장려금이 안 들어왔다고 누락이 아니라, <b>2027년 6월에 합산해서<\/b> 나옵니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 놓치기 쉬운 함정 5가지<\/h2>\n<ul>\n<li><b>① \"9월 말까지겠지\" — 아닙니다. 9월 15일입니다.<\/b> 정기신청이 5월 1일~6월 1일로 한 달인 것과 달리 반기신청은 <b>15일<\/b>뿐입니다. 넘기면 95%만 지급됩니다.<\/li>\n<li><b>② 신청 자격의 기준 연도가 섞여 있습니다.<\/b> 국세청 안내상 반기신청은 <b>\"2026년에 근로소득만\"<\/b> 있어야 하지만, 소득·재산 요건은 <b>\"2025년 부부합산 총소득이 기준금액 미만\"<\/b>, <b>\"2025.6.1. 기준 가구원 모두의 재산 합계액이 2.4억원 미만\"<\/b>으로 안내됩니다. 작년에 집을 팔았거나 예금이 늘었다면 재산 기준일을 반드시 확인하세요.<\/li>\n<li><b>③ 3월에 또 신청해야 하는 줄 알고 기다립니다.<\/b> <b>\"상반기 근로장려금을 신청한 경우에는 하반기에도 신청한 것으로 봅니다.\"<\/b> 자동으로 넘어갑니다.<\/li>\n<li><b>④ 중간에 프리랜서 일을 시작하면 반기 대상에서 빠집니다.<\/b> 9월에 반기신청을 했더라도 2026년 중 사업소득이 생기면 <b>\"5월 정기신청한 것으로 보아 '27년 9월에 정산·지급\"<\/b>됩니다. 돈이 사라지지는 않지만 <b>9개월 늦게<\/b> 들어옵니다.<\/li>\n<li><b>⑤ 계좌를 바꿨는데 신고하지 않습니다.<\/b> 지급은 신청 때 적은 <b>본인 명의 계좌<\/b>로 들어갑니다. 12월 30일 지급 전에 홈택스에서 계좌를 확인해 두세요.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b>\n<a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=238977&amp;mi=40397\" target=\"_blank\" rel=\"nofollow\">▸ 국세청 — 근로·자녀장려금 신청기간 및 방법<\/a>\n<a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=2453&amp;cntntsId=7784\" target=\"_blank\" rel=\"nofollow\">▸ 국세청 — 근로·자녀장려금 심사 및 지급(지급기한·35%·환수 가산세)<\/a>\n<a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=2450&amp;cntntsId=7784\" target=\"_blank\" rel=\"nofollow\">▸ 국세청 — 근로장려금 소개(반기신청 대상·기한 후 95%)<\/a>\n<a href=\"https://www.hometax.go.kr\" target=\"_blank\" rel=\"nofollow\">▸ 국세청 홈택스 — 근로장려금 반기신청<\/a>\n<\/div>\n<p style=\"font-size:15px;color:#555;margin-top:10px\">전화 신청·상담: 국세청 장려금 상담센터 <b>1544-9944<\/b><\/p>\n\n<div class=\"end\"><b>✅ 마무리<\/b>\n<p style=\"margin:8px 0 0\">2026년 상반기분 근로장려금 반기신청은 <b>9월 1일부터 15일까지<\/b>입니다. 신청하면 <b>12월 30일까지 연간산정액의 35%<\/b>가 먼저 들어오고, 나머지는 <b>2027년 6월 30일<\/b> 정산에서 정해집니다. 하반기에 소득이나 재산이 늘면 <b>환수<\/b>가 생길 수 있다는 점, 15일을 넘기면 <b>95%만<\/b> 받는다는 점 두 가지만 기억하면 됩니다. 본인 산정액과 자격은 위 공식 페이지와 홈택스에서 꼭 확인하세요.<\/p><\/div>\n\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월<\/b> 기준이며, 변동될 수 있습니다. 신청 전 공식 사이트에서 확인하세요.<br>출처: <a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=238977&amp;mi=40397\">국세청 「근로·자녀장려금 : 신청기간 및 방법」<\/a> · <a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=2453&amp;cntntsId=7784\">국세청 「심사 및 지급」<\/a> · <a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=2450&amp;cntntsId=7784\">국세청 「근로장려금 소개」<\/a> · 국세상담센터 반기신청 Q&amp;A<br>※ 본문의 100만 원 계산 예시는 구조 설명을 위한 <b style=\"display:inline;color:#33503a;margin:0\">가정치<\/b>이며 실제 지급액이 아닙니다.<\/div>\n\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b>\n<a href=\"http isplay:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#8a97ab;text-decoration:none;margin:2px 0 6px}\n.lsg .warn{background:#fff4f2;border:1px solid #f6cfc6;border-radius:12px;padding:14px 18px;margin:14px 0}\n.lsg .warn b{display:block;font-size:15px;color:#c0442a;margin-bottom:6px}\n.lsg .tip{background:#f2f7ff;border:1px solid #cfe0f6;border-radius:12px;padding:14px 18px;margin:14px 0}\n.lsg .tip b{display:block;font-size:15px;color:#1b5fa8;margin-bottom:6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>자전거를 타는 분들 사이에서 <b>\"수첩 하나 사서 도장 찍고 다닌다\"<\/b>는 말을 들어 보셨을 겁니다. 국가가 운영하는 <b>국토종주 자전거길 인증제<\/b> 이야기입니다. 여권처럼 생긴 인증수첩에 자전거길 곳곳의 인증센터 도장을 모으면, 그 길을 끝까지 달렸다는 사실을 <b>공식적으로 인정<\/b>받습니다.<\/p>\n<p>문제는 <b>시작하는 방법이 의외로 안 알려져 있다<\/b>는 점입니다. 수첩을 어디서 얼마에 사는지, 도장은 누가 찍어 주는지, 앱으로도 되는지, 도장 하나를 빠뜨리면 어떻게 되는지 — 이 네 가지를 모른 채 출발했다가 <b>왕복 몇 시간을 다시 달려 도장 하나를 찍으러 가는<\/b> 일이 실제로 벌어집니다.<\/p>\n<p>이 글은 <b>자전거행복나눔(bike.go.kr) 공식 안내 페이지를 직접 확인해<\/b> 수첩 가격·인증센터 수·13개 자전거길 거리·사이버인증 방식·발급물 비용을 정리한 것입니다. <b>준비 비용은 다 합쳐 4,500원<\/b>이고, 가을 라이딩 시즌이 시작되는 지금이 <b>첫 도장을 찍기에 가장 좋은 때<\/b>입니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 인증제란 무엇인가 — 준비물은 4,500원짜리 수첩 한 권<\/a><a href=\"#sec2\">2. 13개 자전거길 거리표 — 총 1,857km<\/a><a href=\"#sec3\">3. 도장은 어디서 찍나 — 인증센터 세 종류<\/a><a href=\"#sec4\">4. 종이 스탬프 vs 앱 사이버인증, 어느 쪽이 나은가<\/a><a href=\"#sec5\">5. 인증 종류와 받는 것 — 인증서는 무료, 메달은 유상<\/a><a href=\"#sec6\">6. 어디부터 시작할까 — 거리로 고르는 첫 코스<\/a><a href=\"#sec7\">7. 놓치기 쉬운 7가지<\/a><a href=\"#sec8\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec1\">👉 4,500원으로 시작하는 방법부터 보기<\/a>\n\n<h2 id=\"sec1\">1. 인증제란 무엇인가 — 준비물은 4,500원짜리 수첩 한 권<\/h2>\n<p>공식 설명은 이렇습니다. <b>\"국토종주 자전거길을 달린 뿌듯함과 추억을 간직할 수 있도록 여권처럼 생긴 인증수첩에 주요지점의 스탬프를 모두 찍으면, 자전거길 종주 사실을 공식적으로 인정해 주는 것\"<\/b>입니다.<\/p>\n<p>가입비도, 신청서도, 심사도 없습니다. <b>수첩을 사는 것이 곧 참가 신청<\/b>입니다. 공식 안내에 표기된 비용은 다음 두 가지뿐입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>가격<\/th><th>비고<\/th><\/tr>\n<tr><td><b>인증수첩<\/b><\/td><td><b>4,000원<\/b><\/td><td>일련번호 스티커 부착 · 개인신상정보 기재<\/td><\/tr>\n<tr><td>비닐커버 및 안내지도<\/td><td>500원<\/td><td>선택<\/td><\/tr>\n<tr><td><b>합계<\/b><\/td><td><b>4,500원<\/b><\/td><td>—<\/td><\/tr>\n<\/table><\/div>\n<p><b>계산 예시 — 시작 비용은 정말 이게 전부인가?<\/b> 인증수첩 4,000원에 비닐커버·지도 500원을 더하면 <b>4,500원<\/b>입니다. 여기에 뒤에서 볼 <b>인증서·인증스티커·헬멧 스티커는 모두 무료<\/b>이므로, <b>메달을 사지 않는 한 추가 비용이 없습니다.<\/b> 자전거 관련 취미 중 진입 비용이 가장 낮은 축에 듭니다.<\/p>\n<div class=\"tip\"><b>💡 수첩은 한 권이면 됩니다<\/b>\n<p style=\"margin:6px 0 0\">공식 안내에 <b>\"1개의 수첩으로 수계종주, 4대강 종주, 국토종주 모두 이용가능 합니다.\"<\/b>라고 적혀 있습니다. 코스마다 따로 살 필요가 없다는 뜻입니다. 수첩에는 <b>13개 자전거길<\/b>(아라·한강·남한강·북한강·새재·낙동강·금강·영산강·섬진강·오천·동해안 강원·동해안 경북·제주)의 인증센터 칸이 이미 인쇄돼 있습니다.<\/p><\/div>\n<h3>어디서 사나<\/h3>\n<ul>\n<li><b>인증센터에서 직접<\/b> — 자전거길 위 인증센터에서 판매합니다. 출발지 인증센터에서 사면 바로 첫 도장을 찍을 수 있습니다.<\/li>\n<li><b>온라인<\/b> — <b>우리강 이용도우미(riverguide.go.kr)<\/b>에서 구매할 수 있습니다. '종주인증 수첩 및 기념품 구매' 메뉴에 <b>인증수첩·지도<\/b>와 <b>인증메달·메달 케이스<\/b>가 따로 있습니다.<\/li>\n<li><b>수첩판매소<\/b> — 인증센터와 별도로 <b>13개소<\/b>가 운영됩니다.<\/li>\n<\/ul>\n<p>분실이 걱정된다면 안심해도 됩니다. 수첩에는 <b>일련번호 스티커가 붙고 개인신상정보를 적게 돼 있어<\/b> 분실 시 보호받도록 설계돼 있습니다. 다만 <b>유효기간은 따로 없으므로<\/b> 몇 년에 걸쳐 천천히 채워도 됩니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 13개 자전거길 거리표 — 총 1,857km<\/h2>\n<p>첫 코스를 고르려면 거리부터 봐야 합니다. 공식 안내에 나온 구간과 거리를 그대로 옮기면 다음과 같습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>자전거길<\/th><th>구간<\/th><th>거리<\/th><\/tr>\n<tr><td><b>아라<\/b><\/td><td>아라서해갑문~아라한강갑문<\/td><td><b>21km<\/b><\/td><\/tr>\n<tr><td>북한강<\/td><td>밝은 광장~춘천 신매대교<\/td><td>70km<\/td><\/tr>\n<tr><td>동해안(경북)<\/td><td>울진 은어다리~영덕 해맞이공원<\/td><td>76km<\/td><\/tr>\n<tr><td>새재<\/td><td>충주탄금대~상주 상풍교<\/td><td>100km<\/td><\/tr>\n<tr><td>오천<\/td><td>행촌교차로~합강공원<\/td><td>105km<\/td><\/tr>\n<tr><td>영산강<\/td><td>담양댐~영산강 하구둑<\/td><td>133km<\/td><\/tr>\n<tr><td>금강<\/td><td>대청댐~금강 하구둑<\/td><td>146km<\/td><\/tr>\n<tr><td>섬진강<\/td><td>전북임실 생활체육공원~전남광양 배알도수변공원<\/td><td>149km<\/td><\/tr>\n<tr><td>한강종주<\/td><td>아라한강갑문~충주댐<\/td><td>192km<\/td><\/tr>\n<tr><td>제주환상<\/td><td>제주도 해안도로 일주<\/td><td>234km<\/td><\/tr>\n<tr><td>동해안(강원)<\/td><td>고성 통일전망대~삼척 고포마을<\/td><td>242km<\/td><\/tr>\n<tr><td><b>낙동강<\/b><\/td><td>상주 상풍교~낙동강 하구둑<\/td><td><b>389km<\/b><\/td><\/tr>\n<tr><td colspan=\"2\"><b>인증구간 총 길이<\/b><\/td><td><b>1,857km<\/b><\/td><\/tr>\n<\/table><\/div>\n<p>위 12개 구간의 거리를 더하면 <b>정확히 1,857km<\/b>로, 공식이 밝힌 인증구간 총 길이와 일치합니다. 수첩에는 <b>남한강이 별도 자전거길로 인쇄<\/b>돼 있지만, 거리표에서는 <b>한강종주(아라한강갑문~충주댐) 192km에 포함<\/b>돼 표기됩니다. <b>같은 길을 두 번 세는 것이 아니라 묶어서 표기한 것<\/b>이니 혼동하지 마세요.<\/p>\n<div class=\"tip\"><b>💡 거리로 감을 잡는 계산<\/b>\n<p style=\"margin:6px 0 0\">하루에 <b>80km<\/b>를 달린다고 가정하면 — <b>아라 21km는 반나절<\/b>, <b>제주환상 234km는 3일(하루 78km)<\/b>, <b>낙동강 389km는 5일<\/b>, <b>전 구간 1,857km는 약 24일<\/b>이 나옵니다. 하루 <b>50km<\/b>로 낮춰 잡으면 제주환상은 <b>5일<\/b>, 전 구간은 <b>약 37일<\/b>입니다. 연차를 며칠 낼 수 있는지부터 역산하면 코스가 저절로 정해집니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 도장은 어디서 찍나 — 인증센터 세 종류<\/h2>\n<p>가장 많이 오해하는 부분입니다. <b>도장은 직원이 찍어 주는 것이 아니라 내가 직접 찍습니다.<\/b> 공식 안내 문구가 명확합니다 — <b>\"인증센터 부스 안에 있는 인증 도장(스탬프)을 확인하고 인증수첩의 해당 자전거길 인증센터 스탬프 표시 위치에 직접 도장을 찍어주세요.\"<\/b><\/p>\n<div class=\"tw\"><table>\n<tr><th>종류<\/th><th>개수<\/th><th>특징<\/th><\/tr>\n<tr><td>종주인증센터(유인)<\/td><td><b>16개소<\/b><\/td><td>사람이 상주 · 인증 처리 창구<\/td><\/tr>\n<tr><td><b>무인인증센터<\/b><\/td><td><b>70개소<\/b><\/td><td><b>24시간 이용 가능<\/b> · 부스 안 도장을 직접 날인<\/td><\/tr>\n<tr><td>수첩판매소<\/td><td>13개소<\/td><td>인증수첩 구입<\/td><\/tr>\n<\/table><\/div>\n<p>무인인증센터가 <b>70개소로 압도적으로 많고 24시간<\/b> 열려 있다는 점이 이 제도의 핵심입니다. 공식 설명대로 <b>\"24시간 언제나 편안하게 자전거를 타며 종주한 기록을 인증 받을 수 있게\"<\/b> 만든 구조라, 새벽 출발이든 야간 도착이든 상관없습니다. <b>운영시간을 맞추려고 일정을 비틀 필요가 없습니다.<\/b><\/p>\n<div class=\"warn\"><b>⚠️ 함정은 여기입니다 — 빠뜨린 도장은 아무도 대신 찍어 주지 않습니다<\/b>\n<p style=\"margin:6px 0 0\">무인 부스는 <b>지나칠 수 있게 생겼습니다.<\/b> 오르막에 집중하다가, 비가 와서, 일행을 따라가다가 한 곳을 그냥 통과하면 그 칸은 <b>비어 있는 채로 남습니다.<\/b> 종주 인증은 <b>해당 자전거길의 스탬프를 모두 찍는 것<\/b>이 조건이므로, 한 칸이 비면 <b>그 구간 인증이 되지 않습니다.<\/b> 나중에 사정을 설명해도 소용이 없고, <b>그 지점까지 다시 가서 찍는 것 외에 방법이 없습니다.<\/b> 출발 전에 그날 지날 인증센터가 몇 개인지 세어 두고, 하나 찍을 때마다 확인하는 습관이 가장 확실합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 종이 스탬프 vs 앱 사이버인증, 어느 쪽이 나은가<\/h2>\n<p>2026년 현재 인증 방법은 두 가지입니다. 공식 설명에 따르면 사이버인증은 <b>\"기존 인증수첩에 스탬프를 찍던 방식과 동일하게, '행복나눔 모바일앱'을 이용하여 인증센터에 부착된 사이버 인증 QR코드를 찍거나 인증센터에 접근 시 자동으로 인증처리\"<\/b>되는 방식입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>비교 항목<\/th><th>종이 수첩 스탬프<\/th><th>앱 사이버인증<\/th><\/tr>\n<tr><td>준비물<\/td><td>인증수첩<\/td><td><b>인증수첩 + 앱 + 회원가입<\/b><\/td><\/tr>\n<tr><td>인증 방법<\/td><td>부스 도장을 직접 날인<\/td><td>QR 촬영 또는 <b>반경 40m 자동인증<\/b><\/td><\/tr>\n<tr><td>반영 시점<\/td><td><b>즉시<\/b>(찍는 순간)<\/td><td><b>1~3주 시차<\/b><\/td><\/tr>\n<tr><td>실패 가능성<\/td><td>도장 잉크·날인 위치<\/td><td><b>휴대폰 설정에 따라 자동인증 미실행<\/b><\/td><\/tr>\n<tr><td>비용<\/td><td>수첩값 외 없음<\/td><td>수첩값 외 없음<\/td><\/tr>\n<tr><td>추천<\/td><td><b>기본으로 반드시<\/b><\/td><td><b>보조로 병행<\/b><\/td><\/tr>\n<\/table><\/div>\n<p>결론부터 말하면 <b>둘 중 하나를 고르는 문제가 아닙니다. 종이 수첩을 기본으로 하고 앱을 함께 쓰는 것<\/b>이 맞습니다. 이유는 두 가지입니다.<\/p>\n<ul>\n<li><b>사이버인증도 수첩이 있어야 시작됩니다.<\/b> 절차가 <b>①인증수첩 구매 → ②홈페이지 회원가입 및 수첩번호 등록 → ③모바일앱 다운로드 → ④주행·인증 → ⑤인증 정보 조회<\/b> 순서라, 수첩을 안 사면 앱을 깔아도 등록할 번호가 없습니다.<\/li>\n<li><b>자동인증은 확정이 아닙니다.<\/b> 공식 주의사항에 <b>\"개개인의 휴대폰 설정에 따라 자동인증이 실행되지 않을 수 있습니다\"<\/b>라고 명시돼 있습니다. 위치 권한이나 절전 설정 때문에 앱이 꺼져 있으면 지나가도 기록이 남지 않습니다.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ \"1~3주 시차\"를 오류로 오해하지 마세요<\/b>\n<p style=\"margin:6px 0 0\">사이버인증은 <b>\"수자원공사와 정보연계 주기에 따라, 1~3주 내외의 시차 발생\"<\/b>이라고 공식이 밝히고 있습니다. 즉 <b>오늘 찍었는데 앱에 안 보이는 것이 정상<\/b>일 수 있습니다. 여기서 당황해 같은 지점을 다시 가는 분들이 있는데, <b>최소 3주는 기다린 뒤<\/b> 그래도 없으면 <b>사이버인증 문의 1522-8643<\/b>으로 확인하세요. 반대로 <b>종이 도장은 찍는 순간 끝<\/b>이라, 이 시차 문제가 아예 없습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 인증 종류와 받는 것 — 인증서는 무료, 메달은 유상<\/h2>\n<p>공식 안내가 구분하는 인증 종류는 네 가지입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>인증 종류<\/th><th>조건<\/th><\/tr>\n<tr><td>구간별 종주<\/td><td>각 자전거길 하나를 완주<\/td><\/tr>\n<tr><td><b>4대강 종주<\/b><\/td><td><b>한강 · 금강 · 영산강 · 낙동강<\/b> 모두 완주<\/td><\/tr>\n<tr><td>국토종주<\/td><td>공식 표기 <b>'모든 구간 완주'<\/b><\/td><\/tr>\n<tr><td><b>그랜드슬램<\/b><\/td><td>전 구간 종주(국토완주)<\/td><\/tr>\n<\/table><\/div>\n<p><b>계산 예시 — 4대강 종주는 몇 km인가?<\/b> 위 거리표에서 해당 네 개를 더하면 <b>한강 192 + 금강 146 + 영산강 133 + 낙동강 389 = 860km<\/b>입니다. 하루 80km면 <b>11일<\/b>, 주말마다 100km씩이면 <b>약 9주<\/b>가 나옵니다. 한 번에 몰아서 갈 필요가 없다는 점이 이 인증의 장점입니다.<\/p>\n<div class=\"tip\"><b>💡 국토종주·그랜드슬램의 정확한 구간 조합은 여기서 단정하지 않았습니다<\/b>\n<p style=\"margin:6px 0 0\">공식 안내 화면에는 <b>4대강 종주의 구성만 명시<\/b>돼 있고, 국토종주와 그랜드슬램은 '모든 구간 완주'·'전 구간 종주'라고만 적혀 있습니다. 인증에 필요한 구간 조합은 <b>인증수첩 실물과 아래 공식 페이지<\/b>에서 확인하시기 바랍니다. 확인되지 않은 조합을 이 글에서 지어내지 않았습니다.<\/p><\/div>\n<h3>완주하면 무엇을 받나<\/h3>\n<div class=\"tw\"><table>\n<tr><th>발급물<\/th><th>비용<\/th><\/tr>\n<tr><td>인증서(국토종주 · 4대강 · 그랜드슬램)<\/td><td><b>무료<\/b><\/td><\/tr>\n<tr><td>인증스티커<\/td><td><b>무료<\/b><\/td><\/tr>\n<tr><td>헬멧부착용 스티커<\/td><td><b>무료<\/b><\/td><\/tr>\n<tr><td>인증메달 및 케이스<\/td><td><b>유상<\/b>(우리강 이용도우미에서 판매)<\/td><\/tr>\n<\/table><\/div>\n<p><b>인증서 자체는 돈을 받지 않습니다.<\/b> 유상인 것은 <b>메달과 케이스뿐<\/b>이고, 이는 <b>우리강 이용도우미(riverguide.go.kr)<\/b>에서 별도 구매합니다. 메달 가격은 확인 시점의 판매 페이지에 따라 달라질 수 있어 이 글에서는 금액을 쓰지 않았습니다 — 구매 전 해당 페이지에서 확인하세요.<\/p>\n<p>신청은 <b>인증센터(인증부스)에서 스탬프를 날인한 뒤 제출<\/b>하거나, <b>무인 인증부스에 인증수첩·연락처·주소를 제출<\/b>하는 방식입니다. 주소를 적는 이유가 여기 있습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 어디부터 시작할까 — 거리로 고르는 첫 코스<\/h2>\n<p>처음부터 낙동강 389km를 잡으면 대부분 중간에 멈춥니다. <b>거리와 접근성으로 나누면<\/b> 선택이 쉬워집니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>상황<\/th><th>추천 코스<\/th><th>거리<\/th><th>이유<\/th><\/tr>\n<tr><td><b>오늘 당장 첫 도장<\/b><\/td><td>아라<\/td><td>21km<\/td><td>가장 짧고 수도권 접근 · 반나절<\/td><\/tr>\n<tr><td>주말 하루<\/td><td>북한강<\/td><td>70km<\/td><td>경춘선 구간 · 대중교통 복귀 쉬움<\/td><\/tr>\n<tr><td>주말 이틀<\/td><td>오천 / 새재<\/td><td>105 / 100km<\/td><td>하루 50km씩 나누기 좋음<\/td><\/tr>\n<tr><td><b>가을 휴가 3일<\/b><\/td><td>제주환상<\/td><td>234km<\/td><td>하루 78km · 일주라 복귀 동선 단순<\/td><\/tr>\n<tr><td>본격 도전<\/td><td>낙동강<\/td><td>389km<\/td><td>최장 구간 · 4~5일 확보 필요<\/td><\/tr>\n<\/table><\/div>\n<p><b>아라 자전거길 21km<\/b>는 이 제도에서 <b>가장 짧은 인증 구간<\/b>입니다. 인증제가 나에게 맞는지 <b>4,500원과 반나절로 시험해 볼 수 있다<\/b>는 뜻입니다. 수첩을 사고 도장 두어 개를 찍어 본 뒤 계속할지 결정하면 됩니다.<\/p>\n<div class=\"warn\"><b>⚠️ 가을 라이딩은 '거리'보다 '해가 지는 시각'이 변수입니다<\/b>\n<p style=\"margin:6px 0 0\">여름과 같은 페이스로 계획을 짜면 <b>마지막 인증센터를 앞두고 어두워집니다.<\/b> 무인인증센터는 24시간이라 도장 자체는 찍을 수 있지만, <b>야간 주행은 위험하고 강변 자전거길은 가로등이 없는 구간이 많습니다.<\/b> 하루 목표 거리를 여름보다 <b>20~30% 줄여<\/b> 잡고, 전조등·후미등을 반드시 챙기세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 놓치기 쉬운 7가지<\/h2>\n<ol>\n<li><b>수첩은 한 권이면 전부 됩니다.<\/b> 수계종주·4대강 종주·국토종주를 한 권으로 다 씁니다. 코스마다 새로 살 필요가 없습니다.<\/li>\n<li><b>도장은 본인이 직접 찍습니다.<\/b> 부스 안의 도장을 수첩의 해당 위치에 스스로 날인하는 방식입니다. 직원을 찾을 필요가 없습니다.<\/li>\n<li><b>한 칸이라도 비면 그 구간 인증이 안 됩니다.<\/b> 되돌아가는 것 말고는 방법이 없으니, 지날 때마다 세면서 확인하세요.<\/li>\n<li><b>무인인증센터 70개소는 24시간<\/b>입니다. 운영시간에 맞춰 일정을 짜지 않아도 됩니다.<\/li>\n<li><b>사이버인증은 수첩을 산 뒤에야 등록됩니다.<\/b> 앱만 깔고 출발하면 등록할 수첩번호가 없습니다.<\/li>\n<li><b>자동인증은 실패할 수 있습니다.<\/b> 공식이 \"휴대폰 설정에 따라 실행되지 않을 수 있다\"고 밝혔습니다. <b>QR 촬영을 함께<\/b> 하고, 종이 도장을 기본으로 두세요.<\/li>\n<li><b>앱에 안 보인다고 다시 가지 마세요.<\/b> 수자원공사 정보연계 주기 때문에 <b>1~3주 시차<\/b>가 정상입니다. 그 뒤에도 없으면 1522-8643으로 문의하면 됩니다.<\/li>\n<\/ol>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b>\n<a href=\"https://www.bike.go.kr/sub.do?key=2006176998516\" target=\"_blank\" rel=\"nofollow\">▸ 자전거행복나눔 — 종주인증제 안내(인증 종류·신청 방법·발급물)<\/a>\n<a href=\"https://www.bike.go.kr/content.do?key=2006176999884\" target=\"_blank\" rel=\"nofollow\">▸ 자전거행복나눔 — 인증수첩 안내(가격·구입처·사용 범위)<\/a>\n<a href=\"https://www.bike.go.kr/content.do?key=2006176999425\" target=\"_blank\" rel=\"nofollow\">▸ 자전거행복나눔 — 인증센터 안내(종주·무인·수첩판매소)<\/a>\n<a href=\"https://www.bike.go.kr/content.do?key=2006177000231\" target=\"_blank\" rel=\"nofollow\">▸ 자전거행복나눔 — 사이버인증 안내(앱·QR·자동인증)<\/a>\n<a href=\"https://www.bike.go.kr/sub.do?key=2006176948639\" target=\"_blank\" rel=\"nofollow\">▸ 자전거행복나눔 — 국토종주 자전거길 소개(구간·거리)<\/a>\n<a href=\"https://www.riverguide.go.kr/\" target=\"_blank\" rel=\"nofollow\">▸ 우리강 이용도우미 — 인증수첩·인증메달 구매<\/a>\n<\/div>\n<div class=\"end\"><b>✅ 마무리<\/b>\n<p style=\"margin:8px 0 0\">정리하면 이렇습니다. <b>① 준비물은 인증수첩 4,000원 + 비닐커버·지도 500원 = 4,500원<\/b>이 전부이고, 인증서·스티커는 무료입니다(메달만 유상). <b>② 인증구간은 13개 자전거길, 총 1,857km<\/b>이며 가장 짧은 <b>아라 21km<\/b>로 반나절 만에 시작할 수 있습니다. <b>③ 도장은 무인인증센터 70개소에서 24시간, 본인이 직접<\/b> 찍습니다 — <b>한 칸이라도 비면 그 구간은 인증되지 않습니다.<\/b> <b>④ 앱 사이버인증은 보조로만<\/b> 쓰세요. 자동인증은 휴대폰 설정에 따라 실패할 수 있고, 반영에 1~3주가 걸립니다. 선선해진 지금이 첫 도장을 찍기 가장 좋은 때입니다. <b>이번 주말, 가까운 인증센터에서 수첩 한 권부터 사 보세요.<\/b><\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월 8일<\/b> 자전거행복나눔(bike.go.kr) 공식 안내 페이지와 우리강 이용도우미(riverguide.go.kr)를 직접 확인한 기준입니다. 수첩 가격·인증센터 수·구간 거리·인증 절차는 운영 사정에 따라 변경될 수 있습니다. 인증메달 가격은 확인 시점에 판매 페이지에 표기돼 있지 않아 <b>이 글에 쓰지 않았습니다<\/b> — 구매 전 아래 공식 페이지에서 확인하세요. 자전거 주행 시 안전모 착용과 야간 등화 장치는 도로교통법상 안전 사항이니 반드시 지켜 주세요.<br>출처: <a href=\"https://www.bike.go.kr/sub.do?key=2006176998516\" target=\"_blank\" rel=\"nofollow\">자전거행복나눔 종주인증제 안내<\/a> · <a href=\"https://www.bike.go.kr/content.do?key=2006176999884\" target=\"_blank\" rel=\"nofollow\">인증수첩 안내<\/a> · <a href=\"https://www.bike.go.kr/content.do?key=2006176999425\" target=\"_blank\" rel=\"nofollow\">인증센터 안내<\/a> · <a href=\"https://www.bike.go.kr/content.do?key=2006177000231\" target=\"_blank\" rel=\"nofollow\">사이버인증 안내<\/a> · <a href=\"https://www.riverguide.go.kr/\" target=\"_blank\" rel=\"nofollow\">우리강 이용도우미<\/a> · 문의 1577-4359(우리강 이용도우미) · 1522-8643(사이버인증)<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b>\n<a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_0610833458.html\">▸ 국립공원 대피소 예약 방법 총정리 — 추첨제 신청 일정·환불 기준·노쇼 페널티<\/a>\n<a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_426.html\">▸ 국공립 캠핑장 야영장 예약 방법 고캠핑 총정리<\/a>\n<a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01495223186.html\">▸ 국립자연휴양림 예약 방법 성수기 추첨 낙첨 잔여   const adviceHtml=adv.length?'<div class="advice">'+adv.map(t=>'<div class="ai"><span class="ic">💡</span><span>'+esc(t)+'</span></div>').join('')+'</div>':'<div class="pcode none">현재 조치 필요 항목 없음</div>';
  // 📋 미결 관리 — 글별(pending.json: DB osmu + index_status에서 계산)
  const pc=(pend&&pend.counts)||{};
  const cb=(ok,l)=>'<span class="ch '+(ok?'on':'off')+'">'+l+(ok?'✓':'✗')+'</span>';
  const pendRows=(pend&&pend.actionable||[]).map(a=>{
    const c=a.ch||{};
    return '<div class="prow"><span class="pcd">'+esc(a.code)+'</span><span class="ptt">'+esc(a.title)+'</span>'
    +cb(c.g!==false,'G')+cb(c.n,'N')+cb(c.t,'T')+cb((osmuByCode[a.code]||{}).instagram,'I')+'</div>';
  }).join('');
  // 표시는 상위 14편으로 잘려 있음(pending.py) → 남은 수는 counts로 계산해 "…외 N편"
  const pendListed=(pend&&pend.actionable||[]).length;
  const pendTotal=Math.max(pc.osmu_pending||0,pc.index_pending||0);
  const pendMore=pendTotal>pendListed?'<div class="cnt">…외 '+(pendTotal-pendListed)+'편</div>':'';
  const pendHtml='<div class="cnt">OSMU 대기 '+(pc.osmu_pending||0)+'편 · 색인 대기 '+(pc.index_pending||0)+'편 / 전체 '+(pc.total||0)+'편</div>'+(pendRows||'<div class="pcode none">미결 없음</div>')+pendMore;
  // 📋 발행 대기 (발행 전 큐 — queue.json) : 코드·제목·썸네일을 한 카드로 묶어 '엉뚱한 글/썸네일' 눈으로 차단
  const qItems=(queue&&queue.items)||[];
  const laneLab={info:'정보성',pop:'대중관심'};
  const qCards=qItems.map(it=>{
    const th=it.thumb_data
      ?'<img class="qth" src="'+it.thumb_data+'" alt="">'
      :'<div class="qth none">썸네일<br>없음</div>';
    const facts=it.facts?'<div class="qfacts">'+esc(it.facts)+'</div>':'';
    const draft=it.draft?'<span class="qdraft">📄 '+esc(it.draft)+'</span>':'';
    const pv=it.body?'<button class="qpv" onclick="qpv(\''+esc(it.code||'')+'\')">👁 본문 미리보기</button>'
                    :'<span class="qpv none">초안 없음(작성 전)</span>';
    return '<div class="qcard">'+th
      +'<div class="qbody"><div class="qtop"><span class="qcode">'+esc(it.code||'')+'</span>'
      +'<span class="qlane '+(it.lane||'info')+'">'+esc(laneLab[it.lane]||it.lane||'')+'</span></div>'
      +'<div class="qtitle">'+esc(it.title||'')+'</div>'+facts
      +'<div class="qmeta">'+pv+draft+'</div></div></div>';
  }).join('');
  // 🚦 오늘 발행량 배지 (2026-07-29) — 승인 누르기 '전에' 보이게 한다.
  //    2026-07-27 에 8편이 한꺼번에 나간 건, 사람이 재고만 보고 몰아서 승인했는데
  //    '오늘 몇 편째'를 아무도 안 세고 있었기 때문이다. 게이트(pace.check)는 발행을 막고,
  //    이 배지는 그 전에 눈으로 막는다.
  let paceHtml='';
  if(pace){
    const st=pace.state||'ok', n=pace.count||0, hard=pace.hard||2;
    const lab=st==='err'?'⚠️ 오늘 발행량을 못 셌습니다 — '+esc(pace.error||'')
      :st==='block'?'⛔ 오늘 '+n+'편 발행됨 — 오늘은 더 발행하지 마세요(3편 이상 금지)'
      :st==='warn'?'⚠️ 오늘 '+n+'편 발행됨 — 기본 페이스는 하루 1편입니다'
      :'✅ 오늘 '+n+'편 발행 — 하루 1편 기준 안';
    const bg=st==='block'?'#3a1218':st==='warn'?'#3a2f12':st==='err'?'#2a2030':'#0c3a2c';
    const bd=st==='block'?'#7a2230':st==='warn'?'#5a4a1a':st==='err'?'#4a3a5a':'#1f6b52';
    const fg=st==='block'?'#ff9aa6':st==='warn'?'#ffd166':st==='err'?'#c9b6e8':'#8ef0cf';
    const titles=(pace.posts||[]).map(p=>'<div style="opacity:.8;margin-top:2px">· '+esc(p.title||'')+'</div>').join('');
    const lanes=pace.lanes||{};
    const laneTxt=Object.keys(lanes).map(k=>{
      const L=lanes[k]; if(!L) return '';
      return '<span style="display:inline-block;margin-right:9px">'+esc(L.label||k)+' <b>'+(L.n||0)+'</b></span>';
    }).join('');
    const over=pace.backlog_over
      ?'<div style="margin-top:5px;color:#ffd166">📦 발행대기 재고 '+pace.backlog+'편 (상한 '+pace.backlog_max+' 초과) — 재고가 쌓이면 몰아치기 발행을 부릅니다. PREP 초안 생성이 잠긴 상태입니다.</div>'
      :'<div style="margin-top:5px;opacity:.75">📦 발행대기 재고 '+(pace.backlog||0)+'편 / 상한 '+(pace.backlog_max||5)+'</div>';
    const laneRow=laneTxt?'<div style="margin-top:4px;opacity:.8;font-size:11.5px">🛤 레인별: '+laneTxt+'<span style="opacity:.6">(자동 2 + 사용자 창구 1 · 루틴은 1회 1건)</span></div>':'';
    paceHtml='<div style="background:'+bg+';border:1px solid '+bd+';color:'+fg
      +';border-radius:8px;padding:8px 11px;margin:2px 0 9px;font-size:12px;line-height:1.5">'
      +'<b>'+lab+'</b>'+titles+over+laneRow+'</div>';
  }
  const qHtml=paceHtml+(qItems.length
    ?'<div class="cnt">발행 대기 '+qItems.length+'건 — 발행하면 카드가 자동으로 사라집니다(사람 승인 게이트)</div>'+qCards
    :'<div class="pcode none">발행 대기 없음 — PREP 루틴이 준비하면 여기 카드로 뜹니다</div>');
  document.getElementById('board').innerHTML=
   '<div class="hd"><div class="t"><h1>진행현황</h1><span class="date">'+esc(date)+'</span></div>'
   +'<span class="badge '+bcls+'">'+CHECK+esc(blab)+'</span></div>'
   +'<div class="sec">오늘 한 일</div>'+today
   +'<div class="metrics">'
   +'<div class="m"><div class="l">검사 통과</div><div class="v">'+pass+' <small>/ '+total+'</small></div></div>'
   +'<div class="m"><div class="l">블로그 글</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">평균 본문</div><div class="v">'+avg+' <small>자</small></div></div>'
   +'</div>'
   +'<div class="div"></div>'
   +'<div class="sec">📋 발행 대기 (오늘 발행할 글)<span class="auto">🤖 PREP 큐</span></div>'+qHtml
   +'<div class="div"></div>'
   +'<div class="sec">발행 진행 (글 1편 · '+STEPS.length+'단계, 확산 포함)<span class="auto">🤖 자동</span></div>'+pubHtml
   +'<div class="div"></div>'
   +'<div class="sec">📡 4채널 발행 현황 (구글·네이버·쓰레드·인스타)<span class="auto">🤖 DB 자동집계</span></div>'
   +'<div class="metrics">'
   +'<div class="m"><div class="l">구글(원본)</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">네이버</div><div class="v">'+oNv+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">쓰레드</div><div class="v">'+oTh+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">인스타</div><div class="v">'+oIn+' <small>편</small></div></div>'
   +'</div>'
   +'<div class="cnt">확산 커버리지 · 네이버 '+(count?Math.round(oNv/count*100):0)+'% · 쓰레드 '+(count?Math.round(oTh/count*100):0)+'% · 인스타 '+(count?Math.round(oIn/count*100):0)+'% · 교차링크 완료 '+omAll.length+'편</div>'
   +osmuLi
   +'<div class="div"></div>'
   +'<div class="sec">🤝 협업 — 세션별 역할·진행<span class="auto">git 자동분류</span></div>'+collabHtml
   +'<div class="sec">💡 시스템 조언<span class="auto">라이브 도출</span></div>'+adviceHtml
   +'<div class="div"></div>'
   +'<div class="sec">📋 미결 관리 — 4채널 매칭<span class="auto">G구글·N네이버·T쓰레드·I인스타</span></div>'+pendHtml
   +'<div class="sec">다음</div><div class="next">'+next+'</div>'
   +'<div class="upd" id="upd"></div>';
  tick();
}
// 시계·데이터 기준만 갱신(보드 전체 재렌더 없음 — 정적 베이크 데이터라 시계만 변함)
function tick(){
  const el=document.getElementById('upd'); if(!el)return;
  const b=(window.__DATA__||{}).baked_at;
  el.textContent=(b?'데이터 기준 '+b+' · ':'')+new Date().toLocaleTimeString('ko-KR');
}
// 👁 발행 대기 카드 본문 미리보기 — 초안 HTML을 격리 iframe(srcdoc)로 렌더(스타일 누수 차단, Blogger 미접촉)
function qpv(code){
  const items=((window.__DATA__||{}).queue||{}).items||[];
  const it=items.find(x=>x.code===code); if(!it||!it.body)return;
  document.getElementById('qpv-ttl').textContent=(it.code||'')+' · '+(it.title||'');
  document.getElementById('qpv-fr').srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank"><body style="margin:0;padding:16px;background:#fff">'+it.body+'</body>';
  document.getElementById('qpv-ov').classList.add('show');
}
function qpvClose(){document.getElementById('qpv-ov').classList.remove('show');document.getElementById('qpv-fr').srcdoc='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')qpvClose();});
// 코드 자동 반영: 자기 자신(progress.html)을 주기적으로 fetch→해시 비교, 바뀌면 1회 reload
const _hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
let _selfHash=null;
async function checkVersion(){
  try{
    const r=await fetch('progress.html?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;                                // 일시적 404/500에 해시 오염 → 불필요 reload 방지
    const t=await r.text();
    const h=_hash(t);
    if(_selfHash===null){_selfHash=h;return;}      // 첫 호출=기준선 저장
    if(h!==_selfHash) location.reload();            // 코드 변경 감지 → 자동 새로고침
  }catch(e){}
}
load(); checkVersion(); setInterval(tick,5000); setInterval(checkVersion,5000);
</script>
