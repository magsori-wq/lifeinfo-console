<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="icon" href="data:,">
<title>진행현황 — 생활정보 모음</title>
<style>
:root{--bg:#0e1620;--card:#18222e;--card2:#13202d;--line:#26323f;--txt:#e6edf3;--mut:#8a97a6;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:470px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:16px;font-weight:600}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(63,185,80,.16);color:var(--ok)}
.b-warn{background:rgba(210,153,34,.16);color:var(--warn)}
.b-bad{background:rgba(248,81,73,.16);color:var(--bad)}
.sec{font-size:11px;color:var(--mut);letter-spacing:.05em;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
.metrics{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 2px}
/* 채널이 4개가 되어 490px 팝업에서 눌리므로, 좁아지면 2x2로 감싸게 한다 */
.m{flex:1 1 96px;background:var(--card2);border-radius:9px;padding:8px 10px}
.m .l{font-size:11px;color:var(--mut)}
.m .v{font-size:18px;font-weight:600;margin-top:2px}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #243049;font-size:12.5px}
li:last-child{border-bottom:none}
li.on{opacity:.62}
li.on .lbl{text-decoration:line-through}
li svg{width:15px;height:15px;flex:none}
li.on svg{color:var(--ok)}
li.now svg{color:#7fc1ff}
li.wait svg{color:#4a586e}
.num{font-size:11px;color:#6b7a99;width:16px;text-align:right;flex:none}
.who{font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px;flex:none}
.who.ai{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.who.me{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.lbl{font-size:12.5px}
.star{color:#ff8e8e;font-weight:800;margin-left:2px}
.banner{display:none;margin-top:9px;background:#0c3a2c;border:1px solid #1f6b52;color:#06d6a0;border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12.5px}
.banner.show{display:block}
.upd{font-size:11px;color:var(--mut);text-align:right;margin-top:12px}
.agent{background:var(--card2);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.agent .ah{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.agent .st{font-size:10px;font-weight:700;padding:1px 7px;border-radius:7px;margin-left:auto}
.st.active{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.st.uncommitted{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.st.idle{background:#222c3a;color:#6b7a99;border:1px solid #2e3a4a}
.agent .role{font-size:11px;color:var(--mut);margin:3px 0 1px}
.agent .own{font-size:10.5px;color:#5a6b80}
.agent .act{font-size:11px;color:#aeb9c7;margin-top:4px;padding-left:7px;border-left:2px solid #2a3a4d;line-height:1.5}
.agent .act .d{color:var(--mut);font-size:10px}
.advice{background:#13202d;border:1px solid #2a3a4d;border-radius:9px}
.advice .ai{display:flex;gap:8px;padding:7px 11px;font-size:12px;line-height:1.5;border-bottom:1px dashed #243049}
.advice .ai:last-child{border-bottom:none}
.advice .ic{flex:none}
.prow{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px dashed #243049;font-size:11.5px}
.prow:last-child{border-bottom:none}
.pcd{color:#7fc1ff;font-weight:700;flex:none;width:46px}
.ptt{flex:1;color:#cdd6e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{background:#3a2f12;color:#ffd166;border-radius:5px;padding:0 5px;font-size:9.5px;flex:none}
.pact{color:#06d6a0;font-size:10px;flex:none;font-weight:700}
.qcard{display:flex;gap:9px;padding:8px;margin:6px 0;background:#141c2c;border:1px solid #243049;border-radius:9px}
.qth{width:78px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:#0d1420}
.qth.none{display:flex;align-items:center;justify-content:center;color:#54627a;font-size:9px;text-align:center;line-height:1.2;border:1px dashed #2a3752}
.qbody{flex:1;min-width:0}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qcode{color:#7fc1ff;font-weight:700;font-size:11.5px}
.qlane{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700}
.qlane.info{background:#12283a;color:#7fc1ff}
.qlane.pop{background:#2f2136;color:#e0a3ff}
.qtitle{color:#e6edf5;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qfacts{color:#8a95a6;font-size:10px;margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qmeta{margin-top:4px}
.qdraft{color:#6b7688;font-size:9.5px;margin-left:8px}
.qpv{background:#17324a;color:#7fc1ff;border:1px solid #2a4d6e;border-radius:6px;font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer}
.qpv:hover{background:#1d4463}
.qpv.none{background:none;border:none;color:#54627a;font-weight:400;cursor:default;padding:3px 0}
#qpv-ov{display:none;position:fixed;inset:0;background:rgba(6,10,18,.82);z-index:999;align-items:center;justify-content:center;padding:18px}
#qpv-ov.show{display:flex}
.qpv-box{width:100%;max-width:760px;height:88vh;display:flex;flex-direction:column;background:#0f1626;border:1px solid #2a3752;border-radius:12px;overflow:hidden}
.qpv-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #243049;font-size:12.5px;font-weight:700;color:#7fc1ff}
.qpv-hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpv-x{background:#243049;color:#cdd6e0;border:none;border-radius:6px;font-size:11px;padding:5px 11px;cursor:pointer;flex:none}
.qpv-x:hover{background:#324158}
.qpv-fr,#qpv-fr{flex:1;width:100%;border:0;background:#fff}
.qpv-ft{padding:8px 14px;border-top:1px solid #243049;font-size:10px;color:#8a95a6;text-align:center}
.ch{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 4px;flex:none;margin-left:3px}
.ch.on{background:#0c3a2c;color:#06d6a0}
.ch.off{background:#3a1216;color:#f0707a}
</style>
</head>

</div>

 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">정부지원·복지<\/span>\n<p>국민연금은 <b>만 60세가 되면 의무 가입이 끝납니다.<\/b> 그런데 이때 가입기간이 <b>10년(120개월)에 못 미치면 연금이 아니라 일시금<\/b>으로 받게 되고, 10년을 넘겼더라도 더 내면 연금액이 더 늘어납니다. 그래서 60세부터 65세 전까지 본인이 원해서 계속 내는 제도가 <b>임의계속가입<\/b>입니다. 2026년부터 보험료율이 <b>9% → 9.5%<\/b>로 오르면서 \"지금 더 내는 게 이득인지\" 판단이 더 중요해졌습니다. 조건·보험료·불가 사유·손익 계산까지 공식 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 임의계속가입이란 — 누가 대상인가<\/a><a href=\"#sec2\">2. 2026년 보험료는 얼마 (9.5% 인상)<\/a><a href=\"#sec3\">3. 신청 방법 · 기한 · 탈퇴<\/a><a href=\"#value-add\">4. 손익 계산 — 2년 더 내면 얼마 회수되나<\/a><a href=\"#sec4\">5. 임의계속 vs 추납 vs 반납, 뭐가 유리한가<\/a><a href=\"#sec5\">6. 신청 못 하는 경우 5가지 (탈락 사유)<\/a><a href=\"#sec6\">7. 자주 묻는 질문<\/a><a href=\"#sec7\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#value-add\">👉 2년 더 내면 얼마나 이득인지 계산 먼저 보기<\/a>\n<h2 id=\"sec1\">1. 임의계속가입이란 — 누가 대상인가<\/h2>\n<p>국민연금 가입자(또는 가입자였던 사람)가 <b>60세에 도달해 자격을 잃었을 때<\/b>, 본인이 희망하면 <b>65세가 될 때까지<\/b> 계속 보험료를 낼 수 있는 제도입니다. 신청 목적은 크게 두 가지입니다.<\/p>\n<ul>\n<li><b>수급자격 확보형<\/b> — 가입기간이 <b>10년(120개월)에 미달<\/b>해 그대로 두면 연금이 아니라 <b>반환일시금<\/b>으로 끝나는 경우. 부족한 개월을 채워 <b>평생 받는 연금<\/b>으로 바꾸는 것이 목적입니다.<\/li>\n<li><b>연금액 증액형<\/b> — 이미 10년을 넘겨 수급자격은 있지만, <b>가입기간을 더 늘려 월 연금액을 키우려는<\/b> 경우.<\/li>\n<\/ul>\n<div class=\"tip\"><b>💡 '임의가입'과 헷갈리지 마세요<\/b><p style=\"margin:8px 0 0\"><b>임의가입<\/b>은 소득이 없는 <b>18~59세<\/b>(전업주부·학생 등)가 스스로 가입하는 제도이고, <b>임의계속가입<\/b>은 <b>60세 이후<\/b>에 계속 내는 제도입니다. 이름이 비슷해도 대상 연령이 다릅니다. 또 <b>추납(추후납부)<\/b>은 과거 못 낸 기간을 메우는 것이라 또 다른 제도입니다(4·5번 항목에서 비교).<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec2\">2. 2026년 보험료는 얼마 (9.5% 인상)<\/h2>\n<p>2026년 1월 1일부터 국민연금 보험료율이 <b>9% → 9.5%<\/b>로 올랐습니다. 1998년 이후 첫 인상이며, 이후 <b>매년 0.5%p씩 올라 2033년 13%<\/b>에 도달할 예정입니다.<\/p>\n<table>\n<tr><th>연도<\/th><th>보험료율<\/th><th>비고<\/th><\/tr>\n<tr><td>~2025년<\/td><td>9.0%<\/td><td>1998년 이후 동일<\/td><\/tr>\n<tr><td><b>2026년<\/b><\/td><td><b>9.5%<\/b><\/td><td>첫 인상(1월 1일 시행)<\/td><\/tr>\n<tr><td>2027년<\/td><td>10.0%<\/td><td>매년 +0.5%p<\/td><\/tr>\n<tr><td>2033년~<\/td><td>13.0%<\/td><td>최종 목표율<\/td><\/tr>\n<\/table>\n<p>임의계속가입자의 보험료는 <b>기준소득월액 × 보험료율<\/b>이며, 직장가입자와 달리 <b>회사 부담분이 없어 전액 본인이 냅니다.<\/b> 기준소득월액은 하한액~상한액 범위 안에서 정해지고, 이 상·하한액은 <b>매년 3월 말 고시되어 그해 7월부터 1년간<\/b> 적용됩니다. 본인에게 적용될 정확한 금액은 <b>종별(사업장·지역·임의계속)에 따라 다르게 적용될 수 있어<\/b> 신청 전 공단 상담이 필요합니다.<\/p>\n<table>\n<tr><th>기준소득월액<\/th><th>월 보험료 (9.5%)<\/th><th>1년 부담<\/th><\/tr>\n<tr><td>100만 원<\/td><td>9만 5,000원<\/td><td>114만 원<\/td><\/tr>\n<tr><td>150만 원<\/td><td>14만 2,500원<\/td><td>171만 원<\/td><\/tr>\n<tr><td>200만 원<\/td><td>19만 원<\/td><td>228만 원<\/td><\/tr>\n<tr><td>300만 원<\/td><td>28만 5,000원<\/td><td>342만 원<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 저소득 지역가입자 지원<\/b><p style=\"margin:8px 0 0\">농어업인이거나 저소득 지역가입자에 해당하면 보험료 일부를 국고에서 지원받을 수 있습니다. 본인이 지원 대상인지도 <b>신청할 때 함께 문의<\/b>하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec3\">3. 신청 방법 · 기한 · 탈퇴<\/h2>\n<ol>\n<li><b>신청 시기<\/b>: 60세 도달로 자격을 잃은 뒤부터 <b>65세가 되기 전까지<\/b> 신청할 수 있습니다. 보험료를 낼 수 있는 최종 상한은 <b>만 65세 생일 전날<\/b>까지입니다.<\/li>\n<li><b>신청 방법<\/b>: <b>인터넷(국민연금 전자민원), 방문, 우편, 전화, 팩스<\/b> 모두 가능합니다. 전화 상담·신청은 <b>국민연금공단 1355<\/b>.<\/li>\n<li><b>납부<\/b>: 자동이체·고지서 납부 모두 가능하며 <b>전액 본인 부담<\/b>입니다.<\/li>\n<li><b>탈퇴<\/b>: 의무 가입이 아니므로 <b>원할 때 탈퇴<\/b>할 수 있습니다. 다만 <b>보험료를 6개월 동안 전액 미납하면 직권으로 탈퇴<\/b> 처리됩니다(과거 3개월 기준에서 6개월로 완화).<\/li>\n<\/ol>\n<div class=\"tip\"><b>⏰ 가장 중요한 기한<\/b><p style=\"margin:8px 0 0\"><b>65세가 지나면 재가입이 불가능합니다.<\/b> 그 시점까지 10년을 못 채웠다면 그동안 낸 보험료는 연금이 아니라 <b>반환일시금<\/b>으로 받게 됩니다. 60세가 다가온다면 <b>내 가입기간이 몇 개월인지부터<\/b> 확인하세요(내연금 알아보기에서 조회 가능).<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"value-add\">4. 손익 계산 — 2년 더 내면 얼마나 회수되나<\/h2>\n<p>제도 설명만으로는 판단이 안 됩니다. <b>\"내가 얼마를 더 내고, 그 돈을 언제 회수하느냐\"<\/b>가 결정 기준입니다. 아래는 <b>가입기간 8년(96개월)인 사람이 2년(24개월)을 더 내 10년을 채우는<\/b> 상황의 계산입니다.<\/p>\n\n<h3>① 2년치 총 납부액 (2026년 9.5% 기준)<\/h3>\n<table>\n<tr><th>기준소득월액<\/th><th>월 보험료<\/th><th>24개월 총액<\/th><\/tr>\n<tr><td>100만 원<\/td><td>9만 5,000원<\/td><td><b>228만 원<\/b><\/td><\/tr>\n<tr><td>150만 원<\/td><td>14만 2,500원<\/td><td><b>342만 원<\/b><\/td><\/tr>\n<tr><td>200만 원<\/td><td>19만 원<\/td><td><b>456만 원<\/b><\/td><\/tr>\n<\/table>\n\n<h3>② 원금 회수에 걸리는 개월 수<\/h3>\n<p>핵심은 <b>이 2년을 안 채우면 연금이 0원(일시금으로 종결)<\/b>이라는 점입니다. 즉 채우면 받게 될 <b>월 연금액 전부가 순증<\/b>입니다. 납부총액을 월 연금액으로 나누면 회수기간이 나옵니다.<\/p>\n<table>\n<tr><th>24개월 납부액<\/th><th>월 연금 20만 원이면<\/th><th>월 연금 35만 원이면<\/th><th>월 연금 50만 원이면<\/th><\/tr>\n<tr><td>228만 원<\/td><td>약 <b>11개월<\/b><\/td><td>약 <b>7개월<\/b><\/td><td>약 <b>5개월<\/b><\/td><\/tr>\n<tr><td>342만 원<\/td><td>약 <b>17개월<\/b><\/td><td>약 <b>10개월<\/b><\/td><td>약 <b>7개월<\/b><\/td><\/tr>\n<tr><td>456만 원<\/td><td>약 <b>23개월<\/b><\/td><td>약 <b>13개월<\/b><\/td><td>약 <b>10개월<\/b><\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>📐 이 표를 읽는 법<\/b><p style=\"margin:8px 0 0\">회수기간이 <b>대부분 1~2년<\/b>입니다. 그 뒤로는 <b>평생 받는 금액이 전부 이익<\/b>이고, 국민연금은 <b>매년 물가상승률만큼 올려 지급<\/b>되며 사망 시 유족연금으로도 이어집니다. 그래서 \"10년을 못 채운 상태\"라면 임의계속가입은 거의 예외 없이 유리한 선택으로 평가됩니다. 단 <b>본인의 실제 예상 월 연금액<\/b>은 가입기간·소득에 따라 다르므로, 아래 공단 <b>'내 연금 알아보기'<\/b>에서 반드시 본인 숫자로 확인하세요(위 20/35/50만 원은 계산 방법을 보여주기 위한 가정값입니다).<\/p><\/div>\n\n<h3>③ 이미 10년을 넘긴 사람은 판단이 다릅니다<\/h3>\n<p>수급자격이 이미 있는 경우, 임의계속가입은 <b>\"0 → 연금\"이 아니라 \"연금 → 조금 더 많은 연금\"<\/b>입니다. 증액폭이 크지 않을 수 있으므로 아래를 따져보세요.<\/p>\n<ul>\n<li><b>증액분 확인이 먼저<\/b> — 공단에 \"임의계속으로 N개월 더 내면 월 얼마가 되는지\" 물어 <b>증액분을 숫자로 받고<\/b> 위 방식대로 회수기간을 계산하세요.<\/li>\n<li><b>당장의 현금 여력<\/b> — 60대 초반은 소득이 끊기는 시기입니다. 보험료가 전액 본인 부담(회사 절반 없음)이라는 점을 감안해야 합니다.<\/li>\n<li><b>연기연금과 비교<\/b> — 연금액을 늘리는 방법으로는 <b>수급을 미루는 연기연금<\/b>도 있습니다. 둘 중 어느 쪽이 유리한지는 건강·소득 상황에 따라 갈립니다.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec4\">5. 임의계속 vs 추납 vs 반납, 뭐가 유리한가<\/h2>\n<p>가입기간을 늘리는 방법은 세 가지인데, <b>상황이 다르면 정답도 다릅니다.<\/b><\/p>\n<table>\n<tr><th>제도<\/th><th>어떤 상황용<\/th><th>핵심 조건<\/th><\/tr>\n<tr><td><b>임의계속가입<\/b><\/td><td>60세가 됐는데 기간이 <b>부족하거나 더 늘리고 싶을 때<\/b><\/td><td>60세~65세 전, 전액 본인 부담<\/td><\/tr>\n<tr><td><b>추납(추후납부)<\/b><\/td><td>과거 <b>납부예외·경력단절 기간<\/b>이 있을 때<\/td><td>납부 이력이 있어야 하고, 신청 시점에 <b>가입자 자격이 있어야<\/b> 함<\/td><\/tr>\n<tr><td><b>반납<\/b><\/td><td>과거에 <b>반환일시금을 받아<\/b> 기간이 사라졌을 때<\/td><td>받은 일시금 + <b>이자<\/b>를 함께 반납<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 순서가 중요합니다<\/b><p style=\"margin:8px 0 0\"><b>추납은 '가입자 자격이 있는 동안'에만 신청<\/b>할 수 있습니다. 60세가 지나 자격을 잃은 상태라면, <b>먼저 임의계속가입으로 자격을 되살린 뒤<\/b> 추납을 신청하는 흐름이 됩니다. 반대로 자격을 잃은 채 시간을 흘려보내면 추납 기회 자체가 닫힙니다. 추납으로 인정되는 기간에는 한도가 있으니 <b>본인 인정 개월 수는 공단에서 확인<\/b>하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec5\">6. 신청 못 하는 경우 5가지 (탈락 사유)<\/h2>\n<p>신청하려다 막히는 대표적인 경우입니다. <b>미리 알고 대비<\/b>해야 하는 지점입니다.<\/p>\n<table>\n<tr><th>이런 경우<\/th><th>왜 안 되나 / 어떻게 하나<\/th><\/tr>\n<tr><td><b>이미 반환일시금을 받았다<\/b><\/td><td>일시금 수령으로 가입 이력이 정리된 상태 → 임의계속 대상에서 제외. <b>반납(일시금+이자) 가능 여부<\/b>를 공단에 먼저 확인<\/td><\/tr>\n<tr><td><b>보험료 납부 이력이 전혀 없다<\/b><\/td><td>전액 미납 등 <b>낸 적이 없는 경우<\/b>는 신청 불가<\/td><\/tr>\n<tr><td><b>이미 노령연금을 받고 있다<\/b><\/td><td>연금 수급이 시작되면 임의계속 대상이 아님. <b>연금을 청구하는 순간 더 늘릴 기회가 닫힙니다<\/b><\/td><\/tr>\n<tr><td><b>만 65세가 지났다<\/b><\/td><td>납부 상한 연령 초과 → <b>재가입 불가<\/b>. 10년 미달이면 일시금으로 종결<\/td><\/tr>\n<tr><td><b>가입 후 6개월 전액 미납<\/b><\/td><td>공단이 <b>직권 탈퇴<\/b> 처리. 65세 전이면 다시 신청 가능하나 <b>공백만큼 기간 손해<\/b><\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>⏰ 확인 순서<\/b><p style=\"margin:8px 0 0\">① 내 가입기간(개월) 조회 → ② 10년까지 몇 개월 부족한지 계산 → ③ 예상 연금액 조회 → ④ 위 표로 회수기간 계산 → ⑤ 1355로 기준소득월액·추납 가능 여부 상담 → ⑥ 신청. <b>60세 생일 전에 ①~③을 미리 해두면<\/b> 공백 없이 이어집니다.<\/p><\/div>\n<!-- [운영자 경험 자리] 부모님·본인 임의계속 상담을 실제로 해본 적 있으면 1~2문장만. 없으면 비워둠 -->\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec6\">7. 자주 묻는 질문<\/h2>\n<h3>Q. 60세인데 가입기간이 3년밖에 안 됩니다. 그래도 의미가 있나요?<\/h3>\n<p>65세까지 최대 5년(60개월)을 더 낼 수 있으므로 3년 + 5년 = 8년으로 <b>10년에는 여전히 못 미칩니다.<\/b> 이럴 때는 <b>과거 납부예외 기간에 대한 추납<\/b>으로 함께 메울 수 있는지가 관건입니다. 임의계속가입으로 자격을 살린 뒤 추납이 가능한지 1355에 확인해 보세요. 방법이 없다면 반환일시금으로 받는 선택이 남습니다.<\/p>\n<h3>Q. 보험료를 낮게 낼 수도 있나요?<\/h3>\n<p>기준소득월액은 하한액~상한액 범위 안에서 정해지며, 부담을 줄이려면 낮은 쪽으로 정할 수 있습니다. 다만 <b>낮게 내면 늘어나는 연금액도 작아집니다.<\/b> 종별에 따라 적용 기준이 달라질 수 있어 <b>신청 전 공단 상담<\/b>이 필요합니다.<\/p>\n<h3>Q. 임의계속으로 내는 동안 연금을 받을 수 있나요?<\/h3>\n<p>아닙니다. <b>노령연금을 청구해 받기 시작하면 임의계속가입 대상에서 제외<\/b>됩니다. 즉 '연금 받으면서 계속 납부해 더 늘리기'는 되지 않습니다. 늘릴지, 지금 받을지를 <b>먼저 결정<\/b>해야 합니다.<\/p>\n<h3>Q. 중간에 그만두면 낸 돈은 어떻게 되나요?<\/h3>\n<p>탈퇴해도 <b>낸 기간은 그대로 가입기간으로 남습니다.<\/b> 최종적으로 10년을 채웠으면 연금으로, 못 채웠으면 반환일시금으로 정산됩니다.<\/p>\n<h3>Q. 2026년에 보험료율이 올랐는데 지금 시작하면 손해 아닌가요?<\/h3>\n<p>부담이 늘어난 것은 맞지만, 같은 개정으로 <b>소득대체율(연금 지급 수준)도 41.5% → 43%로 인상<\/b>되었고 <b>국가의 지급보장이 법에 명시<\/b>되었습니다. 위 4번의 회수기간 계산에서 보듯 <b>10년 미달 상태<\/b>라면 요율 인상을 감안해도 유리한 쪽이 일반적입니다. 본인 숫자로 계산해 판단하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec7\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0032M0.do\" target=\"_blank\" rel=\"nofollow\">▸ 국민연금공단 — 임의계속가입자 안내<\/a><a href=\"https://www.nps.or.kr/elctcvlcpt/comm/getOHAC0000M5.do?menuId=MN24001069\" target=\"_blank\" rel=\"nofollow\">▸ 국민연금공단 — 임의계속가입 인터넷 신청<\/a><a href=\"https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0038M0.do\" target=\"_blank\" rel=\"nofollow\">▸ 국민연금공단 — 연금보험료(보험료율·기준소득월액)<\/a><a href=\"https://www.mohw.go.kr/menu.es?mid=a10714010100\" target=\"_blank\" rel=\"nofollow\">▸ 보건복지부 — 가입대상 및 연금보험료<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">임의계속가입은 <b>60세부터 65세 전까지<\/b> 본인이 원해 계속 내는 제도이고, 2026년 보험료는 <b>기준소득월액 × 9.5%(전액 본인 부담)<\/b>입니다. 가입기간이 <b>10년에 미달<\/b>한다면 회수기간이 대개 1~2년이라 유리한 선택이고, 이미 10년을 넘겼다면 <b>증액분을 숫자로 받아 비교<\/b>해야 합니다. 놓치면 안 되는 것은 딱 하나 — <b>65세가 지나면 다시는 못 넣습니다.<\/b> 60세가 가까워졌다면 오늘 내 가입기간부터 조회해 보세요(1355).<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 보험료율·기준소득월액 상하한·가입 요건은 변경될 수 있습니다(기준소득월액 상·하한액은 매년 7월 갱신). 신청 전 국민연금공단(1355)에서 최신 기준을 확인하세요.<br>출처: <a href=\"https://www.nps.or.kr\">국민연금공단<\/a> 임의계속가입·연금보험료 안내, <a href=\"https://www.mohw.go.kr\">보건복지부<\/a> 국민연금정책, 대한민국 정책브리핑(2026년 국민연금 제도 개편)<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_813.html\">▸ 국민연금 예상 수령액 조회 방법 수령나이 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01162794658.html\">▸ 국민연금 추납 임의가입 방법 못 낸 기간 채워 수령액 늘리기 총정리 (2026)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01191203420.html\">▸ 국민연금 조기노령연금 연기연금 신청 방법 감액률 증액률 손익분기 총정리 (2026)<\/a><\/div>\n\n<div id=\"ymyl-disclaimer\" style=\"margin-top:22px;font-size:13px;color:#666;line-height:1.6\">본 글은 정보 제공용이며, 실제 가입 가능 여부·보험료·연금액은 국민연금공단의 심사와 개인별 이력에 따라 달라집니다. 본문의 계산 예시는 계산 방법을 보여주기 위한 가정값입니다.<\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 수치·자격·기한은 <b>공식 자료를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 제도는 바뀔 수 있으니 신청 전 공식 페이지를 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 국민연금은 만 60세면 의무가입이 끝나는데, 이때 가입기간이 10년(120개월)에 못 미치면 연금이 아니라 일시금으로 끝납니다. 60세부터 65세 전까지 본인이 원해 계속 내는 제도가 '임의계속가입'입니다.\n2. 2026년 보험료율은 9% → 9.5%로 올랐고(1998년 이후 첫 인상, 2033년 13%까지 매년 0.5%p), 임의계속가입자는 회사 부담 없이 전액 본인이 냅니다. 기준소득월액 200만 원이면 월 19만 원.\n3. 8년 가입자가 2년(24개월)을 더 채우는 경우 총 납부액이 228만~456만 원인데, 채워야 생기는 월 연금이 20만 원만 돼도 원금 회수는 11~23개월. 그 뒤는 평생 이익입니다. 단 65세가 지나면 재가입 불가, 노령연금을 청구하는 순간 자격 상실이니 순서를 먼저 정하세요(1355).\n"},{"code":"F2-11","title":"국내선 LCC 수하물 규정 총정리 — 무료 위탁·기내 반입·초과 추가요금 (제주항공 진에어 티웨이 에어부산 에어서울 2026)","lane":"pop","thumb":"126_lcc_baggage.png","draft":"국내선LCC수하물_글_HTML.txt","facts":"무료위탁 국내선: 제주항공 운임제(최저FLY 0kg/FLYBAG 15kg)·진에어15·티웨이15·에어부산15·에어서울15(정규할인특가동일). 기내반입 공통 10kg·1개·세변합115cm(제주항공40x20x55). 초과요금=온라인 사전구매<공항현장(진에어 출발24h전까지 구매·환불). 동일예약 일행 무게합산. V0=5사비교표+사전구매vs현장 계산예시3+특가0kg함정. 보조배터리 위탁금지·기내만. 관련글 F3-06/F3-07/F2-08. 출처=각 항공사 공식 수하물안내(제주항공/진에어/티웨이/에어부산/에어서울).","added":"2026-07-23","thumb_data":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0i rel b{display:block;font-size:14px;color:#6544cc;margin-bottom:8px}\n.lsg .rel a{display:block;color:#5a3cc0;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#9a92aa;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>여름휴가 제주·부산행 국내선을 <b>저비용항공사(LCC)<\/b>로 싸게 끊었는데, 공항 카운터에서 <b>\"수하물 초과라 추가요금 내셔야 합니다\"<\/b>라는 말에 당황한 경험, 한 번쯤 있으실 겁니다. 특히 요즘은 <b>같은 항공사라도 운임 종류에 따라 무료로 부칠 수 있는 짐이 아예 0kg인 경우<\/b>까지 생겨서, 모르고 예약하면 <b>티켓값보다 짐값이 더 나오는<\/b> 일도 벌어집니다. 이 글에서는 국내선 5개 LCC의 <b>무료 수하물 허용량, 기내 반입 규정, 초과 시 추가요금을 아끼는 법<\/b>을 비교표와 실제 계산 예시로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 먼저 이 두 가지부터 — '위탁'과 '기내 반입'<\/a><a href=\"#sec2\">2. 국내선 LCC 무료 위탁 수하물 비교표<\/a><a href=\"#sec3\">3. 가장 흔한 함정 — '특가운임'은 무료 위탁이 0kg<\/a><a href=\"#sec4\">4. 기내 반입 수하물 규정 (무게·크기)<\/a><a href=\"#sec5\">5. 초과 추가요금, 얼마나 아낄 수 있나 — 계산 예시 3가지<\/a><a href=\"#sec6\">6. 이럴 때 추가요금·거절이 나옵니다<\/a><a href=\"#sec7\">7. 자주 묻는 질문<\/a><a href=\"#sec8\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec5\">👉 사전구매하면 얼마 아끼는지 계산 예시 보기<\/a>\n\n<h2 id=\"sec1\">1. 먼저 이 두 가지부터 — '위탁'과 '기내 반입'<\/h2>\n<p>수하물은 크게 두 종류로 나뉘고, 요금 규정도 완전히 다릅니다.<\/p>\n<ul>\n<li><b>위탁 수하물<\/b> = 카운터에서 부쳐 화물칸으로 가는 짐. LCC는 <b>운임에 무료 허용량이 포함되는지<\/b>가 항공사·운임별로 다릅니다.<\/li>\n<li><b>기내 반입(휴대) 수하물<\/b> = 직접 들고 타는 짐. 대부분 <b>10kg·1개<\/b>로 무료지만, <b>무게와 3면 합계 크기<\/b> 제한이 있습니다.<\/li>\n<\/ul>\n<p>핵심은 <b>\"무료 위탁은 운임에 딸려 오는 옵션\"<\/b>이라는 점입니다. 대형항공사(FSC)는 보통 운임에 넉넉히 포함돼 있지만, LCC는 <b>운임을 잘게 쪼개 팔기 때문에<\/b> 싼 운임일수록 무료 위탁이 줄거나 없어집니다. 그래서 <b>'항공권 값'만 비교하면 오히려 손해<\/b>를 볼 수 있습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 국내선 LCC 무료 위탁 수하물 비교표<\/h2>\n<p>2026년 7월 기준, 국내선 성인 1인 <b>무료 위탁 수하물<\/b> 허용량입니다. 항공사마다 운임 체계가 달라 <b>정확한 허용량은 예약 화면의 운임 조건을 반드시 확인<\/b>해야 합니다.<\/p>\n<table>\n<tr><th>항공사<\/th><th>국내선 무료 위탁(성인)<\/th><th>기내 반입<\/th><\/tr>\n<tr><td><b>제주항공<\/b><\/td><td>운임제 — <b>최저운임(FLY)은 0kg<\/b>, 위탁 포함 운임(FLYBAG 등)은 <b>15kg<\/b><\/td><td>10kg·1개<\/td><\/tr>\n<tr><td><b>진에어<\/b><\/td><td>15kg<\/td><td>10kg·1개<\/td><\/tr>\n<tr><td><b>티웨이항공<\/b><\/td><td>15kg (운임 조건 확인)<\/td><td>10kg·1개<\/td><\/tr>\n<tr><td><b>에어부산<\/b><\/td><td>15kg<\/td><td>10kg·1개<\/td><\/tr>\n<tr><td><b>에어서울<\/b><\/td><td>15kg (정규·할인·특가 동일)<\/td><td>10kg·1개<\/td><\/tr>\n<\/table>\n<p>표에서 보이듯 대부분 <b>15kg 무료<\/b>가 기본이지만, <b>제주항공은 운임을 골라서 사는 구조<\/b>라 가장 싼 운임을 고르면 무료 위탁이 없습니다. 무게는 보통 <b>'가방 개수'가 아니라 '합산 무게'<\/b>로 봅니다. 예를 들어 15kg 허용이면 10kg 가방 + 5kg 가방으로 나눠 부쳐도 됩니다(단, 1개당 무게·규격 상한은 별도).<\/p>\n<div class=\"tip\"><b>💡 일행이면 무게를 합칠 수 있습니다<\/b><p style=\"margin:8px 0 0\">같은 <b>예약번호로 묶인 일행<\/b>은 무료 허용량을 <b>합산<\/b>해 주는 경우가 많습니다. 예컨대 2명이 각 15kg(합 30kg)이면, 한 사람 가방이 20kg이고 다른 사람이 10kg이어도 <b>합계 30kg 이내라 통과<\/b>됩니다. 짐이 한쪽에 몰리는 가족여행에 특히 유용합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 가장 흔한 함정 — '특가운임'은 무료 위탁이 0kg<\/h2>\n<p>요금비교 사이트나 항공사 앱에서 <b>제일 싼 운임<\/b>을 눌러 결제했다가, 공항에서 <b>짐을 통째로 유료로 부치게 되는<\/b> 경우가 여기서 나옵니다.<\/p>\n<ul>\n<li><b>제주항공 'FLY' 운임<\/b>처럼 <b>가장 저렴한 운임에는 무료 위탁이 포함되지 않습니다.<\/b> 캐리어 하나만 부쳐도 전액 추가요금입니다.<\/li>\n<li>이때 <b>항공권값 + 수하물값을 합쳐서<\/b> 다른 항공사(15kg 무료 포함)와 비교해야 실제로 뭐가 싼지 알 수 있습니다.<\/li>\n<li>짐이 <b>기내 반입 10kg 안에 들어가는 1박2일 여행<\/b>이라면, 오히려 이 최저운임이 이득일 수 있습니다. <b>내 짐 무게가 판단 기준<\/b>입니다.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ '항공권만 싸게' 사면 손해 보는 순간<\/b><p style=\"margin:8px 0 0\">예: 무료 위탁 0kg 특가운임을 <b>9,900원 더 싸게<\/b> 샀는데, 20kg 캐리어를 부치느라 <b>편도 수하물 요금 2만~4만 원<\/b>을 따로 냈다면, 결과적으로 <b>더 비싸게<\/b> 여행한 셈입니다. 결제 전 <b>\"이 운임에 위탁 몇 kg 포함?\"<\/b>을 꼭 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 기내 반입 수하물 규정 (무게·크기)<\/h2>\n<p>기내 반입은 5개 항공사가 대체로 비슷합니다. <b>무게뿐 아니라 '크기'<\/b>에서 걸리는 경우가 많으니 둘 다 확인하세요.<\/p>\n<ul>\n<li><b>무게<\/b>: 보통 <b>10kg 이하 1개<\/b> + 노트북·핸드백 같은 <b>소지품 1개<\/b>.<\/li>\n<li><b>크기<\/b>: 세 변(가로+세로+높이)의 합 <b>약 115cm 이내<\/b>(예: 제주항공 40×20×55cm). 기내용 캐리어를 살 때 이 규격을 넘지 않는지 봐야 합니다.<\/li>\n<li><b>초과 시<\/b>: 기내 반입 규정을 넘긴 가방은 <b>탑승구(게이트)에서 위탁 처리<\/b>되며 <b>추가요금<\/b>이 붙을 수 있습니다. 카운터보다 게이트에서 걸리면 더 번거롭습니다.<\/li>\n<\/ul>\n<div class=\"tip\"><b>💡 위탁 못 하는 물건, 기내만 되는 물건<\/b><p style=\"margin:8px 0 0\"><b>보조배터리·리튬배터리·전자담배<\/b>는 <b>위탁 금지, 기내 반입만<\/b> 가능합니다. 반대로 <b>물·화장품 같은 액체(100mL 초과)<\/b>는 <b>국제선은 기내 반입 제한<\/b>이 있지만 국내선은 상대적으로 완화돼 있습니다. 국내선이라도 <b>보조배터리는 부치는 짐에 넣지 마세요.<\/b><\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 초과 추가요금, 얼마나 아낄 수 있나 — 계산 예시 3가지<\/h2>\n<p>초과 수하물 요금의 핵심 원칙은 딱 하나입니다. <b>\"공항 현장 결제가 가장 비싸다.\"<\/b> 대부분 <b>온라인 사전구매(홈페이지·앱 '나의 예약')가 현장보다 쌉니다.<\/b> 정확한 금액은 노선·시점·항공사별로 달라 <b>예매일 기준 공식 페이지에서 확인<\/b>해야 하지만, 아끼는 구조는 아래와 같습니다.<\/p>\n<h3>예시 ① 제주항공 최저운임(FLY)로 김포–제주, 20kg 캐리어 1개<\/h3>\n<p>이 운임은 <b>무료 위탁 0kg<\/b>이라 20kg 전부가 유료입니다. 이때 <b>공항 카운터에서 즉석 결제<\/b>하면 가장 비싸고, <b>출발 전 앱에서 '수하물 사전구매'<\/b>로 미리 사두면 같은 20kg이라도 <b>더 싼 요금<\/b>이 적용됩니다. 짐이 있을 걸 안다면 <b>결제 단계에서 위탁 포함 운임을 고르는 편<\/b>이 더 저렴한 경우도 많습니다.<\/p>\n<h3>예시 ② 진에어 15kg 무료인데 22kg을 부칠 때<\/h3>\n<p>무료 15kg을 넘긴 <b>7kg만 초과분으로 유료<\/b>입니다(전체 22kg이 아니라 초과분만 과금). 이 7kg도 <b>사전구매가 현장보다 쌉니다.<\/b> 사전구매는 보통 <b>출발 몇 시간 전(예: 24시간 전)<\/b>까지 가능하고, 그 시한 안에는 취소·환불도 됩니다.<\/p>\n<h3>예시 ③ 가족 3인, 같은 예약번호로 각 15kg<\/h3>\n<p>합산 <b>45kg<\/b>까지 무료입니다. 한 명 가방이 22kg이고 나머지 둘이 각 10kg이면 합계 42kg이라 <b>추가요금 0원<\/b>. 짐을 각자 딱 맞춰 싸느라 애쓸 필요 없이 <b>한 캐리어에 몰아 담아도<\/b> 되는 이유입니다(1개당 상한 무게·규격은 확인).<\/p>\n<div class=\"tip\"><b>💡 요약하면<\/b><p style=\"margin:8px 0 0\">① <b>짐이 있으면 위탁 포함 운임<\/b>을 고르거나 ② <b>부족분은 출발 전 온라인 사전구매<\/b>, ③ <b>일행은 예약을 묶어 무게 합산<\/b> — 이 세 가지만 지켜도 공항에서 당황할 일이 크게 줄어듭니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 이럴 때 추가요금·거절이 나옵니다<\/h2>\n<p>공항에서 실랑이가 벌어지는 전형적인 상황들입니다. 미리 알아두면 피할 수 있습니다.<\/p>\n<ul>\n<li><b>무료 위탁이 없는 특가운임<\/b>인 줄 모르고 짐을 부치는 경우 — 가장 흔합니다.<\/li>\n<li><b>기내 캐리어가 규격(3면 합 115cm)·무게 초과<\/b> — 게이트에서 위탁 전환 + 추가요금.<\/li>\n<li><b>1개당 상한 무게 초과<\/b>(보통 20~32kg) — 무료 허용량 안이어도 <b>가방 1개가 너무 무거우면<\/b> 별도 처리될 수 있습니다.<\/li>\n<li><b>골프백·자전거·악기 등 특수 수하물<\/b> — 크기·무게 규정이 별도이고 사전 신청이 필요할 수 있습니다.<\/li>\n<li><b>보조배터리를 부치는 짐에 넣음<\/b> — 보안검색에서 다시 꺼내야 해 시간을 잡아먹습니다.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 자주 묻는 질문<\/h2>\n<h3>Q. 국내선인데도 무료 위탁이 0kg일 수 있나요?<\/h3>\n<p>네. <b>제주항공의 가장 저렴한 운임(FLY)<\/b>처럼 무료 위탁을 뺀 대신 운임을 낮춘 상품이 있습니다. 결제 전 <b>운임 조건에 '위탁 수하물 미포함'<\/b>이라고 적혀 있는지 확인하세요.<\/p>\n<h3>Q. 무료 15kg은 가방 1개 기준인가요, 총 무게 기준인가요?<\/h3>\n<p>대체로 <b>총 무게(합산) 기준<\/b>입니다. 15kg이면 여러 개로 나눠 부쳐도 <b>합쳐서 15kg 이내<\/b>면 됩니다. 다만 <b>가방 1개당 상한 무게·규격<\/b>은 따로 있으니 한 개에 너무 몰지는 마세요.<\/p>\n<h3>Q. 초과요금은 공항에서 내나요, 미리 내나요?<\/h3>\n<p><b>미리(온라인 사전구매) 내는 것이 거의 항상 쌉니다.<\/b> 짐이 초과될 걸 알면 출발 전 앱·홈페이지에서 미리 구매하세요. 사전구매 시한과 환불 규정은 항공사마다 다릅니다.<\/p>\n<h3>Q. 대형항공사(FSC)와 어떻게 다른가요?<\/h3>\n<p>대한항공·아시아나 같은 FSC는 국내선 무료 위탁이 <b>보통 더 넉넉<\/b>하고 운임에 포함돼 있습니다. LCC는 <b>운임을 쪼개 파는 대신 옵션을 골라 사는 구조<\/b>라, <b>짐이 적으면 LCC가, 짐이 많으면 조건에 따라 FSC가<\/b> 유리할 수 있습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 항공사별 수하물 규정 (공식)<\/b><a href=\"https://www.jejuair.net/ko/linkService/boardingProcessGuide/cabinBaggage.do\" target=\"_blank\" rel=\"nofollow\">▸ 제주항공 — 수하물 안내<\/a><a href=\"https://www.jinair.com/ready/carryBaggage\" target=\"_blank\" rel=\"nofollow\">▸ 진에어 — 무료 위탁/휴대 수하물<\/a><a href=\"https://www.twayair.com/app/serviceInfo/contents/148\" target=\"_blank\" rel=\"nofollow\">▸ 티웨이항공 — 무료/위탁 수하물<\/a><a href=\"https://www.airbusan.com/content/common/service/baggage/free\" target=\"_blank\" rel=\"nofollow\">▸ 에어부산 — 무료수하물<\/a><a href=\"https://flyairseoul.com\" target=\"_blank\" rel=\"nofollow\">▸ 에어서울 — 수하물 안내<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">정리하면, 국내선 LCC 무료 위탁은 <b>대체로 15kg<\/b>이지만 <b>제주항공 최저운임은 0kg<\/b>이라 운임을 고를 때 반드시 확인해야 합니다. 짐이 초과되면 <b>공항 현장보다 온라인 사전구매가 싸고<\/b>, 일행은 <b>예약을 묶어 무게를 합산<\/b>하면 됩니다. 기내 캐리어는 <b>10kg·세 변 합 115cm<\/b> 규격을 넘지 않게, <b>보조배터리는 반드시 기내로<\/b>. 이번 여름 제주·부산 여행, 짐값으로 손해 보지 말고 떠나세요.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 무료 허용량·초과요금·사전구매 시한은 항공사 정책과 운임 상품에 따라 수시로 달라질 수 있습니다. 예매·탑승 전 아래 각 항공사 공식 수하물 안내와 <b>내 운임의 조건<\/b>을 반드시 확인하세요.<br>출처: 제주항공·진에어·티웨이항공·에어부산·에어서울 공식 수하물 안내 페이지<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026-7-8-24200.html\">▸ 여름 항공권 싸게 사는 법 + 유류할증료 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_0459503221.html\">▸ 항공기 결항·지연 보상 신청 방법 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/2026_0230556349.html\">▸ 제주 렌터카 싸게 예약하는 법 + 자차보험 총정리<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 수하물 허용량·요금·규격은 <b>각 항공사 공식 안내를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 항공사 정책은 바뀔 수 있으니 예매 전 공식 페이지와 내 운임 조건을 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 국내선 LCC 무료 위탁은 대체로 15kg인데, 제주항공 최저운임(FLY)은 무료 위탁이 0kg이에요. 제일 싼 운임만 눌러 사면 캐리어 하나 부치는 데 짐값이 따로 나와, 항공권값+짐값을 합쳐 비교해야 진짜 싼 게 보입니다.\n2. 초과요금은 공항 현장 결제가 제일 비싸요. 출발 전 앱·홈페이지 '나의 예약'에서 수하물 사전구매를 하면 같은 무게라도 더 쌉니다(보통 출발 24시간 전까지, 환불도 가능).\n3. 일행은 같은 예약번호로 묶으면 무게 합산이 돼요(각 15kg=합 30kg). 기내 캐리어는 10kg·세 변 합 115cm 규격, 보조배터리는 위탁 금지·기내만. 짐 무게로 항공사를 고르면 손해를 막습니다.\n"},{"code":"B3-04","title":"퇴직연금 IRP 연금 수령 방법 연금소득세 일시금 세금 비교 총정리 (2026 만 55세 은퇴)","lane":"info","thumb":"127_irp_pension.png","draft":"퇴직연금IRP수령_글_HTML.txt","facts":"재원3분류(퇴직금/자기납입/운용수익) 재원별 과세 상이 | 나이별 연금소득세 5.5/4.4/3.3%(지방세포함) | 퇴직금 연금수령 30%감면(10년내)·40%(11년차~) | 1500만원 분리과세 한도는 자기납입+수익에만(퇴직금·국민연금 제외), 초과시 종합과세 or 16.5% | 중도해지: 자기납입+수익=기타소득세16.5%, 퇴직금=퇴직소득세 | 출처 국세청 nts.go.kr cntntsId=7888, 금감원 통합연금포털","added":"2026-07-24","thumb_data":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc //2Q==\" alt=\"퇴직연금 IRP 연금 수령 방법 연금소득세 일시금 세금 비교\" style=\"max-width:100%;height:auto;border-radius:12px\" /><\/div>\n<style>\n.lsg{max-width:720px;margin:0 auto;font-size:17px;line-height:1.85;color:#222;word-break:keep-all}\n.lsg .cat{display:inline-block;background:#4D9DE0;color:#fff;font-size:13px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:10px}\n.lsg h2{font-size:23px;margin:34px 0 14px;padding-left:12px;border-left:5px solid #4D9DE0;line-height:1.35}\n.lsg p{margin:0 0 14px}\n.lsg ul,.lsg ol{margin:0 0 16px;padding-left:22px}\n.lsg li{margin:6px 0}\n.lsg h3{font-size:18px;margin:22px 0 10px}\n.lsg .toc{background:#eef6fc;border:1px solid #cfe4f5;border-radius:12px;padding:16px 20px;margin:18px 0 26px}\n.lsg .toc b{display:block;font-size:14px;color:#2a72b5;margin-bottom:8px}\n.lsg .toc a{display:block;color:#215d94;text-decoration:none;padding:4px 0;font-size:15px}\n.lsg .cta{display:block;text-align:center;background:linear-gradient(90deg,#4D9DE0,#2EB67D);color:#fff !important;font-weight:800;font-size:17px;padding:15px 18px;border-radius:12px;text-decoration:none;margin:22px 0}\n.lsg table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:15px}\n.lsg th,.lsg td{border:1px solid #cfe4f5;padding:10px 12px;text-align:center}\n.lsg th{background:#e3f0fa}\n.lsg .tip{background:#eef6fc;border:1px solid #c9e2f4;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .end{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:16px 20px;margin-top:24px}\n.lsg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6fc;border:1px solid #cfe4f5;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#2c4a63}\n.lsg .src b{display:block;font-size:14px;color:#215d94;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#eef6fc;border:1px solid #cfe4f5;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#2a72b5;margin-bottom:8px}\n.lsg .rel a{display:block;color:#215d94;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#8a9aa8;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">세금·금융<\/span>\n<p>퇴직할 때 IRP(개인형 퇴직연금)에 쌓인 돈, <b>한 번에 받을까 나눠 받을까?<\/b> 이 선택 하나로 세금이 <b>수백만 원<\/b> 갈립니다. 핵심은 간단합니다. 퇴직금을 <b>연금으로 나눠 받으면 퇴직소득세를 30~40% 깎아주고<\/b>, 연금저축·IRP에 내가 넣은 돈은 <b>낮은 연금소득세(3.3~5.5%)<\/b>로 바뀝니다. 다만 <b>'연 1,500만 원'이라는 함정<\/b>과 '중도 해지 불이익'을 모르면 오히려 세금을 더 냅니다. 아래에서 재원별 과세·세율·계산 예시까지 한 번에 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 연금으로 받으려면? 수령 조건(만 55세·5년)<\/a><a href=\"#sec2\">2. 내 IRP는 3가지 돈이 섞여 있다 (재원별 과세)<\/a><a href=\"#sec3\">3. 나이별 연금소득세율·퇴직소득세 감면율<\/a><a href=\"#sec4\">4. 계산 예시 ① 퇴직금 연금 vs 일시금 (600만 원 차이)<\/a><a href=\"#sec5\">5. 계산 예시 ② '연 1,500만 원' 함정 피하기<\/a><a href=\"#sec6\">6. 중도 해지·55세 전 인출하면 손해<\/a><a href=\"#sec7\">7. 자주 묻는 질문<\/a><a href=\"#sec8\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"https://100lifeplan.fss.or.kr\" target=\"_blank\" rel=\"nofollow\">👉 금융감독원 통합연금포털에서 내 연금 조회하기<\/a>\n<h2 id=\"sec1\">1. 연금으로 받으려면? 수령 조건<\/h2>\n<p>IRP에 쌓인 돈을 '연금'으로 받으려면 아래 요건을 모두 채워야 합니다. 하나라도 못 채우면 '일시금'으로 간주돼 세금 혜택이 사라집니다.<\/p>\n<ul>\n<li><b>만 55세 이상<\/b>일 것.<\/li>\n<li>연금계좌 <b>가입 후 5년 이상<\/b> 경과했을 것. <b>단, 퇴직금(이연퇴직소득)이 입금된 IRP는 이 5년 요건이 면제<\/b>됩니다. 즉 퇴직해서 받은 퇴직금은 55세만 넘으면 바로 연금으로 받을 수 있습니다.<\/li>\n<li>수령 기간을 <b>10년 이상<\/b>으로 잡고, 매년 정해진 <b>'연금수령한도' 안에서<\/b> 나눠 받을 것.<\/li>\n<\/ul>\n<div class=\"tip\"><b>💡 '연금수령한도'가 뭔가요?<\/b><p style=\"margin:8px 0 0\">한 해에 세제 혜택을 받으며 꺼낼 수 있는 상한선입니다. <b>연금수령한도 = 연금계좌 평가액 ÷ (11 − 연금수령연차) × 120%<\/b>. 이 한도를 넘겨 인출하면, <b>초과분은 연금이 아니라 일시금으로 과세<\/b>돼 감면 혜택이 날아갑니다. 그래서 '10년 이상 천천히'가 세금상 유리합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec2\">2. 내 IRP는 3가지 돈이 섞여 있다<\/h2>\n<p>세금이 헷갈리는 이유는, IRP 한 계좌 안에 <b>성격이 다른 세 종류의 돈<\/b>이 섞여 있고 <b>각각 세금이 다르게<\/b> 매겨지기 때문입니다. 이걸 구분하는 게 절세의 출발점입니다.<\/p>\n<table>\n<tr><th>재원(돈의 종류)<\/th><th>연금으로 받을 때<\/th><th>일시금으로 받을 때<\/th><\/tr>\n<tr><td><b>① 퇴직금<\/b><br>(이연퇴직소득)<\/td><td>연금소득세<br>=퇴직소득세 <b>30~40% 감면<\/b><\/td><td>퇴직소득세<br>(감면 없음)<\/td><\/tr>\n<tr><td><b>② 내가 넣은 돈<\/b><br>(세액공제 받은 자기부담금)<\/td><td>연금소득세<br><b>3.3~5.5%<\/b> 저율<\/td><td>기타소득세<br><b>16.5%<\/b><\/td><\/tr>\n<tr><td><b>③ 굴려서 번 돈<\/b><br>(운용수익)<\/td><td>연금소득세<br><b>3.3~5.5%<\/b> 저율<\/td><td>기타소득세<br><b>16.5%<\/b><\/td><\/tr>\n<\/table>\n<p>표에서 보듯 <b>어떻게 받든 연금이 일시금보다 세금이 낮습니다.<\/b> 특히 ②·③(내가 넣은 돈+수익)은 일시금이면 16.5%를 떼지만, 연금이면 3.3~5.5%로 <b>3분의 1 수준<\/b>으로 내려갑니다.<\/p>\n<div class=\"tip\"><b>💡 꼭 기억할 '한도'의 진실<\/b><p style=\"margin:8px 0 0\">뒤에 나오는 <b>'연 1,500만 원' 한도는 ②·③(내가 넣은 돈+수익)에만<\/b> 적용됩니다. <b>①퇴직금(이연퇴직소득)은 금액이 아무리 커도 이 한도와 무관<\/b>하게 항상 저율 분리과세로 끝납니다. 이걸 헷갈려 '퇴직금 연금으로 많이 받으면 세금폭탄'이라 오해하는 경우가 많은데, 아닙니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec3\">3. 나이별 연금소득세율·퇴직소득세 감면율<\/h2>\n<p><b>②내가 넣은 돈 + ③운용수익<\/b>을 연금으로 받을 때는, 받는 <b>나이가 많을수록 세율이 낮아집니다<\/b>(지방소득세 포함).<\/p>\n<table>\n<tr><th>연금 받는 나이<\/th><th>연금소득세율(지방세 포함)<\/th><\/tr>\n<tr><td>만 55세~69세<\/td><td>5.5%<\/td><\/tr>\n<tr><td>만 70세~79세<\/td><td>4.4%<\/td><\/tr>\n<tr><td>만 80세 이상<\/td><td>3.3%<\/td><\/tr>\n<\/table>\n<p>사망 시까지 받는 <b>종신형<\/b>으로 설계하면 이보다 더 낮은 세율(2026년부터 3.3%)이 적용됩니다. 한편 <b>①퇴직금(이연퇴직소득)<\/b>을 연금으로 받을 때는 나이가 아니라 <b>수령 연차<\/b>에 따라 원래 낼 퇴직소득세를 깎아줍니다.<\/p>\n<table>\n<tr><th>연금 수령 기간<\/th><th>퇴직소득세 감면<\/th><th>실제 부담<\/th><\/tr>\n<tr><td>연금수령 <b>10년 이내<\/b><\/td><td><b>30% 감면<\/b><\/td><td>퇴직소득세의 70%<\/td><\/tr>\n<tr><td>연금수령 <b>11년차부터<\/b><\/td><td><b>40% 감면<\/b><\/td><td>퇴직소득세의 60%<\/td><\/tr>\n<\/table>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec4\">4. 계산 예시 ① 퇴직금 연금 vs 일시금<\/h2>\n<p>말로만 하면 와닿지 않으니 숫자로 봅시다. <b>퇴직금 2억 원<\/b>이 IRP에 입금됐고, 이 퇴직금에 대해 계산된 <b>퇴직소득세가 2,000만 원<\/b>(실효세율 10%)이라고 가정합니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>일시금 수령<\/th><th>연금 수령(10년 분할)<\/th><\/tr>\n<tr><td>매년 받는 돈<\/td><td>2억 원(한 번에)<\/td><td>2,000만 원 × 10년<\/td><\/tr>\n<tr><td>적용 세율<\/td><td>퇴직소득세 10%<\/td><td>10% × 70% = <b>7%<\/b><\/td><\/tr>\n<tr><td>총 세금<\/td><td><b>2,000만 원<\/b><\/td><td>140만 원 × 10년 = <b>1,400만 원<\/b><\/td><\/tr>\n<tr><td>세금 차이<\/td><td colspan=\"2\" style=\"background:#fff8e6\"><b>연금 수령이 600만 원 절약<\/b> (11년차부터는 40% 감면이라 더 유리)<\/td><\/tr>\n<\/table>\n<p>핵심은 이 퇴직금 연금은 <b>연 2,000만 원<\/b>씩 받아도 '1,500만 원 한도'에 <b>걸리지 않는다<\/b>는 점입니다(①재원이라 한도 무관). 종합과세로 넘어가지 않고 저율 감면이 그대로 유지됩니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec5\">5. 계산 예시 ② '연 1,500만 원' 함정 피하기<\/h2>\n<p>반대로 조심할 대상은 <b>②내가 넣은 돈 + ③운용수익<\/b>입니다. 이 둘을 연금으로 받은 금액이 <b>연간 1,500만 원을 넘으면<\/b>, 넘은 부분만이 아니라 <b>그해 받은 전액<\/b>에 대해 ⓐ다른 소득과 합쳐 <b>종합과세<\/b> 하거나 ⓑ<b>16.5% 분리과세<\/b> 중 하나를 골라야 합니다. 저율(5.5%)이 사라지는 것이죠.<\/p>\n<table>\n<tr><th>②+③ 연간 연금 수령액<\/th><th>과세 방식<\/th><\/tr>\n<tr><td>연 1,500만 원 <b>이하<\/b><\/td><td>저율 분리과세 <b>3.3~5.5%<\/b> (신고 끝)<\/td><\/tr>\n<tr><td>연 1,500만 원 <b>초과<\/b><\/td><td>전액 <b>종합과세<\/b> 또는 <b>16.5% 분리과세<\/b> 선택<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 함정을 피하는 방법<\/b><p style=\"margin:8px 0 0\">②+③에서 나오는 연금을 <b>매년 1,500만 원 이하로 쪼개서<\/b> 오래 받으면 계속 저율(5.5%)을 유지할 수 있습니다. 예를 들어 자기부담금·수익이 3,000만 원 있다면 한 해에 몰아 받지 말고 <b>2년에 걸쳐 1,500만 원씩<\/b> 받는 식입니다. ※ 이 1,500만 원 계산에 <b>①퇴직금 연금과 국민연금 등 공적연금은 포함되지 않습니다.<\/b><\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec6\">6. 중도 해지·55세 전 인출하면 손해<\/h2>\n<p>급하다고 55세 전에 IRP를 깨거나 중도 해지하면, 그동안 받은 세제 혜택을 <b>토해내는 구조<\/b>라 손해가 큽니다. 이때도 재원별로 세금이 다릅니다.<\/p>\n<ul>\n<li><b>②내가 넣은 돈 + ③운용수익<\/b> → <b>기타소득세 16.5%<\/b>. 매년 세액공제로 돌려받은 세금을 다시 물어내는 성격이라, 저율 연금(5.5%)의 <b>3배<\/b>를 뗍니다.<\/li>\n<li><b>①퇴직금(이연퇴직소득)<\/b> → <b>퇴직소득세<\/b>가 그대로(감면 없이) 부과됩니다. 연금이었다면 받을 30~40% 감면을 못 받습니다.<\/li>\n<\/ul>\n<p>또 앞서 본 <b>연금수령한도를 초과<\/b>해 꺼낸 금액도 '연금이 아닌 것'으로 보아 같은 방식으로 과세됩니다. 결론은 <b>55세 이후 · 한도 안에서 · 10년 이상<\/b>이 삼박자입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec7\">7. 자주 묻는 질문<\/h2>\n<h3>Q. 퇴직금은 무조건 연금으로 받는 게 이득인가요?<\/h3>\n<p>세금만 보면 연금이 유리합니다(퇴직소득세 30~40% 감면 + 과세이연). 다만 목돈이 당장 필요하거나 대출 상환 등 확정 지출이 있다면 일시금이 나을 수 있습니다. '세금 절약분'과 '목돈의 활용 가치'를 비교해 정하세요.<\/p>\n<h3>Q. 국민연금이랑 IRP 연금을 같이 받으면 세금이 합쳐지나요?<\/h3>\n<p>국민연금(공적연금)과 사적연금(IRP·연금저축)은 <b>과세 체계가 분리<\/b>돼 있습니다. IRP의 ②+③ '연 1,500만 원' 한도 계산에 국민연금은 들어가지 않습니다. 국민연금은 별도로 공적연금 과세 방식(연말정산)을 따릅니다.<\/p>\n<h3>Q. 회사 다닐 때 DB·DC형이었는데 IRP로 옮겨야 하나요?<\/h3>\n<p>퇴직하면 퇴직급여가 IRP 계좌로 이전되는 것이 원칙입니다. IRP로 받아 두면 당장 퇴직소득세를 떼지 않고 <b>과세가 미뤄지며(과세이연)<\/b>, 나중에 연금으로 받을 때 감면까지 받을 수 있어 유리합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec8\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=6608&cntntsId=7888\" target=\"_blank\" rel=\"nofollow\">▸ 국세청 — 연금소득 원천징수(세율)<\/a><a href=\"https://100lifeplan.fss.or.kr\" target=\"_blank\" rel=\"nofollow\">▸ 금융감독원 통합연금포털 — 내 연금 조회<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">IRP 수령의 절세 공식은 <b>①퇴직금은 연금으로(30~40% 감면), ②+③내가 넣은 돈은 연 1,500만 원 이하로 나눠(저율 5.5%), ③55세 이후 10년 이상<\/b>입니다. 급하게 일시금·중도해지하면 16.5%를 물게 되니, 받기 전 <b>금융감독원 통합연금포털<\/b>에서 내 계좌 재원 구성부터 확인해 보세요.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#2c4a63;margin:0\">2026년 7월<\/b> 기준이며, 세율·한도·감면율은 세법 개정에 따라 바뀔 수 있습니다. 실제 수령·신고 전 국세청 또는 금융회사에서 최신 기준과 내 계좌 재원 구성을 확인하세요.<br>출처: 국세청 연금소득 원천징수 안내(nts.go.kr), 금융감독원 통합연금포털(100lifeplan.fss.or.kr), 소득세법<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/06/irp-900-2026.html\">▸ 연금저축 IRP 세액공제 한도 900만원 연말정산 환급 총정리 (2026)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01894976254.html\">▸ 퇴직금 계산 방법 퇴직소득세 지급기한 중간정산 총정리 (2026)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01191203420.html\">▸ 국민연금 조기노령연금 연기연금 신청 방법 감액률 증액률 손익분기 총정리 (2026)<\/a><\/div>\n\n<div id=\"ymyl-disclaimer\" style=\"margin-top:22px;font-size:13px;color:#666;line-height:1.6\">본 글은 정보 제공용이며 투자·세무·금융 자문이 아닙니다. 개별 세액·과세 판단은 국세청 및 금융회사의 판단에 따릅니다.<\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 세율·한도·감면율은 <b>공식 자료를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 제도는 바뀔 수 있으니 수령 전 공식 페이지를 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 퇴직할 때 IRP 돈, 한 번에 받을까 나눠 받을까? 이 선택 하나로 세금이 수백만 원 갈립니다. 핵심은 '퇴직금은 연금으로 나눠 받으면 퇴직소득세를 30~40% 깎아준다'는 것.\n2. IRP엔 세 종류 돈이 섞여 있어요. ①퇴직금(연금으로 받으면 30~40% 감면) ②내가 넣은 돈+③수익(연금이면 3.3~5.5%, 일시금이면 16.5%). 어떻게든 연금이 세금이 쌉니다.\n3. 함정은 '연 1,500만 원'. ②+③을 한 해 1,500만 원 넘게 받으면 전액 종합과세되니 쪼개 받으세요. 단 ①퇴직금과 국민연금은 이 한도와 무관! 55세 이후·10년 이상이 절세 삼박자.\n"},{"code":"F1-08","title":"보조배터리 기내 반입 규정 총정리 — 1인 2개 제한·160Wh·기내 사용 금지 (2026년 4월 20일 개정 · 액체류 100ml 라이터 포함)","lane":"pop","thumb":"132_cabin_battery.png","draft":"기내보조배터리반입_글_HTML.txt","facts":"2026-04-20 시행: 보조배터리 1인 2개(종전 100Wh 이하 5개), 용량상한 100Wh→160Wh(약 43,000mAh), 기내 사용·충전 전면 금지, 위탁 불가·선반 보관 금지. 100Wh 이하 승인불필요/100~160Wh 항공사 사전승인/160Wh 초과 반입불가. Wh=mAh×3.7÷1000(정부발표 100Wh≈27000mAh·160Wh≈43000mAh와 3.7V에서만 일치 — 교차검증됨). 액체 100ml·1L 지퍼백은 국제선만(국내선 제한없음), 단 의약품·만6세이하 유아용품은 필요분량 예외이나 검색대 진입 전 증빙 제시 필요. 라이터 1인 1개 기내만. 출처=정책브리핑 148962298·148939574·인천공항 제한물품/FAQ·서울지방항공청 액체류 지침·ICAO. [범위경계] 이 글은 위험물·금지품목 축 — 무게·크기·초과요금은 별도 초안 국내선LCC수하물(F2-11) 소관이므로 연속 발행 주의","added":"2026-07-27","thumb_data":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCACIAQQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQID ign:center;background:linear-gradient(90deg,#7C5CE0,#3b7fd0);color:#fff !important;font-weight:800;font-size:17px;padding:15px 18px;border-radius:12px;text-decoration:none;margin:22px 0}\n.lsg table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:15px}\n.lsg th,.lsg td{border:1px solid #e0d7f6;padding:10px 12px;text-align:center}\n.lsg th{background:#f0ebfc}\n.lsg .tip{background:#f4f1fd;border:1px solid #ded4f7;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .warn{background:#fff3f3;border:1px solid #f6cccc;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .end{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:16px 20px;margin-top:24px}\n.lsg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#f4f1fd;border:1px solid #ded4f7;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#6544cc;margin-bottom:8px}\n.lsg .rel a{display:block;color:#5a3cc0;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#9a92aa;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>공항 보안검색대에서 가장 자주 멈춰 서는 물건이 <b>보조배터리<\/b>입니다. 그런데 이 규정이 <b>2026년 4월 20일부터 크게 바뀌었습니다.<\/b> 예전에는 <b>100Wh 이하를 5개까지<\/b> 가지고 탈 수 있었지만, 지금은 <b>1인당 2개<\/b>로 줄었습니다. 대신 <b>용량 상한은 100Wh에서 160Wh로 올라갔고<\/b>, <b>기내에서 쓰거나 충전하는 것은 아예 금지<\/b>됐습니다. 인터넷에 남아 있는 \"5개까지 됩니다\" 같은 설명은 <b>지금은 틀린 정보<\/b>입니다. 이 글에서는 <b>내 보조배터리가 몇 Wh인지 계산하는 법, 개수·용량 기준, 위탁수하물에 넣으면 안 되는 것, 액체류 100ml 규정, 그리고 공항에서 실제로 뺏기는 5가지 경우<\/b>까지 공식 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 2026년 4월 20일, 무엇이 바뀌었나 (개정 전·후 비교)<\/a><a href=\"#sec2\">2. 내 보조배터리는 몇 Wh인가 — mAh 환산 계산<\/a><a href=\"#sec3\">3. 개수·용량 기준 한 장 정리 (100Wh·160Wh)<\/a><a href=\"#sec4\">4. 기내에서 하면 안 되는 것 — 사용·충전·선반 보관<\/a><a href=\"#sec5\">5. 위탁 vs 기내, 어디에 넣어야 하나 (판단표)<\/a><a href=\"#sec6\">6. 액체류 100ml·1L 지퍼백 — 국내선은 다릅니다<\/a><a href=\"#sec7\">7. 공항에서 실제로 걸리는 5가지<\/a><a href=\"#sec8\">8. 자주 묻는 질문<\/a><a href=\"#sec9\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec2\">👉 내 보조배터리 Wh 계산법 바로 보기<\/a>\n\n<h2 id=\"sec1\">1. 2026년 4월 20일, 무엇이 바뀌었나 (개정 전·후 비교)<\/h2>\n<p>2025년 1월 김해공항 <b>에어부산 항공기 화재<\/b>를 계기로, 국토교통부는 리튬이온 보조배터리 안전관리를 단계적으로 강화해 왔습니다. 2025년 3월에 <b>선반 보관 금지·절연 의무<\/b>가 먼저 시행됐고, <b>2026년 4월 20일부터는 개수와 용량 기준까지 바뀌었습니다.<\/b><\/p>\n<table>\n<tr><th>구분<\/th><th>개정 전<\/th><th>2026년 4월 20일부터<\/th><\/tr>\n<tr><td><b>1인당 개수<\/b><\/td><td>100Wh 이하 <b>5개<\/b><\/td><td><b>2개<\/b>로 축소<\/td><\/tr>\n<tr><td><b>용량 상한<\/b><\/td><td>100Wh(약 27,000mAh)<\/td><td><b>160Wh(약 43,000mAh)<\/b>로 상향<\/td><\/tr>\n<tr><td><b>기내 사용<\/b><\/td><td>충전만 금지<\/td><td><b>사용·충전 모두 전면 금지<\/b><\/td><\/tr>\n<tr><td><b>위탁수하물<\/b><\/td><td colspan=\"2\"><b>불가<\/b> (반드시 직접 휴대 — 변동 없음)<\/td><\/tr>\n<tr><td><b>보관 위치<\/b><\/td><td colspan=\"2\">선반 금지, 몸에 소지하거나 좌석 앞주머니 (변동 없음)<\/td><\/tr>\n<\/table>\n<p>정리하면 <b>\"개수는 줄고, 용량은 늘고, 쓰는 건 막혔다\"<\/b>입니다. 큰 배터리 하나를 들고 타는 사람에게는 유리해졌고, 작은 배터리를 여러 개 챙기던 사람에게는 불리해진 개정입니다.<\/p>\n<div class=\"tip\"><b>💡 이 기준은 한국만의 규정이 아닙니다<\/b><p style=\"margin:8px 0 0\">국토교통부가 국제민간항공기구(<b>ICAO<\/b>)에 제안한 이 방안이 <b>ICAO 이사회 승인을 거쳐 국제기준(위험물 항공운송 기술지침)으로 반영<\/b>됐습니다. 즉 <b>국적기·외국항공사, 국내선·국제선을 가리지 않고<\/b> 같은 방향으로 적용된다고 보면 됩니다. 다만 <b>세부 운영은 항공사마다 조금씩 다를 수 있으니<\/b>, 탑승할 항공사 공지를 한 번 확인하는 것이 안전합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 내 보조배터리는 몇 Wh인가 — mAh 환산 계산<\/h2>\n<p>규정은 <b>Wh(와트시)<\/b> 기준인데, 시중 보조배터리에는 대부분 <b>mAh(밀리암페어시)<\/b>만 크게 적혀 있습니다. 그래서 직접 환산해야 합니다. 공식은 간단합니다.<\/p>\n<div class=\"tip\"><b>🔢 환산 공식<\/b><p style=\"margin:8px 0 0\"><b>Wh = mAh × 전압(V) ÷ 1,000<\/b><br>리튬이온 셀의 <b>공칭전압은 보통 3.7V<\/b>입니다. 제품 뒷면에 <b>Wh가 직접 적혀 있으면 그 숫자가 우선<\/b>이고, 없을 때만 아래처럼 계산합니다.<\/p><\/div>\n<table>\n<tr><th>표기 용량<\/th><th>계산 (× 3.7V ÷ 1,000)<\/th><th>Wh<\/th><th>판정<\/th><\/tr>\n<tr><td>10,000mAh<\/td><td>10,000 × 3.7 ÷ 1,000<\/td><td><b>37Wh<\/b><\/td><td>승인 없이 반입<\/td><\/tr>\n<tr><td>20,000mAh<\/td><td>20,000 × 3.7 ÷ 1,000<\/td><td><b>74Wh<\/b><\/td><td>승인 없이 반입<\/td><\/tr>\n<tr><td>27,000mAh<\/td><td>27,000 × 3.7 ÷ 1,000<\/td><td><b>약 100Wh<\/b><\/td><td>승인 없이 반입되는 경계선<\/td><\/tr>\n<tr><td>43,000mAh<\/td><td>43,000 × 3.7 ÷ 1,000<\/td><td><b>약 159Wh<\/b><\/td><td>항공사 승인 필요 (상한 근처)<\/td><\/tr>\n<tr><td>50,000mAh<\/td><td>50,000 × 3.7 ÷ 1,000<\/td><td><b>185Wh<\/b><\/td><td><b>반입 불가<\/b><\/td><\/tr>\n<\/table>\n<p>시중에서 가장 흔한 <b>10,000~20,000mAh 제품은 37~74Wh<\/b>라서, 개수만 2개 이내로 지키면 그대로 들고 타면 됩니다. <b>문제는 캠핑용·노트북 충전용으로 파는 대용량 제품<\/b>입니다. 50,000mAh급은 계산해 보면 <b>185Wh로 상한(160Wh)을 넘어 아예 못 탑니다.<\/b><\/p>\n<div class=\"warn\"><b>⚠️ 5V로 계산하면 두 배 가까이 틀립니다<\/b><p style=\"margin:8px 0 0\">USB 출력이 5V라서 <b>\"20,000mAh × 5V = 100Wh\"<\/b>로 계산하는 분이 많은데, 이건 <b>틀린 계산<\/b>입니다. 규정에서 쓰는 값은 <b>셀의 공칭전압 3.7V<\/b> 기준이라 실제로는 <b>74Wh<\/b>입니다. 5V로 계산하면 멀쩡히 반입되는 배터리를 스스로 \"안 된다\"고 두고 오게 됩니다. 반대로 <b>제품에 Wh가 인쇄돼 있는데도 mAh로 다시 계산할 필요는 없습니다<\/b> — 표기값이 기준입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 개수·용량 기준 한 장 정리 (100Wh·160Wh)<\/h2>\n<p>용량 구간에 따라 <b>그냥 되는 것 / 항공사 승인이 필요한 것 / 아예 안 되는 것<\/b> 셋으로 갈립니다.<\/p>\n<table>\n<tr><th>용량<\/th><th>기내 반입<\/th><th>필요한 절차<\/th><\/tr>\n<tr><td><b>100Wh 이하<\/b><br>(약 27,000mAh 이하)<\/td><td>가능<\/td><td>별도 승인 <b>불필요<\/b><\/td><\/tr>\n<tr><td><b>100Wh 초과 ~ 160Wh 이하<\/b><br>(약 43,000mAh 이하)<\/td><td>가능<\/td><td><b>항공사 사전 승인 필요<\/b><\/td><\/tr>\n<tr><td><b>160Wh 초과<\/b><\/td><td><b>불가<\/b><\/td><td>기내·위탁 모두 반입 금지<\/td><\/tr>\n<\/table>\n<p>여기에 <b>1인당 2개<\/b>라는 개수 제한이 함께 걸립니다. 즉 <b>37Wh짜리 작은 배터리라도 3개를 가져가면 1개는 두고 가야 합니다.<\/b> 개수 제한은 용량과 무관하게 적용된다고 이해하는 편이 안전합니다.<\/p>\n<div class=\"tip\"><b>💡 노트북·카메라에 들어 있는 배터리는 별개입니다<\/b><p style=\"margin:8px 0 0\">2개 제한은 <b>보조배터리(휴대용 충전기)<\/b>에 대한 것입니다. <b>노트북·카메라·휴대폰에 장착된 내장 배터리<\/b>는 기기의 일부라 이 개수에 들어가지 않습니다. 다만 <b>카메라 여분 배터리처럼 기기에서 분리된 리튬배터리<\/b>는 보조배터리와 마찬가지로 <b>위탁 불가·절연 후 기내 휴대<\/b>가 원칙이고, 개수는 항공사 기준을 따르니 여러 개를 챙긴다면 미리 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 기내에서 하면 안 되는 것 — 사용·충전·선반 보관<\/h2>\n<p>2026년 개정에서 실제 탑승객이 가장 크게 체감하는 부분입니다. <b>가지고 타는 것은 되지만, 쓰는 것은 안 됩니다.<\/b><\/p>\n<ul>\n<li><b>보조배터리 자체를 충전하는 것<\/b> — 금지. 좌석 USB 포트에 꽂아 보조배터리를 채우는 행동이 여기 해당합니다.<\/li>\n<li><b>보조배터리로 휴대폰·태블릿을 충전하는 것<\/b> — 금지. 개정 전에는 가능했지만 지금은 막혔습니다.<\/li>\n<li><b>머리 위 선반(오버헤드 빈)에 넣는 것<\/b> — 금지. 연기·발열이 시작돼도 발견이 늦기 때문입니다.<\/li>\n<\/ul>\n<p>대신 <b>몸에 지니거나, 좌석 앞주머니 또는 앞좌석 아래<\/b>처럼 <b>본인 손이 즉시 닿는 곳<\/b>에 두어야 합니다. 보관 전에는 <b>단자가 금속에 닿지 않도록<\/b> 절연테이프를 붙이거나 <b>보호 파우치·지퍼백<\/b>에 넣습니다. 지퍼백은 <b>체크인 카운터와 기내에 단락방지용 투명 비닐봉투가 비치<\/b>돼 있어 현장에서 받을 수도 있습니다.<\/p>\n<div class=\"warn\"><b>⚠️ 기내에서 승무원이 제지하면 따라야 합니다<\/b><p style=\"margin:8px 0 0\">\"조금만 충전하겠다\"는 실랑이는 좋을 것이 없습니다. 기내에서는 <b>안전에 관한 승무원의 지시에 따를 의무<\/b>가 있고, 불응하면 항공보안법상 문제가 될 수 있습니다. <b>비행 중 쓸 전력이 필요하다면 출발 전에 휴대폰을 미리 100% 충전<\/b>해 두고, 장거리라면 <b>좌석 전원(USB·AC)이 제공되는지<\/b>를 예약 단계에서 확인하는 편이 현실적입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 위탁 vs 기내, 어디에 넣어야 하나 (판단표)<\/h2>\n<p>헷갈리는 물건일수록 <b>\"불이 날 수 있는 것은 기내로, 다칠 수 있는 것은 위탁으로\"<\/b>가 기본 원리입니다. 배터리는 눈에 보이는 곳에 둬야 초기 진화가 되고, 칼·공구는 객실에 없어야 안전하기 때문입니다.<\/p>\n<table>\n<tr><th>물건<\/th><th>기내 휴대<\/th><th>위탁수하물<\/th><\/tr>\n<tr><td><b>보조배터리<\/b><\/td><td>○ (2개·160Wh 이하)<\/td><td><b>× 금지<\/b><\/td><\/tr>\n<tr><td><b>전자담배·기기<\/b><\/td><td>○<\/td><td><b>× 금지<\/b><\/td><\/tr>\n<tr><td><b>라이터·소형 안전성냥<\/b><\/td><td>○ <b>1인 1개<\/b><\/td><td><b>× 금지<\/b><\/td><\/tr>\n<tr><td>딱성냥(마찰성냥)·대형 곽성냥<\/td><td>×<\/td><td>×<\/td><\/tr>\n<tr><td>과도·가위·공구류<\/td><td>×<\/td><td>○<\/td><\/tr>\n<tr><td>액체류 100ml 초과<br>(화장품·김치·젓갈·장류)<\/td><td>×<\/td><td>○ (용량 제한 없음)<\/td><\/tr>\n<\/table>\n<p>표에서 특히 <b>위쪽 세 줄이 반대로 헷갈리는 항목<\/b>입니다. 보조배터리·전자담배·라이터는 <b>\"짐에 부치면 안 되고 반드시 몸에 지녀야 하는\"<\/b> 물건입니다. 캐리어에 넣어 부쳤다가 <b>보안검색에서 걸려 짐이 열리고, 출발 직전에 호출<\/b>되는 일이 흔합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 액체류 100ml·1L 지퍼백 — 국내선은 다릅니다<\/h2>\n<p>보조배터리와 함께 가장 많이 걸리는 것이 <b>액체·젤류<\/b>입니다. 국제선 출발 시 기준은 이렇습니다.<\/p>\n<ul>\n<li>개별 용기는 <b>100ml 이하<\/b>여야 합니다. <b>용기 표시 용량 기준<\/b>이라, 500ml 통에 조금만 남았어도 반입이 안 됩니다.<\/li>\n<li>이 용기들을 <b>1인당 1개, 1L 규격의 투명 지퍼백<\/b>에 넣고 <b>지퍼를 잠근 상태<\/b>로 보안검색에 제출합니다.<\/li>\n<li>화장품·세면용품·젤·치약·선크림·액체 화장품이 모두 대상입니다.<\/li>\n<li><b>단, 의약품과 유아용 식품은 예외입니다.<\/b> 목적지 도착 때까지 필요하다고 인정되는 <b>의약품<\/b>, 그리고 <b>만 6세 이하 어린이를 동반한 승객의 유아용품<\/b>(우유·물·주스·죽 형태의 이유식·물티슈 등)은 <b>여행 중 사용할 분량에 한해 100ml를 넘어도<\/b> 기내에 가지고 탈 수 있습니다.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ 예외를 인정받으려면 '검색대 들어가기 전에' 말해야 합니다<\/b><p style=\"margin:8px 0 0\">의약품·유아식은 <b>자동으로 통과되는 것이 아닙니다.<\/b> 필요한 양인지 판단하기 위해 <b>보안검색 요원에게 증빙서(처방전·소견서·약봉투 등)를 제시<\/b>해야 하고, <b>검색대에 진입하기 전에 미리 알려<\/b> 확인받아야 합니다. 지퍼백 안에 말없이 넣어 두면 일반 액체로 분류돼 걸립니다. 혈압약·당뇨약처럼 <b>매일 복용하는 액상 약이나 주사제<\/b>가 있다면 <b>처방전 사본을 함께 챙기는 것<\/b>이 가장 확실합니다.<\/p><\/div>\n<div class=\"tip\"><b>💡 국내선에는 이 액체 제한이 없습니다<\/b><p style=\"margin:8px 0 0\">100ml·1L 지퍼백 규정은 <b>국제선 기준<\/b>입니다. <b>국내선은 액체류 용량 제한이 적용되지 않습니다.<\/b> 반대로 <b>보조배터리 규정은 국내선에도 그대로 적용<\/b>되니, \"제주도 갈 땐 괜찮겠지\"는 통하지 않습니다. <b>액체=국제선만, 배터리=전부<\/b>로 외워두면 헷갈리지 않습니다.<\/p><\/div>\n<div class=\"warn\"><b>⚠️ 면세점에서 산 술·화장품은 '봉투를 뜯는 순간' 규정이 깨집니다<\/b><p style=\"margin:8px 0 0\">공항 면세점에서 구입한 액체는 <b>액체물 면세품 전용봉투(STEB)에 밀봉된 상태<\/b>라면 100ml를 넘어도 반입할 수 있습니다. 단 <b>최종 목적지에 도착할 때까지 개봉하지 않아야<\/b> 합니다. <b>중간에 환승<\/b>하면서 봉투를 뜯거나, 영수증이 봉투 안에 없으면 <b>환승 공항 보안검색에서 압수<\/b>될 수 있습니다. 환승 일정이 있다면 <b>구입 시점에 \"환승한다\"고 말하고<\/b> 밀봉 상태를 유지하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 공항에서 실제로 걸리는 5가지<\/h2>\n<p>규정을 몰라서라기보다, <b>옛날 기준을 기억하고 있어서<\/b> 걸리는 경우가 대부분입니다.<\/p>\n<ol>\n<li><b>보조배터리를 3개 이상 챙긴 경우<\/b> — 예전 기준(5개)을 기억하고 작은 것들을 여러 개 넣은 사례입니다. 지금은 <b>2개<\/b>가 상한입니다.<\/li>\n<li><b>대용량 배터리를 캐리어에 넣어 부친 경우<\/b> — 용량과 무관하게 <b>위탁 자체가 금지<\/b>입니다. 짐이 다시 열리고 탑승 시간이 촉박해집니다.<\/li>\n<li><b>50,000mAh급 캠핑용 배터리<\/b> — <b>185Wh로 160Wh 상한 초과<\/b>라 기내·위탁 모두 불가입니다. 공항에서 방법이 없습니다.<\/li>\n<li><b>여행용 화장품을 큰 통째로 넣은 경우<\/b> — 국제선은 <b>용기 표시 용량이 100ml 이하<\/b>여야 합니다. 소분 용기에 옮겨 담아야 합니다.<\/li>\n<li><b>일회용 라이터를 여러 개 넣은 경우<\/b> — <b>1인 1개<\/b>만 몸에 지닐 수 있고, 위탁은 불가입니다.<\/li>\n<\/ol>\n<div class=\"tip\"><b>💡 출발 전날 5분이면 끝나는 점검<\/b><p style=\"margin:8px 0 0\">① 보조배터리를 <b>모두 꺼내 개수를 세고(2개 이하)<\/b> ② 표기된 <b>mAh 또는 Wh<\/b>를 확인하고 ③ <b>지퍼백이나 파우치<\/b>에 하나씩 넣어 ④ <b>기내용 가방<\/b>에 옮기면 끝입니다. 100Wh를 넘는 제품이 있다면 <b>항공사 고객센터에 사전 승인을 문의<\/b>해 두세요. 공항에서 처음 알게 되면 되돌릴 방법이 거의 없습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 자주 묻는 질문<\/h2>\n<h3>Q. 2개 제한이 부부·가족이면 합산인가요?<\/h3>\n<p><b>1인당 2개<\/b> 기준입니다. 성인 2명이면 각자 2개씩 소지할 수 있습니다. 다만 <b>한 사람 가방에 4개를 몰아 넣으면<\/b> 보안검색에서 설명이 필요해질 수 있으니, <b>각자 나눠서 소지<\/b>하는 편이 깔끔합니다.<\/p>\n<h3>Q. 제 배터리에 mAh도 Wh도 안 적혀 있으면요?<\/h3>\n<p>표기가 지워졌거나 없는 제품은 <b>용량 확인이 안 돼 반입이 거절될 수 있습니다.<\/b> 규정 준수 여부를 증명할 방법이 없기 때문입니다. 표기가 선명한 제품으로 바꿔 가시는 것을 권합니다.<\/p>\n<h3>Q. 100Wh 초과 제품의 '항공사 승인'은 어떻게 받나요?<\/h3>\n<p>항공사 <b>고객센터 또는 예약 페이지의 위험물 안내<\/b>를 통해 사전에 문의·신청합니다. <b>당일 카운터에서 즉석 승인<\/b>이 되는 것을 전제로 계획하지 마세요. 항공사에 따라 절차와 소요 시간이 다릅니다.<\/p>\n<h3>Q. 기내에서 노트북은 써도 되나요?<\/h3>\n<p><b>기기 내장 배터리로 작동하는 노트북·태블릿 사용은 제한 대상이 아닙니다.<\/b> 이번에 금지된 것은 <b>보조배터리의 사용·충전<\/b>입니다. 다만 이착륙 시 전자기기 사용은 항공사 안내를 따르세요.<\/p>\n<h3>Q. 전자담배는 기내에서 피울 수 있나요?<\/h3>\n<p>없습니다. <b>기내 흡연은 전자담배를 포함해 금지<\/b>이고, <b>충전도 안 됩니다.<\/b> 전자담배 기기는 <b>위탁수하물에 넣을 수 없어<\/b> 반드시 몸에 지녀야 하며, <b>니코틴 액상은 액체류 규정(용기당 100ml 이하·1L 지퍼백)<\/b>을 그대로 따릅니다.<\/p>\n<h3>Q. 규정을 어기면 어떻게 되나요?<\/h3>\n<p>보안검색 단계에서는 <b>해당 물품의 반입이 거절<\/b>됩니다(포기 또는 별도 처리). 기내에서는 <b>승무원의 안전 지시에 따라야<\/b> 하며, 불응 시 항공보안법에 따른 조치 대상이 될 수 있습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 국토교통부 · 인천국제공항공사 (공식)<\/b><a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148962298\" target=\"_blank\" rel=\"nofollow\">▸ 정책브리핑 — 보조배터리 1인 2개 제한 시행 안내<\/a><a href=\"https://www.airport.kr/ap_ko/906/subview.do\" target=\"_blank\" rel=\"nofollow\">▸ 인천공항 제한물품 — 기내 반입·위탁 금지 품목<\/a><a href=\"https://www.airport.kr/ap/ko/dep/rstrtItemFaqList.do\" target=\"_blank\" rel=\"nofollow\">▸ 인천공항 제한물품 FAQ — 라이터·액체류·배터리 문답<\/a><a href=\"https://www.molit.go.kr/sroa/USR/WPGE0201/m_35686/DTL.jsp\" target=\"_blank\" rel=\"nofollow\">▸ 서울지방항공청 — 액체류 기내반입 제한 안내(의약품·유아용품 예외)<\/a><a href=\"https://www.molit.go.kr/\" target=\"_blank\" rel=\"nofollow\">▸ 국토교통부 — 항공 위험물 안전관리 보도자료<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">핵심은 세 가지입니다. <b>보조배터리는 1인 2개까지, 160Wh(약 43,000mAh)를 넘으면 아예 못 타고, 기내에서는 쓰지도 충전하지도 못합니다.<\/b> 100Wh(약 27,000mAh)를 넘으면 <b>항공사 사전 승인<\/b>이 필요하니 출발 전에 처리해 두세요. 위탁수하물에는 <b>보조배터리·전자담배·라이터를 넣을 수 없고<\/b>, 액체류 100ml 규정은 <b>국제선에만<\/b> 적용됩니다. 출발 전날 <b>배터리를 꺼내 개수와 용량 표기만 확인<\/b>해도 공항에서 물건을 잃을 일은 거의 없습니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 항공사·공항별 세부 운영 기준은 다를 수 있습니다. 특히 <b>100Wh 초과 제품의 승인 절차<\/b>는 탑승할 항공사 공지를 직접 확인하세요.<br>본문의 Wh 환산은 <b>3.7V 기준<\/b>이며, 정부 발표가 밝힌 <b>100Wh≈27,000mAh · 160Wh≈43,000mAh<\/b>라는 대응값과 정확히 일치하는 계산입니다.<br>출처: 국토교통부 보조배터리 기내 안전관리 강화 방안(2026년 4월 20일 시행), 대한민국 정책브리핑, 인천국제공항공사 제한물품 안내 및 FAQ, 국토교통부 액체·젤류 항공보안 통제 지침(의약품·유아용품 예외), ICAO 위험물 항공운송 기술지침 반영 사항. 인천공항 안내 1577-2600<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_0653105371.html\">▸ 인천공항 스마트패스 등록 방법 전용라인 출국시간 단축 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_372.html\">▸ 해외여행 준비물 체크리스트 올인원 가이드<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_0459503221.html\">▸ 항공기 결항·지연 보상 신청 방법 기준표 면책 사유 총정리<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 개수·용량 기준과 금지 품목은 <b>국토교통부 정책브리핑과 인천국제공항공사 제한물품 안내를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 항공사별 세부 운영은 탑승 전 공식 공지를 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 보조배터리 기내 반입 규정이 2026년 4월 20일부터 바뀌었습니다. 예전엔 100Wh 이하 5개까지였는데 지금은 1인당 2개예요. 대신 용량 상한은 100Wh에서 160Wh(약 43,000mAh)로 올라갔습니다. \"5개까지 된다\"는 설명은 지금은 틀린 정보입니다.\n2. 내 배터리가 몇 Wh인지는 mAh × 3.7 ÷ 1,000으로 계산합니다. 10,000mAh=37Wh, 20,000mAh=74Wh, 27,000mAh≈100Wh. USB 출력 5V로 계산하면 두 배 가까이 틀리게 나오니 주의하세요. 50,000mAh급 캠핑용은 185Wh라 기내·위탁 둘 다 불가입니다.\n3. 기내에서 보조배터리로 휴대폰 충전하는 것도 이제 금지입니다. 선반에 넣는 것도 안 되고 몸에 지니거나 좌석 앞주머니에 둬야 해요. 보조배터리·전자담배·라이터(1인 1개)는 캐리어에 부치면 안 되고 반드시 손에 들고 타야 합니다. 액체 100ml 규정은 국제선만, 배터리 규정은 국내선에도 적용됩니다.\n"},{"code":"A3-08","title":"국민연금 분할연금 신청 방법 자격 이혼 배우자 수령액 총정리 (2026 혼인기간 5년)","lane":"info","thumb":"129_pension_split.png","draft":"국민연금분할연금_글_HTML.txt","facts":"요건4=①배우자 가입기간 중 혼인기간 5년 이상 ②이혼 ③전배우자 노령연금 수급권자 ④본인 지급개시연령(1953~56:61 / 57~60:62 / 61~64:63 / 65~68:64 / 1969~:65) || 금액=노령연금(부양가족연금 제외)×(혼인기간 중 가입월수÷전체 가입월수)÷2, 균등1/2 원칙이나 2016-12-30 이후 지급사유분은 협의·재판으로 비율 변경 가능 || 기한=수급권 발생일로부터 5년(제척기간, 지나면 권리 소멸) / 선청구=이혼 효력 발생일로부터 3년 이내 || 혼인기간에서 실질적 혼인관계 부존재 기간 제외(실종선고·거주불명·합의/재판상 별거, 2017-12-19 개정) || 재혼해도 계속 지급+본인 노령연금과 합산 지급(2007-07-23 개정) || 수급권 취득 후 전배우자 사유로 노령연금 소멸·정지돼도 영향 없음(법 제65조①) || 대법원 2019.6.13. 2018두65088=재산분할 조정조서·협의서에 연금 분할 비율 명시 없으면 '별도 결정'으로 인정 안 됨(균등 원칙) || 신청=방문·우편·팩스·ARS·정부24·모바일앱, 서류=분할연금지급청구서·신분증·혼인관계증명서(주민번호 포함)·예금계좌, 1355 || 법 제64조의4 분할연금 수급권 포기(전배우자와 재혼 등) || V0 4/4 PASS: 계산예시(3단계 공식+사례2)·판단형비교(선청구vs일반/균등vs협의)·탈락사유6·함정5 || dupcheck 🟢 신규 || 출처=nps.or.kr 분할연금 안내·law.go.kr 국민연금법 개정이유(2007/2015/2017)·대법원 2018두65088 || ⚠️A3-07은 임의계속가입이 선점해 A3-08 배정","added":"2026-07-25","thumb_data":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAA ne;font-weight:600}\n.lsg .rel{background:#eefaf7;border:1px solid #cfeee6;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#1a8c78;margin-bottom:8px}\n.lsg .rel a{display:block;color:#1f6f61;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#93a7a1;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">정부지원·복지<\/span>\n<p>이혼할 때 재산은 나눴는데 <b>국민연금은 어떻게 되는지<\/b> 모르고 넘어가는 경우가 많습니다. 결혼 기간 동안 배우자가 쌓은 국민연금 중 <b>내 몫을 평생 매달 받을 수 있는 제도<\/b>가 <b>분할연금<\/b>입니다. 그런데 이 제도는 <b>가만히 있으면 자동으로 주지 않고<\/b>, 요건을 하나라도 못 채우거나 <b>기한(5년)을 넘기면 그대로 사라집니다.<\/b> 받을 수 있는 사람·못 받는 사람, 얼마가 나오는지 계산하는 법, 언제까지 청구해야 하는지를 국민연금공단·국민연금법 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 분할연금이란 — 재산분할과 뭐가 다른가<\/a><a href=\"#sec2\">2. 받을 수 있는 사람 — 요건 4가지<\/a><a href=\"#value-add\">3. 얼마 나오나 — 3단계 계산법과 사례 2개<\/a><a href=\"#sec3\">4. 청구 기한 5년 · 선청구 3년 (가장 많이 놓치는 부분)<\/a><a href=\"#sec4\">5. 못 받는 경우 6가지 (탈락 사유)<\/a><a href=\"#sec5\">6. 오해하기 쉬운 함정 5가지<\/a><a href=\"#sec6\">7. 신청 방법 · 필요서류<\/a><a href=\"#sec7\">8. 자주 묻는 질문<\/a><a href=\"#sec8\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#value-add\">👉 내 분할연금액이 얼마인지 계산부터 보기<\/a>\n<h2 id=\"sec1\">1. 분할연금이란 — 재산분할과 뭐가 다른가<\/h2>\n<p>분할연금은 <b>혼인 기간 중 배우자가 쌓은 국민연금 가입기간에 대해, 그 노령연금의 일부를 이혼한 배우자에게 나눠 지급하는 제도<\/b>입니다. 전업주부처럼 소득활동을 하지 않았더라도 <b>가사·양육으로 배우자의 연금 형성에 기여했다고 보는 것<\/b>이 제도의 취지입니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>이혼 재산분할<\/th><th>분할연금<\/th><\/tr>\n<tr><td>주는 곳<\/td><td>상대 배우자(당사자)<\/td><td><b>국민연금공단<\/b><\/td><\/tr>\n<tr><td>받는 방식<\/td><td>합의·판결에 따라 <b>일시<\/b> 정산이 보통<\/td><td><b>매달, 평생<\/b> 지급<\/td><\/tr>\n<tr><td>물가 반영<\/td><td>없음<\/td><td><b>매년 물가상승률만큼 인상<\/b><\/td><\/tr>\n<tr><td>청구 상대<\/td><td>법원·상대방<\/td><td>공단에 <b>본인이 직접 청구<\/b><\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 핵심 한 줄<\/b><p style=\"margin:8px 0 0\">재산분할을 이미 끝냈어도 <b>분할연금은 별개로 청구<\/b>할 수 있습니다. 다만 이혼 절차에서 <b>연금 분할을 다르게 정하기로 명시 합의<\/b>했다면 그 내용이 우선합니다(6번 함정 참고).<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec2\">2. 받을 수 있는 사람 — 요건 4가지<\/h2>\n<p>아래 <b>네 가지를 모두<\/b> 충족해야 합니다. 하나라도 빠지면 지급되지 않습니다.<\/p>\n<table>\n<tr><th>요건<\/th><th>내용<\/th><\/tr>\n<tr><td><b>① 혼인기간 5년 이상<\/b><\/td><td>단순 결혼 기간이 아니라 <b>배우자의 국민연금 가입기간 중 혼인기간<\/b>이 5년 이상이어야 합니다<\/td><\/tr>\n<tr><td><b>② 이혼<\/b><\/td><td>협의이혼·재판상 이혼 모두 해당<\/td><\/tr>\n<tr><td><b>③ 전 배우자가 노령연금 수급권자<\/b><\/td><td>상대방이 노령연금을 받을 수 있는 상태여야 합니다(이혼 후 수급권을 취득한 경우도 포함)<\/td><\/tr>\n<tr><td><b>④ 본인이 지급개시연령 도달<\/b><\/td><td>출생연도에 따라 <b>61~65세<\/b><\/td><\/tr>\n<\/table>\n<h3>본인의 지급개시연령 (출생연도별)<\/h3>\n<table>\n<tr><th>출생연도<\/th><th>1953~56년<\/th><th>1957~60년<\/th><th>1961~64년<\/th><th>1965~68년<\/th><th>1969년 이후<\/th><\/tr>\n<tr><td><b>지급개시연령<\/b><\/td><td>61세<\/td><td>62세<\/td><td>63세<\/td><td>64세<\/td><td><b>65세<\/b><\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>⚠️ '혼인기간 5년'에서 빠지는 기간이 있습니다<\/b><p style=\"margin:8px 0 0\">2017년 12월 법 개정으로, <b>별거·가출 등으로 실질적인 혼인관계가 존재하지 않았던 기간은 혼인기간에서 제외<\/b>됩니다. 여기에 해당하는 것은 <b>법원의 실종선고 기간, 거주불명 등록 기간, 당사자 합의나 법원 재판으로 정해진 별거 기간<\/b> 등입니다. 즉 <b>서류상 결혼 기간이 7년이어도 별거 3년이 인정되면 4년<\/b>이 되어 5년 요건에서 탈락할 수 있습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"value-add\">3. 얼마 나오나 — 3단계 계산법과 사례 2개<\/h2>\n<p>분할연금액은 <b>\"배우자의 노령연금 전액의 절반\"이 아닙니다.<\/b> 법에서 정한 계산은 다음과 같습니다.<\/p>\n<div class=\"tip\"><b>📐 계산 공식 3단계<\/b>\n<p style=\"margin:8px 0 0\"><b>1단계<\/b> 전 배우자의 <b>노령연금액<\/b>에서 <b>부양가족연금액을 뺍니다<\/b>(부양가족연금은 분할 대상이 아님)<br>\n<b>2단계<\/b> 거기서 <b>혼인기간에 해당하는 몫<\/b>만 뽑습니다 → <b>연금액 × (혼인기간 중 가입월수 ÷ 전체 가입월수)<\/b><br>\n<b>3단계<\/b> 그 금액을 <b>균등하게(1/2)<\/b> 나눕니다<\/p><\/div>\n\n<h3>사례 ① 혼인기간이 가입기간의 절반인 경우<\/h3>\n<ul>\n<li>전 배우자 노령연금 <b>월 100만 원<\/b>(부양가족연금 제외)<\/li>\n<li>전체 가입기간 <b>300개월<\/b>, 그중 <b>혼인기간 중 가입기간 150개월<\/b><\/li>\n<\/ul>\n<table>\n<tr><th>단계<\/th><th>계산<\/th><th>결과<\/th><\/tr>\n<tr><td>2단계 — 혼인기간 몫<\/td><td>100만 원 × (150 ÷ 300)<\/td><td>50만 원<\/td><\/tr>\n<tr><td>3단계 — 균등 분할<\/td><td>50만 원 × 1/2<\/td><td><b>월 25만 원<\/b><\/td><\/tr>\n<\/table>\n<p>이 경우 전 배우자는 <b>100만 원 → 75만 원<\/b>으로 줄어들고, 본인이 <b>월 25만 원<\/b>을 평생 받습니다.<\/p>\n\n<h3>사례 ② 혼인기간이 짧은 경우<\/h3>\n<ul>\n<li>전 배우자 노령연금 <b>월 120만 원<\/b><\/li>\n<li>전체 가입기간 <b>360개월<\/b>, 그중 <b>혼인기간 중 가입기간 90개월<\/b>(7년 6개월)<\/li>\n<\/ul>\n<table>\n<tr><th>단계<\/th><th>계산<\/th><th>결과<\/th><\/tr>\n<tr><td>2단계 — 혼인기간 몫<\/td><td>120만 원 × (90 ÷ 360)<\/td><td>30만 원<\/td><\/tr>\n<tr><td>3단계 — 균등 분할<\/td><td>30만 원 × 1/2<\/td><td><b>월 15만 원<\/b><\/td><\/tr>\n<\/table>\n<p>혼인기간이 <b>5년을 넘겼더라도 가입기간 전체에서 차지하는 비중이 작으면 금액도 작아집니다.<\/b> \"이혼했으니 절반\"이라는 생각과 실제 금액 차이가 가장 크게 벌어지는 지점입니다.<\/p>\n\n<h3>③ 균등(1/2) 말고 다른 비율도 가능합니다<\/h3>\n<p>원칙은 <b>균등 분할(1/2)<\/b>이지만, <b>2016년 12월 30일 이후 분할연금 지급사유가 발생<\/b>한 경우에는 <b>당사자 협의 또는 법원 재판<\/b>으로 비율을 달리 정할 수 있습니다. 이 내용은 공단에 <b>별도로 신고<\/b>해야 반영됩니다.<\/p>\n<table>\n<tr><th>어떤 경우<\/th><th>어떻게 판단하나<\/th><\/tr>\n<tr><td>혼인기간 대부분을 <b>전업으로 가사·양육<\/b>에 썼다<\/td><td>균등(1/2)이 기본이므로 <b>그대로 청구<\/b>하는 것이 단순하고 유리한 편<\/td><\/tr>\n<tr><td>이혼 협의에서 <b>다른 조건과 맞바꾸려는<\/b> 경우<\/td><td>협의·재판으로 비율 조정 가능. 단 <b>합의서에 연금 분할 비율을 명시<\/b>해야 함(6번 참고)<\/td><\/tr>\n<tr><td>상대방이 <b>연금을 포기하라<\/b>고 요구하는 경우<\/td><td>포기 여부는 신중히 — 분할연금은 <b>평생·물가연동<\/b>이라 일시금 환산액보다 클 수 있음<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>📌 내 정확한 금액을 아는 방법<\/b><p style=\"margin:8px 0 0\">위 계산은 <b>공식이 어떻게 작동하는지<\/b> 보여주는 예시입니다. 전 배우자의 실제 연금액·가입월수는 본인이 알 수 없으므로, <b>국민연금공단 1355<\/b> 또는 가까운 지사에 문의해 <b>본인 기준 예상 분할연금액<\/b>을 확인하는 것이 가장 확실합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec3\">4. 청구 기한 5년 · 선청구 3년 (가장 많이 놓치는 부분)<\/h2>\n<p>분할연금에서 <b>돈을 실제로 날리는 원인 1위가 기한<\/b>입니다. 기한이 두 종류라 헷갈리기 쉽습니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>기한<\/th><th>기산점<\/th><\/tr>\n<tr><td><b>일반 청구<\/b><\/td><td><b>5년 이내<\/b><\/td><td><b>수급권이 발생한 날<\/b>(요건 4가지를 모두 갖춘 날)<\/td><\/tr>\n<tr><td><b>선청구<\/b><\/td><td><b>3년 이내<\/b><\/td><td><b>이혼의 효력이 발생한 날<\/b><\/td><\/tr>\n<\/table>\n<p><b>선청구<\/b>는 2015년 12월 개정으로 생긴 제도로, <b>아직 연령이 안 됐어도 이혼 직후 미리 청구해 두는 것<\/b>입니다. 미리 청구해 두면 <b>나중에 요건을 모두 갖춘 시점에 자동으로 지급이 시작<\/b>됩니다.<\/p>\n<table>\n<tr><th>상황<\/th><th>어느 쪽이 나은가<\/th><\/tr>\n<tr><td>이혼했고 <b>아직 60대가 아니다<\/b><\/td><td><b>선청구를 권장<\/b> — 이혼일로부터 3년 안에 해두면 잊어버릴 위험이 사라집니다<\/td><\/tr>\n<tr><td>이혼한 지 <b>3년이 지났다<\/b><\/td><td>선청구는 불가. 요건을 모두 갖춘 뒤 <b>5년 안에<\/b> 일반 청구<\/td><\/tr>\n<tr><td>이미 <b>지급개시연령이 지났다<\/b><\/td><td><b>즉시 청구<\/b> — 수급권 발생일로부터 5년이 지나면 못 받습니다<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>⏰ 5년이 무서운 이유<\/b><p style=\"margin:8px 0 0\">이 5년은 \"늦게 청구하면 그만큼 못 받는\" 것이 아니라 <b>기간이 지나면 권리 자체가 소멸<\/b>합니다. 요건을 다 갖췄는데 모르고 있다가 6년 뒤에 알게 되면 <b>한 푼도 못 받습니다.<\/b> 이혼 경험이 있다면 <b>60세가 되기 전에 1355로 한 번 확인<\/b>해 두세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec4\">5. 못 받는 경우 6가지 (탈락 사유)<\/h2>\n<table>\n<tr><th>이런 경우<\/th><th>왜 안 되나 / 어떻게 하나<\/th><\/tr>\n<tr><td><b>혼인기간 중 가입기간이 5년 미만<\/b><\/td><td>가장 흔한 탈락. 결혼 기간이 아니라 <b>그중 배우자가 국민연금에 가입돼 있던 기간<\/b>으로 셉니다<\/td><\/tr>\n<tr><td><b>별거 기간을 빼면 5년 미달<\/b><\/td><td>실질적 혼인관계 부존재 기간(실종선고·거주불명·합의/재판상 별거)은 <b>제외<\/b><\/td><\/tr>\n<tr><td><b>전 배우자가 노령연금 수급권자가 아니다<\/b><\/td><td>상대가 가입기간 10년 미달 등으로 <b>노령연금 수급권이 없으면<\/b> 분할할 대상 자체가 없음<\/td><\/tr>\n<tr><td><b>본인이 지급개시연령 전<\/b><\/td><td>아직 나이가 안 됐다면 지금은 못 받음 → <b>선청구(이혼 후 3년 이내)<\/b>로 예약<\/td><\/tr>\n<tr><td><b>청구 기한(5년) 도과<\/b><\/td><td>수급권 발생일부터 5년이 지나면 <b>권리 소멸<\/b><\/td><\/tr>\n<tr><td><b>사실혼만 있었고 법률상 이혼이 아니다<\/b><\/td><td>분할연금은 <b>법률혼의 이혼<\/b>을 전제로 합니다. 개별 사정은 공단 상담 필요<\/td><\/tr>\n<\/table>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec5\">6. 오해하기 쉬운 함정 5가지<\/h2>\n<h3>함정 ① \"재혼하면 끊긴다\" → 아닙니다<\/h3>\n<p>2007년 7월 법 개정으로 <b>분할연금 수급권을 취득한 뒤에는 재혼해도 계속 받습니다.<\/b> 같은 개정으로 <b>본인의 노령연금과 분할연금을 함께(합산) 받을 수도<\/b> 있게 됐습니다. \"재혼하면 없어진다\"는 말 때문에 청구를 미루는 경우가 있는데, <b>사실이 아닙니다.<\/b><\/p>\n<h3>함정 ② \"전 배우자가 죽으면 끊긴다\" → 시점에 따라 갈립니다<\/h3>\n<p>국민연금법은 <b>분할연금 수급권을 취득한 뒤<\/b>에는 전 배우자에게 생긴 사유(사망 등)로 그의 노령연금 수급권이 소멸·정지되어도 <b>분할연금은 영향을 받지 않는다<\/b>고 정하고 있습니다. 반대로 <b>수급권을 갖추기 전<\/b>에 전 배우자가 사망해 노령연금 수급권 자체가 없어지면 요건 ③을 못 채웁니다. <b>여기서도 '미리 청구해 두는 것'이 방어책<\/b>이 됩니다.<\/p>\n<h3>함정 ③ 재산분할 합의서에 안 적으면 → 균등(1/2)이 원칙<\/h3>\n<p>대법원은 <b>2019년 6월 13일 선고 2018두65088<\/b> 판결에서, 이혼 재산분할 절차에서 연금 분할이 \"별도로 결정\"된 것으로 인정되려면 <b>당사자 사이에 연금의 분할 비율 등을 달리 정하기로 하는 명시적 합의가 있었거나 법원이 이를 달리 결정했음이 분명히 드러나야 한다<\/b>고 판단했습니다. 조정조서·협의서에 <b>연금 분할 비율이 적혀 있지 않다면<\/b>, 이혼배우자가 분할연금 수급권을 포기했다거나 불리한 비율에 동의했다고 <b>쉽게 단정할 수 없다<\/b>는 취지입니다. 즉 <b>합의서의 포괄적인 \"서로 청구하지 않는다\" 조항만으로는 연금 분할이 정해진 것으로 보기 어렵습니다.<\/b> 반대로 비율을 다르게 하고 싶다면 <b>반드시 명시적으로 적어야<\/b> 합니다.<\/p>\n<h3>함정 ④ \"이혼하면 공단이 알아서 준다\" → 직접 청구해야 합니다<\/h3>\n<p>이혼 사실을 공단이 안다고 해서 자동 지급되지 않습니다. <b>본인이 청구서를 내야<\/b> 시작됩니다. 그래서 기한(5년/선청구 3년)이 결정적입니다.<\/p>\n<h3>함정 ⑤ \"내가 받으면 전 배우자 연금은 그대로\" → 줄어듭니다<\/h3>\n<p>분할연금은 <b>새로 만들어 주는 돈이 아니라 전 배우자의 노령연금에서 떼어 오는 돈<\/b>입니다. 그래서 원 수급자의 연금액은 그만큼 줄어듭니다. 이혼 상대방과 갈등이 생길 수 있는 지점이지만, <b>법이 정한 권리<\/b>라는 점은 분명합니다.<\/p>\n<!-- [운영자 경험 자리] 지인/가족의 분할연금 상담 경험이 있으면 1~2문장. 없으면 비워둠 -->\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec6\">7. 신청 방법 · 필요서류<\/h2>\n<ol>\n<li><b>신청 방법<\/b>: <b>지사 방문, 우편, 팩스, ARS, 인터넷(정부24), 모바일 앱<\/b> 모두 가능합니다. 전화 문의는 <b>국민연금공단 1355<\/b>(평일 09~18시).<\/li>\n<li><b>필요 서류<\/b>: <b>분할연금 지급청구서<\/b>, <b>신분증<\/b>, <b>혼인관계증명서(주민등록번호 포함)<\/b>, <b>본인 예금계좌<\/b>.<\/li>\n<li><b>비율을 달리 정했다면<\/b>: 협의서 또는 <b>법원 판결·조정조서<\/b> 등 <b>연금 분할 비율이 명시된 서류<\/b>를 함께 제출해야 반영됩니다.<\/li>\n<li><b>선청구<\/b>: 이혼 효력 발생일로부터 <b>3년 이내<\/b>에 <b>분할연금 선청구서<\/b>를 제출해 두면, 이후 요건을 모두 갖춘 때부터 지급됩니다.<\/li>\n<\/ol>\n<div class=\"tip\"><b>✅ 진행 순서 정리<\/b><p style=\"margin:8px 0 0\">① 이혼 사실·혼인기간 확인(혼인관계증명서) → ② 배우자의 <b>가입기간 중 혼인기간이 5년 이상<\/b>인지 1355 확인 → ③ 내 지급개시연령 확인(위 표) → ④ <b>연령 전이면 선청구, 연령 후면 즉시 청구<\/b> → ⑤ 비율을 달리 정했다면 관련 서류 함께 제출.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec7\">8. 자주 묻는 질문<\/h2>\n<h3>Q. 20년 살고 이혼했는데 배우자가 그중 4년만 국민연금에 가입했습니다. 받을 수 있나요?<\/h3>\n<p>어렵습니다. 기준은 결혼 기간 20년이 아니라 <b>배우자의 가입기간 중 혼인기간<\/b>이며, 그것이 <b>5년 이상<\/b>이어야 합니다. 4년이면 요건 미달입니다. 다만 개인별 이력 확인이 필요하니 <b>1355로 실제 가입월수를 확인<\/b>해 보세요.<\/p>\n<h3>Q. 제 국민연금도 있는데, 분할연금까지 같이 받을 수 있나요?<\/h3>\n<p>가능합니다. 2007년 개정으로 <b>본인의 노령연금과 분할연금을 합산해 받을 수<\/b> 있습니다.<\/p>\n<h3>Q. 이혼한 지 10년이 넘었습니다. 늦었나요?<\/h3>\n<p>선청구(이혼 후 3년)는 이미 지났지만, <b>일반 청구의 5년은 '수급권이 발생한 날'부터<\/b> 셉니다. 아직 지급개시연령에 도달하지 않았다면 수급권이 발생하지 않았으므로 <b>늦지 않았습니다.<\/b> 반대로 연령·요건을 이미 다 갖춘 지 5년이 넘었다면 소멸됐을 수 있으니 <b>즉시 확인<\/b>하세요.<\/p>\n<h3>Q. 전 배우자가 아직 연금을 안 받고 있으면 어떻게 되나요?<\/h3>\n<p>요건 ③은 전 배우자가 <b>노령연금 수급권자<\/b>일 것을 요구합니다. 아직 수급권이 없다면 그 시점까지 기다려야 하며, 이런 경우에도 <b>선청구를 해두면<\/b> 요건이 갖춰지는 때 지급이 시작됩니다.<\/p>\n<h3>Q. 전 배우자와 다시 재결합했습니다. 분할연금은요?<\/h3>\n<p>국민연금법에는 <b>분할연금 수급권 포기<\/b> 규정이 있어, 이혼했던 배우자와 <b>다시 혼인한 경우<\/b> 등에 포기 신청을 할 수 있습니다. 개별 상황에 따라 처리가 달라지므로 <b>1355 상담<\/b>이 필요합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec8\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0061M0.do\" target=\"_blank\" rel=\"nofollow\">▸ 국민연금공단 — 분할연금 안내(요건·분할비율·청구기한)<\/a><a href=\"https://www.nps.or.kr\" target=\"_blank\" rel=\"nofollow\">▸ 국민연금공단 — 전자민원(연금 청구·내 연금 알아보기)<\/a><a href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B5%AD%EB%AF%BC%EC%97%B0%EA%B8%88%EB%B2%95\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 국민연금법(제64조 분할연금)<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">분할연금은 <b>배우자의 가입기간 중 혼인기간 5년 이상 + 이혼 + 전 배우자의 노령연금 수급권 + 본인 61~65세<\/b>, 이 네 가지가 모두 맞아야 나옵니다. 금액은 <b>노령연금(부양가족연금 제외) × 혼인기간 비율 ÷ 2<\/b>이고, 협의·재판으로 비율을 달리 정할 수도 있습니다. 가장 조심할 것은 <b>기한<\/b>입니다 — <b>수급권 발생일로부터 5년<\/b>, 아직 나이가 안 됐다면 <b>이혼일로부터 3년 안에 선청구<\/b>. 재혼해도 계속 받고 내 노령연금과 합산해 받을 수 있으니, 이혼 경험이 있다면 <b>오늘 1355로 혼인기간부터 확인<\/b>해 보세요.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 수급 요건·지급개시연령·청구 기한은 법령 개정으로 달라질 수 있습니다. 개인별 가입 이력에 따라 결과가 다르므로 신청 전 국민연금공단(1355)에서 확인하세요.<br>출처: <a href=\"https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0061M0.do\">국민연금공단 분할연금 안내<\/a>, <a href=\"https://www.law.go.kr\">국가법령정보센터<\/a> 국민연금법 제64조·제64조의2·제64조의3·제64조의4·제65조 및 개정이유(2007·2015·2017년), 대법원 2019. 6. 13. 선고 <b style=\"display:inline;color:#33503a;margin:0\">2018두65088<\/b> 판결<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_813.html\">▸ 국민연금 예상 수령액 조회 방법 수령나이 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01191203420.html\">▸ 국민연금 조기노령연금 연기연금 신청 방법 감액률 증액률 손익분기 총정리 (2026)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01162794658.html\">▸ 국민연금 추납 임의가입 방법 못 낸 기간 채워 수령액 늘리기 총정리 (2026)<\/a><\/div>\n\n<div id=\"ymyl-disclaimer\" style=\"margin-top:22px;font-size:13px;color:#666;line-height:1.6\">본 글은 정보 제공용이며, 실제 수급 가능 여부·분할연금액은 국민연금공단의 심사와 개인별 가입 이력에 따라 달라집니다. 본문의 계산 사례는 공식 산정 방식을 설명하기 위한 가정값이며, 법률 자문이 아닙니다.<\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 수치·자격·기한은 <b>공식 자료를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 제도는 바뀔 수 있으니 신청 전 공식 페이지를 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 이혼했다면 전 배우자의 국민연금 중 내 몫을 평생 매달 받을 수 있습니다. 조건은 네 가지 — ①배우자의 가입기간 중 혼인기간 5년 이상 ②이혼 ③전 배우자가 노령연금 수급권자 ④본인이 61~65세(출생연도별) 도달.\n2. 금액은 \"절반\"이 아닙니다. 노령연금(부양가족연금 제외) × (혼인기간 중 가입월수 ÷ 전체 가입월수) ÷ 2. 예) 월 100만 원·가입 300개월 중 혼인 150개월이면 → 월 25만 원.\n3. 가장 많이 날리는 이유는 기한입니다. 수급권 발생일로부터 5년이 지나면 권리 자체가 소멸. 아직 나이가 안 됐다면 이혼일로부터 3년 이내 '선청구'로 예약해 두세요. 재혼해도 계속 받고, 내 노령연금과 합산해서도 받습니다(1355).\n"},{"code":"F4-09","title":"국립공원 대피소 예약 방법 총정리 — 추첨제 신청 일정·환불 기준·노쇼 페널티 (2026 지리산 설악산 가을 단풍)","lane":"pop","thumb":"130_knps_shelter.png","draft":"국립공원대피소예약_글_HTML.txt","facts":"2025.7.1 이용분부터 대피소 13곳 연중 추첨제(선착순 폐지) · 2개월 단위 짝수달 1일부터 5~7일 접수(9~10월분=8월 회차) · 추첨 마감당일 13시·발표 16시·결제 익일 22시까지(미결제 자동취소) · 요금 장터목 기준 주중 20,000/주말·성수기 30,000(성수기=7.1~8.31, 10.1~11.15) · 환불 3일전 전액/2일전 10%/1일전 20%/당일12시전 30% 공제, 미사용 0원 · 노쇼 1회 1개월·2회이상 3개월 예약제한(1년 무사고 시 소멸) · 출처 reservation.knps.or.kr 추첨제안내·예약환불정책·장터목 이용
