<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="icon" href="data:,">
<title>진행현황 — 생활정보 모음</title>
<style>
:root{--bg:#0e1620;--card:#18222e;--card2:#13202d;--line:#26323f;--txt:#e6edf3;--mut:#8a97a6;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:470px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:16px;font-weight:600}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(63,185,80,.16);color:var(--ok)}
.b-warn{background:rgba(210,153,34,.16);color:var(--warn)}
.b-bad{background:rgba(248,81,73,.16);color:var(--bad)}
.sec{font-size:11px;color:var(--mut);letter-spacing:.05em;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
.metrics{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 2px}
/* 채널이 4개가 되어 490px 팝업에서 눌리므로, 좁아지면 2x2로 감싸게 한다 */
.m{flex:1 1 96px;background:var(--card2);border-radius:9px;padding:8px 10px}
.m .l{font-size:11px;color:var(--mut)}
.m .v{font-size:18px;font-weight:600;margin-top:2px}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #243049;font-size:12.5px}
li:last-child{border-bottom:none}
li.on{opacity:.62}
li.on .lbl{text-decoration:line-through}
li svg{width:15px;height:15px;flex:none}
li.on svg{color:var(--ok)}
li.now svg{color:#7fc1ff}
li.wait svg{color:#4a586e}
.num{font-size:11px;color:#6b7a99;width:16px;text-align:right;flex:none}
.who{font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px;flex:none}
.who.ai{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.who.me{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.lbl{font-size:12.5px}
.star{color:#ff8e8e;font-weight:800;margin-left:2px}
.banner{display:none;margin-top:9px;background:#0c3a2c;border:1px solid #1f6b52;color:#06d6a0;border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12.5px}
.banner.show{display:block}
.upd{font-size:11px;color:var(--mut);text-align:right;margin-top:12px}
.agent{background:var(--card2);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.agent .ah{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.agent .st{font-size:10px;font-weight:700;padding:1px 7px;border-radius:7px;margin-left:auto}
.st.active{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.st.uncommitted{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.st.idle{background:#222c3a;color:#6b7a99;border:1px solid #2e3a4a}
.agent .role{font-size:11px;color:var(--mut);margin:3px 0 1px}
.agent .own{font-size:10.5px;color:#5a6b80}
.agent .act{font-size:11px;color:#aeb9c7;margin-top:4px;padding-left:7px;border-left:2px solid #2a3a4d;line-height:1.5}
.agent .act .d{color:var(--mut);font-size:10px}
.advice{background:#13202d;border:1px solid #2a3a4d;border-radius:9px}
.advice .ai{display:flex;gap:8px;padding:7px 11px;font-size:12px;line-height:1.5;border-bottom:1px dashed #243049}
.advice .ai:last-child{border-bottom:none}
.advice .ic{flex:none}
.prow{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px dashed #243049;font-size:11.5px}
.prow:last-child{border-bottom:none}
.pcd{color:#7fc1ff;font-weight:700;flex:none;width:46px}
.ptt{flex:1;color:#cdd6e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{background:#3a2f12;color:#ffd166;border-radius:5px;padding:0 5px;font-size:9.5px;flex:none}
.pact{color:#06d6a0;font-size:10px;flex:none;font-weight:700}
.qcard{display:flex;gap:9px;padding:8px;margin:6px 0;background:#141c2c;border:1px solid #243049;border-radius:9px}
.qth{width:78px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:#0d1420}
.qth.none{display:flex;align-items:center;justify-content:center;color:#54627a;font-size:9px;text-align:center;line-height:1.2;border:1px dashed #2a3752}
.qbody{flex:1;min-width:0}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qcode{color:#7fc1ff;font-weight:700;font-size:11.5px}
.qlane{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700}
.qlane.info{background:#12283a;color:#7fc1ff}
.qlane.pop{background:#2f2136;color:#e0a3ff}
.qtitle{color:#e6edf5;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qfacts{color:#8a95a6;font-size:10px;margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qmeta{margin-top:4px}
.qdraft{color:#6b7688;font-size:9.5px;margin-left:8px}
.qpv{background:#17324a;color:#7fc1ff;border:1px solid #2a4d6e;border-radius:6px;font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer}
.qpv:hover{background:#1d4463}
.qpv.none{background:none;border:none;color:#54627a;font-weight:400;cursor:default;padding:3px 0}
#qpv-ov{display:none;position:fixed;inset:0;background:rgba(6,10,18,.82);z-index:999;align-items:center;justify-content:center;padding:18px}
#qpv-ov.show{display:flex}
.qpv-box{width:100%;max-width:760px;height:88vh;display:flex;flex-direction:column;background:#0f1626;border:1px solid #2a3752;border-radius:12px;overflow:hidden}
.qpv-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #243049;font-size:12.5px;font-weight:700;color:#7fc1ff}
.qpv-hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpv-x{background:#243049;color:#cdd6e0;border:none;border-radius:6px;font-size:11px;padding:5px 11px;cursor:pointer;flex:none}
.qpv-x:hover{background:#324158}
.qpv-fr,#qpv-fr{flex:1;width:100%;border:0;background:#fff}
.qpv-ft{padding:8px 14px;border-top:1px solid #243049;font-size:10px;color:#8a95a6;text-align:center}
.ch{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 4px;flex:none;margin-left:3px}
.ch.on{background:#0c3a2c;color:#06d6a0}
.ch.off{background:#3a1216;color:#f0707a}
</style>
</head>
<body>
<div class="card" id="board" role="status">불러오는 중…</div>
<div id="qpv-ov" onclick="if(event.target===this)qpvClose()">

  </div>
</div>

in:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>공항 보안검색대에서 가장 자주 멈춰 서는 물건이 <b>보조배터리<\/b>입니다. 그런데 이 규정이 <b>2026년 4월 20일부터 크게 바뀌었습니다.<\/b> 예전에는 <b>100Wh 이하를 5개까지<\/b> 가지고 탈 수 있었지만, 지금은 <b>1인당 2개<\/b>로 줄었습니다. 대신 <b>용량 상한은 100Wh에서 160Wh로 올라갔고<\/b>, <b>기내에서 쓰거나 충전하는 것은 아예 금지<\/b>됐습니다. 인터넷에 남아 있는 \"5개까지 됩니다\" 같은 설명은 <b>지금은 틀린 정보<\/b>입니다. 이 글에서는 <b>내 보조배터리가 몇 Wh인지 계산하는 법, 개수·용량 기준, 위탁수하물에 넣으면 안 되는 것, 액체류 100ml 규정, 그리고 공항에서 실제로 뺏기는 5가지 경우<\/b>까지 공식 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 2026년 4월 20일, 무엇이 바뀌었나 (개정 전·후 비교)<\/a><a href=\"#sec2\">2. 내 보조배터리는 몇 Wh인가 — mAh 환산 계산<\/a><a href=\"#sec3\">3. 개수·용량 기준 한 장 정리 (100Wh·160Wh)<\/a><a href=\"#sec4\">4. 기내에서 하면 안 되는 것 — 사용·충전·선반 보관<\/a><a href=\"#sec5\">5. 위탁 vs 기내, 어디에 넣어야 하나 (판단표)<\/a><a href=\"#sec6\">6. 액체류 100ml·1L 지퍼백 — 국내선은 다릅니다<\/a><a href=\"#sec7\">7. 공항에서 실제로 걸리는 5가지<\/a><a href=\"#sec8\">8. 자주 묻는 질문<\/a><a href=\"#sec9\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec2\">👉 내 보조배터리 Wh 계산법 바로 보기<\/a>\n\n<h2 id=\"sec1\">1. 2026년 4월 20일, 무엇이 바뀌었나 (개정 전·후 비교)<\/h2>\n<p>2025년 1월 김해공항 <b>에어부산 항공기 화재<\/b>를 계기로, 국토교통부는 리튬이온 보조배터리 안전관리를 단계적으로 강화해 왔습니다. 2025년 3월에 <b>선반 보관 금지·절연 의무<\/b>가 먼저 시행됐고, <b>2026년 4월 20일부터는 개수와 용량 기준까지 바뀌었습니다.<\/b><\/p>\n<table>\n<tr><th>구분<\/th><th>개정 전<\/th><th>2026년 4월 20일부터<\/th><\/tr>\n<tr><td><b>1인당 개수<\/b><\/td><td>100Wh 이하 <b>5개<\/b><\/td><td><b>2개<\/b>로 축소<\/td><\/tr>\n<tr><td><b>용량 상한<\/b><\/td><td>100Wh(약 27,000mAh)<\/td><td><b>160Wh(약 43,000mAh)<\/b>로 상향<\/td><\/tr>\n<tr><td><b>기내 사용<\/b><\/td><td>충전만 금지<\/td><td><b>사용·충전 모두 전면 금지<\/b><\/td><\/tr>\n<tr><td><b>위탁수하물<\/b><\/td><td colspan=\"2\"><b>불가<\/b> (반드시 직접 휴대 — 변동 없음)<\/td><\/tr>\n<tr><td><b>보관 위치<\/b><\/td><td colspan=\"2\">선반 금지, 몸에 소지하거나 좌석 앞주머니 (변동 없음)<\/td><\/tr>\n<\/table>\n<p>정리하면 <b>\"개수는 줄고, 용량은 늘고, 쓰는 건 막혔다\"<\/b>입니다. 큰 배터리 하나를 들고 타는 사람에게는 유리해졌고, 작은 배터리를 여러 개 챙기던 사람에게는 불리해진 개정입니다.<\/p>\n<div class=\"tip\"><b>💡 이 기준은 한국만의 규정이 아닙니다<\/b><p style=\"margin:8px 0 0\">국토교통부가 국제민간항공기구(<b>ICAO<\/b>)에 제안한 이 방안이 <b>ICAO 이사회 승인을 거쳐 국제기준(위험물 항공운송 기술지침)으로 반영<\/b>됐습니다. 즉 <b>국적기·외국항공사, 국내선·국제선을 가리지 않고<\/b> 같은 방향으로 적용된다고 보면 됩니다. 다만 <b>세부 운영은 항공사마다 조금씩 다를 수 있으니<\/b>, 탑승할 항공사 공지를 한 번 확인하는 것이 안전합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 내 보조배터리는 몇 Wh인가 — mAh 환산 계산<\/h2>\n<p>규정은 <b>Wh(와트시)<\/b> 기준인데, 시중 보조배터리에는 대부분 <b>mAh(밀리암페어시)<\/b>만 크게 적혀 있습니다. 그래서 직접 환산해야 합니다. 공식은 간단합니다.<\/p>\n<div class=\"tip\"><b>🔢 환산 공식<\/b><p style=\"margin:8px 0 0\"><b>Wh = mAh × 전압(V) ÷ 1,000<\/b><br>리튬이온 셀의 <b>공칭전압은 보통 3.7V<\/b>입니다. 제품 뒷면에 <b>Wh가 직접 적혀 있으면 그 숫자가 우선<\/b>이고, 없을 때만 아래처럼 계산합니다.<\/p><\/div>\n<table>\n<tr><th>표기 용량<\/th><th>계산 (× 3.7V ÷ 1,000)<\/th><th>Wh<\/th><th>판정<\/th><\/tr>\n<tr><td>10,000mAh<\/td><td>10,000 × 3.7 ÷ 1,000<\/td><td><b>37Wh<\/b><\/td><td>승인 없이 반입<\/td><\/tr>\n<tr><td>20,000mAh<\/td><td>20,000 × 3.7 ÷ 1,000<\/td><td><b>74Wh<\/b><\/td><td>승인 없이 반입<\/td><\/tr>\n<tr><td>27,000mAh<\/td><td>27,000 × 3.7 ÷ 1,000<\/td><td><b>약 100Wh<\/b><\/td><td>승인 없이 반입되는 경계선<\/td><\/tr>\n<tr><td>43,000mAh<\/td><td>43,000 × 3.7 ÷ 1,000<\/td><td><b>약 159Wh<\/b><\/td><td>항공사 승인 필요 (상한 근처)<\/td><\/tr>\n<tr><td>50,000mAh<\/td><td>50,000 × 3.7 ÷ 1,000<\/td><td><b>185Wh<\/b><\/td><td><b>반입 불가<\/b><\/td><\/tr>\n<\/table>\n<p>시중에서 가장 흔한 <b>10,000~20,000mAh 제품은 37~74Wh<\/b>라서, 개수만 2개 이내로 지키면 그대로 들고 타면 됩니다. <b>문제는 캠핑용·노트북 충전용으로 파는 대용량 제품<\/b>입니다. 50,000mAh급은 계산해 보면 <b>185Wh로 상한(160Wh)을 넘어 아예 못 탑니다.<\/b><\/p>\n<div class=\"warn\"><b>⚠️ 5V로 계산하면 두 배 가까이 틀립니다<\/b><p style=\"margin:8px 0 0\">USB 출력이 5V라서 <b>\"20,000mAh × 5V = 100Wh\"<\/b>로 계산하는 분이 많은데, 이건 <b>틀린 계산<\/b>입니다. 규정에서 쓰는 값은 <b>셀의 공칭전압 3.7V<\/b> 기준이라 실제로는 <b>74Wh<\/b>입니다. 5V로 계산하면 멀쩡히 반입되는 배터리를 스스로 \"안 된다\"고 두고 오게 됩니다. 반대로 <b>제품에 Wh가 인쇄돼 있는데도 mAh로 다시 계산할 필요는 없습니다<\/b> — 표기값이 기준입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 개수·용량 기준 한 장 정리 (100Wh·160Wh)<\/h2>\n<p>용량 구간에 따라 <b>그냥 되는 것 / 항공사 승인이 필요한 것 / 아예 안 되는 것<\/b> 셋으로 갈립니다.<\/p>\n<table>\n<tr><th>용량<\/th><th>기내 반입<\/th><th>필요한 절차<\/th><\/tr>\n<tr><td><b>100Wh 이하<\/b><br>(약 27,000mAh 이하)<\/td><td>가능<\/td><td>별도 승인 <b>불필요<\/b><\/td><\/tr>\n<tr><td><b>100Wh 초과 ~ 160Wh 이하<\/b><br>(약 43,000mAh 이하)<\/td><td>가능<\/td><td><b>항공사 사전 승인 필요<\/b><\/td><\/tr>\n<tr><td><b>160Wh 초과<\/b><\/td><td><b>불가<\/b><\/td><td>기내·위탁 모두 반입 금지<\/td><\/tr>\n<\/table>\n<p>여기에 <b>1인당 2개<\/b>라는 개수 제한이 함께 걸립니다. 즉 <b>37Wh짜리 작은 배터리라도 3개를 가져가면 1개는 두고 가야 합니다.<\/b> 개수 제한은 용량과 무관하게 적용된다고 이해하는 편이 안전합니다.<\/p>\n<div class=\"tip\"><b>💡 노트북·카메라에 들어 있는 배터리는 별개입니다<\/b><p style=\"margin:8px 0 0\">2개 제한은 <b>보조배터리(휴대용 충전기)<\/b>에 대한 것입니다. <b>노트북·카메라·휴대폰에 장착된 내장 배터리<\/b>는 기기의 일부라 이 개수에 들어가지 않습니다. 다만 <b>카메라 여분 배터리처럼 기기에서 분리된 리튬배터리<\/b>는 보조배터리와 마찬가지로 <b>위탁 불가·절연 후 기내 휴대<\/b>가 원칙이고, 개수는 항공사 기준을 따르니 여러 개를 챙긴다면 미리 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 기내에서 하면 안 되는 것 — 사용·충전·선반 보관<\/h2>\n<p>2026년 개정에서 실제 탑승객이 가장 크게 체감하는 부분입니다. <b>가지고 타는 것은 되지만, 쓰는 것은 안 됩니다.<\/b><\/p>\n<ul>\n<li><b>보조배터리 자체를 충전하는 것<\/b> — 금지. 좌석 USB 포트에 꽂아 보조배터리를 채우는 행동이 여기 해당합니다.<\/li>\n<li><b>보조배터리로 휴대폰·태블릿을 충전하는 것<\/b> — 금지. 개정 전에는 가능했지만 지금은 막혔습니다.<\/li>\n<li><b>머리 위 선반(오버헤드 빈)에 넣는 것<\/b> — 금지. 연기·발열이 시작돼도 발견이 늦기 때문입니다.<\/li>\n<\/ul>\n<p>대신 <b>몸에 지니거나, 좌석 앞주머니 또는 앞좌석 아래<\/b>처럼 <b>본인 손이 즉시 닿는 곳<\/b>에 두어야 합니다. 보관 전에는 <b>단자가 금속에 닿지 않도록<\/b> 절연테이프를 붙이거나 <b>보호 파우치·지퍼백<\/b>에 넣습니다. 지퍼백은 <b>체크인 카운터와 기내에 단락방지용 투명 비닐봉투가 비치<\/b>돼 있어 현장에서 받을 수도 있습니다.<\/p>\n<div class=\"warn\"><b>⚠️ 기내에서 승무원이 제지하면 따라야 합니다<\/b><p style=\"margin:8px 0 0\">\"조금만 충전하겠다\"는 실랑이는 좋을 것이 없습니다. 기내에서는 <b>안전에 관한 승무원의 지시에 따를 의무<\/b>가 있고, 불응하면 항공보안법상 문제가 될 수 있습니다. <b>비행 중 쓸 전력이 필요하다면 출발 전에 휴대폰을 미리 100% 충전<\/b>해 두고, 장거리라면 <b>좌석 전원(USB·AC)이 제공되는지<\/b>를 예약 단계에서 확인하는 편이 현실적입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 위탁 vs 기내, 어디에 넣어야 하나 (판단표)<\/h2>\n<p>헷갈리는 물건일수록 <b>\"불이 날 수 있는 것은 기내로, 다칠 수 있는 것은 위탁으로\"<\/b>가 기본 원리입니다. 배터리는 눈에 보이는 곳에 둬야 초기 진화가 되고, 칼·공구는 객실에 없어야 안전하기 때문입니다.<\/p>\n<table>\n<tr><th>물건<\/th><th>기내 휴대<\/th><th>위탁수하물<\/th><\/tr>\n<tr><td><b>보조배터리<\/b><\/td><td>○ (2개·160Wh 이하)<\/td><td><b>× 금지<\/b><\/td><\/tr>\n<tr><td><b>전자담배·기기<\/b><\/td><td>○<\/td><td><b>× 금지<\/b><\/td><\/tr>\n<tr><td><b>라이터·소형 안전성냥<\/b><\/td><td>○ <b>1인 1개<\/b><\/td><td><b>× 금지<\/b><\/td><\/tr>\n<tr><td>딱성냥(마찰성냥)·대형 곽성냥<\/td><td>×<\/td><td>×<\/td><\/tr>\n<tr><td>과도·가위·공구류<\/td><td>×<\/td><td>○<\/td><\/tr>\n<tr><td>액체류 100ml 초과<br>(화장품·김치·젓갈·장류)<\/td><td>×<\/td><td>○ (용량 제한 없음)<\/td><\/tr>\n<\/table>\n<p>표에서 특히 <b>위쪽 세 줄이 반대로 헷갈리는 항목<\/b>입니다. 보조배터리·전자담배·라이터는 <b>\"짐에 부치면 안 되고 반드시 몸에 지녀야 하는\"<\/b> 물건입니다. 캐리어에 넣어 부쳤다가 <b>보안검색에서 걸려 짐이 열리고, 출발 직전에 호출<\/b>되는 일이 흔합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 액체류 100ml·1L 지퍼백 — 국내선은 다릅니다<\/h2>\n<p>보조배터리와 함께 가장 많이 걸리는 것이 <b>액체·젤류<\/b>입니다. 국제선 출발 시 기준은 이렇습니다.<\/p>\n<ul>\n<li>개별 용기는 <b>100ml 이하<\/b>여야 합니다. <b>용기 표시 용량 기준<\/b>이라, 500ml 통에 조금만 남았어도 반입이 안 됩니다.<\/li>\n<li>이 용기들을 <b>1인당 1개, 1L 규격의 투명 지퍼백<\/b>에 넣고 <b>지퍼를 잠근 상태<\/b>로 보안검색에 제출합니다.<\/li>\n<li>화장품·세면용품·젤·치약·선크림·액체 화장품이 모두 대상입니다.<\/li>\n<li><b>단, 의약품과 유아용 식품은 예외입니다.<\/b> 목적지 도착 때까지 필요하다고 인정되는 <b>의약품<\/b>, 그리고 <b>만 6세 이하 어린이를 동반한 승객의 유아용품<\/b>(우유·물·주스·죽 형태의 이유식·물티슈 등)은 <b>여행 중 사용할 분량에 한해 100ml를 넘어도<\/b> 기내에 가지고 탈 수 있습니다.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ 예외를 인정받으려면 '검색대 들어가기 전에' 말해야 합니다<\/b><p style=\"margin:8px 0 0\">의약품·유아식은 <b>자동으로 통과되는 것이 아닙니다.<\/b> 필요한 양인지 판단하기 위해 <b>보안검색 요원에게 증빙서(처방전·소견서·약봉투 등)를 제시<\/b>해야 하고, <b>검색대에 진입하기 전에 미리 알려<\/b> 확인받아야 합니다. 지퍼백 안에 말없이 넣어 두면 일반 액체로 분류돼 걸립니다. 혈압약·당뇨약처럼 <b>매일 복용하는 액상 약이나 주사제<\/b>가 있다면 <b>처방전 사본을 함께 챙기는 것<\/b>이 가장 확실합니다.<\/p><\/div>\n<div class=\"tip\"><b>💡 국내선에는 이 액체 제한이 없습니다<\/b><p style=\"margin:8px 0 0\">100ml·1L 지퍼백 규정은 <b>국제선 기준<\/b>입니다. <b>국내선은 액체류 용량 제한이 적용되지 않습니다.<\/b> 반대로 <b>보조배터리 규정은 국내선에도 그대로 적용<\/b>되니, \"제주도 갈 땐 괜찮겠지\"는 통하지 않습니다. <b>액체=국제선만, 배터리=전부<\/b>로 외워두면 헷갈리지 않습니다.<\/p><\/div>\n<div class=\"warn\"><b>⚠️ 면세점에서 산 술·화장품은 '봉투를 뜯는 순간' 규정이 깨집니다<\/b><p style=\"margin:8px 0 0\">공항 면세점에서 구입한 액체는 <b>액체물 면세품 전용봉투(STEB)에 밀봉된 상태<\/b>라면 100ml를 넘어도 반입할 수 있습니다. 단 <b>최종 목적지에 도착할 때까지 개봉하지 않아야<\/b> 합니다. <b>중간에 환승<\/b>하면서 봉투를 뜯거나, 영수증이 봉투 안에 없으면 <b>환승 공항 보안검색에서 압수<\/b>될 수 있습니다. 환승 일정이 있다면 <b>구입 시점에 \"환승한다\"고 말하고<\/b> 밀봉 상태를 유지하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 공항에서 실제로 걸리는 5가지<\/h2>\n<p>규정을 몰라서라기보다, <b>옛날 기준을 기억하고 있어서<\/b> 걸리는 경우가 대부분입니다.<\/p>\n<ol>\n<li><b>보조배터리를 3개 이상 챙긴 경우<\/b> — 예전 기준(5개)을 기억하고 작은 것들을 여러 개 넣은 사례입니다. 지금은 <b>2개<\/b>가 상한입니다.<\/li>\n<li><b>대용량 배터리를 캐리어에 넣어 부친 경우<\/b> — 용량과 무관하게 <b>위탁 자체가 금지<\/b>입니다. 짐이 다시 열리고 탑승 시간이 촉박해집니다.<\/li>\n<li><b>50,000mAh급 캠핑용 배터리<\/b> — <b>185Wh로 160Wh 상한 초과<\/b>라 기내·위탁 모두 불가입니다. 공항에서 방법이 없습니다.<\/li>\n<li><b>여행용 화장품을 큰 통째로 넣은 경우<\/b> — 국제선은 <b>용기 표시 용량이 100ml 이하<\/b>여야 합니다. 소분 용기에 옮겨 담아야 합니다.<\/li>\n<li><b>일회용 라이터를 여러 개 넣은 경우<\/b> — <b>1인 1개<\/b>만 몸에 지닐 수 있고, 위탁은 불가입니다.<\/li>\n<\/ol>\n<div class=\"tip\"><b>💡 출발 전날 5분이면 끝나는 점검<\/b><p style=\"margin:8px 0 0\">① 보조배터리를 <b>모두 꺼내 개수를 세고(2개 이하)<\/b> ② 표기된 <b>mAh 또는 Wh<\/b>를 확인하고 ③ <b>지퍼백이나 파우치<\/b>에 하나씩 넣어 ④ <b>기내용 가방<\/b>에 옮기면 끝입니다. 100Wh를 넘는 제품이 있다면 <b>항공사 고객센터에 사전 승인을 문의<\/b>해 두세요. 공항에서 처음 알게 되면 되돌릴 방법이 거의 없습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 자주 묻는 질문<\/h2>\n<h3>Q. 2개 제한이 부부·가족이면 합산인가요?<\/h3>\n<p><b>1인당 2개<\/b> 기준입니다. 성인 2명이면 각자 2개씩 소지할 수 있습니다. 다만 <b>한 사람 가방에 4개를 몰아 넣으면<\/b> 보안검색에서 설명이 필요해질 수 있으니, <b>각자 나눠서 소지<\/b>하는 편이 깔끔합니다.<\/p>\n<h3>Q. 제 배터리에 mAh도 Wh도 안 적혀 있으면요?<\/h3>\n<p>표기가 지워졌거나 없는 제품은 <b>용량 확인이 안 돼 반입이 거절될 수 있습니다.<\/b> 규정 준수 여부를 증명할 방법이 없기 때문입니다. 표기가 선명한 제품으로 바꿔 가시는 것을 권합니다.<\/p>\n<h3>Q. 100Wh 초과 제품의 '항공사 승인'은 어떻게 받나요?<\/h3>\n<p>항공사 <b>고객센터 또는 예약 페이지의 위험물 안내<\/b>를 통해 사전에 문의·신청합니다. <b>당일 카운터에서 즉석 승인<\/b>이 되는 것을 전제로 계획하지 마세요. 항공사에 따라 절차와 소요 시간이 다릅니다.<\/p>\n<h3>Q. 기내에서 노트북은 써도 되나요?<\/h3>\n<p><b>기기 내장 배터리로 작동하는 노트북·태블릿 사용은 제한 대상이 아닙니다.<\/b> 이번에 금지된 것은 <b>보조배터리의 사용·충전<\/b>입니다. 다만 이착륙 시 전자기기 사용은 항공사 안내를 따르세요.<\/p>\n<h3>Q. 전자담배는 기내에서 피울 수 있나요?<\/h3>\n<p>없습니다. <b>기내 흡연은 전자담배를 포함해 금지<\/b>이고, <b>충전도 안 됩니다.<\/b> 전자담배 기기는 <b>위탁수하물에 넣을 수 없어<\/b> 반드시 몸에 지녀야 하며, <b>니코틴 액상은 액체류 규정(용기당 100ml 이하·1L 지퍼백)<\/b>을 그대로 따릅니다.<\/p>\n<h3>Q. 규정을 어기면 어떻게 되나요?<\/h3>\n<p>보안검색 단계에서는 <b>해당 물품의 반입이 거절<\/b>됩니다(포기 또는 별도 처리). 기내에서는 <b>승무원의 안전 지시에 따라야<\/b> 하며, 불응 시 항공보안법에 따른 조치 대상이 될 수 있습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 국토교통부 · 인천국제공항공사 (공식)<\/b><a href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148962298\" target=\"_blank\" rel=\"nofollow\">▸ 정책브리핑 — 보조배터리 1인 2개 제한 시행 안내<\/a><a href=\"https://www.airport.kr/ap_ko/906/subview.do\" target=\"_blank\" rel=\"nofollow\">▸ 인천공항 제한물품 — 기내 반입·위탁 금지 품목<\/a><a href=\"https://www.airport.kr/ap/ko/dep/rstrtItemFaqList.do\" target=\"_blank\" rel=\"nofollow\">▸ 인천공항 제한물품 FAQ — 라이터·액체류·배터리 문답<\/a><a href=\"https://www.molit.go.kr/sroa/USR/WPGE0201/m_35686/DTL.jsp\" target=\"_blank\" rel=\"nofollow\">▸ 서울지방항공청 — 액체류 기내반입 제한 안내(의약품·유아용품 예외)<\/a><a href=\"https://www.molit.go.kr/\" target=\"_blank\" rel=\"nofollow\">▸ 국토교통부 — 항공 위험물 안전관리 보도자료<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">핵심은 세 가지입니다. <b>보조배터리는 1인 2개까지, 160Wh(약 43,000mAh)를 넘으면 아예 못 타고, 기내에서는 쓰지도 충전하지도 못합니다.<\/b> 100Wh(약 27,000mAh)를 넘으면 <b>항공사 사전 승인<\/b>이 필요하니 출발 전에 처리해 두세요. 위탁수하물에는 <b>보조배터리·전자담배·라이터를 넣을 수 없고<\/b>, 액체류 100ml 규정은 <b>국제선에만<\/b> 적용됩니다. 출발 전날 <b>배터리를 꺼내 개수와 용량 표기만 확인<\/b>해도 공항에서 물건을 잃을 일은 거의 없습니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 항공사·공항별 세부 운영 기준은 다를 수 있습니다. 특히 <b>100Wh 초과 제품의 승인 절차<\/b>는 탑승할 항공사 공지를 직접 확인하세요.<br>본문의 Wh 환산은 <b>3.7V 기준<\/b>이며, 정부 발표가 밝힌 <b>100Wh≈27,000mAh · 160Wh≈43,000mAh<\/b>라는 대응값과 정확히 일치하는 계산입니다.<br>출처: 국토교통부 보조배터리 기내 안전관리 강화 방안(2026년 4월 20일 시행), 대한민국 정책브리핑, 인천국제공항공사 제한물품 안내 및 FAQ, 국토교통부 액체·젤류 항공보안 통제 지침(의약품·유아용품 예외), ICAO 위험물 항공운송 기술지침 반영 사항. 인천공항 안내 1577-2600<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_0653105371.html\">▸ 인천공항 스마트패스 등록 방법 전용라인 출국시간 단축 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_372.html\">▸ 해외여행 준비물 체크리스트 올인원 가이드<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_0459503221.html\">▸ 항공기 결항·지연 보상 신청 방법 기준표 면책 사유 총정리<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 개수·용량 기준과 금지 품목은 <b>국토교통부 정책브리핑과 인천국제공항공사 제한물품 안내를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 항공사별 세부 운영은 탑승 전 공식 공지를 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 보조배터리 기내 반입 규정이 2026년 4월 20일부터 바뀌었습니다. 예전엔 100Wh 이하 5개까지였는데 지금은 1인당 2개예요. 대신 용량 상한은 100Wh에서 160Wh(약 43,000mAh)로 올라갔습니다. \"5개까지 된다\"는 설명은 지금은 틀린 정보입니다.\n2. 내 배터리가 몇 Wh인지는 mAh × 3.7 ÷ 1,000으로 계산합니다. 10,000mAh=37Wh, 20,000mAh=74Wh, 27,000mAh≈100Wh. USB 출력 5V로 계산하면 두 배 가까이 틀리게 나오니 주의하세요. 50,000mAh급 캠핑용은 185Wh라 기내·위탁 둘 다 불가입니다.\n3. 기내에서 보조배터리로 휴대폰 충전하는 것도 이제 금지입니다. 선반에 넣는 것도 안 되고 몸에 지니거나 좌석 앞주머니에 둬야 해요. 보조배터리·전자담배·라이터(1인 1개)는 캐리어에 부치면 안 되고 반드시 손에 들고 타야 합니다. 액체 100ml 규정은 국제선만, 배터리 규정은 국내선에도 적용됩니다.\n"},{"code":"E1-02","title":"어르신 휴대폰 요금감면 신청 방법 대상 감면액 총정리 (2026 기초연금·장애인·국가유공자)","lane":"info","thumb":"133_telecom_discount.png","draft":"","facts":"각도=이동통신 요금감면은 자동 적용이 아니라 별도 신청이 필요하다는 점이 핵심 함정. 대상=기초연금 수급자·장애인·국가유공자·차상위 등 유형별로 감면 폭이 다름. 다뤄야 할 판단정보=①감면 중복 가능 여부 ②알뜰폰(MVNO) 적용 범위 ③가족 명의 회선일 때 처리 ④신청 경로별(복지로·정부24·통신사·주민센터) 차이. 출처=복지로·정부24·과학기술정보통신부·통신사 고객센터. 커버리지 근거=E1(통신·요금) 1편뿐인 최대 공백, 통신은 고단가 영역. 중복게이트 통과(최고 0.201 vs A2-11). 내부링크 후보=E1-01 알뜰폰 요금제 비교. ⚠️감면액·한도 등 수치는 전부 미검증 — 발행 전 1차 출처 확인 필수","added":"2026-07-27","thumb_data":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nz   const light=h?h.light:'gray', pass=h?h.pass:0, total=h?(h.pass+h.warn+h.fail):0;
  const avg=pg&&pg.avg?fnum(pg.avg):'—', date=pg&&pg.updated?pg.updated:'';
  const bcls=light==='green'?'b-green':light==='red'?'b-bad':'b-warn';
  const blab=light==='green'?'신호등 green':light==='red'?'신호등 red':'신호등 warn';
  const today=(pg&&pg.today||[]).map(it=>'<div class="row '+(it.done?'done':'warn')+'">'+(it.done?CHECK:LOAD)+'<span>'+esc(it.t)+'</span></div>').join('');
  const next=(pg&&pg.next||[]).map(t=>'<div class="row">'+DOT+'<span class="mut">'+esc(t)+'</span></div>').join('');
  const pl=(pg&&pg.pipeline)||{};
  const _cc=(pl.code||'').split(' ')[0], _cur=recs.find(r=>r.code===_cc);
  let checked=(pl.checked||[]).slice();
  // 확산 단계(11~14)는 보드 시드값을 쓰지 않고 DB의 osmu 기록에서 그대로 도출한다.
  //   · DB osmu 는 "실제로 게시된 것"의 기록이므로 확산 여부의 유일한 정답이다.
  //   · 예전 코드는 DB에서 체크를 추가만 하고 제거하지 않아, board_seed 가 미리 찍어둔
  //     낡은 checked 값이 그대로 남아 미게시 글을 확산 완료로 표시했다.
  //     (실측: C2-07 은 osmu 기록이 없는데 checked 에 11·12·13 이 들어 있었다)
  //   · 인스타를 13단계로 넣으면서 번호가 한 칸씩 밀렸으므로, 낡은 번호를 그대로
  //     신뢰하면 단계 의미까지 어긋난다. 도출로 바꾸면 이 문제가 함께 사라진다.
  // 교차링크(14)는 네이버·쓰레드 기준을 유지한다 — 인스타는 54/153편으로 확산률이 낮아
  // 조건에 넣으면 대부분의 글에서 교차링크가 미완으로 뒤집힌다.
  if(_cur){
    const om=_cur.osmu||{};
    const derived={11:!!om.naver,12:!!om.threads,13:!!om.instagram,14:!!(om.naver&&om.threads)};
    checked=checked.filter(n=>!(n in derived));
    Object.keys(derived).forEach(k=>{if(derived[k])checked.push(+k);});
    checked.sort((a,b)=>a-b);
  }
  const done=checked.length;
  const omAll=recs.filter(r=>r.osmu&&typeof r.osmu==='object');
  const oNv=omAll.filter(r=>r.osmu.naver).length, oTh=omAll.filter(r=>r.osmu.threads).length, oIn=omAll.filter(r=>r.osmu.instagram).length;
  // 미결 관리의 I 칩은 DB에서 직접 도출한다. pending.json 의 ch 는 {g,n,t} 만 담고
  // 있어서(pending 생성기가 아직 인스타를 모른다) ch.i 를 믿으면 게시한 글도 ✗ 로 나온다.
  const osmuByCode={}; recs.forEach(r=>{if(r.code)osmuByCode[r.code]=r.osmu||{};});
  const oRecent=omAll.slice(-4).reverse();
  const nowN=pl.code?(STEPS.find(s=>checked.indexOf(s.n)<0)||{}).n:0;
  let pubHtml;
  if(pl.code){
    const pct=Math.round(done/STEPS.length*100);
    const lis=STEPS.map(st=>{
      const on=checked.indexOf(st.n)>=0, now=(!on&&st.n===nowN);
      const ic=on?CHECK:(now?NOWI:WAIT), cls=on?'on':(now?'now':'wait');
      return '<li class="'+cls+'">'+ic+'<span class="num">'+st.n+'</span>'
        +'<span class="who '+st.who+'">'+(st.who==='ai'?'🤖':'🧑')+'</span>'
        +'<span class="lbl">'+esc(st.t)+(st.star?'<span class="star">★</span>':'')+'</span></li>';
    }).join('');
    pubHtml='<div class="pcode">'+esc(pl.code)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div>'
      +'<div class="cnt">'+done+' / '+STEPS.length+' 단계'+(pl.note?' · '+esc(pl.note):'')+'</div><ul>'+lis+'</ul>'
      +'<div class="banner'+(done===STEPS.length?' show':'')+'">✅ 발행·확산 완료</div>';
  }else{
    pubHtml='<div class="pcode none">진행 중인 발행 없음</div>';
  }
  const osmuLi=oRecent.map(r=>'<div class="row done">'+CHECK+'<span>'+esc(r.code)+' '+esc((r.title||'').slice(0,15))+'</span><span class="mut" style="margin-left:auto;font-size:10.5px">'+(r.osmu.naver?'네이버 ':'')+(r.osmu.threads?'쓰레드 ':'')+(r.osmu.instagram?'인스타':'')+'</span></div>').join('');
  // 🤝 협업 — 세션별(collab.json: 정체성=레지스트리·활동=git log·상태=git status)
  const stLab={active:'활동중',uncommitted:'미커밋',idle:'대기'};
  const collabHtml=(collab&&collab.agents||[]).map(a=>{
    const acts=(a.recent||[]).map(r=>'<div class="act">'+esc((r.s||'').slice(0,40))+' <span class="d">'+esc(r.d||'')+'</span></div>').join('');
    return '<div class="agent"><div class="ah">'+esc(a.emoji||'')+'<span>'+esc(a.name||'')+'</span><span class="st '+(a.state||'idle')+'">'+(stLab[a.state]||a.state||'')+'</span></div>'
      +'<div class="role">'+esc(a.role||'')+'</div><div class="own">담당 '+esc(a.owns||'')+'</div>'+acts+'</div>';
  }).join('');
  // 💡 시스템 조언 — 라이브 데이터 조건에서만 도출(하드코딩 일반론 금지)
  const adv=[];
  if(idx&&typeof idx.indexed==='number'){
    const iDt=idx.checked_at?' ('+String(idx.checked_at).slice(5)+' 실측)':'';
    if(idx.indexed===0){const cr=Object.values(idx.posts||{}).filter(p=>p&&p.lastCrawl).length;
      adv.push('색인 0/'+idx.total+iDt+' — 크롤 '+cr+'편·미크롤 '+(idx.total-cr)+'편. GSC 일일한도+OSMU 백링크로 점진(재검토는 색인 잡힌 뒤).');}
    else adv.push('색인 '+idx.indexed+'/'+idx.total+'편'+iDt+'.');
  }
  if(oNv>oTh) adv.push('OSMU 쓰레드 '+oTh+'/'+oNv+' — '+(oNv-oTh)+'편 미게시(rate-limit 보류분 재시도 필요).');
  if(oTh>oIn) adv.push('OSMU 인스타 '+oIn+'/'+oTh+' — 쓰레드 확산 대비 '+(oTh-oIn)+'편 미확산(카드뉴스 backlog).');
  if(collab&&collab.uncommitted>=10) adv.push('미커밋 '+collab.uncommitted+'파일 — 발행 완료 후 세션별 커밋 분리 권장.');
  const adviceHtml=adv.length?'<div class="advice">'+adv.map(t=>'<div class="ai"><span class="ic">💡</span><span>'+esc(t)+'</span></div>').join('')+'</div>':'<div class="pcode none">현재 조치 필요 항목 없음</div>';
  // 📋 미결 관리 — 글별(pending.json: DB osmu + index_status에서 계산)
  const pc=(pend&&pend.counts)||{};
  const cb=(ok,l)=>'<span class="ch '+(ok?'on':'off')+'">'+l+(ok?'✓':'✗')+'</span>';
  const pendRows=(pend&&pend.actionable||[]).map(a=>{
    const c=a.ch||{};
    return '<div class="prow"><span class="pcd">'+esc(a.code)+'</span><span class="ptt">'+esc(a.title)+'</span>'
    +cb(c.g!==false,'G')+cb(c.n,'N')+cb(c.t,'T')+cb((osmuByCode[a.code]||{}).instagram,'I')+'</div>';
  }).join('');
  // 표시는 상위 14편으로 잘려 있음(pending.py) → 남은 수는 counts로 계산해 "…외 N편"
  const pendListed=(pend&&pend.actionable||[]).length;
  const pendTotal=Math.max(pc.osmu_pending||0,pc.index_pending||0);
  const pendMore=pendTotal>pendListed?'<div class="cnt">…외 '+(pendTotal-pendListed)+'편</div>':'';
  const pendHtml='<div class="cnt">OSMU 대기 '+(pc.osmu_pending||0)+'편 · 색인 대기 '+(pc.index_pending||0)+'편 / 전체 '+(pc.total||0)+'편</div>'+(pendRows||'<div class="pcode none">미결 없음</div>')+pendMore;
  // 📋 발행 대기 (발행 전 큐 — queue.json) : 코드·제목·썸네일을 한 카드로 묶어 '엉뚱한 글/썸네일' 눈으로 차단
  const qItems=(queue&&queue.items)||[];
  const laneLab={info:'정보성',pop:'대중관심'};
  const qCards=qItems.map(it=>{
    const th=it.thumb_data
      ?'<img class="qth" src="'+it.thumb_data+'" alt="">'
      :'<div class="qth none">썸네일<br>없음</div>';
    const facts=it.facts?'<div class="qfacts">'+esc(it.facts)+'</div>':'';
    const draft=it.draft?'<span class="qdraft">📄 '+esc(it.draft)+'</span>':'';
    const pv=it.body?'<button class="qpv" onclick="qpv(\''+esc(it.code||'')+'\')">👁 본문 미리보기</button>'
                    :'<span class="qpv none">초안 없음(작성 전)</span>';
    return '<div class="qcard">'+th
      +'<div class="qbody"><div class="qtop"><span class="qcode">'+esc(it.code||'')+'</span>'
      +'<span class="qlane '+(it.lane||'info')+'">'+esc(laneLab[it.lane]||it.lane||'')+'</span></div>'
      +'<div class="qtitle">'+esc(it.title||'')+'</div>'+facts
      +'<div class="qmeta">'+pv+draft+'</div></div></div>';
  }).join('');
  const qHtml=qItems.length
    ?'<div class="cnt">발행 대기 '+qItems.length+'건 — 발행하면 카드가 자동으로 사라집니다(사람 승인 게이트)</div>'+qCards
    :'<div class="pcode none">발행 대기 없음 — PREP 루틴이 준비하면 여기 카드로 뜹니다</div>';
  document.getElementById('board').innerHTML=
   '<div class="hd"><div class="t"><h1>진행현황</h1><span class="date">'+esc(date)+'</span></div>'
   +'<span class="badge '+bcls+'">'+CHECK+esc(blab)+'</span></div>'
   +'<div class="sec">오늘 한 일</div>'+today
   +'<div class="metrics">'
   +'<div class="m"><div class="l">검사 통과</div><div class="v">'+pass+' <small>/ '+total+'</small></div></div>'
   +'<div class="m"><div class="l">블로그 글</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">평균 본문</div><div class="v">'+avg+' <small>자</small></div></div>'
   +'</div>'
   +'<div class="div"></div>'
   +'<div class="sec">📋 발행 대기 (오늘 발행할 글)<span class="auto">🤖 PREP 큐</span></div>'+qHtml
   +'<div class="div"></div>'
   +'<div class="sec">발행 진행 (글 1편 · '+STEPS.length+'단계, 확산 포함)<span class="auto">🤖 자동</span></div>'+pubHtml
   +'<div class="div"></div>'
   +'<div class="sec">📡 4채널 발행 현황 (구글·네이버·쓰레드·인스타)<span class="auto">🤖 DB 자동집계</span></div>'
   +'<div class="metrics">'
   +'<div class="m"><div class="l">구글(원본)</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">네이버</div><div class="v">'+oNv+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">쓰레드</div><div class="v">'+oTh+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">인스타</div><div class="v">'+oIn+' <small>편</small></div></div>'
   +'</div>'
   +'<div class="cnt">확산 커버리지 · 네이버 '+(count?Math.round(oNv/count*100):0)+'% · 쓰레드 '+(count?Math.round(oTh/count*100):0)+'% · 인스타 '+(count?Math.round(oIn/count*100):0)+'% · 교차링크 완료 '+omAll.length+'편</div>'
   +osmuLi
   +'<div class="div"></div>'
   +'<div class="sec">🤝 협업 — 세션별 역할·진행<span class="auto">git 자동분류</span></div>'+collabHtml
   +'<div class="sec">💡 시스템 조언<span class="auto">라이브 도출</span></div>'+adviceHtml
   +'<div class="div"></div>'
   +'<div class="sec">📋 미결 관리 — 4채널 매칭<span class="auto">G구글·N네이버·T쓰레드·I인스타</span></div>'+pendHtml
   +'<div class="sec">다음</div><div class="next">'+next+'</div>'
   +'<div class="upd" id="upd"></div>';
  tick();
}
// 시계·데이터 기준만 갱신(보드 전체 재렌더 없음 — 정적 베이크 데이터라 시계만 변함)
function tick(){
  const el=document.getElementById('upd'); if(!el)return;
  const b=(window.__DATA__||{}).baked_at;
  el.textContent=(b?'데이터 기준 '+b+' · ':'')+new Date().toLocaleTimeString('ko-KR');
}
// 👁 발행 대기 카드 본문 미리보기 — 초안 HTML을 격리 iframe(srcdoc)로 렌더(스타일 누수 차단, Blogger 미접촉)
function qpv(code){
  const items=((window.__DATA__||{}).queue||{}).items||[];
  const it=items.find(x=>x.code===code); if(!it||!it.body)return;
  document.getElementById('qpv-ttl').textContent=(it.code||'')+' · '+(it.title||'');
  document.getElementById('qpv-fr').srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank"><body style="margin:0;padding:16px;background:#fff">'+it.body+'</body>';
  document.getElementById('qpv-ov').classList.add('show');
}
function qpvClose(){document.getElementById('qpv-ov').classList.remove('show');document.getElementById('qpv-fr').srcdoc='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')qpvClose();});
// 코드 자동 반영: 자기 자신(progress.html)을 주기적으로 fetch→해시 비교, 바뀌면 1회 reload
const _hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
let _selfHash=null;
async function checkVersion(){
  try{
    const r=await fetch('progress.html?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;                                // 일시적 404/500에 해시 오염 → 불필요 reload 방지
    const t=await r.text();
    const h=_hash(t);
    if(_selfHash===null){_selfHash=h;return;}      // 첫 호출=기준선 저장
    if(h!==_selfHash) location.reload();            // 코드 변경 감지 → 자동 새로고침
  }catch(e){}
}
load(); checkVersion(); setInterval(tick,5000); setInterval(checkVersion,5000);
</script>
