und:#eefaf7;border:1px solid #cfeee6;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#1a8c78;margin-bottom:8px}\n.lsg .rel a{display:block;color:#1f6f61;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#93a7a1;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">정부지원·복지<\/span>\n<p>이혼할 때 재산은 나눴는데 <b>국민연금은 어떻게 되는지<\/b> 모르고 넘어가는 경우가 많습니다. 결혼 기간 동안 배우자가 쌓은 국민연금 중 <b>내 몫을 평생 매달 받을 수 있는 제도<\/b>가 <b>분할연금<\/b>입니다. 그런데 이 제도는 <b>가만히 있으면 자동으로 주지 않고<\/b>, 요건을 하나라도 못 채우거나 <b>기한(5년)을 넘기면 그대로 사라집니다.<\/b> 받을 수 있는 사람·못 받는 사람, 얼마가 나오는지 계산하는 법, 언제까지 청구해야 하는지를 국민연금공단·국민연금법 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 분할연금이란 — 재산분할과 뭐가 다른가<\/a><a href=\"#sec2\">2. 받을 수 있는 사람 — 요건 4가지<\/a><a href=\"#value-add\">3. 얼마 나오나 — 3단계 계산법과 사례 2개<\/a><a href=\"#sec3\">4. 청구 기한 5년 · 선청구 3년 (가장 많이 놓치는 부분)<\/a><a href=\"#sec4\">5. 못 받는 경우 6가지 (탈락 사유)<\/a><a href=\"#sec5\">6. 오해하기 쉬운 함정 5가지<\/a><a href=\"#sec6\">7. 신청 방법 · 필요서류<\/a><a href=\"#sec7\">8. 자주 묻는 질문<\/a><a href=\"#sec8\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#value-add\">👉 내 분할연금액이 얼마인지 계산부터 보기<\/a>\n<h2 id=\"sec1\">1. 분할연금이란 — 재산분할과 뭐가 다른가<\/h2>\n<p>분할연금은 <b>혼인 기간 중 배우자가 쌓은 국민연금 가입기간에 대해, 그 노령연금의 일부를 이혼한 배우자에게 나눠 지급하는 제도<\/b>입니다. 전업주부처럼 소득활동을 하지 않았더라도 <b>가사·양육으로 배우자의 연금 형성에 기여했다고 보는 것<\/b>이 제도의 취지입니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>이혼 재산분할<\/th><th>분할연금<\/th><\/tr>\n<tr><td>주는 곳<\/td><td>상대 배우자(당사자)<\/td><td><b>국민연금공단<\/b><\/td><\/tr>\n<tr><td>받는 방식<\/td><td>합의·판결에 따라 <b>일시<\/b> 정산이 보통<\/td><td><b>매달, 평생<\/b> 지급<\/td><\/tr>\n<tr><td>물가 반영<\/td><td>없음<\/td><td><b>매년 물가상승률만큼 인상<\/b><\/td><\/tr>\n<tr><td>청구 상대<\/td><td>법원·상대방<\/td><td>공단에 <b>본인이 직접 청구<\/b><\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 핵심 한 줄<\/b><p style=\"margin:8px 0 0\">재산분할을 이미 끝냈어도 <b>분할연금은 별개로 청구<\/b>할 수 있습니다. 다만 이혼 절차에서 <b>연금 분할을 다르게 정하기로 명시 합의<\/b>했다면 그 내용이 우선합니다(6번 함정 참고).<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec2\">2. 받을 수 있는 사람 — 요건 4가지<\/h2>\n<p>아래 <b>네 가지를 모두<\/b> 충족해야 합니다. 하나라도 빠지면 지급되지 않습니다.<\/p>\n<table>\n<tr><th>요건<\/th><th>내용<\/th><\/tr>\n<tr><td><b>① 혼인기간 5년 이상<\/b><\/td><td>단순 결혼 기간이 아니라 <b>배우자의 국민연금 가입기간 중 혼인기간<\/b>이 5년 이상이어야 합니다<\/td><\/tr>\n<tr><td><b>② 이혼<\/b><\/td><td>협의이혼·재판상 이혼 모두 해당<\/td><\/tr>\n<tr><td><b>③ 전 배우자가 노령연금 수급권자<\/b><\/td><td>상대방이 노령연금을 받을 수 있는 상태여야 합니다(이혼 후 수급권을 취득한 경우도 포함)<\/td><\/tr>\n<tr><td><b>④ 본인이 지급개시연령 도달<\/b><\/td><td>출생연도에 따라 <b>61~65세<\/b><\/td><\/tr>\n<\/table>\n<h3>본인의 지급개시연령 (출생연도별)<\/h3>\n<table>\n<tr><th>출생연도<\/th><th>1953~56년<\/th><th>1957~60년<\/th><th>1961~64년<\/th><th>1965~68년<\/th><th>1969년 이후<\/th><\/tr>\n<tr><td><b>지급개시연령<\/b><\/td><td>61세<\/td><td>62세<\/td><td>63세<\/td><td>64세<\/td><td><b>65세<\/b><\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>⚠️ '혼인기간 5년'에서 빠지는 기간이 있습니다<\/b><p style=\"margin:8px 0 0\">2017년 12월 법 개정으로, <b>별거·가출 등으로 실질적인 혼인관계가 존재하지 않았던 기간은 혼인기간에서 제외<\/b>됩니다. 여기에 해당하는 것은 <b>법원의 실종선고 기간, 거주불명 등록 기간, 당사자 합의나 법원 재판으로 정해진 별거 기간<\/b> 등입니다. 즉 <b>서류상 결혼 기간이 7년이어도 별거 3년이 인정되면 4년<\/b>이 되어 5년 요건에서 탈락할 수 있습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"value-add\">3. 얼마 나오나 — 3단계 계산법과 사례 2개<\/h2>\n<p>분할연금액은 <b>\"배우자의 노령연금 전액의 절반\"이 아닙니다.<\/b> 법에서 정한 계산은 다음과 같습니다.<\/p>\n<div class=\"tip\"><b>📐 계산 공식 3단계<\/b>\n<p style=\"margin:8px 0 0\"><b>1단계<\/b> 전 배우자의 <b>노령연금액<\/b>에서 <b>부양가족연금액을 뺍니다<\/b>(부양가족연금은 분할 대상이 아님)<br>\n<b>2단계<\/b> 거기서 <b>혼인기간에 해당하는 몫<\/b>만 뽑습니다 → <b>연금액 × (혼인기간 중 가입월수 ÷ 전체 가입월수)<\/b><br>\n<b>3단계<\/b> 그 금액을 <b>균등하게(1/2)<\/b> 나눕니다<\/p><\/div>\n\n<h3>사례 ① 혼인기간이 가입기간의 절반인 경우<\/h3>\n<ul>\n<li>전 배우자 노령연금 <b>월 100만 원<\/b>(부양가족연금 제외)<\/li>\n<li>전체 가입기간 <b>300개월<\/b>, 그중 <b>혼인기간 중 가입기간 150개월<\/b><\/li>\n<\/ul>\n<table>\n<tr><th>단계<\/th><th>계산<\/th><th>결과<\/th><\/tr>\n<tr><td>2단계 — 혼인기간 몫<\/td><td>100만 원 × (150 ÷ 300)<\/td><td>50만 원<\/td><\/tr>\n<tr><td>3단계 — 균등 분할<\/td><td>50만 원 × 1/2<\/td><td><b>월 25만 원<\/b><\/td><\/tr>\n<\/table>\n<p>이 경우 전 배우자는 <b>100만 원 → 75만 원<\/b>으로 줄어들고, 본인이 <b>월 25만 원<\/b>을 평생 받습니다.<\/p>\n\n<h3>사례 ② 혼인기간이 짧은 경우<\/h3>\n<ul>\n<li>전 배우자 노령연금 <b>월 120만 원<\/b><\/li>\n<li>전체 가입기간 <b>360개월<\/b>, 그중 <b>혼인기간 중 가입기간 90개월<\/b>(7년 6개월)<\/li>\n<\/ul>\n<table>\n<tr><th>단계<\/th><th>계산<\/th><th>결과<\/th><\/tr>\n<tr><td>2단계 — 혼인기간 몫<\/td><td>120만 원 × (90 ÷ 360)<\/td><td>30만 원<\/td><\/tr>\n<tr><td>3단계 — 균등 분할<\/td><td>30만 원 × 1/2<\/td><td><b>월 15만 원<\/b><\/td><\/tr>\n<\/table>\n<p>혼인기간이 <b>5년을 넘겼더라도 가입기간 전체에서 차지하는 비중이 작으면 금액도 작아집니다.<\/b> \"이혼했으니 절반\"이라는 생각과 실제 금액 차이가 가장 크게 벌어지는 지점입니다.<\/p>\n\n<h3>③ 균등(1/2) 말고 다른 비율도 가능합니다<\/h3>\n<p>원칙은 <b>균등 분할(1/2)<\/b>이지만, <b>2016년 12월 30일 이후 분할연금 지급사유가 발생<\/b>한 경우에는 <b>당사자 협의 또는 법원 재판<\/b>으로 비율을 달리 정할 수 있습니다. 이 내용은 공단에 <b>별도로 신고<\/b>해야 반영됩니다.<\/p>\n<table>\n<tr><th>어떤 경우<\/th><th>어떻게 판단하나<\/th><\/tr>\n<tr><td>혼인기간 대부분을 <b>전업으로 가사·양육<\/b>에 썼다<\/td><td>균등(1/2)이 기본이므로 <b>그대로 청구<\/b>하는 것이 단순하고 유리한 편<\/td><\/tr>\n<tr><td>이혼 협의에서 <b>다른 조건과 맞바꾸려는<\/b> 경우<\/td><td>협의·재판으로 비율 조정 가능. 단 <b>합의서에 연금 분할 비율을 명시<\/b>해야 함(6번 참고)<\/td><\/tr>\n<tr><td>상대방이 <b>연금을 포기하라<\/b>고 요구하는 경우<\/td><td>포기 여부는 신중히 — 분할연금은 <b>평생·물가연동<\/b>이라 일시금 환산액보다 클 수 있음<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>📌 내 정확한 금액을 아는 방법<\/b><p style=\"margin:8px 0 0\">위 계산은 <b>공식이 어떻게 작동하는지<\/b> 보여주는 예시입니다. 전 배우자의 실제 연금액·가입월수는 본인이 알 수 없으므로, <b>국민연금공단 1355<\/b> 또는 가까운 지사에 문의해 <b>본인 기준 예상 분할연금액<\/b>을 확인하는 것이 가장 확실합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec3\">4. 청구 기한 5년 · 선청구 3년 (가장 많이 놓치는 부분)<\/h2>\n<p>분할연금에서 <b>돈을 실제로 날리는 원인 1위가 기한<\/b>입니다. 기한이 두 종류라 헷갈리기 쉽습니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>기한<\/th><th>기산점<\/th><\/tr>\n<tr><td><b>일반 청구<\/b><\/td><td><b>5년 이내<\/b><\/td><td><b>수급권이 발생한 날<\/b>(요건 4가지를 모두 갖춘 날)<\/td><\/tr>\n<tr><td><b>선청구<\/b><\/td><td><b>3년 이내<\/b><\/td><td><b>이혼의 효력이 발생한 날<\/b><\/td><\/tr>\n<\/table>\n<p><b>선청구<\/b>는 2015년 12월 개정으로 생긴 제도로, <b>아직 연령이 안 됐어도 이혼 직후 미리 청구해 두는 것<\/b>입니다. 미리 청구해 두면 <b>나중에 요건을 모두 갖춘 시점에 자동으로 지급이 시작<\/b>됩니다.<\/p>\n<table>\n<tr><th>상황<\/th><th>어느 쪽이 나은가<\/th><\/tr>\n<tr><td>이혼했고 <b>아직 60대가 아니다<\/b><\/td><td><b>선청구를 권장<\/b> — 이혼일로부터 3년 안에 해두면 잊어버릴 위험이 사라집니다<\/td><\/tr>\n<tr><td>이혼한 지 <b>3년이 지났다<\/b><\/td><td>선청구는 불가. 요건을 모두 갖춘 뒤 <b>5년 안에<\/b> 일반 청구<\/td><\/tr>\n<tr><td>이미 <b>지급개시연령이 지났다<\/b><\/td><td><b>즉시 청구<\/b> — 수급권 발생일로부터 5년이 지나면 못 받습니다<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>⏰ 5년이 무서운 이유<\/b><p style=\"margin:8px 0 0\">이 5년은 \"늦게 청구하면 그만큼 못 받는\" 것이 아니라 <b>기간이 지나면 권리 자체가 소멸<\/b>합니다. 요건을 다 갖췄는데 모르고 있다가 6년 뒤에 알게 되면 <b>한 푼도 못 받습니다.<\/b> 이혼 경험이 있다면 <b>60세가 되기 전에 1355로 한 번 확인<\/b>해 두세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec4\">5. 못 받는 경우 6가지 (탈락 사유)<\/h2>\n<table>\n<tr><th>이런 경우<\/th><th>왜 안 되나 / 어떻게 하나<\/th><\/tr>\n<tr><td><b>혼인기간 중 가입기간이 5년 미만<\/b><\/td><td>가장 흔한 탈락. 결혼 기간이 아니라 <b>그중 배우자가 국민연금에 가입돼 있던 기간<\/b>으로 셉니다<\/td><\/tr>\n<tr><td><b>별거 기간을 빼면 5년 미달<\/b><\/td><td>실질적 혼인관계 부존재 기간(실종선고·거주불명·합의/재판상 별거)은 <b>제외<\/b><\/td><\/tr>\n<tr><td><b>전 배우자가 노령연금 수급권자가 아니다<\/b><\/td><td>상대가 가입기간 10년 미달 등으로 <b>노령연금 수급권이 없으면<\/b> 분할할 대상 자체가 없음<\/td><\/tr>\n<tr><td><b>본인이 지급개시연령 전<\/b><\/td><td>아직 나이가 안 됐다면 지금은 못 받음 → <b>선청구(이혼 후 3년 이내)<\/b>로 예약<\/td><\/tr>\n<tr><td><b>청구 기한(5년) 도과<\/b><\/td><td>수급권 발생일부터 5년이 지나면 <b>권리 소멸<\/b><\/td><\/tr>\n<tr><td><b>사실혼만 있었고 법률상 이혼이 아니다<\/b><\/td><td>분할연금은 <b>법률혼의 이혼<\/b>을 전제로 합니다. 개별 사정은 공단 상담 필요<\/td><\/tr>\n<\/table>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec5\">6. 오해하기 쉬운 함정 5가지<\/h2>\n<h3>함정 ① \"재혼하면 끊긴다\" → 아닙니다<\/h3>\n<p>2007년 7월 법 개정으로 <b>분할연금 수급권을 취득한 뒤에는 재혼해도 계속 받습니다.<\/b> 같은 개정으로 <b>본인의 노령연금과 분할연금을 함께(합산) 받을 수도<\/b> 있게 됐습니다. \"재혼하면 없어진다\"는 말 때문에 청구를 미루는 경우가 있는데, <b>사실이 아닙니다.<\/b><\/p>\n<h3>함정 ② \"전 배우자가 죽으면 끊긴다\" → 시점에 따라 갈립니다<\/h3>\n<p>국민연금법은 <b>분할연금 수급권을 취득한 뒤<\/b>에는 전 배우자에게 생긴 사유(사망 등)로 그의 노령연금 수급권이 소멸·정지되어도 <b>분할연금은 영향을 받지 않는다<\/b>고 정하고 있습니다. 반대로 <b>수급권을 갖추기 전<\/b>에 전 배우자가 사망해 노령연금 수급권 자체가 없어지면 요건 ③을 못 채웁니다. <b>여기서도 '미리 청구해 두는 것'이 방어책<\/b>이 됩니다.<\/p>\n<h3>함정 ③ 재산분할 합의서에 안 적으면 → 균등(1/2)이 원칙<\/h3>\n<p>대법원은 <b>2019년 6월 13일 선고 2018두65088<\/b> 판결에서, 이혼 재산분할 절차에서 연금 분할이 \"별도로 결정\"된 것으로 인정되려면 <b>당사자 사이에 연금의 분할 비율 등을 달리 정하기로 하는 명시적 합의가 있었거나 법원이 이를 달리 결정했음이 분명히 드러나야 한다<\/b>고 판단했습니다. 조정조서·협의서에 <b>연금 분할 비율이 적혀 있지 않다면<\/b>, 이혼배우자가 분할연금 수급권을 포기했다거나 불리한 비율에 동의했다고 <b>쉽게 단정할 수 없다<\/b>는 취지입니다. 즉 <b>합의서의 포괄적인 \"서로 청구하지 않는다\" 조항만으로는 연금 분할이 정해진 것으로 보기 어렵습니다.<\/b> 반대로 비율을 다르게 하고 싶다면 <b>반드시 명시적으로 적어야<\/b> 합니다.<\/p>\n<h3>함정 ④ \"이혼하면 공단이 알아서 준다\" → 직접 청구해야 합니다<\/h3>\n<p>이혼 사실을 공단이 안다고 해서 자동 지급되지 않습니다. <b>본인이 청구서를 내야<\/b> 시작됩니다. 그래서 기한(5년/선청구 3년)이 결정적입니다.<\/p>\n<h3>함정 ⑤ \"내가 받으면 전 배우자 연금은 그대로\" → 줄어듭니다<\/h3>\n<p>분할연금은 <b>새로 만들어 주는 돈이 아니라 전 배우자의 노령연금에서 떼어 오는 돈<\/b>입니다. 그래서 원 수급자의 연금액은 그만큼 줄어듭니다. 이혼 상대방과 갈등이 생길 수 있는 지점이지만, <b>법이 정한 권리<\/b>라는 점은 분명합니다.<\/p>\n<!-- [운영자 경험 자리] 지인/가족의 분할연금 상담 경험이 있으면 1~2문장. 없으면 비워둠 -->\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec6\">7. 신청 방법 · 필요서류<\/h2>\n<ol>\n<li><b>신청 방법<\/b>: <b>지사 방문, 우편, 팩스, ARS, 인터넷(정부24), 모바일 앱<\/b> 모두 가능합니다. 전화 문의는 <b>국민연금공단 1355<\/b>(평일 09~18시).<\/li>\n<li><b>필요 서류<\/b>: <b>분할연금 지급청구서<\/b>, <b>신분증<\/b>, <b>혼인관계증명서(주민등록번호 포함)<\/b>, <b>본인 예금계좌<\/b>.<\/li>\n<li><b>비율을 달리 정했다면<\/b>: 협의서 또는 <b>법원 판결·조정조서<\/b> 등 <b>연금 분할 비율이 명시된 서류<\/b>를 함께 제출해야 반영됩니다.<\/li>\n<li><b>선청구<\/b>: 이혼 효력 발생일로부터 <b>3년 이내<\/b>에 <b>분할연금 선청구서<\/b>를 제출해 두면, 이후 요건을 모두 갖춘 때부터 지급됩니다.<\/li>\n<\/ol>\n<div class=\"tip\"><b>✅ 진행 순서 정리<\/b><p style=\"margin:8px 0 0\">① 이혼 사실·혼인기간 확인(혼인관계증명서) → ② 배우자의 <b>가입기간 중 혼인기간이 5년 이상<\/b>인지 1355 확인 → ③ 내 지급개시연령 확인(위 표) → ④ <b>연령 전이면 선청구, 연령 후면 즉시 청구<\/b> → ⑤ 비율을 달리 정했다면 관련 서류 함께 제출.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec7\">8. 자주 묻는 질문<\/h2>\n<h3>Q. 20년 살고 이혼했는데 배우자가 그중 4년만 국민연금에 가입했습니다. 받을 수 있나요?<\/h3>\n<p>어렵습니다. 기준은 결혼 기간 20년이 아니라 <b>배우자의 가입기간 중 혼인기간<\/b>이며, 그것이 <b>5년 이상<\/b>이어야 합니다. 4년이면 요건 미달입니다. 다만 개인별 이력 확인이 필요하니 <b>1355로 실제 가입월수를 확인<\/b>해 보세요.<\/p>\n<h3>Q. 제 국민연금도 있는데, 분할연금까지 같이 받을 수 있나요?<\/h3>\n<p>가능합니다. 2007년 개정으로 <b>본인의 노령연금과 분할연금을 합산해 받을 수<\/b> 있습니다.<\/p>\n<h3>Q. 이혼한 지 10년이 넘었습니다. 늦었나요?<\/h3>\n<p>선청구(이혼 후 3년)는 이미 지났지만, <b>일반 청구의 5년은 '수급권이 발생한 날'부터<\/b> 셉니다. 아직 지급개시연령에 도달하지 않았다면 수급권이 발생하지 않았으므로 <b>늦지 않았습니다.<\/b> 반대로 연령·요건을 이미 다 갖춘 지 5년이 넘었다면 소멸됐을 수 있으니 <b>즉시 확인<\/b>하세요.<\/p>\n<h3>Q. 전 배우자가 아직 연금을 안 받고 있으면 어떻게 되나요?<\/h3>\n<p>요건 ③은 전 배우자가 <b>노령연금 수급권자<\/b>일 것을 요구합니다. 아직 수급권이 없다면 그 시점까지 기다려야 하며, 이런 경우에도 <b>선청구를 해두면<\/b> 요건이 갖춰지는 때 지급이 시작됩니다.<\/p>\n<h3>Q. 전 배우자와 다시 재결합했습니다. 분할연금은요?<\/h3>\n<p>국민연금법에는 <b>분할연금 수급권 포기<\/b> 규정이 있어, 이혼했던 배우자와 <b>다시 혼인한 경우<\/b> 등에 포기 신청을 할 수 있습니다. 개별 상황에 따라 처리가 달라지므로 <b>1355 상담<\/b>이 필요합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec8\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0061M0.do\" target=\"_blank\" rel=\"nofollow\">▸ 국민연금공단 — 분할연금 안내(요건·분할비율·청구기한)<\/a><a href=\"https://www.nps.or.kr\" target=\"_blank\" rel=\"nofollow\">▸ 국민연금공단 — 전자민원(연금 청구·내 연금 알아보기)<\/a><a href=\"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B5%AD%EB%AF%BC%EC%97%B0%EA%B8%88%EB%B2%95\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 국민연금법(제64조 분할연금)<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">분할연금은 <b>배우자의 가입기간 중 혼인기간 5년 이상 + 이혼 + 전 배우자의 노령연금 수급권 + 본인 61~65세<\/b>, 이 네 가지가 모두 맞아야 나옵니다. 금액은 <b>노령연금(부양가족연금 제외) × 혼인기간 비율 ÷ 2<\/b>이고, 협의·재판으로 비율을 달리 정할 수도 있습니다. 가장 조심할 것은 <b>기한<\/b>입니다 — <b>수급권 발생일로부터 5년<\/b>, 아직 나이가 안 됐다면 <b>이혼일로부터 3년 안에 선청구<\/b>. 재혼해도 계속 받고 내 노령연금과 합산해 받을 수 있으니, 이혼 경험이 있다면 <b>오늘 1355로 혼인기간부터 확인<\/b>해 보세요.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 수급 요건·지급개시연령·청구 기한은 법령 개정으로 달라질 수 있습니다. 개인별 가입 이력에 따라 결과가 다르므로 신청 전 국민연금공단(1355)에서 확인하세요.<br>출처: <a href=\"https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0061M0.do\">국민연금공단 분할연금 안내<\/a>, <a href=\"https://www.law.go.kr\">국가법령정보센터<\/a> 국민연금법 제64조·제64조의2·제64조의3·제64조의4·제65조 및 개정이유(2007·2015·2017년), 대법원 2019. 6. 13. 선고 <b style=\"display:inline;color:#33503a;margin:0\">2018두65088<\/b> 판결<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_813.html\">▸ 국민연금 예상 수령액 조회 방법 수령나이 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01191203420.html\">▸ 국민연금 조기노령연금 연기연금 신청 방법 감액률 증액률 손익분기 총정리 (2026)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01162794658.html\">▸ 국민연금 추납 임의가입 방법 못 낸 기간 채워 수령액 늘리기 총정리 (2026)<\/a><\/div>\n\n<div id=\"ymyl-disclaimer\" style=\"margin-top:22px;font-size:13px;color:#666;line-height:1.6\">본 글은 정보 제공용이며, 실제 수급 가능 여부·분할연금액은 국민연금공단의 심사와 개인별 가입 이력에 따라 달라집니다. 본문의 계산 사례는 공식 산정 방식을 설명하기 위한 가정값이며, 법률 자문이 아닙니다.<\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 수치·자격·기한은 <b>공식 자료를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 제도는 바뀔 수 있으니 신청 전 공식 페이지를 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 이혼했다면 전 배우자의 국민연금 중 내 몫을 평생 매달 받을 수 있습니다. 조건은 네 가지 — ①배우자의 가입기간 중 혼인기간 5년 이상 ②이혼 ③전 배우자가 노령연금 수급권자 ④본인이 61~65세(출생연도별) 도달.\n2. 금액은 \"절반\"이 아닙니다. 노령연금(부양가족연금 제외) × (혼인기간 중 가입월수 ÷ 전체 가입월수) ÷ 2. 예) 월 100만 원·가입 300개월 중 혼인 150개월이면 → 월 25만 원.\n3. 가장 많이 날리는 이유는 기한입니다. 수급권 발생일로부터 5년이 지나면 권리 자체가 소멸. 아직 나이가 안 됐다면 이혼일로부터 3년 이내 '선청구'로 예약해 두세요. 재혼해도 계속 받고, 내 노령연금과 합산해서도 받습니다(1355).\n"}]},"db":{"version":1,"updated":"2026-07-24","root":"lifeinfo","blog":"https://lifeinfo8975.blogspot.com/","taxonomy":[{"code":"A","name":"정부지원·복지","color":"#2BC4B0","subs":[{"code":"A1","name":"지원금·수당"},{"code":"A2","name":"생계·바우처 지원"},{"code":"A5","name":"근로·구직 지원"},{"code":"A3","name":"연금·노후"},{"code":"A4","name":"위기·재난 지원"}]},{"code":"B","name":"세금·금융","color":"#4D9DE0","subs":[{"code":"B1","name":"지방세"},{"code":"B4","name":"국세"},{"code":"B2","name":"금융·은행"},{"code":"B3","name":"연금자산"}]},{"code":"C","name":"건강·의료","color":"#     pubHtml='<div class="pcode none">진행 중인 발행 없음</div>';
  }
  const osmuLi=oRecent.map(r=>'<div class="row done">'+CHECK+'<span>'+esc(r.code)+' '+esc((r.title||'').slice(0,15))+'</span><span class="mut" style="margin-left:auto;font-size:10.5px">'+(r.osmu.naver?'네이버 ':'')+(r.osmu.threads?'쓰레드':'')+'</span></div>').join('');
  // 🤝 협업 — 세션별(collab.json: 정체성=레지스트리·활동=git log·상태=git status)
  const stLab={active:'활동중',uncommitted:'미커밋',idle:'대기'};
  const collabHtml=(collab&&collab.agents||[]).map(a=>{
    const acts=(a.recent||[]).map(r=>'<div class="act">'+esc((r.s||'').slice(0,40))+' <span class="d">'+esc(r.d||'')+'</span></div>').join('');
    return '<div class="agent"><div class="ah">'+esc(a.emoji||'')+'<span>'+esc(a.name||'')+'</span><span class="st '+(a.state||'idle')+'">'+(stLab[a.state]||a.state||'')+'</span></div>'
      +'<div class="role">'+esc(a.role||'')+'</div><div class="own">담당 '+esc(a.owns||'')+'</div>'+acts+'</div>';
  }).join('');
  // 💡 시스템 조언 — 라이브 데이터 조건에서만 도출(하드코딩 일반론 금지)
  const adv=[];
  if(idx&&typeof idx.indexed==='number'){
    const iDt=idx.checked_at?' ('+String(idx.checked_at).slice(5)+' 실측)':'';
    if(idx.indexed===0){const cr=Object.values(idx.posts||{}).filter(p=>p&&p.lastCrawl).length;
      adv.push('색인 0/'+idx.total+iDt+' — 크롤 '+cr+'편·미크롤 '+(idx.total-cr)+'편. GSC 일일한도+OSMU 백링크로 점진(재검토는 색인 잡힌 뒤).');}
    else adv.push('색인 '+idx.indexed+'/'+idx.total+'편'+iDt+'.');
  }
  if(oNv>oTh) adv.push('OSMU 쓰레드 '+oTh+'/'+oNv+' — '+(oNv-oTh)+'편 미게시(rate-limit 보류분 재시도 필요).');
  if(collab&&collab.uncommitted>=10) adv.push('미커밋 '+collab.uncommitted+'파일 — 발행 완료 후 세션별 커밋 분리 권장.');
  const adviceHtml=adv.length?'<div class="advice">'+adv.map(t=>'<div class="ai"><span class="ic">💡</span><span>'+esc(t)+'</span></div>').join('')+'</div>':'<div class="pcode none">현재 조치 필요 항목 없음</div>';
  // 📋 미결 관리 — 글별(pending.json: DB osmu + index_status에서 계산)
  const pc=(pend&&pend.counts)||{};
  const cb=(ok,l)=>'<span class="ch '+(ok?'on':'off')+'">'+l+(ok?'✓':'✗')+'</span>';
  const pendRows=(pend&&pend.actionable||[]).map(a=>{
    const c=a.ch||{};
    return '<div class="prow"><span class="pcd">'+esc(a.code)+'</span><span class="ptt">'+esc(a.title)+'</span>'
    +cb(c.g!==false,'G')+cb(c.n,'N')+cb(c.t,'T')+'</div>';
  }).join('');
  // 표시는 상위 14편으로 잘려 있음(pending.py) → 남은 수는 counts로 계산해 "…외 N편"
  const pendListed=(pend&&pend.actionable||[]).length;
  const pendTotal=Math.max(pc.osmu_pending||0,pc.index_pending||0);
  const pendMore=pendTotal>pendListed?'<div class="cnt">…외 '+(pendTotal-pendListed)+'편</div>':'';
  const pendHtml='<div class="cnt">OSMU 대기 '+(pc.osmu_pending||0)+'편 · 색인 대기 '+(pc.index_pending||0)+'편 / 전체 '+(pc.total||0)+'편</div>'+(pendRows||'<div class="pcode none">미결 없음</div>')+pendMore;
  // 📋 발행 대기 (발행 전 큐 — queue.json) : 코드·제목·썸네일을 한 카드로 묶어 '엉뚱한 글/썸네일' 눈으로 차단
  const qItems=(queue&&queue.items)||[];
  const laneLab={info:'정보성',pop:'대중관심'};
  const qCards=qItems.map(it=>{
    const th=it.thumb_data
      ?'<img class="qth" src="'+it.thumb_data+'" alt="">'
      :'<div class="qth none">썸네일<br>없음</div>';
    const facts=it.facts?'<div class="qfacts">'+esc(it.facts)+'</div>':'';
    const draft=it.draft?'<span class="qdraft">📄 '+esc(it.draft)+'</span>':'';
    const pv=it.body?'<button class="qpv" onclick="qpv(\''+esc(it.code||'')+'\')">👁 본문 미리보기</button>'
                    :'<span class="qpv none">초안 없음(작성 전)</span>';
    return '<div class="qcard">'+th
      +'<div class="qbody"><div class="qtop"><span class="qcode">'+esc(it.code||'')+'</span>'
      +'<span class="qlane '+(it.lane||'info')+'">'+esc(laneLab[it.lane]||it.lane||'')+'</span></div>'
      +'<div class="qtitle">'+esc(it.title||'')+'</div>'+facts
      +'<div class="qmeta">'+pv+draft+'</div></div></div>';
  }).join('');
  const qHtml=qItems.length
    ?'<div class="cnt">발행 대기 '+qItems.length+'건 — 발행하면 카드가 자동으로 사라집니다(사람 승인 게이트)</div>'+qCards
    :'<div class="pcode none">발행 대기 없음 — PREP 루틴이 준비하면 여기 카드로 뜹니다</div>';
  document.getElementById('board').innerHTML=
   '<div class="hd"><div class="t"><h1>진행현황</h1><span class="date">'+esc(date)+'</span></div>'
   +'<span class="badge '+bcls+'">'+CHECK+esc(blab)+'</span></div>'
   +'<div class="sec">오늘 한 일</div>'+today
   +'<div class="metrics">'
   +'<div class="m"><div class="l">검사 통과</div><div class="v">'+pass+' <small>/ '+total+'</small></div></div>'
   +'<div class="m"><div class="l">블로그 글</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">평균 본문</div><div class="v">'+avg+' <small>자</small></div></div>'
   +'</div>'
   +'<div class="div"></div>'
   +'<div class="sec">📋 발행 대기 (오늘 발행할 글)<span class="auto">🤖 PREP 큐</span></div>'+qHtml
   +'<div class="div"></div>'
   +'<div class="sec">발행 진행 (글 1편 · '+STEPS.length+'단계, 확산 포함)<span class="auto">🤖 자동</span></div>'+pubHtml
   +'<div class="div"></div>'
   +'<div class="sec">📡 3채널 발행 현황 (구글·네이버·쓰레드)<span class="auto">🤖 DB 자동집계</span></div>'
   +'<div class="metrics">'
   +'<div class="m"><div class="l">구글(원본)</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">네이버</div><div class="v">'+oNv+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">쓰레드</div><div class="v">'+oTh+' <small>편</small></div></div>'
   +'</div>'
   +'<div class="cnt">확산 커버리지 · 네이버 '+(count?Math.round(oNv/count*100):0)+'% · 쓰레드 '+(count?Math.round(oTh/count*100):0)+'% · 교차링크 완료 '+omAll.length+'편</div>'
   +osmuLi
   +'<div class="div"></div>'
   +'<div class="sec">🤝 협업 — 세션별 역할·진행<span class="auto">git 자동분류</span></div>'+collabHtml
   +'<div class="sec">💡 시스템 조언<span class="auto">라이브 도출</span></div>'+adviceHtml
   +'<div class="div"></div>'
   +'<div class="sec">📋 미결 관리 — 3채널 매칭<span class="auto">G구글·N네이버·T쓰레드</span></div>'+pendHtml
   +'<div class="sec">다음</div><div class="next">'+next+'</div>'
   +'<div class="upd" id="upd"></div>';
  tick();
}
// 시계·데이터 기준만 갱신(보드 전체 재렌더 없음 — 정적 베이크 데이터라 시계만 변함)
function tick(){
  const el=document.getElementById('upd'); if(!el)return;
  const b=(window.__DATA__||{}).baked_at;
  el.textContent=(b?'데이터 기준 '+b+' · ':'')+new Date().toLocaleTimeString('ko-KR');
}
// 👁 발행 대기 카드 본문 미리보기 — 초안 HTML을 격리 iframe(srcdoc)로 렌더(스타일 누수 차단, Blogger 미접촉)
function qpv(code){
  const items=((window.__DATA__||{}).queue||{}).items||[];
  const it=items.find(x=>x.code===code); if(!it||!it.body)return;
  document.getElementById('qpv-ttl').textContent=(it.code||'')+' · '+(it.title||'');
  document.getElementById('qpv-fr').srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank"><body style="margin:0;padding:16px;background:#fff">'+it.body+'</body>';
  document.getElementById('qpv-ov').classList.add('show');
}
function qpvClose(){document.getElementById('qpv-ov').classList.remove('show');document.getElementById('qpv-fr').srcdoc='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')qpvClose();});
// 코드 자동 반영: 자기 자신(progress.html)을 주기적으로 fetch→해시 비교, 바뀌면 1회 reload
const _hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
let _selfHash=null;
async function checkVersion(){
  try{
    const r=await fetch('progress.html?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;                                // 일시적 404/500에 해시 오염 → 불필요 reload 방지
    const t=await r.text();
    const h=_hash(t);
    if(_selfHash===null){_selfHash=h;return;}      // 첫 호출=기준선 저장
    if(h!==_selfHash) location.reload();            // 코드 변경 감지 → 자동 새로고침
  }catch(e){}
}
load(); checkVersion(); setInterval(tick,5000); setInterval(checkVersion,5000);
</script>
