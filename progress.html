<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
/* 2026-08-13 콘솔 공통 팔레트로 통일(사용자 지시: 탭마다 화면형식이 제각각이라
   정리 요청) — index.html·categories.html·dashboard.html·search.html 이 이미 쓰던
   #0f1626 계열을 진실원으로 삼는다. 변수명은 그대로 둬서 아래 규칙은 안 건드림. */
:root{--bg:#0f1626;--card:#16203a;--card2:#0c1220;--line:#2a3a5e;--txt:#e8edf7;--mut:#9fb0d0;--ok:#06d6a0;--warn:#ffd166;--bad:#ff5c5c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
/* 2026-08-13 사용자 지시: "운영관리 탭과 화면구성이 달라 일목요연하지 않다,
   KPI대시보드 형식으로" — 좁은 470px 팝업카드였던 걸 adsense.html·gsc.html과
   같은 넓은 KPI 대시보드 톤으로 바꾼다. #board 에 innerHTML 을 꽂는 JS 로직은
   그대로이고(같은 클래스명), 여기 CSS만 넓혀서/키워서 통일한다. */
/* 2026-08-13 재수정 — "가운데로 화면이 몰려있잖아!": gsc·batch·seo 등 나머지
   운영관리 페이지는 폭 제한이 없다. 1080px 가운데정렬은 adsense.html 혼자만의
   패턴이었다. 폭 제한을 없애 화면을 꽉 채운다. */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px;width:100%}
.hd{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:19px;font-weight:700}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(6,214,160,.16);color:var(--ok)}
.b-warn{background:rgba(255,209,102,.16);color:var(--warn)}
.b-bad{background:rgba(255,92,92,.16);color:var(--bad)}
.sec{font-size:13px;color:#9db0c6;font-weight:800;letter-spacing:.02em;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
/* KPI 카드 그리드 — adsense.html 의 .kpi-grid 와 같은 형식으로 통일 */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 6px}
.m{background:var(--card2);border:1px solid var(--line);border-top:3px solid #3a4a63;border-radius:12px;padding:12px 14px}
.m .l{font-size:11.5px;color:var(--mut);font-weight:700}
.m .v{font-size:24px;font-weight:800;margin-top:3px;line-height:1.2}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #243049;font-size:12.5px}
li:last-child{border-bottom:none}
li.on{opacity:.62}
li.on .lbl{text-decoration:line-through}
li svg{width:15px;height:15px;flex:none}
li.on svg{color:var(--ok)}
li.now svg{color:#7fc1ff}
li.wait svg{color:#4a586e}
.num{font-size:11px;color:#6b7a99;width:16px;text-align:right;flex:none}
.who{font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px;flex:none}
.who.ai{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.who.me{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.lbl{font-size:12.5px}
.star{color:#ff8e8e;font-weight:800;margin-left:2px}
.banner{display:none;margin-top:9px;background:#0c3a2c;border:1px solid #1f6b52;color:#06d6a0;border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12.5px}
.banner.show{display:block}
.upd{font-size:11px;color:var(--mut);text-align:right;margin-top:12px}
.agent{background:var(--card2);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.agent .ah{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.agent .st{font-size:10px;font-weight:700;padding:1px 7px;border-radius:7px;margin-left:auto}
.st.active{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.st.uncommitted{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.st.idle{background:#222c3a;color:#6b7a99;border:1px solid #2e3a4a}
.agent .role{font-size:11px;color:var(--mut);margin:3px 0 1px}
.agent .own{font-size:10.5px;color:#5a6b80}
.agent .act{font-size:11px;color:#aeb9c7;margin-top:4px;padding-left:7px;border-left:2px solid #2a3a4d;line-height:1.5}
.agent .act .d{color:var(--mut);font-size:10px}
.advice{background:#13202d;border:1px solid #2a3a4d;border-radius:9px}
.advice .ai{display:flex;gap:8px;padding:7px 11px;font-size:12px;line-height:1.5;border-bottom:1px dashed #243049}
.advice .ai:last-child{border-bottom:none}
.advice .ic{flex:none}
.prow{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px dashed #243049;font-size:11.5px}
.prow:last-child{border-bottom:none}
.pcd{color:#7fc1ff;font-weight:700;flex:none;width:46px}
.ptt{flex:1;color:#cdd6e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{background:#3a2f12;color:#ffd166;border-radius:5px;padding:0 5px;font-size:9.5px;flex:none}
.pact{color:#06d6a0;font-size:10px;flex:none;font-weight:700}
.qcard{display:flex;gap:9px;padding:8px;margin:6px 0;background:#141c2c;border:1px solid #243049;border-radius:9px}
.qth{width:78px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:#0d1420}
.qth.none{display:flex;align-items:center;justify-content:center;color:#54627a;font-size:9px;text-align:center;line-height:1.2;border:1px dashed #2a3752}
.qbody{flex:1;min-width:0}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qcode{color:#7fc1ff;font-weight:700;font-size:11.5px}
.qlane{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700}
.qlane.info{background:#12283a;color:#7fc1ff}
.qlane.pop{background:#2f2136;color:#e0a3ff}
.qtitle{color:#e6edf5;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qfacts{color:#8a95a6;font-size:10px;margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qmeta{margin-top:4px}
.qdraft{color:#6b7688;font-size:9.5px;margin-left:8px}
.qpv{background:#17324a;color:#7fc1ff;border:1px solid #2a4d6e;border-radius:6px;font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer}
.qpv:hover{background:#1d4463}
.qpv.none{background:none;border:none;color:#54627a;font-weight:400;cursor:default;padding:3px 0}
#qpv-ov{display:none;position:fixed;inset:0;background:rgba(6,10,18,.82);z-index:999;align-items:center;justify-content:center;padding:18px}
#qpv-ov.show{display:flex}
.qpv-box{width:100%;max-width:760px;height:88vh;display:flex;flex-direction:column;background:#0f1626;border:1px solid #2a3752;border-radius:12px;overflow:hidden}
.qpv-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #243049;font-size:12.5px;font-weight:700;color:#7fc1ff}
.qpv-hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpv-x{background:#243049;color:#cdd6e0;border:none;border-radius:6px;font-size:11px;padding:5px 11px;cursor:pointer;flex:none}
.qpv-x:hover{background:#324158}
.qpv-fr,#qpv-fr{flex:1;width:100%;border:0;background:#fff}
.qpv-ft{padding:8px 14px;border-top:1px solid #243049;font-size:10px;color:#8a95a6;text-align:center}
.ch{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 4px;flex:none;margin-left:3px}
.ch.on{background:#0c3a2c;color:#06d6a0}
.ch.off{background:#3a1216;color:#f0707a}

편(reindex-batch2)을 취소할 이유는 없다 — 다만 '이걸 하면 색인이 회복된다'는 기대는 데이터가 받쳐주지 않는다. 이 수치는 reindex.py 에 RECHECK_DAYS 자동복귀를 넣다가 드러났다.","[팩트체크] [야간검증 08-06] 4편 검증 완료 — B4-06 종합부동산세(공제금액 12억/9억/5억/80억·세율표 7구간 전부 NTS 공식페이지 일치)·A3-07 국민연금 임의계속가입(2026 보험료율 9.5%→2033 13% 단계인상·10년 최소가입기간 MOHW 보도자료 일치)·B1-06 고향사랑기부제(연한도 2000만원·세액공제 10만이하100%/10만~20만 44%/20만초과 16.5%·답례품 30% 전부 ilovegohyang.go.kr 공식 일치) = 오류 0건. C3-05 복지용구(연한도160만·본인부담률15/9/6/0% NHIS 확인 일치)는 오류 없으나 부수 서술 '월 재가급여 한도액 1등급 251만2900원' 이 note48(C3-02)에서 이미 '민간블로그 출처·미확인'으로 플래그된 것과 동일 수치 — longtermcare.or.kr 500에러·law.go.kr 고시 별표 미확인으로 여전히 공식 검증 못함(1회 시도 원칙 준수, 대체 시도 안 함). 검색으로는 2026년이 2025 대비 등급별 1.89만~24.78만원 인상됐다는 것만 확인(정확한 별표 수치는 못 얻음). 조치 불필요(오류 확정 아님, 미확인 상태 유지) — 다음 세션이 mohw.go.kr 고시 첨부(제2025-247호) PDF 직접 확인 시도할 것.","[팩트체크] 야간루틴 8/7: crawl-watch 25편 중 크롤 0편(전부 crawl=없음), 상태이동 13건(양방향 flapping 계속). D2-10·D4-07(8/06 색인요청 신규 2편) 여전히 미크롤·URL is unknown to Google — 요청 다음날에도 안 왔다. 개별코드 하루치 이동으로 원인 판단 금지.","[팩트체크] [야간검증 08-07] 위험순위 신규 5편 검증 완료 — B3-04 퇴직연금 IRP: 세율표(55~69세5.5%·70~79세4.4%·80세이상3.3%)·종신형 특례 3.3%(2026.1.1 신설, 나이무관)·1500만원 한도·연금수령한도식 전부 확인, 단 🔴발견: 2026년 신설된 3단계 퇴직소득세 감면구간(20년초과 수령시 50%감면=50%납부)이 라이브에 누락 — 현재 글은 '10년이내30%·11년차부터40%감면'까지만 서술해 20년 초과 장기수령자에게 실제보다 낮은 절세효과로 안내됨(finnote.kr 2026.3 기사 기준, 기획재정부 2025세제개편안). A5-04 2027최저임금(10700원·+3.7%·월223.63만원·4대보험료율 국민연금4.75%건강보험3.595%고용보험0.9% 전부 moel.go.kr·mohw.go.kr 원문 일치) 오류0건. A5-05 일손부족일자리동행인센티브(50~64세·360만원·훈련수료 필수·업종제한·사업장규모AND조건) 오류0건. B3-02 연금저축IRP세액공제(600/900만원한도·16.5%/13.2%공제율·148.5만/118.8만원) 오류0건. A2-07 아이돌봄서비스(가85/80·나60/50·다30/25·라15/10%·시간당12790/16620/12790/15340원·연960시간한부모1080시간) 오류0건(경쟁 2차출처 1건이 다른 수치를 냈으나 제3의 독립출처로 재대조해 원 라이브 수치가 맞음을 확인). 누적: 8/2~8/7 총 9편 정밀검증, 하드오류 0건·경미누락 2건(F2-01 평일구분·B3-04 20년초과구간).","[발행준비] A1-12(근로장려금 반기신청) 코드 배정 경위 — 2026-08-07 오전브리핑은 이 글감에 A1-11을 배정했으나(DB 미사용 확인만 함), watch.json 의 a1-11-edufee-scope(초중고 교육비 지원, 사용자 판단 대기)가 A1-11 을 이미 가리키고 있어 충돌한다. 브리핑의 '주제'는 그대로 채택하고 '코드'만 A1-12 로 옮겼다(A1-11 은 교육비 글감용으로 비워 둠). 다음 세션은 A1-11 로 되돌리지 말 것.","🐛 bodydup 이 발행 직후 '중복 차단'을 잘못 띄운다 (2026-08-08 실측). F4-12 발행 중에 게이트를 돌렸더니 [차단] 이미 발행된 글과 본문이 거의 같다 가 떴는데, 몇 분 뒤 같은 명령이 🟢 0.051 을 줬다. 원인: bodydup 은 자기 코드를 비교 대상에서 빼는데 그 매핑을 DB(lifeinfo_db.txt)에서 찾는다. 라이브 발행은 됐는데 register_post 가 아직 안 돌면 DB 에 코드가 없어 **자기 자신과 비교**하게 되고 1.00 에 가까운 점수가 나온다(비교 편수도 192 vs 193 으로 갈렸다). 즉 '발행 직후 register_post 전' 이라는 창에서만 나오는 거짓 차단이다. ⚠️영향: fail-closed 게이트라 사람이 이 메시지를 보면 정당한 발행을 되돌릴 수 있다 — 실제로 나도 잠깐 F4-12 를 중복으로 오해했다. 처방 후보: ①bodydup 이 DB 대신 라이브 URL 로 자기 글을 식별 ②DB 에 코드가 없는데 제목이 라이브와 거의 같으면 '발행 직후일 수 있음' 으로 안내 문구를 바꾸기. 지금은 운영 규칙으로 대응: 발행 직후 게이트를 다시 돌리지 말고, 돌렸다면 register_post 후 재확인할 것.","🔑 gh CLI 설치 완료 (2026-08-08). winget install GitHub.cli → 2.97.0, C:\\Program Files\\GitHub CLI\\gh.exe. 인증은 아직 없음(gh auth status = not logged in) — 사용자가 프롬프트에 '! gh auth login' 1회 실행 필요. ⚠️문서 여러 곳에 'gh 가 없어 Actions 로그를 확인 못 함'(watch label-at-publish 등)이라 적혀 있는데 이제 틀린 서술이 된다 — 인증까지 끝나면 Actions 로그 확인·워크플로 트리거가 전부 터미널에서 된다. 계기: 사용자 지시로 발행대기 4편을 Fold 가 발행하려 했으나 ①pipeline.py:289 가 로컬 --publish 차단 ②웹 Actions 의 Run workflow 폼이 브라우저 자동화에서 3회 모두 'There was an error while loading' 로 실패 → 남은 경로가 gh 뿐이었다. 🔴'웹이 죽었다'고 단정하지 말 것 — 사람이 직접 누르면 될 수 있고, 내 자동화 쪽 문제일 가능성이 남아 있다(미확인).","[팩트체크] [야간검증] 오늘 발행 2편(F4-12 서울고궁관람료·orphan 국립공원탐방로예약제) 팩트체크 완료 — 둘 다 공식출처(royal.khs.go.kr, res.knps.or.kr) 대조 결과 오류 없음. F4-12: 관람료·통합관람권 6000원/6개월·후원 예약창구 전부 일치. 탐방로예약제: 노고단1870명·우이령1190명(주말공휴일)·흘림골5000명(시간지정제)·마감(전날14시)·노쇼페널티(1회1개월/2회이상3개월)·월4건제한 전부 res.knps.or.kr 환불정책 페이지와 일치.","[팩트체크] [야간검증] 기존글 3편 위험순위 검증(B4-05 퇴직금·C1-04 건보수가·D2-03 K패스) 중 D2-03에서 오류 발견. 🔴D2-03 K패스: 라이브가 평시 환급률(일반20%·청년30%·저소득53%)만 서술하는데, 2026.3.31 국무회의 통과 추경으로 2026.4.1~9.30 이용분에 한해 환급률이 한시 인상됨(일반20→30%·청년등30→45%·3자녀50→75%·저소득53→83%, 예산877억원). 오늘 8/8은 그 기간 안이라 라이브 수치가 독자의 실제 환급액보다 10~30%p 낮게 안내되는 중. 출처: 2026-03-31 국무회의 추경안 보도(다수 매체 교차확인, 예산액·기간·인상폭 일치). 라이브 수정은 사용자 승인 게이트 — 이 세션은 미수정. B4-05(근속연수공제·환산급여공제 표·14일지급·연20%지연이자, NTS 공식페이지 대조)·C1-04(진찰료 인상률 6/4/2%, 2026 수가혁신방안 발표 기사 대조)는 오류 0건. 오늘 발행 2편(F4-12·orphan 탐방로예약제)도 검증 완료(오류 0건, 별도 기록). D2-03은 다음 대면 세션에서 라이브에 한시 인상 안내 박스 추가 검토 필요 — watch 항목으로 남김.","[색인] [색인] crawl-watch 확인: D2-10·D4-07(8/06 색인요청한 신규 2편) 아직 lastCrawl 없음(2026-08-08 09:52 스냅샷 기준 미크롤). watch crawl-watch 항목이 묻던 질문에 대한 답 — 신규 글도 기존 글과 같은 속도로 크롤되는지는 아직 판단 불가, 계속 관찰 필요. 오늘 크롤 배치(25편)는 신규 크롤 0편·상태이동 12건(플래핑 계속, D4-04 등).","[발행] F4-14(국립공원 탐방로예약제)가 2026-08-08 17:46 라이브 발행됐는데 발행 후 DB 등록이 빠져 하루 동안 라이브 180편 vs DB 179편으로 어긋나 있었다. 잡아낸 것은 selfcheck 5) 피드 정합의 orphan 1건 — 탐지망은 제대로 돌았고, 빠진 것은 발행 세션의 후속 단계였다. 2026-08-09 발행 루틴이 register_post 로 등록(180편)하고 short·매니페스트·bake·validate(FAIL 0)까지 마감. 교훈: Actions 로 발행하면 라이브는 즉시 생기지만 DB 등록은 사람/세션 몫이라 세션이 끊기면 그대로 비는 구간이 된다 — 발행 직후 feedcheck 를 한 번 돌리면 그날 안에 잡힌다.","🐛 publish.yml 이 dupcheck 🔴 에 스텝째로 죽던 버그 수정 (2026-08-09). studio/dupcheck.py:119 는 강한중복일 때 종료코드 3 을 내는데, 그 파일 주석에 'WARN 전용이라 파이프라인 차단엔 안 씀'이라고 적혀 있다. 그런데 publish.yml 의 '중복 검사 (주제 + 내용)' 스텝이 dupcheck 를 set +e 없이 호출했다 — Actions run: 은 bash -e 라 exit 3 에 스텝이 즉사한다. 바로 아래 bodydup 호출은 올바르게 감싸져 있어서 **한 스텝 안에서 한쪽만 빠져 있었다.** 실제 피해: A1-12(근로장려금 반기신청)는 A1-03 과 '근로장려금' 단어 하나만 겹쳐 🔴 오탐을 받는데 bodydup 은 0.048 🟢 인 새 글이다 — 그대로 두면 이 글은 Actions 로 영영 발행되지 않는다. 수정: set +e/drc/case 로 감싸고 3 은 ::warning:: 으로만 남긴다(코드 3=제목 강한겹침, 그 외=검사 못 함, 둘 다 차단 안 함). 검증: YAML 파싱 OK · bash -n OK · 실제 🔴 제목으로 시뮬레이션해 최종 exit 0 확인. 🔴교훈: 문서·주석이 'WARN 전용'이라고 말해도 **호출부가 그렇게 안 부르면 아니다.** 게이트의 성격은 주석이 아니라 호출 방식이 정한다. 발견 경위: Fold 세션이 A1-12 발행을 시도하다 막혀 진단을 올려줬고, 관제탑이 코드로 확인해 고쳤다(역할 분담대로).","⏱️ 워크플로 수정과 실행의 시차 — A1-12 첫 발행 실패 (2026-08-09). Fold 가 14:37 KST 에 A1-12 를 트리거했는데 내 publish.yml 수정 커밋(107aa88)은 14:46 KST 였다. 9분 차이로 러너가 옛 코드를 받아 dupcheck 🔴 exit 3 에 스텝째로 죽었다(로그에 set +e 없는 호출이 그대로 찍혀 있다). 부작용은 없다 — 발행 스텝 전에 멈췄고 라이브·DB 모두 무변화. 🔴교훈: **러너는 항상 origin/main 의 코드를 쓴다.** 게이트를 고쳤으면 '푸시가 끝났는지'를 확인한 뒤에 실행 지시를 내려야 하고, 지시서 카드에도 '수정본이 원격에 올라간 뒤 실행할 것'을 적어야 한다. 내가 카드에 그 문구를 적어 놓고도(A1-12 카드 ⚠️줄) 사용자에게 '이제 통과합니다'라고 말할 때 푸시 시각과 실행 시각을 대조하지 않았다 — 순서를 말로만 챙기면 이렇게 빗나간다.","🔗 관제탑 푸시 하나가 4단계 뒤까지 망가뜨렸다 — A1-12 (2026-08-09). 연쇄: ①A1-12 발행이 도는 중에 내가 webapp/* 가 든 커밋(73e5 background:#f4f7fc;border:1px solid #e0e8f4;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#7C5CE0;margin-bottom:8px}\n.lsg .rel a{display:block;color:#2a4a73;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#8a97ab;text-decoration:none;margin:2px 0 6px}\n.lsg .warn{background:#fff4f2;border:1px solid #f6cfc6;border-radius:12px;padding:14px 18px;margin:14px 0}\n.lsg .warn b{display:block;font-size:15px;color:#c0442a;margin-bottom:6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p><b>안동국제탈춤페스티벌 2026<\/b>은 <b>2026년 9월 24일(목)부터 10월 4일(일)까지 11일간<\/b> 열립니다. 올해는 개막일이 <b>추석 연휴 첫날<\/b>과 그대로 겹칩니다. 추석 당일이 9월 25일(금)이고 연휴가 24일(목)~26일(토), 27일(일)까지 이어지니 <b>성묘길에 하루 들르기 좋은 위치에 축제가 놓인 해<\/b>입니다.<\/p>\n<p>그런데 이 축제는 검색해 보면 <b>개막일이 9월 25일이라고 적힌 글이 많습니다.<\/b> 공식 자료는 다릅니다. 한국관광공사 '대한민국 구석구석' 축제 정보는 <b>2026.09.24 ~ 2026.10.04<\/b>, 안동시 관광 홈페이지도 <b>9월 24일(목)~10월 4일(일)<\/b>, 축제 공식 사이트도 <b>2026. 9. 24. Thu ~ 10. 4. Sun<\/b>으로 같습니다. 하루를 잘못 알고 첫날 개막 행사를 놓치는 일이 없도록 <b>공식 기준으로 9월 24일<\/b>을 기억하세요.<\/p>\n<p>또 하나, <b>\"축제가 무료니까 안동 관광도 공짜\"<\/b>로 생각하면 현장에서 지갑을 엽니다. 축제장 입장은 무료지만 <b>하회마을·도산서원은 별도 유료<\/b>입니다. 이 글은 안동시·한국관광공사 공식 페이지를 직접 확인해 <b>기간·장소, 무료와 유료의 경계, 하회마을 관람료와 가족 총액 계산, 65세 이상 무료 조건, 관람시간 때문에 생기는 동선 함정<\/b>까지 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 기간·장소 먼저 (9월 24일 개막, 추석 연휴 첫날)<\/a><a href=\"#sec2\">2. 입장료 — 무료인 것과 유료인 것의 경계<\/a><a href=\"#sec3\">3. 하회마을·도산서원 관람료와 우리 가족 총액 계산<\/a><a href=\"#sec4\">4. 65세 이상 무료 · 단체 30인 · 그린카드 30%<\/a><a href=\"#sec5\">5. 관람시간 17:30 — 동선이 꼬이는 진짜 이유<\/a><a href=\"#sec6\">6. 연휴에 갈까, 연휴 지나 갈까<\/a><a href=\"#sec7\">7. 출발 전 놓치기 쉬운 7가지<\/a><a href=\"#sec8\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec3\">👉 우리 가족은 얼마 드는지 먼저 계산해 보기<\/a>\n\n<h2 id=\"sec1\">1. 기간·장소 먼저 (9월 24일 개막, 추석 연휴 첫날)<\/h2>\n<p>공식 자료에 등록된 내용만 옮기면 다음과 같습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>내용<\/th><\/tr>\n<tr><td>축제 기간<\/td><td><b>2026년 9월 24일(목) ~ 10월 4일(일)<\/b> · 11일간<\/td><\/tr>\n<tr><td>장소<\/td><td><b>탈춤공원<\/b>, 원도심, 중앙선1942안동역 일원 <span style=\"font-size:13px\">(안동시 관광 기준)<\/span><\/td><\/tr>\n<tr><td>주소<\/td><td>경상북도 안동시 육사로 239 (운흥동) <span style=\"font-size:13px\">(구석구석 기준)<\/span><\/td><\/tr>\n<tr><td>주최·주관<\/td><td>한국정신문화재단<\/td><\/tr>\n<tr><td>이용요금<\/td><td><b>무료<\/b> (일부 체험 프로그램 및 탈춤공연장 공연 유료)<\/td><\/tr>\n<tr><td>문의<\/td><td>054-840-3400 · 054-840-3424 <span style=\"font-size:13px\">(안동시 문화관광 054-840-3421)<\/span><\/td><\/tr>\n<\/table><\/div>\n<p>2026년 추석 달력과 겹쳐 보면 이렇게 됩니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>날짜<\/th><th>요일<\/th><th>이 날의 성격<\/th><\/tr>\n<tr><td>9월 24일<\/td><td>목<\/td><td>추석 연휴 첫날 <b>+ 축제 개막일<\/b><\/td><\/tr>\n<tr><td>9월 25일<\/td><td>금<\/td><td><b>추석 당일<\/b> · 축제 2일차<\/td><\/tr>\n<tr><td>9월 26일<\/td><td>토<\/td><td>연휴 마지막 날 · 축제 3일차<\/td><\/tr>\n<tr><td>9월 27일<\/td><td>일<\/td><td>일요일 · 축제 4일차<\/td><\/tr>\n<tr><td>9월 28일 ~ 10월 4일<\/td><td>월~일<\/td><td>연휴가 끝난 뒤 <b>7일이 더 남습니다<\/b><\/td><\/tr>\n<\/table><\/div>\n<p>여기서 알 수 있는 사실이 하나 있습니다. <b>축제는 연휴가 끝나고도 일주일 더 열립니다.<\/b> \"연휴에 못 가면 끝\"이 아니라는 뜻이고, 이것이 뒤에서 다룰 '언제 갈까' 판단의 출발점입니다.<\/p>\n<p>주요 프로그램으로는 국내외 탈춤 공연(유네스코 인류무형문화유산 등재 한국 탈춤과 해외 공연단), 마당극·창작극, <b>세계탈놀이경연대회<\/b>, 세계 탈 전시, 도심 속 거리 퍼레이드, 대동난장, 탈 만들기·탈춤 배우기 같은 체험행사, 축제 먹거리가 공식 안내에 올라 있습니다. 날짜별 시간표는 행사가 가까워지면 공식 홈페이지에 게시되므로 출발 전 한 번 더 확인하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 입장료 — 무료인 것과 유료인 것의 경계<\/h2>\n<p>가장 많이 헷갈리는 대목입니다. 공식 표기를 그대로 옮기면 <b>\"무료 (일부 체험 프로그램 및 탈춤공연장 공연 유료)\"<\/b>입니다. 즉 경계는 이렇게 나뉩니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>비용<\/th><th>설명<\/th><\/tr>\n<tr><td>축제장 입장<\/td><td><b>무료<\/b><\/td><td>탈춤공원·원도심 일원 거리 공연, 퍼레이드, 전시 관람<\/td><\/tr>\n<tr><td>탈춤공연장 공연<\/td><td><b>일부 유료<\/b><\/td><td>공연에 따라 유료 — 요금은 공식 발표를 확인<\/td><\/tr>\n<tr><td>일부 체험 프로그램<\/td><td><b>일부 유료<\/b><\/td><td>탈 만들기 등 재료비가 드는 체험<\/td><\/tr>\n<tr><td>하회마을<\/td><td><b>유료<\/b> (성인 5,000원)<\/td><td>축제와 <b>별개 시설<\/b> — 아래 3장<\/td><\/tr>\n<tr><td>도산서원<\/td><td><b>유료<\/b> (성인 2,000원)<\/td><td>축제와 별개 시설<\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 유료 공연 요금을 이 글에 적지 않은 이유<\/b>\n<p style=\"margin:6px 0 0\">공식 안내는 \"일부 유료\"라고만 밝히고 <b>구체적인 공연별 요금·예매처는 이 글을 쓰는 시점(2026년 8월 13일)까지 공식 페이지에서 확인되지 않았습니다.<\/b> 블로그마다 적혀 있는 티켓 가격은 출처가 확인되지 않아 옮기지 않았습니다. 유료 공연을 보실 계획이라면 아래 8장의 공식 홈페이지에서 <b>공연 일정이 공개된 뒤<\/b> 요금을 확인하세요. 무료로 볼 수 있는 프로그램만으로도 하루 일정은 충분히 채워집니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 하회마을·도산서원 관람료와 우리 가족 총액 계산<\/h2>\n<p>안동에 가서 축제만 보고 오는 사람은 드뭅니다. 대부분 <b>하회마을<\/b>을 함께 봅니다. 안동시가 공개한 관람요금은 다음과 같습니다(2026년 8월 13일 확인 기준).<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th colspan=\"2\">하회마을<\/th><th colspan=\"2\">도산서원<\/th><\/tr>\n<tr><th>대상<\/th><th>개인<\/th><th>단체<\/th><th>개인<\/th><th>단체<\/th><\/tr>\n<tr><td>성인<\/td><td><b>5,000원<\/b><\/td><td>4,000원<\/td><td><b>2,000원<\/b><\/td><td>1,500원<\/td><\/tr>\n<tr><td>청소년·군인<\/td><td>2,500원<\/td><td>2,000원<\/td><td>1,000원<\/td><td>800원<\/td><\/tr>\n<tr><td>어린이<\/td><td>1,500원<\/td><td>1,200원<\/td><td>1,000원<\/td><td>800원<\/td><\/tr>\n<tr><td>안동시민<\/td><td colspan=\"2\">성인 1,000 · 청소년 500 · 어린이 400<\/td><td colspan=\"2\">성인 1,000 · 청소년 500 · 어린이 500<\/td><\/tr>\n<\/table><\/div>\n<p>※ 단체는 <b>30인 이상<\/b> 기준입니다. 하회마을은 <b>주차료 무료, 마을 입구까지 가는 셔틀버스도 무료<\/b>로 안내돼 있습니다.<\/p>\n<p><b>계산 예시 ① — 부모님을 모시고 가는 4인<\/b> (부부 2명 + 70대 부모님 2명)<\/p>\n<ul>\n<li>하회마을: 성인 5,000원 × 2명 = 10,000원 / <b>65세 이상 부모님 2명은 무료<\/b> → <b>10,000원<\/b><\/li>\n<li>도산서원까지 보면: 성인 2,000원 × 2명 = 4,000원 (부모님 무료) → <b>합계 14,000원<\/b><\/li>\n<li>주차료·셔틀 <b>0원<\/b>, 축제장 입장 <b>0원<\/b><\/li>\n<\/ul>\n<p><b>계산 예시 ② — 3대가 함께 가는 6인<\/b> (70대 부모님 2 + 부부 2 + 중학생 1 + 초등학생 1)<\/p>\n<ul>\n<li>하회마을: 성인 5,000 × 2 = 10,000원 + 청소년 2,500 × 1 + 어린이 1,500 × 1 = <b>14,000원<\/b> (65세 이상 2명 무료)<\/li>\n<li>도산서원: 성인 2,000 × 2 + 청소년 1,000 + 어린이 1,000 = <b>6,000원<\/b><\/li>\n<li>→ <b>두 곳 합계 20,000원.<\/b> 6명이 하루 종일 다녀오는 비용치고 낮은 편이고, <b>비용의 대부분은 입장료가 아니라 교통비·식비<\/b>가 됩니다.<\/li>\n<\/ul>\n<p>즉 이 여행에서 입장료는 변수가 아닙니다. <b>돈이 갈리는 지점은 따로 있습니다<\/b> — 연휴 숙박비, 그리고 축제 기간 원도심의 혼잡을 피하지 못해 버리는 시간입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 65세 이상 무료 · 단체 30인 · 그린카드 30%<\/h2>\n<p>안동시가 안내하는 <b>무료 입장 대상<\/b>은 다음과 같습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>대상<\/th><th>내용<\/th><\/tr>\n<tr><td><b>65세 이상<\/b><\/td><td>무료 — 부모님과 함께라면 가장 크게 아끼는 항목<\/td><\/tr>\n<tr><td>6세 이하<\/td><td>무료<\/td><\/tr>\n<tr><td>장애인<\/td><td>무료<\/td><\/tr>\n<tr><td>국가유공자<\/td><td>무료<\/td><\/tr>\n<tr><td>단체 할인<\/td><td><b>30인 이상<\/b>부터 단체 요금 적용<\/td><\/tr>\n<tr><td>그린카드<\/td><td>공공시설 이용 시 <b>30% 할인<\/b><\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 무료·할인은 '증빙을 보여줘야' 적용됩니다<\/b>\n<p style=\"margin:6px 0 0\">65세 이상 무료, 장애인·국가유공자 무료, 안동시민 요금은 모두 <b>매표소에서 신분을 확인한 뒤<\/b> 적용되는 항목입니다. 부모님 신분증을 두고 오면 그 자리에서 성인 요금을 내게 됩니다. <b>출발 전에 신분증(또는 복지카드·국가유공자증)을 챙겼는지<\/b> 확인하세요. 그린카드 할인도 카드 실물이 있어야 합니다.<\/p><\/div>\n<p>단체 기준이 <b>30인 이상<\/b>이라는 점도 알아두면 좋습니다. 가족 단위(4~6인)는 아무리 인원을 모아도 단체가 되지 않으므로, <b>개인 요금이 기본<\/b>이라고 보고 예산을 잡으면 됩니다. 성인 기준 개인과 단체의 차이도 1,000원이라 크지 않습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 관람시간 17:30 — 동선이 꼬이는 진짜 이유<\/h2>\n<p>이 여행에서 가장 흔한 실수는 요금이 아니라 <b>시간<\/b>에서 나옵니다. 안동시가 공개한 관람시간입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>관광지<\/th><th>하절기(3~10월)<\/th><th>동절기(11~2월)<\/th><th>소요시간<\/th><\/tr>\n<tr><td><b>하회마을<\/b><\/td><td><b>09:00~17:30<\/b><\/td><td>09:00~16:30<\/td><td>약 1~1.5시간<\/td><\/tr>\n<tr><td>도산서원<\/td><td>09:00~18:00<\/td><td>09:00~17:00<\/td><td>약 30분<\/td><\/tr>\n<tr><td>병산서원<\/td><td>09:00~18:00<\/td><td>09:00~17:00<\/td><td>약 30분<\/td><\/tr>\n<tr><td>봉정사<\/td><td>07:00~19:00<\/td><td>08:00~17:00<\/td><td>약 30분<\/td><\/tr>\n<\/table><\/div>\n<p>축제 기간(9월 24일~10월 4일)은 <b>전부 하절기<\/b>에 해당합니다. 문제는 <b>하회마을이 17시 30분에 닫는다<\/b>는 점입니다. 축제의 개막식·저녁 공연·대동난장 같은 프로그램은 해가 진 뒤가 하이라이트인데, 하회마을은 그 전에 문을 닫습니다.<\/p>\n<p>그래서 하루에 둘 다 보려면 순서가 정해집니다.<\/p>\n<ul>\n<li><b>오전~오후 초반<\/b>: 하회마을(1~1.5시간) → 필요하면 병산서원이나 도산서원(각 30분)<\/li>\n<li><b>오후 늦게~저녁<\/b>: 탈춤공원·원도심으로 이동해 축제 프로그램<\/li>\n<li>반대로 하면 <b>하회마을 매표가 끝나 못 들어갑니다.<\/b> 표기된 시간은 관람 종료 시각이므로 매표는 그보다 이르게 마감될 수 있습니다.<\/li>\n<\/ul>\n<p>하회마을과 도산서원은 <b>안동 시내를 사이에 두고 방향이 반대<\/b>입니다. 셋을 다 넣으면 이동에만 시간이 크게 듭니다. <b>부모님과 함께라면 하회마을 한 곳 + 축제<\/b>로 줄이는 편이 훨씬 낫습니다. 관광지는 연중무휴로 운영되지만 <b>사정에 따라 시간이 바뀔 수 있다<\/b>고 안내돼 있으니, 당일 아침에 한 번 확인하면 확실합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 연휴에 갈까, 연휴 지나 갈까<\/h2>\n<p>축제가 11일이나 열리므로 <b>선택지가 두 개<\/b>입니다. 같은 축제라도 성격이 꽤 달라집니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>연휴 중 (9/24~9/27)<\/th><th>연휴 후 (9/28~10/4)<\/th><\/tr>\n<tr><td>일정<\/td><td>개막일·추석 당일 포함<\/td><td>폐막(10/4 일요일) 포함<\/td><\/tr>\n<tr><td>혼잡<\/td><td>귀성 인파와 겹쳐 <b>가장 붐빔<\/b><\/td><td>평일은 여유<\/td><\/tr>\n<tr><td>고속도로<\/td><td>귀성·귀경 정체 구간과 겹침<\/td><td>평상시 수준<\/td><\/tr>\n<tr><td>숙박<\/td><td>연휴 요금 · 조기 마감<\/td><td>평일은 선택 폭이 넓음<\/td><\/tr>\n<tr><td>동반<\/td><td>성묘길에 <b>가족이 이미 모여 있음<\/b><\/td><td>따로 시간을 내야 함<\/td><\/tr>\n<tr><td>추천<\/td><td>고향이 경북권이거나 성묘와 묶을 때<\/td><td>여유롭게 보고 싶을 때 · <b>주중 하루<\/b>가 최적<\/td><\/tr>\n<\/table><\/div>\n<p><b>판단은 한 줄로 정리됩니다.<\/b> 성묘 일정과 묶을 수 있으면 <b>연휴 중<\/b>이 이득이고(어차피 이동하는 김에), 축제 자체를 제대로 보는 것이 목적이면 <b>연휴가 끝난 다음 주 평일<\/b>이 낫습니다. 폐막일인 10월 4일(일)은 마지막 주말이라 다시 붐빌 가능성이 큽니다.<\/p>\n<p>안동은 <b>중앙선 KTX-이음이 서는 안동역<\/b>이 있고, 축제장 자체가 '중앙선1942안동역·원도심' 일원이라 <b>기차로 가서 걸어 다니기 좋은 축제<\/b>입니다. 연휴 중에 운전이 부담스럽다면 기차 쪽을 먼저 알아보는 것이 현실적입니다. 다만 <b>추석 명절 승차권 예매 일정은 이 글을 쓰는 시점까지 코레일·SR 공식 공지가 나오지 않았습니다<\/b> — 검색으로 보이는 예매일은 출처가 확인되지 않으니, 코레일 공지사항에서 직접 확인하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 출발 전 놓치기 쉬운 7가지<\/h2>\n<ol>\n<li><b>개막은 9월 25일이 아니라 9월 24일(목)입니다.<\/b> 공식 세 곳(구석구석·안동시·축제 공식)이 모두 9월 24일 개막, 10월 4일 폐막으로 같습니다.<\/li>\n<li><b>축제는 무료지만 하회마을은 유료입니다.<\/b> 성인 5,000원, 청소년·군인 2,500원, 어린이 1,500원.<\/li>\n<li><b>65세 이상은 무료 — 단, 신분증이 있어야 합니다.<\/b> 부모님 신분증을 챙기는 것만으로 4인 기준 1만 원을 아낍니다.<\/li>\n<li><b>하회마을은 17:30에 닫습니다.<\/b> 저녁 축제 프로그램과 같은 날 보려면 <b>하회마을 먼저, 축제는 나중<\/b> 순서로 짜세요.<\/li>\n<li><b>주차료와 셔틀버스는 무료<\/b>로 안내돼 있습니다. 하회마을은 공용주차장에 세우고 셔틀로 들어가는 구조입니다.<\/li>\n<li><b>단체 할인은 30인 이상부터<\/b>입니다. 가족 여행은 개인 요금이 기본입니다.<\/li>\n<li><b>유료 공연 요금·예매처는 공식 발표를 기다리세요.<\/b> 지금 검색되는 티켓 가격은 출처가 확인되지 않은 것들이라 이 글에 옮기지 않았습니다.<\/li>\n<\/ol>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b>\n<a href=\"https://www.maskdance.com/\" target=\"_blank\" rel=\"nofollow\">▸ 안동국제탈춤페스티벌 공식 홈페이지 (기간·프로그램·공지)<\/a>\n<a href=\"https://korean.visitkorea.or.kr/kfes/detail/fstvlDetail.do?fstvlCntntsId=644495a7-65e3-42ef-8993-e18e2e71a8bd\" target=\"_blank\" rel=\"nofollow\">▸ 대한민국 구석구석(한국관광공사) — 축제 기간·장소·이용요금·문의<\/a>\n<a href=\"https://www.tourandong.com/public/sub5/sub2.cshtml\" target=\"_blank\" rel=\"nofollow\">▸ 안동관광 관람요금 — 하회마을·도산서원 요금, 무료 대상<\/a>\n<a href=\"https://www.tourandong.com/public/sub5/sub2_2.cshtml\" target=\"_blank\" rel=\"nofollow\">▸ 안동관광 관람시간 — 하절기·동절기 운영시간<\/a>\n<\/div>\n<div class=\"end\"><b>✅ 마무리<\/b>\n<p style=\"margin:8px 0 0\">기억할 것은 넷입니다. <b>① 2026년 9월 24일(목)~10월 4일(일), 개막일이 추석 연휴 첫날<\/b>, <b>② 축제장 입장은 무료, 하회마을·도산서원은 별도 유료(성인 5,000원·2,000원)<\/b>, <b>③ 65세 이상·6세 이하·장애인·국가유공자는 무료지만 신분 확인이 필요<\/b>, <b>④ 하회마을은 17:30 마감이라 저녁 축제와 같은 날 보려면 순서를 지켜야 한다.<\/b> 연휴에 못 가더라도 축제는 9월 28일부터 10월 4일까지 일주일 더 열립니다. 날짜별 공연 시간표와 유료 공연 요금은 행사가 가까워지면 공식 홈페이지에 올라오니 출발 전 한 번 더 확인하세요.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월 13일<\/b> 확인 기준이며, 축제 일정·요금·운영시간은 변동될 수 있습니다. 방문 전 공식 페이지에서 확인하세요.<br>출처: <a href=\"https://korean.visitkorea.or.kr/kfes/detail/fstvlDetail.do?fstvlCntntsId=644495a7-65e3-42ef-8993-e18e2e71a8bd\" target=\"_blank\" re 면 표가 사라진다<\/a><a href=\"#sec6\">6. 취소·환불 위약금 (명절 특별 기준)<\/a><a href=\"#sec7\">7. 자리를 못 잡았다면 — 잔여석·취소표<\/a><a href=\"#sec8\">8. 이번 추석에는 안 되는 것들<\/a><a href=\"#sec9\">9. 웃돈 주고 사면 처벌받습니다<\/a><a href=\"#sec10\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec2\">👉 내 노선 예매 날짜부터 확인하기<\/a>\n\n<h2 id=\"sec1\">1. 한눈에 보는 2026 추석 예매 핵심<\/h2>\n<p>먼저 날짜만 추려 보겠습니다. 이번 추석 승차권은 <b>온라인(코레일+ 앱·홈페이지) 전용<\/b>이라 역에 가서 줄을 서는 방식이 없습니다. 회원 가입은 필수입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>내용<\/th><\/tr>\n<tr><td>대상 기간<\/td><td>9월 23일(수) ~ <b>9월 25일(금, 추석)<\/b> ~ 9월 27일(일) / 5일간<\/td><\/tr>\n<tr><td>예매 방법<\/td><td>코레일+(앱), 홈페이지 등 (<b>회원가입 필수<\/b>) · <b>역 창구 예매 없음<\/b><\/td><\/tr>\n<tr><td>사전예매<\/td><td>9월 3일(목) ~ 4일(금) <b>09:00~15:00<\/b> — 장애인·경로·임산부·국가유공자<\/td><\/tr>\n<tr><td>일반예매<\/td><td>9월 7일(월) ~ 11일(금) <b>07:00~13:00<\/b> — 모든 국민<\/td><\/tr>\n<tr><td>예매 매수<\/td><td>1인당 최대 <b>12매<\/b> (1회당 6매 이내)<\/td><\/tr>\n<tr><td>결제 기간<\/td><td>9월 12일(토) 00시 ~ <b>9월 15일(화) 24시<\/b> (사전예매분은 9월 18일 금요일까지)<\/td><\/tr>\n<tr><td>잔여석 판매<\/td><td>9월 11일(금) <b>15시<\/b>부터 앱·홈페이지·역 창구 상시 판매<\/td><\/tr>\n<\/table><\/div>\n<p>주의할 점이 하나 더 있습니다. 공식 안내문은 <b>“명절 예매는 통합 회원만 가능하며, 기존 SR회원은 통합 회원으로 전환해야 예매가 가능하다”<\/b>고 못 박고 있습니다. 수서역에서 출발하는 열차를 타실 분도 이번에는 같은 창구에서 예매하게 되므로, 회원 상태부터 확인하셔야 합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 노선별 예매 일정표 — 내 노선은 며칠인가<\/h2>\n<p>이번 예매에서 가장 많이 헷갈리는 부분입니다. <b>“9월 7일부터”라고만 알고 접속하면 낭패<\/b>를 봅니다. 7일은 일반열차(무궁화·ITX 등)만 팔고, KTX는 출발역에 따라 날짜가 하루씩 나뉩니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>일자<\/th><th>시간<\/th><th>대상<\/th><th>대상 열차<\/th><th>대상 노선<\/th><\/tr>\n<tr><td>9.3(목)<\/td><td rowspan=\"2\">09:00<br>~15:00<\/td><td rowspan=\"2\">장애인·경로<br>임산부·국가유공자<\/td><td>전 열차<\/td><td>경부 · 경전 · 동해 · 중부내륙 · 경북 · 대구 · 충북 · 교외선<\/td><\/tr>\n<tr><td>9.4(금)<\/td><td>전 열차<\/td><td>호남 · 전라 · 중앙 · 강릉 · 장항 · 영동 · 태백 · 서해 · 경춘 · 목포보성선<\/td><\/tr>\n<tr><td>9.7(월)<\/td><td rowspan=\"5\">07:00<br>~13:00<\/td><td rowspan=\"5\">모든 국민<\/td><td>일반열차<\/td><td>전 노선<\/td><\/tr>\n<tr><td>9.8(화)<\/td><td>KTX<br>(서울·청량리 등)<\/td><td>경전선(서울~대전~동대구~창원~마산~진주) · 강릉선(서울·청량리~평창~강릉, 동해) · 동해선(부전~경주~포항~울진~동해~강릉 / 서울~대전~동대구~포항) · 중앙선(서울·청량리~영주~안동~경주~부전) · 중부내륙선(판교~충주~문경)<\/td><\/tr>\n<tr><td>9.9(수)<\/td><td>KTX<br>(용산 등)<\/td><td>호남선(용산~익산~광주송정~목포) · 전라선(용산~익산~전주~여수EXPO)<\/td><\/tr>\n<tr><td>9.10(목)<\/td><td>KTX<br>(수서 출·도착)<\/td><td>경부선(수서~대전~동대구~경주~울산~부산 / 수서~대전~동대구~밀양~부산) · 경전선(수서~대전~창원~마산~진주) · 동해선(수서~대전~동대구~포항) · 호남선(수서~익산~광주송정~목포) · 전라선(수서~익산~전주~여수EXPO)<\/td><\/tr>\n<tr><td>9.11(금)<\/td><td>KTX<br>(서울 출·도착)<\/td><td>경부선(서울~대전~동대구~경주~울산~부산 / 서울~대전~동대구~밀양~부산)<\/td><\/tr>\n<\/table><\/div>\n<p>표를 읽는 요령을 정리하면 이렇습니다.<\/p>\n<ul>\n<li><b>서울역에서 부산·울산으로 가신다면 9월 11일(금)<\/b> 하루가 전부입니다. 가장 수요가 몰리는 경부선 KTX가 마지막 날에 배치돼 있습니다.<\/li>\n<li><b>수서역 출발(옛 SRT 노선)은 9월 10일(목)<\/b>입니다. 경부·경전·동해·호남·전라선이 이날 한꺼번에 열립니다.<\/li>\n<li><b>용산 출발 호남·전라선은 9월 9일(수)<\/b>, <b>강릉·안동·문경 방면은 9월 8일(화)<\/b>입니다.<\/li>\n<li>무궁화호·ITX 등 <b>일반열차만 이용하실 계획이면 9월 7일(월)<\/b> 하루만 챙기시면 됩니다.<\/li>\n<\/ul>\n<p>즉 서울→부산 KTX와 서울→강릉 KTX를 함께 잡으려면 <b>8일과 11일, 이틀을 따로 대기<\/b>해야 한다는 뜻입니다. 가족 일정은 미리 정해 두시는 편이 낫습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 예매 전 이번 주에 해둘 일 (통합 회원·사전 체험)<\/h2>\n<p>예매일은 3주 뒤지만, 준비는 지금 하셔야 합니다. 공식 안내문이 정한 두 가지가 예매일 전에 끝나 있어야 합니다.<\/p>\n<ul>\n<li><b>① 통합 회원 여부 확인<\/b> — 명절 예매는 통합 회원만 가능합니다. 기존 SR(SRT) 회원이셨다면 <b>통합 회원으로 전환해야 예매가 됩니다.<\/b> 전환 방법은 별도 글에 정리해 두었습니다(아래 ‘함께 보면 좋은 글’).<\/li>\n<li><b>② 명절 예매 전용 웹페이지 사전 체험<\/b> — <b>8월 24일(월) 14시 ~ 9월 2일(수)<\/b>, 그리고 <b>9월 5일(토) ~ 6일(일)<\/b>에 전용 페이지를 미리 써 볼 수 있습니다. 아이디·비밀번호 확인, 결제수단 등록, 화면 흐름 익히기를 이때 끝내 두는 것이 실전에서 몇 분을 좌우합니다.<\/li>\n<\/ul>\n<p>예매 당일 로그인이 안 되거나 비밀번호를 찾다가 시간을 보내면 그 회차는 사실상 끝납니다. <b>65세 이상 부모님 표를 대신 잡아 드릴 계획이라면 순서가 반대입니다.<\/b> 부모님 명의로 철도회원에 가입하면 경로 자격이 <b>회원 가입 시 자동 인증<\/b>되고, 경쟁이 훨씬 덜한 <b>9월 3~4일 사전예매<\/b>를 쓸 수 있습니다. 결제·발권은 보호자가 예매 고객의 신분증을 지참하면 대리로 가능합니다(자세한 조건은 아래 4번).<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 장애인·경로·임산부·국가유공자 사전예매<\/h2>\n<p>여기에 해당되면 경쟁 강도가 완전히 달라집니다. 9월 3일~4일은 <b>전 열차·전 노선이 대상<\/b>이고, 경쟁자는 교통약자 고객으로 한정되기 때문입니다. 일반예매(9월 7~11일)를 기다리는 것보다 압도적으로 유리합니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>내용<\/th><\/tr>\n<tr><td>대상<\/td><td>장애인 · 경로 · 임산부 · 국가유공자(교통지원 대상)<\/td><\/tr>\n<tr><td>기간<\/td><td>9월 3일(목) ~ 4일(금) 9시~15시 (3일=경부·경전·동해·중부내륙·경북·대구·충북·교외선 / 4일=호남·전라·중앙·강릉·장항·영동·태백·서해·경춘·목포보성선)<\/td><\/tr>\n<tr><td>판매 방법<\/td><td>코레일+(앱) · 홈페이지 · <b>철도고객센터 전화 예매 ☎1544-8545<\/b><\/td><\/tr>\n<tr><td>사전 인증<\/td><td>장애인·임산부·국가유공자는 <b>철도회원 가입 후 사전 인증 필수<\/b> (경로 고객은 회원 가입 시 자동 인증)<\/td><\/tr>\n<tr><td>인증 경로<\/td><td>홈페이지 → 마이페이지 → 회원정보관리 (장애인인증 / 맘편한코레일 / 유공자 명절사전예매인증)<\/td><\/tr>\n<tr><td>결제<\/td><td>9월 12일(토) 00시 ~ <b>9월 18일(금) 24시<\/b> · 고객센터 ARS(☎1588-7788) 또는 전국 역 창구<\/td><\/tr>\n<tr><td>대상 열차<\/td><td>KTX 등 모든 열차 · 1인당 최대 12매(1회당 6매 이내)<\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 이 혜택이 제한되는 경우 (공식 안내문의 제재 대상 예시)<\/b>\n<ul style=\"margin:6px 0 0\">\n<li>교통약자 <b>본인이 아닌 타인이 승차<\/b>하는 경우<\/li>\n<li>교통약자 <b>본인은 승차하지 않고 동행자만<\/b> 이용하는 경우<\/li>\n<\/ul>\n<p style=\"margin:8px 0 0\">사전예매 승차권에는 <b>고객 이름이 표시<\/b>되며, 부당 사용이 적발되면 <b>다음 명절 사전예매 혜택이 제한<\/b>될 수 있습니다. “어머니 자격으로 표만 잡고 자녀들만 타는” 방식은 안 된다는 뜻입니다.<\/p><\/div>\n<p>발권 단계도 미리 알아 두세요. 역 창구에서 결제·발권할 때는 <b>신분증을 지참해야만<\/b> 발권됩니다(임산부는 산모수첩 등 임신·출산 증명서). 보호자가 대신 갈 경우에는 <b>예매 고객의 신분증을 지참하면 대리 결제·발권이 가능<\/b>합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 결제 기한을 놓치면 표가 사라진다<\/h2>\n<p>이번 예매에서 가장 많이 놓치는 함정입니다. 명절 예매는 <b>‘예약’과 ‘결제’가 분리<\/b>돼 있고, 기한 안에 결제하지 않으면 <b>자동 취소<\/b>됩니다. 게다가 기한이 두 개라 헷갈리기 쉽습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>결제 시작<\/th><th>결제 마감<\/th><th>결제 방법<\/th><\/tr>\n<tr><td>일반예매(모든 국민)<\/td><td>9월 12일(토) 00시<\/td><td><b>9월 15일(화) 24시<\/b><\/td><td>코레일+(앱) · 홈페이지<\/td><\/tr>\n<tr><td>사전예매(교통약자)<\/td><td>9월 12일(토) 00시<\/td><td><b>9월 18일(금) 24시<\/b><\/td><td>고객센터 ARS(☎1588-7788) 전화결제 · 역 창구 결제 가능<\/td><\/tr>\n<\/table><\/div>\n<p>즉 <b>9월 11일에 예매를 마쳤어도 9월 12일이 되기 전에는 결제할 수 없고<\/b>, 9월 15일 자정을 넘기면 애써 잡은 좌석이 그대로 풀립니다. 예매를 마친 직후 휴대전화 달력에 <b>‘9월 12일 결제 시작 / 9월 15일 마감’<\/b> 알림을 걸어 두시는 편이 안전합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 취소·환불 위약금 (명절 특별 기준)<\/h2>\n<p>명절 기간에는 평소보다 촘촘한 위약금 기준이 적용됩니다. 공식 안내문에 실린 표는 다음과 같습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>출발 2일 전<\/th><th>출발 1일 전<\/th><th>출발 당일<br>~3시간 전<\/th><th>3시간 경과 후<br>~출발 전<\/th><th>출발 후<br>20분까지<\/th><th>출발 후<br>60분까지<\/th><th>도착시간<br>까지<\/th><\/tr>\n<tr><td>400원<\/td><td>5%<\/td><td>10%<\/td><td>20%<\/td><td>30%<\/td><td>40%<\/td><td>70%<\/td><\/tr>\n<\/table><\/div>\n<p>숫자만 보면 감이 잘 안 오니, <b>운임이 10만 원인 승차권을 예로<\/b> 계산해 보겠습니다(실제 운임은 구간·열차에 따라 다르므로 아래는 비율 계산 예시입니다).<\/p>\n<ul>\n<li>출발 2일 전 취소 → <b>400원<\/b>만 떼고 거의 전액 환불<\/li>\n<li>출발 하루 전 취소 → 5% = <b>5,000원<\/b><\/li>\n<li>출발 당일 아침에 취소(3시간 전) → 10% = <b>1만 원<\/b><\/li>\n<li>출발 1시간 전 취소 → 20% = <b>2만 원<\/b><\/li>\n<li>열차를 놓치고 20분 뒤 취소 → 30% = <b>3만 원<\/b><\/li>\n<li>1시간 뒤 → 40% = <b>4만 원<\/b>, 도착시간까지 → 70% = <b>7만 원<\/b><\/li>\n<\/ul>\n<p>결론은 명확합니다. <b>일정이 흔들릴 것 같으면 출발 이틀 전에 정리<\/b>하는 것이 압도적으로 유리합니다. 이틀 전(400원)과 하루 전(5,000원)의 차이는 하루 사이에 12배가 넘습니다. 또 하나, <b>승차 후 도중역에서 내리면 남은 구간 운임은 환불되지 않습니다.<\/b><\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 자리를 못 잡았다면 — 잔여석·취소표<\/h2>\n<p>예매에 실패했다고 해서 방법이 없는 것은 아닙니다. 공식 안내문이 정한 두 번째 기회는 <b>9월 11일(금) 15시<\/b>입니다.<\/p>\n<ul>\n<li><b>잔여석 상시 판매<\/b> — 9월 11일 15시부터 코레일+(앱)·홈페이지·<b>역 창구<\/b>에서 남은 좌석을 계속 판매합니다. 예매 기간과 달리 이때는 역 창구도 열립니다.<\/li>\n<li><b>비회원 구매 시 즉시 결제<\/b> — 잔여석은 비회원도 살 수 있지만 결제를 미룰 수 없습니다.<\/li>\n<li><b>결제 마감 직후를 노리세요<\/b> — 공식 안내문은 <b>기한 내 결제하지 않으면 예매가 자동 취소<\/b>된다고 명시하고 있습니다. 일반예매분 결제 마감이 9월 15일(화) 24시이므로, <b>9월 16일(수) 무렵 미결제 취소분이 풀릴 것으로 예상<\/b>됩니다(코레일이 별도로 공지한 일정은 아니며, 실제 좌석 상황은 앱에서 직접 확인하셔야 합니다).<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 이번 추석에는 안 되는 것들<\/h2>\n<p>평소처럼 하려다 막히는 항목들입니다. 공식 안내문의 ‘기타 사항’에 명시돼 있습니다.<\/p>\n<ul>\n<li><b>역 창구 예매 없음<\/b> — 예매 기간에는 앱·홈페이지 전용입니다(잔여석 판매는 예외).<\/li>\n<li><b>KTX 마일리지 적립, 일반열차 할인쿠폰 적립 대상에서 제외<\/b><\/li>\n<li><b>노인석·자유석·유아동반석·KTX동반석 운영 중지<\/b><\/li>\n<li><b>각종 할인상품 운영 중지<\/b> — N카드, 인터넷특가, 여행패스 등<\/li>\n<li><b>도중역 하차 시 잔여 구간 운임 미반환<\/b><\/li>\n<\/ul>\n<p>특히 평소 자유석이나 인터넷특가로 저렴하게 다니시던 분이라면, 이번 연휴에는 <b>정상 운임 기준으로 예산을 잡으셔야<\/b> 합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 웃돈 주고 사면 처벌받습니다<\/h2>\n<p>표를 못 구하면 카페·중고거래에서 “웃돈 얹어 드릴게요”라는 글에 눈이 가기 마련입니다. 그런데 <b>파는 쪽도 사는 쪽도 처벌 대상<\/b>입니다. 한국철도공사가 함께 공지한 내용은 다음과 같습니다.<\/p>\n<ul>\n<li>「철도사업법」 제10조의2(승차권 등 부정판매의 금지) → <b>1,000만 원 이하의 과태료<\/b><\/li>\n<li>「경범죄처벌법」 제3조(경범죄의 종류) → <b>20만 원 이하의 벌금, 구류 또는 과료<\/b><\/li>\n<li>「철도회원 약관」 제11조(자격상실 및 서비스 이용제한) → <b>회원 강제탈퇴<\/b><\/li>\n<\/ul>\n<p>금전 피해도 흔합니다. 대금만 보내고 표를 못 받는 경우, 신용카드로 결제된 표라 반환 시 원금을 못 받는 경우, 같은 표가 중복 판매돼 열차를 못 타는 경우, <b>캡처·사진으로 받은 표로 타다가 부정승차로 단속되는 경우<\/b>가 공지에 열거돼 있습니다. 참고로 한국철도공사는 ‘암표제보방’을 운영하며, 유효한 신고에는 <b>KTX 등 열차 운임 50% 할인쿠폰 1매<\/b>를 제공합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.korail.com/ticket/guest/notice/25563\" target=\"_blank\" rel=\"nofollow\">▸ 한국철도공사 — 2026년 추석 연휴 승차권 예매 안내문<\/a><a href=\"https://www.korail.com/ticket/guest/notice/25562\" target=\"_blank\" rel=\"nofollow\">▸ 한국철도공사 — 장애인·경로·임산부·국가유공자 사전 예매 안내<\/a><a href=\"https://www.korail.com/ticket/guest/notice/25561\" target=\"_blank\" rel=\"nofollow\">▸ 한국철도공사 — 추석 연휴 승차권 암표 거래 주의 안내<\/a><a href=\"https://www.korail.com/ticket/main\" target=\"_blank\" rel=\"nofollow\">▸ 코레일 승차권 예매 (앱·홈페이지)<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">정리하면 <b>이번 주 할 일은 통합 회원 확인과 8월 24일 14시부터의 전용 페이지 사전 체험<\/b>, 그다음이 <b>내 노선 예매일(사전예매 9월 3~4일 / 일반예매 9월 7~11일)<\/b>, 마지막이 <b>9월 15일 결제 마감<\/b>입니다. 노선별 날짜와 시간은 위 공식 안내문 페이지에서 다시 한 번 확인하시고, 열차 시각·운임은 예매 당일 코레일+ 앱에서 확인하세요.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월<\/b> 기준이며, 변동될 수 있습니다. 예매 전 공식 사이트에서 확인하세요.<br>출처: <a href=\"htt \n.lsg .top{display:inline-block;font-size:13px;color:#8a97ab;text-decoration:none;margin:2px 0 6px}\n.lsg .warn{background:#fff4f2;border:1px solid #f6cfc6;border-radius:12px;padding:14px 18px;margin:14px 0}\n.lsg .warn b{display:block;font-size:15px;color:#c0442a;margin-bottom:6px}\n.lsg .tip{background:#eefaf4;border:1px solid #cfeadd;border-radius:12px;padding:14px 18px;margin:14px 0}\n.lsg .tip b{display:block;font-size:15px;color:#1a8c5e;margin-bottom:6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">생활·행정<\/span>\n<p>가을 이사철이 시작되면 전월세 계약서를 쓰는 분이 많아집니다. 그런데 <b>계약서에 도장을 찍은 날부터 시계가 돌아가는 신고 의무<\/b>가 하나 있습니다. <b>주택 임대차 계약 신고제<\/b>, 흔히 <b>전월세 신고제<\/b>라고 부르는 것입니다.<\/p>\n<p>중요한 것은 <b>2021년 6월부터 2025년 5월까지 4년간 이어지던 과태료 계도기간이 이미 끝났다<\/b>는 점입니다. 유예가 있던 시절에 이사를 해 본 경험만 가지고 \"안 해도 별일 없더라\"라고 생각하면 지금은 다릅니다.<\/p>\n<p>이 글은 국토교통부 <b>부동산거래관리시스템(RTMS)<\/b>과 법제처 <b>찾기쉬운 생활법령정보<\/b>의 공식 안내만 가지고 <b>①내 계약이 신고 대상인지 판정하는 법 ②신고 안 해도 되는 계약(가장 많이 틀리는 자리) ③인터넷으로 끝내는 절차 ④확정일자가 자동으로 붙는 범위와 안 붙는 범위 ⑤30일을 넘겼을 때 과태료<\/b>를 정리했습니다. 확인일은 <b>2026년 8월 15일<\/b>입니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 내 계약도 신고 대상인가 — 금액·지역 2단 판정<\/a><a href=\"#sec2\">2. 신고 안 해도 되는 계약 (탈락 사유)<\/a><a href=\"#sec3\">3. 언제까지 — 계약 체결일부터 30일<\/a><a href=\"#sec4\">4. 인터넷으로 끝내는 절차 — 두 가지 경로<\/a><a href=\"#sec5\">5. 확정일자 자동 부여 — 붙는 범위와 안 붙는 범위<\/a><a href=\"#sec6\">6. 전입신고·확정일자·임대차신고 3종 비교<\/a><a href=\"#sec7\">7. 30일을 넘겼다면 — 과태료<\/a><a href=\"#sec8\">8. 계약이 바뀌거나 깨졌을 때도 신고합니다<\/a><a href=\"#sec9\">9. 놓치기 쉬운 함정 6가지<\/a><a href=\"#sec10\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec1\">👉 내 계약이 신고 대상인지 먼저 판정하기<\/a>\n\n<h2 id=\"sec1\">1. 내 계약도 신고 대상인가 — 금액·지역 2단 판정<\/h2>\n<p>신고 대상은 <b>금액<\/b>과 <b>지역<\/b> 두 가지를 <b>모두<\/b> 만족해야 합니다. 하나라도 걸리지 않으면 신고 의무가 없습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>판정 단계<\/th><th>기준<\/th><\/tr>\n<tr><td><b>1단계 · 금액<\/b><\/td><td><b>보증금 6천만원 초과<\/b> <b style=\"color:#c0442a\">또는<\/b> <b>월 차임(월세) 30만원 초과<\/b><br><span style=\"font-size:13px\">둘 중 하나만 넘어도 대상<\/span><\/td><\/tr>\n<tr><td><b>2단계 · 지역<\/b><\/td><td>수도권 전역(<b>서울·경기도·인천<\/b>) · <b>광역시<\/b> · <b>세종시<\/b> · <b>제주시<\/b> · <b>도(道)의 시(市) 지역<\/b><br><span style=\"font-size:13px\">도 지역의 <b>군(郡)<\/b>은 제외<\/span><\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ '또는'입니다 — 여기서 가장 많이 틀립니다<\/b><p style=\"margin:6px 0 0\">\"보증금도 크고 월세도 비싸야 신고 대상\"이라고 오해하는 경우가 많습니다. 공식 기준은 <b>보증금 6천만원 초과 <u>또는<\/u> 월세 30만원 초과<\/b>입니다. <b>둘 중 하나만 넘어도 신고 대상<\/b>이고, <b>둘 다 기준 이하일 때만<\/b> 대상에서 빠집니다.<\/p><\/div>\n<div class=\"tip\"><b>🧮 내 계약으로 판정해 보기<\/b>\n<div class=\"tw\"><table style=\"margin-top:8px\">\n<tr><th>계약 조건<\/th><th>지역<\/th><th>판정<\/th><\/tr>\n<tr><td>보증금 5,000만원 / 월세 0원(전세)<\/td><td>서울<\/td><td>❌ 대상 아님<br><span style=\"font-size:13px\">보증금 6천만원 이하 · 월세 없음<\/span><\/td><\/tr>\n<tr><td>보증금 5,000만원 / 월세 <b>35만원<\/b><\/td><td>서울<\/td><td>✅ <b>대상<\/b><br><span style=\"font-size:13px\">보증금은 기준 이하지만 <b>월세가 30만원 초과<\/b><\/span><\/td><\/tr>\n<tr><td>보증금 <b>1억원<\/b> / 월세 0원(전세)<\/td><td>인천<\/td><td>✅ <b>대상<\/b><br><span style=\"font-size:13px\">월세가 없어도 <b>보증금이 6천만원 초과<\/b><\/span><\/td><\/tr>\n<tr><td>보증금 3,000만원 / 월세 25만원<\/td><td>대전(광역시)<\/td><td>❌ 대상 아님<br><span style=\"font-size:13px\">둘 다 기준 이하<\/span><\/td><\/tr>\n<tr><td>보증금 <b>2억원<\/b> / 월세 0원<\/td><td>강원도 <b>양양군<\/b><\/td><td>❌ 대상 아님<br><span style=\"font-size:13px\">금액은 넘지만 <b>도 지역의 군<\/b>은 제외<\/span><\/td><\/tr>\n<tr><td>보증금 8,000만원 / 월세 20만원<\/td><td>경상남도 <b>양산시<\/b><\/td><td>✅ <b>대상<\/b><br><span style=\"font-size:13px\">도의 <b>시<\/b> 지역 + 보증금 초과<\/span><\/td><\/tr>\n<\/table><\/div>\n<p style=\"margin:8px 0 0\"><b>전세도 신고 대상입니다.<\/b> 이름이 '전월세 신고제'라서 월세만 해당한다고 오해하기 쉬운데, 보증금이 6천만원을 넘으면 순수 전세도 신고해야 합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 신고 안 해도 되는 계약 (탈락 사유)<\/h2>\n<p>신고 의무가 <b>없는<\/b> 경우를 먼저 아는 것이 실무에서는 더 빠릅니다. 공식 안내가 제외로 정하고 있는 자리는 아래와 같습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>제외되는 경우<\/th><th>왜 제외인가<\/th><\/tr>\n<tr><td><b>보증금 6천만원 이하 <u>이면서<\/u> 월세 30만원 이하<\/b>인 계약<\/td><td>금액 기준 자체를 못 넘음<\/td><\/tr>\n<tr><td><b>도(道) 지역의 군(郡)<\/b>에 있는 주택<\/td><td>신고 대상 지역이 아님<\/td><\/tr>\n<tr><td><b>계약 금액에 변동이 없는 갱신계약<\/b><\/td><td>새로 신고할 내용이 없음<\/td><\/tr>\n<tr><td><b>주된 거처가 따로 있는 일시적·단기 거주<\/b><br><span style=\"font-size:13px\">예: 단기 체험 목적 거주<\/span><\/td><td>주거 목적의 임대차로 보지 않음<\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 갱신계약은 \"금액이 그대로일 때만\" 제외입니다<\/b><p style=\"margin:6px 0 0\">계약을 연장하면서 <b>보증금이나 월세를 한 푼이라도 올리거나 내렸다면 신고 대상<\/b>입니다. \"재계약이니까 안 해도 된다\"가 아니라 <b>\"금액이 안 바뀐 재계약이라야 안 해도 된다\"<\/b>가 정확한 문장입니다. 가을 이사철에는 이사 대신 <b>인상 재계약<\/b>을 하는 경우가 많은데, 이쪽이 오히려 놓치기 쉽습니다.<\/p><\/div>\n<p>기숙사비처럼 주거 목적 임대차로 보기 어려운 계약도 제외로 안내되고 있습니다. <b>내 계약이 제외에 해당하는지 애매하면 신고해 두는 편이 안전합니다<\/b> — 신고 자체에는 수수료가 없고, 대상이 아닌 계약을 신고했다고 해서 불이익이 생기지 않습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 언제까지 — 계약 체결일부터 30일<\/h2>\n<p>기한은 <b>임대차 계약 체결일부터 30일 이내<\/b>입니다. 이 글에서 가장 자주 오해되는 지점이 여기입니다.<\/p>\n<div class=\"warn\"><b>⚠️ 기준일은 '이사한 날'도 '잔금일'도 아닙니다<\/b><p style=\"margin:6px 0 0\">기산점은 <b>계약을 체결한 날<\/b>, 즉 <b>계약서에 서명·날인한 날<\/b>입니다. 계약서를 8월에 쓰고 10월에 입주하는 경우, <b>신고 기한은 9월에 이미 끝납니다.<\/b> 입주할 때 전입신고와 함께 처리하면 된다고 미뤄 두면 그 사이에 30일이 지나갑니다. 가을 이사철에 이 사고가 가장 많이 납니다.<\/p><\/div>\n<ul>\n<li>신고는 <b>임대인과 임차인이 공동으로<\/b> 하는 것이 원칙이며, <b>위임신고<\/b>도 가능합니다.<\/li>\n<li>다만 <b>임대차계약서를 첨부<\/b>하면 <b>어느 한쪽이 단독으로<\/b> 신고할 수 있습니다. 실무에서는 대부분 이 경로를 씁니다.<\/li>\n<li><b>신고 수수료는 없습니다.<\/b><\/li>\n<\/ul>\n<p>공인중개사를 통해 계약했다면 중개사무소에서 신고를 대행해 주는 경우가 많지만, <b>신고 의무 자체는 계약 당사자에게 있습니다.<\/b> \"중개사가 해 주기로 했다\"는 말만 믿지 말고 <b>접수 완료 여부를 직접 확인<\/b>하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 인터넷으로 끝내는 절차 — 두 가지 경로<\/h2>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>온라인<\/th><th>방문<\/th><\/tr>\n<tr><td><b>어디서<\/b><\/td><td><b>부동산거래관리시스템(RTMS)<\/b><br>또는 <b>부동산 전자계약시스템<\/b><\/td><td>임대차 목적물 <b>소재지 관할 주민센터<\/b><\/td><\/tr>\n<tr><td><b>관할<\/b><\/td><td colspan=\"2\">주택 소재지의 <b>시장·군수·구청장<\/b>(읍·면·동 주민센터에서 처리)<br><span style=\"font-size:13px\">내가 사는 동네가 아니라 <b>계약한 집이 있는 동네<\/b>가 기준<\/span><\/td><\/tr>\n<tr><td><b>준비물<\/b><\/td><td>임대차계약서 파일(스캔·촬영) + 본인인증 수단<\/td><td>임대차계약서 + 신분증<\/td><\/tr>\n<tr><td><b>수수료<\/b><\/td><td colspan=\"2\"><b>없음<\/b><\/td><\/tr>\n<\/table><\/div>\n<h3>온라인 신고 순서<\/h3>\n<ol>\n<li><b>rtms.molit.go.kr<\/b> 접속 → 로그인(공동인증서·간편인증 등 본인인증)<\/li>\n<li><b>임대차 신고<\/b> 메뉴 선택 → 주택 소재지의 <b>시·군·구<\/b> 선택<\/li>\n<li>임대인·임차인 정보, 주택 정보, <b>보증금·월 차임·계약기간<\/b> 입력<\/li>\n<li><b>임대차계약서 파일 첨부<\/b>(단독신고 시 필수)<\/li>\n<li>제출 → 접수 완료 후 <b>신고필증 확인·출력<\/b><\/li>\n<\/ol>\n<div class=\"tip\"><b>💡 신고필증은 꼭 받아 두세요<\/b><p style=\"margin:6px 0 0\">신고가 처리되면 <b>주택 임대차 계약 신고필증<\/b>이 발급됩니다. 이것이 <b>기한 내에 신고했다는 유일한 증거<\/b>이자, 확정일자 부여 사실을 확인하는 자료입니다. 접수만 해 놓고 처리 결과를 확인하지 않으면, 서류 미비로 반려됐을 때 그대로 기한을 넘기게 됩니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 확정일자 자동 부여 — 붙는 범위와 안 붙는 범위<\/h2>\n<p>임대차 신고제의 가장 큰 실익은 <b>확정일자가 자동으로 붙는다<\/b>는 점입니다. 그런데 <b>모든 신고에 자동으로 붙는 것이 아닙니다.<\/b> 여기가 이 제도에서 제일 위험한 함정입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>내가 한 신고<\/th><th>확정일자<\/th><\/tr>\n<tr><td><b>임대차계약서를 첨부<\/b>해서 신고<br><span style=\"font-size:13px\">(온라인 단독신고의 표준 경로)<\/span><\/td><td>✅ <b>자동 부여<\/b><\/td><\/tr>\n<tr><td>계약서 <b>없이<\/b> 신고 내용만 제출<br><span style=\"font-size:13px\">(공동신고 등에서 계약서를 첨부하지 않은 경우)<\/span><\/td><td>❌ <b>부여되지 않음<\/b><br><span style=\"font-size:13px\">확정일자를 따로 받아야 함<\/span><\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ \"신고했으니 확정일자는 됐겠지\"가 보증금을 위험하게 만듭니다<\/b><p style=\"margin:6px 0 0\">확정일자는 <b>보증금에 우선변제권을 붙여 주는 장치<\/b>입니다. 임대차 신고를 하면서 <b>계약서를 첨부하지 않았다면 확정일자는 부여되지 않습니다.<\/b> 신고는 했는데 확정일자가 없는 상태로 몇 달을 보내다가, 그 사이 주택에 근저당이 잡히면 순위에서 밀립니다.<\/p><p style=\"margin:8px 0 0\"><b>확인 방법은 하나입니다 — 신고필증에 확정일자 부여 사실이 표시돼 있는지 직접 볼 것.<\/b> 표시가 없으면 주민센터나 등기소에서 확정일자를 별도로 받으세요.<\/p><\/div>\n<p>그리고 확정일자만으로는 부족합니다. 대항력을 갖추려면 <b>주택의 인도(입주)<\/b>와 <b>전입신고<\/b>가 함께 있어야 합니다. 절차 자체는 <a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_546.html\">전입신고 인터넷 신청 방법 확정일자 받기 총정리<\/a>에서 단계별로 다뤘습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 전입신고·확정일자·임대차신고 3종 비교<\/h2>\n<p>세 가지가 이름이 비슷해서 <b>\"하나 했으니 나머지도 된 것\"<\/b>으로 착각하기 쉽습니다. 목적이 서로 다릅니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>전입신고<\/th><th>확정일자<\/th><th>주택 임대차 신고<\/th><\/tr>\n<tr><td><b>왜 하나<\/b><\/td><td>대항력<br><span style=\"font-size:13px\">집이 팔려도 계속 살 권리<\/span><\/td><td>우선변제권<br><span style=\"font-size:13px\">보증금을 순위대로 돌려받을 권리<\/span><\/td><td><b>법정 신고 의무<\/b><br><span style=\"font-size:13px\">임대차 시장 정보 투명화<\/span><\/td><\/tr>\n<tr><td><b>의무인가<\/b><\/td><td>주민등록법상 의무<br>(이사 후 14일 이내)<\/td><td>의무 아님<br>(내 보증금을 지키는 선택)<\/td><td><b>의무<\/b><br>(계약 후 30일 이내)<\/td><\/tr>\n<tr><td><b>안 하면<\/b><\/td><td>대항력 없음<br>+ 주민등록법상 과태료<\/td><td>우선변제권 없음<br><span style=\"font-size:13px\">과태료는 없음<\/span><\/td><td><b>과태료<\/b><\/td><\/tr>\n<tr><td><b>어디서<\/b><\/td><td>정부24 · 주민센터<\/td><td>주민센터 · 등기소<br>· 대법원 인터넷등기소<\/td><td><b>RTMS<\/b> · 주민센터<\/td><\/tr>\n<tr><td><b>서로 대체되나<\/b><\/td><td colspan=\"3\"><b>대체되지 않습니다.<\/b> 다만 <b>임대차 신고 시 계약서를 첨부하면 확정일자가 자동 부여<\/b>되므로 <b>확정일자 절차 하나만<\/b> 생략됩니다. <b>전입신고는 별도로 반드시 해야 합니다.<\/b><\/td><\/tr>\n<\/table><\/div>\n<div class=\"tip\"><b>💡 이사철 순서 정리<\/b><ul style=\"margin:6px 0 0\"><li><b>계약서 쓴 날부터 30일 이내<\/b> → 주택 임대차 신고(계약서 첨부 = 확정일자 동시 해결)<\/li><li><b>입주(이사)한 날부터 14일 이내<\/b> → 전입신고<\/li><li>확정일자가 신고로 붙지 않았다면 → <b>입주 전에<\/b> 따로 받아 둘 것<\/li><\/ul><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 30일을 넘겼다면 — 과태료<\/h2>\n<p>먼저 <b>계도기간이 끝났다<\/b>는 사실부터 확인하고 넘어가야 합니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>내용<\/th><\/tr>\n<tr><td><b>계도기간<\/b><\/td><td><b>2021년 6월 1일 ~ 2025년 5월 31일<\/b> — 이 기간에는 과태료가 부과되지 않았음<br><span style=\"font-size:13px;color:#c0442a\"><b>현재는 종료된 상태입니다<\/b><\/span><\/td><\/tr>\n<tr><td><b>미신고·지연신고<\/b><\/td><td>국토교통부 안내 기준 <b>2만원 ~ 30만원 이하<\/b>의 과태료<br><span style=\"font-size:13px\">지연 기간·금액에 따라 차등<\/span><\/td><\/tr>\n<tr><td><b>거짓 신고<\/b><\/td><td><b>100만원 이하<\/b>의 과태료<\/td><\/tr>\n<tr><td><b>법률상 상한<\/b><\/td><td>신고를 하지 않거나 거짓으로 신고한 자는 <b>100만원 이하<\/b>의 과태료<br><span style=\"font-size:13px\">「부동산 거래신고 등에 관한 법률」<\/span><\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 지연 기간별 정확한 부과 금액은 공식 페이지에서 확인하세요<\/b><p style=\"margin:6px 0 0\">과태료는 <b>지연 기간과 계약 금액에 따라 구간별로 차등 부과<\/b>되며, 세부 구간표는 「부동산 거래신고 등에 관한 법률 시행령」 별표에 규정돼 있습니다. <b>이 글에서는 구간별 금액을 임의로 적지 않습니다.<\/b> 실제로 부과될 금액은 <b>관할 주민센터 또는 국토교통부 부동산거래관리시스템<\/b>에서 확인하시기 바랍니다.<\/p><\/div>\n<div class=\"tip\"><b>💡 늦었어도 지금 신고하는 편이 낫습니다<\/b><p style=\"margin:6px 0 0\">과태료는 <b>지연 기간이 길수록 무거워지는 구조<\/b>입니다. 30일이 이미 지났다면 미루는 만큼 불리해집니다. 또한 <b>확정일자는 신고한 날에 부여<\/b>되므로, 신고를 미루는 동안은 <b>우선변제권도 생기지 않은 상태<\/b>입니다. 과태료보다 이쪽이 훨씬 큰 위험입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 계약이 바뀌거나 깨졌을 때도 신고합니다<\/h2>\n<p>신고 의무는 <b>최초 계약 한 번으로 끝나지 않습니다.<\/b><\/p>\n<div class=\"tw\"><table>\n<tr><th>상황<\/th><th>신고 의무<\/th><th>기한<\/th><\/tr>\n<tr><td><b>보증금·차임이 변경<\/b>된 경우<br><span style=\"font-size:13px\">인상·인하 모두<\/span><\/td><td>✅ <b>변경 신고<\/b><\/td><td>변경이 확정된 날부터 <b>30일 이내<\/b><\/td><\/tr>\n<tr><td><b>계약이 해제<\/b>된 경우<\/td><td>✅ <b>해제 신고<\/b><\/td><td>해제가 확정된 날부터 <b>30일 이내<\/b><\/td><\/tr>\n<tr><td>금액 변동 <b>없이<\/b> 기간만 연장<\/td><td>❌ 신고 대상 아님<\/td><td>—<\/td><\/tr>\n<\/table><\/div>\n<p>변경·해제 신고도 <b>공동 신고가 원칙<\/b>이며, 한쪽이 신고를 거부하면 <b>단독 신고<\/b>가 가능합니다. 계약 해제 후 신고를 하지 않으면 <b>전산상 임대차 관계가 남아 있는 상태<\/b>가 되므로, 임대인 입장에서도 정리해 두는 편이 안전합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 놓치기 쉬운 함정 6가지<\/h2>\n<ol>\n<li><b>기준은 '또는'입니다.<\/b> 보증금 6천만원 초과 <b>또는<\/b> 월세 30만원 초과 — 하나만 넘어도 대상입니다.<\/li>\n<li><b>전세도 신고 대상입니다.<\/b> 보증금이 6천만원을 넘으면 월세가 0원이어도 신고해야 합니다.<\/li>\n<li><b>기산점은 계약서를 쓴 날입니다.<\/b> 이사한 날이 아닙니다. 계약과 입주 사이가 길면 입주 전에 기한이 끝납니다.<\/li>\n<li><b>계약서를 첨부하지 않으면 확정일자가 안 붙습니다.<\/b> 신고필증에서 반드시 확인하세요.<\/li>\n<li><b>전입신고는 따로 해야 합니다.<\/b> 임대차 신고가 전입신고를 대신하지 않습니다.<\/li>\n<li><b>금액이 바뀐 재계약은 신고 대상입니다.<\/b> \"재계약이라 안 해도 된다\"는 <b>금액이 그대로일 때만<\/b> 맞는 말입니다.<\/li>\n<\/ol>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">공식 확인 페이지<\/h2>\n<p>신고 대상 지역·금액 기준과 과태료 부과 기준은 아래 공식 창구에서 직접 확인하세요.<\/p>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://rtms.molit.go.kr\" target=\"_blank\" rel=\"nofollow\">▸ 국토교통부 부동산거래관리시스템(RTMS) — 임대차 신고<\/a><a href=\"https://rtms.molit.go.kr/main/serviceInfo.do\" target=\"_blank\" rel=\"nofollow\">▸ RTMS 주택임대차계약신고 서비스 안내<\/a><a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&csmSeq=629&ccfNo=2&cciNo=2&cnpClsNo=5\" target=\"_blank\" rel=\"nofollow\">▸ 법제처 찾기쉬운 생활법령정보 — 주택 임대차 계약 신고제<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">주택 임대차 신고는 <b>보증금 6천만원 초과 또는 월세 30만원 초과<\/b> 계약을 <b>계약 체결일부터 30일 이내<\/b>에 신고하는 <b>법정 의무<\/b>입니다. 대상 지역은 수도권 전역·광역시·세종·제주시·도의 시 지역이며 <b>도 지역의 군은 제외<\/b>됩니다. <b>2021년 6월부터 2025년 5월까지의 계도기간은 이미 끝났습니다.<\/b> 온라인은 <b>rtms.molit.go.kr<\/b>에서 계약서를 첨부해 단독으로 신고할 수 있고, 이때 <b>확정일자가 자동 부여<\/b>됩니다. 다만 <b>계약서를 첨부하지 않으면 확정일자는 붙지 않고, 전입신고는 어떤 경우에도 따로 해야 합니다.<\/b> 계약서를 쓴 그 주에 신고까지 끝내 두는 것이 가장 안전합니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월<\/b> 기준(확인일 2026년 8월 15일)이며, 국토교통부 부동산거래관리시스템(RTMS) 공식 서비스 안내와 법제처 찾기쉬운 생활법령정보의 「주택 임대차 계약 신고제」 안내를 근거로 작성했습니다. 본문의 과태료 범위(미신고·지연 2만원~30만원, 거짓신고 100만원 이하)는 <b>RTMS 공식 서비스 안내에 표기된 값<\/b>입니다. 다만 <b>지연 기간·계약 금액별 구간 산정표는 공식 확인이 되지 않아 본문에 싣지 않았습니다<\/b> — 내 계약에 실제로 부과될 금액은 관할 주민센터 또는 아래 공식 페이지에서 확인하세요.<br>출처: <a href=\"https://rtms.molit.go.kr/main/serviceInfo.do\" target=\"_blank\" rel=\"nofollow\">국토교통부 부동산거래관리시스템 — 주택임대차계약신고 서비스 안내<\/a> · <a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&csmSeq=629&ccfNo=2&cciNo=2&cnpClsNo=5\" target=\"_blank\" rel=\"nofollow\">법제처 찾기쉬운 생활법령정보 — 주택 임대차 계약 신고제<\/a><\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_546.html\">▸ 전입신고 인터넷 신청 방법 확정일자 받기 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/hug-hf-sgi-2026.html\">▸ 전세보증금 반환보증 가입 방법 보증료 HUG HF SGI 조건 총정리 (2026)<\/a><a h       adv.push('색인 0/'+idx.total+iDt+' — 크롤 '+cr+'편·미크롤 '+(idx.total-cr)+'편. GSC 일일한도+OSMU 백링크로 점진(재검토는 색인 잡힌 뒤).');}
    else adv.push('색인 '+idx.indexed+'/'+idx.total+'편'+iDt+'.');
  }
  if(oNv>oTh) adv.push('OSMU 쓰레드 '+oTh+'/'+oNv+' — '+(oNv-oTh)+'편 미게시(rate-limit 보류분 재시도 필요).');
  if(oTh>oIn) adv.push('OSMU 인스타 '+oIn+'/'+oTh+' — 쓰레드 확산 대비 '+(oTh-oIn)+'편 미확산(카드뉴스 backlog).');
  if(collab&&collab.uncommitted>=10) adv.push('미커밋 '+collab.uncommitted+'파일 — 발행 완료 후 세션별 커밋 분리 권장.');
  const adviceHtml=adv.length?'<div class="advice">'+adv.map(t=>'<div class="ai"><span class="ic">💡</span><span>'+esc(t)+'</span></div>').join('')+'</div>':'<div class="pcode none">현재 조치 필요 항목 없음</div>';
  // 📋 미결 관리 — 글별(pending.json: DB osmu + index_status에서 계산)
  const pc=(pend&&pend.counts)||{};
  const cb=(ok,l)=>'<span class="ch '+(ok?'on':'off')+'">'+l+(ok?'✓':'✗')+'</span>';
  const pendRows=(pend&&pend.actionable||[]).map(a=>{
    const c=a.ch||{};
    return '<div class="prow"><span class="pcd">'+esc(a.code)+'</span><span class="ptt">'+esc(a.title)+'</span>'
    +cb(c.g!==false,'G')+cb(c.n,'N')+cb(c.t,'T')+cb((osmuByCode[a.code]||{}).instagram,'I')+'</div>';
  }).join('');
  // 표시는 상위 14편으로 잘려 있음(pending.py) → 남은 수는 counts로 계산해 "…외 N편"
  const pendListed=(pend&&pend.actionable||[]).length;
  const pendTotal=Math.max(pc.osmu_pending||0,pc.index_pending||0);
  const pendMore=pendTotal>pendListed?'<div class="cnt">…외 '+(pendTotal-pendListed)+'편</div>':'';
  const pendHtml='<div class="cnt">OSMU 대기 '+(pc.osmu_pending||0)+'편 · 색인 대기 '+(pc.index_pending||0)+'편 / 전체 '+(pc.total||0)+'편</div>'+(pendRows||'<div class="pcode none">미결 없음</div>')+pendMore;
  // 📋 발행 대기 (발행 전 큐 — queue.json) : 코드·제목·썸네일을 한 카드로 묶어 '엉뚱한 글/썸네일' 눈으로 차단
  const qItems=(queue&&queue.items)||[];
  const laneLab={info:'정보성',pop:'대중관심'};
  const qCards=qItems.map(it=>{
    const th=it.thumb_data
      ?'<img class="qth" src="'+it.thumb_data+'" alt="">'
      :'<div class="qth none">썸네일<br>없음</div>';
    const facts=it.facts?'<div class="qfacts">'+esc(it.facts)+'</div>':'';
    const draft=it.draft?'<span class="qdraft">📄 '+esc(it.draft)+'</span>':'';
    const pv=it.body?'<button class="qpv" onclick="qpv(\''+esc(it.code||'')+'\')">👁 본문 미리보기</button>'
                    :'<span class="qpv none">초안 없음(작성 전)</span>';
    return '<div class="qcard">'+th
      +'<div class="qbody"><div class="qtop"><span class="qcode">'+esc(it.code||'')+'</span>'
      +'<span class="qlane '+(it.lane||'info')+'">'+esc(laneLab[it.lane]||it.lane||'')+'</span></div>'
      +'<div class="qtitle">'+esc(it.title||'')+'</div>'+facts
      +'<div class="qmeta">'+pv+draft+'</div></div></div>';
  }).join('');
  // 🚦 오늘 발행량 배지 (2026-07-29) — 승인 누르기 '전에' 보이게 한다.
  //    2026-07-27 에 8편이 한꺼번에 나간 건, 사람이 재고만 보고 몰아서 승인했는데
  //    '오늘 몇 편째'를 아무도 안 세고 있었기 때문이다. 게이트(pace.check)는 발행을 막고,
  //    이 배지는 그 전에 눈으로 막는다.
  let paceHtml='';
  if(pace){
    const st=pace.state||'ok', n=pace.count||0, hard=pace.hard||2;
    const lab=st==='err'?'⚠️ 오늘 발행량을 못 셌습니다 — '+esc(pace.error||'')
      :st==='block'?'⛔ 오늘 '+n+'편 발행됨 — 오늘은 더 발행하지 마세요(3편 이상 금지)'
      :st==='warn'?'⚠️ 오늘 '+n+'편 발행됨 — 기본 페이스는 하루 1편입니다'
      :'✅ 오늘 '+n+'편 발행 — 하루 1편 기준 안';
    const bg=st==='block'?'#3a1218':st==='warn'?'#3a2f12':st==='err'?'#2a2030':'#0c3a2c';
    const bd=st==='block'?'#7a2230':st==='warn'?'#5a4a1a':st==='err'?'#4a3a5a':'#1f6b52';
    const fg=st==='block'?'#ff9aa6':st==='warn'?'#ffd166':st==='err'?'#c9b6e8':'#8ef0cf';
    const titles=(pace.posts||[]).map(p=>'<div style="opacity:.8;margin-top:2px">· '+esc(p.title||'')+'</div>').join('');
    const lanes=pace.lanes||{};
    const laneTxt=Object.keys(lanes).map(k=>{
      const L=lanes[k]; if(!L) return '';
      return '<span style="display:inline-block;margin-right:9px">'+esc(L.label||k)+' <b>'+(L.n||0)+'</b></span>';
    }).join('');
    const over=pace.backlog_over
      ?'<div style="margin-top:5px;color:#ffd166">📦 발행대기 재고 '+pace.backlog+'편 (상한 '+pace.backlog_max+' 초과) — 재고가 쌓이면 몰아치기 발행을 부릅니다. PREP 초안 생성이 잠긴 상태입니다.</div>'
      :'<div style="margin-top:5px;opacity:.75">📦 발행대기 재고 '+(pace.backlog||0)+'편 / 상한 '+(pace.backlog_max||5)+'</div>';
    const laneRow=laneTxt?'<div style="margin-top:4px;opacity:.8;font-size:11.5px">🛤 레인별: '+laneTxt+'<span style="opacity:.6">(자동 2 + 사용자 창구 1 · 루틴은 1회 1건)</span></div>':'';
    paceHtml='<div style="background:'+bg+';border:1px solid '+bd+';color:'+fg
      +';border-radius:8px;padding:8px 11px;margin:2px 0 9px;font-size:12px;line-height:1.5">'
      +'<b>'+lab+'</b>'+titles+over+laneRow+'</div>';
  }
  const qHtml=paceHtml+(qItems.length
    ?'<div class="cnt">발행 대기 '+qItems.length+'건 — 발행하면 카드가 자동으로 사라집니다(사람 승인 게이트)</div>'+qCards
    :'<div class="pcode none">발행 대기 없음 — PREP 루틴이 준비하면 여기 카드로 뜹니다</div>');
  // 🙋 내가 할 일 섹션은 2026-08-12 사용자 지시로 이 화면에서 제거하고
  // index.html(운영콘솔 첫 페이지)의 별도 탭(data-t="mytasks")으로 이전했다.
  document.getElementById('board').innerHTML=
   '<div class="hd"><div class="t"><h1>진행현황</h1><span class="date">'+esc(date)+'</span></div>'
   +'<span class="badge '+bcls+'">'+CHECK+esc(blab)+'</span></div>'
   +'<div class="sec">오늘 한 일</div>'+today
   +'<div class="metrics">'
   +'<div class="m"><div class="l">검사 통과</div><div class="v">'+pass+' <small>/ '+total+'</small></div></div>'
   +'<div class="m"><div class="l">블로그 글</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">평균 본문</div><div class="v">'+avg+' <small>자</small></div></div>'
   +'</div>'
   +'<div class="div"></div>'
   +'<div class="sec">📋 발행 대기 (오늘 발행할 글)<span class="auto">🤖 PREP 큐</span></div>'+qHtml
   +'<div class="div"></div>'
   +'<div class="sec">발행 진행 (글 1편 · '+STEPS.length+'단계, 확산 포함)<span class="auto">🤖 자동</span></div>'+pubHtml
   +'<div class="div"></div>'
   +'<div class="sec">📡 4채널 발행 현황 (구글·네이버·쓰레드·인스타)<span class="auto">🤖 DB 자동집계</span></div>'
   +'<div class="metrics">'
   +'<div class="m"><div class="l">구글(원본)</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">네이버</div><div class="v">'+oNv+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">쓰레드</div><div class="v">'+oTh+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">인스타</div><div class="v">'+oIn+' <small>편</small></div></div>'
   +'</div>'
   +'<div class="cnt">확산 커버리지 · 네이버 '+(count?Math.round(oNv/count*100):0)+'% · 쓰레드 '+(count?Math.round(oTh/count*100):0)+'% · 인스타 '+(count?Math.round(oIn/count*100):0)+'% · 교차링크 완료 '+omAll.length+'편</div>'
   +osmuLi
   +'<div class="div"></div>'
   +'<div class="sec">🤝 협업 — 세션별 역할·진행<span class="auto">git 자동분류</span></div>'+collabHtml
   +'<div class="sec">💡 시스템 조언<span class="auto">라이브 도출</span></div>'+adviceHtml
   +'<div class="div"></div>'
   +'<div class="sec">📋 미결 관리 — 4채널 매칭<span class="auto">G구글·N네이버·T쓰레드·I인스타</span></div>'+pendHtml
   +'<div class="sec">다음</div><div class="next">'+next+'</div>'
   +'<div class="upd" id="upd"></div>';
  tick();
}
// 시계·데이터 기준만 갱신(보드 전체 재렌더 없음 — 정적 베이크 데이터라 시계만 변함)
function tick(){
  const el=document.getElementById('upd'); if(!el)return;
  const b=(window.__DATA__||{}).baked_at;
  el.textContent=(b?'데이터 기준 '+b+' · ':'')+new Date().toLocaleTimeString('ko-KR');
}
// 👁 발행 대기 카드 본문 미리보기 — 초안 HTML을 격리 iframe(srcdoc)로 렌더(스타일 누수 차단, Blogger 미접촉)
function qpv(code){
  const items=((window.__DATA__||{}).queue||{}).items||[];
  const it=items.find(x=>x.code===code); if(!it||!it.body)return;
  document.getElementById('qpv-ttl').textContent=(it.code||'')+' · '+(it.title||'');
  document.getElementById('qpv-fr').srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank"><body style="margin:0;padding:16px;background:#fff">'+it.body+'</body>';
  document.getElementById('qpv-ov').classList.add('show');
}
function qpvClose(){document.getElementById('qpv-ov').classList.remove('show');document.getElementById('qpv-fr').srcdoc='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')qpvClose();});
// 코드 자동 반영: 자기 자신(progress.html)을 주기적으로 fetch→해시 비교, 바뀌면 1회 reload
const _hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
let _selfHash=null;
async function checkVersion(){
  try{
    const r=await fetch('progress.html?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;                                // 일시적 404/500에 해시 오염 → 불필요 reload 방지
    const t=await r.text();
    const h=_hash(t);
    if(_selfHash===null){_selfHash=h;return;}      // 첫 호출=기준선 저장
    if(h!==_selfHash) location.reload();            // 코드 변경 감지 → 자동 새로고침
  }catch(e){}
}
load(); checkVersion(); setInterval(tick,5000); setInterval(checkVersion,5000);
</script>
