<style>
:root{--bg:#0e1620;--card:#18222e;--card2:#13202d;--line:#26323f;--txt:#e6edf3;--mut:#8a97a6;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:470px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:16px;font-weight:600}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(63,185,80,.16);color:var(--ok)}
.b-warn{background:rgba(210,153,34,.16);color:var(--warn)}
.b-bad{background:rgba(248,81,73,.16);color:var(--bad)}
.sec{font-size:11px;color:var(--mut);letter-spacing:.05em;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
.metrics{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 2px}
/* 채널이 4개가 되어 490px 팝업에서 눌리므로, 좁아지면 2x2로 감싸게 한다 */
.m{flex:1 1 96px;background:var(--card2);border-radius:9px;padding:8px 10px}
.m .l{font-size:11px;color:var(--mut)}
.m .v{font-size:18px;font-weight:600;margin-top:2px}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #243049;font-size:12.5px}
li:last-child{border-bottom:none}
li.on{opacity:.62}
li.on .lbl{text-decoration:line-through}
li svg{width:15px;height:15px;flex:none}
li.on svg{color:var(--ok)}
li.now svg{color:#7fc1ff}
li.wait svg{color:#4a586e}
.num{font-size:11px;color:#6b7a99;width:16px;text-align:right;flex:none}
.who{font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px;flex:none}
.who.ai{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.who.me{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.lbl{font-size:12.5px}
.star{color:#ff8e8e;font-weight:800;margin-left:2px}
.banner{display:none;margin-top:9px;background:#0c3a2c;border:1px solid #1f6b52;color:#06d6a0;border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12.5px}
.banner.show{display:block}
.upd{font-size:11px;color:var(--mut);text-align:right;margin-top:12px}
.agent{background:var(--card2);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.agent .ah{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.agent .st{font-size:10px;font-weight:700;padding:1px 7px;border-radius:7px;margin-left:auto}
.st.active{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.st.uncommitted{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.st.idle{background:#222c3a;color:#6b7a99;border:1px solid #2e3a4a}
.agent .role{font-size:11px;color:var(--mut);margin:3px 0 1px}
.agent .own{font-size:10.5px;color:#5a6b80}
.agent .act{font-size:11px;color:#aeb9c7;margin-top:4px;padding-left:7px;border-left:2px solid #2a3a4d;line-height:1.5}

.advice{background:#13202d;border:1px solid #2a3a4d;border-radius:9px}
.advice .ai{display:flex;gap:8px;padding:7px 11px;font-size:12px;line-height:1.5;border-bottom:1px dashed #243049}
.advice .ai:last-child{border-bottom:none}
.advice .ic{flex:none}
.prow{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px dashed #243049;font-size:11.5px}
.prow:last-child{border-bottom:none}
.pcd{color:#7fc1ff;font-weight:700;flex:none;width:46px}
.ptt{flex:1;color:#cdd6e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{background:#3a2f12;color:#ffd166;border-radius:5px;padding:0 5px;font-size:9.5px;flex:none}
.pact{color:#06d6a0;font-size:10px;flex:none;font-weight:700}
.qcard{display:flex;gap:9px;padding:8px;margin:6px 0;background:#141c2c;border:1px solid #243049;border-radius:9px}
.qth{width:78px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:#0d1420}
.qth.none{display:flex;align-items:center;justify-content:center;color:#54627a;font-size:9px;text-align:center;line-height:1.2;border:1px dashed #2a3752}
.qbody{flex:1;min-width:0}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qcode{color:#7fc1ff;font-weight:700;font-size:11.5px}
.qlane{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700}
.qlane.info{background:#12283a;color:#7fc1ff}
.qlane.pop{background:#2f2136;color:#e0a3ff}
.qtitle{color:#e6edf5;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qfacts{color:#8a95a6;font-size:10px;margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qmeta{margin-top:4px}
.qdraft{color:#6b7688;font-size:9.5px;margin-left:8px}
.qpv{background:#17324a;color:#7fc1ff;border:1px solid #2a4d6e;border-radius:6px;font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer}
.qpv:hover{background:#1d4463}
.qpv.none{background:none;border:none;color:#54627a;font-weight:400;cursor:default;padding:3px 0}
#qpv-ov{display:none;position:fixed;inset:0;background:rgba(6,10,18,.82);z-index:999;align-items:center;justify-content:center;padding:18px}
#qpv-ov.show{display:flex}
.qpv-box{width:100%;max-width:760px;height:88vh;display:flex;flex-direction:column;background:#0f1626;border:1px solid #2a3752;border-radius:12px;overflow:hidden}
.qpv-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #243049;font-size:12.5px;font-weight:700;color:#7fc1ff}
.qpv-hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpv-x{background:#243049;color:#cdd6e0;border:none;border-radius:6px;font-size:11px;padding:5px 11px;cursor:pointer;flex:none}
.qpv-x:hover{background:#324158}
.qpv-fr,#qpv-fr{flex:1;width:100%;border:0;background:#fff}
.qpv-ft{padding:8px 14px;border-top:1px solid #243049;font-size:10px;color:#8a95a6;text-align:center}
.ch{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 4px;flex:none;margin-left:3px}
.ch.on{background:#0c3a2c;color:#06d6a0}
.ch.off{background:#3a1216;color:#f0707a}

ec10\">10. 자주 묻는 질문<\/a><a href=\"#sec11\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec3\">👉 30일 체류기간 계산법 바로 보기<\/a>\n\n<h2 id=\"sec1\">1. 지금 상태 한 장 요약 (2026년 12월 31일까지)<\/h2>\n<p>주한중국대사관이 <b>2025년 11월 6일<\/b> 공지한 내용이 현재 적용되는 기준입니다. 한국을 포함한 여러 나라에 대해 <b>비자면제 조치를 2026년 12월 31일까지 연장<\/b>한다는 발표였습니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>내용<\/th><\/tr>\n<tr><td><b>대상 여권<\/b><\/td><td><b>일반여권<\/b> 소지자 (관용·외교여권은 별도 규정)<\/td><\/tr>\n<tr><td><b>체류 한도<\/b><\/td><td><b>최장 30일<\/b> (연속 30 자연일)<\/td><\/tr>\n<tr><td><b>적용 기한<\/b><\/td><td><b>2026년 12월 31일까지<\/b> 입국분<\/td><\/tr>\n<tr><td><b>허용 목적<\/b><\/td><td>비즈니스(상용) · 관광 · 친지 방문 · 교류 방문 · <b>경유<\/b><\/td><\/tr>\n<tr><td><b>사전 신청<\/b><\/td><td><b>없음<\/b> — 미국 ESTA·일본 비지트재팬웹 같은 사전 등록 절차가 없습니다<\/td><\/tr>\n<tr><td><b>입국 횟수<\/b><\/td><td>횟수 제한·재입국 간격 제한 <b>없음<\/b><\/td><\/tr>\n<tr><td><b>출발지<\/b><\/td><td>제한 없음 — 제3국에서 출발해도 무방<\/td><\/tr>\n<\/table>\n<p>여기서 <b>한국 여행자에게 특히 중요한 두 가지<\/b>가 있습니다. 첫째, <b>따로 신청할 것이 없습니다.<\/b> 미국 ESTA처럼 온라인으로 미리 승인받는 절차가 없어서, <b>여권만 들고 공항에 가면 됩니다.<\/b> 둘째, 그래서 이 글의 초점은 \"어떻게 신청하나\"가 아니라 <b>\"내가 자격에 해당하나, 그리고 현지에서 지켜야 할 것이 무엇인가\"<\/b>입니다.<\/p>\n<div class=\"tip\"><b>💡 재입국 간격 제한이 없다는 뜻<\/b><p style=\"margin:8px 0 0\">예를 들어 <b>상하이에 25일 머물다 한국에 잠깐 돌아왔다가 다시 들어가도<\/b>, 새 입국에 대해 다시 30일이 주어집니다. 중국 대사관 안내는 <b>입국 횟수와 두 입국 사이 간격에 제한을 두지 않는다<\/b>고 밝히고 있습니다. 다만 <b>짧은 출국·재입국을 반복해 사실상 장기 체류하는 형태<\/b>는 입국심사에서 목적을 의심받을 수 있으니, 실제 사업·방문 사유가 있는 경우로 한정하는 편이 안전합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 무비자로 되는 목적 · 안 되는 목적<\/h2>\n<p>무비자는 <b>목적이 맞을 때만<\/b> 유효합니다. 목적이 어긋나면 여권이 멀쩡해도 입국이 거절될 수 있습니다.<\/p>\n<table>\n<tr><th>목적<\/th><th>무비자<\/th><th>비고<\/th><\/tr>\n<tr><td>관광 · 여행<\/td><td><b>○<\/b><\/td><td>가장 일반적인 경우<\/td><\/tr>\n<tr><td>상담·계약·전시회 참관 등 <b>상용<\/b><\/td><td><b>○<\/b><\/td><td>초청장 지참 권장<\/td><\/tr>\n<tr><td>친지·지인 방문<\/td><td><b>○<\/b><\/td><td>주소·연락처 확인 요구 가능<\/td><\/tr>\n<tr><td>교류 방문(학술·문화 교류 등)<\/td><td><b>○<\/b><\/td><td>보수를 받는 활동은 제외<\/td><\/tr>\n<tr><td>제3국행 <b>경유<\/b><\/td><td><b>○<\/b><\/td><td>30일 한도 안에서 체류도 가능<\/td><\/tr>\n<tr><td><b>취업 · 근로<\/b><\/td><td><b>×<\/b><\/td><td>취업비자 필요<\/td><\/tr>\n<tr><td><b>유학 · 어학연수<\/b><\/td><td><b>×<\/b><\/td><td>학생비자 필요<\/td><\/tr>\n<tr><td><b>취재 · 보도<\/b><\/td><td><b>×<\/b><\/td><td>기자비자 필요<\/td><\/tr>\n<tr><td><b>공연 등 사전 허가가 필요한 활동<\/b><\/td><td><b>×<\/b><\/td><td>해당 비자 필요<\/td><\/tr>\n<\/table>\n<p>정리하면 <b>\"돈을 벌거나, 자격을 취득하거나, 사전 허가가 필요한 활동\"은 무비자 대상이 아닙니다.<\/b> 중국 측 안내는 <b>입국 사유가 비자면제 정책이 정한 사유와 맞지 않으면 입국이 허용되지 않는다<\/b>고 명시하고 있습니다.<\/p>\n<div class=\"warn\"><b>⚠️ \"관광으로 들어가서 잠깐 일하면 되지 않나\"<\/b><p style=\"margin:8px 0 0\">안 됩니다. 무비자로 들어와 <b>신고된 목적 밖의 활동<\/b>을 하는 것은 체류 목적 위반입니다. 특히 <b>현지에서 보수를 받는 일<\/b>, <b>영리 목적의 촬영·방송<\/b>은 적발 시 벌금·구류·강제출국 대상이 될 수 있습니다. 짧은 기간이라도 근로에 해당한다면 <b>출발 전에 해당 비자를 받아야<\/b> 합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 30일은 언제부터 세나 — 기산 계산<\/h2>\n<p>가장 많이 틀리는 부분입니다. 중국의 체류기간은 <b>입국한 날이 아니라 입국 다음 날부터<\/b> 셉니다. 중국 측 공식 문답은 <b>\"체류기간은 입국 다음 날부터 기산하며 연속 30 자연일 체류할 수 있다\"<\/b>고 설명합니다.<\/p>\n<div class=\"tip\"><b>🔢 계산 공식<\/b><p style=\"margin:8px 0 0\"><b>체류 마지막 날 = 입국일 + 30일<\/b><br>입국일 자체는 세지 않고, <b>그 다음 날이 1일차<\/b>가 됩니다. 그래서 결과적으로 <b>달력상 입국일에 30을 더한 날짜<\/b>가 머물 수 있는 마지막 날이 됩니다.<\/p><\/div>\n<table>\n<tr><th>입국일<\/th><th>1일차<\/th><th>30일차(마지막 날)<\/th><th>늦어도 출국해야 하는 날<\/th><\/tr>\n<tr><td>9월 10일<\/td><td>9월 11일<\/td><td><b>10월 10일<\/b><\/td><td>10월 10일<\/td><\/tr>\n<tr><td>10월 1일<\/td><td>10월 2일<\/td><td><b>10월 31일<\/b><\/td><td>10월 31일<\/td><\/tr>\n<tr><td>12월 20일<\/td><td>12월 21일<\/td><td><b>1월 19일<\/b><\/td><td>1월 19일<\/td><\/tr>\n<\/table>\n<p>흔한 실수는 <b>입국일을 1일차로 세는 것<\/b>입니다. 그렇게 계산하면 실제보다 <b>하루 일찍<\/b> 나가게 되니 손해는 없지만, 반대로 <b>\"30박 31일이니 괜찮겠지\"<\/b>라고 넉넉히 잡으면 <b>초과체류<\/b>가 됩니다. 헷갈릴 때는 <b>여권에 찍힌 입국 도장의 날짜에 30을 더한 날<\/b>을 마지막 날로 보면 안전합니다.<\/p>\n<div class=\"warn\"><b>⚠️ 항공권을 먼저 끊고 날짜를 나중에 세지 마세요<\/b><p style=\"margin:8px 0 0\">장기 체류를 계획한다면 <b>귀국 항공권 날짜부터 확인<\/b>하세요. 특히 <b>왕복 한 달짜리 티켓<\/b>은 아슬아슬한 경우가 많습니다. 예를 들어 <b>9월 10일 입국 → 10월 11일 출국<\/b>은 하루 초과입니다. 실제 계산은 <b>도착 시각이 아니라 입국 도장의 날짜<\/b> 기준이라, <b>밤 늦게 도착해 자정을 넘겨 입국심사를 받았다면 도장 날짜가 하루 밀릴 수 있다<\/b>는 점도 기억해 두세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. '2026년 12월 31일'의 함정 — 입국 기준입니다<\/h2>\n<p>이 조치는 <b>2026년 12월 31일까지<\/b>입니다. 그런데 이 날짜는 <b>중국에 머물 수 있는 마지막 날이 아니라 '무비자로 입국할 수 있는 마지막 날'<\/b>입니다. 연말·연시 여행을 계획한다면 이 차이가 결정적입니다.<\/p>\n<table>\n<tr><th>일정<\/th><th>비자<\/th><th>이유<\/th><\/tr>\n<tr><td>12월 20일 입국 → 1월 5일 출국<\/td><td><b>필요 없음<\/b><\/td><td>입국일이 기한 안이라 무비자 적용, 체류는 30일 한도 안<\/td><\/tr>\n<tr><td>12월 31일 입국 → 1월 20일 출국<\/td><td><b>필요 없음<\/b><\/td><td>기한 마지막 날 입국 — 조치 적용<\/td><\/tr>\n<tr><td><b>1월 1일 입국<\/b><\/td><td><b>비자 필요<\/b><\/td><td>연장 여부가 발표되기 전이라면 무비자 대상 아님<\/td><\/tr>\n<\/table>\n<p>즉 <b>연말에 들어가서 해를 넘겨 나오는 일정은 문제가 없지만, 새해에 들어가는 일정은 이야기가 완전히 달라집니다.<\/b> 중국은 이 조치를 <b>2024년 11월 시행 이후 한 차례 연장<\/b>해 왔습니다. 다만 <b>다음 연장이 있을지, 있다면 언제 발표될지는 아무도 단정할 수 없습니다.<\/b><\/p>\n<div class=\"tip\"><b>💡 2027년 1월 이후 일정을 잡는다면<\/b><p style=\"margin:8px 0 0\">지금 시점에서 <b>\"어차피 또 연장되겠지\"라고 전제하고 항공권을 끊는 것은 위험<\/b>합니다. 현실적인 방법은 두 가지입니다. ① <b>취소·변경이 자유로운 항공권<\/b>으로 예약하고 발표를 기다린다. ② <b>비자를 받는 일정으로 처음부터 계획<\/b>한다. 중국 비자는 신청부터 발급까지 시간이 걸리므로, <b>연장 발표를 기다리다 비자 신청 시기를 놓치는 것이 가장 나쁜 시나리오<\/b>입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 무비자 vs 240시간 환승 무비자 vs 관광비자 (판단표)<\/h2>\n<p>중국 입국 방법은 지금 세 가지가 함께 존재합니다. 인터넷에는 <b>240시간(10일) 환승 무비자<\/b> 이야기가 많은데, <b>한국 여권 소지자라면 대부분 그쪽을 쓸 이유가 없습니다.<\/b> 조건을 나란히 놓고 보면 명확합니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>30일 무비자<\/th><th>240시간 환승 무비자<\/th><th>관광비자(L)<\/th><\/tr>\n<tr><td><b>체류 한도<\/b><\/td><td><b>30일<\/b><\/td><td>240시간(10일)<\/td><td>비자에 표시된 기간<\/td><\/tr>\n<tr><td><b>사전 절차<\/b><\/td><td><b>없음<\/b><\/td><td>없음<\/td><td><b>신청·수수료·심사<\/b><\/td><\/tr>\n<tr><td><b>이동 범위<\/b><\/td><td><b>중국 전역<\/b><\/td><td><b>지정 지역 안으로 제한<\/b><\/td><td>중국 전역<\/td><\/tr>\n<tr><td><b>조건<\/b><\/td><td>목적이 맞으면 됨<\/td><td><b>제3국행 연결 항공권 필수<\/b><\/td><td>서류 심사 통과<\/td><\/tr>\n<tr><td><b>한국인에게<\/b><\/td><td><b>기본 선택지<\/b><\/td><td>실익 거의 없음<\/td><td>30일 초과·취업·유학 시<\/td><\/tr>\n<\/table>\n<p>240시간 환승 무비자는 <b>\"중국을 거쳐 제3국으로 가는 사람\"<\/b>을 위한 제도라 <b>제3국행 연결 항공권이 반드시 있어야<\/b> 하고, <b>머물 수 있는 지역도 지정된 범위로 제한<\/b>됩니다. 반면 <b>30일 무비자는 조건이 훨씬 헐겁고 기간도 세 배<\/b>입니다. 한국↔중국 왕복 여행이라면 <b>고민할 필요 없이 30일 무비자<\/b>입니다.<\/p>\n<div class=\"tip\"><b>💡 비자를 받아야 하는 경우는 이렇게 갈립니다<\/b><p style=\"margin:8px 0 0\">① <b>30일을 넘겨 머물 계획<\/b> ② <b>취업·유학·취재 등 무비자 제외 목적<\/b> ③ <b>일반여권이 아닌 여권<\/b> ④ <b>과거 체류 위반 이력 등으로 무비자 입국이 불안한 경우<\/b>. 이 넷 중 하나라도 해당하면 <b>출발 전에 비자를 받는 쪽<\/b>이 맞습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 입국심사에서 막히는 5가지<\/h2>\n<p>무비자는 <b>\"입국이 보장된다\"는 뜻이 아닙니다.<\/b> 최종 판단은 현장 입국심사관이 합니다. 실제로 문제가 되는 경우는 대체로 다음 다섯 가지입니다.<\/p>\n<ol>\n<li><b>입국 목적을 설명하지 못하는 경우<\/b> — 어디서 며칠 묵고 무엇을 하는지 답이 안 나오면 심사가 길어집니다. <b>호텔 예약 확인서와 귀국 항공권<\/b>을 휴대폰이 아닌 <b>인쇄물로도<\/b> 준비해 두면 편합니다.<\/li>\n<li><b>목적이 무비자 대상과 다른 경우<\/b> — 취업·유학·취재 정황이 보이면 거절 사유입니다. 노트북·장비를 대량으로 소지하거나 <b>업무용 계약서류가 과하게 많은 경우<\/b>도 설명이 필요해질 수 있습니다.<\/li>\n<li><b>귀국편이 없는 편도 항공권<\/b> — 출국 계획이 확인되지 않으면 체류 의사를 의심받습니다. <b>제3국행이라도 나가는 표<\/b>가 있어야 설명이 됩니다.<\/li>\n<li><b>여권 유효기간·상태 문제<\/b> — 잔여 유효기간이 짧거나 <b>훼손된 여권<\/b>은 그 자체로 거절될 수 있습니다. 출발 전에 <b>유효기간 6개월 이상<\/b>인지 확인하세요.<\/li>\n<li><b>과거 체류 위반 이력<\/b> — 이전 방문에서 <b>초과체류·목적 위반 기록<\/b>이 있으면 무비자 입국이 막힐 수 있습니다. 중국 측 안내도 <b>\"법에 따라 입국이 허용되지 않는 사유가 있는 경우\"<\/b>를 거절 사유로 두고 있습니다.<\/li>\n<\/ol>\n<div class=\"tip\"><b>💡 입국카드는 미리 써 두면 줄이 줄어듭니다<\/b><p style=\"margin:8px 0 0\">중국은 외국인에게 <b>입경카드<\/b> 작성을 요구합니다. 기내에서 나눠주는 경우가 많으니 <b>착륙 전에 숙소 이름·주소를 적어 두세요<\/b>. 이때 필요한 것이 <b>호텔의 중국어 주소<\/b>입니다. 예약 확인서에 영문만 있으면 <b>지도 앱에서 중국어 주소를 캡처<\/b>해 가면 심사·택시 이용 모두 수월합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 입국하면 24시간 안에 — 주숙등기<\/h2>\n<p>한국 여행자가 가장 모르고 지나가는 의무입니다. 중국에 머무는 외국인은 <b>숙소를 관할 공안기관(파출소)에 신고<\/b>해야 합니다. 이것을 <b>주숙등기(住宿登记)<\/b>라고 합니다.<\/p>\n<table>\n<tr><th>묵는 곳<\/th><th>별도 신고<\/th><th>설명<\/th><\/tr>\n<tr><td><b>호텔 등 등록된 숙박업소<\/b><\/td><td><b>불필요<\/b><\/td><td>체크인 때 호텔이 대신 등록<\/td><\/tr>\n<tr><td><b>친척·지인 집<\/b><\/td><td><b>필요<\/b><\/td><td>입국(또는 이동) 후 <b>24시간 이내<\/b><\/td><\/tr>\n<tr><td><b>민박·임대주택 등<\/b><\/td><td><b>필요<\/b><\/td><td>농촌 지역은 <b>72시간 이내<\/b><\/td><\/tr>\n<\/table>\n<p>즉 <b>호텔에만 묵는 일반 관광객은 신경 쓸 일이 없습니다.<\/b> 문제는 <b>친척 집이나 지인 집, 개인이 빌려주는 숙소<\/b>에 묵는 경우입니다. 이때는 <b>여권과 숙소 주인의 신분증·주택 관련 서류를 들고 관할 파출소<\/b>에 가야 합니다.<\/p>\n<div class=\"warn\"><b>⚠️ 안 하면 최대 2,000위안(약 40만 원 안팎)<\/b><p style=\"margin:8px 0 0\">주숙등기를 하지 않은 사실이 확인되면 <b>경고 또는 최대 2,000위안의 벌금<\/b>이 부과될 수 있습니다. 한국 공관 안내에서도 반복적으로 당부하는 항목입니다. <b>중간에 숙소를 옮겼을 때도 새로 등기해야 한다<\/b>는 점을 놓치기 쉬우니, <b>친척 집 → 호텔 → 다시 친척 집<\/b>처럼 옮겨 다니는 일정이라면 특히 유의하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 30일을 넘기면 — 연장과 초과체류 벌금<\/h2>\n<p>사정이 생겨 30일을 넘겨야 한다면 <b>기한이 끝나기 전에<\/b> 움직여야 합니다. 중국 측 안내는 두 갈래를 제시합니다.<\/p>\n<ul>\n<li><b>출발 전에 이미 30일 초과가 예상된다면<\/b> — 한국에서 <b>해당 목적에 맞는 비자를 미리 받아<\/b> 들어갑니다.<\/li>\n<li><b>입국 후 정당한 사유로 더 머물러야 한다면<\/b> — 체류기간이 끝나기 전에 <b>현지 공안기관 출입경관리부서에 체류증(停留证件)을 신청<\/b>합니다. 한국 공관 안내에 따르면 <b>기한 만료 전 여유를 두고<\/b> 신청해야 합니다.<\/li>\n<\/ul>\n<p>기한을 넘겨 버리면 <b>돈으로 끝나지 않을 수 있습니다.<\/b> 중국 출입경관리법은 불법 체류에 대해 <b>경고<\/b>를, 정도가 무거우면 <b>초과 1일당 500위안, 총액 1만 위안 이하의 벌금 또는 5~15일 구류<\/b>를 규정하고 있습니다.<\/p>\n<table>\n<tr><th>초과 일수<\/th><th>계산<\/th><th>벌금(상한 규정 적용)<\/th><\/tr>\n<tr><td>3일<\/td><td>500위안 × 3<\/td><td><b>1,500위안<\/b> (약 30만 원 안팎)<\/td><\/tr>\n<tr><td>10일<\/td><td>500위안 × 10<\/td><td><b>5,000위안<\/b><\/td><\/tr>\n<tr><td>20일<\/td><td>500위안 × 20 = 10,000위안<\/td><td><b>10,000위안<\/b> (상한)<\/td><\/tr>\n<tr><td>30일<\/td><td>500위안 × 30 = 15,000위안<\/td><td><b>10,000위안<\/b> (상한 적용)<\/td><\/tr>\n<\/table>\n<p>표에서 보듯 <b>20일을 넘기면 벌금은 상한에 걸려 더 오르지 않지만<\/b>, 대신 <b>구류나 강제출국, 향후 입국 제한<\/b> 같은 더 무거운 결과로 넘어갑니다. <b>\"벌금만 내면 된다\"고 생각할 문제가 아닙니다.<\/b> 실제 적용 수위는 사안에 따라 다르므로, <b>기한 전 연장<\/b>이 유일하게 안전한 길입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 홍콩·마카오·티베트는 별개입니다<\/h2>\n<p>지도상 같은 중국이라도 <b>출입경 제도는 따로 돌아갑니다.<\/b> 이 부분을 뭉뚱그려 이해하면 일정이 꼬입니다.<\/p>\n<ul>\n<li><b>홍콩<\/b> — 한국과 사증면제협정이 있어 <b>관광 목적 최대 90일(3개월)<\/b> 무비자 체류가 가능합니다. 이번 중국 본토 조치와는 <b>별개의 제도<\/b>입니다.<\/li>\n<li><b>마카오<\/b> — 관광 목적 무비자로 <b>1회 최고 90일, 연간 120일<\/b>까지 체류할 수 있습니다(주홍콩 대한민국 총영사관 안내 기준).<\/li>\n<li><b>본토 ↔ 홍콩·마카오 이동<\/b> — 출입경 절차를 다시 밟습니다. 홍콩에 다녀온 뒤 <b>본토로 재입국하면 30일이 새로 시작<\/b>됩니다(재입국 간격 제한 없음).<\/li>\n<li><b>티베트(시짱)<\/b> — 비자·무비자와 <b>무관하게<\/b> 외국인은 별도의 여행 허가가 필요하고, <b>지정 여행사를 통한 일정<\/b>으로만 방문이 가능한 것으로 안내됩니다. 개인 자유여행 계획을 세우기 전에 <b>여행사·현지 규정을 반드시 먼저 확인<\/b>하세요.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ \"홍콩 경유니까 무비자가 이어진다\"는 오해<\/b><p style=\"margin:8px 0 0\">본토에서 홍콩으로 나가는 순간 <b>본토 체류는 종료<\/b>됩니다. 다시 들어오면 <b>새 30일<\/b>이 시작되므로 유리한 방향이지만, 반대로 <b>\"홍콩에 다녀왔으니 원래 30일이 그대로 남아 있다\"는 계산은 틀립니다.<\/b> 남은 일수를 이어 쓰는 개념이 아니라 <b>매 입국마다 새로 30일<\/b>이라고 이해하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">10. 자주 묻는 질문<\/h2>\n<h3>Q. 정말 아무것도 신청 안 해도 되나요?<\/h3>\n<p>네. <b>미국 ESTA나 일본 비지트재팬웹 같은 사전 등록 절차가 없습니다.<\/b> 유효한 일반여권과 목적에 맞는 여행이면 <b>공항에서 바로 입국심사<\/b>를 받습니다. 다만 <b>호텔 예약·귀국 항공권 등 사유를 뒷받침할 자료<\/b>는 지참을 권합니다.<\/p>\n<h3>Q. 왕복 항공권이 꼭 있어야 하나요?<\/h3>\n<p>규정상 항공권 제시가 절대 조건으로 명시된 것은 아니지만, <b>실무상 출국 계획을 확인받는 경우가 많습니다.<\/b> 편도로 들어가면 설명 부담이 커지므로 <b>나가는 표<\/b>는 확보해 두는 편이 안전합니다.<\/p>\n<h3>Q. 30일을 다 채우고 바로 다시 들어가도 되나요?<\/h3>\n<p>중국 측 안내는 <b>입국 횟수와 간격에 제한을 두지 않습니다.<\/b> 다만 <b>반복 입출국으로 사실상 장기 거주하는 형태<\/b>는 목적 위반을 의심받을 수 있어, 실제 사유가 있는 경우로 한정하는 것이 좋습니다.<\/p>\n<h3>Q. 아이 여권도 같은 조건인가요?<\/h3>\n<p>일반여권이라면 <b>연령과 관계없이 같은 조치가 적용<\/b>됩니다. 다만 <b>미성년자 단독 여행이나 부모 한쪽만 동반<\/b>하는 경우 가족관계를 확인받을 수 있으니 <b>가족관계증명서(영문)<\/b> 같은 서류를 준비해 두면 수월합니다.<\/p>\n<h3>Q. 무비자로 들어가면 여권에 무엇이 찍히나요?<\/h3>\n<p>입국심사 통과 시 <b>여권에 입국 도장<\/b>이 찍힙니다. <b>이 도장의 날짜가 체류기간 계산의 기준<\/b>이 되므로, 입국 직후 <b>도장 날짜를 한 번 확인<\/b>해 두세요. 날짜가 예상과 다르면 그 자리에서 확인하는 편이 낫습니다.<\/p>\n<h3>Q. 중국에서 카드·현금 결제는 어떻게 하나요?<\/h3>\n<p>모바일 결제 비중이 매우 높아 <b>현금만 준비하면 불편할 수 있습니다.<\/b> 여행 전 <b>결제 앱 설정과 해외 결제 가능한 카드<\/b>를 미리 확인하세요. 환전·해외결제 수수료 비교는 아래 <b>함께 보면 좋은 글<\/b>에서 다룹니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec11\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 외교부 · 주한중국대사관 (공식)<\/b><a href=\"https://www.0404.go.kr/ntnSafetyInfo/189/detail\" target=\"_blank\" rel=\"nofollow\">▸ 외교부 해외안전여행 — 중국 국가·지역 정보(출입국·안전)<\/a><a href=\"https://0404.go.kr/bbs/contsPst/MST0000000000113/13/detail\" target=\"_blank\" rel=\"nofollow\">▸ 외교부 해외안전여행 — 영사협정·사증면제 안내<\/a><a href=\"https://kr.china-embassy.gov.cn/kor/lsfw/lszj/202511/t20251106_11748002.htm\" target=\"_blank\" rel=\"nofollow\">▸ 주한중국대사관 — 사증 면제 정책 연장에 관한 공지<\/a><a href=\"https://www.mofa.go.kr/cn-xian-ko/brd/m_738/view.do?seq=1346727\" target=\"_blank\" rel=\"nofollow\">▸ 주시안 대한민국 총영사관 — 비자면제 방침 연장 및 유의사항<\/a><a href=\"https://overseas.mofa.go.kr/hk-ko/brd/m_1521/view.do?seq=1039798\" target=\"_blank\" rel=\"nofollow\">▸ 주홍콩 대한민국 총영사관 — 마카오 무비자 체류 시 유의사항<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">핵심은 넷입니다. <b>①<\/b> 한국 일반여권이면 <b>사전 신청 없이 최장 30일<\/b> 무비자 입국이 되고, <b>②<\/b> 이 조치는 <b>2026년 12월 31일 '입국'분까지<\/b>라 연말에 들어가 해를 넘겨 나오는 일정은 괜찮지만 <b>새해에 들어가는 일정은 별도 확인<\/b>이 필요합니다. <b>③<\/b> 30일은 <b>입국 다음 날부터<\/b> 세므로 <b>입국일 + 30일<\/b>이 마지막 날이고, <b>④<\/b> 호텔이 아닌 곳에 묵으면 <b>24시간(농촌 72시간) 안에 주숙등기<\/b>를 해야 합니다. 출발 전에 <b>여권 유효기간 6개월<\/b>과 <b>귀국 항공권 날짜<\/b> 두 가지만 확인해도 대부분의 사고는 막을 수 있습니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 비자면제 조치는 <b>중국 정부의 결정에 따라 변경·종료될 수 있습니다.<\/b> 특히 <b>2027년 1월 이후 일정<\/b>은 출발 전 반드시 주한중국대사관 공지와 외교부 해외안전여행에서 최신 상태를 재확인하세요.<br>본문의 벌금 표는 <b>중국 출입경관리법의 규정 상한(1일 500위안·총액 1만 위안 이하)<\/b>을 적용해 계산한 것이며, <b>실제 처분 수위는 사안에 따라 달라집니다.<\/b> 원화 환산액은 이해를 돕기 위한 어림값입니다.<br>출처: 주한중국대사관 「사증 면제 정책 연장에 관한 공지」(2025년 11월 6일), 중국 측 단방면 비자면제 정책 문답(체류기간 기산·입국 횟수·소지 권장 서류), 외교부 해외안전여행 국가·지역 정보 및 영사협정·사증면제 안내, 주시안·주홍콩 대한민국 공관 공지, 중국 출입경관리법(체류·주숙등기·초과체류 규정), 중국 국가이민관리국 환승 무비자 시행 내용. 영사콜센터 +82-2-3210-0404<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_766.html\">▸ 여권 발급 방법 준비물 기간 수수료 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/vs-vs.html\">▸ 로밍 vs 유심 vs 이심 해외여행 데이터 비교 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_452.html\">▸ 여행자보험 가입 방법 보장 비교 총정리<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 체류기간·허용 목적·기한은 <b>주한중국대사관 공지와 외교부 해외안전여행·재외공관 안내를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 비자 정책은 예고 없이 바뀔 수 있으니 출발 전 공식 공지를 한 번 더 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 중국은 지금 한국 일반여권이면 비자 없이 최장 30일 머물 수 있습니다. 미국 ESTA나 일본 비지트재팬웹 같은 사전 등록도 없어서 여권만 들고 공항에 가면 됩니다. 단 이 조치는 2026년 12월 31일까지로 기한이 정해져 있습니다.\n2. 30일은 입국한 날이 아니라 입국 다음 날부터 셉니다. 그래서 마지막 날 = 입국일 + 30일이에요. 9월 10일 입국이면 10월 10일까지입니다. \"30박 31일이니 괜찮겠지\"로 잡으면 초과체류가 됩니다. 초과하면 1일 500위안, 최대 1만 위안 벌금에 구류까지 갈 수 있습니다.\n3. 놓치기 쉬운 게 주숙등기입니다. 호텔은 체크인 때 자동으로 처리되지만, 친척 집이나 민박에 묵으면 24시간(농촌 72시간) 안에 관할 파출소에 신고해야 하고 안 하면 최대 2,000위안 벌금입니다. 그리고 2026년 12월 31일은 '입국' 기준이라, 12월에 들어가 1월에 나오는 건 괜찮지만 1월 1일에 들어가는 일정은 비자가 필요합니다.\n"},{"code":"F1-10","title":"비지트재팬웹 등록 방법 일본 입국심사 세관신고 QR코드 총정리 (2026 Visit Japan Web)","lane":"pop","thumb":"128_visitjapanweb.png","draft":"비지트재팬웹_글_HTML.txt","facts":"일본 디지털청 운영 무료 웹서비스(앱 설치 불요, 한국어 포함 9개 언어). 입국심사·세관신고 QR 사전등록. 의무 아님(권장) - 종이 신고서도 가능하나 대기시간에서 차이. 초안 18,333자. 초안 머리말의 코드후보 F1-08은 이미 보조배터리 글이 사용중이라 F1-10으로 배정함. 발행 전 일본 입국 규정 최신 여부 재확인 필요.","added":"2026-07-27","thumb_data":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCACIAQQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2Jyg p:24px}\n.lsg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#f4f1fd;border:1px solid #ded4f7;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#6544cc;margin-bottom:8px}\n.lsg .rel a{display:block;color:#5a3cc0;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#9a92aa;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>여름휴가로 일본행 비행기를 끊고 나면 꼭 듣게 되는 말이 <b>\"비지트재팬웹(Visit Japan Web) 미리 해두세요\"<\/b>입니다. 그런데 막상 검색해 보면 <b>\"필수다 / 안 해도 된다\"<\/b>가 뒤섞여 있고, 어떤 글은 <b>QR코드가 2개<\/b>라고 하고 어떤 글은 <b>1개<\/b>라고 합니다. 심지어 <b>수수료를 받는 대행 사이트<\/b>까지 검색 상단에 뜹니다. 이 글에서는 일본 <b>디지털청 공식 안내와 세관(관세청) 공식 페이지<\/b>를 근거로, <b>등록이 정말 필수인지, 절차는 어떻게 되는지, 공항에서 어디서 QR을 보여주는지<\/b>, 그리고 <b>40~60대 여행자가 가장 많이 걸리는 함정<\/b>까지 한 번에 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 결론부터 — 의무는 아니지만, 안 하면 손해인 이유<\/a><a href=\"#sec2\">2. 비지트재팬웹이 대신해 주는 것 (그리고 안 해주는 것)<\/a><a href=\"#sec3\">3. 등록 절차 5단계 (STEP 0~4)<\/a><a href=\"#sec4\">4. QR코드는 딱 1개 — 공항에서 언제·어디서 보여주나<\/a><a href=\"#sec5\">5. 전자신고 게이트 되는 공항 7곳 + 이용 조건<\/a><a href=\"#sec6\">6. 가장 많이 걸리는 함정 5가지<\/a><a href=\"#sec7\">7. 세관 면세범위 — 20만 엔 계산 예시 3가지<\/a><a href=\"#sec8\">8. 면세쇼핑(Tax-free)은 2026년 11월부터 방식이 바뀝니다<\/a><a href=\"#sec9\">9. 자주 묻는 질문<\/a><a href=\"#sec10\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec6\">👉 공항에서 가장 많이 막히는 함정 5가지 먼저 보기<\/a>\n\n<h2 id=\"sec1\">1. 결론부터 — 의무는 아니지만, 안 하면 손해인 이유<\/h2>\n<p>먼저 가장 헷갈리는 부분을 정리하겠습니다. <b>비지트재팬웹 등록은 법으로 강제된 의무가 아닙니다.<\/b> 일본 세관은 지금도 <b>\"휴대품·별송품 신고서\"<\/b> 종이 양식을 전국 공항·항만에 비치해 두고 있고, <b>한국어 양식(C-5360-C)<\/b>까지 공식 홈페이지에서 내려받아 인쇄해 갈 수 있게 해 두었습니다. 즉 등록을 못 했다고 해서 <b>입국을 못 하거나 벌금을 무는 일은 없습니다.<\/b><\/p>\n<p>다만 일본 세관은 공식 페이지에서 <b>\"원활한 세관 수속을 위해 Visit Japan Web을 이용한 전자신고를 권장한다\"<\/b>고 명시하고 있습니다. 실제 차이는 <b>줄 서는 시간<\/b>에서 갈립니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>비지트재팬웹(QR) 등록<\/th><th>종이 신고서<\/th><\/tr>\n<tr><td><b>의무 여부<\/b><\/td><td>권장(의무 아님)<\/td><td>가능(양식 비치·인쇄)<\/td><\/tr>\n<tr><td><b>작성 시점<\/b><\/td><td>출국 전 집에서 미리<\/td><td>기내 또는 공항 도착 후<\/td><\/tr>\n<tr><td><b>세관 통과<\/b><\/td><td>전자신고 단말기 → <b>전자신고 게이트<\/b> 통과<\/td><td>유인 검사대에서 대면 제출<\/td><\/tr>\n<tr><td><b>가족 처리<\/b><\/td><td>동반가족 등록 후 <b>1인씩<\/b> 수속<\/td><td>같은 세대는 대표 1장 작성 가능<\/td><\/tr>\n<tr><td><b>유리한 사람<\/b><\/td><td>스마트폰이 익숙하고 짐 찾고 빨리 나가고 싶은 분<\/td><td>스마트폰 조작이 불편한 분, 급히 결정된 여행<\/td><\/tr>\n<\/table>\n<p>정리하면 <b>\"미리 해두면 도착 후 줄이 확 짧아지는 선택지\"<\/b>이지, <b>\"안 하면 큰일 나는 필수 절차\"<\/b>는 아닙니다. 스마트폰이 어려운 부모님과 함께라면 <b>종이 신고서로 가도 전혀 문제없다<\/b>는 점을 알고 가시면 마음이 편합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 비지트재팬웹이 대신해 주는 것 (그리고 안 해주는 것)<\/h2>\n<p>비지트재팬웹은 일본 <b>디지털청<\/b>이 운영하는 <b>무료 웹서비스<\/b>입니다. 앱을 따로 설치할 필요가 없고, 웹브라우저에서 바로 씁니다. 한국어를 포함해 <b>9개 언어<\/b>를 지원합니다.<\/p>\n<h3>✅ 해주는 것<\/h3>\n<ul>\n<li><b>입국심사(외국인 입국기록)<\/b> — 예전에 기내에서 손으로 쓰던 입국카드를 대신합니다.<\/li>\n<li><b>세관신고(휴대품·별송품 신고)<\/b> — 노란색 종이 신고서를 대신합니다.<\/li>\n<li><b>면세 구매(Tax-free) QR<\/b> — 일본 체류 중 면세점에서 쓰는 별도 코드입니다.<\/li>\n<\/ul>\n<h3>❌ 해주지 않는 것 — 이건 오해가 많습니다<\/h3>\n<ul>\n<li><b>비자(VISA)를 대신하지 않습니다.<\/b> 비자가 필요한 경우 별도 신청이며, 비지트재팬웹은 비자 정보를 '가져와 쓰는' 기능만 있습니다.<\/li>\n<li><b>미국 ESTA 같은 '입국 허가'가 아닙니다.<\/b> 사전 심사·승인 절차가 아니라 <b>신고서를 미리 채워 두는 것<\/b>에 가깝습니다. 그래서 '승인 대기'나 '거부' 같은 개념이 없습니다.<\/li>\n<li><b>항공권·숙소 예약과 무관합니다.<\/b> 등록했다고 예약이 확인되는 것도, 안 했다고 탑승이 막히는 것도 아닙니다.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ 수수료를 요구하면 100% 공식이 아닙니다<\/b><p style=\"margin:8px 0 0\">디지털청은 2025년 6월 공식 알림으로 <b>\"Visit Japan Web 이용자에게 신청 수수료를 요구하는 사이트가 발견됐다\"<\/b>며, <b>디지털청은 어떤 수수료도 요구하지 않는다<\/b>고 밝혔습니다. 검색으로 들어가면 유사 사이트에 걸리기 쉬우니, 반드시 공식 주소 <b>www.vjw.digital.go.jp<\/b> 를 확인하세요. 과거에는 <b>'Visit Japan Web Info'<\/b> 같은 수상한 앱도 발견된 적이 있습니다(공식은 <b>앱이 아니라 웹<\/b>입니다).<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 등록 절차 5단계 (STEP 0~4)<\/h2>\n<p>공식 안내는 절차를 <b>STEP 0~4<\/b>로 나눠 설명합니다. 여권만 손에 들고 있으면 <b>10~15분<\/b>이면 끝나는 분량입니다.<\/p>\n<h3>STEP 0. 계정 만들기<\/h3>\n<p><b>이메일 주소와 비밀번호<\/b>가 필요합니다. 비밀번호는 <b>10자 이상, 영문 대문자+소문자+숫자+기호 조합<\/b>이어야 합니다(예: Ab1234567+). 입력한 이메일로 <b>확인 코드<\/b>가 오는데, <b>코드 입력 화면을 닫으면 코드가 무효<\/b>가 되어 처음부터 다시 해야 하니 창을 닫지 마세요. 메일이 안 오면 <b>스팸함<\/b>과 <b>@vjw.digital.go.jp 도메인 수신 차단<\/b> 여부를 확인합니다.<\/p>\n<h3>STEP 1. 이용자 등록 (본인 정보)<\/h3>\n<p>여권 정보를 넣습니다. <b>'카메라로 판독(OCR)'<\/b>과 <b>'직접 입력'<\/b> 중 고를 수 있고, 공식 안내는 간편하다는 이유로 카메라 판독을 권장합니다. 빛 반사로 인식이 안 되면 <b>직접 입력으로 바꾸면 됩니다.<\/b> 이름·성은 <b>여권 그대로 영문<\/b>으로 넣습니다.<\/p>\n<p>여기서 <b>동반가족<\/b>도 함께 등록할 수 있습니다. <b>최대 10명<\/b>까지 등록 가능하며, 가족이 <b>동시에 입국 수속을 밟는 경우<\/b>에 해당합니다.<\/p>\n<h3>STEP 2. 입국·귀국 일정 등록<\/h3>\n<p><b>일본 도착 예정일, 항공사, 편명, 출발지, 일본 내 체류지(호텔 주소·전화번호)<\/b>를 넣습니다. 주소·도시명은 <b>영문(반각)<\/b>으로 입력합니다. 일정은 <b>100건까지<\/b> 등록할 수 있고, <b>다음 해 12월 31일까지<\/b>의 예정을 미리 넣을 수 있습니다. 예전에 다녀온 기록이 있으면 <b>'등록된 입국·귀국 정보 인용'<\/b>으로 체류지 정보를 그대로 불러올 수 있어 재방문이면 훨씬 빠릅니다.<\/p>\n<h3>STEP 3. 입국·귀국 수속 입력<\/h3>\n<p>등록한 일정을 눌러 <b>검역(건강상태 확인)<\/b>과 <b>입국심사 및 세관신고<\/b>를 채웁니다. 세관신고에는 직업·입국일·탑승기명·출발지·체류지와 <b>면세범위를 넘는 물품이 있는지<\/b> 등이 들어갑니다.<\/p>\n<h3>STEP 4. 공항에서 QR코드 표시<\/h3>\n<p>도착 후 수속 화면에서 <b>'QR코드 표시'<\/b>를 누르면 됩니다. 등록은 PC로 해도 되지만, <b>보여주는 것은 스마트폰·태블릿이어야<\/b> 합니다(공식 안내 명시).<\/p>\n<div class=\"tip\"><b>💡 인터넷이 안 될 때를 대비 — '오프라인 이용' 설치<\/b><p style=\"margin:8px 0 0\">공항에서 로밍이 안 되거나 와이파이가 먹통일 때를 대비해, 비지트재팬웹은 <b>오프라인 이용<\/b>을 지원합니다. 로그인 화면에서 <b>'홈 화면에 추가'<\/b>(아이폰 사파리는 공유→홈 화면에 추가, 안드로이드 크롬은 메뉴 ⋮ →홈 화면에 추가)로 설치해 두면, <b>등록을 마친 일정의 QR코드는 오프라인에서도 표시<\/b>됩니다. 단 <b>계정 생성·이용자 등록·신규 일정 등록은 온라인에서만<\/b> 되고, <b>사전에 한 번은 온라인 로그인<\/b>을 해두어야 합니다. 출발 전날 집에서 설치해 두는 것이 가장 안전합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. QR코드는 딱 1개 — 공항에서 언제·어디서 보여주나<\/h2>\n<p>인터넷 글마다 <b>\"QR이 2개\"<\/b>라고 적혀 있는 이유는 <b>옛날 정보<\/b>이기 때문입니다. 예전에는 <b>입국심사용<\/b>과 <b>세관신고용<\/b> QR이 따로였지만, <b>2024년 1월 25일부터 하나로 통합<\/b>됐습니다. 지금은 메뉴 이름도 <b>'입국심사 및 세관신고'<\/b> 하나입니다. 참고로 같은 날부터 <b>옛 '세관신고 앱'으로 만든 QR코드는 사용할 수 없게<\/b> 됐으니, 예전에 앱을 깔아둔 분은 반드시 웹으로 다시 하셔야 합니다.<\/p>\n<p>하나의 QR을 <b>두 번<\/b> 보여준다고 생각하면 쉽습니다.<\/p>\n<ol>\n<li><b>입국심사 카운터<\/b> — 심사관에게 QR을 제시합니다(여권과 함께).<\/li>\n<li><b>수하물 찾은 뒤 세관 검사장<\/b> — <b>전자신고 단말기<\/b>에 같은 QR과 <b>IC여권<\/b>을 읽히고, 안내에 따라 진행하면 <b>전자신고 게이트<\/b>로 안내됩니다.<\/li>\n<\/ol>\n<div class=\"tip\"><b>💡 짐 기다리는 동안 세관 신고를 끝낼 수 있는 공항<\/b><p style=\"margin:8px 0 0\">공식 안내에 따르면 <b>하네다·후쿠오카·나하 공항<\/b>에서는 <b>위탁수하물이 나오기를 기다리는 시간<\/b>에 전자신고 단말기로 세관신고를 먼저 끝낼 수 있습니다. 짐이 늦게 나오는 공항일수록 체감 효과가 큽니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 전자신고 게이트 되는 공항 7곳 + 이용 조건<\/h2>\n<p>세관 전자신고 게이트는 <b>모든 공항에 있는 것이 아닙니다.<\/b> 일본 세관 공식 페이지 기준(2025년 4월 갱신) <b>7개 공항<\/b>입니다.<\/p>\n<table>\n<tr><th>지역<\/th><th>전자신고 게이트 설치 공항<\/th><\/tr>\n<tr><td>도쿄권<\/td><td><b>나리타 국제공항<\/b>, <b>하네다 공항<\/b><\/td><\/tr>\n<tr><td>간사이·주부<\/td><td><b>간사이 국제공항<\/b>, <b>주부 국제공항<\/b><\/td><\/tr>\n<tr><td>홋카이도<\/td><td><b>신치토세 공항<\/b><\/td><\/tr>\n<tr><td>규슈·오키나와<\/td><td><b>후쿠오카 공항<\/b>, <b>나하 공항<\/b><\/td><\/tr>\n<\/table>\n<p>여기에 없는 공항(예: 기타 지방공항)에 내린다면 <b>QR을 만들어 갔어도 전자신고 게이트는 없을 수 있습니다.<\/b> 그래도 QR 자체는 유인 검사대에서 쓸 수 있습니다 — 일부 유인 검사대에도 <b>검사대용 전자신고 단말기<\/b>가 설치돼 있다고 세관이 밝히고 있습니다.<\/p>\n<h3>전자신고 게이트 이용 조건 (세관 공식)<\/h3>\n<ul>\n<li><b>IC칩이 든 여권(IC여권)<\/b>이 필요합니다.<\/li>\n<li><b>가족이라도 1명씩<\/b> 수속해야 합니다.<\/li>\n<li><b>키 100cm 미만 어린이<\/b>는 기기 구조상 <b>보호자와 함께<\/b> 이용합니다.<\/li>\n<li><b>마스크·선글라스 등 얼굴을 가리는 것은 벗어야<\/b> 합니다(얼굴 인증).<\/li>\n<li><b>카트를 끌고 그대로 통과<\/b>할 수 있고, <b>휠체어도 탄 채로 통과<\/b>할 수 있습니다.<\/li>\n<li>게이트를 지날 때는 <b>정면을 보고 천천히<\/b> 걸으라고 안내합니다.<\/li>\n<\/ul>\n<p>얼굴 사진은 <b>본인 확인·게이트 얼굴인증에만 사용하고 사용 후 즉시 삭제<\/b>한다고 세관이 명시하고 있습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 가장 많이 걸리는 함정 5가지<\/h2>\n<p>등록 자체보다 <b>\"이걸 몰라서\" 공항에서 시간을 버리는<\/b> 경우가 훨씬 많습니다.<\/p>\n<h3>① \"내가 가족 것까지 다 해뒀으니 같이 통과하면 되겠지\" — 안 됩니다<\/h3>\n<p>동반가족을 <b>내 계정에 최대 10명까지 등록<\/b>할 수 있는 건 맞습니다. 그러나 공식 설명서는 <b>\"입국·귀국 수속은 한 명씩 실시합니다. 수속에 필요한 정보는 동반가족이라 하더라도 한 명씩 등록해 주십시오\"<\/b>라고 못박고 있습니다. 세관 역시 <b>\"가족이라도 1명씩 수속\"<\/b>이라고 안내합니다. QR 표시 화면에서 <b>드롭다운으로 대상자를 바꿔가며<\/b> 한 명씩 보여주는 구조입니다. 참고로 공식 알림 목록에는 <b>'대리 입력 기능의 서비스를 종료했습니다(2025년 6월 2일)'<\/b>라는 고지도 올라와 있습니다.<\/p>\n<h3>② 여권 잔여 유효기간 6개월<\/h3>\n<p>본인 정보를 다 넣으면 상태가 '등록 완료'로 바뀌는데, <b>여권 잔여 유효기간이 6개월 미만이면 '여권 잔여 유효기간 확인'<\/b>, <b>만료됐으면 '여권 유효기간 만료'<\/b>라고 표시됩니다. 등록 화면에서 이 경고를 보고 나서야 여권 상태를 아는 분이 많습니다. <b>출발 2~3개월 전에 미리 확인<\/b>하시는 게 좋습니다.<\/p>\n<h3>③ 면세 QR은 '스크린샷'이 통하지 않습니다<\/h3>\n<p>입국용 QR과 달리 <b>면세 구매용 QR코드는 스크린샷을 이용할 수 없다<\/b>고 공식 안내에 명시돼 있습니다. 면세점 계산대에서 캡처 이미지를 내밀면 인식되지 않습니다. 또 <b>면세 QR을 쓰려면 여권을 반드시 '카메라로 스캔'<\/b>해야 하고(직접 입력 불가), 입국 후에는 여권에 찍힌 <b>상륙허가 스탬프<\/b>를 추가로 스캔해야 합니다.<\/p>\n<h3>④ 유료 대행 사이트<\/h3>\n<p>1~2절에서 짚은 대로 <b>공식은 전액 무료<\/b>입니다. 수수료를 받는 곳은 공식이 아닙니다.<\/p>\n<h3>⑤ 오프라인 등록만 믿기<\/h3>\n<p>오프라인 이용은 편리하지만 제약이 있습니다. 공식 설명서는 <b>\"오프라인에서 등록한 정보는 단말기에만 저장되므로 정보가 삭제되면 복구되지 않는다\"<\/b>, <b>\"여러 기기에서 오프라인으로 수정하면 최신 내용이 반영되지 않을 수 있다\"<\/b>고 경고합니다. 오프라인으로 손댔다면 <b>온라인 상태에서 다시 열어 확인<\/b>하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 세관 면세범위 — 20만 엔 계산 예시 3가지<\/h2>\n<p>세관신고에서 실제로 <b>과세로 갈리는<\/b> 부분이 여기입니다. 일본 세관이 공시한 <b>입국자 1인당 면세범위<\/b>는 아래와 같습니다(휴대품과 별송품이 둘 다 있으면 <b>합산<\/b>합니다).<\/p>\n<table>\n<tr><th>품목<\/th><th>면세 수량·금액<\/th><th>비고<\/th><\/tr>\n<tr><td><b>주류<\/b><\/td><td>3병<\/td><td>1병 760ml 기준<\/td><\/tr>\n<tr><td><b>담배(궐련만)<\/b><\/td><td>200개비<\/td><td>가열식만이면 개별포장 10개, 엽궐련만이면 50개비, 기타 250g<\/td><\/tr>\n<tr><td><b>향수<\/b><\/td><td>2온스<\/td><td>1온스 약 28ml · 오드콜로뉴·오드투왈렛은 제외<\/td><\/tr>\n<tr><td><b>그 밖의 물품<\/b><\/td><td><b>20만 엔<\/b><\/td><td>해외시가 합계액 기준<\/td><\/tr>\n<\/table>\n<p><b>20세 미만은 주류·담배가 면세되지 않습니다.<\/b> 6세 미만 어린이는 장난감처럼 <b>본인이 쓰는 게 분명한 물건<\/b> 외에는 면세가 적용되지 않습니다.<\/p>\n<h3>예시 ① 12만 엔 시계 + 9만 엔 가방 = 21만 엔<\/h3>\n<p>합계가 20만 엔을 넘습니다. 이때 <b>전체에 세금이 붙는 게 아니라<\/b>, 세관이 <b>20만 엔 안에 들어가는 물품을 면세로 골라 주고 나머지에만 과세<\/b>합니다. 세관은 <b>\"여행자에게 유리하도록 면세 품목을 선택해 과세한다\"<\/b>고 명시하고 있습니다. 즉 <b>12만 엔 시계를 면세로 잡고 9만 엔 가방에만 과세<\/b>하는 식이 됩니다.<\/p>\n<h3>예시 ② 25만 엔짜리 가방 1개<\/h3>\n<p>가장 많이 오해하는 대목입니다. <b>\"20만 엔까지는 빼주고 5만 엔에만 세금\"<\/b>이 아닙니다. 세관 안내는 <b>\"1개로 20만 엔을 넘는 물품, 예를 들어 25만 엔 가방은 25만 엔 전액에 대해 과세된다\"<\/b>고 못박고 있습니다. <b>고가 단일 품목은 쪼갤 수 없다<\/b>는 뜻입니다.<\/p>\n<h3>예시 ③ 1,000엔짜리 초콜릿 9개 + 5,000엔 넥타이 2개<\/h3>\n<p><b>1품목당 해외시가 합계액이 1만 엔 이하<\/b>인 것은 원칙적으로 면세입니다. 세관이 든 예시가 정확히 이 두 가지(초콜릿 9개=9,000엔, 넥타이 2개=1만 엔)입니다. 선물용 소액 품목을 여러 개 사는 경우는 대체로 걱정하지 않아도 된다는 뜻입니다.<\/p>\n<div class=\"warn\"><b>⚠️ 면세범위를 넘으면 게이트로 못 갑니다<\/b><p style=\"margin:8px 0 0\">세관은 <b>\"전자신고 단말기에서 수속을 마쳤더라도, 면세범위를 넘는 휴대품·별송품 신고가 있는 분은 추가 수속을 위해 세관 직원이 있는 검사대로 안내된다\"<\/b>고 안내합니다. 즉 <b>QR을 만들어 갔다고 무조건 게이트 통과가 되는 것은 아닙니다.<\/b> 신고할 게 있으면 정직하게 신고하고 검사대로 가는 것이 맞습니다. 참고로 별송품은 <b>입국(귀국) 후 6개월 이내에 수입하는 것<\/b>까지만 면세 대상으로 봅니다.<\/p><\/div>\n<p>※ 여기 나온 금액은 <b>일본 입국 시 일본 세관 기준<\/b>입니다. <b>한국으로 돌아올 때의 한국 면세한도는 기준이 다르니<\/b> 아래 '함께 보면 좋은 글'의 면세 한도 글을 따로 확인하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 면세쇼핑(Tax-free)은 2026년 11월부터 방식이 바뀝니다<\/h2>\n<p>일본에서 <b>면세점 쇼핑<\/b>을 계획하고 계시다면 알아두실 변화가 있습니다. 일본 관광청 공식 안내에 따르면, <b>2026년 11월 1일 판매분부터<\/b> 외국인 여행자 대상 소비세 면세제도가 <b>'리펀드(환급) 방식'<\/b>으로 바뀝니다.<\/p>\n<ul>\n<li>지금까지: 면세점에서 <b>처음부터 세금을 뺀 가격<\/b>으로 결제.<\/li>\n<li>2026년 11월 1일 이후: 면세점에서 <b>세금 포함 가격으로 결제<\/b>한 뒤, <b>출국할 때 공항 세관에서 물품 반출이 확인된 후<\/b> 소비세 상당액을 <b>환급<\/b>받는 방식.<\/li>\n<\/ul>\n<p>제도가 단순해지는 면도 있습니다. <b>일반물품/소모품 구분이 폐지<\/b>되고, <b>소모품 구매 상한액(50만 엔)도 폐지<\/b>됩니다. 다만 주의할 점이 있습니다. 관광청은 <b>\"구매기록 1건에 포함된 상품 중 하나라도 세관 확인이 안 되면, 그 건에 포함된 모든 상품이 면세되지 않는다\"<\/b>고 안내합니다. 또 면세점에서 산 물건을 우체국 등으로 해외 배송하던 <b>'별송' 취급은 2025년 3월 31일자로 이미 폐지<\/b>됐습니다.<\/p>\n<div class=\"tip\"><b>💡 올여름(2026년 7~8월) 여행이라면<\/b><p style=\"margin:8px 0 0\">아직 <b>기존 방식(구매 시점에 세금 제외 가격으로 결제)<\/b>이 적용되는 기간입니다. 위 변경은 <b>2026년 11월 1일 판매분부터<\/b>이니, 가을·겨울 일본 여행을 계획 중이라면 그때 다시 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 자주 묻는 질문<\/h2>\n<h3>Q. 등록을 못 하고 비행기를 탔습니다. 어떻게 하나요?<\/h3>\n<p>기내에서 나눠주는 <b>종이 신고서<\/b>를 쓰거나, 도착 후 공항 세관에 비치된 양식을 작성하면 됩니다. 일본 세관은 <b>한국어 양식(C-5360-C)<\/b>도 공식 배포합니다. 등록을 안 했다고 입국이 거부되지는 않습니다.<\/p>\n<h3>Q. QR을 캡처해서 저장해 두면 되나요?<\/h3>\n<p><b>면세 구매용 QR은 스크린샷이 불가<\/b>하다고 공식 안내에 명시돼 있습니다. 입국·세관용은 <b>스크린샷보다 '오프라인 이용' 설치<\/b>가 안전한 방법입니다. 홈 화면에 추가해 두면 인터넷이 없어도 등록해 둔 일정의 QR을 띄울 수 있습니다.<\/p>\n<h3>Q. 한 번 등록하면 다음 여행 때도 쓸 수 있나요?<\/h3>\n<p>계정과 여권 정보(본인 정보)는 그대로 남아 있어 다시 넣을 필요가 없습니다. <b>여행마다 새로 하는 것은 '입국·귀국 예정' 등록<\/b>입니다. 지난 기록에서 <b>일본 내 체류지 정보를 인용<\/b>할 수 있어 두 번째부터는 훨씬 빠릅니다.<\/p>\n<h3>Q. 부모님 스마트폰이 없으면 어떻게 하나요?<\/h3>\n<p>등록은 PC로 할 수 있지만 <b>공항에서 QR을 보여줄 때는 스마트폰·태블릿이 필요<\/b>합니다. 스마트폰이 없거나 조작이 어려우신 분은 <b>종이 신고서로 가는 편이 오히려 편합니다.<\/b> 대신 함께 가는 가족이 자기 것만 QR로 처리하면 되고, 수속은 어차피 1인씩입니다.<\/p>\n<h3>Q. 미국 ESTA처럼 승인이 나야 가는 건가요?<\/h3>\n<p>아닙니다. 비지트재팬웹은 <b>승인·허가 절차가 아니라 신고서 사전 작성<\/b>에 가깝습니다. 승인 대기 시간도, 수수료도, 유효기간 개념도 없습니다. 미국 ESTA와는 성격이 완전히 다릅니다.<\/p>\n<h3>Q. 계정을 지우면 신고한 내용도 지워지나요?<\/h3>\n<p>아닙니다. 공식 설명서는 <b>\"계정을 삭제해도 각 행정기관에 제출된 정보는 삭제되지 않는다\"<\/b>고 명시합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 (일본 정부)<\/b><a href=\"https://www.vjw.digital.go.jp/\" target=\"_blank\" rel=\"nofollow\">▸ Visit Japan Web — 공식 서비스 (디지털청)<\/a><a href=\"https://services.digital.go.jp/ko/visit-japan-web/\" target=\"_blank\" rel=\"nofollow\">▸ 디지털청 — Visit Japan Web 한국어 안내<\/a><a href=\"https://services.digital.go.jp/ko/visit-japan-web/guide/\" target=\"_blank\" rel=\"nofollow\">▸ 디지털청 — 이용 절차(STEP 0~4) 한국어<\/a><a href=\"https://www.customs.go.jp/kaigairyoko/egate.htm\" target=\"_blank\" rel=\"nofollow\">▸ 일본 세관 — 전자신고 게이트 7개 공항<\/a><a href=\"https://www.customs.go.jp/kaigairyoko/menzei.htm\" target=\"_blank\" rel=\"nofollow\">▸ 일본 세관 — 해외여행자 면세범위<\/a><a href=\"https://www.customs.go.jp/kaigairyoko/shinkokusho.htm\" target=\"_blank\" rel=\"nofollow\">▸ 일본 세관 — 휴대품·별송품 신고서(한국어 양식)<\/a><a href=\"https://www.mlit.go.jp/kankocho/tax-free/page01_000001_00019.html\" target=\"_blank\" rel=\"nofollow\">▸ 일본 관광청 — 면세 리펀드 방식(2026.11.1~)<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">정리하면, 비지트재팬웹은 <b>의무가 아니라 시간을 아끼는 선택지<\/b>입니다. <b>QR은 2024년 1월부터 1개로 통합<\/b>됐고, <b>입국심사 카운터와 세관 전자신고 단말기에서 각각 한 번씩<\/b> 보여주면 됩니다. 전자신고 게이트가 있는 곳은 <b>나리타·하네다·간사이·주부·신치토세·후쿠오카·나하 7개 공항<\/b>, <b>IC여권 필수 · 가족도 1명씩<\/b>입니다. 가장 흔한 실수는 <b>\"가족 것까지 내가 다 해뒀다\"<\/b>는 착각과 <b>여권 6개월<\/b>, 그리고 <b>수수료를 받는 가짜 사이트<\/b>입니다. 출발 전날 <b>'홈 화면에 추가'로 오프라인 설치<\/b>까지 해두면, 도착해서 인터넷이 안 돼도 당황할 일이 없습니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 일본 디지털청 <b>Visit Japan Web 조작설명서 제3.16판(2026년 7월 22일)<\/b> 및 한국어 공식 안내, 일본 세관(관세청) 공식 페이지(전자신고 게이트 — 2025년 4월 갱신), 일본 관광청 소비세 면세제도 안내를 직접 확인해 정리했습니다. 화면 구성·설치 공항·면세 기준은 변경될 수 있으니 출국 전 위 공식 페이지에서 다시 확인하세요.<br>출처: 일본 디지털청(digital.go.jp) · 일본 세관(customs.go.jp) · 일본 관광청(mlit.go.jp/kankocho)<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/esta-2026.html\">▸ 미국 ESTA 신청 방법 수수료 유효기간 승인 거부 사유 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_942.html\">▸ 면세 한도 총정리 — 술·담배·향수 입국 면세범위<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/vs-vs.html\">▸ 로밍 vs 유심 vs 이심 해외여행 데이터 비교 총정리<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 절차·공항 목록·면세 기준은 <b>일본 디지털청·세관·관광청 공식 페이지를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 입국 규정은 예고 없이 바뀔 수 있으니 출국 전 공식 페이지를 다시 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 비지트재팬웹은 의무가 아니에요. 일본 세관은 지금도 한국어 종이 신고서(C-5360-C)를 비치·배포합니다. 다만 미리 해두면 전자신고 게이트로 빠르게 통과할 수 있어 '시간을 아끼는 선택지'입니다. 그리고 수수료를 요구하는 사이트는 100% 가짜입니다(공식 무료).\n2. QR은 2024년 1월 25일부터 1개로 통합됐어요. 입국심사 카운터에서 한 번, 짐 찾고 세관 전자신고 단말기에서 한 번 보여주면 됩니다. 전자신고 게이트가 있는 공항은 나리타·하네다·간사이·주부·신치토세·후쿠오카·나하 7곳, IC여권 필수이고 가족이라도 1명씩 수속해야 합니다.\n3. 일본 세관 면세범위는 1인당 주류 3병·궐련 200개비·향수 2온스·기타 20만 엔이에요. 함정은 '1개로 20만 엔을 넘는 물건'인데, 25만 엔 가방은 5만 엔이 아니라 25만 엔 전액이 과세 대상입니다. 반대로 1품목 합계 1만 엔 이하(1,000엔 초콜릿 9개 등)는 원칙적으로 면세입니다.\n"},{"code":"D4-06","title":"해외직구 관세 목록통관 150달러 기준 개인통관고유부호 갱신 총정리 (2026 합산과세·반품 환급)","lane":"pop","thumb":"142_overseas_direct_tax.png","draft":"해외직구관세통관_글_HTML.txt","facts":"목록통관 물품가격 150달러 이하(미국 발송 200달러 이하)·간이신고 150~2000달러·2000달러 초과 일반신고 | 면세 판정=물품가격(국제배송비 제외), 세금 계산=과세가격(국제운임·보험료 가산, 관세법 30조) | 150달러 절벽 계산: 상품 149달러 0원 vs 151달러+배송비20달러 과세가격 171달러 → 관세13% 22.23달러+부가세 19.32달러=41.55달러(약 5.8만원, 환율 1400원 가정) | 목록통관 배제 12품목(의약품·건기식·식품/주류/담배·기능성화장품 등), 하나만 섞여도 전체 일반통관 | 합산과세: 2022-11-16 발표·11-17 시행으로 '입항일 동일' 합산 폐지, 동일 공급자·동일 날짜 구매분만 잔존 | 개인통관고유부호 유효기간 1년(고시 개정 2024-06-18 시행, 2026년부터 본격 도입), 2026년 이후 신규는 발급일부터 1년·이전 발급자는 2027년 본인 생일, 만료 전후 30일 미갱신 시 자동해지 | 반품 관세환급 관세법 106조의2, 수입신고수리일부터 6개월, 수출신고가격 200만원 이하는 수출신고 없이도 송품장·반품확인·환불영수자료로 인정 | 출처=관세청 특송물품 통관/보도자료/관세환급 안내, 국가법령정보센터 관세법 30조, 관세청 PCC FAQ","added":"2026-07-28","thumb_data":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCACIAQQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBU  간이신고 / 일반신고 세 갈래 구분표\n■ 팩트체크 출처(1차):\n · 관세청 — 특송물품 통관 https://www.customs.go.kr/kcs/cm/cntnts/cntntsView.do?mi=2821&cntntsId=819 (목록통관 $150·미국발 $200, 배제 12품목, 간이신고 $2,000 이하, 물품가격 정의)\n · 관세청 보도자료 — 「해외직구 물품, 입항일 같아도 합산과세 면제」(2022년 11월 16일 발표·11월 17일 시행)\n · 관세청 — 해외직구물품 관세환급 https://www.customs.go.kr/kcs/cm/cntnts/cntntsView.do?mi=2836&cntntsId=828 (관세법 제106조의2, 6개월, 수출신고가격 200만 원 이하 예외)\n · 국가법령정보센터 — 관세법 제30조(과세가격 결정: 실제지급가격 + 운임·보험료 가산)\n · 국가물류통합정보센터(관세청 「통관고유부호 및 해외거래처부호 등록·관리에 관한 고시」 개정, 2024년 6월 18일 시행) — 개인통관고유부호 유효기간 1년, 2026년부터 본격 도입, 만료 전후 30일 미갱신 시 자동 해지\n · 관세청 해외직구물품 예상세액 조회 https://www.customs.go.kr/kcs/ad/tax/BuyTaxCalculation.do\n · 관세청 개인통관고유부호 발급(유니패스) https://unipass.customs.go.kr/csp/persIndex.do\n■ 미확인 → 본문에 수치 안 씀:\n · 품목별 관세율 표 — HS코드별로 갈려 1차 출처에서 전체 확정 불가 → 본문 계산은 \"관세율 13% 가정\"임을 명시하고 예상세액 조회로 유도\n · 건강기능식품·의약품 자가사용 인정 수량(6병 등) — 관세청 공식 페이지에서 확정 못 함 → \"수량 기준이 따로 있다\"로만 처리\n · 환율 — 변동하므로 원화 환산은 1달러 1,400원 가정 어림값임을 명시\n\n[붙여넣는 법] Blogger 글쓰기 → 연필▾ → HTML 보기 → 아래 전체 붙여넣기 → 작성 보기 → 제목 입력 → 라벨(생활행정) → 발행\n----------------------------------------------------------------\n▼ 본문 HTML\n<div style=\"text-align:center;margin:0 0 18px\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCACIAQQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5e 150달러 절벽 실제 계산, 목록통관에서 빠지는 품목, 합산과세의 진짜 현행 규정, 부호 갱신과 도용 확인, 반품했을 때 세금 돌려받는 법<\/b>까지 관세청 공식 안내 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 내 물건은 어느 갈래로 가나 — 통관 3종 구분<\/a><a href=\"#sec2\">2. 함정 하나 — '물품가격'과 '과세가격'은 다른 금액입니다<\/a><a href=\"#sec3\">3. 150달러 절벽 — 2달러 차이로 5만 원<\/a><a href=\"#sec4\">4. 같은 물건인데 미국발이면 0원, 중국발이면 6만 원<\/a><a href=\"#sec5\">5. 목록통관에서 빠지는 12가지 (하나만 섞여도 전체가 넘어감)<\/a><a href=\"#sec6\">6. \"같은 날 도착하면 합산과세\" — 지금은 아닙니다<\/a><a href=\"#sec7\">7. 2026년부터 개인통관고유부호에 유효기간이 생겼습니다<\/a><a href=\"#sec8\">8. 내 부호가 도용됐는지 확인하는 법<\/a><a href=\"#sec9\">9. 반품했는데 세금은? — 관세 환급 신청<\/a><a href=\"#sec10\">10. 자주 묻는 질문<\/a><a href=\"#sec11\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec3\">👉 150달러 넘겼을 때 세금 실제 계산 보기<\/a>\n\n<h2 id=\"sec1\">1. 내 물건은 어느 갈래로 가나 — 통관 3종 구분<\/h2>\n<p>해외에서 오는 개인 물품은 <b>금액과 품목에 따라 세 갈래<\/b>로 갈립니다. 이 갈래가 정해지면 <b>세금을 내는지, 서류를 내는지, 시간이 얼마나 걸리는지<\/b>가 전부 따라옵니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>기준<\/th><th>세금<\/th><th>내가 할 일<\/th><\/tr>\n<tr><td><b>목록통관<\/b><\/td><td>물품가격 <b>미화 150달러 이하<\/b><br>(<b>미국 발송은 200달러 이하<\/b>)<\/td><td><b>없음<\/b><\/td><td>사실상 없음 — 배송업체가 목록만 제출<\/td><\/tr>\n<tr><td><b>간이수입신고<\/b><\/td><td>150달러 초과 <b>~ 2,000달러 이하<\/b><\/td><td><b>관세 + 부가세<\/b><\/td><td>세액 확인·납부(대개 배송대행·특송업체가 대행)<\/td><\/tr>\n<tr><td><b>일반수입신고<\/b><\/td><td><b>2,000달러 초과<\/b> 또는 목록통관 배제 품목<\/td><td>관세 + 부가세<br>(품목에 따라 추가)<\/td><td>정식 수입신고 — 요건 확인·서류 필요<\/td><\/tr>\n<\/table>\n<p>여기서 <b>가장 많이 오해하는 것이 미국 200달러<\/b>입니다. 이것은 <b>미국에서 발송된 물품에만<\/b> 적용됩니다. 미국 사이트에서 샀더라도 <b>물건이 중국 창고에서 출발했다면 150달러 기준<\/b>이 적용됩니다. 판단 기준은 <b>결제한 쇼핑몰의 국적이 아니라 실제 발송 국가<\/b>입니다.<\/p>\n<div class=\"tip\"><b>💡 \"면세\"는 세금만 면제된다는 뜻입니다<\/b><p style=\"margin:8px 0 0\">목록통관 대상이라도 <b>통관 자체가 면제되는 것은 아닙니다.<\/b> 세관은 여전히 목록을 보고 <b>반입이 금지·제한된 물품인지<\/b>를 확인합니다. 금액이 작아도 <b>통관이 보류되거나 폐기될 수 있는 물품<\/b>은 존재합니다(5번 항목 참고).<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 함정 하나 — '물품가격'과 '과세가격'은 다른 금액입니다<\/h2>\n<p>직구 세금 계산이 헷갈리는 <b>진짜 이유<\/b>가 여기 있습니다. 세관은 <b>두 번, 서로 다른 금액<\/b>을 봅니다. 이걸 하나로 뭉뚱그려 이해하면 계산이 반드시 어긋납니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>언제 쓰나<\/th><th>국제배송비·보험료<\/th><\/tr>\n<tr><td><b>물품가격<\/b><\/td><td><b>면세인지 아닌지<\/b>를 가릴 때<br>(150달러·200달러 판정)<\/td><td><b>제외<\/b> — 명백히 구분되면 빼고 봅니다<\/td><\/tr>\n<tr><td><b>과세가격<\/b><\/td><td><b>세금을 얼마 매길지<\/b> 계산할 때<\/td><td><b>포함<\/b> — 우리나라 항구·공항까지 오는 운임과 보험료를 더합니다<\/td><\/tr>\n<\/table>\n<p>관세청 안내는 <b>물품가격<\/b>을 \"물품대금에 <b>발송국가 안에서 발생한 세금·내륙운임·보험료 등 제비용<\/b>을 포함한 금액\"으로 설명하면서, <b>우리나라로 오는 국제운송비와 보험료는 명백히 구분할 수 있으면 제외<\/b>할 수 있다고 밝히고 있습니다. 반면 세금을 매기는 <b>과세가격<\/b>은 관세법 제30조에 따라 <b>실제로 지급한 가격에 수입항까지의 운임·보험료를 가산<\/b>해 정합니다.<\/p>\n<div class=\"warn\"><b>⚠️ 그래서 이런 일이 생깁니다<\/b><p style=\"margin:8px 0 0\">상품값 <b>149달러<\/b> + 국제배송비 <b>20달러<\/b>를 결제했다면, <b>면세 판정은 149달러로 보므로 세금이 없습니다.<\/b> 그런데 상품값이 <b>151달러<\/b>가 되는 순간 판정이 뒤집히고, <b>이때 세금은 151달러가 아니라 배송비를 더한 171달러를 기준으로<\/b> 매겨집니다. <b>한쪽에서는 빼던 배송비가, 넘어가는 순간 더해집니다.<\/b> 아슬아슬한 금액에서 \"배송비는 어차피 안 친다\"고 안심하면 안 되는 이유입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 150달러 절벽 — 2달러 차이로 5만 원<\/h2>\n<p>150달러를 넘으면 <b>넘은 금액에만<\/b> 세금이 붙는 것이 아닙니다. <b>전체 금액에<\/b> 붙습니다. 그래서 이 구간은 완만한 언덕이 아니라 <b>절벽<\/b>입니다. 실제로 계산해 보겠습니다.<\/p>\n<div class=\"tip\"><b>🔢 계산 공식<\/b><p style=\"margin:8px 0 0\"><b>관세 = 과세가격 × 품목별 관세율<\/b><br><b>부가가치세 = (과세가격 + 관세) × 10%<\/b><br>→ <b>총 세금 = 관세 + 부가세<\/b><br><span style=\"font-size:14px;color:#557\">※ 아래 표는 <b>관세율 13%, 환율 1달러 1,400원을 가정<\/b>한 계산입니다. 관세율은 품목마다 다르므로 실제 금액은 반드시 관세청 예상세액 조회로 확인하세요.<\/span><\/p><\/div>\n<table>\n<tr><th>구분<\/th><th>A: 상품 149달러<\/th><th>B: 상품 151달러<\/th><\/tr>\n<tr><td>국제배송비<\/td><td>20달러<\/td><td>20달러<\/td><\/tr>\n<tr><td><b>면세 판정 기준(물품가격)<\/b><\/td><td>149달러 → <b>면세<\/b><\/td><td>151달러 → <b>과세<\/b><\/td><\/tr>\n<tr><td><b>세금 계산 기준(과세가격)<\/b><\/td><td>—<\/td><td><b>171달러<\/b> (배송비 포함)<\/td><\/tr>\n<tr><td>관세(13% 가정)<\/td><td>0<\/td><td>22.23달러<\/td><\/tr>\n<tr><td>부가세(10%)<\/td><td>0<\/td><td>19.32달러<\/td><\/tr>\n<tr><td><b>총 세금<\/b><\/td><td><b>0원<\/b><\/td><td><b>약 41.55달러 = 약 5만 8천 원<\/b><\/td><\/tr>\n<\/table>\n<p>상품값 차이는 <b>2달러(약 2,800원)<\/b>인데 실제 부담은 <b>약 5만 8천 원<\/b> 벌어집니다. 장바구니가 <b>145~160달러 사이<\/b>에 걸렸다면, <b>물건 하나를 빼서 150달러 아래로 맞추는 편이 거의 언제나 유리<\/b>합니다.<\/p>\n<div class=\"tip\"><b>💡 실전에서 쓰는 방법<\/b><p style=\"margin:8px 0 0\">① <b>장바구니를 두 번에 나눠 주문<\/b>합니다(합산과세는 6번 항목에서 설명하듯 지금은 조건이 좁습니다). ② <b>쿠폰·할인은 적용 후 금액<\/b>이 기준이므로, 할인 코드를 넣어 150달러 아래로 떨어지면 그대로 면세입니다. ③ 애매하면 <b>관세청 예상세액 조회<\/b>에 품목과 금액을 넣어 미리 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 같은 물건인데 미국발이면 0원, 중국발이면 6만 원<\/h2>\n<p>1번 표의 <b>미국 200달러 예외<\/b>가 실제로 얼마나 큰 차이인지 보겠습니다. <b>똑같은 180달러짜리 물건<\/b>을 산 두 사람의 결과입니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>미국에서 발송<\/th><th>중국·유럽 등에서 발송<\/th><\/tr>\n<tr><td>상품값<\/td><td>180달러<\/td><td>180달러<\/td><\/tr>\n<tr><td>면세 기준<\/td><td><b>200달러 이하<\/b><\/td><td><b>150달러 이하<\/b><\/td><\/tr>\n<tr><td>판정<\/td><td><b>목록통관 · 면세<\/b><\/td><td><b>과세 대상<\/b><\/td><\/tr>\n<tr><td>과세가격(배송비 10달러 가정)<\/td><td>—<\/td><td>190달러<\/td><\/tr>\n<tr><td><b>총 세금(관세 13% 가정)<\/b><\/td><td><b>0원<\/b><\/td><td><b>약 46.17달러 = 약 6만 5천 원<\/b><\/td><\/tr>\n<\/table>\n<p>그래서 <b>같은 제품을 미국 셀러와 다른 나라 셀러가 비슷한 값에 팔고 있다면<\/b>, 150~200달러 구간에서는 <b>미국 발송이 사실상 6만 원가량 싼 셈<\/b>이 됩니다. 상품 페이지에서 <b>\"Ships from\"(발송지)<\/b>을 확인하는 습관이 곧 돈입니다.<\/p>\n<div class=\"warn\"><b>⚠️ 미국 사이트 ≠ 미국 발송<\/b><p style=\"margin:8px 0 0\">대형 쇼핑몰은 <b>같은 상품이라도 판매자에 따라 발송 창고가 다릅니다.<\/b> 미국 아마존에서 샀는데 <b>중국 셀러가 중국에서 직접 보내는 경우<\/b>가 흔합니다. 이때는 <b>150달러 기준<\/b>이 적용됩니다. 배송대행지(배대지)를 거쳐 미국에서 출발했다면 미국 발송으로 봅니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 목록통관에서 빠지는 12가지 (하나만 섞여도 전체가 넘어감)<\/h2>\n<p>금액이 150달러 아래여도 <b>품목 자체가 목록통관에서 배제<\/b>되면 간이수입신고로 넘어갑니다. 관세청이 안내하는 <b>배제 대상<\/b>은 다음과 같습니다.<\/p>\n<ol>\n<li><b>의약품<\/b><\/li>\n<li><b>한약재<\/b><\/li>\n<li><b>야생동물 관련 제품<\/b><\/li>\n<li><b>농림축수산물 등 검역대상 물품<\/b><\/li>\n<li><b>건강기능식품<\/b><\/li>\n<li><b>지식재산권 위반 의심물품<\/b> (가짜 명품 등)<\/li>\n<li><b>식품류·주류·담배류<\/b><\/li>\n<li><b>특정 화장품<\/b> — 기능성화장품, 태반 함유 화장품, 스테로이드제 함유 화장품, 성분 미상 등 유해 우려 화장품<\/li>\n<li><b>선하증권(B/L) 정정 물품<\/b><\/li>\n<li><b>통관목록 중 품명·규격·수량 등이 부정확하게 기재된 물품<\/b><\/li>\n<li><b>방송통신기자재 등<\/b><\/li>\n<li><b>그 밖에 법령에 따라 통관이 제한되는 물품<\/b><\/li>\n<\/ol>\n<div class=\"warn\"><b>⚠️ 가장 아픈 함정 — '섞임'<\/b><p style=\"margin:8px 0 0\">한 상자에 <b>티셔츠 3장(목록통관 가능)<\/b>과 <b>비타민 한 통(건강기능식품 = 배제)<\/b>이 함께 들어 있으면, <b>그 상자 전체가 목록통관에서 빠집니다.<\/b> 총액이 150달러 아래여도 <b>간이수입신고 절차<\/b>를 밟게 되고, 통관이 며칠 늦어지며 서류를 요구받을 수 있습니다. <b>건강식품·화장품·식품은 다른 물건과 같은 주문에 담지 않는 것<\/b>이 안전합니다.<\/p><\/div>\n<p>또한 <b>건강기능식품·의약품<\/b>은 금액과 별개로 <b>개인이 스스로 쓰는 양(자가사용 인정기준)에 수량 한도<\/b>가 정해져 있습니다. 이를 넘기면 <b>정식 수입 요건<\/b>을 요구받거나 반송될 수 있으므로, <b>여러 통을 한꺼번에 주문하기 전<\/b>에 관세청 고객지원센터(125)나 공식 안내로 확인하는 편이 확실합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. \"같은 날 도착하면 합산과세\" — 지금은 아닙니다<\/h2>\n<p>직구 커뮤니티에서 가장 자주 보이는 조언이 <b>\"같은 날 도착하면 합쳐서 세금 매기니 날짜를 벌려 주문해라\"<\/b>입니다. <b>이 규정은 이미 폐지됐습니다.<\/b><\/p>\n<p>관세청은 <b>2022년 11월 16일<\/b> 「해외직구 물품, 입항일 같아도 합산과세 면제」를 발표하고 <b>다음 날인 11월 17일부터 시행<\/b>했습니다. <b>수입통관 사무처리에 관한 고시<\/b>의 관련 규정을 정비해, <b>다른 해외공급자에게서 구매했거나 같은 공급자라도 다른 날짜에 구매한 물품<\/b>은 <b>입항일이 같아도 합산하지 않도록<\/b> 바꾼 것입니다.<\/p>\n<table>\n<tr><th>상황<\/th><th>예전(2022년 11월 16일까지)<\/th><th>지금<\/th><\/tr>\n<tr><td>A몰·B몰에서 따로 사서 <b>같은 날 도착<\/b><\/td><td><b>합산<\/b>해서 과세<\/td><td><b>합산 안 함<\/b> — 각각 판정<\/td><\/tr>\n<tr><td>같은 몰에서 <b>다른 날 주문<\/b>했는데 같은 날 도착<\/td><td><b>합산<\/b>해서 과세<\/td><td><b>합산 안 함<\/b><\/td><\/tr>\n<tr><td>같은 몰에서 <b>같은 날 주문<\/b>한 것이 나눠 배송<\/td><td>합산<\/td><td><b>합산 대상으로 남습니다<\/b><\/td><\/tr>\n<\/table>\n<p>정리하면 <b>\"도착일이 겹치는 것\" 자체는 더 이상 문제가 아닙니다.<\/b> 남아 있는 것은 <b>사실상 한 건의 주문을 쪼갠 경우<\/b>입니다. 하나의 운송장으로 들어온 물품을 <b>면세 범위에 맞춰 나눠 신고하는 것<\/b>도 마찬가지로 합산 대상입니다.<\/p>\n<div class=\"tip\"><b>💡 그래도 지켜야 할 선<\/b><p style=\"margin:8px 0 0\">규정이 완화됐다고 <b>한 번에 살 물건을 149달러씩 여러 건으로 쪼개 반복 주문<\/b>하면, 이는 <b>소액면세를 노린 분할 수입<\/b>으로 볼 수 있습니다. <b>자가사용 범위를 넘는 반복·대량 구매<\/b>는 판매용으로 판단돼 정식 수입 절차 대상이 될 수 있습니다. <b>실제로 내가 쓸 만큼<\/b>이라는 선만 지키면 됩니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 2026년부터 개인통관고유부호에 유효기간이 생겼습니다<\/h2>\n<p>해외직구를 하려면 <b>개인통관고유부호<\/b>(주민등록번호 대신 쓰는 통관용 번호)가 필요합니다. 지금까지는 <b>한 번 받으면 계속 썼습니다.<\/b> 그런데 관세청이 <b>「통관고유부호 및 해외거래처부호 등록·관리에 관한 고시」를 개정(2024년 6월 18일 시행)<\/b>하면서 <b>유효기간 1년<\/b>이 도입됐고, 전산 준비를 거쳐 <b>2026년부터 본격 적용<\/b>됩니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>만료일<\/th><th>해야 할 일<\/th><\/tr>\n<tr><td><b>2026년 이후 새로 발급<\/b><\/td><td>발급일부터 <b>1년<\/b><\/td><td>매년 갱신<\/td><\/tr>\n<tr><td><b>그 전에 발급받아 쓰던 부호<\/b><\/td><td><b>2027년 본인 생일<\/b><\/td><td>그때까지 갱신<\/td><\/tr>\n<\/table>\n<div class=\"warn\"><b>⚠️ 갱신을 놓치면 부호가 사라집니다<\/b><p style=\"margin:8px 0 0\">발표된 내용에 따르면 <b>만료일 전후 30일 안에 갱신하지 않으면 그 개인통관고유부호는 자동 해지<\/b>됩니다. 해지된 번호로는 통관이 진행되지 않으므로, <b>물건이 세관에서 멈추고 배송이 지연<\/b>됩니다. 주문 직전에 급히 처리하면 이미 늦을 수 있으니, <b>큰 세일(블랙프라이데이 등)을 앞두고는 미리 확인<\/b>해 두세요.<\/p><\/div>\n<p>갱신은 <b>관세청 전자통관시스템(유니패스) 누리집에서 온라인으로<\/b> 하거나 <b>가까운 세관을 방문<\/b>해 처리합니다. 오래전에 발급받았다면 <b>등록된 이름·휴대전화번호·주소가 지금과 같은지<\/b>도 함께 확인하는 것이 좋습니다. 관세청은 부호 도용을 막기 위해 <b>이름·전화번호에 더해 우편번호까지 대조하는 검증<\/b>을 시행하고 있어, <b>옛 주소가 남아 있으면 주문이 막힐 수 있습니다.<\/b><\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 내 부호가 도용됐는지 확인하는 법<\/h2>\n<p>개인통관고유부호는 <b>남이 자기 물건을 들여오면서 내 번호를 갖다 쓰는<\/b> 도용 사고가 꾸준히 있습니다. 내가 산 적 없는 물건이 내 이름으로 통관되면 <b>나중에 세금·법적 책임 문제로 번질 수 있습니다.<\/b> 확인은 어렵지 않습니다.<\/p>\n<ol>\n<li><b>유니패스에 접속<\/b>합니다(개인통관고유부호 발급·조회 화면).<\/li>\n<li><b>본인인증<\/b> 후 <b>해외직구 통관정보조회<\/b>에서 <b>내 부호로 통관된 내역<\/b>을 확인합니다.<\/li>\n<li>기억에 없는 건이 보이면 <b>[개인통관고유부호 도용신고]<\/b>로 접수합니다.<\/li>\n<li>필요하면 <b>부호 사용정지<\/b> 또는 <b>재발급<\/b>으로 번호를 바꿉니다.<\/li>\n<\/ol>\n<div class=\"tip\"><b>💡 도용을 막는 생활 습관<\/b><p style=\"margin:8px 0 0\">① <b>구매대행·배송대행 업체 외에 개인에게 부호를 알려주지 않습니다.<\/b> ② <b>\"통관이 보류됐으니 부호를 알려달라\"는 문자·카톡은 의심<\/b>하세요. 관세청은 문자로 부호를 요구하지 않습니다. ③ 반기에 한 번 <b>통관 내역을 훑어보는 것<\/b>만으로도 대부분 조기에 잡힙니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 반품했는데 세금은? — 관세 환급 신청<\/h2>\n<p>세금을 내고 받은 물건이 <b>사이즈가 안 맞거나 불량이라 반품<\/b>했다면, <b>낸 관세를 돌려받을 수 있습니다.<\/b> 많은 분이 모르고 그냥 넘깁니다.<\/p>\n<table>\n<tr><th>항목<\/th><th>내용<\/th><\/tr>\n<tr><td><b>근거<\/b><\/td><td>관세법 <b>제106조의2 제1항<\/b> — 개인의 자가사용물품을 수입한 상태 그대로 수출하는 경우<\/td><\/tr>\n<tr><td><b>기한<\/b><\/td><td>수입신고 수리일부터 <b>6개월 이내<\/b>에 보세구역에 반입했다가 수출<\/td><\/tr>\n<tr><td><b>기본 서류<\/b><\/td><td>환급신청서 · 수입신고필증 · 수출신고필증<\/td><\/tr>\n<tr><td><b>접수처<\/b><\/td><td><b>전국 세관 어디서나<\/b> 세관장에게 제출<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 수출신고를 못 했어도 포기하지 마세요<\/b><p style=\"margin:8px 0 0\">개인 반품은 대개 <b>정식 수출신고 없이<\/b> 그냥 국제택배로 돌려보냅니다. 관세청은 이런 현실을 반영해 <b>증빙서류를 넓게 인정하는 지침<\/b>을 시행하고 있습니다. <b>수출신고가격 200만 원 이하<\/b>인 해외직구 물품이라면 <b>수출신고 없이 반품했더라도<\/b>, <b>물품 송품장·반품 확인서류·환불 영수자료<\/b> 등으로 원래 판매자에게 반품된 사실이 확인되면 <b>환급 대상으로 인정<\/b>됩니다.<\/p><\/div>\n<p>그러니 반품할 때는 <b>반품 접수 화면 캡처, 반송 운송장, 환불 내역<\/b>을 반드시 남겨 두세요. 이 세 가지가 <b>환급 신청의 증빙<\/b>이 됩니다. 참고로 <b>부가가치세<\/b> 부분은 환급 절차가 달라, 정확한 처리 범위는 <b>관세청 「직구반품 환급 가이드」<\/b>와 세관 상담으로 확인하는 것이 안전합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">10. 자주 묻는 질문<\/h2>\n<h3>Q. 150달러는 배송비 포함인가요, 아닌가요?<\/h3>\n<p><b>면세인지 가릴 때는 국제배송비를 빼고<\/b> 봅니다(명백히 구분되는 경우). 다만 <b>발송 국가 안에서 발생한 현지 세금·내륙운임<\/b>은 물품가격에 포함됩니다. 그리고 <b>일단 과세로 넘어가면 세금 계산에는 국제배송비가 더해집니다.<\/b> 2번 항목의 표를 다시 보세요.<\/p>\n<h3>Q. 여러 개를 한 번에 사면 무조건 합산인가요?<\/h3>\n<p>아닙니다. <b>같은 판매자에게 같은 날 산 것을 나눠 받는 경우<\/b>가 합산 대상이고, <b>다른 판매자에게 샀거나 다른 날 산 물건은 같은 날 도착해도 합산하지 않습니다<\/b>(2022년 11월 17일 시행). 다만 <b>면세를 노려 반복적으로 쪼개는 형태<\/b>는 별개로 판단될 수 있습니다.<\/p>\n<h3>Q. 관세율은 어디서 보나요?<\/h3>\n<p>품목(HS코드)마다 다릅니다. 본문 계산은 <b>13%를 가정<\/b>한 예시일 뿐이므로, 실제 금액은 <b>관세청 '해외직구물품 예상세액 조회'<\/b>에 품목과 금액을 넣어 확인하세요. 아래 공식 링크에 있습니다.<\/p>\n<h3>Q. 개인통관고유부호는 가족 것을 같이 써도 되나요?<\/h3>\n<p>안 됩니다. <b>물건을 받는 사람 본인의 부호<\/b>여야 합니다. 가족 명의를 빌려 쓰면 <b>명의도용에 해당<\/b>할 수 있고, 문제가 생겼을 때 <b>책임이 명의자에게<\/b> 갑니다.<\/p>\n<h3>Q. 내 부호 만료일은 어떻게 확인하나요?<\/h3>\n<p><b>유니패스에서 본인인증 후 조회<\/b>하면 됩니다. 발표된 기준으로는 <b>2026년 이후 신규 발급은 발급일부터 1년<\/b>, <b>그 이전 발급자는 2027년 본인 생일<\/b>이 만료일입니다. 시행 시점의 세부 운영은 바뀔 수 있으니 <b>화면에 표시된 내 만료일<\/b>을 기준으로 삼으세요.<\/p>\n<h3>Q. 세금을 안 내고 버티면 어떻게 되나요?<\/h3>\n<p>물건이 <b>통관되지 않습니다.<\/b> 일정 기간이 지나면 <b>반송되거나 국고 귀속·폐기<\/b> 절차로 갈 수 있습니다. 예상보다 세금이 많이 나왔다면 <b>받지 않고 반품하는 선택<\/b>이 더 나을 수도 있으니, 금액을 미리 계산해 보는 것이 최선입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec11\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 관세청 (공식)<\/b><a href=\"https://www.customs.go.kr/kcs/cm/cntnts/cntntsView.do?mi=2821&amp;cntntsId=819\" target=\"_blank\" rel=\"nofollow\">▸ 관세청 — 특송물품 통관(목록통관·간이신고 기준, 배제 품목)<\/a><a href=\"https://www.customs.go.kr/kcs/ad/tax/BuyTaxCalculation.do\" target=\"_blank\" rel=\"nofollow\">▸ 관세청 — 해외직구물품 예상세액 조회<\/a><a href=\"https://unipass.customs.go.kr/csp/persIndex.do\" target=\"_blank\" rel=\"nofollow\">▸ 관세청 유니패스 — 개인통관고유부호 발급·조회·갱신·도용신고<\/a><a href=\"https://www.customs.go.kr/kcs/cm/cntnts/cntntsView.do?mi=2836&amp;cntntsId=828\" target=\"_blank\" rel=\"nofollow\">▸ 관세청 — 해외직구물품 관세환급(반품 시)<\/a><a href=\"https://www.customs.go.kr/kcs/ad/cntnts/cntntsView.do?mi=10220&amp;cntntsId=10220\" target=\"_blank\" rel=\"nofollow\">▸ 관세청 — 해외직구 여기로(통관정보조회·반품 환급 가이드)<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">기억할 것은 다섯입니다. <b>①<\/b> 면세 기준은 <b>물품가격 150달러(미국 발송 200달러)<\/b>이고, 넘으면 <b>초과분이 아니라 전체<\/b>에 세금이 붙습니다. <b>②<\/b> 면세 판정에서는 빠지던 <b>국제배송비가, 과세로 넘어가면 세금 계산에 더해집니다.<\/b> <b>③<\/b> <b>건강기능식품·화장품·식품<\/b>은 목록통관에서 빠지므로 <b>다른 물건과 같은 주문에 담지 마세요.<\/b> <b>④<\/b> \"같은 날 도착=합산과세\"는 <b>2022년 11월 17일부로 폐지<\/b>됐습니다. <b>⑤<\/b> <b>2026년부터 개인통관고유부호에 유효기간(1년)<\/b>이 생겼습니다. 큰 세일을 앞두고 <b>유니패스에서 만료일과 등록 정보부터 확인<\/b>하는 것이 올해 새로 생긴 준비물입니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, <b>통관 기준 금액·관세율·부호 운영 방식은 고시 개정에 따라 바뀔 수 있습니다.<\/b> 본문의 세금 계산은 <b>관세율 13%·환율 1달러 1,400원을 가정<\/b>한 예시로, <b>실제 세액은 품목(HS코드)과 통관 시점 환율에 따라 달라집니다.<\/b> 주문 전 <b>관세청 해외직구물품 예상세액 조회<\/b>로 본인 물품 기준을 확인하세요. 개인통관고유부호 유효기간은 <b>관세청 고시 개정(2024년 6월 18일 시행) 발표 내용<\/b>을 정리한 것으로, <b>본인 만료일은 유니패스 화면 표시를 기준<\/b>으로 삼으시기 바랍니다.<br>출처: 관세청 「특송물품 통관」 안내, 관세청 보도자료 「해외직구 물품, 입항일 같아도 합산과세 면제」(2022년 11월 16일 발표·11월 17일 시행), 관세청 「해외직구물품 관세환급」 안내(관세법 제106조의2), 국가법령정보센터 관세법 제30조(과세가격 결정), 관세청 「통관고유부호 및 해외거래처부호 등록·관리에 관한 고시」 개정 내용, 관세청 개인통관고유부호 발급 시스템 이용 FAQ. 관세청 고객지원센터 125<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_942.html\">▸ 면세 한도 총정리 술 담배 향수 입국 면세범위<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_16.html\">▸ 트래블 체크카드 비교 추천 환전 수수료 면제 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/2026_01454503626.html\">▸ 보이스피싱 스미싱 예방법 당했을 때 대처 지급정지 피해환급 총정리<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 통관 기준 금액·배제 품목·합산과세 규정·관세환급 요건은 <b>관세청 공식 안내와 보도자료, 국가법령정보센터 관세법 조문을 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 세액 계산은 가정을 명시한 예시이며 <b>개별 물품의 실제 세액·통관 가부는 관세청 예상세액 조회와 세관 상담으로 확인<\/b>하시기 바랍니다. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 해외직구 면세 기준은 물품가격 150달러(미국 발송은 200달러)입니다. 넘으면 초과분만이 아니라 전체 금액에 세금이 붙어요. 상품값 149달러면 0원인데 151달러면 약 5만 8천 원(관세율 13%·환율 1,400원 가정)이 나옵니다. 2달러 차이로 절벽입니다.\n2. 헷갈리는 진짜 이유는 세관이 두 금액을 본다는 겁니다. 면세인지 가릴 때 쓰는 '물품가격'에서는 국제배송비를 빼지만, 일단 과세로 넘어가면 '과세가격'에 국제배송비가 더해집니다. 그리고 \"같은 날 도착하면 합산과세\"는 2022년 11월 17일부로 폐지됐는데 아직도 많은 글이 옛 규정을 그대로 옮기고 있습니다.\n3. 올해 새로 생긴 준비물이 있습니다. 2026년부터 개인통관고유부호에 유효기간 1년이 적용돼요. 만료 전후 30일 안에 갱신하지 않으면 자동 해지되고, 그러면 물건이 세관에서 멈춥니다. 유니패스에서 만료일과 등록된 주소·전화번호를 미리 확인해 두세요. 이왕 들어간 김에 내 부호로 통관된 내역을 훑어보면 도용도 잡을 수 있습니다.\n"},{"code":"C3-05","title":"노인장기요양 복지용구 급여 신청 방법 품목 연간한도 본인부담금 총정리 (2026 연 160만 원)","lane":"info","thumb":"143_care_device.png","draft":"복지용구급여_글_HTML.txt","facts":"연한도액 160만원=공단부담금+본인부담금 합산·구입+대여 합산·초과분 전액본인(고시 제3조①③) | 🔴적용기간=최초 장기요양인정 유효기간 개시일부터 매 1년(1/1 아님, 고시 제3조②·공단 wbdac05 동일 문구) 확인처=복지용구 급여확인서 '연한도액 적용구간' | 재가급여 월한도액과 별개(공단 표기 '재가급여(복지용구 제외)') 2026.1.
