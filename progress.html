<style>
:root{--bg:#0e1620;--card:#18222e;--card2:#13202d;--line:#26323f;--txt:#e6edf3;--mut:#8a97a6;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:470px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:16px;font-weight:600}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(63,185,80,.16);color:var(--ok)}
.b-warn{background:rgba(210,153,34,.16);color:var(--warn)}
.b-bad{background:rgba(248,81,73,.16);color:var(--bad)}
.sec{font-size:11px;color:var(--mut);letter-spacing:.05em;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
.metrics{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 2px}
/* 채널이 4개가 되어 490px 팝업에서 눌리므로, 좁아지면 2x2로 감싸게 한다 */
.m{flex:1 1 96px;background:var(--card2);border-radius:9px;padding:8px 10px}
.m .l{font-size:11px;color:var(--mut)}
.m .v{font-size:18px;font-weight:600;margin-top:2px}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #243049;font-size:12.5px}
li:last-child{border-bottom:none}
li.on{opacity:.62}
li.on .lbl{text-decoration:line-through}
li svg{width:15px;height:15px;flex:none}
li.on svg{color:var(--ok)}
li.now svg{color:#7fc1ff}
li.wait svg{color:#4a586e}
.num{font-size:11px;color:#6b7a99;width:16px;text-align:right;flex:none}
.who{font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px;flex:none}
.who.ai{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.who.me{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.lbl{font-size:12.5px}
.star{color:#ff8e8e;font-weight:800;margin-left:2px}
.banner{display:none;margin-top:9px;background:#0c3a2c;border:1px solid #1f6b52;color:#06d6a0;border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12.5px}
.banner.show{display:block}
.upd{font-size:11px;color:var(--mut);text-align:right;margin-top:12px}
.agent{background:var(--card2);border-radius:10px;padding:9px 11px;margin-bottom:7px}

.st.active{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.st.uncommitted{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.st.idle{background:#222c3a;color:#6b7a99;border:1px solid #2e3a4a}
.agent .role{font-size:11px;color:var(--mut);margin:3px 0 1px}

.advice .ai:last-child{border-bottom:none}
.advice .ic{flex:none}
.prow{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px dashed #243049;font-size:11.5px}
.prow:last-child{border-bottom:none}
.pcd{color:#7fc1ff;font-weight:700;flex:none;width:46px}
.ptt{flex:1;color:#cdd6e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{background:#3a2f12;color:#ffd166;border-radius:5px;padding:0 5px;font-size:9.5px;flex:none}
.pact{color:#06d6a0;font-size:10px;flex:none;font-weight:700}
.qcard{display:flex;gap:9px;padding:8px;margin:6px 0;background:#141c2c;border:1px solid #243049;border-radius:9px}
.qth{width:78px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:#0d1420}
.qth.none{display:flex;align-items:center;justify-content:center;color:#54627a;font-size:9px;text-align:center;line-height:1.2;border:1px dashed #2a3752}
.qbody{flex:1;min-width:0}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qcode{color:#7fc1ff;font-weight:700;font-size:11.5px}
.qlane{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700}
.qlane.info{background:#12283a;color:#7fc1ff}
.qlane.pop{background:#2f2136;color:#e0a3ff}
.qtitle{color:#e6edf5;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.qmeta{margin-top:4px}
.qdraft{color:#6b7688;font-size:9.5px;margin-left:8px}
.qpv{background:#17324a;color:#7fc1ff;border:1px solid #2a4d6e;border-radius:6px;font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer}
.qpv:hover{background:#1d4463}
.qpv.none{background:none;border:none;color:#54627a;font-weight:400;cursor:default;padding:3px 0}

.qpv-x{background:#243049;color:#cdd6e0;border:none;border-radius:6px;font-size:11px;padding:5px 11px;cursor:pointer;flex:none}

.ch.on{background:#0c3a2c;color:#06d6a0}
.ch.off{background:#3a1216;color:#f0707a}

","body":"■ 제목: 해외직구 관세 목록통관 150달러 기준 개인통관고유부호 갱신 총정리 (2026 합산과세·반품 환급)\n■ 코드후보: D4-06 (생활·행정 > 소비자·환불 — D4-01 공연티켓 환불, D4-02 헬스장 환불과 같은 소비자 갈래)\n■ 트렌드/시즌: 알리·테무·아마존 등 해외직구 이용층이 40~60대까지 확산 · 2026년부터 개인통관고유부호에 유효기간(1년)이 생겨 '갱신 안 하면 직구 정지'라는 새 변수 발생 · 대중 관심사(대형 이커머스) 레인 · 행동요구형(부호 갱신·세금 계산·반품 환급 신청) · dupcheck 🟢 신규 + F3-03(여행자 면세한도)·F1-01(해외여행 준비물) 라이브 본문 실측 대조에서 '직구·목록통관·개인통관고유부호·150' 0건 확인\n■ 카테고리: 생활·행정 (#2EB67D)\n■ 썸네일: thumbs/142_overseas_direct_tax.png (다크) · thumbs_naver/142_overseas_direct_tax.png (라이트)\n■ 원본가치(V0):\n  ① 계산예시 = 150달러 '절벽' 실계산($149 → 0원 vs $151 → 약 5만 8천 원) + 같은 $180이 미국발이면 0원, 중국발이면 약 6만 5천 원\n  ② 함정 = 면세 판정에 쓰는 '물품가격'과 세금 계산에 쓰는 '과세가격'이 서로 다른 금액(국제배송비가 한쪽엔 빠지고 한쪽엔 더해짐)\n  ③ 오정보 정정 = \"같은 날 도착하면 합산과세\" 는 2022년 11월 17일부로 폐지된 규정인데 아직도 대부분의 블로그가 그대로 쓰고 있음\n  ④ 탈락사유 = 목록통관 배제 12품목, 하나만 섞여도 주문 전체가 일반통관으로 넘어감\n  ⑤ 신규 제도 = 2026년부터 개인통관고유부호 유효기간 1년·미갱신 시 자동 해지\n  ⑥ 판단형 비교 = 목록통관 / 간이신고 / 일반신고 세 갈래 구분표\n■ 팩트체크 출처(1차):\n · 관세청 — 특송물품 통관 https://www.customs.go.kr/kcs/cm/cntnts/cntntsView.do?mi=2821&cntntsId=819 (목록통관 $150·미국발 $200, 배제 12품목, 간이신고 $2,000 이하, 물품가격 정의)\n · 관세청 보도자료 — 「해외직구 물품, 입항일 같아도 합산과세 면제」(2022년 11월 16일 발표·11월 17일 시행)\n · 관세청 — 해외직구물품 관세환급 https://www.customs.go.kr/kcs/cm/cntnts/cntntsView.do?mi=2836&cntntsId=828 (관세법 제106조의2, 6개월, 수출신고가격 200만 원 이하 예외)\n · 국가법령정보센터 — 관세법 제30조(과세가격 결정: 실제지급가격 + 운임·보험료 가산)\n · 국가물류통합정보센터(관세청 「통관고유부호 및 해외거래처부호 등록·관리에 관한 고시」 개정, 2024년 6월 18일 시행) — 개인통관고유부호 유효기간 1년, 2026년부터 본격 도입, 만료 전후 30일 미갱신 시 자동 해지\n · 관세청 해외직구물품 예상세액 조회 https://www.customs.go.kr/kcs/ad/tax/BuyTaxCalculation.do\n · 관세청 개인통관고유부호 발급(유니패스) https://unipass.customs.go.kr/csp/persIndex.do\n■ 미확인 → 본문에 수치 안 씀:\n · 품목별 관세율 표 — HS코드별로 갈려 1차 출처에서 전체 확정 불가 → 본문 계산은 \"관세율 13% 가정\"임을 명시하고 예상세액 조회로 유도\n · 건강기능식품·의약품 자가사용 인정 수량(6병 등) — 관세청 공식 페이지에서 확정 못 함 → \"수량 기준이 따로 있다\"로만 처리\n · 환율 — 변동하므로 원화 환산은 1달러 1,400원 가정 어림값임을 명시\n\n[붙여넣는 법] Blogger 글쓰기 → 연필▾ → HTML 보기 → 아래 전체 붙여넣기 → 작성 보기 → 제목 입력 → 라벨(생활행정) → 발행\n--------------------------------------------- 6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#edfaf3;border:1px solid #cceedd;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#1c8c5c;margin-bottom:8px}\n.lsg .rel a{display:block;color:#1f6f4f;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#9aa5a0;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">생활·행정<\/span>\n<p>해외직구는 이제 젊은 사람만 하는 것이 아닙니다. <b>알리·테무·아마존·아이허브<\/b>에서 생활용품과 건강식품을 사는 40~60대가 빠르게 늘었습니다. 그런데 결제까지는 쉬운데 <b>물건이 세관에 걸리는 순간부터가 어렵습니다.<\/b> \"150달러까지 면세\"라는 말은 다들 아는데, <b>딱 그 금액을 조금 넘겼을 때 세금이 얼마나 붙는지<\/b>, <b>배송비는 포함인지 아닌지<\/b>, <b>같은 날 두 개가 도착하면 합쳐서 세금을 매기는지<\/b>는 안내마다 말이 다릅니다. 심지어 <b>인터넷에 널리 퍼진 설명 하나는 이미 몇 해 전에 폐지된 규정<\/b>입니다. 여기에 <b>2026년부터는 개인통관고유부호에 유효기간까지 생겼습니다.<\/b> 이 글에서는 <b>세 갈래 통관 구분, 150달러 절벽 실제 계산, 목록통관에서 빠지는 품목, 합산과세의 진짜 현행 규정, 부호 갱신과 도용 확인, 반품했을 때 세금 돌려받는 법<\/b>까지 관세청 공식 안내 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 내 물건은 어느 갈래로 가나 — 통관 3종 구분<\/a><a href=\"#sec2\">2. 함정 하나 — '물품가격'과 '과세가격'은 다른 금액입니다<\/a><a href=\"#sec3\">3. 150달러 절벽 — 2달러 차이로 5만 원<\/a><a href=\"#sec4\">4. 같은 물건인데 미국발이면 0원, 중국발이면 6만 원<\/a><a href=\"#sec5\">5. 목록통관에서 빠지는 12가지 (하나만 섞여도 전체가 넘어감)<\/a><a href=\"#sec6\">6. \"같은 날 도착하면 합산과세\" — 지금은 아닙니다<\/a><a href=\"#sec7\">7. 2026년부터 개인통관고유부호에 유효기간이 생겼습니다<\/a><a href=\"#sec8\">8. 내 부호가 도용됐는지 확인하는 법<\/a><a href=\"#sec9\">9. 반품했는데 세금은? — 관세 환급 신청<\/a><a href=\"#sec10\">10. 자주 묻는 질문<\/a><a href=\"#sec11\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec3\">👉 150달러 넘겼을 때 세금 실제 계산 보기<\/a>\n\n<h2 id=\"sec1\">1. 내 물건은 어느 갈래로 가나 — 통관 3종 구분<\/h2>\n<p>해외에서 오는 개인 물품은 <b>금액과 품목에 따라 세 갈래<\/b>로 갈립니다. 이 갈래가 정해지면 <b>세금을 내는지, 서류를 내는지, 시간이 얼마나 걸리는지<\/b>가 전부 따라옵니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>기준<\/th><th>세금<\/th><th>내가 할 일<\/th><\/tr>\n<tr><td><b>목록통관<\/b><\/td><td>물품가격 <b>미화 150달러 이하<\/b><br>(<b>미국 발송은 200달러 이하<\/b>)<\/td><td><b>없음<\/b><\/td><td>사실상 없음 — 배송업체가 목록만 제출<\/td><\/tr>\n<tr><td><b>간이수입신고<\/b><\/td><td>150달러 초과 <b>~ 2,000달러 이하<\/b><\/td><td><b>관세 + 부가세<\/b><\/td><td>세액 확인·납부(대개 배송대행·특송업체가 대행)<\/td><\/tr>\n<tr><td><b>일반수입신고<\/b><\/td><td><b>2,000달러 초과<\/b> 또는 목록통관 배제 품목<\/td><td>관세 + 부가세<br>(품목에 따라 추가)<\/td><td>정식 수입신고 — 요건 확인·서류 필요<\/td><\/tr>\n<\/table>\n<p>여기서 <b>가장 많이 오해하는 것이 미국 200달러<\/b>입니다. 이것은 <b>미국에서 발송된 물품에만<\/b> 적용됩니다. 미국 사이트에서 샀더라도 <b>물건이 중국 창고에서 출발했다면 150달러 기준<\/b>이 적용됩니다. 판단 기준은 <b>결제한 쇼핑몰의 국적이 아니라 실제 발송 국가<\/b>입니다.<\/p>\n<div class=\"tip\"><b>💡 \"면세\"는 세금만 면제된다는 뜻입니다<\/b><p style=\"margin:8px 0 0\">목록통관 대상이라도 <b>통관 자체가 면제되는 것은 아닙니다.<\/b> 세관은 여전히 목록을 보고 <b>반입이 금지·제한된 물품인지<\/b>를 확인합니다. 금액이 작아도 <b>통관이 보류되거나 폐기될 수 있는 물품<\/b>은 존재합니다(5번 항목 참고).<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 함정 하나 — '물품가격'과 '과세가격'은 다른 금액입니다<\/h2>\n<p>직구 세금 계산이 헷갈리는 <b>진짜 이유<\/b>가 여기 있습니다. 세관은 <b>두 번, 서로 다른 금액<\/b>을 봅니다. 이걸 하나로 뭉뚱그려 이해하면 계산이 반드시 어긋납니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>언제 쓰나<\/th><th>국제배송비·보험료<\/th><\/tr>\n<tr><td><b>물품가격<\/b><\/td><td><b>면세인지 아닌지<\/b>를 가릴 때<br>(150달러·200달러 판정)<\/td><td><b>제외<\/b> — 명백히 구분되면 빼고 봅니다<\/td><\/tr>\n<tr><td><b>과세가격<\/b><\/td><td><b>세금을 얼마 매길지<\/b> 계산할 때<\/td><td><b>포함<\/b> — 우리나라 항구·공항까지 오는 운임과 보험료를 더합니다<\/td><\/tr>\n<\/table>\n<p>관세청 안내는 <b>물품가격<\/b>을 \"물품대금에 <b>발송국가 안에서 발생한 세금·내륙운임·보험료 등 제비용<\/b>을 포함한 금액\"으로 설명하면서, <b>우리나라로 오는 국제운송비와 보험료는 명백히 구분할 수 있으면 제외<\/b>할 수 있다고 밝히고 있습니다. 반면 세금을 매기는 <b>과세가격<\/b>은 관세법 제30조에 따라 <b>실제로 지급한 가격에 수입항까지의 운임·보험료를 가산<\/b>해 정합니다.<\/p>\n<div class=\"warn\"><b>⚠️ 그래서 이런 일이 생깁니다<\/b><p style=\"margin:8px 0 0\">상품값 <b>149달러<\/b> + 국제배송비 <b>20달러<\/b>를 결제했다면, <b>면세 판정은 149달러로 보므로 세금이 없습니다.<\/b> 그런데 상품값이 <b>151달러<\/b>가 되는 순간 판정이 뒤집히고, <b>이때 세금은 151달러가 아니라 배송비를 더한 171달러를 기준으로<\/b> 매겨집니다. <b>한쪽에서는 빼던 배송비가, 넘어가는 순간 더해집니다.<\/b> 아슬아슬한 금액에서 \"배송비는 어차피 안 친다\"고 안심하면 안 되는 이유입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 150달러 절벽 — 2달러 차이로 5만 원<\/h2>\n<p>150달러를 넘으면 <b>넘은 금액에만<\/b> 세금이 붙는 것이 아닙니다. <b>전체 금액에<\/b> 붙습니다. 그래서 이 구간은 완만한 언덕이 아니라 <b>절벽<\/b>입니다. 실제로 계산해 보겠습니다.<\/p>\n<div class=\"tip\"><b>🔢 계산 공식<\/b><p style=\"margin:8px 0 0\"><b>관세 = 과세가격 × 품목별 관세율<\/b><br><b>부가가치세 = (과세가격 + 관세) × 10%<\/b><br>→ <b>총 세금 = 관세 + 부가세<\/b><br><span style=\"font-size:14px;color:#557\">※ 아래 표는 <b>관세율 13%, 환율 1달러 1,400원을 가정<\/b>한 계산입니다. 관세율은 품목마다 다르므로 실제 금액은 반드시 관세청 예상세액 조회로 확인하세요.<\/span><\/p><\/div>\n<table>\n<tr><th>구분<\/th><th>A: 상품 149달러<\/th><th>B: 상품 151달러<\/th><\/tr>\n<tr><td>국제배송비<\/td><td>20달러<\/td><td>20달러<\/td><\/tr>\n<tr><td><b>면세 판정 기준(물품가격)<\/b><\/td><td>149달러 → <b>면세<\/b><\/td><td>151달러 → <b>과세<\/b><\/td><\/tr>\n<tr><td><b>세금 계산 기준(과세가격)<\/b><\/td><td>—<\/td><td><b>171달러<\/b> (배송비 포함)<\/td><\/tr>\n<tr><td>관세(13% 가정)<\/td><td>0<\/td><td>22.23달러<\/td><\/tr>\n<tr><td>부가세(10%)<\/td><td>0<\/td><td>19.32달러<\/td><\/tr>\n<tr><td><b>총 세금<\/b><\/td><td><b>0원<\/b><\/td><td><b>약 41.55달러 = 약 5만 8천 원<\/b><\/td><\/tr>\n<\/table>\n<p>상품값 차이는 <b>2달러(약 2,800원)<\/b>인데 실제 부담은 <b>약 5만 8천 원<\/b> 벌어집니다. 장바구니가 <b>145~160달러 사이<\/b>에 걸렸다면, <b>물건 하나를 빼서 150달러 아래로 맞추는 편이 거의 언제나 유리<\/b>합니다.<\/p>\n<div class=\"tip\"><b>💡 실전에서 쓰는 방법<\/b><p style=\"margin:8px 0 0\">① <b>장바구니를 두 번에 나눠 주문<\/b>합니다(합산과세는 6번 항목에서 설명하듯 지금은 조건이 좁습니다). ② <b>쿠폰·할인은 적용 후 금액<\/b>이 기준이므로, 할인 코드를 넣어 150달러 아래로 떨어지면 그대로 면세입니다. ③ 애매하면 <b>관세청 예상세액 조회<\/b>에 품목과 금액을 넣어 미리 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 같은 물건인데 미국발이면 0원, 중국발이면 6만 원<\/h2>\n<p>1번 표의 <b>미국 200달러 예외<\/b>가 실제로 얼마나 큰 차이인지 보겠습니다. <b>똑같은 180달러짜리 물건<\/b>을 산 두 사람의 결과입니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>미국에서 발송<\/th><th>중국·유럽 등에서 발송<\/th><\/tr>\n<tr><td>상품값<\/td><td>180달러<\/td><td>180달러<\/td><\/tr>\n<tr><td>면세 기준<\/td><td><b>200달러 이하<\/b><\/td><td><b>150달러 이하<\/b><\/td><\/tr>\n<tr><td>판정<\/td><td><b>목록통관 · 면세<\/b><\/td><td><b>과세 대상<\/b><\/td><\/tr>\n<tr><td>과세가격(배송비 10달러 가정)<\/td><td>—<\/td><td>190달러<\/td><\/tr>\n<tr><td><b>총 세금(관세 13% 가정)<\/b><\/td><td><b>0원<\/b><\/td><td><b>약 46.17달러 = 약 6만 5천 원<\/b><\/td><\/tr>\n<\/table>\n<p>그래서 <b>같은 제품을 미국 셀러와 다른 나라 셀러가 비슷한 값에 팔고 있다면<\/b>, 150~200달러 구간에서는 <b>미국 발송이 사실상 6만 원가량 싼 셈<\/b>이 됩니다. 상품 페이지에서 <b>\"Ships from\"(발송지)<\/b>을 확인하는 습관이 곧 돈입니다.<\/p>\n<div class=\"warn\"><b>⚠️ 미국 사이트 ≠ 미국 발송<\/b><p style=\"margin:8px 0 0\">대형 쇼핑몰은 <b>같은 상품이라도 판매자에 따라 발송 창고가 다릅니다.<\/b> 미국 아마존에서 샀는데 <b>중국 셀러가 중국에서 직접 보내는 경우<\/b>가 흔합니다. 이때는 <b>150달러 기준<\/b>이 적용됩니다. 배송대행지(배대지)를 거쳐 미국에서 출발했다면 미국 발송으로 봅니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 목록통관에서 빠지는 12가지 (하나만 섞여도 전체가 넘어감)<\/h2>\n<p>금액이 150달러 아래여도 <b>품목 자체가 목록통관에서 배제<\/b>되면 간이수입신고로 넘어갑니다. 관세청이 안내하는 <b>배제 대상<\/b>은 다음과 같습니다.<\/p>\n<ol>\n<li><b>의약품<\/b><\/li>\n<li><b>한약재<\/b><\/li>\n<li><b>야생동물 관련 제품<\/b><\/li>\n<li><b>농림축수산물 등 검역대상 물품<\/b><\/li>\n<li><b>건강기능식품<\/b><\/li>\n<li><b>지식재산권 위반 의심물품<\/b> (가짜 명품 등)<\/li>\n<li><b>식품류·주류·담배류<\/b><\/li>\n<li><b>특정 화장품<\/b> — 기능성화장품, 태반 함유 화장품, 스테로이드제 함유 화장품, 성분 미상 등 유해 우려 화장품<\/li>\n<li><b>선하증권(B/L) 정정 물품<\/b><\/li>\n<li><b>통관목록 중 품명·규격·수량 등이 부정확하게 기재된 물품<\/b><\/li>\n<li><b>방송통신기자재 등<\/b><\/li>\n<li><b>그 밖에 법령에 따라 통관이 제한되는 물품<\/b><\/li>\n<\/ol>\n<div class=\"warn\"><b>⚠️ 가장 아픈 함정 — '섞임'<\/b><p style=\"margin:8px 0 0\">한 상자에 <b>티셔츠 3장(목록통관 가능)<\/b>과 <b>비타민 한 통(건강기능식품 = 배제)<\/b>이 함께 들어 있으면, <b>그 상자 전체가 목록통관에서 빠집니다.<\/b> 총액이 150달러 아래여도 <b>간이수입신고 절차<\/b>를 밟게 되고, 통관이 며칠 늦어지며 서류를 요구받을 수 있습니다. <b>건강식품·화장품·식품은 다른 물건과 같은 주문에 담지 않는 것<\/b>이 안전합니다.<\/p><\/div>\n<p>또한 <b>건강기능식품·의약품<\/b>은 금액과 별개로 <b>개인이 스스로 쓰는 양(자가사용 인정기준)에 수량 한도<\/b>가 정해져 있습니다. 이를 넘기면 <b>정식 수입 요건<\/b>을 요구받거나 반송될 수 있으므로, <b>여러 통을 한꺼번에 주문하기 전<\/b>에 관세청 고객지원센터(125)나 공식 안내로 확인하는 편이 확실합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. \"같은 날 도착하면 합산과세\" — 지금은 아닙니다<\/h2>\n<p>직구 커뮤니티에서 가장 자주 보이는 조언이 <b>\"같은 날 도착하면 합쳐서 세금 매기니 날짜를 벌려 주문해라\"<\/b>입니다. <b>이 규정은 이미 폐지됐습니다.<\/b><\/p>\n<p>관세청은 <b>2022년 11월 16일<\/b> 「해외직구 물품, 입항일 같아도 합산과세 면제」를 발표하고 <b>다음 날인 11월 17일부터 시행<\/b>했습니다. <b>수입통관 사무처리에 관한 고시<\/b>의 관련 규정을 정비해, <b>다른 해외공급자에게서 구매했거나 같은 공급자라도 다른 날짜에 구매한 물품<\/b>은 <b>입항일이 같아도 합산하지 않도록<\/b> 바꾼 것입니다.<\/p>\n<table>\n<tr><th>상황<\/th><th>예전(2022년 11월 16일까지)<\/th><th>지금<\/th><\/tr>\n<tr><td>A몰·B몰에서 따로 사서 <b>같은 날 도착<\/b><\/td><td><b>합산<\/b>해서 과세<\/td><td><b>합산 안 함<\/b> — 각각 판정<\/td><\/tr>\n<tr><td>같은 몰에서 <b>다른 날 주문<\/b>했는데 같은 날 도착<\/td><td><b>합산<\/b>해서 과세<\/td><td><b>합산 안 함<\/b><\/td><\/tr>\n<tr><td>같은 몰에서 <b>같은 날 주문<\/b>한 것이 나눠 배송<\/td><td>합산<\/td><td><b>합산 대상으로 남습니다<\/b><\/td><\/tr>\n<\/table>\n<p>정리하면 <b>\"도착일이 겹치는 것\" 자체는 더 이상 문제가 아닙니다.<\/b> 남아 있는 것은 <b>사실상 한 건의 주문을 쪼갠 경우<\/b>입니다. 하나의 운송장으로 들어온 물품을 <b>면세 범위에 맞춰 나눠 신고하는 것<\/b>도 마찬가지로 합산 대상입니다.<\/p>\n<div class=\"tip\"><b>💡 그래도 지켜야 할 선<\/b><p style=\"margin:8px 0 0\">규정이 완화됐다고 <b>한 번에 살 물건을 149달러씩 여러 건으로 쪼개 반복 주문<\/b>하면, 이는 <b>소액면세를 노린 분할 수입<\/b>으로 볼 수 있습니다. <b>자가사용 범위를 넘는 반복·대량 구매<\/b>는 판매용으로 판단돼 정식 수입 절차 대상이 될 수 있습니다. <b>실제로 내가 쓸 만큼<\/b>이라는 선만 지키면 됩니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 2026년부터 개인통관고유부호에 유효기간이 생겼습니다<\/h2>\n<p>해외직구를 하려면 <b>개인통관고유부호<\/b>(주민등록번호 대신 쓰는 통관용 번호)가 필요합니다. 지금까지는 <b>한 번 받으면 계속 썼습니다.<\/b> 그런데 관세청이 <b>「통관고유부호 및 해외거래처부호 등록·관리에 관한 고시」를 개정(2024년 6월 18일 시행)<\/b>하면서 <b>유효기간 1년<\/b>이 도입됐고, 전산 준비를 거쳐 <b>2026년부터 본격 적용<\/b>됩니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>만료일<\/th><th>해야 할 일<\/th><\/tr>\n<tr><td><b>2026년 이후 새로 발급<\/b><\/td><td>발급일부터 <b>1년<\/b><\/td><td>매년 갱신<\/td><\/tr>\n<tr><td><b>그 전에 발급받아 쓰던 부호<\/b><\/td><td><b>2027년 본인 생일<\/b><\/td><td>그때까지 갱신<\/td><\/tr>\n<\/table>\n<div class=\"warn\"><b>⚠️ 갱신을 놓치면 부호가 사라집니다<\/b><p style=\"margin:8px 0 0\">발표된 내용에 따르면 <b>만료일 전후 30일 안에 갱신하지 않으면 그 개인통관고유부호는 자동 해지<\/b>됩니다. 해지된 번호로는 통관이 진행되지 않으므로, <b>물건이 세관에서 멈추고 배송이 지연<\/b>됩니다. 주문 직전에 급히 처리하면 이미 늦을 수 있으니, <b>큰 세일(블랙프라이데이 등)을 앞두고는 미리 확인<\/b>해 두세요.<\/p><\/div>\n<p>갱신은 <b>관세청 전자통관시스템(유니패스) 누리집에서 온라인으로<\/b> 하거나 <b>가까운 세관을 방문<\/b>해 처리합니다. 오래전에 발급받았다면 <b>등록된 이름·휴대전화번호·주소가 지금과 같은지<\/b>도 함께 확인하는 것이 좋습니다. 관세청은 부호 도용을 막기 위해 <b>이름·전화번호에 더해 우편번호까지 대조하는 검증<\/b>을 시행하고 있어, <b>옛 주소가 남아 있으면 주문이 막힐 수 있습니다.<\/b><\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 내 부호가 도용됐는지 확인하는 법<\/h2>\n<p>개인통관고유부호는 <b>남이 자기 물건을 들여오면서 내 번호를 갖다 쓰는<\/b> 도용 사고가 꾸준히 있습니다. 내가 산 적 없는 물건이 내 이름으로 통관되면 <b>나중에 세금·법적 책임 문제로 번질 수 있습니다.<\/b> 확인은 어렵지 않습니다.<\/p>\n<ol>\n<li><b>유니패스에 접속<\/b>합니다(개인통관고유부호 발급·조회 화면).<\/li>\n<li><b>본인인증<\/b> 후 <b>해외직구 통관정보조회<\/b>에서 <b>내 부호로 통관된 내역<\/b>을 확인합니다.<\/li>\n<li>기억에 없는 건이 보이면 <b>[개인통관고유부호 도용신고]<\/b>로 접수합니다.<\/li>\n<li>필요하면 <b>부호 사용정지<\/b> 또는 <b>재발급<\/b>으로 번호를 바꿉니다.<\/li>\n<\/ol>\n<div class=\"tip\"><b>💡 도용을 막는 생활 습관<\/b><p style=\"margin:8px 0 0\">① <b>구매대행·배송대행 업체 외에 개인에게 부호를 알려주지 않습니다.<\/b> ② <b>\"통관이 보류됐으니 부호를 알려달라\"는 문자·카톡은 의심<\/b>하세요. 관세청은 문자로 부호를 요구하지 않습니다. ③ 반기에 한 번 <b>통관 내역을 훑어보는 것<\/b>만으로도 대부분 조기에 잡힙니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 반품했는데 세금은? — 관세 환급 신청<\/h2>\n<p>세금을 내고 받은 물건이 <b>사이즈가 안 맞거나 불량이라 반품<\/b>했다면, <b>낸 관세를 돌려받을 수 있습니다.<\/b> 많은 분이 모르고 그냥 넘깁니다.<\/p>\n<table>\n<tr><th>항목<\/th><th>내용<\/th><\/tr>\n<tr><td><b>근거<\/b><\/td><td>관세법 <b>제106조의2 제1항<\/b> — 개인의 자가사용물품을 수입한 상태 그대로 수출하는 경우<\/td><\/tr>\n<tr><td><b>기한<\/b><\/td><td>수입신고 수리일부터 <b>6개월 이내<\/b>에 보세구역에 반입했다가 수출<\/td><\/tr>\n<tr><td><b>기본 서류<\/b><\/td><td>환급신청서 · 수입신고필증 · 수출신고필증<\/td><\/tr>\n<tr><td><b>접수처<\/b><\/td><td><b>전국 세관 어디서나<\/b> 세관장에게 제출<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 수출신고를 못 했어도 포기하지 마세요<\/b><p style=\"margin:8px 0 0\">개인 반품은 대개 <b>정식 수출신고 없이<\/b> 그냥 국제택배로 돌려보냅니다. 관세청은 이런 현실을 반영해 <b>증빙서류를 넓게 인정하는 지침<\/b>을 시행하고 있습니다. <b>수출신고가격 200만 원 이하<\/b>인 해외직구 물품이라면 <b>수출신고 없이 반품했더라도<\/b>, <b>물품 송품장·반품 확인서류·환불 영수자료<\/b> 등으로 원래 판매자에게 반품된 사실이 확인되면 <b>환급 대상으로 인정<\/b>됩니다.<\/p><\/div>\n<p>그러니 반품할 때는 <b>반품 접수 화면 캡처, 반송 운송장, 환불 내역<\/b>을 반드시 남겨 두세요. 이 세 가지가 <b>환급 신청의 증빙<\/b>이 됩니다. 참고로 <b>부가가치세<\/b> 부분은 환급 절차가 달라, 정확한 처리 범위는 <b>관세청 「직구반품 환급 가이드」<\/b>와 세관 상담으로 확인하는 것이 안전합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">10. 자주 묻는 질문<\/h2>\n<h3>Q. 150달러는 배송비 포함인가요, 아닌가요?<\/h3>\n<p><b>면세인지 가릴 때는 국제배송비를 빼고<\/b> 봅니다(명백히 구분되는 경우). 다만 <b>발송 국가 안에서 발생한 현지 세금·내륙운임<\/b>은 물품가격에 포함됩니다. 그리고 <b>일단 과세로 넘어가면 세금 계산에는 국제배송비가 더해집니다.<\/b> 2번 항목의 표를 다시 보세요.<\/p>\n<h3>Q. 여러 개를 한 번에 사면 무조건 합산인가요?<\/h3>\n<p>아닙니다. <b>같은 판매자에게 같은 날 산 것을 나눠 받는 경우<\/b>가 합산 대상이고, <b>다른 판매자에게 샀거나 다른 날 산 물건은 같은 날 도착해도 합산하지 않습니다<\/b>(2022년 11월 17일 시행). 다만 <b>면세를 노려 반복적으로 쪼개는 형태<\/b>는 별개로 판단될 수 있습니다.<\/p>\n<h3>Q. 관세율은 어디서 보나요?<\/h3>\n<p>품목(HS코드)마다 다릅니다. 본문 계산은 <b>13%를 가정<\/b>한 예시일 뿐이므로, 실제 금액은 <b>관세청 '해외직구물품 예상세액 조회'<\/b>에 품목과 금액을 넣어 확인하세요. 아래 공식 링크에 있습니다.<\/p>\n<h3>Q. 개인통관고유부호는 가족 것을 같이 써도 되나요?<\/h3>\n<p>안 됩니다. <b>물건을 받는 사람 본인의 부호<\/b>여야 합니다. 가족 명의를 빌려 쓰면 <b>명의도용에 해당<\/b>할 수 있고, 문제가 생겼을 때 <b>책임이 명의자에게<\/b> 갑니다.<\/p>\n<h3>Q. 내 부호 만료일은 어떻게 확인하나요?<\/h3>\n<p><b>유니패스에서 본인인증 후 조회<\/b>하면 됩니다. 발표된 기준으로는 <b>2026년 이후 신규 발급은 발급일부터 1년<\/b>, <b>그 이전 발급자는 2027년 본인 생일<\/b>이 만료일입니다. 시행 시점의 세부 운영은 바뀔 수 있으니 <b>화면에 표시된 내 만료일<\/b>을 기준으로 삼으세요.<\/p>\n<h3>Q. 세금을 안 내고 버티면 어떻게 되나요?<\/h3>\n<p>물건이 <b>통관되지 않습니다.<\/b> 일정 기간이 지나면 <b>반송되거나 국고 귀속·폐기<\/b> 절차로 갈 수 있습니다. 예상보다 세금이 많이 나왔다면 <b>받지 않고 반품하는 선택<\/b>이 더 나을 수도 있으니, 금액을 미리 계산해 보는 것이 최선입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec11\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 관세청 (공식)<\/b><a href=\"https://www.customs.go.kr/kcs/cm/cntnts/cntntsView.do?mi=2821&amp;cntntsId=819\" target=\"_blank\" rel=\"nofollow\">▸ 관세청 — 특송물품 통관(목록통관·간이신고 기준, 배제 품목)<\/a><a href=\"https://www.customs.go.kr/kcs/ad/tax/BuyTaxCalculation.do\" target=\"_blank\" rel=\"nofollow\">▸ 관세청 — 해외직구물품 예상세액 조회<\/a><a href=\"https://unipass.customs.go.kr/csp/persIndex.do\" target=\"_blank\" rel=\"nofollow\">▸ 관세청 유니패스 — 개인통관고유부호 발급·조회·갱신·도용신고<\/a><a href=\"https://www.customs.go.kr/kcs/cm/cntnts/cntntsView.do?mi=2836&amp;cntntsId=828\" target=\"_blank\" rel=\"nofollow\">▸ 관세청 — 해외직구물품 관세환급(반품 시)<\/a><a href=\"https://www.customs.go.kr/kcs/ad/cntnts/cntntsView.do?mi=10220&amp;cntntsId=10220\" target=\"_blank\" rel=\"nofollow\">▸ 관세청 — 해외직구 여기로(통관정보조회·반품 환급 가이드)<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">기억할 것은 다섯입니다. <b>①<\/b> 면세 기준은 <b>물품가격 150달러(미국 발송 200달러)<\/b>이고, 넘으면 <b>초과분이 아니라 전체<\/b>에 세금이 붙습니다. <b>②<\/b> 면세 판정에서는 빠지던 <b>국제배송비가, 과세로 넘어가면 세금 계산에 더해집니다.<\/b> <b>③<\/b> <b>건강기능식품·화장품·식품<\/b>은 목록통관에서 빠지므로 <b>다른 물건과 같은 주문에 담지 마세요.<\/b> <b>④<\/b> \"같은 날 도착=합산과세\"는 <b>2022년 11월 17일부로 폐지<\/b>됐습니다. <b>⑤<\/b> <b>2026년부터 개인통관고유부호에 유효기간(1년)<\/b>이 생겼습니다. 큰 세일을 앞두고 <b>유니패스에서 만료일과 등록 정보부터 확인<\/b>하는 것이 올해 새로 생긴 준비물입니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, <b>통관 기준 금액·관세율·부호 운영 방식은 고시 개정에 따라 바뀔 수 있습니다.<\/b> 본문의 세금 계산은 <b>관세율 13%·환율 1달러 1,400원을 가정<\/b>한 예시로, <b>실제 세액은 품목(HS코드)과 통관 시점 환율에 따라 달라집니다.<\/b> 주문 전 <b>관세청 해외직구물품 예상세액 조회<\/b>로 본인 물품 기준을 확인하세요. 개인통관고유부호 유효기간은 <b>관세청 고시 개정(2024년 6월 18일 시행) 발표 내용<\/b>을 정리한 것으로, <b>본인 만료일은 유니패스 화면 표시를 기준<\/b>으로 삼으시기 바랍니다.<br>출처: 관세청 「특송물품 통관」 안내, 관세청 보도자료 「해외직구 물품, 입항일 같아도 합산과세 면제」(2022년 11월 16일 발표·11월 17일 시행), 관세청 「해외직구물품 관세환급」 안내(관세법 제106조의2), 국가법령정보센터 관세법 제30조(과세가격 결정), 관세청 「통관고유부호 및 해외거래처부호 등록·관리에 관한 고시」 개정 내용, 관세청 개인통관고유부호 발급 시스템 이용 FAQ. 관세청 고객지원센터 125<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_942.html\">▸ 면세 한도 총정리 술 담배 향수 입국 면세범위<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_16.html\">▸ 트래블 체크카드 비교 추천 환전 수수료 면제 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/2026_01454503626.html\">▸ 보이스피싱 스미싱 예방법 당했을 때 대처 지급정지 피해환급 총정리<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 통관 기준 금액·배제 품목·합산과세 규정·관세환급 요건은 <b>관세청 공식 안내와 보도자료, 국가법령정보센터 관세법 조문을 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 세액 계산은 가정을 명시한 예시이며 <b>개별 물품의 실제 세액·통관 가부는 관세청 예상세액 조회와 세관 상담으로 확인<\/b>하시기 바랍니다. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 해외직구 면세 기준은 물품가격 150달러(미국 발송은 200달러)입니다. 넘으면 초과분만이 아니라 전체 금액에 세금이 붙어요. 상품값 149달러면 0원인데 151달러면 약 5만 8천 원(관세율 13%·환율 1,400원 가정)이 나옵니다. 2달러 차이로 절벽입니다.\n2. 헷갈리는 진짜 이유는 세관이 두 금액을 본다는 겁니다. 면세인지 가릴 때 쓰는 '물품가격'에서는 국제배송비를 빼지만, 일단 과세로 넘어가면 '과세가격'에 국제배송비가 더해집니다. 그리고 \"같은 날 도착하면 합산과세\"는 2022년 11월 17일부로 폐지됐는데 아직도 많은 글이 옛 규정을 그대로 옮기고 있습니다.\n3. 올해 새로 생긴 준비물이 있습니다. 2026년부터 개인통관고유부호에 유효기간 1년이 적용돼요. 만료 전후 30일 안에 갱신하지 않으면 자동 해지되고, 그러면 물건이 세관에서 멈춥니다. 유니패스에서 만료일과 등록된 주소·전화번호를 미리 확인해 두세요. 이왕 들어간 김에 내 부호로 통관된 내역을 훑어보면 도용도 잡을 수 있습니다.\n"},{"code":"C3-05","title":"노인장기요양 복지용구 급여 신청 방법 품목 연간한도 본인부담금 총정리 (2026 연 160만 원)","lane":"info","thumb":"143_care_device.png","draft":"복지용구급여_글_HTML.txt","facts":"연한도액 160만원=공단부담금+본인부담금 합산·구입+대여 합산·초과분 전액본인(고시 제3조①③) | 🔴적용기간=최초 장기요양인정 유효기간 개시일부터 매 1년(1/1 아님, 고시 제3조②·공단 wbdac05 동일 문구) 확인처=복지용구 급여확인서 '연한도액 적용구간' | 재가급여 월한도액과 별개(공단 표기 '재가급여(복지용구 제외)') 2026.1.1 기준 1등급 2,512,900/2등급 2,331,200/3등급 1,528,200/4등급 1,409,700/5등급 1,208,900/인지지원 676,320 | 본인부담률 재가 15%(법 제40조)·40%감경 9%(보험료순위 25%초과~50%이하)·60%감경 6%(0~25%이하, 차상위 희귀난치·만성질환 포함)·의료급여수급자 면제. 감경기준표 적용 2026.2~2027.1, 공단 직권적용·신청 시 14일내 통보 | 별표2 품목표: 구입=이동변기5년1·목욕의자5년1·성인용보행기5년2·안전손잡이-10·미끄럼방지양말-6켤레·매트/액-5·간이변기-2·지팡이2년1·욕창예방방석3년1·자세변환용구-5·요실금팬티-4 / 대여=수동휠체어5년·전동침대10년·수동침대10년·이동욕조5년·목욕리프트3년·배회감지기5년 각1 / 구입또는대여=욕창예방매트리스3년1·경사로 실외용(대여)8년1·실내용(구입)2년6 | 용어변경 '내구연한'→'사용가능햇수'(2024.12.16) | 전동침대·수동침대=동일품목 / 구입·대여 동시불가(경사로만 실내구입+실외대여 예외) / 연장대여 1/2 범위 / 훼손·상태변화시 별지2호 추가급여신청서 | 제한=시설급여 입소기간·의료기관 입원시 침대2종·이동욕조·목욕리프트(15일내 반납)·사업소 외 구매·타법령 중복·별표3 '사용이 불필요' 판정 | 배송비·설치철거비·수리부품비·소독비 별도청구 금지(제6조4호), 대여 월단위·15일미만은 월15일 산정, 사망시 다음날부터 7일 | 출처=보건복지부고시 제2024-253호 전문 PDF 직접열람(mohw list_no=1483908 seq=4)·law.go.kr admRulSeq=2100000250742·longtermcare 504/503·nhis wbdac05 | dupcheck 🟢 / bodydup --live 🟢 0.032(177편 비교) | ⚠️개별 제품가·월대여료는 별도 고시로 수시개정 → 본문 §6은 가정값 명시","added":"2026-07-29","thumb_data":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCY  제1호서식) · 국민건강보험공단 노인장기요양보험 공식 페이지(본인부담금 감경 / 월 한도액 및 급여비용, 2026.1.1. 기준) · 국민건강보험 재원조달 안내 · 인지지원등급의 복지용구 이용 가능 여부는 찾기쉬운 생활법령정보 「장기요양등급별 이용 가능 급여」로 별도 확인(고시가 등급을 열거하지 않아 추론으로 두지 않음)\n■ 용어 주의(발행 시 유지할 것): 2024.12.16. 개정으로 고시 용어가 **\"내구연한\" → \"사용가능햇수\"** 로 바뀌었다. 본문은 현행 용어를 쓰되 검색 수요가 큰 '내구연한'을 병기했다.\n■ 의도적 미기재: 개별 제품의 구입가·월 대여료는 「복지용구 품목별 제품목록 및 급여비용 등에 관한 고시」에서 제품마다 따로 정해져 수시로 바뀌므로 확정 금액을 쓰지 않았다. 계산 사례의 제품 가격은 계산 방식을 보여주기 위한 **가정값**임을 본문에 명시했다.\n■ 미검증으로 제외한 주장: \"복지용구가 23품목\" (일부 요약 사이트) — 현행 고시 [별표2] 급여기준표 실물 확인 결과 구입 11행·대여 6품목·구입또는대여 2품목 체계이며, 품목 수를 단정하지 않고 표를 그대로 제시했다.\n\n[붙여넣는 법] Blogger 글쓰기 → 연필▾ → HTML 보기 → 아래 전체 붙여넣기 → 작성 보기 → 제목 입력 → 라벨(건강) → 발행\n----------------------------------------------------------------\n▼ 본문 HTML\n<div style=\"text-align:center;margin:0 0 18px\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCACIAQQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD2qiiiqJCiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKAIp32R8dTxVOp7s/Mo9qgrOT1N4KyCiiipLCiiigByuyjCsQKKbRRcVkaNFFFbHMc5rviRrK7+x2USSzDG5nPAJ7VR/4SPWg+w2duHwTtIIPHX+KqviXTbm01d71ITLBI4kBC7gD3Bqk18/m7jBPJHtZSsjZPzHPXH8682pVqKbTdj36OGoulFxinp+Jqf8JNrPmPGLOEvGMsAjcfrTv+Ej1rbIws4SsRIchT8uOvesUXtwJppBbnEhPHzcD6jrUp1KYwzxfYgVmZmOQSRn0 zWn1CiiioNQooooAKKKKANGiiitjlGtGjOHZFLL0YjkUiwxLIZFjQOerBRk/jRRTAVUVc7VVcnJwMZp1FFIBrxpIu2RFdfRhkUqqqKFRQqjoAMAUUUALRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABVGZdshH4iiipnsaU9xlFFFZmwUUUUAFFFFAH//Z\" alt=\"노인장기요양 복지용구 급여 신청 방법 품목 연간한도 본인부담금 총정리\" style=\"max-width:100%;height:auto;border-radius:12px\" /><\/div>\n<style>\n.lsg{max-width:720px;margin:0 auto;font-size:17px;line-height:1.85;color:#222;word-break:keep-all}\n.lsg .cat{display:inline-block;background:#E76F51;color:#fff;font-size:13px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:10px}\n.lsg h2{font-size:23px;margin:34px 0 14px;padding-left:12px;border-left:5px solid #E76F51;line-height:1.35}\n.lsg p{margin:0 0 14px}\n.lsg ul,.lsg ol{margin:0 0 16px;padding-left:22px}\n.lsg li{margin:6px 0}\n.lsg h3{font-size:18px;margin:22px 0 10px}\n.lsg .toc{background:#fdf1ec;border:1px solid #f6d5c8;border-radius:12px;padding:16px 20px;margin:18px 0 26px}\n.lsg .toc b{display:block;font-size:14px;color:#c2502f;margin-bottom:8px}\n.lsg .toc a{display:block;color:#9c4025;text-decoration:none;padding:4px 0;font-size:15px}\n.lsg .cta{display:block;text-align:center;background:linear-gradient(90deg,#E76F51,#e0a13c);color:#fff !important;font-weight:800;font-size:17px;padding:15px 18px;border-radius:12px;text-decoration:none;margin:22px 0}\n.lsg table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:15px}\n.lsg th,.lsg td{border:1px solid #f0d8ce;padding:10px 12px;text-align:center}\n.lsg th{background:#fbe9e1}\n.lsg .tip{background:#fdf1ec;border:1px solid #f6d5c8;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .end{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:16px 20px;margin-top:24px}\n.lsg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#fdf1ec;border:1px solid #f6d5c8;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#c2502f;margin-bottom:8px}\n.lsg .rel a{display:block;color:#9c4025;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#b0a29d;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">건강·의료<\/span>\n<p>부모님이 장기요양 등급을 받으셨다면 <b>매달 쓰는 방문요양·주야간보호 한도와는 완전히 별개로, 연 160만 원짜리 복지용구 한도가 하나 더 있습니다.<\/b> 전동침대·수동휠체어·욕창예방매트리스 같은 물건을 이 돈으로 사거나 빌릴 수 있는데, <b>이 한도를 한 번도 안 쓰고 그냥 넘기는 분이 정말 많습니다.<\/b> 게다가 가장 많이 알려진 오해가 하나 있습니다 — <b>\"1월 1일이 되면 한도가 새로 생긴다\"는 말은 사실이 아닙니다.<\/b> 사람마다 갱신되는 날이 다릅니다. 얼마를, 무엇을, 어떤 순서로 받을 수 있는지와 <b>내 한도가 언제 초기화되는지 확인하는 법<\/b>까지 보건복지부 고시 원문 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 복지용구 급여란 — 월 한도액과 뭐가 다른가<\/a><a href=\"#sec2\">2. 대상자와 연 160만 원 한도<\/a><a href=\"#trap\">3. 🔴 함정 — 한도는 1월 1일에 초기화되지 않습니다 (내 갱신일 확인법)<\/a><a href=\"#sec3\">4. 품목별 급여방식·사용가능햇수·급여한도 (고시 원표)<\/a><a href=\"#calc\">5. 본인부담금 계산 — 15% · 9% · 6% · 면제<\/a><a href=\"#sim\">6. 연 160만 원 어떻게 쓰나 — 한도 소진 시뮬레이션<\/a><a href=\"#choice\">7. 구입할까 대여할까 — 판단 기준<\/a><a href=\"#sec4\">8. 신청 방법과 절차<\/a><a href=\"#deny\">9. 급여를 못 받거나 환수되는 8가지 경우<\/a><a href=\"#sec5\">10. 놓치기 쉬운 함정 5가지<\/a><a href=\"#faq\">11. 자주 묻는 질문<\/a><a href=\"#gov\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#trap\">👉 내 복지용구 한도 갱신일부터 확인하기<\/a>\n\n<h2 id=\"sec1\">1. 복지용구 급여란 — 월 한도액과 뭐가 다른가<\/h2>\n<p><b>복지용구 급여<\/b>는 노인장기요양보험의 <b>'기타재가급여'<\/b>로, 수급자의 일상생활·신체활동을 돕는 용구를 <b>구입<\/b>하거나 <b>대여<\/b>할 때 공단이 비용의 대부분을 부담해 주는 제도입니다.<\/p>\n<p>여기서 가장 먼저 정리해야 할 것이 있습니다. <b>방문요양·방문목욕·주야간보호에 쓰는 '월 한도액'과 복지용구 한도는 전혀 다른 주머니입니다.<\/b> 국민건강보험공단은 월 한도액을 안내하면서 항목명을 아예 <b>\"재가급여(복지용구 제외)의 월 한도액\"<\/b>이라고 못박아 두었습니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>재가급여 월 한도액<br>(복지용구 제외)<\/th><th>복지용구 연 한도액<\/th><\/tr>\n<tr><td>기간<\/td><td><b>매월<\/b><\/td><td><b>1년<\/b><\/td><\/tr>\n<tr><td>금액<\/td><td>등급별 (1등급 251만 원대 ~ 인지지원등급 67만 원대)<\/td><td><b>1인당 연 160만 원<\/b> (등급 무관 동일)<\/td><\/tr>\n<tr><td>쓰는 곳<\/td><td>방문요양·방문목욕·방문간호·주야간보호·단기보호<\/td><td>복지용구 <b>구입 + 대여<\/b><\/td><\/tr>\n<tr><td>서로 영향<\/td><td colspan=\"2\"><b>없음 — 별도로 씁니다<\/b><\/td><\/tr>\n<\/table>\n<p>참고로 2026년 1월 1일 기준 재가급여(복지용구 제외) 월 한도액은 <b>1등급 2,512,900원 · 2등급 2,331,200원 · 3등급 1,528,200원 · 4등급 1,409,700원 · 5등급 1,208,900원 · 인지지원등급 676,320원<\/b>입니다.<\/p>\n<div class=\"tip\"><b>💡 핵심 한 줄<\/b><p style=\"margin:8px 0 0\">방문요양을 한도까지 꽉 채워 쓰고 있어도 <b>복지용구 160만 원은 그대로 남아 있습니다.<\/b> 둘은 서로 깎아먹지 않습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 대상자와 연 160만 원 한도<\/h2>\n<h3>누가 받을 수 있나<\/h3>\n<p>장기요양인정을 받은 <b>재가 수급자<\/b>입니다. <b>1~5등급은 물론 인지지원등급도 대상입니다<\/b> — 인지지원등급이 이용할 수 있는 급여에 <b>기타재가급여(복지용구급여)<\/b>가 포함되기 때문입니다. 다만 아래 두 경우는 제한됩니다.<\/p>\n<ul>\n<li><b>요양원 등 시설급여를 이용(입소)하는 기간<\/b> — 복지용구 급여가 제한됩니다.<\/li>\n<li><b>의료기관에 입원한 기간<\/b> — 전동침대·수동침대·이동욕조·목욕리프트는 이용할 수 없습니다.<\/li>\n<\/ul>\n<h3>한도는 얼마인가<\/h3>\n<p>고시 제3조는 이렇게 정하고 있습니다.<\/p>\n<ul>\n<li>연 한도액은 <b>수급자 1인당 연간 160만 원<\/b>.<\/li>\n<li>이 160만 원은 <b>공단부담금 + 본인부담금을 합친 금액<\/b>입니다. 내 돈 160만 원이 아니라, <b>총 급여비용 기준<\/b>이라는 뜻입니다.<\/li>\n<li><b>구입과 대여를 합산<\/b>해서 계산합니다.<\/li>\n<li>한도를 넘는 금액은 <b>전액 본인 부담<\/b>입니다.<\/li>\n<\/ul>\n<div class=\"tip\"><b>⚠️ 자주 하는 착각<\/b><p style=\"margin:8px 0 0\">\"160만 원어치 내 돈을 쓸 수 있다\"가 아닙니다. <b>제품 가격 총액이 160만 원<\/b>이고, 그중 <b>내가 내는 건 15%(감경 대상이면 9%·6%, 의료급여 수급자는 0%)<\/b>입니다. 한도를 다 쓰면 실제 본인 지출은 <b>24만 원 안팎<\/b>입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"trap\">3. 🔴 함정 — 한도는 1월 1일에 초기화되지 않습니다<\/h2>\n<p>인터넷에서 가장 흔하게 도는 잘못된 설명이 <b>\"연말이 다가오니 남은 한도를 쓰세요, 1월 1일이면 초기화됩니다\"<\/b>입니다. <b>사실이 아닙니다.<\/b><\/p>\n<p>고시 제3조 제2항은 연 한도액의 적용기간을 이렇게 규정합니다.<\/p>\n<div class=\"tip\"><b>📜 고시 원문 취지<\/b><p style=\"margin:8px 0 0\">연 한도액(공단부담금+본인부담금)의 적용기간은 <b>최초 장기요양인정 유효기간 개시일로부터 매 1년<\/b>으로 한다. 다만 유효기간 만료 후 <b>1년 이상 경과<\/b>되어 다시 수급자가 된 경우에는 <b>다시 인정받은 유효기간 개시일<\/b>부터 적용한다.<\/p><\/div>\n<p>즉 <b>어머니가 3월 12일에 등급을 받으셨다면 그분의 복지용구 1년은 3월 12일 ~ 다음 해 3월 11일<\/b>입니다. 옆집 어르신이 9월에 등급을 받으셨다면 그분은 9월 기준입니다. <b>달력의 1월 1일과는 아무 상관이 없습니다.<\/b><\/p>\n<h3>이 오해가 왜 손해로 이어지나<\/h3>\n<ul>\n<li><b>12월에 급하게 몰아 쓰는 경우<\/b> — 내 갱신일이 이미 지났다면 그건 새 해 한도를 앞당겨 쓰는 것일 뿐, 아낀 게 없습니다.<\/li>\n<li><b>반대로 더 위험한 경우<\/b> — 갱신일이 두 달 뒤인 줄 모르고 \"어차피 내년에 쓰지\" 하며 미루는 것입니다. <b>적용기간이 새로 시작되면 한도도 160만 원에서 새로 계산<\/b>되므로, 그 전에 안 쓴 잔액은 <b>다음 기간에 더해지지 않습니다.<\/b><\/li>\n<\/ul>\n<h3>내 한도 갱신일 확인하는 법 (3가지)<\/h3>\n<table>\n<tr><th>방법<\/th><th>어디를 보나<\/th><\/tr>\n<tr><td><b>① 복지용구 급여확인서<\/b><\/td><td>공단이 장기요양인정서와 <b>함께 보내주는 서류<\/b>. 표 안에 <b>'연한도액 적용구간'<\/b> 항목이 있어 <b>내 1년이 언제부터 언제까지인지 날짜로 찍혀 있습니다.<\/b><\/td><\/tr>\n<tr><td><b>② 장기요양인정서<\/b><\/td><td>기재된 <b>유효기간 개시일<\/b>이 기준일입니다.<\/td><\/tr>\n<tr><td><b>③ 공단 문의<\/b><\/td><td>국민건강보험공단 <b>☎ 1577-1000<\/b> 또는 관할 운영센터. 남은 한도까지 함께 확인할 수 있습니다.<\/td><\/tr>\n<\/table>\n<p>같은 급여확인서에는 <b>내가 쓸 수 있는 품목<\/b>과 <b>이미 제공받은 복지용구<\/b>도 같이 적혀 있습니다. <b>이 종이 한 장이 복지용구의 모든 답을 갖고 있습니다.<\/b> 서랍에서 먼저 찾아보세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">4. 품목별 급여방식·사용가능햇수·급여한도<\/h2>\n<p>2024년 12월 16일 개정 고시부터 <b>'내구연한'이라는 용어가 '사용가능햇수'로 바뀌었습니다.<\/b> 뜻은 같습니다 — <b>그 햇수 안에는 같은 품목을 1개만 사거나 빌릴 수 있다<\/b>는 의미입니다. 아래는 고시 [별표2]의 급여기준표입니다.<\/p>\n<table>\n<tr><th>급여방식<\/th><th>품목명<\/th><th>사용가능햇수<br>(내구연한)<\/th><th>급여한도<\/th><\/tr>\n<tr><td rowspan=\"11\"><b>구입<\/b><\/td><td>이동변기<\/td><td>5년<\/td><td>1개<\/td><\/tr>\n<tr><td>목욕의자<\/td><td>5년<\/td><td>1개<\/td><\/tr>\n<tr><td>성인용보행기<\/td><td>5년<\/td><td><b>2개<\/b><\/td><\/tr>\n<tr><td>안전손잡이<\/td><td>—<\/td><td><b>10개<\/b><\/td><\/tr>\n<tr><td>미끄럼방지용품 – 양말<\/td><td>—<\/td><td>6켤레<\/td><\/tr>\n<tr><td>미끄럼방지용품 – 매트·액<\/td><td>—<\/td><td>5개<\/td><\/tr>\n<tr><td>간이변기(대변기·소변기)<\/td><td>—<\/td><td>2개<\/td><\/tr>\n<tr><td>지팡이<\/td><td>2년<\/td><td>1개<\/td><\/tr>\n<tr><td>욕창예방방석<\/td><td>3년<\/td><td>1개<\/td><\/tr>\n<tr><td>자세변환용구<\/td><td>—<\/td><td>5개<\/td><\/tr>\n<tr><td>요실금팬티<\/td><td>—<\/td><td>4개<\/td><\/tr>\n<tr><td rowspan=\"6\"><b>대여<\/b><\/td><td>수동휠체어<\/td><td>5년<\/td><td>1개<\/td><\/tr>\n<tr><td>전동침대<\/td><td>10년<\/td><td>1개<\/td><\/tr>\n<tr><td>수동침대<\/td><td>10년<\/td><td>1개<\/td><\/tr>\n<tr><td>이동욕조<\/td><td>5년<\/td><td>1개<\/td><\/tr>\n<tr><td>목욕리프트<\/td><td>3년<\/td><td>1개<\/td><\/tr>\n<tr><td>배회감지기<\/td><td>5년<\/td><td>1개<\/td><\/tr>\n<tr><td rowspan=\"3\"><b>구입 또는<br>대여<\/b><\/td><td>욕창예방매트리스<\/td><td>3년<\/td><td>1개<\/td><\/tr>\n<tr><td>경사로 – 실외용(대여)<\/td><td>8년<\/td><td>1개<\/td><\/tr>\n<tr><td>경사로 – 실내용(구입)<\/td><td>2년<\/td><td><b>6개<\/b><\/td><\/tr>\n<\/table>\n<h3>표를 읽을 때 꼭 알아야 할 규칙<\/h3>\n<ul>\n<li><b>사용가능햇수가 '—'인 품목<\/b>(안전손잡이·미끄럼방지용품·간이변기·자세변환용구·요실금팬티)은 <b>연 한도액 적용기간(내 1년) 동안<\/b> 표에 적힌 개수까지 살 수 있습니다.<\/li>\n<li><b>전동침대와 수동침대는 '같은 품목'으로 봅니다.<\/b> 둘 중 하나만 빌릴 수 있습니다.<\/li>\n<li><b>'구입 또는 대여' 품목은 구입과 대여를 동시에 할 수 없습니다.<\/b> 단 <b>경사로만 예외<\/b>로, 실내용은 구입·실외용은 대여만 가능하며 <b>둘을 동시에 이용할 수 있습니다.<\/b><\/li>\n<li>대여 제품은 사용가능햇수가 지났더라도 외형·작동에 이상이 없으면 <b>그 햇수의 1/2 범위 안에서 연장 대여<\/b>가 가능합니다.<\/li>\n<li>산 제품이 사용가능햇수 안에 <b>훼손·마모<\/b>되거나 <b>몸 상태가 변해<\/b> 못 쓰게 되면, <b>'복지용구 추가급여신청서'(고시 별지 제2호서식)<\/b>를 공단에 내고 확인받으면 <b>햇수 안이라도 다시 급여를 받을 수 있습니다.<\/b><\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"calc\">5. 본인부담금 계산 — 15% · 9% · 6% · 면제<\/h2>\n<p>복지용구는 재가급여이므로 <b>기본 본인부담률은 15%<\/b>입니다(노인장기요양보험법 제40조). 여기에 소득·재산에 따른 <b>감경<\/b>이 붙습니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>대상<\/th><th>재가급여 본인부담률<\/th><\/tr>\n<tr><td><b>일반<\/b><\/td><td>감경 대상이 아닌 수급자<\/td><td><b>15%<\/b><\/td><\/tr>\n<tr><td><b>40% 감경<\/b><\/td><td>건강보험료 순위 <b>25% 초과 ~ 50% 이하<\/b><br>(직장가입자는 재산과표 요건 충족)<\/td><td><b>9%<\/b><\/td><\/tr>\n<tr><td><b>60% 감경<\/b><\/td><td>건강보험료 순위 <b>0 ~ 25% 이하<\/b><br>차상위 희귀난치성·만성질환자 포함<\/td><td><b>6%<\/b><\/td><\/tr>\n<tr><td><b>면제<\/b><\/td><td>「국민기초생활 보장법」에 따른 <b>의료급여 수급자<\/b><\/td><td><b>0%<\/b><\/td><\/tr>\n<\/table>\n<h3>같은 제품이라도 내가 내는 돈은 이만큼 다릅니다<\/h3>\n<p>총 급여비용이 <b>연 160만 원(한도 전액 사용)<\/b>일 때 실제 본인 지출은 이렇게 갈립니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>부담률<\/th><th>연간 본인부담액<\/th><th>공단이 내주는 돈<\/th><\/tr>\n<tr><td>일반<\/td><td>15%<\/td><td><b>240,000원<\/b><\/td><td>1,360,000원<\/td><\/tr>\n<tr><td>40% 감경<\/td><td>9%<\/td><td><b>144,000원<\/b><\/td><td>1,456,000원<\/td><\/tr>\n<tr><td>60% 감경<\/td><td>6%<\/td><td><b>96,000원<\/b><\/td><td>1,504,000원<\/td><\/tr>\n<tr><td>의료급여 수급자<\/td><td>0%<\/td><td><b>0원<\/b><\/td><td>1,600,000원<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 감경은 신청하지 않아도 적용됩니다<\/b><p style=\"margin:8px 0 0\">공단은 보유한 건강보험료 자료로 <b>직권으로 감경을 적용<\/b>합니다. 다만 피부양자 자격 변동이나 재산과표 불일치 등 <b>공단 쪽 사유로 감경이 빠진 경우<\/b>에는 <b>본인이 감경 신청<\/b>을 할 수 있고, 처리 결과는 <b>14일 이내<\/b>에 통보됩니다. 내 부담률이 궁금하면 <b>'개인별장기요양이용계획서'의 본인부담률<\/b>을 보면 됩니다.<\/p><\/div>\n<p style=\"font-size:14px;color:#666\">※ 감경 판정 기준이 되는 보험료 구간표는 <b>매년 2월에 갱신<\/b>됩니다(현재 적용분은 2026년 2월 ~ 2027년 1월). 지역가입자는 월별 보험료액과 가입자 수로, 직장가입자는 보험료액·가입자 수·재산과표액을 함께 봅니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sim\">6. 연 160만 원 어떻게 쓰나 — 한도 소진 시뮬레이션<\/h2>\n<p>말로만 들으면 감이 안 오니, <b>거동이 불편해 침대 생활을 하시는 어르신<\/b>을 가정해 1년을 시뮬레이션해 보겠습니다.<\/p>\n<p style=\"font-size:14px;color:#666\">※ 아래 제품 가격은 <b>계산 방식을 보여주기 위한 가정값<\/b>입니다. 실제 구입가·월 대여료는 제품마다 「복지용구 품목별 제품목록 및 급여비용 등에 관한 고시」로 따로 정해져 있고 수시로 바뀌므로, <b>복지용구사업소나 공단에서 확인<\/b>하셔야 합니다.<\/p>\n<table>\n<tr><th>시기<\/th><th>이용 내용<\/th><th>급여비용(가정)<\/th><th>한도 잔액<\/th><\/tr>\n<tr><td>1개월차<\/td><td>전동침대 <b>대여<\/b> 시작 (월 10만 원 가정 × 12개월)<\/td><td>1,200,000원<\/td><td>400,000원<\/td><\/tr>\n<tr><td>1개월차<\/td><td>욕창예방매트리스 <b>대여<\/b> (월 1만 원 가정 × 12개월)<\/td><td>120,000원<\/td><td>280,000원<\/td><\/tr>\n<tr><td>2개월차<\/td><td>이동변기 <b>구입<\/b><\/td><td>170,000원<\/td><td>110,000원<\/td><\/tr>\n<tr><td>4개월차<\/td><td>자세변환용구 2개 <b>구입<\/b><\/td><td>60,000원<\/td><td>50,000원<\/td><\/tr>\n<tr><td>7개월차<\/td><td>안전손잡이 3개 <b>구입<\/b><\/td><td>50,000원<\/td><td><b>0원<\/b><\/td><\/tr>\n<tr><td colspan=\"2\"><b>합계 (총 급여비용)<\/b><\/td><td colspan=\"2\"><b>1,600,000원 = 한도 전액<\/b><\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>📐 이 경우 실제 내 지갑에서 나가는 돈<\/b>\n<p style=\"margin:8px 0 0\"><b>일반(15%)<\/b> → 1,600,000 × 0.15 = <b>연 24만 원<\/b> (월평균 2만 원)<br>\n<b>40% 감경(9%)<\/b> → <b>연 14만 4천 원<\/b><br>\n<b>60% 감경(6%)<\/b> → <b>연 9만 6천 원<\/b><br>\n<b>의료급여 수급자<\/b> → <b>0원<\/b><\/p>\n<p style=\"margin:10px 0 0\">같은 물건을 급여 없이 직접 마련한다면 총 160만 원을 그대로 부담해야 합니다. <b>제도를 아는 것과 모르는 것의 차이가 연 130만 원 이상<\/b>입니다.<\/p><\/div>\n<h3>대여료는 이렇게 계산됩니다 (알아두면 손해를 막습니다)<\/h3>\n<ul>\n<li>대여가격은 <b>월 단위<\/b>로 산정하며, 여기서 '월'은 <b>매월 1일부터 말일까지<\/b>입니다.<\/li>\n<li>월 중간에 시작하거나 끝나면 <b>일자별로<\/b> 계산합니다. 다만 <b>연속 대여일수가 15일 미만이면 월 15일로 산정<\/b>할 수 있습니다.<\/li>\n<li>대여 중 수급자가 <b>사망<\/b>한 경우, <b>사망일 다음 날부터 최대 7일까지<\/b>만 대여가격이 산정됩니다.<\/li>\n<li>대여 중 <b>의료기관에 입원<\/b>한 경우, 입원 기간 중 <b>최대 15일까지<\/b> 대여가격을 산정할 수 있습니다.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"choice\">7. 구입할까 대여할까 — 판단 기준<\/h2>\n<p><b>욕창예방매트리스<\/b>와 <b>경사로<\/b>는 구입과 대여 중 고를 수 있습니다. 무엇을 고르느냐에 따라 <b>한도가 닳는 속도<\/b>가 완전히 달라집니다.<\/p>\n<table>\n<tr><th>판단 항목<\/th><th>구입이 유리<\/th><th>대여가 유리<\/th><\/tr>\n<tr><td>예상 사용 기간<\/td><td><b>사용가능햇수를 채워 오래<\/b> 쓸 것으로 보일 때<\/td><td>몇 달만 쓰고 끝날 가능성이 있을 때<br>(회복·수술 후 일시적 사용 등)<\/td><\/tr>\n<tr><td>한도 소진<\/td><td>한 번에 크게 빠지지만 <b>이후 해에는 안 빠짐<\/b><\/td><td>매달 조금씩 <b>계속 빠짐<\/b> — 장기 대여는 누적이 큼<\/td><\/tr>\n<tr><td>고장·수리<\/td><td>본인이 관리<\/td><td><b>사업소가 수리·부품 교체 책임<\/b><\/td><\/tr>\n<tr><td>위생<\/td><td>내 것<\/td><td>사업소가 <b>소독 지침에 따라 세정·소독한 제품만<\/b> 제공<\/td><\/tr>\n<tr><td>몸 상태 변화<\/td><td>맞지 않게 되면 처치 곤란<\/td><td><b>반납·교체가 쉬움<\/b><\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>🧭 이렇게 판단하세요<\/b><p style=\"margin:8px 0 0\"><b>1년 이상 계속 쓸 것이 분명하고 몸 상태가 안정적<\/b>이면 → <b>구입<\/b>이 한도 관리에 유리합니다.<br><b>병세 변화가 크거나 회복 후 필요 없어질 수 있다면<\/b> → <b>대여<\/b>가 안전합니다. 매트리스처럼 위생 관리가 부담스러운 품목도 대여 쪽이 편합니다.<br>※ <b>전동침대·수동침대는 대여만 가능<\/b>합니다(둘은 같은 품목이라 하나만).<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">8. 신청 방법과 절차<\/h2>\n<ol>\n<li><b>장기요양등급을 먼저 받습니다.<\/b> 등급이 없으면 복지용구도 없습니다. (등급 신청은 공단 지사·홈페이지)<\/li>\n<li><b>'복지용구 급여확인서'를 확인합니다.<\/b> 공단이 장기요양인정서를 보낼 때 함께 보냅니다. 여기에 <b>내가 쓸 수 있는 품목<\/b>과 <b>연한도액 적용구간<\/b>이 적혀 있습니다.<\/li>\n<li><b>복지용구사업소를 찾아갑니다.<\/b> 복지용구는 <b>공단에 지정된 '복지용구사업소'를 통해서만<\/b> 제공됩니다. 사업소는 노인장기요양보험 홈페이지 '검색 → 장기요양기관 찾기'에서 조회할 수 있습니다.<\/li>\n<li><b>급여확인서에 있는 품목을<\/b> 구입하거나 대여합니다. 본인부담금(15%·9%·6%·0%)만 결제하면 나머지는 공단이 사업소에 지급합니다.<\/li>\n<li><b>품목을 바꾸고 싶으면<\/b> '복지용구 추가급여신청서'(별지 제2호서식)를 공단에 제출합니다. 몸 상태 변화가 인정되면 <b>급여확인서가 새로 발급<\/b>됩니다.<\/li>\n<\/ol>\n<div class=\"tip\"><b>⚠️ 사업소가 이런 돈을 요구하면 잘못된 것입니다<\/b><p style=\"margin:8px 0 0\">고시 제6조는 복지용구 가격에 <b>배송비 · 설치·철거비 · 수리 및 부품 교체료 · 세정 및 소독비용이 모두 포함<\/b>되어 있으므로 <b>별도로 산정하거나 수급자에게 부담시킬 수 없다<\/b>고 명시합니다. \"배송비는 따로 주셔야 한다\"는 요구는 근거가 없습니다.<\/p><p style=\"margin:8px 0 0\">반대로 <b>본인부담금을 안 받겠다거나 물건·상품권을 주겠다는 사업소<\/b>도 조심하세요. 공단은 그런 유인·알선 행위가 확인되면 <b>현지확인심사<\/b>를 거쳐 지급합니다. 결국 이용자에게도 불편이 돌아옵니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"deny\">9. 급여를 못 받거나 환수되는 8가지 경우<\/h2>\n<p>복지용구는 \"160만 원 안에서 아무거나\"가 아닙니다. <b>거절되는 경우가 생각보다 많습니다.<\/b><\/p>\n<table>\n<tr><th>#<\/th><th>이런 경우<\/th><th>왜 안 되나<\/th><\/tr>\n<tr><td>1<\/td><td><b>급여확인서에 없는 품목<\/b>을 사려 할 때<\/td><td>공단이 인정조사 결과로 <b>'사용이 불필요'<\/b>하다고 판정한 품목은 제공 자체가 안 됩니다<\/td><\/tr>\n<tr><td>2<\/td><td><b>요양원 등 시설급여 입소 기간<\/b><\/td><td>시설급여 기간 중에는 복지용구 급여가 제한됩니다<\/td><\/tr>\n<tr><td>3<\/td><td><b>병원 입원 중<\/b> 전동·수동침대, 이동욕조, 목욕리프트<\/td><td>입원 기간에는 이용 불가 — 대여 중이었다면 <b>15일 이내 반납<\/b><\/td><\/tr>\n<tr><td>4<\/td><td><b>복지용구사업소가 아닌 곳<\/b>(일반 쇼핑몰·의료기기 판매점)에서 구입<\/td><td>급여는 <b>지정 사업소를 통해서만<\/b> 제공됩니다<\/td><\/tr>\n<tr><td>5<\/td><td><b>사용가능햇수 안에 같은 품목 재구입<\/b><\/td><td>햇수 내 품목당 1개 원칙(단 훼손·마모·신체상태 변화는 추가급여신청서로 예외)<\/td><\/tr>\n<tr><td>6<\/td><td><b>타 법령으로 이미 지급받은 동일 품목<\/b><\/td><td>장애인보조기기 등으로 이미 받은 품목은 <b>그 사용가능햇수 동안<\/b> 중복 급여 불가<\/td><\/tr>\n<tr><td>7<\/td><td><b>'구입 또는 대여' 품목을 동시에<\/b> 구입+대여<\/td><td>동시 이용 금지(경사로 실내구입+실외대여만 예외)<\/td><\/tr>\n<tr><td>8<\/td><td><b>연 160만 원 초과분<\/b><\/td><td>초과 금액은 <b>전액 본인 부담<\/b><\/td><\/tr>\n<\/table>\n<h3>1번이 가장 억울한 사례입니다 — '사용이 불필요' 판정이란<\/h3>\n<p>고시 [별표3]은 품목마다 <b>\"이런 몸 상태면 이 품목은 필요 없다\"<\/b>는 판정기준을 정해 두었습니다. 장기요양인정조사표의 신체기능·재활·간호처치 영역 점수로 기계적으로 판단합니다. 예를 들면 이렇습니다.<\/p>\n<ul>\n<li><b>이동변기<\/b> — 변의를 느끼지 못하거나, 완전와상으로 항상 기저귀를 착용해야 하는 상태<\/li>\n<li><b>목욕의자<\/b> — 완전와상으로 앉은 자세를 유지할 수 없는 상태<\/li>\n<li><b>전동침대·수동침대<\/b> — 집안에서 <b>스스로 이동이 가능한<\/b> 상태<\/li>\n<li><b>성인용보행기·지팡이<\/b> — 양측 상지를 쓸 수 없어 잡을 수 없거나, 양측 하지를 쓸 수 없어 일어설 수 없는 상태<\/li>\n<li><b>욕창예방매트리스<\/b> — 스스로 체위변경·일어나 앉기·옮겨 앉기가 가능하고 <b>욕창이 없는<\/b> 상태<\/li>\n<\/ul>\n<p>읽어 보면 방향이 두 갈래인 게 보입니다. <b>너무 건강해서 필요 없는 경우<\/b>와 <b>너무 위중해서 그 물건으로는 해결이 안 되는 경우<\/b> 양쪽 모두 제외됩니다. 그래서 <b>\"우리 어머니가 더 힘드신데 왜 안 되냐\"는 상황이 실제로 생깁니다.<\/b><\/p>\n<div class=\"tip\"><b>✅ 대응 방법<\/b><p style=\"margin:8px 0 0\">판정은 <b>인정조사 시점의 몸 상태<\/b> 기준입니다. 그 뒤 상태가 달라졌다면 <b>'복지용구 추가급여신청서'<\/b>를 내고 공단 확인을 받으면 <b>품목을 다시 정해 급여확인서가 새로 발급<\/b>됩니다. 포기하지 말고 관할 운영센터에 상태 변화를 알리세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">10. 놓치기 쉬운 함정 5가지<\/h2>\n<ol>\n<li><b>한도는 1월 1일이 아니라 '내 유효기간 개시일'에 갱신됩니다.<\/b> (§3 참고) 새 기간이 시작되면 한도는 <b>160만 원에서 새로 계산<\/b>되므로, 안 쓴 잔액이 <b>다음 기간에 더해지지 않습니다.<\/b><\/li>\n<li><b>160만 원은 내 돈이 아니라 총 급여비용입니다.<\/b> 실제 본인 지출은 그 15%(감경 시 9%·6%, 의료급여 수급자 0%)입니다.<\/li>\n<li><b>등급 갱신 때 쓰던 품목이 '불필요'로 바뀔 수 있습니다.<\/b> 급여확인서에도 이 점이 유의사항으로 적혀 있습니다. 갱신 후 급여확인서를 반드시 다시 읽어 보세요.<\/li>\n<li><b>배송비·설치비·소독비를 따로 요구하는 건 근거가 없습니다.<\/b> 가격에 이미 포함돼 있습니다.<\/li>\n<li><b>전동침대와 수동침대는 같은 품목<\/b>이라 하나만 됩니다. 사용가능햇수도 <b>10년<\/b>으로 길어, 한 번 정하면 오래 갑니다. <b>고르기 전에 어르신 상태를 사업소와 충분히 상의하세요.<\/b><\/li>\n<\/ol>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"faq\">11. 자주 묻는 질문<\/h2>\n<h3>Q. 등급을 이번 달에 처음 받았습니다. 한도 160만 원을 지금 다 써도 되나요?<\/h3>\n<p>됩니다. 한도는 <b>기간 안에 얼마를 쓰든 자유<\/b>이며 매달 나눠 쓸 필요가 없습니다. 다만 대여는 매달 비용이 쌓이므로, <b>1년 치 대여료를 먼저 계산<\/b>해 두고 남는 금액으로 구입 품목을 정하는 순서가 안전합니다.<\/p>\n<h3>Q. 재가급여 월 한도액을 다 써버렸는데 복지용구도 못 받나요?<\/h3>\n<p>아닙니다. <b>완전히 별개입니다.<\/b> 공단도 월 한도액을 안내할 때 <b>\"재가급여(복지용구 제외)\"<\/b>라고 표기합니다.<\/p>\n<h3>Q. 요양원에 들어가면 쓰던 복지용구는 어떻게 되나요?<\/h3>\n<p><b>시설급여 입소 기간 중에는 복지용구 급여가 제한<\/b>됩니다. 재가급여와 시설급여는 동시에 이용할 수 없으므로, 입소 전에 <b>대여 중인 제품은 반납<\/b>하셔야 합니다.<\/p>\n<h3>Q. 병원에 잠깐 입원했는데 빌린 전동침대를 바로 반납해야 하나요?<\/h3>\n<p>급여확인서 유의사항은 <b>입원 시 전동침대·수동침대·이동욕조·목욕리프트를 15일 이내에 반납<\/b>하도록 안내합니다. 대여료도 입원 기간 중 <b>최대 15일까지만<\/b> 산정됩니다.<\/p>\n<h3>Q. 산 지 2년 된 이동변기가 부서졌습니다. 사용가능햇수(5년)가 남았는데 못 사나요?<\/h3>\n<p>살 수 있습니다. <b>'복지용구 추가급여신청서'(별지 제2호서식)<\/b>를 공단에 제출하고 훼손 사실을 확인받으면 <b>햇수 이내라도 급여가 제공<\/b>됩니다.<\/p>\n<h3>Q. 인터넷에서 훨씬 싼 걸 봤는데 거기서 사도 되나요?<\/h3>\n<p>그 경우 <b>급여가 적용되지 않습니다<\/b>(전액 본인 부담). 복지용구 급여는 <b>공단이 지정한 복지용구사업소<\/b>를 통해서만 제공됩니다. 급여로 사면 어차피 <b>정가의 15%(또는 그 이하)<\/b>만 내므로 대부분 급여 쪽이 저렴합니다.<\/p>\n<h3>Q. 내가 감경 대상인지 어떻게 아나요?<\/h3>\n<p><b>'개인별장기요양이용계획서'의 본인부담률<\/b>을 보면 바로 알 수 있습니다. 감경은 공단이 <b>직권으로<\/b> 적용하며, 자료 불일치 등으로 빠졌다면 관할 운영센터에 <b>감경 신청<\/b>을 할 수 있습니다(결과 통보 14일 이내).<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"gov\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.longtermcare.or.kr/npbs/e/b/504/npeb504m01.web?menuId=npe0000000400\" target=\"_blank\" rel=\"nofollow\">▸ 노인장기요양보험 — 월 한도액 및 급여비용 (2026.1.1. 기준)<\/a><a href=\"https://www.longtermcare.or.kr/npbs/e/b/503/npeb503m01.web?menuId=npe0000002743\" target=\"_blank\" rel=\"nofollow\">▸ 노인장기요양보험 — 본인부담금 감경 기준<\/a><a href=\"https://www.law.go.kr/admRulLsInfoP.do?admRulSeq=2100000250742\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 복지용구 급여범위 및 급여기준 등에 관한 고시<\/a><a href=\"https://www.mohw.go.kr/board.es?mid=a10409020000&amp;bid=0026&amp;list_no=1483908&amp;act=view\" target=\"_blank\" rel=\"nofollow\">▸ 보건복지부 — 고시 제2024-253호 개정 전문<\/a><a href=\"https://www.easylaw.go.kr/CSP/OnhunqueansInfoRetrieve.laf?onhunqnaAstSeq=97&amp;onhunqueSeq=6499\" target=\"_blank\" rel=\"nofollow\">▸ 찾기쉬운 생활법령정보 — 장기요양등급별 이용 가능 급여<\/a><a href=\"https://www.bokjiro.go.kr\" target=\"_blank\" rel=\"nofollow\">▸ 복지로 — 노인 돌봄·요양 서비스 안내<\/a><\/div>\n\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">정리하면 <b>①복지용구 연 160만 원은 방문요양 월 한도와 별개의 주머니이고 ②그 1년은 1월 1일이 아니라 내 장기요양인정 유효기간 개시일부터 세며 ③실제 내 부담은 그 15%(감경 시 9%·6%, 의료급여 수급자 0%)이고 ④쓸 수 있는 품목은 급여확인서에 이미 정해져 있습니다.<\/b> 오늘 할 일은 딱 하나입니다 — <b>서랍에서 '복지용구 급여확인서'를 찾아 '연한도액 적용구간' 날짜부터 확인<\/b>하세요. 남은 기간과 남은 한도를 알면 그다음은 사업소에서 상의하면 됩니다. 서류가 안 보이면 <b>공단 ☎1577-1000<\/b>으로 남은 한도까지 한 번에 확인할 수 있습니다.<\/p><\/div>\n\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 품목·사용가능햇수·급여한도는 <b style=\"display:inline;color:#33503a;margin:0\">「복지용구 급여범위 및 급여기준 등에 관한 고시」(보건복지부고시 제2024-253호, 2024.12.16. 시행)<\/b> 원문을, 본인부담률·감경 기준은 <b style=\"display:inline;color:#33503a;margin:0\">국민건강보험공단 노인장기요양보험 공식 안내<\/b>를 직접 확인해 정리했습니다. 개별 제품의 구입가·월 대여료는 「복지용구 품목별 제품목록 및 급여비용 등에 관한 고시」로 제품마다 따로 정해지고 수시로 개정되므로, 본문 §6의 금액은 <b style=\"display:inline;color:#33503a;margin:0\">계산 방식을 보여주기 위한 가정값<\/b>입니다. 실제 금액은 복지용구사업소 또는 공단에서 확인하세요.<br>출처: <a href=\"https://www.law.go.kr/admRulLsInfoP.do?admRulSeq=2100000250742\">국가법령정보센터 — 복지용구 급여범위 및 급여기준 등에 관한 고시<\/a>, <a href=\"https://www.mohw.go.kr/board.es?mid=a10409020000&amp;bid=0026&amp;list_no=1483908&amp;act=view\">보건복지부 — 고시 제2024-253호 개정 전문(별표1~3·별지 서식 포함)<\/a>, <a href=\"https://www.longtermcare.or.kr/npbs/e/b/504/npeb504m01.web?menuId=npe0000000400\">국민건강보험공단 노인장기요양보험 — 월 한도액 및 급여비용(2026.1.1. 기준)<\/a>, <a href=\"https://www.longtermcare.or.kr/npbs/e/b/503/npeb503m01.web?menuId=npe0000002743\">같은 기관 — 본인부담금 감경(2026.2.~2027.1. 적용 기준)<\/a>, <a href=\"https://www.nhis.or.kr/static/html/wbda/c/wbdac05.html\">국민건강보험공단 — 노인장기요양보험 재원조달·급여비용 안내<\/a>. 본인부담률의 법적 근거는 노인장기요양보험법 제40조이며, 인지지원등급이 복지용구(기타재가급여)를 이용할 수 있다는 점은 <a href=\"https://www.easylaw.go.kr/CSP/OnhunqueansInfoRetrieve.laf?onhunqnaAstSeq=97&amp;onhunqueSeq=6499\">찾기쉬운 생활법령정보 「장기요양등급별 이용 가능 급여」<\/a>(근거: 「장기요양급여 제공기준 및 급여비용 산정방법 등에 관한 고시」)에서 확인했습니다.<\/div>\n\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_506.html\">▸ 노인장기요양보험 등급 신청 방법 본인부담금 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01082087244.html\">▸ 노인맞춤돌봄서비스 신청 방법 대상 서비스 내용 총정리 (2026 부모님 돌봄)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/1-2-2026.html\">▸ 의료급여 1종 2종 차이 본인부담금 대상 신청 방법 총정리 (2026)<\/a><\/div>\n\n<div id=\"ymyl-disclaimer\" style=\"margin-top:22px;font-size:13px;color:#666;line-height:1.6\">본 글은 정보 제공용이며 의료·법률 자문이 아닙니다. 실제 급여 대상 품목·한도 잔액·본인부담률은 <b>수급자 개인의 장기요양인정조사 결과와 건강보험료 자료<\/b>에 따라 결정되며, 최종 판단은 국민건강보험공단이 합니다. 본문 §6의 제품 가격은 계산 방식을 설명하기 위한 가정값이므로 실제 청구액과 다릅니다. 신청 전 반드시 공단(☎1577-1000) 또는 복지용구사업소에서 본인 기준으로 확인하세요.<\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 품목표·한도·부담률은 <b>보건복지부 고시 원문과 공단 공식 페이지를 직접 열람<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 제도는 바뀔 수 있으니 신청 전 공식 페이지를 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 장기요양 등급을 받으면 방문요양 월 한도와는 **별개로** 복지용구에 쓸 수 있는 연 160만 원 한도가 하나 더 생깁니다. 공단 안내도 월 한도액을 \"재가급여(복지용구 제외)\"라고 표기합니다. 전동침대·수동휠체어·욕창예방매트리스 등을 이 한도로 사거나 빌립니다.\n2. 가장 흔한 오해가 \"1월 1일이면 한도가 초기화된다\"인데 **사실이 아닙니다.** 고시 제3조는 적용기간을 '최초 장기요양인정 유효기간 개시일로부터 매 1년'으로 정합니다. 사람마다 갱신일이 다르고 남은 한도는 이월되지 않으니, 공단이 보내준 '복지용구 급여확인서'의 **'연한도액 적용구간'** 날짜를 먼저 확인하세요.\n3. 160만 원은 내 돈이 아니라 총 급여비용이고 실제 부담은 **15%(연 24만 원)**, 감경 대상이면 9%·6%, 의료급여 수급자는 0원입니다. 단 급여확인서에 없는 품목·사업소가 아닌 곳에서 산 물건·시설 입소 기간·사용가능햇수 내 재구입은 급여가 안 됩니다.\n"},{"code":"F4-10","title":"여행사 패키지 여행 취소 위약금 환불 기준 총정리 (2026 국외·국내여행 표준약관 · 소비자분쟁해결기준)","lane":"etc","thumb":"144_tour_cancel_fee.png","draft":"여행취소위약금_글_HTML.txt","facts":"국외여행 취소 배상(소비자분쟁해결기준 여행업): 여행개시 30일전까지 계약금 환급(위약금 0) / 29~20일전 10% / 19~10일전 15% / 9~8일전 20% / 7~1일전 30% / 당일 50%. 여행사 귀책 취소는 계약금 환급 + 동일 비율 배상 | 국내여행 당일여행: 3일전까지 전액환급 / 2일전 10% / 1일전 px 0}\n.lsg .end{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:16px 20px;margin-top:24px}\n.lsg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#f4f1fd;border:1px solid #ded4f7;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#6544cc;margin-bottom:8px}\n.lsg .rel a{display:block;color:#5a3cc0;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#9a92aa;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>여행사에서 패키지 여행을 계약했다가 사정이 생겨 취소할 때, 가장 먼저 듣는 말은 대개 <b>\"지금 취소하시면 취소료가 이만큼 나옵니다\"<\/b>입니다. 그런데 그 금액이 <b>맞는 금액인지 확인할 방법<\/b>을 아는 분은 많지 않습니다. 여행요금의 절반을 떼겠다는 말을 듣고도 <b>근거를 따져 묻지 못한 채 그냥 물어내는 경우<\/b>가 대부분입니다. 정부가 정해 둔 기준이 분명히 있는데도 그렇습니다. 게다가 <b>정말 중요한 함정이 하나 더<\/b> 있습니다. 그 정부 기준이 <b>모든 계약에 무조건 적용되는 것이 아니라는 점<\/b>입니다. 이 글에서는 <b>국외·국내 패키지 여행의 시점별 위약금 기준표, 실제 금액 계산, 위약금 없이 취소할 수 있는 사유, 여행사 특별약관이 우선하는 경우, 분쟁 시 대응 순서<\/b>까지 공식 자료를 근거로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 먼저 확인할 것 — 내 계약에 적용되는 기준<\/a><a href=\"#sec2\">2. 국외 패키지 여행 취소 위약금 기준표<\/a><a href=\"#sec3\">3. 계산예시 — 400만 원 패키지, 언제 취소하면 얼마<\/a><a href=\"#sec4\">4. 국내여행은 기준이 다릅니다 (당일 / 숙박)<\/a><a href=\"#sec5\">5. 가장 큰 함정 — 여행사 '특별약관'이 우선하는 경우<\/a><a href=\"#sec6\">6. 위약금 없이 취소할 수 있는 사유<\/a><a href=\"#sec7\">7. 태풍·천재지변이면 전액 환불인가<\/a><a href=\"#sec8\">8. 여행사가 취소한 경우 — 인원 미달 포함<\/a><a href=\"#sec9\">9. 출발한 뒤에 그만두면<\/a><a href=\"#sec10\">10. 분쟁이 생겼을 때 대응 순서<\/a><a href=\"#sec11\">11. 자주 묻는 질문<\/a><a href=\"#sec12\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec2\">👉 시점별 위약금 기준표 바로 보기<\/a>\n\n<h2 id=\"sec1\">1. 먼저 확인할 것 — 내 계약에 적용되는 기준<\/h2>\n<p>여행 취소료를 따질 때 사람들이 가장 많이 하는 실수는 <b>인터넷에서 본 \"30일 전이면 전액 환불\"이라는 문장 하나만 들고 여행사와 다투는 것<\/b>입니다. 그 문장은 맞지만, <b>내 계약에 적용되는지부터 확인해야<\/b> 합니다. 순서는 이렇습니다.<\/p>\n<table>\n<tr><th>순서<\/th><th>확인할 것<\/th><th>어디서 보나<\/th><\/tr>\n<tr><td><b>①<\/b><\/td><td>여행사와 맺은 계약인가, 내가 직접 예약한 것인가<\/td><td>계약서 · 결제 내역<\/td><\/tr>\n<tr><td><b>②<\/b><\/td><td>계약서에 <b>취소료(취소수수료) 규정<\/b>이 따로 적혀 있는가<\/td><td>계약서 · 약관 동의 화면<\/td><\/tr>\n<tr><td><b>③<\/b><\/td><td>그 규정이 <b>표준약관과 다르다는 설명<\/b>과 <b>별도 확인<\/b>을 받았는가<\/td><td>서면 · 전자문서 기록<\/td><\/tr>\n<tr><td><b>④<\/b><\/td><td>②③이 없다면 → <b>소비자분쟁해결기준<\/b> 적용<\/td><td>본문 2·4장 기준표<\/td><\/tr>\n<\/table>\n<p>정리하면 <b>\"계약서에 별도 취소료 약정이 없으면 정부 기준표대로, 별도 약정이 제대로 되어 있으면 그 약정대로\"<\/b>입니다. 그래서 <b>계약서 원문을 먼저 확보하는 것이 1번<\/b>입니다. 요즘은 대부분 <b>전자문서·모바일 동의 화면<\/b>이라 여행사에 요청하면 받을 수 있습니다.<\/p>\n<div class=\"tip\"><b>💡 '패키지'와 '자유여행'은 다릅니다<\/b><p style=\"margin:8px 0 0\">여행사가 <b>항공·숙박·일정을 묶어 파는 패키지<\/b>는 여행계약이라 이 글의 기준이 그대로 적용됩니다. 반면 여행사를 통해 <b>항공권만, 호텔만 따로 예약한 자유여행<\/b>은 <b>항공사·숙박업소 자체의 취소 규정<\/b>이 함께 걸립니다. 이 경우 여행사가 <b>항공권 취소수수료와 예약 대행 수수료를 별도로 청구<\/b>할 수 있는지가 자주 다툼이 되는데, 공정거래위원회는 <b>계약서에 취소수수료를 명확하게 충분히 고지했는지<\/b>를 핵심으로 봅니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 국외 패키지 여행 취소 위약금 기준표<\/h2>\n<p>별도 약정이 없을 때 적용되는 기준이 <b>「소비자분쟁해결기준」(공정거래위원회 고시)<\/b>의 여행업 항목입니다. 국외여행은 다음과 같습니다.<\/p>\n<table>\n<tr><th>취소를 알린 시점<\/th><th>여행자가 취소<\/th><th>여행사가 취소<\/th><\/tr>\n<tr><td><b>여행개시 30일 전<\/b>까지<\/td><td><b>계약금 환급<\/b> (위약금 없음)<\/td><td>계약금 환급<\/td><\/tr>\n<tr><td>29일 전 ~ <b>20일 전<\/b>까지<\/td><td>여행요금의 <b>10%<\/b><\/td><td>계약금 환급 + 요금의 10% 배상<\/td><\/tr>\n<tr><td>19일 전 ~ <b>10일 전<\/b>까지<\/td><td>여행요금의 <b>15%<\/b><\/td><td>계약금 환급 + 요금의 15% 배상<\/td><\/tr>\n<tr><td>9일 전 ~ <b>8일 전<\/b>까지<\/td><td>여행요금의 <b>20%<\/b><\/td><td>계약금 환급 + 요금의 20% 배상<\/td><\/tr>\n<tr><td>7일 전 ~ <b>1일 전<\/b>까지<\/td><td>여행요금의 <b>30%<\/b><\/td><td>계약금 환급 + 요금의 30% 배상<\/td><\/tr>\n<tr><td><b>여행 당일<\/b><\/td><td>여행요금의 <b>50%<\/b><\/td><td>계약금 환급 + 요금의 50% 배상<\/td><\/tr>\n<\/table>\n<p>오른쪽 <b>'여행사가 취소'<\/b> 칸의 <b>\"계약금 환급 + 요금의 N% 배상\"<\/b>은 <b>이미 낸 돈을 전부 돌려받고, 그에 더해 배상까지 받는다<\/b>는 뜻입니다. 잘못은 여행사가 했는데 내가 돈을 물어내는 구조가 아닙니다.<\/p>\n<p>표에서 놓치기 쉬운 대목이 두 가지 있습니다.<\/p>\n<ul>\n<li><b>\"30일 전 = 계약금 환급\"은 계약금을 돌려받는다는 뜻입니다.<\/b> 계약금을 못 돌려준다는 뜻이 아닙니다. 이 시점에 취소하면 <b>부담해야 할 위약금이 0원<\/b>이고, 이미 낸 계약금은 <b>돌려받는 것<\/b>이 원칙입니다.<\/li>\n<li><b>기준은 '여행요금'이지 '계약금'이 아닙니다.<\/b> 계약금은 통상 여행요금의 10% 이하로 받습니다. 그래서 <b>15%·20%·30% 구간에서는 계약금만으로 위약금이 다 채워지지 않고 추가로 내야 하는 상황<\/b>이 생깁니다. 3장에서 숫자로 보겠습니다.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ '며칠 전'은 통보가 도달한 날 기준입니다<\/b><p style=\"margin:8px 0 0\">\"20일 전에 마음먹었다\"가 아니라 <b>여행사에 취소 의사가 전달된 날<\/b>이 기준입니다. 전화로만 말하면 <b>날짜를 증명할 방법이 없습니다.<\/b> 반드시 <b>문자·카카오톡·이메일 등 기록이 남는 방법<\/b>으로 함께 통보하고, 그 화면을 보관하세요. 실제 분쟁에서 <b>하루 차이로 위약금 구간이 바뀌는 일<\/b>이 흔합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 계산예시 — 400만 원 패키지, 언제 취소하면 얼마<\/h2>\n<p>말로만 보면 감이 안 오니 숫자로 보겠습니다. <b>부부 2인이 총 400만 원짜리 국외 패키지를 계약하고 계약금 40만 원(요금의 10%)을 낸 경우<\/b>입니다. 별도 취소료 약정은 없다고 가정합니다.<\/p>\n<table>\n<tr><th>취소 시점<\/th><th>위약금 비율<\/th><th>위약금<\/th><th>계약금 40만 원과 정산<\/th><th>내 최종 부담<\/th><\/tr>\n<tr><td>35일 전<\/td><td>없음<\/td><td>0원<\/td><td><b>40만 원 전액 환급<\/b><\/td><td><b>0원<\/b><\/td><\/tr>\n<tr><td>25일 전<\/td><td>10%<\/td><td>40만 원<\/td><td>계약금과 상계<\/td><td><b>0원<\/b> (추가 없음)<\/td><\/tr>\n<tr><td>15일 전<\/td><td>15%<\/td><td>60만 원<\/td><td>계약금 공제 후 부족<\/td><td><b>20만 원 추가 납부<\/b><\/td><\/tr>\n<tr><td>9일 전<\/td><td>20%<\/td><td>80만 원<\/td><td>계약금 공제 후 부족<\/td><td><b>40만 원 추가 납부<\/b><\/td><\/tr>\n<tr><td>3일 전<\/td><td>30%<\/td><td>120만 원<\/td><td>계약금 공제 후 부족<\/td><td><b>80만 원 추가 납부<\/b><\/td><\/tr>\n<tr><td>여행 당일<\/td><td>50%<\/td><td>200만 원<\/td><td>계약금 공제 후 부족<\/td><td><b>160만 원 추가 납부<\/b><\/td><\/tr>\n<\/table>\n<p>여기서 확인되는 것이 <b>\"계약금만 포기하면 끝\"이 아니라는 사실<\/b>입니다. 25일 전까지는 계약금 선에서 정리되지만, <b>15일 전으로 넘어가는 순간 계약금 외에 돈을 더 내야<\/b> 합니다. 잔금까지 이미 낸 상태라면 <b>낸 돈에서 위약금을 뺀 나머지를 돌려받는<\/b> 구조가 됩니다. 400만 원을 전액 납부한 뒤 3일 전에 취소했다면 <b>120만 원을 제하고 280만 원을 환급<\/b>받게 됩니다.<\/p>\n<div class=\"tip\"><b>🔢 계산 공식<\/b><p style=\"margin:8px 0 0\"><b>돌려받을 돈 = 이미 낸 돈 − (여행요금 × 해당 구간 비율)<\/b><br>결과가 음수면 그만큼 <b>추가로 내야 하는 금액<\/b>입니다. 여행사가 제시한 금액이 이 계산과 다르면 <b>어떤 기준을 적용했는지 서면으로 요구<\/b>하세요. 대개 그 답이 <b>'특별약관'<\/b>입니다(5장).<\/p><\/div>\n<div class=\"warn\"><b>⚠️ 항공권이 이미 발권됐다면 별도 비용이 붙을 수 있습니다<\/b><p style=\"margin:8px 0 0\">위 계산은 <b>여행계약 자체의 위약금<\/b>입니다. 여기에 <b>항공사가 부과하는 항공권 취소수수료<\/b>가 더해질 수 있고, 특히 <b>특가·할인 항공권은 환불 자체가 제한<\/b>되는 경우가 많습니다. 다만 이런 비용은 <b>계약 단계에서 명확히 고지되어 있어야<\/b> 청구할 수 있다는 것이 공정거래위원회의 설명 취지입니다. <b>고지 화면·계약서에 그 문구가 실제로 있었는지<\/b>부터 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 국내여행은 기준이 다릅니다 (당일 / 숙박)<\/h2>\n<p>국내여행은 <b>국외여행과 표가 아예 다릅니다.<\/b> 국외여행은 최대 50%까지 가지만, <b>국내여행은 최대 30%<\/b>에서 멈춥니다. 그리고 <b>당일여행이냐 숙박여행이냐<\/b>에 따라 \"위약금 없는 구간\"이 달라집니다.<\/p>\n<h3>당일여행 (숙박 없음)<\/h3>\n<table>\n<tr><th>취소를 알린 시점<\/th><th>여행자가 취소<\/th><th>여행사가 취소<\/th><\/tr>\n<tr><td><b>여행개시 3일 전<\/b>까지<\/td><td><b>전액 환급<\/b><\/td><td>계약금 환급<\/td><\/tr>\n<tr><td><b>2일 전<\/b>까지<\/td><td>요금의 <b>10%<\/b><\/td><td>계약금 환급 + 요금의 10% 배상<\/td><\/tr>\n<tr><td><b>1일 전<\/b>까지<\/td><td>요금의 <b>20%<\/b><\/td><td>계약금 환급 + 요금의 20% 배상<\/td><\/tr>\n<tr><td><b>당일<\/b> 취소 · 연락 없이 불참<\/td><td>요금의 <b>30%<\/b><\/td><td>계약금 환급 + 요금의 30% 배상<\/td><\/tr>\n<\/table>\n<h3>숙박여행<\/h3>\n<table>\n<tr><th>취소를 알린 시점<\/th><th>여행자가 취소<\/th><th>여행사가 취소<\/th><\/tr>\n<tr><td><b>여행개시 5일 전<\/b>까지<\/td><td><b>전액 환급<\/b><\/td><td>계약금 환급<\/td><\/tr>\n<tr><td><b>2일 전<\/b>까지<\/td><td>요금의 <b>10%<\/b><\/td><td>계약금 환급 + 요금의 10% 배상<\/td><\/tr>\n<tr><td><b>1일 전<\/b>까지<\/td><td>요금의 <b>20%<\/b><\/td><td>계약금 환급 + 요금의 20% 배상<\/td><\/tr>\n<tr><td><b>당일<\/b> 취소 · 연락 없이 불참<\/td><td>요금의 <b>30%<\/b><\/td><td>계약금 환급 + 요금의 30% 배상<\/td><\/tr>\n<\/table>\n<p>두 표의 오른쪽 칸을 왼쪽과 비교해 <b>\"여행사가 잘못했는데 나는 계약금만 돌려받나\"<\/b>라고 읽으시면 안 됩니다. <b>여행사가 취소한 경우의 '계약금 환급 + N% 배상'은 이미 낸 돈을 전부 돌려받은 뒤 추가로 배상까지 받는다<\/b>는 뜻입니다. 여행자가 취소하는 왼쪽 칸보다 <b>언제나 유리합니다.<\/b><\/p>\n<p>국내여행에서 특히 <b>손해가 크게 갈리는 지점은 \"3일 전\"과 \"5일 전\"<\/b>입니다. 숙박여행은 <b>5일 전까지<\/b> 알려야 전액 환급인데, <b>4일 전에 알리면 곧바로 10% 구간<\/b>으로 떨어집니다. 국내 패키지는 금액이 크지 않아 넘어가기 쉽지만, <b>가족 단위로 여러 명을 계약했다면 10%도 적은 돈이 아닙니다.<\/b><\/p>\n<div class=\"tip\"><b>💡 국외 vs 국내 한눈에<\/b><p style=\"margin:8px 0 0\"><b>위약금이 0원인 구간<\/b> — 국외 <b>30일 전<\/b> / 국내 당일여행 <b>3일 전<\/b> / 국내 숙박여행 <b>5일 전<\/b>.<br><b>최대 위약금<\/b> — 국외 <b>50%<\/b>(여행 당일) / 국내 <b>30%<\/b>(당일·무연락).<br>국외여행은 <b>한 달 전에 결정<\/b>하는 것이 위약금을 피하는 유일한 방법이고, 국내여행은 <b>일주일 전쯤<\/b>만 정리해도 대부분 피할 수 있습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 가장 큰 함정 — 여행사 '특별약관'이 우선하는 경우<\/h2>\n<p>여기가 이 글에서 <b>가장 중요한 부분<\/b>입니다. 많은 분이 <b>\"소비자분쟁해결기준은 법이니까 여행사가 무조건 따라야 한다\"<\/b>고 알고 계시는데, <b>그렇지 않습니다.<\/b><\/p>\n<p>공정거래위원회는 소비자분쟁해결기준의 성격에 대해 <b>강행규정이라기보다는 거래관행의 규범(code of conduct)<\/b>이며, <b>당사자 사이에 별도의 의사표시가 없는 경우에 한해 적용된다<\/b>는 취지로 설명하고 있습니다. 즉 <b>계약서에서 취소료를 달리 정했다면 그 약정이 먼저<\/b>입니다.<\/p>\n<table>\n<tr><th>상황<\/th><th>적용 기준<\/th><th>실제 결과<\/th><\/tr>\n<tr><td>계약서에 취소료 규정이 <b>없음<\/b><\/td><td><b>소비자분쟁해결기준<\/b><\/td><td>2·4장 기준표대로<\/td><\/tr>\n<tr><td>계약서에 <b>\"소비자분쟁해결기준에 따른다\"<\/b>고 적힘<\/td><td><b>소비자분쟁해결기준<\/b><\/td><td>2·4장 기준표대로<\/td><\/tr>\n<tr><td>계약서에 <b>자체 취소료 표<\/b>가 있고 <b>설명·별도 확인<\/b>을 받음<\/td><td><b>여행사 특별약관<\/b><\/td><td>여행사 표대로 (더 불리할 수 있음)<\/td><\/tr>\n<tr><td>자체 취소료 표는 있으나 <b>설명·확인 흔적이 없음<\/b><\/td><td><b>다툼의 대상<\/b><\/td><td>기준표 적용을 주장할 근거가 있음<\/td><\/tr>\n<\/table>\n<p>다만 여행사가 <b>아무렇게나 특별약관을 들이밀 수 있는 것은 아닙니다.<\/b> 국외여행 표준약관은 특약에 대해 <b>서면(전자문서 포함)으로 맺어야 하고<\/b>, 여행사는 <b>그 특약이 표준약관과 다르며 표준약관보다 우선 적용된다는 점을 여행자에게 설명하고 별도의 확인을 받아야<\/b> 한다고 정하고 있습니다.<\/p>\n<div class=\"warn\"><b>⚠️ 그래서 따져야 할 질문은 이것입니다<\/b><p style=\"margin:8px 0 0\">\"우리 회사 규정입니다\"라는 답을 들었다면 <b>다음 세 가지를 서면으로 요구<\/b>하세요. <b>①<\/b> 그 취소료 규정이 적힌 <b>계약서·약관 원문<\/b> <b>②<\/b> 그것이 <b>표준약관과 다르다는 설명을 했다는 기록<\/b> <b>③<\/b> 내가 그 내용을 <b>별도로 확인(동의)했다는 기록<\/b>. 세 가지가 모두 나오지 않으면, <b>소비자분쟁해결기준 적용을 주장할 여지<\/b>가 생깁니다. 반대로 <b>가입 화면에서 취소료 표에 따로 체크한 기억이 있다면<\/b> 그 특약이 적용될 가능성이 높습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 위약금 없이 취소할 수 있는 사유<\/h2>\n<p>시점과 무관하게 <b>손해배상(위약금) 없이 계약을 해제할 수 있는 사유<\/b>가 따로 정해져 있습니다. 여행 표준약관이 정한 내용은 다음과 같습니다.<\/p>\n<h3>여행자가 위약금 없이 해제할 수 있는 경우<\/h3>\n<ul>\n<li>여행자의 <b>안전과 보호<\/b>를 위해 여행자의 요청 또는 현지 사정으로 <b>부득이하다고 쌍방이 합의<\/b>한 경우<\/li>\n<li><b>천재지변·전란·정부의 명령·운송 및 숙박기관 등의 파업·휴업<\/b> 등으로 <b>여행의 목적을 달성할 수 없는<\/b> 경우<\/li>\n<li>여행사가 <b>공제·보증보험에 가입하지 않았거나 영업보증금을 예치하지 않은<\/b> 경우<\/li>\n<li><b>3촌 이내 친족<\/b>이 사망한 경우<\/li>\n<li><b>질병 등 신체 이상<\/b>으로 여행 참가가 불가능한 경우<\/li>\n<li><b>배우자 또는 직계존비속이 3일 이상 입원<\/b>하여 여행 출발 시까지 퇴원이 곤란한 경우, <b>그 보호자 1인<\/b><\/li>\n<li><b>여행사의 귀책사유<\/b>로 계약서에 기재된 일정대로 여행 실시가 불가능해진 경우<\/li>\n<\/ul>\n<h3>여행사가 위약금 없이 해제할 수 있는 경우<\/h3>\n<ul>\n<li>위 첫 두 가지(안전상 합의 · 천재지변 등 목적 달성 불가)는 동일<\/li>\n<li>여행자가 <b>다른 여행자에게 폐를 끼치거나<\/b> 여행의 원활한 실시에 <b>현저한 지장이 있다고 인정<\/b>될 때<\/li>\n<li>여행자의 <b>질병 등 신체 이상<\/b>으로 여행 참가가 불가능한 경우<\/li>\n<li>여행자가 <b>계약서에 기재된 기일까지 여행요금을 내지 않은<\/b> 경우<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ 여기서 실제로 거절당하는 이유 4가지<\/b><p style=\"margin:8px 0 0\"><b>① \"3촌 이내\"에 사촌은 들어가지 않습니다.<\/b> 사촌은 4촌입니다. 3촌은 <b>백부·숙부·고모·이모·외삼촌과 조카<\/b>까지입니다. 사촌 상(喪)으로 취소하면 이 사유로는 인정받기 어렵습니다.<br><b>② 보호자 면제는 1인만입니다.<\/b> 어머니가 입원하셨다고 <b>온 가족이 위약금 없이 취소<\/b>되는 것이 아니라 <b>보호자 1명<\/b>만 해당합니다.<br><b>③ 질병은 증빙이 핵심입니다.<\/b> \"컨디션이 안 좋다\"는 해당하지 않습니다. <b>여행 참가가 불가능하다는 점이 드러나는 진단서 등 객관적 자료<\/b>를 준비하세요.<br><b>④ 입원은 '3일 이상'이고 '출발 시까지 퇴원 곤란'이어야 합니다.<\/b> 하루 이틀 입원했다가 퇴원하는 경우는 해당하지 않습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 태풍·천재지변이면 전액 환불인가<\/h2>\n<p>여름철에 가장 많이 나오는 질문입니다. 결론부터 말하면 <b>\"태풍이 온다더라\"만으로는 부족합니다.<\/b> 약관이 정한 문구는 <b>\"천재지변 등으로 여행의 목적을 달성할 수 없는 경우\"<\/b>이지, <b>\"기상이 나쁠 것 같은 경우\"<\/b>가 아닙니다.<\/p>\n<table>\n<tr><th>상황<\/th><th>인정 가능성<\/th><th>이유<\/th><\/tr>\n<tr><td>출발 항공편이 <b>기상으로 결항<\/b><\/td><td><b>높음<\/b><\/td><td>여행 자체가 성립하지 않음 · 결항 증빙 명확<\/td><\/tr>\n<tr><td>현지에 <b>정부의 여행 제한·통제<\/b> 조치<\/td><td><b>높음<\/b><\/td><td>'정부의 명령'에 해당<\/td><\/tr>\n<tr><td>현지 <b>주요 일정지가 재난으로 폐쇄<\/b><\/td><td>중간<\/td><td>일정의 상당 부분이 불가능한지가 관건<\/td><\/tr>\n<tr><td>여행지에 <b>태풍 예보·주의보<\/b>만 있음<\/td><td><b>낮음<\/b><\/td><td>목적 달성 불가로 보기 어려움 · 예보는 바뀜<\/td><\/tr>\n<tr><td><b>비가 많이 올 것 같아<\/b> 미리 취소<\/td><td><b>낮음<\/b><\/td><td>여행자 개인 사정에 가까움<\/td><\/tr>\n<\/table>\n<p>실무적으로는 <b>\"내가 불안해서 취소\"와 \"여행이 불가능해져서 취소\"를 구분<\/b>한다고 보면 됩니다. 앞의 것은 일반 위약금 구간이 그대로 적용되고, 뒤의 것이라야 면제를 주장할 수 있습니다.<\/p>\n<div class=\"tip\"><b>💡 태풍철에 실제로 도움이 되는 순서<\/b><p style=\"margin:8px 0 0\"><b>①<\/b> 성급하게 먼저 취소 통보를 넣지 마세요. 내가 먼저 취소하면 <b>'여행자 귀책 취소'<\/b>로 처리되기 쉽습니다.<br><b>②<\/b> <b>항공사의 결항·지연 확정 안내<\/b>를 기다린 뒤, 그 안내문을 캡처해 두세요. 이것이 가장 강한 증빙입니다.<br><b>③<\/b> 외교부 <b>해외안전여행<\/b>의 여행경보·특별여행주의보 발령 여부를 함께 확인하세요.<br><b>④<\/b> 여행사에 <b>\"천재지변으로 여행 목적 달성이 불가능한 경우에 해당하는지\"<\/b>를 명시해 서면으로 질의하세요. 구두 대화는 남지 않습니다.<br><b>⑤<\/b> 항공기 결항·지연 자체에 대한 보상은 <b>여행계약 위약금과는 별개 절차<\/b>입니다. 아래 '함께 보면 좋은 글'의 결항 보상 편을 참고하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 여행사가 취소한 경우 — 인원 미달 포함<\/h2>\n<p>취소는 여행자만 하는 것이 아닙니다. <b>여행사가 취소하는 경우<\/b>가 오히려 억울한데, 이때는 <b>계약금을 돌려받는 것에 더해 배상까지<\/b> 받을 수 있습니다(2·4장 표의 오른쪽 열).<\/p>\n<p>패키지에서 가장 흔한 사유가 <b>\"최소 출발 인원이 안 채워졌다\"<\/b>는 것입니다. 국외여행에서는 이 경우 <b>여행사가 여행 출발 7일 전까지 여행자에게 통지<\/b>해야 합니다. 이 기한을 지키지 않고 계약을 해제하면, <b>이미 받은 계약금을 돌려주는 것 외에 추가로 배상<\/b>해야 합니다.<\/p>\n<table>\n<tr><th>여행사의 인원 미달 통지 시점<\/th><th>여행자가 받을 수 있는 것<\/th><\/tr>\n<tr><td><b>여행 출발 7일 전<\/b>까지 통지<\/td><td>계약금 환급 (추가 배상 없음)<\/td><\/tr>\n<tr><td>기한을 넘겨 <b>출발 1일 전<\/b>까지 통지<\/td><td>계약금 환급 + <b>여행요금의 30%<\/b> 배상<\/td><\/tr>\n<tr><td>기한을 넘겨 <b>출발 당일<\/b> 통지<\/td><td>계약금 환급 + <b>여행요금의 50%<\/b> 배상<\/td><\/tr>\n<\/table>\n<p>여기서 실질적으로 중요한 것은 <b>\"인원 미달이니 어쩔 수 없다\"는 말에 그냥 계약금만 돌려받고 끝내지 말라<\/b>는 점입니다. <b>출발이 임박해서 통보받았다면 배상 대상<\/b>입니다. 출발 3~4일 전에 취소 통보를 받아 <b>다른 여행을 잡지도 못하고 휴가만 날린 경우<\/b>가 정확히 이 경우입니다.<\/p>\n<div class=\"tip\"><b>💡 여행요금이 갑자기 올랐다는 연락을 받았다면<\/b><p style=\"margin:8px 0 0\">여행요금은 <b>운송·숙박기관에 지급할 요금이 계약 때보다 5% 이상 오르내리거나, 적용 환율이 2% 이상 변동<\/b>한 경우에 한해 증감을 청구할 수 있고, <b>증액할 때는 여행 출발일 15일 전에 통지<\/b>해야 합니다. 출발 직전에 갑자기 \"유류할증료가 올라 추가 부담이 필요하다\"는 연락을 받았다면 <b>통지 시점부터 따져 보세요.<\/b><\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 출발한 뒤에 그만두면<\/h2>\n<p>여행이 시작된 뒤에도 <b>부득이한 사유가 있으면 계약을 해지<\/b>할 수 있습니다. 다만 조건이 다릅니다.<\/p>\n<ul>\n<li><b>부득이한 사유로 인한 해지<\/b> — 여행사나 여행자 모두 여행 출발 후에도 부득이한 사유가 있으면 계약을 해지할 수 있습니다. 다만 <b>그 사유가 어느 한쪽의 과실로 생긴 것이라면 상대방의 손해를 배상<\/b>해야 합니다(민법 제674조의4 제1항).<\/li>\n<li><b>귀국 협조는 여행사 책임<\/b> — 여행 중 계약이 해지되더라도 <b>여행자가 귀국하는 데 필요한 조치를 해 주어야 하는 것은 여행사<\/b>입니다. \"계약이 끝났으니 알아서 오시라\"는 통하지 않습니다.<\/li>\n<li><b>중대한 하자로 인한 해지<\/b> — 여행에 <b>중대한 하자<\/b>가 있는데 시정되지 않거나 계약 내용대로의 이행을 기대할 수 없다면, 여행자는 계약을 해지할 수 있습니다(민법 제674조의7 제1항). 일정이 계약서와 전혀 다르거나 숙소 등급이 크게 어긋난 경우가 여기에 해당할 수 있습니다.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ 현지에서 반드시 남겨야 할 것<\/b><p style=\"margin:8px 0 0\">출발 후 문제로 다투게 되면 <b>증거는 현지에서만 만들 수 있습니다.<\/b> ① <b>계약서에 적힌 일정·숙소 등급<\/b>과 실제가 다른 부분을 <b>사진·영상<\/b>으로 남기고 ② 인솔자·가이드에게 <b>시정을 요구한 사실을 문자 등으로<\/b> 남기고 ③ <b>추가로 쓴 비용의 영수증<\/b>을 모으세요. 돌아온 뒤에 말로만 주장하면 인정받기 어렵습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">10. 분쟁이 생겼을 때 대응 순서<\/h2>\n<p>여행사와 이야기가 되지 않을 때 밟는 순서입니다. <b>순서를 건너뛰면 오히려 오래 걸립니다.<\/b><\/p>\n<table>\n<tr><th>단계<\/th><th>할 일<\/th><th>핵심<\/th><\/tr>\n<tr><td><b>1<\/b><\/td><td>계약서 · 약관 · 취소 통보 기록 <b>확보<\/b><\/td><td>전자문서·모바일 동의 화면 포함<\/td><\/tr>\n<tr><td><b>2<\/b><\/td><td>여행사에 <b>서면<\/b>으로 산정 근거 요구<\/td><td>\"어떤 기준을 적용했는지\" 명시 요구<\/td><\/tr>\n<tr><td><b>3<\/b><\/td><td><b>1372 소비자상담센터<\/b> 상담<\/td><td>국번 없이 <b>1372<\/b> · 온라인 접수 가능<\/td><\/tr>\n<tr><td><b>4<\/b><\/td><td><b>한국소비자원 피해구제<\/b> 신청<\/td><td>합의 권고 단계<\/td><\/tr>\n<tr><td><b>5<\/b><\/td><td><b>소비자분쟁조정위원회<\/b> 조정<\/td><td>양쪽이 수락하면 재판상 화해 효력<\/td><\/tr>\n<\/table>\n<p>2단계를 특히 권합니다. <b>\"우리 규정\"이라는 구두 답변과 달리, 서면으로 근거를 요구하면 특별약관인지 기준표인지가 드러납니다.<\/b> 여기서 정리되는 경우가 많습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec11\">11. 자주 묻는 질문<\/h2>\n<h3>Q. 계약금만 걸었는데, 취소하면 계약금만 날리면 되나요?<\/h3>\n<p>아닙니다. <b>시점에 따라 계약금보다 더 낼 수도, 계약금을 전부 돌려받을 수도<\/b> 있습니다. 국외여행은 <b>30일 전까지 통보하면 계약금을 돌려받고<\/b>, 반대로 <b>10일 전 이후에 취소하면 계약금(통상 10%)을 넘는 위약금<\/b>이 나옵니다(3장 계산표).<\/p>\n<h3>Q. 여행사가 \"출발 60일 전부터 취소료가 발생한다\"고 합니다.<\/h3>\n<p>표준약관·소비자분쟁해결기준보다 이른 시점부터 취소료를 매기는 것은 <b>특별약관<\/b>입니다. <b>서면(전자문서 포함)으로 맺었는지<\/b>, <b>표준약관과 다르고 우선 적용된다는 설명과 별도 확인을 받았는지<\/b>를 따져 보세요. 그 절차가 지켜졌다면 특약이 적용될 수 있습니다.<\/p>\n<h3>Q. 여행 취소는 며칠 전으로 계산하나요? 주말은 빼나요?<\/h3>\n<p>달력상의 날로 셉니다. 기준은 <b>취소 의사가 여행사에 도달한 날<\/b>이며, <b>기록이 남는 방법으로 통보<\/b>해야 그 날짜를 증명할 수 있습니다.<\/p>\n<h3>Q. 여행자보험에 들었는데 취소 위약금도 보상되나요?<\/h3>\n<p>상품에 따라 다릅니다. <b>여행 취소·중단 손해를 보장하는 특약이 붙어 있는 경우에만<\/b> 가능하고, 기본 담보만으로는 보상되지 않는 경우가 많습니다. <b>보장 항목에 취소 관련 특약이 있는지<\/b>를 증권에서 확인하세요.<\/p>\n<h3>Q. 국내 패키지도 30일 전 기준이 적용되나요?<\/h3>\n<p>아닙니다. <b>국내여행은 당일여행 3일 전, 숙박여행 5일 전<\/b>이 위약금 없는 구간입니다(4장). 국외 기준을 국내에 그대로 적용하면 손해를 봅니다.<\/p>\n<h3>Q. 여행사가 인원 미달로 취소했는데 계약금만 돌려준다고 합니다.<\/h3>\n<p>국외여행에서 인원 미달로 인한 해제는 <b>출발 7일 전까지 통지<\/b>해야 합니다. 그 기한을 넘겨 통지했다면 <b>계약금 환급에 더해 배상<\/b>을 요구할 수 있습니다(8장 표).<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec12\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내<\/b>\n<a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?ccfNo=2&amp;cciNo=3&amp;cnpClsNo=3&amp;csmSeq=894&amp;popMenu=ov\" rel=\"nofollow\" target=\"_blank\">▸ 찾기쉬운 생활법령정보 — 해외여행자 : 여행계약의 변경, 해제 및 해지<\/a>\n<a href=\"https://www.easylaw.go.kr/CSP/CnpClsMain.laf?csmSeq=1662&amp;ccfNo=1&amp;cciNo=2&amp;cnpClsNo=2\" rel=\"nofollow\" target=\"_blank\">▸ 찾기쉬운 생활법령정보 — 국내여행자 : 여행사의 책임 및 여행계약 해제·해지하기<\/a>\n<a href=\"https://www.law.go.kr/LSW//admRulInfoP.do?admRulSeq=2100000253084&amp;chrClsCd=010201\" rel=\"nofollow\" target=\"_blank\">▸ 국가법령정보센터 — 소비자분쟁해결기준(공정거래위원회고시 제2024-32호)<\/a>\n<a href=\"https://www.consumer.go.kr/user/bbs/consumer/380/940/bbsDataView/3147.do\" rel=\"nofollow\" target=\"_blank\">▸ 소비자24 — 국외여행 취소수수료 적용 기준에 관한 공정거래위원회 답변<\/a>\n<p style=\"margin:10px 0 0;font-size:14px;color:#1b4f86\">▸ 소비자 상담·피해구제 접수는 <b>국번 없이 1372<\/b>(소비자상담센터)<\/p>\n<\/div>\n\n<div class=\"end\"><b>✅ 마무리 — 세 줄로 정리하면<\/b><p style=\"margin:8px 0 0\"><b>①<\/b> 별도 약정이 없다면 <b>국외는 30일 전, 국내는 당일여행 3일 전·숙박여행 5일 전<\/b>까지 알려야 위약금이 없고, 그 뒤로는 <b>국외 10→15→20→30→50%<\/b>, <b>국내 10→20→30%<\/b>로 올라갑니다. <b>②<\/b> 그런데 <b>소비자분쟁해결기준은 강행규정이 아니라 별도 약정이 없을 때 적용되는 기준<\/b>이라, <b>계약서의 특별약관이 우선<\/b>할 수 있습니다 — 그래서 <b>계약서 원문 확인이 1번<\/b>입니다. <b>③<\/b> <b>3촌 이내 친족 사망, 본인 질병, 배우자·직계존비속 3일 이상 입원(보호자 1인)<\/b> 등은 위약금 없이 해제할 수 있는 사유이니, 해당한다면 <b>증빙부터 갖춰 서면으로 요구<\/b>하세요.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, <b>소비자분쟁해결기준과 여행 표준약관은 개정될 수 있습니다.<\/b> 또한 본문에서 설명했듯 <b>실제 적용되는 취소료는 계약서·특별약관 내용에 따라 달라지므로<\/b>, 반드시 <b>본인이 체결한 계약서 원문을 먼저 확인<\/b>하시기 바랍니다.<br>3장의 금액은 <b>여행요금 400만 원·계약금 40만 원, 별도 취소료 약정이 없는 경우<\/b>를 가정해 기준표의 비율로 계산한 예시이며, 실제 정산액은 계약 조건과 이미 납부한 금액에 따라 달라집니다. 항공권 취소수수료 등 <b>여행계약 위약금과 별개로 발생하는 비용<\/b>은 포함하지 않았습니다.<br>출처: 찾기쉬운 생활법령정보(법제처) 「해외여행자 — 여행계약의 변경·해제 및 해지」 및 「국내여행자 — 여행사의 책임 및 여행계약 해제·해지하기」, 국가법령정보센터 「소비자분쟁해결기준」(공정거래위원회고시 제2024-32호, 2024년 12월 27일 시행), 소비자24(공정거래위원회·한국소비자원) 국외여행 취소수수료 관련 질의 답변, 국외여행·국내여행 표준약관, 민법 제674조의4·제674조의7. 소비자상담 국번 없이 1372<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01858941660.html\">▸ 펜션 호텔 예약 취소 수수료 환불 규정 총정리 (2026 성수기 위약금)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_0459503221.html\">▸ 항공기 결항 지연 보상 신청 방법 기준표 면책 사유 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_452.html\">▸ 여행자보험 가입 방법 보장 비교 총정리<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 위약금 비율·면제 사유·통지 기한은 <b>법제처 찾기쉬운 생활법령정보와 국가법령정보센터의 소비자분쟁해결기준, 공정거래위원회 답변을 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 계산 예시는 가정치를 명시했습니다. 실제 취소료는 계약서·특별약관에 따라 달라지니 계약 원문을 함께 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 여행사 패키지를 취소할 때 취소료는 여행사 마음대로가 아닙니다. 별도 약정이 없으면 소비자분쟁해결기준이 적용돼서, 국외여행은 출발 30일 전까지 알리면 위약금 0원(계약금도 돌려받음), 그 뒤로 20일 전 10%, 10일 전 15%, 8일 전 20%, 1일 전 30%, 당일 50%로 올라갑니다. 국내여행은 다릅니다 — 당일여행은 3일 전, 숙박여행은 5일 전까지가 전액 환급이고 최대치도 30%에서 멈춥니다.\n2. 그런데 여기에 큰 함정이 있습니다. 소비자분쟁해결기준은 강행규정이 아니라 '별도 의사표시가 없을 때' 적용되는 기준이라, 계약서에 여행사 자체 취소료 표(특별약관)가 있고 그게 표준약관과 다르다는 설명과 별도 확인을 받았다면 그 특약이 먼저입니다. 그래서 다툼이 생기면 인터넷 기준표를 들이밀기 전에 내 계약서 원문부터 확인해야 합니다.\n3. 시점과 무관하게 위약금 없이 취소되는 사유도 있습니다. 3촌 이내 친족 사망, 본인의 질병 등 신체 이상, 배우자·직계존비속이 3일 이상 입원해 출발 시까지 퇴원이 곤란한 경우의 보호자 1인 등입니다. 주의할 건 사촌은 4촌이라 빠지고, 보호자 면제는 1명만이라는 점입니다. 태풍도 '예보'만으로는 부족하고 결항·정부 통제처럼 여행 목적 달성이 실제로 불가능해야 합니다.\n"},{"code":"A5-05","title":"일손부족일자리 동행 인센티브 신청 방법 대상 50~64세 360만 원 총정리 (2026 시범사업)","lane":"info","thumb":"145_midlife_job_incentive.png","draft":"일손부족일자리동행인센티브_글_HTML.txt","facts":"고용노동부 2026년 시범사업, 2026.7.1. 접수 개시 | 지원대상=폴리텍(중장년)·국기훈련·경력지원제 등 수료한 50~64세 중장년(취업일 기준) ← 🔴언론은 전부 '50세 이상'이라 썼으나 공식 인포그래픽은 상한 64세 | 업종=제조업 or 운수및창고업(둘 중 하나=OR) | 사업장규모=①피보험자수 5인 이상 AND ②고용보험법 시행령 제12조 우선지원대상기업(서식 원문 '위 규모요건 모두 충족하여야 함'=AND) ← 🔴언론은 '5인 이상'만 보도 | 금액=6개월 근속 180만원 + 12개월 근속 180만원 = 최대 360만원, 근로자 본인 계좌(타인계좌 지급불가) | 신청기한=근속 6개월 달성 후 다음 달부터 3개월 이내 | 재직증명서는 신청일 전 2주 이내 발급분만 인정 | 절차=훈련·일경험 수료→일손부족업종 취업→6개월 근속→신청→사실관계 확인 후 지급 | 접수처=관할 지방고용노동청(취업지원총괄과) 오프라인, 고용24 가입 병행 안내, 고용노동부·고용24에서 '일손' 검색 | 쿼터=전국 1,000명(서울청 100·경기/중부/부산/대구/광주/대전청 각 150), 원문 각주 '예산 소진 시 지원요건을 충족하더라도 지원이 제한될 수 있음' | 지원제외 8종(중장년 확인서 원문)=①사업주·임원의 배우자·직계존비속 ②외국인(F-2·F-5·F-6 제외) ③파견·용역 간접고용 ④이직 당시 사업주와 동일·밀접관련 ⑤부정청구 처분 1년 미경과 ⑥타 사업장 취업 중 ⑦근속 중단(휴업·휴직, 병가 등 근로자 사정 포함 모두) ⑧동일기간·동일목적 타 인센티브(국민취업지원제도 취업성공수당, 지자체 취업·근속인센티브) | 2차는 '근로기간 단절없이 근속 중' 확인란 있음(6개월 후 이직 시 2차 없음) | 근속승계 사업주 확인서=합병·분할·양도양수 시, 근로자 작성 금지, 허위 시 사업주
