<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="icon" href="data:,">
<title>진행현황 — 생활정보 모음</title>
<style>
:root{--bg:#0e1620;--card:#18222e;--card2:#13202d;--line:#26323f;--txt:#e6edf3;--mut:#8a97a6;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:470px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:16px;font-weight:600}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(63,185,80,.16);color:var(--ok)}
.b-warn{background:rgba(210,153,34,.16);color:var(--warn)}
.b-bad{background:rgba(248,81,73,.16);color:var(--bad)}
.sec{font-size:11px;color:var(--mut);letter-spacing:.05em;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
.metrics{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 2px}
/* 채널이 4개가 되어 490px 팝업에서 눌리므로, 좁아지면 2x2로 감싸게 한다 */
.m{flex:1 1 96px;background:var(--card2);border-radius:9px;padding:8px 10px}
.m .l{font-size:11px;color:var(--mut)}
.m .v{font-size:18px;font-weight:600;margin-top:2px}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #243049;font-size:12.5px}
li:last-child{border-bottom:none}
li.on{opacity:.62}
li.on .lbl{text-decoration:line-through}
li svg{width:15px;height:15px;flex:none}
li.on svg{color:var(--ok)}
li.now svg{color:#7fc1ff}
li.wait svg{color:#4a586e}
.num{font-size:11px;color:#6b7a99;width:16px;text-align:right;flex:none}
.who{font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px;flex:none}
.who.ai{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.who.me{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.lbl{font-size:12.5px}
.star{color:#ff8e8e;font-weight:800;margin-left:2px}
.banner{display:none;margin-top:9px;background:#0c3a2c;border:1px solid #1f6b52;color:#06d6a0;border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12.5px}
.banner.show{display:block}
.upd{font-size:11px;color:var(--mut);text-align:right;margin-top:12px}
.agent{background:var(--card2);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.agent .ah{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.agent .st{font-size:10px;font-weight:700;padding:1px 7px;border-radius:7px;margin-left:auto}
.st.active{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.st.uncommitted{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.st.idle{background:#222c3a;color:#6b7a99;border:1px solid #2e3a4a}
.agent .role{font-size:11px;color:var(--mut);margin:3px 0 1px}
.agent .own{font-size:10.5px;color:#5a6b80}
.agent .act{font-size:11px;color:#aeb9c7;margin-top:4px;padding-left:7px;border-left:2px solid #2a3a4d;line-height:1.5}
.agent .act .d{color:var(--mut);font-size:10px}
.advice{background:#13202d;border:1px solid #2a3a4d;border-radius:9px}
.advice .ai{display:flex;gap:8px;padding:7px 11px;font-size:12px;line-height:1.5;border-bottom:1px dashed #243049}
.advice .ai:last-child{border-bottom:none}
.advice .ic{flex:none}
.prow{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px dashed #243049;font-size:11.5px}
.prow:last-child{border-bottom:none}
.pcd{color:#7fc1ff;font-weight:700;flex:none;width:46px}
.ptt{flex:1;color:#cdd6e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{background:#3a2f12;color:#ffd166;border-radius:5px;padding:0 5px;font-size:9.5px;flex:none}
.pact{color:#06d6a0;font-size:10px;flex:none;font-weight:700}
.qcard{display:flex;gap:9px;padding:8px;margin:6px 0;background:#141c2c;border:1px solid #243049;border-radius:9px}
.qth{width:78px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:#0d1420}
.qth.none{display:flex;align-items:center;justify-content:center;color:#54627a;font-size:9px;text-align:center;line-height:1.2;border:1px dashed #2a3752}
.qbody{flex:1;min-width:0}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qcode{color:#7fc1ff;font-weight:700;font-size:11.5px}
.qlane{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700}
.qlane.info{background:#12283a;color:#7fc1ff}
.qlane.pop{background:#2f2136;color:#e0a3ff}
.qtitle{color:#e6edf5;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qfacts{color:#8a95a6;font-size:10px;margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qmeta{margin-top:4px}
.qdraft{color:#6b7688;font-size:9.5px;margin-left:8px}
.qpv{background:#17324a;color:#7fc1ff;border:1px solid #2a4d6e;border-radius:6px;font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer}
.qpv:hover{background:#1d4463}
.qpv.none{background:none;border:none;color:#54627a;font-weight:400;cursor:default;padding:3px 0}
#qpv-ov{display:none;position:fixed;inset:0;background:rgba(6,10,18,.82);z-index:999;align-items:center;justify-content:center;padding:18px}
#qpv-ov.show{display:flex}
.qpv-box{width:100%;max-width:760px;height:88vh;display:flex;flex-direction:column;background:#0f1626;border:1px solid #2a3752;border-radius:12px;overflow:hidden}
.qpv-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #243049;font-size:12.5px;font-weight:700;color:#7fc1ff}
.qpv-hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpv-x{background:#243049;color:#cdd6e0;border:none;border-radius:6px;font-size:11px;padding:5px 11px;cursor:pointer;flex:none}
.qpv-x:hover{background:#324158}
.qpv-fr,#qpv-fr{flex:1;width:100%;border:0;background:#fff}
.qpv-ft{padding:8px 14px;border-top:1px solid #243049;font-size:10px;color:#8a95a6;text-align:center}
.ch{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 4px;flex:none;margin-left:3px}
.ch.on{background:#0c3a2c;color:#06d6a0}
.ch.off{background:#3a1216;color:#f0707a}
</style>
</head>

<div class="card" id="board" role="status">불러오는 중…</div>

</div>

h{background:#f0ebfc}\n.lsg .tip{background:#f4f1fd;border:1px solid #ded4f7;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .warn{background:#fff3f3;border:1px solid #f6cccc;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .end{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:16px 20px;margin-top:24px}\n.lsg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#f4f1fd;border:1px solid #ded4f7;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#6544cc;margin-bottom:8px}\n.lsg .rel a{display:block;color:#5a3cc0;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#9a92aa;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>여행사에서 패키지 여행을 계약했다가 사정이 생겨 취소할 때, 가장 먼저 듣는 말은 대개 <b>\"지금 취소하시면 취소료가 이만큼 나옵니다\"<\/b>입니다. 그런데 그 금액이 <b>맞는 금액인지 확인할 방법<\/b>을 아는 분은 많지 않습니다. 여행요금의 절반을 떼겠다는 말을 듣고도 <b>근거를 따져 묻지 못한 채 그냥 물어내는 경우<\/b>가 대부분입니다. 정부가 정해 둔 기준이 분명히 있는데도 그렇습니다. 게다가 <b>정말 중요한 함정이 하나 더<\/b> 있습니다. 그 정부 기준이 <b>모든 계약에 무조건 적용되는 것이 아니라는 점<\/b>입니다. 이 글에서는 <b>국외·국내 패키지 여행의 시점별 위약금 기준표, 실제 금액 계산, 위약금 없이 취소할 수 있는 사유, 여행사 특별약관이 우선하는 경우, 분쟁 시 대응 순서<\/b>까지 공식 자료를 근거로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 먼저 확인할 것 — 내 계약에 적용되는 기준<\/a><a href=\"#sec2\">2. 국외 패키지 여행 취소 위약금 기준표<\/a><a href=\"#sec3\">3. 계산예시 — 400만 원 패키지, 언제 취소하면 얼마<\/a><a href=\"#sec4\">4. 국내여행은 기준이 다릅니다 (당일 / 숙박)<\/a><a href=\"#sec5\">5. 가장 큰 함정 — 여행사 '특별약관'이 우선하는 경우<\/a><a href=\"#sec6\">6. 위약금 없이 취소할 수 있는 사유<\/a><a href=\"#sec7\">7. 태풍·천재지변이면 전액 환불인가<\/a><a href=\"#sec8\">8. 여행사가 취소한 경우 — 인원 미달 포함<\/a><a href=\"#sec9\">9. 출발한 뒤에 그만두면<\/a><a href=\"#sec10\">10. 분쟁이 생겼을 때 대응 순서<\/a><a href=\"#sec11\">11. 자주 묻는 질문<\/a><a href=\"#sec12\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec2\">👉 시점별 위약금 기준표 바로 보기<\/a>\n\n<h2 id=\"sec1\">1. 먼저 확인할 것 — 내 계약에 적용되는 기준<\/h2>\n<p>여행 취소료를 따질 때 사람들이 가장 많이 하는 실수는 <b>인터넷에서 본 \"30일 전이면 전액 환불\"이라는 문장 하나만 들고 여행사와 다투는 것<\/b>입니다. 그 문장은 맞지만, <b>내 계약에 적용되는지부터 확인해야<\/b> 합니다. 순서는 이렇습니다.<\/p>\n<table>\n<tr><th>순서<\/th><th>확인할 것<\/th><th>어디서 보나<\/th><\/tr>\n<tr><td><b>①<\/b><\/td><td>여행사와 맺은 계약인가, 내가 직접 예약한 것인가<\/td><td>계약서 · 결제 내역<\/td><\/tr>\n<tr><td><b>②<\/b><\/td><td>계약서에 <b>취소료(취소수수료) 규정<\/b>이 따로 적혀 있는가<\/td><td>계약서 · 약관 동의 화면<\/td><\/tr>\n<tr><td><b>③<\/b><\/td><td>그 규정이 <b>표준약관과 다르다는 설명<\/b>과 <b>별도 확인<\/b>을 받았는가<\/td><td>서면 · 전자문서 기록<\/td><\/tr>\n<tr><td><b>④<\/b><\/td><td>②③이 없다면 → <b>소비자분쟁해결기준<\/b> 적용<\/td><td>본문 2·4장 기준표<\/td><\/tr>\n<\/table>\n<p>정리하면 <b>\"계약서에 별도 취소료 약정이 없으면 정부 기준표대로, 별도 약정이 제대로 되어 있으면 그 약정대로\"<\/b>입니다. 그래서 <b>계약서 원문을 먼저 확보하는 것이 1번<\/b>입니다. 요즘은 대부분 <b>전자문서·모바일 동의 화면<\/b>이라 여행사에 요청하면 받을 수 있습니다.<\/p>\n<div class=\"tip\"><b>💡 '패키지'와 '자유여행'은 다릅니다<\/b><p style=\"margin:8px 0 0\">여행사가 <b>항공·숙박·일정을 묶어 파는 패키지<\/b>는 여행계약이라 이 글의 기준이 그대로 적용됩니다. 반면 여행사를 통해 <b>항공권만, 호텔만 따로 예약한 자유여행<\/b>은 <b>항공사·숙박업소 자체의 취소 규정<\/b>이 함께 걸립니다. 이 경우 여행사가 <b>항공권 취소수수료와 예약 대행 수수료를 별도로 청구<\/b>할 수 있는지가 자주 다툼이 되는데, 공정거래위원회는 <b>계약서에 취소수수료를 명확하게 충분히 고지했는지<\/b>를 핵심으로 봅니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 국외 패키지 여행 취소 위약금 기준표<\/h2>\n<p>별도 약정이 없을 때 적용되는 기준이 <b>「소비자분쟁해결기준」(공정거래위원회 고시)<\/b>의 여행업 항목입니다. 국외여행은 다음과 같습니다.<\/p>\n<table>\n<tr><th>취소를 알린 시점<\/th><th>여행자가 취소<\/th><th>여행사가 취소<\/th><\/tr>\n<tr><td><b>여행개시 30일 전<\/b>까지<\/td><td><b>계약금 환급<\/b> (위약금 없음)<\/td><td>계약금 환급<\/td><\/tr>\n<tr><td>29일 전 ~ <b>20일 전<\/b>까지<\/td><td>여행요금의 <b>10%<\/b><\/td><td>계약금 환급 + 요금의 10% 배상<\/td><\/tr>\n<tr><td>19일 전 ~ <b>10일 전<\/b>까지<\/td><td>여행요금의 <b>15%<\/b><\/td><td>계약금 환급 + 요금의 15% 배상<\/td><\/tr>\n<tr><td>9일 전 ~ <b>8일 전<\/b>까지<\/td><td>여행요금의 <b>20%<\/b><\/td><td>계약금 환급 + 요금의 20% 배상<\/td><\/tr>\n<tr><td>7일 전 ~ <b>1일 전<\/b>까지<\/td><td>여행요금의 <b>30%<\/b><\/td><td>계약금 환급 + 요금의 30% 배상<\/td><\/tr>\n<tr><td><b>여행 당일<\/b><\/td><td>여행요금의 <b>50%<\/b><\/td><td>계약금 환급 + 요금의 50% 배상<\/td><\/tr>\n<\/table>\n<p>오른쪽 <b>'여행사가 취소'<\/b> 칸의 <b>\"계약금 환급 + 요금의 N% 배상\"<\/b>은 <b>이미 낸 돈을 전부 돌려받고, 그에 더해 배상까지 받는다<\/b>는 뜻입니다. 잘못은 여행사가 했는데 내가 돈을 물어내는 구조가 아닙니다.<\/p>\n<p>표에서 놓치기 쉬운 대목이 두 가지 있습니다.<\/p>\n<ul>\n<li><b>\"30일 전 = 계약금 환급\"은 계약금을 돌려받는다는 뜻입니다.<\/b> 계약금을 못 돌려준다는 뜻이 아닙니다. 이 시점에 취소하면 <b>부담해야 할 위약금이 0원<\/b>이고, 이미 낸 계약금은 <b>돌려받는 것<\/b>이 원칙입니다.<\/li>\n<li><b>기준은 '여행요금'이지 '계약금'이 아닙니다.<\/b> 계약금은 통상 여행요금의 10% 이하로 받습니다. 그래서 <b>15%·20%·30% 구간에서는 계약금만으로 위약금이 다 채워지지 않고 추가로 내야 하는 상황<\/b>이 생깁니다. 3장에서 숫자로 보겠습니다.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ '며칠 전'은 통보가 도달한 날 기준입니다<\/b><p style=\"margin:8px 0 0\">\"20일 전에 마음먹었다\"가 아니라 <b>여행사에 취소 의사가 전달된 날<\/b>이 기준입니다. 전화로만 말하면 <b>날짜를 증명할 방법이 없습니다.<\/b> 반드시 <b>문자·카카오톡·이메일 등 기록이 남는 방법<\/b>으로 함께 통보하고, 그 화면을 보관하세요. 실제 분쟁에서 <b>하루 차이로 위약금 구간이 바뀌는 일<\/b>이 흔합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 계산예시 — 400만 원 패키지, 언제 취소하면 얼마<\/h2>\n<p>말로만 보면 감이 안 오니 숫자로 보겠습니다. <b>부부 2인이 총 400만 원짜리 국외 패키지를 계약하고 계약금 40만 원(요금의 10%)을 낸 경우<\/b>입니다. 별도 취소료 약정은 없다고 가정합니다.<\/p>\n<table>\n<tr><th>취소 시점<\/th><th>위약금 비율<\/th><th>위약금<\/th><th>계약금 40만 원과 정산<\/th><th>내 최종 부담<\/th><\/tr>\n<tr><td>35일 전<\/td><td>없음<\/td><td>0원<\/td><td><b>40만 원 전액 환급<\/b><\/td><td><b>0원<\/b><\/td><\/tr>\n<tr><td>25일 전<\/td><td>10%<\/td><td>40만 원<\/td><td>계약금과 상계<\/td><td><b>0원<\/b> (추가 없음)<\/td><\/tr>\n<tr><td>15일 전<\/td><td>15%<\/td><td>60만 원<\/td><td>계약금 공제 후 부족<\/td><td><b>20만 원 추가 납부<\/b><\/td><\/tr>\n<tr><td>9일 전<\/td><td>20%<\/td><td>80만 원<\/td><td>계약금 공제 후 부족<\/td><td><b>40만 원 추가 납부<\/b><\/td><\/tr>\n<tr><td>3일 전<\/td><td>30%<\/td><td>120만 원<\/td><td>계약금 공제 후 부족<\/td><td><b>80만 원 추가 납부<\/b><\/td><\/tr>\n<tr><td>여행 당일<\/td><td>50%<\/td><td>200만 원<\/td><td>계약금 공제 후 부족<\/td><td><b>160만 원 추가 납부<\/b><\/td><\/tr>\n<\/table>\n<p>여기서 확인되는 것이 <b>\"계약금만 포기하면 끝\"이 아니라는 사실<\/b>입니다. 25일 전까지는 계약금 선에서 정리되지만, <b>15일 전으로 넘어가는 순간 계약금 외에 돈을 더 내야<\/b> 합니다. 잔금까지 이미 낸 상태라면 <b>낸 돈에서 위약금을 뺀 나머지를 돌려받는<\/b> 구조가 됩니다. 400만 원을 전액 납부한 뒤 3일 전에 취소했다면 <b>120만 원을 제하고 280만 원을 환급<\/b>받게 됩니다.<\/p>\n<div class=\"tip\"><b>🔢 계산 공식<\/b><p style=\"margin:8px 0 0\"><b>돌려받을 돈 = 이미 낸 돈 − (여행요금 × 해당 구간 비율)<\/b><br>결과가 음수면 그만큼 <b>추가로 내야 하는 금액<\/b>입니다. 여행사가 제시한 금액이 이 계산과 다르면 <b>어떤 기준을 적용했는지 서면으로 요구<\/b>하세요. 대개 그 답이 <b>'특별약관'<\/b>입니다(5장).<\/p><\/div>\n<div class=\"warn\"><b>⚠️ 항공권이 이미 발권됐다면 별도 비용이 붙을 수 있습니다<\/b><p style=\"margin:8px 0 0\">위 계산은 <b>여행계약 자체의 위약금<\/b>입니다. 여기에 <b>항공사가 부과하는 항공권 취소수수료<\/b>가 더해질 수 있고, 특히 <b>특가·할인 항공권은 환불 자체가 제한<\/b>되는 경우가 많습니다. 다만 이런 비용은 <b>계약 단계에서 명확히 고지되어 있어야<\/b> 청구할 수 있다는 것이 공정거래위원회의 설명 취지입니다. <b>고지 화면·계약서에 그 문구가 실제로 있었는지<\/b>부터 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 국내여행은 기준이 다릅니다 (당일 / 숙박)<\/h2>\n<p>국내여행은 <b>국외여행과 표가 아예 다릅니다.<\/b> 국외여행은 최대 50%까지 가지만, <b>국내여행은 최대 30%<\/b>에서 멈춥니다. 그리고 <b>당일여행이냐 숙박여행이냐<\/b>에 따라 \"위약금 없는 구간\"이 달라집니다.<\/p>\n<h3>당일여행 (숙박 없음)<\/h3>\n<table>\n<tr><th>취소를 알린 시점<\/th><th>여행자가 취소<\/th><th>여행사가 취소<\/th><\/tr>\n<tr><td><b>여행개시 3일 전<\/b>까지<\/td><td><b>전액 환급<\/b><\/td><td>계약금 환급<\/td><\/tr>\n<tr><td><b>2일 전<\/b>까지<\/td><td>요금의 <b>10%<\/b><\/td><td>계약금 환급 + 요금의 10% 배상<\/td><\/tr>\n<tr><td><b>1일 전<\/b>까지<\/td><td>요금의 <b>20%<\/b><\/td><td>계약금 환급 + 요금의 20% 배상<\/td><\/tr>\n<tr><td><b>당일<\/b> 취소 · 연락 없이 불참<\/td><td>요금의 <b>30%<\/b><\/td><td>계약금 환급 + 요금의 30% 배상<\/td><\/tr>\n<\/table>\n<h3>숙박여행<\/h3>\n<table>\n<tr><th>취소를 알린 시점<\/th><th>여행자가 취소<\/th><th>여행사가 취소<\/th><\/tr>\n<tr><td><b>여행개시 5일 전<\/b>까지<\/td><td><b>전액 환급<\/b><\/td><td>계약금 환급<\/td><\/tr>\n<tr><td><b>2일 전<\/b>까지<\/td><td>요금의 <b>10%<\/b><\/td><td>계약금 환급 + 요금의 10% 배상<\/td><\/tr>\n<tr><td><b>1일 전<\/b>까지<\/td><td>요금의 <b>20%<\/b><\/td><td>계약금 환급 + 요금의 20% 배상<\/td><\/tr>\n<tr><td><b>당일<\/b> 취소 · 연락 없이 불참<\/td><td>요금의 <b>30%<\/b><\/td><td>계약금 환급 + 요금의 30% 배상<\/td><\/tr>\n<\/table>\n<p>두 표의 오른쪽 칸을 왼쪽과 비교해 <b>\"여행사가 잘못했는데 나는 계약금만 돌려받나\"<\/b>라고 읽으시면 안 됩니다. <b>여행사가 취소한 경우의 '계약금 환급 + N% 배상'은 이미 낸 돈을 전부 돌려받은 뒤 추가로 배상까지 받는다<\/b>는 뜻입니다. 여행자가 취소하는 왼쪽 칸보다 <b>언제나 유리합니다.<\/b><\/p>\n<p>국내여행에서 특히 <b>손해가 크게 갈리는 지점은 \"3일 전\"과 \"5일 전\"<\/b>입니다. 숙박여행은 <b>5일 전까지<\/b> 알려야 전액 환급인데, <b>4일 전에 알리면 곧바로 10% 구간<\/b>으로 떨어집니다. 국내 패키지는 금액이 크지 않아 넘어가기 쉽지만, <b>가족 단위로 여러 명을 계약했다면 10%도 적은 돈이 아닙니다.<\/b><\/p>\n<div class=\"tip\"><b>💡 국외 vs 국내 한눈에<\/b><p style=\"margin:8px 0 0\"><b>위약금이 0원인 구간<\/b> — 국외 <b>30일 전<\/b> / 국내 당일여행 <b>3일 전<\/b> / 국내 숙박여행 <b>5일 전<\/b>.<br><b>최대 위약금<\/b> — 국외 <b>50%<\/b>(여행 당일) / 국내 <b>30%<\/b>(당일·무연락).<br>국외여행은 <b>한 달 전에 결정<\/b>하는 것이 위약금을 피하는 유일한 방법이고, 국내여행은 <b>일주일 전쯤<\/b>만 정리해도 대부분 피할 수 있습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 가장 큰 함정 — 여행사 '특별약관'이 우선하는 경우<\/h2>\n<p>여기가 이 글에서 <b>가장 중요한 부분<\/b>입니다. 많은 분이 <b>\"소비자분쟁해결기준은 법이니까 여행사가 무조건 따라야 한다\"<\/b>고 알고 계시는데, <b>그렇지 않습니다.<\/b><\/p>\n<p>공정거래위원회는 소비자분쟁해결기준의 성격에 대해 <b>강행규정이라기보다는 거래관행의 규범(code of conduct)<\/b>이며, <b>당사자 사이에 별도의 의사표시가 없는 경우에 한해 적용된다<\/b>는 취지로 설명하고 있습니다. 즉 <b>계약서에서 취소료를 달리 정했다면 그 약정이 먼저<\/b>입니다.<\/p>\n<table>\n<tr><th>상황<\/th><th>적용 기준<\/th><th>실제 결과<\/th><\/tr>\n<tr><td>계약서에 취소료 규정이 <b>없음<\/b><\/td><td><b>소비자분쟁해결기준<\/b><\/td><td>2·4장 기준표대로<\/td><\/tr>\n<tr><td>계약서에 <b>\"소비자분쟁해결기준에 따른다\"<\/b>고 적힘<\/td><td><b>소비자분쟁해결기준<\/b><\/td><td>2·4장 기준표대로<\/td><\/tr>\n<tr><td>계약서에 <b>자체 취소료 표<\/b>가 있고 <b>설명·별도 확인<\/b>을 받음<\/td><td><b>여행사 특별약관<\/b><\/td><td>여행사 표대로 (더 불리할 수 있음)<\/td><\/tr>\n<tr><td>자체 취소료 표는 있으나 <b>설명·확인 흔적이 없음<\/b><\/td><td><b>다툼의 대상<\/b><\/td><td>기준표 적용을 주장할 근거가 있음<\/td><\/tr>\n<\/table>\n<p>다만 여행사가 <b>아무렇게나 특별약관을 들이밀 수 있는 것은 아닙니다.<\/b> 국외여행 표준약관은 특약에 대해 <b>서면(전자문서 포함)으로 맺어야 하고<\/b>, 여행사는 <b>그 특약이 표준약관과 다르며 표준약관보다 우선 적용된다는 점을 여행자에게 설명하고 별도의 확인을 받아야<\/b> 한다고 정하고 있습니다.<\/p>\n<div class=\"warn\"><b>⚠️ 그래서 따져야 할 질문은 이것입니다<\/b><p style=\"margin:8px 0 0\">\"우리 회사 규정입니다\"라는 답을 들었다면 <b>다음 세 가지를 서면으로 요구<\/b>하세요. <b>①<\/b> 그 취소료 규정이 적힌 <b>계약서·약관 원문<\/b> <b>②<\/b> 그것이 <b>표준약관과 다르다는 설명을 했다는 기록<\/b> <b>③<\/b> 내가 그 내용을 <b>별도로 확인(동의)했다는 기록<\/b>. 세 가지가 모두 나오지 않으면, <b>소비자분쟁해결기준 적용을 주장할 여지<\/b>가 생깁니다. 반대로 <b>가입 화면에서 취소료 표에 따로 체크한 기억이 있다면<\/b> 그 특약이 적용될 가능성이 높습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 위약금 없이 취소할 수 있는 사유<\/h2>\n<p>시점과 무관하게 <b>손해배상(위약금) 없이 계약을 해제할 수 있는 사유<\/b>가 따로 정해져 있습니다. 여행 표준약관이 정한 내용은 다음과 같습니다.<\/p>\n<h3>여행자가 위약금 없이 해제할 수 있는 경우<\/h3>\n<ul>\n<li>여행자의 <b>안전과 보호<\/b>를 위해 여행자의 요청 또는 현지 사정으로 <b>부득이하다고 쌍방이 합의<\/b>한 경우<\/li>\n<li><b>천재지변·전란·정부의 명령·운송 및 숙박기관 등의 파업·휴업<\/b> 등으로 <b>여행의 목적을 달성할 수 없는<\/b> 경우<\/li>\n<li>여행사가 <b>공제·보증보험에 가입하지 않았거나 영업보증금을 예치하지 않은<\/b> 경우<\/li>\n<li><b>3촌 이내 친족<\/b>이 사망한 경우<\/li>\n<li><b>질병 등 신체 이상<\/b>으로 여행 참가가 불가능한 경우<\/li>\n<li><b>배우자 또는 직계존비속이 3일 이상 입원<\/b>하여 여행 출발 시까지 퇴원이 곤란한 경우, <b>그 보호자 1인<\/b><\/li>\n<li><b>여행사의 귀책사유<\/b>로 계약서에 기재된 일정대로 여행 실시가 불가능해진 경우<\/li>\n<\/ul>\n<h3>여행사가 위약금 없이 해제할 수 있는 경우<\/h3>\n<ul>\n<li>위 첫 두 가지(안전상 합의 · 천재지변 등 목적 달성 불가)는 동일<\/li>\n<li>여행자가 <b>다른 여행자에게 폐를 끼치거나<\/b> 여행의 원활한 실시에 <b>현저한 지장이 있다고 인정<\/b>될 때<\/li>\n<li>여행자의 <b>질병 등 신체 이상<\/b>으로 여행 참가가 불가능한 경우<\/li>\n<li>여행자가 <b>계약서에 기재된 기일까지 여행요금을 내지 않은<\/b> 경우<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ 여기서 실제로 거절당하는 이유 4가지<\/b><p style=\"margin:8px 0 0\"><b>① \"3촌 이내\"에 사촌은 들어가지 않습니다.<\/b> 사촌은 4촌입니다. 3촌은 <b>백부·숙부·고모·이모·외삼촌과 조카<\/b>까지입니다. 사촌 상(喪)으로 취소하면 이 사유로는 인정받기 어렵습니다.<br><b>② 보호자 면제는 1인만입니다.<\/b> 어머니가 입원하셨다고 <b>온 가족이 위약금 없이 취소<\/b>되는 것이 아니라 <b>보호자 1명<\/b>만 해당합니다.<br><b>③ 질병은 증빙이 핵심입니다.<\/b> \"컨디션이 안 좋다\"는 해당하지 않습니다. <b>여행 참가가 불가능하다는 점이 드러나는 진단서 등 객관적 자료<\/b>를 준비하세요.<br><b>④ 입원은 '3일 이상'이고 '출발 시까지 퇴원 곤란'이어야 합니다.<\/b> 하루 이틀 입원했다가 퇴원하는 경우는 해당하지 않습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 태풍·천재지변이면 전액 환불인가<\/h2>\n<p>여름철에 가장 많이 나오는 질문입니다. 결론부터 말하면 <b>\"태풍이 온다더라\"만으로는 부족합니다.<\/b> 약관이 정한 문구는 <b>\"천재지변 등으로 여행의 목적을 달성할 수 없는 경우\"<\/b>이지, <b>\"기상이 나쁠 것 같은 경우\"<\/b>가 아닙니다.<\/p>\n<table>\n<tr><th>상황<\/th><th>인정 가능성<\/th><th>이유<\/th><\/tr>\n<tr><td>출발 항공편이 <b>기상으로 결항<\/b><\/td><td><b>높음<\/b><\/td><td>여행 자체가 성립하지 않음 · 결항 증빙 명확<\/td><\/tr>\n<tr><td>현지에 <b>정부의 여행 제한·통제<\/b> 조치<\/td><td><b>높음<\/b><\/td><td>'정부의 명령'에 해당<\/td><\/tr>\n<tr><td>현지 <b>주요 일정지가 재난으로 폐쇄<\/b><\/td><td>중간<\/td><td>일정의 상당 부분이 불가능한지가 관건<\/td><\/tr>\n<tr><td>여행지에 <b>태풍 예보·주의보<\/b>만 있음<\/td><td><b>낮음<\/b><\/td><td>목적 달성 불가로 보기 어려움 · 예보는 바뀜<\/td><\/tr>\n<tr><td><b>비가 많이 올 것 같아<\/b> 미리 취소<\/td><td><b>낮음<\/b><\/td><td>여행자 개인 사정에 가까움<\/td><\/tr>\n<\/table>\n<p>실무적으로는 <b>\"내가 불안해서 취소\"와 \"여행이 불가능해져서 취소\"를 구분<\/b>한다고 보면 됩니다. 앞의 것은 일반 위약금 구간이 그대로 적용되고, 뒤의 것이라야 면제를 주장할 수 있습니다.<\/p>\n<div class=\"tip\"><b>💡 태풍철에 실제로 도움이 되는 순서<\/b><p style=\"margin:8px 0 0\"><b>①<\/b> 성급하게 먼저 취소 통보를 넣지 마세요. 내가 먼저 취소하면 <b>'여행자 귀책 취소'<\/b>로 처리되기 쉽습니다.<br><b>②<\/b> <b>항공사의 결항·지연 확정 안내<\/b>를 기다린 뒤, 그 안내문을 캡처해 두세요. 이것이 가장 강한 증빙입니다.<br><b>③<\/b> 외교부 <b>해외안전여행<\/b>의 여행경보·특별여행주의보 발령 여부를 함께 확인하세요.<br><b>④<\/b> 여행사에 <b>\"천재지변으로 여행 목적 달성이 불가능한 경우에 해당하는지\"<\/b>를 명시해 서면으로 질의하세요. 구두 대화는 남지 않습니다.<br><b>⑤<\/b> 항공기 결항·지연 자체에 대한 보상은 <b>여행계약 위약금과는 별개 절차<\/b>입니다. 아래 '함께 보면 좋은 글'의 결항 보상 편을 참고하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 여행사가 취소한 경우 — 인원 미달 포함<\/h2>\n<p>취소는 여행자만 하는 것이 아닙니다. <b>여행사가 취소하는 경우<\/b>가 오히려 억울한데, 이때는 <b>계약금을 돌려받는 것에 더해 배상까지<\/b> 받을 수 있습니다(2·4장 표의 오른쪽 열).<\/p>\n<p>패키지에서 가장 흔한 사유가 <b>\"최소 출발 인원이 안 채워졌다\"<\/b>는 것입니다. 국외여행에서는 이 경우 <b>여행사가 여행 출발 7일 전까지 여행자에게 통지<\/b>해야 합니다. 이 기한을 지키지 않고 계약을 해제하면, <b>이미 받은 계약금을 돌려주는 것 외에 추가로 배상<\/b>해야 합니다.<\/p>\n<table>\n<tr><th>여행사의 인원 미달 통지 시점<\/th><th>여행자가 받을 수 있는 것<\/th><\/tr>\n<tr><td><b>여행 출발 7일 전<\/b>까지 통지<\/td><td>계약금 환급 (추가 배상 없음)<\/td><\/tr>\n<tr><td>기한을 넘겨 <b>출발 1일 전<\/b>까지 통지<\/td><td>계약금 환급 + <b>여행요금의 30%<\/b> 배상<\/td><\/tr>\n<tr><td>기한을 넘겨 <b>출발 당일<\/b> 통지<\/td><td>계약금 환급 + <b>여행요금의 50%<\/b> 배상<\/td><\/tr>\n<\/table>\n<p>여기서 실질적으로 중요한 것은 <b>\"인원 미달이니 어쩔 수 없다\"는 말에 그냥 계약금만 돌려받고 끝내지 말라<\/b>는 점입니다. <b>출발이 임박해서 통보받았다면 배상 대상<\/b>입니다. 출발 3~4일 전에 취소 통보를 받아 <b>다른 여행을 잡지도 못하고 휴가만 날린 경우<\/b>가 정확히 이 경우입니다.<\/p>\n<div class=\"tip\"><b>💡 여행요금이 갑자기 올랐다는 연락을 받았다면<\/b><p style=\"margin:8px 0 0\">여행요금은 <b>운송·숙박기관에 지급할 요금이 계약 때보다 5% 이상 오르내리거나, 적용 환율이 2% 이상 변동<\/b>한 경우에 한해 증감을 청구할 수 있고, <b>증액할 때는 여행 출발일 15일 전에 통지<\/b>해야 합니다. 출발 직전에 갑자기 \"유류할증료가 올라 추가 부담이 필요하다\"는 연락을 받았다면 <b>통지 시점부터 따져 보세요.<\/b><\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 출발한 뒤에 그만두면<\/h2>\n<p>여행이 시작된 뒤에도 <b>부득이한 사유가 있으면 계약을 해지<\/b>할 수 있습니다. 다만 조건이 다릅니다.<\/p>\n<ul>\n<li><b>부득이한 사유로 인한 해지<\/b> — 여행사나 여행자 모두 여행 출발 후에도 부득이한 사유가 있으면 계약을 해지할 수 있습니다. 다만 <b>그 사유가 어느 한쪽의 과실로 생긴 것이라면 상대방의 손해를 배상<\/b>해야 합니다(민법 제674조의4 제1항).<\/li>\n<li><b>귀국 협조는 여행사 책임<\/b> — 여행 중 계약이 해지되더라도 <b>여행자가 귀국하는 데 필요한 조치를 해 주어야 하는 것은 여행사<\/b>입니다. \"계약이 끝났으니 알아서 오시라\"는 통하지 않습니다.<\/li>\n<li><b>중대한 하자로 인한 해지<\/b> — 여행에 <b>중대한 하자<\/b>가 있는데 시정되지 않거나 계약 내용대로의 이행을 기대할 수 없다면, 여행자는 계약을 해지할 수 있습니다(민법 제674조의7 제1항). 일정이 계약서와 전혀 다르거나 숙소 등급이 크게 어긋난 경우가 여기에 해당할 수 있습니다.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ 현지에서 반드시 남겨야 할 것<\/b><p style=\"margin:8px 0 0\">출발 후 문제로 다투게 되면 <b>증거는 현지에서만 만들 수 있습니다.<\/b> ① <b>계약서에 적힌 일정·숙소 등급<\/b>과 실제가 다른 부분을 <b>사진·영상<\/b>으로 남기고 ② 인솔자·가이드에게 <b>시정을 요구한 사실을 문자 등으로<\/b> 남기고 ③ <b>추가로 쓴 비용의 영수증<\/b>을 모으세요. 돌아온 뒤에 말로만 주장하면 인정받기 어렵습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">10. 분쟁이 생겼을 때 대응 순서<\/h2>\n<p>여행사와 이야기가 되지 않을 때 밟는 순서입니다. <b>순서를 건너뛰면 오히려 오래 걸립니다.<\/b><\/p>\n<table>\n<tr><th>단계<\/th><th>할 일<\/th><th>핵심<\/th><\/tr>\n<tr><td><b>1<\/b><\/td><td>계약서 · 약관 · 취소 통보 기록 <b>확보<\/b><\/td><td>전자문서·모바일 동의 화면 포함<\/td><\/tr>\n<tr><td><b>2<\/b><\/td><td>여행사에 <b>서면<\/b>으로 산정 근거 요구<\/td><td>\"어떤 기준을 적용했는지\" 명시 요구<\/td><\/tr>\n<tr><td><b>3<\/b><\/td><td><b>1372 소비자상담센터<\/b> 상담<\/td><td>국번 없이 <b>1372<\/b> · 온라인 접수 가능<\/td><\/tr>\n<tr><td><b>4<\/b><\/td><td><b>한국소비자원 피해구제<\/b> 신청<\/td><td>합의 권고 단계<\/td><\/tr>\n<tr><td><b>5<\/b><\/td><td><b>소비자분쟁조정위원회<\/b> 조정<\/td><td>양쪽이 수락하면 재판상 화해 효력<\/td><\/tr>\n<\/table>\n<p>2단계를 특히 권합니다. <b>\"우리 규정\"이라는 구두 답변과 달리, 서면으로 근거를 요구하면 특별약관인지 기준표인지가 드러납니다.<\/b> 여기서 정리되는 경우가 많습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec11\">11. 자주 묻는 질문<\/h2>\n<h3>Q. 계약금만 걸었는데, 취소하면 계약금만 날리면 되나요?<\/h3>\n<p>아닙니다. <b>시점에 따라 계약금보다 더 낼 수도, 계약금을 전부 돌려받을 수도<\/b> 있습니다. 국외여행은 <b>30일 전까지 통보하면 계약금을 돌려받고<\/b>, 반대로 <b>10일 전 이후에 취소하면 계약금(통상 10%)을 넘는 위약금<\/b>이 나옵니다(3장 계산표).<\/p>\n<h3>Q. 여행사가 \"출발 60일 전부터 취소료가 발생한다\"고 합니다.<\/h3>\n<p>표준약관·소비자분쟁해결기준보다 이른 시점부터 취소료를 매기는 것은 <b>특별약관<\/b>입니다. <b>서면(전자문서 포함)으로 맺었는지<\/b>, <b>표준약관과 다르고 우선 적용된다는 설명과 별도 확인을 받았는지<\/b>를 따져 보세요. 그 절차가 지켜졌다면 특약이 적용될 수 있습니다.<\/p>\n<h3>Q. 여행 취소는 며칠 전으로 계산하나요? 주말은 빼나요?<\/h3>\n<p>달력상의 날로 셉니다. 기준은 <b>취소 의사가 여행사에 도달한 날<\/b>이며, <b>기록이 남는 방법으로 통보<\/b>해야 그 날짜를 증명할 수 있습니다.<\/p>\n<h3>Q. 여행자보험에 들었는데 취소 위약금도 보상되나요?<\/h3>\n<p>상품에 따라 다릅니다. <b>여행 취소·중단 손해를 보장하는 특약이 붙어 있는 경우에만<\/b> 가능하고, 기본 담보만으로는 보상되지 않는 경우가 많습니다. <b>보장 항목에 취소 관련 특약이 있는지<\/b>를 증권에서 확인하세요.<\/p>\n<h3>Q. 국내 패키지도 30일 전 기준이 적용되나요?<\/h3>\n<p>아닙니다. <b>국내여행은 당일여행 3일 전, 숙박여행 5일 전<\/b>이 위약금 없는 구간입니다(4장). 국외 기준을 국내에 그대로 적용하면 손해를 봅니다.<\/p>\n<h3>Q. 여행사가 인원 미달로 취소했는데 계약금만 돌려준다고 합니다.<\/h3>\n<p>국외여행에서 인원 미달로 인한 해제는 <b>출발 7일 전까지 통지<\/b>해야 합니다. 그 기한을 넘겨 통지했다면 <b>계약금 환급에 더해 배상<\/b>을 요구할 수 있습니다(8장 표).<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec12\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내<\/b>\n<a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?ccfNo=2&amp;cciNo=3&amp;cnpClsNo=3&amp;csmSeq=894&amp;popMenu=ov\" rel=\"nofollow\" target=\"_blank\">▸ 찾기쉬운 생활법령정보 — 해외여행자 : 여행계약의 변경, 해제 및 해지<\/a>\n<a href=\"https://www.easylaw.go.kr/CSP/CnpClsMain.laf?csmSeq=1662&amp;ccfNo=1&amp;cciNo=2&amp;cnpClsNo=2\" rel=\"nofollow\" target=\"_blank\">▸ 찾기쉬운 생활법령정보 — 국내여행자 : 여행사의 책임 및 여행계약 해제·해지하기<\/a>\n<a href=\"https://www.law.go.kr/LSW//admRulInfoP.do?admRulSeq=2100000253084&amp;chrClsCd=010201\" rel=\"nofollow\" target=\"_blank\">▸ 국가법령정보센터 — 소비자분쟁해결기준(공정거래위원회고시 제2024-32호)<\/a>\n<a href=\"https://www.consumer.go.kr/user/bbs/consumer/380/940/bbsDataView/3147.do\" rel=\"nofollow\" target=\"_blank\">▸ 소비자24 — 국외여행 취소수수료 적용 기준에 관한 공정거래위원회 답변<\/a>\n<p style=\"margin:10px 0 0;font-size:14px;color:#1b4f86\">▸ 소비자 상담·피해구제 접수는 <b>국번 없이 1372<\/b>(소비자상담센터)<\/p>\n<\/div>\n\n<div class=\"end\"><b>✅ 마무리 — 세 줄로 정리하면<\/b><p style=\"margin:8px 0 0\"><b>①<\/b> 별도 약정이 없다면 <b>국외는 30일 전, 국내는 당일여행 3일 전·숙박여행 5일 전<\/b>까지 알려야 위약금이 없고, 그 뒤로는 <b>국외 10→15→20→30→50%<\/b>, <b>국내 10→20→30%<\/b>로 올라갑니다. <b>②<\/b> 그런데 <b>소비자분쟁해결기준은 강행규정이 아니라 별도 약정이 없을 때 적용되는 기준<\/b>이라, <b>계약서의 특별약관이 우선<\/b>할 수 있습니다 — 그래서 <b>계약서 원문 확인이 1번<\/b>입니다. <b>③<\/b> <b>3촌 이내 친족 사망, 본인 질병, 배우자·직계존비속 3일 이상 입원(보호자 1인)<\/b> 등은 위약금 없이 해제할 수 있는 사유이니, 해당한다면 <b>증빙부터 갖춰 서면으로 요구<\/b>하세요.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, <b>소비자분쟁해결기준과 여행 표준약관은 개정될 수 있습니다.<\/b> 또한 본문에서 설명했듯 <b>실제 적용되는 취소료는 계약서·특별약관 내용에 따라 달라지므로<\/b>, 반드시 <b>본인이 체결한 계약서 원문을 먼저 확인<\/b>하시기 바랍니다.<br>3장의 금액은 <b>여행요금 400만 원·계약금 40만 원, 별도 취소료 약정이 없는 경우<\/b>를 가정해 기준표의 비율로 계산한 예시이며, 실제 정산액은 계약 조건과 이미 납부한 금액에 따라 달라집니다. 항공권 취소수수료 등 <b>여행계약 위약금과 별개로 발생하는 비용<\/b>은 포함하지 않았습니다.<br>출처: 찾기쉬운 생활법령정보(법제처) 「해외여행자 — 여행계약의 변경·해제 및 해지」 및 「국내여행자 — 여행사의 책임 및 여행계약 해제·해지하기」, 국가법령정보센터 「소비자분쟁해결기준」(공정거래위원회고시 제2024-32호, 2024년 12월 27일 시행), 소비자24(공정거래위원회·한국소비자원) 국외여행 취소수수료 관련 질의 답변, 국외여행·국내여행 표준약관, 민법 제674조의4·제674조의7. 소비자상담 국번 없이 1372<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01858941660.html\">▸ 펜션 호텔 예약 취소 수수료 환불 규정 총정리 (2026 성수기 위약금)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_0459503221.html\">▸ 항공기 결항 지연 보상 신청 방법 기준표 면책 사유 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_452.html\">▸ 여행자보험 가입 방법 보장 비교 총정리<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 위약금 비율·면제 사유·통지 기한은 <b>법제처 찾기쉬운 생활법령정보와 국가법령정보센터의 소비자분쟁해결기준, 공정거래위원회 답변을 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 계산 예시는 가정치를 명시했습니다. 실제 취소료는 계약서·특별약관에 따라 달라지니 계약 원문을 함께 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 여행사 패키지를 취소할 때 취소료는 여행사 마음대로가 아닙니다. 별도 약정이 없으면 소비자분쟁해결기준이 적용돼서, 국외여행은 출발 30일 전까지 알리면 위약금 0원(계약금도 돌려받음), 그 뒤로 20일 전 10%, 10일 전 15%, 8일 전 20%, 1일 전 30%, 당일 50%로 올라갑니다. 국내여행은 다릅니다 — 당일여행은 3일 전, 숙박여행은 5일 전까지가 전액 환급이고 최대치도 30%에서 멈춥니다.\n2. 그런데 여기에 큰 함정이 있습니다. 소비자분쟁해결기준은 강행규정이 아니라 '별도 의사표시가 없을 때' 적용되는 기준이라, 계약서에 여행사 자체 취소료 표(특별약관)가 있고 그게 표준약관과 다르다는 설명과 별도 확인을 받았다면 그 특약이 먼저입니다. 그래서 다툼이 생기면 인터넷 기준표를 들이밀기 전에 내 계약서 원문부터 확인해야 합니다.\n3. 시점과 무관하게 위약금 없이 취소되는 사유도 있습니다. 3촌 이내 친족 사망, 본인의 질병 등 신체 이상, 배우자·직계존비속이 3일 이상 입원해 출발 시까지 퇴원이 곤란한 경우의 보호자 1인 등입니다. 주의할 건 사촌은 4촌이라 빠지고, 보호자 면제는 1명만이라는 점입니다. 태풍도 '예보'만으로는 부족하고 결항·정부 통제처럼 여행 목적 달성이 실제로 불가능해야 합니다.\n"},{"code":"F4-11","title":"대한민국 숙박세일 페스타 할인권 받는 법 총정리 (2026 여름 최대 7만 원 · 인구감소지역 85곳 · 8월 17일까지)","lane":"etc","thumb":"146_stay_festa.png","draft":"숙박세일페스타_글_HTML.txt","facts":"주관=문화체육관광부·한국관광공사 | 2026 여름맞이 회차: 발급·예약 2026-06-11(목)~08-17(월), 입실 가능도 동일 08-17까지(둘 다 같은 날 마감 - '예약만 8/17'이 아님), 매일 오전 10시 선착순, 만 19세 이상 1인 1매 | 물량 30만장(1박용 24만·연박용 6만), 추경 112억 | 권종4=1박 2만원 이상~7만원 미만 2만원 할인 / 7만원 이상 3만원 / 연박(2박이상) 5만원 이상~14만원 미만 5만원 / 14만원 이상 7만원 | 유효기간=발급 당일 10:00~익일 07:00 직전(최대 21시간, 11번가 표기 06:59), 미사용 자동소멸·연장 불가 | 일별 유효기간 내 1개 OTA·1개 권종만, 양도 절대불가, 대실 불가 | 사용지역=비수도권 인구감소지역 85개 시군구(행안부 지정 89곳 중 수도권 4곳 인천 강화·옹진, 경기 가평·연천 제외). 시도별 부산3(동구서구영도구)·대구3(남구서구군위)·강원12·충북6·충남9·전북10·전남16·경북15·경남11 = 85 검산 완료 | 🔴발행 전 필수 재확인 2건: ①기간 - 문체부 최초 발표(2026-05-26)는 7/31까지였으나 2026-07-31 실측 시 공식 누리집·11번가 프로모 페이지가 모두 8/17로 표기. ⚠️'연장' 공지 문구는 어느 쪽에서도 확인 안 됨(두 날짜가 다르다는 박세일 페스타가 뭔가 — 1분 정리<\/a><a href=\"#sec2\">2. 권종 4가지와 할인 금액<\/a><a href=\"#sec3\">3. 계산예시 — 더 비싼 방이 더 싸지는 구간<\/a><a href=\"#sec4\">4. 어디서 쓸 수 있나 — 대상 85곳 전체 목록<\/a><a href=\"#sec5\">5. 발급 순서 — 오전 10시에 무엇을 하나<\/a><a href=\"#sec6\">6. 놓치기 쉬운 함정 6가지<\/a><a href=\"#sec7\">7. 이런 경우엔 못 씁니다<\/a><a href=\"#sec8\">8. 이번 회차가 끝나도 — 다음 회차 확인법<\/a><a href=\"#sec9\">9. 자주 묻는 질문<\/a><a href=\"#sec10\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec3\">👉 얼마나 아끼는지 계산부터 보기<\/a>\n\n<h2 id=\"sec1\">1. 숙박세일 페스타가 뭔가 — 1분 정리<\/h2>\n<p><b>문화체육관광부와 한국관광공사<\/b>가 국내 여행 활성화를 위해 <b>숙박 할인권(쿠폰)<\/b>을 무료로 배포하는 사업입니다. 소비자가 직접 <b>온라인여행사(OTA) 앱·사이트에서 쿠폰을 내려받아<\/b>, 그 자리에서 <b>대상 지역 숙소를 예약할 때 결제창에서 차감<\/b>하는 방식입니다. 신청서를 내거나 심사를 받는 지원금이 아니라 <b>선착순 쿠폰<\/b>이라는 점이 핵심입니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>내용<\/th><\/tr>\n<tr><td>주관<\/td><td>문화체육관광부 · 한국관광공사<\/td><\/tr>\n<tr><td>이번 회차<\/td><td><b>2026 여름맞이<\/b> 숙박세일 페스타<\/td><\/tr>\n<tr><td>발급·예약 기간<\/td><td><b>2026년 6월 11일(목) ~ 8월 17일(월)<\/b><\/td><\/tr>\n<tr><td>입실 가능 기간<\/td><td><b>2026년 6월 11일(목) ~ 8월 17일(월)<\/b><\/td><\/tr>\n<tr><td>발급 시각<\/td><td>기간 중 <b>매일 오전 10시부터 선착순<\/b><\/td><\/tr>\n<tr><td>대상<\/td><td><b>만 19세 이상<\/b>, <b>1인 1매<\/b><\/td><\/tr>\n<tr><td>총 물량<\/td><td>할인권 <b>30만 장<\/b> (1박용 24만 장 · 연박용 6만 장)<\/td><\/tr>\n<tr><td>쓸 수 있는 곳<\/td><td><b>비수도권 인구감소지역 85개 시·군·구<\/b>의 호텔·콘도·리조트·펜션 등<\/td><\/tr>\n<\/table>\n<div class=\"warn\"><b>⚠️ 가장 먼저 기억할 것 — 마감이 두 번이 아니라 한 번입니다<\/b><p style=\"margin:8px 0 0\"><b>예약도 8월 17일까지, 입실도 8월 17일까지<\/b>입니다. \"8월 17일까지 예약하면 9월에 가도 되겠지\"가 <b>아닙니다.<\/b> <b>8월 17일 밤까지 체크인이 시작되는 일정<\/b>이어야 합니다. 그리고 <b>물량이 먼저 떨어지면 그 전에 끝납니다<\/b> — 총 30만 장을 매일 나눠 푸는 구조라 <b>일별 수량이 소진되면 그날 발급은 마감<\/b>됩니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 권종 4가지와 할인 금액<\/h2>\n<p>쿠폰은 <b>1박용 2종, 연박(2박 이상)용 2종<\/b>으로 나뉩니다. 어떤 권종을 쓸 수 있는지는 <b>내가 결제할 숙박요금이 얼마인지<\/b>가 결정합니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>결제 금액(부가세 포함)<\/th><th>할인 금액<\/th><\/tr>\n<tr><td rowspan=\"2\"><b>1박 이상<\/b><\/td><td>2만 원 이상 ~ <b>7만 원 미만<\/b><\/td><td><b>2만 원<\/b><\/td><\/tr>\n<tr><td><b>7만 원 이상<\/b><\/td><td><b>3만 원<\/b><\/td><\/tr>\n<tr><td rowspan=\"2\"><b>연박(2박 이상)<\/b><\/td><td>5만 원 이상 ~ <b>14만 원 미만<\/b><\/td><td><b>5만 원<\/b><\/td><\/tr>\n<tr><td><b>14만 원 이상<\/b><\/td><td><b>7만 원<\/b><\/td><\/tr>\n<\/table>\n<p>표를 보면 <b>7만 원<\/b>과 <b>14만 원<\/b>이라는 <b>두 개의 경계선<\/b>이 있습니다. 이 선을 <b>넘느냐 못 넘느냐로 할인액이 1만~2만 원씩 달라집니다.<\/b> 3장에서 이 차이가 만들어내는 <b>이상한 구간<\/b>을 숫자로 보겠습니다.<\/p>\n<div class=\"tip\"><b>💡 '연박'은 같은 숙소에서 2박 이상입니다<\/b><p style=\"margin:8px 0 0\">연박 권종은 <b>'2박 이상' 상품<\/b>에 적용되는 것으로 표기돼 있습니다. 이틀 동안 <b>다른 숙소를 하루씩<\/b> 잡는 식으로 나눠 예약해도 인정되는지는 <b>채널마다 처리가 다를 수 있으니<\/b>, 결제 전 화면에서 <b>쿠폰이 실제로 붙는지<\/b> 확인하세요. 그리고 연박용은 총 물량이 <b>6만 장<\/b>으로 1박용(24만 장)의 4분의 1이라, <b>경쟁이 더 치열합니다.<\/b><\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 계산예시 — 더 비싼 방이 더 싸지는 구간<\/h2>\n<p>할인액이 <b>정액<\/b>이고 적용 기준이 <b>결제금액 구간<\/b>이다 보니, <b>1박 기준 6만 원대 방보다 7만 원대 방이 실제로 더 싸지는 역전 구간<\/b>이 생깁니다. 실부담(=결제금액－할인액)으로 계산하면 이렇습니다.<\/p>\n<table>\n<tr><th>숙소 요금(1박)<\/th><th>적용 권종<\/th><th>할인<\/th><th>내 실부담<\/th><\/tr>\n<tr><td>50,000원<\/td><td>2만 원권<\/td><td>-20,000원<\/td><td>30,000원<\/td><\/tr>\n<tr><td>69,000원<\/td><td>2만 원권<\/td><td>-20,000원<\/td><td><b>49,000원<\/b><\/td><\/tr>\n<tr><td><b>70,000원<\/b><\/td><td><b>3만 원권<\/b><\/td><td>-30,000원<\/td><td><b>40,000원<\/b> ← 더 좋은 방인데 9,000원 저렴<\/td><\/tr>\n<tr><td>79,000원<\/td><td>3만 원권<\/td><td>-30,000원<\/td><td><b>49,000원<\/b> (69,000원 방과 동일)<\/td><\/tr>\n<tr><td>90,000원<\/td><td>3만 원권<\/td><td>-30,000원<\/td><td>60,000원<\/td><\/tr>\n<\/table>\n<p>정리하면 <b>1박 요금이 7만 원 언저리라면, 6만 원대에서 아끼려 하지 말고 7만 원 선을 넘기는 쪽이 유리<\/b>합니다. <b>7만 원~7만 9천 원대 방은 6만 9천 원 방보다 실부담이 같거나 적습니다.<\/b> 여행지에서 방 등급을 한 칸 올릴 수 있다는 뜻이기도 합니다.<\/p>\n<p>연박도 구조가 같습니다. 경계선이 <b>14만 원<\/b>입니다.<\/p>\n<table>\n<tr><th>숙소 요금(2박 합계)<\/th><th>적용 권종<\/th><th>할인<\/th><th>내 실부담<\/th><\/tr>\n<tr><td>100,000원<\/td><td>5만 원권<\/td><td>-50,000원<\/td><td>50,000원<\/td><\/tr>\n<tr><td>139,000원<\/td><td>5만 원권<\/td><td>-50,000원<\/td><td><b>89,000원<\/b><\/td><\/tr>\n<tr><td><b>140,000원<\/b><\/td><td><b>7만 원권<\/b><\/td><td>-70,000원<\/td><td><b>70,000원<\/b> ← 19,000원 저렴<\/td><\/tr>\n<tr><td>159,000원<\/td><td>7만 원권<\/td><td>-70,000원<\/td><td><b>89,000원<\/b> (139,000원 방과 동일)<\/td><\/tr>\n<tr><td>200,000원<\/td><td>7만 원권<\/td><td>-70,000원<\/td><td>130,000원<\/td><\/tr>\n<\/table>\n<p>연박은 <b>14만 원~15만 9천 원 구간<\/b>이 그 아래 구간보다 실부담이 같거나 적습니다. <b>13만 원대에서 고민 중이라면 14만 원을 넘기는 편이 낫다<\/b>는 결론입니다.<\/p>\n<div class=\"tip\"><b>💡 할인율로 보면 이렇습니다<\/b><p style=\"margin:8px 0 0\">2박 <b>14만 원<\/b> 숙소에 <b>7만 원권<\/b>을 쓰면 할인율이 <b>정확히 50%<\/b>입니다. 1박 <b>7만 원<\/b>에 3만 원권이면 <b>약 43%<\/b>입니다. 국내 숙박에서 이 정도 할인폭은 흔치 않으므로, <b>기간 안에 갈 계획이 있다면 우선순위를 높게 두는 편<\/b>이 좋습니다.<\/p><\/div>\n<div class=\"warn\"><b>⚠️ 결제액이 할인액과 '같으면' 안 됩니다<\/b><p style=\"margin:8px 0 0\">공식 안내는 <b>2만 원권은 2만 원 이상, 5만 원권은 5만 원 이상<\/b> 결제 시 사용으로 되어 있지만, 실제 예약 화면에서는 <b>20,010원 이상 · 50,010원 이상<\/b>으로 표기하는 채널이 있습니다. <b>할인 후 결제액이 0원이 되면 결제 자체가 성립하지 않기 때문<\/b>입니다. 요금이 딱 2만 원·5만 원인 숙소를 노렸다면 <b>쿠폰이 적용되지 않을 수 있으니<\/b>, 결제 직전 화면에서 <b>차감 금액이 실제로 반영됐는지<\/b> 반드시 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 어디서 쓸 수 있나 — 대상 85곳 전체 목록<\/h2>\n<p>이 쿠폰은 <b>아무 데서나 쓸 수 없습니다.<\/b> <b>비수도권 인구감소지역 85개 기초 지방자치단체<\/b>에 있는 숙박시설이 대상입니다. 여기서 <b>인구감소지역<\/b>은 행정안전부가 「지방자치분권 및 지역균형발전에 관한 특별법」에 따라 지정·고시한 <b>전국 89곳<\/b>을 말하며, 이 가운데 <b>수도권 4곳(인천 강화·옹진, 경기 가평·연천)을 뺀 85곳<\/b>이 이번 행사 대상입니다.<\/p>\n<table>\n<tr><th>시·도<\/th><th>곳<\/th><th>해당 시·군·구<\/th><\/tr>\n<tr><td><b>부산<\/b><\/td><td>3<\/td><td>동구, 서구, 영도구<\/td><\/tr>\n<tr><td><b>대구<\/b><\/td><td>3<\/td><td>남구, 서구, 군위군<\/td><\/tr>\n<tr><td><b>강원<\/b><\/td><td>12<\/td><td>고성군, 삼척시, 양구군, 양양군, 영월군, 정선군, 철원군, 태백시, 평창군, 홍천군, 화천군, 횡성군<\/td><\/tr>\n<tr><td><b>충북<\/b><\/td><td>6<\/td><td>괴산군, 단양군, 보은군, 영동군, 옥천군, 제천시<\/td><\/tr>\n<tr><td><b>충남<\/b><\/td><td>9<\/td><td>공주시, 금산군, 논산시, 보령시, 부여군, 서천군, 예산군, 청양군, 태안군<\/td><\/tr>\n<tr><td><b>전북<\/b><\/td><td>10<\/td><td>고창군, 김제시, 남원시, 무주군, 부안군, 순창군, 임실군, 장수군, 정읍시, 진안군<\/td><\/tr>\n<tr><td><b>전남<\/b><\/td><td>16<\/td><td>강진군, 고흥군, 곡성군, 구례군, 담양군, 보성군, 신안군, 영광군, 영암군, 완도군, 장성군, 장흥군, 진도군, 함평군, 해남군, 화순군<\/td><\/tr>\n<tr><td><b>경북<\/b><\/td><td>15<\/td><td>고령군, 문경시, 봉화군, 상주시, 성주군, 안동시, 영덕군, 영양군, 영주시, 영천시, 울릉군, 울진군, 의성군, 청도군, 청송군<\/td><\/tr>\n<tr><td><b>경남<\/b><\/td><td>11<\/td><td>거창군, 고성군, 남해군, 밀양시, 산청군, 의령군, 창녕군, 하동군, 함안군, 함양군, 합천군<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 의외입니다 — 광역시 도심 자치구도 들어 있습니다<\/b><p style=\"margin:8px 0 0\">\"인구감소지역\"이라고 하면 산간·도서 지역만 떠올리기 쉽지만, 목록에는 <b>부산 동구·서구·영도구<\/b>, <b>대구 남구·서구<\/b>처럼 <b>광역시 안의 자치구<\/b>가 포함돼 있습니다. 부산 <b>영도·초량·남포동 권역<\/b>, 대구 <b>남구·서구<\/b> 숙소가 여기에 해당할 수 있다는 뜻입니다. <b>도시 여행에도 쓸 수 있는 쿠폰<\/b>이라는 점은 잘 알려져 있지 않습니다. 다만 <b>같은 시·군 안이라도 행사에 참여한 숙소만<\/b> 적용되므로, 최종 확인은 <b>각 예약 채널의 행사관 목록<\/b>에서 하셔야 합니다.<\/p><\/div>\n<div class=\"warn\"><b>⚠️ 지역이 맞아도 숙소가 빠져 있을 수 있습니다<\/b><p style=\"margin:8px 0 0\">쿠폰은 <b>지역 + 참여 숙소<\/b> 두 조건을 함께 만족해야 적용됩니다. 목록에 있는 지역이라도 <b>해당 숙소가 행사에 참여하지 않았다면 쿠폰이 붙지 않습니다.<\/b> 그래서 <b>숙소를 먼저 고르고 쿠폰을 찾는<\/b> 순서보다, <b>예약 채널의 '숙박세일 페스타' 행사관에서 숙소를 고르는<\/b> 순서가 실패가 적습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 발급 순서 — 오전 10시에 무엇을 하나<\/h2>\n<p>절차 자체는 단순합니다. 다만 <b>선착순<\/b>이라 <b>순서를 미리 익혀 두는 것이 전부<\/b>입니다.<\/p>\n<table>\n<tr><th>순서<\/th><th>할 일<\/th><th>주의<\/th><\/tr>\n<tr><td><b>①<\/b><\/td><td>전날까지 <b>갈 지역·숙소·날짜를 미리 정해 둔다<\/b><\/td><td>쿠폰 받은 뒤 고르면 늦습니다<\/td><\/tr>\n<tr><td><b>②<\/b><\/td><td>참여 <b>온라인여행사(OTA) 앱·사이트<\/b>의 숙박세일 페스타 행사관 접속<\/td><td>회원 로그인·본인확인 미리<\/td><\/tr>\n<tr><td><b>③<\/b><\/td><td><b>오전 10시<\/b>에 권종(2·3만 원권 / 5·7만 원권) 선택해 <b>쿠폰 다운로드<\/b><\/td><td>1인 1매, 소진 시 마감<\/td><\/tr>\n<tr><td><b>④<\/b><\/td><td>대상 지역 숙소를 <b>같은 채널에서 예약·결제<\/b><\/td><td>결제창에서 할인 반영 확인<\/td><\/tr>\n<tr><td><b>⑤<\/b><\/td><td><b>유효기간 안에<\/b> 결제 완료<\/td><td>당일 10시~<b>익일 오전 7시 직전<\/b><\/td><\/tr>\n<\/table>\n<p>참여 채널은 <b>여러 곳<\/b>입니다. 2026년 여름 회차 기준으로 <b>11번가·롯데ON<\/b>은 자체 행사 페이지를 별도로 운영했고, <b>야놀자·인터파크(놀유니버스)·여기어때<\/b> 등 주요 숙박 예약 플랫폼도 참여했습니다. <b>정확한 참여사 목록과 채널별 추가 혜택은 공식 누리집의 '참여사별 혜택 자세히 보기'<\/b>에서 확인하는 것이 가장 확실합니다(문의: <b>전담 콜센터 1670-3980<\/b>).<\/p>\n<div class=\"tip\"><b>💡 채널을 하나만 보지 마세요<\/b><p style=\"margin:8px 0 0\">쿠폰 수량은 <b>채널별로 나눠 배정<\/b>됩니다. 한 곳에서 마감이 떴다고 그날 전부 끝난 것이 아닙니다. 다만 <b>같은 날 여러 채널에서 중복 사용은 안 됩니다<\/b>(6장 참고). <b>발급은 여러 곳을 시도하되, 실제 사용은 한 건<\/b>이라고 이해하시면 됩니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 놓치기 쉬운 함정 6가지<\/h2>\n<p>이 사업에서 <b>실패의 대부분은 쿠폰을 못 받아서가 아니라, 받고도 못 써서<\/b> 생깁니다.<\/p>\n<table>\n<tr><th>함정<\/th><th>내용<\/th><\/tr>\n<tr><td><b>① 유효기간이 하루가 안 됩니다<\/b><\/td><td>받은 당일 <b>오전 10시부터 다음 날 오전 7시 직전까지<\/b>(최대 21시간). 이 안에 <b>결제까지<\/b> 끝내야 합니다. 미사용분은 <b>자동 소멸<\/b>되고 연장은 없습니다.<\/td><\/tr>\n<tr><td><b>② 하루에 1개 채널·1개 권종<\/b><\/td><td>유효기간 안에 <b>1개 OTA에서 1개 권종만<\/b> 사용할 수 있습니다. 2만 원권과 5만 원권을 같은 날 함께 쓰는 방식은 안 됩니다.<\/td><\/tr>\n<tr><td><b>③ 1인 1매<\/b><\/td><td>가족 명의를 여러 개 동원해 <b>한 예약에 여러 장을 겹쳐 쓰는 것은 불가<\/b>합니다.<\/td><\/tr>\n<tr><td><b>④ 양도 불가<\/b><\/td><td>타인에게 <b>양도가 절대 불가<\/b>합니다. 중고 거래로 사고파는 행위는 대상이 아닙니다.<\/td><\/tr>\n<tr><td><b>⑤ 대실 불가<\/b><\/td><td><b>숙박(1박 이상)<\/b>만 대상이며 <b>대실은 제외<\/b>입니다.<\/td><\/tr>\n<tr><td><b>⑥ 예약을 취소하면<\/b><\/td><td>결제 취소 시 <b>쓴 쿠폰이 그대로 되살아난다는 보장이 없습니다.<\/b> 유효기간이 지났다면 <b>재발급도 안 됩니다.<\/b> 취소·변경 가능성이 있으면 <b>숙소의 환불 규정을 먼저<\/b> 보세요.<\/td><\/tr>\n<\/table>\n<div class=\"warn\"><b>⚠️ 가장 많이 하는 실수 — \"일단 받아 두자\"<\/b><p style=\"margin:8px 0 0\">아침 10시에 <b>쿠폰만 먼저 받아 두고 저녁에 천천히 고르겠다<\/b>고 하면, 그 사이 <b>원하던 숙소가 마감<\/b>되거나 <b>다음 날 아침 7시를 넘겨 쿠폰이 사라집니다.<\/b> 이 사업은 <b>쿠폰 확보<\/b>가 아니라 <b>당일 예약 완료<\/b>가 목표입니다. 갈 지역·날짜·숙소 후보를 <b>전날 밤에 장바구니 수준까지<\/b> 정해 두는 것이 사실상 유일한 요령입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 이런 경우엔 못 씁니다<\/h2>\n<ul>\n<li><b>수도권 숙소<\/b> — 서울·인천·경기 소재 숙소는 대상이 아닙니다. 인천 강화·옹진, 경기 가평·연천은 인구감소지역이지만 <b>수도권이라 이번 행사에서는 빠졌습니다.<\/b><\/li>\n<li><b>비수도권이어도 지정 목록 밖<\/b> — 4장 표에 없는 시·군·구는 대상이 아닙니다. 예를 들어 <b>제주 전역<\/b>, 강원 <b>속초·강릉·동해<\/b>, 경남 <b>통영<\/b> 등은 이번 대상 85곳에 포함돼 있지 않습니다(속초·강릉·동해·통영 등은 별도 '관심지역' 분류입니다).<\/li>\n<li><b>만 19세 미만<\/b> — 발급 대상이 아닙니다.<\/li>\n<li><b>대실 상품, 숙박이 아닌 상품<\/b> — 입장권·패키지 중 숙박이 아닌 구성은 제외됩니다.<\/li>\n<li><b>행사에 참여하지 않은 숙소<\/b> — 지역이 맞아도 참여 숙소가 아니면 적용되지 않습니다.<\/li>\n<li><b>유효기간이 지난 쿠폰<\/b> — 연장·재발급 모두 불가하며 <b>소멸<\/b>합니다.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 이번 회차가 끝나도 — 다음 회차 확인법<\/h2>\n<p>숙박세일 페스타는 <b>한 번 하고 끝나는 행사가 아니라 해마다 회차를 나눠 반복<\/b>됩니다. 2026년만 해도 <b>봄맞이<\/b>(4월 8일~5월 10일)와 <b>여름맞이<\/b>(6월 11일~8월 17일)가 이어졌습니다. 지금 회차를 놓쳤다면 <b>다음 회차를 기다리는 것이 정답<\/b>이고, 그때를 놓치지 않으려면 확인처를 알아 두면 됩니다.<\/p>\n<table>\n<tr><th>확인처<\/th><th>무엇을 보나<\/th><\/tr>\n<tr><td><b>공식 누리집<\/b> ktostay.visitkorea.or.kr<\/td><td>회차 개시일·기간·권종·참여사 — <b>가장 먼저 올라옵니다<\/b><\/td><\/tr>\n<tr><td><b>문화체육관광부 보도자료<\/b><\/td><td>회차 발표(대개 개시 2~3주 전)·물량·대상 지역 변경 여부<\/td><\/tr>\n<tr><td><b>대한민국 구석구석<\/b><\/td><td>연계 여행 할인·지역 행사 정보<\/td><\/tr>\n<tr><td><b>이용 중인 예약 앱의 알림<\/b><\/td><td>채널별 행사관 오픈 알림 — 발급 당일 놓치지 않는 데 유용<\/td><\/tr>\n<\/table>\n<p>중요한 것은 <b>회차마다 기간·할인액·대상 지역이 달라질 수 있다<\/b>는 점입니다. 이번 여름맞이 회차만 해도 대상이 <b>인구감소지역 85곳<\/b>으로 한정돼 있는데, 이 범위가 회차마다 같으리라는 보장은 없습니다. <b>지난 회차 조건을 그대로 기억해 두고 움직이면 헛걸음<\/b>이 됩니다. <b>회차가 열릴 때마다 대상 지역과 금액, 기간을 공식 누리집에서 다시 확인<\/b>하시는 편이 안전합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 자주 묻는 질문<\/h2>\n<h3>Q. 신청서를 내야 하나요?<\/h3>\n<p>아닙니다. <b>심사·신청서가 없는 선착순 쿠폰<\/b>입니다. 예약 채널에서 <b>다운로드 버튼을 누르는 것이 곧 신청<\/b>입니다.<\/p>\n<h3>Q. 소득이나 나이 조건이 있나요?<\/h3>\n<p>소득 조건은 없습니다. <b>만 19세 이상 국민이면 누구나<\/b> 1인 1매입니다.<\/p>\n<h3>Q. 다른 할인과 같이 쓸 수 있나요?<\/h3>\n<p>채널 자체 할인·카드 혜택과의 중복 여부는 <b>채널마다 다릅니다.<\/b> 결제 직전 화면에서 <b>실제 차감액<\/b>을 확인하는 것이 가장 정확합니다. 다만 <b>숙박세일 페스타 쿠폰끼리는 하루 1장<\/b>입니다.<\/p>\n<h3>Q. 지방에 사는 사람만 받을 수 있나요?<\/h3>\n<p>아닙니다. <b>거주지 제한은 없습니다.<\/b> 제한이 걸리는 것은 <b>숙소의 소재지<\/b>입니다. 서울에 살아도 <b>대상 85곳 숙소를 예약하면 사용 가능<\/b>합니다.<\/p>\n<h3>Q. 예약을 취소하면 쿠폰을 다시 받나요?<\/h3>\n<p><b>보장되지 않습니다.<\/b> 유효기간이 지난 뒤라면 <b>소멸<\/b>이고 재발급도 없습니다. 일정이 확실할 때 쓰는 것이 안전합니다.<\/p>\n<h3>Q. 부산·대구 시내 호텔에도 되나요?<\/h3>\n<p><b>부산 동구·서구·영도구<\/b>, <b>대구 남구·서구<\/b>는 대상 지역에 포함돼 있습니다. 다만 <b>그 지역의 참여 숙소<\/b>여야 하므로, 예약 채널의 <b>행사관 목록<\/b>에서 확인하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내<\/b>\n<a href=\"https://ktostay.visitkorea.or.kr/\" rel=\"nofollow\" target=\"_blank\">▸ 2026 대한민국 숙박세일 페스타 공식 누리집 — 기간·권종·참여사<\/a>\n<a href=\"https://www.mois.go.kr/frt/sub/a06/b06/populationDecline/screen.do\" rel=\"nofollow\" target=\"_blank\">▸ 행정안전부 — 인구감소지역 지정 현황(전국 89곳)<\/a>\n<a href=\"https://www.mcst.go.kr/kor/s_notice/press/pressList.jsp\" rel=\"nofollow\" target=\"_blank\">▸ 문화체육관광부 보도자료 — 회차 발표 확인<\/a>\n<a href=\"https://korean.visitkorea.or.kr/main/main.do\" rel=\"nofollow\" target=\"_blank\">▸ 대한민국 구석구석(한국관광공사) — 지역 여행 정보<\/a>\n<p style=\"margin:10px 0 0;font-size:14px;color:#1b4f86\">▸ 숙박세일 페스타 <b>전담 콜센터 1670-3980<\/b><\/p>\n<\/div>\n\n<div class=\"end\"><b>✅ 마무리 — 세 줄로 정리하면<\/b><p style=\"margin:8px 0 0\"><b>①<\/b> 2026 여름맞이 회차는 <b>8월 17일(월)까지 발급·예약·입실<\/b>이 모두 끝나야 하고, <b>매일 오전 10시 선착순<\/b>입니다. <b>②<\/b> 할인은 1박 <b>2만·3만 원<\/b>, 연박 <b>5만·7만 원<\/b>인데 경계가 <b>7만 원·14만 원<\/b>이라, <b>그 선을 살짝 넘기는 방이 그 아래 방보다 실부담이 적어지는 구간<\/b>이 있습니다. <b>③<\/b> 가장 흔한 실패는 <b>\"받아 두고 나중에\"<\/b>입니다. 유효기간이 <b>익일 오전 7시 직전까지<\/b>뿐이니, <b>전날 밤에 지역·날짜·숙소를 정해 두고 10시에는 결제까지<\/b> 끝내세요.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, <b>회차별 기간·할인 금액·대상 지역은 변경될 수 있습니다.<\/b> 여름맞이 회차는 <b>최초 발표 당시 7월 31일까지로 안내<\/b>됐으나, <b>이 글 작성 시점의 공식 누리집과 참여 채널 표기는 8월 17일까지<\/b>입니다(두 곳 모두 동일 표기 확인). <b>물량 소진 시 조기 종료될 수 있습니다.<\/b> 따라서 <b>이용 직전 공식 누리집에서 현재 회차의 기간과 대상 지역을 다시 확인<\/b>하시기 바랍니다.<br>3장의 계산은 <b>표기된 권종 기준을 그대로 적용한 예시<\/b>이며, 실제 결제액은 채널 자체 할인·세금·수수료에 따라 달라질 수 있습니다. 4장 지역 목록은 <b>행정안전부 인구감소지역 89곳 중 수도권 4곳(인천 강화·옹진, 경기 가평·연천)을 제외한 85곳<\/b>이며, 개별 숙소의 행사 참여 여부는 예약 채널에서 확인해야 합니다.<br>출처: 2026 대한민국 숙박세일 페스타 공식 누리집(ktostay.visitkorea.or.kr), 문화체육관광부·한국관광공사 여름맞이 숙박세일 페스타 발표 자료, 행정안전부 인구감소지역 지정 현황(「지방자치분권 및 지역균형발전에 관한 특별법」 제2조·시행령 제3조), 참여 채널 행사 페이지(11번가·롯데ON) 표기. 전담 콜센터 1670-3980<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01495223186.html\">▸ 국립자연휴양림 예약 방법 성수기 추첨 낙첨 잔여객실 선착순 신청법 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01858941660.html\">▸ 펜션 호텔 예약 취소 수수료 환불 규정 총정리 (2026 성수기 위약금)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/2026-40.html\">▸ 근로자 휴가지원사업 신청 방법 대상 지원금액 총정리 (2026 40만 원 여행비)<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 기간·권종·할인 금액은 <b>숙박세일 페스타 공식 누리집과 참여 채널 행사 페이지<\/b>에서, 대상 지역은 <b>행정안전부 인구감소지역 지정 현황<\/b>에서 직접 확인해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 3장 계산 예시는 가정치를 명시했습니다. 실제 적용 여부는 예약 채널·숙소별로 다를 수 있으니 결제 화면에서 차감액을 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▲ OSMU 확산용 핵심 3줄 요약 (네이버·쓰레드용)\n1. 정부(문체부·한국관광공사)가 주는 숙박 할인권 '대한민국 숙박세일 페스타'는 2026 여름맞이 회차 기준 8월 17일(월)까지 발급·예약·입실이 모두 끝나야 합니다. 매일 오전 10시 선착순, 만 19세 이상 1인 1매이고 1박은 2만·3만 원, 연박(2박 이상)은 5만·7만 원을 깎아 줍니다.\n2. 할인이 정액이라 경계선(1박 7만 원, 연박 14만 원)을 살짝 넘기는 방이 그 아래 방보다 실부담이 오히려 적습니다. 1박 6만9천 원 방은 실부담 4만9천 원인데 7만 원 방은 4만 원입니다. 연박도 13만9천 원(실부담 8만9천 원)보다 14만 원(7만 원)이 쌉니다.\n3. 가장 큰 함정은 유효기간입니다. 받은 당일 오전 10시부터 다음 날 오전 7시 직전까지(최대 21시간) 결제까지 끝내야 하고, 하루에 1개 채널·1개 권종만 됩니다. 쓸 수 있는 곳은 비수도권 인구감소지역 85곳인데, 의외로 부산 동구·서구·영도구와 대구 남구·서구 같은 도심 자치구도 포함됩니다.\n"},{"code":"D2-09","title":"침수차 확인 방법 중고차 침수이력 무료 조회 계약 해제 90일 총정리 (2026 카히스토리·자동차365)","lane":"info","thumb":"147_flood_used_car.png","draft":"침수차확인방법_글_HTML.txt","facts":"[조문은 law.go.kr 본문을 브라우저로 직접 열람 — 시행 2026.6.16. 법률 제21817호 / 시행규칙 시행 2026.6.3.] 침수 미고지 계약해제 90일=제58조의6①3호(제2호에 '침수 사실은 제외한다' 명문), 일반 30일=1·2호 | 해제 시 차 반환과 대금 반환은 동시이행=제58조의6②③ | 침수 미고지·거짓고지 형사처벌=제80조 6·7호 2년이하 징역 또는 2천만원이하 벌금 | 고지는 '매매계약 체결 전 서면', 점검내용은 '점검일부터 120일 이내'=제58조①1호(+시행규칙 제120조② 발급일 기준 120일) | 점검자 보증책임·보험가입=제58조의4, 위반 1년이하 징역/1천만원이하 벌금=제81조 25의6·25의7 (수 했다(시행 2026.6.16. 법률 제21817호).\n        제2호에 **\"(침수 사실은 제외한다)\"** 라는 괄호가 박혀 있어 침수만 제3호=90일로 갈린다.\n   ①-2 형사처벌 — 침수 사실 미고지·거짓고지는 **제80조 제6호·제7호, 2년 이하 징역 또는 2천만 원 이하 벌금**이다.\n      민사 해제만 아는 사람이 대부분이라 협상력에서 큰 차이가 난다.\n   ② 함정 — 카히스토리 무료조회는 **보험 처리된 침수만** 나온다(보험개발원 공식 명시). 자비 수리한\n      침수차는 조회해도 '이력 없음'으로 나온다. 이 글의 가장 중요한 경고.\n   ③ 판단형 비교 — 카히스토리 vs 자동차365, 무엇이 잡히고 무엇이 안 잡히는지 표로 대조.\n      자동차365는 무료지만 같은 사이트의 '통합이력조회'는 수수료가 붙을 수 있어 서비스가 다르다.\n   ④ 트랙 구분 — 성능점검 보증(인도일 30일 이상 또는 2천km 이상 · 시행규칙 제123조의8②)과\n      계약 해제권(90일)은 **별개 트랙**이다. 보증이 끝났다고 해제권까지 끝난 게 아니다.\n   ⑤ 계산예시 — 인도일을 넣어 30일·90일·2,000km 만료일을 달력으로 역산.\n   ⑥ 판단형 비교 — 계약 해제(원상회복) vs 손해배상(수리비) 중 어느 쪽이 유리한가.\n   ⑦ 함정 — 전손 침수차는 안 날부터 30일 내 폐차가 법적 의무(법 제26조의2① + 시행규칙 제25조의2①)이고\n      위반 시 **1천만 원 이하 과태료**(제84조 제2항 제2호의2)인데도 유통된다.\n      그래서 정작 위험한 건 '보험 처리를 안 한 침수차'라는 결론으로 ②와 연결.\n   ⑧ 시효성 정보 — 성능·상태점검 내용은 **점검일부터 120일 이내의 것**이어야 하고(법 제58조①1호),\n      기록부 발급도 발급일 기준 120일 이내 점검분으로 한정된다(시행규칙 제120조②). 게다가 고지는\n      **매매 계약을 체결하기 전에 서면으로** 해야 한다 — 계약서에 사인한 뒤 주는 것은 위법이다.\n■ 팩트 기준: 2026년 8월 · 1차 출처 직접 열람\n   - 보험개발원 카히스토리 「무료침수사고조회」 페이지 원문 → 운영기관·입력값·조회범위·한계 문구\n   - 🔴 **국가법령정보센터(law.go.kr) 「자동차관리법」 조문 원문 직접 열람**\n     (시행 2026.6.16. 법률 제21817호 / 시행규칙 시행 2026.6.3.) — 브라우저 창으로 본문 텍스트를 직접 읽었다.\n     WebFetch 로는 law.go.kr 이 JS 렌더링이라 본문이 안 나온다(3회 실패 확인) → 브라우저 경로가 정답.\n       · 제58조①1호(침수 사실 포함 서면 고지·점검일부터 120일 이내) · 제58조의4(성능·상태점검자의 보증 책임)\n       · 제58조의6①(30일/90일 해제, 제2호 \"침수 사실은 제외한다\") · 제58조의6②③(반환과 동시이행)\n       · 제80조 6·7호(침수 미고지·거짓고지 = 2년 이하 징역 또는 2천만 원 이하 벌금)\n       · 제81조 25의6·25의7(점검자 보증 불이행·보험 미가입 = 1년 이하 징역 또는 1천만 원 이하 벌금)\n       · 제84조②2의2(폐차 요청 불이행 = 1천만 원 이하 과태료) · 제84조②5(전손 침수차 수출·판매 = 동일)\n       · 제26조의2①②(폐차 요청 의무 · 수출 및 수출자 판매 금지) · 제59조④(침수 미고지 실형자 2년간 종사 제한)\n       · 시행규칙 제25조의2①(\"전손 처리 결정된 사실을 안 날부터 30일\") · 제120조②(120일) · 제123조의8②(30일·2천km)\n   - 법제처 찾기쉬운 생활법령정보 「중고차 매매 분쟁 해결하기」 → 해제 기간 해설(위 조문과 대조 일치)\n   - 국토교통부·한국교통안전공단 자동차365 → 침수정보 조회(무료)와 통합이력조회(수수료 가능) 구분\n   - 손해보험협회 집계(12개 손보사 자동차보험) → 2021~2025년 침수 35,011건 / 7~10월 95.7% / 전손 74.9%\n   - 공정거래위원회 「소비자분쟁해결기준」 고시 → '먼저 도달한 것 적용' 문구(법정 최소는 시행규칙 소관)\n■ 초안 1차 작성 시의 오류(조문 원문 대조로 정정한 것 — 발행본에는 정정 후 값이 들어 있다)\n   ① 전손 침수차 폐차 불이행 과태료를 언론 기사 요약대로 '300만 원 이하'로 썼다 → **현행 1천만 원 이하**\n      (제84조 제2항). 300만 원은 개정 전 수치였다.\n   ② 성능·상태점검 책임보험 미가입 벌칙(1년 이하 징역/1천만 원 이하 벌금)의 대상을 매매업자처럼 읽히게 썼다\n      → 실제 수범자는 **자동차성능·상태점검자**다(제81조 25의6·25의7).\n   ③ 120일을 '1차 출처 미확인'으로 빼뒀는데, **법 제58조①1호에 명문으로 있다.** 넣었다.\n   → 교훈: law.go.kr 은 WebFetch 로 못 읽히니 **브라우저 창으로 조문 본문을 직접 열 것.**\n      언론·개인블로그 요약으로 법 조문·금액을 쓰면 이렇게 틀린다.\n■ 의도적 미기재:\n   - 2026년 올해 침수차 대수 — 공식 집계가 아직 없어 쓰지 않았다. 본문 숫자는 전부 2021~2025년\n     확정치이며 연도별 합(1,531+18,267+2,238+5,210+7,765=35,011)과 전손·분손 합(26,224+8,787=35,011)이\n     일치하는 것을 확인했다.\n   - 자차보험 침수 보상 요건(창문 개방 등) — D2-07에서 이미 다뤘으므로 중복 회피.\n\n[붙여넣는 법] Blogger 글쓰기 → 연필▾ → HTML 보기 → 아래 전체 붙여넣기 → 작성 보기 → 제목 입력 → 라벨(생활행정) → 발행\n----------------------------------------------------------------\n▼ 본문 HTML\n<div style=\"text-align:center;margin:0 0 18px\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCACIAQQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD2qiiiqJCiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKAIrh9kfHU8CqNWLw/Mo9qr0mYzeoUUUUEhRRRQA5XZRhW }\n.lsg li{margin:6px 0}\n.lsg h3{font-size:18px;margin:22px 0 10px}\n.lsg .toc{background:#e8f7ef;border:1px solid #bfe8d3;border-radius:12px;padding:16px 20px;margin:18px 0 26px}\n.lsg .toc b{display:block;font-size:14px;color:#17794f;margin-bottom:8px}\n.lsg .toc a{display:block;color:#146342;text-decoration:none;padding:4px 0;font-size:15px}\n.lsg .cta{display:block;text-align:center;background:linear-gradient(90deg,#2EB67D,#1f8f61);color:#fff !important;font-weight:800;font-size:17px;padding:15px 18px;border-radius:12px;text-decoration:none;margin:22px 0}\n.lsg table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:15px}\n.lsg th,.lsg td{border:1px solid #cbe9d9;padding:10px 12px;text-align:center}\n.lsg th{background:#ddf3e8}\n.lsg .tip{background:#e8f7ef;border:1px solid #bfe8d3;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .warn{background:#fff1f0;border:1px solid #ffc9c4;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .end{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:16px 20px;margin-top:24px}\n.lsg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#e8f7ef;border:1px solid #bfe8d3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#17794f;margin-bottom:8px}\n.lsg .rel a{display:block;color:#146342;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#a8bcb1;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">생활·행정<\/span>\n<p>여름 폭우가 지나가면 <b>8월과 9월에 중고차 시장으로 침수차가 흘러듭니다.<\/b> 물에 잠겼던 차는 겉으로는 멀쩡해 보여도 전자장비와 배선이 서서히 부식돼 원인 모를 고장이 반복되고, 주행 중 갑작스러운 시동 꺼짐으로 이어질 수 있습니다. 그래서 중고차를 살 때 <b>침수 이력 조회<\/b>는 선택이 아니라 순서입니다. 그런데 여기에 두 가지 중요한 사실이 있습니다. 첫째, <b>가장 많이 쓰는 무료 조회(카히스토리)로도 잡히지 않는 침수차가 있습니다.<\/b> 둘째, 침수 사실을 속아서 샀다면 <b>계약을 해제할 수 있는 기간이 30일이 아니라 90일입니다.<\/b> 대부분의 안내 글이 \"30일\"이라고만 적고 있어서 권리가 남아 있는데도 포기하는 경우가 생깁니다. 무료 조회 두 곳을 제대로 쓰는 법, 성능·상태점검기록부를 읽는 법, 그리고 이미 샀다면 어떻게 무르는지를 법 조문과 공식 페이지 원문 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 침수차는 왜 8~9월에 쏟아지나 — 숫자로 보기<\/a><a href=\"#trap1\">2. 🔴 함정 ① 카히스토리로도 안 잡히는 침수차가 있습니다<\/a><a href=\"#compare\">3. 무료 조회 두 곳 완전 비교 (카히스토리 vs 자동차365)<\/a><a href=\"#how\">4. 5분이면 끝나는 조회 3단계<\/a><a href=\"#record\">5. 성능·상태점검기록부에서 침수 칸 읽는 법<\/a><a href=\"#eye\">6. 눈과 코로 잡는 침수 흔적 12곳<\/a><a href=\"#law90\">7. 🔴 핵심 — 침수 미고지는 30일이 아니라 <b>90일<\/b>입니다<\/a><a href=\"#calc\">8. 계산예시 — 내 권리 만료일 달력으로 역산하기<\/a><a href=\"#track\">9. 30일·2,000km 트랙과 90일 트랙은 다릅니다<\/a><a href=\"#choose\">10. 계약 해제와 손해배상, 어느 쪽이 유리한가<\/a><a href=\"#process\">11. 실제 진행 절차 4단계 (한국소비자원 1372)<\/a><a href=\"#trap3\">12. 🔴 함정 ② 전손 침수차는 폐차가 의무인데 왜 시장에 있나<\/a><a href=\"#faq\">13. 자주 묻는 질문<\/a><a href=\"#gov\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#trap1\">👉 무료 조회로도 안 잡히는 침수차부터 확인하기<\/a>\n\n<h2 id=\"sec1\">1. 침수차는 왜 8~9월에 쏟아지나 — 숫자로 보기<\/h2>\n<p>손해보험협회가 12개 손해보험사의 자동차보험 처리 내역을 집계한 자료를 보면, <b>2021년부터 2025년까지 5년간 자동차보험으로 처리된 차량 침수 사고는 35,011건<\/b>입니다. 그중 <b>7월부터 10월 사이에 33,490건(95.7%)<\/b>이 몰려 있습니다.<\/p>\n<table>\n<tr><th>연도<\/th><th>침수 처리 건수<\/th><\/tr>\n<tr><td>2021년<\/td><td>1,531건<\/td><\/tr>\n<tr><td>2022년<\/td><td><b>18,267건<\/b><\/td><\/tr>\n<tr><td>2023년<\/td><td>2,238건<\/td><\/tr>\n<tr><td>2024년<\/td><td>5,210건<\/td><\/tr>\n<tr><td>2025년<\/td><td>7,765건<\/td><\/tr>\n<tr><td><b>5년 합계<\/b><\/td><td><b>35,011건<\/b><\/td><\/tr>\n<\/table>\n<p>이 35,011건을 처리 방식으로 나누면 <b>전손 26,224건(74.9%)<\/b>, <b>분손 8,787건(25.1%)<\/b>입니다. 침수 사고 넷 중 셋이 <b>수리하는 것보다 차값을 주는 편이 싸다고 판단된 전손<\/b>이라는 뜻입니다.<\/p>\n<div class=\"tip\"><b>💡 왜 이 숫자가 구매자에게 중요한가<\/b><p style=\"margin:8px 0 0\">침수가 7~10월에 몰린다는 것은, <b>수리와 정비를 거쳐 매물로 나오는 시점이 그 직후인 8월~이듬해 초<\/b>라는 뜻입니다. 여름 폭우 뉴스가 나온 해의 가을에 중고차를 산다면 조회를 건너뛸 이유가 없습니다.<\/p><\/div>\n<p>참고로 <b>2026년 올해의 침수 차량 수는 아직 공식 집계가 나오지 않았습니다.<\/b> 인터넷에 도는 \"올해 몇만 대\" 같은 수치는 출처가 불분명한 경우가 많으니 그대로 믿지 마세요. 확정된 통계는 위 5년치입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"trap1\">2. 🔴 함정 ① 카히스토리로도 안 잡히는 침수차가 있습니다<\/h2>\n<p>침수 조회라고 하면 대부분 <b>카히스토리(carhistory.or.kr)<\/b>를 떠올립니다. 보험개발원이 운영하는 사이트이고, <b>무료침수사고조회<\/b> 메뉴에서 차량번호나 차대번호만 넣으면 침수 이력이 바로 나옵니다. 좋은 서비스입니다. 그런데 <b>이 조회의 범위<\/b>를 반드시 알고 써야 합니다.<\/p>\n<div class=\"warn\"><b>📜 카히스토리 공식 안내 원문의 요지<\/b><p style=\"margin:8px 0 0\">이 조회는 <b>보험회사가 자동차보험으로 처리한 침수 사고<\/b>를 알려주는 서비스이며, <b>보험사에 신고하지 않았거나 자동차보험으로 처리하지 않은 경우는 확인할 수 없습니다.<\/b> 사이트 스스로 \"참고 정보\"이며 실차 확인과 전문가 점검을 함께 받으라고 안내하고 있습니다.<\/p><\/div>\n<p>이 한 문장이 침수차 사기의 핵심 구멍입니다. 침수 피해를 입은 차주가 <b>보험 처리를 하지 않고 자기 돈으로 수리했다면<\/b>, 그 차는 카히스토리에서 <b>\"침수 이력 없음\"<\/b>으로 깨끗하게 나옵니다.<\/p>\n<p>왜 보험 처리를 안 할까요. 이유는 단순합니다.<\/p>\n<ul>\n<li><b>보험료 할증이 싫어서<\/b> — 침수는 자기차량손해로 처리되고 보험료에 영향을 줄 수 있습니다.<\/li>\n<li><b>자차보험에 가입돼 있지 않아서<\/b> — 자차 미가입 차량은 애초에 보험 처리 자체가 불가능합니다.<\/li>\n<li><b>침수 기록을 남기지 않으려고<\/b> — 되팔 때 값이 떨어지는 것을 피하려는 경우입니다.<\/li>\n<\/ul>\n<p>즉 <b>가장 악의적으로 유통되는 침수차일수록 카히스토리에는 안 나옵니다.<\/b> \"카히스토리 돌려봤는데 깨끗해요\"라는 판매자 말만 믿으면 안 되는 이유가 여기 있습니다. 조회는 <b>거르는 도구<\/b>이지 <b>보증하는 도구<\/b>가 아닙니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"compare\">3. 무료 조회 두 곳 완전 비교 (카히스토리 vs 자동차365)<\/h2>\n<p>그래서 <b>한 곳만 돌리면 안 됩니다.<\/b> 국토교통부와 한국교통안전공단이 운영하는 <b>자동차365(car365.go.kr)<\/b>에도 <b>침수정보 조회<\/b>가 있고, 이쪽은 보험 이력 외의 경로까지 함께 봅니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>카히스토리<\/th><th>자동차365<\/th><\/tr>\n<tr><td><b>운영<\/b><\/td><td>보험개발원<\/td><td>국토교통부 · 한국교통안전공단<\/td><\/tr>\n<tr><td><b>메뉴<\/b><\/td><td>무료침수사고조회<\/td><td>중고차의모든것 &gt; 중고차매매 &gt; <b>침수정보 조회<\/b><\/td><\/tr>\n<tr><td><b>입력<\/b><\/td><td>차량번호 또는 차대번호<\/td><td>차량번호<\/td><\/tr>\n<tr><td><b>보험 침수 이력<\/b><\/td><td>✅ (1996년 이후)<\/td><td>✅<\/td><\/tr>\n<tr><td><b>정비업소 수리 내역<\/b><\/td><td>❌<\/td><td>✅<\/td><\/tr>\n<tr><td><b>지자체 침수 피해 신고<\/b><\/td><td>❌<\/td><td>✅<\/td><\/tr>\n<tr><td><b>비용<\/b><\/td><td>무료<\/td><td>침수정보 조회는 무료<\/td><\/tr>\n<\/table>\n<div class=\"warn\"><b>⚠️ 자동차365에서 헷갈리기 쉬운 점<\/b><p style=\"margin:8px 0 0\">같은 사이트의 <b>「통합이력조회」는 침수정보 조회와 다른 서비스<\/b>입니다. 자동차365는 <b>「자동차관리법」 제76조에 따라 통합이력조회 이용 시 수수료를 징수할 수 있다<\/b>고 안내하고 있습니다. 무료로 침수만 보려면 <b>「침수정보 조회」 메뉴<\/b>로 들어가세요.<\/p><\/div>\n<h3>그래도 남는 사각지대<\/h3>\n<p>두 곳을 다 돌려도 <b>보험 처리도 안 하고 정식 정비업소도 거치지 않은 채 개인이 손본 차<\/b>는 어디에도 기록이 없습니다. 그래서 마지막 관문은 결국 <b>기록부 확인 + 눈과 코<\/b>입니다. 아래 5·6번이 그 부분입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"how\">4. 5분이면 끝나는 조회 3단계<\/h2>\n<p>매물을 보러 가기 <b>전에<\/b> 차량번호만 받아서 집에서 먼저 돌려보세요. 판매자에게 차량번호를 알려달라고 하는 것은 전혀 실례가 아니며, <b>차량번호 공개를 꺼리는 판매자는 그 자체가 신호<\/b>입니다.<\/p>\n<ol>\n<li><b>카히스토리 무료침수사고조회<\/b> — carhistory.or.kr → 무료침수사고조회 → 차량번호(또는 차대번호) 입력. 침수 여부와 침수 날짜가 나옵니다.<\/li>\n<li><b>자동차365 침수정보 조회<\/b> — car365.go.kr → 중고차의모든것 → 중고차매매 → 침수정보 조회 → 차량번호 입력. 정비 내역과 지자체 신고 내역까지 함께 확인됩니다.<\/li>\n<li><b>성능·상태점검기록부 요구<\/b> — 매매업자를 통한 거래라면 계약 전에 <b>반드시 종이(또는 파일)로 받아<\/b> 침수 항목과 점검일자를 확인합니다.<\/li>\n<\/ol>\n<div class=\"tip\"><b>💡 화면을 캡처해 두세요<\/b><p style=\"margin:8px 0 0\">조회 결과 화면은 <b>날짜가 보이도록 캡처<\/b>해 두세요. 나중에 분쟁이 생겼을 때 \"계약 전에 확인했고 그때는 이력이 없다고 나왔다\"는 사실이 <b>고지 위반을 다투는 근거<\/b>가 됩니다. 카카오톡·문자로 오간 \"침수 없습니다\"라는 판매자 답변도 지우지 마세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"record\">5. 성능·상태점검기록부에서 침수 칸 읽는 법<\/h2>\n<p>중고차 매매업자를 통해 사면 <b>「자동차관리법」에 따라 성능·상태점검기록부를 고지받습니다.<\/b> 이건 서비스가 아니라 <b>법이 정한 의무<\/b>입니다. 제58조 제1항 제1호의 문구를 그대로 옮기면 이렇습니다.<\/p>\n<div class=\"tip\"><b>📜 「자동차관리법」 제58조 제1항 (조문 원문)<\/b><p style=\"margin:8px 0 0\">자동차매매업자(종사원을 포함한다)가 자동차를 매도 또는 매매의 알선을 하는 경우에는 (…) 다음 각 호의 사항을 <b>매매 계약을 체결하기 전에<\/b> 그 자동차의 매수인에게 <b>서면으로 고지<\/b>하여야 한다.<br>1. (…) 해당 자동차의 <b>침수 사실<\/b> 및 구조·장치 등의 성능·상태를 점검한 내용(점검 장면을 촬영한 사진을 포함하며, <b>점검일부터 120일 이내의 것<\/b>)<\/p><\/div>\n<p>여기서 세 가지가 한꺼번에 확정됩니다. <b>①침수 사실은 고지 항목에 명시돼 있고 ②고지 시점은 '계약 체결 전'이며 ③점검 내용은 점검일부터 120일 이내여야 합니다.<\/b> 계약서에 사인을 다 받은 다음에 기록부를 건네는 방식은 순서가 뒤집힌 것입니다.<\/p>\n<h3>반드시 확인할 네 가지<\/h3>\n<ul>\n<li><b>침수 항목이 체크돼 있는가<\/b> — 기록부에는 침수 이력을 표기하는 칸이 있습니다. 여기에 아무 표시가 없다면 \"침수 없음\"을 <b>점검자가 보증해 고지한 것<\/b>이 됩니다. 나중에 침수가 드러나면 이 서류가 그대로 증거가 됩니다.<\/li>\n<li><b>점검일자가 120일 안쪽인가<\/b> — 시행규칙 제120조 제2항은 기록부 발급을 <b>발급일 기준 120일 이내에 이루어진 점검<\/b>으로 한정합니다. 점검일이 넉 달 넘게 지난 기록부는 애초에 쓸 수 없는 서류입니다. <b>점검일자부터 보세요.<\/b><\/li>\n<li><b>계약 전에 받았는가<\/b> — 위 조문대로 <b>계약 체결 전<\/b>입니다. \"일단 계약금부터 걸고 나중에 드릴게요\"는 받아들이지 마세요.<\/li>\n<li><b>서명하기 전에 확인했는가<\/b> — 소비자가 기록부에 확인·서명하기 전에 <b>자동차365에서 정비이력과 실매물 여부를 먼저 확인<\/b>하도록 안내돼 있습니다. 서명은 마지막에 하세요.<\/li>\n<\/ul>\n<h3>기록부를 보증하는 사람은 따로 있습니다<\/h3>\n<p>기록부를 발행하는 <b>자동차성능·상태점검자<\/b>는 그 내용을 <b>보증할 책임<\/b>을 지고(제58조의4 제1항), 그 보증에 책임지는 <b>보험에 가입할 의무<\/b>가 있습니다(같은 조 제2항). 이를 어기면 <b>1년 이하의 징역 또는 1천만 원 이하의 벌금<\/b>입니다(제81조 제25호의6·제25호의7). <b>이 벌칙의 대상은 매매업자가 아니라 점검자<\/b>라는 점을 알아 두면, 분쟁이 생겼을 때 <b>매매업자와 점검자 양쪽<\/b>에 책임을 물을 수 있다는 것이 보입니다.<\/p>\n<div class=\"warn\"><b>⚠️ 개인 간 직거래에는 이 보호막이 없습니다<\/b><p style=\"margin:8px 0 0\">고지 의무 조문은 첫 줄이 <b>\"자동차매매업자(종사원을 포함한다)가 자동차를 매도 또는 매매의 알선을 하는 경우\"<\/b>로 시작합니다. 뒤에서 설명할 <b>90일 계약 해제권<\/b>도 <b>\"자동차매매업자의 매매 또는 매매 알선으로 매매 계약을 맺은 자동차 매수인\"<\/b>이라고 못 박혀 있습니다(제58조의6 제1항). 즉 <b>개인 직거래(당근·중고나라 등)에는 이 두 조항이 적용되지 않습니다.<\/b> 직거래에서 침수 사실을 속았다면 민법상 사기·하자담보책임으로 다퉈야 해서 입증 부담이 훨씬 큽니다. <b>싸다는 이유로 직거래를 택하는 것이 침수 시즌에는 특히 위험한 이유<\/b>입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"eye\">6. 눈과 코로 잡는 침수 흔적 12곳<\/h2>\n<p>기록에 안 남은 침수차를 잡는 마지막 방법입니다. <b>물은 아래에서 위로 차오르고, 사람 손이 닿기 어려운 구석에는 흔적이 남습니다.<\/b> 겉으로 보이는 시트와 매트는 얼마든지 새것으로 바꿀 수 있으니 <b>바꾸기 번거로운 곳<\/b>을 보세요.<\/p>\n<table>\n<tr><th>보는 곳<\/th><th>무엇을 확인하나<\/th><\/tr>\n<tr><td><b>① 안전벨트 끝까지 당기기<\/b><\/td><td>끝단에 얼룩·흙먼지 띠·곰팡이 자국이 있는지<\/td><\/tr>\n<tr><td><b>② 시트 레일 볼트<\/b><\/td><td>바닥 레일 볼트에 녹, 볼트 머리 흠집(탈거 흔적)<\/td><\/tr>\n<tr><td><b>③ 스페어타이어 수납 공간<\/b><\/td><td>트렁크 바닥을 들어 진흙·물때·부식 확인<\/td><\/tr>\n<tr><td><b>④ 실내 퓨즈박스<\/b><\/td><td>단자 부식, 흰 가루, 물 자국<\/td><\/tr>\n<tr><td><b>⑤ 엔진룸 볼트·배선 커넥터<\/b><\/td><td>커넥터 안쪽 녹, 배선 피복의 진흙<\/td><\/tr>\n<tr><td><b>⑥ 에어컨 첫 가동 시 냄새<\/b><\/td><td>퀴퀴한 곰팡이 냄새(방향제를 심하게 쓴 차 주의)<\/td><\/tr>\n<tr><td><b>⑦ 도어 하단 고무 몰딩 안쪽<\/b><\/td><td>몰딩을 젖혀 흙·모래 잔여물<\/td><\/tr>\n<tr><td><b>⑧ 실내등·룸미러 주변<\/b><\/td><td>천장 마감재 얼룩(전손급 완전 침수의 흔적)<\/td><\/tr>\n<tr><td><b>⑨ 계기판 유리 안쪽<\/b><\/td><td>습기 자국, 물이 마른 얼룩<\/td><\/tr>\n<tr><td><b>⑩ 시가잭·USB 포트 안쪽<\/b><\/td><td>손전등으로 비춰 부식 확인<\/td><\/tr>\n<tr><td><b>⑪ 트렁크 힌지·경첩<\/b><\/td><td>도색 안 된 금속부의 녹<\/td><\/tr>\n<tr><td><b>⑫ 배선 냄새<\/b><\/td><td>차 문을 닫고 5분 있어 보면 냄새가 올라옵니다<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 가장 확실한 한 가지<\/b><p style=\"margin:8px 0 0\">위 12개를 다 봐도 확신이 안 서면 <b>구매 전 정비소 점검(PPI)<\/b>을 받으세요. 몇만 원을 아끼려다 수백만 원짜리 전장 수리를 떠안는 것보다 낫습니다. 판매자가 <b>\"제3의 정비소에서 점검받아도 되겠느냐\"<\/b>는 요청을 거절한다면 그 차는 거르는 편이 맞습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"law90\">7. 🔴 핵심 — 침수 미고지는 30일이 아니라 90일입니다<\/h2>\n<p>여기가 이 글에서 가장 중요한 부분입니다. 중고차 분쟁을 다룬 글 대부분이 <b>\"인도일부터 30일\"<\/b>이라고만 적습니다. 맞는 말이지만 <b>절반만 맞습니다.<\/b> 조문을 그대로 열어 보면 기간이 <b>두 갈래<\/b>로 갈려 있습니다.<\/p>\n<div class=\"tip\"><b>📜 「자동차관리법」 제58조의6 제1항 (조문 원문)<\/b><p style=\"margin:8px 0 0\">자동차매매업자의 매매 또는 매매 알선으로 매매 계약을 맺은 자동차 매수인은 해당 자동차가 <b>제1호 또는 제2호에 해당하는 경우에는 자동차인도일부터 30일 이내에<\/b>, <b>제3호에 해당하는 경우에는 자동차인도일부터 90일 이내에<\/b> 해당 매매 계약을 해제할 수 있다.<br>1. 해당 자동차의 <b>주행거리, 사고 사실<\/b>이 제58조제1항제1호의 고지 내용과 다른 경우<br>2. 제58조제1항제1호에 따른 사항<b>(침수 사실은 제외한다)<\/b> 또는 같은 항 제2호에 따른 사항을 거짓으로 고지하거나 고지하지 아니한 경우<br>3. 해당 자동차의 <b>침수 사실<\/b>이 제58조제1항제1호의 고지 내용과 다른 경우 또는 (…) 침수 사실을 거짓으로 고지하거나 고지하지 아니한 경우<\/p><\/div>\n<p>제2호에 <b>\"(침수 사실은 제외한다)\"<\/b>라는 괄호가 일부러 박혀 있습니다. 침수를 30일 트랙에서 빼내 <b>제3호로 따로 세운 것<\/b>입니다.<\/p>\n<table>\n<tr><th>해제 사유<\/th><th>기간(자동차 인도일 기준)<\/th><\/tr>\n<tr><td>주행거리·사고 사실이 고지 내용과 다른 경우 (제1호)<\/td><td>30일 이내<\/td><\/tr>\n<tr><td>성능·상태 점검 내용(침수 제외)을 거짓 고지·미고지 (제2호)<\/td><td>30일 이내<\/td><\/tr>\n<tr><td>압류·저당권 등록 여부를 거짓 고지·미고지 (제2호)<\/td><td>30일 이내<\/td><\/tr>\n<tr><td><b>침수 사실이 고지 내용과 다르거나 거짓·미고지 (제3호)<\/b><\/td><td><b>90일 이내<\/b><\/td><\/tr>\n<\/table>\n<p><b>침수만 90일입니다.<\/b> 다른 항목의 세 배입니다. 이유는 짐작이 갑니다 — 침수 피해는 인수 직후에는 멀쩡하다가 <b>부식이 진행되면서 뒤늦게 증상이 나타나는<\/b> 특성이 있기 때문입니다. 입법이 그 시차를 감안한 것입니다.<\/p>\n<h3>해제하면 차와 돈은 '동시에' 오갑니다<\/h3>\n<p>같은 조 제2항·제3항이 절차까지 정해 놓았습니다. <b>매수인은 해제한 경우 자동차를 즉시 반환<\/b>하고, <b>매매업자는 그 반환과 동시에 이미 지급받은 매매금액을 반환<\/b>해야 합니다. 즉 <b>\"차를 먼저 넘기면 돈은 나중에\"는 법이 정한 순서가 아닙니다.<\/b> 동시이행이라고 못 박혀 있으니 그대로 요구하세요.<\/p>\n<h3>미고지·허위고지는 형사처벌 대상입니다<\/h3>\n<p>여기서 한 걸음 더 들어갑니다. 침수 사실을 고지하지 않거나 거짓으로 고지한 행위는 <b>계약 해제로 끝나는 민사 문제가 아닙니다.<\/b><\/p>\n<div class=\"warn\"><b>📜 「자동차관리법」 제80조 제6호·제7호<\/b><p style=\"margin:8px 0 0\">제58조제1항을 위반하여 자동차의 <b>침수 사실<\/b> 및 구조·장치 등의 성능·상태를 점검한 내용 또는 압류·저당권의 등록 여부를 <b>고지하지 아니한 자<\/b>(제6호), 또는 <b>거짓으로 고지한 자<\/b>(제7호)는 <b>2년 이하의 징역 또는 2천만 원 이하의 벌금<\/b>에 처한다.<\/p><\/div>\n<p>덧붙여 2024년 개정으로 <b>침수 사실을 미고지·허위고지해 징역 이상의 실형이나 집행유예를 받은 사람은 일정 기간 매매업 종사원이 될 수 없게<\/b> 됐습니다(제59조 제4항). 그만큼 무겁게 다루는 사안이라는 뜻입니다. 협상 자리에서 이 조문을 알고 있는 것과 모르는 것은 결과가 다릅니다.<\/p>\n<div class=\"warn\"><b>🔴 이것 때문에 권리를 포기하는 사람이 생깁니다<\/b><p style=\"margin:8px 0 0\">차를 받고 <b>45일쯤 지나<\/b> 전장 고장이 반복돼 정비소에 갔더니 \"침수 흔적이 있다\"는 말을 들었다고 합시다. \"30일 지났으니 이제 못 무른다\"고 검색해서 나온 글을 읽고 포기하는 경우가 실제로 있습니다. <b>침수라면 90일까지 계약 해제를 주장할 수 있습니다.<\/b> 날짜부터 다시 세어 보세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"calc\">8. 계산예시 — 내 권리 만료일 달력으로 역산하기<\/h2>\n<p>기준은 <b>계약일이 아니라 자동차 인도일<\/b>입니다. 차를 실제로 넘겨받은 날부터 셉니다. 예를 들어 <b>2026년 8월 10일에 차를 인도받았다면<\/b> 이렇게 됩니다.<\/p>\n<table>\n<tr><th>권리<\/th><th>기산일<\/th><th>만료일<\/th><\/tr>\n<tr><td>주행거리·사고이력·성능상태·압류저당 <b>해제권<\/b><\/td><td>2026-08-10<\/td><td><b>2026-09-09<\/b> (30일)<\/td><\/tr>\n<tr><td><b>침수 미고지 해제권<\/b><\/td><td>2026-08-10<\/td><td><b>2026-11-08<\/b> (90일)<\/td><\/tr>\n<tr><td>성능·상태점검 보증(하자 수리)<\/td><td>2026-08-10<\/td><td><b>2026-09-09 또는 주행 2,000km<\/b> — 계약서에 적힌 보증조건 확인<\/td><\/tr>\n<\/table>\n<p>표를 이렇게 놓고 보면 세 개가 <b>서로 다른 시계로 돈다<\/b>는 것이 한눈에 들어옵니다. 특히 마지막 줄은 <b>날짜와 주행거리<\/b> 두 축으로 돌아갑니다. 출퇴근 거리가 길어 하루 60km를 탄다면 <b>2,000km는 약 33일<\/b>이고, 하루 100km를 탄다면 <b>20일 만에<\/b> 2,000km에 닿습니다. 법정 최소는 <b>30일 이상 또는 2천km 이상<\/b>이고(시행규칙 제123조의8 제2항), <b>둘 중 먼저 도달한 쪽에서 종료<\/b>하는 운용은 「소비자분쟁해결기준」과 개별 약정에 따릅니다. <b>내 계약서에 적힌 보증조건을 직접 읽어 확인하세요.<\/b><\/p>\n<div class=\"tip\"><b>💡 인도받은 날 바로 할 일<\/b><p style=\"margin:8px 0 0\">차를 받은 날 <b>계기판 주행거리를 사진으로 찍고<\/b>, 달력에 <b>+30일 · +90일<\/b> 두 개를 표시해 두세요. 나중에 \"언제 받았더라\"를 다투는 일이 사라집니다. 인수인계 서류의 <b>인도일자<\/b>도 반드시 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"track\">9. 30일·2,000km 트랙과 90일 트랙은 다릅니다<\/h2>\n<p>많이 헷갈리는 대목이라 따로 떼어 설명합니다. 중고차 구매자를 지키는 장치는 <b>두 개의 서로 다른 트랙<\/b>으로 돼 있습니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>A. 성능·상태점검 보증<\/th><th>B. 계약 해제권<\/th><\/tr>\n<tr><td><b>근거<\/b><\/td><td>법 제58조의4 · 시행규칙 제123조의8② · 「소비자분쟁해결기준」<\/td><td>법 제58조의6 제1항<\/td><\/tr>\n<tr><td><b>누가 책임지나<\/b><\/td><td><b>자동차성능·상태점검자<\/b>(책임보험 가입 의무)<\/td><td><b>자동차매매업자<\/b>(대금 반환)<\/td><\/tr>\n<tr><td><b>내용<\/b><\/td><td>기록부와 실제 성능이 달라 생긴 <b>고장을 수리·보상<\/b><\/td><td><b>계약 자체를 없던 일로<\/b> 되돌림<\/td><\/tr>\n<tr><td><b>기간<\/b><\/td><td>인도일 <b>30일 이상 또는 2천km 이상<\/b>(법정 최소)<\/td><td>일반 30일 / <b>침수 90일<\/b><\/td><\/tr>\n<tr><td><b>결과<\/b><\/td><td>차는 내가 계속 탐 + 수리비 보전<\/td><td>차를 돌려주고 <b>대금을 동시에 돌려받음<\/b><\/td><\/tr>\n<\/table>\n<p>핵심은 이것입니다. <b>A가 끝났다고 B까지 끝난 것이 아닙니다.<\/b> 하루 100km를 타서 20일 만에 2,000km를 넘겼다면 A는 종료되지만, 침수 미고지라면 <b>B는 90일까지 살아 있습니다.<\/b> 매매업자가 \"보증기간 지났습니다\"라고 하는 말은 대개 A를 가리킵니다. <b>책임지는 사람도 다릅니다<\/b> — A는 점검자, B는 매매업자입니다. 그래서 침수 분쟁에서는 <b>양쪽 모두를 상대로<\/b> 다툴 여지가 있습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"choose\">10. 계약 해제와 손해배상, 어느 쪽이 유리한가<\/h2>\n<p>침수 사실이 드러났을 때 선택지는 둘입니다. <b>무를 것인가, 아니면 차는 갖고 돈을 받을 것인가.<\/b> 정답은 상황에 따라 다릅니다.<\/p>\n<table>\n<tr><th>상황<\/th><th>권하는 선택<\/th><th>이유<\/th><\/tr>\n<tr><td>전장 고장이 <b>이미 반복<\/b>되고 있다<\/td><td><b>계약 해제<\/b><\/td><td>침수 전장 고장은 한 곳을 고치면 다른 곳이 터지는 식으로 이어집니다. 수리비를 받아도 밑 빠진 독이 되기 쉽습니다.<\/td><\/tr>\n<tr><td>90일이 <b>얼마 안 남았다<\/b><\/td><td><b>계약 해제<\/b><\/td><td>기간이 지나면 해제 카드가 사라집니다. 우선 해제 의사를 <b>내용증명으로 통지<\/b>해 시점을 확보하세요.<\/td><\/tr>\n<tr><td>침수 정도가 <b>가볍고<\/b> 차가 마음에 든다<\/td><td>손해배상(수리비·감가)<\/td><td>침수 이력이 있다는 사실만으로 시세가 떨어지므로 <b>수리비 + 시세 하락분<\/b>을 함께 청구할 수 있습니다.<\/td><\/tr>\n<tr><td>이미 <b>90일이 지났다<\/b><\/td><td>손해배상<\/td><td>해제권은 없어져도 <b>사기·기망에 따른 손해배상 청구는 별개<\/b>입니다. 포기하기 전에 상담부터 받으세요.<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 해제를 택했다면 순서가 중요합니다<\/b><p style=\"margin:8px 0 0\">차를 먼저 넘겨주고 돈을 나중에 받기로 하면 협상력이 사라집니다. <b>해제 의사 통지 → 반환 조건 합의(대금·이전등록비·취득세 등) → 동시 이행<\/b> 순서로 가세요. 합의가 안 되면 아래 11번 절차로 넘어갑니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"process\">11. 실제 진행 절차 4단계 (한국소비자원 1372)<\/h2>\n<ol>\n<li><b>증거 확보<\/b> — 정비소 점검 소견서(침수 흔적 명기), 성능·상태점검기록부 원본, 계약서·인수증(인도일 확인), 계약 전 조회 화면 캡처, 판매자와 주고받은 문자·통화 녹음.<\/li>\n<li><b>서면 통지<\/b> — 매매업자에게 <b>내용증명 우편<\/b>으로 침수 사실과 해제(또는 배상) 요구를 보냅니다. 구두 항의는 기록이 남지 않습니다. 내용증명은 <b>기간 내에 권리를 행사했다는 증거<\/b>가 됩니다.<\/li>\n<li><b>소비자상담·피해구제<\/b> — 합의가 안 되면 <b>1372 소비자상담센터<\/b>(국번 없이 ☎1372) 또는 소비자24(consumer.go.kr)로 피해구제를 신청합니다. 한국소비자원 분쟁조정 사례가 축적된 영역이라 조정으로 해결되는 경우가 많습니다.<\/li>\n<li><b>민사 소송<\/b> — 조정이 결렬되면 최후 수단입니다. 금액이 3,000만 원 이하면 <b>소액사건심판<\/b>으로 비교적 간단히 진행할 수 있습니다.<\/li>\n<\/ol>\n<div class=\"warn\"><b>⚠️ 2번을 미루면 1·3번이 소용없어집니다<\/b><p style=\"margin:8px 0 0\">가장 흔한 실패가 <b>\"매매상이 알아봐 준다고 해서 기다렸다\"<\/b>입니다. 그러는 사이 90일이 지나갑니다. <b>상대가 협조적으로 보여도 내용증명은 별도로 보내 두세요.<\/b> 보내 놓고 원만히 합의되면 그만이지만, 안 보내 놓고 기간이 지나면 되돌릴 수 없습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"trap3\">12. 🔴 함정 ② 전손 침수차는 폐차가 의무인데 왜 시장에 있나<\/h2>\n<p>앞에서 침수 사고의 <b>74.9%가 전손<\/b>이라고 했습니다. 그런데 <b>침수로 전손 처리된 차는 법적으로 폐차해야 합니다.<\/b><\/p>\n<div class=\"tip\"><b>📜 「자동차관리법」 제26조의2 + 시행규칙 제25조의2<\/b><p style=\"margin:8px 0 0\">① 침수로 인한 전손 처리 자동차의 소유자는 <b>해당 자동차가 침수로 인하여 전손(全損) 처리 결정된 사실을 안 날부터 30일<\/b> 내에 자동차해체재활용업자에게 <b>폐차를 요청<\/b>해야 합니다(법 제26조의2 제1항 + 시행규칙 제25조의2 제1항).<br>② 또한 <b>누구든지 침수 전손 자동차나 그 안전운행 관련 장치(내압용기·에어백 모듈·전기전자장치 등)를 수출하거나 수출하는 자에게 팔 수 없습니다<\/b>(법 제26조의2 제2항, 2022년 신설).<br>→ 두 가지 모두 위반 시 <b>1천만 원 이하의 과태료<\/b>입니다(제84조 제2항 제2호의2·제5호).<\/p><\/div>\n<p>그러면 왜 침수차가 시장에 도는 걸까요. 세 갈래입니다.<\/p>\n<ul>\n<li><b>폐차 의무를 어긴 경우<\/b> — 과태료를 감수하고 수리해 파는 사례. 다만 전손 이력은 <b>보험 처리를 거쳤으므로 카히스토리에 남아 조회로 잡힙니다.<\/b><\/li>\n<li><b>분손(25.1%)으로 처리된 차<\/b> — 수리해서 타는 것이 정상 처리이므로 폐차 대상이 아닙니다. 이 차를 되팔 때 <b>고지하지 않으면<\/b> 그것이 바로 90일 해제 사유입니다.<\/li>\n<li><b>보험 처리를 아예 안 한 차<\/b> — 전손·분손 판정 자체가 없으니 폐차 의무도 없고 <b>기록도 없습니다.<\/b><\/li>\n<\/ul>\n<p>세 번째가 <b>가장 위험합니다.<\/b> 2번 항목에서 말한 \"카히스토리로도 안 잡히는 차\"가 바로 이것입니다. 정리하면 이렇습니다 — <b>기록에 남은 침수차는 조회로 걸러지고, 진짜 조심해야 할 것은 기록을 만들지 않은 침수차입니다.<\/b> 그래서 조회(2~4번)와 눈·코 점검(5~6번)을 <b>둘 다<\/b> 해야 하고, 그러고도 놓쳤을 때를 위해 <b>90일 해제권(7번)<\/b>을 알아 둬야 합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"faq\">13. 자주 묻는 질문<\/h2>\n<h3>Q. 조회에 돈이 드나요?<\/h3>\n<p>카히스토리의 <b>무료침수사고조회<\/b>와 자동차365의 <b>침수정보 조회<\/b>는 무료입니다. 다만 자동차365의 <b>통합이력조회<\/b>는 「자동차관리법」 제76조에 따라 수수료가 있을 수 있습니다. 침수만 볼 거라면 무료 메뉴로 충분합니다.<\/p>\n<h3>Q. 차량번호만 알면 남의 차도 조회되나요?<\/h3>\n<p>침수 조회는 차량번호(또는 차대번호)로 조회합니다. 매물 검토 목적이라면 판매자에게 차량번호를 요청하세요. <b>차량번호를 알려주지 않는 매물은 검토 대상에서 빼는 편<\/b>이 안전합니다.<\/p>\n<h3>Q. 카히스토리에 '침수 없음'이면 안심해도 되나요?<\/h3>\n<p><b>아닙니다.<\/b> 보험 처리된 침수만 나옵니다. 사이트 자체가 \"참고 정보\"라고 안내하고 있습니다. 자동차365를 함께 돌리고 실차 점검까지 하세요.<\/p>\n<h3>Q. 개인 직거래로 샀는데 침수차였습니다. 90일 해제가 되나요?<\/h3>\n<p>제58조의6 제1항은 <b>\"자동차매매업자의 매매 또는 매매 알선으로 매매 계약을 맺은 자동차 매수인\"<\/b>이라고 정하고 있어 <b>개인 직거래에는 적용되지 않습니다.<\/b> 민법상 사기·하자담보책임으로 다퉈야 해서 입증 부담이 큽니다. <b>1372 소비자상담센터나 대한법률구조공단(☎132)에 먼저 상담<\/b>하세요.<\/p>\n<h3>Q. 성능·상태점검 보증기간(30일·2,000km)이 지났으면 끝인가요?<\/h3>\n<p><b>아닙니다.<\/b> 그건 점검자의 보증 트랙이고, <b>침수 미고지 계약 해제권은 인도일부터 90일<\/b>입니다. 두 기간은 별개로 흘러가고 <b>책임지는 상대(점검자 / 매매업자)도 다릅니다.<\/b><\/p>\n<h3>Q. 성능·상태점검기록부를 계약서 쓴 다음에 줬습니다. 문제 없나요?<\/h3>\n<p>「자동차관리법」 제58조 제1항은 <b>\"매매 계약을 체결하기 전에 서면으로 고지\"<\/b>하라고 정하고 있습니다. 계약 후 교부는 그 문언에 맞지 않습니다. 또 점검 내용은 <b>점검일부터 120일 이내의 것<\/b>이어야 하니 기록부의 <b>점검일자<\/b>도 함께 확인하세요.<\/p>\n<h3>Q. 침수차인 걸 알고도 싸게 샀습니다. 나중에 문제 삼을 수 있나요?<\/h3>\n<p>해제권은 <b>고지 내용과 다른 경우<\/b>에 생깁니다. 침수 사실을 고지받고 그 값에 합의해 샀다면 해제 사유가 되지 않습니다. 다만 <b>고지받은 침수 정도와 실제가 크게 다르다면<\/b> 다툴 여지가 있습니다.<\/p>\n<h3>Q. 렌터카·리스로 쓰던 차도 침수 조회가 되나요?<\/h3>\n<p>차량번호 기준으로 조회하므로 소유 형태와 무관하게 조회됩니다. 다만 <b>번호판이 바뀐 이력<\/b>이 있으면 차대번호로 조회하는 편이 정확합니다. 성능·상태점검기록부의 차대번호와 실제 차량의 차대번호(운전석 앞유리 하단·도어 스티커)가 <b>일치하는지<\/b>도 확인하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"gov\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.carhistory.or.kr/search/carhistory/freeSearch.car\" target=\"_blank\" rel=\"nofollow\">▸ 보험개발원 카히스토리 — 무료침수사고조회<\/a><a href=\"https://www.car365.go.kr/\" target=\"_blank\" rel=\"nofollow\">▸ 자동차365(국토교통부·한국교통안전공단) — 중고차매매 &gt; 침수정보 조회<\/a><a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&amp;csmSeq=1000&amp;ccfNo=4&amp;cciNo=1&amp;cnpClsNo=1\" target=\"_blank\" rel=\"nofollow\">▸ 법제처 찾기쉬운 생활법령정보 — 중고차 매매 분쟁 해결하기(30일·90일 해제)<\/a><a href=\"https://www.law.go.kr/법령/자동차관리법\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 「자동차관리법」(제58조·제58조의4·제58조의6·제26조의2·제80조·제84조)<\/a><a href=\"https://www.law.go.kr/법령/자동차관리법시행규칙\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 「자동차관리법 시행규칙」(제25조의2·제120조·제123조의8)<\/a><a href=\"https://www.consumer.go.kr/\" target=\"_blank\" rel=\"nofollow\">▸ 소비자24 — 피해구제 신청(1372 소비자상담센터)<\/a><a href=\"https://www.ftc.go.kr/\" target=\"_blank\" rel=\"nofollow\">▸ 공정거래위원회 — 소비자분쟁해결기준(중고자동차매매업)<\/a><\/div>\n\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">정리하면 <b>①침수 조회는 카히스토리와 자동차365 두 곳을 모두 돌리고 ②카히스토리는 보험 처리된 침수만 나오므로 '이력 없음'을 보증으로 읽지 말고 ③성능·상태점검기록부의 침수 칸과 점검일자를 서명 전에 확인하고 ④그래도 놓쳤다면 침수 미고지는 인도일부터 90일까지 계약 해제를 주장할 수 있습니다.<\/b> 30일이라는 숫자만 알고 포기하는 일이 없도록, 차를 인도받은 날 <b>계기판 주행거리를 사진으로 찍고 달력에 +30일과 +90일을 표시<\/b>해 두세요. 오늘 할 일은 하나입니다 — 보고 있는 매물의 <b>차량번호를 받아 지금 두 사이트에 넣어 보는 것<\/b>입니다. 5분이면 끝나고, 그 5분이 수백만 원을 가릅니다.<\/p><\/div>\n\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월<\/b> 기준입니다. 본문에 인용한 법 조문은 전부 <b style=\"display:inline;color:#33503a;margin:0\">국가법령정보센터에서 「자동차관리법」(시행 2026. 6. 16., 법률 제21817호)과 같은 법 시행규칙(시행 2026. 6. 3.)의 조문 본문을 직접 열어<\/b> 확인했습니다 — <b style=\"display:inline;color:#33503a;margin:0\">제58조 제1항(계약 체결 전 서면 고지·침수 사실 포함·점검일부터 120일 이내), 제58조의4(성능·상태점검자의 보증 책임과 보험 가입 의무), 제58조의6 제1항~제3항(30일·침수 90일 해제권과 동시이행), 제80조 제6호·제7호(침수 미고지·거짓고지 = 2년 이하 징역 또는 2천만 원 이하 벌금), 제81조 제25호의6·제25호의7(점검자 보증 불이행·보험 미가입 = 1년 이하 징역 또는 1천만 원 이하 벌금), 제26조의2(폐차 요청 의무·수출 및 수출자 판매 금지), 제84조 제2항(위 폐차·수출 위반 = 1천만 원 이하 과태료), 제59조 제4항(침수 미고지 실형·집행유예자의 종사원 제한)<\/b>, 그리고 시행규칙 <b style=\"display:inline;color:#33503a;margin:0\">제25조의2 제1항(\"전손 처리 결정된 사실을 안 날부터 30일\"), 제120조 제2항(기록부 발급은 발급일 기준 120일 이내 점검분), 제123조의8 제2항(보증은 인도일부터 30일 이상 또는 2천km 이상)<\/b>입니다. 보증기간을 '먼저 도달한 쪽에서 종료'로 운용하는 부분은 <b style=\"display:inline;color:#33503a;margin:0\">공정거래위원회 「소비자분쟁해결기준」<\/b>과 개별 약정에 따르므로 계약서 확인이 필요합니다. 무료 조회 서비스의 운영기관·입력값·<b style=\"display:inline;color:#33503a;margin:0\">조회 범위의 한계(보험 처리분에 한함)<\/b>는 <b style=\"display:inline;color:#33503a;margin:0\">보험개발원 카히스토리 「무료침수사고조회」 페이지 원문<\/b>을, 침수정보 조회와 통합이력조회의 구분·수수료 근거는 <b style=\"display:inline;color:#33503a;margin:0\">자동차365(국토교통부·한국교통안전공단) 페이지 원문<\/b>을 직접 열어 확인했습니다. 침수 사고 통계(2021~2025년 35,011건, 7~10월 95.7%, 전손 74.9%)는 <b style=\"display:inline;color:#33503a;margin:0\">손해보험협회가 12개 손해보험사 자동차보험 처리 내역을 집계한 수치<\/b>이며 <b style=\"display:inline;color:#33503a;margin:0\">보험으로 처리된 건에 한합니다<\/b>(실제 침수 차량 수는 이보다 많을 수 있습니다). <b style=\"display:inline;color:#33503a;margin:0\">2026년 올해 침수 차량 수는 공식 집계가 확인되지 않아 본문에 싣지 않았습니다.<\/b><br>출처: <a href=\"https://www.law.go.kr/법령/자동차관리법\">국가법령정보센터 — 자동차관리법<\/a>, <a href=\"https://www.law.go.kr/법령/자동차관리법시행규칙\">국가법령정보센터 — 자동차관리법 시행규칙<\/a>, <a href=\"https://www.carhistory.or.kr/search/carhistory/freeSearch.car\">보험개발원 카히스토리 — 무료침수사고조회<\/a>, <a href=\"https://www.car365.go.kr/\">자동차365 — 침수정보 조회<\/a>, <a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&amp;csmSeq=1000&amp;ccfNo=4&amp;cciNo=1&amp;cnpClsNo=1\">법제처 찾기쉬운 생활법령정보 — 중고차 매매 분쟁 해결하기<\/a>, <a href=\"https://www.ftc.go.kr/\">공정거래위원회 — 소비자분쟁해결기준<\/a>, <a href=\"https://www.consumer.go.kr/\">소비자24 — 피해구제<\/a>.<\/div>\n\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01310748819.html\">▸ 자동차 침수 대처 방법 자차보험 처리 침수 전손 폐차 환급 총정리 (2026 장마) — 내 차가 잠겼다면<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/2026_01601858813.html\">▸ 자동차보험 갱신 비교 방법 다이렉트 할인특약 총정리 (2026 인상)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_29.html\">▸ 자동차 정기검사 예약 방법 비용 과태료 주기 총정리 (사이버검사소)<\/a><\/div>\n\n<div id=\"ymyl-disclaimer\" style=\"margin-top:22px;font-size:13px;color:#666;line-height:1.6\">본 글은 정보 제공용이며 법률 자문이 아닙니다. 인용한 조문은 <b>2026년 8월 1일 기준 현행 법령<\/b>이며 개정될 수 있습니다. 계약 해제 가능 여부와 기간은 <b>거래 형태(매매업자 거래인지 개인 직거래인지)·고지 내용·인도일·증거 상태<\/b>에 따라 개별적으로 판단되며, 본문의 계산예시 날짜는 이해를 돕기 위한 가정입니다. 침수 조회 결과가 '이력 없음'이라도 침수차가 아님을 보증하지 않습니다(보험 처리분에 한해 조회됩니다). 실제 분쟁이 생겼다면 <b>1372 소비자상담센터(☎1372)<\/b> 또는 대한법률구조공단(☎132)에 본인 사안으로 상담하시고, 법령은 개정될 수 있으므로 신청·청구 전 <a href=\"https://www.law.go.kr/\">국가법령정보센터<\/a>에서 현행 조문을 확인하세요.<\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 법 조문·기간·벌칙 금액은 <b>국가법령정보센터에서 「자동차관리법」과 시행규칙의 조문 본문을 한 줄씩 직접 열어<\/b> 확인한 것이고, 조회 서비스의 범위와 한계는 <b>카히스토리·자동차365 페이지 원문<\/b>에서 가져왔습니다. 초안을 쓸 때 언론 기사 요약을 근거로 <b>폐차 불이행 과태료를 '300만 원 이하'로 적었다가, 조문 대조에서 현행 '1천만 원 이하'임을 확인해 바로잡았습니다.<\/b> 1차 출처로 확인하지 못한 수치(2026년 올해 침수 대수)는 <b>일부러 싣지 않고 그 사실을 본문에 밝혔습니다.<\/b> 법령은 개정될 수 있으니 실제 조회·청구 전 공식 페이지를 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ 쓰레드용 후킹 요약 (3줄)\n※ 🔴 네이버용 원고로 쓰지 말 것 (2026-07-30 확립 규칙). 네이버 OSMU 원고는 이 요약이 아니라\n   위 본문 HTML의 비교표·계산예시·체크리스트 12곳·공식 출처 URL을 실질적으로 다 옮겨야 한다\n   (그 글만 보고 바로 따라 할 수 있어야 함). 마크다운 파이프 테이블은 네이버에서 렌더링되지 않으므로\n   `⭐ 항목 : 값` 불릿이나 `⭐ 열이름 — A: 값1 / B: 값2` 한 줄 비교로 변환할 것.\n1. 여름 폭우 뒤 8~9월은 침수차가 중고차 시장에 흘러드는 시기입니다. 손해보험협회 집계로 2021~2025년 자동차보험 침수 처리는 **35,011건**, 그중 **95.7%가 7~10월**에 몰려 있고 **74.9%가 전손**이었습니다. 매물 차량번호를 받아 **카히스토리 무료침수사고조회**와 **자동차365 침수정보 조회**를 둘 다 돌리는 데 5분이면 됩니다.\n2. 그런데 **카히스토리로도 안 잡히는 침수차가 있습니다.** 보험개발원이 직접 안내하듯 이 조회는 **보험으로 처리된 침수만** 나옵니다. 할증이 싫어서, 자차 미가입이라서, 기록을 남기지 않으려고 자비로 수리한 차는 **'이력 없음'으로 깨끗하게 조회됩니다.** 조회는 거르는 도구지 보증서가 아닙니다.\n3. 이미 샀다면 **기간을 다시 세어 보세요. 침수 미고지 계약 해제는 30일이 아니라 90일입니다**(「자동차관리법」 제58조의6 제1항 제3호 — 제2호에 \"침수 사실은 제외한다\"가 박혀 있어 침수만 따로 갈립니다). 성능·상태점검 보증(인도일 30일 이상 또는 2천km 이상)이 끝났어도 **해제권은 별개로 살아 있습니다.** 게다가 침수 미고지·거짓고지는 민사로 끝나지 않습니다 — **2년 이하의 징역 또는 2천만 원 이하의 벌금**(제80조 제6호·제7호)입니다. 인도받은 날 계기판을 찍고 달력에 +30일·+90일을 표시해 두세요.\n"}]},"pace":{"date":"2026-08-01","count":0,"posts":[],"soft":1,"hard":5,"state":"ok","backlog":3,"backlog_codes":["F4-10","F4-11","D2-09"],"backlog_max":5,"backlog_over":false,"lanes":{"info":{"label":"일일·정보성","n":1,"codes":["D2-09"]},"etc":{"label":"기타","n":2,"codes":["F4-10","F4-11"]},"user":{"label":"사용자 추천","n":0,"codes":[]}},"error":"","checked_at":"2026-08-01T06:00:19"},"db":{"version":1,"updated":"2026-07-31","root":"lifeinfo","blog":"https://lifeinfo8975.blogspot.com/","taxonomy":[{"code":"A","name":"정부지원·복지","color":"#2BC4B0","subs":[{"code":"A1","name":"지원금·수당"},{"code":"A2","name":"생계·바우처 지원"},{"code":"A5","name":"근로·구직 지원"},{"code":"A3","name":"연금·노후"},{"code":"A4","name":"위기·재난 지원"}]},{"code":"B","name":"세금·금융","color":"#4D9DE0","subs":[{"code":"B1","name":"지방세"},{"code":"B4","name":"국세"},{"code":"B2","name":"금융·은행"},{"code":"B3","name":"연금자산"}]},{"code":"C","name":"건강·의료","color":"#E76F51","subs":[{"code":"C1","name":"건강보험 제도·환급"},{"code":"C2","name":"검진·접종"},{"code":"C3","name":"보험·요양"},{"code":"C4","name":"치과·수술 급여"}]},{"code":"D","name":"생활·행정","color":"#2EB67D","subs":[{"code":"D1","name":"증명·민원"},{"code":"D2","name":"자동차·교통"},{"code":"D3","name":"주거·공과금"},{"code":"D4","name":"소비자·환불"}]},{"code":"E","name":"디지털·통신","color
