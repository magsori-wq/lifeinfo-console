<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
/* 2026-08-13 콘솔 공통 팔레트로 통일(사용자 지시: 탭마다 화면형식이 제각각이라
   정리 요청) — index.html·categories.html·dashboard.html·search.html 이 이미 쓰던
   #0f1626 계열을 진실원으로 삼는다. 변수명은 그대로 둬서 아래 규칙은 안 건드림. */
:root{--bg:#0f1626;--card:#16203a;--card2:#0c1220;--line:#2a3a5e;--txt:#e8edf7;--mut:#9fb0d0;--ok:#06d6a0;--warn:#ffd166;--bad:#ff5c5c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
/* 2026-08-13 사용자 지시: "운영관리 탭과 화면구성이 달라 일목요연하지 않다,
   KPI대시보드 형식으로" — 좁은 470px 팝업카드였던 걸 adsense.html·gsc.html과
   같은 넓은 KPI 대시보드 톤으로 바꾼다. #board 에 innerHTML 을 꽂는 JS 로직은
   그대로이고(같은 클래스명), 여기 CSS만 넓혀서/키워서 통일한다. */
/* 2026-08-13 재수정 — "가운데로 화면이 몰려있잖아!": gsc·batch·seo 등 나머지
   운영관리 페이지는 폭 제한이 없다. 1080px 가운데정렬은 adsense.html 혼자만의
   패턴이었다. 폭 제한을 없애 화면을 꽉 채운다. */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px;width:100%}
.hd{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:19px;font-weight:700}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(6,214,160,.16);color:var(--ok)}
.b-warn{background:rgba(255,209,102,.16);color:var(--warn)}
.b-bad{background:rgba(255,92,92,.16);color:var(--bad)}
.sec{font-size:13px;color:#9db0c6;font-weight:800;letter-spacing:.02em;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
/* KPI 카드 그리드 — adsense.html 의 .kpi-grid 와 같은 형식으로 통일 */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 6px}
.m{background:var(--card2);border:1px solid var(--line);border-top:3px solid #3a4a63;border-radius:12px;padding:12px 14px}
.m .l{font-size:11.5px;color:var(--mut);font-weight:700}
.m .v{font-size:24px;font-weight:800;margin-top:3px;line-height:1.2}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #243049;font-size:12.5px}
li:last-child{border-bottom:none}
li.on{opacity:.62}
li.on .lbl{text-decoration:line-through}
li svg{width:15px;height:15px;flex:none}
li.on svg{color:var(--ok)}
li.now svg{color:#7fc1ff}
li.wait svg{color:#4a586e}
.num{font-size:11px;color:#6b7a99;width:16px;text-align:right;flex:none}
.who{font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px;flex:none}
.who.ai{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.who.me{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.lbl{font-size:12.5px}
.star{color:#ff8e8e;font-weight:800;margin-left:2px}
.banner{display:none;margin-top:9px;background:#0c3a2c;border:1px solid #1f6b52;color:#06d6a0;border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12.5px}
.banner.show{display:block}
.upd{font-size:11px;color:var(--mut);text-align:right;margin-top:12px}
.agent{background:var(--card2);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.agent .ah{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.agent .st{font-size:10px;font-weight:700;padding:1px 7px;border-radius:7px;margin-left:auto}
.st.active{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.st.uncommitted{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.st.idle{background:#222c3a;color:#6b7a99;border:1px solid #2e3a4a}
.agent .role{font-size:11px;color:var(--mut);margin:3px 0 1px}
.agent .own{font-size:10.5px;color:#5a6b80}
.agent .act{font-size:11px;color:#aeb9c7;margin-top:4px;padding-left:7px;border-left:2px solid #2a3a4d;line-height:1.5}
.agent .act .d{color:var(--mut);font-size:10px}
.advice{background:#13202d;border:1px solid #2a3a4d;border-radius:9px}
.advice .ai{display:flex;gap:8px;padding:7px 11px;font-size:12px;line-height:1.5;border-bottom:1px dashed #243049}
.advice .ai:last-child{border-bottom:none}
.advice .ic{flex:none}
.prow{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px dashed #243049;font-size:11.5px}
.prow:last-child{border-bottom:none}
.pcd{color:#7fc1ff;font-weight:700;flex:none;width:46px}
.ptt{flex:1;color:#cdd6e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{background:#3a2f12;color:#ffd166;border-radius:5px;padding:0 5px;font-size:9.5px;flex:none}
.pact{color:#06d6a0;font-size:10px;flex:none;font-weight:700}
.qcard{display:flex;gap:9px;padding:8px;margin:6px 0;background:#141c2c;border:1px solid #243049;border-radius:9px}
.qth{width:78px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:#0d1420}
.qth.none{display:flex;align-items:center;justify-content:center;color:#54627a;font-size:9px;text-align:center;line-height:1.2;border:1px dashed #2a3752}
.qbody{flex:1;min-width:0}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qcode{color:#7fc1ff;font-weight:700;font-size:11.5px}
.qlane{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700}
.qlane.info{background:#12283a;color:#7fc1ff}
.qlane.pop{background:#2f2136;color:#e0a3ff}
.qtitle{color:#e6edf5;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qfacts{color:#8a95a6;font-size:10px;margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qmeta{margin-top:4px}
.qdraft{color:#6b7688;font-size:9.5px;margin-left:8px}
.qpv{background:#17324a;color:#7fc1ff;border:1px solid #2a4d6e;border-radius:6px;font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer}
.qpv:hover{background:#1d4463}
.qpv.none{background:none;border:none;color:#54627a;font-weight:400;cursor:default;padding:3px 0}
#qpv-ov{display:none;position:fixed;inset:0;background:rgba(6,10,18,.82);z-index:999;align-items:center;justify-content:center;padding:18px}
#qpv-ov.show{display:flex}
.qpv-box{width:100%;max-width:760px;height:88vh;display:flex;flex-direction:column;background:#0f1626;border:1px solid #2a3752;border-radius:12px;overflow:hidden}
.qpv-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #243049;font-size:12.5px;font-weight:700;color:#7fc1ff}
.qpv-hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpv-x{background:#243049;color:#cdd6e0;border:none;border-radius:6px;font-size:11px;padding:5px 11px;cursor:pointer;flex:none}
.qpv-x:hover{background:#324158}
.qpv-fr,#qpv-fr{flex:1;width:100%;border:0;background:#fff}
.qpv-ft{padding:8px 14px;border-top:1px solid #243049;font-size:10px;color:#8a95a6;text-align:center}
.ch{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 4px;flex:none;margin-left:3px}
.ch.on{background:#0c3a2c;color:#06d6a0}
.ch.off{background:#3a1216;color:#f0707a}
  .qgo{font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px;margin-left:6px}
  .qgo.ok{background:#12331f;color:#3ddc97;border:1px solid #2c6b47}
  .qgo.wait{background:#3a2f14;color:#e0a11e;border:1px solid #6b5423}

k: 정의가 C:\\lifeinfo\\Scheduled\\ 에 폴더로 남는다(10개: adsense-approval-check·daily-blog-topic-ideas·daily-travel-food-blog·lifeinfo-evening/morning-briefing·monthly-factcheck·okpos-morning-check·tongdo 3개). 설정>Cowork 화면에 '아티팩트와 예약된 작업이 C:\\lifeinfo 에 저장됩니다'라고 명시돼 있다. ②Claude Code: 정의는 ~/.claude/scheduled-tasks\\ 에 있으나 **일정은 로컬 어디에도 없다**(7개 폴더 전부 SKILL.md 하나뿐) = 계정 서버 저장. ★오래된 수수께끼 해소: 'monthly-factcheck 가 로컬 scheduled-tasks 에도 CronList 에도 없는데 보고서는 나온다 = 실행주체 불명'이라고 적어뒀던 것 → Cowork 쪽에 있었다. 앞으로 루틴을 찾을 때 두 곳을 다 볼 것","[루틴] 📍루틴 화면 위치 확정 (2026-08-03) — '예약 작업'이라는 이름으로 찾으면 안 나온다. 탭마다 이름이 다르다: ①Claude Desktop 홈 탭 → 사이드바 「예정됨」(=Cowork 예약작업 7개, 정의는 C:\\lifeinfo\\Scheduled\\) ②Code 탭 → 사이드바 「루틴」(=Claude Code 루틴 6개: Lifeinfo publish·daily topics·Daily email briefing·daily publish·travel prep·index check, 정의는 ~/.claude/scheduled-tasks\\). 설정(⚙️) 안에는 예약 화면이 없고 Cowork 설정에 저장 경로만 표시된다. ⚠️Code 탭 목록에서 'Lifeinfo index check'만 빈 동그라미(○)이고 나머지 5개는 채워진 점(●) — 꺼져 있을 가능성, 확인 필요. lifeinfo-nightly-verify 는 목록에 없음이 육안 확인됨","[루틴] ✅야간 검증 루틴 등록 완료 (2026-08-03) — 'Lifeinfo nightly verify' · 매일 22:30 · 로컬 실행 · 폴더 C:\\lifeinfo. 🔴시각을 23:30이 아닌 22:30으로 잡은 이유: 기존 'Lifeinfo daily publish'가 23:55라 5분 차이로 겹친다(검증은 3~5편 대조라 10~30분 소요). 22:30이면 1시간 25분 여유. 등록 위치=Claude Desktop **Code 탭 > 루틴**(설정 메뉴에는 없다). 지침에 안전장치 4개 명시: 발행금지·라이브본문 수정금지·공식확인 1회 실패시 차단기록·프로세스 열거/종료 금지. ⚠️로컬 루틴이라 PC가 켜져 있고 온라인일 때만 실행됨","[루틴] 🔴정정 — 앞서 '야간 검증 루틴 22:30 등록 완료'라고 기록했으나 사실이 아니다. 화면 실측 결과 '매일 약 오후 11:50' 그대로였다(사용자가 바꿨다고 했으나 저장이 안 됨). 기존 Lifeinfo daily publish 가 23:55라 5분 차이로 겹친다. 22:30 으로 재수정 필요. 교훈=사용자 말이 아니라 화면 실측으로 확인할 것","[루틴] ✅야간 검증 루틴 최종 확정 (2026-08-03, 화면 실측) — 'Lifeinfo nightly verify' · 매일 오후 10:30 · 로컬 · 폴더 C:\\lifeinfo · 활성. 앞서 '22:30 등록완료'라 썼다가 실제로는 23:50이라 정정했고, 이번엔 화면에서 10:30 을 직접 확인했다. 지침 6줄 전수 확인. Lifeinfo daily publish(23:55)까지 1시간 25분 여유. 등록 위치는 Claude Desktop Code탭>루틴. 오늘 밤 첫 실행 예정 — 내일 아침 콘솔 미결과 카카오톡 도착 여부로 검증할 것","[OSMU] ✅네이버 4건 죽은링크 수정 완료·전수 실측(2026-08-03) — F4-04 펜션호텔·F1-06 스마트패스·G4-02 제철식재료·E2-06 OTT. 4편 모두 PostView.naver 직접 조회로 '옛 주소 없음·새 주소 있음' 확인. 🔑발견: 네이버는 claude-in-chrome 이 사이트를 차단하지만(쓰기 불가), **PostView.naver 를 python urllib 로 읽는 것은 된다** → 앞으로 OSMU 링크 정합을 Claude 가 직접 검증할 수 있다. 남은 것=쓰레드 5건","[OSMU] ✅죽은링크 전면 해소 (2026-08-03) — 쓰레드는 게시 후 '수정' 항목이 아예 없어 원글을 고칠 수 없었다. 대신 **Blogger 맞춤 리디렉션**(설정>오류 및 리디렉션)으로 옛URL→새URL 5개를 걸어 한 번에 해결했다. 실측: 5/5 작동(1번만 302, 나머지 301 — 1번은 '확정' 토글이 꺼진 채 저장됨). 🔑교훈=글 URL이 바뀌어 외부 링크가 죽으면, 외부 글을 하나하나 고치는 것보다 **리디렉션 한 번이 낫다**. 우리가 모르는 외부 링크·구글 404 통지까지 같이 해소된다. 네이버 4건도 이 방법이면 안 고쳐도 됐다. ⚠️Blogger UI 번역 주의: '올린이'=출처(From), '받는사람'=대상(To), '확정'=영구(301)","[애드센스] 🔴콘솔 애드센스 탭이 6일 낡아 사실과 반대를 말하고 있었다(2026-08-03 발견·수정) — 탭에 '사이트 GETTING_READY(심사 진행 중, 반려 아님) → 재신청 금지'라고 적혀 있었으나, 8/2에 이미 NEEDS_ATTENTION(조치 필요=반려)으로 뒤집혔다. 오늘 실측으로 확인하고 탭을 현재 사실로 갱신했다: 반려사유 「가치가 별로 없는 콘텐츠」 1건 · 오늘 이행한 축A/축B 9개 항목 · 현재 실측(바이라인 168/168·출처 168/168·첫화면수치 112/168·표 36편·색인 5/168) · 남은 약점(도입부 56편·미검증 5편) · 재검토 요청 4단계 경로. ⚠️'보강 없는 재신청 금지' 조건은 오늘 보강으로 해소됐으나 누르는 시점은 사용자 판단","[애드센스] ✅2026-08-03 AdSense 재검토 요청 접수 — 실측으로 NEEDS_ATTENTION → GETTING_READY 전환 확인(adsense.py status). 근거=오늘 축A/축B 9개 항목 전수 이행(금액 9편 +17,569자 · 도입부 53편 · 표 36편 126개 · 죽은링크 9건+404 · 야간루틴). 🚫이제 중복 요청 금지 — 다시 누르면 감점·쿨다운. ⚠️adsense_watch 는 READY 로 바뀔 때만 울리므로 침묵=진행중 아님. 상태 확인은 반드시 adsense.py status 1회 실행. 갱신한 곳=CLAUDE.md 발행재개 블록·콘솔 애드센스 탭·배치보드. 대기 중 할 일=도입부 56편 마저 + 미검증 5편 재시도 + OSMU 확산","[규칙] 🎛️발행 주세션 확정 (2026-08-03 사용자 확정) — Fold(Claude Code)가 발행 작업 전체를 주관하고 라이브 발행 클릭만 Desktop 앱이 한다. 근거=두 표면이 읽는 파일이 다르다: Fold 는 CLAUDE.md·코드게이트(pace/bodydup/heading/dupcheck)·Stop하네스·SessionStart훅을 받지만 **계정 스킬을 안 읽는다**. Desktop 은 계정 스킬을 읽지만 게이트·하네스가 없다. 그래서 준비·검증은 Fold, 발행 클릭은 Desktop, 발행 후 기록은 다시 Fold. ⚠️새 표준을 만들면 **CLAUDE.md/코드와 계정 스킬 양쪽에** 내려야 한다 — 한쪽만 고치면 다른 표면이 모른다. ⚠️Fold 에서 발행까지 하려면 pipeline.py 0b-3 게이트와 CLAUDE.md 를 함께 고쳐야 하며, --force-terminal-publish 우회는 규칙을 바꾸는 게 아니라 깨는 것","[규칙] ✅발행 창구 C안 확정 (2026-08-03) — 라이브 발행 = GitHub Actions publish.yml. 이유=게이트가 세션이 아니라 파일에 있어 새 세션이든 세션이 없든 8단계(live확인문구·원격선행·사전점검·중복(제목+본문)·페이스·publish-flow·결과확인·커밋푸시) -11을 배정했으나(DB 미사용 확인만 함), watch.json 의 a1-11-edufee-scope(초중고 교육비 지원, 사용자 판단 대기)가 A1-11 을 이미 가리키고 있어 충돌한다. 브리핑의 '주제'는 그대로 채택하고 '코드'만 A1-12 로 옮겼다(A1-11 은 교육비 글감용으로 비워 둠). 다음 세션은 A1-11 로 되돌리지 말 것.","🐛 bodydup 이 발행 직후 '중복 차단'을 잘못 띄운다 (2026-08-08 실측). F4-12 발행 중에 게이트를 돌렸더니 [차단] 이미 발행된 글과 본문이 거의 같다 가 떴는데, 몇 분 뒤 같은 명령이 🟢 0.051 을 줬다. 원인: bodydup 은 자기 코드를 비교 대상에서 빼는데 그 매핑을 DB(lifeinfo_db.txt)에서 찾는다. 라이브 발행은 됐는데 register_post 가 아직 안 돌면 DB 에 코드가 없어 **자기 자신과 비교**하게 되고 1.00 에 가까운 점수가 나온다(비교 편수도 192 vs 193 으로 갈렸다). 즉 '발행 직후 register_post 전' 이라는 창에서만 나오는 거짓 차단이다. ⚠️영향: fail-closed 게이트라 사람이 이 메시지를 보면 정당한 발행을 되돌릴 수 있다 — 실제로 나도 잠깐 F4-12 를 중복으로 오해했다. 처방 후보: ①bodydup 이 DB 대신 라이브 URL 로 자기 글을 식별 ②DB 에 코드가 없는데 제목이 라이브와 거의 같으면 '발행 직후일 수 있음' 으로 안내 문구를 바꾸기. 지금은 운영 규칙으로 대응: 발행 직후 게이트를 다시 돌리지 말고, 돌렸다면 register_post 후 재확인할 것.","🔑 gh CLI 설치 완료 (2026-08-08). winget install GitHub.cli → 2.97.0, C:\\Program Files\\GitHub CLI\\gh.exe. 인증은 아직 없음(gh auth status = not logged in) — 사용자가 프롬프트에 '! gh auth login' 1회 실행 필요. ⚠️문서 여러 곳에 'gh 가 없어 Actions 로그를 확인 못 함'(watch label-at-publish 등)이라 적혀 있는데 이제 틀린 서술이 된다 — 인증까지 끝나면 Actions 로그 확인·워크플로 트리거가 전부 터미널에서 된다. 계기: 사용자 지시로 발행대기 4편을 Fold 가 발행하려 했으나 ①pipeline.py:289 가 로컬 --publish 차단 ②웹 Actions 의 Run workflow 폼이 브라우저 자동화에서 3회 모두 'There was an error while loading' 로 실패 → 남은 경로가 gh 뿐이었다. 🔴'웹이 죽었다'고 단정하지 말 것 — 사람이 직접 누르면 될 수 있고, 내 자동화 쪽 문제일 가능성이 남아 있다(미확인).","[팩트체크] [야간검증] 오늘 발행 2편(F4-12 서울고궁관람료·orphan 국립공원탐방로예약제) 팩트체크 완료 — 둘 다 공식출처(royal.khs.go.kr, res.knps.or.kr) 대조 결과 오류 없음. F4-12: 관람료·통합관람권 6000원/6개월·후원 예약창구 전부 일치. 탐방로예약제: 노고단1870명·우이령1190명(주말공휴일)·흘림골5000명(시간지정제)·마감(전날14시)·노쇼페널티(1회1개월/2회이상3개월)·월4건제한 전부 res.knps.or.kr 환불정책 페이지와 일치.","[팩트체크] [야간검증] 기존글 3편 위험순위 검증(B4-05 퇴직금·C1-04 건보수가·D2-03 K패스) 중 D2-03에서 오류 발견. 🔴D2-03 K패스: 라이브가 평시 환급률(일반20%·청년30%·저소득53%)만 서술하는데, 2026.3.31 국무회의 통과 추경으로 2026.4.1~9.30 이용분에 한해 환급률이 한시 인상됨(일반20→30%·청년등30→45%·3자녀50→75%·저소득53→83%, 예산877억원). 오늘 8/8은 그 기간 안이라 라이브 수치가 독자의 실제 환급액보다 10~30%p 낮게 안내되는 중. 출처: 2026-03-31 국무회의 추경안 보도(다수 매체 교차확인, 예산액·기간·인상폭 일치). 라이브 수정은 사용자 승인 게이트 — 이 세션은 미수정. B4-05(근속연수공제·환산급여공제 표·14일지급·연20%지연이자, NTS 공식페이지 대조)·C1-04(진찰료 인상률 6/4/2%, 2026 수가혁신방안 발표 기사 대조)는 오류 0건. 오늘 발행 2편(F4-12·orphan 탐방로예약제)도 검증 완료(오류 0건, 별도 기록). D2-03은 다음 대면 세션에서 라이브에 한시 인상 안내 박스 추가 검토 필요 — watch 항목으로 남김.","[색인] [색인] crawl-watch 확인: D2-10·D4-07(8/06 색인요청한 신규 2편) 아직 lastCrawl 없음(2026-08-08 09:52 스냅샷 기준 미크롤). watch crawl-watch 항목이 묻던 질문에 대한 답 — 신규 글도 기존 글과 같은 속도로 크롤되는지는 아직 판단 불가, 계속 관찰 필요. 오늘 크롤 배치(25편)는 신규 크롤 0편·상태이동 12건(플래핑 계속, D4-04 등).","[발행] F4-14(국립공원 탐방로예약제)가 2026-08-08 17:46 라이브 발행됐는데 발행 후 DB 등록이 빠져 하루 동안 라이브 180편 vs DB 179편으로 어긋나 있었다. 잡아낸 것은 selfcheck 5) 피드 정합의 orphan 1건 — 탐지망은 제대로 돌았고, 빠진 것은 발행 세션의 후속 단계였다. 2026-08-09 발행 루틴이 register_post 로 등록(180편)하고 short·매니페스트·bake·validate(FAIL 0)까지 마감. 교훈: Actions 로 발행하면 라이브는 즉시 생기지만 DB 등록은 사람/세션 몫이라 세션이 끊기면 그대로 비는 구간이 된다 — 발행 직후 feedcheck 를 한 번 돌리면 그날 안에 잡힌다.","🐛 publish.yml 이 dupcheck 🔴 에 스텝째로 죽던 버그 수정 (2026-08-09). studio/dupcheck.py:119 는 강한중복일 때 종료코드 3 을 내는데, 그 파일 주석에 'WARN 전용이라 파이프라인 차단엔 안 씀'이라고 적혀 있다. 그런데 publish.yml 의 '중복 검사 (주제 + 내용)' 스텝이 dupcheck 를 set +e 없이 호출했다 — Actions run: 은 bash -e 라 exit 3 에 스텝이 즉사한다. 바로 아래 bodydup 호출은 올바르게 감싸져 있어서 **한 스텝 안에서 한쪽만 빠져 있었다.** 실제 피해: A1-12(근로장려금 반기신청)는 A1-03 과 '근로장려금' 단어 하나만 겹쳐 🔴 오탐을 받는데 bodydup 은 0.048 🟢 인 새 글이다 — 그대로 두면 이 글은 Actions 로 영영 발행되지 않는다. 수정: set +e/drc/case 로 감싸고 3 은 ::warning:: 으로만 남긴다(코드 3=제목 강한겹침, 그 외=검사 못 함, 둘 다 차단 안 함). 검증: YAML 파싱 OK · bash -n OK · 실제 🔴 제목으로 시뮬레이션해 최종 exit 0 확인. 🔴교훈: 문서·주석이 'WARN 전용'이라고 말해도 **호출부가 그렇게 안 부르면 아니다.** 게이트의 성격은 주석이 아니라 호출 방식이 정한다. 발견 경위: Fold 세션이 A1-12 발행을 시도하다 막혀 진단을 올려줬고, 관제탑이 코드로 확인해 고쳤다(역할 분담대로).","⏱️ 워크플로 수정과 실행의 시차 — A1-12 첫 발행 실패 (2026-08-09). Fold 가 14:37 KST 에 A1-12 를 트리거했는데 내 publish.yml 수정 커밋(107aa88)은 14:46 KST 였다. 9분 차이로 러너가 옛 코드를 받아 dupcheck 🔴 exit 3 에 스텝째로 죽었다(로그에 set +e 없는 호출이 그대로 찍혀 있다). 부작용은 없다 — 발행 스텝 전에 멈췄고 라이브·DB 모두 무변화. 🔴교훈: **러너는 항상 origin/main 의 코드를 쓴다.** 게이트를 고쳤으면 '푸시가 끝났는지'를 확인한 뒤에 실행 지시를 내려야 하고, 지시서 카드에도 '수정본이 원격에 올라간 뒤 실행할 것'을 적어야 한다. 내가 카드에 oooAKKKKAEPAqgTk5q+eQaoU0ZVegUUUUzIKKKKACiiigDQoooqTqGtGjOHZFLL0YjkUiwxLIZFjQOerBRk/jRRTAVUVc7VVcnJwMZp1FFIBrxpIu2RFdfRhkUqqqKFRQqjoAMAUUUALRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABVKZdshH40UU0RU2GUUUUzAKKKKACiiigD/9k=","body":"<!-- A5-10 배우자 출산휴가 출산 전 사용 유산·사산휴가 신청 방법 총정리 (2026년 9월 18일 시행) -->\n코드후보: A5-10\n■ 제목: 배우자 출산휴가 출산 전 사용 유산·사산휴가 신청 방법 총정리 (2026년 9월 18일 시행)\n■ 코드후보: A5-10 (정부지원 — 모성보호·일가정양립)\n■ 트렌드/시즌: 기한 소재. 「남녀고용평등과 일·가정 양립 지원에 관한 법률」 법률 제21476호(2026-03-17 공포)·「고용보험법」 법률 제21473호(2026-03-17 공포)와 두 법의 시행령(대통령령 제36589호·제36588호, 2026-08-18 공포)이 **2026년 9월 18일 함께 시행**된다(작성일 기준 13일 뒤). 제도 이름 자체가 '배우자 출산휴가 → 배우자 출산전후휴가'로 바뀌고, '배우자 유산·사산휴가'가 급여와 함께 신설된다. dupcheck 🟢 신규\n■ 카테고리: 정부지원 (#2BC4B0)\n■ 썸네일: thumbs/210_spouse_leave_prenatal.png (다크) · thumbs_naver/210_spouse_leave_prenatal.png (라이트)\n■ 기존글과의 구분: A5-07(추석 연휴 휴일근로수당)은 같은 A5 근로·노동 계열이지만 '수당 계산'을 다루고, 이 글은 '휴가 청구권과 급여'를 다룬다. B2-11(신생아 특례대출)은 출산 후 '대출'이고 이 글은 '휴가'다. 기존 발행글 중 배우자 출산휴가·유산사산휴가를 다룬 글은 없다.\n■ 원본가치(V0) — 5개 축:\n① **개정 전후 비교표** — 실제로 바뀐 것(용어·사유 확대 / 출산예정일 50일 전 신설 / 유산·사산휴가 신설 / 급여 신설)과 **바뀌지 않은 것 4가지(20일·유급·120일 마감·3회 분할)**를 한 표로 갈랐다. \"일수가 늘었다\"는 오해를 정면으로 막는다.\n② **두 개의 기준일 산수** — 창구는 '출산예정일 −50일'에 열리고 '실제 출산일 +120일'에 닫힌다. **서로 다른 날을 기준으로 삼는 두 앵커**인데 총 일수는 그대로 20일이다. 출산 전에 쓴 만큼 출산 후에 쓸 날이 줄어든다 — 달력 예시로 계산해 보였다.\n③ **금액 — 회사 규모에 따라 갈린다** — 고용보험 급여는 **우선지원 대상기업 소속만** 받는다(고용보험법 제76조①2호·4호). 대기업 소속은 사업주가 직접 유급 부담한다. 유산·사산휴가 급여 상한(1일 84,210원·3일 252,630원)까지 고용노동부 보도자료 원문으로 확인해 실었다.\n④ **판단형 비교** — 출산 전에 당겨 쓰는 게 유리한 경우 vs 출산 후에 몰아 쓰는 게 유리한 경우를 4행 표로 갈랐다.\n⑤ **탈락·함정 5가지** — (1) 인공임신중절에 따른 유산은 원칙적 제외(모자보건법 제14조① 해당 시는 예외) (2) 유산·사산휴가는 **20일 이내 '청구'** 기한이 따로 있다 (3) 5일은 '범위'이고 유급은 최초 3일뿐 — 4~5일차는 무급 (4) 급여는 **피보험 단위기간 180일**과 **신청기한 12개월**을 못 채우면 못 받는다 (5) 부칙에 이 휴가에 관한 **적용례가 없다** — 시행일 전후 경계 사례는 조문만으로 답이 안 나온다.\n■ 태그(naverkw 실측): `python -m studio.naverkw`로 후보 12개를 재서 **자동완성이 실제로 뜨는 5개만** 남겼다 — #배우자출산휴가 ✅ #배우자출산휴가일 ✅ #출산휴가 ✅ #남녀고용평등법 ✅ #육아휴직 ✅. 🔴 **탈락**: #배우자출산전후휴가 · #배우자유산사산휴가 · #출산휴가신청방법 · #배우자출산휴가급여 · #유산사산휴가 · #출산전후휴가 · #배우자출산휴가20일 (전부 자동완성 0 — 특히 '배우자출산전후휴가'는 9월 18일에 생기는 새 이름이라 아직 아무도 검색하지 않는다. 새 법률 용어를 태그로 쓰면 유입이 0이다).\n■ 검색설명(발행 후 편집화면에서 붙일 것):\n2026년 9월 18일부터 배우자 출산휴가를 출산 전에도 쓸 수 있고, 배우자 유산·사산휴가가 급여와 함께 새로 생깁니다. 법률·시행령 원문으로 사용 가능 기간, 신청 방법, 급여 조건, 20일 청구기한 함정까지 정리했습니다.\n■ 확인 못 해 뺀 것(유보):\n① **급여 상한액의 근거는 법령이 아니라 고시다.** 고용보험법 시행령 제101조1호는 상한액을 \"매년 고용노동부장관이 고시하는 금액\"으로 위임하고 있어 **시행령 원문에는 금액이 없다.** 본문의 1일 84,210원·2일 168,420원·3일 252,630원은 **고용노동부 보도자료(2026-08-11, moel.go.kr)** 원문에서 그대로 인용했고, 본문에 출처·기준일과 함께 \"매년 고시로 바뀐다\"는 주의를 붙였다. 고시 원문 자체는 확보하지 못했다.\n② **과태료의 위반 횟수별 부과금액을 쓰지 않았다.** 법 제39조③의 \"500만원 이하\"까지만 조문으로 확인했다. 구체적 부과기준은 시행령 별표(과태료의 부과기준, 제22조 관련)에 있는데 이 별표는 law.go.kr에서 첨부파일 다운로드(flDownload)로만 제공돼 원문을 확인하지 못했다. 1회 시도 후 중단했고 근처 값으로 대체하지 않았다.\n③ **우선지원 대상기업의 산업별 근로자수 기준(고용보험법 시행령 별표1)의 구체적 숫자를 쓰지 않았다.** 근거 조문(제12조)의 판단 구조만 서술하고, 본인 회사 해당 여부는 1350·고용센터 확인으로 넘겼다.\n④ **120일 마감일의 초일 산입 여부**는 조문에 명시가 없어 단정하지 않고, 계산 예시에 \"하루 이틀 경계는 관할 고용센터 확인\" 주의를 붙였다.\n⑤ 🏛️ 공식 안내 링크는 전부 **GET 200**과 함께, 존재하지 않는 공포번호를 넣은 **대조 URL과 응답 크기가 다른 것**까지 확인했다(law.go.kr은 조문 단위 `/제N조` 링크를 서버에서 검증하지 않아 실재하지 않는 조문도 200을 돌려준다 — 그래서 조문 링크 대신 **공포번호·공포일자로 특정한 버전 링크**를 썼다).\n\n[붙여넣는 법] Blogger 글쓰기 → 연필▾ → HTML 보기 → 아래 전체 붙여넣기 → 작성 보기 → 제목 입력 → 라벨(정부지원) → 발행\n----------------------------------------------------------------\n▼ 본문 HTML\n<div style=\"text-align:center;margin:0 0 18px\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCACIAQQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDB -size:14px;color:#2e7d4f;margin-bottom:6px} .lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600} .lsg .rel{background:#e9faf7;border:1px solid #bde9e1;border-radius:12px;padding:14px 20px;margin-top:22px} .lsg .rel b{display:block;font-size:14px;color:#1a9e8c;margin-bottom:8px} .lsg .rel a{display:block;color:#177f71;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600} .lsg .top{display:inline-block;font-size:13px;color:#8aab9a;text-decoration:none;margin:2px 0 6px} .lsg .tags{font-size:14px;color:#2BC4B0;margin-top:18px;line-height:1.9} <\/style> <div class=\"lsg\" id=\"top\"> <span class=\"cat\">정부지원<\/span> <p>아내의 출산예정일이 다가오는데 배우자 출산휴가를 <b>출산 전에는 쓸 수 없어서<\/b> 정작 필요한 날 병원에 못 갔던 분들이 많습니다. <b>2026년 9월 18일부터<\/b> 이 부분이 법으로 바뀝니다. 제도 이름도 <b>'배우자 출산전후휴가'<\/b>로 바뀌고, 지금까지 없던 <b>'배우자 유산·사산휴가'<\/b>가 급여와 함께 새로 생깁니다. 개정된 법률·시행령 원문과 고용노동부 보도자료를 직접 확인해 정리했습니다.<\/p> <div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 무엇이 바뀌고, 무엇이 그대로인가<\/a><a href=\"#sec2\">2. 언제부터 언제까지 쓸 수 있나 — 기준일이 둘이다<\/a><a href=\"#sec3\">3. 배우자 유산·사산휴가(신설) 5일·3일 유급<\/a><a href=\"#sec4\">4. 급여는 얼마나 나오나 — 회사 규모에서 갈린다<\/a><a href=\"#sec5\">5. 신청 방법 — '고지'와 '청구'는 다릅니다<\/a><a href=\"#sec6\">6. 출산 전에 쓸까, 출산 후에 쓸까<\/a><a href=\"#sec7\">7. 놓치기 쉬운 함정 5가지<\/a><a href=\"#sec8\">8. 회사가 안 주면 어떻게 되나<\/a><a href=\"#sec9\">공식 확인 페이지<\/a><\/div>\n\n<div class=\"sum\"><b>✅ 정리<\/b> <ul> <li>2026년 9월 18일부터 배우자 출산휴가는 <b>배우자 출산전후휴가<\/b>로 바뀌고, <b>출산예정일 50일 전부터<\/b> 쓸 수 있습니다(법 제18조의2③).<\/li> <li><b>일수는 20일 그대로입니다.<\/b> 출산 전에 당겨 쓴 만큼 출산 후에 쓸 날이 줄어듭니다 — 늘어난 것이 아니라 <b>당겨 쓸 수 있게<\/b> 된 것입니다.<\/li> <li><b>배우자 유산·사산휴가<\/b>가 신설됩니다 — <b>5일 범위, 최초 3일만 유급<\/b>, 유산·사산한 날부터 <b>20일 이내에 청구<\/b>해야 합니다(법 제18조의4).<\/li> <\/ul><\/div>\n\n<a class=\"cta\" href=\"#sec2\">👉 우리 부부는 언제부터 쓸 수 있는지 계산해보기<\/a>\n\n<h2 id=\"sec1\">1. 무엇이 바뀌고, 무엇이 그대로인가<\/h2> <p>이번 개정의 본체는 <b>「남녀고용평등과 일·가정 양립 지원에 관한 법률」 법률 제21476호<\/b>(2026년 3월 17일 공포)입니다. 신청 절차는 <b>같은 법 시행령 대통령령 제36589호<\/b>가, 급여는 <b>「고용보험법」 법률 제21473호<\/b>와 그 시행령이 정합니다. <b>넷 다 시행일은 2026년 9월 18일<\/b>입니다.<\/p> <p>기사 제목만 보면 \"휴가가 늘어난다\"로 읽히기 쉬운데, <b>실제로 바뀌는 것과 그대로인 것을 갈라서<\/b> 봐야 합니다.<\/p>\n\n<div class=\"tw\"><table> <tr><th>항목<\/th><th>2026년 9월 17일까지<\/th><th>2026년 9월 18일부터<\/th><\/tr> <tr><td class=\"l\">제도 이름<\/td><td>배우자 출산휴가<\/td><td><b>배우자 출산전후휴가<\/b>(개칭)<\/td><\/tr> <tr><td class=\"l\">휴가 사유<\/td><td>배우자의 <b>출산<\/b><\/td><td>배우자의 <b>임신 및 출산<\/b>(확대)<\/td><\/tr> <tr><td class=\"l\">사용 시작 시점<\/td><td>조문에 시작 규정 없음<br>(마감만 규정)<\/td><td><b>출산예정일 50일 전부터<\/b> 사용 가능<br>(명문화 · 신설)<\/td><\/tr> <tr><td class=\"l\">휴가 일수<\/td><td>20일<\/td><td>20일 — <b>변동 없음<\/b><\/td><\/tr> <tr><td class=\"l\">유급 여부<\/td><td>유급<\/td><td>유급 — <b>변동 없음<\/b><\/td><\/tr> <tr><td class=\"l\">사용 마감<\/td><td>배우자 출산일부터 120일<\/td><td>배우자 출산일부터 120일 — <b>변동 없음<\/b><\/td><\/tr> <tr><td class=\"l\">분할 사용<\/td><td>3회<\/td><td>3회 — <b>변동 없음<\/b><\/td><\/tr> <tr><td class=\"l\">배우자 유산·사산휴가<\/td><td><b>없음<\/b><\/td><td><b>신설<\/b> — 5일 범위·최초 3일 유급<br>(법 제18조의4)<\/td><\/tr> <tr><td class=\"l\">유산·사산휴가 급여<\/td><td><b>없음<\/b><\/td><td><b>신설<\/b> — 최초 3일<br>(우선지원 대상기업 한정)<\/td><\/tr> <tr><td class=\"l\">신청 절차 규정<\/td><td>시행령에 <b>없었음<\/b><\/td><td>시행령 제9조의2·제9조의4 <b>신설<\/b><\/td><\/tr> <\/table><\/div>\n\n<div class=\"tip\"><b>💡 \"20일이 늘어난 게 아닙니다\"<\/b> 개정 조문(제18조의2①)은 여전히 <b>\"20일의 휴가를 주어야 한다\"<\/b>입니다. 바뀐 것은 <b>그 20일을 언제부터 꺼내 쓸 수 있는가<\/b>입니다. 분할 횟수도 <b>3회 그대로<\/b>이고(제18조의2④), 유급이라는 점도 그대로입니다. 일수가 늘었다는 안내를 보셨다면 조문과 대조해 보시기 바랍니다.<\/div>\n\n<div class=\"tip\"><b>💡 같은 날 함께 바뀌는 것 — 출생 전 육아휴직<\/b> 개정 법 제19조①은 육아휴직 대상에 <b>\"남성 근로자가 고용노동부령으로 정하는 유산·조산 등 위험이 있는 임신 중인 배우자를 돌보려고 하는 경우\"<\/b>를 새로 넣었습니다. 지금까지 남성 근로자는 자녀가 태어난 뒤에만 육아휴직을 쓸 수 있었는데, <b>출생 전에도<\/b> 쓸 수 있게 됩니다. 어떤 질환이 여기 해당하는지는 같은 법 시행규칙 제14조의2와 그 별표3이 정합니다. 고용노동부는 이 경우 <b>휴직 개시 예정일 7일 전까지<\/b> 신청하도록 안내하고 있습니다(2026년 8월 11일 보도자료).<\/div> <a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 언제부터 언제까지 쓸 수 있나 — 기준일이 둘이다<\/h2> <p>개정된 법 제18조의2③은 이렇게 정합니다.<\/p> <div class=\"tip\"><b>📖 법 제18조의2③ (2026-09-18 시행)<\/b> \"배우자 출산전후휴가는 근로자의 <b>배우자 출산예정일 50일 전부터<\/b> 사용할 수 있고, <b>배우자가 출산한 날부터 120일<\/b>이 지나면 사용할 수 없다.\"<\/div>\n\n<p>이 한 문장에 <b>서로 다른 날짜 두 개<\/b>가 들어 있습니다. 이게 이 제도에서 가장 헷갈리는 지점입니다.<\/p> <ul> <li><b>창구가 열리는 날<\/b> = <b>출산예정일<\/b> − 50일 &nbsp;→ 예정일 기준<\/li> <li><b>창구가 닫히는 날<\/b> = <b>실제 출산일<\/b> + 120일 &nbsp;→ 실제 출산일 기준<\/li> <\/ul> <p>예정일과 실제 출산일은 대개 어긋나므로, <b>여는 기준일과 닫는 기준일이 다른 날<\/b>이 됩니다.<\/p>\n\n<h3>계산 예시<\/h3> <p>출산예정일이 <b>2026년 11월 20일<\/b>이고, 실제로 <b>11월 25일<\/b>에 출산했다고 가정해 보겠습니다.<\/p> <div class=\"tw\"><table> <tr><th>구분<\/th><th>기준일<\/th><th>계산<\/th><th>결과<\/th><\/tr> <tr><td class=\"l\">사용 시작<\/td><td>출산예정일<br>2026-11-20<\/td><td>− 50일<\/td><td><b>2026-10-01<\/b>부터 사용 가능<\/td><\/tr> <tr><td class=\"l\">사용 마감<\/td><td>실제 출산일<br>2026-11-25<\/td><td>+ 120일<\/td><td><b>2027-03-25<\/b>경까지<\/td><\/tr> <tr><td class=\"l\">총 일수<\/td><td colspan=\"2\">기간이 길어져도 총량은 그대로<\/td><td><b>20일<\/b>(3회 분할)<\/td><\/tr> <\/table><\/div>\n\n<div class=\"warn\"><b>⚠️ 여기서 반드시 알아야 할 것<\/b> 창구가 약 <b>5개월 반<\/b>으로 넓어졌지만 <b>쓸 수 있는 날은 여전히 20일<\/b>입니다. 출산 전에 5일을 쓰면 출산 후에 남는 날은 15일입니다. \"출산 전에도 쓸 수 있다\"를 \"휴가가 더 생겼다\"로 읽으면 계획이 어긋납니다.<\/div>\n\n<div class=\"warn\"><b>⚠️ 마감일의 하루 이틀 경계는 확인하세요<\/b> 조문은 \"출산한 날부터 120일이 지나면\"이라고만 정하고 있고, <b>초일(출산일 당일)을 산입하는지는 조문에 명시돼 있지 않습니다.<\/b> 위 예시의 2027-03-25는 출산일 다음 날부터 센 계산이며, 하루 차이가 생길 수 있습니다. 마감이 임박했다면 날짜를 스스로 단정하지 마시고 <b>고용노동부 고객상담센터(국번 없이 1350)<\/b> 또는 관할 고용센터에 확인하시기 바랍니다.<\/div> <a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 배우자 유산·사산휴가(신설) 5일·3일 유급<\/h2> <p>지금까지 유산·사산휴가는 <b>유산·사산을 겪은 본인(임신했던 근로자)<\/b>에게만 있었습니다(「근로기준법」 제74조③). 배우자에게는 제도 자체가 없었습니다. 2026년 9월 18일부터 <b>법 제18조의4<\/b>가 신설돼 배우자도 휴가를 청구할 수 있게 됩니다.<\/p>\n\n<div class=\"tw\"><table> <tr><th>항목<\/th><th>내용<\/th><th>근거<\/th><\/tr> <tr><td class=\"l\">휴가 일수<\/td><td><b>5일의 범위에서<\/b><br>(상한이며 고정 5일이 아님)<\/td><td>법 제18조의4①<\/td><\/tr> <tr><td class=\"l\">유급 구간<\/td><td><b>최초 3일만 유급<\/b><br>→ 4~5일차는 조문상 유급 대상 아님<\/td><td>법 제18조의4①<\/td><\/tr> <tr><td class=\"l\">청구 기한<\/td><td>배우자가 유산·사산한 날부터<br><b>20일 이내<\/b>에 <b>청구<\/b><\/td><td>법 제18조의4③<\/td><\/tr> <tr><td class=\"l\">적용 제외<\/td><td>인공 임신중절 수술에 따른 유산<br>(모자보건법 제14조① 해당 시는 제외되지 않음)<\/td><td>법 제18조의4① 단서<\/td><\/tr> <tr><td class=\"l\">불리한 처우<\/td><td>이를 이유로 해고·불리한 처우 금지<\/td><td>법 제18조의4④<\/td><\/tr> <\/table><\/div>\n\n<div class=\"tip\"><b>💡 문언 하나하나가 다릅니다<\/b> 배우자 출산전후휴가는 <b>\"20일의 휴가를 주어야 한다\"<\/b>(일수 확정)인데, 배우자 유산·사산휴가는 <b>\"5일의 범위에서 휴가를 주어야 하며\"<\/b>(상한)입니다. 그리고 유급은 <b>\"최초 3일\"<\/b>로 끊어져 있습니다. 두 휴가를 같은 조건으로 생각하면 안 됩니다.<\/div> <a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 급여는 얼마나 나오나 — 회사 규모에서 갈린다<\/h2> <p>\"유급\"이라는 말은 <b>누가 그 돈을 내는가<\/b>를 말해주지 않습니다. 여기서 <b>회사 규모에 따라 갈립니다.<\/b><\/p>\n\n<p>「고용보험법」 제76조①(2026년 9월 18일 시행)은 고용보험에서 급여가 나가는 기간을 이렇게 한정합니다.<\/p> <ul> <li><b>2호<\/b> — 배우자 출산전후휴가 기간. 다만 <b>우선지원 대상기업인 경우로 한정<\/b><\/li> <li><b>4호<\/b> — 배우자 유산·사산휴가 기간 중 <b>최초 3일<\/b>. 다만 <b>우선지원 대상기업인 경우로 한정<\/b><\/li> <\/ul>\n\n<div class=\"tw\"><table> <tr><th>구분<\/th><th>우선지원 대상기업 소속<\/th><th>그 외(대기업 등) 소속<\/th><\/tr> <tr><td class=\"l\">배우자 출산전후휴가<br>(20일)<\/td><td>고용보험에서 <b>급여 지급<\/b><br>(법 제76조①2호)<\/td><td>고용보험 급여 <b>대상 아님<\/b><br>→ 사업주가 20일 유급 부담<\/td><\/tr> <tr><td class=\"l\">배우자 유산·사산휴가<br>(최초 3일)<\/td><td>고용보험에서 <b>급여 지급<\/b><br>(법 제76조①4호)<\/td><td>고용보험 급여 <b>대상 아님<\/b><br>→ 사업주가 3일 유급 부담<\/td><\/tr> <tr><td class=\"l\">급여 수준<\/td><td colspan=\"2\">휴가를 시작한 날 기준 <b>통상임금<\/b>에 해당하는 금액(법 제76조①)<\/td><\/tr> <\/table><\/div>\n\n<div class=\"tip\"><b>💰 배우자 유산·사산휴가 급여 상한 (고용노동부 발표)<\/b> 고용노동부는 우선지원 대상기업의 경우 유급휴가 기간에 대해 <b>통상임금 100%<\/b>의 배우자 유산·사산휴가 급여를 지급하며, 상한은 <b>1일분 84,210원 · 2일분 168,420원 · 3일분 252,630원<\/b>이라고 밝혔습니다(2026년 8월 11일 보도자료). <br><b>⚠️ 이 금액은 매년 바뀝니다.<\/b> 고용보험법 시행령 제101조1호는 상한액을 <b>\"매년 고용노동부장관이 고시하는 금액\"<\/b>으로 정하고 있어 시행령 원문에는 금액이 없습니다. 위 수치는 <b>2026년 8월 11일 발표 기준<\/b>이며, 실제 신청 시점의 금액은 반드시 고용24나 1350에서 확인하세요.<\/div>\n\n<div class=\"warn\"><b>⚠️ 급여에는 별도 요건이 두 개 더 있습니다<\/b> 휴가를 썼다고 급여가 자동으로 나오지 않습니다. 「고용보험법」 제75조는 다음을 함께 요구합니다. <ul> <li><b>피보험 단위기간 180일 이상<\/b> — 휴가가 끝난 날 이전까지 합산하여 180일 이상이어야 합니다(제75조1호).<\/li> <li><b>신청 기간<\/b> — 휴가를 <b>시작한 날 이후 1개월부터<\/b>, 휴가가 <b>끝난 날 이후 12개월 이내<\/b>에 신청해야 합니다(제75조2호). 이 기간을 넘기면 원칙적으로 받을 수 없습니다.<\/li> <\/ul> 또한 사업주에게서 통상임금에 해당하는 금품을 이미 받은 경우에는 그만큼 <b>감액<\/b>됩니다(고용보험법 시행령 제104조) — 회사 급여와 고용보험 급여를 <b>이중으로 받는 구조가 아닙니다.<\/b><\/div>\n\n<div class=\"tip\"><b>💡 우리 회사가 '우선지원 대상기업'인가<\/b> 고용보험법 시행령 제12조가 정합니다 — <b>산업별 상시 근로자수 기준(별표1)<\/b>에 해당하면 우선지원 대상기업이고, 그 기준을 넘더라도 <b>「중소기업기본법」상 중소기업<\/b>이면 역시 우선지원 대상기업으로 봅니다(같은 조 ②). 반대로 <b>상호출자제한기업집단<\/b>에 속하는 회사는 지정된 다음 보험연도부터 제외됩니다(같은 조 ④). 산업별 숫자 기준은 이 글에 싣지 않았습니다 — <b>본인 회사의 해당 여부는 1350 또는 관할 고용센터에서 확인<\/b>하시는 것이 정확합니다.<\/div> <a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 신청 방법 — '고지'와 '청구'는 다릅니다<\/h2> <p>이번에 신설된 시행령 제9조의2와 제9조의4가 신청 절차를 정합니다. <b>그전에는 배우자 출산휴가의 신청 절차 규정이 아예 없었습니다.<\/b> 절차를 대통령령에 맡기는 <b>위임조항(법 제18조의2⑥) 자체가 이번에 신설<\/b>됐기 때문입니다 — 위임이 없었으니 시행령에 규정이 있을 수 없었습니다.<\/p> <p>조문 번호가 밀린 점도 알아 두시면 좋습니다. 옛 제9조의2는 <b>난임치료휴가<\/b> 조문이었는데, 그 자리에 배우자 출산전후휴가가 들어오면서 <b>난임치료휴가는 제9조의3으로 옮겨갔습니다<\/b>(내용은 그대로입니다). 난임치료휴가를 찾으시는 분은 제9조의3을 보시면 됩니다.<\/p>\n\n<p>두 휴가는 법이 쓰는 <b>동사가 다릅니다.<\/b> 배우자 출산전후휴가는 <b>고지<\/b>(제18조의2①), 배우자 유산·사산휴가는 <b>청구<\/b>(제18조의4①)입니다.<\/p>\n\n<div class=\"tw\"><table> <tr><th>구분<\/th><th>배우자 출산전후휴가<\/th><th>배우자 유산·사산휴가<\/th><\/tr> <tr><td class=\"l\">법이 쓰는 말<\/td><td><b>고지<\/b><\/td><td><b>청구<\/b><\/td><\/tr> <tr><td class=\"l\">제출 서류<\/td><td colspan=\"2\">문서(<b>전자문서 포함<\/b>)를 사업주에게 제출<\/td><\/tr> <tr><td class=\"l\">적을 내용<\/td><td>① 사용하려는 날<br>② 배우자의 <b>출산일 또는 출산예정일<\/b><br>③ 고지 연월일<\/td><td>① 사용하려는 날<br>② 배우자 <b>유산·사산일<\/b><br>③ 청구 연월일<\/td><\/tr> <tr><td class=\"l\">회사가 요구할 수 있는 것<\/td><td>배우자의 <b>임신 또는 출산<\/b> 사실 증명 서류<\/td><td>배우자의 <b>유산·사산<\/b> 사실 증명 서류<\/td><\/tr> <tr><td class=\"l\">근거<\/td><td>시행령 제9조의2<\/td><td>시행령 제9조의4<\/td><\/tr> <\/table><\/div>\n\n<div class=\"tip\"><b>💡 \"출산예정일\"을 적을 수 있게 된 것이 핵심입니다<\/b> 출산 전에 휴가를 쓰려면 아직 출산일이 없으므로, 신설된 시행령 제9조의2①은 <b>\"배우자의 출산일 <u>또는 출산예정일<\/u>\"<\/b>을 적도록 했습니다. 출산 전 사용을 절차에서 뒷받침하는 조항입니다. 증명 서류도 <b>\"임신 또는 출산\"<\/b> 사실로 넓어졌으므로, 출산 전이라면 임신 확인 서류로 갈음할 수 있는 구조입니다.<\/div>\n\n<div class=\"tip\"><b>💡 육아휴직을 함께 신청하려면<\/b> 같은 법 시행규칙 제14조의3(2026년 8월 19일 개정)은, 배우자 출산전후휴가를 고지하면서 육아휴직을 함께 신청하려는 근로자는 <b>별지 제7호의2서식<\/b>의 「출산전후휴가(배우자 출산전후휴가)·육아휴직 통합 신청서」를 제출하도록 정하고 있습니다. 회사가 별도 서식을 정한 경우에는 그 서식을 씁니다.<\/div>\n\n<div class=\"tip\"><b>💡 급여 신청은 회사가 아니라 고용센터로<\/b> 휴가 자체는 <b>사업주에게<\/b> 고지·청구하지만, 고용보험 급여는 <b>고용24(work24.go.kr)<\/b> 또는 관할 고용센터에 <b>따로 신청<\/b>해야 합니다. 아래 「공식 확인 페이지」에 신청 안내 링크를 넣어 두었습니다.<\/div> <a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 출산 전에 쓸까, 출산 후에 쓸까<\/h2> <p>총 20일은 정해져 있으므로, 이건 <b>배분의 문제<\/b>입니다. 상황에 따라 답이 갈립니다.<\/p>\n\n<div class=\"tw\"><table> <tr><th>상황<\/th><th>유리한 선택<\/th><th>이유<\/th><\/tr> <tr><td class=\"l\">고위험 임신·입원 예정<br>(조기진통, 임신중독 등)<\/td><td><b>출산 전에 당겨 쓰기<\/b><\/td><td>입원·통원 동행이 실제로 필요한 시기가 출산 전이다. 예정일 50일 전부터 열리므로 이 구간을 쓸 수 있다<\/td><\/tr> <tr><td class=\"l\">산후조리원·친정 도움이<br>확보돼 있음<\/td><td><b>출산 후로 남기기<\/b><\/td><td>조리원 퇴소 후가 손이 가장 많이 간다. 마감이 출산일+120일이라 넉넉히 배치할 수 있다<\/td><\/tr> <tr><td class=\"l\">첫째 아이가 있어<br>돌봄 공백이 생김<\/td><td><b>나눠 쓰기<\/b><br>(3회 분할 활용)<\/td><td>출산 입원 기간 + 퇴원 직후 + 배우자 복귀 시점으로 쪼개면 공백을 메울 수 있다<\/td><\/tr> <tr><td class=\"l\">예정일보다<br>늦어질 가능성이 큼<\/td><td><b>출산 후 중심으로<\/b><\/td><td>창구는 예정일 기준으로 열리지만 마감은 <b>실제 출산일<\/b> 기준이다. 출산이 늦어지면 앞에서 당겨 쓴 날만 소모되고 뒤는 그만큼 밀린다<\/td><\/tr> <\/table><\/div>\n\n<div class=\"warn\"><b>⚠️ 회사와 먼저 맞춰야 하는 이유<\/b> 배우자 출산전후휴가(제18조의2)와 배우자 유산·사산휴가(제18조의4)에는, 난임치료휴가(제18조의3①)에 있는 <b>\"정상적인 사업 운영에 중대한 지장을 초래하는 경우 근로자와 협의하여 시기를 변경할 수 있다\"<\/b>는 조항이 <b>조문에 들어 있지 않습니다.<\/b> 다만 이는 조문 문언에 관한 사실 확인일 뿐이며, 실제 분쟁에서 어떻게 해석될지까지 이 글이 단정하지는 않습니다. 일정은 미리 회사와 조율하시고, 다툼이 생기면 1350으로 상담하시기 바랍니다.<\/div> <a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 놓치기 쉬운 함정 5가지<\/h2>\n\n<div class=\"warn\"><b>⚠️ 함정 ① 유산·사산휴가는 '20일 이내 청구' 기한이 따로 있습니다<\/b> 법 제18조의4③은 <b>\"배우자가 유산 또는 사산한 날부터 20일 이내에 청구하여야 한다\"<\/b>고 정합니다. 이건 <b>휴가를 다 쓰는 기한이 아니라 청구하는 기한<\/b>입니다. 예를 들어 2026년 10월 5일에 유산했다면 <b>10월 25일까지 회사에 청구<\/b>해야 합니다. 배우자 출산전후휴가의 120일과 혼동해서 \"아직 여유 있다\"고 넘기면 청구 자체가 불가능해집니다. 힘든 시기라 놓치기 가장 쉬운 조항입니다.<br><br><b>🔴 이 날짜는 하루도 여유를 두지 마세요.<\/b> 조문은 120일 마감과 똑같이 <b>\"~한 날부터 …이내\"<\/b>라고만 정하고 있어, <b>초일(유산·사산일 당일)을 산입하는지가 명시돼 있지 않습니다.<\/b> 위 10월 25일은 다음 날부터 센 계산이라 하루 차이가 생길 수 있습니다. 그런데 120일은 하루를 넘겨도 <b>휴가 하루<\/b>를 잃는 데 그치지만, 이 20일은 하루를 넘기면 <b>휴가 전체<\/b>를 잃습니다. <b>기한 끝에 맞추지 말고 최대한 일찍 청구하시고<\/b>, 날짜가 애매하면 1350이나 관할 고용센터에 먼저 확인하세요.<\/div>\n\n<div class=\"warn\"><b>⚠️ 함정 ② 인공 임신중절에 따른 유산은 원칙적으로 제외됩니다<\/b> 법 제18조의4① 단서는 <b>\"인공 임신중절 수술(「모자보건법」 제14조제1항에 따른 경우는 제외한다)에 따른 유산의 경우에는 적용하지 아니한다\"<\/b>고 정합니다. 괄호가 핵심입니다 — 모자보건법 제14조①에 해당하면 <b>제외 대상에서 빠지므로 휴가를 쓸 수 있습니다.<\/b> 모자보건법 제14조①의 사유는 다음과 같습니다. <ul> <li>본인이나 배우자에게 대통령령으로 정하는 우생학적·유전학적 정신장애나 신체질환이 있는 경우<\/li> <li>본인이나 배우자에게 대통령령으로 정하는 전염성 질환이 있는 경우<\/li> <li>강간 또는 준강간에 의하여 임신된 경우<\/li> <li>법률상 혼인할 수 없는 혈족 또는 인척 간에 임신된 경우<\/li> <li>임신의 지속이 보건의학적 이유로 모체의 건강을 심각하게 해치고 있거나 해칠 우려가 있는 경우<\/li> <\/ul> 자연유산·계류유산 등은 애초에 이 단서가 말하는 \"인공 임신중절 수술에 따른 유산\"이 아니므로 <b>제외 대상이 아닙니다.<\/b> 참고로 같은 구조의 단서가 근로기준법 제74조③(본인의 유산·사산휴가)에도 이미 들어 있습니다.<\/div>\n\n<div class=\"warn\"><b>⚠️ 함정 ③ 5일은 '범위'이고, 유급은 최초 3일뿐입니다<\/b> 법 제18조의4①은 <b>\"5일의 범위에서\"<\/b> 휴가를 주도록 하고, 유급은 <b>\"최초 3일\"<\/b>로 한정합니다. 배우자 출산전후휴가가 \"20일\" 전부 유급인 것과 다릅니다. <b>4일차·5일차는 조문상 유급 대상이 아닙니다.<\/b> 5일을 다 쓸 계획이라면 무급 구간이 있다는 점을 미리 감안하셔야 합니다.<\/div>\n\n<div class=\"warn\"><b>⚠️ 함정 ④ 휴가를 썼다고 급여가 자동으로 나오지 않습니다<\/b> 고용보험 급여는 <b>우선지원 대상기업 소속<\/b>이어야 하고(고용보험법 제76조①2호·4호), <b>피보험 단위기간 180일 이상<\/b>이어야 하며(제75조1호), <b>휴가가 끝난 날 이후 12개월 이내<\/b>에 신청해야 합니다(제75조2호). 셋 중 하나만 어긋나도 못 받습니다. 특히 <b>12개월 신청기한<\/b>은 휴가를 다 쓰고 나서 잊고 지나치기 쉽습니다. 급여는 회사가 아니라 <b>고용24·고용센터에 직접 신청<\/b>해야 한다는 점도 함께 기억하세요.<\/div>\n\n<div class=\"warn\"><b>⚠️ 함정 ⑤ 시행일 경계 사례는 조문만으로 답이 안 나옵니다<\/b> 개정 법률(제21476호)의 부칙을 확인한 결과, 부칙 제1조는 시행일(공포 후 6개월)만 정하고 있고 <b>부칙 제2조의 적용례는 제19조의2(육아기 근로시간 단축)에 관한 것뿐<\/b>입니다. 즉 <b>배우자 출산전후휴가·배우자 유산·사산휴가에 관한 적용례 조항은 부칙에 없습니다.<\/b> 그래서 \"배우자가 9월 10일에 출산했는데 나도 새 제도를 쓸 수 있나\", \"9월 초에 유산했는데 20일 청구기한이 시행일 이후까지 남아 있으면 되나\" 같은 <b>경계 사례는 조문만 읽어서는 답이 나오지 않습니다.<\/b> 이 글에서 추측으로 답을 만들지 않겠습니다 — 해당하시는 분은 <b>고용노동부 고객상담센터 1350<\/b> 또는 관할 고용센터에 직접 확인하시기 바랍니다.<\/div> <a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 회사가 안 주면 어떻게 되나<\/h2> <p>두 휴가 모두 <b>사업주의 의무<\/b>이고, 위반 시 과태료 대상입니다. 법 제39조③은 다음 위반에 <b>500만원 이하의 과태료<\/b>를 부과하도록 정합니다.<\/p>\n\n<div class=\"tw\"><table> <tr><th>위반 내용<\/th><th>근거 호<\/th><th>과태료<\/th><\/tr> <tr><td class=\"l\">배우자의 임신 및 출산을 이유로 휴가를 고지했는데도 <b>휴가를 주지 않거나<\/b>, 사용한 휴가를 <b>유급으로 하지 않은<\/b> 경우<\/td><td>제39조③<b>3호<\/b><\/td><td>500만원 이하<\/td><\/tr> <tr><td class=\"l\">배우자 유산·사산휴가를 <b>주지 않거나<\/b>, <b>최초 3일을 유급으로 하지 않은<\/b> 경우<\/td><td>제39조③<b>3의3호<\/b><br>(이번에 <b>신설<\/b>)<\/td><td>500만원 이하<\/td><\/tr> <\/table><\/div>\n\n<p>또한 두 휴가 모두 <b>이를 이유로 한 해고나 그 밖의 불리한 처우가 금지<\/b>됩니다(법 제18조의2⑤, 제18조의4④).<\/p>\n\n<div class=\"tip\"><b>💡 구체적인 부과 금액은 이 글에 싣지 않았습니다<\/b> 위반 횟수별 실제 부과 금액은 시행령 별표(과태료의 부과기준)에 있는데, 이 별표는 국가법령정보센터에서 첨부파일로만 제공돼 원문을 확인하지 못했습니다. 법률이 정한 <b>상한(500만원 이하)<\/b>까지만 조문 그대로 적었습니다. 실제 부과 금액이 필요하시면 관할 고용노동청에 문의하시기 바랍니다.<\/div> <a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">공식 확인 페이지<\/h2> <div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=19768\" target=\"_blank\" rel=\"nofollow\">▸ 고용노동부 보도자료 — 남녀고용평등법·고용보험법 시행령 개정안 국무회의 의결(2026-08-11)<\/a><a href=\"https://www.work24.go.kr/cm/c/f/1100/selecSystInfo.do?systId=SI00000395&amp;systClId=SC00000247\" target=\"_blank\" rel=\"nofollow\">▸ 고용24 — 배우자 출산휴가·배우자 출산휴가급여 제도안내 및 신청서식<\/a><a href=\"https://www.gov.kr/mw/AA020InfoCappView.do?CappBizCD=14900000302\" target=\"_blank\" rel=\"nofollow\">▸ 정부24 — 배우자 출산휴가·유산사산휴가 급여 신청 민원안내<\/a><a href=\"https://www.law.go.kr/법령/남녀고용평등과일·가정양립지원에관한법률/(21476,20260317)\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 남녀고용평등법 개정 법률 제21476호(2026-09-18 시행) 원문<\/a><a href=\"https://www.law.go.kr/법령/남녀고용평등과일·가정양립지원에관한법률시행령/(36589,20260818)\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 같은 법 시행령 대통령령 제36589호(2026-09-18 시행) 원문<\/a><a href=\"https://www.law.go.kr/법령/고용보험법/(21473,20260317)\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 고용보험법 제21473호(2026-09-18 시행, 제75조·제76조 급여) 원문<\/a><a href=\"https://www.law.go.kr/법령/모자보건법\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 모자보건법(제14조 인공임신중절수술의 허용한계)<\/a><\/div>\n\n<div class=\"src\"><b>📌 출처·기준일<\/b> 이 글의 조문·일수·기한은 <b>국가법령정보센터(law.go.kr)의 법령 원문<\/b>을, 급여 상한액은 <b>고용노동부 보도자료(2026-08-11)<\/b>를 직접 받아 확인했습니다(<b>2026-09-05 기준<\/b>). 개정의 본체는 <b>「남녀고용평등과 일·가정 양립 지원에 관한 법률」 법률 제21476호<\/b>(2026-03-17 공포, <b>2026-09-18 시행<\/b>)이며, 신청 절차는 <b>같은 법 시행령 대통령령 제36589호<\/b>(2026-08-18 공포), 급여는 <b>「고용보험법」 법률 제21473호<\/b>와 그 시행령(대통령령 제36588호)이 정합니다 — <b>넷 다 같은 날 시행<\/b>됩니다. 항목별 근거: 20일·유급·개칭·사유 확대 = 법 제18조의2①, 출산예정일 50일 전·120일 마감 = 같은 조 ③, 3회 분할 = 같은 조 ④, 불리한 처우 금지 = 같은 조 ⑤, 유산·사산휴가 5일 범위·최초 3일 유급·인공임신중절 단서 = 법 제18조의4①, 20일 이내 청구 = 같은 조 ③, 출생 전 육아휴직 = 법 제19조①, 과태료 500만원 이하 = 법 제39조③3호·3의3호, 신청 서류 = 시행령 제9조의2·제9조의4, 통합 신청서 서식 = 시행규칙 제14조의3, 급여 대상기간·우선지원 대상기업 한정 = 고용보험법 제76조①2호·4호, 피보험 단위기간 180일·신청기한 12개월 = 같은 법 제75조, 상·하한액 위임 = 같은 법 시행령 제101조, 급여 감액 = 같은 영 제104조, 우선지원 대상기업 범위 = 같은 영 제12조, 본인의 유산·사산휴가 = 근로기준법 제74조③, 인공임신중절 허용한계 = 모자보건법 제14조①. <b>확인하지 못해 싣지 않은 것<\/b>: ① 급여 상한액의 <b>고시 원문<\/b>(시행령이 \"매년 고용노동부장관이 고시하는 금액\"으로 위임하고 있어 법령에는 금액이 없다 — 본문 수치는 보도자료 인용이며 <b>매년 바뀝니다<\/b>) ② 과태료의 <b>위반 횟수별 부과 금액<\/b>(시행령 별표가 첨부파일로만 제공됨) ③ 우선지원 대상기업의 <b>산업별 근로자수 기준<\/b>(시행령 별표1의 구체적 숫자). 셋 다 근처 값이나 2차 출처로 대체하지 않고 비워 두었습니다. <\/div>\n\n<div class=\"rel\"><b>📎 함께 보면 좋은 글<\/b> <a href=\"https://lifeinfo8975.blogspot.com/2026/08/2026-9-2426-5.html\">▸ 추석 연휴 휴일근로수당 계산 방법 총정리 (2026 · 9월 24~26일 · 5인 미만 사업장 제외)<\/a> <a href=\"https://lifeinfo8975.blogspot.com/2026/08/2026-2.html\">▸ 신생아 특례대출 신청 자격 소득요건 순자산 한도 금리 총정리 (2026, 2년 내 출산)<\/a> <a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01149161112.html\">▸ 아이돌봄서비스 정부지원 신청 방법 자격 이용요금 총정리 (2026 여름방학)<\/a> <\/div>\n\n<div id=\"ymyl-disclaimer\" style=\"font-size:13px;color:#888;margin-top:16px;line-height:1.6\">본 글은 정보 제공용이 야 한다(기계는 '사진인가'만 보고 '맞는 사진인가'는 사람이 본다).\n■ 기존글과의 구분: G2-02(양산선 도시철도)·G2-03(양산 통도사 미디어아트)은 양산 지역 정보이되 교통·문화 소재이고, 이 글은 양산시 기업 지원금 하나만 좁게 다룬다. G3-01(근로자 휴가지원사업)은 근로자 대상 지원금이지만 중앙부처 사업이고 이 글은 양산시 자체 사업이다. dupcheck 🟢\n■ 원본가치(V0) — 4축 전부:\n① 자격 판정표 — 기업 요건(소재지·상시근로자 산정기준·업종)과 근로자 요건(연령·출생연도·주소·정규직 4조건)을 각각 표로 갈라 \"나는 되는가\"에 바로 답하게 함. 특히 상시근로자수가 '고용보험 피보험자수 기준·일용직 제외'라는 산정방식은 공고문에만 있다.\n② 탈락·거절 사유 — 공고문에 흩어져 있는 **9가지**(지원 제외 기업 3 + 유의사항 지원제외 6)를 한자리에 모음. 배우자·4촌 이내 혈족 채용, 대표자 동일한 2개 기업 중복, 임금을 근로자 명의 아닌 통장 입금 등은 다른 곳에 정리된 데가 없다.\n③ 계산예시 — 금액(5명×200만원=1,000만원)과 **시기**를 둘 다. 공고문의 신청예시 2건을 그대로 싣고 거기서 1건을 파생해 '채용→6개월 고용→임금 6개월분 지급→신청→익월 15일 이내 입금'의 전체 시간축을 보여줌.\n④ 함정 — 최대 함정은 **사전 신청·약정 단계가 없다**는 것(다른 고용지원금과 반대). 그리고 **2025.1.1 이후 채용자도 소급 대상**이라는 점, 6개월이 아니라 **12개월**을 버텨야 제재를 안 받는다는 점.\n■ 검색설명(발행 후 편집화면에서 붙일 것):\n양산시가 40~64세 신중년 미취업자를 정규직으로 채용한 관내 제조업 기업에 1인당 200만원을 지원합니다. 공고문 원문으로 기업·근로자 자격 요건, 탈락 사유 9가지, 신청 시기와 지급 시점까지 정리했습니다.\n■ 확인 못 해 뺀 것(유보):\n① 양산시청 홈페이지 고시·공고 **상세 페이지 URL을 확정하지 못했다** — 검색으로 잡힌 상세 URL(notAncmtMgtNo=72627)을 열었으나 본문이 JS로 렌더링돼 정적 HTML에 '신중년'·'고용지원금' 문자열이 0건이라 이 공고가 맞는지 검증이 안 됐다. 그래서 공식 안내에는 **검증된 기업마당(bizinfo.go.kr) 상세 페이지**와 **양산시청 고시·공고 목록**만 걸었다.\n② **2026-09-05 현재 잔여 예산·잔여 인원은 확인할 수 없다.** 100명 선착순이고 공고문에 실시간 현황이 없으므로 \"아직 남았다\"고도 \"소진됐다\"고도 쓰지 않았고, 문의 전화로 확인하라는 안내만 넣었다.\n③ 「2026년 신중년고용지원금 지원사업 **지침**」은 공고문이 \"명시되지 않은 사항은 지침에 따름\"이라며 위임한 문서인데 공개된 곳을 찾지 못했다(1회 검색). 그래서 지침에만 있을 세부 판정 기준은 쓰지 않았다.\n④ **'미취업자'의 판정 기준(미취업 기간 등)이 공고문에 없다.** 구비서류에 '건강보험자격득실확인서(정규직 채용일 이전 1년간)'가 있으나 이것은 서류 요건이지 \"1년 이상 미취업이어야 한다\"는 자격 요건이 아니다 — 둘을 붙여 쓰지 않았고, 기준은 문의처 확인 사항으로 남겼다.\n⑤ 최저임금 시급 10,320원은 **공고문(2026.1.7) 기재값**으로만 인용했다(별도 고시 원문 미확인).\n\n[붙여넣는 법] Blogger 글쓰기 → 연필▾ → HTML 보기 → 아래 전체 붙여넣기 → 작성 보기 → 제목 입력 → 라벨(우리동네) → 발행\n----------------------------------------------------------------\n▼ 본문 HTML\n<div style=\"text-align:center;margin:0 0 18px\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tM x solid #f0dcb8;padding:10px 12px;text-align:center}\n.lsg th{background:#fdf0dc}\n.lsg td.l{text-align:left}\n.lsg .tip{background:#fdf4e6;border:1px solid #f0dcb8;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .tip b{color:#b8792a}\n.lsg .warn{background:#fff3f3;border:1px solid #f6cccc;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .warn b{color:#c0392b}\n.lsg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#fdf4e6;border:1px solid #f0dcb8;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#b8792a;margin-bottom:8px}\n.lsg .rel a{display:block;color:#9c6520;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#b3a894;text-decoration:none;margin:2px 0 6px}\n.lsg .tags{font-size:14px;color:#b8792a;margin-top:18px;line-height:1.9}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">우리동네<\/span>\n<p>양산에서 공장을 운영하면서 사람을 못 구해 애를 먹고 계신가요? 양산시는 <b>40~64세 양산시민 미취업자를 정규직으로 뽑은 관내 제조업 기업에 1인당 200만원<\/b>을 지원합니다(사업기간 2026.1.1~12.31). 「양산시 공고 제2026-59호」 공고문 원문으로 자격 요건과 탈락 사유, 신청 시기까지 확인했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 얼마를, 몇 명까지 주나<\/a><a href=\"#sec2\">2. 자격 판정표 — 우리 회사·우리 직원은 되나<\/a><a href=\"#sec3\">3. 계산예시 — 얼마를 언제 받나<\/a><a href=\"#sec4\">4. 탈락·거절 사유 9가지<\/a><a href=\"#sec5\">5. 놓치기 쉬운 함정 4가지<\/a><a href=\"#sec6\">6. 신청 방법과 구비서류<\/a><a href=\"#sec7\">공식 확인 페이지<\/a><\/div>\n<div class=\"sum\"><b>✅ 정리<\/b>\n<ul>\n<li>40~64세 양산시민 <b>미취업자<\/b>를 <b>정규직으로 채용하고 6개월 고용을 유지<\/b>하면 1인당 <b>200만원<\/b><\/li>\n<li>기업당 <b>5명 이내<\/b>, 사업 전체 <b>100명<\/b> — 예산 소진 시까지 <b>선착순<\/b>(사업기간 2026.1.1~12.31)<\/li>\n<li>🔴 <b>채용 전에 미리 신청하는 제도가 아닙니다<\/b> — 6개월분 임금을 다 지급한 <b>뒤에<\/b> 신청합니다. <b>2025.1.1 이후 채용자도 대상<\/b>입니다<\/li>\n<\/ul><\/div>\n<a class=\"cta\" href=\"#sec3\">👉 우리 회사가 얼마를 언제 받는지 계산해보기<\/a>\n\n<h2 id=\"sec1\">1. 얼마를, 몇 명까지 주나<\/h2>\n<p>「양산형 신중년고용지원금 지원사업」은 양산시가 2026년에 시행하는 기업 지원사업입니다. 공고문은 사업 목적을 <b>\"신중년의 일자리 창출과 관내 기업의 구인난 해소\"<\/b>라고 밝히고 있습니다.<\/p>\n<table>\n<tr><th>항목<\/th><th>내용<\/th><\/tr>\n<tr><td>지원금액<\/td><td><b>1인당 200만원<\/b><\/td><\/tr>\n<tr><td>지급 조건<\/td><td>정규직 채용 후 <b>6개월 고용 지속<\/b><\/td><\/tr>\n<tr><td>기업당 한도<\/td><td><b>5명 이내<\/b><\/td><\/tr>\n<tr><td>사업 규모<\/td><td>총 <b>100명<\/b><\/td><\/tr>\n<tr><td>사업기간<\/td><td>2026. 1. 1. ~ 2026. 12. 31.<\/td><\/tr>\n<tr><td>접수 방식<\/td><td><b>예산 소진 시까지 선착순<\/b><\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 기업 한 곳이 받을 수 있는 최대 금액<\/b> 기업당 5명까지이므로 <b>5명 × 200만원 = 1,000만원<\/b>이 한 기업의 상한입니다. 다만 100명이라는 전체 한도가 있고 선착순이므로, 5명을 채운다고 반드시 5명분이 나오는 것은 아닙니다.<\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 자격 판정표 — 우리 회사·우리 직원은 되나<\/h2>\n<p>요건이 <b>기업<\/b>과 <b>근로자<\/b> 양쪽에 걸려 있습니다. 둘 다 충족해야 합니다.<\/p>\n<h3>① 기업 요건<\/h3>\n<table>\n<tr><th>항목<\/th><th>기준<\/th><\/tr>\n<tr><td>소재지<\/td><td class=\"l\">양산시 소재 — <b>본사 또는 주공장<\/b>이 양산에 있으면 됩니다<\/td><\/tr>\n<tr><td>규모<\/td><td class=\"l\">상시근로자 <b>5인 이상<\/b><br>※ 상시근로자수는 <b>고용보험 피보험자수 기준<\/b>, <b>일용직근로자 제외<\/b><\/td><\/tr>\n<tr><td>업종·유형<\/td><td class=\"l\"><b>제조업 관련<\/b> 중소기업 <b>또는 중견기업<\/b><\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 상시근로자 5인은 '체감 인원'이 아니라 '고용보험 피보험자수'입니다<\/b> 일용직을 많이 쓰는 사업장은 현장 인원이 5명을 넘어도 고용보험 피보험자 기준으로는 5인에 못 미칠 수 있습니다. 신청 전에 <b>4대사회보험 사업장 가입자 명부<\/b>로 실제 숫자를 먼저 확인하세요 — 이 명부는 어차피 구비서류입니다.<\/div>\n<h3>② 근로자 요건<\/h3>\n<table>\n<tr><th>항목<\/th><th>기준<\/th><\/tr>\n<tr><td>연령<\/td><td class=\"l\"><b>채용 당시<\/b> 40세 이상 64세 이하<\/td><\/tr>\n<tr><td>출생연도<\/td><td class=\"l\"><b>2026년 채용<\/b>: 1962.1.1.~1986.12.31. 출생자<br><b>2025년 채용<\/b>: 1961.1.1.~1985.12.31. 출생자<\/td><\/tr>\n<tr><td>주소<\/td><td class=\"l\"><b>정규직 채용일 기준<\/b> 주민등록상 주소지가 양산시<\/td><\/tr>\n<tr><td>취업 상태<\/td><td class=\"l\">신중년 <b>미취업자<\/b>를 채용한 경우<\/td><\/tr>\n<tr><td>임금<\/td><td class=\"l\">최저임금(시급 10,320원) 이상 지급<\/td><\/tr>\n<\/table>\n<h3>③ '정규직'으로 인정되는 조건<\/h3>\n<p>공고문은 이 사업에서 인정하는 정규직을 따로 정의합니다. <b>아래를 모두<\/b> 만족해야 합니다.<\/p>\n<ul>\n<li><b>정년 보장<\/b> 또는 <b>계약기간을 정함이 없는<\/b> 근로자일 것(근로계약서로 확인)<\/li>\n<li><b>전일제<\/b> — 최소 <b>주 30시간 이상<\/b> 근무<\/li>\n<li><b>4대보험 필수 가입<\/b><\/li>\n<\/ul>\n<div class=\"tip\"><b>💡 여기서 '정년'이란<\/b> 공고문은 「고용상 연령차별금지 및 고령자고용촉진에 관한 법률」 제19조를 인용합니다 — <b>사업주는 근로자의 정년을 60세 이상으로 정하여야 한다<\/b>는 조항입니다. 즉 취업규칙·근로계약의 정년이 60세 미만이면 이 요건을 다시 살펴야 합니다.<\/div>\n<div class=\"warn\"><b>⚠️ '미취업자'의 기준은 공고문에 없습니다<\/b> 공고문은 \"신중년 미취업자\"라고만 적고 <b>미취업 기간이 얼마여야 하는지는 정하지 않았습니다<\/b>. 구비서류에 「건강보험자격득실확인서(정규직 채용일 이전 1년간)」가 있지만 이것은 <b>제출서류 요건이지 \"1년 이상 미취업이어야 한다\"는 자격 요건이 아닙니다<\/b> — 둘을 붙여서 해석하면 안 됩니다. 공고문에 없는 사항은 「2026년 신중년고용지원금 지원사업 지침」에 따르도록 위임돼 있으므로, 경계에 있는 경우라면 <b>민생경제과 일자리창출팀(055-392-3113)<\/b>에 먼저 확인하세요.<\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 계산예시 — 얼마를 언제 받나<\/h2>\n<h3>얼마인가<\/h3>\n<table>\n<tr><th>채용 인원<\/th><th>지원금<\/th><\/tr>\n<tr><td>1명<\/td><td>200만원<\/td><\/tr>\n<tr><td>3명<\/td><td>600만원<\/td><\/tr>\n<tr><td>5명(기업당 한도)<\/td><td><b>1,000만원<\/b><\/td><\/tr>\n<\/table>\n<h3>언제 받나 — 전체 시간축<\/h3>\n<p>이 사업의 지급 흐름은 <b>네 칸<\/b>으로 되어 있습니다. 신청은 세 번째 칸이지 첫 번째 칸이 아닙니다.<\/p>\n<p style=\"text-align:center;font-weight:700;background:#fdf4e6;border:1px solid #f0dcb8;border-radius:12px;padding:14px 10px\">정규직 채용 → 6개월 고용유지 + <b>6개월분 임금 지급 완료<\/b> → 신청 → <b>접수 후 익월 15일 이내<\/b> 기업 계좌 입금<\/p>\n<p>공고문은 신청 시기를 <b>\"정규직 채용일로부터 6개월분 임금(16일 이전 입사자에 대해 1개월 근무 간주)을 지급한 이후\"<\/b>로 정하고, 다음 두 가지 예시를 직접 들고 있습니다.<\/p>\n<table>\n<tr><th>입사 시점<\/th><th>임금 지급 기간<\/th><th>신청 시기<\/th><\/tr>\n<tr><td>2026. 1. 15.까지 입사<\/td><td>1~6월 임금 지급 후<\/td><td><b>7월<\/b> 신청<\/td><\/tr>\n<tr><td>2026. 1. 15. 이후 입사<\/td><td>2~7월 임금 지급 후<\/td><td><b>8월<\/b> 신청<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 위 규칙을 다른 달에 적용해보면<\/b> — <b>3월 10일에 1명을 정규직으로 채용<\/b>했다고 해봅시다.<br>① 10일 입사이므로 <b>16일 이전 입사자<\/b> → 3월을 1개월 근무로 칩니다<br>② <b>3~8월<\/b> 6개월분 임금을 다 지급합니다<br>③ 그 뒤인 <b>9월<\/b>에 신청서와 서류를 제출합니다<br>④ 접수됐다면 <b>10월 15일 이내<\/b>에 기업 계좌로 <b>200만원<\/b>이 들어옵니다<br>즉 채용 시점부터 돈이 들어오기까지 <b>약 7개월<\/b>이 걸립니다. ⚠️ 입사일이 15~16일 근처라면 어느 달부터 세는지가 갈리므로 문의처에 확인하는 편이 안전합니다.<\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 탈락·거절 사유 9가지<\/h2>\n<p>공고문에는 제외 사유가 <b>두 군데<\/b>에 나뉘어 실려 있습니다. 하나라도 걸리면 지원을 못 받으므로 한자리에 모았습니다.<\/p>\n<h3>기업이 걸리는 것 (3가지)<\/h3>\n<table>\n<tr><th>#<\/th><th>제외 사유<\/th><\/tr>\n<tr><td>①<\/td><td class=\"l\">타 재정사업과 <b>중복 참여<\/b>로 근로자가 중복지원을 받는 경우<\/td><\/tr>\n<tr><td>②<\/td><td class=\"l\"><b>4대보험 미가입 · 체납<\/b> 사업장<\/td><\/tr>\n<tr><td>③<\/td><td class=\"l\"><b>임금체불<\/b>로 명단이 공개 중인 사업장<\/td><\/tr>\n<\/table>\n<h3>근로자·신청 건이 걸리는 것 (6가지)<\/h3>\n<table>\n<tr><th>#<\/th><th>제외 사유<\/th><\/tr>\n<tr><td>④<\/td><td class=\"l\">신청일 현재 <b>퇴사자<\/b> 및 <b>1년 이내 재입사자<\/b><\/td><\/tr>\n<tr><td>⑤<\/td><td class=\"l\"><b>채용일 이후<\/b> 양산시에 주소를 두지 않은 근로자<\/td><\/tr>\n<tr><td>⑥<\/td><td class=\"l\">근로자가 사업주의 <b>배우자, 직계 존·비속, 4촌 이내의 혈족·인척<\/b>인 경우<\/td><\/tr>\n<tr><td>⑦<\/td><td class=\"l\">임금을 <b>근로자 명의가 아닌 다른 사람 명의 통장<\/b>에 입금한 경우<\/td><\/tr>\n<tr><td>⑧<\/td><td class=\"l\">국가·공공기관 등 <b>타 재정지원사업에서 인건비 보전 성격의 지원금<\/b>을 받은 경우<\/td><\/tr>\n<tr><td>⑨<\/td><td class=\"l\"><b>대표자가 동일한 2개 기업<\/b>에서 이미 지급받은 대상자를 다시 신청하는 경우<\/td><\/tr>\n<\/table>\n<div class=\"warn\"><b>⚠️ ⑤번을 특히 조심하세요<\/b> 주소 요건은 <b>채용일에만<\/b> 맞으면 되는 것이 아닙니다. 자격 요건은 \"정규직 채용일 기준\" 양산시 주소이지만, 제외 사유는 <b>\"채용일 이후 양산시에 주소를 두지 않은 근로자\"<\/b>입니다. 즉 채용 후 6개월 사이에 직원이 양산 밖으로 이사하면 그 건은 날아갈 수 있습니다. 채용할 때 이 점을 미리 알려두는 편이 좋습니다.<\/div>\n<div class=\"warn\"><b>⚠️ ⑦번은 선의로도 걸립니다<\/b> 근로자가 개인 사정으로 배우자 계좌를 알려주는 경우가 실제로 있습니다. 그렇게 입금하면 <b>제외 대상<\/b>입니다. 임금은 반드시 <b>근로자 본인 명의 통장<\/b>으로 지급하세요 — 어차피 구비서류에 「임금대장 및 입금확인증 사본(6개월분)」이 있어서 그대로 드러납니다.<\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 놓치기 쉬운 함정 4가지<\/h2>\n<div class=\"warn\"><b>⚠️ 함정 ① 채용 전에 미리 신청·약정하는 절차가 없습니다<\/b> 지원금이라고 하면 <b>먼저 신청해 두고 채용해야 하는 것<\/b>이라 짐작하기 쉽습니다. 이 사업은 그렇지 않습니다 — 공고문의 신청 절차는 <b>\"6개월 고용기간 충족 후 제출서류 구비하여 신청\"<\/b> 하나뿐이고, 사전 신청·약정 단계 자체가 공고문에 없습니다. <b>먼저 뽑고, 6개월 고용하고, 임금 6개월분을 다 지급한 뒤에 신청<\/b>합니다. 반대로 채용하자마자 신청하러 가도 접수될 단계가 아닙니다.<\/div>\n<div class=\"warn\"><b>⚠️ 함정 ② 2026년 사업인데 <u>2025년 채용자<\/u>도 대상입니다<\/b> 공고문의 지원기준은 <b>\"2025. 1. 1. 이후 신중년을 정규직으로 채용되어 6개월 이상 고용유지 사업장\"<\/b>입니다. 2026년 사업이라고 해서 2026년에 뽑은 사람만 되는 것이 아닙니다. <b>작년에 뽑아 지금까지 근무 중인 40~64세 양산시민 직원이 있다면 이미 6개월 요건을 채웠을 가능성이 큽니다<\/b> — 그 경우 바로 신청할 수 있습니다. 이 사업에서 가장 놓치기 쉬운 부분입니다. (연령은 <b>채용 당시<\/b> 기준이므로 2025년 채용자는 1961.1.1.~1985.12.31. 출생자입니다.)<\/div>\n<div class=\"warn\"><b>⚠️ 함정 ③ 6개월로 끝이 아닙니다 — 12개월을 봅니다<\/b> 지원금은 6개월 고용유지로 받지만, 사후관리는 <b>12개월<\/b>입니다. 공고문은 <b>\"신규 채용한 날로부터 12개월 이내 해고 시 당해연도 고용 지원사업 참여 제한\"<\/b>이라고 정합니다. 받고 나서 곧바로 내보내면 그해의 다른 신청 건까지 막힙니다.<br>※ 다만 <b>근무태만 등 근로자의 귀책사유로 인한 해고<\/b>나 <b>개인사정에 따른 자발적 퇴사<\/b>는 제외됩니다. 그리고 지원대상자가 12개월 이내 퇴사하면 <b>고용보험 상실내역서를 제출<\/b>해야 합니다.<\/div>\n<div class=\"warn\"><b>⚠️ 함정 ④ 100명 선착순 — 신청 전에 잔여 인원을 전화로 확인하세요<\/b> 사업기간은 2026년 12월 31일까지지만 <b>예산이 소진되면 그 시점에 끝납니다<\/b>. <b>이 글은 잔여 예산·잔여 인원을 확인해 드릴 수 없습니다<\/b> — 공고문에 실시간 현황이 없기 때문입니다. 6개월 임금을 다 지급하고 서류까지 갖춘 뒤에 마감을 알게 되면 손해가 크므로, <b>준비를 시작하는 시점에 055-392-3113으로 잔여 여부를 먼저 물어보세요.<\/b><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 신청 방법과 구비서류<\/h2>\n<h3>신청 방법<\/h3>\n<ul>\n<li><b>방문<\/b> — 양산시청 민생경제과 일자리창출팀<\/li>\n<li><b>우편<\/b><\/li>\n<li><b>이메일<\/b> — <b>lsk10160@korea.kr<\/b> ※ 공고문은 <b>메일 전송 후 반드시 수신 여부를 전화로 확인<\/b>하라고 명시합니다<\/li>\n<\/ul>\n<h3>구비서류 8종<\/h3>\n<ol>\n<li>지원금 신청서(서식 1)<\/li>\n<li>사업자등록증 사본<\/li>\n<li>4대사회보험 사업장 가입자 명부(전체인원)<\/li>\n<li>사업주 통장 사본<\/li>\n<li>개인정보 이용에 대한 동의서(서식 2)<\/li>\n<li>근로계약서 사본<\/li>\n<li>임금대장 및 입금확인증 사본(<b>6개월분<\/b>)<\/li>\n<li>주민등록 초본 및 건강보험자격득실확인서(<b>행정정보 공동이용으로 대체 가능<\/b>)<\/li>\n<\/ol>\n<div class=\"tip\"><b>💡 서류를 줄이는 방법<\/b> 8번은 <b>행정정보 공동이용에 동의하면 제출하지 않아도 됩니다<\/b>(동의서에 체크란이 있습니다). 미동의 시에만 주민등록표 초본과 건강보험자격득실확인서(정규직 채용일 이전 1년간)를 직접 떼서 내면 됩니다. 동의하지 않아도 <b>불이익은 없다<\/b>고 공고문이 명시하고 있습니다.<br>또 2·4·5·6번(사업자등록증·사업주 통장·개인정보 동의서·근로계약서)은 서식의 구비서류 안내에 <b>\"최초신청시\"<\/b>로 표시돼 있습니다. 서류는 <b>순서대로 편철해 PDF 1개 파일<\/b>로 제출합니다.<\/div>\n<div class=\"tip\"><b>💡 지급 시점과 서류 보완<\/b> 신청서 접수 후 <b>익월 15일 이내<\/b>에 기업 계좌로 입금됩니다. 다만 <b>서류가 미비하면 보완이 끝난 뒤에야 접수<\/b>되므로, 그만큼 입금도 밀립니다. 6개월분 임금대장·입금확인증을 미리 정리해 두는 것이 가장 확실합니다.<\/div>\n<div class=\"warn\"><b>⚠️ 부정수급 제재<\/b> 지원금을 부정하게 신청·수급한 사업자는 <b>당해연도 신중년 지원사업 참여가 금지<\/b>되고, 기간이 지나도 <b>부정수급액을 반납할 때까지 참여가 계속 금지<\/b>됩니다. 또 지원금을 받은 사업장은 고용유지 실태 파악을 위한 <b>사업장 점검<\/b> 대상이 됩니다.<\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.bizinfo.go.kr/sii/siia/selectSIIA200Detail.do?pblancId=PBLN_000000000117306\" target=\"_blank\" rel=\"nofollow\">▸ 기업마당(중소벤처기업부) — 양산시 2026년 신중년고용지원금 지원사업 참여 기업 모집 공고 (공고문 HWP 첨부)<\/a><a href=\"https://www.yangsan.go.kr/portal/saeol/gosi/list.do?mid=0102010000\" target=\"_blank\" rel=\"nofollow\">▸ 양산시청 — 고시·공고 목록 (공고 제2026-59호 검색)<\/a><a href=\"https://www.yangsan.go.kr/main.do\" target=\"_blank\" rel=\"nofollow\">▸ 양산시청 대표 누리집<\/a><\/div>\n<div class=\"src\"><b>📌 출처·기준일<\/b> 이 글의 지원금액(200만원)·기업당 한도(5명)·사업규모(100명)·사업기간(2026.1.1~12.31)·기업 및 근로자 자격 요건·정규직 인정 조건·출생연도 범위·지원기준(2025.1.1 이후 채용)·제외 사유 9가지·신청 시기와 예시·구비서류 8종·지급 시점(접수 후 익월 15일 이내)·사후관리(12개월)·부정수급 제재·문의처는 모두 <b>「양산시 공고 제2026-59호」 2026년「양산형 신중년고용지원금 지원사업」참여 기업 모집 공고<\/b>(2026. 1. 7. 양산시장) 공고문 원문(HWP 첨부)을 기업마당(bizinfo.go.kr)에서 직접 내려받아 확인했습니다(<b>2026-09-05 기준<\/b>). 최저임금 시급 10,320원은 <b>이 공고문에 기재된 값<\/b>을 그대로 인용한 것이며 별도 고시 원문은 확인하지 않았습니다. 「고용상 연령차별금지 및 고령자고용촉진에 관한 법률」 제19조(정년 60세 이상)는 공고문이 인용한 조문입니다. <b>양산시청 홈페이지의 해당 공고 상세 페이지 URL은 본문이 자바스크립트로 렌더링돼 검증에 실패<\/b>했으므로, 공식 안내에는 검증된 기업마당 상세 페이지와 양산시청 고시·공고 목록을 걸었습니다. <b>2026년 9월 5일 현재 잔여 예산·잔여 인원은 공개된 자료로 확인할 수 없어 이 글에 싣지 않았습니다<\/b> — 반드시 문의처로 확인하시기 바랍니다. 공고문이 위임한 「2026년 신중년고용지원금 지원사업 지침」은 공개된 곳을 찾지 못해, 지침에만 있을 세부 판정 기준은 쓰지 않았습니다.<\/div>\n<div class=\"rel\"><b>📎 함께 보면 좋은 글<\/b>\n<a href=\"https://lifeinfo8975.blogspot.com/2026/06/2026_01027175492.html\">▸ 양산 광역교통 양산선 도시철도 개통 부산 울산 광역철도 노선 총정리 (2026)<\/a>\n<a href=\"https://lifeinfo8975.blogspot.com/2026/08/2026_01925250190.html\">▸ 양산 통도사 국가유산 미디어아트 2026 관람 방법 총정리<\/a>\n<a href=\"https://lifeinfo8975.blogspot.com/2026/06/2026-40.html\">▸ 근로자 휴가지원사업 신청 방법 대상 지원금액 총정리 (2026 40만 원 여행비)<\/a>\n<\/div>\n<div id=\"ymyl-disclaimer\" style=\"font-size:13px;color:#888;margin-top:16px;line-height:1.6\">본 글은 정보 제공용이며, 실제 지원 대상 여부·지원금액·잔여 예산·신청 절차는 양산시 공고문 및 양산시청 민생경제과 일자리창출팀(055-392-3113) 공식 안내에 따릅니다. 선착순 사업이므로 신청 전 잔여 여부를 반드시 확인하시기 바랍니다.<\/div>\n<div class=\"tags\">🏷️ #신중년고용지원금 #양산시지원금 #신중년일자리 #중장년채용지원금<\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 수치·절차·연락처는 <b>정부 부처와 공공기관 공식 자료를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n"}]},"pace":{"date":"2026-09-05","count":4,"posts":[{"title":"본인부담상한액 초과금 환급 총정리 (226만명·3조760억, 9월 2일부터 지급)","published":"2026-09-05T15:38:16.000+09:00"},{"title":"카드 포인트 계좌입금 신청 방법 총정리 (여신금융협회·금융결제원 공식 안내 기준)","published":"2026-09-05T14:44:47.000+09:00"},{"title":"가정용 소화기 내용연수 확인 방법 총정리 (2026 분말소화기 10년·아파트도 해당)","published":"2026-09-05T14:42:36.000+09:00"},{"title":"정부지원 590억 추석 농축산물 할인 총정리 (9월 3일~23일, 어디서 사야 제일 싼가)","published":"2026-09-05T12:19:58.000+09:00"}],"soft":1,"hard":9999,"state":"warn","backlog":2,"backlog_codes":["A5-10","G2-04"],"backlog_max":99,"backlog_over":false,"lanes":{"info":{"label":"일일·정보성","n":1,"codes":["A5-10"]},"etc":{"label":"기타","n":1,"codes":["G2-04"]},"user":{"label":"사용자 추천","n":0,"codes":[]}},"error":"","checked_at":"2026-09-0 지 — 사회통념 범위를 넘겨 과세된 탈락 유형 ③10년 합산 함정(동일인=직계존속은 배우자 포함, 10년 내 합계 1천만원 이상이면 가산) ④계산예시: 아버지가 자녀에게 2억 이체 → 과세표준 1억5천 → 세율 20%·누진공제 1천만원 → 산출세액 2천만원, 신고세액공제 적용 후 실제 납부액 ⑤빌려준 돈이면 차용증 — 요건·적정이자율·국세청이 대여로 인정 안 한 사례 ⑥신고 방법(홈택스)·기한 넘겼을 때 가산세","facts":"국세청 증여세 세액계산 흐름도(2026-08-20 취득) https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=2340&cntntsId=7728 — 증여재산공제 10년 누계 한도: 배우자 6억원 / 직계존속 5천만원(수증자 미성년 2천만원) / 직계비속 5천만원 / 기타친족 1천만원 / 기타 없음. 비과세=사회통념상 인정되는 피부양자의 생활비·교육비 등. 증여재산가산액=증여일 전 동일인(직계존속은 그 배우자 포함)으로부터 10년 이내 증여 과세가액 합계 1천만원 이상이면 가산. 세율/누진공제=1억이하 10%·5억이하 20%(1천만원)·10억이하 30%(6천만원)·30억이하 40%(1억6천만원)·30억초과 50%(4억6천만원). 세대생략 할증 30%(미성년자 20억 초과분 40%). || 신고기한(2026-08-20 취득) https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=2339&cntntsId=7727 — 증여받은 날이 속하는 달의 말일부터 3개월 이내. || 🔴발행 전 반드시 별도 확인(이번 조회로 못 얻음, 추정 금지): 혼인·출산 증여재산공제 1억원의 현행 여부와 요건 / 금전대차 적정이자율(4.6%설)과 무상대출 이자 증여 간주 기준금액 / 신고세액공제율 / 자금출처조사 기준. 확인 안 되면 그 수치는 빼고 '홈택스·126 확인'으로 대체할 것.","src":"lifeinfo-daily-topics","dup":"🟢 0.20","state":"approved","added":"2026-08-20T09:11:44","state_at":"2026-08-20T11:35:33","decision":"사장님 승인 (8/20 카톡 4번)","verify":{"mark":"✅","notes":[],"at":"2026-08-20T09:30:06"},"reported_at":"2026-08-20T09:31:30","draft":true},{"code":"B2-11","title":"신생아 특례대출 신청 자격 소득요건 순자산 한도 금리 총정리 (2026 · 2년 내 출산)","lane":"info","rank":"rec","why":"기한+금액변경 둘 다 있다. ①요건이 '대출접수일 기준 2년 내 출산'이라 2024년 하반기 출생아 가구는 2026년 하반기가 마지막 신청 창구다(가구마다 굴러가는 마감이라 더 잘 놓친다) ②순자산 요건 5.11억원은 '2026년도 기준'으로 매년 고시되는 금액이다.","summary":"🔴제목 판정을 밝혀 둔다 — 제목에 '디딤돌'을 넣으면 🟡 0.50(B2-08 디딤돌·버팀목), 빼면 🟢 0.33 이다. 빼고 냈지만 점수가 좋아서가 아니라 라이브 본문 실측 때문이다: B2-08 본문에 '신생아' 0회·'특례' 1회로 이 등급을 아예 안 다룬다. 다만 초안은 사실상 디딤돌 상품 글이 되므로 pubqueue·bodydup 단계에서 B2-08 겹침이 다시 올라온다 — 이미 본 사안임을 여기 남긴다. ┃구성 ①자격 4요건 표(2년 내 출산·성년 세대주·세대 전원 무주택·2023.1.1. 이후 출생아) ②소득 1.3억(맞벌이 2억)·순자산 5.11억 판정 계산예시 — 맞벌이 경계선에서 갈리는 사례 ③일반 디딤돌 vs 신생아 특례 판단형 비교표(한도 4억, 금리 1.8~4.5%) ④탈락 사유: 2022년생이라 제외 / 접수일에 이미 2년 경과 / 주택 9억 초과 / 85㎡ 초과 ⑤특례금리 5년이 끝난 뒤(추가 출산 시 최장 15년) ⚠️전세(신생아 특례 버팀목) 수치는 공식 페이지 HTTP 406 으로 미확인 — 초안에서 재시도, 못 얻으면 그 항목은 빼고 쓴다.","facts":"출처=주택도시기금 신생아 특례 디딤돌 https://nhuf.molit.go.kr/FP/FP05/FP0503/FP05030801.jsp (2026-08-21 실측) / 대출대상=대출접수일 기준 2년 내 출산·입양(2023.1.1. 이후 출생아), 민법상 성년 세대주, 세대원 전원 무주택 / 소득=부부합산 연 1.3억원 이하(맞벌이 2억원 이하) / 순자산=5.11억원 이하(2026년도 기준) / 대상주택=평가액 9억원 이하·전용 85㎡ 이하(수도권 제외 읍면 100㎡) / 한도=최대 4억원, LTV 70%(생애최초 80%, 수도권·규제지역 70%), DTI 60% / 금리=1.8~4.5%, 특례금리 기본 5년·추가 출산 시 최장 15년","src":"lifeinfo-daily-topics","dup":"🟢 0.33","state":"approved","added":"2026-08-21T09:14:16","state_at":"2026-08-21T13:56:55","draft":true},{"code":"A1-13","title":"양육비 안 주는 배우자 제재 신청 방법 총정리 (운전면허 정지·출국금지·명단공개 요건)","lane":"info","rank":"alt","why":"개정 anchor — 제재 요건이 최근 2년 새 두 번 넓어졌다. 2024.9.27 이행명령, 2025.7.1 일시금지급명령이 각각 제재 사유로 추가돼 '감치 결정이 없어도' 면허정지·출국금지·명단공개를 신청할 수 있게 됐는데, 이 사실이 사실상 안 알려져 있다. 2026-08-13 성평등가족부가 「양육비 채무 불이행자 제재조치 및 이행 방안」 보도자료를 냈다(목록에서 제목·날짜만 실측, 본문은 열지 못했다 — 근거로 세지 말 것).","summary":"⚖️바 판정을 밝혀 둔다 — 시즌·마감형 anchor 는 아니다. 추천(B2-11)보다 낮은 바에서 일부러 냈으니, 재고가 5/5 에 닿거나 다른 루틴 제안이 더 강하면 drop 이 맞다. ┃구성 ①제재 4종(운전면허정지·출국금지·명단공개·감치) 요건 비교표 — '얼마를 안 주면 무엇이 걸리는가'를 금액·기(期)로 명시 ②핵심 각도 = '감치가 있어야만 된다'는 오해 깨기: 2024.9.27부터 이행명령만으로, 2025.7.1부터 일시금지급명령 30일 미이행만으로 신청된다 ③신청 절차(양육비이행관리원 등기우편)와 실제 처분 주체·기간(경찰청 100일 면허정지 / 법무부 6개월 출국금지 / 성평등가족부 3년 명단공개) ④탈락 사유: 집행권원 없음 · 미이행액이 3천만원과 3기 어느 쪽에도 못 미침 ⑤양육비 선지급제(중위 150%·자녀 1인당 월 20만원)와의 연결. ※선지급제 단독 글은 2026년 변경 공지가 없어(양육비이행관리원 공지·성평등가족부 보도자료 양쪽 실측) '지금' 이유가 없다고 보고 뺐다.","facts":"출처=양육비이행관리원 제재조치 안내 https://www.childsupport.or.kr/lay1/S1T15C121/contents.do (2026-08-21 실측) / 운전면허정지=감치결정(2021.6.10.~) 또는 이행명령(2024.9.27.~, 미이행 3천만원 이상 또는 3기 이상) 또는 일시금지급명령(2025.7.1.~, 30일 내 미이행) → 경찰청 100일 정지, 도로교통법 제93조1항18호 / 출국금지=감치결정(2022.8.16.~ 3천만원 이상 또는 3기 이상)·이행명령·일시금지급명령 → 법무부 6개월(연장가능), 출입국관리법 제4조1항5호 / 명단공개=성평등가족부 3년, 양육비이행법 시행령 제17조의4제2항 / 신청주체=양육비 채권자, 등기우편 / 선지급제 참고=중위소득 150% 이하·자녀 1인당 월 최대 20만원·만 18세까지, 시행 2025.7.1 (https://www.childsupport.or.kr/lay1/S1T134C136/contents.do)","src":"lifeinfo-daily-topics","dup":"🟢 0.25","state":"dropped","added":"2026-08-21T09:14:39","state_at":"2026-08-21T13:16:36","decision":"키워드 실측으로 갈렸다(2026-08-21) — 양육비 미지급 검색 2,760 · 경쟁도 25.61 vs 같은 info 레인의 B2-11 신생아 특례대출 검색 137,800 · 경쟁도 0.599. 검색량 50배 · 경쟁도 43배 차이다. 루틴 자신도 초안에 '시즌·마감형 anchor 가 아니다. 추천보다 낮은 바에서 일부러 냈으니 다른 제안이 더 강하면 drop 이 맞다' 고 밝혔고 그 조건이 성립했다. 🔴 글감 가치가 없어서가 아니다 — 2024.9.27 이행명령·2025.7.1 일시금지급명령 추가는 실제 개정 anchor 이고 사회적 가치도 크다. 다만 지금 우리 목표는 색인 회복이고, 검색이 안 되는 글은 그 목표에 기여하지 못한다. 제재 관련 개정이 한 번 더 있거나 언론에 크게 다뤄질 때 다시 제안할 것","draft":false},{"code":"F1-13","title":"영국 ETA 전자여행허가 신청 방법 수수료 유효기간 총정리 (2026)","lane":"etc","rank":"rec","why":"탑승 거부로 강제되기 시작한 제도다(gov.uk 'No permission, no travel'). 2026년 4월자 내무부 ETA 팩트시트가 따로 나와 있다. 결정적으로 우리 F1-11(유럽 EES·ETIAS)을 읽은 독자가 '영국도 그 제도로 되는 줄' 알고 안 받는 혼동이 실제 탑승거부로 이어진다 — 영국은 EU 밖이라 별개 신청이다. 가을·겨울 유럽 여행 준비 시기가 지금이다.","summary":"①ETA가 비자가 아니라 '탑승 전 항공사가 확인하는 허가'라는 점을 첫 화면에서 못박는다 ②EU ETIAS·EES vs 영국 ETA 3열 비교표(적용 지역·신청처·비용·유효기간·환승 필요 여부)에 '서로 대체되나' 행 ③신청 절차 ④수수료 원화 환산을 가족 총액까지 끝까지 계산 ⑤거절·지연 시 대처 ⑥환승만 해도 필요한가 = 함정 항목","facts":"수수료 20파운드 (gov.uk/guidance/apply-for-an-electronic-travel-authorisation-eta · 2026-08-21 본문 표기 직접 확인 · 인상 이력은 확인 안 됐으므로 '올랐다'고 쓰지 말 것) / 최대 6개월 체류 (동 페이지) / 2026년 4월 내무부 ETA 팩트시트 homeofficemedia.blog.gov.uk/electronic-travel-authorisation-eta-factsheet-april-2026/ / gov.uk/government/news/uk-enforces-digital-permission-to-travel ⚠️한국 국적자 적용 여부·유효기간 연수·처리시간은 원문 미확인 — 초안 착수 전 재확인, 실패하면 뺀다","src":"lifeinfo-travel-prep","dup":"🟢 0.40","state":"approved","added":"2026-08-21T21:26:18","state_at":"2026-08-24T12:54:19","verify":{"mark":"🟡","notes":["🟡 출처 URL 이 없음(공식 .go.kr 원문 링크를 달 것)","🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall"],"at":"2026-08-24T12:26:21"},"reported_at":"2026-08-24T09:15:10","draft":false},{"code":"G4-04","title":"가을 대하 흰다리새우 구별 방법 시세 원산지 총정리 (2026 제철)","lane":"etc","rank":"rec","why":"9월이 대하 제철 시작(국립수산물품질관리원 9월 추천 수산물). 가을 새우축제·수산시장 성수기에 흰다리새우를 대하로 파는 표시 문제가 매년 반복되는데, 독자가 현장에서 눈으로 판별할 기준을 아무도 표로 안 준다. 시즌 앵글이라 9월 첫 주 안에 나가야 값이 있다.","summary":"①현장 판별 3열 표(구분/대하/흰다리새우: 이마뿔 길이·수염 길이·꼬리색·원산). ②'익히면 둘 다 붉어진다' 등 통하지 않는 구별법을 따로 표기(함정). ③가격 계산예시 — kg 시세 차이로 4인 가족 1kg 구매 시 차액을 끝까지 계산(시세는 수산물유통정보 fips.go.kr 실측 후 기준일 명시). ④'자연산 대하'라는 표현이 왜 붙는지(대하는 양식이 사실상 없음) ⑤표시가 틀렸을 때 신고처. 썸네일=G라 실사진 필수인데 insta/_src 에 새우·수산시장 사진이 없다(전어에 쓴 fresh_sardines_market 재사용 금지) → Pexels 에서 새우/수산시장 사진 신규 확보 필요.","facts":"[공식확인] 국립수산물품질관리원 수산물안전정보 '9월 수산물소개' https://www.fsis.go.kr/front/contents/cmsView.do?cate_id=0301&cnts_id=37529 — 대하: 이마뿔이 코끝보다 길게 나와 제2촉각 두 번째 마디를 훨씬 넘음·몸통보다 수염이 길다·꼬리가 초록빛·우리나라와 중국의 한정된 지역에만 분포 / 흰다리새우: 이마뿔이 짧아 제2촉각 두 번째 마디를 넘지 않음·중남미 태평양 해역 원산·2003년 국내 이식 양식. [미확인=초안 전 필수] 대하·흰다리새우 kg 시세(fips.go.kr) · 원산지/품명 거짓표시 과태료 조문 · 남당항 대하축제 2026 기간(홍성군 공식 페이지에 기간 미기재 — 실측 2026-08-24). KW=미측정","src":"lifeinfo-travel-prep","dup":"🟢 0.33","state":"approved","added":"2026-08-24T21:15:54","state_at":"2026-08-25T09:15:45","decision":"루틴이 요청한 판단을 내린다 — 이번 회차에서 뺀다. 승인된 G4-03(가을 전어)이 아직 미발행이라 dupcheck 0.33 은 겹침 없음을 보증하지 못한다(전어 본문을 못 보고 낸 점수다). 둘 다 서해 가을 제철 수산물로 독자 체감이 겹친다. 남당항 대하축제는 9/4~11/8 로 9주간 열려 전어축제(9/4~9/6)보다 시효가 훨씬 길다 — 전어 발행 후 2주 뒤 제안해도 늦지 않다.","verify":{"mark":"🟡","notes":["🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall"],"at":"2026-08-25T09:14:34"},"reported_at":"2026-08-24T22:23:48","draft":false},{"code":"A5-07","title":"추석 연휴 휴일근로수당 계산 방법 총정리 (2026 · 9월 24~26일 · 5인 미만 사업장 제외)","lane":"info","rank":"rec","why":"시즌+쟁점. 2026 추석 연휴는 9/24(목)~9/26(토)로 딱 한 달 앞이고 근무 스케줄·수당이 지금 정해진다. 핵심 쟁점은 '연휴가 토요일과 겹쳤는데 대체공휴일이 붙느냐' — 설·추석은 다른 공휴일과 대체 요건이 다르다는 점이 독자 기대와 어긋나 검색이 몰리는 지점이다. 🔴대체공휴일 적용 여부는 발행 전 「관공서의 공휴일에 관한 규정」 제3조 원문으로 확정할 것(이번 회차 미확정).","summary":"①첫 화면에서 전제를 깬다 — '추석에 일하면 무조건 1.5배'가 아니다(5인 미만 사업장은 공휴일 유급휴일·가산수당 자체가 적용 제외 = 탈락 사유). ②월급제 vs 시급제 3열 비교표(공식 문구 | 월급제 실제 | 시급제 실제) — 월급제는 유급휴일수당이 이미 월급에 포함돼 추가 지급분 계산이 다르다. ③계산예시를 끝까지 계산: 통상시급 12,000원 가정으로 8시간 근무 / 10시간 근무(8h초과분) / 야간(22~06시) 중복가산 3케이스의 최종 수령액. ④2026 추석 3일(9/24~26)에 각각 얼마인지 날짜별 표 — 9/26은 토요일이라 무급휴무일인 사업장에서 처리가 갈린다. ⑤'대체공휴일 없음' 판정 근거를 규정 원문으로 제시. ⑥확인 못 한 항목은 뺐다는 사실과 확인처를 본문에 밝힌다.","facts":"🔴이번 회차 공식 전사 실패 — 수치를 확정으로 쓰지 말 것. law.go.kr 은 iframe+JS 라 WebFetch/curl 로 조문 본문이 안 나온다(실측: 명칭만 반환). 조문팝업 lsLinkProc URL 은 2014년 구법(제56조 제2항 없는 판)을 반환했다 = 구버전 함정. 초안 단계에서 브라우저(claude-in-chrome)로 전사할 것. 확인 대상: 근로기준법 제56조②(8시간 이내/초과 휴일근로 가산률) · 제55조②+시행령 제30조②(관공서 공휴일의 유급휴일화, 상시 5인 이상) · 「관공서의 공휴일에 관한 규정」 제3조(설날·추석 연휴 대체공휴일 요건) · 2026 추석 연휴 날짜는 인사혁신처/관보로 확정. KW=미측정 — 무인 실행이라 브라우저 2대 중 선택 불가(키워드마스터 접근 실패). 큐 적재 전 반드시 실측할 것.","src":"lifeinfo-daily-topics","dup":"🟢 0.25","state":"approved","added":"2026-08-23T09:13:30","state_at":"2026-08-23T15:09:47","verify":{"mark":"🟡","notes":["🟡 출처 URL 이 없음(공식 .go.kr 원문 링크를 달 것)","🟡 키워드 미측정 — 검색량을 모르면 '아무도 안 찾는 글'을 승인하게 된다. whereispost.com/keyword 에서 대표 키워드를 재고 facts 에 'KW=<키워드> 검색 <총합> 문서 <문서수> 경쟁도 <비율>' 로 적을 것","ℹ️ 재고 3/5 (큐 2 + 승인·미적재 1) — 여유 2"],"at":"2026-08-23T14:02:20"},"reported_at":"2026-08-23T13:45:19","draft":true},{"code":"A5-08","title":"근로복지공단 생활안정자금 융자 신청 방법 대상 한도 금리 총정리 (2026)","lane":"info","rank":"alt","why":"시즌(추석 목돈 수요 — 혼례·장례·의료비가 명절 전후로 몰린다) + 2026년 융자사업 기준 소득요건이 월평균 268만원으로 고시된 상태. 🔴솔직히 밝힌다: 이 건은 rec 과 달리 '하드 기한'이 없다(정부24 페이지에 예산 소진 마감 기재 없음 — 조기마감을 근거로 쓰지 말 것). 연 1.5% 정책융자인데 인지도가 낮다는 점이 실질 근거이므로, 특별이슈급 판단은 이부장이 내려 주기 바란다.","summary":"①행동요구형(신청·자격·한도·금리)이라 rec(계산형)과 글 모양이 겹치지 않는다. ②융자항목별 한도 구간표 — '최대 2,000만원'이라는 범위가 아니라 의료비/장례비/노부모부양비/혼례비/자녀양육비/소액생계비 항목별로 얼마인지 표로 확정해 준다(독자 질문은 '내 경우 얼마'다). ③탈락 사유를 앞에 둔다 — 월평균소득 268만원 초과, 신용보증 심사. 일용근로자는 소득요건 미적용이라는 예외도 함께. ④계산예시를 끝까지: 1,000만원을 연 1.5%+신용보증료 0.9%로 1년 거치 3년 상환 시 월 상환액과 총 이자를 실제로 계산(시중 신용대출과 비교표). ⑤신청 경로(근로복지공단 근로복지서비스 / 정부24)와 필요서류.","facts":"정부24 공식 서비스 페이지에서 2026-08-23 직접 확인 — https://www.gov.kr/portal/service/serviceInfo/B49000100006 · 소득요건 월평균소득 268만원 이하(2026년 융자사업 기준), 일용근로자는 소득요건 미적용 · 항목별 한도: 의료비 1,000만(실제 비용 내)·장례비 1,000만·노부모부양비 2,000만·혼례비 1,250만·자녀양육비 2,000만·소액생계비 200만 이내, 1인당 최대 2,000만 · 금리 연 1.5%, 1년 거치 3년 또는 1년 거치 4년 원금균등분할상환, 신용보증료 연 0.9% · 소관 근로복지공단 복지사업국(1588-0075). 🔴예산 소진 시 마감 여부는 해당 페이지에 기재가 없다 — 발행 전 근로복지공단 공고로 확인하고, 확인 안 되면 그 문장을 쓰지 말 것. KW=미측정(무인 실행 — 브라우저 2대 중 선택 불가). 큐 적재 전 실측 필요.","src":"lifeinfo-daily-topics","dup":"🟢 0.33","state":"dropped","added":"2026-08-23T09:13:56","state_at":"2026-08-23T13:44:55","decision":"루틴 자신이 하드 기한이 없다고 밝혔다(정부24 페이지에 예산소진 마감 기재 없음). 선별 기준은 새 주제인가가 아니라 특별이슈급인가 — 연 1.5% 정책융자의 낮은 인지도는 상시 가치이지 지금 이유가 아니다. 근로복지공단 공고에 예산소진·마감이 뜨거나 소득요건(월 268만원)이 개정되면 그때 다시 제안할 것.","draft":false},{"code":"A3-09","title":"국민연금 유족연금 지급률 노령연금 중복 선택 총정리 (2026 · 배우자 3년 후 지급정지·소멸시효 5년)","lane":"info","rank":"rec","why":"기한형 2개가 동시에 걸린다. ①청구 소멸시효 5년 — 2021년 배우자 사별 유족의 청구권이 지금 만료 구간에 들어간다(청구 안 하면 영구 소멸) ②배우자 유족연금은 수급권 발생 후 3년만 지급되고 55세까지 정지 — 2023년 수급 시작자가 지금 정지 절벽을 맞는다. 둘 다 국민연금공단 공식 페이지에 명시된 날짜 규칙이고, A3 연금 8편 중 유족연금은 미커버다.","summary":"①1장 첫 문장에서 독자 전제를 깬다 — '배우자면 평생 나온다'는 틀렸다(3년 지급 후 55세까지 정지, 예외 있음) ②가입기간별 지급률 구간표 40/50/60% + 부양가족연금액을 더한 실제 월 수령액 계산예시(범위가 아니라 구간표로) ③판단형 비교표 '노령연금 vs 유족연금 어느 쪽을 고를까' — 서로 대체되나 행 포함, 노령연금 선택 시 유족연금 30% 추가 지급이 핵심 반전 ④탈락·소멸 사유(재혼·파양·자녀 25세/손자녀 19세 도달·순위 밀림) ⑤소멸시효 5년 함정과 청구 절차(지사 내방/우편, 처리 30일)","facts":"출처=국민연금공단 유족연금 https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0072M0.do · 중복급여의 조정 https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0048M0.do?menuId=MN24001117&tab=tab2 (둘 다 2026-08-24 직접 확인) | 지급률: 가입 10년 미만 기본연금액 40% · 10~20년 미만 50% · 20년 이상 60% (+부양가족연금액) | 부양가족연금액 2026.1~2026.12월분 적용: 배우자 연 306,630원 · 자녀/부모 1인당 연 204,360원 ← 기준연도 반드시 병기 | 중복급여 조정 원문: '선택하지 아니한 급여가 유족연금일 경우 선택한 급여와 유족연금액의 30% 지급(단, 선택한 급여가 반환일시금이면 30% 미지급)' | 노령연금 수급권자 사망 시 유족연금액은 사망자가 받던 노령연금액을 초과할 수 없음 | 유족순위: 배우자(사실혼 포함)>자녀>부모>손자녀>조부모 중 최우선순위자 | 소멸: 수급권자 사망·배우자 재혼·자녀/손자녀 파양·자녀 25세/손자녀 19세 도달 | 정지: 배우자는 수급권 발생 후 3년 지급 뒤 55세까지 정지(예외 있음) | 소멸시효 5년 · 처리기한 30일 | KW=미측정 (무인 실행 면제 — 이부장 검증 단계에서 측정)","src":"lifeinfo-daily-topics","dup":"🟢 0.33","state":"approved","added":"2026-08-24T09:10:58","state_at":"2026-08-24T12:54:28","verify":{"mark":"🟡","notes":["🟡 KW 미 rec 가 아니라 alt 로 낸다 — 이부장이 판단할 것.","summary":"①대상 판정표(노령·분할·유족·장애1~3급 수급자 vs 탈락 사유 — 만 60세 미만·장애 4급·수급 중단자). ②한도 계산예시를 끝까지: 월 연금 60만원 수급자 → 연 720만원 × 2배 = 1,440만원이지만 상한 1,000만원 → 실제 사용비용 이내로 얼마가 나오나. ③용도 4종별 필요서류·인정 범위(전월세 보증금 / 의료비 / 배우자 장제비 / 재해복구비) — '실제 사용한 비용'만 나온다는 함정. ④상환 = 연금에서 차감되므로 매달 손에 쥐는 연금이 줄어든다(차감 후 실수령 계산). ⑤햇살론(B2-05)·새출발기금(A4-01)과 '서로 대체되나' 비교행.","facts":"KW=미측정 · 대상: 국내 거주 만 60세 이상 국민연금 수급자(노령·분할·유족·장애 1~3급) · 한도: 개인별 연간 연금수령액의 2배 이내에서 실제 사용한 비용, 최고 1,000만원 · 용도 4종: 전월세 보증금·의료비·배우자 장제비·재해복구비 · 금리: 5년 만기 국고채 수익률과 예금은행 가중평균 수신금리(신규취급액) 중 낮은 금리에 연동, 분기별 변동금리 → 🔴분기마다 바뀌므로 발행 시점에 공단 이자율 공지를 재조회할 것(검색으로 확인된 최신 공지가 2025년 4분기분이었다) · 출처 https://pensioner.nps.or.kr/iaopsrvc/silverloan/getOHDD0001M0.do · https://www.gov.kr/portal/service/serviceInfo/B55201500002","src":"lifeinfo-daily-topics","dup":"🟢 0.33","state":"dropped","added":"2026-08-25T09:11:34","state_at":"2026-08-27T16:19:48","decision":"루틴이 스스로 '개정·금액변경 같은 하드 이슈는 없다'고 적어 alt 로 냈다. 선별 기준은 '새 주제인가'가 아니라 '특별이슈급인가'이고 이건 미달이다. 소재 자체는 좋으니 실버론 금리·한도 개정이 나오면 그때 rec 로 재제안","draft":false},{"code":"B2-12","title":"은행 대출금리 가산금리 인하 총정리 (2026년 7월 시행 · 보증기금 출연금 제외 · 내 금리 확인법)","lane":"info","rank":"rec","why":"개정 시행 anchor — 금융위 「2026년 새해부터 달라지는 금융제도」(2025-12-30)의 '대출금리 산정방식 개선'이 2026.7.1 시행됐다. 은행이 지급준비금·예금자보험료·서민금융진흥원 출연금·각종 보증기금 출연금을 가산금리에 넣는 것이 금지된 규정으로, 가을 이사철(9~10월) 전세·주담대 실행과 대환이 몰리는 지금이 이 규정의 적용을 실제로 받는 시점이다. 🔴 기존 대출 소급 여부는 보도자료에 명시가 없다 — 초안 전 은행연합회 대출금리 모범규준 개정문으로 확인하고, 확인 못 하면 그 항목은 빼고 '확인 방법'만 쓴다(추정 금지).","summary":"①가산금리 대조표: 이제 못 넣는 비용 4가지 vs 여전히 반영 가능한 것(보증부 대출 출연료율 50% 이하) ②'내 금리는 왜 그대로인가' — 신규 취급분과 기존 대출 구분(확인된 범위에서만 서술) ③은행연합회 소비자포털에서 기준금리·가산금리·우대금리를 분해해 읽는 법(화면 순서대로) ④계산예시: 주담대 3억·30년에서 가산금리 0.1%p 차이가 연 이자·총이자로 얼마인지 끝까지 계산 ⑤함정: 전세보증·정책모기지 같은 보증부 대출은 예외라 기대만큼 안 내려간다 ⑥지금 갈아탈까 판단표 — 중도상환수수료 실비용 방식(2026.1.1)과 함께 따진 손익분기","facts":"금융위원회 「2026년 새해부터 달라지는 금융제도」(2025-12-30) 원문 확인분 / 대출금리 산정방식 개선 시행일 '26.7.1. / 가산금리 제외 항목 = '지급준비금, 예금자보험료, 서민금융진흥원 출연금 및 개별 법률에 따른 각종 보증기금 출연금' / 예외 = '보증부 대출은 출연료율의 50% 이하 "rank":"alt","why":"보건복지부 「2026년 보건복지 정책 이렇게 달라집니다」에 실린 확정 인상액 — 1등급 231만→251만원, 2등급 208만→233만원(2025-12 대비 2026 기준). 초고령사회 진입에 따른 중증 어르신 지원 강화 조치로, 이미 등급판정을 받은 가족을 둔 독자에게 '내 한도가 얼마나 올랐고 무엇을 더 쓸 수 있나'는 즉시 확인 수요다. 기존 C3-02(등급신청·본인부담금)와 달리 이 글은 한도액 인상폭 자체를 다룬다.","summary":"①등급별 한도액 표: 1등급 231→251만원, 2등급 208→233만원(2025-12 기준 vs 2026) ②계산예시: 재가급여 본인부담률(일반 15%) 적용 시 한도 인상분만큼 실제로 더 쓸 경우 본인부담 증가액을 원 단위로 계산 ③판단형: '한도가 올랐다=더 많이 써도 된다'가 아니라 실제 이용은 장기요양기관·공단 승인 범위 내라는 점 정리 ④함정: 3~5등급 인상 여부는 확인된 자료에 없음 — 이 항목은 '확인 안 됨'으로 명시(추정 금지) ⑤재가급여 한도를 초과해 쓰면 초과분 전액 본인부담이라는 점 강조","facts":"보건복지부, 대한민국 정책브리핑 「2026년 보건복지 정책 이렇게 달라집니다」. 1등급 재가급여 월 한도액: 2025-12 기준 231만원 → 2026년 251만원. 2등급: 208만원 → 233만원. 3~5등급 인상폭은 이 자료에 없음(추정 금지 — 확인 안 된 항목으로 그대로 남김). 출처 https://www.korea.kr/multi/visualNewsView.do?newsId=148956615 . 🔴 방문재활·방문영양 신규서비스 도입설(하반기 시범)은 비공식 출처(블로그)에서만 확인돼 이 제안엔 넣지 않음 — 초안 작성 전 국민건강보험공단 장기요양보험 공식 공지로 별도 확인 필요.","src":"lifeinfo-daily-publish","dup":"🟢 0.25","state":"dropped","added":"2026-08-27T12:54:55","state_at":"2026-08-27T16:19:48","decision":"인상은 확정이지만 '지금 찾을 이유'가 없다 — 2026 연초 시행분이라 시의성 anchor 가 8월에 없다. 게다가 3~5등급 인상 여부가 확인 자료에 없어 등급별 표가 반쪽이 된다(추정 금지 규칙상 비워야 함). 표가 비면 이 글의 핵심 판매물이 사라진다. 3~5등급 수치가 확인되면 재제안","draft":false},{"code":"F2-15","title":"전기차 고속도로 통행료 할인 30% 등록 방법 총정리 (2026년 40%→30% 축소·2027년 20% 예고)","lane":"etc","rank":"rec","why":"국토교통부가 유료도로법 시행령 개정(입법예고)으로 친환경차 통행료 감면을 2027년까지 3년 연장하되 할인율을 단계적으로 낮췄다 — 2025년 40%→2026년 30%(현재)→2027년 20%. 아직 하이패스에 전기차 등록을 안 해둔 운전자는 지금 확인 안 하면 30%도 못 받는다(금액 변경 anchor, 아직 미다룬 소재).","summary":"①연도별 할인율 변천표(2024 50%→2025 40%→2026 30%→2027 20%, 유료도로법 시행령 개정 근거) ②적용대상(순수 전기차·수소차만, 하이브리드·PHEV 제외) ③등록 방법 3가지(하이패스 홈페이지·앱, 콜센터, 톨게이트 영업소 방문 — 민자고속도로 영업소는 불가) ④결제수단 조건(하이패스 전용지불수단 필수, 현금 결제 시 감면 불가라는 함정) ⑤등록 안 하고 놓치는 사례 + 특정 구간 예시로 실제 절감액 계산","facts":"국민일보(2026) 국토교통부 유료도로법 시행령 개정 입법예고 인용: 전기·수소차 하이패스 통행료 감면 2025년 40%→2026년 30%→2027년 20% 단계적 축소, 2027-12-31까지 연장. 순수전기차(BEV)·수소전기차(FCEV)만 대상, PHEV·HEV 제외. 발행 전 law.go.kr 유료도로법 시행령 원문 + ex.co.kr 공식 안내로 조문 번호·시행일 재확인 필요.","src":"lifeinfo-travel-prep","dup":"🟢 0.40","state":"dropped","added":"2026-08-27T12:56:44","state_at":"2026-08-27T16:19:48","decision":"🔴 근거가 입법예고 단계다 — 유료도로법 시행령 개정이 아직 확정 공포·시행이 아닌데 제목이 '2026년 30%'를 단정한다. 확정 안 된 요율을 금액으로 파는 글은 이 저장소 최상위 규칙(공식 확인 실패=그 수치 안 씀) 위반이다. 공포·시행이 확인되면 그때 재제안. 부수적으로 D2-11(전기차 충전요금)과 같은 소재군이라 동시 2편은 과하다","draft":false},{"code":"G4-05","title":"산에서 밤 도토리 버섯 주우면 처벌될까 총정리 (2026 가을 · 산림자원법 절도죄 5천만원 이하 벌금 · 국립공원은 허가 대상)","lane":"etc","rank":"rec","why":"가을 임산물철(밤·도토리·버섯)이 지금 시작이고 추석 성묘·벌초·단풍 산행이 겹치는 3주다. 우리 DB의 G4는 제철 먹거리(전어·대하)만 있고 \"그 먹거리를 산에서 직접 주워도 되는가\"에 답한 글이 없다. 산림자원법이 2026-03-31 개정 시행(법률 제21506호)돼 조문·형량을 지금 원문으로 확정 인용할 수 있다. 무엇보다 이 주제는 독자의 전제가 틀린 소재다 — 대부분 \"주인 없는 산에서 밤 몇 개\"로 알지만 법은 절도(5년 이하 징역 또는 5천만원 이하 벌금)로 본다.","summary":"①처벌 구간표: 산림자원법 제73조① 산림 산물 절취=5년 이하 징역 또는 5천만원 이하 벌금 / 제73조③ 야간·상습·차량운반=1년 이상 10년 이하 징역(벌금형이 아예 없다) / 제79조① 신고 없이 굴취·채취=500만원 이하 과태료 / 제75조 임산물 몰수·추징. ②판단표 \"여기서 주워도 되나\" 4열: 내 소유 산 / 남의 사유림 / 국유림 / 국립공원 — 근거 법과 처벌이 각각 다르다(국립공원만 자연공원법이 따로 걸린다). ③독자의 전제를 첫 화면에서 깬다: \"주인 없는 산은 없다\" — 모든 산은 국유·공유·사유 중 하나다. ④함정: 미수범도 처벌(제73조②) · 야간 채취는 벌금형 선택지가 없어 징역만 남는다 · 차 트렁크에 실으면 가중 · 국립공원은 \"몰랐다\"가 안 통하고 허가 없이 채취한 순간 형사처벌 구간이다. ⑤합법 경로: 국유림 산나물 채취 허가, 산림조합 임산물 채취권, 사유림은 소유자 동의. ⑥초안 때 국립공원공단 공식 안내 페이지로 실제 단속·계도 운영을 보강할 것(조문은 이미 확정).","facts":"[공식확인·1차출처 ①] 산림자원의 조성 및 관리에 관한 법률(법률 제21506호, 공포·시행 2026-03-31) — law.go.kr DRF API 원문 취득. 제73조① \"산림에서 그 산물(조림된 묘목을 포함한다)을 절취한 자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다\" / 제73조② 미수범 처벌 / 제73조③ 채종림·시험림 절취, 원뿌리 채취, 차량·선박 운반, 야간 절취, 상습은 1년 이상 10년 이하 징역 / 제75조 관련 임산물 몰수, 몰수 불가 시 가액 추징 / 제79조① 제19조5항 단서 신고 없이 임산물 굴취·채취 시 500만원 이하 과태료. [공식확인·1차출처 ② 국립공원] 자연공원법(시행 2026-07-07) 제23조①7호 \"나무를 베거나 야생식물을 채취하는 행위\"는 공원관리청 허가 대상이고, 제82조2호가 \"제23조제1항제1호부터 제7호까지를 위반하여 허가를 받지 아니하고 허가대상 행위를 한 자\"에게 3년 이하의 징역 또는 3천만원 이하의 벌금을 규정한다(제7호가 1~7호 범위에 들어가므로 제83조 2년·2천만원이 아니라 제82조가 적용된다). 참고로 제27조 금지행위 목록에는 채취가 없다 — 국립공원의 근거는 금지가 아니라 허가다. [초안 때 보강] 국립공원공단 안내 페이지의 실제 단속·계도 운영, 밤·도토리가 \"야생식물 채취\"로 다뤄지는 실제 사례. KW=미측정","src":"lifeinfo-travel-prep","dup":"🟢 0.00","state":"approved","added":"2026-08-27T21:29:42","state_at":"2026-08-30T14:45:17","verify":{"mark":"🟡","notes":["🟡 출처 URL 이 없음(공식 .go.kr 원문 링크를 달 것)","🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall","ℹ️ 재고 3/5 (큐 2 + 승인·미적재 1) — 여유 2"],"at":"2026-08-30T14:40:43"},"reported_at":"2026-08-30T14:41:11","draft":true},{"code":"F1-14","title":"해외여행 축산물 반입 신고 안 하면 과태료 총정리 (2026 · ASF 발생국 돼지고기 1차 500만원 · 소시지 햄 베이컨)","lane":"etc","rank":"alt","why":"추석 연휴(9/25)가 4주 앞이라 해외여행 출입국이 몰리고, 귀국 시 소시지·햄 같은 선물을 그대로 들여오다 걸리는 게 이 시기다. 우리 DB의 해외여행 서류·규정 글(F1)은 입국허가(ESTA·ETA·TDAC·EES)만 다뤘고 귀국할 때 걸리는 규정은 한 편도 없다. 그리고 이 주제는 금액을 범위가 아니라 구간표로 줄 수 있다 — 가축전염병 예방법 시행령 별표가 위반차수별 과태료를 원 단위로 고시하고 있어 \"얼마인가\"에 정확히 답하는 글이 된다.","summary":"①과태료 구간표(만원 · 1차/2차/3차) — 시행령 별표의 계층을 그대로 살려 표로 낸다. 검역증명서 미첨부 동물생산물은 다시 둘로 갈린다: [가] ASF 발생국산 돼지고기 및 그 돼지고기가 포함된 제품 500/750/1,000 · [나] 그 밖의 경우 100/300/500. 검역증명서를 첨부한 동물생산물은 5/10/50. 동물은 CITES 국제거래 금지종 300/400/500 · 그 밖의 동물 70/100/200. ②독자의 전제를 첫 화면에서 깬다: 처벌 대상은 \"반입\"이 아니라 \"미신고\"다 — 입국 즉시 신고하면 폐기하고 끝난다. ③함정 하나가 이 글의 핵심이다: 지정검역물은 품목명이 아니라 \"멸균·살균 처리 여부\"로 갈린다(시행규칙 제31조①9호) — 멸균처리된 소시지는 대상이 아니고 안 된 것은 대상이다. 여행자가 그 표시를 읽을 줄 알아야 한다. ④계산예시: 같은 소시지 한 봉지라도 ASF 발생국산 돼지고기가 들어갔으면 500만원, 아니면 100만원으로 갈리는 지점을 끝까지 계산해 보여준다. ⑤합법 경로: 법 제36조①단서 입국 즉시 검역신고. ⚠️ 코드가 F1인데 F1은 13편으로 중분류 중 둘째로 많다(validate_db가 분가 검토 WARN을 띄우는 구간) — 이부장이 감안해 선별할 것.","facts":"[공식확인·1차출처, 전부 law.go.kr DRF API 원문] ①가축전염병 예방법(시행 2026-01-23) 제36조①단서 \"여행자 휴대품으로 지정검역물을 수입하는 자는 입국 즉시 출입공항·항만 등에 있는 동물검역기관의 장에게 신고하고 검역관의 검역을 받아야 한다\" · 제60조②6호 위반 시 1천만원 이하 과태료. ②같은 법 시행령(대통령령 제36220호, 시행 2026-04-21) 별표 과태료 부과기준 \"무\" 항목 — 계층 그대로 옮기면: 1) CITES 국제거래 금지 동물 300/400/500 · 2) 그 외 동물 70/100/200 · 3) 검역증명서를 첨부하지 않은 동물의 생산물 → 가) ASF 발생국에서 생산·제조된 돼지고기 또는 그 돼지고기가 포함된 제품 500/750/1,000, 나) 가) 외의 경우 100/300/500 · 4) 검역증명서를 첨부한 동물의 생산물 5/10/50 (단위 만원, 1차/2차/3차). 🔴 3)가) 는 3) 아래의 하위 갈래다 — 3)과 나란한 별개 항목이 아니다. 표로 옮길 때 이 계층을 무너뜨리지 말 것. ③같은 법 시행규칙(시행 2026-07-24) 제31조① 지정검역물 — 9호 \"멸균처리되지 아니한 햄·소시지·베이컨 등 수육가공품, 난백·난분 등 알가공품 및 살균처리되지 아니한 유가공품\", 10호 \"가공처리되지 아니하거나 멸균처리되지 아니한 동물의 사체·살·뼈·가죽 등\". 즉 소시지·햄·베이컨은 명시돼 있고, 치즈(유가공품)·육포(수육가공품)는 살균·멸균 처리 여부에 따라 갈린다 — 제목·본문에서 단정하지 말고 이 조건을 그대로 쓸 것. [미확인=초안 전 필수] 과일·견과·씨앗은 식물방역법 소관이라 이번에 확인하지 않았다 · ASF 발생국 목록은 농림축산식품부장관 공개분(법 제3조의2③)이라 발행 시점에 검역본부에서 재확인. KW=미측정","src":"lifeinfo-travel-prep","dup":"🟡 0.50","state":"approved","added":"2026-08-27T21:30:15","state_at":"2026-08-30T14:45:17","verify":{"mark":"🟡","notes":["🟡 관련글 — ","🟡 출처 URL 이 없음(공식 .go.kr 원문 링크를 달 것)","🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall","ℹ️ 재고 3/5 (큐 2 + 승인·미적재 1) — 여유 2"],"at":"2026-08-30T14:40:43"},"reported_at":"2026-08-30T14:41:11","draft":false},{"code":"A5-09","title":"퇴직금 미지급 신고 방법 처벌 총정리 (2026년 9월 18일 시행 · 5년 이하 징역 5천만원 벌금 상향)","lane":"info","rank":"rec","why":"개정 시행 anchor — 근로자퇴직급여 보장법 제43조 개정(법률 제21475호, 2026-03-17 공포)이 2026-09-18 시행. 퇴직금 미지급 법정형이 3년/3천만원에서 5년/5천만원으로 상향되고, 근로기준법 제43조의2로 명단공개된 체불사업주가 공개기간 중 미지급하면 반의사불벌 예외가 되어 합의해도 공소가 가능해진다. 시행 3주 전이고 40~60대 퇴직·이직 당사자가 직접 검색하는 주제다.","summary":"①형량 대조표(개정 전 3년·3천만원 vs 개정 후 5년·5천만원, 제44조는 3년·3천만원 그대로 남는 대비까지). ②판단형 — '합의하면 처벌 안 되나': 반의사불벌 원칙 vs 명단공개 사업주 예외를 사례로 가른다. ③퇴직금 못 받았을 때 실제 절차 계단(고용노동부 진정 → 체불 확인서 → 대지급금 → 형사)을 단계별로. ④지연이자 계산예시 — 퇴직 후 14일 경과분 연 20%를 금액으로 끝까지 계산. ⑤탈락 사유: 계속근로 1년 미만·주 15시간 미만은 퇴직금 자체가 발생하지 않는다. ⑥내부링크 A5-06(대지급금)·B4-05(퇴직금 계산).","facts":"근로자퇴직급여 보장법 제43조(시행 2026-09-18, 법률 제21475호 2026-03-17 공포): '5년 이하의 징역 또는 5천만원 이하의 벌금'. 단서 = 제1호·제2호는 반의사불벌이나 근로기준법 제43조의2 명단공개 체불사업주가 공개기간 중 해당하면 제외. 제44조는 '3년 이하 징역 또는 3천만원 이하 벌금' 유지(퇴직연금사업자 대상). 개정 전 형량 3년·3천만원 = 법제처 제개정이유 원문. 출처: 국가법령정보센터 https://www.law.go.kr/DRF/lawService.do?OC=test&target=eflaw&MST=284455&type=HTML&efYd=20260918 · KW=미측정","src":"lifeinfo-daily-topics","dup":"🟢 0.25","state":"approved","added":"2026-08-28T09:12:00","state_at":"2026-08-30T14:45:17","verify":{"mark":"🟡","notes":["🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall","ℹ️ 재고 3/5 (큐 2 + 승인·미적재 1) — 여유 2"],"at":"2026-08-30T14:40:43"},"reported_at":"2026-08-30T14:41:11","draft":false},{"code":"A2-16","title":"국가유공자 보훈보상대상자 활동지원급여 상이등급 무관 확대 총정리 (2026년 9월 1일 시행)","lane":"info","rank":"alt","why":"개정 시행 anchor — 장애인복지법 시행령 제13조 개정(대통령령 제36559호, 2026-08-04 공포)이 2026-09-01 시행. 종전에는 상이등급 3~7급 판정자만 활동지원급여를 받을 수 있었는데, 앞으로는 상이등급 판정을 받고 간호수당을 받지 않는 국가유공자·보훈보상대상자는 등급과 무관하게 받는다. 시행이 4일 뒤다. ⚠️ 약점 = 대상 규모가 좁다. 그래서 추천이 아니라 후보로 낸다.","summary":"①개정 전/후 대상 대조표 — '상이등급 3~7급' → '상이등급 판정 + 간호수당 미수급'으로 기준 자체가 바뀐 것을 3열로. ②판단형 '나는 되나' — 상이등급 1·2급이 새로 들어오고, 간호수당 수급자는 여전히 빠지는 구조를 사례로 가른다(등급이 높을수록 유리해진 것이 아니라 간호수당 여부로 갈린다는 반전이 핵심). ③신청처·구비서류·소급 여부. ④탈락 사유 = 간호수당과 활동지원급여의 택일 구조. ⑤내부링크 A2-11(국가유공자 등록)·A3-06(장애인연금).","facts":"장애인복지법 시행령 제13조 제1항·제2항 단서 개정(대통령령 제36559호, 2026-08-04 공포 / 시행 2026-09-01): '국가유공자법 제6조의4에 따른 상이등급 3급부터 7급까지의 판정을 받은 사람' → '국가유공자법 제15조제1항(또는 보훈보상자법 제17조제1항)에 따른 간호수당을 지급받지 않는 사람'. 출처: 국가법령정보센터 https://www.law.go.kr/DRF/lawService.do?OC=test&target=eflaw&MST=288467&type=HTML&efYd=20260901 · KW=미측정","src":"lifeinfo-daily-topics","dup":"🟢 0.20","state":"approved","added":"2026-08-28T09:12:16","state_at":"2026-09-01T12:01:10","decision":"형식 불통과로 이번 회차 제외. 1차 출처(법제처 DRF·mohw 보도자료)는 docs/A2-16_1차출처_법제처20260831.md 에 확보돼 있으니 표준 형식으로 다시 쓰면 바로 살아난다","verify":{"mark":"🟡","notes":["🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall","ℹ️ 재고 1/5 (큐 0 + 승인·미적재 1) — 여유 4"],"at":"2026-09-01T00:32:32"},"reported_at":"2026-08-31T23:47:53","drop_why":"초안 머리 형식이 표준이 아님(■제목·■코드후보·■카테고리 전부 빠짐) — source 에이전트가 이과장 대행으로 써서 형식이 갈렸다. 4,357자로 얇고 계산예시·함정 없음. 소재·시행일(9/1)은 유효하므로 표준 형식으로 다시 쓰면 재제안 가능","until":"2026-09-02","draft":true},{"code":"F1-15","title":"해외 여행 중 여권 분실 신고 절차 재외공관 임시여행증명서 총정리 (2026 · 영사콜센터·긴급여권)","lane":"etc","rank":"rec","why":"추석 연휴(9/25)가 4주 앞 — 해외여행 출국
