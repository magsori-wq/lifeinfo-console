<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="icon" href="data:,">
<title>진행현황 — 생활정보 모음</title>
<style>
:root{--bg:#0e1620;--card:#18222e;--card2:#13202d;--line:#26323f;--txt:#e6edf3;--mut:#8a97a6;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:470px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:16px;font-weight:600}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(63,185,80,.16);color:var(--ok)}
.b-warn{background:rgba(210,153,34,.16);color:var(--warn)}
.b-bad{background:rgba(248,81,73,.16);color:var(--bad)}
.sec{font-size:11px;color:var(--mut);letter-spacing:.05em;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
.metrics{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 2px}
/* 채널이 4개가 되어 490px 팝업에서 눌리므로, 좁아지면 2x2로 감싸게 한다 */
.m{flex:1 1 96px;background:var(--card2);border-radius:9px;padding:8px 10px}
.m .l{font-size:11px;color:var(--mut)}
.m .v{font-size:18px;font-weight:600;margin-top:2px}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #243049;font-size:12.5px}
li:last-child{border-bottom:none}
li.on{opacity:.62}
li.on .lbl{text-decoration:line-through}
li svg{width:15px;height:15px;flex:none}
li.on svg{color:var(--ok)}
li.now svg{color:#7fc1ff}
li.wait svg{color:#4a586e}
.num{font-size:11px;color:#6b7a99;width:16px;text-align:right;flex:none}
.who{font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px;flex:none}
.who.ai{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.who.me{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.lbl{font-size:12.5px}
.star{color:#ff8e8e;font-weight:800;margin-left:2px}
.banner{display:none;margin-top:9px;background:#0c3a2c;border:1px solid #1f6b52;color:#06d6a0;border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12.5px}
.banner.show{display:block}
.upd{font-size:11px;color:var(--mut);text-align:right;margin-top:12px}
.agent{background:var(--card2);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.agent .ah{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.agent .st{font-size:10px;font-weight:700;padding:1px 7px;border-radius:7px;margin-left:auto}
.st.active{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.st.uncommitted{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.st.idle{background:#222c3a;color:#6b7a99;border:1px solid #2e3a4a}
.agent .role{font-size:11px;color:var(--mut);margin:3px 0 1px}
.agent .own{font-size:10.5px;color:#5a6b80}
.agent .act{font-size:11px;color:#aeb9c7;margin-top:4px;padding-left:7px;border-left:2px solid #2a3a4d;line-height:1.5}
.agent .act .d{color:var(--mut);font-size:10px}
.advice{background:#13202d;border:1px solid #2a3a4d;border-radius:9px}
.advice .ai{display:flex;gap:8px;padding:7px 11px;font-size:12px;line-height:1.5;border-bottom:1px dashed #243049}
.advice .ai:last-child{border-bottom:none}
.advice .ic{flex:none}
.prow{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px dashed #243049;font-size:11.5px}
.prow:last-child{border-bottom:none}
.pcd{color:#7fc1ff;font-weight:700;flex:none;width:46px}
.ptt{flex:1;color:#cdd6e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{background:#3a2f12;color:#ffd166;border-radius:5px;padding:0 5px;font-size:9.5px;flex:none}
.pact{color:#06d6a0;font-size:10px;flex:none;font-weight:700}
.qcard{display:flex;gap:9px;padding:8px;margin:6px 0;background:#141c2c;border:1px solid #243049;border-radius:9px}
.qth{width:78px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:#0d1420}
.qth.none{display:flex;align-items:center;justify-content:center;color:#54627a;font-size:9px;text-align:center;line-height:1.2;border:1px dashed #2a3752}
.qbody{flex:1;min-width:0}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qcode{color:#7fc1ff;font-weight:700;font-size:11.5px}
.qlane{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700}
.qlane.info{background:#12283a;color:#7fc1ff}
.qlane.pop{background:#2f2136;color:#e0a3ff}
.qtitle{color:#e6edf5;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qfacts{color:#8a95a6;font-size:10px;margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qmeta{margin-top:4px}
.qdraft{color:#6b7688;font-size:9.5px;margin-left:8px}
.qpv{background:#17324a;color:#7fc1ff;border:1px solid #2a4d6e;border-radius:6px;font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer}
.qpv:hover{background:#1d4463}
.qpv.none{background:none;border:none;color:#54627a;font-weight:400;cursor:default;padding:3px 0}
#qpv-ov{display:none;position:fixed;inset:0;background:rgba(6,10,18,.82);z-index:999;align-items:center;justify-content:center;padding:18px}
#qpv-ov.show{display:flex}
.qpv-box{width:100%;max-width:760px;height:88vh;display:flex;flex-direction:column;background:#0f1626;border:1px solid #2a3752;border-radius:12px;overflow:hidden}
.qpv-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #243049;font-size:12.5px;font-weight:700;color:#7fc1ff}
.qpv-hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpv-x{background:#243049;color:#cdd6e0;border:none;border-radius:6px;font-size:11px;padding:5px 11px;cursor:pointer;flex:none}
.qpv-x:hover{background:#324158}
.qpv-fr,#qpv-fr{flex:1;width:100%;border:0;background:#fff}
.qpv-ft{padding:8px 14px;border-top:1px solid #243049;font-size:10px;color:#8a95a6;text-align:center}
.ch{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 4px;flex:none;margin-left:3px}
.ch.on{background:#0c3a2c;color:#06d6a0}
.ch.off{background:#3a1216;color:#f0707a}
</style>
</head>

<div class="card" id="board" role="status">불러오는 중…</div>

</div>

x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 16px}\n.lsg .tw table{margin:0}\n.lsg .end{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:16px 20px;margin-top:24px}\n.lsg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .rel{background:#f4f7fc;border:1px solid #e0e8f4;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#7C5CE0;margin-bottom:8px}\n.lsg .rel a{display:block;color:#2a4a73;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#8a97ab;text-decoration:none;margin:2px 0 6px}\n.lsg .warn{background:#fff4f2;border:1px solid #f6cfc6;border-radius:12px;padding:14px 18px;margin:14px 0}\n.lsg .warn b{display:block;font-size:15px;color:#c0442a;margin-bottom:6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>서울 고궁은 <b>개인 관람료가 1,000~3,000원<\/b>이고, <b>만 65세 이상 내국인은 무료<\/b>입니다. 그런데 <b>창덕궁 후원(비원)만은 5,000원을 그대로 내야<\/b> 하고, <b>궁궐 통합관람권(6,000원)에도 포함되지 않습니다.<\/b> \"고궁은 어른신 무료\"라고만 알고 갔다가 매표소에서 당황하는 지점이 바로 여기입니다.<\/p>\n<p>여름철(6~8월)에는 경복궁·창덕궁 관람시간이 <b>오후 6시 30분<\/b>까지 늘어나고, 창경궁·덕수궁은 연중 <b>밤 9시<\/b>까지 열려 있어 저녁 나들이가 됩니다. 가을 단풍철 후원 관람은 <b>관람일 6일 전 오전 10시<\/b>에 예약이 열리는 선착순이라 미리 알아둬야 합니다.<\/p>\n<p>이 글은 국가유산청 궁능유적본부 공식 안내를 기준으로 <b>궁궐별 요금표·통합관람권 손익분기·무료 대상·후원 예약 절차·휴궁일<\/b>을 한 번에 정리했습니다. 공식 확인 페이지 주소도 아래에 그대로 넣었습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 궁궐별 관람료 한눈에 (개인·단체)<\/a><a href=\"#sec2\">2. 통합관람권 6,000원 — 언제 사야 이득인가<\/a><a href=\"#sec3\">3. 만 65세 이상 무료, 그런데 후원은 예외<\/a><a href=\"#sec4\">4. 창덕궁 후원 예약 방법 (6일 전 오전 10시)<\/a><a href=\"#sec5\">5. 휴궁일·관람시간 — 요일을 잘못 고르면 헛걸음<\/a><a href=\"#sec6\">6. 놓치기 쉬운 6가지<\/a><a href=\"#sec7\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec2\">👉 통합관람권, 나는 사야 할까 먼저 보기<\/a>\n\n<h2 id=\"sec1\">1. 궁궐별 관람료 한눈에 (개인·단체)<\/h2>\n<p>내국인과 외국인 요금이 같습니다. 단체는 <b>10인 이상<\/b>일 때 적용됩니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>개인<\/th><th>단체(10인 이상)<\/th><\/tr>\n<tr><td>경복궁<\/td><td>3,000원<\/td><td>2,400원<\/td><\/tr>\n<tr><td>창덕궁 (전각)<\/td><td>3,000원<\/td><td>2,400원<\/td><\/tr>\n<tr><td><b>창덕궁 후원<\/b><\/td><td><b>5,000원<\/b><\/td><td>단체 할인 없음<\/td><\/tr>\n<tr><td>창경궁<\/td><td>1,000원<\/td><td>800원<\/td><\/tr>\n<tr><td>덕수궁<\/td><td>1,000원<\/td><td>800원<\/td><\/tr>\n<tr><td>종묘<\/td><td>1,000원<\/td><td>1,000원<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li><b>창덕궁은 요금이 둘로 나뉩니다<\/b>: 전각(궁궐 건물) 3,000원 + 후원 5,000원. 후원까지 보려면 <b>8,000원<\/b>입니다.<\/li>\n<li>후원은 <b>단체 할인도 없습니다.<\/b> 인원이 많아도 1인 5,000원입니다.<\/li>\n<li>종묘는 단체 요금이 개인과 같은 1,000원입니다.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 통합관람권 6,000원 — 언제 사야 이득인가<\/h2>\n<p>궁궐 통합관람권은 <b>6,000원<\/b>이고, <b>구매일로부터 6개월<\/b> 동안 <b>4대궁(경복궁·창덕궁·창경궁·덕수궁)과 종묘<\/b>를 각 1회 관람할 수 있습니다. 판매처는 4대궁과 종묘 <b>매표소<\/b>입니다. 단, <b>창덕궁 후원은 통합관람권에서 제외<\/b>됩니다(창덕궁은 전각만 포함).<\/p>\n<p>따로 사면 얼마인지 계산해 보면 손익분기가 분명해집니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>가려는 곳<\/th><th>개별 구매 합계<\/th><th>통합권 6,000원과 비교<\/th><\/tr>\n<tr><td>창경궁 + 덕수궁 + 종묘<\/td><td>3,000원<\/td><td>❌ 3,000원 손해<\/td><\/tr>\n<tr><td>경복궁 + 창덕궁(전각)<\/td><td>6,000원<\/td><td>➖ 본전 (차이 없음)<\/td><\/tr>\n<tr><td>경복궁 + 창덕궁 + 창경궁<\/td><td>7,000원<\/td><td>✅ 1,000원 이득<\/td><\/tr>\n<tr><td>4대궁 + 종묘 모두<\/td><td>9,000원<\/td><td>✅ 3,000원 이득<\/td><\/tr>\n<\/table><\/div>\n<p><b>판단 규칙은 한 줄로 정리됩니다.<\/b> 6개월 안에 <b>경복궁과 창덕궁을 둘 다 가고, 거기에 한 곳 이상을 더 갈 계획<\/b>일 때만 통합관람권이 이득입니다. 경복궁·창덕궁 두 곳만 볼 생각이면 통합권을 사도 <b>정확히 본전<\/b>이고, 요금이 싼 창경궁·덕수궁·종묘 위주로 다닐 계획이면 <b>개별 구매가 더 쌉니다.<\/b><\/p>\n<div class=\"warn\"><b>⚠️ 통합권을 사기 전 두 가지를 먼저 확인하세요<\/b>\n<ul style=\"margin:0\">\n<li>본인이 <b>무료 관람 대상<\/b>이라면(만 65세 이상 등) 통합권 자체가 필요 없습니다 — 아래 3번을 보세요.<\/li>\n<li>유효기간이 <b>6개월<\/b>이라 \"언젠가 가겠지\"로 사두면 남은 궁을 못 가고 끝날 수 있습니다.<\/li>\n<\/ul><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 만 65세 이상 무료, 그런데 후원은 예외<\/h2>\n<p>궁능유적본부가 안내하는 <b>무료 관람 대상<\/b>은 다음과 같습니다.<\/p>\n<ul>\n<li><b>만 24세 이하 및 만 65세 이상 내국인<\/b> (외국인은 만 18세 이하 및 만 65세 이상)<\/li>\n<li><b>한복 착용자<\/b><\/li>\n<li><b>장애인 및 보호자<\/b>, <b>독립유공자·국가유공자·5·18민주유공자 등<\/b>, <b>기초생활수급자<\/b><\/li>\n<li><b>매월 마지막 수요일 '문화가 있는 날'<\/b> — 단 <b>창덕궁 후원은 제외<\/b><\/li>\n<\/ul>\n<p>여기서 놓치기 쉬운 대목이 <b>창덕궁 후원<\/b>입니다. 후원의 무료 관람 대상은 위 목록과 <b>완전히 다릅니다.<\/b><\/p>\n<div class=\"warn\"><b>🚫 창덕궁 후원 무료 대상은 딱 3가지뿐입니다<\/b>\n<p style=\"margin:6px 0 0\"><b>만 6세 이하 · 유공자(내국인) · 장애인(내국인)<\/b> — 즉 <b>만 65세 이상이어도 후원은 5,000원을 냅니다.<\/b> 할인 대상은 <b>종로구민 50%<\/b>입니다.<\/p>\n<p style=\"margin:8px 0 0\">정리하면 후원은 <b>①통합관람권 제외 ②문화가 있는 날 제외 ③만 65세 무료 제외<\/b>로, 세 가지 혜택이 모두 비켜 갑니다.<\/p><\/div>\n<p><b>계산 예시 — 만 65세 이상 부부가 창덕궁 후원까지 보는 경우<\/b><\/p>\n<ul>\n<li>창덕궁 전각 3,000원 × 2명 = <b>0원<\/b> (만 65세 이상 무료)<\/li>\n<li>창덕궁 후원 5,000원 × 2명 = <b>10,000원<\/b><\/li>\n<li>→ 합계 <b>10,000원<\/b>. \"고궁은 어르신 무료\"만 믿고 현금 없이 갔다가 매표소에서 결제하게 되는 지점입니다.<\/li>\n<\/ul>\n<p>반대로 후원을 빼고 <b>4대궁과 종묘만<\/b> 도는 코스라면 만 65세 이상 부부의 관람료는 <b>0원<\/b>입니다. 신분증은 반드시 챙기세요 — 나이 확인이 안 되면 무료가 적용되지 않습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 창덕궁 후원 예약 방법 (6일 전 오전 10시)<\/h2>\n<p>후원은 아무 때나 들어갈 수 없습니다. <b>회차별 인원이 정해진 제한 관람<\/b>이고, <b>해설사 인솔<\/b> 아래 정해진 시간에 출발합니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>내용<\/th><\/tr>\n<tr><td>인터넷 예약<\/td><td>관람일을 제외한 <b>6일 전 오전 10시<\/b>부터 <b>전날<\/b>까지 선착순<\/td><\/tr>\n<tr><td>회차별 인원<\/td><td>최대 <b>100명<\/b> = 인터넷 예약 <b>50명<\/b> + 당일 현장 판매 <b>50명<\/b><\/td><\/tr>\n<tr><td>현장 판매<\/td><td>관람 당일 <b>오전 9시부터<\/b> 창덕궁 매표소<\/td><\/tr>\n<tr><td>관람 방식<\/td><td>해설사 인솔 (해설 투어 참여 또는 개방 구역 개별 자유관람)<\/td><\/tr>\n<tr><td>마지막 회차<\/td><td><b>일몰 시간에 따라 변경<\/b>될 수 있음<\/td><\/tr>\n<\/table><\/div>\n<p><b>실패하는 경우와 대응법<\/b><\/p>\n<ul>\n<li><b>단풍철·주말은 인터넷 50석이 빠르게 마감됩니다.<\/b> 놓쳤다면 관람 당일 <b>오전 9시<\/b> 매표소 현장 50석이 남은 기회입니다. 개관(9시)에 맞춰 도착하는 것이 사실상 유일한 방법입니다.<\/li>\n<li><b>입장 시간이 지나면 입장도 환불도 안 됩니다.<\/b> 후원 입구까지 걸어가는 시간을 고려해 회차 시작 전에 도착하세요.<\/li>\n<li><b>무료·할인 대상자도 일단 예약·결제부터 해야 합니다.<\/b> 관람 당일 <b>입장 시간 15분 전까지<\/b> 매표소에서 증빙을 제시하면 환불받는 방식입니다. 증빙을 안 가져가면 환불되지 않습니다.<\/li>\n<li>카드 결제를 취소하면 카드사 처리에 <b>2~3일<\/b>이 걸립니다.<\/li>\n<\/ul>\n<p>회차 시간표는 계절과 일몰에 따라 바뀌므로, 예약 전 아래 <b>궁능유적본부 통합예약 페이지<\/b>에서 당일 회차를 반드시 확인하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 휴궁일·관람시간 — 요일을 잘못 고르면 헛걸음<\/h2>\n<p><b>휴궁일이 궁마다 다릅니다.<\/b> 이걸 모르고 하루에 여러 궁을 묶으면 문 닫힌 곳 앞에서 발길을 돌리게 됩니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>휴관 요일<\/th><th>해당 장소<\/th><\/tr>\n<tr><td><b>월요일<\/b><\/td><td>창덕궁 · 창경궁 · 덕수궁 · 조선왕릉 · 숭례문<\/td><\/tr>\n<tr><td><b>화요일<\/b><\/td><td>경복궁 · 종묘 · 칠궁(육상궁)<\/td><\/tr>\n<\/table><\/div>\n<p>휴궁일이 <b>공휴일과 겹치면 문을 열고<\/b>, 그 다음 첫 비공휴일이 대신 휴일이 됩니다.<\/p>\n<p><b>관람시간(계절별)<\/b><\/p>\n<div class=\"tw\"><table>\n<tr><th>장소<\/th><th>기간<\/th><th>관람시간 (입장 마감)<\/th><\/tr>\n<tr><td rowspan=\"3\">경복궁<\/td><td>1~2월, 11~12월<\/td><td>09:00~17:00 (16:00)<\/td><\/tr>\n<tr><td>3~5월, 9~10월<\/td><td>09:00~18:00 (17:00)<\/td><\/tr>\n<tr><td><b>6~8월<\/b><\/td><td><b>09:00~18:30 (17:30)<\/b><\/td><\/tr>\n<tr><td rowspan=\"3\">창덕궁<\/td><td>2~5월, 9~10월<\/td><td>09:00~18:00 (17:00)<\/td><\/tr>\n<tr><td><b>6~8월<\/b><\/td><td><b>09:00~18:30 (17:30)<\/b><\/td><\/tr>\n<tr><td>11~1월<\/td><td>09:00~17:30 (16:30)<\/td><\/tr>\n<tr><td>창경궁<\/td><td>연중<\/td><td><b>09:00~21:00 (20:00)<\/b><\/td><\/tr>\n<tr><td>덕수궁<\/td><td>연중<\/td><td><b>09:00~21:00 (20:00)<\/b><\/td><\/tr>\n<tr><td rowspan=\"3\">종묘<\/td><td>2~5월, 9~10월<\/td><td>09:00~18:00 (17:00)<\/td><\/tr>\n<tr><td>6~8월<\/td><td>09:00~18:30 (17:30)<\/td><\/tr>\n<tr><td>11~1월<\/td><td>09:00~17:30 (16:30)<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li><b>창경궁·덕수궁은 연중 밤 9시까지<\/b> 열려 있습니다. 더위를 피해 해 진 뒤 걷기 좋은 코스이고, 관람료도 각 1,000원입니다.<\/li>\n<li>입장 마감은 관람 종료 <b>1시간 전<\/b>입니다. 마감 시각을 관람 종료 시각으로 착각하지 마세요.<\/li>\n<li>종묘는 관람 방식이 다른 궁과 다를 수 있으니 방문 전 공식 안내를 확인하세요.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 놓치기 쉬운 6가지<\/h2>\n<ol>\n<li><b>후원은 세 가지 혜택에서 모두 빠집니다<\/b> — 통합관람권 ✕, 문화가 있는 날 ✕, 만 65세 무료 ✕.<\/li>\n<li><b>통합관람권은 6개월·6,000원<\/b>. 경복궁과 창덕궁을 둘 다 가면서 한 곳을 더 갈 때부터 이득입니다.<\/li>\n<li><b>신분증을 꼭 챙기세요.<\/b> 만 65세 이상·유공자·장애인 등 무료 대상은 증빙이 있어야 적용됩니다.<\/li>\n<li><b>휴궁일이 월요일과 화요일로 갈립니다.<\/b> 경복궁·종묘는 화요일, 나머지는 월요일에 쉽니다.<\/li>\n<li><b>한복을 입으면 무료입니다.<\/b> 근처 대여점을 이용하는 경우 관람료 절감분까지 함께 따져 보세요.<\/li>\n<li><b>매월 마지막 수요일은 '문화가 있는 날'<\/b>로 무료입니다(후원 제외). 날짜를 맞출 수 있다면 가장 확실한 절약입니다.<\/li>\n<\/ol>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b>\n<a href=\"https://royal.khs.go.kr/ROYAL/contents/R703000000.do\" target=\"_blank\" rel=\"nofollow\">▸ 국가유산청 궁능유적본부 — 관람요금(무료·할인 대상 전체)<\/a>\n<a href=\"https://royal.khs.go.kr/ROYAL/contents/R702000000.do\" target=\"_blank\" rel=\"nofollow\">▸ 국가유산청 궁능유적본부 — 관람시간·휴궁일<\/a>\n<a href=\"https://royal.khs.go.kr/ROYAL/contents/R601000000.do?schGroupCode=cdg\" target=\"_blank\" rel=\"nofollow\">▸ 국가유산청 궁능유적본부 — 창덕궁 후원 관람 예약<\/a>\n<\/div>\n<div class=\"end\"><b>✅ 마무리<\/b>\n<p style=\"margin:8px 0 0\">서울 고궁은 <b>1,000~3,000원<\/b>이면 들어가고 <b>만 65세 이상은 무료<\/b>입니다. 기억할 것은 딱 두 가지입니다 — <b>창덕궁 후원만 5,000원을 따로 낸다<\/b>는 것, 그리고 <b>후원은 6일 전 오전 10시 선착순 예약<\/b>이라는 것입니다. 요금·회차·휴궁일은 계절과 일몰에 따라 바뀌므로 방문 전 위 공식 페이지에서 한 번 더 확인하세요.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월<\/b> 기준이며, 관람료·회차·휴궁일은 변동될 수 있습니다. 방문 전 공식 사이트에서 확인하세요.<br>출처: <a href=\"https://royal.khs.go.kr/ROYAL/contents/R703000000.do\" target=\"_blank\" rel=\"nofollow\">국가유산청 궁능유적본부 관람요금·관람시간·창덕궁 후원 예약 안내<\/a><\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b> 00원 ~ 220,000원<\/b>(1인)입니다. 노들섬을 무료 명당으로 알고 갔다가 되돌아 나오는 일이 올해 가장 많이 생길 대목입니다.<\/p>\n<p>대신 <b>초대 이벤트(골든티켓)<\/b>가 따로 있습니다. <b>총 400명에게 1인 2매<\/b>, 응모는 <b>8월 3일(월)부터 8월 23일(일)까지<\/b>입니다. 이 글은 공식 홈페이지·예매처·서울시 축제 정보를 직접 확인해 <b>구역별 요금, 유료존과 티켓 없는 구역의 차이, 골든티켓 응모 방법, 놓치기 쉬운 함정<\/b>을 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 날짜·장소 먼저 (9월 5일 토요일)<\/a><a href=\"#sec2\">2. 올해 달라진 것 — 노들섬 전 구역 유료<\/a><a href=\"#sec3\">3. 구역별 요금과 우리 가족 총액 계산<\/a><a href=\"#sec4\">4. 골든티켓 초대 이벤트 400명 (8월 23일 마감)<\/a><a href=\"#sec5\">5. 티켓 없이 보는 법 — 한강공원과 유료존의 차이<\/a><a href=\"#sec6\">6. 예매 전 놓치기 쉬운 7가지<\/a><a href=\"#sec7\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec3\">👉 우리 가족은 얼마인지 먼저 계산해 보기<\/a>\n\n<h2 id=\"sec1\">1. 날짜·장소 먼저 (9월 5일 토요일)<\/h2>\n<p>공식 홈페이지와 서울시 축제 정보에 등록된 내용을 그대로 정리하면 다음과 같습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>내용<\/th><\/tr>\n<tr><td>공식 명칭<\/td><td>한화와 함께하는 서울세계불꽃축제 2026<\/td><\/tr>\n<tr><td>불꽃쇼<\/td><td><b>2026년 9월 5일(토)<\/b><\/td><\/tr>\n<tr><td>전야제<\/td><td>2026년 9월 4일(금) <span style=\"font-size:13px\">(서울시 축제 정보 기준)<\/span><\/td><\/tr>\n<tr><td>장소<\/td><td>여의도 및 이촌 <b>한강공원<\/b><\/td><\/tr>\n<tr><td>주최<\/td><td>한화그룹 (2000년부터 사회공헌 사업으로 개최)<\/td><\/tr>\n<tr><td>연출팀<\/td><td><b>한국·영국·미국<\/b> 3개국 참여<\/td><\/tr>\n<tr><td>문의<\/td><td>불꽃축제 운영사무국 02-519-9778<\/td><\/tr>\n<\/table><\/div>\n<p>한강공원 관람은 <b>티켓이 필요 없습니다.<\/b> 유료 티켓이 필요한 곳은 아래에서 설명할 <b>노들섬 한 곳<\/b>입니다.<\/p>\n<p>당일 <b>교통 통제·주차장 폐쇄·지하철 무정차 통과<\/b> 여부는 해마다 행사 직전에 서울시·경찰이 따로 발표합니다. 2026년 분은 이 글을 쓰는 시점(2026년 8월 6일)까지 공식 발표가 없어 여기에 적지 않았습니다. 예년 사례를 그대로 옮기면 틀릴 수 있으니, 출발 전 공식 홈페이지의 '행사장 안내'와 서울시 발표를 확인하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 올해 달라진 것 — 노들섬 전 구역 유료<\/h2>\n<p>가장 중요한 변화입니다. 공식 공지 원문은 이렇습니다.<\/p>\n<div class=\"warn\"><b>🚫 노들섬은 티켓 없이 들어갈 수 없습니다<\/b>\n<p style=\"margin:6px 0 0\">\"올해 노들섬은 전체 구역이 '오렌지플레이 존'으로 단독 운영됩니다. 이에 따라 <b>사전 티켓을 구매하신 분들에 한하여 입장이 가능<\/b>하오니…\" — 서울세계불꽃축제 공식 공지<\/p><\/div>\n<p>노들섬 오렌지플레이존의 운영 내용은 다음과 같습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>내용<\/th><\/tr>\n<tr><td>장소<\/td><td>노들섬 (전 구역 유료)<\/td><\/tr>\n<tr><td>운영 시작<\/td><td>2026년 9월 5일(토) <b>13:00 ~<\/b><\/td><\/tr>\n<tr><td>티켓 판매 기간<\/td><td>2026년 8월 3일(월) ~ <b>소진 시까지<\/b><\/td><\/tr>\n<tr><td>구매 제한<\/td><td><b>1인 최대 5매<\/b><\/td><\/tr>\n<tr><td>구입처<\/td><td>오렌지플레이 앱 / 오렌지플레이 티켓<\/td><\/tr>\n<tr><td>티켓 수령<\/td><td><b>현장 수령<\/b> (배송 없음)<\/td><\/tr>\n<tr><td>관람 등급<\/td><td>전체 관람가<\/td><\/tr>\n<\/table><\/div>\n<p>유료존에서는 무대 공연·레크리에이션 이벤트, AR로 즐기는 불꽃놀이, 불꽃 캔들·스트랩 만들기, 불꽃축제 사진 전시, F&amp;B가 함께 운영되고 <b>입장 시 선물<\/b>도 제공된다고 공지에 적혀 있습니다. 낮 1시부터 여니 <b>기다리는 시간 자체를 프로그램으로 채우는 구성<\/b>입니다.<\/p>\n<div class=\"warn\"><b>⚠️ 돈을 냈다고 정면 명당은 아닙니다 — 공식 문구를 그대로 옮깁니다<\/b>\n<p style=\"margin:6px 0 0\">\"노들섬 오렌지플레이존은 <b>메인 불꽃 연출 정면 구역과 거리가 있으며, 일부 시야가 제한될 수 있습니다.<\/b>\"<\/p>\n<p style=\"margin:8px 0 0\">즉 노들섬 티켓의 값어치는 <b>'가장 잘 보이는 자리'가 아니라 '자리 확보와 혼잡 회피, 부대 프로그램'<\/b>에 있습니다. 정면 시야를 원한다면 여의도 쪽이 낫습니다. 이 점을 모르고 예매하면 가장 크게 실망합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 구역별 요금과 우리 가족 총액 계산<\/h2>\n<p>예매처에 표기된 구역별 요금입니다(1인 기준).<\/p>\n<div class=\"tw\"><table>\n<tr><th>구역<\/th><th>1인 요금<\/th><th>2인(부부)<\/th><th>4인 가족<\/th><\/tr>\n<tr><td>1구역<\/td><td><b>110,000원<\/b><\/td><td>220,000원<\/td><td>440,000원<\/td><\/tr>\n<tr><td>2구역<\/td><td>165,000원<\/td><td>330,000원<\/td><td>660,000원<\/td><\/tr>\n<tr><td>3구역<\/td><td>165,000원<\/td><td>330,000원<\/td><td>660,000원<\/td><\/tr>\n<tr><td>4구역<\/td><td><b>220,000원<\/b><\/td><td>440,000원<\/td><td>880,000원<\/td><\/tr>\n<\/table><\/div>\n<p><b>계산 예시 — 4인 가족이 노들섬에서 볼 경우<\/b><\/p>\n<ul>\n<li>가장 싼 1구역: 110,000원 × 4명 = <b>440,000원<\/b><\/li>\n<li>가장 비싼 4구역: 220,000원 × 4명 = <b>880,000원<\/b><\/li>\n<li>→ 구역 선택만으로 <b>44만 원 차이<\/b>가 납니다. 여기에 교통비·식비는 별도입니다.<\/li>\n<\/ul>\n<p><b>구매 제한이 1인 5매<\/b>이므로 4인 가족은 <b>한 사람이 한 번에 결제<\/b>할 수 있습니다. 6명 이상 단체라면 두 사람으로 나눠 결제해야 하고, 이때 <b>같은 구역이 남아 있는지 먼저 확인<\/b>해야 일행이 갈라지지 않습니다.<\/p>\n<p>2구역과 3구역은 요금이 <b>165,000원으로 같습니다.<\/b> 값이 같다면 남은 판단 기준은 무대·불꽃 방향과 동선뿐이므로, 예매 화면의 <b>구역 미리보기(구역도)<\/b>를 반드시 열어 보고 고르세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 골든티켓 초대 이벤트 400명 (8월 23일 마감)<\/h2>\n<p>주최 측이 별도로 진행하는 <b>초대 이벤트<\/b>입니다. 유료 티켓과 완전히 별개이고, <b>응모 창구가 공식 홈페이지가 아니라 앱<\/b>이라는 점이 함정입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>내용<\/th><\/tr>\n<tr><td>응모 기간<\/td><td>2026년 <b>8월 3일(월) ~ 8월 23일(일)<\/b><\/td><\/tr>\n<tr><td>당첨 발표<\/td><td>2026년 <b>8월 24일(월)<\/b><\/td><\/tr>\n<tr><td>당첨 인원<\/td><td><b>총 400명 (1인 2매)<\/b><\/td><\/tr>\n<tr><td>응모 창구<\/td><td><b>PLUS TRIBES 앱<\/b> (공식 홈페이지의 '골든티켓 이벤트' 버튼 → 앱 설치·가입 → 이벤트 배너)<\/td><\/tr>\n<tr><td>참여 방법<\/td><td>① 참여하기를 눌러 질문에 답변 제출 ② 불꽃축제 관련 아티클을 읽고 좋아요를 누르면 당첨 확률 상승<\/td><\/tr>\n<tr><td>당첨 안내<\/td><td>공식 홈페이지 공지 + 앱 푸시 + 등록된 휴대폰 MMS<\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ 미당첨자에게는 연락이 가지 않습니다<\/b>\n<p style=\"margin:6px 0 0\">공지에 명시된 내용입니다. <b>8월 24일(월)<\/b>에 아무 연락이 없으면 떨어진 것으로 보고 <b>유료 티켓이나 한강공원 관람으로 계획을 바꾸면 됩니다.<\/b> 연락을 기다리다 유료 티켓이 소진되는 것이 가장 아까운 경우입니다.<\/p><\/div>\n<p>배정 규모는 <b>400명 × 2매 = 800석<\/b>입니다. 유료 티켓 판매와 별개로 진행되므로 기대치는 낮게 잡되, 응모 자체는 <b>몇 분이면 끝나므로<\/b> 8월 23일 전에 한 번 넣어 두는 편이 낫습니다. 휴대폰 번호를 정확히 등록해 두는 것도 잊지 마세요 — 당첨 안내가 MMS로 갑니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 티켓 없이 보는 법 — 한강공원과 유료존의 차이<\/h2>\n<p>공식 안내가 사전 티켓을 요구하는 곳은 <b>노들섬뿐<\/b>이고, 여의도·이촌 한강공원 쪽에는 티켓 요건이 안내돼 있지 않습니다. 두 선택지가 무엇이 다른지 항목별로 비교하면 판단이 쉬워집니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>항목<\/th><th>노들섬 오렌지플레이존<\/th><th>여의도·이촌 한강공원<\/th><\/tr>\n<tr><td>비용(1인)<\/td><td>110,000 ~ 220,000원<\/td><td><b>티켓 요건 안내 없음<\/b><\/td><\/tr>\n<tr><td>입장<\/td><td><b>사전 티켓 필수<\/b><\/td><td>별도 입장 티켓 안내 없음<\/td><\/tr>\n<tr><td>정면 시야<\/td><td>공식 안내상 <b>정면 아님·일부 제한<\/b><\/td><td>여의도 쪽이 메인 연출 방향<\/td><\/tr>\n<tr><td>자리 확보<\/td><td>티켓으로 확정<\/td><td>이른 시간부터 자리 잡기 필요<\/td><\/tr>\n<tr><td>인원<\/td><td>판매 수량만큼 제한<\/td><td>제한 없음<\/td><\/tr>\n<tr><td>부대 프로그램<\/td><td>공연·AR·만들기·전시·F&amp;B·입장 선물<\/td><td>없음<\/td><\/tr>\n<tr><td>시작 시간<\/td><td>13:00부터 입장<\/td><td>제한 없음(자리 경쟁은 이른 시간)<\/td><\/tr>\n<\/table><\/div>\n<p><b>판단은 한 줄로 정리됩니다.<\/b> \"정면에서 제일 잘 보고 싶다\"면 <b>여의도 한강공원<\/b>이고, \"자리 싸움과 인파를 피하고 낮부터 놀거리와 함께 편하게 있고 싶다\"면 <b>유료존<\/b>입니다. <b>돈을 더 낸다고 더 잘 보이는 구조가 아니라는 것<\/b>이 올해 이 축제의 핵심입니다.<\/p>\n<p>세 번째 선택지도 있습니다. 공식 홈페이지가 <b>온라인 생중계<\/b>를 안내하고 있어, 이동과 인파가 부담되면 <b>집에서 중계로 보는 방법<\/b>도 있습니다. 무릎이 안 좋은 부모님과 함께라면 현실적인 대안입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 예매 전 놓치기 쉬운 7가지<\/h2>\n<ol>\n<li><b>노들섬은 티켓 없이 들어갈 수 없습니다.<\/b> 예전 기억으로 돗자리를 들고 갔다가는 입구에서 되돌아 나오게 됩니다.<\/li>\n<li><b>유료존이 정면 명당이 아닙니다.<\/b> 공식 공지에 \"정면 구역과 거리가 있으며 일부 시야가 제한될 수 있다\"고 적혀 있습니다.<\/li>\n<li><b>티켓은 현장 수령입니다.<\/b> 배송이 없으므로 당일 수령 장소·시간을 예매 화면에서 확인하고 신분 확인 수단을 챙기세요.<\/li>\n<li><b>판매 종료일이 정해져 있지 않습니다.<\/b> \"소진 시까지\"이므로 마감일을 기다릴 이유가 없습니다.<\/li>\n<li><b>구매는 1인 5매까지.<\/b> 6명 이상은 나눠 결제해야 하고, 그 사이 같은 구역이 마감될 수 있습니다.<\/li>\n<li><b>골든티켓은 8월 23일(일) 마감, 발표는 8월 24일(월).<\/b> 응모는 공식 홈페이지가 아니라 <b>PLUS TRIBES 앱<\/b>에서만 됩니다.<\/li>\n<li><b>취소·환불 수수료는 예매 화면에서 직접 확인하세요.<\/b> 이 글에서는 예매처가 이미지로만 안내하고 있어 수치를 옮기지 않았습니다. 공연 티켓 일반 기준은 아래 관련 글에 정리해 두었습니다.<\/li>\n<\/ol>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b>\n<a href=\"https://www.hanwhafireworks.com/\" target=\"_blank\" rel=\"nofollow\">▸ 한화와 함께하는 서울세계불꽃축제 2026 공식 홈페이지 (공지·행사장 안내·생중계)<\/a>\n<a href=\"https://ticket.orange-play.co.kr/\" target=\"_blank\" rel=\"nofollow\">▸ 오렌지플레이 티켓 — 노들섬 오렌지플레이존 예매·구역 미리보기<\/a>\n<a href=\"https://festival.seoul.go.kr/festival/main/festivalView.do?festacode=379\" target=\"_blank\" rel=\"nofollow\">▸ 서울시 축제 정보 — 서울세계불꽃축제 일정·장소<\/a>\n<\/div>\n<div class=\"end\"><b>✅ 마무리<\/b>\n<p style=\"margin:8px 0 0\">올해 기억할 것은 세 가지입니다. <b>① 불꽃쇼는 9월 5일(토), 여의도·이촌 한강공원<\/b>, <b>② 노들섬은 전 구역이 유료로 바뀌어 티켓 없이 못 들어가고 요금은 11만~22만 원<\/b>, <b>③ 골든티켓 초대 이벤트는 8월 23일(일)까지 400명 응모<\/b>. 특히 노들섬 티켓은 \"정면 명당\"이 아니라 \"자리·편의\"를 사는 것이라는 점을 알고 결정하세요. 교통 통제와 수령 방법은 행사 직전 공지가 뜨므로 출발 전 공식 페이지를 한 번 더 확인하시기 바랍니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월 6일<\/b> 확인 기준이며, 요금·일정·판매 상황은 변동될 수 있습니다(티켓은 소진 시 판매 종료). 예매 전 공식 사이트에서 확인하세요.<br>출처: <a href=\"https://www.hanwhafireworks.com/\" target=\"_blank\" rel=\"nofollow\">서울세계불꽃축제 2026 공식 홈페이지 공지<\/a> · <a href=\"https://ticket.orange-play.co.kr/\" target=\"_blank\" rel=\"nofollow\">오렌지플레이 티켓 판매 페이지<\/a> · <a href=\"https://festival.seoul.go.kr/festival/main/festivalView.do?festacode=379\" target=\"_blank\" rel=\"nofollow\">서울시 축제 정보<\/a><\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b>\n<a href=\"https://lifeinfo8975.blogspot.com/2026/07/blog-post_04.html\">▸ 공연 티켓 취소 환불 수수료 기준 총정리<\/a>\n<a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_890.html\">▸ 전국 지역축제 일정 찾는 방법 계절별 가이드 총정리<\/a>\n<a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01107282077.html\">▸ 콘서트 암표 방지법 시행 정가 예매 취소표 신고 방법 총정리<\/a>\n<\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 요금·일정·응모 조건은 <b>공식 홈페이지와 예매처를 직접 확인<\/b>해 정리했으며, 본문에 출처와 확인 기준일을 표기했습니다. 확인되지 않은 교통 통제·환불 수수료는 일부러 싣지 않았습니다. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n"},{"code":"D1-05","title":"2026 주민등록 사실조사 비대면 참여 방법 정부24 앱 과태료 총정리 (9월 7일 마감)","lane":"info","thumb":"156_resident_survey.png","draft":"주민등록사실조사_글_HTML.txt","facts":"비대면 7/20 09:00~9/7 24:00 · 방문조사 9/8~11/9 · 전체 7/20~12/14 (행안부 보도자료 2026-08-07 확인) / 정부24 앱·GPS+T맵 위치확인·위치권한 필수 / 과태료 주민등록법 제40조 ②사실조사 거부·기피 50만↓ ③최고후 기간내 미신고 10만↓ ④신고·신청 기간내 미이행 5만↓ (시행 2025.7.22) — '비대면 미참여=50만'은 조문에 없음 / 인센티브 언급 없음 → 쓰지 말 것","added":"2026-08-07","thumb_data":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCACIAQQDASIAAhEBAxEB/8QAHwAAAQUBAQ lsg .top{display:inline-block;font-size:13px;color:#8a97ab;text-decoration:none;margin:2px 0 6px}\n.lsg .warn{background:#fdf1f1;border:1px solid #f3c9c9;border-radius:12px;padding:14px 18px;margin:18px 0}\n.lsg .warn b{display:block;font-size:14px;color:#c0392b;margin-bottom:6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">생활·행정<\/span>\n<p>휴대폰으로 몇 분이면 끝나는 <b>주민등록 사실조사<\/b> 비대면 참여가 <b>2026년 9월 7일 24시<\/b>에 마감됩니다. 이 기한을 넘기면 9월 8일부터 조사원이 집으로 찾아오는 방문조사로 자동 전환됩니다.<\/p>\n<p>인터넷에는 \"참여 안 하면 과태료 50만원\"이라는 글이 많은데, <b>주민등록법 조문을 그대로 읽어 보면 사실과 다릅니다.<\/b> 과태료는 상황에 따라 50만원·10만원·5만원으로 갈리고, 비대면 조사에 참여하지 않은 것 자체에 붙는 과태료 규정은 조문에 없습니다. 참여 방법부터 과태료의 정확한 구분, 방문조사와의 비교까지 공식 자료 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 정부24 앱으로 참여하는 방법 — 위치가 안 잡히면 실패한다<\/a><a href=\"#sec2\">2. 9월 7일을 놓치면 어떻게 되나 — 과태료의 진실<\/a><a href=\"#sec3\">3. 우리 집이 '중점조사 대상'인가<\/a><a href=\"#sec4\">4. 비대면 vs 방문조사, 무엇을 고를까<\/a><a href=\"#sec5\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec2\">👉 과태료 기준부터 확인하기<\/a>\n\n<h2 id=\"sec1\">1. 정부24 앱으로 참여하는 방법 — 위치가 안 잡히면 실패한다<\/h2>\n<p>2026년 주민등록 사실조사의 비대면 참여 기간은 <b>7월 20일(월) 9시부터 9월 7일(월) 24시까지<\/b>입니다. 방법 자체는 간단하지만, 매년 \"했는데 안 됐다\"는 사례가 나오는 이유는 <b>위치 확인<\/b> 때문입니다.<\/p>\n<ul>\n<li><b>참여 앱<\/b>: 정부24 <b>앱<\/b>에 접속해 사실조사 사항에 응답합니다.<\/li>\n<li><b>장소 조건<\/b>: 행정안전부 안내는 <b>\"본인의 주민등록지에서\"<\/b> 앱에 접속하도록 하고 있습니다. 회사·카페·친척 집처럼 주민등록지가 아닌 곳에서 열면 확인이 되지 않습니다.<\/li>\n<li><b>위치 확인 방식<\/b>: 휴대전화 <b>위치기반(GPS)<\/b>으로 확인하며, 민간 지도 서비스(<b>T맵<\/b>)를 활용해 참여자의 현재 위치가 표기됩니다.<\/li>\n<li><b>사전 준비<\/b>: 스마트폰 <b>환경설정에서 정부24 앱의 위치 접근 권한을 허용<\/b>해야 합니다. 이 설정이 꺼져 있으면 진행이 막힙니다.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ 함정 ① — \"집에서 열어야 한다\"<\/b>\n<p style=\"margin:8px 0 0\">가장 흔한 실패가 여기서 나옵니다. 출근길이나 외출 중에 \"잠깐 처리하자\"며 앱을 열면 위치가 주민등록지와 달라 참여가 되지 않습니다. <b>집에 있을 때, 위치 권한을 켠 상태로<\/b> 진행하세요. 마감일에 몰아서 하려다 이 문제로 막히면 그대로 방문조사 대상이 됩니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 9월 7일을 놓치면 어떻게 되나 — 과태료의 진실<\/h2>\n<p>비대면 기간이 끝나면 <b>9월 8일(화)부터 11월 9일(월)까지<\/b> 조사원이 직접 세대를 방문하는 방문조사가 진행됩니다. 즉 <b>비대면에 참여하지 않았다고 해서 곧바로 불이익이 생기는 구조가 아니라, 조사 방식이 바뀌는 것<\/b>입니다. 전체 사실조사 기간은 7월 20일부터 12월 14일까지입니다.<\/p>\n<p>문제는 과태료입니다. <b>주민등록법 제40조<\/b>를 조문 그대로 보면 금액이 세 가지로 갈립니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>어떤 경우인가<\/th><th>근거 조문<\/th><th>과태료<\/th><\/tr>\n<tr><td>정당한 사유 없이 <b>사실조사를 거부하거나 기피<\/b>한 경우<\/td><td>제40조 ②<\/td><td><b>50만원 이하<\/b><\/td><\/tr>\n<tr><td>최고(催告)를 받거나 공고된 사람이 <b>기간 내에 신고·신청을 하지 않은<\/b> 경우<\/td><td>제40조 ③<\/td><td>10만원 이하<\/td><\/tr>\n<tr><td>전입신고 등 <b>신고·신청을 정해진 기간 내에 하지 않은<\/b> 경우<\/td><td>제40조 ④<\/td><td>5만원 이하<\/td><\/tr>\n<\/table><\/div>\n<p>부과·징수 주체는 <b>시장·군수 또는 구청장<\/b>입니다(제40조 ⑤).<\/p>\n<div class=\"warn\"><b>⚠️ 함정 ② — \"비대면 참여 안 하면 50만원\"은 조문에 없다<\/b>\n<p style=\"margin:8px 0 0\">조문에 적힌 50만원 이하는 <b>사실조사를 \"거부 또는 기피\"했을 때<\/b>입니다. 조사원의 방문조사에 응하고 정상적으로 확인이 끝나면 거부·기피에 해당하지 않습니다. 반면 문을 열어주지 않거나 응답을 계속 회피하면 이 조항이 적용될 수 있습니다. <b>비대면 미참여 = 자동 50만원이 아니라, 조사 자체를 끝까지 거부하는 것이 문제<\/b>라는 점을 구분해서 이해하는 것이 정확합니다.<\/p><\/div>\n<div class=\"warn\"><b>⚠️ 함정 ③ — 참여 경품·인센티브 이야기<\/b>\n<p style=\"margin:8px 0 0\">\"참여하면 상품을 준다\"는 이야기가 돌지만, <b>행정안전부 보도자료에는 인센티브에 대한 언급이 없습니다.<\/b> 지자체가 자체적으로 홍보 이벤트를 하는 경우가 있을 수 있으므로, 확실한 것은 <b>관할 주민센터에 직접 확인<\/b>하는 것입니다. 금액이나 경품을 단정하는 글은 믿지 마세요.<\/p><\/div>\n<p>한편 조사 결과에 따라 <b>거주불명 등록<\/b>이나 직권 조치가 이뤄질 수 있는데, 이 처분에 이의가 있다면 <b>주민등록법 제21조<\/b>에 따라 <b>30일 이내<\/b>에 이의를 신청할 수 있습니다. 주민등록지는 <b>공법 관계에서의 주소<\/b>로 취급되므로(제23조 ①), 실제 사는 곳과 주소가 어긋난 상태를 오래 두는 것은 권하지 않습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 우리 집이 '중점조사 대상'인가<\/h2>\n<p>사실조사는 전 세대를 대상으로 하지만, 그중 특별히 확인이 필요한 <b>중점조사 대상<\/b>이 따로 지정됩니다. 행정안전부가 밝힌 대상은 다음과 같습니다.<\/p>\n<ul>\n<li>100세 이상 고령자<\/li>\n<li>5년 이상 장기 거주불명자<\/li>\n<li>사망 의심자<\/li>\n<li>고위험 복지위기가구<\/li>\n<li>장기 미인정 결석 및 학령기 미취학아동<\/li>\n<\/ul>\n<p>여기에 해당하는 세대라면 비대면 응답만으로 끝나지 않고 확인 절차가 더 이어질 수 있습니다. 특히 <b>부모님이 100세에 가까우시거나 오래 연락이 닿지 않는 가족이 세대에 남아 있는 경우<\/b>, 자녀가 미리 상황을 파악해 두는 편이 좋습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 비대면 vs 방문조사, 무엇을 고를까<\/h2>\n<p>둘 중 아무거나 골라도 되는 것은 아니고, <b>비대면 기간이 먼저 지나가고 그 다음이 방문조사<\/b>입니다. 다만 \"지금 굳이 앱으로 해야 하나\"를 고민 중이라면 아래 기준으로 판단하시면 됩니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>비대면 조사 (정부24 앱)<\/th><th>방문 조사<\/th><\/tr>\n<tr><td>기간<\/td><td>7/20 09:00 ~ <b>9/7 24:00<\/b><\/td><td>9/8 ~ 11/9<\/td><\/tr>\n<tr><td>진행 방식<\/td><td>본인이 앱에서 응답<\/td><td>조사원이 세대 방문<\/td><\/tr>\n<tr><td>장소 조건<\/td><td><b>주민등록지<\/b>에서 GPS 확인<\/td><td>집에서 대면 확인<\/td><\/tr>\n<tr><td>일정 조율<\/td><td>기간 안에 아무 때나<\/td><td>조사원 방문 시간에 맞춰야 함<\/td><\/tr>\n<\/table><\/div>\n<p><b>판단 기준<\/b> — 주민등록지에 실제로 살고 있고 스마트폰을 쓸 수 있다면 <b>비대면이 압도적으로 편합니다<\/b>. 낮에 집을 비우는 맞벌이 세대라면 더욱 그렇습니다. 조사원 방문은 시간을 맞춰야 하고, 부재가 반복되면 확인 절차가 길어집니다.<\/p>\n<p>반대로 <b>주민등록지와 실제 거주지가 다른 경우<\/b>에는 앱으로 위치가 잡히지 않으므로 비대면 참여 자체가 어렵습니다. 이때는 앱을 붙들고 씨름할 것이 아니라 <b>전입신고로 주소를 실제 거주지에 맞추는 것이 먼저<\/b>입니다. 신고·신청을 기간 내에 하지 않으면 앞서 본 5만원 이하 과태료 대상이 될 수 있습니다.<\/p>\n<p>부모님 세대를 대신 챙기는 경우라면, 어르신 휴대폰에 정부24 앱과 위치 권한을 설정해 드리고 <b>어르신 댁에서<\/b> 함께 진행하는 것이 가장 확실합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.mois.go.kr/frt/bbs/type010/commonSelectBoardArticle.do?bbsId=BBSMSTR_000000000008&amp;nttId=127848\" target=\"_blank\" rel=\"nofollow\">▸ 행정안전부 — 2026년 주민등록 사실조사 보도자료<\/a><a href=\"https://www.gov.kr\" target=\"_blank\" rel=\"nofollow\">▸ 정부24 — 앱 설치 및 민원 안내<\/a><a href=\"https://www.law.go.kr/법령/주민등록법\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 주민등록법(제40조 과태료)<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">비대면 참여 마감은 <b>9월 7일 24시<\/b>, 놓치면 9월 8일부터 방문조사로 넘어갑니다. 앱은 반드시 <b>주민등록지에서 위치 권한을 켜고<\/b> 열어야 하고, 과태료는 \"참여를 안 해서\"가 아니라 <b>조사를 거부·기피할 때<\/b> 50만원 이하가 적용됩니다. 세부 일정과 방식은 지자체별로 안내가 다를 수 있으니 관할 주민센터에서 확인하세요.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월<\/b> 기준이며, 변동될 수 있습니다. 참여 전 공식 사이트에서 확인하세요.<br>출처: <a href=\"h tom:8px}\n.lsg .toc a{display:block;color:#2a4a73;text-decoration:none;padding:4px 0;font-size:15px}\n.lsg .cta{display:block;text-align:center;background:linear-gradient(90deg,#7C5CE0,#3b7fd0);color:#fff !important;font-weight:800;font-size:17px;padding:15px 18px;border-radius:12px;text-decoration:none;margin:22px 0}\n.lsg table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:15px}\n.lsg th,.lsg td{border:1px solid #e2e8f2;padding:10px 12px;text-align:center}\n.lsg th{background:#eef3fb}\n.lsg .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 16px}\n.lsg .tw table{margin:0}\n.lsg .end{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:16px 20px;margin-top:24px}\n.lsg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .rel{background:#f4f7fc;border:1px solid #e0e8f4;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#7C5CE0;margin-bottom:8px}\n.lsg .rel a{display:block;color:#2a4a73;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#8a97ab;text-decoration:none;margin:2px 0 6px}\n.lsg .warn{background:#fff4f2;border:1px solid #f6cfc6;border-radius:12px;padding:14px 18px;margin:14px 0}\n.lsg .warn b{display:block;font-size:15px;color:#c0442a;margin-bottom:6px}\n.lsg .tip{background:#f2f7ff;border:1px solid #cfe0f6;border-radius:12px;padding:14px 18px;margin:14px 0}\n.lsg .tip b{display:block;font-size:15px;color:#1b5fa8;margin-bottom:6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>단풍철에 가장 흔한 낭패는 <b>새벽부터 차를 몰고 갔는데 입구에서 돌려보내지는 것<\/b>입니다. 국립공원 중에는 <b>미리 예약한 사람만 들어갈 수 있는 구간<\/b>이 따로 있고, 그 구간은 현장에서 사정한다고 열어 주지 않습니다.<\/p>\n<p>이 글은 국립공원 예약시스템을 직접 열어 <b>지금 예약 화면에 올라와 있는 구간 전부<\/b>와 <b>구간별 마감 시각·정원·주차 조건<\/b>을 확인해 정리한 것입니다. 특히 <b>북한산 우이령은 2026년 4월부터 평일에는 예약이 필요 없게 바뀌었고<\/b>, <b>설악산 흘림골은 10~11월에만 예약제로 전환<\/b>됩니다. 이 두 가지를 모르면 예약을 안 해도 될 날에 애를 태우거나, 예약이 필요한 날에 그냥 갔다가 돌아오게 됩니다.<\/p>\n<p>예약 자체는 5분이면 끝납니다. 어려운 것은 <b>어디가 예약 대상인지, 언제까지 눌러야 하는지, 못 가게 됐을 때 어떻게 해야 불이익이 없는지<\/b>입니다. 그 세 가지를 순서대로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 내가 갈 곳이 예약 대상인가 — 전체 구간표<\/a><a href=\"#sec2\">2. 언제까지 눌러야 하나 — 마감 시각 역산<\/a><a href=\"#sec3\">3. 가을 단풍 핵심 5개 구간 상세<\/a><a href=\"#sec4\">4. 북한산 우이령이 2026년 4월부터 달라졌다<\/a><a href=\"#sec5\">5. 노쇼 페널티와 월 4건 제한<\/a><a href=\"#sec6\">6. 예약 전 놓치기 쉬운 8가지<\/a><a href=\"#sec7\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec2\">👉 내일 가려는데 지금 예약이 되는지부터 확인하기<\/a>\n\n<h2 id=\"sec1\">1. 내가 갈 곳이 예약 대상인가 — 전체 구간표<\/h2>\n<p>국립공원 전부가 예약제인 것이 아닙니다. <b>예약이 필요한 곳은 정해진 몇 개 구간뿐<\/b>이고, 나머지는 평소처럼 그냥 가면 됩니다. 확인일 기준 국립공원 예약시스템의 '탐방로 예약' 화면에 올라와 있는 구간은 <b>11개 공원 14개 구간<\/b>입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>국립공원<\/th><th>예약 대상 구간<\/th><\/tr>\n<tr><td>가야산<\/td><td>가야산 만물상<\/td><\/tr>\n<tr><td>다도해해상<\/td><td>진리당–진리당<\/td><\/tr>\n<tr><td><b>북한산<\/b><\/td><td><b>북한산 우이령<\/b> (주말·공휴일만)<\/td><\/tr>\n<tr><td><b>설악산<\/b><\/td><td><b>설악산 곰배골<\/b><\/td><\/tr>\n<tr><td>소백산<\/td><td>소백산 초암사~국망봉<\/td><\/tr>\n<tr><td>속리산<\/td><td>속리산 도명산 · 속리산 묘봉<\/td><\/tr>\n<tr><td>오대산<\/td><td>오대산 동대산<\/td><\/tr>\n<tr><td>월악산<\/td><td>월악산 옥순봉·구담봉 · 월악산 황장산<\/td><\/tr>\n<tr><td>주왕산<\/td><td>주왕산 절골~가메봉<\/td><\/tr>\n<tr><td><b>지리산<\/b><\/td><td><b>지리산 노고단<\/b> · 지리산 칠선계곡<\/td><\/tr>\n<tr><td>태백산<\/td><td>태백산 두문동재~대덕산<\/td><\/tr>\n<\/table><\/div>\n<div class=\"tip\"><b>💡 여기에 가을에만 한 곳이 더 붙습니다 — 설악산 흘림골<\/b>\n<p style=\"margin:6px 0 0\">흘림골은 <b>1~9월과 12월에는 예약 없이 다니는 일반 탐방로<\/b>인데, <b>10월~11월에만 예약제로 전환<\/b>됩니다. 그래서 상시 예약 목록에는 보이지 않다가 단풍철이 되면 나타납니다. <b>단풍 보러 가는 사람이 가장 많이 걸리는 구간<\/b>이 바로 여기입니다.<\/p><\/div>\n<p>반대로 <b>위 표에 없는 공원은 확인일 기준으로 예약 없이 갈 수 있습니다.<\/b> 다만 흘림골처럼 <b>계절에 따라 예약제로 바뀌는 구간이 있으므로<\/b>, 가을에 갈 계획이라면 출발 전 예약 화면에서 <b>가려는 공원 이름이 목록에 새로 떠 있지 않은지<\/b> 한 번만 확인하세요. 확인은 30초면 끝납니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 언제까지 눌러야 하나 — 마감 시각 역산<\/h2>\n<p>탐방로 예약은 야영장·대피소처럼 매달 정해진 날에 문이 열리는 <b>추첨제가 아니라 연중 상시 접수<\/b>입니다. 대신 <b>마감 시각<\/b>이 있고, 이 시각이 구간마다 다릅니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>기준<\/th><\/tr>\n<tr><td>접수 방식<\/td><td><b>상시(연중)<\/b> — 추첨 없음<\/td><\/tr>\n<tr><td>예약 마감(일반)<\/td><td>이용 <b>전날 14시 전<\/b>까지<\/td><\/tr>\n<tr><td>예약 마감(우이령·노고단)<\/td><td><b>이용 당일 16시<\/b>까지<\/td><\/tr>\n<tr><td>취소 가능<\/td><td>이용 <b>당일 12시 전<\/b>까지<\/td><\/tr>\n<tr><td>1개월 최대 예약<\/td><td><b>4건<\/b> (우이령은 제한 없음)<\/td><\/tr>\n<tr><td>대기 예약<\/td><td>탐방로는 <b>대기 없음<\/b><\/td><\/tr>\n<\/table><\/div>\n<p><b>계산 예시 — \"내일 토요일에 가려는데 지금 되나?\"<\/b> 오늘이 금요일 <b>오후 3시<\/b>라고 해 봅시다.<\/p>\n<ul>\n<li>가고 싶은 곳이 <b>오대산 동대산·속리산 묘봉 같은 일반 구간<\/b>이라면 → 마감은 <b>전날 14시<\/b>. 오후 3시는 이미 <b>1시간 지났습니다.<\/b> 내일은 못 갑니다. 일요일로 미루고 <b>토요일 14시 전<\/b>에 누르세요.<\/li>\n<li>가고 싶은 곳이 <b>북한산 우이령·지리산 노고단<\/b>이라면 → 마감은 <b>당일 16시<\/b>. 내일 아침에 일어나서 눌러도 되고, 심지어 <b>가는 길에도<\/b> 됩니다.<\/li>\n<\/ul>\n<p>즉 <b>\"전날 오후 2시\"<\/b>라는 한 줄만 외우면 대부분 해결됩니다. 금요일 퇴근길에 주말 산행을 결심하면 늦는 구조라서, <b>주말 계획은 목요일 밤이나 금요일 오전에 눌러 두는 편<\/b>이 안전합니다.<\/p>\n<div class=\"tip\"><b>💡 인터넷이 어려우면 전화로도 됩니다<\/b>\n<p style=\"margin:6px 0 0\"><b>북한산 우이령<\/b>과 <b>지리산 노고단<\/b>은 <b>자동전화예약 1670-9202<\/b>로도 예약할 수 있습니다. 두 곳 모두 <b>현장 접수<\/b> 또는 <b>인터넷<\/b>과 병행되는 곳이라, 스마트폰 예약이 부담스러운 부모님께는 이 번호를 알려 드리면 됩니다. 예약 문의는 <b>1670-9201<\/b>(평일 09~18시, 점심 12~13시)입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 가을 단풍 핵심 5개 구간 상세<\/h2>\n<p>단풍철에 문의가 몰리는 구간만 골라 공식 안내 내용을 그대로 정리했습니다. <b>거리·소요 시간·정원·주차 조건이 제각각<\/b>이라 표로 먼저 비교하면 고르기 쉽습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구간<\/th><th>거리·소요<\/th><th>정원<\/th><th>예약 방식<\/th><th>난이도 감<\/th><\/tr>\n<tr><td><b>지리산 노고단<\/b><\/td><td>편도 500m<br>30분<\/td><td>1,870명<\/td><td>인터넷·현장·전화<\/td><td>가장 쉬움<\/td><\/tr>\n<tr><td><b>북한산 우이령<\/b><\/td><td>3.5km<br>1시간 30분~2시간<\/td><td>1,190명<br>(주말·공휴일)<\/td><td>인터넷·전화<\/td><td>완만<\/td><\/tr>\n<tr><td><b>설악산 흘림골<\/b><\/td><td>편도 3.1km<br>2시간 30분<\/td><td>일 5,000명<br>시간지정제<\/td><td>인터넷 100%<br>(잔여분 현장)<\/td><td>보통·일방통행<\/td><\/tr>\n<tr><td><b>설악산 곰배골<\/b><\/td><td>왕복 3.7km<br>4시간<\/td><td>350명<\/td><td>인터넷·현장<\/td><td>보통<\/td><\/tr>\n<tr><td><b>지리산 칠선계곡<\/b><\/td><td>편도 10km<br>8시간<\/td><td>60명<\/td><td>인터넷<\/td><td><b>매우 어려움<\/b><\/td><\/tr>\n<\/table><\/div>\n\n<h3>지리산 노고단 — 30분이면 오르는 가을 명소<\/h3>\n<p>노고단 고개에서 정상까지 <b>편도 500m, 우회로 700m, 30분<\/b>입니다. <b>연중(1월 1일~12월 31일)<\/b> 운영하고 <b>5시~17시, 입장 마감 16시<\/b>입니다. 정원이 <b>1,870명<\/b>으로 넉넉한 편이고 인터넷·현장·전화 모두 됩니다. 주차는 <b>성삼재주차장<\/b>(전남 구례군 산동면 노고단로 1068)을 이용합니다.<\/p>\n<div class=\"warn\"><b>⚠️ 노고단은 '도로'가 변수입니다<\/b>\n<p style=\"margin:6px 0 0\">공식 주의사항에 <b>\"방문 전 공지사항에서 탐방로, 구례군 군도 12호선(성삼재 방향) 도로 통제 확인 필수\"<\/b>라고 적혀 있습니다. 예약이 됐어도 <b>성삼재로 올라가는 도로가 막히면 갈 수 없습니다.<\/b> 출발 전 공지사항을 한 번 더 보세요. 늦가을에는 결빙 대비 아이젠 착용도 안내돼 있습니다.<\/p><\/div>\n\n<h3>설악산 흘림골 — 10~11월에만 예약제, 일방통행<\/h3>\n<p>흘림골탐방지원센터에서 용소폭포 삼거리까지 <b>편도 3.1km, 2시간 30분<\/b>이며 <b>일방통행<\/b>입니다. 되돌아 나올 수 없다는 뜻이라, <b>차를 어디에 두고 어떻게 돌아올지를 출발 전에 정해 둬야 합니다.<\/b> 주차는 <b>오색마을 주차장<\/b>이고 <b>44번 국도(한계령 도로)변 주차는 불가<\/b>입니다.<\/p>\n<ul>\n<li><b>10월(성수기)<\/b>: 8시~15시, <b>한 시간 단위 예약<\/b><\/li>\n<li><b>11월<\/b>: 9시~14시, 한 시간 단위 예약<\/li>\n<li>예약 마감: <b>이용 예정일 하루 전 14시<\/b>까지<\/li>\n<li>정원: <b>일 5,000명 시간지정제<\/b> · <b>인터넷 예약 100%<\/b>(잔여분만 흘림골 탐방지원센터에서 현장 접수)<\/li>\n<\/ul>\n<p>공식 안내는 이 구간이 <b>2015년 낙석 사고가 있었던 곳<\/b>이며 안전시설을 보강했지만 <b>취약지점 22개소(경광등 설치)는 신속하게 지나갈 것<\/b>을 당부하고 있습니다. 기상특보 시에는 탐방을 중지하고 하산해야 합니다.<\/p>\n\n<h3>설악산 곰배골 — 월·화는 아예 쉽니다<\/h3>\n<p>점봉산분소에서 곰배령까지 <b>3.7km 왕복 4시간<\/b>, <b>9시~14시, 입장 마감 11시<\/b>, 정원 <b>350명<\/b>입니다. 운영은 연중이지만 <b>산불 방지 기간과 매주 월·화요일은 제외<\/b>됩니다. <b>월요일 휴가를 내고 가려던 계획이 그대로 무너지는 지점<\/b>이니 요일부터 확인하세요.<\/p>\n<div class=\"warn\"><b>⚠️ 곰배령은 관리 기관이 둘로 나뉩니다<\/b>\n<p style=\"margin:6px 0 0\">같은 곰배령이라도 <b>강선리 마을로 하산하는 방향(산림청 구간)<\/b>은 국립공원 예약시스템이 아니라 <b>산림청 점봉산산림생태관리센터(033-463-8166)<\/b>로 예약해야 합니다. 한쪽에서만 예약하고 갔다가 반대편에서 막히는 경우가 여기서 나옵니다.<\/p><\/div>\n\n<h3>지리산 칠선계곡 — 정원 60명, 새벽 6시 40분 집결<\/h3>\n<p>추성주차장에서 칠선폭포를 거쳐 천왕봉까지 <b>편도 10km, 8시간<\/b>입니다. <b>주 5회(금~화)<\/b> 운영하고 정원은 <b>60명<\/b>뿐입니다. 예전에는 가이드 동반이었지만 <b>자기주도형 탐방으로 바뀌었습니다.<\/b><\/p>\n<ul>\n<li>출발 당일 <b>06시 40분까지 추성주차장 집결<\/b> → 안전교육 후 출발<\/li>\n<li>현장에서 <b>스마트트래커·식별 스트랩 수령<\/b>, 안전교육 이수, 개인정보 동의서 작성<\/li>\n<li>탐방 후 <b>스마트트래커·스트랩 반납<\/b><\/li>\n<li>공식 권고: <b>난이도가 매우 어려우므로 체력을 고려하고 최소 2인 이상 팀으로 신청<\/b><\/li>\n<\/ul>\n<p>기상·탐방로 상태에 따라 <b>사전 안내 후 운영이 취소될 수 있다<\/b>고 명시돼 있습니다. 숙박을 잡아 두는 경우라면 이 문장을 감안하세요. 운영 기간은 해마다 따로 공지되므로 <b>예약 화면에서 그해 날짜를 직접 확인<\/b>해야 합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 북한산 우이령이 2026년 4월부터 달라졌다<\/h2>\n<p>서울 근교에서 가장 많이 찾는 예약 구간입니다. 공식 안내에 <b>\"2026년 4월 ~ 별도 안내 시까지\"<\/b>라는 단서와 함께 다음과 같이 바뀌어 있습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>평일<\/th><th>주말·공휴일<\/th><\/tr>\n<tr><td>예약<\/td><td><b>필요 없음<\/b><\/td><td><b>예약제 운영<\/b><\/td><\/tr>\n<tr><td>정원<\/td><td>—<\/td><td><b>1,190명<\/b><\/td><\/tr>\n<tr><td>예약 마감<\/td><td>—<\/td><td>이용 <b>당일 16시<\/b><\/td><\/tr>\n<tr><td>예약 방법<\/td><td>—<\/td><td>인터넷 · 자동전화 1670-9202<\/td><\/tr>\n<tr><td>운영 시간<\/td><td colspan=\"2\">9시~16시 (입장 마감 3~11월 16시 / 12~2월 15시)<\/td><\/tr>\n<\/table><\/div>\n<p><b>판단은 간단합니다.<\/b> 평일에 시간을 낼 수 있다면 <b>예약 절차 자체가 사라집니다.<\/b> 은퇴 후 평일 산행이 가능한 분이라면 굳이 사람 몰리는 주말에 정원 경쟁을 할 이유가 없습니다.<\/p>\n<div class=\"warn\"><b>⚠️ 우이령은 주차장이 없습니다<\/b>\n<p style=\"margin:6px 0 0\">공식 안내가 <b>\"주차장이 없으므로 대중교통을 이용해 주시기 바랍니다\"<\/b>라고 못 박고 있습니다. 예약만 하고 차를 몰고 가면 댈 곳이 없습니다.<\/p>\n<ul style=\"margin:8px 0 0\">\n<li><b>우이 방향<\/b>: 우이신설경전철 '북한산우이역(종점)' 2번 출구 / 또는 4호선 수유역 → 120번 버스 → 우이동 종점 → 2.3km 지점<\/li>\n<li><b>교현 방향<\/b>: 양주 37번 버스 → '우이령·오봉산 석굴암 입구' 하차<\/li>\n<\/ul><\/div>\n<p>구간은 <b>우이↔교현 3.5km, 1시간 30분~2시간<\/b>으로 어느 쪽에서 출발해도 같습니다. <b>양쪽 끝이 서로 다른 지역(서울 강북구 ↔ 경기 양주시)<\/b>이므로, 대중교통으로 간다면 <b>넘어간 뒤 어떻게 돌아올지<\/b>를 미리 정해 두는 것이 좋습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 노쇼 페널티와 월 4건 제한<\/h2>\n<p>예약을 해 놓고 안 가면 <b>다음 예약이 막힙니다.<\/b> 우이령 안내에 적힌 기준은 이렇습니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>상황<\/th><th>제한<\/th><\/tr>\n<tr><td>예약 <b>당일 취소<\/b><\/td><td><b>예약 부도(노쇼)로 처리<\/b><\/td><\/tr>\n<tr><td>노쇼 1회<\/td><td><b>1개월<\/b> 예약·이용 제한<\/td><\/tr>\n<tr><td>노쇼 2회 이상<\/td><td><b>3개월<\/b> 예약·이용 제한<\/td><\/tr>\n<tr><td>기록 소멸<\/td><td>제한 후 <b>1년간 추가 부도가 없으면<\/b> 기록 소멸<\/td><\/tr>\n<\/table><\/div>\n<div class=\"warn\"><b>⚠️ \"당일 취소\"도 노쇼로 잡힙니다 — 이게 함정입니다<\/b>\n<p style=\"margin:6px 0 0\">전화로 미리 취소했으니 괜찮겠지 싶어도, <b>이용 당일에 취소하면 부도로 처리<\/b>됩니다. 취소 자체는 <b>이용 당일 12시 전<\/b>까지 가능하지만, 불이익 없이 정리하려면 <b>전날까지 취소<\/b>하는 것이 안전합니다. 날씨가 나빠질 것 같으면 <b>전날 밤에 결단<\/b>하세요.<\/p><\/div>\n<p>또 하나, <b>1개월에 최대 4건<\/b>까지만 예약할 수 있습니다(우이령은 예외로 제한이 없습니다). 단풍철에 여러 곳을 한꺼번에 잡아 두고 골라 가려는 계획은 <b>건수 제한과 노쇼 페널티에 동시에 걸립니다.<\/b> 탐방로는 <b>대기 예약도 없어서<\/b> 취소분을 기다리는 기능이 아예 없습니다. 마감됐다면 다른 날짜나 다른 구간을 보는 편이 빠릅니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 예약 전 놓치기 쉬운 8가지<\/h2>\n<ol>\n<li><b>내가 가려는 곳이 예약 대상인지부터 확인하세요.<\/b> 국립공원 전체가 아니라 정해진 구간만 예약제이고, 계절에 따라 목록이 바뀝니다. 출발 전 예약 화면에서 공원 이름만 훑으면 됩니다.<\/li>\n<li><b>설악산 흘림골은 10~11월에만 예약제입니다.<\/b> 여름에 예약 없이 다녀온 기억으로 가을에 그냥 가면 막힙니다.<\/li>\n<li><b>일반 구간 마감은 전날 14시입니다.<\/b> 금요일 저녁에 결심하면 토요일은 이미 늦습니다.<\/li>\n<li><b>우이령과 노고단만 당일 16시까지 됩니다.<\/b> 갑자기 시간이 났을 때 갈 수 있는 곳은 사실상 이 두 곳입니다.<\/li>\n<li><b>우이령 평일은 예약이 필요 없습니다<\/b>(2026년 4월~별도 안내 시까지). 평일에 갈 수 있다면 절차가 통째로 사라집니다.<\/li>\n<li><b>당일 취소는 노쇼입니다.<\/b> 1회면 1개월, 2회 이상이면 3개월 예약이 막힙니다.<\/li>\n<li><b>곰배골은 월·화요일 휴무<\/b>이고, <b>강선리 하산 방향은 산림청(033-463-8166) 별도 예약<\/b>입니다. 한쪽만 예약하면 반대편에서 막힙니다.<\/li>\n<li><b>주차 조건이 구간마다 다릅니다.<\/b> 우이령은 주차장 자체가 없고, 흘림골은 국도변 주차가 금지돼 오색마을 주차장을 써야 합니다.<\/li>\n<\/ol>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b>\n<a href=\"https://reservation.knps.or.kr/contents/T/serviceGuideIntro.do\" target=\"_blank\" rel=\"nofollow\">▸ 국립공원 예약시스템 — 탐방로 이용안내(공원별 구간·정원·운영시간)<\/a>\n<a href=\"https://reservation.knps.or.kr/trail/searchTrailReservation.do\" target=\"_blank\" rel=\"nofollow\">▸ 국립공원 예약시스템 — 탐방로 예약하기<\/a>\n<a href=\"https://reservation.knps.or.kr/contents/rsvtRefundPolicy.do\" target=\"_blank\" rel=\"nofollow\">▸ 국립공원 예약시스템 — 예약·환불정책(마감 시각·건수 제한·부도자 제한)<\/a>\n<a href=\"https://www.knps.or.kr/\" target=\"_blank\" rel=\"nofollow\">▸ 국립공원공단 — 공원별 공지사항·도로 통제 확인<\/a>\n<\/div>\n<div class=\"end\"><b>✅ 마무리<\/b>\n<p style=\"margin:8px 0 0\">기억할 것은 네 가지입니다. <b>① 확인일 기준 예약 화면에 올라와 있는 곳은 11개 공원 14개 구간<\/b>이고, 여기에 <b>10~11월에만 예약제로 바뀌는 흘림골<\/b>이 더해집니다. <b>② 마감은 전날 14시<\/b>, 다만 <b>우이령·노고단은 당일 16시<\/b>까지 됩니다. <b>③ 우이령은 2026년 4월부터 평일에는 예약이 필요 없습니다.<\/b> <b>④ 당일 취소는 노쇼로 잡혀 1개월(2회 이상이면 3개월) 예약이 막힙니다.<\/b> 단풍은 한 해에 2~3주뿐이라 한 번 막히면 그해는 끝입니다. 가려는 구간을 정했다면 <b>오늘 저녁에 마감 시각부터 확인<\/b>해 두세요.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월 7일<\/b> 국립공원 예약시스템 화면을 직접 확인한 기준입니다. 구간별 운영 기간·정원·시간은 현장 여건과 기상에 따라 변경될 수 있고, 예약 대상 구간도 해마다 늘거나 줄 수 있습니다. 출발 전 아래 공식 페이지에서 다시 확인하세요.<br>출처: <a href=\"https://reservation.knps.or.kr/contents/T/serviceGuideIntro.do\" target=\"_blank\" rel=\"nofollow\">국립공원공단 예약시스템 탐방로 이용안내<\/a> · <a href=\"https://reservation.knps.or.kr/contents/rsvtRefundPolicy.do\" target=\"_blank\" rel=\"nofollow\">국립공원공단 예약·환불정책<\/a> · <a href=\"https://www.knps.or.kr/\" target=\"_blank\" rel=\"nofollow\">국립공원공단<\/a><\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b>\n<a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_0610833458.html\">▸ 국립공원 대피소 예약 방법 총정리 — 추첨제 신청 일정·환불 기준·노쇼 페널티<\/a>\n<a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01495223186.html\">▸ 국립자연휴양림 예약 방법 성수기 추첨 낙첨 잔여객실 선착순 신청법 총정리<\/a>\n<a href=\"h 27년 6월 30일<\/b> 정산 때 정해집니다. 이 구조를 모르고 신청하면 \"왜 이것밖에 안 들어왔지\", 더 나쁘게는 \"왜 돌려달라고 하지\"가 됩니다.<\/p>\n<p>이 글은 <b>반기신청만<\/b> 다룹니다. 신청 자격·소득 요건·가구별 지급액은 <a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_152.html\">근로장려금 신청 자격 금액 지급일 총정리<\/a>에 정리해 두었으니 그쪽을 먼저 보시고, 여기서는 <b>정기신청과의 갈림길 · 9월 창 · 35% 선지급 · 12월 입금 · 이듬해 정산과 환수<\/b>만 끝까지 파고듭니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 반기신청 vs 5월 정기신청 — 나는 어느 쪽인가<\/a><a href=\"#sec2\">2. 9월 1~15일, 어떻게 신청하나 (홈택스·손택스·ARS)<\/a><a href=\"#sec3\">3. 12월 30일 입금 → 2027년 6월 정산까지 (계산 예시)<\/a><a href=\"#sec4\">4. 놓치기 쉬운 함정 5가지<\/a><a href=\"#sec5\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec3\">👉 35% 선지급·정산 구조 먼저 보기<\/a>\n\n<h2 id=\"sec1\">1. 반기신청 vs 5월 정기신청 — 나는 어느 쪽인가<\/h2>\n<p>먼저 정리할 것은 <b>선택이 아니라 자격<\/b>이라는 점입니다. 반기신청은 아무나 고르는 게 아닙니다.<\/p>\n<p>국세청 안내 원문은 이렇습니다. 반기신청은 <b>\"2026년에 신청자나 그 배우자가 근로소득만 있는 거주자에 한함(사업소득 있는 경우 제외)\"<\/b>. 즉 프리랜서 수입·사업자등록 소득·인적용역 3.3% 소득이 섞여 있으면 반기신청 대상이 아닙니다.<\/p>\n<p>그리고 중요한 것 하나 — 사업소득이 섞여 있는 사람이 실수로 반기신청을 해도 신청이 사라지는 게 아니라 <b>\"5월 정기신청한 것으로 보아 '27년 9월에 정산·지급\"<\/b>됩니다. 신청은 살아남되 <b>돈 받는 시점이 9개월 뒤로 밀린다<\/b>는 뜻입니다.<\/p>\n\n<h3>한눈에 비교<\/h3>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>반기신청(상반기분)<\/th><th>5월 정기신청<\/th><\/tr>\n<tr><td>신청 기간<\/td><td><b>2026.9.1.~9.15.<\/b><br>(하반기분 2027.3.1.~3.15.)<\/td><td>2026.5.1.~6.1.<\/td><\/tr>\n<tr><td>대상<\/td><td>근로소득만 있는 거주자<br>(사업소득 있으면 제외)<\/td><td>제한 없음<br>(근로·사업·종교인)<\/td><\/tr>\n<tr><td>기준 소득<\/td><td>당해연도(2026년) 소득<\/td><td>전년도(2025년) 소득<\/td><\/tr>\n<tr><td>첫 입금<\/td><td><b>2026.12.30.까지<\/b><\/td><td>정기신청 지급기한에 따름<\/td><\/tr>\n<tr><td>첫 입금액<\/td><td><b>연간산정액의 35%<\/b><\/td><td>결정액 전액<\/td><\/tr>\n<tr><td>정산<\/td><td><b>있음<\/b> — 2027.6.30. 하반기분에서<br>차액 지급 또는 환수<\/td><td>없음<\/td><\/tr>\n<\/table><\/div>\n\n<div class=\"box\"><b>🧭 나는 어느 쪽? 3초 판단<\/b>\n<ul>\n<li><b>2026년 수입이 월급뿐<\/b>이고, 돈을 <b>6개월 일찍<\/b> 받고 싶다 → <b>반기신청<\/b>(9월 1~15일)<\/li>\n<li>2026년에 <b>프리랜서·사업 수입이 조금이라도<\/b> 있다 → 반기신청 대상이 아님. <b>2027년 5월 정기신청<\/b><\/li>\n<li>2026년 <b>소득이 크게 오르내릴 예정<\/b>(이직·퇴사·성과급·중도 입사) → 반기신청을 하면 정산 때 <b>환수<\/b>가 생길 수 있음. 3번 항목을 꼭 읽고 결정<\/li>\n<li>이미 <b>상반기분을 신청<\/b>했다 → 국세청 안내상 <b>\"상반기 근로장려금을 신청한 경우에는 하반기에도 신청한 것으로 봅니다\"<\/b>. 2027년 3월에 다시 누를 필요 없음<\/li>\n<\/ul><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 9월 1~15일, 어떻게 신청하나 (홈택스·손택스·ARS)<\/h2>\n<p>국세청은 대상자에게 안내문(카카오톡·문자·우편)을 보냅니다. 하지만 <b>안내문이 안 왔다고 신청을 못 하는 것은 아닙니다.<\/b> 요건에 맞으면 직접 신청할 수 있습니다.<\/p>\n\n<h3>안내문을 받은 경우 — 가장 빠른 순서<\/h3>\n<ol>\n<li>모바일 안내문의 <b>QR코드<\/b>를 스캔하거나, 안내문에 적힌 개별인증번호로 접속<\/li>\n<li>주민등록번호·계좌번호 확인 → 신청 완료(대개 2~3분)<\/li>\n<li><b>ARS 1544-9944<\/b>로도 가능 — 안내문의 개별인증번호를 누르는 방식<\/li>\n<\/ol>\n\n<h3>안내문이 없는 경우 — 직접 신청<\/h3>\n<ol>\n<li><b>홈택스<\/b>(www.hometax.go.kr) 로그인 → [장려금·연말정산·전자기부금] → <b>[근로장려금 반기신청]<\/b><\/li>\n<li>스마트폰이면 <b>손택스<\/b> 앱에서 같은 메뉴<\/li>\n<li>가구원·소득·재산 정보 확인 → <b>본인 명의 계좌<\/b> 입력 → 신청<\/li>\n<li>신청 후 같은 메뉴의 <b>[심사진행상황 조회]<\/b>에서 접수·심사 상태 확인<\/li>\n<\/ol>\n\n<div class=\"warn\"><b>⏰ 9월 15일을 넘기면 5%가 사라집니다<\/b>\n<p style=\"margin:8px 0 0\">국세청 안내 원문: <b>\"기한 후 신청한 경우 해당 장려금의 95% 지급\"<\/b>. 즉 하루만 늦어도 받을 돈의 <b>5%가 깎입니다.<\/b> 100만 원이면 5만 원, 200만 원이면 10만 원입니다. 9월 15일은 <b>말일이 아니라 중순<\/b>이라 특히 잘 놓칩니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 12월 30일 입금 → 2027년 6월 정산까지 (계산 예시)<\/h2>\n<p>반기신청의 핵심이자, 대부분의 민원이 나오는 지점입니다. 국세청 '심사 및 지급' 안내 원문 기준으로 구조는 이렇습니다.<\/p>\n\n<div class=\"tw\"><table>\n<tr><th>회차<\/th><th>신청<\/th><th>지급기한<\/th><th>지급액 계산<\/th><\/tr>\n<tr><td>상반기분<\/td><td>2026.9.1.~9.15.<\/td><td><b>2026.12.30.<\/b><\/td><td><b>연간산정액 × 35%<\/b><\/td><\/tr>\n<tr><td>하반기분<br>(정산)<\/td><td>2027.3.1.~3.15.<br>(상반기 신청자는 자동)<\/td><td><b>2027.6.30.<\/b><\/td><td><b>연간산정액 − 상반기 기지급액<\/b><\/td><\/tr>\n<\/table><\/div>\n\n<h3>계산 예시 — 연간산정액 100만 원으로 가정<\/h3>\n<p>※ 아래 100만 원은 설명을 위한 <b>가정치<\/b>입니다. 실제 산정액은 가구 유형·총급여에 따라 달라지므로, 본인 금액은 <a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_152.html\">근로장려금 자격·지급액 글<\/a>과 홈택스 계산기에서 확인하세요. 여기서 봐야 할 것은 <b>금액이 아니라 흐름<\/b>입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>2027년 6월, 확정된 연간산정액<\/th><th>상반기 기지급(35%)<\/th><th>하반기 정산액<\/th><th>결과<\/th><\/tr>\n<tr><td>120만 원 (소득이 예상보다 유리)<\/td><td>35만 원<\/td><td>120 − 35 = <b>85만 원<\/b><\/td><td>추가 입금<\/td><\/tr>\n<tr><td>100만 원 (예상대로)<\/td><td>35만 원<\/td><td>100 − 35 = <b>65만 원<\/b><\/td><td>추가 입금<\/td><\/tr>\n<tr><td>20만 원 (하반기 소득 급증 등)<\/td><td>35만 원<\/td><td>20 − 35 = <b>−15만 원<\/b><\/td><td><b>15만 원 환수<\/b><\/td><\/tr>\n<tr><td>0원 (재산 2.4억 초과 등 요건 탈락)<\/td><td>35만 원<\/td><td>0 − 35 = <b>−35만 원<\/b><\/td><td><b>35만 원 전액 환수<\/b><\/td><\/tr>\n<\/table><\/div>\n\n<div class=\"warn\"><b>⚠️ 환수는 '드문 사고'가 아니라 설계된 경우의 수입니다<\/b>\n<p style=\"margin:8px 0 0\">국세상담센터 답변 원문: <b>\"다음해 정산 시 부부합산 연간 총소득 또는 재산가액이 변동되는 경우 환수가 발생할 수 있습니다.\"<\/b> 상반기분은 상반기까지의 상황으로 <b>미리<\/b> 계산해 주는 돈이기 때문에, 하반기에 <b>급여가 오르거나 배우자가 취업하거나 재산이 늘면<\/b> 정산에서 되돌려줘야 합니다.<\/p>\n<p style=\"margin:8px 0 0\">그리고 국세청 '심사 및 지급' 안내에는 <b>\"이미 지급한 장려금이 환수되는 경우 가산세 부과(1일 22/100,000)\"<\/b>라고 적혀 있습니다. 하루 10만분의 22, 즉 <b>연 8%대<\/b>에 해당하는 비율입니다. 15만 원을 100일간 환수 대상으로 보유했다고 가정하면 <b>150,000 × 0.00022 × 100일 ≈ 3,300원<\/b>이 붙는 계산입니다. 실제 부과 여부·기간·금액은 국세청이 보내는 <b>결정통지서<\/b>에 적힌 내용을 따릅니다.<\/p><\/div>\n\n<div class=\"box\"><b>💡 자녀장려금이 있는 가구는 12월에 안 들어옵니다<\/b>\n<p style=\"margin:8px 0 0\">국세청 안내 원문: <b>\"상반기분 지급시엔 근로장려금만 지급하고, 자녀장려금도 해당될 경우 하반기분 정산 시 함께 지급합니다.\"<\/b> 12월에 자녀장려금이 안 들어왔다고 누락이 아니라, <b>2027년 6월에 합산해서<\/b> 나옵니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 놓치기 쉬운 함정 5가지<\/h2>\n<ul>\n<li><b>① \"9월 말까지겠지\" — 아닙니다. 9월 15일입니다.<\/b> 정기신청이 5월 1일~6월 1일로 한 달인 것과 달리 반기신청은 <b>15일<\/b>뿐입니다. 넘기면 95%만 지급됩니다.<\/li>\n<li><b>② 신청 자격의 기준 연도가 섞여 있습니다.<\/b> 국세청 안내상 반기신청은 <b>\"2026년에 근로소득만\"<\/b> 있어야 하지만, 소득·재산 요건은 <b>\"2025년 부부합산 총소득이 기준금액 미만\"<\/b>, <b>\"2025.6.1. 기준 가구원 모두의 재산 합계액이 2.4억원 미만\"<\/b>으로 안내됩니다. 작년에 집을 팔았거나 예금이 늘었다면 재산 기준일을 반드시 확인하세요.<\/li>\n<li><b>③ 3월에 또 신청해야 하는 줄 알고 기다립니다.<\/b> <b>\"상반기 근로장려금을 신청한 경우에는 하반기에도 신청한 것으로 봅니다.\"<\/b> 자동으로 넘어갑니다.<\/li>\n<li><b>④ 중간에 프리랜서 일을 시작하면 반기 대상에서 빠집니다.<\/b> 9월에 반기신청을 했더라도 2026년 중 사업소득이 생기면 <b>\"5월 정기신청한 것으로 보아 '27년 9월에 정산·지급\"<\/b>됩니다. 돈이 사라지지는 않지만 <b>9개월 늦게<\/b> 들어옵니다.<\/li>\n<li><b>⑤ 계좌를 바꿨는데 신고하지 않습니다.<\/b> 지급은 신청 때 적은 <b>본인 명의 계좌<\/b>로 들어갑니다. 12월 30일 지급 전에 홈택스에서 계좌를 확인해 두세요.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b>\n<a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=238977&amp;mi=40397\" target=\"_blank\" rel=\"nofollow\">▸ 국세청 — 근로·자녀장려금 신청기간 및 방법<\/a>\n<a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=2453&amp;cntntsId=7784\" target=\"_blank\" rel=\"nofollow\">▸ 국세청 — 근로·자녀장려금 심사 및 지급(지급기한·35%·환수 가산세)<\/a>\n<a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=2450&amp;cntntsId=7784\" target=\"_blank\" rel=\"nofollow\">▸ 국세청 — 근로장려금 소개(반기신청 대상·기한 후 95%)<\/a>\n<a href=\"https://www.hometax.go.kr\" target=\"_blank\" rel=\"nofollow\">▸ 국세청 홈택스 — 근로장려금 반기신청<\/a>\n<\/div>\n<p style=\"font-size:15px;color:#555;margin-top:10px\">전화 신청·상담: 국세청 장려금 상담센터 <b>1544-9944<\/b><\/p>\n\n<div class=\"end\"><b>✅ 마무리<\/b>\n<p style=\"margin:8px 0 0\">2026년 상반기분 근로장려금 반기신청은 <b>9월 1일부터 15일까지<\/b>입니다. 신청하면 <b>12월 30일까지 연간산정액의 35%<\/b>가 먼저 들어오고, 나머지는 <b>2027년 6월 30일<\/b> 정산에서 정해집니다. 하반기에 소득이나 재산이 늘면 <b>환수<\/b>가 생길 수 있다는 점, 15일을 넘기면 <b>95%만<\/b> 받는다는 점 두 가지만 기억하면 됩니다. 본인 산정액과 자격은 위 공식 페이지와 홈택스에서 꼭 확인하세요.<\/p><\/div>\n\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 8월<\/b> 기준이며, 변동될 수 있습니다. 신청 전 공식 사이트에서 확인하세요.<br>출처: <a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=238977&amp;mi=40397\">국세청 「근로·자녀장려금 : 신청기간 및 방법」<\/a> · <a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=2453&amp;cntntsId=7784\">국세청 「심사 및 지급」<\/a> · <a href=\"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=2450&amp;cntntsId=7784\">국세청 「근로장려금 소개」<\/a> · 국세상담센터 반기신청 Q&amp;A<br>※ 본문의 100만 원 계산 예시는 구조 설명을 위한 <b style=\"display:inline       :'<div class="qth none">썸네일<br>없음</div>';
    const facts=it.facts?'<div class="qfacts">'+esc(it.facts)+'</div>':'';
    const draft=it.draft?'<span class="qdraft">📄 '+esc(it.draft)+'</span>':'';
    const pv=it.body?'<button class="qpv" onclick="qpv(\''+esc(it.code||'')+'\')">👁 본문 미리보기</button>'
                    :'<span class="qpv none">초안 없음(작성 전)</span>';
    return '<div class="qcard">'+th
      +'<div class="qbody"><div class="qtop"><span class="qcode">'+esc(it.code||'')+'</span>'
      +'<span class="qlane '+(it.lane||'info')+'">'+esc(laneLab[it.lane]||it.lane||'')+'</span></div>'
      +'<div class="qtitle">'+esc(it.title||'')+'</div>'+facts
      +'<div class="qmeta">'+pv+draft+'</div></div></div>';
  }).join('');
  // 🚦 오늘 발행량 배지 (2026-07-29) — 승인 누르기 '전에' 보이게 한다.
  //    2026-07-27 에 8편이 한꺼번에 나간 건, 사람이 재고만 보고 몰아서 승인했는데
  //    '오늘 몇 편째'를 아무도 안 세고 있었기 때문이다. 게이트(pace.check)는 발행을 막고,
  //    이 배지는 그 전에 눈으로 막는다.
  let paceHtml='';
  if(pace){
    const st=pace.state||'ok', n=pace.count||0, hard=pace.hard||2;
    const lab=st==='err'?'⚠️ 오늘 발행량을 못 셌습니다 — '+esc(pace.error||'')
      :st==='block'?'⛔ 오늘 '+n+'편 발행됨 — 오늘은 더 발행하지 마세요(3편 이상 금지)'
      :st==='warn'?'⚠️ 오늘 '+n+'편 발행됨 — 기본 페이스는 하루 1편입니다'
      :'✅ 오늘 '+n+'편 발행 — 하루 1편 기준 안';
    const bg=st==='block'?'#3a1218':st==='warn'?'#3a2f12':st==='err'?'#2a2030':'#0c3a2c';
    const bd=st==='block'?'#7a2230':st==='warn'?'#5a4a1a':st==='err'?'#4a3a5a':'#1f6b52';
    const fg=st==='block'?'#ff9aa6':st==='warn'?'#ffd166':st==='err'?'#c9b6e8':'#8ef0cf';
    const titles=(pace.posts||[]).map(p=>'<div style="opacity:.8;margin-top:2px">· '+esc(p.title||'')+'</div>').join('');
    const lanes=pace.lanes||{};
    const laneTxt=Object.keys(lanes).map(k=>{
      const L=lanes[k]; if(!L) return '';
      return '<span style="display:inline-block;margin-right:9px">'+esc(L.label||k)+' <b>'+(L.n||0)+'</b></span>';
    }).join('');
    const over=pace.backlog_over
      ?'<div style="margin-top:5px;color:#ffd166">📦 발행대기 재고 '+pace.backlog+'편 (상한 '+pace.backlog_max+' 초과) — 재고가 쌓이면 몰아치기 발행을 부릅니다. PREP 초안 생성이 잠긴 상태입니다.</div>'
      :'<div style="margin-top:5px;opacity:.75">📦 발행대기 재고 '+(pace.backlog||0)+'편 / 상한 '+(pace.backlog_max||5)+'</div>';
    const laneRow=laneTxt?'<div style="margin-top:4px;opacity:.8;font-size:11.5px">🛤 레인별: '+laneTxt+'<span style="opacity:.6">(자동 2 + 사용자 창구 1 · 루틴은 1회 1건)</span></div>':'';
    paceHtml='<div style="background:'+bg+';border:1px solid '+bd+';color:'+fg
      +';border-radius:8px;padding:8px 11px;margin:2px 0 9px;font-size:12px;line-height:1.5">'
      +'<b>'+lab+'</b>'+titles+over+laneRow+'</div>';
  }
  const qHtml=paceHtml+(qItems.length
    ?'<div class="cnt">발행 대기 '+qItems.length+'건 — 발행하면 카드가 자동으로 사라집니다(사람 승인 게이트)</div>'+qCards
    :'<div class="pcode none">발행 대기 없음 — PREP 루틴이 준비하면 여기 카드로 뜹니다</div>');
  document.getElementById('board').innerHTML=
   '<div class="hd"><div class="t"><h1>진행현황</h1><span class="date">'+esc(date)+'</span></div>'
   +'<span class="badge '+bcls+'">'+CHECK+esc(blab)+'</span></div>'
   +'<div class="sec">오늘 한 일</div>'+today
   +'<div class="metrics">'
   +'<div class="m"><div class="l">검사 통과</div><div class="v">'+pass+' <small>/ '+total+'</small></div></div>'
   +'<div class="m"><div class="l">블로그 글</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">평균 본문</div><div class="v">'+avg+' <small>자</small></div></div>'
   +'</div>'
   +'<div class="div"></div>'
   +'<div class="sec">📋 발행 대기 (오늘 발행할 글)<span class="auto">🤖 PREP 큐</span></div>'+qHtml
   +'<div class="div"></div>'
   +'<div class="sec">발행 진행 (글 1편 · '+STEPS.length+'단계, 확산 포함)<span class="auto">🤖 자동</span></div>'+pubHtml
   +'<div class="div"></div>'
   +'<div class="sec">📡 4채널 발행 현황 (구글·네이버·쓰레드·인스타)<span class="auto">🤖 DB 자동집계</span></div>'
   +'<div class="metrics">'
   +'<div class="m"><div class="l">구글(원본)</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">네이버</div><div class="v">'+oNv+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">쓰레드</div><div class="v">'+oTh+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">인스타</div><div class="v">'+oIn+' <small>편</small></div></div>'
   +'</div>'
   +'<div class="cnt">확산 커버리지 · 네이버 '+(count?Math.round(oNv/count*100):0)+'% · 쓰레드 '+(count?Math.round(oTh/count*100):0)+'% · 인스타 '+(count?Math.round(oIn/count*100):0)+'% · 교차링크 완료 '+omAll.length+'편</div>'
   +osmuLi
   +'<div class="div"></div>'
   +'<div class="sec">🤝 협업 — 세션별 역할·진행<span class="auto">git 자동분류</span></div>'+collabHtml
   +'<div class="sec">💡 시스템 조언<span class="auto">라이브 도출</span></div>'+adviceHtml
   +'<div class="div"></div>'
   +'<div class="sec">📋 미결 관리 — 4채널 매칭<span class="auto">G구글·N네이버·T쓰레드·I인스타</span></div>'+pendHtml
   +'<div class="sec">다음</div><div class="next">'+next+'</div>'
   +'<div class="upd" id="upd"></div>';
  tick();
}
// 시계·데이터 기준만 갱신(보드 전체 재렌더 없음 — 정적 베이크 데이터라 시계만 변함)
function tick(){
  const el=document.getElementById('upd'); if(!el)return;
  const b=(window.__DATA__||{}).baked_at;
  el.textContent=(b?'데이터 기준 '+b+' · ':'')+new Date().toLocaleTimeString('ko-KR');
}
// 👁 발행 대기 카드 본문 미리보기 — 초안 HTML을 격리 iframe(srcdoc)로 렌더(스타일 누수 차단, Blogger 미접촉)
function qpv(code){
  const items=((window.__DATA__||{}).queue||{}).items||[];
  const it=items.find(x=>x.code===code); if(!it||!it.body)return;
  document.getElementById('qpv-ttl').textContent=(it.code||'')+' · '+(it.title||'');
  document.getElementById('qpv-fr').srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank"><body style="margin:0;padding:16px;background:#fff">'+it.body+'</body>';
  document.getElementById('qpv-ov').classList.add('show');
}
function qpvClose(){document.getElementById('qpv-ov').classList.remove('show');document.getElementById('qpv-fr').srcdoc='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')qpvClose();});
// 코드 자동 반영: 자기 자신(progress.html)을 주기적으로 fetch→해시 비교, 바뀌면 1회 reload
const _hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
let _selfHash=null;
async function checkVersion(){
  try{
    const r=await fetch('progress.html?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;                                // 일시적 404/500에 해시 오염 → 불필요 reload 방지
    const t=await r.text();
    const h=_hash(t);
    if(_selfHash===null){_selfHash=h;return;}      // 첫 호출=기준선 저장
    if(h!==_selfHash) location.reload();            // 코드 변경 감지 → 자동 새로고침
  }catch(e){}
}
load(); checkVersion(); setInterval(tick,5000); setInterval(checkVersion,5000);
</script>
