<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="icon" href="data:,">
<title>진행현황 — 생활정보 모음</title>
<style>
:root{--bg:#0e1620;--card:#18222e;--card2:#13202d;--line:#26323f;--txt:#e6edf3;--mut:#8a97a6;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:470px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:16px;font-weight:600}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(63,185,80,.16);color:var(--ok)}
.b-warn{background:rgba(210,153,34,.16);color:var(--warn)}
.b-bad{background:rgba(248,81,73,.16);color:var(--bad)}
.sec{font-size:11px;color:var(--mut);letter-spacing:.05em;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
.metrics{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 2px}
/* 채널이 4개가 되어 490px 팝업에서 눌리므로, 좁아지면 2x2로 감싸게 한다 */
.m{flex:1 1 96px;background:var(--card2);border-radius:9px;padding:8px 10px}
.m .l{font-size:11px;color:var(--mut)}
.m .v{font-size:18px;font-weight:600;margin-top:2px}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #243049;font-size:12.5px}
li:last-child{border-bottom:none}
li.on{opacity:.62}
li.on .lbl{text-decoration:line-through}
li svg{width:15px;height:15px;flex:none}
li.on svg{color:var(--ok)}
li.now svg{color:#7fc1ff}
li.wait svg{color:#4a586e}
.num{font-size:11px;color:#6b7a99;width:16px;text-align:right;flex:none}
.who{font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px;flex:none}
.who.ai{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.who.me{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.lbl{font-size:12.5px}
.star{color:#ff8e8e;font-weight:800;margin-left:2px}
.banner{display:none;margin-top:9px;background:#0c3a2c;border:1px solid #1f6b52;color:#06d6a0;border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12.5px}
.banner.show{display:block}
.upd{font-size:11px;color:var(--mut);text-align:right;margin-top:12px}
.agent{background:var(--card2);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.agent .ah{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.agent .st{font-size:10px;font-weight:700;padding:1px 7px;border-radius:7px;margin-left:auto}
.st.active{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.st.uncommitted{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.st.idle{background:#222c3a;color:#6b7a99;border:1px solid #2e3a4a}
.agent .role{font-size:11px;color:var(--mut);margin:3px 0 1px}
.agent .own{font-size:10.5px;color:#5a6b80}
.agent .act{font-size:11px;color:#aeb9c7;margin-top:4px;padding-left:7px;border-left:2px solid #2a3a4d;line-height:1.5}
.agent .act .d{color:var(--mut);font-size:10px}
.advice{background:#13202d;border:1px solid #2a3a4d;border-radius:9px}
.advice .ai{display:flex;gap:8px;padding:7px 11px;font-size:12px;line-height:1.5;border-bottom:1px dashed #243049}
.advice .ai:last-child{border-bottom:none}
.advice .ic{flex:none}
.prow{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px dashed #243049;font-size:11.5px}
.prow:last-child{border-bottom:none}
.pcd{color:#7fc1ff;font-weight:700;flex:none;width:46px}
.ptt{flex:1;color:#cdd6e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{background:#3a2f12;color:#ffd166;border-radius:5px;padding:0 5px;font-size:9.5px;flex:none}
.pact{color:#06d6a0;font-size:10px;flex:none;font-weight:700}
.qcard{display:flex;gap:9px;padding:8px;margin:6px 0;background:#141c2c;border:1px solid #243049;border-radius:9px}
.qth{width:78px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:#0d1420}
.qth.none{display:flex;align-items:center;justify-content:center;color:#54627a;font-size:9px;text-align:center;line-height:1.2;border:1px dashed #2a3752}
.qbody{flex:1;min-width:0}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qcode{color:#7fc1ff;font-weight:700;font-size:11.5px}
.qlane{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700}
.qlane.info{background:#12283a;color:#7fc1ff}
.qlane.pop{background:#2f2136;color:#e0a3ff}
.qtitle{color:#e6edf5;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qfacts{color:#8a95a6;font-size:10px;margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qmeta{margin-top:4px}
.qdraft{color:#6b7688;font-size:9.5px;margin-left:8px}
.qpv{background:#17324a;color:#7fc1ff;border:1px solid #2a4d6e;border-radius:6px;font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer}
.qpv:hover{background:#1d4463}
.qpv.none{background:none;border:none;color:#54627a;font-weight:400;cursor:default;padding:3px 0}
#qpv-ov{display:none;position:fixed;inset:0;background:rgba(6,10,18,.82);z-index:999;align-items:center;justify-content:center;padding:18px}
#qpv-ov.show{display:flex}
.qpv-box{width:100%;max-width:760px;height:88vh;display:flex;flex-direction:column;background:#0f1626;border:1px solid #2a3752;border-radius:12px;overflow:hidden}
.qpv-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #243049;font-size:12.5px;font-weight:700;color:#7fc1ff}
.qpv-hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpv-x{background:#243049;color:#cdd6e0;border:none;border-radius:6px;font-size:11px;padding:5px 11px;cursor:pointer;flex:none}
.qpv-x:hover{background:#324158}
.qpv-fr,#qpv-fr{flex:1;width:100%;border:0;background:#fff}
.qpv-ft{padding:8px 14px;border-top:1px solid #243049;font-size:10px;color:#8a95a6;text-align:center}
.ch{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 4px;flex:none;margin-left:3px}
.ch.on{background:#0c3a2c;color:#06d6a0}
.ch.off{background:#3a1216;color:#f0707a}
</style>
</head>

</div>

op:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#f4f7fc;border:1px solid #e0e8f4;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#2BC4B0;margin-bottom:8px}\n.lsg .rel a{display:block;color:#2a4a73;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#8a97ab;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">정부지원·복지<\/span>\n<p>2026년 7월 28일, 제80차 중앙생활보장위원회가 2027년 기준 중위소득을 <b>6.70% 인상<\/b>하기로 의결했습니다. 4인 가구 기준 <b>649만 4,738원 → 692만 9,885원<\/b>으로, 2015년 제도 시행 이후 <b>역대 최대 인상률<\/b>입니다. 기준 중위소득은 생계·의료·주거·교육급여의 선정 기준선이라, 올해 소득 때문에 <b>탈락했던 가구가 내년에는 대상이 되는<\/b> 구간이 생깁니다. 이 글은 \"제도가 무엇인가\"가 아니라 <b>\"얼마가 오르고, 누가 새로 들어오는가\"<\/b>만 짚습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 한눈에 보는 2027년 확정 내용<\/a><a href=\"#sec2\">2. 가구원수별 기준 중위소득 (2026 vs 2027)<\/a><a href=\"#sec3\">3. 급여별 선정기준 — 얼마 이하면 대상인가<\/a><a href=\"#sec4\">4. 새로 대상이 되는 소득 구간 (계산 예시)<\/a><a href=\"#sec5\">5. 생계급여, 실제로 받는 금액은<\/a><a href=\"#sec6\">6. 주거급여 기준임대료도 올랐다<\/a><a href=\"#sec7\">7. 산정방식이 6년 만에 바뀌었다<\/a><a href=\"#sec8\">8. 자주 걸리는 함정 4가지<\/a><a href=\"#sec9\">9. 언제부터 적용되고 지금 뭘 해야 하나<\/a><a href=\"#sec10\">10. 자주 묻는 질문<\/a><\/div>\n<a class=\"cta\" href=\"#sec4\">👉 내가 새로 대상이 되는지 먼저 확인하기<\/a>\n<h2 id=\"sec1\">1. 한눈에 보는 2027년 확정 내용<\/h2>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>내용<\/th><\/tr>\n<tr><td>의결<\/td><td>2026년 7월 28일 · 제80차 중앙생활보장위원회<\/td><\/tr>\n<tr><td>인상률<\/td><td><b>6.70%<\/b> (2015년 제도 시행 이후 역대 최대)<\/td><\/tr>\n<tr><td>4인 가구 기준 중위소득<\/td><td>649만 4,738원 → <b>692만 9,885원<\/b><\/td><\/tr>\n<tr><td>1인 가구 기준 중위소득<\/td><td>256만 4,238원 → <b>273만 6,042원<\/b><\/td><\/tr>\n<tr><td>급여별 기준 비율<\/td><td>생계 32% · 의료 40% · 주거 48% · 교육 50%<\/td><\/tr>\n<tr><td>적용 시작<\/td><td><b>2027년 1월 1일<\/b><\/td><\/tr>\n<\/table><\/div>\n<p>직전 최고 인상률이 2026년도의 6.51%였는데, 이번에 그 기록을 다시 넘겼습니다. 2년 연속으로 역대 최대치가 경신된 셈입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec2\">2. 가구원수별 기준 중위소득 (2026 vs 2027)<\/h2>\n<p>기준 중위소득 자체는 급여가 아니라 <b>기준선을 만드는 원본 숫자<\/b>입니다. 여기에 급여별 비율(32%·40%·48%·50%)을 곱해 실제 선정기준이 나옵니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>가구원 수<\/th><th>2026년<\/th><th>2027년<\/th><th>증가액<\/th><\/tr>\n<tr><td>1인<\/td><td>2,564,238원<\/td><td><b>2,736,042원<\/b><\/td><td>+171,804원<\/td><\/tr>\n<tr><td>2인<\/td><td>4,199,292원<\/td><td><b>4,480,645원<\/b><\/td><td>+281,353원<\/td><\/tr>\n<tr><td>3인<\/td><td>5,359,036원<\/td><td><b>5,718,091원<\/b><\/td><td>+359,055원<\/td><\/tr>\n<tr><td>4인<\/td><td>6,494,738원<\/td><td><b>6,929,885원<\/b><\/td><td>+435,147원<\/td><\/tr>\n<tr><td>5인<\/td><td>7,556,719원<\/td><td><b>8,063,019원<\/b><\/td><td>+506,300원<\/td><\/tr>\n<tr><td>6인<\/td><td>8,555,952원<\/td><td><b>9,129,201원<\/b><\/td><td>+573,249원<\/td><\/tr>\n<\/table><\/div>\n<p>가구원이 많을수록 절대 증가액이 큽니다. 다만 인상률은 모든 가구에 동일하게 6.70%가 적용됩니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec3\">3. 급여별 선정기준 — 얼마 이하면 대상인가<\/h2>\n<p>본인의 <b>소득인정액<\/b>이 아래 금액 이하이면 해당 급여의 선정기준을 충족합니다. 급여마다 기준선이 다르다는 점이 중요합니다.<\/p>\n<h3>2027년 급여별 선정기준<\/h3>\n<div class=\"tw\"><table>\n<tr><th>가구원 수<\/th><th>생계급여(32%)<\/th><th>의료급여(40%)<\/th><th>주거급여(48%)<\/th><th>교육급여(50%)<\/th><\/tr>\n<tr><td>1인<\/td><td>875,533원<\/td><td>1,094,417원<\/td><td>1,313,300원<\/td><td>1,368,021원<\/td><\/tr>\n<tr><td>2인<\/td><td>1,433,806원<\/td><td>1,792,258원<\/td><td>2,150,710원<\/td><td>2,240,323원<\/td><\/tr>\n<tr><td>3인<\/td><td>1,829,789원<\/td><td>2,287,236원<\/td><td>2,744,684원<\/td><td>2,859,046원<\/td><\/tr>\n<tr><td>4인<\/td><td>2,217,563원<\/td><td>2,771,954원<\/td><td>3,326,345원<\/td><td>3,464,943원<\/td><\/tr>\n<tr><td>5인<\/td><td>2,580,166원<\/td><td>3,225,208원<\/td><td>3,870,249원<\/td><td>4,031,510원<\/td><\/tr>\n<tr><td>6인<\/td><td>2,921,344원<\/td><td>3,651,680원<\/td><td>4,382,016원<\/td><td>4,564,601원<\/td><\/tr>\n<\/table><\/div>\n<h3>2026년 급여별 선정기준 (비교용)<\/h3>\n<div class=\"tw\"><table>\n<tr><th>가구원 수<\/th><th>생계급여(32%)<\/th><th>의료급여(40%)<\/th><th>주거급여(48%)<\/th><th>교육급여(50%)<\/th><\/tr>\n<tr><td>1인<\/td><td>820,556원<\/td><td>1,025,695원<\/td><td>1,230,834원<\/td><td>1,282,119원<\/td><\/tr>\n<tr><td>2인<\/td><td>1,343,773원<\/td><td>1,679,717원<\/td><td>2,015,660원<\/td><td>2,099,646원<\/td><\/tr>\n<tr><td>3인<\/td><td>1,714,892원<\/td><td>2,143,614원<\/td><td>2,572,337원<\/td><td>2,679,518원<\/td><\/tr>\n<tr><td>4인<\/td><td>2,078,316원<\/td><td>2,597,895원<\/td><td>3,117,474원<\/td><td>3,247,369원<\/td><\/tr>\n<tr><td>5인<\/td><td>2,418,150원<\/td><td>3,022,688원<\/td><td>3,627,225원<\/td><td>3,778,360원<\/td><\/tr>\n<tr><td>6인<\/td><td>2,737,905원<\/td><td>3,422,381원<\/td><td>4,106,857원<\/td><td>4,277,976원<\/td><\/tr>\n<\/table><\/div>\n<div class=\"tip\"><b>💡 TIP<\/b> &mdash; 생계급여에서 탈락해도 주거·교육급여는 되는 경우가 많습니다. 예를 들어 4인 가구 소득인정액이 월 300만 원이면 생계(221만)·의료(277만)는 초과지만, 주거(332만)·교육(346만)은 <b>2027년 기준으로 여전히 대상<\/b>입니다. 게다가 <b>주거급여와 교육급여에는 부양의무자 기준이 없습니다<\/b>(생계·의료급여에만 적용). \"생계급여 안 된다더라\"로 네 가지를 한꺼번에 포기하지 말고 급여별로 따로 확인하세요.<\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec4\">4. 새로 대상이 되는 소득 구간 (계산 예시)<\/h2>\n<p>이번 인상의 실질적 의미는 <b>기준선이 위로 올라가면서 그 사이 구간이 새로 열린다<\/b>는 데 있습니다. 2026년 기준선과 2027년 기준선 사이에 소득인정액이 놓인 가구가 여기 해당합니다.<\/p>\n<div class=\"value\"><b>🧮 계산 예시 ① — 4인 가구 · 생계급여<\/b>소득인정액 월 <b>215만 원<\/b>인 4인 가구<br>· 2026년 기준선 2,078,316원 → <b>초과 · 탈락<\/b><br>· 2027년 기준선 2,217,563원 → <b>이하 · 대상<\/b><br>→ 같은 소득인데 2027년 1월부터 생계급여 대상이 됩니다.<\/div>\n<div class=\"value\"><b>🧮 계산 예시 ② — 1인 가구 · 생계급여<\/b>소득인정액 월 <b>85만 원<\/b>인 1인 가구<br>· 2026년 기준선 820,556원 → <b>초과 · 탈락<\/b><br>· 2027년 기준선 875,533원 → <b>이하 · 대상<\/b><br>→ 1인 가구는 기준선이 82만 원대에서 87만 원대로 올라, 그 5만 원 남짓한 구간이 새로 열립니다.<\/div>\n<div class=\"value\"><b>🧮 계산 예시 ③ — 2인 가구 · 의료급여<\/b>소득인정액 월 <b>175만 원<\/b>인 2인 가구<br>· 2026년 기준선 1,679,717원 → <b>초과 · 탈락<\/b><br>· 2027년 기준선 1,792,258원 → <b>이하 · 대상<\/b><br>→ 의료비 부담이 큰 가구라면 이 구간 변화가 가장 체감이 큽니다.<\/div>\n<div class=\"value\"><b>🧮 계산 예시 ④ — 3인 가구 · 주거급여<\/b>소득인정액 월 <b>260만 원<\/b>인 3인 가구<br>· 2026년 기준선 2,572,337원 → <b>초과 · 탈락<\/b><br>· 2027년 기준선 2,744,684원 → <b>이하 · 대상<\/b><br>→ 주거급여는 기준선이 48%로 높아, 근로소득이 있는 가구도 들어오는 경우가 많습니다.<\/div>\n<p>정리하면, <b>가구원 수별로 아래 구간에 있던 가구가 2027년에 새로 문턱을 넘습니다<\/b>(생계급여 기준).<\/p>\n<div class=\"tw\"><table>\n<tr><th>가구원 수<\/th><th>새로 대상이 되는 소득인정액 구간(생계급여)<\/th><\/tr>\n<tr><td>1인<\/td><td>820,556원 초과 ~ 875,533원 이하<\/td><\/tr>\n<tr><td>2인<\/td><td>1,343,773원 초과 ~ 1,433,806원 이하<\/td><\/tr>\n<tr><td>3인<\/td><td>1,714,892원 초과 ~ 1,829,789원 이하<\/td><\/tr>\n<tr><td>4인<\/td><td>2,078,316원 초과 ~ 2,217,563원 이하<\/td><\/tr>\n<tr><td>5인<\/td><td>2,418,150원 초과 ~ 2,580,166원 이하<\/td><\/tr>\n<tr><td>6인<\/td><td>2,737,905원 초과 ~ 2,921,344원 이하<\/td><\/tr>\n<\/table><\/div>\n<p>단, 선정기준은 <b>소득 요건 하나일 뿐<\/b>입니다. 이 구간에 들어간다고 수급이 자동으로 확정되지는 않으니, 최종 판단은 주민센터 상담·신청을 통해 확인하세요. 다만 반대로 지레 포기할 일도 아닙니다 &mdash; 자세한 내용은 아래 <a href=\"#sec8\">8번 함정 ④<\/a>에서 짚습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec5\">5. 생계급여, 실제로 받는 금액은<\/h2>\n<p>선정기준액을 그대로 다 받는 것이 아닙니다. 보건복지부 보도자료는 지급액 산정 방식을 이렇게 밝히고 있습니다 — <b>\"각 가구에 실제 지급되는 생계급여액은 가구원 수별 선정기준액에서 해당 가구의 소득인정액을 차감한 금액\"<\/b>입니다. 즉 부족한 만큼만 채워주는 구조입니다.<\/p>\n<div class=\"value\"><b>🧮 계산 예시 — 4인 가구 생계급여 실제 수령액<\/b>2027년 4인 선정기준액 2,217,563원<br>− 소득인정액 2,150,000원<br>= <b>월 67,563원<\/b> 지급<br><br>소득인정액이 0원인 4인 가구라면 선정기준액 전액인 <b>월 2,217,563원<\/b>이 최대 지급액입니다.<\/div>\n<p>이 최대 지급액이 이번 인상으로 어떻게 달라졌는지 보면 체감이 분명해집니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>구분<\/th><th>2026년 최대 지급액<\/th><th>2027년 최대 지급액<\/th><th>인상액<\/th><\/tr>\n<tr><td>1인 가구<\/td><td>820,556원<\/td><td>875,533원<\/td><td>약 5만 5천 원<\/td><\/tr>\n<tr><td>4인 가구<\/td><td>2,078,316원<\/td><td>2,217,563원<\/td><td>약 14만 원<\/td><\/tr>\n<\/table><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec6\">6. 주거급여 기준임대료도 올랐다<\/h2>\n<p>주거급여는 선정기준을 넘지 않는 임차가구에 임차료를 지원하는데, 그 상한이 <b>기준임대료<\/b>입니다. 사는 지역(급지)과 가구원 수에 따라 달라집니다. 2027년 기준임대료는 아래와 같습니다(괄호 안은 2026년 대비 인상액).<\/p>\n<div class=\"tw\"><table>\n<tr><th>가구원<\/th><th>1급지<br>(서울)<\/th><th>2급지<br>(경기·인천)<\/th><th>3급지<br>(광역시·세종·<br>수도권 외 특례시)<\/th><th>4급지<br>(그 외 지역)<\/th><\/tr>\n<tr><td>1인<\/td><td>38.1 (+1.2)<\/td><td>31.3 (+1.3)<\/td><td>25.9 (+1.2)<\/td><td>23.4 (+2.2)<\/td><\/tr>\n<tr><td>2인<\/td><td>43.1 (+1.7)<\/td><td>35.2 (+1.7)<\/td><td>29.1 (+1.6)<\/td><td>26.5 (+2.7)<\/td><\/tr>\n<tr><td>3인<\/td><td>51.4 (+2.2)<\/td><td>42.2 (+2.1)<\/td><td>34.7 (+2.0)<\/td><td>31.8 (+3.5)<\/td><\/tr>\n<tr><td>4인<\/td><td>59.6 (+2.5)<\/td><td>48.8 (+2.5)<\/td><td>40.3 (+2.2)<\/td><td>36.9 (+4.0)<\/td><\/tr>\n<tr><td>5인<\/td><td>61.8 (+2.7)<\/td><td>50.5 (+2.6)<\/td><td>41.8 (+2.4)<\/td><td>38.2 (+4.2)<\/td><\/tr>\n<tr><td>6인<\/td><td>73.1 (+3.2)<\/td><td>59.9 (+3.1)<\/td><td>49.2 (+2.9)<\/td><td>45.2 (+5.0)<\/td><\/tr>\n<\/table><\/div>\n<p style=\"font-size:14px;color:#667\">※ 단위: 만 원/월. 보건복지부 보도자료 표기 그대로입니다.<\/p>\n<p>예를 들어 서울에 사는 4인 가구라면 임차료 지원 상한이 <b>월 59만 6천 원<\/b>까지 올라갑니다. 실제 지급액은 기준임대료와 실제 임차료 중 낮은 금액을 바탕으로 산정되므로, 기준임대료가 곧 지급액인 것은 아닙니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec7\">7. 산정방식이 6년 만에 바뀌었다<\/h2>\n<p>이번 결정에서 눈여겨볼 것이 인상률만은 아닙니다. 기준 중위소득을 <b>어떻게 계산할지<\/b>의 방식 자체가 6년 만에 개편됐습니다.<\/p>\n<ul>\n<li><b>원칙<\/b> — 당해년도 기준 중위소득에 가계금융복지조사 중위소득의 <b>최신 3년 평균 증가율<\/b>을 적용<\/li>\n<li><b>보정<\/b> — 소비자물가지수, 실질경제성장률(GDP) 등 사회·경제 지표를 반영해 증가율을 보정 가능<\/li>\n<li><b>추가 조정<\/b> — 상대빈곤 완화와 제도 지속가능성을 고려한 조정도 가능<\/li>\n<\/ul>\n<p>물가와 경기 변화를 더 반영하는 구조로 바뀐 것인데, 이번 6.70%라는 역대 최대 인상률이 나온 배경이기도 합니다. 앞으로의 인상 폭을 가늠할 때 참고할 부분입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec8\">8. 자주 걸리는 함정 4가지<\/h2>\n<h3>함정 ① 소득인정액을 월급으로 착각한다<\/h3>\n<p>선정기준과 비교하는 것은 <b>월급이 아니라 소득인정액<\/b>입니다. 소득인정액은 소득평가액에 재산의 소득환산액을 더해 산출하며, 각종 공제가 적용됩니다. 월급만 놓고 \"기준을 넘으니 안 되겠다\"고 단정하면 실제로는 대상인데 신청조차 안 하게 됩니다. 반대로 소득이 적어도 재산이 소득으로 환산돼 기준을 넘는 경우도 있습니다. 정확한 값은 복지로 모의계산으로 확인하세요.<\/p>\n<h3>함정 ② 급여를 하나로 뭉뚱그린다<\/h3>\n<p>생계·의료·주거·교육급여는 기준선이 각각 32%·40%·48%·50%로 다릅니다. 하나에서 탈락해도 다른 급여는 대상일 수 있는데, \"수급자 안 된다\"는 한마디로 넷 다 포기하는 경우가 흔합니다.<\/p>\n<h3>함정 ③ 인상 소식을 듣고 지금 적용되는 줄 안다<\/h3>\n<p>이번에 확정된 금액은 <b>2027년 1월 1일부터<\/b> 적용됩니다. 2026년 12월 31일까지는 기존 2026년 기준이 그대로입니다. 지금 신청하면 2026년 기준으로 심사되므로, 새 기준선 덕분에 대상이 되는 구간에 있다면 시점을 감안해야 합니다.<\/p>\n<h3>함정 ④ \"자녀가 있으니 부양의무자 때문에 안 된다\"고 미리 포기한다<\/h3>\n<p>가장 많이 오해하는 부분입니다. 보건복지부 수급자 선정기준 안내에 따르면 부양의무자 기준은 <b>생계급여와 의료급여에만 적용되고, 주거급여·교육급여에는 아예 없습니다<\/b>. 그리고 생계급여의 부양의무자 기준도 \"모든 자녀\"를 보는 것이 아니라, 수급(권)자와 생계·주거를 달리하는 <b>1촌 직계혈족 및 그 배우자의 연 소득이 1.3억 원을 초과하거나 재산이 12억 원을 초과하는 경우<\/b>에 보장에서 제외하는 방식입니다.<\/p>\n<p>또한 부양의무자 가구에 중증장애인이 포함된 경우, 수급(권)자가 30세 미만 한부모가구·보호종료아동인 경우, 수급(권)자 가구에 장애의 정도가 심한 장애인이 포함된 경우 등 <b>별도의 예외<\/b>도 마련돼 있습니다. 즉 \"자녀가 직장에 다닌다\"는 사실만으로 탈락이 확정되는 구조가 아닙니다. 해당 여부는 주민센터에서 확인하세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec9\">9. 언제부터 적용되고 지금 뭘 해야 하나<\/h2>\n<div class=\"warn\"><b>⚠️ 적용 시점<\/b> 2027년 기준 중위소득과 급여별 선정기준은 <b>2027년 1월 1일부터<\/b> 적용됩니다. 이번 발표만으로 지금 당장 급여액이 오르거나 대상이 확대되지는 않습니다.<\/div>\n<ul>\n<li><b>이미 수급 중인 가구<\/b> — 새 기준 적용에 따른 급여액 변경 절차는 관할 주민센터·복지로 안내를 따르면 됩니다. 본인의 급여액이 어떻게 조정되는지는 2027년 1월 전후로 주민센터에 확인하는 것이 확실합니다.<\/li>\n<li><b>2026년에 탈락했던 가구<\/b> — 위 4번의 구간에 해당한다면 2027년 기준으로 다시 판단받을 여지가 있습니다. 소득인정액에 큰 변동이 없더라도 기준선이 올라갔기 때문입니다.<\/li>\n<li><b>한 번도 신청해보지 않았다면<\/b> — 복지로에서 모의계산으로 소득인정액을 먼저 확인한 뒤, 주민센터에서 상담·신청하는 순서가 가장 빠릅니다.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<h2 id=\"sec10\">10. 자주 묻는 질문<\/h2>\n<h3>Q. 6.70%가 왜 그렇게 큰 의미인가요?<\/h3>\n<p>기준 중위소득 결정이 시작된 2015년 이후 <b>가장 높은 인상률<\/b>이기 때문입니다. 직전 최고치는 2026년도의 6.51%였는데 이번에 다시 경신됐습니다. 기준선이 오르면 같은 소득이어도 새로 대상이 되는 가구가 생깁니다.<\/p>\n<h3>Q. 우리 집 소득이 딱 기준선 언저리인데 대상인가요?<\/h3>\n<p>비교 대상은 월급이 아니라 소득인정액이고, 소득인정액은 각종 공제와 재산 환산이 반영돼 실제 월급과 상당히 다를 수 있습니다. 복지로 모의계산으로 소득인정액부터 산출한 뒤 위 표와 비교하세요.<\/p>\n<h3>Q. 생계급여 선정기준액을 매달 그대로 받나요?<\/h3>\n<p>아닙니다. 선정기준액에서 소득인정액을 뺀 금액이 지급됩니다. 소득인정액이 0원일 때만 선정기준액 전액(4인 가구 기준 월 2,217,563원)이 최대 지급액이 됩니다.<\/p>\n<h3>Q. 7인 이상 가구는 어떻게 되나요?<\/h3>\n<p>이번 보도자료 표는 6인 가구까지 제시돼 있습니다. 7인 이상 가구의 기준 중위소득은 별도 산정 방식이 적용되므로, 해당한다면 복지로나 주민센터에서 직접 확인하시기 바랍니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">2027년 기준 중위소득은 <b>6.70% 인상<\/b>으로 확정됐습니다(4인 가구 <b>692만 9,885원<\/b>, 1인 가구 <b>273만 6,042원<\/b>). 급여별 선정기준도 함께 올라 생계급여는 4인 가구 <b>221만 7,563원<\/b>, 1인 가구 <b>87만 5,533원<\/b>이 됩니다. 생계급여 최대 지급액은 1인 약 5만 5천 원, 4인 약 14만 원 오릅니다. 적용은 <b>2027년 1월 1일부터<\/b>이며, 2026년에 소득 때문에 탈락했던 가구라도 위 4번의 구간에 있다면 다시 판단받을 여지가 있습니다. 비교 기준은 월급이 아니라 <b>소득인정액<\/b>이라는 점만 기억하세요.<\/p><\/div>\n<div id=\"ymyl-disclaimer\" style=\"font-size:13px;color:#888;margin-top:16px;line-height:1.6\">본 글은 정보 제공용이며, 수급 자격·급여액에 대한 최종 판단은 관할 주민센터 및 보건복지부 등 소관 기관의 심사에 따릅니다.<\/div>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.mohw.go.kr/board.es?mid=a10503010100&bid=0027&act=view&list_no=1491453\" target=\"_blank\" rel=\"nofollow\">▸ 보건복지부 — 제80차 중앙생활보장위원회 보도자료(2027년 기준 중위소득 결정)<\/a><a href=\"https://www.mohw.go.kr/menu.es?mid=a10708010900\" target=\"_blank\" rel=\"nofollow\">▸ 보건복지부 — 기준 중위소득 안내<\/a><a href=\"https://www.mohw.go.kr/menu.es?mid=a10708010300\" target=\"_blank\" rel=\"nofollow\">▸ 보건복지부 — 수급자 선정기준<\/a><a href=\"https://www.bokjiro.go.kr\" target=\"_blank\" rel=\"nofollow\">▸ 복지로 — 복지서비스 모의계산·신청<\/a><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글의 수치는 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월 28일<\/b> 제80차 중앙생활보장위원회 의결 및 보건복지부 보도자료 기준입니다. 2027년 금액은 <b style=\"display:inline;color:#33503a;margin:0\">2027년 1월 1일<\/b>부터 적용되며, 세부 사항은 시행 전 변경될 수 있습니다. 2026년 비교 수치와 <b style=\"display:inline;color:#33503a;margin:0\">부양의무자 기준<\/b>은 보건복지부 '기준 중위소득'·'수급자 선정기준' 안내 페이지에서 확인했습니다.<br>출처: <a href=\"https://www.mohw.go.kr/board.es?mid=a10503010100&bid=0027&act=view&list_no=1491453\" target=\"_blank\" rel=\"nofollow\">보건복지부 보도자료<\/a> · <a href=\"https://www.mohw.go.kr/menu.es?mid=a10708010900\" target=\"_blank\" rel=\"nofollow\">보건복지부 기준 중위소득<\/a> · <a href=\"https://www.mohw.go.kr/menu.es?mid=a10708010300\" target=\"_blank\" rel=\"nofollow\">보건복지부 수급자 선정기준<\/a><\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_0202295376.html\">▸ 기초생활수급자 생계급여 조건 소득인정액 금액 신청 방법 총정리 (2026)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2027-10700.html\">▸ 2027년 최저임금 10,700원 확정, 내 월급 실수령액 얼마나 오를까<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/24_01864563257.html\">▸ 정부24 복지멤버십 조회 신청 방법 총정리 (받을 수 있는 돈 찾기)<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 수치·자격·기한은 <b>공식 자료를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 제도는 바뀔 수 있으니 신청 전 공식 페이지를 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 2027년 기준 중위소득이 6.70% 올랐어요. 4인 가구 649만 4,738원 → 692만 9,885원으로, 2015년 제도 시행 이후 역대 최대 인상률입니다.\n2. 생계급여 선정기준이 4인 가구 207만 8,316원 → 221만 7,563원으로 올라가요. 그 사이 구간에 있던 가구는 같은 소득인데 2027년부터 새로 대상이 됩니다.\n3. 적용은 2027년 1월 1일부터예요. 비교 기준은 월급이 아니라 소득인정액이니, 복지로 모의계산으로 먼저 확인해보세요.\n"}]},"pace":{"date":"2026-08-04","count":3,"posts":[{"title":"유럽 여행 EES 지문 등록 방법 여권 도장 폐지 90/180일 계산 총정리 (2026년 4월 전면 시행 29개국 · ETIA","published":"2026-08-04T12:48:15.123+09:00"},{"title":"침수차 확인 방법 중고차 침수이력 무료 조회 계약 해제 90일 총정리 (2026 카히스토리·자동차365)","published":"2026-08-04T12:22:36.000+09:00"},{"title":"코레일+ 앱 KTX SRT 통합 예매 방법 통합회원 전환 총정리 (2026년 8월 5일 예매 개시 · 9월 1일 통합 운행)","published":"2026-08-04T11:00:45.000+09:00"}],"soft":1,"hard":5,"state":"warn","backlog":1,"backlog_codes":["A2-13"],"backlog_max":5,"backlog_over":false,"lanes":{"info":{"label":"일일·정보성","n":1,"codes":["A2   //    2026-07-27 에 8편이 한꺼번에 나간 건, 사람이 재고만 보고 몰아서 승인했는데
  //    '오늘 몇 편째'를 아무도 안 세고 있었기 때문이다. 게이트(pace.check)는 발행을 막고,
  //    이 배지는 그 전에 눈으로 막는다.
  let paceHtml='';
  if(pace){
    const st=pace.state||'ok', n=pace.count||0, hard=pace.hard||2;
    const lab=st==='err'?'⚠️ 오늘 발행량을 못 셌습니다 — '+esc(pace.error||'')
      :st==='block'?'⛔ 오늘 '+n+'편 발행됨 — 오늘은 더 발행하지 마세요(3편 이상 금지)'
      :st==='warn'?'⚠️ 오늘 '+n+'편 발행됨 — 기본 페이스는 하루 1편입니다'
      :'✅ 오늘 '+n+'편 발행 — 하루 1편 기준 안';
    const bg=st==='block'?'#3a1218':st==='warn'?'#3a2f12':st==='err'?'#2a2030':'#0c3a2c';
    const bd=st==='block'?'#7a2230':st==='warn'?'#5a4a1a':st==='err'?'#4a3a5a':'#1f6b52';
    const fg=st==='block'?'#ff9aa6':st==='warn'?'#ffd166':st==='err'?'#c9b6e8':'#8ef0cf';
    const titles=(pace.posts||[]).map(p=>'<div style="opacity:.8;margin-top:2px">· '+esc(p.title||'')+'</div>').join('');
    const lanes=pace.lanes||{};
    const laneTxt=Object.keys(lanes).map(k=>{
      const L=lanes[k]; if(!L) return '';
      return '<span style="display:inline-block;margin-right:9px">'+esc(L.label||k)+' <b>'+(L.n||0)+'</b></span>';
    }).join('');
    const over=pace.backlog_over
      ?'<div style="margin-top:5px;color:#ffd166">📦 발행대기 재고 '+pace.backlog+'편 (상한 '+pace.backlog_max+' 초과) — 재고가 쌓이면 몰아치기 발행을 부릅니다. PREP 초안 생성이 잠긴 상태입니다.</div>'
      :'<div style="margin-top:5px;opacity:.75">📦 발행대기 재고 '+(pace.backlog||0)+'편 / 상한 '+(pace.backlog_max||5)+'</div>';
    const laneRow=laneTxt?'<div style="margin-top:4px;opacity:.8;font-size:11.5px">🛤 레인별: '+laneTxt+'<span style="opacity:.6">(자동 2 + 사용자 창구 1 · 루틴은 1회 1건)</span></div>':'';
    paceHtml='<div style="background:'+bg+';border:1px solid '+bd+';color:'+fg
      +';border-radius:8px;padding:8px 11px;margin:2px 0 9px;font-size:12px;line-height:1.5">'
      +'<b>'+lab+'</b>'+titles+over+laneRow+'</div>';
  }
  const qHtml=paceHtml+(qItems.length
    ?'<div class="cnt">발행 대기 '+qItems.length+'건 — 발행하면 카드가 자동으로 사라집니다(사람 승인 게이트)</div>'+qCards
    :'<div class="pcode none">발행 대기 없음 — PREP 루틴이 준비하면 여기 카드로 뜹니다</div>');
  document.getElementById('board').innerHTML=
   '<div class="hd"><div class="t"><h1>진행현황</h1><span class="date">'+esc(date)+'</span></div>'
   +'<span class="badge '+bcls+'">'+CHECK+esc(blab)+'</span></div>'
   +'<div class="sec">오늘 한 일</div>'+today
   +'<div class="metrics">'
   +'<div class="m"><div class="l">검사 통과</div><div class="v">'+pass+' <small>/ '+total+'</small></div></div>'
   +'<div class="m"><div class="l">블로그 글</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">평균 본문</div><div class="v">'+avg+' <small>자</small></div></div>'
   +'</div>'
   +'<div class="div"></div>'
   +'<div class="sec">📋 발행 대기 (오늘 발행할 글)<span class="auto">🤖 PREP 큐</span></div>'+qHtml
   +'<div class="div"></div>'
   +'<div class="sec">발행 진행 (글 1편 · '+STEPS.length+'단계, 확산 포함)<span class="auto">🤖 자동</span></div>'+pubHtml
   +'<div class="div"></div>'
   +'<div class="sec">📡 4채널 발행 현황 (구글·네이버·쓰레드·인스타)<span class="auto">🤖 DB 자동집계</span></div>'
   +'<div class="metrics">'
   +'<div class="m"><div class="l">구글(원본)</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">네이버</div><div class="v">'+oNv+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">쓰레드</div><div class="v">'+oTh+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">인스타</div><div class="v">'+oIn+' <small>편</small></div></div>'
   +'</div>'
   +'<div class="cnt">확산 커버리지 · 네이버 '+(count?Math.round(oNv/count*100):0)+'% · 쓰레드 '+(count?Math.round(oTh/count*100):0)+'% · 인스타 '+(count?Math.round(oIn/count*100):0)+'% · 교차링크 완료 '+omAll.length+'편</div>'
   +osmuLi
   +'<div class="div"></div>'
   +'<div class="sec">🤝 협업 — 세션별 역할·진행<span class="auto">git 자동분류</span></div>'+collabHtml
   +'<div class="sec">💡 시스템 조언<span class="auto">라이브 도출</span></div>'+adviceHtml
   +'<div class="div"></div>'
   +'<div class="sec">📋 미결 관리 — 4채널 매칭<span class="auto">G구글·N네이버·T쓰레드·I인스타</span></div>'+pendHtml
   +'<div class="sec">다음</div><div class="next">'+next+'</div>'
   +'<div class="upd" id="upd"></div>';
  tick();
}
// 시계·데이터 기준만 갱신(보드 전체 재렌더 없음 — 정적 베이크 데이터라 시계만 변함)
function tick(){
  const el=document.getElementById('upd'); if(!el)return;
  const b=(window.__DATA__||{}).baked_at;
  el.textContent=(b?'데이터 기준 '+b+' · ':'')+new Date().toLocaleTimeString('ko-KR');
}
// 👁 발행 대기 카드 본문 미리보기 — 초안 HTML을 격리 iframe(srcdoc)로 렌더(스타일 누수 차단, Blogger 미접촉)
function qpv(code){
  const items=((window.__DATA__||{}).queue||{}).items||[];
  const it=items.find(x=>x.code===code); if(!it||!it.body)return;
  document.getElementById('qpv-ttl').textContent=(it.code||'')+' · '+(it.title||'');
  document.getElementById('qpv-fr').srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank"><body style="margin:0;padding:16px;background:#fff">'+it.body+'</body>';
  document.getElementById('qpv-ov').classList.add('show');
}
function qpvClose(){document.getElementById('qpv-ov').classList.remove('show');document.getElementById('qpv-fr').srcdoc='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')qpvClose();});
// 코드 자동 반영: 자기 자신(progress.html)을 주기적으로 fetch→해시 비교, 바뀌면 1회 reload
const _hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
let _selfHash=null;
async function checkVersion(){
  try{
    const r=await fetch('progress.html?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;                                // 일시적 404/500에 해시 오염 → 불필요 reload 방지
    const t=await r.text();
    const h=_hash(t);
    if(_selfHash===null){_selfHash=h;return;}      // 첫 호출=기준선 저장
    if(h!==_selfHash) location.reload();            // 코드 변경 감지 → 자동 새로고침
  }catch(e){}
}
load(); checkVersion(); setInterval(tick,5000); setInterval(checkVersion,5000);
</script>
