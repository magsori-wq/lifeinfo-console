:root{--bg:#0f1626;--card:#16203a;--card2:#0c1220;--line:#2a3a5e;--txt:#e8edf7;--mut:#9fb0d0;--ok:#06d6a0;--warn:#ffd166;--bad:#ff5c5c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
/* 2026-08-13 사용자 지시: "운영관리 탭과 화면구성이 달라 일목요연하지 않다,
   KPI대시보드 형식으로" — 좁은 470px 팝업카드였던 걸 adsense.html·gsc.html과
   같은 넓은 KPI 대시보드 톤으로 바꾼다. #board 에 innerHTML 을 꽂는 JS 로직은
   그대로이고(같은 클래스명), 여기 CSS만 넓혀서/키워서 통일한다. */
/* 2026-08-13 재수정 — "가운데로 화면이 몰려있잖아!": gsc·batch·seo 등 나머지

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px;width:100%}
.hd{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:19px;font-weight:700}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(6,214,160,.16);color:var(--ok)}
.b-warn{background:rgba(255,209,102,.16);color:var(--warn)}
.b-bad{background:rgba(255,92,92,.16);color:var(--bad)}
.sec{font-size:13px;color:#9db0c6;font-weight:800;letter-spacing:.02em;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
/* KPI 카드 그리드 — adsense.html 의 .kpi-grid 와 같은 형식으로 통일 */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 6px}
.m{background:var(--card2);border:1px solid var(--line);border-top:3px solid #3a4a63;border-radius:12px;padding:12px 14px}
.m .l{font-size:11.5px;color:var(--mut);font-weight:700}
.m .v{font-size:24px;font-weight:800;margin-top:3px;line-height:1.2}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}

.lbl{font-size:12.5px}

전' 이라는 창에서만 나오는 거짓 차단이다. ⚠️영향: fail-closed 게이트라 사람이 이 메시지를 보면 정당한 발행을 되돌릴 수 있다 — 실제로 나도 잠깐 F4-12 를 중복으로 오해했다. 처방 후보: ①bodydup 이 DB 대신 라이브 URL 로 자기 글을 식별 ②DB 에 코드가 없는데 제목이 라이브와 거의 같으면 '발행 직후일 수 있음' 으로 안내 문구를 바꾸기. 지금은 운영 규칙으로 대응: 발행 직후 게이트를 다시 돌리지 말고, 돌렸다면 register_post 후 재확인할 것.","🔑 gh CLI 설치 완료 (2026-08-08). winget install GitHub.cli → 2.97.0, C:\\Program Files\\GitHub CLI\\gh.exe. 인증은 아직 없음(gh auth status = not logged in) — 사용자가 프롬프트에 '! gh auth login' 1회 실행 필요. ⚠️문서 여러 곳에 'gh 가 없어 Actions 로그를 확인 못 함'(watch label-at-publish 등)이라 적혀 있는데 이제 틀린 서술이 된다 — 인증까지 끝나면 Actions 로그 확인·워크플로 트리거가 전부 터미널에서 된다. 계기: 사용자 지시로 발행대기 4편을 Fold 가 발행하려 했으나 ①pipeline.py:289 가 로컬 --publish 차단 ②웹 Actions 의 Run workflow 폼이 브라우저 자동화에서 3회 모두 'There was an error while loading' 로 실패 → 남은 경로가 gh 뿐이었다. 🔴'웹이 죽었다'고 단정하지 말 것 — 사람이 직접 누르면 될 수 있고, 내 자동화 쪽 문제일 가능성이 남아 있다(미확인).","[팩트체크] [야간검증] 오늘 발행 2편(F4-12 서울고궁관람료·orphan 국립공원탐방로예약제) 팩트체크 완료 — 둘 다 공식출처(royal.khs.go.kr, res.knps.or.kr) 대조 결과 오류 없음. F4-12: 관람료·통합관람권 6000원/6개월·후원 예약창구 전부 일치. 탐방로예약제: 노고단1870명·우이령1190명(주말공휴일)·흘림골5000명(시간지정제)·마감(전날14시)·노쇼페널티(1회1개월/2회이상3개월)·월4건제한 전부 res.knps.or.kr 환불정책 페이지와 일치.","[팩트체크] [야간검증] 기존글 3편 위험순위 검증(B4-05 퇴직금·C1-04 건보수가·D2-03 K패스) 중 D2-03에서 오류 발견. 🔴D2-03 K패스: 라이브가 평시 환급률(일반20%·청년30%·저소득53%)만 서술하는데, 2026.3.31 국무회의 통과 추경으로 2026.4.1~9.30 이용분에 한해 환급률이 한시 인상됨(일반20→30%·청년등30→45%·3자녀50→75%·저소득53→83%, 예산877억원). 오늘 8/8은 그 기간 안이라 라이브 수치가 독자의 실제 환급액보다 10~30%p 낮게 안내되는 중. 출처: 2026-03-31 국무회의 추경안 보도(다수 매체 교차확인, 예산액·기간·인상폭 일치). 라이브 수정은 사용자 승인 게이트 — 이 세션은 미수정. B4-05(근속연수공제·환산급여공제 표·14일지급·연20%지연이자, NTS 공식페이지 대조)·C1-04(진찰료 인상률 6/4/2%, 2026 수가혁신방안 발표 기사 대조)는 오류 0건. 오늘 발행 2편(F4-12·orphan 탐방로예약제)도 검증 완료(오류 0건, 별도 기록). D2-03은 다음 대면 세션에서 라이브에 한시 인상 안내 박스 추가 검토 필요 — watch 항목으로 남김.","[색인] [색인] crawl-watch 확인: D2-10·D4-07(8/06 색인요청한 신규 2편) 아직 lastCrawl 없음(2026-08-08 09:52 스냅샷 기준 미크롤). watch crawl-watch 항목이 묻던 질문에 대한 답 — 신규 글도 기존 글과 같은 속도로 크롤되는지는 아직 판단 불가, 계속 관찰 필요. 오늘 크롤 배치(25편)는 신규 크롤 0편·상태이동 12건(플래핑 계속, D4-04 등).","[발행] F4-14(국립공원 탐방로예약제)가 202 x;margin:22px 0 10px}\n.lsg p{margin:0 0 14px}\n.lsg ul,.lsg ol{margin:0 0 16px;padding-left:22px}\n.lsg li{margin:6px 0}\n.lsg .toc{background:#f2eefc;border:1px solid #ddd0f6;border-radius:12px;padding:16px 20px;margin:18px 0 26px}\n.lsg .toc b{display:block;font-size:14px;color:#5a3fc0;margin-bottom:8px}\n.lsg .toc a{display:block;color:#4a3499;text-decoration:none;padding:4px 0;font-size:15px}\n.lsg .cta{display:block;text-align:center;background:linear-gradient(90deg,#7C5CE0,#6647c9);color:#fff !important;font-weight:800;font-size:17px;padding:15px 18px;border-radius:12px;text-decoration:none;margin:22px 0}\n.lsg table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:15px}\n.lsg th,.lsg td{border:1px solid #ddd0f6;padding:10px 12px;text-align:center}\n.lsg th{background:#ece3fb}\n.lsg .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 16px}\n.lsg .tw table{margin:0}\n.lsg .tip{background:#f2eefc;border:1px solid #ddd0f6;border-radius:12px;padding:14px 18px;margin:16px 0}\n.lsg .tip b{color:#5a3fc0}\n.lsg .warn{background:#fff3f3;border:1px solid #f6c9c9;border-radius:12px;padding:14px 18px;margin:16px 0;color:#8a2b2b}\n.lsg .warn b{color:#8a2b2b}\n.lsg .end{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:16px 20px;margin-top:24px}\n.lsg .gov{background:#f2eefc;border:1px solid #ddd0f6;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#5a3fc0;margin-bottom:8px}\n.lsg .gov a{display:block;color:#4a3499;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#f4eefc;border:1px solid #ddd0f6;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#453a5c}\n.lsg .src b{display:block;font-size:14px;color:#5a3fc0;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#a89ac9;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p><b>여행지에서 산 소시지·햄을 신고 안 하고 들여오면 최대 100만원(1차), 그게 아프리카돼지열병(ASF) 발생국산이면 최대 500만원까지 과태료가 붙습니다.<\/b> 추석 연휴(9/24~26)가 4주 앞으로 다가오면서, 해외여행 다녀오며 선물로 사온 육류·유제품 가공품 때문에 공항에서 걸리는 사례가 늘어나는 시기입니다. 정작 처벌 대상은 \"반입\" 자체가 아니라 \"미신고\"라는 점을 모르는 경우가 많습니다.<\/p>\n<p>이 글은 가축전염병 예방법·시행령·시행규칙 원문(law.go.kr)과 농림축산검역본부(qia.go.kr) 공식 정보공개 자료를 직접 확인해, 과태료 구간표·신고하면 안 걸리는 이유·품목이 아닌 처리방식으로 갈리는 기준까지 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 처벌 대상은 '반입'이 아니라 '미신고'다<\/a><a href=\"#sec2\">2. 과태료 구간표 — 1차/2차/3차 위반<\/a><a href=\"#sec3\">3. 계산예시 — 같은 소시지, 어느 나라산이냐로 500만원 vs 100만원<\/a><a href=\"#sec4\">4. 함정 — 품목명이 아니라 '멸균·살균 처리 여부'가 기준<\/a><a href=\"#sec5\">5. ASF 발생국 목록(2026-08-03 기준)<\/a><a href=\"#sec6\">6. 자주 묻는 질문<\/a><a href=\"#sec7\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec2\">👉 과태료 구간표 바로 보기<\/a>\n\n<h2 id=\"sec1\">1. 처벌 대상은 '반입'이 아니라 '미신고'다<\/h2>\n<p>가축전염병 예방법 제36조제1항 단서는 이렇게 규정합니다. \"여행자 휴대품으로 지정검역물을 수입하는 자는 입국 즉시 동물검역기관의 장에게 신고하고 검역관의 검역을 받아야 한다.\" 즉 <b>여행지에서 산 소시지·햄을 갖고 들어오는 것 자체는 불법이 아닙니다.<\/b> 공항·항만에 있는 동물검역기관에 입국 즉시 신고만 하면, 대부분 그 자리에서 폐기 처리로 끝나고 과태료도 없습니다.<\/p>\n<p>과태료는 <b>신고를 안 하고 몰래 들여오다 적발됐을 때<\/b> 부과됩니다. \"어차피 압수당할 텐데 신고해봐야 손해\"라고 생각해 그냥 통과하려다 걸리는 경우가 실제 과태료 대상입니다. 세관 X-ray나 검역탐지견에 걸리면 신고 여부와 무관하게 소지품이 확인되므로, 미리 신고하는 쪽이 항상 유리합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 과태료 구간표 — 1차/2차/3차 위반<\/h2>\n<p>가축전염병 예방법 시행령 [별표 3]은 신고하지 않고 반입하다 적발된 경우의 과태료를 휴대품 종류별로 4단계로 나눕니다(2026-04-21 시행). 단위는 만원, 1차/2차/3차 위반 순입니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>휴대품 종류<\/th><th>1차<\/th><th>2차<\/th><th>3차<\/th><\/tr>\n<tr><td>CITES 국제거래 금지 동물(멸종위기종)<\/td><td>300<\/td><td>400<\/td><td>500<\/td><\/tr>\n<tr><td>그 밖의 동물<\/td><td>70<\/td><td>100<\/td><td>200<\/td><\/tr>\n<tr><td>동물생산물(검역증명서 미첨부) — ASF발생국 돼지고기<\/td><td><b>500<\/b><\/td><td><b>750<\/b><\/td><td><b>1,000<\/b><\/td><\/tr>\n<tr><td>동물생산물(검역증명서 미첨부) — 그 밖의 경우<\/td><td>100<\/td><td>300<\/td><td>500<\/td><\/tr>\n<tr><td>동물생산물(검역증명서 첨부)<\/td><td>5<\/td><td>10<\/td><td>50<\/td><\/tr>\n<\/table><\/div>\n<p>여행객이 가장 자주 걸리는 것은 표 가운데 두 줄, \"동물생산물(검역증명서 미첨부)\" 항목입니다. 소시지·햄·베이컨 같은 육가공품이 여기 해당하며, <b>같은 소시지라도 원산지(ASF 발생국 여부)에 따라 과태료가 5배 차이<\/b> 납니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 계산예시 — 같은 소시지, 어느 나라산이냐로 500만원 vs 100만원<\/h2>\n<div class=\"tip\"><b>🧮 계산예시 — 신고 안 하고 소시지를 들여왔다가 처음 적발된 경우<\/b><br>\n· 그 소시지가 <b>아프리카돼지열병(ASF) 발생국<\/b>에서 생산·제조됐다면 → 1차 위반 <b>500만원<\/b><br>\n· 그 소시지가 <b>ASF 비발생국<\/b>(예: 국내 유통 브랜드가 유럽 비발생국에서 생산한 제품 등)이면 → 1차 위반 <b>100만원<\/b><br>\n· 같은 사람이 같은 방식으로 <b>두 번째<\/b> 적발되면 각각 750만원 / 300만원으로 뜁니다<br>\n· 검역증명서를 미리 발급받아 첨부했다면 → 1차 위반 <b>5만원<\/b>(같은 품목이라도 최대 100배 차이)\n<\/div>\n<p>즉 과태료를 결정하는 것은 \"소시지냐 아니냐\"가 아니라 <b>①생산국이 ASF 발생국인지, ②검역증명서를 첨부했는지<\/b> 두 가지입니다. 여행 중 산 육가공품의 원산지 표기를 확인해두면, 신고 시 정확한 예상 금액을 가늠할 수 있습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 함정 — 품목명이 아니라 '멸균·살균 처리 여부'가 기준<\/h2>\n<div class=\"warn\"><b>⚠️ 소시지라고 다 걸리는 게 아닙니다.<\/b> 가축전염병 예방법 시행규칙 제31조제1항제9호는 신고 대상(지정검역물)을 \"멸균처리되지 아니한 햄·소시지·베이컨 등 수육가공품, 난백·난분 등 알가공품 및 살균처리되지 아니한 유가공품\"으로 정의합니다. 즉 <b>품목명이 아니라 멸균·살균 처리가 됐는지가 기준<\/b>입니다. 상온 유통되는 통조림형 멸균 소시지는 대상이 아닐 수 있고, 냉장 보관이 필요한 비멸균 생햄·생소시지는 대상입니다.<\/div>\n<p>포장지에 \"멸균\" 또는 \"살균\" 처리 여부가 명시돼 있지 않으면 본인이 판단하기 어려우므로, 애매하면 신고하고 검역관의 확인을 받는 것이 안전합니다. 멸균·살균의 구체적 기준·확인방법은 검역본부장이 별도로 고시합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. ASF 발생국 목록(2026-08-03 기준)<\/h2>\n<p>농림축산검역본부가 가축전염병 예방법 제3조의2에 근거해 공개한 아프리카돼지열병(ASF) 발생국은 2026년 8월 3일 기준 총 73개국입니다.<\/p>\n<ul>\n<li><b>아시아(17개국)<\/b>: 네팔, 동티모르, 라오스, 말레이시아, 몽골, 미얀마, 방글라데시, 베트남, 부탄, 북한, 스리랑카, 인도, 인도네시아, 중국(홍콩 포함), 캄보디아, 필리핀, 태국<\/li>\n<li><b>아프리카(31개국)<\/b>: 가나, 가봉, 감비아, 기니비사우, 나미비아, 나이지리아, 남아프리카공화국, 르완다, 마다가스카르, 말라위, 말리, 모잠비크, 베냉, 부룬디, 부르키나파소, 세네갈, 시에라리온, 앙골라, 우간다, 잠비아, 중앙아프리카공화국, 짐바브웨, 차드, 카메룬, 카보베르데, 케냐, 코트디부아르, 콩고공화국, 콩고민주공화국, 탄자니아, 토고<\/li>\n<li><b>유럽(22개국)<\/b>: 그리스, 독일, 라트비아, 러시아, 루마니아, 리투아니아, 몬테네그로, 몰도바, 보스니아헤르체고비나, 북마케도니아, 불가리아, 세르비아, 스페인, 슬로바키아, 알바니아, 에스토니아, 우크라이나, 이탈리아, 크로아티아, 폴란드, 핀란드, 헝가리<\/li>\n<li><b>오세아니아(1개국)<\/b>: 파푸아뉴기니<\/li>\n<li><b>아메리카(2개국)<\/b>: 도미니카공화국, 아이티<\/li>\n<\/ul>\n<p>⚠️ <b>이 목록은 2026년 8월 3일 기준이며, 발생국은 수시로 추가·해제됩니다.<\/b> 여행 전 반드시 아래 공식 확인 페이지에서 최신 목록을 다시 확인하세요. 특히 동남아시아·중국 등 인기 여행지 다수가 이미 발생국에 포함돼 있으므로, 해당 지역에서 육가공품을 구매했다면 원산지와 무관하게 신고를 우선하는 것이 안전합니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 자주 묻는 질문<\/h2>\n<h3>Q. 공항 면세점에서 산 육가공품도 신고 대상인가요?<\/h3>\n<p>구매처와 무관하게 멸균·살균 처리가 안 된 수육·알·유가공품이면 지정검역물에 해당합니다. 면세점 구매품이라고 예외는 아닙니다.<\/p>\n<h3>Q. 신고했는데 검역증명서가 없으면 어떻게 되나요?<\/h3>\n<p>검역증명서 없이 신고만 한 경우 대부분 현장에서 폐기 처리되며, 자진신고 자체는 과태료 대상이 아닙니다. 과태료는 신고하지 않고 반입하려다 적발된 경우에 부과됩니다.<\/p>\n<h3>Q. 소량이면 괜찮나요?<\/h3>\n<p>이 글에서 확인한 과태료 기준(시행령 별표3)에는 반입량에 따른 예외 규정이 없습니다. 양과 무관하게 지정검역물을 미신고 반입하면 과태료 대상이 될 수 있습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.qia.go.kr/livestock/qua/livestock_imp_sum2.jsp?type=4\" target=\"_blank\" rel=\"nofollow\">▸ 농림축산검역본부 — 아프리카돼지열병(ASF) 발생국 최신 목록<\/a><a href=\"https://www.qia.go.kr/livestock/qua/livestock_imp_sum2.jsp?type=1\" target=\"_blank\" rel=\"nofollow\">▸ 농림축산검역본부 — 해외여행자 축산물 반입 준수사항<\/a><a href=\"https://www.law.go.kr/법령/가축전염병예방법\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 가축전염병 예방법(제36조·별표3)<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">해외여행 중 산 소시지·햄 등 육가공품은 <b>입국 즉시 신고하면 폐기로 끝나지만, 신고하지 않고 반입하다 적발되면 과태료<\/b>가 부과됩니다. 금액은 원산지가 ASF 발생국인지(최대 5배 차이)와 검역증명서 첨부 여부(최대 100배 차이)로 갈립니다. 판단이 애매하면 무조건 신고가 안전합니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#453a5c;margin:0\">2026년 8월<\/b> 기준이며, 과태료 구간(시행령 별표3)·신고 조항(법 제36조①단서)·지정검역물 정의(시행규칙 제31조①9호)는 국가법령정보센터(law.go.kr) 원문을 직접 확인했습니다. ASF 발생국 목록은 농림축산검역본부(qia.go.kr) 공식 정보공개(2026-08-03 기준) 이미지를 직접 확인했으며, 발생국은 수시로 바뀌므로 여행 전 최신 목록을 다시 확인하세요.<br>출처: <a href=\"https://www.law.go.kr\" target=\"_blank\" rel=\ 게 아니라 <b>상한이 새로 생긴 것<\/b>입니다.<\/p>\n<p>이 글은 은행법 제30조의3(2025-12-30 공포, 2026-07-01 시행)·시행령 제18조의5 원문과 금융위원회 보도자료(2025-12-15)를 직접 확인해, 가산금리 구성 항목 중 정확히 무엇이 얼마나 제한되는지, 내 대출이 이 개정의 영향을 받는지 판단하는 방법까지 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 가산금리 대조표 — 7개 항목 중 손이 닿은 건 1개뿐<\/a><a href=\"#sec2\">2. 내 대출이 보증부인가 아닌가 — 효과가 다르다<\/a><a href=\"#sec3\">3. 계산예시 — 보증부 대출 1억원, 최대 얼마가 빠지나<\/a><a href=\"#sec4\">4. 함정 — \"출연금 빠지니 그만큼 내려간다\"는 틀렸다<\/a><a href=\"#sec5\">5. 탈락사유 — 금리인하요구권도 신청 자격이 있다<\/a><a href=\"#sec6\">6. 자주 묻는 질문<\/a><a href=\"#sec7\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec1\">👉 가산금리 대조표 바로 보기<\/a>\n\n<h2 id=\"sec1\">1. 가산금리 대조표 — 7개 항목 중 손이 닿은 건 1개뿐<\/h2>\n<p>금융위원회가 공개한 '대출금리 모범규준' 구성체계에 따르면, 대출금리 = 기준금리 + 가산금리 − 가감조정금리(우대금리)이고, 가산금리는 다시 4개 대분류·7개 항목으로 나뉩니다.<\/p>\n<div class=\"tw\"><table>\n<tr><th>대분류<\/th><th>세부 항목<\/th><th>이번 개정의 영향<\/th><\/tr>\n<tr><td>원가<\/td><td>업무원가<\/td><td>변화 없음<\/td><\/tr>\n<tr><td rowspan=\"4\">리스크 관리비용<\/td><td>리스크프리미엄<\/td><td>변화 없음<\/td><\/tr>\n<tr><td>유동성프리미엄<\/td><td>변화 없음<\/td><\/tr>\n<tr><td>신용프리미엄<\/td><td>변화 없음<\/td><\/tr>\n<tr><td>자본비용<\/td><td>변화 없음<\/td><\/tr>\n<tr><td rowspan=\"2\"><b>법적비용<\/b><\/td><td>보증기관 출연료<\/td><td><b>반영 상한 신설<\/b>(보증부 50%·비보증부 0%)<\/td><\/tr>\n<tr><td>교육세<\/td><td>과세표준 수익금액의 0.5% 초과분 반영 금지<\/td><\/tr>\n<tr><td>기타<\/td><td>목표이익률<\/td><td>변화 없음<\/td><\/tr>\n<\/table><\/div>\n<p>즉 이번 은행법 개정으로 손이 닿는 항목은 7개 중 <b>\"법적비용\"에 속한 보증기관 출연료·교육세 2개뿐<\/b>이고, 업무원가·리스크프리미엄류(4종)·목표이익률은 그대로입니다. \"가산금리가 전반적으로 낮아진다\"가 아니라 \"일부 구성요소에 상한이 새로 생긴다\"는 것이 정확한 표현입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 내 대출이 보증부인가 아닌가 — 효과가 다르다<\/h2>\n<p>은행법 제30조의3제2항과 시행령 제18조의5는 출연료 반영 제한을 대출 종류에 따라 다르게 정합니다.<\/p>\n<ul>\n<li><b>보증기관(신보·기보·지역신용보증재단·농림수산업자신용보증기금·주택금융신용보증기금 등)의 보증을 받아 취급하는 대출<\/b>: 출연료율의 <b>50% 이상 반영 금지<\/b> — 바꿔 말하면 은행은 최대 50%까지는 여전히 가산금리에 반영할 수 있습니다.<\/li>\n<li><b>그 밖의 대출<\/b>(출연금 부과기준 대출이지만 보증을 받지 않은 경우): 출연료율의 <b>100%(전액) 반영 금지<\/b>.<\/li>\n<\/ul>\n<p>즉 <b>보증부 대출일수록 오히려 개정 효과가 제한적<\/b>이고(절반까지는 여전히 반영 가능), 비보증부 대출 쪽이 상대적으로 더 크게 반영이 금지됩니다. 내 대출이 신용보증기금·기술보증기금 등의 보증서를 담보로 한 대출인지는 대출 계약서의 담보 종류 항목이나 은행 창구에서 확인할 수 있습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 계산예시 — 보증부 대출 1억원, 최대 얼마가 빠지나<\/h2>\n<p>신용보증기금법 제6조③·기술보증기금법 제13조③은 보증기관 출연료율의 법정 상한을 <b>연 0.3%(1천분의 3)<\/b>로 정합니다(실제 적용 요율은 하위법령에서 별도로 정해지므로 이보다 낮을 수 있습니다).<\/p>\n<div class=\"tip\"><b>🧮 계산예시 — 보증부 대출 1억원, 법정 상한 요율(0.3%) 기준<\/b><br>\n· 연간 출연료 총액: 1억원 × 0.3% = <b>30만원<\/b><br>\n· 반영 금지 하한(50%): 30만원 × 50% = <b>최소 15만원<\/b>은 가산금리에 반영 불가<br>\n· 연이율로 환산: 15만원 ÷ 1억원 = <b>연 0.15%p<\/b> 상당의 가산금리 항목이 사라지는 효과<br>\n· 다만 실제 적용 출연료율은 은행·보증기관마다 하위법령으로 별도 고시되므로, 위 수치는 <b>법정 상한 기준의 계산 예시<\/b>이며 실제 절감액과 다를 수 있음\n<\/div>\n<p>중요한 건 이 <b>0.15%p 상당은 \"법적비용\" 항목 하나에 대한 최대치<\/b>라는 점입니다. 대출금리 전체가 0.15%p 내려간다는 뜻이 아니라, 그 항목에서 은행이 반영할 수 있는 상한이 그만큼 낮아진다는 뜻입니다. 실제 내 대출금리가 얼마나 바뀌는지는 은행별 대출금리 산정 방식에 따라 다릅니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 함정 — \"출연금 빠지니 그만큼 내려간다\"는 틀렸다<\/h2>\n<div class=\"warn\"><b>🚫 \"출연금이 가산금리에서 제외된다\"는 표현은 정확하지 않습니다.<\/b> 정확히는 <b>반영 비율에 상한이 생긴 것<\/b>입니다. 보증부 대출은 출연료율의 50% 미만까지는 여전히 반영할 수 있고, 완전히 사라지는 게 아닙니다. 게다가 가산금리 7개 항목 중 손이 닿은 건 법적비용(보증기관 출연료·교육세) 2개뿐이고, 업무원가·리스크프리미엄류(4종)·목표이익률은 이번 개정과 무관하게 그대로 유지됩니다.<\/div>\n<p>즉 \"법적비용이 줄었으니 전체 대출금리도 그만큼 내려갈 것\"이라 기대하면 실망할 수 있습니다. 은행이 다른 항목(리스크프리미엄이나 목표이익률 등)을 조정하면 전체 금리는 크게 안 바뀔 수도 있습니다. 이 개정은 \"가산금리를 낮춰라\"는 규제가 아니라 \"특정 항목을 가산금리 산정 근거로 못 쓰게 막는\" 규제입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 탈락사유 — 금리인하요구권도 신청 자격이 있다<\/h2>\n<div class=\"warn\">⏰ <b>아무 때나 신청한다고 받아들여지는 게 아닙니다.<\/b> 은행법 제30조의2·시행령 제18조의4에 따른 금리인하요구권은 다음 요건 중 하나를 충족해야 신청 대상이 됩니다.<\/div>\n<ul>\n<li><b>개인 대출자<\/b>: 취업, 승진, 재산 증가, 개인신용평점 상승 등 <b>신용상태가 실제로 개선<\/b>됐다고 인정되는 경우<\/li>\n<li><b>개인사업자·법인<\/b>: 재무상태 개선, 신용등급 또는 개인신용평점 상승 등 신용상태 개선이 인정되는 경우<\/li>\n<\/ul>\n<p>단순히 \"금리를 낮춰달라\"는 요청만으로는 신청 요건을 채우지 못합니다. 은행은 요구를 받은 날부터 <b>10영업일 이내<\/b>(자료 보완 기간 제외)에 수용 여부와 사유를 알려야 합니다. 이 조항은 이번 개정(2026-07-01)과 별개로 2018~2019년부터 시행 중인 기존 제도이며, 이번 은행법 전체 개정에 맞춰 조문 정비만 됐을 뿐 내용은 바뀌지 않았습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 자주 묻는 질문<\/h2>\n<h3>Q. 이 개정은 정확히 언제부터 적용되나요?<\/h3>\n<p>은행법 제30조의3(법률 제21296호, 2025-12-30 공포)과 시행령 제18조의5(대통령령 제36417호, 2026-06-16 공포) 둘 다 2026년 7월 1일부터 시행됩니다.<\/p>\n<h3>Q. 기존에 받은 대출도 적용되나요?<\/h3>\n<p>이 글에서 확인한 법령·보도자료에는 기존 대출에 대한 소급 적용 여부가 명시돼 있지 않습니다. 신규 대출 취급 또는 금리 재산정 시점 기준으로 적용될 가능성이 높으므로, 정확한 적용 시점은 거래 은행에 직접 확인하는 것이 정확합니다.<\/p>\n<h3>Q. 대출금리가 정확히 얼마 내려가는지 은행이 알려주나요?<\/h3>\n<p>은행별 대출금리 산정내역서 교부에 대한 구체적 법적 근거는 이 글에서 확인하지 못했습니다. 확인되는 대로 갱신하겠습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://fsc.go.kr/no010101/85842\" target=\"_blank\" rel=\"nofollow\">▸ 금융위원회 — 「은행 대출금리에 법적비용 반영이 금지됩니다」 보도자료(2025-12-15)<\/a><a href=\"https://www.law.go.kr/법령/은행법\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 은행법(제30조의2·제30조의3)<\/a><a href=\"https://portal.kfb.or.kr/compare/loan_household.php\" target=\"_blank\" rel=\"nofollow\">▸ 전국은행연합회 소비자포털 — 은행별 대출금리 비교<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">2026년 7월 1일부터 은행 가산금리 중 <b>법적비용(보증기관 출연료·교육세)에 반영 상한<\/b>이 생겼습니다. 보증부 대출은 출연료율 50% 미만, 비보증부 대출은 전액 반영 금지입니다. 다만 이는 가산금리 7개 항목 중 하나에 대한 상한일 뿐, \"출연금이 사라진다\"거나 \"대출금리가 그만큼 내려간다\"는 뜻은 아닙니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33475c;margin:0\">2026년 8월<\/b> 기준이며, 은행법 제30조의2·제30조의3과 시행령 제18조의4·제18조의5는 국가법령정보센터(law.go.kr) 원문을, 가산금리 구성체계·시행 배경은 금융위원회 보도자료(2025-12-15)를, 보증료율 법정 상한(연 0.3%)은 신용보증기금법 제6조③·기술보증기금법 제13조③ 원문을 직접 확인했습니다.<br>출처: <a href=\"https://www.law.go.kr\" target=\"_blank\" rel=\"nofollow\">국가법령정보센터<\/a> · <a href=\"https://fsc.go.kr\" target=\"_blank\" rel=\"nofollow\">금융위원회<\/a> · <a href=\"https://portal.kfb.or.kr\" target=\"_blank\" rel=\"nofollow\">전국은행연합회<\/a><\/div>\n<div id=\"ymyl-disclaimer\" style=\"font-size:13px;color:#666;line-height:1.6;margin-top:18px\">※ 본 글은 정보 제공용이며, 실제 대출금리·적용 시점은 은행·상품·개인 신용상태에 따라 다를 수 있습니다. 정확한 금리는 거래 은행에서 확인하세요.<\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 조문·시행일·요율 상한은 <b>국가법령정보센터와 금융위원회 공식 자료를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n\n<!-- ============================================\nOSMU 확산용 핵심 3줄 요약 (네이버·쓰레드 재가공 참고용 — 발행 본문에는 포함하지 않음)\n1. 2026-07-01부터 은행 가산금리 중 보증기관 출연료·교육세(법적비용 2개 항목)에 반영 상한 신설. \"출연금 제외\"가 아니라 \"50%(보증부)/전액(비보증부) 반영 금지\".\n2. 계산예시: 보증부 대출 1억원, 출연료율 법정상한 0.3% 기준 최소 15만원(연 0.15%p 상당)이 가산금리에서 빠짐. 실제 요율은 하위법령이 별도 규정.\n3. 함정: 가산금리 7항목 중 손닿은 건 법적비용뿐, 업무원가·리스크프리미엄류·목표이익률은 그대로 — \"전체 금리 인하\"로 오해 금지. 탈락사유: 금리인하요구권은 신용상태 개선 요건 충족해야 신청 가능.\n============================================ -->\n"}]},"pace":{"date":"2026-08-31","count":3,"posts":[{"title":"퇴직금 미지급 신고 방법 처벌 총정리 (2026년 9월 18일 시행)","published":"2026-08-31T06:51:52.000+09:00"},{"title":"산에서 밤 도토리 버섯 주우면 처벌될까 총정리 (2026 가을 · 산림자원법 절도죄 5천만원 이하 벌금 · 국립공원은 허가 대","published":"2026-08-31T06:48:36.000+09:00"},{"title":"전기차 공공충전요금 개편 총정리 (2026년 8월 시행)","published":"2026-08-31T01:50:42.000+09:00"}],"soft":1,"hard":5,"state":"warn","backlog":2,"backlog_codes":["F1-14","B2-12"],"backlog_max":5,"backlog_over":false,"lanes":{"info":{"label":"일일·정보성","n":0,"codes":[]},"etc":{"label":"기타","n":0,"codes":[]},"user":{"label":"사용자 추천","n":2,"codes":["F1-14","B2-12"]}},"error":"","checked_at":"2026-08-31T13:18:13"},"topicprop":{"items":[{"code":"C2-08","title":"가을철 발열성질환 예방수칙 총정리 (쯔쯔가무시증·렙토스피라증 벌초 성묘 대처법)","lane":"info","rank":"rec","why":"질병관리청 확인: 쯔쯔가무시증 등 가을철 발열성질환은 9~12월(특히 10~11월) 집중 발생 — 2026 추석(9/24~26) 벌초·성묘 시즌 직전이라 지금 찾을 실질 수요 있음","summary":"정의·호발시기·증상(검은 가피 5~20mm)·예방수칙(긴옷·기피제·야외활동후 즉시 샤워)·물렸을 때 대처(항생제 치료 48시간내 해열)·SFTS·렙토스피라증·신증후군출혈열 비교표·의심시 병원찾기 총정리","facts":"질병관리청 국가건강정보포털: 호발 9~12월(특히10~11월)·검은 가피가 진단 핵심·독시 🔴발행 전 반드시 별도 확인(이번 조회로 못 얻음, 추정 금지): 혼인·출산 증여재산공제 1억원의 현행 여부와 요건 / 금전대차 적정이자율(4.6%설)과 무상대출 이자 증여 간주 기준금액 / 신고세액공제율 / 자금출처조사 기준. 확인 안 되면 그 수치는 빼고 '홈택스·126 확인'으로 대체할 것.","src":"lifeinfo-daily-topics","dup":"🟢 0.20","state":"approved","added":"2026-08-20T09:11:44","state_at":"2026-08-20T11:35:33","decision":"사장님 승인 (8/20 카톡 4번)","verify":{"mark":"✅","notes":[],"at":"2026-08-20T09:30:06"},"reported_at":"2026-08-20T09:31:30"},{"code":"B2-11","title":"신생아 특례대출 신청 자격 소득요건 순자산 한도 금리 총정리 (2026 · 2년 내 출산)","lane":"info","rank":"rec","why":"기한+금액변경 둘 다 있다. ①요건이 '대출접수일 기준 2년 내 출산'이라 2024년 하반기 출생아 가구는 2026년 하반기가 마지막 신청 창구다(가구마다 굴러가는 마감이라 더 잘 놓친다) ②순자산 요건 5.11억원은 '2026년도 기준'으로 매년 고시되는 금액이다.","summary":"🔴제목 판정을 밝혀 둔다 — 제목에 '디딤돌'을 넣으면 🟡 0.50(B2-08 디딤돌·버팀목), 빼면 🟢 0.33 이다. 빼고 냈지만 점수가 좋아서가 아니라 라이브 본문 실측 때문이다: B2-08 본문에 '신생아' 0회·'특례' 1회로 이 등급을 아예 안 다룬다. 다만 초안은 사실상 디딤돌 상품 글이 되므로 pubqueue·bodydup 단계에서 B2-08 겹침이 다시 올라온다 — 이미 본 사안임을 여기 남긴다. ┃구성 ①자격 4요건 표(2년 내 출산·성년 세대주·세대 전원 무주택·2023.1.1. 이후 출생아) ②소득 1.3억(맞벌이 2억)·순자산 5.11억 판정 계산예시 — 맞벌이 경계선에서 갈리는 사례 ③일반 디딤돌 vs 신생아 특례 판단형 비교표(한도 4억, 금리 1.8~4.5%) ④탈락 사유: 2022년생이라 제외 / 접수일에 이미 2년 경과 / 주택 9억 초과 / 85㎡ 초과 ⑤특례금리 5년이 끝난 뒤(추가 출산 시 최장 15년) ⚠️전세(신생아 특례 버팀목) 수치는 공식 페이지 HTTP 406 으로 미확인 — 초안에서 재시도, 못 얻으면 그 항목은 빼고 쓴다.","facts":"출처=주택도시기금 신생아 특례 디딤돌 https://nhuf.molit.go.kr/FP/FP05/FP0503/FP05030801.jsp (2026-08-21 실측) / 대출대상=대출접수일 기준 2년 내 출산·입양(2023.1.1. 이후 출생아), 민법상 성년 세대주, 세대원 전원 무주택 / 소득=부부합산 연 1.3억원 이하(맞벌이 2억원 이하) / 순자산=5.11억원 이하(2026년도 기준) / 대상주택=평가액 9억원 이하·전용 85㎡ 이하(수도권 제외 읍면 100㎡) / 한도=최대 4억원, LTV 70%(생애최초 80%, 수도권·규제지역 70%), DTI 60% / 금리=1.8~4.5%, 특례금리 기본 5년·추가 출산 시 최장 15년","src":"lifeinfo-daily-topics","dup":"🟢 0.33","state":"approved","added":"2026-08-21T09:14:16","state_at":"2026-08-21T13:56:55"},{"code":"A1-13","title":"양육비 안 주는 배우자 제재 신청 방법 총정리 (운전면허 정지·출국금지·명단공개 요건)","lane":"info","rank":"alt","why":"개정 anchor — 제재 요건이 최근 2년 새 두 번 넓어졌다. 2024.9.27 이행명령, 2025.7.1 일시금지급명령이 각각 제재 사유로 추가돼 '감치 결정이 없어도' 면허정지·출국금지·명단공개를 신청할 수 있게 됐는데, 이 사실이 사실상 안 알려져 있다. 2026-08-13 성평등가족부가 「양육비 채무 불이행자 제재조치 및 이행 방안」 보도자료를 냈다(목록에서 제목·날짜만 실측, 본문은 열지 못했다 — 근거로 세지 말 것).","summary":"⚖️바 판정을 밝혀 둔다 — 시즌·마감형 anchor 는 아니다. 추천(B2-11)보다 낮은 바에서 일부러 냈으니, 재고가 5/5 에 닿거나 다른 루틴 제안이 더 강하면 drop 이 맞다. ┃구성 ①제재 4종(운전면허정지·출국금지·명단공개·감치) 요건 비교표 — '얼마를 안 주면 무엇이 걸리는가'를 금액·기(期)로 명시 ②핵심 각도 = '감치가 있어야만 된다'는 오해 깨기: 2024.9.27부터 이행명령만으로, 2025.7.1부터 일시금지급명령 30일 미이행만으로 신청된다 ③신청 절차(양육비이행관리원 등기우편)와 실제 처분 주체·기간(경찰청 100일 면허정지 / 법무부 6개월 출국금지 / 성평등가족부 3년 명단공개) ④탈락 사유: 집행권원 없음 · 미이행액이 3천만원과 3기 어느 쪽에도 못 미침 ⑤양육비 선지급제(중위 150%·자녀 1인당 월 20만원)와의 연결. ※선지급제 단독 글은 2026년 변경 공지가 없어(양육비이행관리원 공지·성평등가족부 보도자료 양쪽 실측) '지금' 이유가 없다고 보고 뺐다.","facts":"출처=양육비이행관리원 제재조치 안내 https://www.childsupport.or.kr/lay1/S1T15C121/contents.do (2026-08-21 실측) / 운전면허정지=감치결정(2021.6.10.~) 또는 이행명령(2024.9.27.~, 미이행 3천만원 이상 또는 3기 이상) 또는 일시금지급명령(2025.7.1.~, 30일 내 미이행) → 경찰청 100일 정지, 도로교통법 제93조1항18호 / 출국금지=감치결정(2022.8.16.~ 3천만원 이상 또는 3기 이상)·이행명령·일시금지급명령 → 법무부 6개월(연장가능), 출입국관리법 제4조1항5호 / 명단공개=성평등가족부 3년, 양육비이행법 시행령 제17조의4제2항 / 신청주체=양육비 채권자, 등기우편 / 선지급제 참고=중위소득 150% 이하·자녀 1인당 월 최대 20만원·만 18세까지, 시행 2025.7.1 (https://www.childsupport.or.kr/lay1/S1T134C136/contents.do)","src":"lifeinfo-daily-topics","dup":"🟢 0.25","state":"dropped","added":"2026-08-21T09:14:39","state_at":"2026-08-21T13:16:36","decision":"키워드 실측으로 갈렸다(2026-08-21) — 양육비 미지급 검색 2,760 · 경쟁도 25.61 vs 같은 info 레인의 B2-11 신생아 특례대출 검색 137,800 · 경쟁도 0.599. 검색량 50배 · 경쟁도 43배 차이다. 루틴 자신도 초안에 '시즌·마감형 anchor 가 아니다. 추천보다 낮은 바에서 일부러 냈으니 다른 제안이 더 강하면 drop 이 맞다' 고 밝혔고 그 조건이 성립했다. 🔴 글감 가치가 없어서가 아니다 — 2024.9.27 이행명령·2025.7.1 일시금지급명령 추가는 실제 개정 anchor 이고 사회적 가치도 크다. 다만 지금 우리 목표는 색인 회복이고, 검색이 안 되는 글은 그 목표에 기여하지 못한다. 제재 관련 개정이 한 번 더 있거나 언론에 크게 다뤄질 때 다시 제안할 것"},{"code":"F1-13","title":"영국 ETA 전자여행허가 신청 방법 수수료 유효기간 총정리 (2026)","lane":"etc","rank":"rec","why":"탑승 거부로 강제되기 시작한 제도다(gov.uk 'No permission, no travel'). 2026년 4월자 내무부 ETA 팩트시트가 따로 나와 있다. 결정적으로 우리 F1-11(유럽 EES·ETIAS)을 읽은 독자가 '영국도 그 제도로 되는 줄' 알고 안 받는 혼동이 실제 탑승거부로 이어진다 — 영국은 EU 밖이라 별개 신청이다. 가을·겨울 유럽 여행 준비 시기가 지금이다.","summary":"①ETA가 비자가 아니라 '탑승 전 항공사가 확인하는 허가'라는 점을 첫 화면에서 못박는다 ②EU ETIAS·EES vs 영국 ETA 3열 비교표(적용 지역·신청처·비용·유효기간·환승 필요 여부)에 '서로 대체되나' 행 ③신청 절차 ④수수료 원화 환산을 가족 총액까지 끝까지 계산 ⑤거절·지연 시 대처 ⑥환승만 해도 필요한가 = 함정 항목","facts":"수수료 20파운드 (gov.uk/guidance/apply-for-an-electronic-travel-authorisation-eta · 2026-08-21 본문 표기 직접 확인 · 인상 이력은 확인 안 됐으므로 '올랐다'고 쓰지 말 것) / 최대 6개월 체류 (동 페이지) / 2026년 4월 내무부 ETA 팩트시트 homeofficemedia.blog.gov.uk/electronic-travel-authorisation-eta-factsheet-april-2026/ / gov.uk/government/news/uk-enforces-digital-permission-to-travel ⚠️한국 국적자 적용 여부·유효기간 연수·처리시간은 원문 미확인 — 초안 착수 전 재확인, 실패하면 뺀다","src":"lifeinfo-travel-prep","dup":"🟢 0.40","state":"approved","added":"2026-08-21T21:26:18","state_at":"2026-08-24T12:54:19","verify":{"mark":"🟡","notes":["🟡 출처 URL 이 없음(공식 .go.kr 원문 링크를 달 것)","🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall"],"at":"2026-08-24T12:26:21"},"reported_at":"2026-08-24T09:15:10"},{"code":"G4-04","title":"가을 대하 흰다리새우 구별 방법 시세 원산지 총정리 (2026 제철)","lane":"etc","rank":"rec","why":"9월이 대하 제철 시작(국립수산물품질관리원 9월 추천 수산물). 가을 새우축제·수산시장 성수기에 흰다리새우를 대하로 파는 표시 문제가 매년 반복되는데, 독자가 현장에서 눈으로 판별할 기준을 아무도 표로 안 준다. 시즌 앵글이라 9월 첫 주 안에 나가야 값이 있다.","summary":"①현장 판별 3열 표(구분/대하/흰다리새우: 이마뿔 길이·수염 길이·꼬리색·원산). ②'익히면 둘 다 붉어진다' 등 통하지 않는 구별법을 따로 표기(함정). ③가격 계산예시 — kg 시세 차이로 4인 가족 1kg 구매 시 차액을 끝까지 계산(시세는 수산물유통정보 fips.go.kr 실측 후 기준일 명시). ④'자연산 대하'라는 표현이 왜 붙는지(대하는 양식이 사실상 없음) ⑤표시가 틀렸을 때 신고처. 썸네일=G라 실사진 필수인데 insta/_src 에 새우·수산시장 사진이 없다(전어에 쓴 fresh_sardines_market 재사용 금지) → Pexels 에서 새우/수산시장 사진 신규 확보 필요.","facts":"[공식확인] 국립수산물품질관리원 수산물안전정보 '9월 수산물소개' https://www.fsis.go.kr/front/contents/cmsView.do?cate_id=0301&cnts_id=37529 — 대하: 이마뿔이 코끝보다 길게 나와 제2촉각 두 번째 마디를 훨씬 넘음·몸통보다 수염이 길다·꼬리가 초록빛·우리나라와 중국의 한정된 지역에만 분포 / 흰다리새우: 이마뿔이 짧아 제2촉각 두 번째 마디를 넘지 않음·중남미 태평양 해역 원산·2003년 국내 이식 양식. [미확인=초안 전 필수] 대하·흰다리새우 kg 시세(fips.go.kr) · 원산지/품명 거짓표시 과태료 조문 · 남당항 대하축제 2026 기간(홍성군 공식 페이지에 기간 미기재 — 실측 2026-08-24). KW=미측정","src":"lifeinfo-travel-prep","dup":"🟢 0.33","state":"approved","added":"2026-08-24T21:15:54","state_at":"2026-08-25T09:15:45","decision":"루틴이 요청한 판단을 내린다 — 이번 회차에서 뺀다. 승인된 G4-03(가을 전어)이 아직 미발행이라 dupcheck 0.33 은 겹침 없음을 보증하지 못한다(전어 본문을 못 보고 낸 점수다). 둘 다 서해 가을 제철 수산물로 독자 체감이 겹친다. 남당항 대하축제는 9/4~11/8 로 9주간 열려 전어축제(9/4~9/6)보다 시효가 훨씬 길다 — 전어 발행 후 2주 뒤 제안해도 늦지 않다.","verify":{"mark":"🟡","notes":["🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall"],"at":"2026-08-25T09:14:34"},"reported_at":"2026-08-24T22:23:48"},{"code":"A5-07","title":"추석 연휴 휴일근로수당 계산 방법 총정리 (2026 · 9월 24~26일 · 5인 미만 사업장 제외)","lane":"info","rank":"rec","why":"시즌+쟁점. 2026 추석 연휴는 9/24(목)~9/26(토)로 딱 한 달 앞이고 근무 스케줄·수당이 지금 정해진다. 핵심 쟁점은 '연휴가 토요일과 겹쳤는데 대체공휴일이 붙느냐' — 설·추석은 다른 공휴일과 대체 요건이 다르다는 점이 독자 기대와 어긋나 검색이 몰리는 지점이다. 🔴대체공휴일 적용 여부는 발행 전 「관공서의 공휴일에 관한 규정」 제3조 원문으로 확정할 것(이번 회차 미확정).","summary":"①첫 화면에서 전제를 깬다 — '추석에 일하면 무조건 1.5배'가 아니다(5인 미만 사업장은 공휴일 유급휴일·가산수당 자체가 적용 제외 = 탈락 사유). ②월급제 vs 시급제 3열 비교표(공식 문구 | 월급제 실제 | 시급제 실제) — 월급제는 유급휴일수당이 이미 월급에 포함돼 추가 지급분 계산이 다르다. ③계산예시를 끝까지 계산: 통상시급 12,000원 가정으로 8시간 근무 / 10시간 근무(8h초과분) / 야간(22~06시) 중복가산 3케이스의 최종 수령액. ④2026 추석 3일(9/24~26)에 각각 얼마인지 날짜별 표 — 9/26은 토요일이라 무급휴무일인 사업장에서 처리가 갈린다. ⑤'대체공휴일 없음' 판정 근거를 규정 원문으로 제시. ⑥확인 못 한 항목은 뺐다는 사실과 확인처를 본문에 밝힌다.","facts":"🔴이번 회차 공식 전사 실패 — 수치를 확정으로 쓰지 말 것. law.go.kr 은 iframe+JS 라 WebFetch/curl 로 조문 본문이 안 나온다(실측: 명칭만 반환). 조문팝업 lsLinkProc URL 은 2014년 구법(제56조 제2항 없는 판)을 반환했다 = 구버전 함정. 초안 단계에서 브라우저(claude-in-chrome)로 전사할 것. 확인 대상: 근로기준법 제56조②(8시간 이내/초과 휴일근로 가산률) · 제55조②+시행령 제30조②(관공서 공휴일의 유급휴일화, 상시 5인 이상) · 「관공서의 공휴일에 관한 규정」 제3조(설날·추석 연휴 대체공휴일 요건) · 2026 추석 연휴 날짜는 인사혁신처/관보로 확정. KW=미측정 — 무인 실행이라 브라우저 2대 중 선택 불가(키워드마스터 접근 실패). 큐 적재 전 반드시 실측할 것.","src":"lifeinfo-daily-topics","dup":"🟢 0.25","state":"approved","added":"2026-08-23T09:13:30","state_at":"2026-08-23T15:09:47","verify":{"mark":"🟡","notes":["🟡 출처 URL 이 없음(공식 .go.kr 원문 링크를 달 것)","🟡 키워드 미측정 — 검색량을 모르면 '아무도 안 찾는 글'을 승인하게 된다. whereispost.com/keyword 에서 대표 키워드를 재고 facts 에 'KW=<키워드> 검색 <총합> 문서 <문서수> 경쟁도 <비율>' 로 적을 것","ℹ️ 재고 3/5 (큐 2 + 승인·미적재 1) — 여유 2"],"at":"2026-08-23T14:02:20"},"reported_at":"2026-08-23T13:45:19"},{"code":"A5-08","title":"근로복지공단 생활안정자금 융자 신청 방법 대상 한도 금리 총정리 (2026)","lane":"info","rank":"alt","why":"시즌(추석 목돈 수요 — 혼례·장례·의료비가 명절 전후로 몰린다) + 2026년 융자사업 기준 소득요건이 월평균 268만원으로 고시된 상태. 🔴솔직히 밝힌다: 이 건은 rec 과 달리 '하드 기한'이 없다(정부24 페이지에 예산 소진 마감 기재 없음 — 조기마감을 근거로 쓰지 말 것). 연 1.5% 정책융자인데 인지도가 낮다는 점이 실질 근거이므로, 특별이슈급 판단은 이부장이 내려 주기 바란다.","summary":"①행동요구형(신청·자격·한도·금리)이라 rec(계산형)과 글 모양이 겹치지 않는다. ②융자항목별 한도 구간표 — '최대 2,000만원'이라는 범위가 아니라 의료비/장례비/노부모부양비/혼례비/자녀양육비/소액생계비 항목별로 얼마인지 표로 확정해 준다(독자 질문은 '내 경우 얼마'다). ③탈락 사유를 앞에 둔다 — 월평균소득 268만원 초과, 신용보증 심사. 일용근로자는 소득요건 미적용이라는 예외도 함께. ④계산예시를 끝까지: 1,000만원을 연 1.5%+신용보증료 0.9%로 1년 거치 3년 상환 시 월 상환액과 총 이자를 실제로 계산(시중 신용대출과 비교표). ⑤신청 경로(근로복지공단 근로복지서비스 / 정부24)와 필요서류.","facts":"정부24 공식 서비스 페이지에서 2026-08-23 직접 확인 — https://www.gov.kr/portal/service/serviceInfo/B49000100006 · 소득요건 월평균소득 268만원 이하(2026년 융자사업 기준), 일용근로자는 소득요건 미적용 · 항목별 한도: 의료비 1,000만(실제 비용 내)·장례비 1,000만·노부모부양비 2,000만·혼례비 1,250만·자녀양육비 2,000만·소액생계비 200만 이내, 1인당 최대 2,000만 · 금리 연 1.5%, 1년 거치 3년 또는 1년 거치 4년 원금균등분할상환, 신용보증료 연 0.9% · 소관 근로복지공단 복지사업국(1588-0075). 🔴예산 소진 시 마감 여부는 해당 페이지에 기재가 없다 — 발행 전 근로복지공단 공고로 확인하고, 확인 안 되면 그 문장을 쓰지 말 것. KW=미측정(무인 실행 — 브라우저 2대 중 선택 불가). 큐 적재 전 실측 필요.","src":"lifeinfo-daily-topics","dup":"🟢 0.33","state":"dropped","added":"2026-08-23T09:13:56","state_at":"2026-08-23T13:44:55","decision":"루틴 자신이 하드 기한이 없다고 밝혔다(정부24 페이지에 예산소진 마감 기재 없음). 선별 기준은 새 주제인가가 아니라 특별이슈급인가 — 연 1.5% 정책융자의 낮은 인지도는 상시 가치이지 지금 이유가 아니다. 근로복지공단 공고에 예산소진·마감이 뜨거나 소득요건(월 268만원)이 개정되면 그때 다시 제안할 것."},{"code":"A3-09","title":"국민연금 유족연금 지급률 노령연금 중복 선택 총정리 (2026 · 배우자 3년 후 지급정지·소멸시효 5년)","lane":"info","rank":"rec","why":"기한형 2개가 동시에 걸린다. ①청구 소멸시효 5년 — 2021년 배우자 사별 유족의 청구권이 지금 만료 구간에 들어간다(청구 안 하면 영구 소멸) ②배우자 유족연금은 수급권 발생 후 3년만 지급되고 55세까지 정지 — 2023년 수급 시작자가 지금 정지 절벽을 맞는다. 둘 다 국민연금공단 공식 페이지에 명시된 날짜 규칙이고, A3 연금 8편 중 유족연금은 미커버다.","summary":"①1장 첫 문장에서 독자 전제를 깬다 — '배우자면 평생 나온다'는 틀렸다(3년 지급 후 55세까지 정지, 예외 있음) ②가입기간별 지급률 구간표 40/50/60% + 부양가족연금액을 더한 실제 월 수령액 계산예시(범위가 아니라 구간표로) ③판단형 비교표 '노령연금 vs 유족연금 어느 쪽을 고를까' — 서로 대체되나 행 포함, 노령연금 선택 시 유족연금 30% 추가 지급이 핵심 반전 ④탈락·소멸 사유(재혼·파양·자녀 25세/손자녀 19세 도달·순위 밀림) ⑤소멸시효 5년 함정과 청구 절차(지사 내방/우편, 처리 30일)","facts":"출처=국민연금공단 유족연금 https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0072M0.do · 중복급여의 조정 https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0048M0.do?menuId=MN24001117&tab=tab2 (둘 다 2026-08-24 직접 확인) | 지급률: 가입 10년 미만 기본연금액 40% · 10~20년 미만 50% · 20년 이상 60% (+부양가족연금액) | 부양가족연금액 2026.1~2026.12월분 적용: 배우자 연 306,630원 · 자녀/부모 1인당 연 204,360원 ← 기준연도 반드시 병기 | 중복급여 조정 원문: '선택하지 아니한 급여가 유족연금일 경우 선택한 급여와 유족연금액의 30% 지급(단, 선택한 급여가 반환일시금이면 30% 미지급)' | 노령연금 수급권자 사망 시 유족연금액은 사망자가 받던 노령연금액을 초과할 수 없음 | 유족순위: 배우자(사실혼 포함)>자녀>부모>손자녀>조부모 중 최우선순위자 | 소멸: 수급권자 사망·배우자 재혼·자녀/손자녀 파양·자녀 25세/손자녀 19세 도달 | 정지: 배우자는 수급권 발생 후 3년 지급 뒤 55세까지 정지(예외 있음) | 소멸시효 5년 · 처리기한 30일 | KW=미측정 (무인 실행 면제 — 이부장 검증 단계에서 측정)","src":"lifeinfo-daily-topics","dup":"🟢 0.33","state":"approved","added":"2026-08-24T09:10:58","state_at":"2026-08-24T12:54:28","verify":{"mark":"🟡","notes":["🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall"],"at":"2026-08-24T12:26:21"},"reported_at":"2026-08-24T09:15:10"},{"code":"A3-10","title":"국민연금 보험료율 인상 2026 근로자 사업주 부담액 계산 총정리 (9.5%→13% 2033까지 단계 인상)","lane":"info","rank":"rec","why":"2026-01 시행된 국민연금 보험료율 9%→9.5% 인상(2033년 13%까지 매년 0.5%p)과 소득대체율 41.5%→43% 변경이 시행 중인데도 액수·계산법을 모르는 독자가 많음 — 월평균소득 309만원 기준 사업장가입자 월 7,700원·지역가입자 월 15,400원 추가부담 등 구체 수치 존재","summary":"①왜 오르나(2025 국회 통과 연금개혁) ②연도별 인상표(2026 9.5%~2033 13%) ③소득구간별 근로자/사업주 부담액 계산예시(내 월급 실수령액 얼마나 주는지) ④지역가입자 vs 사업장가입자 부담 차이 ⑤소득대체율 43% 인상으로 늘어나는 연금액(40년 가입 기준 월 약 9만원↑) ⑥납부 확인·이의 방법","facts":"2026년 요율 9.5%(전년 9%, 2033년까지 매년 0.5%p↑ 13% 도달) · 소득대체율 41.5%→43% · 월평균소득 309만원 기준 사업장가입자 월 7,700원·지역가입자 월 15,400원 추가부담 · 출처 대한민국 정책브리핑 korea.kr(news 148957270), 국민연금공단 npsonair.kr","src":"lifeinfo-daily-topics","dup":"🟡 0.50","state":"proposed","added":"2026-08-31T09:06:30","state_at":"2026-08-24T09:13:28","decision":"🟡 0.50 인 데다 A3-09(유족연금)와 같은 회차에 나왔다. 두 편 다 국민연금이고 독자가 보기엔 같은 갈래다 — 승인 라인에 나란히 올리면 사장님이 고르기 어렵다. 크레딧 3종은 그 자체로 좋은 글감이고 실업크레딧 신청 창(구직급여 종료일이 속하는 달의 다음 달 15일까지)은 진짜 기한이다. A3-09 발행 후 2주 뒤 다시 제안할 것."},{"code":"G2-03","title":"양산 통도사 국가유산 미디어아트 2026 관람 방법 주차 입장시간 총정리","lane":"etc","rank":"alt","why":"국가유산청 2026 미디어아트가 8월 14일 시작해 10월까지 전국 12곳에서 순차 개최되고 양산 통도사가 그중 한 곳이다(공식 확인). 회차가 지나면 값이 0이 되는 시즌 주제이고, G2(양산)는 2편뿐인 최빈약 중분류다.","summary":"①전국 12곳 일정 표(지역·기간)에서 양산 회차를 굵게 — 독자가 '내 동네는 언제인가'에 바로 답. ②야간 행사의 실제 함정: 산문(매표소) 입장 마감시각이 행사 종료시각보다 이르다는 점, 주차장에서 행사장까지 도보 거리, 무료여도 사찰 주차료는 별도인지. ③작년(2025) 회차와 올해가 무엇이 다른지(작년은 산문 중심, 올해는 경내 전체로 확대) — 재방문자 판단용. ④우천 시 취소·환불 기준. 썸네일=G라 실사진 필수 — insta/_src/temple_mountain_35756370.jpg 가 산사 실사진이라 대체 가능하나 '야간 미디어아트'와는 다르다. 소재가 맞는 사진을 새로 구하는 쪽을 권함. 🔴 이 후보는 정확 일정이 공식에 아직 없어 초안 착수 전 확인이 선행돼야 한다.","facts":"[공식확인] 국가유산진흥원 '국가유산 방문 캠페인' https://www.kh.or.kr/visit/kor/content.do?key=2501130002 — 2026 국가유산 미디어아트: 2026년 8~10월 · 전국 12개 지역(강화·경주·군산·부여·아산·양산·여수·익산·진주·철원·청주·통영) · 주최 국가유산청 · 주관 국가유산진흥원 · 콜센터 1670-8904. [미확인=초안 전 필수] 양산 통도사 회차의 기간·관람시간·산문 입장마감·예약 여부 — 공식 연간일정 페이지는 2026-08-24 현재 2025년분(10.3~10.29 '산문의 빛')만 게시하고 있고, 국가유산청 보도자료 게시판 제목검색으로도 2026 미디어아트 건을 확보하지 못했다. 뉴스에 도는 9/28~10/18 은 2차출처라 쓰지 않는다. KW=미측정","src":"lifeinfo-travel-prep","dup":"🟢 0.33","state":"approved","added":"2026-08-24T21:16:18","state_at":"2026-08-25T09:16:29","verify":{"mark":"🟡","notes":["🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall"],"at":"2026-08-25T09:14:34"},"reported_at":"2026-08-24T22:23:48"},{"code":"C2-09","title":"추석 연휴 문 여는 병원 약국 찾는 방법 진료비 가산 총정리 (2026 · 9월 24~26일)","lane":"info","rank":"rec","why":"2026 추석 연휴가 9/24(목)~9/27(일)로 확정(천문연 2026년 월력요항). 연휴 4일간 동네 의원·약국이 닫혀 매년 이 시기 검색이 몰리는데, 그때 진료비가 30% 가산된다는 사실은 대부분 모른다. 9월 초 발행하면 연휴 2~3주 전이라 색인될 시간이 있다.","summary":"①조회창구 4개 비교표(E-Gen 웹·앱/12 07 기준) · 🔴미확인: 2026년 실제 조기지급일은 복지부 보도자료 미발표 상태다(2026-08-25 확인). 발표 전에는 날짜를 추정해 쓰지 말 것 — 발행 직전 mohw.go.kr 보도자료 재조회 필수.","src":"lifeinfo-daily-topics","dup":"🟡 0.50","state":"approved","added":"2026-08-25T09:11:13","state_at":"2026-08-25T09:17:58","verify":{"mark":"🟡","notes":["🟡 관련글 — ","🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall"],"at":"2026-08-25T09:14:34"},"reported_at":"2026-08-25T09:14:50"},{"code":"A3-11","title":"국민연금 실버론 노후긴급자금 대부 신청 방법 한도 용도 총정리 (2026 만 60세 이상 수급자)","lane":"info","rank":"alt","why":"1순위 용도가 전월세 보증금인데 지금이 가을 이사철 진입 구간이다(같은 시즌 근거로 D3-05 전세 계약갱신청구권을 이미 발행했다). 추석 의료비·장제비 지출도 겹친다. 다만 개정·금액변경 같은 하드 이슈는 없으므로 rec 가 아니라 alt 로 낸다 — 이부장이 판단할 것.","summary":"①대상 판정표(노령·분할·유족·장애1~3급 수급자 vs 탈락 사유 — 만 60세 미만·장애 4급·수급 중단자). ②한도 계산예시를 끝까지: 월 연금 60만원 수급자 → 연 720만원 × 2배 = 1,440만원이지만 상한 1,000만원 → 실제 사용비용 이내로 얼마가 나오나. ③용도 4종별 필요서류·인정 범위(전월세 보증금 / 의료비 / 배우자 장제비 / 재해복구비) — '실제 사용한 비용'만 나온다는 함정. ④상환 = 연금에서 차감되므로 매달 손에 쥐는 연금이 줄어든다(차감 후 실수령 계산). ⑤햇살론(B2-05)·새출발기금(A4-01)과 '서로 대체되나' 비교행.","facts":"KW=미측정 · 대상: 국내 거주 만 60세 이상 국민연금 수급자(노령·분할·유족·장애 1~3급) · 한도: 개인별 연간 연금수령액의 2배 이내에서 실제 사용한 비용, 최고 1,000만원 · 용도 4종: 전월세 보증금·의료비·배우자 장제비·재해복구비 · 금리: 5년 만기 국고채 수익률과 예금은행 가중평균 수신금리(신규취급액) 중 낮은 금리에 연동, 분기별 변동금리 → 🔴분기마다 바뀌므로 발행 시점에 공단 이자율 공지를 재조회할 것(검색으로 확인된 최신 공지가 2025년 4분기분이었다) · 출처 https://pensioner.nps.or.kr/iaopsrvc/silverloan/getOHDD0001M0.do · https://www.gov.kr/portal/service/serviceInfo/B55201500002","src":"lifeinfo-daily-topics","dup":"🟢 0.33","state":"dropped","added":"2026-08-25T09:11:34","state_at":"2026-08-27T16:19:48","decision":"루틴이 스스로 '개정·금액변경 같은 하드 이슈는 없다'고 적어 alt 로 냈다. 선별 기준은 '새 주제인가'가 아니라 '특별이슈급인가'이고 이건 미달이다. 소재 자체는 좋으니 실버론 금리·한도 개정이 나오면 그때 rec 로 재제안"},{"code":"B2-12","title":"은행 대출금리 가산금리 인하 총정리 (2026년 7월 시행 · 보증기금 출연금 제외 · 내 금리 확인법)","lane":"info","rank":"rec","why":"개정 시행 anchor — 금융위 「2026년 새해부터 달라지는 금융제도」(2025-12-30)의 '대출금리 산정방식 개선'이 2026.7.1 시행됐다. 은행이 지급준비금·예금자보험료·서민금융진흥원 출연금·각종 보증기금 출연금을 가산금리에 넣는 것이 금지된 규정으로, 가을 이사철(9~10월) 전세·주담대 실행과 대환이 몰리는 지금이 이 규정의 적용을 실제로 받는 시점이다. 🔴 기존 대출 소급 여부는 보도자료에 명시가 없다 — 초안 전 은행연합회 대출금리 모범규준 개정문으로 확인하고, 확인 못 하면 그 항목은 빼고 '확인 방법'만 쓴다(추정 금지).","summary":"①가산금리 대조표: 이제 못 넣는 비용 4가지 vs 여전히 반영 가능한 것(보증부 대출 출연료율 50% 이하) ②'내 금리는 왜 그대로인가' — 신규 취급분과 기존 대출 구분(확인된 범위에서만 서술) ③은행연합회 소비자포털에서 기준금리·가산금리·우대금리를 분해해 읽는 법(화면 순서대로) ④계산예시: 주담대 3억·30년에서 가산금리 0.1%p 차이가 연 이자·총이자로 얼마인지 끝까지 계산 ⑤함정: 전세보증·정책모기지 같은 보증부 대출은 예외라 기대만큼 안 내려간다 ⑥지금 갈아탈까 판단표 — 중도상환수수료 실비용 방식(2026.1.1)과 함께 따진 손익분기","facts":"금융위원회 「2026년 새해부터 달라지는 금융제도」(2025-12-30) 원문 확인분 / 대출금리 산정방식 개선 시행일 '26.7.1. / 가산금리 제외 항목 = '지급준비금, 예금자보험료, 서민금융진흥원 출연금 및 개별 법률에 따른 각종 보증기금 출연금' / 예외 = '보증부 대출은 출연료율의 50% 이하 범위에서 대통령령으로 정하는 비율 내 반영가능' / 🔴기존 대출 소급 적용 여부 = 보도자료에 명시 없음(추정 금지·별도 확인 필요) / 같은 자료의 인접 개정 = 중도상환수수료 실비용 반영 '26.1.1, 햇살론 2개 통합·특례보증 15.9%→12.5% '26.1.2 / 출처 https://www.fsc.go.kr/no010101/85970 / KW=미측정","src":"lifeinfo-daily-topics","dup":"🟢 0.00","state":"approved","added":"2026-08-27T09:12:20","state_at":"2026-08-27T16:26:17","verify":{"mark":"🟡","notes":["🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall"],"at":"2026-08-27T16:19:59"},"reported_at":"2026-08-27T16:20:20"},{"code":"D2-11","title":"전기차 공공충전요금 개편 총정리 (2026년 8월 시행 · 완속 인하 초급속 인상)","lane":"info","rank":"rec","why":"기후에너지환경부 공공충전요금 5단계 개편이 2026-08-01 시행됐다(기존 2단계→5단계 세분화). 개편 직후인 지금이 독자가 '내 요금이 왜 바뀌었나'를 가장 궁금해할 시점이고, 완속 위주 이용자는 절감·초급속 위주는 부담증가로 갈려 판단형 콘텐츠 가치가 크다.","summary":"①5단계 구간표: 30kW미만(완속)~200kW이상(초급속) 출력 구간별 kWh당 요금 개편 전/후 나란히 ②계산예시: 월 300kWh 기준 완속 이용자와 초급속 이용자의 월 부담액 차이를 끝까지 원 단위로 계산 ③판단형 비교: '완속으로 바꿔야 하나' — 요금 차이 vs 충전시간 트레이드오프 ④봄가을 주말·공휴일 11~14시 최대 15% 할인 활용법 ⑤함정: 이 개편은 공공충전기 한정 — 아파트 자체(사설) 충전기 요금과는 무관함을 명시","facts":"기후에너지환경부, 2026-08-01 시행. 5단계: 30kW미만(완속) 324.4→295.0원(-9.1%) · 30~50kW 307.2원 · 50~100kW 325.6원 · 100~200kW 348.4원 · 200kW이상(초급속) 347.2→393.1원(+13.2%). 소비자 부담: 완속 위주 월~9천원·연~10만원 절감 / 초급속 위주 월~1.3만원·연~16만원 추가부담. 봄가을 주말·공휴일 11~14시 최대 15% 할인 유지. 출처: korea.kr 정책브리핑 https://www.korea.kr/news/policyNewsView.do?newsId=148963665 (시행일·5단계기준·부처 확인) + 세부 kWh 단가는 fnnews 2026-07-31 보도 교차확인. 🔴 초안 작성 전 mcee.go.kr·ev.or.kr 공식 요금표에서 5개 구간 단가를 원자료로 재확인할 것(현재는 뉴스 교차확인 단계).","src":"lifeinfo-daily-publish","dup":"🟢 0.33","state":"approved","added":"2026-08-27T12:54:36","state_at":"2026-08-27T16:26:16","verify":{"mark":"🟡","notes":["🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall"],"at":"2026-08-27T16:19:59"},"reported_at":"2026-08-27T16:20:20"},{"code":"C3-06","title":"노인장기요양 재가급여 월 한도액 인상 총정리 (2026 · 1등급 251만원 2등급 233만원)","lane":"info","rank":"alt","why":"보건복지부 「2026년 보건복지 정책 이렇게 달라집니다」에 실린 확정 인상액 — 1등급 231만→251만원, 2등급 208만→233만원(2025-12 대비 2026 기준). 초고령사회 진입에 따른 중증 어르신 지원 강화 조치로, 이미 등급판정을 받은 가족을 둔 독자에게 '내 한도가 얼마나 올랐고 무엇을 더 쓸 수 있나'는 즉시 확인 수요다. 기존 C3-02(등급신청·본인부담금)와 달리 이 글은 한도액 인상폭 자체를 다룬다.","summary":"①등급별 한도액 표: 1등급 231→251만원, 2등급 208→233만원(2025-12 기준 vs 2026) ②계산예시: 재가급여 본인부담률(일반 15%) 적용 시 한도 인상분만큼 실제로 더 쓸 경우 본인부담 증가액을 원 단위로 계산 ③판단형: '한도가 올랐다=더 많이 써도 된다'가 아니라 실제 이용은 장기요양기관·공단 승인 범위 내라는 점 정리 ④함정: 3~5등급 인상 여부는 확인된 자료에 없음 — 이 항목은 '확인 안 됨'으로 명시(추정 금지) ⑤재가급여 한도를 초과해 쓰면 초과분 전액 본인부담이라는 점 강조","facts":"보건복지부, 대한민국 정책브리핑 「2026년 보건복지 정책 이렇게 달라집니다」. 1등급 재가급여 월 한도액: 2025-12 기준 231만원 → 2026년 251만원. 2등급: 208만원 → 233만원. 3~5등급 인상폭은 이 자료에 없음(추정 금지 — 확인 안 된 항목으로 그대로 남김). 출처 https://www.korea.kr/multi/visualNewsView.do?newsId=148956615 . 🔴 방문재활·방문영양 신규서비스 도입설(하반기 시범)은 비공식 출처(블로그)에서만 확인돼 이 제안엔 넣지 않음 — 초안 작성 전 국민건강보험공단 장기요양보험 공식 공지로 별도 확인 필요.","src":"lifeinfo-daily-publish","dup":"🟢 0.25","state":"dropped","added":"2026-08-27T12:54:55","state_at":"2026-08-27T16:19:48","decision":"인상은 확정이지만 '지금 찾을 이유'가 없다 — 2026 연초 시행분이라 시의성 anchor 가 8월에 없다. 게다가 3~5등급 인상 여부가 확인 자료에 없어 등급별 표가 반쪽이 된다(추정 금지 규칙상 비워야 함). 표가 비면 이 글의 핵심 판매물이 사라진다. 3~5등급 수치가 확인되면 재제안"},{"code":"F2-15","title":"전기차 고속도로 통행료 할인 30% 등록 방법 총정리 (2026년 40%→30% 축소·2027년 20% 예고)","lane":"etc","rank":"rec","why":"국토교통부가 유료도로법 시행령 개정(입법예고)으로 친환경차 통행료 감면을 2027년까지 3년 연장하되 할인율을 단계적으로 낮췄다 — 2025년 40%→2026년 30%(현재)→2027년 20%. 아직 하이패스에 전기차 등록을 안 해둔 운전자는 지금 확인 안 하면 30%도 못 받는다(금액 변경 anchor, 아직 미다룬 소재).","summary":"①연도별 할인율 변천표(2024 50%→2025 40%→2026 30%→2027 20%, 유료도로법 시행령 개정 근거) ②적용대상(순수 전기차·수소차만, 하이브리드·PHEV 제외) ③등록 방법 3가지(하이패스 홈페이지·앱, 콜센터, 톨게이트 영업소 방문 — 민자고속도로 영업소는 불가) ④결제수단 조건(하이패스 전용지불수단 필수, 현금 결제 시 감면 불가라는 함정) ⑤등록 안 하고 놓치는 사례 + 특정 구간 예시로 실제 절감액 계산","facts":"국민일보(2026) 국토교통부 유료도로법 시행령 개정 입법예고 인용: 전기·수소차 하이패스 통행료 감면 2025년 40%→2026년 30%→2027년 20% 단계적 축소, 2027-12-31까지 연장. 순수전기차(BEV)·수소전기차(FCEV)만 대상, PHEV·HEV 제외. 발행 전 law.go.kr 유료도로법 시행령 원문 + ex.co.kr 공식 안내로 조문 번호·시행일 재확인 필요.","src":"lifeinfo-travel-prep","dup":"🟢 0.40","state":"dropped","added":"2026-08-27T12:56:44","state_at":"2026-08-27T16:19:48","decision":"🔴 근거가 입법예고 단계다 — 유료도로법 시행령 개정이 아직 확정 공포·시행이 아닌데 제목이 '2026년 30%'를 단정한다. 확정 안 된 요율을 금액으로 파는 글은 이 저장소 최상위 규칙(공식 확인 실패=그 수치 안 씀) 위반이다. 공포·시행이 확인되면 그때 재제안. 부수적으로 D2-11(전기차 충전요금)과 같은 소재군이라 동시 2편은 과하다"},{"code":"G4-05","title":"산에서 밤 도토리 버섯 주우면 처벌될까 총정리 (2026 가을 · 산림자원법 절도죄 5천만원 이하 벌금 · 국립공원은 허가 대상)","lane":"etc","rank":"rec","why":"가을 임산물철(밤·도토리·버섯)이 지금 시작이고 추석 성묘·벌초·단풍 산행이 겹치는 3주다. 우리 DB의 G4는 제철 먹거리(전어·대하)만 있고 \"그 먹거리를 산에서 직접 주워도 되는가\"에 답한 글이 없다. 산림자원법이 2026-03-31 개정 시행(법률 제21506호)돼 조문·형량을 지금 원문으로 확정 인용할 수 있다. 무엇보다 이 주제는 독자의 전제가 틀린 소재다 — 대부분 \"주인 없는 산에서 밤 몇 개\"로 알지만 법은 절도(5년 이하 징역 또는 5천만원 이하 벌금)로 본다.","summary":"①처벌 구간표: 산림자원법 제73조① 산림 산물 절취=5년 이하 징역 또는 5천만원 이하 벌금 / 제73조③ 야간·상습·차량운반=1년 이상 10년 이하 징역(벌금형이 아예 없다) / 제79조① 신고 없이 굴취·채취=500만원 이하 과태료 / 제75조 임산물 몰수·추징. ②판단표 \"여기서 주워도 되나\" 4열: 내 소유 산 / 남의 사유림 / 국유림 / 국립공원 — 근거 법과 처벌이 각각 다르다(국립공원만 자연공원법이 따로 걸린다). ③독자의 전제를 첫 화면에서 깬다: \"주인 없는 산은 없다\" — 모든 산은 국유·공유·사유 중 하나다. ④함정: 미수범도 처벌(제73조②) · 야간 채취는 벌금형 선택지가 없어 징역만 남는다 · 차 트렁크에 실으면 가중 · 국립공원은 \"몰랐다\"가 안 통하고 허가 없이 채취한 순간 형사처벌 구간이다. ⑤합법 경로: 국유림 산나물 채취 허가, 산림조합 임산물 채취권, 사유림은 소유자 동의. ⑥초안 때 국립공원공단 공식 안내 페이지로 실제 단속·계도 운영을 보강할 것(조문은 이미 확정).","facts":"[공식확인·1차출처 ①] 산림자원의 조성 및 관리에 관한 법률(법률 제21506호, 공포·시행 2026-03-31) — law.go.kr DRF API 원문 취득. 제73조① \"산림에서 그 산물(조림된 묘목을 포함한다)을 절취한 자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다\" / 제73조② 미수범 처벌 / 제73조③ 채종림·시험림 절취, 원뿌리 채취, 차량·선박 운반, 야간 절취, 상습은 1년 이상 10년 이하 징역 / 제75조 관련 임산물 몰수, 몰수 불가 시 가액 추징 / 제79조① 제19조5항 단서 신고 없이 임산물 굴취·채취 시 500만원 이하 과태료. [공식확인·1차출처 ② 국립공원] 자연공원법(시행 2026-07-07) 제23조①7호 \"나무를 베거나 야생식물을 채취하는 행위\"는 공원관리청 허가 대상이고, 제82조2호가 \"제23조제1항제1호부터 제7호까지를 위반하여 허가를 받지 아니하고 허가대상 행위를 한 자\"에게 3년 이하의 징역 또는 3천만원 이하의 벌금을 규정한다(제7호가 1~7호 범위에 들어가므로 제83조 2년·2천만원이 아니라 제82조가 적용된다). 참고로 제27조 금지행위 목록에는 채취가 없다 — 국립공원의 근거는 금지가 아니라 허가다. [초안 때 보강] 국립공원공단 안내 페이지의 실제 단속·계도 운영, 밤·도토리가 \"야생식물 채취\"로 다뤄지는 실제 사례. KW=미측정","src":"lifeinfo-travel-prep","dup":"🟢 0.00","state":"approved","added":"2026-08-27T21:29:42","state_at":"2026-08-30T14:45:17","verify":{"mark":"🟡","notes":["🟡 출처 URL 이 없음(공식 .go.kr 원문 링크를 달 것)","🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall","ℹ️ 재고 3/5 (큐 2 + 승인·미적재 1) — 여유 2"],"at":"2026-08-30T14:40:43"},"reported_at":"2026-08-30T14:41:11"},{"code":"F1-14","title":"해외여행 축산물 반입 신고 안 하면 과태료 총정리 (2026 · ASF 발생국 돼지고기 1차 500만원 · 소시지 햄 베이컨)","lane":"etc","rank":"alt","why":"추석 연휴(9/25)가 4주 앞이라 해외여행 출입국이 몰리고, 귀국 시 소시지·햄 같은 선물을 그대로 들여오다 걸리는 게 이 시기다. 우리 DB의 해외여행 서류·규정 글(F1)은 입국허가(ESTA·ETA·TDAC·EES)만 다뤘고 귀국할 때 걸리는 규정은 한 편도 없다. 그리고 이 주제는 금액을 범위가 아니라 구간표로 줄 수 있다 — 가축전염병 예방법 시행령 별표가 위반차수별 과태료를 원 단위로 고시하고 있어 \"얼마인가\"에 정확히 답하는 글이 된다.","summary":"①과태료 구간표(만원 · 1차/2차/3차) — 시행령 별표의 계층을 그대로 살려 표로 낸다. 검역증명서 미첨부 동물생산물은 다시 둘로 갈린다: [가] ASF 발생국산 돼지고기 및 그 돼지고기가 포함된 제품 500/750/1,000 · [나] 그 밖의 경우 100/300/500. 검역증명서를 첨부한 동물생산물은 5/10/50. 동물은 CITES 국제거래 금지종 300/400/500 · 그 밖의 동물 70/100/200. ②독자의 전제를 첫 화면에서 깬다: 처벌 대상은 \"반입\"이 아니라 \"미신고\"다 — 입국 즉시 신고하면 폐기하고 끝난다. ③함정 하나가 이 글의 핵심이다: 지정검역물은 품목명이 아니라 \"멸균·살균 처리 여부\"로 갈린다(시행규칙 제31조①9호) — 멸균처리된 소시지는 대상이 아니고 안 된 것은 대상이다. 여행자가 그 표시를 읽을 줄 알아야 한다. ④계산예시: 같은 소시지 한 봉지라도 ASF 발생국산 돼지고기가 들어갔으면 500만원, 아니면 100만원으로 갈리는 지점을 끝까지 계산해 보여준다. ⑤합법 경로: 법 제36조①단서 입국 즉시 검역신고. ⚠️ 코드가 F1인데 F1은 13편으로 중분류 중 둘째로 많다(validate_db가 분가 검토 WARN을 띄우는 구간) — 이부장이 감안해 선별할 것.","facts":"[공식확인·1차출처, 전부 law.go.kr DRF API 원문] ①가축전염병 예방법(시행 2026-01-23) 제36조①단서 \"여행자 휴대품으로 지정검역물을 수입하는 자는 입국 즉시 출입공항·항만 등에 있는 동물검역기관의 장에게 신고하고 검역관의 검역을 받아야 한다\" · 제60조②6호 위반 시 1천만원 이하 과태료. ②같은 법 시행령(대통령령 제36220호, 시행 2026-04-21) 별표 과태료 부과기준 \"무\" 항목 — 계층 그대로 옮기면: 1) CITES 국제거래 금지 동물 300/400/500 · 2) 그 외 동물 70/100/200 · 3) 검역증명서를 첨부하지 않은 동물의 생산물 → 가) ASF 발생국에서 생산·제조된 돼지고기 또는 그 돼지고기가 포함된 제품 500/750/1,000, 나) 가) 외의 경우 100/300/500 · 4) 검역증명서를 첨부한 동물의 생산물 5/10/50 (단위 만원, 1차/2차/3차). 🔴 3)가) 는 3) 아래의 하위 갈래다 — 3)과 나란한 별개 항목이 아니다. 표로 옮길 때 이 계층을 무너뜨리지 말 것. ③같은 법 시행규칙(시행 2026-07-24) 제31조① 지정검역물 — 9호 \"멸균처리되지 아니한 햄·소시지·베이컨 등 수육가공품, 난백·난분 등 알가공품 및 살균처리되지 아니한 유가공품\", 10호 \"가공처리되지 아니하거나 멸균처리되지 아니한 동물의 사체·살·뼈·가죽 등\". 즉 소시지·햄·베이컨은 명시돼 있고, 치즈(유가공품)·육포(수육가공품)는 살균·멸균 처리 여부에 따라 갈린다 — 제목·본문에서 단정하지 말고 이 조건을 그대로 쓸 것. [미확인=초안 전 필수] 과일·견과·씨앗은 식물방역법 소관이라 이번에 확인하지 않았다 · ASF 발생국 목록은 농림축산식품부장관 공개분(법 제3조의2③)이라 발행 시점에 검역본부에서 재확인. KW=미측정","src":"lifeinfo-travel-prep","dup":"🟡 0.50","state":"approved","added":"2026-08-27T21:30:15","state_at":"2026-08-30T14:45:17","verify":{"mark":"🟡","notes":["🟡 관련글 — ","🟡 출처 URL 이 없음(공식 .go.kr 원문 링크를 달 것)","🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall","ℹ️ 재고 3/5 (큐 2 + 승인·미적재 1) — 여유 2"],"at":"2026-08-30T14:40:43"},"reported_at":"2026-08-30T14:41:11"},{"code":"A5-09","title":"퇴직금 미지급 신고 방법 처벌 총정리 (2026년 9월 18일 시행 · 5년 이하 징역 5천만원 벌금 상향)","lane":"info","rank":"rec","why":"개정 시행 anchor — 근로자퇴직급여 보장법 제43조 개정(법률 제21475호, 2026-03-17 공포)이 2026-09-18 시행. 퇴직금 미지급 법정형이 3년/3천만원에서 5년/5천만원으로 상향되고, 근로기준법 제43조의2로 명단공개된 체불사업주가 공개기간 중 미지급하면 반의사불벌 예외가 되어 합의해도 공소가 가능해진다. 시행 3주 전이고 40~60대 퇴직·이직 당사자가 직접 검색하는 주제다.","summary":"①형량 대조표(개정 전 3년·3천만원 vs 개정 후 5년·5천만원, 제44조는 3년·3천만원 그대로 남는 대비까지). ②판단형 — '합의하면 처벌 안 되나': 반의사불벌 원칙 vs 명단공개 사업주 예외를 사례로 가른다. ③퇴직금 못 받았을 때 실제 절차 계단(고용노동부 진정 → 체불 확인서 → 대지급금 → 형사)을 단계별로. ④지연이자 계산예시 — 퇴직 후 14일 경과분 연 20%를 금액으로 끝까지 계산. ⑤탈락 사유: 계속근로 1년 미만·주 15시간 미만은 퇴직금 자체가 발생하지 않는다. ⑥내부링크 A5-06(대지급금)·B4-05(퇴직금 계산).","facts":"근로자퇴직급여 보장법 제43조(시행 2026-09-18, 법률 제21475호 2026-03-17 공포): '5년 이하의 징역 또는 5천만원 이하의 벌금'. 단서 = 제1호·제2호는 반의사불벌이나 근로기준법 제43조의2 명단공개 체불사업주가 공개기간 중 해당하면 제외. 제44조는 '3년 이하 징역 또는 3천만원 이하 벌금' 유지(퇴직연금사업자 대상). 개정 전 형량 3년·3천만원 = 법제처 제개정이유 원문. 출처: 국가법령정보센터 https://www.law.go.kr/DRF/lawService.do?OC=test&target=eflaw&MST=284455&type=HTML&efYd=20260918 · KW=미측정","src":"lifeinfo-daily-topics","dup":"🟢 0.25","state":"approved","added":"2026-08-28T09:12:00","state_at":"2026-08-30T14:45:17","verify":{"mark":"🟡","notes":["🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall","ℹ️ 재고 3/5 (큐 2 + 승인·미적재 1) — 여유 2"],"at":"2026-08-30T14:40:43"},"reported_at":"2026-08-30T14:41:11"},{"code":"A2-16","title":"국가유공자 보훈보상대상자 활동지원급여 상이등급 무관 확대 총정리 (2026년 9월 1일 시행)","lane":"info","rank":"alt","why":"개정 시행 anchor — 장애인복지법 시행령 제13조 개정(대통령령 제36559호, 2026-08-04 공포)이 2026-09-01 시행. 종전에는 상이등급 3~7급 판정자만 활동지원급여를 받을 수 있었는데, 앞으로는 상이등급 판정을 받고 간호수당을 받지 않는 국가유공자·보훈보상대상자는 등급과 무관하게 받는다. 시행이 4일 뒤다. ⚠️ 약점 = 대상 규모가 좁다. 그래서 추천이 아니라 후보로 낸다.","summary":"①개정 전/후 대상 대조표 — '상이등급 3~7급' → '상이등급 판정 + 간호수당 미수급'으로 기준 자체가 바뀐 것을 3열로. ②판단형 '나는 되나' — 상이등급 1·2급이 새로 들어오고, 간호수당 수급자는 여전히 빠지는 구조를 사례로 가른다(등급이 높을수록 유리해진 것이 아니라 간호수당 여부로 갈린다는 반전이 핵심). ③신청처·구비서류·소급 여부. ④탈락 사유 = 간호수당과 활동지원급여의 택일 구조. ⑤내부링크 A2-11(국가유공자 등록)·A3-06(장애인연금).","facts":"장애인복지법 시행령 제13조 제1항·제2항 단서 개정(대통령령 제36559호, 2026-08-04 공포 / 시행 2026-09-01): '국가유공자법 제6조의4에 따른 상이등급 3급부터 7급까지의 판정을 받은 사람' → '국가유공자법 제15조제1항(또는 보훈보상자법 제17조제1항)에 따른 간호수당을 지급받지 않는 사람'. 출처: 국가법령정보센터 https://www.law.go.kr/DRF/lawService.do?OC=test&target=eflaw&MST=288467&type=HTML&efYd=20260901 · KW=미측정","src":"lifeinfo-daily-topics","dup":"🟢 0.20","state":"dropped","added":"2026-08-28T09:12:16","state_at":"2026-08-30T14:40:29","decision":"대상이 지나치게 좁다 — 국가유공자 중 상이등급 판정 + 간호수당 미수급자 이중 조건이라 40~60대 생활정보 독자층에서 해당자가 극소수다. 개정 anchor(2026-09-01 시행)는 분명하나 선별 기준은 새 주제인가가 아니라 특별이슈급인가이고, 검색 수요가 없는 글은 편수만 늘린다. 애드센스 반려 사유가 고유 콘텐츠 부족인 지금 편수는 레버가 아니다(162→196편 늘리는 동안 색인은 117→37로 줄었다). 보훈 정책이 더 넓은 대상으로 확대되면 그때 다시 본다."},{"code":"F1-15","title":"해외 여행 중 여권 분실 신고 절차 재외공관 임시여행증명서 총정리 (2026 · 영사콜센터·긴급여권)","lane":"etc","rank":"rec","why":"추석 연휴(9/25)가 4주 앞 — 해외여행 출국이 몰리는 시기이고, 여권 분실·도난 사고도 여행 성수기에 집중된다. 우리 F1 시리즈(F1-01~F1-14)는 전부 '출국 전 준비'(발급·재발급·전자여행허가)만 다뤘고, '여행 중 분실했을 때 현지에서 무엇을 해야 하는지'는 한 편도 없다 — 실제 사고가 났을 때 검색하는 사람이 지금 당장 답을 못 찾는 사각지대.","summary":"①여권 분실 시 첫 조치(현지 경찰 분실신고서 발급 — 보험 청구에도 필요) ②재외공관(대사관·총영사관) 방문 절차, 영사콜센터(24시간, +82-2-3210-0404) 연결법 ③긴급여권 vs 여행증명서 판단형 비교표(발급 대상·유효기간·재입국 가능 여부) ④수수료·필요서류·처리시간(국가별 상이 — 확인 못한 것은 '재외공관 문의'로 안내) ⑤탈락/함정: 사진 규격 미달로 반려, 항공권 미확정 시 여행증명서 발급 지연, 미성년자 동반 시 추가서류. 계산예시=제3국 경유 귀국일정일 때 여행증명서 유효기간 계산","facts":"[공식 1차출처] 외교부 여권안내 홈페이지 긴급여권 안내 https://www.passport.go.kr/home/kor/contents.do?menuPos=15 · 재발급(분실) 안내 https://www.passport.go.kr/home/kor/contents.do?menuPos=9 · 수수료 안내 https://www.passport.go.kr/home/kor/contents.do?menuPos=41 (2026-08-30 WebSearch 확인: 재외공관 긴급여권 수수료는 현지통화·미화로 납부, 예시 일본 6,500엔 — 국가별 정확 금액은 초안 단계에서 해당 공관 페이지로 재확인 필수). 영사콜센터 24시간 +82-2-3210-0404(무료 전화앱 등 다수 채널, 외교부 공식). KW=미측정(광고벽·사장님 결정으로 참고지표, 승인 안 막음)","src":"lifeinfo-travel-prep","dup":"🟢 0.33","state":"approved","added":"2026-08-30T21:17:27","state_at":"2026-08-31T05:16:35","verify":{"mark":"🟡","notes":["🟡 KW 미측정(참고) — 키워드마스터가 광고벽으로 막혀 있어 지금은 못 잰다. 사장님 결정(2026-08-24)에 따라 **승인을 막지 않는다**. 측정하러 가지 말 것 — watch kwgate-adwall","🟡 재고 5/5 (큐 2 + 승인·미적재 3) — 큐 게이트는 큐 2 만 보므로 지금 넣는 것은 통과한다. 다만 밀린 3편이 초안이 되면 상한을 넘는다 — 배출을 먼저 볼 것"],"at":"2026-08-31T01:26:58"},"reported_at":"2026-08-31T01:27:07"},{"code":"E2-10","title":"카드포인트 통합조회 계좌입금 방법 총정리 (2026 잠자는 포인트 찾기)","lane":"info","rank":"rec","why":"여신금융협회 카드포인트 통합조회 서비스는 상시 운영되지만 연말정산·추석 전 가계지출 점검 시기에 검색이 몰린다. 소멸 전 현금화 절차를 모르는 40~60대가 많고, 아직 DB에 없는 신규 소재(E2-05 네이버페이 포인트와는 별개 제도).","summary":"①서비스 개요(카드업계 공동 운영, gongsi.crefia.or.kr) ②이용 절차 4단계(여신금융협회 접속→본인인증→포인트 조회→계좌입금   const nowN=pl.code?(STEPS.find(s=>checked.indexOf(s.n)<0)||{}).n:0;
  let pubHtml;
  if(pl.code){
    const pct=Math.round(done/STEPS.length*100);
    const lis=STEPS.map(st=>{
      const on=checked.indexOf(st.n)>=0, now=(!on&&st.n===nowN);
      const ic=on?CHECK:(now?NOWI:WAIT), cls=on?'on':(now?'now':'wait');
      return '<li class="'+cls+'">'+ic+'<span class="num">'+st.n+'</span>'
        +'<span class="who '+st.who+'">'+(st.who==='ai'?'🤖':'🧑')+'</span>'
        +'<span class="lbl">'+esc(st.t)+(st.star?'<span class="star">★</span>':'')+'</span></li>';
    }).join('');
    pubHtml='<div class="pcode">'+esc(pl.code)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div>'
      +'<div class="cnt">'+done+' / '+STEPS.length+' 단계'+(pl.note?' · '+esc(pl.note):'')+'</div><ul>'+lis+'</ul>'
      +'<div class="banner'+(done===STEPS.length?' show':'')+'">✅ 발행·확산 완료</div>';
  }else{
    pubHtml='<div class="pcode none">진행 중인 발행 없음</div>';
  }
  const osmuLi=oRecent.map(r=>'<div class="row done">'+CHECK+'<span>'+esc(r.code)+' '+esc((r.title||'').slice(0,15))+'</span><span class="mut" style="margin-left:auto;font-size:10.5px">'+(r.osmu.naver?'네이버 ':'')+(r.osmu.threads?'쓰레드 ':'')+(r.osmu.instagram?'인스타':'')+'</span></div>').join('');
  // 🤝 협업 — 세션별(collab.json: 정체성=레지스트리·활동=git log·상태=git status)
  const stLab={active:'활동중',uncommitted:'미커밋',idle:'대기'};
  const collabHtml=(collab&&collab.agents||[]).map(a=>{
    const acts=(a.recent||[]).map(r=>'<div class="act">'+esc((r.s||'').slice(0,40))+' <span class="d">'+esc(r.d||'')+'</span></div>').join('');
    return '<div class="agent"><div class="ah">'+esc(a.emoji||'')+'<span>'+esc(a.name||'')+'</span><span class="st '+(a.state||'idle')+'">'+(stLab[a.state]||a.state||'')+'</span></div>'
      +'<div class="role">'+esc(a.role||'')+'</div><div class="own">담당 '+esc(a.owns||'')+'</div>'+acts+'</div>';
  }).join('');
  // 💡 시스템 조언 — 라이브 데이터 조건에서만 도출(하드코딩 일반론 금지)
  const adv=[];
  if(idx&&typeof idx.indexed==='number'){
    const iDt=idx.checked_at?' ('+String(idx.checked_at).slice(5)+' 실측)':'';
    if(idx.indexed===0){const cr=Object.values(idx.posts||{}).filter(p=>p&&p.lastCrawl).length;
      adv.push('색인 0/'+idx.total+iDt+' — 크롤 '+cr+'편·미크롤 '+(idx.total-cr)+'편. GSC 일일한도+OSMU 백링크로 점진(재검토는 색인 잡힌 뒤).');}
    else adv.push('색인 '+idx.indexed+'/'+idx.total+'편'+iDt+'.');
  }
  if(oNv>oTh) adv.push('OSMU 쓰레드 '+oTh+'/'+oNv+' — '+(oNv-oTh)+'편 미게시(rate-limit 보류분 재시도 필요).');
  if(oTh>oIn) adv.push('OSMU 인스타 '+oIn+'/'+oTh+' — 쓰레드 확산 대비 '+(oTh-oIn)+'편 미확산(카드뉴스 backlog).');
  if(collab&&collab.uncommitted>=10) adv.push('미커밋 '+collab.uncommitted+'파일 — 발행 완료 후 세션별 커밋 분리 권장.');
  const adviceHtml=adv.length?'<div class="advice">'+adv.map(t=>'<div class="ai"><span class="ic">💡</span><span>'+esc(t)+'</span></div>').join('')+'</div>':'<div class="pcode none">현재 조치 필요 항목 없음</div>';
  // 📋 미결 관리 — 글별(pending.json: DB osmu + index_status에서 계산)
  const pc=(pend&&pend.counts)||{};
  const cb=(ok,l)=>'<span class="ch '+(ok?'on':'off')+'">'+l+(ok?'✓':'✗')+'</span>';
  const pendRows=(pend&&pend.actionable||[]).map(a=>{
    const c=a.ch||{};
    return '<div class="prow"><span class="pcd">'+esc(a.code)+'</span><span class="ptt">'+esc(a.title)+'</span>'
    +cb(c.g!==false,'G')+cb(c.n,'N')+cb(c.t,'T')+cb((osmuByCode[a.code]||{}).instagram,'I')+'</div>';
  }).join('');
  // 표시는 상위 14편으로 잘려 있음(pending.py) → 남은 수는 counts로 계산해 "…외 N편"
  const pendListed=(pend&&pend.actionable||[]).length;
  const pendTotal=Math.max(pc.osmu_pending||0,pc.index_pending||0);
  const pendMore=pendTotal>pendListed?'<div class="cnt">…외 '+(pendTotal-pendListed)+'편</div>':'';
  const pendHtml='<div class="cnt">OSMU 대기 '+(pc.osmu_pending||0)+'편 · 색인 대기 '+(pc.index_pending||0)+'편 / 전체 '+(pc.total||0)+'편</div>'+(pendRows||'<div class="pcode none">미결 없음</div>')+pendMore;

// 🧾 글감 승인 라인 (2026-08-20) — 루틴 제안 → 이부장 선별 → 사장님 승인 → 큐
//    이 화면이 없어서 사장님이 "루프가 제대로 동작하지 않는 것 같다"고 하셨다.
//    데이터(topicprop.json)는 있었는데 콘솔이 안 읽었다. 큐 카드 **앞**에 세운다 — 순서가 곧 흐름이다.
var TPL={proposed:['승인대기','#e0a11e'],picked:['사장님 답 대기','#4D9DE0'],
         approved:['승인됨 — 초안 작성','#3ddc97'],dropped:['제외','#7b8794']};
var tpItems=[];
try{
  var qc={}; (queue&&queue.items||[]).forEach(function(x){qc[x.code]=1;});
  var pubc={}; ((db&&db.posts)||[]).forEach(function(p){ if(p.url) pubc[p.code]=1; });
  tpItems=((tprop&&tprop.items)||[]).filter(function(i){
    return i.state!=='dropped' && !qc[i.code] && !pubc[i.code];
  });
}catch(e){}
var tpHtml='';
if(tpItems.length){
  var ord={approved:0,picked:1,proposed:2};
  tpItems.sort(function(x,y){return (ord[x.state]||9)-(ord[y.state]||9);});
  var nAp=tpItems.filter(function(i){return i.state==='approved';}).length;
  var nPk=tpItems.filter(function(i){return i.state==='picked';}).length;
  var nPr=tpItems.filter(function(i){return i.state==='proposed';}).length;
  tpHtml='<div class="cnt">제안 '+tpItems.length+'건 — '
    +'승인됨 '+nAp+' · 사장님 답 대기 '+nPk+' · 이부장 승인대기 '+nPr
    +'  (큐에 들어가거나 발행되면 자동으로 사라집니다)</div>'
    +tpItems.map(function(i){
      var st=TPL[i.state]||[i.state,'#9fb0d0'];
      var v=(i.verify&&i.verify.mark)||'';
      return '<div class="pcard" style="border-left:4px solid '+st[1]+'">'
        +'<div class="pcode">'+esc(i.code||'')+' <span style="color:'+st[1]+';font-weight:700">'+st[0]+'</span>'
        +(v?' <span title="V0 검증">'+v+'</span>':'')
        +' <span style="opacity:.55;font-size:11px">'+esc((i.src||'').replace('lifeinfo-',''))+'</span></div>'
        +'<div class="ptitle">'+esc(i.title||'')+'</div>'
        +(i.why?'<div class="pmeta"><b>왜 지금</b> '+esc(i.why)+'</div>':'')
        +(i.summary?'<div class="pmeta"><b>초안</b> '+esc(i.summary)+'</div>':'')
        +'<div class="pmeta">중복 '+esc(i.dup||'?')
        +(i.decision?' · '+esc(i.decision):'')+'</div>'
        +'</div>';
    }).join('');
}else{
  tpHtml='<div class="pcode none">글감 제안 없음 — 루틴(09:01·21:07·23:55)이 내면 여기 뜹니다</div>';
}
  // 📋 발행 대기 (발행 전 큐 — queue.json) : 코드·제목·썸네일을 한 카드로 묶어 '엉뚱한 글/썸네일' 눈으로 차단
  const qItems=(queue&&queue.items)||[];
  const laneLab={info:'정보성',pop:'대중관심'};
  const qCards=qItems.map(it=>{
    const th=it.thumb_data
      ?'<img class="qth" src="'+it.thumb_data+'" alt="">'
      :'<div class="qth none">썸네일<br>없음</div>';
    const facts=it.facts?'<div class="qfacts">'+esc(it.facts)+'</div>':'';
    const draft=it.draft?'<span class="qdraft">📄 '+esc(it.draft)+'</span>':'';
    const pv=it.body?'<button class="qpv" onclick="qpv(\''+esc(it.code||'')+'\')">👁 본문 미리보기</button>'
                    :'<span class="qpv none">초안 없음(작성 전)</span>';
    return '<div class="qcard">'+th
      +'<div class="qbody"><div class="qtop"><span class="qcode">'+esc(it.code||'')+'</span>'
      +'<span class="qlane '+(it.lane||'info')+'">'+esc(laneLab[it.lane]||it.lane||'')+'</span>'
      // 🙋 사장님 발행 승인 도장(2026-08-20) — 글감 승인과 다른 결정이다.
      //    도장이 없으면 publish-flow 가 막는다. 화면에서 바로 보이게 한다.
      +(it.go
        ?'<span class="qgo ok" title="'+esc((it.go.by||'')+' '+(it.go.at||''))+'">🙋 발행 승인됨</span>'
        :'<span class="qgo wait">🙋 사장님 발행 승인 대기</span>')
      +'</div>'
      +'<div class="qtitle">'+esc(it.title||'')+'</div>'+facts
      +'<div class="qmeta">'+pv+draft+'</div></div></div>';
  }).join('');
  // 🚦 오늘 발행량 배지 (2026-07-29) — 승인 누르기 '전에' 보이게 한다.
  //    2026-07-27 에 8편이 한꺼번에 나간 건, 사람이 재고만 보고 몰아서 승인했는데
  //    '오늘 몇 편째'를 아무도 안 세고 있었기 때문이다. 게이트(pace.check)는 발행을 막고,
  //    이 배지는 그 전에 눈으로 막는다.
  let paceHtml='';
  if(pace){
    const st=pace.state||'ok', n=pace.count||0, hard=pace.hard||2;
    const lab=st==='err'?'⚠️ 오늘 발행량을 못 셌습니다 — '+esc(pace.error||'')
      :st==='block'?'⛔ 오늘 '+n+'편 발행됨 — 오늘은 더 발행하지 마세요(3편 이상 금지)'
      :st==='warn'?'⚠️ 오늘 '+n+'편 발행됨 — 기본 페이스는 하루 1편입니다'
      :'✅ 오늘 '+n+'편 발행 — 하루 1편 기준 안';
    const bg=st==='block'?'#3a1218':st==='warn'?'#3a2f12':st==='err'?'#2a2030':'#0c3a2c';
    const bd=st==='block'?'#7a2230':st==='warn'?'#5a4a1a':st==='err'?'#4a3a5a':'#1f6b52';
    const fg=st==='block'?'#ff9aa6':st==='warn'?'#ffd166':st==='err'?'#c9b6e8':'#8ef0cf';
    const titles=(pace.posts||[]).map(p=>'<div style="opacity:.8;margin-top:2px">· '+esc(p.title||'')+'</div>').join('');
    const lanes=pace.lanes||{};
    const laneTxt=Object.keys(lanes).map(k=>{
      const L=lanes[k]; if(!L) return '';
      return '<span style="display:inline-block;margin-right:9px">'+esc(L.label||k)+' <b>'+(L.n||0)+'</b></span>';
    }).join('');
    const over=pace.backlog_over
      ?'<div style="margin-top:5px;color:#ffd166">📦 발행대기 재고 '+pace.backlog+'편 (상한 '+pace.backlog_max+' 초과) — 재고가 쌓이면 몰아치기 발행을 부릅니다. PREP 초안 생성이 잠긴 상태입니다.</div>'
      :'<div style="margin-top:5px;opacity:.75">📦 발행대기 재고 '+(pace.backlog||0)+'편 / 상한 '+(pace.backlog_max||5)+'</div>';
    const laneRow=laneTxt?'<div style="margin-top:4px;opacity:.8;font-size:11.5px">🛤 레인별: '+laneTxt+'<span style="opacity:.6">(자동 2 + 사용자 창구 1 · 루틴은 1회 1건)</span></div>':'';
    paceHtml='<div style="background:'+bg+';border:1px solid '+bd+';color:'+fg
      +';border-radius:8px;padding:8px 11px;margin:2px 0 9px;font-size:12px;line-height:1.5">'
      +'<b>'+lab+'</b>'+titles+over+laneRow+'</div>';
  }
  const qHtml=paceHtml+(qItems.length
    ?'<div class="cnt">발행 대기 '+qItems.length+'건 — 발행하면 카드가 자동으로 사라집니다(사람 승인 게이트)</div>'+qCards
    :'<div class="pcode none">발행 대기 없음 — PREP 루틴이 준비하면 여기 카드로 뜹니다</div>');
  // 🙋 내가 할 일 섹션은 2026-08-12 사용자 지시로 이 화면에서 제거하고
  // index.html(운영콘솔 첫 페이지)의 별도 탭(data-t="mytasks")으로 이전했다.
  document.getElementById('board').innerHTML=
   '<div class="hd"><div class="t"><h1>진행현황</h1><span class="date">'+esc(date)+'</span></div>'
   +'<span class="badge '+bcls+'">'+CHECK+esc(blab)+'</span></div>'
   +'<div class="sec">오늘 한 일</div>'+today
   +'<div class="metrics">'
   +'<div class="m"><div class="l">검사 통과</div><div class="v">'+pass+' <small>/ '+total+'</small></div></div>'
   +'<div class="m"><div class="l">블로그 글</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">평균 본문</div><div class="v">'+avg+' <small>자</small></div></div>'
   +'</div>'
   +'<div class="div"></div>'
   +'<div class="sec">🧾 글감 승인 라인 (루틴 제안 → 이부장 선별 → 사장님 승인)<span class="auto">🤖 topicprop</span></div>'+tpHtml
   +'<div class="sec">📋 발행 대기 (오늘 발행할 글)<span class="auto">🤖 PREP 큐</span></div>'+qHtml
   +'<div class="div"></div>'
   +'<div class="sec">발행 진행 (글 1편 · '+STEPS.length+'단계, 확산 포함)<span class="auto">🤖 자동</span></div>'+pubHtml
   +'<div class="div"></div>'
   +'<div class="sec">📡 4채널 발행 현황 (구글·네이버·쓰레드·인스타)<span class="auto">🤖 DB 자동집계</span></div>'
   +'<div class="metrics">'
   +'<div class="m"><div class="l">구글(원본)</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">네이버</div><div class="v">'+oNv+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">쓰레드</div><div class="v">'+oTh+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">인스타</div><div class="v">'+oIn+' <small>편</small></div></div>'
   +'</div>'
   +'<div class="cnt">확산 커버리지 · 네이버 '+(count?Math.round(oNv/count*100):0)+'% · 쓰레드 '+(count?Math.round(oTh/count*100):0)+'% · 인스타 '+(count?Math.round(oIn/count*100):0)+'% · 교차링크 완료 '+omAll.length+'편</div>'
   +osmuLi
   +'<div class="div"></div>'
   +'<div class="sec">🤝 협업 — 세션별 역할·진행<span class="auto">git 자동분류</span></div>'+collabHtml
   +'<div class="sec">💡 시스템 조언<span class="auto">라이브 도출</span></div>'+adviceHtml
   +'<div class="div"></div>'
   +'<div class="sec">📋 미결 관리 — 4채널 매칭<span class="auto">G구글·N네이버·T쓰레드·I인스타</span></div>'+pendHtml
   +'<div class="sec">다음</div><div class="next">'+next+'</div>'
   +'<div class="upd" id="upd"></div>';
  tick();
}
// 시계·데이터 기준만 갱신(보드 전체 재렌더 없음 — 정적 베이크 데이터라 시계만 변함)
function tick(){
  const el=document.getElementById('upd'); if(!el)return;
  const b=(window.__DATA__||{}).baked_at;
  el.textContent=(b?'데이터 기준 '+b+' · ':'')+new Date().toLocaleTimeString('ko-KR');
}
// 👁 발행 대기 카드 본문 미리보기 — 초안 HTML을 격리 iframe(srcdoc)로 렌더(스타일 누수 차단, Blogger 미접촉)
function qpv(code){
  const items=((window.__DATA__||{}).queue||{}).items||[];
  const it=items.find(x=>x.code===code); if(!it||!it.body)return;
  document.getElementById('qpv-ttl').textContent=(it.code||'')+' · '+(it.title||'');
  document.getElementById('qpv-fr').srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank"><body style="margin:0;padding:16px;background:#fff">'+it.body+'</body>';
  document.getElementById('qpv-ov').classList.add('show');
}
function qpvClose(){document.getElementById('qpv-ov').classList.remove('show');document.getElementById('qpv-fr').srcdoc='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')qpvClose();});
// 코드 자동 반영: 자기 자신(progress.html)을 주기적으로 fetch→해시 비교, 바뀌면 1회 reload
const _hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
let _selfHash=null;
async function checkVersion(){
  try{
    const r=await fetch('progress.html?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;                                // 일시적 404/500에 해시 오염 → 불필요 reload 방지
    const t=await r.text();
    const h=_hash(t);
    if(_selfHash===null){_selfHash=h;return;}      // 첫 호출=기준선 저장
    if(h!==_selfHash) location.reload();            // 코드 변경 감지 → 자동 새로고침
  }catch(e){}
}
load(); checkVersion(); setInterval(tick,5000); setInterval(checkVersion,5000);
</script>
