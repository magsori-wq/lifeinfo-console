<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="icon" href="data:,">
<title>진행현황 — 생활정보 모음</title>
<style>
:root{--bg:#0e1620;--card:#18222e;--card2:#13202d;--line:#26323f;--txt:#e6edf3;--mut:#8a97a6;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:470px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:16px;font-weight:600}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(63,185,80,.16);color:var(--ok)}
.b-warn{background:rgba(210,153,34,.16);color:var(--warn)}
.b-bad{background:rgba(248,81,73,.16);color:var(--bad)}
.sec{font-size:11px;color:var(--mut);letter-spacing:.05em;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
.metrics{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 2px}
/* 채널이 4개가 되어 490px 팝업에서 눌리므로, 좁아지면 2x2로 감싸게 한다 */
.m{flex:1 1 96px;background:var(--card2);border-radius:9px;padding:8px 10px}
.m .l{font-size:11px;color:var(--mut)}
.m .v{font-size:18px;font-weight:600;margin-top:2px}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #243049;font-size:12.5px}
li:last-child{border-bottom:none}
li.on{opacity:.62}
li.on .lbl{text-decoration:line-through}
li svg{width:15px;height:15px;flex:none}
li.on svg{color:var(--ok)}
li.now svg{color:#7fc1ff}
li.wait svg{color:#4a586e}
.num{font-size:11px;color:#6b7a99;width:16px;text-align:right;flex:none}
.who{font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px;flex:none}
.who.ai{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.who.me{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.lbl{font-size:12.5px}
.star{color:#ff8e8e;font-weight:800;margin-left:2px}
.banner{display:none;margin-top:9px;background:#0c3a2c;border:1px solid #1f6b52;color:#06d6a0;border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12.5px}
.banner.show{display:block}
.upd{font-size:11px;color:var(--mut);text-align:right;margin-top:12px}
.agent{background:var(--card2);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.agent .ah{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.agent .st{font-size:10px;font-weight:700;padding:1px 7px;border-radius:7px;margin-left:auto}
.st.active{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.st.uncommitted{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.st.idle{background:#222c3a;color:#6b7a99;border:1px solid #2e3a4a}
.agent .role{font-size:11px;color:var(--mut);margin:3px 0 1px}
.agent .own{font-size:10.5px;color:#5a6b80}
.agent .act{font-size:11px;color:#aeb9c7;margin-top:4px;padding-left:7px;border-left:2px solid #2a3a4d;line-height:1.5}
.agent .act .d{color:var(--mut);font-size:10px}
.advice{background:#13202d;border:1px solid #2a3a4d;border-radius:9px}
.advice .ai{display:flex;gap:8px;padding:7px 11px;font-size:12px;line-height:1.5;border-bottom:1px dashed #243049}
.advice .ai:last-child{border-bottom:none}
.advice .ic{flex:none}
.prow{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px dashed #243049;font-size:11.5px}
.prow:last-child{border-bottom:none}
.pcd{color:#7fc1ff;font-weight:700;flex:none;width:46px}
.ptt{flex:1;color:#cdd6e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{background:#3a2f12;color:#ffd166;border-radius:5px;padding:0 5px;font-size:9.5px;flex:none}
.pact{color:#06d6a0;font-size:10px;flex:none;font-weight:700}
.qcard{display:flex;gap:9px;padding:8px;margin:6px 0;background:#141c2c;border:1px solid #243049;border-radius:9px}
.qth{width:78px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:#0d1420}
.qth.none{display:flex;align-items:center;justify-content:center;color:#54627a;font-size:9px;text-align:center;line-height:1.2;border:1px dashed #2a3752}
.qbody{flex:1;min-width:0}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qcode{color:#7fc1ff;font-weight:700;font-size:11.5px}
.qlane{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700}
.qlane.info{background:#12283a;color:#7fc1ff}
.qlane.pop{background:#2f2136;color:#e0a3ff}
.qtitle{color:#e6edf5;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qfacts{color:#8a95a6;font-size:10px;margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qmeta{margin-top:4px}
.qdraft{color:#6b7688;font-size:9.5px;margin-left:8px}
.qpv{background:#17324a;color:#7fc1ff;border:1px solid #2a4d6e;border-radius:6px;font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer}
.qpv:hover{background:#1d4463}
.qpv.none{background:none;border:none;color:#54627a;font-weight:400;cursor:default;padding:3px 0}
#qpv-ov{display:none;position:fixed;inset:0;background:rgba(6,10,18,.82);z-index:999;align-items:center;justify-content:center;padding:18px}
#qpv-ov.show{display:flex}
.qpv-box{width:100%;max-width:760px;height:88vh;display:flex;flex-direction:column;background:#0f1626;border:1px solid #2a3752;border-radius:12px;overflow:hidden}
.qpv-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #243049;font-size:12.5px;font-weight:700;color:#7fc1ff}
.qpv-hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpv-x{background:#243049;color:#cdd6e0;border:none;border-radius:6px;font-size:11px;padding:5px 11px;cursor:pointer;flex:none}
.qpv-x:hover{background:#324158}
.qpv-fr,#qpv-fr{flex:1;width:100%;border:0;background:#fff}
.qpv-ft{padding:8px 14px;border-top:1px solid #243049;font-size:10px;color:#8a95a6;text-align:center}
.ch{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 4px;flex:none;margin-left:3px}
.ch.on{background:#0c3a2c;color:#06d6a0}
.ch.off{background:#3a1216;color:#f0707a}
</style>
</head>

</div>

px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#f4f1fd;border:1px solid #ded4f7;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#6544cc;margin-bottom:8px}\n.lsg .rel a{display:block;color:#5a3cc0;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#9a92aa;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>중국은 오랫동안 <b>여행 가려면 먼저 비자부터 받아야 하는 나라<\/b>였습니다. 그런데 지금은 <b>한국 일반여권만 있으면 비자 없이 최장 30일<\/b> 머물 수 있습니다. 문제는 이 조치가 <b>영구적인 것이 아니라 2026년 12월 31일까지로 기한이 정해진 한시 조치<\/b>라는 점입니다. 그래서 <b>\"언제 입국하느냐\"<\/b>가 비자 필요 여부를 가릅니다. 여기에 <b>30일을 세는 방법이 우리 상식과 다르고<\/b>, 호텔이 아닌 곳에 묵으면 <b>입국 후 24시간 안에 신고해야 하는 의무<\/b>까지 있어 모르고 갔다가 벌금을 무는 일이 생깁니다. 이 글에서는 <b>무비자로 되는 목적과 안 되는 목적, 30일 계산법, 연말 시한의 함정, 입국심사에서 막히는 경우, 주숙등기와 초과체류 벌금<\/b>까지 공식 발표 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 지금 상태 한 장 요약 (2026년 12월 31일까지)<\/a><a href=\"#sec2\">2. 무비자로 되는 목적 · 안 되는 목적<\/a><a href=\"#sec3\">3. 30일은 언제부터 세나 — 기산 계산<\/a><a href=\"#sec4\">4. '2026년 12월 31일'의 함정 — 입국 기준입니다<\/a><a href=\"#sec5\">5. 무비자 vs 240시간 환승 무비자 vs 관광비자 (판단표)<\/a><a href=\"#sec6\">6. 입국심사에서 막히는 5가지<\/a><a href=\"#sec7\">7. 입국하면 24시간 안에 — 주숙등기<\/a><a href=\"#sec8\">8. 30일을 넘기면 — 연장과 초과체류 벌금<\/a><a href=\"#sec9\">9. 홍콩·마카오·티베트는 별개입니다<\/a><a href=\"#sec10\">10. 자주 묻는 질문<\/a><a href=\"#sec11\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec3\">👉 30일 체류기간 계산법 바로 보기<\/a>\n\n<h2 id=\"sec1\">1. 지금 상태 한 장 요약 (2026년 12월 31일까지)<\/h2>\n<p>주한중국대사관이 <b>2025년 11월 6일<\/b> 공지한 내용이 현재 적용되는 기준입니다. 한국을 포함한 여러 나라에 대해 <b>비자면제 조치를 2026년 12월 31일까지 연장<\/b>한다는 발표였습니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>내용<\/th><\/tr>\n<tr><td><b>대상 여권<\/b><\/td><td><b>일반여권<\/b> 소지자 (관용·외교여권은 별도 규정)<\/td><\/tr>\n<tr><td><b>체류 한도<\/b><\/td><td><b>최장 30일<\/b> (연속 30 자연일)<\/td><\/tr>\n<tr><td><b>적용 기한<\/b><\/td><td><b>2026년 12월 31일까지<\/b> 입국분<\/td><\/tr>\n<tr><td><b>허용 목적<\/b><\/td><td>비즈니스(상용) · 관광 · 친지 방문 · 교류 방문 · <b>경유<\/b><\/td><\/tr>\n<tr><td><b>사전 신청<\/b><\/td><td><b>없음<\/b> — 미국 ESTA·일본 비지트재팬웹 같은 사전 등록 절차가 없습니다<\/td><\/tr>\n<tr><td><b>입국 횟수<\/b><\/td><td>횟수 제한·재입국 간격 제한 <b>없음<\/b><\/td><\/tr>\n<tr><td><b>출발지<\/b><\/td><td>제한 없음 — 제3국에서 출발해도 무방<\/td><\/tr>\n<\/table>\n<p>여기서 <b>한국 여행자에게 특히 중요한 두 가지<\/b>가 있습니다. 첫째, <b>따로 신청할 것이 없습니다.<\/b> 미국 ESTA처럼 온라인으로 미리 승인받는 절차가 없어서, <b>여권만 들고 공항에 가면 됩니다.<\/b> 둘째, 그래서 이 글의 초점은 \"어떻게 신청하나\"가 아니라 <b>\"내가 자격에 해당하나, 그리고 현지에서 지켜야 할 것이 무엇인가\"<\/b>입니다.<\/p>\n<div class=\"tip\"><b>💡 재입국 간격 제한이 없다는 뜻<\/b><p style=\"margin:8px 0 0\">예를 들어 <b>상하이에 25일 머물다 한국에 잠깐 돌아왔다가 다시 들어가도<\/b>, 새 입국에 대해 다시 30일이 주어집니다. 중국 대사관 안내는 <b>입국 횟수와 두 입국 사이 간격에 제한을 두지 않는다<\/b>고 밝히고 있습니다. 다만 <b>짧은 출국·재입국을 반복해 사실상 장기 체류하는 형태<\/b>는 입국심사에서 목적을 의심받을 수 있으니, 실제 사업·방문 사유가 있는 경우로 한정하는 편이 안전합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 무비자로 되는 목적 · 안 되는 목적<\/h2>\n<p>무비자는 <b>목적이 맞을 때만<\/b> 유효합니다. 목적이 어긋나면 여권이 멀쩡해도 입국이 거절될 수 있습니다.<\/p>\n<table>\n<tr><th>목적<\/th><th>무비자<\/th><th>비고<\/th><\/tr>\n<tr><td>관광 · 여행<\/td><td><b>○<\/b><\/td><td>가장 일반적인 경우<\/td><\/tr>\n<tr><td>상담·계약·전시회 참관 등 <b>상용<\/b><\/td><td><b>○<\/b><\/td><td>초청장 지참 권장<\/td><\/tr>\n<tr><td>친지·지인 방문<\/td><td><b>○<\/b><\/td><td>주소·연락처 확인 요구 가능<\/td><\/tr>\n<tr><td>교류 방문(학술·문화 교류 등)<\/td><td><b>○<\/b><\/td><td>보수를 받는 활동은 제외<\/td><\/tr>\n<tr><td>제3국행 <b>경유<\/b><\/td><td><b>○<\/b><\/td><td>30일 한도 안에서 체류도 가능<\/td><\/tr>\n<tr><td><b>취업 · 근로<\/b><\/td><td><b>×<\/b><\/td><td>취업비자 필요<\/td><\/tr>\n<tr><td><b>유학 · 어학연수<\/b><\/td><td><b>×<\/b><\/td><td>학생비자 필요<\/td><\/tr>\n<tr><td><b>취재 · 보도<\/b><\/td><td><b>×<\/b><\/td><td>기자비자 필요<\/td><\/tr>\n<tr><td><b>공연 등 사전 허가가 필요한 활동<\/b><\/td><td><b>×<\/b><\/td><td>해당 비자 필요<\/td><\/tr>\n<\/table>\n<p>정리하면 <b>\"돈을 벌거나, 자격을 취득하거나, 사전 허가가 필요한 활동\"은 무비자 대상이 아닙니다.<\/b> 중국 측 안내는 <b>입국 사유가 비자면제 정책이 정한 사유와 맞지 않으면 입국이 허용되지 않는다<\/b>고 명시하고 있습니다.<\/p>\n<div class=\"warn\"><b>⚠️ \"관광으로 들어가서 잠깐 일하면 되지 않나\"<\/b><p style=\"margin:8px 0 0\">안 됩니다. 무비자로 들어와 <b>신고된 목적 밖의 활동<\/b>을 하는 것은 체류 목적 위반입니다. 특히 <b>현지에서 보수를 받는 일<\/b>, <b>영리 목적의 촬영·방송<\/b>은 적발 시 벌금·구류·강제출국 대상이 될 수 있습니다. 짧은 기간이라도 근로에 해당한다면 <b>출발 전에 해당 비자를 받아야<\/b> 합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 30일은 언제부터 세나 — 기산 계산<\/h2>\n<p>가장 많이 틀리는 부분입니다. 중국의 체류기간은 <b>입국한 날이 아니라 입국 다음 날부터<\/b> 셉니다. 중국 측 공식 문답은 <b>\"체류기간은 입국 다음 날부터 기산하며 연속 30 자연일 체류할 수 있다\"<\/b>고 설명합니다.<\/p>\n<div class=\"tip\"><b>🔢 계산 공식<\/b><p style=\"margin:8px 0 0\"><b>체류 마지막 날 = 입국일 + 30일<\/b><br>입국일 자체는 세지 않고, <b>그 다음 날이 1일차<\/b>가 됩니다. 그래서 결과적으로 <b>달력상 입국일에 30을 더한 날짜<\/b>가 머물 수 있는 마지막 날이 됩니다.<\/p><\/div>\n<table>\n<tr><th>입국일<\/th><th>1일차<\/th><th>30일차(마지막 날)<\/th><th>늦어도 출국해야 하는 날<\/th><\/tr>\n<tr><td>9월 10일<\/td><td>9월 11일<\/td><td><b>10월 10일<\/b><\/td><td>10월 10일<\/td><\/tr>\n<tr><td>10월 1일<\/td><td>10월 2일<\/td><td><b>10월 31일<\/b><\/td><td>10월 31일<\/td><\/tr>\n<tr><td>12월 20일<\/td><td>12월 21일<\/td><td><b>1월 19일<\/b><\/td><td>1월 19일<\/td><\/tr>\n<\/table>\n<p>흔한 실수는 <b>입국일을 1일차로 세는 것<\/b>입니다. 그렇게 계산하면 실제보다 <b>하루 일찍<\/b> 나가게 되니 손해는 없지만, 반대로 <b>\"30박 31일이니 괜찮겠지\"<\/b>라고 넉넉히 잡으면 <b>초과체류<\/b>가 됩니다. 헷갈릴 때는 <b>여권에 찍힌 입국 도장의 날짜에 30을 더한 날<\/b>을 마지막 날로 보면 안전합니다.<\/p>\n<div class=\"warn\"><b>⚠️ 항공권을 먼저 끊고 날짜를 나중에 세지 마세요<\/b><p style=\"margin:8px 0 0\">장기 체류를 계획한다면 <b>귀국 항공권 날짜부터 확인<\/b>하세요. 특히 <b>왕복 한 달짜리 티켓<\/b>은 아슬아슬한 경우가 많습니다. 예를 들어 <b>9월 10일 입국 → 10월 11일 출국<\/b>은 하루 초과입니다. 실제 계산은 <b>도착 시각이 아니라 입국 도장의 날짜<\/b> 기준이라, <b>밤 늦게 도착해 자정을 넘겨 입국심사를 받았다면 도장 날짜가 하루 밀릴 수 있다<\/b>는 점도 기억해 두세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. '2026년 12월 31일'의 함정 — 입국 기준입니다<\/h2>\n<p>이 조치는 <b>2026년 12월 31일까지<\/b>입니다. 그런데 이 날짜는 <b>중국에 머물 수 있는 마지막 날이 아니라 '무비자로 입국할 수 있는 마지막 날'<\/b>입니다. 연말·연시 여행을 계획한다면 이 차이가 결정적입니다.<\/p>\n<table>\n<tr><th>일정<\/th><th>비자<\/th><th>이유<\/th><\/tr>\n<tr><td>12월 20일 입국 → 1월 5일 출국<\/td><td><b>필요 없음<\/b><\/td><td>입국일이 기한 안이라 무비자 적용, 체류는 30일 한도 안<\/td><\/tr>\n<tr><td>12월 31일 입국 → 1월 20일 출국<\/td><td><b>필요 없음<\/b><\/td><td>기한 마지막 날 입국 — 조치 적용<\/td><\/tr>\n<tr><td><b>1월 1일 입국<\/b><\/td><td><b>비자 필요<\/b><\/td><td>연장 여부가 발표되기 전이라면 무비자 대상 아님<\/td><\/tr>\n<\/table>\n<p>즉 <b>연말에 들어가서 해를 넘겨 나오는 일정은 문제가 없지만, 새해에 들어가는 일정은 이야기가 완전히 달라집니다.<\/b> 중국은 이 조치를 <b>2024년 11월 시행 이후 한 차례 연장<\/b>해 왔습니다. 다만 <b>다음 연장이 있을지, 있다면 언제 발표될지는 아무도 단정할 수 없습니다.<\/b><\/p>\n<div class=\"tip\"><b>💡 2027년 1월 이후 일정을 잡는다면<\/b><p style=\"margin:8px 0 0\">지금 시점에서 <b>\"어차피 또 연장되겠지\"라고 전제하고 항공권을 끊는 것은 위험<\/b>합니다. 현실적인 방법은 두 가지입니다. ① <b>취소·변경이 자유로운 항공권<\/b>으로 예약하고 발표를 기다린다. ② <b>비자를 받는 일정으로 처음부터 계획<\/b>한다. 중국 비자는 신청부터 발급까지 시간이 걸리므로, <b>연장 발표를 기다리다 비자 신청 시기를 놓치는 것이 가장 나쁜 시나리오<\/b>입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 무비자 vs 240시간 환승 무비자 vs 관광비자 (판단표)<\/h2>\n<p>중국 입국 방법은 지금 세 가지가 함께 존재합니다. 인터넷에는 <b>240시간(10일) 환승 무비자<\/b> 이야기가 많은데, <b>한국 여권 소지자라면 대부분 그쪽을 쓸 이유가 없습니다.<\/b> 조건을 나란히 놓고 보면 명확합니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>30일 무비자<\/th><th>240시간 환승 무비자<\/th><th>관광비자(L)<\/th><\/tr>\n<tr><td><b>체류 한도<\/b><\/td><td><b>30일<\/b><\/td><td>240시간(10일)<\/td><td>비자에 표시된 기간<\/td><\/tr>\n<tr><td><b>사전 절차<\/b><\/td><td><b>없음<\/b><\/td><td>없음<\/td><td><b>신청·수수료·심사<\/b><\/td><\/tr>\n<tr><td><b>이동 범위<\/b><\/td><td><b>중국 전역<\/b><\/td><td><b>지정 지역 안으로 제한<\/b><\/td><td>중국 전역<\/td><\/tr>\n<tr><td><b>조건<\/b><\/td><td>목적이 맞으면 됨<\/td><td><b>제3국행 연결 항공권 필수<\/b><\/td><td>서류 심사 통과<\/td><\/tr>\n<tr><td><b>한국인에게<\/b><\/td><td><b>기본 선택지<\/b><\/td><td>실익 거의 없음<\/td><td>30일 초과·취업·유학 시<\/td><\/tr>\n<\/table>\n<p>240시간 환승 무비자는 <b>\"중국을 거쳐 제3국으로 가는 사람\"<\/b>을 위한 제도라 <b>제3국행 연결 항공권이 반드시 있어야<\/b> 하고, <b>머물 수 있는 지역도 지정된 범위로 제한<\/b>됩니다. 반면 <b>30일 무비자는 조건이 훨씬 헐겁고 기간도 세 배<\/b>입니다. 한국↔중국 왕복 여행이라면 <b>고민할 필요 없이 30일 무비자<\/b>입니다.<\/p>\n<div class=\"tip\"><b>💡 비자를 받아야 하는 경우는 이렇게 갈립니다<\/b><p style=\"margin:8px 0 0\">① <b>30일을 넘겨 머물 계획<\/b> ② <b>취업·유학·취재 등 무비자 제외 목적<\/b> ③ <b>일반여권이 아닌 여권<\/b> ④ <b>과거 체류 위반 이력 등으로 무비자 입국이 불안한 경우<\/b>. 이 넷 중 하나라도 해당하면 <b>출발 전에 비자를 받는 쪽<\/b>이 맞습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 입국심사에서 막히는 5가지<\/h2>\n<p>무비자는 <b>\"입국이 보장된다\"는 뜻이 아닙니다.<\/b> 최종 판단은 현장 입국심사관이 합니다. 실제로 문제가 되는 경우는 대체로 다음 다섯 가지입니다.<\/p>\n<ol>\n<li><b>입국 목적을 설명하지 못하는 경우<\/b> — 어디서 며칠 묵고 무엇을 하는지 답이 안 나오면 심사가 길어집니다. <b>호텔 예약 확인서와 귀국 항공권<\/b>을 휴대폰이 아닌 <b>인쇄물로도<\/b> 준비해 두면 편합니다.<\/li>\n<li><b>목적이 무비자 대상과 다른 경우<\/b> — 취업·유학·취재 정황이 보이면 거절 사유입니다. 노트북·장비를 대량으로 소지하거나 <b>업무용 계약서류가 과하게 많은 경우<\/b>도 설명이 필요해질 수 있습니다.<\/li>\n<li><b>귀국편이 없는 편도 항공권<\/b> — 출국 계획이 확인되지 않으면 체류 의사를 의심받습니다. <b>제3국행이라도 나가는 표<\/b>가 있어야 설명이 됩니다.<\/li>\n<li><b>여권 유효기간·상태 문제<\/b> — 잔여 유효기간이 짧거나 <b>훼손된 여권<\/b>은 그 자체로 거절될 수 있습니다. 출발 전에 <b>유효기간 6개월 이상<\/b>인지 확인하세요.<\/li>\n<li><b>과거 체류 위반 이력<\/b> — 이전 방문에서 <b>초과체류·목적 위반 기록<\/b>이 있으면 무비자 입국이 막힐 수 있습니다. 중국 측 안내도 <b>\"법에 따라 입국이 허용되지 않는 사유가 있는 경우\"<\/b>를 거절 사유로 두고 있습니다.<\/li>\n<\/ol>\n<div class=\"tip\"><b>💡 입국카드는 미리 써 두면 줄이 줄어듭니다<\/b><p style=\"margin:8px 0 0\">중국은 외국인에게 <b>입경카드<\/b> 작성을 요구합니다. 기내에서 나눠주는 경우가 많으니 <b>착륙 전에 숙소 이름·주소를 적어 두세요<\/b>. 이때 필요한 것이 <b>호텔의 중국어 주소<\/b>입니다. 예약 확인서에 영문만 있으면 <b>지도 앱에서 중국어 주소를 캡처<\/b>해 가면 심사·택시 이용 모두 수월합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 입국하면 24시간 안에 — 주숙등기<\/h2>\n<p>한국 여행자가 가장 모르고 지나가는 의무입니다. 중국에 머무는 외국인은 <b>숙소를 관할 공안기관(파출소)에 신고<\/b>해야 합니다. 이것을 <b>주숙등기(住宿登记)<\/b>라고 합니다.<\/p>\n<table>\n<tr><th>묵는 곳<\/th><th>별도 신고<\/th><th>설명<\/th><\/tr>\n<tr><td><b>호텔 등 등록된 숙박업소<\/b><\/td><td><b>불필요<\/b><\/td><td>체크인 때 호텔이 대신 등록<\/td><\/tr>\n<tr><td><b>친척·지인 집<\/b><\/td><td><b>필요<\/b><\/td><td>입국(또는 이동) 후 <b>24시간 이내<\/b><\/td><\/tr>\n<tr><td><b>민박·임대주택 등<\/b><\/td><td><b>필요<\/b><\/td><td>농촌 지역은 <b>72시간 이내<\/b><\/td><\/tr>\n<\/table>\n<p>즉 <b>호텔에만 묵는 일반 관광객은 신경 쓸 일이 없습니다.<\/b> 문제는 <b>친척 집이나 지인 집, 개인이 빌려주는 숙소<\/b>에 묵는 경우입니다. 이때는 <b>여권과 숙소 주인의 신분증·주택 관련 서류를 들고 관할 파출소<\/b>에 가야 합니다.<\/p>\n<div class=\"warn\"><b>⚠️ 안 하면 최대 2,000위안(약 40만 원 안팎)<\/b><p style=\"margin:8px 0 0\">주숙등기를 하지 않은 사실이 확인되면 <b>경고 또는 최대 2,000위안의 벌금<\/b>이 부과될 수 있습니다. 한국 공관 안내에서도 반복적으로 당부하는 항목입니다. <b>중간에 숙소를 옮겼을 때도 새로 등기해야 한다<\/b>는 점을 놓치기 쉬우니, <b>친척 집 → 호텔 → 다시 친척 집<\/b>처럼 옮겨 다니는 일정이라면 특히 유의하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 30일을 넘기면 — 연장과 초과체류 벌금<\/h2>\n<p>사정이 생겨 30일을 넘겨야 한다면 <b>기한이 끝나기 전에<\/b> 움직여야 합니다. 중국 측 안내는 두 갈래를 제시합니다.<\/p>\n<ul>\n<li><b>출발 전에 이미 30일 초과가 예상된다면<\/b> — 한국에서 <b>해당 목적에 맞는 비자를 미리 받아<\/b> 들어갑니다.<\/li>\n<li><b>입국 후 정당한 사유로 더 머물러야 한다면<\/b> — 체류기간이 끝나기 전에 <b>현지 공안기관 출입경관리부서에 체류증(停留证件)을 신청<\/b>합니다. 한국 공관 안내에 따르면 <b>기한 만료 전 여유를 두고<\/b> 신청해야 합니다.<\/li>\n<\/ul>\n<p>기한을 넘겨 버리면 <b>돈으로 끝나지 않을 수 있습니다.<\/b> 중국 출입경관리법은 불법 체류에 대해 <b>경고<\/b>를, 정도가 무거우면 <b>초과 1일당 500위안, 총액 1만 위안 이하의 벌금 또는 5~15일 구류<\/b>를 규정하고 있습니다.<\/p>\n<table>\n<tr><th>초과 일수<\/th><th>계산<\/th><th>벌금(상한 규정 적용)<\/th><\/tr>\n<tr><td>3일<\/td><td>500위안 × 3<\/td><td><b>1,500위안<\/b> (약 30만 원 안팎)<\/td><\/tr>\n<tr><td>10일<\/td><td>500위안 × 10<\/td><td><b>5,000위안<\/b><\/td><\/tr>\n<tr><td>20일<\/td><td>500위안 × 20 = 10,000위안<\/td><td><b>10,000위안<\/b> (상한)<\/td><\/tr>\n<tr><td>30일<\/td><td>500위안 × 30 = 15,000위안<\/td><td><b>10,000위안<\/b> (상한 적용)<\/td><\/tr>\n<\/table>\n<p>표에서 보듯 <b>20일을 넘기면 벌금은 상한에 걸려 더 오르지 않지만<\/b>, 대신 <b>구류나 강제출국, 향후 입국 제한<\/b> 같은 더 무거운 결과로 넘어갑니다. <b>\"벌금만 내면 된다\"고 생각할 문제가 아닙니다.<\/b> 실제 적용 수위는 사안에 따라 다르므로, <b>기한 전 연장<\/b>이 유일하게 안전한 길입니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 홍콩·마카오·티베트는 별개입니다<\/h2>\n<p>지도상 같은 중국이라도 <b>출입경 제도는 따로 돌아갑니다.<\/b> 이 부분을 뭉뚱그려 이해하면 일정이 꼬입니다.<\/p>\n<ul>\n<li><b>홍콩<\/b> — 한국과 사증면제협정이 있어 <b>관광 목적 최대 90일(3개월)<\/b> 무비자 체류가 가능합니다. 이번 중국 본토 조치와는 <b>별개의 제도<\/b>입니다.<\/li>\n<li><b>마카오<\/b> — 관광 목적 무비자로 <b>1회 최고 90일, 연간 120일<\/b>까지 체류할 수 있습니다(주홍콩 대한민국 총영사관 안내 기준).<\/li>\n<li><b>본토 ↔ 홍콩·마카오 이동<\/b> — 출입경 절차를 다시 밟습니다. 홍콩에 다녀온 뒤 <b>본토로 재입국하면 30일이 새로 시작<\/b>됩니다(재입국 간격 제한 없음).<\/li>\n<li><b>티베트(시짱)<\/b> — 비자·무비자와 <b>무관하게<\/b> 외국인은 별도의 여행 허가가 필요하고, <b>지정 여행사를 통한 일정<\/b>으로만 방문이 가능한 것으로 안내됩니다. 개인 자유여행 계획을 세우기 전에 <b>여행사·현지 규정을 반드시 먼저 확인<\/b>하세요.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ \"홍콩 경유니까 무비자가 이어진다\"는 오해<\/b><p style=\"margin:8px 0 0\">본토에서 홍콩으로 나가는 순간 <b>본토 체류는 종료<\/b>됩니다. 다시 들어오면 <b>새 30일<\/b>이 시작되므로 유리한 방향이지만, 반대로 <b>\"홍콩에 다녀왔으니 원래 30일이 그대로 남아 있다\"는 계산은 틀립니다.<\/b> 남은 일수를 이어 쓰는 개념이 아니라 <b>매 입국마다 새로 30일<\/b>이라고 이해하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">10. 자주 묻는 질문<\/h2>\n<h3>Q. 정말 아무것도 신청 안 해도 되나요?<\/h3>\n<p>네. <b>미국 ESTA나 일본 비지트재팬웹 같은 사전 등록 절차가 없습니다.<\/b> 유효한 일반여권과 목적에 맞는 여행이면 <b>공항에서 바로 입국심사<\/b>를 받습니다. 다만 <b>호텔 예약·귀국 항공권 등 사유를 뒷받침할 자료<\/b>는 지참을 권합니다.<\/p>\n<h3>Q. 왕복 항공권이 꼭 있어야 하나요?<\/h3>\n<p>규정상 항공권 제시가 절대 조건으로 명시된 것은 아니지만, <b>실무상 출국 계획을 확인받는 경우가 많습니다.<\/b> 편도로 들어가면 설명 부담이 커지므로 <b>나가는 표<\/b>는 확보해 두는 편이 안전합니다.<\/p>\n<h3>Q. 30일을 다 채우고 바로 다시 들어가도 되나요?<\/h3>\n<p>중국 측 안내는 <b>입국 횟수와 간격에 제한을 두지 않습니다.<\/b> 다만 <b>반복 입출국으로 사실상 장기 거주하는 형태<\/b>는 목적 위반을 의심받을 수 있어, 실제 사유가 있는 경우로 한정하는 것이 좋습니다.<\/p>\n<h3>Q. 아이 여권도 같은 조건인가요?<\/h3>\n<p>일반여권이라면 <b>연령과 관계없이 같은 조치가 적용<\/b>됩니다. 다만 <b>미성년자 단독 여행이나 부모 한쪽만 동반<\/b>하는 경우 가족관계를 확인받을 수 있으니 <b>가족관계증명서(영문)<\/b> 같은 서류를 준비해 두면 수월합니다.<\/p>\n<h3>Q. 무비자로 들어가면 여권에 무엇이 찍히나요?<\/h3>\n<p>입국심사 통과 시 <b>여권에 입국 도장<\/b>이 찍힙니다. <b>이 도장의 날짜가 체류기간 계산의 기준<\/b>이 되므로, 입국 직후 <b>도장 날짜를 한 번 확인<\/b>해 두세요. 날짜가 예상과 다르면 그 자리에서 확인하는 편이 낫습니다.<\/p>\n<h3>Q. 중국에서 카드·현금 결제는 어떻게 하나요?<\/h3>\n<p>모바일 결제 비중이 매우 높아 <b>현금만 준비하면 불편할 수 있습니다.<\/b> 여행 전 <b>결제 앱 설정과 해외 결제 가능한 카드<\/b>를 미리 확인하세요. 환전·해외결제 수수료 비교는 아래 <b>함께 보면 좋은 글<\/b>에서 다룹니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec11\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 외교부 · 주한중국대사관 (공식)<\/b><a href=\"https://www.0404.go.kr/ntnSafetyInfo/189/detail\" target=\"_blank\" rel=\"nofollow\">▸ 외교부 해외안전여행 — 중국 국가·지역 정보(출입국·안전)<\/a><a href=\"https://0404.go.kr/bbs/contsPst/MST0000000000113/13/detail\" target=\"_blank\" rel=\"nofollow\">▸ 외교부 해외안전여행 — 영사협정·사증면제 안내<\/a><a href=\"https://kr.china-embassy.gov.cn/kor/lsfw/lszj/202511/t20251106_11748002.htm\" target=\"_blank\" rel=\"nofollow\">▸ 주한중국대사관 — 사증 면제 정책 연장에 관한 공지<\/a><a href=\"https://www.mofa.go.kr/cn-xian-ko/brd/m_738/view.do?seq=1346727\" target=\"_blank\" rel=\"nofollow\">▸ 주시안 대한민국 총영사관 — 비자면제 방침 연장 및 유의사항<\/a><a href=\"https://overseas.mofa.go.kr/hk-ko/brd/m_1521/view.do?seq=1039798\" target=\"_blank\" rel=\"nofollow\">▸ 주홍콩 대한민국 총영사관 — 마카오 무비자 체류 시 유의사항<\/a><\/div>\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">핵심은 넷입니다. <b>①<\/b> 한국 일반여권이면 <b>사전 신청 없이 최장 30일<\/b> 무비자 입국이 되고, <b>②<\/b> 이 조치는 <b>2026년 12월 31일 '입국'분까지<\/b>라 연말에 들어가 해를 넘겨 나오는 일정은 괜찮지만 <b>새해에 들어가는 일정은 별도 확인<\/b>이 필요합니다. <b>③<\/b> 30일은 <b>입국 다음 날부터<\/b> 세므로 <b>입국일 + 30일<\/b>이 마지막 날이고, <b>④<\/b> 호텔이 아닌 곳에 묵으면 <b>24시간(농촌 72시간) 안에 주숙등기<\/b>를 해야 합니다. 출발 전에 <b>여권 유효기간 6개월<\/b>과 <b>귀국 항공권 날짜<\/b> 두 가지만 확인해도 대부분의 사고는 막을 수 있습니다.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 비자면제 조치는 <b>중국 정부의 결정에 따라 변경·종료될 수 있습니다.<\/b> 특히 <b>2027년 1월 이후 일정<\/b>은 출발 전 반드시 주한중국대사관 공지와 외교부 해외안전여행에서 최신 상태를 재확인하세요.<br>본문의 벌금 표는 <b>중국 출입경관리법의 규정 상한(1일 500위안·총액 1만 위안 이하)<\/b>을 적용해 계산한 것이며, <b>실제 처분 수위는 사안에 따라 달라집니다.<\/b> 원화 환산액은 이해를 돕기 위한 어림값입니다.<br>출처: 주한중국대사관 「사증 면제 정책 연장에 관한 공지」(2025년 11월 6일), 중국 측 단방면 비자면제 정책 문답(체류기간 기산·입국 횟수·소지 권장 서류), 외교부 해외안전여행 국가·지역 정보 및 영사협정·사증면제 안내, 주시안·주홍콩 대한민국 공관 공지, 중국 출입경관리법(체류·주숙등기·초과체류 규정), 중국 국가이민관리국 환승 무비자 시행 내용. 영사콜센터 +82-2-3210-0404<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_766.html\">▸ 여권 발급 방법 준비물 기간 수수료 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/vs-vs.html\">▸ 로밍 vs 유심 vs 이심 해외여행 데이터 비교 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_452.html\">▸ 여행자보험 가입 방법 보장 비교 총정리<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 체류기간·허용 목적·기한은 <b>주한중국대사관 공지와 외교부 해외안전여행·재외공관 안내를 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 비자 정책은 예고 없이 바뀔 수 있으니 출발 전 공식 공지를 한 번 더 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 중국은 지금 한국 일반여권이면 비자 없이 최장 30일 머물 수 있습니다. 미국 ESTA나 일본 비지트재팬웹 같은 사전 등록도 없어서 여권만 들고 공항에 가면 됩니다. 단 이 조치는 2026년 12월 31일까지로 기한이 정해져 있습니다.\n2. 30일은 입국한 날이 아니라 입국 다음 날부터 셉니다. 그래서 마지막 날 = 입국일 + 30일이에요. 9월 10일 입국이면 10월 10일까지입니다. \"30박 31일이니 괜찮겠지\"로 잡으면 초과체류가 됩니다. 초과하면 1일 500위안, 최대 1만 위안 벌금에 구류까지 갈 수 있습니다.\n3. 놓치기 쉬운 게 주숙등기입니다. 호텔은 체크인 때 자동으로 처리되지만, 친척 집이나 민박에 묵으면 24시간(농촌 72시간) 안에 관할 파출소에 신고해야 하고 안 하면 최대 2,000위안 벌금입니다. 그리고 2026년 12월 31일은 '입국' 기준이라, 12월에 들어가 1월에 나오는 건 괜찮지만 1월 1일에 들어가는 일정은 비자가 필요합니다.\n"}]},"db":{"version":1,"updated":"2026-07-27","root":"lifeinfo","blog":"https://lifeinfo8975.blogspot.com/","taxonomy":[{"code":"A","name":"정부지원·복지","color":"#2BC4B0","subs":[{"code":"A1","name":"지원금·수당"},{"code":"A2","name":"생계·바우처 지원"},{"code":"A5","name":"근로·구직 지원"},{"code":"A3","name":"연금·노후"},{"code":"A4","name":"위기·재난 지원"}]},{"code":"B","name":"세금·금융","color":"#4D9DE0","subs":[{"code":"B1","name":"지방세"},{"code":"B4","name":"국세"},{"code":"B2","name":"금융·은행"},{"code":"B3","name":"연금자산"}]},{"code":"C","name":"건강·의료","color":"#E76F51","subs":[{"code":"C1","name":"건강보험 제도·환급"},{"code":"C2","name":"검진·접종"},{"code":"C3","name":"보험·요양"},{"code":"C4","name":"치과·수술 급여"}]},{"code":"D","name":"생활·행정","color":"#2EB67D","subs":[{"code":"D1","name":"증명·민원"},{"code":"D2","name":"자동차·교통"},{"code":"D3","name":"주거·공과금"},{"code":"D4","name":"소비자·환불"}]},{"code":"E","name":"디지털·통신","color":"#4361C9","subs":[{"code":"E1","name":"통신·요금"},{"code":"E2","name":"앱·계정"},{"code":"E3","name":"자격·교육"}]},{"code":"F","name":"여행","color":"#7C5CE0","subs":[{"code":"F1","name":"여권·서류·보험"},{"code":"F2","name":"국내 교통·이동"},{"code":"F3","name":"해외 결제·통신"},{"code":"F4","name":"국내 숙박·레저"}]},{"code":"G","name":"우리동네","color":"#E8A33D","subs":[{"code":"G1","name":"부산진구·부산"},{"code":"G2","name":"양산"},{"code":"G3","name":"여행·문화지원"},{"cod     ?'<div class="cnt">발행 대기 '+qItems.length+'건 — 발행하면 카드가 자동으로 사라집니다(사람 승인 게이트)</div>'+qCards
    :'<div class="pcode none">발행 대기 없음 — PREP 루틴이 준비하면 여기 카드로 뜹니다</div>';
  document.getElementById('board').innerHTML=
   '<div class="hd"><div class="t"><h1>진행현황</h1><span class="date">'+esc(date)+'</span></div>'
   +'<span class="badge '+bcls+'">'+CHECK+esc(blab)+'</span></div>'
   +'<div class="sec">오늘 한 일</div>'+today
   +'<div class="metrics">'
   +'<div class="m"><div class="l">검사 통과</div><div class="v">'+pass+' <small>/ '+total+'</small></div></div>'
   +'<div class="m"><div class="l">블로그 글</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">평균 본문</div><div class="v">'+avg+' <small>자</small></div></div>'
   +'</div>'
   +'<div class="div"></div>'
   +'<div class="sec">📋 발행 대기 (오늘 발행할 글)<span class="auto">🤖 PREP 큐</span></div>'+qHtml
   +'<div class="div"></div>'
   +'<div class="sec">발행 진행 (글 1편 · '+STEPS.length+'단계, 확산 포함)<span class="auto">🤖 자동</span></div>'+pubHtml
   +'<div class="div"></div>'
   +'<div class="sec">📡 4채널 발행 현황 (구글·네이버·쓰레드·인스타)<span class="auto">🤖 DB 자동집계</span></div>'
   +'<div class="metrics">'
   +'<div class="m"><div class="l">구글(원본)</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">네이버</div><div class="v">'+oNv+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">쓰레드</div><div class="v">'+oTh+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">인스타</div><div class="v">'+oIn+' <small>편</small></div></div>'
   +'</div>'
   +'<div class="cnt">확산 커버리지 · 네이버 '+(count?Math.round(oNv/count*100):0)+'% · 쓰레드 '+(count?Math.round(oTh/count*100):0)+'% · 인스타 '+(count?Math.round(oIn/count*100):0)+'% · 교차링크 완료 '+omAll.length+'편</div>'
   +osmuLi

   +'<div class="div"></div>'
   +'<div class="sec">📋 미결 관리 — 4채널 매칭<span class="auto">G구글·N네이버·T쓰레드·I인스타</span></div>'+pendHtml
   +'<div class="sec">다음</div><div class="next">'+next+'</div>'
   +'<div class="upd" id="upd"></div>';
  tick();
}
// 시계·데이터 기준만 갱신(보드 전체 재렌더 없음 — 정적 베이크 데이터라 시계만 변함)
function tick(){
  const el=document.getElementById('upd'); if(!el)return;
  const b=(window.__DATA__||{}).baked_at;
  el.textContent=(b?'데이터 기준 '+b+' · ':'')+new Date().toLocaleTimeString('ko-KR');
}
// 👁 발행 대기 카드 본문 미리보기 — 초안 HTML을 격리 iframe(srcdoc)로 렌더(스타일 누수 차단, Blogger 미접촉)
function qpv(code){
  const items=((window.__DATA__||{}).queue||{}).items||[];
  const it=items.find(x=>x.code===code); if(!it||!it.body)return;
  document.getElementById('qpv-ttl').textContent=(it.code||'')+' · '+(it.title||'');
  document.getElementById('qpv-fr').srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank"><body style="margin:0;padding:16px;background:#fff">'+it.body+'</body>';
  document.getElementById('qpv-ov').classList.add('show');
}
function qpvClose(){document.getElementById('qpv-ov').classList.remove('show');document.getElementById('qpv-fr').srcdoc='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')qpvClose();});
// 코드 자동 반영: 자기 자신(progress.html)을 주기적으로 fetch→해시 비교, 바뀌면 1회 reload
const _hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
let _selfHash=null;
async function checkVersion(){
  try{
    const r=await fetch('progress.html?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;                                // 일시적 404/500에 해시 오염 → 불필요 reload 방지
    const t=await r.text();
    const h=_hash(t);
    if(_selfHash===null){_selfHash=h;return;}      // 첫 호출=기준선 저장
    if(h!==_selfHash) location.reload();            // 코드 변경 감지 → 자동 새로고침
  }catch(e){}
}
load(); checkVersion(); setInterval(tick,5000); setInterval(checkVersion,5000);
</script>
