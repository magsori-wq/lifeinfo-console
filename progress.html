<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="icon" href="data:,">
<title>진행현황 — 생활정보 모음</title>
<style>
:root{--bg:#0e1620;--card:#18222e;--card2:#13202d;--line:#26323f;--txt:#e6edf3;--mut:#8a97a6;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:470px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hd .t{display:flex;align-items:center;gap:8px}
.hd h1{font-size:16px;font-weight:600}
.date{font-size:12px;color:var(--mut);font-weight:400}
.badge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.b-green{background:rgba(63,185,80,.16);color:var(--ok)}
.b-warn{background:rgba(210,153,34,.16);color:var(--warn)}
.b-bad{background:rgba(248,81,73,.16);color:var(--bad)}
.sec{font-size:11px;color:var(--mut);letter-spacing:.05em;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.sec .auto{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52;border-radius:7px;padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:0}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;line-height:1.4}
.row svg{width:15px;height:15px;flex:none}
.row.done svg{color:var(--ok)}
.row.warn svg{color:var(--warn)}
.row .mut{color:var(--mut)}
.metrics{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 2px}
/* 채널이 4개가 되어 490px 팝업에서 눌리므로, 좁아지면 2x2로 감싸게 한다 */
.m{flex:1 1 96px;background:var(--card2);border-radius:9px;padding:8px 10px}
.m .l{font-size:11px;color:var(--mut)}
.m .v{font-size:18px;font-weight:600;margin-top:2px}
.m .v small{font-size:12px;color:var(--mut);font-weight:400}
.div{border-top:1px solid var(--line);margin:13px 0 2px}
.next .row svg{color:var(--mut)}
.pcode{font-size:12.5px;font-weight:600;margin:2px 0 6px}
.pcode .none{color:var(--mut);font-weight:400}
.bar{height:8px;background:#0b1322;border-radius:6px;overflow:hidden;margin:0 0 4px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4D9DE0,#06D6A0);width:0;transition:width .3s}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:0 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #243049;font-size:12.5px}
li:last-child{border-bottom:none}
li.on{opacity:.62}
li.on .lbl{text-decoration:line-through}
li svg{width:15px;height:15px;flex:none}
li.on svg{color:var(--ok)}
li.now svg{color:#7fc1ff}
li.wait svg{color:#4a586e}
.num{font-size:11px;color:#6b7a99;width:16px;text-align:right;flex:none}
.who{font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px;flex:none}
.who.ai{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.who.me{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.lbl{font-size:12.5px}
.star{color:#ff8e8e;font-weight:800;margin-left:2px}
.banner{display:none;margin-top:9px;background:#0c3a2c;border:1px solid #1f6b52;color:#06d6a0;border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12.5px}
.banner.show{display:block}
.upd{font-size:11px;color:var(--mut);text-align:right;margin-top:12px}
.agent{background:var(--card2);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.agent .ah{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.agent .st{font-size:10px;font-weight:700;padding:1px 7px;border-radius:7px;margin-left:auto}
.st.active{background:#0c3a2c;color:#06d6a0;border:1px solid #1f6b52}
.st.uncommitted{background:#3a2f12;color:#ffd166;border:1px solid #5a4a1a}
.st.idle{background:#222c3a;color:#6b7a99;border:1px solid #2e3a4a}
.agent .role{font-size:11px;color:var(--mut);margin:3px 0 1px}
.agent .own{font-size:10.5px;color:#5a6b80}
.agent .act{font-size:11px;color:#aeb9c7;margin-top:4px;padding-left:7px;border-left:2px solid #2a3a4d;line-height:1.5}
.agent .act .d{color:var(--mut);font-size:10px}
.advice{background:#13202d;border:1px solid #2a3a4d;border-radius:9px}
.advice .ai{display:flex;gap:8px;padding:7px 11px;font-size:12px;line-height:1.5;border-bottom:1px dashed #243049}
.advice .ai:last-child{border-bottom:none}
.advice .ic{flex:none}
.prow{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px dashed #243049;font-size:11.5px}
.prow:last-child{border-bottom:none}
.pcd{color:#7fc1ff;font-weight:700;flex:none;width:46px}
.ptt{flex:1;color:#cdd6e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{background:#3a2f12;color:#ffd166;border-radius:5px;padding:0 5px;font-size:9.5px;flex:none}
.pact{color:#06d6a0;font-size:10px;flex:none;font-weight:700}
.qcard{display:flex;gap:9px;padding:8px;margin:6px 0;background:#141c2c;border:1px solid #243049;border-radius:9px}
.qth{width:78px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:#0d1420}
.qth.none{display:flex;align-items:center;justify-content:center;color:#54627a;font-size:9px;text-align:center;line-height:1.2;border:1px dashed #2a3752}
.qbody{flex:1;min-width:0}
.qtop{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qcode{color:#7fc1ff;font-weight:700;font-size:11.5px}
.qlane{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700}
.qlane.info{background:#12283a;color:#7fc1ff}
.qlane.pop{background:#2f2136;color:#e0a3ff}
.qtitle{color:#e6edf5;font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qfacts{color:#8a95a6;font-size:10px;margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qmeta{margin-top:4px}
.qdraft{color:#6b7688;font-size:9.5px;margin-left:8px}
.qpv{background:#17324a;color:#7fc1ff;border:1px solid #2a4d6e;border-radius:6px;font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer}
.qpv:hover{background:#1d4463}
.qpv.none{background:none;border:none;color:#54627a;font-weight:400;cursor:default;padding:3px 0}
#qpv-ov{display:none;position:fixed;inset:0;background:rgba(6,10,18,.82);z-index:999;align-items:center;justify-content:center;padding:18px}
#qpv-ov.show{display:flex}
.qpv-box{width:100%;max-width:760px;height:88vh;display:flex;flex-direction:column;background:#0f1626;border:1px solid #2a3752;border-radius:12px;overflow:hidden}
.qpv-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid #243049;font-size:12.5px;font-weight:700;color:#7fc1ff}
.qpv-hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpv-x{background:#243049;color:#cdd6e0;border:none;border-radius:6px;font-size:11px;padding:5px 11px;cursor:pointer;flex:none}
.qpv-x:hover{background:#324158}
.qpv-fr,#qpv-fr{flex:1;width:100%;border:0;background:#fff}
.qpv-ft{padding:8px 14px;border-top:1px solid #243049;font-size:10px;color:#8a95a6;text-align:center}
.ch{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 4px;flex:none;margin-left:3px}
.ch.on{background:#0c3a2c;color:#06d6a0}
.ch.off{background:#3a1216;color:#f0707a}
</style>
</head>

<div class="card" id="board" role="status">불러오는 중…</div>

</div>

n.lsg th{background:#f0ebfc}\n.lsg .tip{background:#f4f1fd;border:1px solid #ded4f7;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .warn{background:#fff3f3;border:1px solid #f6cccc;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .end{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:16px 20px;margin-top:24px}\n.lsg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#f4f1fd;border:1px solid #ded4f7;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#6544cc;margin-bottom:8px}\n.lsg .rel a{display:block;color:#5a3cc0;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#9a92aa;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">여행<\/span>\n<p>여행사에서 패키지 여행을 계약했다가 사정이 생겨 취소할 때, 가장 먼저 듣는 말은 대개 <b>\"지금 취소하시면 취소료가 이만큼 나옵니다\"<\/b>입니다. 그런데 그 금액이 <b>맞는 금액인지 확인할 방법<\/b>을 아는 분은 많지 않습니다. 여행요금의 절반을 떼겠다는 말을 듣고도 <b>근거를 따져 묻지 못한 채 그냥 물어내는 경우<\/b>가 대부분입니다. 정부가 정해 둔 기준이 분명히 있는데도 그렇습니다. 게다가 <b>정말 중요한 함정이 하나 더<\/b> 있습니다. 그 정부 기준이 <b>모든 계약에 무조건 적용되는 것이 아니라는 점<\/b>입니다. 이 글에서는 <b>국외·국내 패키지 여행의 시점별 위약금 기준표, 실제 금액 계산, 위약금 없이 취소할 수 있는 사유, 여행사 특별약관이 우선하는 경우, 분쟁 시 대응 순서<\/b>까지 공식 자료를 근거로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 먼저 확인할 것 — 내 계약에 적용되는 기준<\/a><a href=\"#sec2\">2. 국외 패키지 여행 취소 위약금 기준표<\/a><a href=\"#sec3\">3. 계산예시 — 400만 원 패키지, 언제 취소하면 얼마<\/a><a href=\"#sec4\">4. 국내여행은 기준이 다릅니다 (당일 / 숙박)<\/a><a href=\"#sec5\">5. 가장 큰 함정 — 여행사 '특별약관'이 우선하는 경우<\/a><a href=\"#sec6\">6. 위약금 없이 취소할 수 있는 사유<\/a><a href=\"#sec7\">7. 태풍·천재지변이면 전액 환불인가<\/a><a href=\"#sec8\">8. 여행사가 취소한 경우 — 인원 미달 포함<\/a><a href=\"#sec9\">9. 출발한 뒤에 그만두면<\/a><a href=\"#sec10\">10. 분쟁이 생겼을 때 대응 순서<\/a><a href=\"#sec11\">11. 자주 묻는 질문<\/a><a href=\"#sec12\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#sec2\">👉 시점별 위약금 기준표 바로 보기<\/a>\n\n<h2 id=\"sec1\">1. 먼저 확인할 것 — 내 계약에 적용되는 기준<\/h2>\n<p>여행 취소료를 따질 때 사람들이 가장 많이 하는 실수는 <b>인터넷에서 본 \"30일 전이면 전액 환불\"이라는 문장 하나만 들고 여행사와 다투는 것<\/b>입니다. 그 문장은 맞지만, <b>내 계약에 적용되는지부터 확인해야<\/b> 합니다. 순서는 이렇습니다.<\/p>\n<table>\n<tr><th>순서<\/th><th>확인할 것<\/th><th>어디서 보나<\/th><\/tr>\n<tr><td><b>①<\/b><\/td><td>여행사와 맺은 계약인가, 내가 직접 예약한 것인가<\/td><td>계약서 · 결제 내역<\/td><\/tr>\n<tr><td><b>②<\/b><\/td><td>계약서에 <b>취소료(취소수수료) 규정<\/b>이 따로 적혀 있는가<\/td><td>계약서 · 약관 동의 화면<\/td><\/tr>\n<tr><td><b>③<\/b><\/td><td>그 규정이 <b>표준약관과 다르다는 설명<\/b>과 <b>별도 확인<\/b>을 받았는가<\/td><td>서면 · 전자문서 기록<\/td><\/tr>\n<tr><td><b>④<\/b><\/td><td>②③이 없다면 → <b>소비자분쟁해결기준<\/b> 적용<\/td><td>본문 2·4장 기준표<\/td><\/tr>\n<\/table>\n<p>정리하면 <b>\"계약서에 별도 취소료 약정이 없으면 정부 기준표대로, 별도 약정이 제대로 되어 있으면 그 약정대로\"<\/b>입니다. 그래서 <b>계약서 원문을 먼저 확보하는 것이 1번<\/b>입니다. 요즘은 대부분 <b>전자문서·모바일 동의 화면<\/b>이라 여행사에 요청하면 받을 수 있습니다.<\/p>\n<div class=\"tip\"><b>💡 '패키지'와 '자유여행'은 다릅니다<\/b><p style=\"margin:8px 0 0\">여행사가 <b>항공·숙박·일정을 묶어 파는 패키지<\/b>는 여행계약이라 이 글의 기준이 그대로 적용됩니다. 반면 여행사를 통해 <b>항공권만, 호텔만 따로 예약한 자유여행<\/b>은 <b>항공사·숙박업소 자체의 취소 규정<\/b>이 함께 걸립니다. 이 경우 여행사가 <b>항공권 취소수수료와 예약 대행 수수료를 별도로 청구<\/b>할 수 있는지가 자주 다툼이 되는데, 공정거래위원회는 <b>계약서에 취소수수료를 명확하게 충분히 고지했는지<\/b>를 핵심으로 봅니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 국외 패키지 여행 취소 위약금 기준표<\/h2>\n<p>별도 약정이 없을 때 적용되는 기준이 <b>「소비자분쟁해결기준」(공정거래위원회 고시)<\/b>의 여행업 항목입니다. 국외여행은 다음과 같습니다.<\/p>\n<table>\n<tr><th>취소를 알린 시점<\/th><th>여행자가 취소<\/th><th>여행사가 취소<\/th><\/tr>\n<tr><td><b>여행개시 30일 전<\/b>까지<\/td><td><b>계약금 환급<\/b> (위약금 없음)<\/td><td>계약금 환급<\/td><\/tr>\n<tr><td>29일 전 ~ <b>20일 전<\/b>까지<\/td><td>여행요금의 <b>10%<\/b><\/td><td>계약금 환급 + 요금의 10% 배상<\/td><\/tr>\n<tr><td>19일 전 ~ <b>10일 전<\/b>까지<\/td><td>여행요금의 <b>15%<\/b><\/td><td>계약금 환급 + 요금의 15% 배상<\/td><\/tr>\n<tr><td>9일 전 ~ <b>8일 전<\/b>까지<\/td><td>여행요금의 <b>20%<\/b><\/td><td>계약금 환급 + 요금의 20% 배상<\/td><\/tr>\n<tr><td>7일 전 ~ <b>1일 전<\/b>까지<\/td><td>여행요금의 <b>30%<\/b><\/td><td>계약금 환급 + 요금의 30% 배상<\/td><\/tr>\n<tr><td><b>여행 당일<\/b><\/td><td>여행요금의 <b>50%<\/b><\/td><td>계약금 환급 + 요금의 50% 배상<\/td><\/tr>\n<\/table>\n<p>오른쪽 <b>'여행사가 취소'<\/b> 칸의 <b>\"계약금 환급 + 요금의 N% 배상\"<\/b>은 <b>이미 낸 돈을 전부 돌려받고, 그에 더해 배상까지 받는다<\/b>는 뜻입니다. 잘못은 여행사가 했는데 내가 돈을 물어내는 구조가 아닙니다.<\/p>\n<p>표에서 놓치기 쉬운 대목이 두 가지 있습니다.<\/p>\n<ul>\n<li><b>\"30일 전 = 계약금 환급\"은 계약금을 돌려받는다는 뜻입니다.<\/b> 계약금을 못 돌려준다는 뜻이 아닙니다. 이 시점에 취소하면 <b>부담해야 할 위약금이 0원<\/b>이고, 이미 낸 계약금은 <b>돌려받는 것<\/b>이 원칙입니다.<\/li>\n<li><b>기준은 '여행요금'이지 '계약금'이 아닙니다.<\/b> 계약금은 통상 여행요금의 10% 이하로 받습니다. 그래서 <b>15%·20%·30% 구간에서는 계약금만으로 위약금이 다 채워지지 않고 추가로 내야 하는 상황<\/b>이 생깁니다. 3장에서 숫자로 보겠습니다.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ '며칠 전'은 통보가 도달한 날 기준입니다<\/b><p style=\"margin:8px 0 0\">\"20일 전에 마음먹었다\"가 아니라 <b>여행사에 취소 의사가 전달된 날<\/b>이 기준입니다. 전화로만 말하면 <b>날짜를 증명할 방법이 없습니다.<\/b> 반드시 <b>문자·카카오톡·이메일 등 기록이 남는 방법<\/b>으로 함께 통보하고, 그 화면을 보관하세요. 실제 분쟁에서 <b>하루 차이로 위약금 구간이 바뀌는 일<\/b>이 흔합니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">3. 계산예시 — 400만 원 패키지, 언제 취소하면 얼마<\/h2>\n<p>말로만 보면 감이 안 오니 숫자로 보겠습니다. <b>부부 2인이 총 400만 원짜리 국외 패키지를 계약하고 계약금 40만 원(요금의 10%)을 낸 경우<\/b>입니다. 별도 취소료 약정은 없다고 가정합니다.<\/p>\n<table>\n<tr><th>취소 시점<\/th><th>위약금 비율<\/th><th>위약금<\/th><th>계약금 40만 원과 정산<\/th><th>내 최종 부담<\/th><\/tr>\n<tr><td>35일 전<\/td><td>없음<\/td><td>0원<\/td><td><b>40만 원 전액 환급<\/b><\/td><td><b>0원<\/b><\/td><\/tr>\n<tr><td>25일 전<\/td><td>10%<\/td><td>40만 원<\/td><td>계약금과 상계<\/td><td><b>0원<\/b> (추가 없음)<\/td><\/tr>\n<tr><td>15일 전<\/td><td>15%<\/td><td>60만 원<\/td><td>계약금 공제 후 부족<\/td><td><b>20만 원 추가 납부<\/b><\/td><\/tr>\n<tr><td>9일 전<\/td><td>20%<\/td><td>80만 원<\/td><td>계약금 공제 후 부족<\/td><td><b>40만 원 추가 납부<\/b><\/td><\/tr>\n<tr><td>3일 전<\/td><td>30%<\/td><td>120만 원<\/td><td>계약금 공제 후 부족<\/td><td><b>80만 원 추가 납부<\/b><\/td><\/tr>\n<tr><td>여행 당일<\/td><td>50%<\/td><td>200만 원<\/td><td>계약금 공제 후 부족<\/td><td><b>160만 원 추가 납부<\/b><\/td><\/tr>\n<\/table>\n<p>여기서 확인되는 것이 <b>\"계약금만 포기하면 끝\"이 아니라는 사실<\/b>입니다. 25일 전까지는 계약금 선에서 정리되지만, <b>15일 전으로 넘어가는 순간 계약금 외에 돈을 더 내야<\/b> 합니다. 잔금까지 이미 낸 상태라면 <b>낸 돈에서 위약금을 뺀 나머지를 돌려받는<\/b> 구조가 됩니다. 400만 원을 전액 납부한 뒤 3일 전에 취소했다면 <b>120만 원을 제하고 280만 원을 환급<\/b>받게 됩니다.<\/p>\n<div class=\"tip\"><b>🔢 계산 공식<\/b><p style=\"margin:8px 0 0\"><b>돌려받을 돈 = 이미 낸 돈 − (여행요금 × 해당 구간 비율)<\/b><br>결과가 음수면 그만큼 <b>추가로 내야 하는 금액<\/b>입니다. 여행사가 제시한 금액이 이 계산과 다르면 <b>어떤 기준을 적용했는지 서면으로 요구<\/b>하세요. 대개 그 답이 <b>'특별약관'<\/b>입니다(5장).<\/p><\/div>\n<div class=\"warn\"><b>⚠️ 항공권이 이미 발권됐다면 별도 비용이 붙을 수 있습니다<\/b><p style=\"margin:8px 0 0\">위 계산은 <b>여행계약 자체의 위약금<\/b>입니다. 여기에 <b>항공사가 부과하는 항공권 취소수수료<\/b>가 더해질 수 있고, 특히 <b>특가·할인 항공권은 환불 자체가 제한<\/b>되는 경우가 많습니다. 다만 이런 비용은 <b>계약 단계에서 명확히 고지되어 있어야<\/b> 청구할 수 있다는 것이 공정거래위원회의 설명 취지입니다. <b>고지 화면·계약서에 그 문구가 실제로 있었는지<\/b>부터 확인하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">4. 국내여행은 기준이 다릅니다 (당일 / 숙박)<\/h2>\n<p>국내여행은 <b>국외여행과 표가 아예 다릅니다.<\/b> 국외여행은 최대 50%까지 가지만, <b>국내여행은 최대 30%<\/b>에서 멈춥니다. 그리고 <b>당일여행이냐 숙박여행이냐<\/b>에 따라 \"위약금 없는 구간\"이 달라집니다.<\/p>\n<h3>당일여행 (숙박 없음)<\/h3>\n<table>\n<tr><th>취소를 알린 시점<\/th><th>여행자가 취소<\/th><th>여행사가 취소<\/th><\/tr>\n<tr><td><b>여행개시 3일 전<\/b>까지<\/td><td><b>전액 환급<\/b><\/td><td>계약금 환급<\/td><\/tr>\n<tr><td><b>2일 전<\/b>까지<\/td><td>요금의 <b>10%<\/b><\/td><td>계약금 환급 + 요금의 10% 배상<\/td><\/tr>\n<tr><td><b>1일 전<\/b>까지<\/td><td>요금의 <b>20%<\/b><\/td><td>계약금 환급 + 요금의 20% 배상<\/td><\/tr>\n<tr><td><b>당일<\/b> 취소 · 연락 없이 불참<\/td><td>요금의 <b>30%<\/b><\/td><td>계약금 환급 + 요금의 30% 배상<\/td><\/tr>\n<\/table>\n<h3>숙박여행<\/h3>\n<table>\n<tr><th>취소를 알린 시점<\/th><th>여행자가 취소<\/th><th>여행사가 취소<\/th><\/tr>\n<tr><td><b>여행개시 5일 전<\/b>까지<\/td><td><b>전액 환급<\/b><\/td><td>계약금 환급<\/td><\/tr>\n<tr><td><b>2일 전<\/b>까지<\/td><td>요금의 <b>10%<\/b><\/td><td>계약금 환급 + 요금의 10% 배상<\/td><\/tr>\n<tr><td><b>1일 전<\/b>까지<\/td><td>요금의 <b>20%<\/b><\/td><td>계약금 환급 + 요금의 20% 배상<\/td><\/tr>\n<tr><td><b>당일<\/b> 취소 · 연락 없이 불참<\/td><td>요금의 <b>30%<\/b><\/td><td>계약금 환급 + 요금의 30% 배상<\/td><\/tr>\n<\/table>\n<p>두 표의 오른쪽 칸을 왼쪽과 비교해 <b>\"여행사가 잘못했는데 나는 계약금만 돌려받나\"<\/b>라고 읽으시면 안 됩니다. <b>여행사가 취소한 경우의 '계약금 환급 + N% 배상'은 이미 낸 돈을 전부 돌려받은 뒤 추가로 배상까지 받는다<\/b>는 뜻입니다. 여행자가 취소하는 왼쪽 칸보다 <b>언제나 유리합니다.<\/b><\/p>\n<p>국내여행에서 특히 <b>손해가 크게 갈리는 지점은 \"3일 전\"과 \"5일 전\"<\/b>입니다. 숙박여행은 <b>5일 전까지<\/b> 알려야 전액 환급인데, <b>4일 전에 알리면 곧바로 10% 구간<\/b>으로 떨어집니다. 국내 패키지는 금액이 크지 않아 넘어가기 쉽지만, <b>가족 단위로 여러 명을 계약했다면 10%도 적은 돈이 아닙니다.<\/b><\/p>\n<div class=\"tip\"><b>💡 국외 vs 국내 한눈에<\/b><p style=\"margin:8px 0 0\"><b>위약금이 0원인 구간<\/b> — 국외 <b>30일 전<\/b> / 국내 당일여행 <b>3일 전<\/b> / 국내 숙박여행 <b>5일 전<\/b>.<br><b>최대 위약금<\/b> — 국외 <b>50%<\/b>(여행 당일) / 국내 <b>30%<\/b>(당일·무연락).<br>국외여행은 <b>한 달 전에 결정<\/b>하는 것이 위약금을 피하는 유일한 방법이고, 국내여행은 <b>일주일 전쯤<\/b>만 정리해도 대부분 피할 수 있습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">5. 가장 큰 함정 — 여행사 '특별약관'이 우선하는 경우<\/h2>\n<p>여기가 이 글에서 <b>가장 중요한 부분<\/b>입니다. 많은 분이 <b>\"소비자분쟁해결기준은 법이니까 여행사가 무조건 따라야 한다\"<\/b>고 알고 계시는데, <b>그렇지 않습니다.<\/b><\/p>\n<p>공정거래위원회는 소비자분쟁해결기준의 성격에 대해 <b>강행규정이라기보다는 거래관행의 규범(code of conduct)<\/b>이며, <b>당사자 사이에 별도의 의사표시가 없는 경우에 한해 적용된다<\/b>는 취지로 설명하고 있습니다. 즉 <b>계약서에서 취소료를 달리 정했다면 그 약정이 먼저<\/b>입니다.<\/p>\n<table>\n<tr><th>상황<\/th><th>적용 기준<\/th><th>실제 결과<\/th><\/tr>\n<tr><td>계약서에 취소료 규정이 <b>없음<\/b><\/td><td><b>소비자분쟁해결기준<\/b><\/td><td>2·4장 기준표대로<\/td><\/tr>\n<tr><td>계약서에 <b>\"소비자분쟁해결기준에 따른다\"<\/b>고 적힘<\/td><td><b>소비자분쟁해결기준<\/b><\/td><td>2·4장 기준표대로<\/td><\/tr>\n<tr><td>계약서에 <b>자체 취소료 표<\/b>가 있고 <b>설명·별도 확인<\/b>을 받음<\/td><td><b>여행사 특별약관<\/b><\/td><td>여행사 표대로 (더 불리할 수 있음)<\/td><\/tr>\n<tr><td>자체 취소료 표는 있으나 <b>설명·확인 흔적이 없음<\/b><\/td><td><b>다툼의 대상<\/b><\/td><td>기준표 적용을 주장할 근거가 있음<\/td><\/tr>\n<\/table>\n<p>다만 여행사가 <b>아무렇게나 특별약관을 들이밀 수 있는 것은 아닙니다.<\/b> 국외여행 표준약관은 특약에 대해 <b>서면(전자문서 포함)으로 맺어야 하고<\/b>, 여행사는 <b>그 특약이 표준약관과 다르며 표준약관보다 우선 적용된다는 점을 여행자에게 설명하고 별도의 확인을 받아야<\/b> 한다고 정하고 있습니다.<\/p>\n<div class=\"warn\"><b>⚠️ 그래서 따져야 할 질문은 이것입니다<\/b><p style=\"margin:8px 0 0\">\"우리 회사 규정입니다\"라는 답을 들었다면 <b>다음 세 가지를 서면으로 요구<\/b>하세요. <b>①<\/b> 그 취소료 규정이 적힌 <b>계약서·약관 원문<\/b> <b>②<\/b> 그것이 <b>표준약관과 다르다는 설명을 했다는 기록<\/b> <b>③<\/b> 내가 그 내용을 <b>별도로 확인(동의)했다는 기록<\/b>. 세 가지가 모두 나오지 않으면, <b>소비자분쟁해결기준 적용을 주장할 여지<\/b>가 생깁니다. 반대로 <b>가입 화면에서 취소료 표에 따로 체크한 기억이 있다면<\/b> 그 특약이 적용될 가능성이 높습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec6\">6. 위약금 없이 취소할 수 있는 사유<\/h2>\n<p>시점과 무관하게 <b>손해배상(위약금) 없이 계약을 해제할 수 있는 사유<\/b>가 따로 정해져 있습니다. 여행 표준약관이 정한 내용은 다음과 같습니다.<\/p>\n<h3>여행자가 위약금 없이 해제할 수 있는 경우<\/h3>\n<ul>\n<li>여행자의 <b>안전과 보호<\/b>를 위해 여행자의 요청 또는 현지 사정으로 <b>부득이하다고 쌍방이 합의<\/b>한 경우<\/li>\n<li><b>천재지변·전란·정부의 명령·운송 및 숙박기관 등의 파업·휴업<\/b> 등으로 <b>여행의 목적을 달성할 수 없는<\/b> 경우<\/li>\n<li>여행사가 <b>공제·보증보험에 가입하지 않았거나 영업보증금을 예치하지 않은<\/b> 경우<\/li>\n<li><b>3촌 이내 친족<\/b>이 사망한 경우<\/li>\n<li><b>질병 등 신체 이상<\/b>으로 여행 참가가 불가능한 경우<\/li>\n<li><b>배우자 또는 직계존비속이 3일 이상 입원<\/b>하여 여행 출발 시까지 퇴원이 곤란한 경우, <b>그 보호자 1인<\/b><\/li>\n<li><b>여행사의 귀책사유<\/b>로 계약서에 기재된 일정대로 여행 실시가 불가능해진 경우<\/li>\n<\/ul>\n<h3>여행사가 위약금 없이 해제할 수 있는 경우<\/h3>\n<ul>\n<li>위 첫 두 가지(안전상 합의 · 천재지변 등 목적 달성 불가)는 동일<\/li>\n<li>여행자가 <b>다른 여행자에게 폐를 끼치거나<\/b> 여행의 원활한 실시에 <b>현저한 지장이 있다고 인정<\/b>될 때<\/li>\n<li>여행자의 <b>질병 등 신체 이상<\/b>으로 여행 참가가 불가능한 경우<\/li>\n<li>여행자가 <b>계약서에 기재된 기일까지 여행요금을 내지 않은<\/b> 경우<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ 여기서 실제로 거절당하는 이유 4가지<\/b><p style=\"margin:8px 0 0\"><b>① \"3촌 이내\"에 사촌은 들어가지 않습니다.<\/b> 사촌은 4촌입니다. 3촌은 <b>백부·숙부·고모·이모·외삼촌과 조카<\/b>까지입니다. 사촌 상(喪)으로 취소하면 이 사유로는 인정받기 어렵습니다.<br><b>② 보호자 면제는 1인만입니다.<\/b> 어머니가 입원하셨다고 <b>온 가족이 위약금 없이 취소<\/b>되는 것이 아니라 <b>보호자 1명<\/b>만 해당합니다.<br><b>③ 질병은 증빙이 핵심입니다.<\/b> \"컨디션이 안 좋다\"는 해당하지 않습니다. <b>여행 참가가 불가능하다는 점이 드러나는 진단서 등 객관적 자료<\/b>를 준비하세요.<br><b>④ 입원은 '3일 이상'이고 '출발 시까지 퇴원 곤란'이어야 합니다.<\/b> 하루 이틀 입원했다가 퇴원하는 경우는 해당하지 않습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec7\">7. 태풍·천재지변이면 전액 환불인가<\/h2>\n<p>여름철에 가장 많이 나오는 질문입니다. 결론부터 말하면 <b>\"태풍이 온다더라\"만으로는 부족합니다.<\/b> 약관이 정한 문구는 <b>\"천재지변 등으로 여행의 목적을 달성할 수 없는 경우\"<\/b>이지, <b>\"기상이 나쁠 것 같은 경우\"<\/b>가 아닙니다.<\/p>\n<table>\n<tr><th>상황<\/th><th>인정 가능성<\/th><th>이유<\/th><\/tr>\n<tr><td>출발 항공편이 <b>기상으로 결항<\/b><\/td><td><b>높음<\/b><\/td><td>여행 자체가 성립하지 않음 · 결항 증빙 명확<\/td><\/tr>\n<tr><td>현지에 <b>정부의 여행 제한·통제<\/b> 조치<\/td><td><b>높음<\/b><\/td><td>'정부의 명령'에 해당<\/td><\/tr>\n<tr><td>현지 <b>주요 일정지가 재난으로 폐쇄<\/b><\/td><td>중간<\/td><td>일정의 상당 부분이 불가능한지가 관건<\/td><\/tr>\n<tr><td>여행지에 <b>태풍 예보·주의보<\/b>만 있음<\/td><td><b>낮음<\/b><\/td><td>목적 달성 불가로 보기 어려움 · 예보는 바뀜<\/td><\/tr>\n<tr><td><b>비가 많이 올 것 같아<\/b> 미리 취소<\/td><td><b>낮음<\/b><\/td><td>여행자 개인 사정에 가까움<\/td><\/tr>\n<\/table>\n<p>실무적으로는 <b>\"내가 불안해서 취소\"와 \"여행이 불가능해져서 취소\"를 구분<\/b>한다고 보면 됩니다. 앞의 것은 일반 위약금 구간이 그대로 적용되고, 뒤의 것이라야 면제를 주장할 수 있습니다.<\/p>\n<div class=\"tip\"><b>💡 태풍철에 실제로 도움이 되는 순서<\/b><p style=\"margin:8px 0 0\"><b>①<\/b> 성급하게 먼저 취소 통보를 넣지 마세요. 내가 먼저 취소하면 <b>'여행자 귀책 취소'<\/b>로 처리되기 쉽습니다.<br><b>②<\/b> <b>항공사의 결항·지연 확정 안내<\/b>를 기다린 뒤, 그 안내문을 캡처해 두세요. 이것이 가장 강한 증빙입니다.<br><b>③<\/b> 외교부 <b>해외안전여행<\/b>의 여행경보·특별여행주의보 발령 여부를 함께 확인하세요.<br><b>④<\/b> 여행사에 <b>\"천재지변으로 여행 목적 달성이 불가능한 경우에 해당하는지\"<\/b>를 명시해 서면으로 질의하세요. 구두 대화는 남지 않습니다.<br><b>⑤<\/b> 항공기 결항·지연 자체에 대한 보상은 <b>여행계약 위약금과는 별개 절차<\/b>입니다. 아래 '함께 보면 좋은 글'의 결항 보상 편을 참고하세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec8\">8. 여행사가 취소한 경우 — 인원 미달 포함<\/h2>\n<p>취소는 여행자만 하는 것이 아닙니다. <b>여행사가 취소하는 경우<\/b>가 오히려 억울한데, 이때는 <b>계약금을 돌려받는 것에 더해 배상까지<\/b> 받을 수 있습니다(2·4장 표의 오른쪽 열).<\/p>\n<p>패키지에서 가장 흔한 사유가 <b>\"최소 출발 인원이 안 채워졌다\"<\/b>는 것입니다. 국외여행에서는 이 경우 <b>여행사가 여행 출발 7일 전까지 여행자에게 통지<\/b>해야 합니다. 이 기한을 지키지 않고 계약을 해제하면, <b>이미 받은 계약금을 돌려주는 것 외에 추가로 배상<\/b>해야 합니다.<\/p>\n<table>\n<tr><th>여행사의 인원 미달 통지 시점<\/th><th>여행자가 받을 수 있는 것<\/th><\/tr>\n<tr><td><b>여행 출발 7일 전<\/b>까지 통지<\/td><td>계약금 환급 (추가 배상 없음)<\/td><\/tr>\n<tr><td>기한을 넘겨 <b>출발 1일 전<\/b>까지 통지<\/td><td>계약금 환급 + <b>여행요금의 30%<\/b> 배상<\/td><\/tr>\n<tr><td>기한을 넘겨 <b>출발 당일<\/b> 통지<\/td><td>계약금 환급 + <b>여행요금의 50%<\/b> 배상<\/td><\/tr>\n<\/table>\n<p>여기서 실질적으로 중요한 것은 <b>\"인원 미달이니 어쩔 수 없다\"는 말에 그냥 계약금만 돌려받고 끝내지 말라<\/b>는 점입니다. <b>출발이 임박해서 통보받았다면 배상 대상<\/b>입니다. 출발 3~4일 전에 취소 통보를 받아 <b>다른 여행을 잡지도 못하고 휴가만 날린 경우<\/b>가 정확히 이 경우입니다.<\/p>\n<div class=\"tip\"><b>💡 여행요금이 갑자기 올랐다는 연락을 받았다면<\/b><p style=\"margin:8px 0 0\">여행요금은 <b>운송·숙박기관에 지급할 요금이 계약 때보다 5% 이상 오르내리거나, 적용 환율이 2% 이상 변동<\/b>한 경우에 한해 증감을 청구할 수 있고, <b>증액할 때는 여행 출발일 15일 전에 통지<\/b>해야 합니다. 출발 직전에 갑자기 \"유류할증료가 올라 추가 부담이 필요하다\"는 연락을 받았다면 <b>통지 시점부터 따져 보세요.<\/b><\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec9\">9. 출발한 뒤에 그만두면<\/h2>\n<p>여행이 시작된 뒤에도 <b>부득이한 사유가 있으면 계약을 해지<\/b>할 수 있습니다. 다만 조건이 다릅니다.<\/p>\n<ul>\n<li><b>부득이한 사유로 인한 해지<\/b> — 여행사나 여행자 모두 여행 출발 후에도 부득이한 사유가 있으면 계약을 해지할 수 있습니다. 다만 <b>그 사유가 어느 한쪽의 과실로 생긴 것이라면 상대방의 손해를 배상<\/b>해야 합니다(민법 제674조의4 제1항).<\/li>\n<li><b>귀국 협조는 여행사 책임<\/b> — 여행 중 계약이 해지되더라도 <b>여행자가 귀국하는 데 필요한 조치를 해 주어야 하는 것은 여행사<\/b>입니다. \"계약이 끝났으니 알아서 오시라\"는 통하지 않습니다.<\/li>\n<li><b>중대한 하자로 인한 해지<\/b> — 여행에 <b>중대한 하자<\/b>가 있는데 시정되지 않거나 계약 내용대로의 이행을 기대할 수 없다면, 여행자는 계약을 해지할 수 있습니다(민법 제674조의7 제1항). 일정이 계약서와 전혀 다르거나 숙소 등급이 크게 어긋난 경우가 여기에 해당할 수 있습니다.<\/li>\n<\/ul>\n<div class=\"warn\"><b>⚠️ 현지에서 반드시 남겨야 할 것<\/b><p style=\"margin:8px 0 0\">출발 후 문제로 다투게 되면 <b>증거는 현지에서만 만들 수 있습니다.<\/b> ① <b>계약서에 적힌 일정·숙소 등급<\/b>과 실제가 다른 부분을 <b>사진·영상<\/b>으로 남기고 ② 인솔자·가이드에게 <b>시정을 요구한 사실을 문자 등으로<\/b> 남기고 ③ <b>추가로 쓴 비용의 영수증<\/b>을 모으세요. 돌아온 뒤에 말로만 주장하면 인정받기 어렵습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec10\">10. 분쟁이 생겼을 때 대응 순서<\/h2>\n<p>여행사와 이야기가 되지 않을 때 밟는 순서입니다. <b>순서를 건너뛰면 오히려 오래 걸립니다.<\/b><\/p>\n<table>\n<tr><th>단계<\/th><th>할 일<\/th><th>핵심<\/th><\/tr>\n<tr><td><b>1<\/b><\/td><td>계약서 · 약관 · 취소 통보 기록 <b>확보<\/b><\/td><td>전자문서·모바일 동의 화면 포함<\/td><\/tr>\n<tr><td><b>2<\/b><\/td><td>여행사에 <b>서면<\/b>으로 산정 근거 요구<\/td><td>\"어떤 기준을 적용했는지\" 명시 요구<\/td><\/tr>\n<tr><td><b>3<\/b><\/td><td><b>1372 소비자상담센터<\/b> 상담<\/td><td>국번 없이 <b>1372<\/b> · 온라인 접수 가능<\/td><\/tr>\n<tr><td><b>4<\/b><\/td><td><b>한국소비자원 피해구제<\/b> 신청<\/td><td>합의 권고 단계<\/td><\/tr>\n<tr><td><b>5<\/b><\/td><td><b>소비자분쟁조정위원회<\/b> 조정<\/td><td>양쪽이 수락하면 재판상 화해 효력<\/td><\/tr>\n<\/table>\n<p>2단계를 특히 권합니다. <b>\"우리 규정\"이라는 구두 답변과 달리, 서면으로 근거를 요구하면 특별약관인지 기준표인지가 드러납니다.<\/b> 여기서 정리되는 경우가 많습니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec11\">11. 자주 묻는 질문<\/h2>\n<h3>Q. 계약금만 걸었는데, 취소하면 계약금만 날리면 되나요?<\/h3>\n<p>아닙니다. <b>시점에 따라 계약금보다 더 낼 수도, 계약금을 전부 돌려받을 수도<\/b> 있습니다. 국외여행은 <b>30일 전까지 통보하면 계약금을 돌려받고<\/b>, 반대로 <b>10일 전 이후에 취소하면 계약금(통상 10%)을 넘는 위약금<\/b>이 나옵니다(3장 계산표).<\/p>\n<h3>Q. 여행사가 \"출발 60일 전부터 취소료가 발생한다\"고 합니다.<\/h3>\n<p>표준약관·소비자분쟁해결기준보다 이른 시점부터 취소료를 매기는 것은 <b>특별약관<\/b>입니다. <b>서면(전자문서 포함)으로 맺었는지<\/b>, <b>표준약관과 다르고 우선 적용된다는 설명과 별도 확인을 받았는지<\/b>를 따져 보세요. 그 절차가 지켜졌다면 특약이 적용될 수 있습니다.<\/p>\n<h3>Q. 여행 취소는 며칠 전으로 계산하나요? 주말은 빼나요?<\/h3>\n<p>달력상의 날로 셉니다. 기준은 <b>취소 의사가 여행사에 도달한 날<\/b>이며, <b>기록이 남는 방법으로 통보<\/b>해야 그 날짜를 증명할 수 있습니다.<\/p>\n<h3>Q. 여행자보험에 들었는데 취소 위약금도 보상되나요?<\/h3>\n<p>상품에 따라 다릅니다. <b>여행 취소·중단 손해를 보장하는 특약이 붙어 있는 경우에만<\/b> 가능하고, 기본 담보만으로는 보상되지 않는 경우가 많습니다. <b>보장 항목에 취소 관련 특약이 있는지<\/b>를 증권에서 확인하세요.<\/p>\n<h3>Q. 국내 패키지도 30일 전 기준이 적용되나요?<\/h3>\n<p>아닙니다. <b>국내여행은 당일여행 3일 전, 숙박여행 5일 전<\/b>이 위약금 없는 구간입니다(4장). 국외 기준을 국내에 그대로 적용하면 손해를 봅니다.<\/p>\n<h3>Q. 여행사가 인원 미달로 취소했는데 계약금만 돌려준다고 합니다.<\/h3>\n<p>국외여행에서 인원 미달로 인한 해제는 <b>출발 7일 전까지 통지<\/b>해야 합니다. 그 기한을 넘겨 통지했다면 <b>계약금 환급에 더해 배상<\/b>을 요구할 수 있습니다(8장 표).<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec12\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내<\/b>\n<a href=\"https://easylaw.go.kr/CSP/CnpClsMain.laf?ccfNo=2&amp;cciNo=3&amp;cnpClsNo=3&amp;csmSeq=894&amp;popMenu=ov\" rel=\"nofollow\" target=\"_blank\">▸ 찾기쉬운 생활법령정보 — 해외여행자 : 여행계약의 변경, 해제 및 해지<\/a>\n<a href=\"https://www.easylaw.go.kr/CSP/CnpClsMain.laf?csmSeq=1662&amp;ccfNo=1&amp;cciNo=2&amp;cnpClsNo=2\" rel=\"nofollow\" target=\"_blank\">▸ 찾기쉬운 생활법령정보 — 국내여행자 : 여행사의 책임 및 여행계약 해제·해지하기<\/a>\n<a href=\"https://www.law.go.kr/LSW//admRulInfoP.do?admRulSeq=2100000253084&amp;chrClsCd=010201\" rel=\"nofollow\" target=\"_blank\">▸ 국가법령정보센터 — 소비자분쟁해결기준(공정거래위원회고시 제2024-32호)<\/a>\n<a href=\"https://www.consumer.go.kr/user/bbs/consumer/380/940/bbsDataView/3147.do\" rel=\"nofollow\" target=\"_blank\">▸ 소비자24 — 국외여행 취소수수료 적용 기준에 관한 공정거래위원회 답변<\/a>\n<p style=\"margin:10px 0 0;font-size:14px;color:#1b4f86\">▸ 소비자 상담·피해구제 접수는 <b>국번 없이 1372<\/b>(소비자상담센터)<\/p>\n<\/div>\n\n<div class=\"end\"><b>✅ 마무리 — 세 줄로 정리하면<\/b><p style=\"margin:8px 0 0\"><b>①<\/b> 별도 약정이 없다면 <b>국외는 30일 전, 국내는 당일여행 3일 전·숙박여행 5일 전<\/b>까지 알려야 위약금이 없고, 그 뒤로는 <b>국외 10→15→20→30→50%<\/b>, <b>국내 10→20→30%<\/b>로 올라갑니다. <b>②<\/b> 그런데 <b>소비자분쟁해결기준은 강행규정이 아니라 별도 약정이 없을 때 적용되는 기준<\/b>이라, <b>계약서의 특별약관이 우선<\/b>할 수 있습니다 — 그래서 <b>계약서 원문 확인이 1번<\/b>입니다. <b>③<\/b> <b>3촌 이내 친족 사망, 본인 질병, 배우자·직계존비속 3일 이상 입원(보호자 1인)<\/b> 등은 위약금 없이 해제할 수 있는 사유이니, 해당한다면 <b>증빙부터 갖춰 서면으로 요구<\/b>하세요.<\/p><\/div>\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, <b>소비자분쟁해결기준과 여행 표준약관은 개정될 수 있습니다.<\/b> 또한 본문에서 설명했듯 <b>실제 적용되는 취소료는 계약서·특별약관 내용에 따라 달라지므로<\/b>, 반드시 <b>본인이 체결한 계약서 원문을 먼저 확인<\/b>하시기 바랍니다.<br>3장의 금액은 <b>여행요금 400만 원·계약금 40만 원, 별도 취소료 약정이 없는 경우<\/b>를 가정해 기준표의 비율로 계산한 예시이며, 실제 정산액은 계약 조건과 이미 납부한 금액에 따라 달라집니다. 항공권 취소수수료 등 <b>여행계약 위약금과 별개로 발생하는 비용<\/b>은 포함하지 않았습니다.<br>출처: 찾기쉬운 생활법령정보(법제처) 「해외여행자 — 여행계약의 변경·해제 및 해지」 및 「국내여행자 — 여행사의 책임 및 여행계약 해제·해지하기」, 국가법령정보센터 「소비자분쟁해결기준」(공정거래위원회고시 제2024-32호, 2024년 12월 27일 시행), 소비자24(공정거래위원회·한국소비자원) 국외여행 취소수수료 관련 질의 답변, 국외여행·국내여행 표준약관, 민법 제674조의4·제674조의7. 소비자상담 국번 없이 1372<\/div>\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01858941660.html\">▸ 펜션 호텔 예약 취소 수수료 환불 규정 총정리 (2026 성수기 위약금)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_0459503221.html\">▸ 항공기 결항 지연 보상 신청 방법 기준표 면책 사유 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_452.html\">▸ 여행자보험 가입 방법 보장 비교 총정리<\/a><\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 위약금 비율·면제 사유·통지 기한은 <b>법제처 찾기쉬운 생활법령정보와 국가법령정보센터의 소비자분쟁해결기준, 공정거래위원회 답변을 직접 확인<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 계산 예시는 가정치를 명시했습니다. 실제 취소료는 계약서·특별약관에 따라 달라지니 계약 원문을 함께 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 여행사 패키지를 취소할 때 취소료는 여행사 마음대로가 아닙니다. 별도 약정이 없으면 소비자분쟁해결기준이 적용돼서, 국외여행은 출발 30일 전까지 알리면 위약금 0원(계약금도 돌려받음), 그 뒤로 20일 전 10%, 10일 전 15%, 8일 전 20%, 1일 전 30%, 당일 50%로 올라갑니다. 국내여행은 다릅니다 — 당일여행은 3일 전, 숙박여행은 5일 전까지가 전액 환급이고 최대치도 30%에서 멈춥니다.\n2. 그런데 여기에 큰 함정이 있습니다. 소비자분쟁해결기준은 강행규정이 아니라 '별도 의사표시가 없을 때' 적용되는 기준이라, 계약서에 여행사 자체 취소료 표(특별약관)가 있고 그게 표준약관과 다르다는 설명과 별도 확인을 받았다면 그 특약이 먼저입니다. 그래서 다툼이 생기면 인터넷 기준표를 들이밀기 전에 내 계약서 원문부터 확인해야 합니다.\n3. 시점과 무관하게 위약금 없이 취소되는 사유도 있습니다. 3촌 이내 친족 사망, 본인의 질병 등 신체 이상, 배우자·직계존비속이 3일 이상 입원해 출발 시까지 퇴원이 곤란한 경우의 보호자 1인 등입니다. 주의할 건 사촌은 4촌이라 빠지고, 보호자 면제는 1명만이라는 점입니다. 태풍도 '예보'만으로는 부족하고 결항·정부 통제처럼 여행 목적 달성이 실제로 불가능해야 합니다.\n"}]},"pace":{"date":"2026-07-31","count":4,"posts":[{"title":"일손부족일자리 동행 인센티브 신청 방법 대상 50~64세 360만 원 총정리 (2026 시범사업)","published":"2026-07-31T16:24:16.997+09:00"},{"title":"노인장기요양 복지용구 급여 신청 방법 품목 연간한도 본인부담금 총정리 (2026 연 160만 원)","published":"2026-07-31T15:37:50.000+09:00"},{"title":"해외직구 관세 목록통관 150달러 기준 개인통관고유부호 갱신 총정리 (2026 합산과세·반품 환급)","published":"2026-07-31T15:07:09.000+09:00"},{"title":"비지트재팬웹 등록 방법 일본 입국심사 세관신고 QR코드 총정리 (2026 Visit Japan Web)","published":"2026-07-31T13:48:57.000+09:00"}],"soft":1,"hard":5,"state":"warn","backlog":1,"backlog_codes":["F4-10"],"backlog_max":5,"backlog_over":false,"lanes":{"info":{"label":"일일·정보성","n":0,"codes":[]},"etc":{"label":"기타","n":1,"codes":["F4-10"]},"user":{"label":"사용자 추천","n":0,"codes":[]}},"error":"","checked_at":"2026-07-31T16:24:29"},"db":{"version":1,"updated":"2026-07-31","r                     :'<span class="qpv none">초안 없음(작성 전)</span>';
    return '<div class="qcard">'+th
      +'<div class="qbody"><div class="qtop"><span class="qcode">'+esc(it.code||'')+'</span>'
      +'<span class="qlane '+(it.lane||'info')+'">'+esc(laneLab[it.lane]||it.lane||'')+'</span></div>'
      +'<div class="qtitle">'+esc(it.title||'')+'</div>'+facts
      +'<div class="qmeta">'+pv+draft+'</div></div></div>';
  }).join('');
  // 🚦 오늘 발행량 배지 (2026-07-29) — 승인 누르기 '전에' 보이게 한다.
  //    2026-07-27 에 8편이 한꺼번에 나간 건, 사람이 재고만 보고 몰아서 승인했는데
  //    '오늘 몇 편째'를 아무도 안 세고 있었기 때문이다. 게이트(pace.check)는 발행을 막고,
  //    이 배지는 그 전에 눈으로 막는다.
  let paceHtml='';
  if(pace){
    const st=pace.state||'ok', n=pace.count||0, hard=pace.hard||2;
    const lab=st==='err'?'⚠️ 오늘 발행량을 못 셌습니다 — '+esc(pace.error||'')
      :st==='block'?'⛔ 오늘 '+n+'편 발행됨 — 오늘은 더 발행하지 마세요(3편 이상 금지)'
      :st==='warn'?'⚠️ 오늘 '+n+'편 발행됨 — 기본 페이스는 하루 1편입니다'
      :'✅ 오늘 '+n+'편 발행 — 하루 1편 기준 안';
    const bg=st==='block'?'#3a1218':st==='warn'?'#3a2f12':st==='err'?'#2a2030':'#0c3a2c';
    const bd=st==='block'?'#7a2230':st==='warn'?'#5a4a1a':st==='err'?'#4a3a5a':'#1f6b52';
    const fg=st==='block'?'#ff9aa6':st==='warn'?'#ffd166':st==='err'?'#c9b6e8':'#8ef0cf';
    const titles=(pace.posts||[]).map(p=>'<div style="opacity:.8;margin-top:2px">· '+esc(p.title||'')+'</div>').join('');
    const lanes=pace.lanes||{};
    const laneTxt=Object.keys(lanes).map(k=>{
      const L=lanes[k]; if(!L) return '';
      return '<span style="display:inline-block;margin-right:9px">'+esc(L.label||k)+' <b>'+(L.n||0)+'</b></span>';
    }).join('');
    const over=pace.backlog_over
      ?'<div style="margin-top:5px;color:#ffd166">📦 발행대기 재고 '+pace.backlog+'편 (상한 '+pace.backlog_max+' 초과) — 재고가 쌓이면 몰아치기 발행을 부릅니다. PREP 초안 생성이 잠긴 상태입니다.</div>'
      :'<div style="margin-top:5px;opacity:.75">📦 발행대기 재고 '+(pace.backlog||0)+'편 / 상한 '+(pace.backlog_max||5)+'</div>';
    const laneRow=laneTxt?'<div style="margin-top:4px;opacity:.8;font-size:11.5px">🛤 레인별: '+laneTxt+'<span style="opacity:.6">(자동 2 + 사용자 창구 1 · 루틴은 1회 1건)</span></div>':'';
    paceHtml='<div style="background:'+bg+';border:1px solid '+bd+';color:'+fg
      +';border-radius:8px;padding:8px 11px;margin:2px 0 9px;font-size:12px;line-height:1.5">'
      +'<b>'+lab+'</b>'+titles+over+laneRow+'</div>';
  }
  const qHtml=paceHtml+(qItems.length
    ?'<div class="cnt">발행 대기 '+qItems.length+'건 — 발행하면 카드가 자동으로 사라집니다(사람 승인 게이트)</div>'+qCards
    :'<div class="pcode none">발행 대기 없음 — PREP 루틴이 준비하면 여기 카드로 뜹니다</div>');
  document.getElementById('board').innerHTML=
   '<div class="hd"><div class="t"><h1>진행현황</h1><span class="date">'+esc(date)+'</span></div>'
   +'<span class="badge '+bcls+'">'+CHECK+esc(blab)+'</span></div>'
   +'<div class="sec">오늘 한 일</div>'+today
   +'<div class="metrics">'
   +'<div class="m"><div class="l">검사 통과</div><div class="v">'+pass+' <small>/ '+total+'</small></div></div>'
   +'<div class="m"><div class="l">블로그 글</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">평균 본문</div><div class="v">'+avg+' <small>자</small></div></div>'
   +'</div>'
   +'<div class="div"></div>'
   +'<div class="sec">📋 발행 대기 (오늘 발행할 글)<span class="auto">🤖 PREP 큐</span></div>'+qHtml
   +'<div class="div"></div>'
   +'<div class="sec">발행 진행 (글 1편 · '+STEPS.length+'단계, 확산 포함)<span class="auto">🤖 자동</span></div>'+pubHtml
   +'<div class="div"></div>'
   +'<div class="sec">📡 4채널 발행 현황 (구글·네이버·쓰레드·인스타)<span class="auto">🤖 DB 자동집계</span></div>'
   +'<div class="metrics">'
   +'<div class="m"><div class="l">구글(원본)</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">네이버</div><div class="v">'+oNv+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">쓰레드</div><div class="v">'+oTh+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">인스타</div><div class="v">'+oIn+' <small>편</small></div></div>'
   +'</div>'
   +'<div class="cnt">확산 커버리지 · 네이버 '+(count?Math.round(oNv/count*100):0)+'% · 쓰레드 '+(count?Math.round(oTh/count*100):0)+'% · 인스타 '+(count?Math.round(oIn/count*100):0)+'% · 교차링크 완료 '+omAll.length+'편</div>'
   +osmuLi
   +'<div class="div"></div>'
   +'<div class="sec">🤝 협업 — 세션별 역할·진행<span class="auto">git 자동분류</span></div>'+collabHtml
   +'<div class="sec">💡 시스템 조언<span class="auto">라이브 도출</span></div>'+adviceHtml
   +'<div class="div"></div>'
   +'<div class="sec">📋 미결 관리 — 4채널 매칭<span class="auto">G구글·N네이버·T쓰레드·I인스타</span></div>'+pendHtml
   +'<div class="sec">다음</div><div class="next">'+next+'</div>'
   +'<div class="upd" id="upd"></div>';
  tick();
}
// 시계·데이터 기준만 갱신(보드 전체 재렌더 없음 — 정적 베이크 데이터라 시계만 변함)
function tick(){
  const el=document.getElementById('upd'); if(!el)return;
  const b=(window.__DATA__||{}).baked_at;
  el.textContent=(b?'데이터 기준 '+b+' · ':'')+new Date().toLocaleTimeString('ko-KR');
}
// 👁 발행 대기 카드 본문 미리보기 — 초안 HTML을 격리 iframe(srcdoc)로 렌더(스타일 누수 차단, Blogger 미접촉)
function qpv(code){
  const items=((window.__DATA__||{}).queue||{}).items||[];
  const it=items.find(x=>x.code===code); if(!it||!it.body)return;
  document.getElementById('qpv-ttl').textContent=(it.code||'')+' · '+(it.title||'');
  document.getElementById('qpv-fr').srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank"><body style="margin:0;padding:16px;background:#fff">'+it.body+'</body>';
  document.getElementById('qpv-ov').classList.add('show');
}
function qpvClose(){document.getElementById('qpv-ov').classList.remove('show');document.getElementById('qpv-fr').srcdoc='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')qpvClose();});
// 코드 자동 반영: 자기 자신(progress.html)을 주기적으로 fetch→해시 비교, 바뀌면 1회 reload
const _hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
let _selfHash=null;
async function checkVersion(){
  try{
    const r=await fetch('progress.html?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;                                // 일시적 404/500에 해시 오염 → 불필요 reload 방지
    const t=await r.text();
    const h=_hash(t);
    if(_selfHash===null){_selfHash=h;return;}      // 첫 호출=기준선 저장
    if(h!==_selfHash) location.reload();            // 코드 변경 감지 → 자동 새로고침
  }catch(e){}
}
load(); checkVersion(); setInterval(tick,5000); setInterval(checkVersion,5000);
</script>
