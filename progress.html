ng:16px 20px;margin:18px 0 26px}\n.lsg .toc b{display:block;font-size:14px;color:#c2502f;margin-bottom:8px}\n.lsg .toc a{display:block;color:#9c4025;text-decoration:none;padding:4px 0;font-size:15px}\n.lsg .cta{display:block;text-align:center;background:linear-gradient(90deg,#E76F51,#e0a13c);color:#fff !important;font-weight:800;font-size:17px;padding:15px 18px;border-radius:12px;text-decoration:none;margin:22px 0}\n.lsg table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:15px}\n.lsg th,.lsg td{border:1px solid #f0d8ce;padding:10px 12px;text-align:center}\n.lsg th{background:#fbe9e1}\n.lsg .tip{background:#fdf1ec;border:1px solid #f6d5c8;border-radius:12px;padding:14px 20px;margin:16px 0}\n.lsg .end{background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:16px 20px;margin-top:24px}\n.lsg .gov{background:#eef4fc;border:1px solid #c8ddf3;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .gov b{display:block;font-size:14px;color:#1b6fc2;margin-bottom:8px}\n.lsg .gov a{display:block;color:#1b4f86;text-decoration:none;padding:6px 0;font-size:15px;font-weight:700}\n.lsg .src{background:#eef6ef;border:1px solid #cfe6d2;border-radius:12px;padding:14px 18px;margin-top:22px;font-size:14px;line-height:1.7;color:#33503a}\n.lsg .src b{display:block;font-size:14px;color:#2e7d4f;margin-bottom:6px}\n.lsg .src a{color:#1b6fc2;text-decoration:none;font-weight:600}\n.lsg .rel{background:#fdf1ec;border:1px solid #f6d5c8;border-radius:12px;padding:14px 20px;margin-top:22px}\n.lsg .rel b{display:block;font-size:14px;color:#c2502f;margin-bottom:8px}\n.lsg .rel a{display:block;color:#9c4025;text-decoration:none;padding:5px 0;font-size:15px;font-weight:600}\n.lsg .top{display:inline-block;font-size:13px;color:#b0a29d;text-decoration:none;margin:2px 0 6px}\n<\/style>\n<div class=\"lsg\" id=\"top\">\n<span class=\"cat\">건강·의료<\/span>\n<p>부모님이 장기요양 등급을 받으셨다면 <b>매달 쓰는 방문요양·주야간보호 한도와는 완전히 별개로, 연 160만 원짜리 복지용구 한도가 하나 더 있습니다.<\/b> 전동침대·수동휠체어·욕창예방매트리스 같은 물건을 이 돈으로 사거나 빌릴 수 있는데, <b>이 한도를 한 번도 안 쓰고 그냥 넘기는 분이 정말 많습니다.<\/b> 게다가 가장 많이 알려진 오해가 하나 있습니다 — <b>\"1월 1일이 되면 한도가 새로 생긴다\"는 말은 사실이 아닙니다.<\/b> 사람마다 갱신되는 날이 다릅니다. 얼마를, 무엇을, 어떤 순서로 받을 수 있는지와 <b>내 한도가 언제 초기화되는지 확인하는 법<\/b>까지 보건복지부 고시 원문 기준으로 정리했습니다.<\/p>\n<div class=\"toc\"><b>📑 목차<\/b><a href=\"#sec1\">1. 복지용구 급여란 — 월 한도액과 뭐가 다른가<\/a><a href=\"#sec2\">2. 대상자와 연 160만 원 한도<\/a><a href=\"#trap\">3. 🔴 함정 — 한도는 1월 1일에 초기화되지 않습니다 (내 갱신일 확인법)<\/a><a href=\"#sec3\">4. 품목별 급여방식·사용가능햇수·급여한도 (고시 원표)<\/a><a href=\"#calc\">5. 본인부담금 계산 — 15% · 9% · 6% · 면제<\/a><a href=\"#sim\">6. 연 160만 원 어떻게 쓰나 — 한도 소진 시뮬레이션<\/a><a href=\"#choice\">7. 구입할까 대여할까 — 판단 기준<\/a><a href=\"#sec4\">8. 신청 방법과 절차<\/a><a href=\"#deny\">9. 급여를 못 받거나 환수되는 8가지 경우<\/a><a href=\"#sec5\">10. 놓치기 쉬운 함정 5가지<\/a><a href=\"#faq\">11. 자주 묻는 질문<\/a><a href=\"#gov\">공식 확인 페이지<\/a><\/div>\n<a class=\"cta\" href=\"#trap\">👉 내 복지용구 한도 갱신일부터 확인하기<\/a>\n\n<h2 id=\"sec1\">1. 복지용구 급여란 — 월 한도액과 뭐가 다른가<\/h2>\n<p><b>복지용구 급여<\/b>는 노인장기요양보험의 <b>'기타재가급여'<\/b>로, 수급자의 일상생활·신체활동을 돕는 용구를 <b>구입<\/b>하거나 <b>대여<\/b>할 때 공단이 비용의 대부분을 부담해 주는 제도입니다.<\/p>\n<p>여기서 가장 먼저 정리해야 할 것이 있습니다. <b>방문요양·방문목욕·주야간보호에 쓰는 '월 한도액'과 복지용구 한도는 전혀 다른 주머니입니다.<\/b> 국민건강보험공단은 월 한도액을 안내하면서 항목명을 아예 <b>\"재가급여(복지용구 제외)의 월 한도액\"<\/b>이라고 못박아 두었습니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>재가급여 월 한도액<br>(복지용구 제외)<\/th><th>복지용구 연 한도액<\/th><\/tr>\n<tr><td>기간<\/td><td><b>매월<\/b><\/td><td><b>1년<\/b><\/td><\/tr>\n<tr><td>금액<\/td><td>등급별 (1등급 251만 원대 ~ 인지지원등급 67만 원대)<\/td><td><b>1인당 연 160만 원<\/b> (등급 무관 동일)<\/td><\/tr>\n<tr><td>쓰는 곳<\/td><td>방문요양·방문목욕·방문간호·주야간보호·단기보호<\/td><td>복지용구 <b>구입 + 대여<\/b><\/td><\/tr>\n<tr><td>서로 영향<\/td><td colspan=\"2\"><b>없음 — 별도로 씁니다<\/b><\/td><\/tr>\n<\/table>\n<p>참고로 2026년 1월 1일 기준 재가급여(복지용구 제외) 월 한도액은 <b>1등급 2,512,900원 · 2등급 2,331,200원 · 3등급 1,528,200원 · 4등급 1,409,700원 · 5등급 1,208,900원 · 인지지원등급 676,320원<\/b>입니다.<\/p>\n<div class=\"tip\"><b>💡 핵심 한 줄<\/b><p style=\"margin:8px 0 0\">방문요양을 한도까지 꽉 채워 쓰고 있어도 <b>복지용구 160만 원은 그대로 남아 있습니다.<\/b> 둘은 서로 깎아먹지 않습니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec2\">2. 대상자와 연 160만 원 한도<\/h2>\n<h3>누가 받을 수 있나<\/h3>\n<p>장기요양인정을 받은 <b>재가 수급자<\/b>입니다. <b>1~5등급은 물론 인지지원등급도 대상입니다<\/b> — 인지지원등급이 이용할 수 있는 급여에 <b>기타재가급여(복지용구급여)<\/b>가 포함되기 때문입니다. 다만 아래 두 경우는 제한됩니다.<\/p>\n<ul>\n<li><b>요양원 등 시설급여를 이용(입소)하는 기간<\/b> — 복지용구 급여가 제한됩니다.<\/li>\n<li><b>의료기관에 입원한 기간<\/b> — 전동침대·수동침대·이동욕조·목욕리프트는 이용할 수 없습니다.<\/li>\n<\/ul>\n<h3>한도는 얼마인가<\/h3>\n<p>고시 제3조는 이렇게 정하고 있습니다.<\/p>\n<ul>\n<li>연 한도액은 <b>수급자 1인당 연간 160만 원<\/b>.<\/li>\n<li>이 160만 원은 <b>공단부담금 + 본인부담금을 합친 금액<\/b>입니다. 내 돈 160만 원이 아니라, <b>총 급여비용 기준<\/b>이라는 뜻입니다.<\/li>\n<li><b>구입과 대여를 합산<\/b>해서 계산합니다.<\/li>\n<li>한도를 넘는 금액은 <b>전액 본인 부담<\/b>입니다.<\/li>\n<\/ul>\n<div class=\"tip\"><b>⚠️ 자주 하는 착각<\/b><p style=\"margin:8px 0 0\">\"160만 원어치 내 돈을 쓸 수 있다\"가 아닙니다. <b>제품 가격 총액이 160만 원<\/b>이고, 그중 <b>내가 내는 건 15%(감경 대상이면 9%·6%, 의료급여 수급자는 0%)<\/b>입니다. 한도를 다 쓰면 실제 본인 지출은 <b>24만 원 안팎<\/b>입니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"trap\">3. 🔴 함정 — 한도는 1월 1일에 초기화되지 않습니다<\/h2>\n<p>인터넷에서 가장 흔하게 도는 잘못된 설명이 <b>\"연말이 다가오니 남은 한도를 쓰세요, 1월 1일이면 초기화됩니다\"<\/b>입니다. <b>사실이 아닙니다.<\/b><\/p>\n<p>고시 제3조 제2항은 연 한도액의 적용기간을 이렇게 규정합니다.<\/p>\n<div class=\"tip\"><b>📜 고시 원문 취지<\/b><p style=\"margin:8px 0 0\">연 한도액(공단부담금+본인부담금)의 적용기간은 <b>최초 장기요양인정 유효기간 개시일로부터 매 1년<\/b>으로 한다. 다만 유효기간 만료 후 <b>1년 이상 경과<\/b>되어 다시 수급자가 된 경우에는 <b>다시 인정받은 유효기간 개시일<\/b>부터 적용한다.<\/p><\/div>\n<p>즉 <b>어머니가 3월 12일에 등급을 받으셨다면 그분의 복지용구 1년은 3월 12일 ~ 다음 해 3월 11일<\/b>입니다. 옆집 어르신이 9월에 등급을 받으셨다면 그분은 9월 기준입니다. <b>달력의 1월 1일과는 아무 상관이 없습니다.<\/b><\/p>\n<h3>이 오해가 왜 손해로 이어지나<\/h3>\n<ul>\n<li><b>12월에 급하게 몰아 쓰는 경우<\/b> — 내 갱신일이 이미 지났다면 그건 새 해 한도를 앞당겨 쓰는 것일 뿐, 아낀 게 없습니다.<\/li>\n<li><b>반대로 더 위험한 경우<\/b> — 갱신일이 두 달 뒤인 줄 모르고 \"어차피 내년에 쓰지\" 하며 미루는 것입니다. <b>적용기간이 새로 시작되면 한도도 160만 원에서 새로 계산<\/b>되므로, 그 전에 안 쓴 잔액은 <b>다음 기간에 더해지지 않습니다.<\/b><\/li>\n<\/ul>\n<h3>내 한도 갱신일 확인하는 법 (3가지)<\/h3>\n<table>\n<tr><th>방법<\/th><th>어디를 보나<\/th><\/tr>\n<tr><td><b>① 복지용구 급여확인서<\/b><\/td><td>공단이 장기요양인정서와 <b>함께 보내주는 서류<\/b>. 표 안에 <b>'연한도액 적용구간'<\/b> 항목이 있어 <b>내 1년이 언제부터 언제까지인지 날짜로 찍혀 있습니다.<\/b><\/td><\/tr>\n<tr><td><b>② 장기요양인정서<\/b><\/td><td>기재된 <b>유효기간 개시일<\/b>이 기준일입니다.<\/td><\/tr>\n<tr><td><b>③ 공단 문의<\/b><\/td><td>국민건강보험공단 <b>☎ 1577-1000<\/b> 또는 관할 운영센터. 남은 한도까지 함께 확인할 수 있습니다.<\/td><\/tr>\n<\/table>\n<p>같은 급여확인서에는 <b>내가 쓸 수 있는 품목<\/b>과 <b>이미 제공받은 복지용구<\/b>도 같이 적혀 있습니다. <b>이 종이 한 장이 복지용구의 모든 답을 갖고 있습니다.<\/b> 서랍에서 먼저 찾아보세요.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec3\">4. 품목별 급여방식·사용가능햇수·급여한도<\/h2>\n<p>2024년 12월 16일 개정 고시부터 <b>'내구연한'이라는 용어가 '사용가능햇수'로 바뀌었습니다.<\/b> 뜻은 같습니다 — <b>그 햇수 안에는 같은 품목을 1개만 사거나 빌릴 수 있다<\/b>는 의미입니다. 아래는 고시 [별표2]의 급여기준표입니다.<\/p>\n<table>\n<tr><th>급여방식<\/th><th>품목명<\/th><th>사용가능햇수<br>(내구연한)<\/th><th>급여한도<\/th><\/tr>\n<tr><td rowspan=\"11\"><b>구입<\/b><\/td><td>이동변기<\/td><td>5년<\/td><td>1개<\/td><\/tr>\n<tr><td>목욕의자<\/td><td>5년<\/td><td>1개<\/td><\/tr>\n<tr><td>성인용보행기<\/td><td>5년<\/td><td><b>2개<\/b><\/td><\/tr>\n<tr><td>안전손잡이<\/td><td>—<\/td><td><b>10개<\/b><\/td><\/tr>\n<tr><td>미끄럼방지용품 – 양말<\/td><td>—<\/td><td>6켤레<\/td><\/tr>\n<tr><td>미끄럼방지용품 – 매트·액<\/td><td>—<\/td><td>5개<\/td><\/tr>\n<tr><td>간이변기(대변기·소변기)<\/td><td>—<\/td><td>2개<\/td><\/tr>\n<tr><td>지팡이<\/td><td>2년<\/td><td>1개<\/td><\/tr>\n<tr><td>욕창예방방석<\/td><td>3년<\/td><td>1개<\/td><\/tr>\n<tr><td>자세변환용구<\/td><td>—<\/td><td>5개<\/td><\/tr>\n<tr><td>요실금팬티<\/td><td>—<\/td><td>4개<\/td><\/tr>\n<tr><td rowspan=\"6\"><b>대여<\/b><\/td><td>수동휠체어<\/td><td>5년<\/td><td>1개<\/td><\/tr>\n<tr><td>전동침대<\/td><td>10년<\/td><td>1개<\/td><\/tr>\n<tr><td>수동침대<\/td><td>10년<\/td><td>1개<\/td><\/tr>\n<tr><td>이동욕조<\/td><td>5년<\/td><td>1개<\/td><\/tr>\n<tr><td>목욕리프트<\/td><td>3년<\/td><td>1개<\/td><\/tr>\n<tr><td>배회감지기<\/td><td>5년<\/td><td>1개<\/td><\/tr>\n<tr><td rowspan=\"3\"><b>구입 또는<br>대여<\/b><\/td><td>욕창예방매트리스<\/td><td>3년<\/td><td>1개<\/td><\/tr>\n<tr><td>경사로 – 실외용(대여)<\/td><td>8년<\/td><td>1개<\/td><\/tr>\n<tr><td>경사로 – 실내용(구입)<\/td><td>2년<\/td><td><b>6개<\/b><\/td><\/tr>\n<\/table>\n<h3>표를 읽을 때 꼭 알아야 할 규칙<\/h3>\n<ul>\n<li><b>사용가능햇수가 '—'인 품목<\/b>(안전손잡이·미끄럼방지용품·간이변기·자세변환용구·요실금팬티)은 <b>연 한도액 적용기간(내 1년) 동안<\/b> 표에 적힌 개수까지 살 수 있습니다.<\/li>\n<li><b>전동침대와 수동침대는 '같은 품목'으로 봅니다.<\/b> 둘 중 하나만 빌릴 수 있습니다.<\/li>\n<li><b>'구입 또는 대여' 품목은 구입과 대여를 동시에 할 수 없습니다.<\/b> 단 <b>경사로만 예외<\/b>로, 실내용은 구입·실외용은 대여만 가능하며 <b>둘을 동시에 이용할 수 있습니다.<\/b><\/li>\n<li>대여 제품은 사용가능햇수가 지났더라도 외형·작동에 이상이 없으면 <b>그 햇수의 1/2 범위 안에서 연장 대여<\/b>가 가능합니다.<\/li>\n<li>산 제품이 사용가능햇수 안에 <b>훼손·마모<\/b>되거나 <b>몸 상태가 변해<\/b> 못 쓰게 되면, <b>'복지용구 추가급여신청서'(고시 별지 제2호서식)<\/b>를 공단에 내고 확인받으면 <b>햇수 안이라도 다시 급여를 받을 수 있습니다.<\/b><\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"calc\">5. 본인부담금 계산 — 15% · 9% · 6% · 면제<\/h2>\n<p>복지용구는 재가급여이므로 <b>기본 본인부담률은 15%<\/b>입니다(노인장기요양보험법 제40조). 여기에 소득·재산에 따른 <b>감경<\/b>이 붙습니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>대상<\/th><th>재가급여 본인부담률<\/th><\/tr>\n<tr><td><b>일반<\/b><\/td><td>감경 대상이 아닌 수급자<\/td><td><b>15%<\/b><\/td><\/tr>\n<tr><td><b>40% 감경<\/b><\/td><td>건강보험료 순위 <b>25% 초과 ~ 50% 이하<\/b><br>(직장가입자는 재산과표 요건 충족)<\/td><td><b>9%<\/b><\/td><\/tr>\n<tr><td><b>60% 감경<\/b><\/td><td>건강보험료 순위 <b>0 ~ 25% 이하<\/b><br>차상위 희귀난치성·만성질환자 포함<\/td><td><b>6%<\/b><\/td><\/tr>\n<tr><td><b>면제<\/b><\/td><td>「국민기초생활 보장법」에 따른 <b>의료급여 수급자<\/b><\/td><td><b>0%<\/b><\/td><\/tr>\n<\/table>\n<h3>같은 제품이라도 내가 내는 돈은 이만큼 다릅니다<\/h3>\n<p>총 급여비용이 <b>연 160만 원(한도 전액 사용)<\/b>일 때 실제 본인 지출은 이렇게 갈립니다.<\/p>\n<table>\n<tr><th>구분<\/th><th>부담률<\/th><th>연간 본인부담액<\/th><th>공단이 내주는 돈<\/th><\/tr>\n<tr><td>일반<\/td><td>15%<\/td><td><b>240,000원<\/b><\/td><td>1,360,000원<\/td><\/tr>\n<tr><td>40% 감경<\/td><td>9%<\/td><td><b>144,000원<\/b><\/td><td>1,456,000원<\/td><\/tr>\n<tr><td>60% 감경<\/td><td>6%<\/td><td><b>96,000원<\/b><\/td><td>1,504,000원<\/td><\/tr>\n<tr><td>의료급여 수급자<\/td><td>0%<\/td><td><b>0원<\/b><\/td><td>1,600,000원<\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>💡 감경은 신청하지 않아도 적용됩니다<\/b><p style=\"margin:8px 0 0\">공단은 보유한 건강보험료 자료로 <b>직권으로 감경을 적용<\/b>합니다. 다만 피부양자 자격 변동이나 재산과표 불일치 등 <b>공단 쪽 사유로 감경이 빠진 경우<\/b>에는 <b>본인이 감경 신청<\/b>을 할 수 있고, 처리 결과는 <b>14일 이내<\/b>에 통보됩니다. 내 부담률이 궁금하면 <b>'개인별장기요양이용계획서'의 본인부담률<\/b>을 보면 됩니다.<\/p><\/div>\n<p style=\"font-size:14px;color:#666\">※ 감경 판정 기준이 되는 보험료 구간표는 <b>매년 2월에 갱신<\/b>됩니다(현재 적용분은 2026년 2월 ~ 2027년 1월). 지역가입자는 월별 보험료액과 가입자 수로, 직장가입자는 보험료액·가입자 수·재산과표액을 함께 봅니다.<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sim\">6. 연 160만 원 어떻게 쓰나 — 한도 소진 시뮬레이션<\/h2>\n<p>말로만 들으면 감이 안 오니, <b>거동이 불편해 침대 생활을 하시는 어르신<\/b>을 가정해 1년을 시뮬레이션해 보겠습니다.<\/p>\n<p style=\"font-size:14px;color:#666\">※ 아래 제품 가격은 <b>계산 방식을 보여주기 위한 가정값<\/b>입니다. 실제 구입가·월 대여료는 제품마다 「복지용구 품목별 제품목록 및 급여비용 등에 관한 고시」로 따로 정해져 있고 수시로 바뀌므로, <b>복지용구사업소나 공단에서 확인<\/b>하셔야 합니다.<\/p>\n<table>\n<tr><th>시기<\/th><th>이용 내용<\/th><th>급여비용(가정)<\/th><th>한도 잔액<\/th><\/tr>\n<tr><td>1개월차<\/td><td>전동침대 <b>대여<\/b> 시작 (월 10만 원 가정 × 12개월)<\/td><td>1,200,000원<\/td><td>400,000원<\/td><\/tr>\n<tr><td>1개월차<\/td><td>욕창예방매트리스 <b>대여<\/b> (월 1만 원 가정 × 12개월)<\/td><td>120,000원<\/td><td>280,000원<\/td><\/tr>\n<tr><td>2개월차<\/td><td>이동변기 <b>구입<\/b><\/td><td>170,000원<\/td><td>110,000원<\/td><\/tr>\n<tr><td>4개월차<\/td><td>자세변환용구 2개 <b>구입<\/b><\/td><td>60,000원<\/td><td>50,000원<\/td><\/tr>\n<tr><td>7개월차<\/td><td>안전손잡이 3개 <b>구입<\/b><\/td><td>50,000원<\/td><td><b>0원<\/b><\/td><\/tr>\n<tr><td colspan=\"2\"><b>합계 (총 급여비용)<\/b><\/td><td colspan=\"2\"><b>1,600,000원 = 한도 전액<\/b><\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>📐 이 경우 실제 내 지갑에서 나가는 돈<\/b>\n<p style=\"margin:8px 0 0\"><b>일반(15%)<\/b> → 1,600,000 × 0.15 = <b>연 24만 원<\/b> (월평균 2만 원)<br>\n<b>40% 감경(9%)<\/b> → <b>연 14만 4천 원<\/b><br>\n<b>60% 감경(6%)<\/b> → <b>연 9만 6천 원<\/b><br>\n<b>의료급여 수급자<\/b> → <b>0원<\/b><\/p>\n<p style=\"margin:10px 0 0\">같은 물건을 급여 없이 직접 마련한다면 총 160만 원을 그대로 부담해야 합니다. <b>제도를 아는 것과 모르는 것의 차이가 연 130만 원 이상<\/b>입니다.<\/p><\/div>\n<h3>대여료는 이렇게 계산됩니다 (알아두면 손해를 막습니다)<\/h3>\n<ul>\n<li>대여가격은 <b>월 단위<\/b>로 산정하며, 여기서 '월'은 <b>매월 1일부터 말일까지<\/b>입니다.<\/li>\n<li>월 중간에 시작하거나 끝나면 <b>일자별로<\/b> 계산합니다. 다만 <b>연속 대여일수가 15일 미만이면 월 15일로 산정<\/b>할 수 있습니다.<\/li>\n<li>대여 중 수급자가 <b>사망<\/b>한 경우, <b>사망일 다음 날부터 최대 7일까지<\/b>만 대여가격이 산정됩니다.<\/li>\n<li>대여 중 <b>의료기관에 입원<\/b>한 경우, 입원 기간 중 <b>최대 15일까지<\/b> 대여가격을 산정할 수 있습니다.<\/li>\n<\/ul>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"choice\">7. 구입할까 대여할까 — 판단 기준<\/h2>\n<p><b>욕창예방매트리스<\/b>와 <b>경사로<\/b>는 구입과 대여 중 고를 수 있습니다. 무엇을 고르느냐에 따라 <b>한도가 닳는 속도<\/b>가 완전히 달라집니다.<\/p>\n<table>\n<tr><th>판단 항목<\/th><th>구입이 유리<\/th><th>대여가 유리<\/th><\/tr>\n<tr><td>예상 사용 기간<\/td><td><b>사용가능햇수를 채워 오래<\/b> 쓸 것으로 보일 때<\/td><td>몇 달만 쓰고 끝날 가능성이 있을 때<br>(회복·수술 후 일시적 사용 등)<\/td><\/tr>\n<tr><td>한도 소진<\/td><td>한 번에 크게 빠지지만 <b>이후 해에는 안 빠짐<\/b><\/td><td>매달 조금씩 <b>계속 빠짐<\/b> — 장기 대여는 누적이 큼<\/td><\/tr>\n<tr><td>고장·수리<\/td><td>본인이 관리<\/td><td><b>사업소가 수리·부품 교체 책임<\/b><\/td><\/tr>\n<tr><td>위생<\/td><td>내 것<\/td><td>사업소가 <b>소독 지침에 따라 세정·소독한 제품만<\/b> 제공<\/td><\/tr>\n<tr><td>몸 상태 변화<\/td><td>맞지 않게 되면 처치 곤란<\/td><td><b>반납·교체가 쉬움<\/b><\/td><\/tr>\n<\/table>\n<div class=\"tip\"><b>🧭 이렇게 판단하세요<\/b><p style=\"margin:8px 0 0\"><b>1년 이상 계속 쓸 것이 분명하고 몸 상태가 안정적<\/b>이면 → <b>구입<\/b>이 한도 관리에 유리합니다.<br><b>병세 변화가 크거나 회복 후 필요 없어질 수 있다면<\/b> → <b>대여<\/b>가 안전합니다. 매트리스처럼 위생 관리가 부담스러운 품목도 대여 쪽이 편합니다.<br>※ <b>전동침대·수동침대는 대여만 가능<\/b>합니다(둘은 같은 품목이라 하나만).<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec4\">8. 신청 방법과 절차<\/h2>\n<ol>\n<li><b>장기요양등급을 먼저 받습니다.<\/b> 등급이 없으면 복지용구도 없습니다. (등급 신청은 공단 지사·홈페이지)<\/li>\n<li><b>'복지용구 급여확인서'를 확인합니다.<\/b> 공단이 장기요양인정서를 보낼 때 함께 보냅니다. 여기에 <b>내가 쓸 수 있는 품목<\/b>과 <b>연한도액 적용구간<\/b>이 적혀 있습니다.<\/li>\n<li><b>복지용구사업소를 찾아갑니다.<\/b> 복지용구는 <b>공단에 지정된 '복지용구사업소'를 통해서만<\/b> 제공됩니다. 사업소는 노인장기요양보험 홈페이지 '검색 → 장기요양기관 찾기'에서 조회할 수 있습니다.<\/li>\n<li><b>급여확인서에 있는 품목을<\/b> 구입하거나 대여합니다. 본인부담금(15%·9%·6%·0%)만 결제하면 나머지는 공단이 사업소에 지급합니다.<\/li>\n<li><b>품목을 바꾸고 싶으면<\/b> '복지용구 추가급여신청서'(별지 제2호서식)를 공단에 제출합니다. 몸 상태 변화가 인정되면 <b>급여확인서가 새로 발급<\/b>됩니다.<\/li>\n<\/ol>\n<div class=\"tip\"><b>⚠️ 사업소가 이런 돈을 요구하면 잘못된 것입니다<\/b><p style=\"margin:8px 0 0\">고시 제6조는 복지용구 가격에 <b>배송비 · 설치·철거비 · 수리 및 부품 교체료 · 세정 및 소독비용이 모두 포함<\/b>되어 있으므로 <b>별도로 산정하거나 수급자에게 부담시킬 수 없다<\/b>고 명시합니다. \"배송비는 따로 주셔야 한다\"는 요구는 근거가 없습니다.<\/p><p style=\"margin:8px 0 0\">반대로 <b>본인부담금을 안 받겠다거나 물건·상품권을 주겠다는 사업소<\/b>도 조심하세요. 공단은 그런 유인·알선 행위가 확인되면 <b>현지확인심사<\/b>를 거쳐 지급합니다. 결국 이용자에게도 불편이 돌아옵니다.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"deny\">9. 급여를 못 받거나 환수되는 8가지 경우<\/h2>\n<p>복지용구는 \"160만 원 안에서 아무거나\"가 아닙니다. <b>거절되는 경우가 생각보다 많습니다.<\/b><\/p>\n<table>\n<tr><th>#<\/th><th>이런 경우<\/th><th>왜 안 되나<\/th><\/tr>\n<tr><td>1<\/td><td><b>급여확인서에 없는 품목<\/b>을 사려 할 때<\/td><td>공단이 인정조사 결과로 <b>'사용이 불필요'<\/b>하다고 판정한 품목은 제공 자체가 안 됩니다<\/td><\/tr>\n<tr><td>2<\/td><td><b>요양원 등 시설급여 입소 기간<\/b><\/td><td>시설급여 기간 중에는 복지용구 급여가 제한됩니다<\/td><\/tr>\n<tr><td>3<\/td><td><b>병원 입원 중<\/b> 전동·수동침대, 이동욕조, 목욕리프트<\/td><td>입원 기간에는 이용 불가 — 대여 중이었다면 <b>15일 이내 반납<\/b><\/td><\/tr>\n<tr><td>4<\/td><td><b>복지용구사업소가 아닌 곳<\/b>(일반 쇼핑몰·의료기기 판매점)에서 구입<\/td><td>급여는 <b>지정 사업소를 통해서만<\/b> 제공됩니다<\/td><\/tr>\n<tr><td>5<\/td><td><b>사용가능햇수 안에 같은 품목 재구입<\/b><\/td><td>햇수 내 품목당 1개 원칙(단 훼손·마모·신체상태 변화는 추가급여신청서로 예외)<\/td><\/tr>\n<tr><td>6<\/td><td><b>타 법령으로 이미 지급받은 동일 품목<\/b><\/td><td>장애인보조기기 등으로 이미 받은 품목은 <b>그 사용가능햇수 동안<\/b> 중복 급여 불가<\/td><\/tr>\n<tr><td>7<\/td><td><b>'구입 또는 대여' 품목을 동시에<\/b> 구입+대여<\/td><td>동시 이용 금지(경사로 실내구입+실외대여만 예외)<\/td><\/tr>\n<tr><td>8<\/td><td><b>연 160만 원 초과분<\/b><\/td><td>초과 금액은 <b>전액 본인 부담<\/b><\/td><\/tr>\n<\/table>\n<h3>1번이 가장 억울한 사례입니다 — '사용이 불필요' 판정이란<\/h3>\n<p>고시 [별표3]은 품목마다 <b>\"이런 몸 상태면 이 품목은 필요 없다\"<\/b>는 판정기준을 정해 두었습니다. 장기요양인정조사표의 신체기능·재활·간호처치 영역 점수로 기계적으로 판단합니다. 예를 들면 이렇습니다.<\/p>\n<ul>\n<li><b>이동변기<\/b> — 변의를 느끼지 못하거나, 완전와상으로 항상 기저귀를 착용해야 하는 상태<\/li>\n<li><b>목욕의자<\/b> — 완전와상으로 앉은 자세를 유지할 수 없는 상태<\/li>\n<li><b>전동침대·수동침대<\/b> — 집안에서 <b>스스로 이동이 가능한<\/b> 상태<\/li>\n<li><b>성인용보행기·지팡이<\/b> — 양측 상지를 쓸 수 없어 잡을 수 없거나, 양측 하지를 쓸 수 없어 일어설 수 없는 상태<\/li>\n<li><b>욕창예방매트리스<\/b> — 스스로 체위변경·일어나 앉기·옮겨 앉기가 가능하고 <b>욕창이 없는<\/b> 상태<\/li>\n<\/ul>\n<p>읽어 보면 방향이 두 갈래인 게 보입니다. <b>너무 건강해서 필요 없는 경우<\/b>와 <b>너무 위중해서 그 물건으로는 해결이 안 되는 경우<\/b> 양쪽 모두 제외됩니다. 그래서 <b>\"우리 어머니가 더 힘드신데 왜 안 되냐\"는 상황이 실제로 생깁니다.<\/b><\/p>\n<div class=\"tip\"><b>✅ 대응 방법<\/b><p style=\"margin:8px 0 0\">판정은 <b>인정조사 시점의 몸 상태<\/b> 기준입니다. 그 뒤 상태가 달라졌다면 <b>'복지용구 추가급여신청서'<\/b>를 내고 공단 확인을 받으면 <b>품목을 다시 정해 급여확인서가 새로 발급<\/b>됩니다. 포기하지 말고 관할 운영센터에 상태 변화를 알리세요.<\/p><\/div>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"sec5\">10. 놓치기 쉬운 함정 5가지<\/h2>\n<ol>\n<li><b>한도는 1월 1일이 아니라 '내 유효기간 개시일'에 갱신됩니다.<\/b> (§3 참고) 새 기간이 시작되면 한도는 <b>160만 원에서 새로 계산<\/b>되므로, 안 쓴 잔액이 <b>다음 기간에 더해지지 않습니다.<\/b><\/li>\n<li><b>160만 원은 내 돈이 아니라 총 급여비용입니다.<\/b> 실제 본인 지출은 그 15%(감경 시 9%·6%, 의료급여 수급자 0%)입니다.<\/li>\n<li><b>등급 갱신 때 쓰던 품목이 '불필요'로 바뀔 수 있습니다.<\/b> 급여확인서에도 이 점이 유의사항으로 적혀 있습니다. 갱신 후 급여확인서를 반드시 다시 읽어 보세요.<\/li>\n<li><b>배송비·설치비·소독비를 따로 요구하는 건 근거가 없습니다.<\/b> 가격에 이미 포함돼 있습니다.<\/li>\n<li><b>전동침대와 수동침대는 같은 품목<\/b>이라 하나만 됩니다. 사용가능햇수도 <b>10년<\/b>으로 길어, 한 번 정하면 오래 갑니다. <b>고르기 전에 어르신 상태를 사업소와 충분히 상의하세요.<\/b><\/li>\n<\/ol>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"faq\">11. 자주 묻는 질문<\/h2>\n<h3>Q. 등급을 이번 달에 처음 받았습니다. 한도 160만 원을 지금 다 써도 되나요?<\/h3>\n<p>됩니다. 한도는 <b>기간 안에 얼마를 쓰든 자유<\/b>이며 매달 나눠 쓸 필요가 없습니다. 다만 대여는 매달 비용이 쌓이므로, <b>1년 치 대여료를 먼저 계산<\/b>해 두고 남는 금액으로 구입 품목을 정하는 순서가 안전합니다.<\/p>\n<h3>Q. 재가급여 월 한도액을 다 써버렸는데 복지용구도 못 받나요?<\/h3>\n<p>아닙니다. <b>완전히 별개입니다.<\/b> 공단도 월 한도액을 안내할 때 <b>\"재가급여(복지용구 제외)\"<\/b>라고 표기합니다.<\/p>\n<h3>Q. 요양원에 들어가면 쓰던 복지용구는 어떻게 되나요?<\/h3>\n<p><b>시설급여 입소 기간 중에는 복지용구 급여가 제한<\/b>됩니다. 재가급여와 시설급여는 동시에 이용할 수 없으므로, 입소 전에 <b>대여 중인 제품은 반납<\/b>하셔야 합니다.<\/p>\n<h3>Q. 병원에 잠깐 입원했는데 빌린 전동침대를 바로 반납해야 하나요?<\/h3>\n<p>급여확인서 유의사항은 <b>입원 시 전동침대·수동침대·이동욕조·목욕리프트를 15일 이내에 반납<\/b>하도록 안내합니다. 대여료도 입원 기간 중 <b>최대 15일까지만<\/b> 산정됩니다.<\/p>\n<h3>Q. 산 지 2년 된 이동변기가 부서졌습니다. 사용가능햇수(5년)가 남았는데 못 사나요?<\/h3>\n<p>살 수 있습니다. <b>'복지용구 추가급여신청서'(별지 제2호서식)<\/b>를 공단에 제출하고 훼손 사실을 확인받으면 <b>햇수 이내라도 급여가 제공<\/b>됩니다.<\/p>\n<h3>Q. 인터넷에서 훨씬 싼 걸 봤는데 거기서 사도 되나요?<\/h3>\n<p>그 경우 <b>급여가 적용되지 않습니다<\/b>(전액 본인 부담). 복지용구 급여는 <b>공단이 지정한 복지용구사업소<\/b>를 통해서만 제공됩니다. 급여로 사면 어차피 <b>정가의 15%(또는 그 이하)<\/b>만 내므로 대부분 급여 쪽이 저렴합니다.<\/p>\n<h3>Q. 내가 감경 대상인지 어떻게 아나요?<\/h3>\n<p><b>'개인별장기요양이용계획서'의 본인부담률<\/b>을 보면 바로 알 수 있습니다. 감경은 공단이 <b>직권으로<\/b> 적용하며, 자료 불일치 등으로 빠졌다면 관할 운영센터에 <b>감경 신청<\/b>을 할 수 있습니다(결과 통보 14일 이내).<\/p>\n<a class=\"top\" href=\"#top\">▲ 맨 위로<\/a>\n\n<h2 id=\"gov\">공식 확인 페이지<\/h2>\n<div class=\"gov\"><b>🏛️ 공식 안내 바로가기<\/b><a href=\"https://www.longtermcare.or.kr/npbs/e/b/504/npeb504m01.web?menuId=npe0000000400\" target=\"_blank\" rel=\"nofollow\">▸ 노인장기요양보험 — 월 한도액 및 급여비용 (2026.1.1. 기준)<\/a><a href=\"https://www.longtermcare.or.kr/npbs/e/b/503/npeb503m01.web?menuId=npe0000002743\" target=\"_blank\" rel=\"nofollow\">▸ 노인장기요양보험 — 본인부담금 감경 기준<\/a><a href=\"https://www.law.go.kr/admRulLsInfoP.do?admRulSeq=2100000250742\" target=\"_blank\" rel=\"nofollow\">▸ 국가법령정보센터 — 복지용구 급여범위 및 급여기준 등에 관한 고시<\/a><a href=\"https://www.mohw.go.kr/board.es?mid=a10409020000&amp;bid=0026&amp;list_no=1483908&amp;act=view\" target=\"_blank\" rel=\"nofollow\">▸ 보건복지부 — 고시 제2024-253호 개정 전문<\/a><a href=\"https://www.easylaw.go.kr/CSP/OnhunqueansInfoRetrieve.laf?onhunqnaAstSeq=97&amp;onhunqueSeq=6499\" target=\"_blank\" rel=\"nofollow\">▸ 찾기쉬운 생활법령정보 — 장기요양등급별 이용 가능 급여<\/a><a href=\"https://www.bokjiro.go.kr\" target=\"_blank\" rel=\"nofollow\">▸ 복지로 — 노인 돌봄·요양 서비스 안내<\/a><\/div>\n\n<div class=\"end\"><b>✅ 마무리<\/b><p style=\"margin:8px 0 0\">정리하면 <b>①복지용구 연 160만 원은 방문요양 월 한도와 별개의 주머니이고 ②그 1년은 1월 1일이 아니라 내 장기요양인정 유효기간 개시일부터 세며 ③실제 내 부담은 그 15%(감경 시 9%·6%, 의료급여 수급자 0%)이고 ④쓸 수 있는 품목은 급여확인서에 이미 정해져 있습니다.<\/b> 오늘 할 일은 딱 하나입니다 — <b>서랍에서 '복지용구 급여확인서'를 찾아 '연한도액 적용구간' 날짜부터 확인<\/b>하세요. 남은 기간과 남은 한도를 알면 그다음은 사업소에서 상의하면 됩니다. 서류가 안 보이면 <b>공단 ☎1577-1000<\/b>으로 남은 한도까지 한 번에 확인할 수 있습니다.<\/p><\/div>\n\n<div class=\"src\"><b>📌 정보 기준 · 출처<\/b>이 글은 <b style=\"display:inline;color:#33503a;margin:0\">2026년 7월<\/b> 기준이며, 품목·사용가능햇수·급여한도는 <b style=\"display:inline;color:#33503a;margin:0\">「복지용구 급여범위 및 급여기준 등에 관한 고시」(보건복지부고시 제2024-253호, 2024.12.16. 시행)<\/b> 원문을, 본인부담률·감경 기준은 <b style=\"display:inline;color:#33503a;margin:0\">국민건강보험공단 노인장기요양보험 공식 안내<\/b>를 직접 확인해 정리했습니다. 개별 제품의 구입가·월 대여료는 「복지용구 품목별 제품목록 및 급여비용 등에 관한 고시」로 제품마다 따로 정해지고 수시로 개정되므로, 본문 §6의 금액은 <b style=\"display:inline;color:#33503a;margin:0\">계산 방식을 보여주기 위한 가정값<\/b>입니다. 실제 금액은 복지용구사업소 또는 공단에서 확인하세요.<br>출처: <a href=\"https://www.law.go.kr/admRulLsInfoP.do?admRulSeq=2100000250742\">국가법령정보센터 — 복지용구 급여범위 및 급여기준 등에 관한 고시<\/a>, <a href=\"https://www.mohw.go.kr/board.es?mid=a10409020000&amp;bid=0026&amp;list_no=1483908&amp;act=view\">보건복지부 — 고시 제2024-253호 개정 전문(별표1~3·별지 서식 포함)<\/a>, <a href=\"https://www.longtermcare.or.kr/npbs/e/b/504/npeb504m01.web?menuId=npe0000000400\">국민건강보험공단 노인장기요양보험 — 월 한도액 및 급여비용(2026.1.1. 기준)<\/a>, <a href=\"https://www.longtermcare.or.kr/npbs/e/b/503/npeb503m01.web?menuId=npe0000002743\">같은 기관 — 본인부담금 감경(2026.2.~2027.1. 적용 기준)<\/a>, <a href=\"https://www.nhis.or.kr/static/html/wbda/c/wbdac05.html\">국민건강보험공단 — 노인장기요양보험 재원조달·급여비용 안내<\/a>. 본인부담률의 법적 근거는 노인장기요양보험법 제40조이며, 인지지원등급이 복지용구(기타재가급여)를 이용할 수 있다는 점은 <a href=\"https://www.easylaw.go.kr/CSP/OnhunqueansInfoRetrieve.laf?onhunqnaAstSeq=97&amp;onhunqueSeq=6499\">찾기쉬운 생활법령정보 「장기요양등급별 이용 가능 급여」<\/a>(근거: 「장기요양급여 제공기준 및 급여비용 산정방법 등에 관한 고시」)에서 확인했습니다.<\/div>\n\n<div class=\"rel\"><b>🔗 함께 보면 좋은 글<\/b><a href=\"https://lifeinfo8975.blogspot.com/2026/06/blog-post_506.html\">▸ 노인장기요양보험 등급 신청 방법 본인부담금 총정리<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/2026_01082087244.html\">▸ 노인맞춤돌봄서비스 신청 방법 대상 서비스 내용 총정리 (2026 부모님 돌봄)<\/a><a href=\"https://lifeinfo8975.blogspot.com/2026/07/1-2-2026.html\">▸ 의료급여 1종 2종 차이 본인부담금 대상 신청 방법 총정리 (2026)<\/a><\/div>\n\n<div id=\"ymyl-disclaimer\" style=\"margin-top:22px;font-size:13px;color:#666;line-height:1.6\">본 글은 정보 제공용이며 의료·법률 자문이 아닙니다. 실제 급여 대상 품목·한도 잔액·본인부담률은 <b>수급자 개인의 장기요양인정조사 결과와 건강보험료 자료<\/b>에 따라 결정되며, 최종 판단은 국민건강보험공단이 합니다. 본문 §6의 제품 가격은 계산 방식을 설명하기 위한 가정값이므로 실제 청구액과 다릅니다. 신청 전 반드시 공단(☎1577-1000) 또는 복지용구사업소에서 본인 기준으로 확인하세요.<\/div>\n<div id=\"post-byline\" style=\"border-top:1px solid #e5e7eb;margin-top:28px;padding-top:12px;font-size:13px;color:#666;line-height:1.6;\">글쓴이 <b>이상곤<\/b> · 이 글의 품목표·한도·부담률은 <b>보건복지부 고시 원문과 공단 공식 페이지를 직접 열람<\/b>해 정리했으며, 본문에 출처와 기준일을 표기했습니다. 제도는 바뀔 수 있으니 신청 전 공식 페이지를 확인하세요. <a href=\"/p/blog-page_17.html\">정보 확인 방법·고지<\/a><\/div>\n<\/div>\n----------------------------------------------------------------\n▼ OSMU 확산용 핵심 3줄 요약 (네이버 블로그·쓰레드용)\n1. 장기요양 등급을 받으면 방문요양 월 한도와는 **별개로** 복지용구에 쓸 수 있는 연 160만 원 한도가 하나 더 생깁니다. 공단 안내도 월 한도액을 \"재가급여(복지용구 제외)\"라고 표기합니다. 전동침대·수동휠체어·욕창예방매트리스 등을 이 한도로 사거나 빌립니다.\n2. 가장 흔한 오해가 \"1월 1일이면 한도가 초기화된다\"인데 **사실이 아닙니다.** 고시 제3조는 적용기간을 '최초 장기요양인정 유효기간 개시일로부터 매 1년'으로 정합니다. 사람마다 갱신일이 다르고 남은 한도는 이월되지 않으니, 공단이 보내준 '복지용구 급여확인서'의 **'연한도액 적용구간'** 날짜를 먼저 확인하세요.\n3. 160만 원은 내 돈이 아니라 총 급여비용이고 실제 부담은 **15%(연 24만 원)**, 감경 대상이면 9%·6%, 의료급여 수급자는 0원입니다. 단 급여확인서에 없는 품목·사업소가 아닌 곳에서 산 물건·시설 입소 기간·사용가능햇수 내 재구입은 급여가 안 됩니다.\n"}]},"pace":{"date":"2026-07-30","count":1,"posts":[{"title":"고령운전자 운전면허 자진반납 지원금 신청 방법 대상 금액 총정리 (2026 지자체별)","published":"2026-07-30T04:05:14.000+09:00"}],"soft":1,"hard":2,"state":"warn","backlog":4,"backlog_codes":["F1-09","F1-10","D4-06","C3-05"],"backlog_max":5,"backlog_over":false,"lanes":{"info":{"label":"일일·정보성","n":1,"codes":["C3-05"]},"etc":{"label":"기타","n":3,"codes":["F1-09","F1-10","D4-06"]},"user":{"label":"사용자 추천","n":0,"codes":[]}},"error":"","checked_at":"2026-07-30T13:00:32"},"db":{"version":1,"updated":"2026-07-30","root":"lifeinfo","blog":"https://lifeinfo8975.blogspot.com/","taxonomy":[{"code":"A","name":"정부지원·복지","color":"#2BC4B0","subs":[{"code":"A1","name":"지원금·수당"},{"code":"A2","name":"생계·바우처 지원"},{"code":"A5","name":"근로·구직 지원"},{"code":"A3","name":"연금·노후"},{"code":"A4","name":"위기·재난 지원"}]},{"code":"B","name":"세금·금융","color":"#4D9DE0","subs":[{"code":"B1","name":"지방세"},{"code":"B4","name":"국세"},{"code":"B2","name":"금융·은행"},{"code":"B3","name":"연금자산"}]},{"code":"C","name":"건강·의료","color":"#E76F51","subs":[{"code":"C1","name":"건강보험 제도·환급"},{"code":"C2","name":"검진·접종"},{"code":"C3","name":"보험·요양"},{"code":"C4","name":"치과·수술 급여"}]},{"code":"D","name":"생활·행정","color":"#2EB67D","subs":[{"code":"D1","name":"증명·민원"},{"code":"D2",   // 🚦 오늘 발행량 배지 (2026-07-29) — 승인 누르기 '전에' 보이게 한다.
  //    2026-07-27 에 8편이 한꺼번에 나간 건, 사람이 재고만 보고 몰아서 승인했는데
  //    '오늘 몇 편째'를 아무도 안 세고 있었기 때문이다. 게이트(pace.check)는 발행을 막고,
  //    이 배지는 그 전에 눈으로 막는다.
  let paceHtml='';
  if(pace){
    const st=pace.state||'ok', n=pace.count||0, hard=pace.hard||2;
    const lab=st==='err'?'⚠️ 오늘 발행량을 못 셌습니다 — '+esc(pace.error||'')
      :st==='block'?'⛔ 오늘 '+n+'편 발행됨 — 오늘은 더 발행하지 마세요(3편 이상 금지)'
      :st==='warn'?'⚠️ 오늘 '+n+'편 발행됨 — 기본 페이스는 하루 1편입니다'
      :'✅ 오늘 '+n+'편 발행 — 하루 1편 기준 안';
    const bg=st==='block'?'#3a1218':st==='warn'?'#3a2f12':st==='err'?'#2a2030':'#0c3a2c';
    const bd=st==='block'?'#7a2230':st==='warn'?'#5a4a1a':st==='err'?'#4a3a5a':'#1f6b52';
    const fg=st==='block'?'#ff9aa6':st==='warn'?'#ffd166':st==='err'?'#c9b6e8':'#8ef0cf';
    const titles=(pace.posts||[]).map(p=>'<div style="opacity:.8;margin-top:2px">· '+esc(p.title||'')+'</div>').join('');
    const lanes=pace.lanes||{};
    const laneTxt=Object.keys(lanes).map(k=>{
      const L=lanes[k]; if(!L) return '';
      return '<span style="display:inline-block;margin-right:9px">'+esc(L.label||k)+' <b>'+(L.n||0)+'</b></span>';
    }).join('');
    const over=pace.backlog_over
      ?'<div style="margin-top:5px;color:#ffd166">📦 발행대기 재고 '+pace.backlog+'편 (상한 '+pace.backlog_max+' 초과) — 재고가 쌓이면 몰아치기 발행을 부릅니다. PREP 초안 생성이 잠긴 상태입니다.</div>'
      :'<div style="margin-top:5px;opacity:.75">📦 발행대기 재고 '+(pace.backlog||0)+'편 / 상한 '+(pace.backlog_max||5)+'</div>';
    const laneRow=laneTxt?'<div style="margin-top:4px;opacity:.8;font-size:11.5px">🛤 레인별: '+laneTxt+'<span style="opacity:.6">(자동 2 + 사용자 창구 1 · 루틴은 1회 1건)</span></div>':'';
    paceHtml='<div style="background:'+bg+';border:1px solid '+bd+';color:'+fg
      +';border-radius:8px;padding:8px 11px;margin:2px 0 9px;font-size:12px;line-height:1.5">'
      +'<b>'+lab+'</b>'+titles+over+laneRow+'</div>';
  }
  const qHtml=paceHtml+(qItems.length
    ?'<div class="cnt">발행 대기 '+qItems.length+'건 — 발행하면 카드가 자동으로 사라집니다(사람 승인 게이트)</div>'+qCards
    :'<div class="pcode none">발행 대기 없음 — PREP 루틴이 준비하면 여기 카드로 뜹니다</div>');
  document.getElementById('board').innerHTML=
   '<div class="hd"><div class="t"><h1>진행현황</h1><span class="date">'+esc(date)+'</span></div>'
   +'<span class="badge '+bcls+'">'+CHECK+esc(blab)+'</span></div>'
   +'<div class="sec">오늘 한 일</div>'+today
   +'<div class="metrics">'
   +'<div class="m"><div class="l">검사 통과</div><div class="v">'+pass+' <small>/ '+total+'</small></div></div>'
   +'<div class="m"><div class="l">블로그 글</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">평균 본문</div><div class="v">'+avg+' <small>자</small></div></div>'
   +'</div>'
   +'<div class="div"></div>'
   +'<div class="sec">📋 발행 대기 (오늘 발행할 글)<span class="auto">🤖 PREP 큐</span></div>'+qHtml
   +'<div class="div"></div>'
   +'<div class="sec">발행 진행 (글 1편 · '+STEPS.length+'단계, 확산 포함)<span class="auto">🤖 자동</span></div>'+pubHtml
   +'<div class="div"></div>'
   +'<div class="sec">📡 4채널 발행 현황 (구글·네이버·쓰레드·인스타)<span class="auto">🤖 DB 자동집계</span></div>'
   +'<div class="metrics">'
   +'<div class="m"><div class="l">구글(원본)</div><div class="v">'+count+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">네이버</div><div class="v">'+oNv+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">쓰레드</div><div class="v">'+oTh+' <small>편</small></div></div>'
   +'<div class="m"><div class="l">인스타</div><div class="v">'+oIn+' <small>편</small></div></div>'
   +'</div>'
   +'<div class="cnt">확산 커버리지 · 네이버 '+(count?Math.round(oNv/count*100):0)+'% · 쓰레드 '+(count?Math.round(oTh/count*100):0)+'% · 인스타 '+(count?Math.round(oIn/count*100):0)+'% · 교차링크 완료 '+omAll.length+'편</div>'
   +osmuLi
   +'<div class="div"></div>'
   +'<div class="sec">🤝 협업 — 세션별 역할·진행<span class="auto">git 자동분류</span></div>'+collabHtml
   +'<div class="sec">💡 시스템 조언<span class="auto">라이브 도출</span></div>'+adviceHtml
   +'<div class="div"></div>'
   +'<div class="sec">📋 미결 관리 — 4채널 매칭<span class="auto">G구글·N네이버·T쓰레드·I인스타</span></div>'+pendHtml
   +'<div class="sec">다음</div><div class="next">'+next+'</div>'
   +'<div class="upd" id="upd"></div>';
  tick();
}
// 시계·데이터 기준만 갱신(보드 전체 재렌더 없음 — 정적 베이크 데이터라 시계만 변함)
function tick(){
  const el=document.getElementById('upd'); if(!el)return;
  const b=(window.__DATA__||{}).baked_at;
  el.textContent=(b?'데이터 기준 '+b+' · ':'')+new Date().toLocaleTimeString('ko-KR');
}
// 👁 발행 대기 카드 본문 미리보기 — 초안 HTML을 격리 iframe(srcdoc)로 렌더(스타일 누수 차단, Blogger 미접촉)
function qpv(code){
  const items=((window.__DATA__||{}).queue||{}).items||[];
  const it=items.find(x=>x.code===code); if(!it||!it.body)return;
  document.getElementById('qpv-ttl').textContent=(it.code||'')+' · '+(it.title||'');
  document.getElementById('qpv-fr').srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank"><body style="margin:0;padding:16px;background:#fff">'+it.body+'</body>';
  document.getElementById('qpv-ov').classList.add('show');
}
function qpvClose(){document.getElementById('qpv-ov').classList.remove('show');document.getElementById('qpv-fr').srcdoc='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')qpvClose();});
// 코드 자동 반영: 자기 자신(progress.html)을 주기적으로 fetch→해시 비교, 바뀌면 1회 reload
const _hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
let _selfHash=null;
async function checkVersion(){
  try{
    const r=await fetch('progress.html?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;                                // 일시적 404/500에 해시 오염 → 불필요 reload 방지
    const t=await r.text();
    const h=_hash(t);
    if(_selfHash===null){_selfHash=h;return;}      // 첫 호출=기준선 저장
    if(h!==_selfHash) location.reload();            // 코드 변경 감지 → 자동 새로고침
  }catch(e){}
}
load(); checkVersion(); setInterval(tick,5000); setInterval(checkVersion,5000);
</script>
