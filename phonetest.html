<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>폰 칠 시험</title>
<style>
html,body{margin:0;background:#070b10;color:#d8e6f0;font:14px/1.45 sans-serif}
body{padding:10px 12px 40px}
h1{font-size:16px;margin:4px 0 6px}
.info{font-size:12px;color:#a3b6c4;margin:4px 0;word-break:break-all}
.note{background:#1a1500;border:1px solid #6a5a12;color:#ffe9a8;border-radius:6px;padding:6px 8px;font-size:13px;margin:8px 0}
.ref{display:flex;gap:6px;margin:8px 0}
.ref div{flex:1;padding:8px 4px;text-align:center;font-size:12px;border-radius:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{border:1px solid #1f3040;border-radius:8px;padding:6px;background:#0e1620}
.cell .t{font-weight:700;font-size:13px;margin-bottom:4px}
.cell .v{font-size:11px;color:#a3b6c4;margin-top:4px;word-break:break-all}
.box{height:56px;border-radius:6px;background:#121d29;color:#d8e6f0;display:flex;align-items:center;justify-content:center;font-weight:700}
svg{display:block;width:100%;height:64px}
</style>
</head>
<body>
<h1>폰 칠 시험 — 같은 어두운 칠 #121d29</h1>
<div class="info" id="env">환경 읽는 중…</div>
<div class="note">보는 법: 아래 칸이 모두 <b>어두운 남색</b>이어야 정상입니다. <b>어떤 칸이 연한 회색이면 그 구성을 폰 렌더러가 바꾸는 것</b>입니다. 맨 위 기준 견본 두 칸(어두운 값·밝은 값)과 비교하세요. 이 화면 전체를 캡처해 보내 주시면 됩니다.</div>
<div class="ref"><div style="background:#121d29;color:#d8e6f0;border:1px solid #1f3040">기준 어두움 #121d29</div><div style="background:#b4bdc8;color:#15222e">기준 밝음 #b4bdc8</div></div>
<div class="grid" id="g"></div>
<script>
(function(){
var cells=[
 ["① 일반 div","<div class='box' id='c1'>div 칠</div>","c1","backgroundColor"],
 ["② svg rect","<svg viewBox='0 0 100 64'><rect id='c2' x='0' y='0' width='100' height='64' rx='6' fill='#121d29'/><text x='50' y='38' text-anchor='middle' fill='#d8e6f0' font-size='14' font-weight='700'>rect 칠</text></svg>","c2","fill"],
 ["③ svg circle","<svg viewBox='0 0 100 64'><circle id='c3' cx='50' cy='32' r='28' fill='#121d29'/><text x='50' y='38' text-anchor='middle' fill='#d8e6f0' font-size='14' font-weight='700'>circle</text></svg>","c3","fill"],
 ["④ circle + opacity","<svg viewBox='0 0 100 64'><circle id='c4' cx='50' cy='32' r='28' fill='#121d29' opacity='.98'/><text x='50' y='38' text-anchor='middle' fill='#d8e6f0' font-size='14' font-weight='700'>opacity</text></svg>","c4","fill"],
 ["⑤ div + color-scheme:dark","<div class='box' id='c5' style='color-scheme:dark'>color-scheme</div>","c5","backgroundColor"],
 ["⑥ div + forced-color-adjust:none","<div class='box' id='c6' style='forced-color-adjust:none'>forced none</div>","c6","backgroundColor"],
 ["⑦ 대조: div 만(특수 속성 없음)","<div class='box' id='c7' style='color:#d8e6f0'>대조 div</div>","c7","backgroundColor"],
 ["⑧ div 위 밝은 글자","<div class='box' id='c8' style='color:#fff;font-size:18px'>밝은 글자 ABC 123</div>","c8","color"]
];
var g=document.getElementById("g"),i;
for(i=0;i<cells.length;i++){var c=cells[i],d=document.createElement("div");d.className="cell";d.innerHTML="<div class='t'>"+c[0]+"</div>"+c[1]+"<div class='v' id='v"+i+"'></div>";g.appendChild(d)}
function hex(c){var m=String(c).match(/[\d.]+/g);if(!m||m.length<3)return String(c);return "#"+m.slice(0,3).map(function(x){var n=Math.round(+x).toString(16);return n.length<2?"0"+n:n}).join("")}
function read(){
 for(var i=0;i<cells.length;i++){var e=document.getElementById(cells[i][2]);document.getElementById("v"+i).textContent="계산값 "+cells[i][3]+" = "+(e?hex(getComputedStyle(e)[cells[i][3]]):"-")+" (기대 "+(cells[i][3]==="color"?"#ffffff":"#121d29")+")"}
 var mq=function(q){try{return matchMedia(q).matches}catch(e){return "?"}};
 document.getElementById("env").textContent="UA "+navigator.userAgent.slice(0,80)+" · 시스템 다크 "+(mq("(prefers-color-scheme:dark)")?"예":"아니오")+" · DPR "+window.devicePixelRatio+" · 창 "+innerWidth+"x"+innerHeight+" · 앱창 "+(mq("(display-mode:standalone)")?"standalone":"브라우저")+" · "+new Date().toTimeString().slice(0,8);
}
read();setInterval(read,10000);
})();
</script>
</body>
</html>
