<style>

body.l2 .slot:nth-child(n+3){display:none}
body.l1 .grid{grid-template-columns:1fr;grid-template-rows:1fr}

  .grid{display:block}
  .slot{height:78vh;margin-bottom:8px}
  body.l2 .slot:nth-child(n+3),body.l1 .slot:nth-child(n+2){display:flex}
  body.l2 .slot:nth-child(n+3){display:none}
  body.l1 .slot:nth-child(n+2){display:none}

.sig .lamp,.sig .chip{cursor:pointer}
.dp{flex:0 0 auto;border-bottom:2px solid var(--acc);background:var(--card);padding:8px 12px;max-height:46vh;overflow:auto}
.dp[hidden]{display:none}
.ab{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.abw{background:var(--bg);color:var(--fg);border-radius:12px;max-width:780px;width:100%;max-height:88vh;overflow-y:auto;overflow-x:hidden;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.abh{font-size:17px;font-weight:800;margin:0 0 10px}
.ab[hidden]{display:none}
.abi{border-left:6px solid #dc2626;background:var(--bg);border-radius:6px;padding:8px 12px;margin-bottom:8px;font-size:15px;line-height:1.55}
.abi.b{border-left-color:#2563eb}.abi.y{border-left-color:#d97706}
.abt{font-weight:800;font-size:16px;margin-bottom:4px}.abi.r .abt{color:#dc2626}.abi.b .abt{color:#2563eb}.abi.y .abt{color:#d97706}

.abr b{flex:0 0 5.4em;color:var(--mut);font-weight:700}
.abr span{flex:1 1 auto;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.abm{color:var(--mut);margin:0 0 8px 4px}
.abb button{border:1px solid var(--bar);background:var(--bg);color:var(--fg);border-radius:6px;padding:5px 12px;margin-right:6px;cursor:pointer;font-size:13.5px}
.pd{margin:2px 0 6px 18px;padding:5px 10px;border-left:3px solid var(--bar);font-size:13px;line-height:1.5}
.pd b{display:inline-block;min-width:5.6em;color:var(--mut)}
.dph{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.dph button{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:12.5px}
.dph #dpClose{background:var(--bg);color:var(--fg);border-color:var(--bar)}
.dpm{font-size:12.5px;margin:2px 0 6px;padding:3px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--bar)}
.dpm.ok{border-color:#16a34a;color:#16a34a}.dpm.bad{border-color:#dc2626;color:#dc2626}.dpm.w{border-color:#d97706;color:#d97706}
.dg{font-weight:700;margin:8px 0 3px}
.it{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-top:1px dashed var(--bar)}
.it .t{flex:1;min-width:0}.it .s{color:var(--mut);font-size:11.5px;white-space:nowrap}
.it a{color:var(--acc);white-space:nowrap;font-size:12.5px}
.ac{font-size:12.5px;padding:0 0 3px;color:var(--mut)}.ac.none{color:#d97706}.ac.done b{color:#16a34a}.ac.doing b{color:#2563eb}.ac.reorder b{color:#9333ea}.ac.open b{color:#d97706}.ac .in{color:var(--fg)}
</style></head><body class="l4">

build();
document.querySelectorAll(".top button").forEach(function(b){

var sl=get(LKEY);if(sl&&/^l[124]$/.test(sl)){var btn=document.querySelector('.top button[data-l="'+sl+'"]');if(btn)btn.click();}

tick();setInterval(tick,1000);
/* ── 상황 신호등 + 알람 (2026-11-05 사장님 「상황 신호등으로 막힘·실패 등 오류 표시, 알람도 울려줘」) ──
   🔴 막힘·실패(관제 정체·게이트 문제·Aside 막힘·막힌 보드 항목·반영 어긋남)  🟡 주의(검증 안 됨·연료 부족·낡음)  🔵 사장님 몫(결재 대기)

var ALARM_KEY="chkmon_alarm_v1", SEEN_KEY="chkmon_seen_v1";
var alarmOn=(get(ALARM_KEY)==="1"), actx=null, lastBeep=0;

function jget(u){return fetch(u+"?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}

function collect(x){

  if(es){
    (es.incidents||[]).forEach(function(i){if(!i.kind){var w0=String(i.what||"");/* 11-11: 누가 풀지는 원천(enginestate)이 owner 로 박는다 — 화면은 문구로 짐작하지 않는다. owner 없는 옛 데이터만 예전대로 사장님 몫 */if(i.owner&&i.owner!=="사장님"){it.push({lv:i.p===1?"r":"y",k:"pipe:"+w0.slice(0,40),t:w0.slice(0,80),d:{what:w0.slice(0,160),why:"작업 단계 사건입니다 — 사장님 결정은 필요 없습니다",who:String(i.owner),next:"이부장이 확인·지시합니다 — 상황실(엔진)에서 근거를 볼 수 있습니다"}});return;}nokind++;it.push({lv:"b",k:"appr:"+w0.slice(0,40),t:(w0||"사장님 결재 대기").slice(0,80),d:{what:(w0||"사장님 결재 대기").slice(0,160),why:"사장님 승인·결정이 있어야 다음 단계로 갑니다",who:"사장님",next:"CP 결재함(전자결재)에서 승인 또는 보류"}});return;}var red=RED_KIND.test(i.kind||"");it.push({lv:red?"r":"y",k:"inc:"+i.kind+":"+(i.id||""),t:(KIND_LABEL[i.kind]||i.kind)+" "+String(i.id||"").slice(0,12),d:{what:(KIND_LABEL[i.kind]||i.kind)+" "+String(i.id||""),why:String(i.what||i.detail||i.note||i.text||"").replace(/\s+/g," ").slice(0,220)||"사건 상세 기록 없음 — 상황실에서 근거를 보세요",who:String(i.owner||"이부장"),next:"이부장이 확인·지시합니다 — 상황실(엔진)에서 근거를 볼 수 있습니다"}});});

    if(es.tower&&es.tower.lvl&&es.tower.lvl!=="ok")it.push({lv:es.tower.lvl==="red"?"r":"y",k:"tower:"+es.tower.lvl,t:"관제탑 감시 "+es.tower.lvl+" ("+es.tower.age_min+"분)"});
  }
  if(rf&&rf.pairs)rf.pairs.forEach(function(p){if(p.status==="bad")it.push({lv:"r",k:"rf:"+p.name,t:"반영 어긋남 · "+p.name});else if(p.status==="stale")it.push({lv:"y",k:"rf:"+p.name,t:"반영 낡음 · "+p.name});});
  if(ao&&ao.orders)Object.keys(ao.orders).forEach(function(n){var o=ao.orders[n];if(o.state==="blocked"){var a=ageMin(o.last_at);var sup=Object.keys(ao.orders).some(function(m){var q=ao.orders[m];return Number(m)>Number(n)&&q.state==="done"&&q.code===o.code&&q.kind===o.kind;});/* 11-10: 같은 글·같은 종류로 재등록해 끝난 지시가 있으면 막힘이 아니다 */if(a!==null&&a<=180&&!sup)it.push({lv:"r",k:"aso:"+n,t:"Aside 막힘 #"+n+" "+(o.code||""),d:{what:"Aside 작업 #"+n+" "+(o.code||"")+" 이(가) 막혔습니다",why:String(o.note||o.what||o.reason||"Aside 가 blocked 로 보고했습니다 — 사유는 보고 원문 참고").replace(/\s+/g," ").slice(0,220),who:"이부장(Aside 지시 담당)",next:"막힌 사유를 풀어 다시 지시하거나 같은 종류 다음 지시를 보류"}});}});
  /* 보드의 막힌 항목: 동결·끝난 보드는 뺀다. 점검 보드(fix·recheck·reflect·instacap)와 CP 가 「막힘」으로 판정한 지시서는 🔴, 그 밖(이부장 일일 보드 등)의 막힌 항목은 🟡 */
  if(bv&&bv.batches){var stm=bv.st||{},CHK=["fix1102","recheck1105","reflect1105","instacap1105"];Object.keys(bv.batches).forEach(function(b){var s=stm[b];if(s==="frozen"||s==="closed")return;((bv.batches[b]||{}).items||[]).forEach(function(i){if(i.state==="blocked")it.push({lv:(s==="block"||CHK.indexOf(b)>=0)?"r":"y",k:"blk:"+b+":"+i.code,t:"막힌 항목 "+b+"/"+i.code+(i.title?" · "+String(i.title).slice(0,40):"")+(i.note?" — 사유: "+String(i.note).replace(/\s+/g," ").slice(-70):""),d:{what:(i.title||i.code)+"  ("+b+" / "+i.code+")",why:String(i.note||"").replace(/\s+/g," ").trim()||"사유 기록 없음 — 지시서를 열어 확인하세요",who:String((bv.batches[b]||{}).owner||"담당 미지정"),next:"담당이 풀리는 조건을 확인해 지시서에 답하거나, 막혔는데 안 풀리면 이부장에게 보고"}});});});}
  if(ag&&ag.items){var y=new Date().getFullYear();ag.items.forEach(function(a){if(a.run!=="done"){var m=/^(\d\d)-(\d\d) (\d\d):(\d\d)$/.exec(a.started||"");if(m){var s=new Date(y,+m[1]-1,+m[2],+m[3],+m[4]);if((Date.now()-s)/60000>120)it.push({lv:"y",k:"ag:"+a.id,t:(a.run==="stale"?"에이전트 알림 없음 3시간+ (끝났는지 모름) · ":"에이전트 2시간 넘게 도는 중 · ")+String(a.purpose||"").slice(0,24)});}}});}
  if(am&&+am.waiting_count>0&&!nokind)it.push({lv:"b",k:"appr:"+am.waiting_count,t:"사장님 결재 대기 "+am.waiting_count+"건"});

}
function paint(it){
  var r=it.filter(function(i){return i.lv==="r";}),y=it.filter(function(i){return i.lv==="y";}),b=it.filter(function(i){return i.lv==="b";});

  l.textContent=r.length?("🔴 막힘·실패 "+r.length+"건"):(y.length?("🟡 주의 "+y.length+"건"):(b.length?"🔵 사장님 몫 있음":"🟢 정상"));

function alarmCheck(urgent){

  try{seen=JSON.parse(sessionStorage.getItem(SEEN_KEY)||"null");}catch(e){}

  try{sessionStorage.setItem(SEEN_KEY,JSON.stringify(cur));}catch(e){}
  var redNow=urgent.some(function(i){return i.lv==="r";});
  var again=redNow&&(Date.now()-lastBeep>600000);   /* 🔴 가 이어지면 10분마다 다시 */
  /* 🔴 11-09 19:13 사장님 「알림이 울렸는데 모달이 안떠네」: 탭은 셸의 iframe 이라 다른 탭을 보고 계시면 모달이 숨은 iframe 안에만 떴다.
     → ① 새 항목이 생기면 셸에 이 탭을 열라고 요청 ② 닫기 전까지(탭 리로드해도) 모달을 유지(pend 를 sessionStorage 에 둔다) */
  var pend=[];try{pend=JSON.parse(sessionStorage.getItem("chkmon_pend_v1")||"[]");}catch(e){}

  fresh.forEach(function(k){if(pend.indexOf(k)<0)pend.push(k);});
  try{sessionStorage.setItem("chkmon_pend_v1",JSON.stringify(pend));}catch(e){}
  if(pend.length){try{showBanner(urgent.filter(function(i){return pend.indexOf(i.k)>=0;}));}catch(e){}}
  if(fresh.length){try{if(window.parent!==window)parent.postMessage({chkmon:"open"},"*");}catch(e){}}
  if(alarmOn&&(fresh.length||again)){beep();
    try{if(window.Notification&&Notification.permission==="granted"&&(fresh.length)){var f=urgent.filter(function(i){return fresh.indexOf(i.k)>=0;})[0];var nt=new Notification("점검 모니터 — "+(f.lv==="r"?"막힘·실패":"사장님 몫"),{body:f.t+" (눌러서 상세 보기)"});nt.onclick=function(){try{window.focus();}catch(e){}try{parent.postMessage({chkmon:"open"},"*");}catch(e){}openDetail(true);nt.close();};}}catch(e){}}
}
function refreshSig(){Promise.all(["engine_state.json","reflect.json","aside_orders.json","approval_m.json","batch_view.json","agents.json","chkmon_actions.json"].map(jget)).then(function(x){ACT=(x[6]&&x[6].items)||{};CUR=stamp(collect(x));var urgent=paint(CUR);alarmCheck(urgent);if(urgent.length)reportNow(true);if(!dp.hidden)renderDetail();}).catch(function(){});}
/* ── 상세 내역 + 이부장 보고 (설계도 TO3, 2026-11-05 사장님 「알람 → 그 탭을 클릭하면 상세내역 → 이부장에게 알려 즉시·묶음 처리」) ──
   알림·신호등을 누르면 상세 패널이 열리고, 🔴·🔵 가 있으면 새 항목 묶음일 때 한 번 자동으로 이부장에게 보고한다(결재 서버 localhost:8011 /api/chkmon).
   🟡 만 있으면 자동 보고하지 않는다 — 「이부장에게 보고」 버튼으로 묶음 보고. github.io·서버 꺼짐이면 요지를 클립보드에 복사(폰 결재함과 같은 패턴). */
var ACT={},ST={done:"✅ 완료",doing:"🔄 진행중",reorder:"📮 재지시",open:"⏳ 미결"};
var REP_KEY="chkmon_rep_v2",FS_KEY="chkmon_first_v1",CUR=[],dp=document.getElementById("dp");
function p2(n){return ("0"+n).slice(-2);}
function lt(d){d=d||new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds());}
function hm(t){var d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes());}
function hrefOf(k){var p=String(k).split(":"),h=p[0];if(h==="rf")return "reflect.html";if(h==="blk")return {fix1102:"fix1102.html",recheck1105:"recheck1105.html",reflect1105:"reflect1105.html"}[p[1]]||"batch.html";if(h==="ag")return "fix1102.html";if(h==="appr")return "approval.html";return "engine.html";}
function stamp(it){var fs={};try{fs=JSON.parse(get(FS_KEY)||"{}");}catch(e){}var nf={},n=lt();it.forEach(function(i){i.since=fs[i.k]||n;nf[i.k]=i.since;i.href=hrefOf(i.k);});set(FS_KEY,JSON.stringify(nf));return it;}
function dHtml(i){var d=i.d;if(!d)return "";return '<div class="pd"><div><b>무엇이</b> '+esc(d.what)+'</div><div><b>왜</b> '+esc(d.why)+'</div><div><b>누가 풀어야</b> '+esc(d.who)+'</div><div><b>다음 행동</b> '+esc(d.next)+'</div></div>';}
function showBanner(L){var ab=document.getElementById("ab");if(!ab||!L.length)return;var h="";L.slice(0,8).forEach(function(i,n){var d=i.d||{what:i.t,why:"",who:"",next:"상세 보기에서 확인"};h+='<div class="abi '+i.lv+'"><div class="abt">'+(n+1)+'. '+(i.lv==="r"?"🔴 새 문제 — 막힘·실패":i.lv==="b"?"🔵 새 안건 — 사장님 몫":"🟡 새 주의")+'</div><div class="abr"><b>무엇이</b><span>'+esc(d.what)+'</span></div>'+(d.why?'<div class="abr"><b>왜</b><span>'+esc(d.why)+'</span></div>':"")+(d.who?'<div class="abr"><b>누가 풀어야</b><span>'+esc(d.who)+'</span></div>':"")+'<div class="abr"><b>다음 행동</b><span>'+esc(d.next||"")+'</span></div></div>';});if(L.length>8)h+='<div class="abm">외 '+(L.length-8)+'건 — 상세 보기에서 모두 확인</div>';h+='<div class="abb"><button id="abOpen">상세 보기·이부장에게 보고</button><button id="abClose">닫기 ✕</button></div>';ab.innerHTML='<div class="abw"><div class="abh">🚨 점검 모니터 — 새로 생긴 문제 '+L.length+'건</div>'+h+'</div>';ab.hidden=false;function bye(){ab.hidden=true;try{sessionStorage.removeItem("chkmon_pend_v1");}catch(e){}}ab.onclick=function(e){if(e.target===ab)bye();};document.getElementById("abOpen").onclick=function(){bye();openDetail(true);};document.getElementById("abClose").onclick=bye;}
document.addEventListener("keydown",function(e){if(e.key==="Escape"){var a=document.getElementById("ab");if(a){a.hidden=true;try{sessionStorage.removeItem("chkmon_pend_v1");}catch(x){}}}});
function actHtml(i){var a=ACT[i.k];if(!a||!ST[a.state])return '<div class="ac none">　⏳ 조치 기록 없음 — 이부장 접수 전</div>';return '<div class="ac '+esc(a.state)+'">　<b>'+ST[a.state]+'</b> '+esc(a.note||"")+(a.insight?' <span class="in">💡 '+esc(a.insight)+'</span>':"")+' <span class="s">'+esc(String(a.at||"").slice(5,16))+'</span></div>';}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function msg(m,c){var e=document.getElementById("dpMsg");if(e){e.textContent=m;e.className="dpm "+(c||"");}}
function renderDetail(){
  var cm=document.getElementById("dpMsg"),keepMsg=cm?cm.textContent:"",keepCls=cm?cm.className:"dpm";
  var G=[["r","🔴 막힘·실패 — 즉시 처리"],["b","🔵 사장님 몫 — 즉시 처리"],["y","🟡 주의 — 묶음 처리"]];
  var h='<div class="dph"><b>📋 상세 내역</b><span style="color:var(--mut)">'+CUR.length+'건 · 항목을 누르면 칸 1에 그 화면이 열립니다</span><button id="dpRep">📨 이부장에게 보고</button><button id="dpClose">닫기 ✕</button></div><div id="dpMsg" class="'+esc(keepCls)+'">'+esc(keepMsg)+'</div>';
  G.forEach(function(g){var L=CUR.filter(function(i){return i.lv===g[0];});if(!L.length)return;h+='<div class="dg">'+g[1]+' ('+L.length+')</div>';L.forEach(function(i){h+='<div class="it"><span class="t">'+esc(i.t)+'</span><span class="s">처음 '+esc(String(i.since).slice(5,16))+'</span><a href="#" data-h="'+esc(i.href)+'">화면 보기</a></div>'+dHtml(i)+actHtml(i);});});
  if(!CUR.length)h+='<div class="dg">🟢 지금 막힘·주의 항목이 없습니다</div>';
  dp.innerHTML=h;
  document.getElementById("dpClose").onclick=function(){dp.hidden=true;};
  document.getElementById("dpRep").onclick=function(){reportNow(false);};
  dp.querySelectorAll("a[data-h]").forEach(function(a){a.onclick=function(e){e.preventDefault();var f=a.dataset.h,ix=-1;SRC.forEach(function(s,j){if(s[0]===f)ix=j;});if(ix>=0){slots[0]=ix;set(KEY,JSON.stringify(slots));build();}else{window.open(f,"_blank");}};});
}
function openDetail(auto){dp.hidden=false;renderDetail();if(auto)reportNow(true);}
function copyText(t){try{if(navigator.clipboard)navigator.clipboard.writeText(t);}catch(e){}}
function plainReport(items){var n=function(l){return items.filter(function(i){return i.lv===l;}).length;};return "🙋 이부장 요청: [점검모니터] 🔴"+n("r")+" 🔵"+n("b")+" 🟡"+n("y")+" — "+items.map(function(i){return (i.lv==="r"?"🔴":i.lv==="b"?"🔵":"🟡")+i.t;}).join("; ").slice(0,600);}
function reportNow(auto){
  /* 자동 보고(auto) = 🔴·🔵 중 「최근 6시간 안에 보고 안 한 새 키」가 있을 때만, 클립보드는 건드리지 않고, 실패하면 5분 쉰다.
     버튼(auto=false) = 항상 보내고(force) 실패하면 요지를 복사한다. 서버도 같은 6시간 창으로 한 번 더 거른다(브라우저가 여럿이어도 1회). */
  var items=CUR.slice();
  if(!items.length){if(!auto)msg("보고할 항목이 없습니다 🟢");return;}
  var urg=items.filter(function(i){return i.lv!=="y";}),seen={},now=Date.now();
  try{seen=JSON.parse(get(REP_KEY)||"{}")||{};}catch(e){seen={};}
  var fresh=urg.filter(function(i){return !(seen[i.k]&&now-seen[i.k]<21600000);});
  if(auto){
    if(!urg.length){msg("🟡 주의뿐이라 자동 보고는 하지 않았습니다 — 묶음으로 보내려면 「이부장에게 보고」를 누르세요","w");return;}
    if(!fresh.length){msg("✅ 새 🔴·🔵 없음 — 이미 보고된 항목입니다","ok");return;}
    if(now-(+get(REP_KEY+"_fail")||0)<300000)return;
  }
  var local=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  if(!local){if(auto)return;copyText(plainReport(items));msg("이 주소(github.io)에서는 서버로 보낼 수 없어 요지를 복사했습니다 — 이부장 창에 붙여넣으세요","w");return;}
  function fail(why){set(REP_KEY+"_fail",String(Date.now()));if(auto){msg("❌ 자동 보고 실패("+why+") — 5분 뒤 다시 시도합니다. 급하면 「이부장에게 보고」 버튼","bad");}else{copyText(plainReport(items));msg("❌ 보고 실패("+why+") — 요지를 복사했습니다. 이부장 창에 붙여넣으세요","bad");}}
  if(!auto)msg("보고 중…");
  fetch("http://localhost:8011/api/chkmon",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({force:!auto,items:items.map(function(i){return {lv:i.lv,k:i.k,t:i.t,since:i.since};})})})
   .then(function(r){return r.json();}).then(function(j){
     if(j&&j.ok){urg.forEach(function(i){seen[i.k]=now;});set(REP_KEY,JSON.stringify(seen));msg(j.dup?"✅ 같은 보고가 이미 접수돼 있습니다":"✅ 이부장에게 보고했습니다 ("+hm(now)+") — 🔴·🔵 즉시 · 🟡 묶음으로 처리됩니다","ok");}
     else{fail((j&&j.error)||"서버 거부");}
   }).catch(function(){fail("결재 서버(8011)에 닿지 않음");});
}
var ab=document.getElementById("alarmBtn");
function paintBtn(){ab.textContent=alarmOn?"🔔 알람 켜짐 (끄려면 누르기)":"🔕 알람 꺼짐 — 눌러서 켜기";ab.classList.toggle("on",alarmOn);}
ab.onclick=function(){alarmOn=!alarmOn;set(ALARM_KEY,alarmOn?"1":"0");paintBtn();if(alarmOn){beep();try{if(window.Notification&&Notification.permission==="default")Notification.requestPermission();}catch(e){}}};
paintBtn();refreshSig();setInterval(refreshSig,20000);
/* 엔진 상황실·흐름도·결재함·보고는 자체 갱신이 없거나 달라서 5분마다 칸을 새로 받는다(체크리스트 화면은 자체 30초 갱신) */
setInterval(function(){document.querySelectorAll(".slot").forEach(function(s){var sel=s.querySelector("select");var f=s.querySelector("iframe");var i=+sel.value;if(/^(engine|engine_flow|approval|reports)\.html$/.test(SRC[i][0]))f.src=url(i);});},300000);
