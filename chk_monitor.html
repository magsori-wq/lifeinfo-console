<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>점검 모니터</title>
<style>
:root{--bg:#fff;--fg:#222;--mut:#666;--bar:#e5e7eb;--card:#f8fafc;--acc:#2563eb}
@media (prefers-color-scheme: dark){:root{--bg:#111;--fg:#eee;--mut:#aaa;--bar:#333;--card:#1b1f27;--acc:#60a5fa}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Malgun Gothic",sans-serif;font-size:13.5px;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--bar);background:var(--card)}
.top b{font-size:14px;margin-right:6px}
.top button{border:1px solid var(--bar);background:var(--bg);color:var(--fg);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12.5px}
.top button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.top .m{color:var(--mut);font-size:12px;margin-left:auto}
.sig{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--bar);font-size:12.5px}
.sig .lamp{font-weight:700;border-radius:6px;padding:3px 10px;color:#fff;background:#16a34a}
.sig .lamp.y{background:#d97706}.sig .lamp.r{background:#dc2626;animation:bl 1s ease-in-out infinite}.sig .lamp.b{background:#2563eb}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.45}}
.sig .chip{border:1px solid var(--bar);border-radius:999px;padding:2px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sig .chip.r{border-color:#dc2626;color:#dc2626;font-weight:700}.sig .chip.y{border-color:#d97706;color:#d97706}.sig .chip.b{border-color:#2563eb;color:#2563eb}
.sig .upd{color:var(--mut);margin-left:auto;font-size:11.5px}
.grid{flex:1;min-height:0;display:grid;gap:6px;padding:6px;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
body.l2 .grid{grid-template-rows:1fr}
body.l2 .slot:nth-child(n+3){display:none}
body.l1 .grid{grid-template-columns:1fr;grid-template-rows:1fr}
body.l1 .slot:nth-child(n+2){display:none}
.slot{display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid var(--bar);border-radius:8px;overflow:hidden;background:var(--bg)}
.sh{display:flex;gap:6px;align-items:center;padding:4px 8px;background:var(--card);border-bottom:1px solid var(--bar);font-size:12.5px}
.sh select{flex:1;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--bar);border-radius:5px;padding:2px 4px;font-size:12.5px}
.sh a{color:var(--acc);text-decoration:none;white-space:nowrap}
.slot iframe{flex:1;min-height:0;width:100%;border:0;background:var(--bg)}
@media (max-width:760px){
  body{height:auto;display:block}
  .grid{display:block}
  .slot{height:78vh;margin-bottom:8px}
  body.l2 .slot:nth-child(n+3),body.l1 .slot:nth-child(n+2){display:flex}
  body.l2 .slot:nth-child(n+3){display:none}
  body.l1 .slot:nth-child(n+2){display:none}
}
.sig .lamp,.sig .chip{cursor:pointer}
.dp{flex:0 0 auto;border-bottom:2px solid var(--acc);background:var(--card);padding:8px 12px;max-height:46vh;overflow:auto}
.dp[hidden]{display:none}
.dph{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.dph button{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:12.5px}
.dph #dpClose{background:var(--bg);color:var(--fg);border-color:var(--bar)}
.dpm{font-size:12.5px;margin:2px 0 6px;padding:3px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--bar)}
.dpm.ok{border-color:#16a34a;color:#16a34a}.dpm.bad{border-color:#dc2626;color:#dc2626}.dpm.w{border-color:#d97706;color:#d97706}
.dg{font-weight:700;margin:8px 0 3px}
.it{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-top:1px dashed var(--bar)}
.it .t{flex:1;min-width:0}.it .s{color:var(--mut);font-size:11.5px;white-space:nowrap}
.it a{color:var(--acc);white-space:nowrap;font-size:12.5px}
</style></head><body class="l4">
<div class="top">
  <b>🖥️ 점검 모니터</b>
  <button data-l="l4" class="on">4분할</button>
  <button data-l="l2">2분할</button>
  <button data-l="l1">1칸</button>
  <button id="alarmBtn" title="막힘·실패가 새로 생기면 소리와 알림으로 알립니다(브라우저 정책상 한 번 눌러야 켜집니다)">🔕 알람 꺼짐 — 눌러서 켜기</button>
  <span class="m">각 칸은 스스로 30초마다 새로 고침 · 칸 위 목록에서 다른 화면으로 바꿀 수 있음 · <span id="clock">—</span></span>
</div>
<div class="sig" id="sig"><span class="lamp">신호 확인 중…</span></div>
<div class="dp" id="dp" hidden></div>
<div class="grid" id="grid"></div>
<script>
var SRC=[
 ["fix1102.html","✅ 전체 점검 체크리스트 (fix1102)"],
 ["recheck1105.html","🔁 재점검 체크리스트 (recheck1105)"],
 ["reflect1105.html","🧭 반영 감사 체크리스트·작업 진행"],
 ["reflect.html","🚦 반영 신호등"],
 ["engine.html","🛰️ 엔진 상황실"],
 ["engine_flow.html","🗺️ 엔진 설계도 흐름도"],
 ["approval.html","📋 전자결재함"],
 ["reports.html","📢 보고"]
];
var DEFAULT=[0,1,2,3];
var KEY="chkmon_slots_v1", LKEY="chkmon_layout_v1";
function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var saved=null;try{saved=JSON.parse(get(KEY)||"null");}catch(e){}
var slots=(saved&&saved.length===4)?saved:DEFAULT.slice();
var grid=document.getElementById("grid");
function url(i){return SRC[i][0]+"?t="+Date.now();}
function build(){
  grid.innerHTML="";
  slots.forEach(function(si,n){
    var d=document.createElement("div");d.className="slot";
    var h='<div class="sh"><select data-n="'+n+'">';
    SRC.forEach(function(s,i){h+='<option value="'+i+'"'+(i===si?' selected':'')+'>'+s[1]+'</option>';});
    h+='</select><a target="_blank" rel="noopener" href="'+SRC[si][0]+'">새 탭 ↗</a></div><iframe></iframe>';
    d.innerHTML=h;
    d.querySelector("iframe").src=url(si);
    d.querySelector("select").onchange=function(e){slots[n]=+e.target.value;set(KEY,JSON.stringify(slots));build();};
    grid.appendChild(d);
  });
}
build();
document.querySelectorAll(".top button").forEach(function(b){
  b.onclick=function(){
    document.body.className=b.dataset.l;
    document.querySelectorAll(".top button").forEach(function(x){x.classList.toggle("on",x===b);});
    set(LKEY,b.dataset.l);
  };
});
var sl=get(LKEY);if(sl&&/^l[124]$/.test(sl)){var btn=document.querySelector('.top button[data-l="'+sl+'"]');if(btn)btn.click();}
function tick(){var d=new Date();document.getElementById("clock").textContent=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2);}
tick();setInterval(tick,1000);
/* ── 상황 신호등 + 알람 (2026-11-05 사장님 「상황 신호등으로 막힘·실패 등 오류 표시, 알람도 울려줘」) ──
   🔴 막힘·실패(관제 정체·게이트 문제·Aside 막힘·막힌 보드 항목·반영 어긋남)  🟡 주의(검증 안 됨·연료 부족·낡음)  🔵 사장님 몫(결재 대기)
   원천 = 상황실이 쓰는 같은 JSON(engine_state·reflect·aside_orders·approval_m·batch_view·agents) — 새 판정 로직을 만들지 않고 모아서 보인다. */
var ALARM_KEY="chkmon_alarm_v1", SEEN_KEY="chkmon_seen_v1";
var alarmOn=(get(ALARM_KEY)==="1"), actx=null, lastBeep=0;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var t=actx.currentTime;[880,660,880,660].forEach(function(f,i){var o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=f;g.gain.value=0.16;o.connect(g);g.connect(actx.destination);o.start(t+i*0.26);o.stop(t+i*0.26+0.2);});lastBeep=Date.now();}catch(e){}}
function jget(u){return fetch(u+"?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}
function ageMin(s){var t=Date.parse(String(s||"").replace(" ","T"));return isNaN(t)?null:(Date.now()-t)/60000;}
var RED_KIND=/stall|fail|problem|block|drift|detect/;
var KIND_LABEL={unverified_code:"코드 검증 안 됨",fuel_low:"연료 부족(재고 0)",pubdates_stale:"발행일 낡음",idaeri_stall:"이대리 요청 정체",stall_detect_fail:"정체 감지 실패",gate_problem:"게이트 문제",carrier_stall:"전달 정체",tower_confirm:"관제탑 확인 대기",confirm_backlog:"확인 적체",draft_unqueued:"초안 큐 미적재"};
function collect(x){
  var it=[],es=x[0],rf=x[1],ao=x[2],am=x[3],bv=x[4],ag=x[5],nokind=0;   /* kind 없는 사건 = 사장님 결재 대기(상황실 p=1) — 🔵 로 제목째 보인다 */
  if(es){
    (es.incidents||[]).forEach(function(i){if(!i.kind){nokind++;it.push({lv:"b",k:"appr:"+String(i.what||"").slice(0,40),t:String(i.what||"사장님 결재 대기").slice(0,80)});return;}var red=RED_KIND.test(i.kind||"");it.push({lv:red?"r":"y",k:"inc:"+i.kind+":"+(i.id||""),t:(KIND_LABEL[i.kind]||i.kind)+" "+String(i.id||"").slice(0,12)});});
    if(es.aside&&es.aside.lvl&&es.aside.lvl!=="ok")it.push({lv:es.aside.lvl==="red"?"r":"y",k:"aside:"+es.aside.lvl,t:"Aside "+(es.aside.state||"")});
    if(es.tower&&es.tower.lvl&&es.tower.lvl!=="ok")it.push({lv:es.tower.lvl==="red"?"r":"y",k:"tower:"+es.tower.lvl,t:"관제탑 감시 "+es.tower.lvl+" ("+es.tower.age_min+"분)"});
  }
  if(rf&&rf.pairs)rf.pairs.forEach(function(p){if(p.status==="bad")it.push({lv:"r",k:"rf:"+p.name,t:"반영 어긋남 · "+p.name});else if(p.status==="stale")it.push({lv:"y",k:"rf:"+p.name,t:"반영 낡음 · "+p.name});});
  if(ao&&ao.orders)Object.keys(ao.orders).forEach(function(n){var o=ao.orders[n];if(o.state==="blocked"){var a=ageMin(o.last_at);if(a!==null&&a<=180)it.push({lv:"r",k:"aso:"+n,t:"Aside 막힘 #"+n+" "+(o.code||"")});}});
  /* 보드의 막힌 항목: 동결·끝난 보드는 뺀다. 점검 보드(fix·recheck·reflect·instacap)와 CP 가 「막힘」으로 판정한 지시서는 🔴, 그 밖(이부장 일일 보드 등)의 막힌 항목은 🟡 */
  if(bv&&bv.batches){var stm=bv.st||{},CHK=["fix1102","recheck1105","reflect1105","instacap1105"];Object.keys(bv.batches).forEach(function(b){var s=stm[b];if(s==="frozen"||s==="closed")return;((bv.batches[b]||{}).items||[]).forEach(function(i){if(i.state==="blocked")it.push({lv:(s==="block"||CHK.indexOf(b)>=0)?"r":"y",k:"blk:"+b+":"+i.code,t:"막힌 항목 "+b+"/"+i.code+(i.title?" · "+String(i.title).slice(0,40):"")+(i.note?" — 사유: "+String(i.note).replace(/\s+/g," ").slice(-70):"")});});});}
  if(ag&&ag.items){var y=new Date().getFullYear();ag.items.forEach(function(a){if(a.run!=="done"){var m=/^(\d\d)-(\d\d) (\d\d):(\d\d)$/.exec(a.started||"");if(m){var s=new Date(y,+m[1]-1,+m[2],+m[3],+m[4]);if((Date.now()-s)/60000>120)it.push({lv:"y",k:"ag:"+a.id,t:(a.run==="stale"?"에이전트 알림 없음 3시간+ (끝났는지 모름) · ":"에이전트 2시간 넘게 도는 중 · ")+String(a.purpose||"").slice(0,24)});}}});}
  if(am&&+am.waiting_count>0&&!nokind)it.push({lv:"b",k:"appr:"+am.waiting_count,t:"사장님 결재 대기 "+am.waiting_count+"건"});
  return it;
}
function paint(it){
  var r=it.filter(function(i){return i.lv==="r";}),y=it.filter(function(i){return i.lv==="y";}),b=it.filter(function(i){return i.lv==="b";});
  var box=document.getElementById("sig");box.innerHTML="";
  var l=document.createElement("span");l.className="lamp "+(r.length?"r":(y.length?"y":(b.length?"b":"")));
  l.textContent=r.length?("🔴 막힘·실패 "+r.length+"건"):(y.length?("🟡 주의 "+y.length+"건"):(b.length?"🔵 사장님 몫 있음":"🟢 정상"));
  l.onclick=function(){openDetail(true);};l.title="눌러서 상세 내역 보기·이부장에게 보고";
  box.appendChild(l);
  it.sort(function(a,c){return "ryb".indexOf(a.lv)-"ryb".indexOf(c.lv);}).slice(0,14).forEach(function(i){var c=document.createElement("span");c.className="chip "+i.lv;c.textContent=(i.lv==="r"?"🔴 ":i.lv==="y"?"🟡 ":"🔵 ")+i.t;c.title=i.t;c.onclick=function(){openDetail(true);};box.appendChild(c);});
  if(it.length>14){var m=document.createElement("span");m.className="chip";m.textContent="외 "+(it.length-14)+"건";box.appendChild(m);}
  var u=document.createElement("span");u.className="upd";u.textContent="신호 갱신 "+new Date().toTimeString().slice(0,8);box.appendChild(u);
  document.title=(r.length?"🔴"+r.length+" ":"")+"점검 모니터";
  return r.concat(b);
}
function alarmCheck(urgent){
  var cur=urgent.map(function(i){return i.k;}),seen=null;
  try{seen=JSON.parse(sessionStorage.getItem(SEEN_KEY)||"null");}catch(e){}
  var fresh=seen===null?cur:cur.filter(function(k){return seen.indexOf(k)<0;});
  try{sessionStorage.setItem(SEEN_KEY,JSON.stringify(cur));}catch(e){}
  var redNow=urgent.some(function(i){return i.lv==="r";});
  var again=redNow&&(Date.now()-lastBeep>600000);   /* 🔴 가 이어지면 10분마다 다시 */
  if(alarmOn&&(fresh.length||again)){beep();
    try{if(window.Notification&&Notification.permission==="granted"&&(fresh.length)){var f=urgent.filter(function(i){return fresh.indexOf(i.k)>=0;})[0];var nt=new Notification("점검 모니터 — "+(f.lv==="r"?"막힘·실패":"사장님 몫"),{body:f.t+" (눌러서 상세 보기)"});nt.onclick=function(){try{window.focus();}catch(e){}try{parent.postMessage({chkmon:"open"},"*");}catch(e){}openDetail(true);nt.close();};}}catch(e){}}
}
function refreshSig(){Promise.all(["engine_state.json","reflect.json","aside_orders.json","approval_m.json","batch_view.json","agents.json"].map(jget)).then(function(x){CUR=stamp(collect(x));var urgent=paint(CUR);alarmCheck(urgent);if(urgent.length)reportNow(true);if(!dp.hidden)renderDetail();}).catch(function(){});}
/* ── 상세 내역 + 이부장 보고 (설계도 TO3, 2026-11-05 사장님 「알람 → 그 탭을 클릭하면 상세내역 → 이부장에게 알려 즉시·묶음 처리」) ──
   알림·신호등을 누르면 상세 패널이 열리고, 🔴·🔵 가 있으면 새 항목 묶음일 때 한 번 자동으로 이부장에게 보고한다(결재 서버 localhost:8011 /api/chkmon).
   🟡 만 있으면 자동 보고하지 않는다 — 「이부장에게 보고」 버튼으로 묶음 보고. github.io·서버 꺼짐이면 요지를 클립보드에 복사(폰 결재함과 같은 패턴). */
var REP_KEY="chkmon_rep_v1",FS_KEY="chkmon_first_v1",CUR=[],dp=document.getElementById("dp");
function p2(n){return ("0"+n).slice(-2);}
function lt(d){d=d||new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds());}
function hm(t){var d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes());}
function hrefOf(k){var p=String(k).split(":"),h=p[0];if(h==="rf")return "reflect.html";if(h==="blk")return {fix1102:"fix1102.html",recheck1105:"recheck1105.html",reflect1105:"reflect1105.html"}[p[1]]||"batch.html";if(h==="ag")return "fix1102.html";if(h==="appr")return "approval.html";return "engine.html";}
function stamp(it){var fs={};try{fs=JSON.parse(get(FS_KEY)||"{}");}catch(e){}var nf={},n=lt();it.forEach(function(i){i.since=fs[i.k]||n;nf[i.k]=i.since;i.href=hrefOf(i.k);});set(FS_KEY,JSON.stringify(nf));return it;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function msg(m,c){var e=document.getElementById("dpMsg");if(e){e.textContent=m;e.className="dpm "+(c||"");}}
function renderDetail(){
  var cm=document.getElementById("dpMsg"),keepMsg=cm?cm.textContent:"",keepCls=cm?cm.className:"dpm";
  var G=[["r","🔴 막힘·실패 — 즉시 처리"],["b","🔵 사장님 몫 — 즉시 처리"],["y","🟡 주의 — 묶음 처리"]];
  var h='<div class="dph"><b>📋 상세 내역</b><span style="color:var(--mut)">'+CUR.length+'건 · 항목을 누르면 칸 1에 그 화면이 열립니다</span><button id="dpRep">📨 이부장에게 보고</button><button id="dpClose">닫기 ✕</button></div><div id="dpMsg" class="'+esc(keepCls)+'">'+esc(keepMsg)+'</div>';
  G.forEach(function(g){var L=CUR.filter(function(i){return i.lv===g[0];});if(!L.length)return;h+='<div class="dg">'+g[1]+' ('+L.length+')</div>';L.forEach(function(i){h+='<div class="it"><span class="t">'+esc(i.t)+'</span><span class="s">처음 '+esc(String(i.since).slice(5,16))+'</span><a href="#" data-h="'+esc(i.href)+'">화면 보기</a></div>';});});
  if(!CUR.length)h+='<div class="dg">🟢 지금 막힘·주의 항목이 없습니다</div>';
  dp.innerHTML=h;
  document.getElementById("dpClose").onclick=function(){dp.hidden=true;};
  document.getElementById("dpRep").onclick=function(){reportNow(false);};
  dp.querySelectorAll("a[data-h]").forEach(function(a){a.onclick=function(e){e.preventDefault();var f=a.dataset.h,ix=-1;SRC.forEach(function(s,j){if(s[0]===f)ix=j;});if(ix>=0){slots[0]=ix;set(KEY,JSON.stringify(slots));build();}else{window.open(f,"_blank");}};});
}
function openDetail(auto){dp.hidden=false;renderDetail();if(auto)reportNow(true);}
function copyText(t){try{if(navigator.clipboard)navigator.clipboard.writeText(t);}catch(e){}}
function plainReport(items){var n=function(l){return items.filter(function(i){return i.lv===l;}).length;};return "🙋 이부장 요청: [점검모니터] 🔴"+n("r")+" 🔵"+n("b")+" 🟡"+n("y")+" — "+items.map(function(i){return (i.lv==="r"?"🔴":i.lv==="b"?"🔵":"🟡")+i.t;}).join("; ").slice(0,600);}
function reportNow(auto){
  var items=CUR.slice();
  if(!items.length){msg("보고할 항목이 없습니다 🟢");return;}
  var ids=items.map(function(i){return i.k;}).sort().join("|"),uids=items.filter(function(i){return i.lv!=="y";}).map(function(i){return i.k;}).sort().join("|"),last=null;try{last=JSON.parse(get(REP_KEY)||"null");}catch(e){}
  if(auto){
    if(!items.some(function(i){return i.lv!=="y";})){msg("🟡 주의뿐이라 자동 보고는 하지 않았습니다 — 묶음으로 보내려면 「이부장에게 보고」를 누르세요","w");return;}
    if(last&&last.uids===uids){msg("✅ 이미 보고됨 "+hm(last.t)+" — 같은 항목이라 다시 보내지 않았습니다","ok");return;}
  }
  if(!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){copyText(plainReport(items));msg("이 주소(github.io)에서는 서버로 보낼 수 없어 요지를 복사했습니다 — 이부장 창에 붙여넣으세요","w");return;}
  msg("보고 중…");
  fetch("http://localhost:8011/api/chkmon",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items:items.map(function(i){return {lv:i.lv,k:i.k,t:i.t,since:i.since};})})})
   .then(function(r){return r.json();}).then(function(j){
     if(j&&j.ok){set(REP_KEY,JSON.stringify({ids:ids,uids:uids,t:Date.now()}));msg(j.dup?"✅ 같은 보고가 방금 이미 접수돼 있습니다":"✅ 이부장에게 보고했습니다 ("+hm(Date.now())+") — 🔴·🔵 즉시 · 🟡 묶음으로 처리됩니다","ok");}
     else{copyText(plainReport(items));msg("❌ 보고 실패("+((j&&j.error)||"")+") — 요지를 복사했습니다. 이부장 창에 붙여넣으세요","bad");}
   }).catch(function(){copyText(plainReport(items));msg("❌ 결재 서버(8011)에 닿지 않아 요지를 복사했습니다 — 이부장 창에 붙여넣으세요","bad");});
}
var ab=document.getElementById("alarmBtn");

ab.onclick=function(){alarmOn=!alarmOn;set(ALARM_KEY,alarmOn?"1":"0");paintBtn();if(alarmOn){beep();try{if(window.Notification&&Notification.permission==="default")Notification.requestPermission();}catch(e){}}};
paintBtn();refreshSig();setInterval(refreshSig,20000);
